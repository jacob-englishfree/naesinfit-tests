const P_GW=`The economic benefit of culturtainment makes it attractive to politicians and policy makers alike. A potential increase in inbound visitor numbers coupled with their demand for related goods and services (travel, accommodation, retail) is an incentive for those within governments and authorities to work with cultural groups in order to develop celebrations and commemorations into larger and more high-profile events. However, such commercialization risks culturtainment becoming homogeneous and losing its original 'message' that could lead to a dilution of audiences. This could also lead to smaller non-commercial independent events being set up that would only serve to divide audiences further. This is something that planners and stakeholders will need to balance against potential financial gain. Changing political, social and religious landscapes will lead to the emergence of new cultures, and with them new culturtainment experiences. Overall this is a healthy growth sector of the entertainment industry, but one that by its very nature is delicate in the face of exploitation.`;

const P_EX01=`You've probably heard that it takes about ten thousand hours of practice to become an expert in anything — a musical instrument, a sport, chess, cooking, or a foreign language. The research by K. Anders Ericsson on this topic has been written about many times, and it was made even more famous when Malcolm Gladwell described it in his bestselling book Outliers. However, recently, a cohort of researchers reexamined the studies and research behind the 10K figure and said, quite dramatically, that the ten-thousand-hour rule was utter nonsense. Specifically, there is nothing particularly special about ten thousand hours, and while practice is clearly important to boost performance, other factors may play an even more important role. What are those other factors that get us to expert levels of performance? Pure innate talent? Intelligence? Luck of the draw? Perseverance? Hard work? Yes, it's all of that… and more. Age, experience, and environment all play a role. In other words, there's no one certain factor that can predict or ensure mastery or optimal performance of anything.`;

const P_EX02=`In the old Soviet Union, a famous U.S. beverage company wanted to set up a bottling plant and distribution network. The prevailing ideology in the old Soviet Union at the time stressed the importance of the group over the individual and the need to develop industrial capacity at the expense of consumer goods. Soft drinks hardly seemed to fit the country's ideological priorities. Indeed, one government official dismissed the product as a "useless drink." Eventually, the two sides struck a deal, but not on the basis that the drink would quench the local population's thirst. Instead, the U.S. negotiators justified the project on the grounds that it would contribute to the country's industrial development. They restructured the project to include a heavy training component for local workers and managers, as well as a farm that would grow certain of the drink's ingredients. In addition, the company promised to make efforts to persuade other American companies to consider investments in the country.`;

const P_EX03=`In 2012, the Yale School of Architecture held a symposium called "Is Drawing Dead?" The bold title reflects a growing sense that the architect's freehand sketch is being displaced by the computer. The transition from sketchpad to screen entails, many architects believe, a loss of creativity, of adventurousness. Thanks to the precision and apparent completeness of screen renderings, a designer working at a computer has a tendency to lock in, visually and cognitively, on a design at an early stage. He bypasses much of the reflective and exploratory playfulness that springs from the uncertainty and ambiguity of sketching. Researchers term this phenomenon "premature fixation" and trace its cause to "the disincentive for design changes once a large amount of detail and interconnectedness is built too quickly into a CAD (Computer-Aided Design) model." The designer at the computer also tends to emphasize formal experimentation at the expense of expressiveness. By weakening an architect's "personal, emotional connection with the work," a renowned American architect and designer Michael Graves argues, CAD software produces designs that, "while complex and interesting in their own way," often "lack the emotional content of a design derived from hand."`;

const P_EX04=`Limited animation is a process of making animated cartoons that does not follow a "realistic" approach. The short cartoons and feature films of Walt Disney from the 1930s and 1940s are widely acclaimed for depicting animated simulations of reality, with exquisite detail in every frame. However, this style of animation is very time-consuming and expensive. "Limited" animation creates an image that uses abstract art, symbolism, and limited movement to create the same effect, but at a much lower production cost. This style of animation depends more upon suspension of disbelief to tell a story; the story exists more in the viewer's imagination. It also encourages the animators to indulge in artistic styles that are not necessarily bound to the limits of the real world. The result is a new artistic style that could not have developed if animation was solely devoted to producing simulations of reality. Without limited animation, such ground-breaking films as Yellow Submarine, Chuck Jones' The Dot and the Line, and many others could never have been produced.`;

passage:`The economic benefit of culturtainment makes it attractive to politicians and policy makers alike. <b>①</b> A potential increase in inbound visitor numbers coupled with their demand for related goods and services is an incentive for those within governments and authorities to work with cultural groups in order to develop celebrations and commemorations into larger and more high-profile events. <b>②</b> However, such commercialization risks culturtainment becoming homogeneous and losing its original 'message' that could lead to a dilution of audiences. <b>③</b> This is something that planners and stakeholders will need to balance against potential financial gain. <b>④</b> Overall this is a healthy growth sector of the entertainment industry, but one that by its very nature is delicate in the face of exploitation.`,
stem:`다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class="q-given-sentence">This could also lead to smaller non-commercial independent events being set up that would only serve to divide audiences further.</div>`,
det:{korean:`상업화로 인한 동질화와 관객 희석 설명 직후, 소규모 독립 행사가 관객을 더욱 분산시킨다는 문장이 와야 자연스럽다. 그 다음 "This is something"이 이 문제를 받아 균형 필요성을 설명.`,analysis:`✅③: dilution of audiences 후 → 소규모 독립 행사로 인한 추가 분산 → "This is something"으로 연결\n❌①: 아직 상업화 설명 전\n❌②: incentive 설명 중\n❌④: 이미 결론 단계`,tip:`"This could also lead to" - also는 앞의 dilution에 더해 추가 부정적 결과를 연결`}},

{id:2,type:'문장삽입',diff:'쉬움',pts:4,fmt:'mc',ans:2,
ch:['①','②','③','④'],
passage:`Limited animation is a process of making animated cartoons that does not follow a "realistic" approach. <b>①</b> The short cartoons and feature films of Walt Disney from the 1930s and 1940s are widely acclaimed for depicting animated simulations of reality, with exquisite detail in every frame. <b>②</b> However, this style of animation is very time-consuming and expensive. <b>③</b> This style of animation depends more upon suspension of disbelief to tell a story; the story exists more in the viewer's imagination. <b>④</b> The result is a new artistic style that could not have developed if animation was solely devoted to producing simulations of reality.`,
stem:`다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class="q-given-sentence">"Limited" animation creates an image that uses abstract art, symbolism, and limited movement to create the same effect, but at a much lower production cost.</div>`,
det:{korean:`전통 애니메이션이 비싸고 시간이 많이 걸린다는 문제 제기 후, 리미티드 애니메이션이 더 낮은 비용으로 같은 효과를 낸다는 대안 제시.`,analysis:`✅③: time-consuming and expensive 후 → 리미티드 애니메이션의 대안(낮은 비용) → suspension of disbelief로 연결\n❌①: 아직 전통 애니메이션 소개 전\n❌②: 디즈니 설명 중간\n❌④: 이미 결과 설명 단계`,tip:`However(=전환) → 비싸고 느림 → 대안(낮은 비용) → 특징 설명 순서`}},

{id:3,type:'어순배열',diff:'어려움',pts:6,fmt:'written',wa:'coupled with their demand for related goods and services',
accept:['coupled with their demand for related goods and services'],
passage:`A potential increase in inbound visitor numbers __________________________________________ is an incentive for those within governments and authorities to work with cultural groups.`,
stem:`주어진 단어를 올바른 순서로 배열하시오.<div class="q-given-sentence">their / for / coupled / goods / with / demand / related / and / services</div>`,
det:{korean:`과거분사 coupled with + their demand for related goods and services`,analysis:`coupled with(~와 결합된) + their demand(그들의 수요) + for related goods and services(관련 상품과 서비스에 대한)`,tip:`coupled with = ~와 결합된 / demand for = ~에 대한 수요`}},

{id:4,type:'어순배열',diff:'보통',pts:5,fmt:'written',wa:'no one certain factor that can predict or ensure mastery',
accept:['no one certain factor that can predict or ensure mastery'],
passage:`In other words, there's __________________________________________ or optimal performance of anything.`,
stem:`주어진 단어를 올바른 순서로 배열하시오.<div class="q-given-sentence">certain / one / or / no / predict / that / can / ensure / factor / mastery</div>`,
det:{korean:`no one certain factor(어떤 한 가지 확실한 요인도 ~없다) + that can predict or ensure mastery(숙련을 예측하거나 보장할 수 있는)`,analysis:`no one certain factor(=어떤 하나의 확실한 요인도 없다) + 관계대명사 that + can predict or ensure + mastery`,tip:`no one certain factor = 어떤 한 가지 확실한 요인도 ~다`}},

{id:5,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`The economic benefit of culturtainment makes it ①<u>attractive</u> to politicians and policy makers alike. A potential increase in inbound visitor numbers ②<u>coupled</u> with their demand for related goods and services is an incentive. However, such commercialization risks culturtainment ③<u>becoming</u> homogeneous. This could also lead to smaller non-commercial independent events ④<u>being set up</u> that would only serve to divide audiences further. Changing political, social and religious landscapes will lead to the emergence of new cultures, and with them new culturtainment ⑤<u>experience</u>.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`원문은 experiences(복수). new cultures와 병렬되어 복수형이 필요.`,analysis:`❌⑤experience → experiences: new cultures(=복수)와 병렬되므로 복수형 필요\n✅①attractive: 보어 적절\n✅②coupled: 과거분사 수식\n✅③becoming: risk + ~ing\n✅④being set up: 수동 분사구문`,tip:`new cultures and new culturtainment experiences — 복수 병렬 구조`}},

{id:6,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`You've probably heard that it takes about ten thousand hours of practice ①<u>to become</u> an expert in anything. The research by K. Anders Ericsson on this topic has been ②<u>written</u> about many times. However, recently, a cohort of researchers reexamined the studies and said that the ten-thousand-hour rule was utter nonsense. Specifically, there is nothing particularly ③<u>special</u> about ten thousand hours, and while practice is clearly important ④<u>to boost</u> performance, other factors may play an even more important role. In other words, there's no one certain factor that can predict or ⑤<u>ensuring</u> mastery or optimal performance of anything.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`predict or ensure에서 or로 병렬되므로 동사원형 ensure가 적절. ensuring은 불가.`,analysis:`❌⑤ensuring → ensure: predict or ensure(병렬 구조에서 동사원형 필요)\n✅①to become: it takes ~ to V\n✅②written: has been + p.p.\n✅③special: 보어 적절\n✅④to boost: important to V`,tip:`A or B 병렬 구조: predict or ensure(동사원형 병렬)`}},

{id:7,type:'어법',diff:'어려움',pts:6,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`In 2012, the Yale School of Architecture held a symposium ①<u>called</u> "Is Drawing Dead?" The bold title reflects a growing sense that the architect's freehand sketch is being ②<u>displaced</u> by the computer. Thanks to the precision of screen renderings, a designer working at a computer has a tendency ③<u>to lock</u> in on a design at an early stage. He bypasses much of the reflective and exploratory playfulness that ④<u>springs</u> from the uncertainty of sketching. CAD software produces designs that often ⑤<u>lacking</u> the emotional content of a design derived from hand.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`원문은 designs that lack. 관계대명사 that절의 술어동사로 동사원형 lack이 필요.`,analysis:`❌⑤lacking → lack: that절의 술어동사 필요(designs that lack)\n✅①called: 과거분사 수식\n✅②displaced: be + p.p. 수동태\n✅③to lock: tendency to V\n✅④springs: that절 동사`,tip:`관계대명사 that + 동사원형: designs that lack = ~이 부족한 디자인들`}},

{id:8,type:'어휘',diff:'쉬움',pts:4,fmt:'mc',ans:3,
ch:['①','②','③','④','⑤'],
passage:`The economic benefit of culturtainment makes it ①<u>attractive</u> to politicians and policy makers alike. A potential increase in inbound visitor numbers is an ②<u>incentive</u> for those within governments to work with cultural groups. However, such commercialization risks culturtainment becoming ③<u>homogeneous</u> and losing its original 'message.' This could also lead to smaller non-commercial independent events being set up that would only serve to ④<u>unite</u> audiences further. Overall this is a healthy growth sector, but one that is ⑤<u>delicate</u> in the face of exploitation.`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`소규모 독립 행사는 관객을 통합(unite)하는 것이 아니라 분산(divide)시킨다.`,analysis:`❌④unite(통합) → divide(분산): 원문은 관객을 더욱 분산시킨다는 부정적 맥락\n✅①attractive ✅②incentive ✅③homogeneous ✅⑤delicate`,tip:`divide(분산) ↔ unite(통합) — 관객이 더 나뉘어진다는 부정적 문맥`}},

{id:9,type:'어휘',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['①','②','③','④','⑤'],
passage:`In 2012, the Yale School of Architecture held a symposium called "Is Drawing Dead?" The bold title reflects a growing sense that the architect's freehand sketch is being ①<u>displaced</u> by the computer. The transition from sketchpad to screen entails, many architects believe, a loss of ②<u>creativity</u>. Thanks to the precision of screen renderings, a designer has a tendency to lock in on a design at an early stage. He bypasses much of the reflective and exploratory ③<u>playfulness</u> that springs from the uncertainty of sketching. The designer also tends to emphasize formal experimentation at the expense of ④<u>rigidity</u>. CAD software produces designs that often "lack the ⑤<u>emotional</u> content of a design derived from hand."`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`원문은 expressiveness(표현력). 형식적 실험을 강조하면서 표현력을 희생한다는 맥락에서 rigidity(경직성)는 부적절.`,analysis:`❌④rigidity(경직성) → expressiveness(표현력): at the expense of expressiveness가 원문\n✅①displaced ✅②creativity ✅③playfulness ✅⑤emotional`,tip:`expressiveness(표현력) ↔ rigidity(경직성) — at the expense of = ~을 희생하고`}},

{id:10,type:'빈칸추론',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['expansion','celebration','promotion','dilution','innovation'],
passage:`such commercialization risks culturtainment becoming homogeneous and losing its original 'message' that could lead to a __________ of audiences.`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`동질화되고 원래 메시지를 잃으면 관객이 희석(dilution)될 수 있다.`,analysis:`✅④dilution(희석): 동질화 + 메시지 상실 → 관객 분산/감소\n❌①expansion ❌②celebration ❌③promotion ❌⑤innovation`,tip:`dilution of audiences = 관객의 희석/감소`}},

{id:11,type:'빈칸추론',diff:'어려움',pts:6,fmt:'mc',ans:1,
ch:['creativity','fixation','innovation','flexibility','adaptation'],
passage:`Researchers term this phenomenon "premature __________" and trace its cause to "the disincentive for design changes once a large amount of detail and interconnectedness is built too quickly into a CAD model."`,
stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`초기 단계에서 디자인에 고착되는 현상 = premature fixation(조기 고착).`,analysis:`✅②fixation(고착): 조기 고착 현상\n❌①creativity: 반대\n❌③innovation: 반대\n❌④flexibility: 반대\n❌⑤adaptation: 무관`,tip:`premature fixation = 조기 고착 — CAD의 세부사항이 빠르게 구축되어 변경 의욕 사라짐`}},

{id:12,type:'빈칸추론',diff:'보통',pts:5,fmt:'mc',ans:0,
ch:['suspension','simulation','limitation','exploration'],
passage:`This style of animation depends more upon __________ of disbelief to tell a story; the story exists more in the viewer's imagination.`,
stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`이 애니메이션 스타일은 이야기를 전달하기 위해 불신의 유예(suspension of disbelief)에 더 의존.`,analysis:`✅①suspension: suspension of disbelief = 불신의 유예\n❌②simulation: 오히려 반대 개념\n❌③limitation: 문맥 부적합\n❌④exploration: 문맥 부적합`,tip:`suspension of disbelief(불신의 유예) — 허구를 사실로 받아들이는 관객의 태도`}},

{id:13,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'exploitation',
accept:['exploitation','Exploitation'],
passage:`Overall this is a healthy growth sector of the entertainment industry, but one that by its very nature is delicate in the face of __________ (exploit).`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`exploit(동사) → exploitation(명사). in the face of + 명사.`,analysis:`exploit → exploitation: 동사 → 명사 변환\nin the face of + 명사 구조`,tip:`exploit(동) → exploitation(명): -ation 명사화`}},

{id:14,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'expressiveness',
accept:['expressiveness','Expressiveness'],
passage:`The designer at the computer also tends to emphasize formal experimentation at the expense of __________ (expressive).`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`expressive(형용사) → expressiveness(명사). at the expense of + 명사.`,analysis:`expressive → expressiveness: 형용사 → 명사 변환\nat the expense of + 명사 구조`,tip:`expressive(형) → expressiveness(명): -ness 명사화`}},

{id:15,type:'서술형',diff:'어려움',pts:6,fmt:'written',wa:'homogeneous',
accept:['homogeneous','Homogeneous'],
passage:P_GW,
stem:`다음 글에서 상업화로 인해 컬처테인먼트가 될 위험이 있다고 한 것을 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`commercialization risks culturtainment becoming homogeneous(동질적인).`,analysis:`homogeneous = 동질적인, 획일적인\n"becoming homogeneous" = 동질화되는`,tip:`homogeneous = 동종의, 획일적인`}},

{id:16,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'fixation',
accept:['fixation','Fixation'],
passage:P_EX03,
stem:`다음 글에서 연구자들이 디자이너가 초기에 디자인에 고착되는 현상을 부르는 용어의 핵심 단어를 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`premature fixation에서 핵심 단어 = fixation(고착).`,analysis:`Researchers term this phenomenon "premature fixation"\n핵심 단어 = fixation`,tip:`premature fixation = 조기 고착 / fixation = 고착, 집착`}},

{id:17,type:'내용이해',diff:'쉬움',pts:4,fmt:'mc',ans:2,
ch:['상업화가 컬처테인먼트의 문화적 다양성을 증가시킨다.','소규모 독립 행사는 관객을 통합하는 역할을 한다.','정치적, 사회적 변화는 새로운 문화의 출현을 이끌 것이다.','컬처테인먼트는 착취에 강한 산업 영역이다.'],
passage:P_GW,
stem:`다음 글의 내용과 일치하는 것은?`,
det:{korean:`"Changing political, social and religious landscapes will lead to the emergence of new cultures" → 일치`,analysis:`✅③: 원문과 정확히 일치\n❌①: 동질화 위험이지 다양성 증가 아님\n❌②: 통합이 아니라 분산(divide)\n❌④: delicate(취약)이지 강함 아님`,tip:`내용 일치 문제: 선택지를 하나씩 본문과 대조`}},

{id:18,type:'내용이해',diff:'보통',pts:5,fmt:'mc',ans:2,
ch:['미국 음료회사는 소련 국민의 갈증을 해소하기 위해 거래했다.','소련 정부 관리는 그 제품을 유용한 음료로 인정했다.','미국 협상가들은 산업 발전 기여를 근거로 프로젝트를 정당화했다.','음료회사는 소련의 이데올로기를 변화시키려 했다.'],
passage:P_EX02,
stem:`다음 글의 내용과 일치하는 것은?`,
det:{korean:`"the U.S. negotiators justified the project on the grounds that it would contribute to the country's industrial development" → 일치`,analysis:`✅③: 원문과 정확히 일치\n❌①: not on the basis that the drink would quench thirst\n❌②: dismissed as "useless drink"\n❌④: 이데올로기 변화 시도 아님`,tip:`on the grounds that = ~라는 근거로`}},

{id:19,type:'T/F',diff:'쉬움',pts:4,fmt:'mc',ans:1,
ch:['True','False'],
passage:P_EX01,
stem:`다음 문장이 본문과 일치하면 True, 일치하지 않으면 False를 선택하시오.<br><br><b>"The ten-thousand-hour rule was confirmed by the cohort of researchers as scientifically valid."</b>`,
det:{korean:`원문: "the ten-thousand-hour rule was utter nonsense" → 과학적으로 유효하다고 확인된 것이 아님.`,analysis:`❌False: utter nonsense(완전한 헛소리) ≠ scientifically valid(과학적으로 유효)`,tip:`utter nonsense = 완전한 헛소리 → 법칙이 부정됨`}},

{id:20,type:'T/F',diff:'보통',pts:5,fmt:'mc',ans:1,
ch:['True','False'],
passage:P_EX03,
stem:`다음 문장이 본문과 일치하면 True, 일치하지 않으면 False를 선택하시오.<br><br><b>"CAD software enhances architects' personal, emotional connection with their designs."</b>`,
det:{korean:`원문: "By weakening an architect's personal, emotional connection with the work" → 강화가 아닌 약화.`,analysis:`❌False: weakening(약화) ≠ enhances(강화)\n정반대 표현`,tip:`weakening = 약화 ≠ enhances = 강화 — 정반대 의미 구별`}}
];

let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}

function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const markers=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${markers[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}

function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const markers=d.q.ch&&d.q.ch.length===5?'①②③④⑤':d.q.ch&&d.q.ch.length===4?'①②③④':d.q.ch&&d.q.ch.length===3?'①②③':'①②';const ua=d.q.fmt==='mc'?(d.ans!==null?markers[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?markers[d.q.ans]:d.q.wa;const open=!d.ok;const det=d.q.det||{};h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--oxl);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--oxl);color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div>${det.korean?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${det.korean}</div>`:''}${det.analysis?`<div class="expl-tag tip">📋 분석</div><div class="expl-box">${det.analysis}</div>`:''}${det.tip?`<div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${det.tip}</div>`:''}</div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}

function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인퀴즈 TEST 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
