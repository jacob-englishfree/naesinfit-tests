const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"06강","lesson":"주제 파악","title":"Topic Identification","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_suneung_06_v1"};

const P_GW=`Emphasizing speed over frequency can make sense in contexts where everyone is expected to plan around the timetable, including peak-only commute services and very long trips with low demand. In all other contexts, though, it seems to be a common motorist's error. Roads are there all the time, so their speed is the most important fact that distinguishes them. But transit is only there if it's coming soon. If you have a car, you can use a road whenever you want and experience its speed. But transit has to exist when you need it (span), and it needs to be coming soon (frequency). Otherwise, waiting time will wipe out any time savings from a faster service. Unless you're comfortable planning your life around a particular scheduled trip, speed is worthless without frequency, so a transit map that screams about speed and whispers about frequency may simply be planting confusion.`;

const P_EX01=`In the United States, the practice of permitting aliens to vote could be seen as compatible with the idea of an exclusionary citizenship, but that is a hard balance to maintain. If the vote, of all rights, is in the hands of noncitizens, why should they not count as citizens, and the entire distinction between resident alien and citizen be abandoned? Indeed, something like this thought probably lay behind the disappearance of alien voting: with universal adult citizen suffrage after 1920, the only way to maintain an exclusionary kind of citizenship was to restrict the vote to citizens and not residents. But no theory of "active" democracy can countenance this distinction: the laws concerning our common life must be made by all those who are taking part in it, and residence is the only convincing test of whether someone is taking part — as is understood almost universally when it comes to questions of which citizens should have a voice in local government.`;

const P_EX02=`When people are asked what any painting hanging on a gallery wall means, no matter how strange it might appear, as is the case with most abstract-expressionist paintings, they tend to find meaning in it because it is located in a gallery. Consider a soda can found thrown away on a city street. If we were to come across this item on the street, we would no doubt view it as a piece of garbage or rubbish. But if we saw the very same object on a pedestal, displayed in an art gallery, signed by some artist, and given a title such as "Waste," then we would interpret its meaning in a vastly different way. We would, in fact, be inclined to interpret it as an artistic form, descrying a throw-away or materialistic society. Clearly, the can's location on a sidewalk versus its display on a pedestal in an art gallery will influence how we will interpret it.`;

const P_EX03=`The reliance on the computer as a model for the operations of the human mind may well prove to be as limited as an earlier fascination with behaviorism. Psychologists have already begun to recognize the flaws of the mind-as-computer metaphor. Some have turned to cultural anthropology as a way of understanding the factors outside any particular individual's brain that help the individual make sense out of the world. Others, such as Jerome Bruner, one of the founders of cognitive psychology, find that the computer analogy carries with it an unfortunate shift "from the construction of meaning to the processing of information." Bruner's reflections on the limits of the machine model lead him back to a humanistic emphasis on narrative and story-telling as essential ingredients in understanding human cognition, a fascinating intellectual journey that reveals both the power and the limits of computers as guides to the way we think.`;

const P_EX04=`In the escape that reading literature provides through vicarious identification and comparison with other lives, places, and times, we activate our imagination, that uniquely human ability to explore an alternative set of ideas and experiences that are outside our present environment and that may not even be real. As opposed to perception that receives and processes information from the outside world — light, sound, shape — and finds meaning in it — a sunset, a symphony, a house — in imagination, the process is reversed. Translating the words we read into what they signify, we populate an inner world in which imagery is created from the memory. For example, we read "house" and picture a representation of a house from memory. It is our imagination, the complex interweaving of perception and memory that literature activates, releasing a latent creativity that pleases. The writer may provide the blueprint, but the reader builds literature's many rooms, and like any satisfying occupation, literature gratifies our imaginative and creative abilities.`;

const Q=[
{id:1,type:'문장삽입',diff:'어려움',pts:6,fmt:'mc',ans:2,
ch:['①','②','③','④'],
passage:`Emphasizing speed over frequency can make sense in contexts where everyone is expected to plan around the timetable, including peak-only commute services and very long trips with low demand. <b>①</b> In all other contexts, though, it seems to be a common motorist's error. Roads are there all the time, so their speed is the most important fact that distinguishes them. But transit is only there if it's coming soon. <b>②</b> If you have a car, you can use a road whenever you want and experience its speed. But transit has to exist when you need it (span), and it needs to be coming soon (frequency). <b>③</b> Unless you're comfortable planning your life around a particular scheduled trip, speed is worthless without frequency, so a transit map that screams about speed and whispers about frequency may simply be planting confusion. <b>④</b>`,
stem:`다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class="q-given-sentence">Otherwise, waiting time will wipe out any time savings from a faster service.</div>`,
det:{korean:`대중교통은 운행 시간대에 존재해야 하고(span) 곧 와야 한다(frequency)는 설명 직후, "그렇지 않으면 대기 시간이 빠른 서비스로 인한 시간 절약을 모두 없앨 것"이라는 결과가 자연스럽다.`,analysis:`✅③: span과 frequency 설명 직후 → 그렇지 않으면(Otherwise)의 결과\n❌①: 아직 맥락 전환 전\n❌②: 도로와 대중교통 비교 시작\n❌④: 결론 뒤에 추가 설명 부적절`,tip:`Otherwise(그렇지 않으면)는 앞의 조건(span + frequency) 불충족 시 결과를 나타냄`}},

{id:2,type:'문장삽입',diff:'어려움',pts:6,fmt:'mc',ans:2,
ch:['①','②','③','④'],
passage:`In the escape that reading literature provides through vicarious identification and comparison with other lives, places, and times, we activate our imagination. <b>①</b> As opposed to perception that receives and processes information from the outside world — light, sound, shape — and finds meaning in it — a sunset, a symphony, a house — in imagination, the process is reversed. <b>②</b> Translating the words we read into what they signify, we populate an inner world in which imagery is created from the memory. <b>③</b> It is our imagination, the complex interweaving of perception and memory that literature activates, releasing a latent creativity that pleases. <b>④</b> The writer may provide the blueprint, but the reader builds literature's many rooms.`,
stem:`다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class="q-given-sentence">For example, we read "house" and picture a representation of a house from memory.</div>`,
det:{korean:`기억으로부터 심상이 만들어진다는 설명(imagery is created from the memory) 직후, 그 구체적 예시("house"를 읽고 기억에서 집을 떠올림)가 오는 것이 자연스럽다.`,analysis:`✅③: "imagery is created from the memory" 직후 → 예시(house)\n❌①: 아직 상상과 지각의 대조 전\n❌②: 지각과 상상의 역전 설명 직후이나, 아직 기억에서 심상 생성 언급 전\n❌④: 이미 결론 단계`,tip:`For example은 앞 문장의 구체적 예시 → memory에서 imagery 생성의 예`}},

{id:3,type:'어순배열',diff:'어려움',pts:6,fmt:'written',wa:'the only convincing test of whether someone is taking part',
accept:['the only convincing test of whether someone is taking part'],
passage:`the laws concerning our common life must be made by all those who are taking part in it, and residence is __________________________________________.`,
stem:`주어진 단어를 올바른 순서로 배열하시오.<div class="q-given-sentence">test / the / whether / convincing / only / of / is / taking / someone / part</div>`,
det:{korean:`residence is the only convincing test of whether someone is taking part (거주는 누군가가 참여하고 있는지에 대한 유일한 설득력 있는 기준이다)`,analysis:`the only convincing test(유일한 설득력 있는 기준) + of whether(~인지에 대한) + someone is taking part(누군가가 참여하고 있는)`,tip:`the only + 형용사 + 명사 + of whether + S + V 구조`}},

{id:4,type:'어순배열',diff:'쉬움',pts:4,fmt:'written',wa:'screams about speed and whispers about frequency',
accept:['screams about speed and whispers about frequency'],
passage:`a transit map that __________________________________________ may simply be planting confusion.`,
stem:`주어진 단어를 올바른 순서로 배열하시오.<div class="q-given-sentence">whispers / about / speed / frequency / and / screams / about</div>`,
det:{korean:`속도에 대해 소리치고(screams about speed) 빈도에 대해 속삭이는(whispers about frequency) 교통 지도`,analysis:`screams about speed(속도에 대해 소리침) + and + whispers about frequency(빈도에 대해 속삭임)`,tip:`screams(소리치다) ↔ whispers(속삭이다) — 속도 vs 빈도의 대조`}},

{id:5,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`Emphasizing speed over frequency can make sense in contexts ①<u>where</u> everyone is expected to plan around the timetable. In all other contexts, though, it seems to be a common motorist's error. Roads are there all the time, so their speed is the most important fact ②<u>that</u> distinguishes them. But transit is only there if it's ③<u>coming</u> soon. But transit has to exist when you need it, and it needs to be coming soon. Otherwise, ④<u>wait</u> time will wipe out any time savings from a faster service. Unless you're comfortable ⑤<u>planning</u> your life around a particular scheduled trip, speed is worthless without frequency.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`waiting time이 올바른 표현. wait(동사원형)가 명사를 수식할 수 없고, 현재분사 waiting이 필요.`,analysis:`❌④wait → waiting: 명사 time을 수식하는 현재분사 필요\n✅①where: 선행사 contexts를 수식하는 관계부사\n✅②that: 선행사 fact를 수식하는 관계대명사\n✅③coming: be coming = 진행형\n✅⑤planning: be comfortable + ~ing`,tip:`waiting time(대기 시간) — 현재분사가 명사를 수식`}},

{id:6,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['①','②','③','④','⑤'],
passage:`When people are asked ①<u>what</u> any painting hanging on a gallery wall means, they tend to find meaning in it because it is ②<u>located</u> in a gallery. Consider a soda can ③<u>found</u> thrown away on a city street. But if we saw the very same object on a pedestal, ④<u>displaying</u> in an art gallery, signed by some artist, then we would interpret its meaning in a vastly different way. Clearly, the can's location will ⑤<u>influence</u> how we will interpret it.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`물체가 전시되는(displayed) 것이므로 수동 의미의 과거분사 displayed가 필요. displaying(능동)은 틀림.`,analysis:`❌④displaying → displayed: 물체가 전시되는 것(수동)\n✅①what: 간접의문문\n✅②located: be located(수동)\n✅③found: 과거분사(수동) 수식\n✅⑤influence: 조동사 will + 동사원형`,tip:`displayed(전시된) — 수동 의미의 과거분사`}},

{id:7,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`The reliance on the computer as a model may well ①<u>prove</u> to be as limited as an earlier fascination with behaviorism. Some have turned to cultural anthropology as a way of ②<u>understanding</u> the factors outside any particular individual's brain. Others find that the computer analogy carries with it an unfortunate shift. Bruner's reflections on the limits of the machine model lead him back to a humanistic emphasis on narrative and story-telling as ③<u>essential</u> ingredients in understanding human cognition, a ④<u>fascinated</u> intellectual journey that reveals both the power and the limits of computers as ⑤<u>guides</u> to the way we think.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`fascinating(매력적인) intellectual journey가 맞다. fascinated(매력을 느끼는)는 사물에 쓸 수 없다.`,analysis:`❌④fascinated → fascinating: journey(사물)를 수식 → 감정 유발 형용사 -ing\n✅①prove: may well + 동사원형\n✅②understanding: a way of + ~ing\n✅③essential: 형용사\n✅⑤guides: 명사(안내서)`,tip:`fascinating(매력적인, 사물) vs fascinated(매력을 느끼는, 사람)`}},

{id:8,type:'어휘',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['①','②','③','④','⑤'],
passage:`Emphasizing speed over frequency can make sense in contexts where everyone is expected to plan around the timetable. In all other contexts, though, it seems to be a common motorist's ①<u>error</u>. Roads are there all the time, so their speed is the most important fact that ②<u>distinguishes</u> them. But transit is only there if it's coming soon. But transit has to exist when you need it, and it needs to be coming soon. Otherwise, waiting time will ③<u>add to</u> any time savings from a faster service. Unless you're comfortable planning your life around a particular scheduled trip, speed is ④<u>worthless</u> without frequency, so a transit map that ⑤<u>screams</u> about speed and whispers about frequency may simply be planting confusion.`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`대기 시간이 시간 절약을 없앨(wipe out) 것이다. add to(더하다)는 wipe out(없애다)의 반의어로 부적절.`,analysis:`❌③add to(더하다) → wipe out(없애다): 대기 시간이 시간 절약을 상쇄한다는 문맥\n✅①error(오류) ✅②distinguishes(구별하다) ✅④worthless(무가치한) ✅⑤screams(소리치다)`,tip:`wipe out(없애다, 상쇄하다) ↔ add to(더하다)`}},

{id:9,type:'어휘',diff:'보통',pts:5,fmt:'mc',ans:2,
ch:['①','②','③','④','⑤'],
passage:`In the escape that reading literature provides through vicarious identification, we activate our ①<u>imagination</u>. As opposed to perception that receives and processes information from the outside world and finds meaning in it, in imagination, the process is ②<u>reversed</u>. We populate an inner world in which imagery is created from the memory. It is our imagination, the complex interweaving of perception and memory that literature activates, releasing a ③<u>manifest</u> creativity that pleases. The writer may provide the ④<u>blueprint</u>, but the reader builds literature's many rooms, and like any satisfying occupation, literature ⑤<u>gratifies</u> our imaginative and creative abilities.`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`잠재된(latent) 창의성을 해방시킨다. manifest(명백한, 드러난)는 latent(잠재된)의 반의어로 부적절.`,analysis:`❌③manifest(명백한) → latent(잠재된): 숨어 있다가 문학에 의해 해방되는 창의성\n✅①imagination ✅②reversed ✅④blueprint ✅⑤gratifies`,tip:`latent(잠재된) ↔ manifest(명백한, 드러난)`}},

{id:10,type:'빈칸추론',diff:'보통',pts:5,fmt:'mc',ans:2,
ch:['speed','accuracy','frequency','distance','schedule'],
passage:`Emphasizing speed over frequency can make sense in contexts where everyone is expected to plan around the timetable, including peak-only commute services and very long trips with low demand. In all other contexts, though, it seems to be a common motorist's error. Roads are there all the time, so their speed is the most important fact that distinguishes them. But transit is only there if it's coming soon. But transit has to exist when you need it (span), and it needs to be coming soon (frequency). Otherwise, waiting time will wipe out any time savings from a faster service. Unless you're comfortable planning your life around a particular scheduled trip, speed is worthless without __________.`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`속도는 빈도(frequency) 없이는 무가치하다 — 글의 핵심 주장.`,analysis:`✅③frequency: 빈도 — 핵심 주장\n❌①speed: 이미 주어진 조건\n❌②accuracy: 문맥과 무관\n❌④distance: 문맥과 무관\n❌⑤schedule: 부분적 관련이나 핵심 아님`,tip:`speed is worthless without frequency`}},

{id:11,type:'빈칸추론',diff:'어려움',pts:6,fmt:'mc',ans:1,
ch:['similarities','flaws','advantages','origins','applications'],
passage:`The reliance on the computer as a model for the operations of the human mind may well prove to be as limited as an earlier fascination with behaviorism. Psychologists have already begun to recognize the __________ of the mind-as-computer metaphor. Some have turned to cultural anthropology as a way of understanding the factors outside any particular individual's brain that help the individual make sense out of the world.`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`컴퓨터 비유의 결함(flaws)을 인식하기 시작하고 대안을 찾기 시작했다.`,analysis:`✅②flaws(결함): limited, 대안 전환의 이유\n❌①similarities: 유사성\n❌③advantages: 장점은 문맥과 반대\n❌④origins: 기원\n❌⑤applications: 응용`,tip:`recognize the flaws = 결함을 인식하다`}},

{id:12,type:'빈칸추론',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['location','value','origin','meaning'],
passage:`Consider a soda can found thrown away on a city street. If we were to come across this item on the street, we would no doubt view it as a piece of garbage or rubbish. But if we saw the very same object on a pedestal, displayed in an art gallery, signed by some artist, and given a title such as "Waste," then we would interpret its __________ in a vastly different way.`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`같은 물체도 위치에 따라 그 의미(meaning)를 다르게 해석한다.`,analysis:`✅④meaning: interpret its meaning\n❌①location: 위치 자체를 해석하는 것 아님\n❌②value: 유사하나 원문은 meaning\n❌③origin: 기원`,tip:`interpret its meaning = 의미를 해석하다`}},

{id:13,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'frequency',
accept:['frequency','Frequency'],
passage:P_GW,
stem:`다음 글에서 속도(speed)가 그것 없이는 무가치하다고 한 것을 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`"speed is worthless without frequency"`,analysis:`frequency = 운행 빈도`,tip:`빈도 = frequency`}},

{id:14,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'residence',
accept:['residence','Residence'],
passage:P_EX01,
stem:`다음 글에서 누군가가 참여하고 있는지의 유일한 설득력 있는 기준(test)을 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`"residence is the only convincing test"`,analysis:`residence = 거주`,tip:`residence = 거주 (참여 판단의 유일한 기준)`}},

{id:15,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'materialistic',
accept:['materialistic','Materialistic'],
passage:`We would, in fact, be inclined to interpret it as an artistic form, descrying a throw-away or __________ (material) society.`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`material → materialistic: 물질만능주의적 사회.`,analysis:`material(재료의) → materialistic(물질만능주의적인): 형용사 파생`,tip:`materialistic society = 물질만능주의 사회`}},

{id:16,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'humanistic',
accept:['humanistic','Humanistic'],
passage:`Bruner's reflections on the limits of the machine model lead him back to a __________ (human) emphasis on narrative and story-telling.`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`human → humanistic: 인본주의적 강조.`,analysis:`human(인간의) → humanistic(인본주의적인): 형용사 파생`,tip:`humanistic = 인본주의적인`}},

{id:17,type:'내용이해',diff:'보통',pts:5,fmt:'mc',ans:2,
ch:['대중교통의 운행 빈도 조정의 결과','정확한 대중교통 지도를 설계하는 것의 중요성','대중교통에서 운행 빈도에 가치를 부여하는 것의 중요성','고속 대중교통 시스템을 만드는 것의 영향','통근 서비스의 속도와 운행 빈도를 개선하는 방법'],
passage:P_GW,
stem:`다음 글의 주제로 가장 적절한 것은?`,
det:{korean:`속도보다 빈도가 중요하며, 빈도 없는 속도는 무가치하다. 정답 PDF: GW ③`,analysis:`✅③ 빈도에 가치 부여: speed is worthless without frequency\n❌나머지: 부분적이거나 무관`,tip:`frequency > speed in transit`}},

{id:18,type:'내용이해',diff:'어려움',pts:6,fmt:'mc',ans:3,
ch:['인간이 생각하는 방식과 컴퓨터 작동의 유사성','개인이 세상을 이해하는 데 영향을 미치는 다양한 요인','인간 마음을 논할 때 컴퓨터 비유를 사용하는 이유','컴퓨터 모델을 넘어선 인간 인지에 대한 대안적 관점','컴퓨터 기반 사고 모델의 정확도를 높이는 기술'],
passage:P_EX03,
stem:`다음 글의 주제로 가장 적절한 것은?`,
det:{korean:`컴퓨터 비유의 한계를 인식하고, 문화인류학/서사 등 대안적 관점으로 인간 인지를 이해. 정답 PDF: Ex03 ④`,analysis:`✅④ 대안적 관점: beyond the computer model\n❌나머지: 부분적이거나 무관`,tip:`limits of computer metaphor → narrative/storytelling`}},

ch:['True','False'],
passage:P_EX04,

];

let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}

function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const markers=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${markers[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}

function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const markers=d.q.ch&&d.q.ch.length===5?'①②③④⑤':d.q.ch&&d.q.ch.length===4?'①②③④':d.q.ch&&d.q.ch.length===3?'①②③':'①②';const ua=d.q.fmt==='mc'?(d.ans!==null?markers[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?markers[d.q.ans]:d.q.wa;const open=!d.ok;const det=d.q.det||{};h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--oxl);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--oxl);color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div>${det.korean?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${det.korean}</div>`:''}${det.analysis?`<div class="expl-tag tip">📋 분석</div><div class="expl-box">${det.analysis}</div>`:''}${det.tip?`<div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${det.tip}</div>`:''}</div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}

function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인퀴즈 TEST 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
