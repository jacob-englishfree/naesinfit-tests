<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>내신핏 — 고등 영어 내신 시험</title>
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="내신핏 — 나만의 1:1 맞춤 내신 영어 테스트">
<meta property="og:description" content="교과서별 단어·워크북·퀴즈로 내신 영어 완벽 대비! 지금 바로 풀어보세요.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://naesinfit-tests.vercel.app/og-image.png">
<meta property="og:url" content="https://naesinfit-tests.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TOSS DESIGN SYSTEM
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root {
  /* Core Palette — NaesinFit Purple */
  --blue: #8B5CF6;
  --blue-d: #7C3AED;
  --blue-l: #F3EEFF;
  --blue-xl: #F9F5FF;
  --red: #F04452;
  --red-l: #FFF0F0;
  --green: #00C072;
  --green-l: #E8FAF0;
  --yellow: #F59E0B;
  --yellow-l: #FFF8E1;
  --purple: #8B5CF6;
  --purple-l: #F3EEFF;

  /* Grayscale */
  --g900: #191F28;
  --g800: #333D4B;
  --g700: #4E5968;
  --g600: #6B7684;
  --g500: #8B95A1;
  --g400: #B0B8C1;
  --g300: #D1D6DB;
  --g200: #E5E8EB;
  --g100: #F2F4F6;
  --g50:  #F8F9FA;
  --white: #FFFFFF;

  /* Semantic */
  --bg: var(--g100);
  --card: var(--white);
  --text: var(--g900);
  --sub: var(--g600);
  --hint: var(--g400);
  --border: var(--g200);
  --divider: var(--g100);

  /* Radius */
  --r-xl: 20px;
  --r-lg: 16px;
  --r-md: 12px;
  --r-sm: 8px;

  /* Shadows — very subtle, Toss style */
  --sh-sm: 0 1px 2px rgba(0,0,0,.04);
  --sh-md: 0 2px 8px rgba(0,0,0,.06);
  --sh-lg: 0 8px 24px rgba(0,0,0,.08);

  /* Motion — Toss-tuned */
  --ease: cubic-bezier(.22,1,.36,1);
  --ease-snap: cubic-bezier(.2,.9,.3,1);       /* snappy for taps */
  --ease-spring: cubic-bezier(.34,1.56,.64,1);  /* overshoot bounce */
  --ease-out: cubic-bezier(.16,1,.3,1);          /* smooth decel */
  --dur: .2s;
  --dur-slow: .35s;

  /* Nav / overlay backgrounds */
  --nav-bg: rgba(255,255,255,.72);
  --bottom-bg: rgba(255,255,255,.85);

  /* Reader mode (A-Ultimate) */
  --passage-font: 'Noto Serif', Georgia, serif;
  --passage-size: 15.5px;
  --passage-lh: 2.1;
  --passage-bg: #FEFDFB;
  --passage-color: var(--g800);
  --highlight-yellow: rgba(253,224,71,.4);
  --highlight-green: rgba(52,211,153,.25);
  --highlight-orange: rgba(251,146,60,.25);
  --elim-opacity: 0.3;
  --toolbar-h: 34px;
}

/* ━━ Dark Mode ━━ */
[data-theme="dark"] {
  --blue-l: #2D1B69;
  --blue-xl: #1E1535;
  --red-l: #3D1A1E;
  --green-l: #0F2E1F;
  --yellow-l: #2E2510;
  --purple-l: #1E1535;

  --g900: #ECECEC;
  --g800: #D1D1D1;
  --g700: #B0B0B0;
  --g600: #8E8E8E;
  --g500: #6E6E6E;
  --g400: #555555;
  --g300: #3A3A3A;
  --g200: #2C2C2C;
  --g100: #222222;
  --g50:  #1C1C1C;
  --white: #171717;

  --bg: #111111;
  --card: #1A1A1A;
  --text: #ECECEC;
  --sub: #8E8E8E;
  --hint: #555555;
  --border: #2C2C2C;
  --divider: #222222;

  --sh-sm: 0 1px 2px rgba(0,0,0,.2);
  --sh-md: 0 2px 8px rgba(0,0,0,.3);
  --sh-lg: 0 8px 24px rgba(0,0,0,.4);

  --nav-bg: rgba(17,17,17,.85);
  --bottom-bg: rgba(17,17,17,.85);

  /* Reader mode dark */
  --passage-bg: #1E1E1E;
  --passage-color: #D4D4D4;
  --highlight-yellow: rgba(253,224,71,.2);
  --highlight-green: rgba(52,211,153,.15);
  --highlight-orange: rgba(251,146,60,.15);
}

/* ━━ Reset ━━ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:1.6;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* ━━ App Shell ━━ */
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative}

/* ━━ Page Transitions ━━ */
.page{animation:pageEnter .28s var(--ease-out)}
.page.slide-left{animation:slideLeft .3s var(--ease-out)}
.page.slide-right{animation:slideRight .3s var(--ease-out)}
.page.tab-swap{animation:tabFade .2s var(--ease-out)}
@keyframes pageEnter{from{opacity:.8;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideLeft{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideRight{from{transform:translateX(-40%);opacity:.9}to{transform:translateX(0);opacity:1}}
@keyframes tabFade{from{opacity:.7}to{opacity:1}}

/* ━━ Skeleton Loading ━━ */
.skeleton{background:var(--g100);border-radius:var(--r-md);position:relative;overflow:hidden}
.skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer 1.5s infinite}
[data-theme="dark"] .skeleton::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ━━ Navigation Bar ━━ */
.nav{position:sticky;top:0;z-index:100;height:52px;display:flex;align-items:center;padding:0 20px;background:var(--nav-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.nav-back{width:32px;height:32px;border:none;background:none;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);margin-left:-6px;border-radius:var(--r-sm);transition:background .15s}
.nav-back:active{background:var(--g100)}
.nav-title{flex:1;text-align:center;font-size:16px;font-weight:700;margin-right:26px}

/* ━━ Typography ━━ */
.t-display{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.3}
.t-heading{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.35}
.t-title{font-size:17px;font-weight:700;line-height:1.4}
.t-body{font-size:15px;font-weight:500;line-height:1.6}
.t-caption{font-size:13px;font-weight:500;line-height:1.5}
.t-tiny{font-size:11px;font-weight:600;line-height:1.4}
.c-sub{color:var(--sub)}.c-hint{color:var(--hint)}.c-blue{color:var(--blue)}.c-red{color:var(--red)}.c-green{color:var(--green)}

/* ━━ Section ━━ */
.section{padding:0 20px}
.sec-label{font-size:14px;font-weight:700;color:var(--sub);padding:24px 20px 8px}

/* ━━ Card ━━ */
.card{background:var(--card);border-radius:var(--r-xl);margin:0 20px 10px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.03);border:1px solid rgba(0,0,0,.03);will-change:transform,opacity;transform:translateZ(0)}
.card-flush{margin:0;border-radius:0;box-shadow:none;border-bottom:1px solid var(--divider)}

/* ━━ Toss Button ━━ */
.btn{width:100%;height:54px;border:none;border-radius:16px;font-size:16px;font-weight:800;transition:transform .15s var(--ease-out),background .15s,box-shadow .2s;position:relative;overflow:hidden;will-change:transform}
.btn:active{transform:scale(.97);transition:transform .05s}
.btn::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .15s}
.btn:active::after{background:rgba(0,0,0,.06)}
.btn-blue{background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:white;box-shadow:0 6px 20px rgba(139,92,246,.35)}
.btn-blue:disabled{background:var(--g300);color:white;transform:none;box-shadow:none}
.btn-red{background:linear-gradient(135deg,#EF4444,#DC2626);color:white;box-shadow:0 6px 20px rgba(239,68,68,.3)}
.btn-ghost{background:var(--white);color:var(--g700);border:2px solid var(--g200);font-weight:700}
.btn-sm{height:48px;font-size:15px;border-radius:14px}

/* ━━ Fixed Bottom ━━ */
.bottom-fix{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--bottom-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);z-index:200}
.bottom-spacer{height:90px}

/* ━━ Input ━━ */
.input{width:100%;height:50px;padding:0 16px;border:1.5px solid var(--border);border-radius:var(--r-md);font-size:15px;outline:none;background:var(--white);color:var(--text);transition:border .2s,box-shadow .2s}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(139,92,246,.1)}
.input::placeholder{color:var(--hint)}
.select{-webkit-appearance:none;appearance:none}

/* ━━ Chip ━━ */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 18px;border-radius:22px;font-size:14px;font-weight:500;border:1.5px solid var(--border);background:var(--white);display:inline-flex;align-items:center;transition:all .12s var(--ease-snap);user-select:none;color:var(--text);will-change:transform}
.chip:active{transform:scale(.92)}
.chip.on{border-color:var(--blue);background:linear-gradient(135deg,rgba(139,92,246,.1),rgba(196,132,252,.08));color:var(--blue);font-weight:700;box-shadow:0 2px 8px rgba(139,92,246,.12)}
.chip-sm{height:40px;padding:0 14px;font-size:13px;border-radius:20px}

/* ━━ Option Card (Radio style) ━━ */
.opt{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r-lg);display:flex;align-items:center;gap:10px;margin-bottom:5px;transition:all .12s var(--ease-snap);background:var(--white);will-change:transform}
.opt:active{transform:scale(.97)}
.opt.on{border-color:var(--blue);background:var(--blue-xl)}
.opt-icon{font-size:26px;flex-shrink:0}
.opt-body{flex:1}.opt-body h4{font-size:13px;font-weight:600}.opt-body p{font-size:11px;color:var(--sub);margin-top:2px}
.opt-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--g300);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.opt.on .opt-check{border-color:var(--blue);background:var(--blue);color:white}
.opt.on .opt-check::after{content:'✓';font-size:12px;font-weight:800}

/* ━━ Accordion ━━ */
.acc{background:var(--card);border-radius:var(--r-lg);margin:0 20px 8px;box-shadow:var(--sh-sm);overflow:hidden}
.acc-trigger{width:100%;padding:16px 20px;border:none;background:none;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;color:var(--text);text-align:left}
.acc-trigger:active{background:var(--g50)}
.acc-trigger .lf{display:flex;align-items:center;gap:8px}
.badge{background:var(--blue);color:white;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.arrow{font-size:11px;color:var(--hint);transition:transform .2s var(--ease-snap)}.arrow.open{transform:rotate(180deg)}
.acc-content{padding:0 20px 16px}

/* Smooth accordion slide — grid technique (no max-height hack) */
.acc-slide{display:none;overflow:hidden}
.acc-slide.open{display:block}
.acc-slide>div{overflow:hidden}
.sub-section{padding:14px 0;border-top:1px solid var(--divider)}
.sub-trigger{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0}
.sub-trigger span:first-child{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}

/* ━━ Slider ━━ */
.slider-wrap{display:flex;align-items:center;gap:16px}
.slider-wrap input[type=range]{flex:1;height:4px;-webkit-appearance:none;background:var(--g200);border-radius:2px;outline:none}
.slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;background:var(--blue);border-radius:50%;cursor:pointer;box-shadow:0 2px 8px rgba(139,92,246,.3)}
.slider-num{font-size:36px;font-weight:900;color:var(--blue);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}

/* ━━ Exam ━━ */
.exam-bar{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,#1E1B4B 0%,#312E81 100%);padding:10px 16px 8px;color:white}
[data-theme="dark"] .exam-bar{background:linear-gradient(180deg,#0F0D1A,#1A1730)}
.exam-bar button{color:white!important}
.progress-line{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#A78BFA,#C084FC,#E9D5FF);border-radius:3px;transition:width .4s var(--ease);position:relative;box-shadow:0 0 12px rgba(167,139,250,.5)}
.timer-display{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;transition:color .3s;letter-spacing:-1px;color:white}
.timer-display.warn{color:#FDE68A;text-shadow:0 0 16px rgba(253,230,138,.5)}.timer-display.danger{color:#FCA5A5;animation:timerPulse .6s infinite;text-shadow:0 0 16px rgba(252,165,165,.6)}
@keyframes timerPulse{50%{opacity:.3}}
.exam-bar .t-caption{color:rgba(255,255,255,.7)!important}

.q-dots{display:flex;gap:6px;justify-content:center;padding:14px 16px 10px;flex-wrap:wrap}
.qd{width:34px;height:34px;border-radius:12px;border:none;font-size:12px;font-weight:800;background:var(--white);color:var(--g500);cursor:pointer;transition:all .2s var(--ease-spring);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.qd.cur{background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:white;transform:scale(1.12);box-shadow:0 4px 16px rgba(139,92,246,.4)}
.qd.done{background:linear-gradient(135deg,#EDE9FE,#F3EEFF);color:var(--blue);font-weight:900}

.q-card{background:var(--card);margin:0 16px 12px;border-radius:24px;padding:0;box-shadow:0 4px 24px rgba(0,0,0,.07),0 1px 4px rgba(0,0,0,.04);overflow:hidden;border:1px solid rgba(139,92,246,.06)}
.q-card-header{background:linear-gradient(135deg,#F5F3FF,#EDE9FE);padding:16px 20px 14px;border-bottom:1px solid rgba(139,92,246,.08)}
.q-card-body{padding:18px 20px 20px}
.q-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.q-no{background:linear-gradient(135deg,#7C3AED,#6D28D9);color:white;font-size:13px;font-weight:900;padding:6px 16px;border-radius:20px;letter-spacing:.3px;box-shadow:0 2px 8px rgba(124,58,237,.3)}
.q-diff{font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px}
.q-diff.e{background:#DCFCE7;color:#16A34A}.q-diff.m{background:#FEF3C7;color:#D97706}.q-diff.h{background:#FEE2E2;color:#DC2626;font-weight:800}
.q-pts{font-size:12px;color:var(--g600);font-weight:700;background:var(--white);padding:4px 10px;border-radius:12px}
.q-type{font-size:11px;color:#7C3AED;background:white;padding:5px 12px;border-radius:12px;font-weight:800;border:1px solid rgba(139,92,246,.15)}
.q-stem{font-size:15px;font-weight:800;line-height:1.7;margin-bottom:16px;word-break:keep-all;color:var(--g900)}
.q-passage{font-size:13.5px;line-height:1.9;padding:18px 20px;background:linear-gradient(135deg,#FAFAFE,#F5F3FF);border-radius:16px;margin-bottom:16px;border-left:4px solid linear-gradient(180deg,#8B5CF6,#C084FC);border-image:linear-gradient(180deg,#8B5CF6,#C084FC) 1;border-left:4px solid #8B5CF6;color:var(--g700);text-align:justify;position:relative}
.q-passage b{color:#7C3AED;font-weight:800;background:rgba(139,92,246,.08);padding:1px 3px;border-radius:3px}
.q-passage u{text-decoration-color:#DC2626;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:600}
.q-passage i{color:var(--sub)}

/* Choice buttons */
.choices{display:flex;flex-direction:column;gap:8px}
.c-btn{width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--g200);background:var(--white);font-size:14px;line-height:1.55;cursor:pointer;transition:all .2s var(--ease-snap);color:var(--text);display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;will-change:transform}
.c-btn:active{transform:scale(.97)}
.c-btn .c-n{font-weight:900;color:var(--g400);flex-shrink:0;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:var(--g50);font-size:13px;transition:all .25s var(--ease-spring)}
.c-btn.on{border-color:#8B5CF6;background:linear-gradient(135deg,#F5F3FF,#EDE9FE);box-shadow:0 4px 16px rgba(139,92,246,.15);animation:selectPop .3s var(--ease-spring)}
.c-btn.on .c-n{background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:white;border-radius:10px;transform:scale(1.05)}
@keyframes selectPop{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}

/* ━━ A-Ultimate: Split View Exam — Premium Light ━━ */
.ex-split{display:flex;flex-direction:column;height:calc(100dvh - 80px);overflow:hidden;background:var(--bg);position:relative}

/* Toolbar — refined, subtle */
.ex-toolbar{height:var(--toolbar-h);display:flex;align-items:center;gap:4px;padding:0 12px;background:var(--white);border-bottom:1px solid var(--g100);flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.02)}
.ex-tool-btn{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:30px;height:28px;border:none;background:var(--g50);font-size:12px;cursor:pointer;border-radius:8px;transition:all .2s var(--ease);font-family:inherit}
.ex-tool-btn:active{transform:scale(.88)}
.ex-tool-btn.active{background:linear-gradient(135deg,#8B5CF6,#7C3AED);box-shadow:0 2px 8px rgba(139,92,246,.3)}
.ex-tool-btn.active .ex-tool-icon{filter:brightness(10)}
.ex-tool-icon{font-size:14px;line-height:1}
.ex-nav-fixed{position:absolute;bottom:0;left:0;right:0;padding:6px 12px calc(6px + env(safe-area-inset-bottom));display:flex;gap:6px;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--divider);z-index:10}

/* Passage zone — warm reader */
.ex-passage-zone{flex:0 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 14px;background:var(--passage-bg);min-height:0;max-height:35vh;position:relative}
.ex-passage-zone::-webkit-scrollbar{width:3px}
.ex-passage-zone::-webkit-scrollbar-thumb{background:var(--g300);border-radius:2px}
.ex-passage-zone:empty{display:none}
.ex-passage-zone .q-passage{font-family:var(--passage-font);font-size:var(--passage-size);line-height:var(--passage-lh);color:var(--passage-color);background:none;border:none;border-image:none;border-left:none;padding:0;margin:0;border-radius:0;text-align:justify;word-break:keep-all}
.ex-passage-zone .q-passage b{color:#6D28D9;font-weight:700;background:linear-gradient(transparent 60%,rgba(139,92,246,.1) 60%);padding:0 2px;border-radius:0}
[data-theme="dark"] .ex-passage-zone .q-passage b{color:#A78BFA;background:linear-gradient(transparent 60%,rgba(167,139,250,.15) 60%)}
.ex-passage-zone .q-passage u{text-decoration:none;border-bottom:2px solid #DC2626;padding-bottom:1px;font-weight:600}

/* Passage fade */
.ex-passage-zone::after{content:'';position:sticky;bottom:0;left:0;right:0;display:block;height:28px;background:linear-gradient(transparent,var(--passage-bg));pointer-events:none}

/* Passage collapse */
.ex-passage-collapsed{max-height:0!important;overflow:hidden!important;padding:0!important;flex:0!important;transition:max-height .3s var(--ease),padding .3s var(--ease)}
.ex-collapse-bar{display:flex;align-items:center;justify-content:center;height:30px;background:linear-gradient(180deg,var(--g50),var(--white));cursor:pointer;border-top:1px solid var(--g100);border-bottom:1px solid var(--g100);gap:6px;flex-shrink:0;transition:background .15s}
.ex-collapse-bar:active{background:var(--g100)}
.ex-collapse-bar span{font-size:10px;font-weight:700;color:var(--blue);letter-spacing:.5px}

/* Font size steps */
.ex-font-sm .q-passage{font-size:12.5px!important;line-height:1.7!important}
.ex-font-md .q-passage{font-size:14px!important;line-height:1.85!important}
.ex-font-lg .q-passage{font-size:16px!important;line-height:2!important}

/* Answer zone — premium card feel */
.ex-answer-zone{flex:1 1 auto;min-height:200px;max-height:70vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-top:none;box-shadow:0 -4px 16px rgba(0,0,0,.04)}
.ex-answer-zone::-webkit-scrollbar{width:3px}
.ex-answer-zone::-webkit-scrollbar-thumb{background:var(--g300);border-radius:2px}
.ex-answer-zone .q-card{margin:0 10px 4px;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.03);border:none}
.ex-answer-zone .q-card-header{padding:6px 12px 4px;background:transparent;border-bottom:none}
.ex-answer-zone .q-card-body{padding:2px 12px 10px}
.ex-answer-zone .q-meta{gap:4px}
.ex-answer-zone .q-no{font-size:10px;padding:3px 10px;border-radius:12px}
.ex-answer-zone .q-diff{font-size:9px;padding:2px 6px;border-radius:10px}
.ex-answer-zone .q-pts{font-size:9px;padding:2px 6px;border-radius:8px}
.ex-answer-zone .q-type{font-size:9px;padding:2px 6px;border-radius:8px}
.ex-answer-zone .q-stem{font-size:13.5px;font-weight:800;margin-bottom:8px;letter-spacing:-.2px}
.ex-answer-zone .choices{gap:5px}
.ex-answer-zone .c-btn{padding:7px 10px;border-radius:10px;font-size:12.5px;line-height:1.4;gap:8px;border:1.5px solid var(--g200);box-shadow:none;transition:all .2s var(--ease-snap)}
.ex-answer-zone .c-btn:active{transform:scale(.975)}
.ex-answer-zone .c-btn.on{border-color:var(--blue);background:linear-gradient(135deg,#F9F5FF,#F3EEFF);box-shadow:0 4px 16px rgba(139,92,246,.12),0 0 0 1px rgba(139,92,246,.15)}
.ex-answer-zone .c-btn .c-n{width:22px;height:22px;font-size:10px;border-radius:7px;background:var(--g50);border:1px solid var(--g200);transition:all .25s var(--ease-spring)}
.ex-answer-zone .c-btn.on .c-n{background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:white;border-color:#8B5CF6;transform:scale(1.06);box-shadow:0 2px 8px rgba(139,92,246,.25)}
.ex-answer-zone .w-input{padding:14px 18px;font-size:15px;border-radius:14px;border:1.5px solid var(--g200);box-shadow:0 1px 3px rgba(0,0,0,.02)}
.ex-answer-zone .w-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(139,92,246,.08),0 4px 12px rgba(139,92,246,.06)}
.ex-answer-zone .q-dots{padding:4px 12px 2px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start;gap:3px;scrollbar-width:none}
.ex-answer-zone .q-dots::-webkit-scrollbar{display:none}
.ex-answer-zone .qd{width:22px;height:22px;min-width:22px;border-radius:6px;font-size:9px;box-shadow:none;border:1.5px solid var(--g200)}
.ex-answer-zone .qd.cur{border:none;box-shadow:0 2px 8px rgba(139,92,246,.3);min-width:24px;width:24px;height:24px}
.ex-answer-zone .qd.done{border:1.5px solid rgba(139,92,246,.2);background:var(--blue-l)}

/* No passage → full answer zone */
.ex-split:has(.ex-passage-zone:empty) .ex-answer-zone{flex:1;max-height:none}
.ex-split:has(.ex-passage-zone[style*="display: none"]) .ex-answer-zone,.ex-split:has(.ex-passage-zone[style*="display:none"]) .ex-answer-zone{flex:1;max-height:none}

/* Eliminate mode */
.c-btn-elim{opacity:var(--elim-opacity)!important;text-decoration:line-through;border-style:dashed!important;border-color:var(--g300)!important;background:var(--g50)!important;box-shadow:none!important}
.c-btn-elim .c-n{background:var(--g200)!important;color:var(--g400)!important;text-decoration:line-through}
.c-btn-elim.on{border-color:var(--g300)!important}

/* Highlight marker */
.ex-passage-zone .q-passage mark{background:var(--highlight-yellow);border-radius:2px;padding:0 1px;color:inherit}
.ex-passage-zone .q-passage mark.hl-green{background:var(--highlight-green)}
.ex-passage-zone .q-passage mark.hl-orange{background:var(--highlight-orange)}

/* Score reveal overlay — premium */
.ex-reveal{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--white);transition:opacity .6s var(--ease),transform .6s var(--ease);overflow:hidden}
.ex-reveal.hide{opacity:0;transform:scale(1.03);pointer-events:none}
.ex-reveal-label{font-size:12px;font-weight:700;color:var(--g400);letter-spacing:3px;text-transform:uppercase;opacity:0;transition:opacity .4s .1s}
.ex-reveal-label.show{opacity:1}
.ex-reveal-score{font-size:96px;font-weight:900;font-family:'Inter','Noto Sans KR',sans-serif;letter-spacing:-5px;opacity:0;transform:scale(.3);transition:all .7s var(--ease-spring);line-height:1}
.ex-reveal-score.show{opacity:1;transform:scale(1)}
.ex-reveal-score.pass{background:linear-gradient(135deg,#7C3AED,#8B5CF6,#A78BFA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ex-reveal-score.fail{background:linear-gradient(135deg,#EF4444,#F87171);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ex-reveal-badge{margin-top:16px;padding:8px 24px;border-radius:24px;font-size:14px;font-weight:800;opacity:0;transform:translateY(16px);transition:all .4s .4s var(--ease)}
.ex-reveal-badge.show{opacity:1;transform:translateY(0)}
.ex-reveal-badge.pass{background:linear-gradient(135deg,rgba(139,92,246,.1),rgba(167,139,250,.08));color:#7C3AED;border:1px solid rgba(139,92,246,.15)}
.ex-reveal-badge.fail{background:rgba(239,68,68,.08);color:#EF4444;border:1px solid rgba(239,68,68,.12)}
.ex-reveal-stats{display:flex;gap:24px;margin-top:24px;opacity:0;transform:translateY(12px);transition:all .4s .6s var(--ease)}
.ex-reveal-stats.show{opacity:1;transform:translateY(0)}
.ex-reveal-st{text-align:center}
.ex-reveal-st .v{font-size:20px;font-weight:900;font-family:'Inter',sans-serif}
.ex-reveal-st .v.g{color:var(--green)}.ex-reveal-st .v.r{color:var(--red)}
.ex-reveal-st .l{font-size:10px;color:var(--g400);font-weight:600;margin-top:2px}
.ex-reveal-particle{position:absolute;border-radius:50%;pointer-events:none;animation:revParticle 1.5s ease-out forwards}
@keyframes revParticle{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}
[data-theme="dark"] .ex-reveal{background:var(--bg)}

/* ━━ Result page premium overrides ━━ */
.result-top{background:linear-gradient(165deg,#1E1B4B 0%,#312E81 35%,#4C1D95 70%,#6D28D9 100%)}
.r-sec{border-radius:24px;box-shadow:0 2px 12px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.02)}
.r-sec-h{font-size:15px}
.rev{border-radius:14px;margin-bottom:6px;border:1px solid var(--g100);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.02)}
.rev-h{padding:13px 16px;transition:background .15s}
.rev-h:active{background:var(--g50)}
.rev-h .ri{font-size:15px}
.rev-h .rt{font-size:14px;font-weight:700}
.sheet{border-radius:24px 24px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.08)}

/* Written input */
.w-input{width:100%;padding:16px 20px;border:2px solid var(--g200);border-radius:16px;font-size:16px;font-family:inherit;outline:none;transition:all .25s var(--ease);background:var(--white)}
.w-input:focus{border-color:#8B5CF6;box-shadow:0 0 0 4px rgba(139,92,246,.1),0 4px 12px rgba(139,92,246,.08);background:#FAFAFE}

/* ━━ Result ━━ */
/* Staggered fade-in animation */
@keyframes rFadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.r-anim{opacity:0;animation:rFadeUp .4s var(--ease-out) forwards}

.result-top{text-align:left;padding:20px 20px 24px;position:relative;overflow:hidden;background:linear-gradient(160deg,#1E1B4B 0%,#312E81 40%,#4C1D95 100%);color:white;margin-bottom:-16px;border-radius:0 0 24px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.result-top::before{content:'';position:absolute;top:-80px;right:-80px;width:260px;height:260px;background:radial-gradient(circle,rgba(167,139,250,.25) 0%,transparent 70%);pointer-events:none}
.result-top::after{content:'';position:absolute;bottom:-60px;left:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(192,132,252,.15) 0%,transparent 70%);pointer-events:none}

/* Score ring */
.score-ring{position:relative;width:180px;height:180px;margin:0 auto}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 16px rgba(167,139,250,.4))}
.score-ring .ring-bg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:8}
.score-ring .ring-fill{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.5s var(--ease)}
.score-ring .ring-fill.pass{stroke:url(#scoreGrad)}.score-ring .ring-fill.fail{stroke:#FCA5A5}
.score-inner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.score-num{font-size:56px;font-weight:900;line-height:1;color:white;font-variant-numeric:tabular-nums;letter-spacing:-2px;text-shadow:0 2px 20px rgba(0,0,0,.2)}
.score-num .unit{font-size:20px;color:rgba(255,255,255,.7);font-weight:700}
.pass-badge{display:inline-flex;align-items:center;gap:4px;margin-top:20px;padding:8px 24px;border-radius:24px;font-size:14px;font-weight:800;letter-spacing:.5px}
.pass-badge.y{background:rgba(167,139,250,.25);color:#E9D5FF;border:1px solid rgba(167,139,250,.3);backdrop-filter:blur(8px)}.pass-badge.n{background:rgba(252,165,165,.2);color:#FCA5A5;border:1px solid rgba(252,165,165,.3)}

.r-stats{display:flex;justify-content:center;gap:0;margin-top:28px;padding:0 8px}
.r-stat{flex:1;text-align:center;position:relative;padding:8px 0}
.r-stat+.r-stat::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:1px;background:rgba(255,255,255,.15)}
.r-stat .sv{font-size:24px;font-weight:900;color:white;letter-spacing:-.5px}.r-stat .sl{font-size:10px;color:rgba(255,255,255,.5);margin-top:4px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.r-stat .sv.g{color:#86EFAC}.r-stat .sv.r{color:#FCA5A5}

.r-sec{background:var(--card);border-radius:18px;margin:0 12px 10px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.r-sec:first-of-type{margin-top:-20px;position:relative;z-index:1}
.r-sec-h{font-size:14px;font-weight:900;margin-bottom:12px;color:var(--g900);display:flex;align-items:center;gap:6px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-cell{padding:16px 18px;background:var(--g50);border-radius:16px}.info-cell .ik{font-size:10px;color:var(--hint);font-weight:700;text-transform:uppercase;letter-spacing:.8px}.info-cell .iv{font-size:15px;font-weight:800;margin-top:6px}
.info-cell.hl{background:linear-gradient(135deg,#F5F3FF,#EDE9FE);border:1px solid rgba(139,92,246,.1)}.info-cell.hl .iv{color:#7C3AED}

.lv-card{text-align:center;padding:28px 20px;position:relative;background:linear-gradient(135deg,#F5F3FF,#EDE9FE,#E9D5FF);border-radius:20px;margin:-4px -4px 0}
.lv-card::before{content:'';position:absolute;top:0;right:0;width:100px;height:100px;background:radial-gradient(circle,rgba(139,92,246,.12) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.lv-emoji{font-size:64px;animation:lvFloat 3s ease-in-out infinite;filter:drop-shadow(0 6px 12px rgba(0,0,0,.12))}
@keyframes lvFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.05)}}
.lv-name{font-size:26px;font-weight:900;background:linear-gradient(135deg,#7C3AED,#4C1D95);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:12px}
.lv-range{font-size:12px;color:var(--g500);margin-top:6px;font-weight:600}
.lv-bar{height:8px;background:rgba(139,92,246,.1);border-radius:4px;margin:20px 0 12px;overflow:hidden}
.lv-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#7C3AED,#A78BFA,#C084FC);width:0;transition:width 1s var(--ease);box-shadow:0 0 12px rgba(139,92,246,.3)}
.lv-msg{font-size:14px;color:var(--g600);font-weight:600}

.type-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.type-row .tl{min-width:60px;font-size:12px;font-weight:700;color:var(--g700);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.type-row .bar{flex:1;height:8px;background:var(--g100);border-radius:4px;overflow:hidden}
.type-row .fill{height:100%;border-radius:4px;width:0;transition:width .8s var(--ease)}
.type-row .tp{min-width:44px;font-size:12px;font-weight:800;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{padding:6px 14px;border-radius:16px;font-size:12px;font-weight:700}
.tag.g{background:var(--green-l);color:var(--green);border:1px solid rgba(0,192,114,.15)}.tag.r{background:var(--red-l);color:var(--red);border:1px solid rgba(240,68,82,.15)}

.plan{display:flex;gap:16px;padding:16px;background:var(--g50);border-radius:var(--r-md);align-items:center}
.plan-i{font-size:24px;flex-shrink:0}.plan h4{font-size:14px;font-weight:700}.plan p{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.5}

.act-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:10px}
.act{padding:18px 4px 14px;border-radius:18px;background:var(--white);text-align:center;transition:all .15s var(--ease-snap);font-family:inherit;border:1.5px solid var(--g100);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.act:active{transform:scale(.93);background:var(--g50)}
.act.primary{background:linear-gradient(135deg,#7C3AED,#6D28D9);color:white;border:none;box-shadow:0 4px 16px rgba(124,58,237,.3)}
.act .ai{font-size:24px;display:block;margin-bottom:8px}.act .al{font-size:11px;font-weight:700;display:block;color:var(--g500)}
.act.primary .al{color:rgba(255,255,255,.8)}

/* Review accordion */
.rev{border:1px solid var(--g100);border-radius:var(--r-md);margin-bottom:5px;overflow:hidden;transition:box-shadow .2s}
.rev:has(.rev-b.open){box-shadow:0 2px 8px rgba(0,0,0,.04)}
.rev-h{padding:10px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--white);transition:background .15s}
.rev-h:active{background:var(--g50)}
.rev-h .ri{font-size:14px;flex-shrink:0}.rev-h .rt{flex:1;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rev-h .rp{font-size:12px;color:var(--hint);flex-shrink:0;font-weight:600}.rev-h .ra{font-size:11px;color:var(--hint);transition:transform .25s var(--ease);flex-shrink:0}
.rev-b{max-height:0;overflow:hidden;transition:max-height .45s var(--ease),padding .3s var(--ease);padding:0 16px}
.rev-b.open{max-height:8000px;padding:16px}
.ans-cmp{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;position:relative}
.ans-box{flex:1;padding:14px;border-radius:var(--r-md);text-align:center;font-weight:800;font-size:15px;min-width:0}
.ans-box .label{font-size:11px;font-weight:600;opacity:.7;margin-bottom:4px}
.ans-box.ok{background:var(--green-l);color:var(--green);border:1px solid rgba(0,192,114,.12)}.ans-box.no{background:var(--red-l);color:var(--red);border:1px solid rgba(240,68,82,.12)}.ans-box.cor{background:var(--green-l);color:var(--green);border:1px solid rgba(0,192,114,.12)}
/* ━━ 오류 신고 버튼 ━━ */
.rpt-big-btn{width:100%;padding:12px;margin-bottom:10px;border:1.5px solid rgba(240,68,82,.25);border-radius:var(--r-md);background:var(--red-l);color:var(--red);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s var(--ease);text-align:center}
.rpt-big-btn:active,.rpt-big-btn.active{background:var(--red);color:white;border-color:var(--red)}
.rpt-panel{width:100%;padding:10px 0 0;animation:fadeSlideUp .2s var(--ease)}
.rpt-panel-title{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:6px}
.rpt-cats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rpt-cat{padding:10px 8px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--card);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--text);transition:all .15s var(--ease);text-align:center}
.rpt-cat:active{background:var(--red-l);border-color:var(--red);color:var(--red);transform:scale(.97)}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ━━ 이해됐어요/모르겠어요 ━━ */
.understand-row{padding:10px 0;border-top:1px solid var(--divider);margin-top:8px;display:flex;flex-direction:column;gap:6px}
.understand-label{font-size:11px;font-weight:700;color:var(--sub)}
.understand-btns{display:flex;gap:6px}
.understand-btn{flex:1;padding:10px 8px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--card);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--text);transition:all .15s var(--ease)}
.understand-btn.on{background:var(--green-l);border-color:var(--green);color:var(--green)}
.understand-btn.no.on{background:var(--yellow-l);border-color:var(--yellow);color:#D97706}
.understand-btn:active{transform:scale(.97)}
/* ━━ Result segment control (iOS style) ━━ */
.res-tabs{display:flex;gap:4px;padding:4px;margin:0 16px 16px;background:var(--g100);border-radius:var(--r-md);position:relative}
.res-tab{flex:1;padding:9px 0;border:none;background:none;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;border-radius:calc(var(--r-md) - 2px);transition:all .25s var(--ease);position:relative;z-index:1}
.res-tab.on{color:var(--blue);background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.res-tab:active{transform:scale(.97)}
[data-theme="dark"] .res-tabs{background:var(--g200)}
[data-theme="dark"] .res-tab.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.3)}
[data-theme="dark"] .ox-card{box-shadow:0 2px 6px rgba(0,0,0,.3)}
[data-theme="dark"] .ox-card .ox-icon{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3)}
[data-theme="dark"] .rpt-big-btn{background:rgba(240,68,82,.15);border-color:rgba(240,68,82,.2)}
[data-theme="dark"] .rpt-cat{background:var(--card);border-color:var(--border)}
[data-theme="dark"] .understand-btn{background:var(--card);border-color:var(--border)}
[data-theme="dark"] .share-float{box-shadow:0 4px 20px rgba(139,92,246,.5)}
[data-theme="dark"] .res-bottom-bar{background:rgba(17,17,17,.9)}
[data-theme="dark"] .ex-tool-btn{background:var(--g200)}
/* ━━ Tab body slide animation ━━ */
.res-tab-body{padding:0 0 8px;animation:tabSlideIn .3s var(--ease)}
@keyframes tabSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ━━ O/X card grid ━━ */
.ox-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.ox-grid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:10px}
.ox-card{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:white;cursor:pointer;transition:all .15s var(--ease);box-shadow:0 1px 4px rgba(0,0,0,.08);position:relative}
.ox-card:active{transform:scale(.88)}
.ox-card.ok{background:linear-gradient(135deg,#34D399,#10B981)}
.ox-card.wrong{background:linear-gradient(135deg,#F87171,#EF4444)}
.ox-card.skip{background:var(--g300);color:var(--g600)}
.ox-card .ox-icon{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;font-size:6px;display:flex;align-items:center;justify-content:center;background:white;box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* ━━ Floating share button ━━ */
.share-float{position:fixed;bottom:76px;right:16px;width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:white;font-size:22px;cursor:pointer;box-shadow:0 4px 20px rgba(139,92,246,.4);z-index:51;display:flex;align-items:center;justify-content:center;animation:floatPulse 2s var(--ease) infinite;transition:transform .15s var(--ease)}
.share-float:active{transform:scale(.9);animation:none}
@keyframes floatPulse{0%,100%{box-shadow:0 4px 20px rgba(139,92,246,.4)}50%{box-shadow:0 4px 30px rgba(139,92,246,.6),0 0 0 8px rgba(139,92,246,.1)}}
/* ━━ Result bottom bar ━━ */
.res-bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--nav-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--divider);display:flex;gap:8px;z-index:50}
.res-bottom-btn{flex:1;padding:13px;border-radius:var(--r-md);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s var(--ease)}
.res-bottom-btn.ghost{border:1.5px solid var(--border);background:var(--card);color:var(--text)}
.res-bottom-btn.primary{border:none;background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:white;box-shadow:0 4px 16px rgba(139,92,246,.25)}
.res-bottom-btn:active{transform:scale(.97)}
/* ━━ Lottie-style animations ━━ */
@keyframes lottieConfetti{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0}}
@keyframes lottieStar{0%{transform:scale(.3) rotate(-30deg);opacity:0}50%{opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}
/* ━━ Selection ripple effect ━━ */
.c-btn.on::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(139,92,246,.15) 0%,transparent 70%);animation:rippleOut .5s var(--ease);pointer-events:none}
@keyframes rippleOut{from{opacity:1;transform:scale(.8)}to{opacity:0;transform:scale(1.6)}}
/* ━━ Counting animation ━━ */
.count-up{display:inline-block;animation:countPop .4s var(--ease-spring)}
.det-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 12px;border-radius:8px;margin-bottom:6px;letter-spacing:.3px}
.det-tag.b{background:var(--blue-l);color:var(--blue)}.det-tag.g{background:var(--g100);color:var(--sub)}
.det-box{font-size:13px;line-height:1.9;padding:14px 18px;background:var(--g50);border-radius:var(--r-md);margin-bottom:10px;word-break:keep-all}
.det-box.hl{border-left:3px solid var(--blue);background:linear-gradient(135deg,var(--blue-xl),rgba(243,238,255,.4));font-family:var(--passage-font);font-size:14px;line-height:2.0}

/* Confetti canvas */
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}

/* Toast — Toss style */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--g900);color:white;padding:13px 26px;border-radius:26px;font-size:14px;font-weight:700;opacity:0;transition:all .25s var(--ease-spring);z-index:1000;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.18);white-space:nowrap;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.modal-box{background:var(--white);border-radius:24px;padding:32px 24px 24px;max-width:320px;width:100%;text-align:center;box-shadow:0 12px 48px rgba(0,0,0,.15),0 4px 16px rgba(0,0,0,.08);animation:modalPop .25s var(--ease-spring)}
@keyframes modalPop{from{transform:scale(.88);opacity:0}}

/* Bottom Sheet */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--white);border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%;max-width:480px;padding:8px 20px calc(24px + env(safe-area-inset-bottom));animation:sheetUp .3s var(--ease-snap)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sheet-bar{width:36px;height:4px;background:var(--g300);border-radius:2px;margin:8px auto 24px}

/* ━━ Tab Bar ━━ */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--nav-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);z-index:200;padding:6px 0 calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--divider)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:none;background:none;cursor:pointer;transition:transform .1s var(--ease-snap);-webkit-tap-highlight-color:transparent}
.tab-item:active{transform:scale(.88)}
.tab-icon{font-size:22px;line-height:1;transition:transform .2s var(--ease-spring)}
.tab-label{font-size:10px;font-weight:600;color:var(--hint);transition:color .2s var(--ease)}
.tab-item.active .tab-icon{transform:scale(1.1)}
.tab-item.active .tab-label{color:var(--blue);font-weight:700}
.tab-spacer{height:calc(72px + env(safe-area-inset-bottom))}

/* ━━ Toss Micro Animations ━━ */
/* Staggered card reveal */
.reveal{opacity:0;transform:translateY(12px);transition:opacity .25s var(--ease-out),transform .25s var(--ease-out)}
.reveal.show{opacity:1;transform:translateY(0)}

/* Tab icon bounce */
@keyframes tabBounce{0%{transform:scale(1)}25%{transform:scale(1.3) translateY(-2px)}55%{transform:scale(.93)}100%{transform:scale(1.1)}}
.tab-bounce .tab-icon{animation:tabBounce .3s var(--ease-spring)}

/* Number count-up — handled in JS */

/* Correct answer spring */
@keyframes springCheck{0%{transform:scale(0) rotate(-45deg);opacity:0}50%{transform:scale(1.3) rotate(0deg)}70%{transform:scale(.9)}100%{transform:scale(1);opacity:1}}
.spring-check{animation:springCheck .5s var(--ease)}

/* Wrong answer shake */
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.shake{animation:shake .4s var(--ease)}

/* Scale pop (badges, icons) */
@keyframes scalePop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.scale-pop{animation:scalePop .4s var(--ease) forwards;opacity:0}

/* ━━ Flashcard ━━ */
.fc-container{position:relative;height:320px;display:flex;align-items:center;justify-content:center;margin:0 20px;perspective:800px}
.fc-card{width:100%;max-width:340px;height:280px;border-radius:var(--r-xl);background:var(--card);box-shadow:var(--sh-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;position:absolute;touch-action:pan-y;user-select:none;cursor:grab;transition:transform .15s var(--ease-snap),opacity .15s;will-change:transform}
.fc-card:active{cursor:grabbing}
.fc-word{font-size:32px;font-weight:900;color:var(--text);line-height:1.3}
.fc-meaning{font-size:18px;color:var(--sub);margin-top:12px;font-weight:600}
.fc-hint{position:absolute;bottom:20px;font-size:12px;color:var(--hint);font-weight:500}
.fc-label{position:absolute;top:20px;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;opacity:0;transition:opacity .15s}
.fc-label.know{right:20px;background:var(--green-l);color:var(--green)}
.fc-label.dunno{left:20px;background:var(--red-l);color:var(--red)}
.fc-progress{display:flex;justify-content:center;gap:4px;margin:16px 20px 0}
.fc-dot{width:8px;height:8px;border-radius:4px;background:var(--g200);transition:all .2s var(--ease-snap)}
.fc-dot.done{background:var(--green)}.fc-dot.miss{background:var(--red)}.fc-dot.cur{background:var(--blue);width:20px}

/* ━━ Speed Quiz ━━ */
.sq-timer{width:100%;height:6px;background:var(--g100);border-radius:3px;overflow:hidden;margin:0 20px}
.sq-timer-fill{height:100%;background:var(--blue);border-radius:3px;transition:width .1s linear}
.sq-timer-fill.warn{background:var(--yellow)}
.sq-timer-fill.danger{background:var(--red)}
.sq-word{font-size:36px;font-weight:900;color:var(--text);text-align:center;padding:40px 20px;animation:sqPop .2s var(--ease-spring)}
@keyframes sqPop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.sq-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.sq-btn{padding:18px 12px;border-radius:var(--r-lg);border:1.5px solid var(--border);background:var(--card);font-size:15px;font-weight:600;text-align:center;cursor:pointer;transition:all .1s var(--ease-snap);will-change:transform;color:var(--text)}

/* ━━ Runner Game ━━ */
.game-canvas{width:100%;height:200px;border-radius:var(--r-lg);background:var(--white);display:block;touch-action:none}
.sq-btn:active{transform:scale(.95)}
.sq-btn.correct{border-color:var(--green);background:var(--green-l);color:var(--green)}
.sq-btn.wrong{border-color:var(--red);background:var(--red-l);color:var(--red)}

/* Responsive */
@media(max-width:380px){.act-grid{flex-wrap:wrap}.info-grid{grid-template-columns:1fr}.score-num{font-size:56px}}

/* ━━ Character & Level Grade System ━━ */
.char-card{position:relative;margin:16px 20px 0;border-radius:var(--r-xl);padding:28px 24px;overflow:hidden;transition:background .5s}
.char-card-normal{background:linear-gradient(135deg,#8B5CF6 0%,#7C3AED 50%,#6D28D9 100%)}
.char-card-warn{background:linear-gradient(135deg,#F59E0B 0%,#D97706 50%,#B45309 100%)}
.char-card-danger{background:linear-gradient(135deg,#EF4444 0%,#DC2626 50%,#B91C1C 100%)}
.char-card-cram{background:linear-gradient(135deg,#EF4444 0%,#DC2626 100%);animation:cramPulse 2s ease-in-out infinite}
@keyframes cramPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 20px 4px rgba(239,68,68,.3)}}
.char-card::before{content:'';position:absolute;top:-30px;right:-30px;width:140px;height:140px;background:rgba(255,255,255,.07);border-radius:50%}
.char-card::after{content:'';position:absolute;bottom:-20px;left:-20px;width:100px;height:100px;background:rgba(255,255,255,.04);border-radius:50%}

/* Avatar ring grades */
.avatar-ring{position:relative;width:72px;height:72px;flex-shrink:0}
.avatar-ring img{width:64px;height:64px;border-radius:50%;position:absolute;top:4px;left:4px;background:#f0f0f0}
.avatar-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid transparent}
.avatar-ring.grade-bronze::before{border-color:#CD7F32}
.avatar-ring.grade-silver::before{border-color:#C0C0C0}
.avatar-ring.grade-gold::before{border-color:#FFD700;box-shadow:0 0 8px rgba(255,215,0,.3)}
.avatar-ring.grade-diamond::before{border-color:#00BFFF;box-shadow:0 0 12px rgba(0,191,255,.4)}
.avatar-ring.grade-master::before{border-color:#8B5CF6;box-shadow:0 0 16px rgba(139,92,246,.5);animation:masterGlow 2s ease-in-out infinite}
@keyframes masterGlow{0%,100%{box-shadow:0 0 12px rgba(139,92,246,.4)}50%{box-shadow:0 0 24px rgba(139,92,246,.7)}}

/* Speech bubble */
.speech-bubble{position:relative;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:12px 16px;margin-top:14px;color:white;font-size:13px;font-weight:600;line-height:1.5;animation:bubbleFade .5s var(--ease-out)}
.speech-bubble::before{content:'';position:absolute;top:-6px;left:24px;width:12px;height:12px;background:rgba(255,255,255,.18);transform:rotate(45deg);border-radius:2px}
@keyframes bubbleFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* D-day urgency badge */
.dday-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:800;animation:ddayPop .3s var(--ease-spring)}
.dday-safe{background:rgba(255,255,255,.2);color:white}
.dday-warn{background:rgba(245,158,11,.3);color:#FDE68A}
.dday-danger{background:rgba(239,68,68,.3);color:#FCA5A5;animation:ddayPop .3s var(--ease-spring),ddayBlink 1.5s ease-in-out infinite}
@keyframes ddayPop{from{transform:scale(.8)}to{transform:scale(1)}}
@keyframes ddayBlink{0%,100%{opacity:1}50%{opacity:.7}}

/* Mission card */
.mission-item{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--divider);transition:background .15s}
.mission-item:last-child{border-bottom:none}
.mission-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--g300);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .2s}
.mission-check.done{background:var(--green);border-color:var(--green);color:white}
.mission-xp{font-size:11px;font-weight:800;color:var(--blue);background:var(--blue-l);padding:2px 8px;border-radius:8px;white-space:nowrap}

/* Weakness recommendation */
.weak-card{background:linear-gradient(135deg,var(--red-l),var(--yellow-l));border:1px solid var(--red);border-radius:var(--r-lg);margin:0 20px 10px;padding:16px 20px;position:relative;overflow:hidden}
[data-theme="dark"] .weak-card{background:linear-gradient(135deg,#3D1A1E,#2E2510);border-color:rgba(240,68,82,.3)}
.weak-card::after{content:'🎯';position:absolute;top:-5px;right:10px;font-size:40px;opacity:.1}

/* Level up celebration overlay */
.levelup-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:overlayIn .3s var(--ease-out)}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.levelup-modal{background:var(--card);border-radius:24px;padding:40px 32px;text-align:center;max-width:320px;width:90%;position:relative;overflow:hidden;animation:modalPop .5s var(--ease-spring)}
@keyframes modalPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.levelup-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.levelup-particle{position:absolute;width:8px;height:8px;border-radius:50%;animation:particleFall 1.5s ease-out forwards}
@keyframes particleFall{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(120px) scale(0)}}

/* Ranking widget */
.rank-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--divider)}
.rank-row:last-child{border-bottom:none}
.rank-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0}
.rank-1{background:linear-gradient(135deg,#FFD700,#FFA500);color:white}
.rank-2{background:linear-gradient(135deg,#C0C0C0,#A0A0A0);color:white}
.rank-3{background:linear-gradient(135deg,#CD7F32,#A0522D);color:white}
.rank-n{background:var(--g100);color:var(--sub)}
.rank-me{background:var(--blue-l);border-radius:var(--r-md);margin:0 -20px;padding:12px 20px}

/* Unseen test warning */
.unseen-warn{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--red-l);border-radius:var(--r-md);margin-top:10px;animation:warnSlide .4s var(--ease-out)}
[data-theme="dark"] .unseen-warn{background:rgba(240,68,82,.15)}
@keyframes warnSlide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
</style>

<body>
<div class="app" id="app"></div>
<div class="bottom-fix" id="bottomBar" style="display:none"></div>
<div class="tab-bar" id="tabBar" style="display:none">
  <button class="tab-item active" onclick="switchTab('home')" id="tab_home"><span class="tab-icon">🏠</span><span class="tab-label">홈</span></button>
  <button class="tab-item" onclick="switchTab('learn')" id="tab_learn"><span class="tab-icon">⚡</span><span class="tab-label">학습</span></button>
  <button class="tab-item" onclick="switchTab('record')" id="tab_record"><span class="tab-icon">📊</span><span class="tab-label">기록</span></button>
  <button class="tab-item" onclick="switchTab('my')" id="tab_my"><span class="tab-icon">👤</span><span class="tab-label">마이</span></button>
</div>
<div id="toast"></div>
<canvas id="confetti"></canvas>
<script>
// ━━ Supabase REST API (랭킹) ━━
const SB_URL='https://enkewpvhaugcmyglifkc.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVua2V3cHZoYXVnY215Z2xpZmtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0OTQzMjksImV4cCI6MjA4OTA3MDMyOX0.JJvDYNbxSnsaE30tMFl5x1Daqyx2Wk8bQv6s19tNrY8';
async function sbInsert(table,row){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(row)});
    return r.ok;
  }catch(e){console.warn('DB insert fail:',e);return false;}
}
async function sbSelect(table,query){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/${table}?${query}`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    if(!r.ok)return[];return await r.json();
  }catch(e){console.warn('DB select fail:',e);return[];}
}

// ━━ URL 파라미터에서 학생 정보 파싱 (대시보드에서 열 때) ━━
const _urlParams = new URLSearchParams(window.location.search);
const _studentId = _urlParams.get('studentId') || null;
const _weekIdx = _urlParams.get('week') !== null ? parseInt(_urlParams.get('week')) : null;

// ━━ 테스트 완료 시 학생 wd에 점수 자동 저장 ━━
async function saveScoreToStudentWd(testType, score) {
  if (!_studentId || _weekIdx === null || isNaN(_weekIdx)) return;
  const fieldMap = { '단어테스트': 'vocab', '워크북테스트': 'workbook', '퀴즈테스트': 'quiz' };
  const field = fieldMap[testType];
  if (!field) return;
  try {
    // 1) 현재 wd 읽기
    const rows = await sbSelect('students', `select=wd&id=eq.${_studentId}`);
    if (!rows.length || !rows[0].wd) return;
    const wd = rows[0].wd;
    if (_weekIdx >= wd.length) return;
    // 2) 점수 업데이트
    const passField = field === 'vocab' ? 'vocabPass' : field === 'workbook' ? 'wbPass' : 'quizPass';
    wd[_weekIdx][field] = score;
    wd[_weekIdx][passField] = score >= 80;
    // 3) DB에 저장
    await fetch(`${SB_URL}/rest/v1/students?id=eq.${_studentId}`, {
      method: 'PATCH',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ wd, updated_at: new Date().toISOString() })
    });
    console.log(`✅ wd[${_weekIdx}].${field} = ${score} 저장 완료`);
  } catch (e) { console.warn('wd 저장 실패:', e); }
}

// Save per-question results to DB (for accuracy anomaly detection)
async function saveQuestionResults(det){
  const p=profile;const scopeStr=(S.sel&&S.sel.length)?S.sel.join(','):'';
  if(!p.name||!scopeStr||!det||!det.length)return;
  // Batch insert: 20문항씩 나눠서 전송 (한번에 너무 많으면 실패 가능)
  const rows=det.map((d,i)=>({
    student_name:p.name,
    school:p.school||'',
    scope:scopeStr,
    test_type:S.tt||'',
    question_index:i+1,
    question_type:d.q.type||'',
    question_stem:(d.q.stem||'').slice(0,200),
    correct_ans:String(d.q.ans||''),
    student_answer:d.ua!==undefined?String(d.ua):'',
    is_correct:!!d.ok
  }));
  for(let i=0;i<rows.length;i+=20){
    const batch=rows.slice(i,i+20);
    try{
      await fetch(`${SB_URL}/rest/v1/question_results`,{
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify(batch)
      });
    }catch(e){/* silent */}
  }
}

// Save test score to DB
async function saveScoreToDB(score,ok,no,timeSec){
  const p=profile;const xd=getXP();
  const scopeStr=(S.sel&&S.sel.length)?S.sel.join(','):'';
  if(!p.name||!scopeStr)return;
  await sbInsert('test_scores',{
    student_name:p.name,
    school:p.school||'',
    grade:p.grade||'',
    scope:scopeStr,
    test_type:S.tt||'',
    score,ok,no,time_sec:timeSec,
    level:xd.lv,
    level_name:lvName(xd.lv)
  });
}

// Fetch weekly ranking for a scope
async function fetchWeeklyRanking(scope){
  const weekAgo=new Date(Date.now()-7*86400000).toISOString();
  // Get best score per student for this scope this week
  const rows=await sbSelect('test_scores',
    `scope=eq.${encodeURIComponent(scope)}&created_at=gte.${weekAgo}&order=score.desc&limit=50`
  );
  // Dedupe by student_name, keep best score
  const best={};
  rows.forEach(r=>{
    if(!best[r.student_name]||r.score>best[r.student_name].score)best[r.student_name]=r;
  });
  return Object.values(best).sort((a,b)=>b.score-a.score);
}

const FALLBACK_FULL_PASSAGE=`Be Proud of Who You Are
Laura Thompson

Let me start by asking you a question. Have you ever asked yourself whether you made a good impression on someone you just met? In fact, most people believe they make a worse impression than they actually do. Researchers performed an experiment where students were paired up for five-minute ice breaking conversations. They were then asked to rate how much they liked their partners. Additionally, researchers asked participants if they thought their partners liked them. Most participants' estimations of their partners' responses were pessimistic, which were opposite to the real responses. It turns out that participants do not make bad impressions but make better impressions than they think.

"Giving Up" Has No Place in My Dictionary!
Jake Miller
Hello, everyone! Thank you for your warm welcome. It's good to be back home, but I'm visiting you today not to perform but to talk to you about my life as a musician. Last year, after 20 years of hard work, I finally signed my first record company contract. I'd like to tell you a hopeful story and give some insight into the hard work that I had to put in.

The funny thing was whenever anyone asked me to play a song for them, I would be so happy. Although my dream was to record an album, the reality was I probably wouldn't make it. Then one day, I looked at the picture of The Old Guitarist on my wall. I suddenly remembered what my grandfather had told me about Picasso: only a tiny fraction of the thousands of artworks he created during his lifetime are recognized by the public. Then I thought of my grandfather and how he loved playing, practicing his art his entire life, even without fame. I realized the only way to become an old guitarist like him was to keep playing.

{id:3,type:`(A)(B)(C) 조합형`,diff:`어려움`,pts:6,fmt:"mc",ans:4,ch:[`(A) mismatch — (B) overestimate — (C) prevent`,`(A) agreement — (B) underestimate — (C) encourage`,`(A) mismatch — (B) underestimate — (C) encourage`,`(A) agreement — (B) overestimate — (C) prevent`,`(A) mismatch — (B) underestimate — (C) prevent`],passage:`The researchers coined a new term, the 'liking gap,' for this difference in perception or the (A)[<b>mismatch / agreement</b>] between how we perceive ourselves and what others actually think of us. We often (B)[<b>underestimate / overestimate</b>] ourselves based on our assumption of how others might judge us. In other words, our fixed attitudes may (C)[<b>prevent / encourage</b>] us from reaching our true potential.`,stem:`다음 글의 (A), (B), (C)의 각 괄호 안에서 문맥에 맞는 표현으로 가장 적절한 것은?`,det:{korean:`연구자들은 이러한 인식의 차이 또는 우리가 우리 자신을 어떻게 인식하는지와 다른 사람들이 실제로 우리를 어떻게 생각하는지 간의 <b>불일치</b>에 대해 '호감 격차'라는 새로운 용어를 만들었습니다. 우리는 흔히 다른 사람이 우리를 어떻게 판단할지에 대한 추정에 근거하여 우리 자신을 <b>과소평가</b>합니다. 다시 말해, 우리의 고정된 태도는 우리가 진정한 잠재력에 도달하는 것을 <b>막을</b> 수 있습니다.`,analysis:`✅ ⑤ mismatch–underestimate–prevent: '불일치', 자신을 '과소평가', 잠재력 도달을 '막는다' ❌ ① overestimate는 underestimate여야 함 ❌ ② agreement+encourage 모두 반대 ❌ ③ encourage는 prevent여야 함 ❌ ④ agreement는 mismatch여야 함`,tip:`liking gap의 핵심: 자기 인식과 타인의 실제 평가 사이의 '불일치(mismatch)'이며, 우리는 자신을 '과소평가(underestimate)'하는 경향이 있습니다.`}},
