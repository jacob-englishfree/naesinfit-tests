<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내신핏 테스트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'Pretendard', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0A0A0F 0%, #1a1a2e 100%); color: #fff; }
    .box { text-align: center; padding: 2rem; max-width: 400px; }
    .logo { font-size: 32px; font-weight: 900; background: linear-gradient(135deg, #7C3AED, #00F5A0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
    .msg { font-size: 15px; color: #B0B8C4; line-height: 1.6; margin-bottom: 24px; }
    .msg b { color: #fff; }
    .info { font-size: 13px; color: #6B7280; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">내신핏</div>
    <p class="msg">테스트는 <b>내신핏 학습 대시보드</b>에서 바로 응시할 수 있습니다.</p>
    <div class="info">
      카카오톡으로 받은 <b>내 대시보드 링크</b>를 눌러주세요.<br>
      대시보드 → 미션 → 테스트 버튼 클릭
    </div>
  </div>
</body>
</html>
