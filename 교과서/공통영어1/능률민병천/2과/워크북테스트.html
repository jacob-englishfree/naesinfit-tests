<html lang="ko">
<head>

<style>

:root{--o:#7C3AED;--od:#5B21B6;--ol:#A78BFA;--oxl:#F3F0FF;--oxxl:#FAF5FF;--bg:#F5F3FF;--text:#1E1B18;--tm:#6B6560;--tl:#A09890;--g:#1A9960;--gl:#E6F9F0;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--p:#7C4DFF;--pl:#F3EEFF;--sky:#0EA5E9;--skyl:#E8F6FF;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s cubic-bezier(.4,0,.2,1);}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,#F3F0FF,#EDE7F6 40%,#E8E0F6);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--warn),#6D28D9);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--od),var(--warn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--warn),#6D28D9);padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f0edf5;}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid #d8d0e8;border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid #c8c0d8;border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--warn);box-shadow:0 0 0 4px rgba(124,58,237,.1);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;box-shadow:0 6px 20px rgba(124,58,237,.3);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid #c0b8d8;color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--warn);color:var(--warn);}
.history-badge{background:var(--oxl);color:var(--warn);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid #d8d0e8;border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--warn);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--warn);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--warn);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--warn);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
/* Progress bar at top */
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--warn),#6D28D9);transition:width .5s ease;border-radius:0 2px 2px 0;}
/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
/* Passage area - full screen scrollable */
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
/* Question info badge at top of passage */
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--oxl),var(--ol));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--od);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
/* Glass bottom panel */
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:12px 16px 16px;max-height:48vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
/* Stem */
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
/* Choices - premium feel */
.slide-choices{display:flex;flex-direction:column;gap:4px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;line-height:1.4;border:1.5px solid rgba(0,0,0,.06);border-radius:12px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--warn);background:rgba(124,58,237,.08);box-shadow:0 0 0 3px rgba(124,58,237,.12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 rgba(124,58,237,.3)}70%{box-shadow:0 0 0 8px rgba(124,58,237,0)}100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:24px;height:24px;font-size:11px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;}
/* Written input */
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--warn);box-shadow:0 0 0 3px rgba(124,58,237,.1);}
/* Navigation */
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(124,58,237,.25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--warn);}
/* Answer count indicator */
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--warn);background:var(--oxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--ol);color:#4A148C;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f0edf5;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--warn);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:linear-gradient(135deg,#FAFAFF,#F5F3FA);border-left:3px solid var(--warn);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid #d8d0e8;border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--warn);}.choice-btn.selected{border-color:var(--warn);box-shadow:0 0 0 2px rgba(124,58,237,.12);background:var(--oxxl);}
.c-num{min-width:22px;height:22px;background:#e8e0f0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid #c8c0d8;border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--warn);}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--oxl),var(--ol));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--od),var(--warn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8e0f0;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--warn),var(--ol));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--oxxl);border-radius:var(--rs);border:1px solid #d8d0e8;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--oxl);}.info-cell.highlight .ic-value{color:var(--warn);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0f0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--ol);color:var(--warn);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--oxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #c8c0d8;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--warn);color:var(--warn);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #d8d0e8;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--oxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--oxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--ol);color:var(--warn);}.expl-tag.tip{background:var(--oxl);color:var(--od);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--warn);}.expl-box.tip-b{border-left:3px solid var(--warn);background:var(--oxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>

<div class="toast" id="toast"></div>
<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">📚 내신핏</div>

  <div class="info-card"><div class="info-card-header">📚 시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">과목</span><span class="info-value">능률(민병천)</span></div>

</div>

<script>
const EI={subject:'공통영어1',pub:'능률(민병천)',lesson:'2과',title:'능률(민병천) 2과',total:100,time:1200,histKey:'quizH_NE2',qCount:30};

const Q=[
{id:1,type:`어법`,diff:`쉬움`,pts:3,fmt:`mc`,note:`문장01`,
passage:``,
stem:`다음 괄호 안에서 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">My grandparents <b>[① sell / ② sells]</b> their delicious organic jam at the local market every weekend.</div>`,
ch:['① sell','② sells'],ans:0,
det:{ref:`[원문] My grandparents sell their delicious organic jam at the local market every weekend.\n[해석] 나의 조부모님은 매주 주말 지역 시장에서 맛있는 유기농 잼을 판매하신다. [문장 01 참고]`,
correct:`주어 My grandparents는 복수 주어이므로 동사는 복수형 sell이 적절하다. 3인칭 단수 현재형 sells는 주어가 he/she/it 등 단수일 때만 사용한다.`,
wrongs:['① sell ✅ — 복수 주어(grandparents)에 맞는 동사 원형','② sells ❌ — 3인칭 단수 주어에만 사용; 복수 주어에는 부적절'],
tip:`💡 주어-동사 수일치\n• 복수 주어 → 동사 원형 (They sell)\n• 단수 주어 → 동사+s (She sells)\n\n⚠️ 함정\n• every weekend는 부사구로 주어의 수에 영향 없음`}},

{id:2,type:`어휘`,diff:`쉬움`,pts:3,fmt:`mc`,note:`문장01`,
passage:``,
stem:`다음 괄호 안에서 문맥상 알맞은 단어를 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">My grandparents sell their <b>[① delicious / ② deliberate]</b> organic jam at the local market every weekend.</div>`,
ch:['① delicious','② deliberate'],ans:0,
det:{ref:`[원문] My grandparents sell their delicious organic jam at the local market every weekend.\n[해석] 나의 조부모님은 매주 주말 지역 시장에서 맛있는 유기농 잼을 판매하신다. [문장 01 참고]`,
correct:`organic jam(유기농 잼)을 수식하는 형용사로 "맛있는"을 뜻하는 delicious가 문맥에 적절하다.`,
wrongs:['① delicious ✅ — 맛있는; 잼의 맛을 수식하기에 적절','② deliberate ❌ — 의도적인, 고의적인; 잼의 특성과 무관'],
tip:`💡 어휘 구별\n• delicious: 맛있는 (음식 관련)\n• deliberate: 의도적인, 신중한\n\n⚠️ 주의\n• 철자가 비슷해 혼동하기 쉬우나 의미가 전혀 다름`}},

{id:3,type:`연결사`,diff:`보통`,pts:3,fmt:`written`,note:`문장03`,
passage:`I went to help them last weekend. ( ___ ), they had already sold all of their jam!`,
stem:`위 지문의 빈칸에 알맞은 연결사를 쓰시오. (1단어, 영문 7자, H로 시작)`,
wa:"However",accept:["However","however","HOWEVER"],
det:{ref:`[원문] However, they had already sold all of their jam!\n[해석] 그러나 그들은 이미 잼을 모두 팔아 버렸다! [문장 03 참고]`,
correct:`"도와주러 갔다"와 "이미 다 팔았다"는 대조/역접 관계이므로 However(그러나)가 적절하다.`,
wrongs:[],
tip:`💡 역접 연결사\n• However = 그러나 (문장 앞, 콤마 필수)\n• Nevertheless = 그럼에도 불구하고\n\n⚠️ 함정\n• But은 등위접속사로 문장 앞에 단독 사용 시 비격식적`}},

{id:4,type:`어법`,diff:`보통`,pts:4,fmt:`mc`,note:`문장03`,
passage:``,
stem:`다음 밑줄 친 부분 중 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">I went to help them last weekend. However, they ______ all of their jam!</div>`,
ch:['① have already sold','② has already sold','③ had already sold','④ already sold','⑤ were already selling'],ans:2,
det:{ref:`[원문] However, they had already sold all of their jam!\n[해석] 그러나 그들은 이미 잼을 모두 팔아 버렸다! [문장 03 참고]`,
correct:`과거 시점(I went ~ last weekend)보다 더 이전에 완료된 행위를 나타내므로 과거완료(had + p.p.)가 적절하다.`,
wrongs:['① had already sold ✅ — 과거완료; 과거보다 이전 시점의 완료','② have already sold ❌ — 현재완료; 과거 시점 기준이 아닌 현재 기준','③ has already sold ❌ — 주어 they(복수)에 has 불일치','④ already sold ❌ — 단순 과거; 대과거 의미 전달 불가','⑤ were already selling ❌ — 과거진행; 완료 의미 전달 불가'],
tip:`💡 과거완료 (had + p.p.)\n• 과거의 어떤 시점보다 더 이전에 발생한 일\n• 예: When I arrived, she had already left.\n\n⚠️ 함정\n• 과거 시제가 기준점으로 먼저 제시되어야 과거완료 사용 가능`}},

{id:5,type:`어법`,diff:`보통`,pts:3,fmt:`mc`,note:`문장04`,
passage:``,
stem:`다음 괄호 안에서 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">They didn\'t have enough strawberries <b>[① to make / ② making]</b> any more jam.</div>`,
ch:['① making','② to make'],ans:1,
det:{ref:`[원문] They didn\'t have enough strawberries to make any more jam.\n[해석] 그들은 잼을 더 만들 딸기가 충분하지 않았다. [문장 04 참고]`,
correct:`enough + 명사 + to부정사 구문에서 to부정사는 "~할 만큼의"라는 의미의 부사적 용법(결과/목적)으로 사용된다.`,
wrongs:['① to make ✅ — enough + N + to-V 구문에 적합','② making ❌ — enough 뒤에 동명사는 사용 불가'],
tip:`💡 enough + to부정사\n• enough + N + to-V: ~할 만큼 충분한 N\n• adj/adv + enough + to-V: ~할 만큼 충분히\n\n⚠️ 함정\n• enough가 형용사 앞이 아닌 뒤에 올 때: tall enough (O), enough tall (X)`}},

{id:6,type:`어휘`,diff:`보통`,pts:3,fmt:`written`,note:`문장05`,
passage:`That evening, I sat by the window and ( ___ ) out at the empty field behind their house.`,
stem:`위 지문의 빈칸에 알맞은 단어를 쓰시오. (1단어, 영문 6자, s로 시작)<br>힌트: "응시하다, 바라보다"`,
wa:"stared",accept:["stared","Stared","STARED"],
det:{ref:`[원문] That evening, I sat by the window and stared out at the empty field behind their house.\n[해석] 그날 저녁, 나는 창가에 앉아 그들의 집 뒤 빈 들판을 바라보았다. [문장 05 참고]`,
correct:`stare out at ~: ~을 (빈) 공간을 바라보다. sat과 병렬로 과거형 stared가 적절하다.`,
wrongs:[],
tip:`💡 stare vs. look vs. gaze\n• stare: (놀라움/관심으로) 빤히 응시하다\n• look: (일반적으로) 보다\n• gaze: (감탄/사색하며) 바라보다\n\n⚠️ 주의\n• stare out at: 멀리 바라보다 (전치사 at 필수)`}},

{id:7,type:`지칭추론`,diff:`보통`,pts:3,fmt:`mc`,note:`문장07`,
passage:`Suddenly, I got an idea. <u>The field</u> would be the perfect place for a larger greenhouse.`,
stem:`위 지문의 밑줄 친 <b>The field</b>가 가리키는 것으로 가장 적절한 것은?`,
ch:['① the local market','② the empty field behind the grandparents\' house','③ the window','④ the greenhouse','⑤ the strawberry farm'],ans:1,
det:{ref:`[원문] The field would be the perfect place for a larger greenhouse.\n[해석] 그 들판은 더 큰 온실을 세우기에 완벽한 장소가 될 것이다. [문장 07 참고]`,
correct:`앞 문장(문장 05)에서 "the empty field behind their house"가 언급되었으므로, The field는 조부모님 집 뒤의 빈 들판을 가리킨다.`,
wrongs:['① the local market ❌ — 시장은 잼을 파는 곳이지 온실 장소가 아님','② the empty field behind the grandparents\' house ✅ — 문장 05에서 언급된 빈 들판','③ the window ❌ — 창문은 화자가 앉아있던 곳','④ the greenhouse ❌ — 온실은 아직 존재하지 않음','⑤ the strawberry farm ❌ — 본문에 딸기 농장 언급 없음'],
tip:`💡 지칭추론 전략\n• 정관사 the + 명사 → 앞에서 이미 언급된 대상\n• 대명사/지시어의 선행사는 보통 바로 앞 문장에 있음\n\n⚠️ 함정\n• 본문에 없는 내용을 선지에 넣어 혼동 유발`}},

{id:8,type:`어법`,diff:`보통`,pts:4,fmt:`mc`,note:`문장09`,
passage:``,
stem:`다음 괄호 안에서 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">I immediately started <b>[① searching / ② to search]</b> for a way, and I found the perfect solution.</div>`,
ch:['① searching','② to search'],ans:0,
det:{ref:`[원문] I immediately started searching for a way, and I found the perfect solution.\n[해석] 나는 즉시 방법을 찾기 시작했고, 완벽한 해결책을 찾았다. [문장 09 참고]`,
correct:`start는 뒤에 동명사(~ing)와 to부정사 모두 가능하나, 본문에서는 동명사 searching이 사용되었다. start + ~ing = start + to-V (의미 차이 거의 없음)`,
wrongs:['① searching ✅ — start + 동명사; 본문 원형','② to search ✅ — start + to부정사도 문법적으로 가능하지만, 본문에서는 searching 사용'],
tip:`💡 start/begin + 동명사/to부정사\n• 둘 다 가능하며 의미 차이 거의 없음\n• 예: It started raining. = It started to rain.\n\n⚠️ 함정\n• 진행형에서는 to부정사만 가능: It was starting to rain. (O)\n• It was starting raining. (X)`}},

{id:9,type:`어휘`,diff:`보통`,pts:3,fmt:`mc`,note:`문장12`,
passage:``,
stem:`다음 괄호 안에서 문맥상 알맞은 단어를 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">Crowdfunding is a way of <b>[① raising / ② rising]</b> money for a product, company, or charity.</div>`,
ch:['① rising','② raising'],ans:1,
det:{ref:`[원문] Crowdfunding is a way of raising money for a product, company, or charity.\n[해석] 크라우드펀딩은 제품, 회사 또는 자선 단체를 위해 돈을 모으는 방법이다. [문장 12 참고]`,
correct:`raise는 타동사(~을 올리다, 모금하다)로 money를 목적어로 취한다. rise는 자동사(오르다)로 목적어를 취하지 않는다.`,
wrongs:['① raising ✅ — 타동사 raise의 동명사; raise money(돈을 모금하다)','② rising ❌ — 자동사 rise의 동명사; 목적어(money)를 취할 수 없음'],
tip:`💡 raise vs. rise\n• raise(타동사): raised-raised; 목적어 필요 (raise money, raise a hand)\n• rise(자동사): rose-risen; 목적어 없음 (The sun rises.)\n\n⚠️ 함정\n• arise(자동사): arose-arisen; 문제가 발생하다`}},

{id:10,type:`어법`,diff:`어려움`,pts:4,fmt:`mc`,note:`문장14`,
passage:``,
stem:`다음 밑줄 친 부분 중 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">Crowdfunding is especially advantageous for individuals or small companies ______ can\'t attract big investors.</div>`,
ch:['① that','② what','③ who','④ which','⑤ where'],ans:0,
det:{ref:`[원문] Crowdfunding is especially advantageous for individuals or small companies that can\'t attract big investors.\n[해석] 크라우드펀딩은 큰 투자자를 유치할 수 없는 개인이나 소규모 기업에게 특히 유리하다. [문장 14 참고]`,
correct:`선행사가 individuals or small companies(사람+사물 혼합)이므로 관계대명사 that이 가장 적절하다. 사람+사물 혼합 선행사에는 that을 사용한다.`,
wrongs:['① that ✅ — 사람+사물 혼합 선행사에 적합한 관계대명사','② what ❌ — 선행사를 포함하는 관계대명사; 이미 선행사가 있으므로 부적절','③ who ❌ — 사람만을 선행사로 취함; companies 포함 불가','④ which ❌ — 사물만을 선행사로 취함; individuals 포함 불가','⑤ where ❌ — 장소를 선행사로 취하는 관계부사; 주어 역할 불가'],
tip:`💡 관계대명사 that 필수 사용\n• 선행사가 사람+사물: the boy and the dog that...\n• 선행사에 최상급/서수: the best book that...\n• 선행사에 all/every/no: everything that...\n\n⚠️ 함정\n• what = the thing which (선행사 포함)\n• what 앞에 선행사가 있으면 오답!`}},

{id:11,type:`오류찾기`,diff:`어려움`,pts:4,fmt:`mc`,note:`문장16-18`,
passage:``,
stem:`다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 틀린 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">My grandparents were <u>ⓐ thrilled</u> when I <u>ⓑ told</u> them my idea. With the help of investors, we could build a large greenhouse and <u>ⓒ grow</u> a lot more strawberries. Moreover, we could reward the investors for their help by <u>ⓓ sending</u> <u>ⓔ they</u> jars of organic jam!</div>`,
ch:['① ⓐ thrilled','② ⓑ told','③ ⓒ grow','④ ⓓ sending','⑤ ⓔ they'],ans:4,
det:{ref:`[원문] Moreover, we could reward the investors for their help by sending them jars of organic jam!\n[해석] 게다가, 우리는 투자자들에게 유기농 잼 한 병씩을 보내 그들의 도움에 보답할 수 있었다! [문장 18 참고]`,
correct:`ⓔ they → them. sending의 목적어(간접목적어) 자리이므로 목적격 them이 적절하다. 주격 they는 목적어 자리에 올 수 없다.`,
wrongs:['ⓐ thrilled ✅ — 감정 형용사(p.p.); 주어가 감정을 느끼는 대상','ⓑ told ✅ — tell+간접목적어+직접목적어 (told them my idea)','ⓒ grow ✅ — could build and grow; 조동사 뒤 동사원형 병렬','ⓓ sending ✅ — by + 동명사 (수단/방법)','ⓔ they ❌ — 동사 sending의 목적어 자리; 목적격 them이 필요'],
tip:`💡 인칭대명사 격변화\n• 주격: I/you/he/she/it/we/they\n• 목적격: me/you/him/her/it/us/them\n• 전치사/동사 뒤 → 목적격 필수\n\n⚠️ 함정\n• by sending they (X) → by sending them (O)`}},

{id:12,type:`지칭추론`,diff:`보통`,pts:3,fmt:`mc`,note:`문장18`,
passage:`Moreover, we could reward the investors for their help by sending <u>them</u> jars of organic jam!`,
stem:`위 지문의 밑줄 친 <b>them</b>이 가리키는 대상으로 가장 적절한 것은?`,
ch:['① my grandparents','② the investors','③ the strawberries','④ the jars','⑤ the products'],ans:1,
det:{ref:`[원문] Moreover, we could reward the investors for their help by sending them jars of organic jam!\n[해석] 게다가, 우리는 투자자들에게 유기농 잼 한 병씩을 보내 그들의 도움에 보답할 수 있었다! [문장 18 참고]`,
correct:`문맥상 "투자자들의 도움에 보답하기 위해 그들(투자자들)에게 잼을 보낸다"이므로 them은 the investors를 가리킨다.`,
wrongs:['① my grandparents ❌ — 잼을 보내는 주체이지 받는 대상이 아님','② the investors ✅ — reward the investors ~ by sending them; 투자자에게 보내는 것','③ the strawberries ❌ — 딸기에게 잼을 보낼 수 없음','④ the jars ❌ — 병은 보내는 물건이지 받는 대상이 아님','⑤ the products ❌ — 제품은 보내는 것이지 받는 대상이 아님'],
tip:`💡 대명사 지칭 추론\n• them/they → 앞에 나온 복수 명사 확인\n• 문맥(보답하다 → 투자자에게)을 고려\n\n⚠️ 주의\n• 같은 문장 내 복수 명사가 여러 개일 때 의미 관계로 판단`}},

{id:13,type:`연결사`,diff:`보통`,pts:3,fmt:`written`,note:`문장18`,
passage:`With the help of investors, we could build a large greenhouse and grow a lot more strawberries. ( ___ ), we could reward the investors for their help by sending them jars of organic jam!`,
stem:`위 지문의 빈칸에 알맞은 연결사를 쓰시오. (1단어, 영문 8자, M으로 시작)`,
wa:"Moreover",accept:["Moreover","moreover","MOREOVER"],
det:{ref:`[원문] Moreover, we could reward the investors for their help by sending them jars of organic jam!\n[해석] 게다가, 우리는 투자자들에게 유기농 잼 한 병씩을 보내 그들의 도움에 보답할 수 있었다! [문장 18 참고]`,
correct:`온실 건설 + 딸기 재배라는 이점에 "잼 보답"이라는 추가 이점을 더하는 첨가/부연 관계이므로 Moreover(게다가)가 적절하다.`,
wrongs:[],
tip:`💡 첨가/부연 연결사\n• Moreover = 게다가 (격식)\n• Furthermore = 더 나아가\n• In addition = 추가로\n• Besides = 게다가\n\n⚠️ 함정\n• However(역접)와 혼동 주의`}},

{id:14,type:`어법`,diff:`보통`,pts:3,fmt:`mc`,note:`문장21`,
passage:``,
stem:`다음 괄호 안에서 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">Before <b>[① beginning / ② begin]</b> your campaign, be sure to plan all the production details.</div>`,
ch:['① beginning','② begin'],ans:0,
det:{ref:`[원문] Before beginning your campaign, be sure to plan all the production details.\n[해석] 캠페인을 시작하기 전에, 모든 생산 세부 사항을 반드시 계획하라. [문장 21 참고]`,
correct:`전치사 Before 뒤에는 명사/동명사가 와야 하므로 beginning(동명사)이 적절하다. 동사원형 begin은 전치사 뒤에 올 수 없다.`,
wrongs:['① beginning ✅ — 전치사 Before + 동명사','② begin ❌ — 전치사 뒤에 동사원형 불가'],
tip:`💡 전치사 + 동명사\n• 전치사(before/after/by/without 등) 뒤에는 반드시 동명사\n• Before leaving (O) / Before leave (X)\n\n⚠️ 함정\n• before가 접속사일 때는 주어+동사 가능: Before you begin...`}},

{id:15,type:`어법`,diff:`어려움`,pts:4,fmt:`mc`,note:`문장24`,
passage:``,
stem:`다음 밑줄 친 부분 중 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">This planning is important ______ your potential investors will want to see a clear schedule.</div>`,
ch:['① although','② because of','③ because','④ despite','⑤ due to'],ans:2,
det:{ref:`[원문] This planning is important because your potential investors will want to see a clear schedule.\n[해석] 이 계획은 중요한데, 잠재적 투자자들이 명확한 일정을 보고 싶어할 것이기 때문이다. [문장 24 참고]`,
correct:`뒤에 완전한 절(your potential investors will want ~)이 오므로 접속사 because가 적절하다. because of/due to/despite는 전치사(구)로 뒤에 명사(구)가 온다.`,
wrongs:['① because ✅ — 접속사; 뒤에 절(S+V)이 옴','② because of ❌ — 전치사구; 뒤에 명사(구)만 가능','③ although ❌ — 양보 접속사; 이유가 아닌 양보 의미','④ despite ❌ — 양보 전치사; 뒤에 명사(구)만 가능','⑤ due to ❌ — 전치사구; 뒤에 명사(구)만 가능'],
tip:`💡 접속사 vs. 전치사\n• because + S + V (접속사)\n• because of + 명사(구) (전치사구)\n• although + S + V (접속사)\n• despite + 명사(구) (전치사)\n\n⚠️ 함정\n• because of 뒤에 절이 오면 오답!`}},

{id:16,type:`서술형`,diff:`보통`,pts:4,fmt:`written`,note:`문장25`,
passage:`Once your plan is complete, remember to set your ( ___ ) goal.`,
stem:`위 지문의 빈칸에 알맞은 단어를 쓰시오. (1단어, 영문 7자, f로 시작)<br>힌트: "자금 조달, 펀딩"`,
wa:"funding",accept:["funding","Funding","FUNDING"],
det:{ref:`[원문] Once your plan is complete, remember to set your funding goal.\n[해석] 계획이 완성되면, 펀딩 목표를 설정하는 것을 기억하라. [문장 25 참고]`,
correct:`크라우드펀딩 캠페인에서 목표 금액을 정하는 맥락이므로 funding(자금 조달) goal이 적절하다.`,
wrongs:[],
tip:`💡 fund 관련 어휘\n• fund(n): 자금, 기금\n• fund(v): 자금을 대다\n• funding(n): 자금 조달, 펀딩\n• fundraising(n): 모금 활동\n\n⚠️ 주의\n• funding goal = 펀딩 목표(금액)`}},

{id:17,type:`어법`,diff:`보통`,pts:3,fmt:`mc`,note:`문장26`,
passage:``,
stem:`다음 괄호 안에서 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">It should be enough <b>[① to complete / ② completing]</b> the project and fulfill the rewards for the investors.</div>`,
ch:['① to complete','② completing'],ans:0,
det:{ref:`[원문] It should be enough to complete the project and fulfill the rewards for the investors.\n[해석] 그것은 프로젝트를 완성하고 투자자들에 대한 보상을 이행하기에 충분해야 한다. [문장 26 참고]`,
correct:`enough + to부정사 구문이다. "~하기에 충분한"의 의미로 to부정사(목적/결과)가 사용된다.`,
wrongs:['① to complete ✅ — enough + to-V 구문에 적합','② completing ❌ — enough 뒤에 동명사 불가'],
tip:`💡 enough + to부정사\n• adj + enough + to-V: old enough to drive\n• enough + N + to-V: enough money to buy\n\n⚠️ 시험 빈출\n• enough to V vs. too ~ to V 구별 필수`}},

{id:18,type:`서술형`,diff:`보통`,pts:4,fmt:`written`,note:`문장32`,
passage:`We decided to set our funding goal at $5,000 to ( ___ ) all the costs.`,
stem:`위 지문의 빈칸에 알맞은 단어를 쓰시오. (1단어, 영문 5자, c로 시작)<br>힌트: "충당하다, (비용을) 감당하다"<br>한국어: "우리는 모든 비용을 충당하기 위해 펀딩 목표를 5,000달러로 설정하기로 결정했다."`,
wa:"cover",accept:["cover","Cover","COVER"],
det:{ref:`[원문] We decided to set our funding goal at $5,000 to cover all the costs.\n[해석] 우리는 모든 비용을 충당하기 위해 펀딩 목표를 5,000달러로 설정하기로 결정했다. [문장 32 참고]`,
correct:`to cover all the costs: 모든 비용을 충당하기 위해. cover는 "비용을 감당하다/충당하다"의 의미이다.`,
wrongs:[],
tip:`💡 cover의 다양한 의미\n• cover costs: 비용을 충당하다\n• cover a topic: 주제를 다루다\n• cover a distance: 거리를 이동하다\n\n⚠️ 주의\n• to cover = 목적의 to부정사 (부사적 용법)`}},

{id:19,type:`어법`,diff:`보통`,pts:3,fmt:`mc`,note:`문장30`,
passage:``,
stem:`다음 괄호 안에서 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">Once it <b>[① was built / ② built]</b>, we could fill it with strawberry plants and expect a harvest within about four months.</div>`,
ch:['① built','② was built'],ans:1,
det:{ref:`[원문] Once it was built, we could fill it with strawberry plants and expect a harvest within about four months.\n[해석] 일단 그것이 건설되면, 우리는 딸기 모종을 채우고 약 4개월 안에 수확을 기대할 수 있었다. [문장 30 참고]`,
correct:`주어 it(온실)은 "건설되는" 대상이므로 수동태(was built)가 적절하다. 온실은 스스로 짓는 것이 아니라 지어지는 것이다.`,
wrongs:['① was built ✅ — 수동태; 주어 it(온실)이 건설되는 대상','② built ❌ — 능동태 과거; 주어가 직접 건설하는 것이 아님'],
tip:`💡 수동태 (be + p.p.)\n• 주어가 동작을 받는 대상일 때 사용\n• The house was built. (집이 지어졌다)\n• cf. They built the house. (그들이 집을 지었다)\n\n⚠️ 함정\n• Once 뒤에 수동태 + 주절에 능동태 패턴 빈출`}},

{id:20,type:`어형변화`,diff:`보통`,pts:3,fmt:`written`,note:`문장34`,
passage:`I was really <span style="border:1px dashed #26A69A;padding:1px 6px;border-radius:4px;color:#26A69A;font-weight:600;">[excite]</span> when I filled out the form to launch the campaign.`,
stem:`위 지문의 [excite]를 문맥에 맞게 어형을 변화시키시오. (1단어, 영문 7자, e로 시작)`,
wa:"excited",accept:["excited","Excited","EXCITED"],
det:{ref:`[원문] I was really excited when I filled out the form to launch the campaign.\n[해석] 나는 캠페인을 시작하기 위한 양식을 작성했을 때 정말 신이 났다. [문장 34 참고]`,
correct:`주어 I(사람)가 감정을 느끼는 대상이므로 과거분사 excited(신이 난)가 적절하다. exciting은 감정을 유발하는 대상(사물)을 수식한다.`,
wrongs:[],
tip:`💡 감정 형용사 (-ed vs. -ing)\n• -ed: 감정을 느끼는 주체 (사람) → I was excited.\n• -ing: 감정을 유발하는 대상 (사물) → The news was exciting.\n\n⚠️ 빈출 감정동사\n• surprised/surprising, bored/boring, interested/interesting`}},

{id:21,type:`의미파악`,diff:`보통`,pts:3,fmt:`mc`,note:`문장34`,
passage:`I was really excited when I filled out the form to <u>launch</u> the campaign.`,
stem:`위 지문의 밑줄 친 <b>launch</b>와 의미가 가장 가까운 것은?`,
ch:['① cancel','② delay','③ invest','④ complete','⑤ start'],ans:4,
det:{ref:`[원문] I was really excited when I filled out the form to launch the campaign.\n[해석] 나는 캠페인을 시작하기 위한 양식을 작성했을 때 정말 신이 났다. [문장 34 참고]`,
correct:`launch는 "(사업·캠페인 등을) 시작하다, 착수하다"의 의미로 start와 유사하다.`,
wrongs:['① start ✅ — 시작하다; launch와 동의어','② cancel ❌ — 취소하다; 반의어','③ invest ❌ — 투자하다; 다른 의미','④ delay ❌ — 미루다, 지연시키다; 반의어에 가까움','⑤ complete ❌ — 완성하다; 시작이 아닌 마무리'],
tip:`💡 launch의 다양한 의미\n• launch a campaign: 캠페인을 시작하다\n• launch a product: 제품을 출시하다\n• launch a rocket: 로켓을 발사하다\n\n⚠️ 시험 팁\n• 동의어: start, begin, initiate, kick off`}},

{id:22,type:`어법`,diff:`어려움`,pts:4,fmt:`mc`,note:`문장37`,
passage:``,
stem:`다음 괄호 안에서 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">For a successful crowdfunding campaign, <b>[① promoting / ② to promote]</b> it is necessary.</div>`,
ch:['① promoting','② to promote'],ans:0,
det:{ref:`[원문] For a successful crowdfunding campaign, promoting it is necessary.\n[해석] 성공적인 크라우드펀딩 캠페인을 위해, 그것을 홍보하는 것이 필요하다. [문장 37 참고]`,
correct:`문장의 주어 역할을 하는 동명사구 promoting it이 필요하다. 동명사는 주어 역할을 할 수 있다.`,
wrongs:['① promoting ✅ — 동명사 주어; promoting it is necessary','② to promote ❌ — to부정사도 주어 가능하나 본문에서는 동명사 사용; 일반적 사실에는 동명사 선호'],
tip:`💡 동명사 주어\n• 동명사(~ing)는 문장의 주어로 사용 가능\n• Swimming is fun. / Reading books is important.\n• 일반적 사실/습관 → 동명사 주어 선호\n\n⚠️ 함정\n• to부정사 주어는 가주어 it 구문이 더 자연스러움\n• It is necessary to promote it. (O)`}},

{id:23,type:`어법`,diff:`보통`,pts:3,fmt:`mc`,note:`문장39`,
passage:``,
stem:`다음 괄호 안에서 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">This allows investors <b>[① to get / ② getting]</b> to know you and learn about your product.</div>`,
ch:['① getting','② to get'],ans:1,
det:{ref:`[원문] This allows investors to get to know you and learn about your product.\n[해석] 이것은 투자자들이 당신을 알고 당신의 제품에 대해 배울 수 있게 해준다. [문장 39 참고]`,
correct:`allow + 목적어 + to부정사 구문이다. allow는 목적격보어로 to부정사를 취한다.`,
wrongs:['① to get ✅ — allow + O + to-V 구문에 적합','② getting ❌ — allow 뒤 목적격보어로 동명사 불가'],
tip:`💡 allow + O + to-V\n• allow/permit/enable + 목적어 + to부정사\n• 예: The teacher allowed us to leave early.\n\n⚠️ 함정\n• 사역동사(make/let/have)는 동사원형: make + O + V원형\n• 준사역동사(allow/permit) → to부정사`}},

{id:24,type:`지칭추론`,diff:`보통`,pts:3,fmt:`mc`,note:`문장39`,
passage:`You should consider making a video. <u>This</u> allows investors to get to know you and learn about your product.`,
stem:`위 지문의 밑줄 친 <b>This</b>가 가리키는 것으로 가장 적절한 것은?`,
ch:['① crowdfunding','② the campaign','③ making a video','④ the investors','⑤ the product'],ans:2,
det:{ref:`[원문] This allows investors to get to know you and learn about your product.\n[해석] 이것은 투자자들이 당신을 알고 당신의 제품에 대해 배울 수 있게 해준다. [문장 39 참고]`,
correct:`바로 앞 문장에서 "making a video"가 언급되었으므로, This는 비디오를 만드는 것을 가리킨다.`,
wrongs:['① crowdfunding ❌ — 크라우드펀딩 자체가 아니라 비디오 제작을 지칭','② the campaign ❌ — 캠페인이 아닌 비디오가 투자자에게 정보를 제공','③ making a video ✅ — 앞 문장의 "making a video"를 지칭','④ the investors ❌ — 투자자는 정보를 받는 대상','⑤ the product ❌ — 제품은 비디오에서 소개되는 대상'],
tip:`💡 This/That 지칭추론\n• This = 앞 문장(또는 앞 내용) 전체를 지칭\n• 동명사구/절을 대신하는 경우가 많음\n\n⚠️ 전략\n• This가 주어일 때 → 앞 문장 전체 또는 핵심 행위를 가리킴`}},

{id:25,type:`서술형`,diff:`보통`,pts:4,fmt:`written`,note:`문장41`,
passage:`You also need to ( ___ ) how important the product is to you.`,
stem:`위 지문의 빈칸에 알맞은 단어를 쓰시오. (1단어, 영문 7자, e로 시작)<br>힌트: "표현하다, 나타내다"`,
wa:"express",accept:["express","Express","EXPRESS"],
det:{ref:`[원문] You also need to express how important the product is to you.\n[해석] 또한 그 제품이 당신에게 얼마나 중요한지를 표현해야 한다. [문장 41 참고]`,
correct:`need to express: ~을 표현할 필요가 있다. express + 간접의문문(how important the product is)은 "~이 얼마나 중요한지 표현하다"의 의미이다.`,
wrongs:[],
tip:`💡 express의 용법\n• express + 명사: express feelings (감정을 표현하다)\n• express + 간접의문문: express how/what/why...\n\n⚠️ 간접의문문 어순\n• how important the product is (O)\n• how important is the product (X) — 의문문 어순 아님!`}},

{id:26,type:`어법`,diff:`보통`,pts:3,fmt:`mc`,note:`문장47`,
passage:``,
stem:`다음 괄호 안에서 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">In the video, I highlighted how the strawberries <b>[① were grown / ② grew]</b> without using chemicals.</div>`,
ch:['① grew','② were grown'],ans:1,
det:{ref:`[원문] In the video, I highlighted how the strawberries were grown without using chemicals.\n[해석] 비디오에서, 나는 딸기가 화학물질 없이 어떻게 재배되는지를 강조했다. [문장 47 참고]`,
correct:`딸기(the strawberries)는 "재배되는" 대상이므로 수동태(were grown)가 적절하다. 딸기가 스스로 자란 것이 아니라 사람에 의해 재배된 것이다.`,

tip:`💡 grow의 자동사/타동사\n• 자동사: The plant grew. (식물이 자랐다)\n• 타동사: They grow strawberries. (그들이 딸기를 재배한다)\n• 수동태: Strawberries were grown. (딸기가 재배되었다)\n\n⚠️ 함정\n• 문맥상 "재배하다"(타) vs. "자라다"(자) 구별 필수`}},

{id:27,type:`주제`,diff:`보통`,pts:3,fmt:`mc`,note:`종합`,
passage:`My grandparents sell their delicious organic jam at the local market every weekend. I went to help them last weekend. However, they had already sold all of their jam! They didn't have enough strawberries to make any more jam. That evening, I sat by the window and stared out at the empty field behind their house. Suddenly, I got an idea. The field would be the perfect place for a larger greenhouse. Then they could grow more strawberries! I immediately started searching for a way, and I found the perfect solution. I would start a crowdfunding campaign!<br><br>Crowdfunding is a way of raising money for a product, company, or charity. These days, people can use crowdfunding websites to collect money. Crowdfunding is especially advantageous for individuals or small companies that can't attract big investors. If the campaign is successful, the investors receive direct rewards for their contribution.<br><br>My grandparents were thrilled when I told them my idea. With the help of investors, we could build a large greenhouse and grow a lot more strawberries. Moreover, we could reward the investors for their help by sending them jars of organic jam! With this plan in mind, the next step was to figure out the details.<br><br>Before beginning your campaign, be sure to plan all the production details. How many products will you make? How long will it take to make the product? This planning is important because your potential investors will want to see a clear schedule. Once your plan is complete, remember to set your funding goal. It should be enough to complete the project and fulfill the rewards for the investors. Consider all the necessary costs before deciding on the amount.<br><br>After doing some calculations, we decided on an 8-by-12-foot greenhouse. We thought it would cost approximately $4,000. Once it was built, we could fill it with strawberry plants and expect a harvest within about four months. Then it would take a few weeks to turn the strawberries into delicious jam. We decided to set our funding goal at $5,000 to cover all the costs. Also, we planned to run the campaign for three months. I was really excited when I filled out the form to launch the campaign. In less than a week, our application was accepted and funding began!<br><br>For a successful crowdfunding campaign, promoting it is necessary. You should consider making a video. This allows investors to get to know you and learn about your product. In the video, describe your situation clearly and show your product. You also need to express how important the product is to you. Don't forget to include a direct request for support at the end. During a campaign, it is important to send investors updates every week. Through the update, the investors will be able to track the progress of the campaign.<br><br>After our application was accepted, I was eager to make a good first impression with our investors. To achieve this, I made a video about my grandparents and their jam. In the video, I highlighted how the strawberries were grown without using chemicals. I also included clips of my grandparents. In the clips, they were making the jam with all-natural ingredients. Finally, I explained where I wanted to put the new greenhouse and asked for support. After some editing, I posted the video on many social media sites. It didn't take long for word of our campaign to spread. Funding for our campaign started slowly. When the first investor committed to supporting us, I almost jumped for joy. Now, after six weeks, we have raised almost $2,500. It seems like we might make our funding goal!`,
stem:`윗글의 주제로 가장 적절한 것은?`,
ch:['① 유기농 식품 재배의 장단점','② 크라우드펀딩을 통한 조부모의 온실 프로젝트','③ 소셜 미디어 마케팅의 중요성','④ 딸기 잼을 만드는 전통적인 방법','⑤ 투자자를 유치하기 위한 사업 계획 작성법'],ans:1,
det:{ref:`[원문] 전체 지문 참고
[해석] 이 글은 화자가 조부모의 유기농 잼 사업을 위해 크라우드펀딩 캠페인을 시작하는 과정을 설명하고 있다.`,
correct:`글 전체가 조부모의 딸기 온실 건설을 위한 크라우드펀딩 캠페인의 기획, 실행, 홍보 과정을 다루고 있으므로 ②가 가장 적절하다.`,
wrongs:['① 유기농 식품 재배의 장단점 ❌ — 유기농은 배경일 뿐 주제가 아님','② 크라우드펀딩을 통한 조부모의 온실 프로젝트 ✅ — 글의 핵심 주제','③ 소셜 미디어 마케팅의 중요성 ❌ — 홍보는 일부분에 불과','④ 딸기 잼을 만드는 전통적인 방법 ❌ — 잼 제조법은 언급되지 않음','⑤ 투자자를 유치하기 위한 사업 계획 작성법 ❌ — 사업 계획은 부분적 내용'],
tip:`💡 주제 파악 전략

⚠️ 주의

const QCOUNT=Q.length;

let S={ans:[],cur:0,ti:null,left:EI.time,start:0};

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name,answers:S.ans.slice()});if(h.length>20)h.length=20;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map((x,idx)=>`<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade} · ${x.level||''}</div></div><div class="hi-right"><div class="hi-score" style="color:${x.score>=80?'var(--o)':'var(--r)'}">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div></div>${x.answers?`<button onclick="reviewHistory(${idx})" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid #dde8df;border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--o)">📝 정답·해설 다시 보기</button>`:''}</div>`).join('');p.style.display='block';}

function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
