.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--ol);color:#4A148C;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}

.q-body{padding:14px 16px;}
.q-passage{background:linear-gradient(135deg,#FAFAFF,#F5F3FA);border-left:3px solid var(--warn);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}

.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--od),var(--warn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8e0f0;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--warn),var(--ol));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--oxxl);border-radius:var(--rs);border:1px solid #d8d0e8;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--oxl);}.info-cell.highlight .ic-value{color:var(--warn);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0f0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--ol);color:var(--warn);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--oxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #c8c0d8;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--warn);color:var(--warn);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #d8d0e8;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--oxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--oxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}

<script>
const EI={subject:'공통영어1',pub:'천재(강상구)',lesson:'2과',title:'Mapping Our Voices',total:100,time:1200,histKey:'quizH_MV2',qCount:30};

const FULL_PASSAGE=`Everyone has unique experiences, but many people remain isolated and disconnected from what goes on outside their lives. Community mapping helps people look outside of themselves, connect with other members of their communities, and share valuable experiences. Community mapping is a collective process. It enables members of a community to map details of the places where they live and other places they know about. Community mapping is also a unique and valuable tool as it can be used in diverse ways.
In the middle of a major disaster, community mapping can prove to be a very effective and important tool. The first responders to a disaster are often ordinary citizens. They can use maps to create and update data on health facilities, shelters, or even public roads. When community members work together at the time of a disaster, the gathered information can be based on actual needs rather than guesses. This is particularly critical when every second counts.
For example, community mapping helped deal with the impact of Hurricane Sandy, one of the most destructive hurricanes to hit the United States. One of its main effects was energy failures. Residents in affected areas would wait for hours in line at gas stations, sometimes only to learn that they were out of gasoline. In response to this problem, a group of high school students in New Jersey worked together to create an online community map, publishing information on open gas stations with available fuel. The students gathered information from personal observations, calls to local gas stations, and updates from other social media users. The live data streams filled a significant community information gap.
Mapping can also rally community members around the assets of their community such as libraries, community centers, and parks. Heritage and cultural attractions, like landmarks, museums, and public artworks, are also good sources for community mapping. Through marking assets on a map, people become aware of the strengths and resources of their own community and build a strong bond with it. Also, these maps can provide valuable data to be used for tourism or urban design.
The mapping project Where in Wally (short for Walthamstow, UK) is a case in point. A team of architects undertook the project to find out what spots were loved by the locals. People told the team about their treasured places and the reasons why these places were special to them. The team then added the places to an online map and marked them in the real world with yellow tags. The map and tags invited people to go on a treasure hunt and told them colorful stories about the corners of Walthamstow.
A community mapping project doesn't have to be ambitious in scale. If the idea of mapping overwhelms you, start small. Although it may seem that you know all about the routes to school, students have different information from one another due to different experiences. How about making a map with your classmates? Each of you can trace routes that you frequently use and mark how comfortable or safe you feel on those routes. With group participation and feedback, an informative visual map of safe routes to school can be constructed. You can provide the map to local district officials to help identify school safety problems.
There isn't just one reason for, nor one method of, carrying out community mapping. The process is defined by the community itself, depending on what issues are raised and how the community members decide to deal with them. The most important thing in the process is that you have to work with others. Remember that, by its very nature, community mapping is a collective experience.
The researchers participating in the Montreal Tree Project asked residents and public institutions around Concordia University for help. The researchers asked them to photograph the bark and leaves of the trees on their properties and submit the photos to the project's website for analysis. The project is now complete, and they say the results show the importance of having a diverse tree population in a city. Trees on private lands were found to be more diverse than those on public lands. The two groups of trees served different purposes, too. Trees on private lands served functions such as providing fruit, flowers, or beauty, and those on public lands provided shade, regulated temperature, and fought air pollution. Hutt-Taylor, one of the researchers, says that diversity of trees can make a forest more adaptable to events like climate change. For residents who want to plant trees on their own lands, she suggests they choose trees that are both native to their regions and are of a different species from their neighbors' trees.`;

{id:13,type:'의미파악',diff:'어려움',pts:3,fmt:'mc',note:'문장16',
 passage:`The live data streams <u>filled a significant community information gap</u>.`,

 det:{ref:'[원문] The live data streams filled a significant community information gap.\n[해석] 실시간 데이터 흐름이 커뮤니티 정보의 중요한 빈틈을 채웠다. [문장 16 참고]',
      correct:'fill a gap은 "빈틈/부족함을 채우다"라는 관용적 표현이다. 학생들이 만든 실시간 주유소 정보가 커뮤니티에 부족했던 정보를 보충했다는 의미.',
      wrongs:['① 커뮤니티 정보의 중요한 빈틈을 채웠다 ✅ — fill a gap = 빈틈을 채우다','② 커뮤니티의 데이터 저장 공간을 가득 채웠다 ❌ — gap은 저장 공간이 아님','③ 지역 사회의 정보 격차를 더 벌려놓았다 ❌ — fill은 채우다이지 벌리다가 아님'],
      tip:'💡 fill a gap / bridge a gap\n• fill a gap: 빈틈/부족함을 채우다 (= 보충하다)\n• bridge a gap: 격차를 좁히다\n• information gap: 정보의 빈틈/부족\n\n⚠️ gap은 "차이, 격차, 빈틈"의 뜻 — 맥락에 따라 해석 주의'}},

{id:14,type:'어법',diff:'보통',pts:3,fmt:'mc',note:'문장17',

      correct:'such as는 전치사구로 명사 뒤에서 구체적 예시를 나열할 때 사용한다. for instance는 부사구로 문장 앞/뒤에 오며 명사를 직접 나열하지 않는다.',
      wrongs:['① such as ✅ — 명사 + such as + 예시 명사들: 올바른 용법','② for instance ❌ — 부사구(문장 수식)이므로 명사 바로 뒤에서 예시 나열 불가'],
      tip:'💡 예시 표현\n• such as + 명사: 구체적 예시 나열 (전치사구)\n• for instance / for example: 문장 부사 (독립적 사용)\n• like + 명사: such as와 유사하나 비격식\n\n⚠️ 함정: for example, libraries... (O) vs assets for instance libraries (X)'}},

{id:15,type:'어법',diff:'어려움',pts:3,fmt:'mc',note:'문장19',
 passage:``,

      tip:'💡 전치사 + 동명사\n• through Ving: ~함으로써\n• by Ving: ~하는 것에 의해\n• without Ving: ~하지 않고\n• 전치사 뒤에는 반드시 동명사(Ving)!\n\n⚠️ 함정: to부정사의 to와 전치사 to 구분\n• look forward to Ving (전치사 to)\n• want to V (to부정사의 to)'}},

{id:20,type:'어순배열',diff:'어려움',pts:3,fmt:'mc',note:'문장33',
 passage:``,
 stem:'주어진 단어를 올바른 순서로 배열한 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">With group participation and feedback, [① an informative visual map / ② of safe routes / ③ to school / ④ can be constructed].</div>',
 ch:['① ①-②-③-④','② ①-④-②-③','③ ④-①-②-③','④ ②-③-①-④','⑤ ①-③-②-④'],ans:0,
 det:{ref:'[원문] With group participation and feedback, an informative visual map of safe routes to school can be constructed.\n[해석] 집단 참여와 피드백을 통해, 안전한 등교 경로에 대한 유익한 시각적 지도가 만들어질 수 있다. [문장 33 참고]',
      correct:'주어(an informative visual map) + 후치수식(of safe routes to school) + 동사(can be constructed) 순서.',
      wrongs:['① ①-②-③-④ ✅ — 주어 + of구 + to구 + 동사: 올바른 순서','② ①-④-②-③ ❌ — 동사가 수식어 앞에 오면 주어 수식 구조 파괴','③ ④-①-②-③ ❌ — 동사가 맨 앞에 올 수 없음 (도치 아님)','④ ②-③-①-④ ❌ — 전치사구가 주어 앞에 올 수 없음','⑤ ①-③-②-④ ❌ — to school이 of safe routes 앞에 오면 의미 부적절'],
      tip:'💡 영어 어순 원칙\n• 주어 + 후치수식어(전치사구) + 동사\n• 전치사구 수식: map of routes to school (큰→작은)\n\n⚠️ 함정: 수동태(can be constructed)를 능동태로 혼동하지 말 것'}},

{id:21,type:'오류찾기',diff:'어려움',pts:4,fmt:'mc',note:'문장35-36',
 passage:``,
 stem:'다음 문장에서 문법적 오류가 있는 부분을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">The process is ⓐ <u>defined</u> by the community itself, ⓑ <u>depending</u> on what issues are ⓒ <u>risen</u> and how the community members decide to deal with ⓓ <u>them</u>.</div>',
 ch:['① ⓐ defined','② ⓑ depending','③ ⓒ risen','④ ⓓ them','⑤ 오류 없음'],ans:2,
 det:{ref:'[원문] The process is defined by the community itself, depending on what issues are raised and how the community members decide to deal with them.\n[해석] 그 과정은 공동체 자체에 의해 정의되며, 어떤 문제가 제기되고 공동체 구성원들이 그것을 어떻게 다루기로 결정하느냐에 달려 있다. [문장 36 참고]',
      correct:'risen → raised. raise는 타동사("제기하다")이고 rise는 자동사("올라가다"). issues가 "제기되는" 것이므로 수동태 are raised가 적절. risen은 rise의 과거분사로 자동사의 수동태는 불가.',
      wrongs:['① ⓐ defined ✅ — 수동태 is defined by: 올바름','② ⓑ depending ✅ — 분사구문: "~에 따라" 올바름','③ ⓒ risen ❌ — rise(자동사)의 과거분사. are risen은 불가. are raised(타동사 수동태)가 올바름','④ ⓓ them ✅ — deal with them: issues를 받는 대명사, 적절','⑤ 오류 없음 ❌ — ⓒ에 오류 있음'],
      tip:'💡 raise vs rise\n• raise(타동사): raise-raised-raised (올리다, 제기하다)\n  → issues are raised (문제가 제기되다) ✅\n• rise(자동사): rise-rose-risen (오르다)\n  → 수동태 불가: issues are risen ❌\n\n⚠️ 시험 최다 빈출: raise/rise, lay/lie 혼동'}},

 passage:``,
 stem:'다음 한국어를 영작한 것으로 가장 적절한 것은?<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">"여러분은 학교 안전 문제를 파악하는 것을 돕기 위해 지역 관리들에게 그 지도를 제공할 수 있다."</div>',

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
