// Q1: 문장삽입 · 어려움 · 6pts
{id:1,type:`문장삽입`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`①`,`②`,`③`,`④`],
passage:`I had always dreamed of visiting San Francisco, but as a wheelchair user, I wasn\u2019t sure if the city would be accessible. ① When I arrived, I was amazed to find that the famous cable cars had wheelchair ramps. ② I rode one up the steep hills, feeling the cool breeze on my face. ③ The view from the top was breathtaking, and I could see the entire bay sparkling in the sunlight. ④`,
stem:`다음 글에서 주어진 문장이 들어가기에 가장 적절한 곳은?\n<br><br><b>"It was a small detail, but it meant the world to me — the city was welcoming me with open arms."</b>`,
det:{korean:`케이블카에 휠체어 램프가 있다는 것에 놀란 직후, 그것이 작은 디테일이지만 자신에게 큰 의미였다는 감상이 와야 한다. 그 다음에 실제로 탑승한 경험으로 이어진다.`,
analysis:`✅ ②: 램프 발견(①) → 감동 표현 → 실제 탑승(③)으로 자연스러운 흐름\n❌ ①: 아직 도착 전\n❌ ③: 이미 탑승 후 경험 진행 중\n❌ ④: 전망 감상 후 → 감동의 맥락이 다름`,
tip:`감정 표현은 해당 경험 직후에 위치: 램프 발견 → 감동 → 탑승`}},

// Q2: 문장삽입 · 보통 · 5pts
{id:2,type:`문장삽입`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`①`,`②`,`③`,`④`],
passage:`At Yosemite, the towering sequoia trees took my breath away. ① I reached out and touched the rough bark of one ancient tree. ② My guide told me that some of these trees were over 2,000 years old. ③ As we moved deeper into the forest, we suddenly spotted a black bear in the distance. ④`,
stem:`다음 글에서 주어진 문장이 들어가기에 가장 적절한 곳은?\n<br><br><b>"I felt so small standing next to these giants of nature."</b>`,
det:{korean:`세쿼이아 나무의 거친 껍질을 만진 직후, 자연의 거인 앞에서 자신이 작게 느껴졌다는 감상이 와야 한다.`,
analysis:`✅ ②: 나무를 만진 후(①) → 작게 느낌 → 나무의 나이 설명(③)으로 자연스러운 흐름\n❌ ①: 아직 나무에 대한 구체적 경험 전\n❌ ③: 가이드 설명 직후 → 감상 위치로 부적절\n❌ ④: 곰 발견으로 주제 전환 후`,
tip:`감각 경험(touching) → 감정 반응(felt small) → 정보(2,000 years old)`}},

// Q3: 문장삽입 · 보통 · 5pts
{id:3,type:`문장삽입`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`],
passage:`The hand-crank bike was unlike anything I had ever used before. ① At first, I struggled to keep it moving on the uneven trail. ② But after a few minutes, I found my rhythm and began to pick up speed. ③ The wind rushed past me as I pedaled through the valley, and for a moment, I forgot all about my wheelchair. ④`,
stem:`다음 글에서 주어진 문장이 들어가기에 가장 적절한 곳은?\n<br><br><b>"I felt completely free, as if nothing in the world could stop me."</b>`,
det:{korean:`바람을 맞으며 계곡을 달리고 휠체어를 잊은 순간 → 완전한 자유를 느꼈다는 감정이 와야 한다.`,
analysis:`✅ ④: 속도를 내며 휠체어를 잊은 후 → 자유로움 표현으로 자연스러운 클라이맥스\n❌ ①: 아직 고군분투 전\n❌ ②: 리듬을 찾기 전 어려움 단계\n❌ ③: 리듬을 찾은 직후 → 아직 절정이 아님`,
tip:`감정의 절정(climax)은 행동의 절정 직후: 달리기 → 휠체어 잊음 → 자유 느낌`}},

{id:4,type:`어순배열`,diff:`어려움`,pts:6,fmt:"written",wa:`it takes is a little courage`,accept:[`it takes is a little courage`,`It takes is a little courage`],
passage:`Looking back on my journey, I realized that the world is more accessible than we think. We just have to be brave enough to explore it. Sometimes, all __________________________________________.`,
stem:`다음 주어진 단어를 올바른 순서로 배열하시오.\n<br><br><b>a / is / takes / it / little / courage</b>`,
det:{korean:`"<b>it takes is a little courage</b>" → 필요한 것은 약간의 용기뿐이다. all (that) it takes is ~ 구문.`,
analysis:`all (that) it takes(주어절) + is(동사) + a little courage(보어)\n관계대명사 that 생략: all it takes = 필요한 전부\nit takes = ~이 필요하다`,
tip:`all (that) it takes is ~ = 필요한 것은 ~뿐이다`}},

// Q5: 어순배열 · 쉬움 · 4pts
{id:5,type:`어순배열`,diff:`쉬움`,pts:4,fmt:"written",wa:`too beautiful to describe in words`,accept:[`too beautiful to describe in words`,`Too beautiful to describe in words`],
passage:`When we finally reached Tunnel View, I was speechless. The panoramic view of Yosemite Valley was __________________________________________.`,
stem:`다음 주어진 단어를 올바른 순서로 배열하시오.\n<br><br><b>in / too / describe / to / words / beautiful</b>`,
det:{korean:`"<b>too beautiful to describe in words</b>" → 말로 표현하기에는 너무 아름다웠다.`,
analysis:`too + 형용사(beautiful) + to부정사(to describe) + 전치사구(in words)\ntoo ~ to ...: 너무 ~해서 ...할 수 없다`,
tip:`too + adj + to-V: 너무 ~해서 ...할 수 없다`}},

// Q6: 어법 5지선다 · 보통 · 5pts
{id:6,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`I had always dreamed of ①<u>visiting</u> San Francisco. When I arrived, I was amazed ②<u>to find</u> that the cable cars had wheelchair ramps. I rode one up the steep hills, ③<u>felt</u> the cool breeze on my face. The view from the top was ④<u>breathtaking</u>, and I could see the entire bay ⑤<u>sparkling</u> in the sunlight.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 어법상 <b>틀린</b> 것은?`,
det:{korean:`③ felt → <b>feeling</b>: 주절(I rode one up)과 동시에 일어나는 동작을 나타내는 분사구문이 필요하다.`,
analysis:`❌ ③ felt: 접속사 없이 두 동사 연결 불가 → feeling(분사구문)\n✅ ① visiting: dream of ~ing → 올바름\n✅ ② to find: be amazed to-V → 올바름\n✅ ④ breathtaking: 보어 역할 형용사 → 올바름\n✅ ⑤ sparkling: 지각동사 see + O + ~ing → 올바름`,
tip:`주절, ~ing: 동시 동작 분사구문. 접속사 없이 동사 두 개 연결 불가`}},

// Q7: 어법 빈칸 · 보통 · 5pts
{id:7,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`that`,`what`,`which`,`where`],
passage:`Looking back on my journey, I realized __________ truly matters is not whether the path is easy, but whether you have the courage to take the first step.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`"<b>what</b> truly matters is ~" → 정말로 중요한 것은 ~이다. 선행사를 포함하는 관계대명사 what 필요.`,
analysis:`✅ ② what: 선행사 포함 관계대명사 → "~하는 것" (주어절)\n❌ ① that: realized의 목적절 접속사라면 뒤에 주어 필요\n❌ ③ which: 선행사 없음 → 불가\n❌ ④ where: 장소 부사절 → 문맥 불일치`,
tip:`what truly matters = 정말로 중요한 것 — what = the thing that`}},

// Q8: 어법 빈칸 · 어려움 · 6pts
{id:8,type:`어법`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`had never experienced`,`have never experienced`,`never experienced`,`was never experiencing`],
passage:`Riding the hand-crank bike through Yosemite Valley, I felt a sense of freedom that I __________ before. The wind in my hair and the open trail ahead made me feel truly alive.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`과거 시점(felt)보다 이전의 경험이 없었다는 의미 → <b>과거완료 had never experienced</b>`,
analysis:`✅ ① had never experienced: 과거완료 → felt(과거)보다 앞선 경험 부재\n❌ ② have never experienced: 현재완료 → 과거 시점의 서술과 시제 불일치\n❌ ③ never experienced: 단순과거 → "이전에"라는 대과거 의미 부족\n❌ ④ was never experiencing: 과거진행 → 문맥 부적합`,
tip:`과거 시점 기준 "그 전에 한 번도 ~한 적 없었다" → had never p.p.`}},

// Q9: 부적절 어휘 · 보통 · 5pts
{id:9,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`At Fisherman\u2019s Wharf, the smell of fresh seafood filled the air. I ①<u>eagerly</u> tried the famous clam chowder. The warm soup was ②<u>comforting</u> on the cool San Francisco afternoon. Looking out at the bay, I could see the Golden Gate Bridge standing ③<u>humbly</u> against the blue sky. It was even more ④<u>impressive</u> than I had ⑤<u>imagined</u>.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`금문교가 하늘을 배경으로 서 있는 모습은 "<b>우뚝(majestically/proudly)</b>"이 적절. ③ humbly(겸손하게)는 금문교의 웅장한 이미지와 맞지 않는다.`,
analysis:`❌ ③ humbly(겸손하게): 금문교는 거대하고 웅장한 구조물 → majestically/proudly가 적절\n✅ ① eagerly(열심히): 유명한 음식을 먹고 싶어하는 모습 → 적절\n✅ ② comforting(편안한): 따뜻한 수프의 느낌 → 적절\n✅ ④ impressive(인상적인): 금문교의 모습 → 적절\n✅ ⑤ imagined(상상했다): had imagined → 적절`,
tip:`humbly(겸손하게) ↔ majestically(웅장하게) — 금문교의 이미지에 맞는 단어 선택`}},

// Q10: 어휘 의미 · 쉬움 · 4pts
{id:10,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,
ch:[`breeze: 폭풍`,`ramp: 경사로`,`encounter: 만남`,`bark: 짖다`],
passage:`As we moved deeper into the forest, we suddenly had an unexpected encounter with a black bear. My heart raced, but our guide calmly told us to stay still and quiet.`,
stem:`다음 글의 밑줄 친 <b>encounter</b>의 의미로 가장 적절한 것은?`,
det:{korean:`encounter = <b>만남, 마주침</b>. 숲에서 곰과 예상치 못한 만남을 가졌다는 의미.`,
analysis:`✅ ③ encounter: 만남 → "unexpected encounter with a black bear" = 곰과의 예상치 못한 만남\n❌ ① breeze: 산들바람 (폭풍 아님)\n❌ ② ramp: 경사로 → encounter의 뜻이 아님\n❌ ④ bark: 여기서는 나무껍질/짖다 → encounter와 무관`,
tip:`encounter = (예기치 못한) 만남, 조우 — an unexpected encounter = 예상치 못한 만남`}},

// ━━━ 빈칸추론/서술형/내용/TF LAST ━━━

// Q11: 빈칸추론 · 어려움 · 6pts
{id:11,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:3,
ch:[`the beauty of nature`,`the kindness of strangers`,`physical strength`,`courage to take the first step`],
passage:`Looking back on my journey, I realized that the world is more accessible than we think. We just have to be brave enough to explore it. Sometimes, all it takes is a little courage. My trip taught me that the biggest barrier was not my wheelchair — it was my own fear. What truly changed my life was not the places I visited, but __________.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`글의 결론: 가장 큰 장벽은 휠체어가 아니라 두려움이었다. 인생을 바꾼 것은 장소가 아니라 <b>첫 걸음을 내딛는 용기</b>였다.`,
analysis:`✅ ④ courage to take the first step: "all it takes is a little courage" + "biggest barrier was my own fear"와 일관\n❌ ① the beauty of nature: 자연의 아름다움은 부분 주제이지 핵심 교훈이 아님\n❌ ② the kindness of strangers: 본문에서 낯선 사람의 친절은 핵심이 아님\n❌ ③ physical strength: 체력 → 글의 메시지와 반대`,
tip:`글의 핵심 메시지(용기)와 빈칸 앞 단서("biggest barrier was my own fear")를 연결`}},

// Q12: 빈칸추론 · 보통 · 5pts
{id:12,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`accessibility`,`danger`,`loneliness`,`expense`],
passage:`When I arrived in San Francisco, I was amazed to find that the famous cable cars had wheelchair ramps. The hotel had wide doorways and roll-in showers. Even the steep streets of the city had smooth curb cuts. The __________ of the city surprised and delighted me at every turn.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`램프, 넓은 문, 경사로 등 휠체어 사용자를 위한 시설 → 도시의 <b>접근성(accessibility)</b>`,
analysis:`✅ ① accessibility: 접근성 → 램프, 넓은 문, 경사로 등이 모두 접근성 관련\n❌ ② danger: 위험 → 문맥 반대\n❌ ③ loneliness: 외로움 → 무관\n❌ ④ expense: 비용 → 무관`,
tip:`wheelchair ramps, wide doorways, curb cuts → 모두 accessibility(접근성) 관련 시설`}},

// Q13: 서술형 어형변환 · 쉬움 · 4pts
{id:13,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`unexpected`,accept:[`unexpected`,`Unexpected`],
passage:`As we moved deeper into the forest, we had an __________ (expect) encounter with a black bear. My heart raced, but our guide calmly told us to stay still.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`expect(동사) → <b>unexpected(형용사)</b>: "예상치 못한 만남"이라는 의미. un-(부정 접두사) + expect + -ed`,
analysis:`expect(동사) → expected(형용사) → unexpected(형용사)\nan unexpected encounter = 예상치 못한 만남\n문맥상 곰과의 만남은 계획되지 않은 것`,
tip:`expect → expected(예상된) → unexpected(예상치 못한) — un- 접두사: 부정`}},

// Q14: 서술형 어형변환 · 보통 · 5pts
{id:14,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`accessible`,accept:[`accessible`,`Accessible`],
passage:`Looking back on my journey, I realized that the world is more __________ (access) than we think. We just have to be brave enough to explore it.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`access(명사/동사) → <b>accessible(형용사)</b>: "more ___"이므로 비교급 가능한 형용사 필요. "접근 가능한"`,
analysis:`access(명사) → accessible(형용사)\nmore + accessible = 더 접근 가능한\n비교급: more accessible than we think`,
tip:`access → accessible — -ible/-able 접미사: 명사/동사 → 형용사(~할 수 있는)`}},

// Q15: 서술형 본문찾기 · 쉬움 · 4pts
{id:15,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`Tunnel View`,accept:[`Tunnel View`,`tunnel view`,`Tunnel view`],
passage:`The next morning, we set off for the famous viewpoint. When we finally reached Tunnel View, I was speechless. The panoramic view of Yosemite Valley spread out before me — the granite cliffs, the waterfalls, and the endless forest below.`,
stem:`다음 글에서 화자가 요세미티에서 도착하여 말을 잃을 정도로 감동받은 장소의 이름을 본문에서 <b>2단어</b>로 찾아 쓰시오.`,
det:{korean:`"When we finally reached <b>Tunnel View</b>, I was speechless" → 터널 뷰`,
analysis:`화자가 도착하여 감동받은 장소 = Tunnel View\n"I was speechless" = 말을 잃었다`,
tip:`고유명사는 대문자로 시작: Tunnel View`}},

// Q16: 서술형 본문찾기 · 쉬움 · 4pts
{id:16,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`courage`,accept:[`courage`,`Courage`,`a little courage`],
passage:`Looking back on my journey, I realized that the world is more accessible than we think. We just have to be brave enough to explore it. Sometimes, all it takes is a little courage.`,
stem:`다음 글에서 화자가 여행을 통해 깨달은 핵심 메시지를 나타내는 단어를 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`"all it takes is a little <b>courage</b>" → 용기. 여행의 핵심 교훈.`,
analysis:`핵심 메시지 = courage(용기)\n"all it takes is a little courage" = 필요한 것은 약간의 용기뿐`,
tip:`글의 마지막 문장에서 핵심 키워드를 찾자: courage(용기)`}},

// Q17: 내용이해 일치 · 쉬움 · 4pts
{id:17,type:`내용이해`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`화자는 샌프란시스코에서 혼자 여행했다.`,`화자는 요세미티에서 핸드크랭크 자전거를 탔다.`,`화자는 금문교 위를 휠체어로 건넜다.`,`화자는 곰을 만나서 산을 뛰어 내려왔다.`],
passage:`Riding the hand-crank bike through Yosemite Valley, I felt a sense of freedom that I had never experienced before. The wind in my hair and the open trail ahead made me feel truly alive.`,
stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,
det:{korean:`"Riding the hand-crank bike through Yosemite Valley" → 화자는 요세미티에서 핸드크랭크 자전거를 탔다.`,
analysis:`✅ ② 요세미티에서 핸드크랭크 자전거 탑승: 원문 일치\n❌ ① 가이드와 함께 여행 → 혼자가 아님\n❌ ③ 금문교 위를 건넜다는 내용 없음\n❌ ④ 곰을 만나고 가만히 있으라는 안내를 받음`,
tip:`선택지의 세부 내용을 원문과 정확히 대조`}},

// Q18: 내용이해 불일치 · 어려움 · 6pts
{id:18,type:`내용이해`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`화자는 샌프란시스코의 케이블카에 휠체어 램프가 있어 놀랐다.`,`피셔맨스 워프에서 클램 차우더를 먹었다.`,`화자는 요세미티에서 세쿼이아 나무를 직접 심었다.`,`여행의 결론은 용기가 중요하다는 것이었다.`],
passage:`I had always dreamed of visiting San Francisco, but as a wheelchair user, I wasn\u2019t sure if the city would be accessible. When I arrived, I was amazed to find that the famous cable cars had wheelchair ramps. At Fisherman\u2019s Wharf, I eagerly tried the famous clam chowder. At Yosemite, the towering sequoia trees took my breath away. Looking back, all it takes is a little courage.`,
stem:`다음 글의 내용과 <b>일치하지 않는</b> 것은?`,
det:{korean:`화자는 세쿼이아 나무를 보고 감탄했지, 직접 <b>심지 않았다</b>. "took my breath away" = 감탄했다.`,
analysis:`❌ ③ 세쿼이아 나무를 심었다: 원문은 "took my breath away"(감탄) → 심었다는 내용 없음\n✅ ① 케이블카 휠체어 램프에 놀람: 원문 일치\n✅ ② 클램 차우더 먹음: 원문 일치\n✅ ④ 용기가 중요: 원문 일치`,
tip:`"took my breath away" = 숨이 멎을 정도로 감탄했다 ≠ 심었다`}},

// Q19: T/F · 보통 · 5pts
{id:19,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`True`,`False`],
passage:`As we moved deeper into the forest, we suddenly spotted a black bear in the distance. My heart raced, but our guide calmly told us to stay still and quiet. After a tense minute, the bear wandered off into the trees.`,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>The guide told the group to run away when they saw the black bear.</b>"`,
det:{korean:`본문: 가이드가 "stay still and quiet"(가만히 조용히 있으라)고 했다. "run away"(도망치라)와는 <b>반대</b>이다. → <b>False</b>`,
analysis:`❌ False: "stay still and quiet"(가만히) ≠ "run away"(도망치다) → 정반대`,

let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'문장삽입':'tag-insert','어순배열':'tag-order','어법':'tag-grammar','어휘':'tag-vocab','빈칸추론':'tag-blank','서술형':'tag-written','내용이해':'tag-content','T/F':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch?(d.q.ch.length===5?'①②③④⑤':d.q.ch.length===4?'①②③④':d.q.ch.length===3?'①②③':'①②'):'';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--oxl);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--oxl);color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000);
let txt=`📝 온라인퀴즈 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
