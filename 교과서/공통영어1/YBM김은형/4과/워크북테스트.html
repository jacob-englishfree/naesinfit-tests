<script>
const EI={subject:'공통영어1',pub:'YBM(김은형)',lesson:'4과',title:'Fake or Fact, That Is the Question',total:100,time:1200,histKey:'quizH_FF4',qCount:30};

const FULL_PASSAGE=`British writer Oobah Butler wanted to experiment with how easily one can manipulate public opinion online. He created a fake restaurant called The Shed at Dulwich. Butler set up an account for his "restaurant" on a popular online review site. He did not provide an exact address and wrote it was reservations only. He did this to make people think The Shed was a special restaurant.

He faked photos of The Shed's food with shaving cream, whitening tablets, and even his own foot. He then asked his friends to write favorable fake reviews on the review site.

Things quickly got, in Butler's words, "a little out of hand." From the lowest of the charts of the review site, The Shed continuously climbed the London rankings. He started getting e-mails and phone calls requesting reservations. Interest further increased when he told callers The Shed was "fully booked for the next six weeks."

Even funnier, food suppliers started guessing The Shed's address and sent him free samples, and many job applications came in. These things happened without Butler serving a single meal. The Shed eventually became London's number-one restaurant on one of the most trusted restaurant review sites. According to Butler, The Shed held that ranking for two weeks.

Butler's story shows that much of what we see on the Internet cannot be trusted. This emphasizes the importance of digital literacy. Digital literacy is about more than just using computers. It is the ability to use digital technology to find, evaluate, create, and communicate information. To become digitally literate, we need to develop an attitude and knowledge that enable us to detect false information online. False information is any information that misinforms or deceives people. It can be about anything such as health, the environment, and economics across many platforms. It can be influential, as The Shed incident shows.

If people had been digitally literate, they would not have been fooled by The Shed experiment so easily. Digitally literate people would have carefully considered information about The Shed without being distracted by other people's reactions. They would have been suspicious that the restaurant did not have an address. They would have wondered why reviews on the restaurant did not appear in other more credible media. If they had done these things, they would likely have suspected that something was not right.

Fortunately, The Shed incident was an experiment that caused little damage. However, false information can cause emotional or financial harm to people. For example, false information about a certain gender or belief group can stir up hatred against that group. It can cause fights between those who support the group and those who do not. In addition, misleading online reviews about questionable products often trick people into wasting money.

To avoid being deceived by false information, we need to develop a habit of critically evaluating what we see online. If you see a story that looks too good or too bad to be true, check the source first. Look at the website the story comes from. Does it look real? Are there spelling errors? Does it have other stories or just the one you read? Check that the story contains references and links to other information. Click on those links and see if the other information looks reliable. Websites with false information often do not have many real stories about other topics. They also often have lots of advertisements that pop up when you visit the sites.

You should then check the credibility of the content creator. If a story has no writer's name, this could be a sign that its content is questionable. If there is a name, find out what and where the person has reported before. If the person has not written anything else or writes for a website that looks unreliable, think twice before believing the content.

Finally, check who else is reporting the story. If no other media are reporting the same story, the story may not be true. Pick a few keywords from the story and put them in a search site to see if other media are supporting the story.

Sorting through the vast amount of information created and shared online is challenging. However, it is important that we know what false information is and how it spreads. The better we recognize false information, the better we will be at avoiding it and helping others do the same.

Walking on the beach, you do not need to worry about footprints. They vanish with the waves. However, a "digital footprint"—the data trail left when you sign up, access, or send content—not only proves challenging to remove but enables tracking of your behavior, preferences, and opinions.

There are two types of digital footprints. Active footprints, like social media posts, are intentionally created data, while passive footprints, such as website cookies and mobile phone activity, occur without your direct involvement.

Your digital footprints from these activities may remain permanent. Even if you request a website or social media platform to remove your personal information, someone might have already collected your information with bad intent. Additionally, your negative online activity can potentially harm your reputation or career. It is important to manage and reduce your digital footprints.`;

wrongs:['ⓐ continuous ❌ → continuously (부사 필요)','ⓑ ranking ❌ → rankings (복수형 필요)','ⓒ getting ✅ — start + V-ing 구조 적절','ⓓ requesting ✅ — 현재분사의 형용사적 용법으로 phone calls 수식'],

{id:12,type:'오류찾기',diff:'어려움',pts:4,fmt:'mc',note:'문장29-31',

{id:13,type:'오류찾기',diff:'어려움',pts:4,fmt:'mc',note:'문장62-64',
passage:``,
stem:'다음 문장에서 어법상 틀린 부분을 모두 고른 것은?<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">Your digital footprints from these activities may remain ⓐ <u>permanently</u>. Even if you request a website or social media platform ⓑ <u>removing</u> your personal information, someone might have already ⓒ <u>collected</u> your information with bad intent. Additionally, your negative online activity can ⓓ <u>potentially</u> harm your reputation or career.</div>',

correct:'정답: ③ ⓐ, ⓑ\n• ⓐ permanently → permanent (remain + 형용사보어: remain은 2형식 동사로 보어에 형용사 필요)\n• ⓑ removing → to remove (request + O + to V: request는 5형식에서 to부정사를 목적격보어로 취함)',

stem:'다음 주어진 문장이 들어갈 가장 적절한 위치는?<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;"><i>"This emphasizes the importance of digital literacy."</i></div><br>① 문장 14 뒤 &nbsp; ② 문장 15 뒤 &nbsp; ③ 문장 16 뒤 &nbsp; ④ 문장 18 뒤 &nbsp; ⑤ 문장 20 뒤',
ch:['① 문장 14 뒤 (The Shed eventually became...)','② 문장 15 뒤 (According to Butler...)','③ 문장 16 뒤 (Butler\'s story shows that...)','④ 문장 18 뒤 (Digital literacy is about...)','⑤ 문장 20 뒤 (we need to develop...)'],ans:2,
det:{ref:'[원문] Butler\'s story shows that much of what we see on the Internet cannot be trusted. This emphasizes the importance of digital literacy. Digital literacy is about more than just using computers.\n[해석] 버틀러의 이야기는 인터넷에서 보는 것의 상당 부분을 신뢰할 수 없음을 보여준다. 이것은 디지털 리터러시의 중요성을 강조한다. 디지털 리터러시는 단순히 컴퓨터를 사용하는 것 이상이다. [문장 16-18 참고]',
correct:'정답: ③ 문장 16 뒤 — "This"가 문장 16(인터넷 정보를 신뢰할 수 없다)의 내용을 받아 "디지털 리터러시의 중요성"으로 연결하고, 뒤의 문장 18에서 디지털 리터러시를 구체적으로 설명합니다.',
wrongs:['① ❌ — 문장 14는 The Shed가 1위가 된 내용으로, "This"가 받을 대상 불분명','② ❌ — 문장 15는 2주간 순위를 유지한 내용으로, 디지털 리터러시와 직접 연결 약함','③ ✅ — 문장 16(신뢰 불가)→ 삽입문(→ 디지털 리터러시 중요)→ 문장 18(정의) 흐름이 자연스러움','④ ❌ — 문장 18 뒤면 정의 바로 뒤에 중요성 강조가 오는 역순','⑤ ❌ — 문장 20 뒤는 이미 구체적 설명 단계로 전환됨'],
tip:'💡 문장삽입 전략\n• 지시어(This/These/Such) → 앞 문장 참조 확인\n• 논리 흐름: 사실 제시 → 중요성 강조 → 정의/설명\n\n⚠️ 함정\n• "This"가 가리키는 내용이 바로 앞에 있어야 함\n• "emphasizes the importance"는 앞의 부정적 사실에서 교훈을 이끌어내는 역할'}},

{id:23,type:'의미파악',diff:'보통',pts:3,fmt:'mc',note:'문장08',

ch:['① 약간 손에서 놓치게 되어','② 약간 통제 불능 상태가 되어','③ 약간 손을 다치게 되어','④ 약간 도움이 필요하게 되어','⑤ 약간 실망스럽게 되어'],ans:1,
det:{ref:'[원문] Things quickly got, in Butler\'s words, "a little out of hand."\n[해석] 상황이, 버틀러의 말에 따르면, "약간 통제 불능"이 되었다. [문장 08 참고]',
correct:'정답: ② 약간 통제 불능 상태가 되어 — "out of hand"는 "통제할 수 없는, 감당할 수 없는"이라는 관용 표현입니다.',
wrongs:['① ❌ — "손에서 놓치다"는 직역이며 관용적 의미와 다름','② ✅ — out of hand = 통제 불능, 감당 불가','③ ❌ — 신체 부상과 무관한 표현','④ ❌ — 도움 필요와는 무관','⑤ ❌ — 실망과는 무관한 표현'],
tip:'💡 핵심 관용표현: out of hand\n• = out of control, uncontrollable\n• 반대: in hand = 통제 하에\n• 예: The situation got out of hand. (상황이 통제 불능이 되었다.)\n\n⚠️ 함정\n• "a little"이 있어도 핵심 의미는 "통제 불능"'}},

{id:25,type:'영→한',diff:'보통',pts:3,fmt:'mc',note:'문장56',
passage:`However, a "digital footprint"—the data trail left when you sign up, access, or send content—<u>not only proves challenging to remove but enables tracking of your behavior, preferences, and opinions.</u>`,

ch:['① 제거하기 어려울 뿐만 아니라 행동, 선호, 의견을 추적할 수 있게 한다','② 제거하기 쉬울 뿐만 아니라 행동을 추적하는 것이 불가능하다','③ 제거하기 어렵지만 행동과 선호를 보호해 준다','④ 제거가 가능하고 추적을 방지해 준다','⑤ 도전적일 뿐만 아니라 의견을 변화시킨다'],ans:0,

correct:'정답: ① — not only A but (also) B: "A일 뿐만 아니라 B도" / challenging to remove: "제거하기 어려운" / enables tracking: "추적을 가능하게 하다"',
wrongs:['① ✅ — 정확한 해석','② ❌ — challenging = 어려운(O), 쉬운(X) / 추적 불가능(X)','③ ❌ — not only A but B를 "A하지만 B"로 잘못 해석','④ ❌ — 제거 가능(X), 추적 방지(X) — 정반대 의미','⑤ ❌ — "도전적"은 challenging의 오역, 의견 변화(X)'],
tip:'💡 핵심 구문: not only A but (also) B\n• "A일 뿐만 아니라 B도"\n• prove + 형용사: "~임이 판명되다"\n• challenging to V: "V하기 어려운"\n\n⚠️ 함정\n• challenging ≠ 도전적인 (이 문맥에서) → "어려운, 힘든"'}},

{id:27,type:'T/F',diff:'보통',pts:4,fmt:'mc',note:'종합-T/F',

tip:'💡 추론 불가 전략\n• "추론할 수 없는 것" = 본문에 근거가 없는 내용\n• 본문의 논지와 반대되거나 언급되지 않은 새로운 정보 찾기\n\n⚠️ 함정\n• ④는 그럴듯하지만 본문에서 차단 시스템 효과에 대한 언급 없음'}},

det:{ref:'[원문] This emphasizes the importance of digital literacy.\n[해석] 이것은 디지털 리터러시의 중요성을 강조한다. [문장 17 참고]',
correct:'정답: literacy — "digital literacy(디지털 리터러시)"는 이 글의 핵심 주제어입니다.',
wrongs:[],
tip:'💡 주제 빈칸 전략\n• 글에서 반복 등장하는 핵심 개념어를 빈칸으로 출제\n• "digital literacy"는 문장 17, 18, 20, 24, 25에서 반복\n\n⚠️ literacy의 뜻: "읽고 쓰는 능력" → digital literacy = "디지털 정보를 읽고 활용하는 능력"'}}
];

const QCOUNT=Q.length;

let S={ans:[],cur:0,ti:null,left:EI.time,start:0};

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name,answers:S.ans.slice()});if(h.length>20)h.length=20;localStorage.setItem(EI.histKey,JSON.stringify(h));}

function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map((x,idx)=>`<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade} · ${x.level||''}</div></div><div class="hi-right"><div class="hi-score" style="color:${x.score>=80?'var(--o)':'var(--r)'}">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div></div>${x.answers?`<button onclick="reviewHistory(${idx})" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid #dde8df;border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--o)">📝 정답·해설 다시 보기</button>`:''}</div>`).join('');p.style.display='block';}

function showQ(idx,direction){

function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
