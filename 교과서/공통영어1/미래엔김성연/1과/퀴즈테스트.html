.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--o);}.expl-box.tip-b{border-left:3px solid var(--o);background:var(--oxl);}

<script>
const EI={"subject":"공통영어1 미래엔(김성연)","pub":"1과","lesson":"The Power of Friendliness","title":"The Power of Friendliness: Soft but Strong","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_common1_mirae_L1_v1"};

const Q=[
// ━━━ 문장삽입/어순배열 FIRST ━━━

// Q1: 문장삽입 · 어려움 · 6pts
{id:1,type:`문장삽입`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`\u2460`,`\u2461`,`\u2462`,`\u2463`],
passage:`He explained that dogs, unlike wolves, have developed communicative skills with humans and a sense of friendliness. \u2460 They say that from the common ancestors of these two species, those that acted friendly toward humans evolved into dogs, and those that didn\u2019t became wolves. \u2461 Furthermore, Dr. Hare suggested that the friendly nature of dogs probably provided them with a survival advantage that allowed their population to grow larger than that of wolves. \u2462 I\u2019ll give you another example of how friendliness is related to survival. \u2463`,
stem:`다음 글에서 주어진 문장이 들어가기에 가장 적절한 곳은?\n<br><br><b>"This explanation sounds reasonable according to several evolutionary biologists."</b>`,
det:{korean:`"This explanation"은 Hare 박사가 개의 의사소통 능력과 친밀감에 대해 설명한 것을 가리킨다. 이 설명이 합리적이라고 말한 "several evolutionary biologists"가 바로 다음 문장의 "They"이다.`,
analysis:`✅ ①: "He explained..." 직후 → "This explanation"이 가리킬 대상이 바로 앞에 있고, "They say..."의 "They" = evolutionary biologists\n❌ ②: 이미 They의 말이 끝난 후 → This explanation의 지칭 대상이 모호\n❌ ③: 새 단락 시작 전 → 흐름 방해\n❌ ④: 새 예시 시작 후 → 문맥 불일치`,
tip:`"This explanation" → 앞 문장의 설명을 지칭, "They" → 바로 뒤에 나오는 주어와 연결`}},

// Q2: 문장삽입 · 보통 · 5pts
{id:2,type:`문장삽입`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`\u2460`,`\u2461`,`\u2462`,`\u2463`],
passage:`Neanderthals existed together with Homo sapiens until about 40,000 years ago, and they were known to be intelligent and physically superior to Homo sapiens. \u2460 Neanderthals were able to make tools and fire and had strong bodies with well-developed muscles and broad shoulders. \u2461 One possible explanation is that our ancestors lived in larger communities that promoted cooperation and the free exchange of knowledge, while Neanderthals tended to live in smaller groups. \u2462 These social differences may have given Homo sapiens a competitive advantage over Neanderthals, allowing them to adapt to an ever-changing environment. \u2463`,
stem:`다음 글에서 주어진 문장이 들어가기에 가장 적절한 곳은?\n<br><br><b>"Despite these attributes, however, it was Homo sapiens who ultimately survived and thrived."</b>`,
det:{korean:`"these attributes"는 네안데르탈인의 도구/불 제작 능력과 강한 신체를 가리킨다. 이 자질에도 "불구하고(Despite)" 호모 사피엔스가 살아남았다는 전환이 와야 한다.`,
analysis:`✅ ②: 네안데르탈인의 강점 서술 직후 → "these attributes" = 도구, 불, 강한 신체 → Despite로 전환\n❌ ①: 아직 구체적 자질 나열 전\n❌ ③: 이미 설명이 시작된 후\n❌ ④: 결론 이후`,
tip:`"Despite these attributes" → 앞에 attributes(자질)가 구체적으로 나열되어야 함`}},

// Q3: 어순배열 · 어려움 · 6pts
{id:3,type:`어순배열`,diff:`어려움`,pts:6,fmt:"written",wa:`each person can contribute to a more beautiful world`,accept:[`each person can contribute to a more beautiful world`,`Each person can contribute to a more beautiful world`],
passage:`Think of our society as a bouquet. Just as each flower adds to the beauty when it harmonizes with the others, __________________________________________ when they cooperate. By being kind and working together, we can truly flourish.`,
stem:`다음 주어진 단어를 올바른 순서로 배열하시오.\n<br><br><b>person / each / to / can / world / beautiful / a more / contribute</b>`,
det:{korean:`"<b>each person can contribute to a more beautiful world</b>" → 각 사람은 더 아름다운 세상에 기여할 수 있다.`,
analysis:`each person(주어) + can contribute(동사) + to a more beautiful world(전치사구)\n조동사 can 뒤 동사원형 contribute, "a more beautiful"이 world를 수식`,
tip:`주어(each person) + 조동사(can) + 동사(contribute) + to + 명사구(a more beautiful world)`}},

// ━━━ 어법/어휘 SECOND ━━━

// Q4: 어법 5지선다 · 보통 · 5pts
{id:4,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`\u2460`,`\u2461`,`\u2462`,`\u2463`,`\u2464`],
passage:`Although the two are \u2460<u>genetically</u> similar, they are different in nature. To study their cooperative behavior, Dr. Hare\u2019s team set up a device \u2461<u>which</u> required two individuals to pull both ends of a rope at the same time in order to access food on a board. When \u2462<u>placed</u> with partners that the chimpanzees knew, they were able to work together to get the food. However, when \u2463<u>pairing</u> with new partners, the chimpanzees usually failed to get the food, and when they occasionally \u2464<u>succeeded</u>, they did not share the food with their partner.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 어법상 <b>틀린</b> 것은?`,
det:{korean:`④ pairing → <b>paired</b>: 침팬지가 짝지어<b>지는</b> 것(수동)이므로 과거분사 paired가 적절하다.`,
analysis:`❌ ④ pairing(능동) → paired(수동): 실험에서 짝지어진 것(수동)\n✅ ① genetically: 부사 → similar 수식\n✅ ② which: 사물 선행사(device) 주격 관계대명사\n✅ ③ placed: 수동 분사구문\n✅ ⑤ succeeded: 과거형 동사`,
tip:`분사구문 능동/수동: 주어가 동작을 당하면 p.p.(수동)`}},

// Q5: 어법 빈칸 · 보통 · 5pts
{id:5,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`fascinate`,`fascinated`,`fascinating`,`fascination`],
passage:`It\u2019s good to see you, everyone! I\u2019m Dr. Edward Wilson, an evolutionary biologist. Thank you for inviting me here today. On my way, I had trouble locating this room. Luckily, a friendly student came up to me and walked me here. It\u2019s __________ how, in situations like this, we want to help someone in need.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`"It\u2019s + 형용사" 구문에서 상황이 흥미를 유발하므로 <b>fascinating</b>(흥미로운)이 적절하다.`,
analysis:`✅ ③ fascinating: It\u2019s + 형용사 → 상황 주어에 -ing형 형용사\n❌ ① fascinate: 동사원형 → 문법적 불가\n❌ ② fascinated: -ed형 → 사람이 느끼는 감정 (It\u2019s 주어에 부적절)\n❌ ④ fascination: 명사 → It\u2019s + 명사 구조 부자연스러움`,
tip:`It\u2019s + 감정 형용사: 상황/사물 주어 → -ing형 (fascinating, surprising)`}},

// Q6: 어법 빈칸 · 보통 · 5pts
{id:6,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`provide`,`provided`,`providing`,`to provide`],
passage:`Furthermore, Dr. Hare suggested that the friendly nature of dogs probably __________ them with a survival advantage that allowed their population to grow larger than that of wolves.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`that절 내의 동사로, 주절 동사 suggested(과거)에 맞춰 <b>과거시제 provided</b>가 적절하다.`,
analysis:`✅ ② provided: that절 안의 과거시제 동사\n❌ ① provide: 현재형 → suggested와 시제 불일치\n❌ ③ providing: 분사 → 동사 자리에 부적절\n❌ ④ to provide: to부정사 → 동사 자리에 부적절`,
tip:`주절이 과거(suggested) → that절도 과거(provided)로 시제 일치`}},

// Q7: 부적절 어휘 · 보통 · 5pts
{id:7,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`\u2460`,`\u2461`,`\u2462`,`\u2463`,`\u2464`],
passage:`Despite these attributes, however, it was Homo sapiens who ultimately survived and \u2460<u>thrived</u>. One possible explanation is that our ancestors lived in larger \u2461<u>communities</u> that promoted \u2462<u>isolation</u> and the free exchange of knowledge, while Neanderthals tended to live in \u2463<u>smaller</u> groups. These social differences may have given Homo sapiens a \u2464<u>competitive</u> advantage over Neanderthals.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`원문은 "promoted <b>cooperation</b>"(협력을 촉진). ③ isolation(고립)은 cooperation의 반의어로 부적절하다.`,
analysis:`❌ ③ isolation(고립): 원문 cooperation → "free exchange of knowledge"와 병렬 → 고립이 아닌 협력\n✅ ① thrived(번성했다): 원문 일치\n✅ ② communities(공동체): 원문 일치\n✅ ④ smaller(더 작은): 원문 일치\n✅ ⑤ competitive(경쟁적): 원문 일치`,
tip:`cooperation(협력) ↔ isolation(고립) — "free exchange of knowledge"와 함께 나오므로 협력이 적절`}},

// Q8: 빈칸추론 · 어려움 · 6pts
{id:8,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`competition`,`strength`,`kindness`,`intelligence`,`independence`],
passage:`In our competitive society, many people believe that only the biggest or the strongest can survive and thrive. However, I propose an alternative view: __________ is the key to success. Isn\u2019t that a comforting thought?`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`경쟁 사회에서 강한 자만 살아남는다는 통념에 대한 "대안적 견해(alternative view)"로 <b>친절(kindness)</b>이 성공의 열쇠라고 제안한다.`,
analysis:`✅ ③ kindness: "alternative view" → 강함이 아닌 친절이 성공의 열쇠\n❌ ① competition: "alternative"가 아닌 기존 관점\n❌ ② strength: biggest/strongest와 같은 맥락 → 대안이 아님\n❌ ④ intelligence: 언급 없음\n❌ ⑤ independence: 언급 없음`,
tip:`"alternative view" = 기존 관점(강함)의 대안 → kindness(친절)`}},

// Q9: 빈칸추론 · 보통 · 5pts
{id:9,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`commands`,`gestures`,`speeches`,`emotions`],
passage:`To answer these questions, I\u2019d like to tell you about my childhood companion dog, Sparky. When we played with a ball, I noticed that he responded well to my __________.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`Sparky는 주인의 <b>몸짓(gestures)</b>에 잘 반응했다. 이후 본문에서 개의 인간 몸짓에 대한 반응이 핵심 주제로 이어진다.`,
analysis:`✅ ② gestures: 본문의 핵심 주제 = 몸짓에 대한 반응\n❌ ① commands: 명령은 이 글의 초점이 아님\n❌ ③ speeches: 말/연설은 개와의 놀이 맥락에 부적절\n❌ ④ emotions: 감정에 대한 반응은 이 글의 주제가 아님`,
tip:`responded well to → 반응의 대상 + 이후 dog vs wolf 실험의 주제 = gestures`}},

// Q10: 서술형 어형변환 · 쉬움 · 4pts
{id:10,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`evolutionary`,accept:[`evolutionary`,`Evolutionary`],
passage:`It\u2019s good to see you, everyone! I\u2019m Dr. Edward Wilson, an __________ (evolution) biologist. Thank you for inviting me here today.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`evolution(명사) → <b>evolutionary(형용사)</b>: 명사 biologist를 수식하는 형용사 필요`,
analysis:`evolution(명사) → evolutionary(형용사)\n빈칸 뒤 biologist(명사)를 수식하는 형용사가 필요`,
tip:`evolution → evolutionary / revolution → revolutionary — -tion → -tionary 형용사화`}},

// Q11: 서술형 어형변환 · 보통 · 5pts
{id:11,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`cooperative`,accept:[`cooperative`,`Cooperative`],
passage:`I\u2019ll give you another example of how friendliness is related to survival. Dr. Hare and his colleagues designed an experiment with chimpanzees and bonobos. Although the two are genetically similar, they are different in nature. To study their __________ (cooperate) behavior, Dr. Hare\u2019s team set up a device which required two individuals to pull both ends of a rope at the same time.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`cooperate(동사) → <b>cooperative(형용사)</b>: 명사 behavior를 수식하는 형용사 필요`,
analysis:`cooperate(동사) → cooperative(형용사)\n빈칸 뒤 behavior(명사)를 수식하는 형용사가 필요\ncooperative behavior = 협력적 행동`,
tip:`cooperate → cooperative / compete → competitive — 동사 → -ive/-ative 형용사화`}},

// Q12: 서술형 본문찾기 · 쉬움 · 4pts
{id:12,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`ancestor`,accept:[`ancestor`,`Ancestor`],
passage:`The responsive behavior of dogs also caught the attention of an evolutionary anthropologist, Brian Hare. He conducted an experiment to see how dogs would respond to human gestures compared to wolves, who share the same common ancestor.`,
stem:`다음 글에서 개와 늑대가 공유하는 것을 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`"wolves, who share the same common <b>ancestor</b>" → 공통 조상 = <b>ancestor</b>`,
analysis:`개와 늑대가 공유하는 것 = the same common ancestor\n1단어 답 = ancestor`,
tip:`common ancestor = 공통 조상 — share the same common ancestor = 같은 공통 조상을 공유하다`}},

// Q13: 서술형 본문찾기 · 보통 · 5pts
{id:13,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`competitive advantage`,accept:[`competitive advantage`,`Competitive advantage`,`competitive Advantage`,`Competitive Advantage`],
passage:`One possible explanation is that our ancestors lived in larger communities that promoted cooperation and the free exchange of knowledge, while Neanderthals tended to live in smaller groups. These social differences may have given Homo sapiens a competitive advantage over Neanderthals, allowing them to adapt to an ever-changing environment.`,
stem:`다음 글에서 사회적 차이가 호모 사피엔스에게 제공한 것을 본문에서 <b>2단어</b>로 찾아 쓰시오.`,
det:{korean:`"given Homo sapiens a <b>competitive advantage</b> over Neanderthals" → 경쟁적 이점`,
analysis:`사회적 차이가 제공한 것 = competitive advantage\n2단어 답 = competitive advantage`,

// Q14: 내용이해 일치 · 쉬움 · 4pts
{id:14,type:`내용이해`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`침팬지는 새로운 짝과도 쉽게 협력했다.`,`보노보는 어떤 개체와 짝을 이루든 문제를 해결했다.`,`침팬지와 보노보는 본질적으로 같은 성격을 가진다.`,`보노보는 음식을 나누는 것을 거부했다.`],
passage:`I\u2019ll give you another example of how friendliness is related to survival. Dr. Hare and his colleagues designed an experiment with chimpanzees and bonobos. Although the two are genetically similar, they are different in nature. To study their cooperative behavior, Dr. Hare\u2019s team set up a device which required two individuals to pull both ends of a rope at the same time in order to access food on a board. When placed with partners that the chimpanzees knew, they were able to work together to get the food. However, when paired with new partners, the chimpanzees usually failed to get the food, and when they occasionally succeeded, they did not share the food with their partner. The bonobos, on the other hand, got along much better than the chimpanzees. They solved the problem regardless of which individual they were paired with, and they were also more willing to share the food.`,
stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,
det:{korean:`"They solved the problem regardless of which individual they were paired with" → 보노보는 어떤 개체와 짝을 이루든 문제를 해결했다.`,
analysis:`✅ ② 보노보는 어떤 개체와도 문제 해결: 원문 "regardless of which individual" 일치\n❌ ① 침팬지는 새 짝과 실패: "usually failed"\n❌ ③ 본질적으로 같다: "different in nature"\n❌ ④ 보노보는 나눔 거부: "more willing to share"`,
tip:`내용 일치: regardless of = ~에 상관없이 → 어떤 짝과도 성공`}},

// Q15: 내용이해 불일치 · 어려움 · 6pts
{id:15,type:`내용이해`,diff:`어려움`,pts:6,fmt:"mc",ans:3,
ch:[`네안데르탈인은 호모 사피엔스보다 신체적으로 우월했다.`,`호모 사피엔스의 조상들은 더 큰 공동체에서 살았다.`,`네안데르탈인은 도구와 불을 만들 수 있었다.`,`호모 사피엔스는 네안데르탈인보다 먼저 멸종했다.`],
passage:`Now let\u2019s turn our attention to ourselves, Homo sapiens. How have we managed to survive for so long? Neanderthals existed together with Homo sapiens until about 40,000 years ago, and they were known to be intelligent and physically superior to Homo sapiens. Neanderthals were able to make tools and fire and had strong bodies with well-developed muscles and broad shoulders. Despite these attributes, however, it was Homo sapiens who ultimately survived and thrived.`,
stem:`다음 글의 내용과 <b>일치하지 않는</b> 것은?`,
det:{korean:`본문: "it was Homo sapiens who ultimately survived and thrived" → 호모 사피엔스가 살아남았다. 따라서 "호모 사피엔스가 먼저 멸종했다"는 <b>반대</b>.`,
analysis:`❌ ④ 호모 사피엔스가 먼저 멸종: 원문과 정반대 → "Homo sapiens survived and thrived"\n✅ ① "physically superior" → 일치\n✅ ② "larger communities" → 일치\n✅ ③ "make tools and fire" → 일치`,
tip:`불일치 문제: 핵심 사실(누가 생존했는가)을 정확히 파악`}},

// Q16: 글의 목적 · 쉬움 · 4pts
{id:16,type:`내용이해`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,
ch:[`경쟁의 중요성을 강조하기 위해`,`동물 실험의 윤리적 문제를 제기하기 위해`,`다정함과 협력이 생존의 핵심임을 주장하기 위해`,`네안데르탈인의 생활 방식을 소개하기 위해`],
passage:`In our competitive society, many people believe that only the biggest or the strongest can survive and thrive. However, I propose an alternative view: kindness is the key to success. Isn\u2019t that a comforting thought? We can use the power of our natural kindness to communicate and cooperate with different individuals. We can all benefit from this instead of trying to be better than others.`,
stem:`이 글(강연) 전체의 목적으로 가장 적절한 것은?`,
det:{korean:`"kindness is the key to success" + 개/보노보/호모 사피엔스의 예시 → <b>다정함과 협력이 생존의 핵심</b>`,
analysis:`✅ ③ 다정함과 협력이 생존의 핵심: "kindness is the key to success"\n❌ ① 경쟁의 중요성: 오히려 이에 반대\n❌ ② 동물 실험 윤리: 언급 없음\n❌ ④ 네안데르탈인 소개: 예시일 뿐 목적 아님`,
tip:`강연의 목적: 결론부 "kindness is the key to success"가 핵심 주장`}},

ch:[`True`,`False`],
passage:`Now let\u2019s turn our attention to ourselves, Homo sapiens. How have we managed to survive for so long? Neanderthals existed together with Homo sapiens until about 40,000 years ago, and they were known to be intelligent and physically superior to Homo sapiens. Despite these attributes, however, it was Homo sapiens who ultimately survived and thrived. One possible explanation is that our ancestors lived in larger communities that promoted cooperation and the free exchange of knowledge.`,

{id:20,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`True`,`False`],
passage:`I\u2019d like to end this talk with a message. Think of our society as a bouquet. Just as each flower adds to the beauty when it harmonizes with the others, each person can contribute to a more beautiful world when they cooperate.`,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>The speaker compares society to a bouquet.</b>"`,
det:{korean:`"Think of our society as a bouquet" → 우리 사회를 꽃다발에 비유 → <b>True</b>`,
analysis:`✅ True: "Think of our society as a bouquet" → 사회를 꽃다발에 비유`,
tip:`Think of A as B = A를 B로 비유하다 → compare A to B와 같은 의미`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'문장삽입':'tag-insert','어순배열':'tag-order','어법':'tag-grammar','어휘':'tag-vocab','빈칸추론':'tag-blank','서술형':'tag-written','내용이해':'tag-content','T/F':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch?(d.q.ch.length===5?'①②③④⑤':d.q.ch.length===4?'①②③④':d.q.ch.length===3?'①②③':'①②'):'';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--oxl);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--oxl);color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000);
let txt=`📝 온라인퀴즈 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
