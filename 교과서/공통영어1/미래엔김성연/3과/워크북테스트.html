const P1=`Which is the better environment for studying: a noisy place or a quiet place? Rarely do people want to put up with a lot of noise because it can be unpleasant and distracting. Fortunately, scientists have invented noise-cancelling technology, which is now being used across various fields to reduce unwanted noise. What is the scientific principle behind this achievement? To understand this, let\u2019s examine how sound travels.`;

const P2=`Sound is produced through vibrations that occur from a sound source, when the strings of a guitar are played, for instance. The vibrations of the sound source cause the air to vibrate and the sound to travel as waves, similar to the ripples created in a lake when you throw a stone. When these sound waves reach our ears, the brain interprets them as sound. Just as different ripples in water might overlap if you throw two stones, sound waves can also interfere with each other when they meet. There are two types of interference: constructive and destructive. Constructive interference occurs when the peaks of two waves overlap, resulting in a bigger wave and a louder sound. Destructive interference, on the other hand, occurs when a peak of one wave overlaps with a valley of another wave, so they cancel each other out and produce a quieter sound, or no sound at all.`;

const P3=`Destructive interference is used in the noise-cancelling feature of headphones when we listen to music. Inside the headphones are microphones and noise-cancelling circuitry. The microphones pick up sounds from the outside, and the circuitry analyzes them to produce opposite sound waves. For example, if outside noise has a value of +1, the circuitry will generate an opposite noise of -1 and transmit it to the speakers. This cancels out the unwanted sound even in noisy surroundings, so you can hear the music sound clearly without turning up the volume. However, it is not easy to entirely eliminate external noise with this technology. To achieve full noise cancellation, the circuitry must convert the noise into digital data and instantly transmit the opposite sound to the speakers as soon as the noise reaches the microphones. Therefore, this noise-cancellation technology is effective for predictable sounds like those of car engines and subways that occur regularly or over a period of time. However, it\u2019s relatively less effective for inconsistent sounds such as those of people talking close to you.`;

const P4=`Noise-cancelling technology is not only used in music devices. Other fields also take advantage of this technology, such as ticket offices at tourist attractions which are often very noisy. Microphones are installed in ticket offices to detect external noise, and an opposite sound wave is generated and transmitted through a speaker, enabling the ticket agent to hear the customer\u2019s voice clearly. Another area in which this technology is used is drive-through fast-food restaurants and coffee shops. They use noise-cancelling headsets to improve communication between employees and customers by eliminating vehicle noise. These noise-cancelling headsets help drive-through employees take orders accurately. The same technology is also used for cars, whose audio systems generate waves to cancel out unpleasant sounds such as engine, wind, and road noise. Thanks to noise-cancelling devices, it is possible for drivers to focus on driving without being disturbed by distracting noises.`;

const P5=`As technology advances, many people expect it will solve various social issues caused by noise pollution. A common source of these problems is noisy neighbors, as the noise they make can lead to conflict among residents. Noise-cancellation technology can help address these problems by reducing unwanted disturbances, allowing people to lead more peaceful and healthier lives.`;

const DL=`Have you ever wondered what happens to sound waves when they enter our ears? Let\u2019s take a closer look. The journey starts from the external part of the outer ear, which gathers the waves and directs them into the ear. The collected waves then travel through the ear canal and reach the eardrum located in the middle ear. When the eardrum vibrates, these vibrations are transmitted to three small bones in the middle ear. These bones make the vibrations stronger and then pass them to a snail-shaped structure in the inner ear. Inside this fluid-filled structure are tiny hair cells. When the vibrations make waves in the fluid, the tiny hair cells move and generate electrical signals that travel to the auditory nerve. This nerve carries the information to the brain, where the signals are interpreted, allowing us to hear sound. Undoubtedly, it is a quite remarkable journey!`;

passage:`Fortunately, scientists have invented noise-cancelling technology, __________ is now being used across various fields to reduce unwanted noise.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`선행사 <b>noise-cancelling technology</b>(사물)를 보충 설명하는 계속적 용법의 <b>which</b>가 적절하다.`,
analysis:`✅ ① which: 계속적 용법 관계대명사 (콤마 + which)\n❌ ② what: 선행사 포함 → 앞에 선행사 있으므로 불가\n❌ ③ who: 사람 선행사용\n❌ ④ where: 관계부사 → 주어 자리에 부적절`,
tip:`콤마 + which: 계속적 용법 → 앞 문장 전체 또는 명사를 보충 설명`}},

{id:4,type:`어법`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`disturb`,`disturbing`,`disturbed`,`to disturb`,`having disturbed`],
passage:`Thanks to noise-cancelling devices, it is possible for drivers to focus on driving without being __________ by distracting noises.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`"without being + <b>p.p.</b>" = ~되지 않고. 운전자가 소음에 <b>방해받지(disturbed)</b> 않고`,
analysis:`✅ ③ disturbed: without being + p.p.(수동) → "방해받지 않고"\n❌ ① disturb: 원형 → being 뒤에 부적절\n❌ ② disturbing: 능동 → 운전자가 방해하는 것이 아님\n❌ ④ to disturb: 문법적 불가\n❌ ⑤ having disturbed: 완료형 → 부적절`,
tip:`without being + p.p. = ~되지 않고 (수동태의 부정)`}},

// ━━━ 어법 밑줄 오류 (Q5) ━━━

{id:5,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`\u2460`,`\u2461`,`\u2462`],
passage:`Sound is produced through vibrations that \u2460<u>occur</u> from a sound source. The vibrations of the sound source cause the air to \u2461<u>vibrate</u> and the sound to travel as waves, similar to the ripples \u2462<u>creating</u> in a lake when you throw a stone.`,
stem:`다음 글의 밑줄 친 ①~③ 중, 어법상 <b>틀린</b> 것은?`,
det:{korean:`③ creating → <b>created</b>: 잔물결이 <b>만들어지는</b> 것(수동)이므로 과거분사 created가 적절하다.`,
analysis:`❌ ③ creating(능동) → created(수동): ripples are created(잔물결이 만들어지다)\n✅ ① occur: 자동사 → 올바름\n✅ ② vibrate: cause + O + to V → 올바름`,
tip:`ripples created = 만들어진 잔물결 (과거분사 = 수동 의미의 형용사)`}},

// ━━━ 내용 이해 (Q6-Q8) ━━━

{id:6,type:`내용이해`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,
ch:[`보강 간섭은 소리를 작게 만든다.`,`상쇄 간섭은 두 파동의 마루가 겹칠 때 발생한다.`,`노이즈 캔슬링 기술은 상쇄 간섭 원리를 이용한다.`,`음파는 서로 만나도 간섭하지 않는다.`],
passage:P3,
stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,
det:{korean:`"Destructive interference is used in the noise-cancelling feature" → 노이즈 캔슬링은 상쇄 간섭을 이용한다.`,
analysis:`✅ ③ 상쇄 간섭 이용: 원문 "Destructive interference is used" 일치\n❌ ① 보강 간섭은 소리를 크게 만듦\n❌ ② 상쇄 간섭은 마루+골이 겹칠 때\n❌ ④ 음파는 간섭함`,
tip:`destructive interference = 상쇄 간섭 → 노이즈 캔슬링의 핵심 원리`}},

{id:7,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`노이즈 캔슬링 기술은 음악 기기에서만 사용된다.`,`매표소에서 마이크로 외부 소음을 감지한다.`,`드라이브스루에서 노이즈 캔슬링 헤드셋을 사용한다.`,`이 기술은 사람의 대화 소리에 가장 효과적이다.`],
passage:P3,
stem:`다음 글의 내용과 <b>일치하지 않는</b> 것은?`,
det:{korean:`"it\u2019s relatively less effective for inconsistent sounds such as those of people talking close to you" → 사람 대화에는 덜 효과적. "가장 효과적"은 반대.`,
analysis:`❌ ④ 사람 대화에 가장 효과적: 원문 "less effective for inconsistent sounds" → 반대\n✅ ① P4에서 음악 기기 외에도 사용 언급\n✅ ② P4에서 매표소 마이크 언급\n✅ ③ P4에서 드라이브스루 헤드셋 언급`,
tip:`predictable sounds(예측 가능한 소음)에 효과적, inconsistent sounds(불규칙한 소음)에는 덜 효과적`}},

{id:8,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`노이즈 캔슬링 기술의 한계를 비판하기 위해`,`노이즈 캔슬링 기술의 원리와 활용을 설명하기 위해`,`소음 공해의 위험성을 경고하기 위해`,`새로운 헤드폰 제품을 홍보하기 위해`],
passage:P1,
stem:`이 글 전체의 목적으로 가장 적절한 것은?`,
det:{korean:`소리의 원리 → 간섭 → 노이즈 캔슬링 원리 → 활용 분야 = <b>기술의 원리와 활용 설명</b>`,
analysis:`✅ ② 원리와 활용 설명: 글 전체가 원리(음파/간섭) + 활용(헤드폰/매표소/자동차) 구조\n❌ ① 한계 비판: 한계 언급은 있으나 비판이 목적 아님\n❌ ③ 위험성 경고: 주목적 아님\n❌ ④ 제품 홍보: 특정 제품 없음`,
tip:`글의 구조: 원리 소개 → 작동 방식 → 적용 분야 = 설명문`}},

// ━━━ 빈칸 추론 (Q9-Q11) ━━━

{id:9,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`amplify`,`create`,`strengthen`,`cancel`],
passage:`Destructive interference, on the other hand, occurs when a peak of one wave overlaps with a valley of another wave, so they __________ each other out and produce a quieter sound, or no sound at all.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`한 파동의 마루와 다른 파동의 골이 겹쳐 서로 <b>상쇄(cancel)</b>한다.`,
analysis:`✅ ④ cancel: cancel each other out = 서로 상쇄하다\n❌ ① amplify: 증폭 → 반대\n❌ ② create: 생성 → 문맥과 무관\n❌ ③ strengthen: 강화 → 반대`,
tip:`cancel each other out = 서로 상쇄하다 — destructive interference의 핵심`}},

{id:10,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`unpredictable`,`predictable`,`inaudible`,`artificial`],
passage:`Therefore, this noise-cancellation technology is effective for __________ sounds like those of car engines and subways that occur regularly or over a period of time.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`규칙적으로 발생하는 자동차 엔진, 지하철 소음은 <b>예측 가능한(predictable)</b> 소리이다.`,
analysis:`✅ ② predictable: "occur regularly" → 규칙적 = 예측 가능\n❌ ① unpredictable: 반의어\n❌ ③ inaudible: 들리지 않는 → 소음이므로 부적절\n❌ ④ artificial: 인공적 → 무관`,
tip:`predictable(예측 가능한) ↔ unpredictable/inconsistent(불규칙한)`}},

{id:11,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`vibrates`,`dissolves`,`expands`,`freezes`],
passage:`The collected waves then travel through the ear canal and reach the eardrum located in the middle ear. When the eardrum __________, these vibrations are transmitted to three small bones in the middle ear.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`고막이 <b>진동하면(vibrates)</b> 진동이 중이의 세 개 뼈에 전달된다.`,
analysis:`✅ ① vibrates: 고막의 기능 = 진동 → vibrations로 이어짐\n❌ ② dissolves: 녹다 → 무관\n❌ ③ expands: 팽창 → 무관\n❌ ④ freezes: 얼다 → 무관`,
tip:`eardrum vibrates → vibrations transmitted: 고막 진동 → 뼈로 전달`}},

// ━━━ 서술형 (Q12-Q16) ━━━

{id:12,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`distracting`,accept:[`distracting`,`Distracting`],
passage:`Which is the better environment for studying: a noisy place or a quiet place? Rarely do people want to put up with a lot of noise because it can be unpleasant and __________ (distract).`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`distract(동사) → <b>distracting(형용사)</b>: unpleasant(형용사)과 and로 병렬. "주의를 산만하게 하는"`,
analysis:`distract(동사) → distracting(형용사)\nunpleasant and ______ → and 병렬로 형용사 필요\ndistracting = 주의를 산만하게 하는`,
tip:`distract → distracting(능동 형용사) / distracted(수동 감정)`}},

{id:13,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`electrical`,accept:[`electrical`,`Electrical`],
passage:`When the vibrations make waves in the fluid, the tiny hair cells move and generate __________ (electricity) signals that travel to the auditory nerve.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`electricity(명사) → <b>electrical(형용사)</b>: 명사 signals를 수식하는 형용사 필요. "전기 신호"`,
analysis:`electricity(명사) → electrical(형용사)\n빈칸 뒤 signals(명사)를 수식하는 형용사 필요\nelectrical signals = 전기 신호`,
tip:`electricity → electrical / electric — 명사 → 형용사화`}},

{id:14,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`destructive`,accept:[`destructive`,`Destructive`],
passage:`There are two types of interference: constructive and destructive. Constructive interference occurs when the peaks of two waves overlap, resulting in a bigger wave and a louder sound. Destructive interference, on the other hand, occurs when a peak of one wave overlaps with a valley of another wave, so they cancel each other out.`,
stem:`다음 글에서 소음을 줄이는 데 사용되는 간섭의 종류를 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`소음을 줄이는 간섭 = <b>destructive</b> (상쇄 간섭) → "cancel each other out"`,
analysis:`소음 감소 = cancel each other out → destructive interference\n1단어 답 = destructive`,
tip:`constructive(보강) ↔ destructive(상쇄) — 노이즈 캔슬링 = destructive`}},

{id:15,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`circuitry`,accept:[`circuitry`,`Circuitry`],
passage:`Inside the headphones are microphones and noise-cancelling circuitry. The microphones pick up sounds from the outside, and the circuitry analyzes them to produce opposite sound waves.`,
stem:`다음 글에서 헤드폰 내부에서 외부 소리를 분석하여 반대 음파를 생성하는 장치를 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`외부 소리 분석 + 반대 음파 생성 = <b>circuitry</b> (회로)`,
analysis:`"the circuitry analyzes them to produce opposite sound waves"\n답 = circuitry`,
tip:`circuitry = 회로, 전자 회로 시스템`}},

{id:16,type:`서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`noise pollution`,accept:[`noise pollution`,`Noise pollution`,`noise Pollution`],
passage:P5,
stem:`다음 글에서 기술 발전으로 해결할 수 있을 것으로 기대되는 사회적 문제의 원인을 본문에서 <b>2단어</b>로 찾아 쓰시오.`,
det:{korean:`"various social issues caused by <b>noise pollution</b>" → 소음 공해`,
analysis:`사회적 문제의 원인 = noise pollution (소음 공해)\n2단어 답 = noise pollution`,
tip:`noise pollution = 소음 공해 — "caused by"가 원인을 나타내는 단서`}},

// ━━━ T/F (Q17-Q20) ━━━

{id:17,type:`T/F`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`True`,`False`],
passage:P2,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>Sound is produced through vibrations from a sound source.</b>"`,
det:{korean:`"Sound is produced through vibrations that occur from a sound source" → <b>True</b>`,
analysis:`✅ True: 본문과 정확히 일치`,
tip:`소리 = 음원의 진동을 통해 생성`}},

{id:18,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`True`,`False`],
passage:P3,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>Noise-cancelling technology can completely eliminate all types of external noise.</b>"`,
det:{korean:`"it is not easy to entirely eliminate external noise" + 불규칙 소음에 덜 효과적 → 완전히 제거할 수 없다 → <b>False</b>`,
analysis:`❌ False: "not easy to entirely eliminate" + "less effective for inconsistent sounds"`,
tip:`completely/entirely + all → 극단적 표현 주의`}},

{id:19,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`True`,`False`],
passage:DL,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>The eardrum is located in the middle ear.</b>"`,
det:{korean:`"the eardrum located in the middle ear" → <b>True</b>`,
analysis:`✅ True: 본문 원문과 정확히 일치`,
tip:`고막(eardrum)의 위치 = 중이(middle ear)`}},

{id:20,type:`T/F`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`True`,`False`],
passage:P4,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>Noise-cancelling technology in cars amplifies engine sounds for a better driving experience.</b>"`,
det:{korean:`본문: "audio systems generate waves to <b>cancel out</b> unpleasant sounds such as engine" → 엔진 소음을 <b>상쇄</b>하는 것이지 <b>증폭(amplify)</b>하는 것이 아니다. → <b>False</b>`,
analysis:`❌ False: cancel out(상쇄) ≠ amplify(증폭) → 정반대`,
tip:`cancel out(상쇄하다) ↔ amplify(증폭하다)`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법':'tag-grammar','내용이해':'tag-content','빈칸추론':'tag-blank','서술형':'tag-written','T/F':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch?(d.q.ch.length===5?'①②③④⑤':d.q.ch.length===4?'①②③④':d.q.ch.length===3?'①②③':'①②'):'';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:#EDE7F6;color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:#EDE7F6;color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000);
let txt=`📝 온라인워크북 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
