<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공통영어1 능률(오선영) 온라인퀴즈TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* NaesinFit — Orange Theme (퀴즈테스트) */
:root{
  --p:#E8772E;--pd:#B85A1A;--pl:#F5A623;--pxl:#FFF3E8;--pxxl:#FFFAF5;
  --bg:#F6F2EE;--text:#1A1A2E;--tm:#7A6A5E;--tl:#A89A8E;
  --r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;
  --o:#F59E0B;--ol:#FFF8E1;
  --card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);
  --radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;
  --pborder:#ddd8d2;--pbg-muted:#e8e0d8;
  --passage-bg:linear-gradient(135deg,#FFFAF8,#F5F0EB);
  --start-grad:linear-gradient(160deg,#FFF3E8,#FFE8D6 40%,#FFDDC8);
  --accent2:#D97706;
  --p-rgba-08:rgba(232,119,46,.08);
  --p-rgba-10:rgba(232,119,46,.1);
  --p-rgba-12:rgba(232,119,46,.12);
  --p-rgba-25:rgba(232,119,46,.25);
  --p-rgba-30:rgba(232,119,46,.3);
}

/* NaesinFit Test Engine — Common CSS (theme-agnostic)
   Theme-specific colors come from :root variables defined in theme-*.css:
   --p      : primary color
   --pd     : primary dark
   --pl     : primary light
   --pxl    : primary extra-light
   --pxxl   : primary xx-light
   --bg     : page background
   --text   : main text
   --tm     : text muted
   --tl     : text light
   --pborder: border color (theme-tinted)
   --pbg-muted: muted bg for tracks/bars
   --start-grad: startScreen gradient
   --accent2: secondary gradient stop (badge/header)
   --p-rgba-08: rgba for selected bg
   --p-rgba-12: rgba for box-shadow
   --p-rgba-10: rgba for focus ring
   --p-rgba-25: rgba for button shadow
   --p-rgba-30: rgba for selectPulse
*/

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Start Screen */
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:var(--start-grad);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--p),var(--accent2));color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--p),var(--accent2));padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid var(--pborder);}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid var(--pborder);border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid var(--pborder);border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-rgba-10);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;box-shadow:0 6px 20px var(--p-rgba-30);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid var(--pborder);color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--p);color:var(--p);}
.history-badge{background:var(--pxl);color:var(--p);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid var(--pborder);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--p);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}

/* Exam Screen */
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--p);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--p);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--p);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--accent2));transition:width .5s ease;border-radius:0 2px 2px 0;}

/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--pxl),var(--pl));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--pd);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:10px 14px 14px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
.slide-choices{display:flex;flex-direction:column;gap:3px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12px;line-height:1.3;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--p);background:var(--p-rgba-08);box-shadow:0 0 0 3px var(--p-rgba-12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 var(--p-rgba-30)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:20px;height:20px;font-size:10px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--p-rgba-10);}
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;box-shadow:0 2px 8px var(--p-rgba-25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--p);}
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--p);background:var(--pxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}

/* Type tags — same across all themes */
.tag-combo{background:#E8F5E9;color:#166534;}.tag-wrong{background:#FFF0F0;color:#D63B3B;}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:#EDF2FF;color:#3B6FD9;}.tag-ant{background:#FFF8E1;color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}.tag-insert{background:#E3F2FD;color:#1565C0;}.tag-order{background:#FFF8E1;color:#F57F17;}

.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:var(--pbg-muted);padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--p);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:var(--passage-bg);border-left:3px solid var(--p);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--pborder);border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--p);}.choice-btn.selected{border-color:var(--p);box-shadow:0 0 0 2px var(--p-rgba-12);background:var(--pxxl);}
.c-num{min-width:22px;height:22px;background:var(--pbg-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid var(--pborder);border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--p);}

/* Result Screen */
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--pxl),var(--pl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:var(--pbg-muted);border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--pl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--pxxl);border-radius:var(--rs);border:1px solid var(--pborder);}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--pxl);}.info-cell.highlight .ic-value{color:var(--p);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:var(--pbg-muted);border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--pl);color:var(--p);}.tag-item.weak{background:#FFF0F0;color:#D63B3B;}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--pxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid var(--pborder);border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--p);color:var(--p);}.act-btn.primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid var(--pborder);border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--pxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--pxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--pl);color:var(--p);}.expl-tag.tip{background:var(--pxl);color:var(--pd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--p);}.expl-box.tip-b{border-left:3px solid var(--p);background:var(--pxl);}

@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">온라인퀴즈 TEST</div>
  <h1 class="start-title">온라인퀴즈 <span>TEST</span></h1>
  <p class="start-subtitle">공통영어1 · 능률(오선영) · 1과 · 20문항</p>
  <div class="info-card"><div class="info-card-header">시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">공통영어1</span></div>
    <div class="info-row"><span class="info-label">문항</span><span class="info-value">능률(오선영) (1과)</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">Discovering Yourself through Challenges</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">20문항</div><div class="chip">20분</div><div class="chip">80점 이상 통과</div><div class="chip">100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="startExam()">시험 시작하기</button>
  <button class="btn btn-outline" onclick="toggleHistory()">시험 기록 보기 <span class="history-badge" id="hCount">0</span></button>
  <div id="historyPanel"></div>
</div>
</div>

const EI={"subject":"공통영어1","pub":"능률(오선영)","lesson":"1과","title":"Discovering Yourself through Challenges","total":100,"time":1200,"histKey":"quizTest_nle_o_c1_1","qCount":20,"totalQ":20};
const FULL_PASSAGE="\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was trying something new for each one. She told us that we should share our experiences with our classmates when we finished the challenges.\n\nChallenge 1: Ticket for One\nThese days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy. Going to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about. At first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me realize that I sometimes enjoy doing things alone. After the movie, I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future.\n\nChallenge 2: Riding the Waves\nEver since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course. At the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me. The next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.";
const Q=[{"id":1,"type":"어법","diff":"쉬움","pts":4,"fmt":"mc","note":"사역동사 make — Challenge 1 독립적 경험","passage":"These days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy. Going to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about. At first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me __________ that I sometimes enjoy doing things alone.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","ans":0,"ch":["realize","to realize","realizing","realized"],"det":{"ref":"[원문] This experience made me realize that I sometimes enjoy doing things alone. [해석] 이 경험은 내가 때때로 혼자 하는 것을 즐긴다는 것을 깨닫게 했다.","correct":"① realize(동사원형) ✅: 사역동사 make + 목적어(me) + 동사원형(realize). made me realize가 올바른 구문.<br>❌ ② to realize: make는 to부정사를 취하지 않음<br>❌ ③ realizing: 현재분사, make 구문에 부적절<br>❌ ④ realized: 과거형, make 구문에 부적절","wrongs":[],"tip":"🔑 사역동사 make + 목적어 + 동사원형. let/have/make 모두 동사원형을 취한다. 수동태: be made to + 동사원형."}},
{"id":2,"type":"어법","diff":"보통","pts":5,"fmt":"mc","note":"어법 오류 찾기 — Challenge 2 서핑 경험","passage":"Ever since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin ⓐ<u>surfing</u> at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course. At the beginning of the lesson, it was hard just ⓑ<u>to stand</u> up on the board. After some help from the instructor, however, I learned how ⓒ<u>balancing</u> properly and even managed to surf a few waves! It gave me such a rush of ⓓ<u>excitement</u>.","stem":"밑줄 친 ⓐ~ⓓ 중 어법상 어색한 것은?","ans":2,"ch":["ⓐ","ⓑ","ⓒ","ⓓ"],"det":{"ref":"[원문] I learned how to balance properly [해석] 나는 어떻게 균형을 잡는지 배웠다.","correct":"ⓒ balancing → to balance: learn how to + 동사원형 구문. how 뒤에 to부정사가 와야 한다.<br>ⓐ surfing ✅ a video clip of my cousin surfing — 지각동사 구문, 현재분사 정상<br>ⓑ to stand ✅ it was hard just to stand up — 가주어 it + 진주어 to부정사 정상<br>ⓓ excitement ✅ a rush of excitement — 전치사 of + 명사 정상","wrongs":[],"tip":"🔑 learn/know/wonder + how to + 동사원형: '~하는 방법을 배우다/알다'. how + -ing 형태는 불가."}},
{"id":3,"type":"어법","diff":"어려움","pts":6,"fmt":"mc","note":"(A)(B)(C) 어법 선택 — 전체 통합","passage":"Going to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about. At first, it felt a bit awkward and lonely (A) [<b>sitting / to sit</b>] in the theater by myself. But once the movie started, I became completely (B) [<b>absorbing / absorbed</b>] in the story. It was so satisfying just to focus on the movie itself. There was nothing (C) [<b>to distract / distracting</b>] me!","stem":"(A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?","ans":3,"ch":["sitting — absorbing — to distract","to sit — absorbing — distracting","sitting — absorbed — distracting","to sit — absorbed — to distract"],"det":{"ref":"[원문] it felt a bit awkward and lonely to sit / I became completely absorbed / There was nothing to distract me [해석] 극장에 혼자 앉는 것은 어색하고 외로웠다 / 완전히 이야기에 빠져들었다 / 나를 방해할 것이 없었다","correct":"(A) to sit ✅: 가주어 it + 진주어 to부정사 — it felt awkward to sit<br>(B) absorbed ✅: become absorbed in — '~에 빠져들다' 수동 의미의 과거분사<br>(C) to distract ✅: nothing to distract — to부정사의 형용사적 용법, nothing을 수식","wrongs":[],"tip":"🔑 (A) 가주어 it → 진주어 to부정사 (B) absorb는 '흡수하다', 사람이 빠져드는 것은 수동 → absorbed (C) -thing/-one + to부정사: 형용사적 용법"}},
{"id":4,"type":"어휘","diff":"보통","pts":5,"fmt":"mc","note":"(A)(B)(C) 어휘 선택 — Challenge 3 새로운 모습","passage":"Of all the challenges I chose for myself, the third one made me the most (A) [<b>nervous / relaxed</b>]: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw (B) [<b>attention / distraction</b>] to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that (C) [<b>suited / bothered</b>] me.","stem":"(A), (B), (C)의 각 네모 안에서 문맥에 맞는 낱말로 가장 적절한 것은?","ans":1,"ch":["nervous — distraction — suited","nervous — attention — suited","relaxed — attention — bothered","relaxed — distraction — bothered"],"det":{"ref":"[원문] the third one made me the most nervous / didn't want to draw attention to it / a shorter hairstyle that suited me [해석] 세 번째 도전이 가장 긴장되었다 / 이목을 끌고 싶지 않았다 / 나에게 어울리는 짧은 헤어스타일","correct":"(A) nervous ✅: 가장 긴장되게 했다<br>(B) attention ✅: draw attention to = ~에 주의를 끌다<br>(C) suited ✅: suit = 어울리다","wrongs":[],"tip":"🔑 draw attention to(~에 이목을 끌다) ↔ draw distraction은 부자연스러운 표현. suit(어울리다) ↔ bother(괴롭히다)."}},
{"id":5,"type":"어휘","diff":"쉬움","pts":4,"fmt":"mc","note":"부적절 어휘 — Challenge 2 물 공포 극복","passage":"Ever since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt ①<u>comfortable</u> while doing them. For the second challenge, I decided to try to ②<u>maintain</u> this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a ③<u>shallow</u> pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner ④<u>course</u>.","stem":"밑줄 친 ①~④ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","ans":1,"ch":["① comfortable","② maintain","③ shallow","④ course"],"det":{"ref":"[원문] I decided to try to overcome this discomfort [해석] 이 불편함을 극복하기로 했다.","correct":"② maintain(유지하다) → overcome(극복하다): 불편함을 '유지'가 아니라 '극복'하려 했다.<br>① comfortable ✅ 원문 일치<br>③ shallow ✅ 원문 일치<br>④ course ✅ 원문 일치","wrongs":[],"tip":"🔑 overcome(극복하다) ↔ maintain(유지하다). 도전의 목적은 불편함을 극복하는 것."}},
{"id":6,"type":"어휘","diff":"어려움","pts":6,"fmt":"mc","note":"부적절 어휘 — Challenge 1+3 심화","passage":"Going to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good ①<u>opportunity</u> to watch something different, so I chose a historical drama that I had been ②<u>curious</u> about. At first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely ③<u>absorbed</u> in the story. It was so ④<u>frustrating</u> just to focus on the movie itself.","stem":"밑줄 친 ①~④ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","ans":3,"ch":["① opportunity","② curious","③ absorbed","④ frustrating"],"det":{"ref":"[원문] It was so satisfying just to focus on the movie itself. [해석] 영화 자체에만 집중하는 것이 매우 만족스러웠다.","correct":"④ frustrating(좌절감을 주는) → satisfying(만족스러운): 혼자 영화에 집중한 경험이 '만족스러웠다'는 맥락.<br>① opportunity ✅ 원문 일치<br>② curious ✅ 원문 일치<br>③ absorbed ✅ 원문 일치","wrongs":[],"tip":"🔑 satisfying(만족스러운) ↔ frustrating(좌절감을 주는). 문맥상 긍정적 경험이므로 satisfying이 적절."}},
{"id":7,"type":"대의","diff":"보통","pts":5,"fmt":"mc","note":"주제 파악 — 전체 도전의 교훈","passage":"\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was trying something new for each one. She told us that we should share our experiences with our classmates when we finished the challenges.","stem":"위 글의 주제로 가장 적절한 것은?","ans":1,"ch":["학교 과제를 효율적으로 수행하는 방법","안전지대를 벗어나 자기 자신을 발견하는 것의 중요성","친구들과 경험을 공유하는 것의 즐거움","새 학기 첫날에 해야 할 준비 사항"],"det":{"ref":"[원문] pushing ourselves out of our comfort zones and learning more about ourselves [해석] 편안한 영역에서 벗어나 자신에 대해 더 배우기","correct":"② 안전지대를 벗어나 자기 발견 — 선생님이 comfort zone을 벗어나라고 한 핵심 메시지.<br>❌ ① 과제 수행 방법: 과제는 수단이지 주제가 아님<br>❌ ③ 경험 공유의 즐거움: 공유는 부수적 활동<br>❌ ④ 새 학기 준비: 배경 설정일 뿐","wrongs":[],"tip":"🔑 comfort zone(안전지대)에서 벗어나 새로운 도전을 통해 자기 자신을 알아가는 것이 글 전체의 주제."}},
{"id":8,"type":"대의","diff":"어려움","pts":6,"fmt":"mc","note":"제목 추론 — Challenge 3 핵심 교훈","passage":"Of all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me. The next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.","stem":"위 글의 제목으로 가장 적절한 것은?","ans":2,"ch":["How to Choose the Perfect Hairstyle","Why You Should Listen to Your Stylist","The Unexpected Power of Stepping Out of Your Comfort Zone","Overcoming the Fear of Others' Opinions"],"det":{"ref":"[원문] I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself. [해석] 안전지대를 벗어나는 것이 자신에 대한 감정에 이렇게 긍정적인 영향을 줄 줄 몰랐다.","correct":"③ 안전지대를 벗어나는 예상치 못한 힘 — 핵심 교훈이 제목에 그대로 반영됨.<br>❌ ① 완벽한 헤어스타일 고르기: 헤어스타일은 도전의 소재일 뿐<br>❌ ② 스타일리스트 말 듣기: 부수적 디테일<br>❌ ④ 타인 시선 두려움 극복: 관련 있지만 핵심은 comfort zone","wrongs":[],"tip":"🔑 마지막 문장이 글의 교훈. 'stepping out of my comfort zone'이 핵심 키워드."}},
{"id":9,"type":"대의","diff":"보통","pts":5,"fmt":"mc","note":"시사점 — Challenge 2 모험심 발견","passage":"Ever since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course. At the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.","stem":"위 글을 통해 필자가 얻은 교훈으로 가장 적절한 것은?","ans":0,"ch":["두려운 것도 직접 도전하면 내면의 모험심을 발견할 수 있다.","물에 대한 공포는 전문가의 도움 없이 극복할 수 없다.","실내 수영장에서의 경험은 바다 수영과 동일한 효과를 준다.","사촌의 조언을 따르면 어떤 운동이든 쉽게 배울 수 있다."],"det":{"ref":"[원문] While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure. [해석] 수상 스포츠에 대한 생각이 완전히 바뀐 건 아니지만, 모험심을 발견하는 데 도움이 되었다.","correct":"① 두려운 것에 도전 → 모험심 발견: 원문 결론과 일치.<br>❌ ② 전문가 없이 불가: 원문은 강사가 도왔지만 핵심이 아님<br>❌ ③ 실내=바다: didn't completely change → 동일하지 않음<br>❌ ④ 사촌 조언=만능: 과잉 일반화","wrongs":[],"tip":"🔑 While + 양보절이 핵심. 완전히 바뀐 건 아니지만(While), 모험심은 발견했다(it did help). 양보의 역접 구조 주목."}},
{"id":10,"type":"일치","diff":"쉬움","pts":4,"fmt":"mc","note":"내용 일치 — Challenge 1 혼자 영화 관람","passage":"These days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy. Going to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about. At first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me realize that I sometimes enjoy doing things alone. After the movie, I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future.","stem":"위 글의 내용과 일치하는 것은?","ans":3,"ch":["필자는 평소 극장에서 혼자 영화를 보는 편이다.","필자는 첫 번째 도전으로 액션 영화를 선택했다.","필자는 영화가 시작된 후에도 계속 어색함을 느꼈다.","필자는 혼자 영화를 본 후 앞으로 혼자 하는 활동을 더 즐기겠다고 다짐했다."],"det":{"ref":"[원문] I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future. [해석] 앞으로 더 자주 스스로 선택하고 혼자 활동을 더 즐기겠다고 다짐했다.","correct":"④ 혼자 활동을 더 즐기겠다는 다짐 — 원문 마지막 문장 일치.<br>❌ ① 평소 혼자: had never done before(한 번도 없었다)<br>❌ ② 액션 영화: historical drama(역사 드라마)를 선택<br>❌ ③ 계속 어색: once the movie started, completely absorbed(완전히 빠져들었다)","wrongs":[],"tip":"🔑 had never done before(과거완료) → 이전에 한 번도 해본 적 없다. ①의 함정."}},
{"id":11,"type":"불일치","diff":"보통","pts":5,"fmt":"mc","note":"내용 불일치 — Challenge 2+3 통합","passage":"Ever since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course. At the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.","stem":"위 글의 내용과 일치하지 않는 것은?","ans":2,"ch":["필자는 어렸을 때부터 물을 무서워했다.","사촌이 실내 수영장에서 서핑하는 영상을 소셜 미디어에서 보았다.","수업 초반부터 보드 위에 서는 것이 쉬웠다.","이 경험이 수상 스포츠에 대한 생각을 완전히 바꾸지는 못했다."],"det":{"ref":"[원문] At the beginning of the lesson, it was hard just to stand up on the board. [해석] 수업 초반에는 보드 위에 서는 것조차 어려웠다.","correct":"③ '쉬웠다'가 불일치: 원문은 it was hard(어려웠다).<br>✅ ① 원문 일치: always been afraid of water<br>✅ ② 원문 일치: a video clip of my cousin surfing<br>✅ ④ 원문 일치: didn't completely change my mind","wrongs":[],"tip":"🔑 hard(어려운) ↔ easy(쉬운). 반의어 함정에 주의."}},
{"id":12,"type":"빈칸","diff":"보통","pts":5,"fmt":"mc","note":"빈칸추론 — 도전 과제의 핵심","passage":"\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was __________. She told us that we should share our experiences with our classmates when we finished the challenges.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","ans":1,"ch":["completing all three challenges quickly","attempting something unfamiliar in each challenge","choosing the most difficult activity possible","working together with classmates on every task"],"det":{"ref":"[원문] The important part was trying something new for each one. [해석] 중요한 것은 각 도전에서 새로운 것을 시도하는 것이었다.","correct":"② attempting something unfamiliar = trying something new: 각 도전에서 익숙하지 않은 것을 시도하는 것이 핵심.<br>❌ ① 빨리 완료: 속도는 언급 없음<br>❌ ③ 가장 어려운 것: 새로운 것이지 가장 어려운 것이 아님<br>❌ ④ 함께 작업: 개인 도전 과제임","wrongs":[],"tip":"🔑 trying something new = attempting something unfamiliar. 패러프레이징 능력이 핵심."}},
{"id":13,"type":"빈칸","diff":"어려움","pts":6,"fmt":"mc","note":"빈칸추론 — Challenge 3 핵심 깨달음","passage":"Of all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me. The next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that __________ would have such a positive effect on how I felt about myself.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","ans":0,"ch":["venturing beyond what felt safe","listening to other people's advice","maintaining a consistent appearance","avoiding situations that cause anxiety"],"det":{"ref":"[원문] stepping out of my comfort zone [해석] 안전지대에서 벗어나는 것","correct":"① venturing beyond what felt safe = stepping out of my comfort zone: 안전지대를 벗어나는 것의 패러프레이징.<br>❌ ② 타인 조언: 스타일리스트 도움은 있었지만 핵심이 아님<br>❌ ③ 일관된 외모 유지: 오히려 변화를 준 것이 요점<br>❌ ④ 불안 회피: 도전의 반대 개념","wrongs":[],"tip":"🔑 stepping out of my comfort zone = venturing beyond what felt safe. 고난도 패러프레이징 유형."}},
{"id":14,"type":"함축","diff":"보통","pts":5,"fmt":"mc","note":"함축 의미 — 'Ticket for One'","passage":"These days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy. Going to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences.","stem":"위 글에서 'Challenge 1: Ticket for One'의 'Ticket for One'이 함축하는 의미로 가장 적절한 것은?","ans":3,"ch":["할인된 가격으로 영화표를 구매하는 것","한 편의 영화만 고를 수 있는 제한","오직 한 번만 사용할 수 있는 특별 입장권","혼자만을 위한 독립적인 경험을 시작하는 것"],"det":{"ref":"[원문] Going to the theater alone was something I had never done before. It was nice to choose the movie and the seat on my own. [해석] 혼자 극장에 가는 것은 처음이었다. 혼자 영화와 좌석을 고르니 좋았다.","correct":"④ 혼자만을 위한 독립적 경험: 'One'은 '한 사람'을 의미하며, 혼자서 독립적으로 즐기는 경험을 상징.<br>❌ ① 할인: 가격 관련 내용 없음<br>❌ ② 한 편 제한: one은 영화 수가 아닌 사람 수<br>❌ ③ 일회용 입장권: 특별 입장권과 무관","wrongs":[],"tip":"🔑 'Ticket for One' = 1인용 티켓. 혼자 극장에 가는 도전을 상징적으로 표현한 소제목."}},
{"id":15,"type":"순서","diff":"쉬움","pts":4,"fmt":"mc","note":"순서배열 — Challenge 2 서핑 도전 흐름","passage":"For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first.\n\n(A) She assured me that it wasn't too hard, so I signed up for a beginner course. At the beginning of the lesson, it was hard just to stand up on the board.\n\n(B) One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it.\n\n(C) After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement.","stem":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?","ans":0,"ch":["(B)-(A)-(C)","(A)-(B)-(C)","(C)-(B)-(A)","(A)-(C)-(B)"],"det":{"ref":"[원문 흐름] 불확실 → 영상 발견(B) → 사촌 확인+등록(A) → 강사 도움+서핑 성공(C)","correct":"① (B)-(A)-(C): (B) 사촌 서핑 영상 발견+메시지 → (A) She(사촌)가 확인+등록+수업 시작 → (C) 강사 도움 후 성공<br>❌ ② She의 지칭 대상 모호<br>❌ ③ 결과가 원인보다 먼저<br>❌ ④ (A) 다음 (C)는 가능하나 (B)가 먼저 와야 She 지칭 성립","wrongs":[],"tip":"🔑 She(A)는 my cousin(B)을 가리킨다. 대명사 추적이 핵심. B에서 cousin 소개 → A에서 She로 받음."}},
{"id":16,"type":"무관","diff":"보통","pts":5,"fmt":"mc","note":"무관 문장 — Challenge 3 새로운 모습 흐름","passage":"Of all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. ① For many years, I had kept the same hairstyle because I had been worried about my forehead. ② I had always thought it was large, and I didn't want to draw attention to it. ③ Regular exercise can help reduce stress and improve overall well-being. ④ Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist.","stem":"글의 흐름과 관계없는 문장은?","ans":2,"ch":["①","②","③","④"],"det":{"ref":"[흐름] 헤어스타일 변경의 두려움 → 이마 걱정 → (무관) → 자신감으로 미용실 방문","correct":"③ 정기적 운동과 스트레스 감소는 헤어스타일 변경 이야기와 무관.<br>✅ ① 같은 헤어스타일 유지 이유 — 흐름 적절<br>✅ ② 이마가 크다고 생각 — 흐름 적절<br>✅ ④ 자신감 생겨 미용실 방문 — 흐름 적절","wrongs":[],"tip":"🔑 글의 주제: 헤어스타일 변경 도전. 운동/스트레스는 완전히 다른 주제."}},
{"id":17,"type":"TF","diff":"보통","pts":5,"fmt":"mc","note":"TF 조합형 — 전체 도전 사실 확인","passage":"\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was trying something new for each one. She told us that we should share our experiences with our classmates when we finished the challenges.\n\nChallenge 1: Ticket for One\nThese days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy. Going to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about. At first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me realize that I sometimes enjoy doing things alone. After the movie, I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future.\n\nChallenge 2: Riding the Waves\nEver since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course. At the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me. The next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.","stem":"위 글의 내용을 바탕으로 다음 진술의 T(True)/F(False)를 판단한 것으로 옳은 것은?<br><br>(가) 필자는 첫 번째 도전에서 친구들이 좋아하는 장르의 영화를 선택했다.<br>(나) 필자의 사촌은 바다가 아닌 실내 수영장에서 서핑을 했다.<br>(다) 필자는 세 번째 도전 후 반 친구들에게 부정적인 반응을 받았다.","ans":0,"ch":["F — T — F","T — T — F","F — F — T","F — T — T"],"det":{"ref":"(가) historical drama를 선택 → 친구들이 좋아하는 action/SF가 아님 → F<br>(나) indoor pool, not in the ocean → T<br>(다) overall, the reactions were positive → 부정적 아님 → F","correct":"F — T — F<br>(가) F: 친구/가족이 좋아하는 액션/SF 대신 역사 드라마 선택<br>(나) T: 사촌이 실내 수영장에서 서핑한 영상<br>(다) F: 전반적으로 긍정적 반응","wrongs":[],"tip":"🔑 (가) those are the kinds of movies they enjoy = 액션/SF. 필자는 historical drama를 골랐다. (다) positive ≠ 부정적."}},
{"id":18,"type":"서술형","diff":"쉬움","pts":4,"fmt":"written","note":"어형변환 — Challenge 2 형용사→부사","passage":"At the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance __________ and even managed to surf a few waves!","stem":"다음 빈칸에 들어갈 적절한 형태로 바꿔 쓰시오.<br><br><b>proper</b> → __________","wa":"properly","accept":["properly","Properly"],"det":{"ref":"[원문] I learned how to balance properly [해석] 나는 적절하게 균형 잡는 법을 배웠다.","correct":"properly: 형용사 proper → 부사 properly. 동사 balance를 수식하므로 부사가 필요.","wrongs":[],"tip":"🔑 동사 수식 → 부사. proper(형용사) → properly(부사). -ly를 붙여 부사로 전환."}},

  catch (e) { return []; }
}

function saveToHistory(r, elapsed) {
  const h = getHistory();
  h.unshift({
    name: document.getElementById('inpName').value.trim(),
    school: document.getElementById('inpSchool').value.trim(),
    grade: document.getElementById('inpGrade').value,
    score: r.score, total: EI.total,
    correct: r.correct, wrong: r.wrong, unanswered: r.unanswered,
    elapsed, date: new Date().toISOString(),
    level: getLevel(r.score).name,
    answers: S.ans.slice()

  localStorage.setItem(EI.histKey, JSON.stringify(h));
}

function fmtTime(s) { return Math.floor(s / 60) + '\ubd84 ' + s % 60 + '\ucd08'; }

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2500);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

/* Section picker (for 부교재 with sec field) */
function toggleAllSec(el) {
  document.querySelectorAll('.sec-cb').forEach(function (cb) { if (cb.value !== 'all') cb.checked = el.checked; });
}

function getSelectedSections() {
  var cbs = document.querySelectorAll('.sec-cb:checked');
  var secs = [];
  cbs.forEach(function (cb) { if (cb.value !== 'all') secs.push(cb.value); });
  return secs;
}

function startExam() {
  var nm = document.getElementById('inpName').value.trim();
  if (!nm) { toast('\uc774\ub984\uc744 \uc785\ub825\ud574\uc8fc\uc138\uc694!'); return; }

  /* Section filtering (if sec picker exists) */
  var secPicker = document.getElementById('secPicker');
  var filtered;
  if (secPicker) {
    var secs = getSelectedSections();
    if (secs.length === 0) { toast('\uc2dc\ud5d8 \ubc94\uc704\ub97c \ucd5c\uc18c 1\uac1c \uc120\ud0dd\ud574\uc8fc\uc138\uc694!'); return; }
    filtered = Q.map(function (q, i) { return { q: q, i: i }; }).filter(function (f) { return secs.includes(f.q.sec); });
    S = { ans: Array(filtered.length).fill(null), cur: 0, ti: null, left: EI.time, start: Date.now(), order: shuffle([].concat(Array(filtered.length).keys ? Array.from({ length: filtered.length }, function (_, i) { return i; }) : [])), filtered: filtered.map(function (f) { return f.i; }), secs: secs };
    EI._origTotalQ = EI.totalQ; EI._origTotal = EI.total;
    EI.totalQ = filtered.length;
    EI.total = filtered.reduce(function (s, f) { return s + Q[f.i].pts; }, 0);
  } else {
    S = { ans: Array(Q.length).fill(null), cur: 0, ti: null, left: EI.time, start: Date.now(), order: shuffle(Array.from({ length: Q.length }, function (_, i) { return i; })), filtered: null, secs: null };
  }

  showScreen('examScreen');
  showQ(0);
  startTimer();
  updateProgress();
  initSwipe();
}

function showQ(idx, direction) {
  S.cur = idx;
  var oi = S.order ? S.order[idx] : idx;
  var qi = S.filtered ? S.filtered[oi] : oi;
  var q = Q[qi];
  var tc = typeTag[q.type] || '';
  var mk = '\u2460\u2461\u2462\u2463\u2464';
  var pp = document.getElementById('slidePassage');
  if (direction) {
    pp.classList.add(direction > 0 ? 'fade-out' : 'fade-in');
    setTimeout(function () {
      renderContent(idx, qi, q, tc, mk, pp);
      pp.classList.remove('fade-out', 'fade-in');
    }, 150);
  } else {
    renderContent(idx, qi, q, tc, mk, pp);
  }
}

function renderContent(idx, qi, q, tc, mk, pp) {
  var ph = '<div class="q-badge"><div class="q-num">' + (idx + 1) + '</div><span>' + q.type + '</span><span style="opacity:.6">' + q.diff + ' \u00b7 ' + q.pts + '\uc810</span></div>';
  if (q.passage) ph += '<div class="q-passage">' + q.passage + '</div>';
  else ph += '<div style="padding:30px;text-align:center;color:var(--tl)">\uc774 \ubb38\ud56d\uc740 \uc9c0\ubb38\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.</div>';
  pp.innerHTML = ph;
  pp.scrollTop = 0;
  var bt = document.getElementById('slideBottom');
  var bh = '<div class="slide-stem">' + q.stem + '</div><div class="slide-choices">';
  if (q.fmt === 'mc') {
    q.ch.forEach(function (c, ci) {
      var sel = S.ans[qi] === ci ? ' selected' : '';
      bh += '<button class="choice-btn' + sel + '" onclick="selectAns(' + idx + ',' + ci + ')"><span class="c-num">' + mk[ci] + '</span><span>' + c + '</span></button>';
    });
  }
  if (q.fmt === 'written') {
    var val = S.ans[qi] || '';
    bh += '<input class="written-input" value="' + val + '" placeholder="\ub2f5\uc548\uc744 \uc785\ub825\ud558\uc138\uc694..." oninput="writeAns(' + idx + ',this.value)">';
  }
  bh += '</div><div class="slide-nav"><button ' + (idx === 0 ? 'disabled ' : '') + ' onclick="navQ(-1)">\u2190 \uc774\uc804</button><span class="nav-cur">' + (idx + 1) + ' / ' + EI.totalQ + '</span><button class="sn-next" ' + (idx === EI.totalQ - 1 ? 'disabled ' : '') + ' onclick="navQ(1)">\ub2e4\uc74c \u2192</button></div>';
  bt.innerHTML = bh;
}

function selectAns(idx, ci) {
  var qi = S.order ? S.order[idx] : idx;
  if (S.filtered) qi = S.filtered[qi];
  S.ans[qi] = ci;
  var btns = document.querySelectorAll('.slide-choices .choice-btn');
  btns.forEach(function (b, i) {
    b.classList.toggle('selected', i === ci);
    if (i === ci) b.classList.add('just-selected');
  });
  updateProgress();
}

function writeAns(idx, val) {
  var qi = S.order ? S.order[idx] : idx;
  if (S.filtered) qi = S.filtered[qi];
  S.ans[qi] = val.trim() || null;
  updateProgress();
}

function navQ(dir) {
  var next = S.cur + dir;
  if (next >= 0 && next < EI.totalQ) showQ(next, dir);
}

function updateProgress() {
  var answered = S.ans.filter(function (a) { return a !== null; }).length;
  document.getElementById('progressFill').style.width = (answered / EI.totalQ * 100) + '%';
  document.getElementById('ansCount').textContent = answered + '/' + EI.totalQ;
}

function initSwipe() {
  var startX = 0, startY = 0;
  var el = document.getElementById('slideWrap');
  el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0 && S.cur < EI.totalQ - 1) navQ(1);
      if (dx > 0 && S.cur > 0) navQ(-1);
    }
  }, { passive: true });
}

  var unanswered = [];

  var btnsHtml = '';

  if (unanswered.length > 0) {

  }

function doSubmit() {
  clearInterval(S.ti);
  var elapsed = Math.floor((Date.now() - S.start) / 1000);
  var r = grade();
  saveToHistory(r, elapsed);
  renderResults(r, elapsed);
  showScreen('resultScreen');
  window.scrollTo(0, 0);
}

function grade() {
  var score = 0, correct = 0, wrong = 0, unanswered = 0;
  var details = [];
  var qs = S.filtered ? S.filtered.map(function (i) { return Q[i]; }) : Q;
  qs.forEach(function (q, i) {
    var a = S.ans[i];
    var ok = false;
    if (a === null) unanswered++;
    else if (q.fmt === 'mc') ok = a === q.ans;
    else {
      var u = String(a).trim().toLowerCase();
      if (q.accept) ok = q.accept.some(function (x) { return u === x.toLowerCase(); });
      if (!ok && q.wa) ok = u === q.wa.toLowerCase();
    }
    if (a !== null) { if (ok) { correct++; score += q.pts; } else wrong++; }
    details.push({ q: q, ans: a, ok: ok });
  });
  return { score: score, correct: correct, wrong: wrong, unanswered: unanswered, details: details };
}

function getWeakTypes() {
  var r = grade();
  var tm = {};
  r.details.forEach(function (d) {
    var t = d.q.type;
    if (!tm[t]) tm[t] = { total: 0, ok: 0 };
    tm[t].total++;
    if (d.ok) tm[t].ok++;
  });
  return Object.entries(tm).filter(function (e) { return e[1].ok < e[1].total; }).map(function (e) { return e[0]; });
}

function getTestName() {
  var t = document.title;
  if (t.includes('\ub2e8\uc5b4')) return '\ub2e8\uc5b4\ud14c\uc2a4\ud2b8';
  if (t.includes('\uc6cc\ud06c\ubd81')) return '\uc6cc\ud06c\ubd81\ud14c\uc2a4\ud2b8';
  if (t.includes('\ud034\uc988')) return '\ud034\uc988(\uc608\uc0c1\ubb38\uc81c)\ud14c\uc2a4\ud2b8';
  return 'TEST';
}

  if (!rec || !rec.answers) return toast('\uc774\uc804 \ubc84\uc804 \uae30\ub85d\uc740 \ud574\uc124\uc744 \ubcfc \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.');
  S.ans = rec.answers;
  S.start = Date.now() - rec.elapsed * 1000;
  document.getElementById('inpName').value = rec.name || '';
  document.getElementById('inpSchool').value = rec.school || '';

  modal.innerHTML = '<div style="font-size:18px;font-weight:900;margin-bottom:8px;color:#191F28">처음으로 돌아가시겠습니까?</div><div style="font-size:13px;color:#6B7684;margin-bottom:16px">진행 중인 시험이 초기화됩니다.</div><div style="display:flex;gap:8px"><button onclick="document.body.removeChild(this.closest(\'div[style*=fixed]\'))" style="flex:1;padding:12px;border-radius:10px;border:2px solid #E5E8EB;background:#fff;color:#4E5968;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit">취소</button><button onclick="document.body.removeChild(this.closest(\'div[style*=fixed]\'));goHome()" style="flex:1;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#5B21B6,#7C3AED);color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit">처음으로</button></div>';
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

window.addEventListener('beforeunload', function (e) {
  if (S.ti) { e.preventDefault(); e.returnValue = ''; }
});

updateHCount();
</script>
