<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공통영어1 능률(오선영) 2과 온라인워크북TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>

:root{--o:#7C3AED;--od:#5B21B6;--ol:#A78BFA;--oxl:#F3F0FF;--oxxl:#FAF5FF;--bg:#F5F3FF;--text:#1E1B18;--tm:#6B6560;--tl:#A09890;--g:#1A9960;--gl:#E6F9F0;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--p:#7C4DFF;--pl:#F3EEFF;--sky:#0EA5E9;--skyl:#E8F6FF;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s cubic-bezier(.4,0,.2,1);}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,#F3F0FF,#EDE7F6 40%,#E8E0F6);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--warn),#6D28D9);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--od),var(--warn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--warn),#6D28D9);padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f0edf5;}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid #d8d0e8;border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid #c8c0d8;border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--warn);box-shadow:0 0 0 4px rgba(124,58,237,.1);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;box-shadow:0 6px 20px rgba(124,58,237,.3);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid #c0b8d8;color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--warn);color:var(--warn);}
.history-badge{background:var(--oxl);color:var(--warn);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid #d8d0e8;border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--warn);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--warn);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--warn);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--warn);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
/* Progress bar at top */
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--warn),#6D28D9);transition:width .5s ease;border-radius:0 2px 2px 0;}
/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
/* Passage area - full screen scrollable */
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
/* Question info badge at top of passage */
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--oxl),var(--ol));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--od);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
/* Glass bottom panel */
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:12px 16px 16px;max-height:48vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
/* Stem */
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
/* Choices - premium feel */
.slide-choices{display:flex;flex-direction:column;gap:4px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;line-height:1.4;border:1.5px solid rgba(0,0,0,.06);border-radius:12px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--warn);background:rgba(124,58,237,.08);box-shadow:0 0 0 3px rgba(124,58,237,.12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 rgba(124,58,237,.3)}70%{box-shadow:0 0 0 8px rgba(124,58,237,0)}100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:24px;height:24px;font-size:11px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;}
/* Written input */
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--warn);box-shadow:0 0 0 3px rgba(124,58,237,.1);}
/* Navigation */
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(124,58,237,.25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--warn);}
/* Answer count indicator */
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--warn);background:var(--oxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--ol);color:#4A148C;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f0edf5;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--warn);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:linear-gradient(135deg,#FAFAFF,#F5F3FA);border-left:3px solid var(--warn);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid #d8d0e8;border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--warn);}.choice-btn.selected{border-color:var(--warn);box-shadow:0 0 0 2px rgba(124,58,237,.12);background:var(--oxxl);}
.c-num{min-width:22px;height:22px;background:#e8e0f0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid #c8c0d8;border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--warn);}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--oxl),var(--ol));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--od),var(--warn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8e0f0;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--warn),var(--ol));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--oxxl);border-radius:var(--rs);border:1px solid #d8d0e8;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--oxl);}.info-cell.highlight .ic-value{color:var(--warn);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0f0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--ol);color:var(--warn);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--oxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #c8c0d8;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--warn);color:var(--warn);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--warn));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #d8d0e8;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--oxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--oxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--ol);color:var(--warn);}.expl-tag.tip{background:var(--oxl);color:var(--od);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--warn);}.expl-box.tip-b{border-left:3px solid var(--warn);background:var(--oxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">📚 내신핏</div>
  <h1 class="start-title">온라인 워크북 <span>TEST</span></h1>
  <p class="start-subtitle">동아(이병민) 1과 · When Were You the Bravest?</p>
  <div class="info-card"><div class="info-card-header">📚 시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">과목</span><span class="info-value">공통영어1</span></div>
    <div class="info-row"><span class="info-label">출판사</span><span class="info-value">동아(이병민)</span></div>
    <div class="info-row"><span class="info-label">단원</span><span class="info-value">1과 When Were You the Bravest?</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">📝 30문항</div><div class="chip">⏱️ 20분</div><div class="chip">✅ 80점 이상 통과</div><div class="chip">📊 100점 만점</div></div>

    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="startExam()">시험 시작하기 →</button>

</div>
</div>
<div id="examScreen" class="screen">
  <div class="exam-topbar"><div class="topbar-left"><div class="topbar-dot"></div><div class="topbar-info">공통영어1 · 동아(이병민) · <span>1과</span></div></div><div class="timer" id="timer">20:00</div><button class="btn-submit" onclick="submitExam()">제출하기</button></div>

    <div class="slide-bottom" id="slideBottom"></div>
  </div>
</div>
<div id="resultScreen" class="screen"></div>
<script>
const EI={subject:'공통영어1',pub:'능률(오선영)',lesson:'2과',title:'Talk It Out, Help Is Here',total:100,time:1200,histKey:'quizH_fb2025',qCount:30};

const Q=[
{id:1,type:'어법',diff:'보통',pts:3,fmt:'mc',note:'문장01',
passage:``,
stem:'다음 중 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">On today\'s show, we are going to learn about special park benches in Zimbabwe <b>(called / calling)</b> Friendship Benches.</div>',
ch:['① called','② calling'],ans:0,
det:{ref:'[원문] On today\'s show, we are going to learn about special park benches in Zimbabwe called Friendship Benches.\n[해석] 오늘 쇼에서 우리는 짐바브웨에 있는 우정 벤치라고 불리는 특별한 공원 벤치에 대해 배울 것이다. [문장 01 참고]',
correct:'정답: called. 과거분사(p.p.)가 명사 benches를 뒤에서 수식. benches가 "불리는" 대상이므로 수동의 의미인 과거분사 called가 적절.',
wrongs:['① called ✅ — 수동 관계(~라고 불리는). benches와 call 사이에 수동 관계 성립','② calling ❌ — 능동/진행의 의미. benches가 스스로 부르는 것이 아니므로 부적절'],
tip:'💡 핵심 문법: 분사의 수식\n• 과거분사(p.p.): 수동·완료 → a book written by him\n• 현재분사(-ing): 능동·진행 → a boy running fast\n\n⚠️ 함정\n• called는 과거시제가 아닌 과거분사. \"named\"와 같은 의미'}},

{id:2,type:'어법',diff:'보통',pts:3,fmt:'mc',note:'문장06',
passage:``,
stem:'다음 중 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">One of my patients <b>(had become / has become)</b> severely depressed.</div>',
ch:['① had become','② has become'],ans:0,
det:{ref:'[원문] One of my patients had become severely depressed.\n[해석] 내 환자 중 한 명이 심하게 우울해진 상태였다. [문장 06 참고]',
correct:'정답: had become. 과거 시점(Dr. Chibanda가 경험을 회상하는 과거)보다 더 이전에 발생한 상황이므로 과거완료(had p.p.)가 적절.',
wrongs:['① had become ✅ — 대과거. 과거 시점보다 앞선 시점의 상태','② has become ❌ — 현재완료. 과거 회상 맥락에서 현재완료는 부적절'],
tip:'💡 핵심 문법: 과거완료(had p.p.)\n• 과거보다 더 이전의 동작/상태\n• 예: I realized I had lost my key.\n\n⚠️ 함정\n• 현재완료(has/have p.p.)는 과거~현재 연결. 순수 과거 맥락에서는 사용 불가'}},

{id:3,type:'어휘',diff:'보통',pts:3,fmt:'mc',note:'문장07',
passage:``,
stem:'다음 중 문맥상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">However, she couldn\'t get help because she was <b>(unable / enable)</b> to afford the bus ride to the hospital.</div>',
ch:['① unable','② enable'],ans:0,
det:{ref:'[원문] However, she couldn\'t get help because she was unable to afford the bus ride to the hospital.\n[해석] 그러나 그녀는 병원까지 버스비를 감당할 수 없었기 때문에 도움을 받을 수 없었다. [문장 07 참고]',
correct:'정답: unable. be unable to V = ~할 수 없다. 형용사 unable이 보어로 쓰임.',
wrongs:['① unable ✅ — 형용사, be unable to V (할 수 없다)','② enable ❌ — 동사(가능하게 하다). be동사 뒤에 동사원형은 올 수 없음'],
tip:'💡 핵심 어휘\n• unable (형용사): ~할 수 없는, be unable to V\n• enable (동사): ~을 가능하게 하다, enable + O + to V\n\n⚠️ 함정\n• able/unable은 형용사, enable/disable은 동사'}},

{id:4,type:'연결사',diff:'보통',pts:3,fmt:'written',note:'문장07',
passage:`One of my patients had become severely depressed. ( ___ ), she couldn't get help because she was unable to afford the bus ride to the hospital.`,
stem:'빈칸에 들어갈 알맞은 연결사를 쓰시오. (1단어, 영문 7자, H로 시작)<br><b>힌트:</b> 앞 문장(우울증 심각)과 뒷 문장(도움 못 받음) 사이의 <u>역접/대조</u> 관계',
wa:"However",accept:["However","however"],
det:{ref:'[원문] One of my patients had become severely depressed. However, she couldn\'t get help because she was unable to afford the bus ride to the hospital.\n[해석] 내 환자 중 한 명이 심하게 우울해진 상태였다. 그러나, 그녀는 병원까지 버스비를 감당할 수 없었기 때문에 도움을 받을 수 없었다. [문장 06-07 참고]',
correct:'정답: However. 앞 문장에서 환자가 심하게 우울했다는 사실과, 뒷 문장에서 도움을 받지 못했다는 상반된 내용을 연결하는 역접 연결사.',
wrongs:[],
tip:'💡 역접 연결사\n• However = 그러나 (문장 부사, 쉼표 필수)\n• Nevertheless = 그럼에도 불구하고\n• On the other hand = 반면에\n\n⚠️ 함정\n• However vs. But: However는 부사(쉼표+문장), But은 접속사(절+절)'}},

{id:5,type:'지칭추론',diff:'보통',pts:3,fmt:'mc',note:'문장08',
passage:`She couldn't get help because she was unable to afford the bus ride to the hospital. <u>This</u> shocked me, as I had never considered such a problem before.`,
stem:'밑줄 친 <u>This</u>가 가리키는 것으로 가장 적절한 것은?',
ch:['① 환자가 심하게 우울했던 것','② 환자가 버스비를 감당하지 못해 도움을 받을 수 없었던 것','③ 짐바브웨에 정신과 의사가 부족했던 것','④ 정신건강 치료비가 비쌌던 것','⑤ 우정벤치 프로그램이 시작된 것'],ans:1,
det:{ref:'[원문] This shocked me, as I had never considered such a problem before.\n[해석] 이것은 나에게 충격이었다, 왜냐하면 나는 전에 그런 문제를 고려해 본 적이 없었기 때문이다. [문장 08 참고]',
correct:'정답: ②. This는 바로 앞 문장의 내용, 즉 환자가 버스비를 감당할 수 없어 치료를 받지 못한 상황을 가리킴.',
wrongs:['① ❌ — 우울증 자체는 정신과 의사에게 놀라운 일이 아님','② ✅ — 경제적 이유로 치료 접근이 불가능한 상황이 충격','③ ❌ — 정신과 의사 부족은 이후 문장에서 언급','④ ❌ — 치료비가 아닌 교통비 문제','⑤ ❌ — 프로그램은 이 경험 이후에 시작됨'],
tip:'💡 지칭추론 핵심\n• This/That/It → 보통 바로 앞 문장(절)의 내용을 가리킴\n• such a problem = 이러한 문제 (교통비 문제를 재지칭)\n\n⚠️ 함정\n• This가 단어 하나가 아닌 "상황 전체"를 가리키는 경우 주의'}},

{id:6,type:'어법',diff:'보통',pts:3,fmt:'mc',note:'문장09',
passage:``,
stem:'다음 중 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">In fact, it is difficult for many people in Zimbabwe <b>(to pay / paying)</b> for transportation and receive medical treatment.</div>',
ch:['① to pay','② paying'],ans:0,
det:{ref:'[원문] In fact, it is difficult for many people in Zimbabwe to pay for transportation and receive medical treatment.\n[해석] 사실, 짐바브웨의 많은 사람들이 교통비를 지불하고 의료 치료를 받는 것은 어렵다. [문장 09 참고]',
correct:'정답: to pay. 「It is difficult (for+목적격) + to부정사」 가주어-진주어 구문. It이 가주어, to pay 이하가 진주어.',
wrongs:['① to pay ✅ — 가주어 It의 진주어 역할 to부정사','② paying ❌ — 동명사는 가주어-진주어 구문에서 부적절 (It ... paying 불가)'],
tip:'💡 핵심 문법: 가주어-진주어\n• It is + 형용사 + (for 의미상 주어) + to V\n• 예: It is important for students to study hard.\n\n⚠️ 함정\n• It is no use -ing는 동명사를 쓰는 예외 구문'}},

{id:7,type:'연결사',diff:'보통',pts:3,fmt:'written',note:'문장10',
passage:`It is difficult for many people in Zimbabwe to pay for transportation and receive medical treatment. ( ___ ), there has been a lack of psychiatrists in the country for many years.`,
stem:'빈칸에 들어갈 알맞은 연결사를 쓰시오. (1단어, 영문 11자, F로 시작)<br><b>힌트:</b> 어려운 상황에 <u>추가 정보</u>를 더하는 관계',
wa:"Furthermore",accept:["Furthermore","furthermore"],
det:{ref:'[원문] Furthermore, there has been a lack of psychiatrists in the country for many years.\n[해석] 게다가, 그 나라에는 수년간 정신과 의사가 부족했다. [문장 10 참고]',
correct:'정답: Furthermore. 앞 문장의 교통비 문제에 더하여 정신과 의사 부족이라는 추가 문제를 제시하는 첨가/부연 연결사.',
wrongs:[],
tip:'💡 첨가/부연 연결사\n• Furthermore = 게다가\n• Moreover = 더욱이\n• In addition = 추가로\n\n⚠️ 함정\n• Furthermore vs. Therefore: 전자는 첨가, 후자는 결론/인과'}},

{id:8,type:'어법',diff:'어려움',pts:3,fmt:'mc',note:'문장11',
passage:``,
stem:'다음 중 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">When the Friendship Bench program started in 2006, there were only eleven psychiatrists <b>(serving / served)</b> Zimbabwe\'s population of over twelve million people.</div>',
ch:['① serving','② served'],ans:0,
det:{ref:'[원문] When the Friendship Bench program started in 2006, there were only eleven psychiatrists serving Zimbabwe\'s population of over twelve million people.\n[해석] 2006년 우정 벤치 프로그램이 시작되었을 때, 1200만 명이 넘는 짐바브웨 인구를 돌보는 정신과 의사는 겨우 11명뿐이었다. [문장 11 참고]',
correct:'정답: serving. 현재분사가 psychiatrists를 뒤에서 수식. 정신과 의사들이 인구를 "돌보는(능동)" 관계이므로 현재분사가 적절.',
wrongs:['① serving ✅ — 능동 관계. psychiatrists가 serve(돌보다)의 주체','② served ❌ — 수동 관계. 정신과 의사가 돌봄을 받는 것이 아님'],
tip:'💡 핵심 문법: 분사 수식 판별법\n• 수식받는 명사가 동작의 주체 → 현재분사(-ing)\n• 수식받는 명사가 동작의 대상 → 과거분사(p.p.)\n\n⚠️ 함정\n• "served"로 쓰면 "돌봄을 받는 의사"가 되어 의미 왜곡'}},

{id:9,type:'오류찾기',diff:'어려움',pts:4,fmt:'mc',note:'문장06-08',
passage:``,
stem:'다음 글에서 어법상 틀린 부분을 찾으시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #EF5350;">The idea came from an experience I had as a psychiatrist. One of my patients had become severely depressed. However, she couldn\'t get help because she was unable to <b>ⓐ affording</b> the bus ride to the hospital. This <b>ⓑ shocked</b> me, as I had never <b>ⓒ considered</b> such a problem before. I <b>ⓓ needed</b> to find a way to bring psychiatry into the community.</div>',
ch:['① ⓐ affording','② ⓑ shocked','③ ⓒ considered','④ ⓓ needed'],ans:0,
det:{ref:'[원문] she was unable to afford the bus ride to the hospital.\n[해석] 그녀는 병원까지 버스비를 감당할 수 없었다. [문장 07 참고]',
correct:'정답: ⓐ affording → afford. be unable to + 동사원형. to 뒤에는 동사원형이 와야 하므로 affording(동명사)은 틀림.',
wrongs:['ⓐ affording ❌ → afford. to부정사 뒤는 동사원형','ⓑ shocked ✅ — 과거시제 적절','ⓒ considered ✅ — 과거완료(had considered)의 p.p. 적절','ⓓ needed ✅ — 과거시제 적절'],
tip:'💡 핵심 문법: to부정사\n• to + 동사원형 (to afford, to go, to be)\n• to + -ing는 문법적으로 불가 (to affording ❌)\n\n⚠️ 함정\n• be used to -ing (습관)와 혼동 주의. unable to는 to부정사'}},

{id:10,type:'어형변화',diff:'보통',pts:3,fmt:'written',note:'문장14',
passage:`The program was created as a way ( ___ ) accessible mental health services. [provide]`,
stem:'주어진 단어를 문맥에 맞게 변형하여 빈칸을 채우시오. (2단어, 영문 10자, t로 시작)',
wa:"to provide",accept:["to provide","To provide"],
det:{ref:'[원문] The program was created as a way to provide accessible mental health services.\n[해석] 이 프로그램은 접근 가능한 정신건강 서비스를 제공하기 위한 방법으로 만들어졌다. [문장 14 참고]',
correct:'정답: to provide. 「a way to V」 구문에서 to부정사가 way를 수식하는 형용사적 용법.',
wrongs:[],
tip:'💡 핵심 문법: to부정사의 형용사적 용법\n• a way to V = ~하는 방법\n• a chance to V = ~할 기회\n• the ability to V = ~하는 능력\n\n⚠️ 함정\n• providing도 의미상 통할 수 있으나, a way to V가 자연스러운 관용 표현'}},

{id:11,type:'어법',diff:'보통',pts:3,fmt:'mc',note:'문장15',
passage:``,
stem:'다음 중 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">It offers talk therapy sessions to people <b>(dealing / dealt)</b> with issues such as depression or anxiety.</div>',
ch:['① dealing','② dealt'],ans:0,
det:{ref:'[원문] It offers talk therapy sessions to people dealing with issues such as depression or anxiety.\n[해석] 그것은 우울증이나 불안감과 같은 문제를 겪고 있는 사람들에게 대화 치료 세션을 제공한다. [문장 15 참고]',
correct:'정답: dealing. 현재분사가 people을 뒤에서 수식. people이 deal(다루다/겪다)의 주체이므로 능동의 현재분사가 적절.',
wrongs:['① dealing ✅ — 능동: 사람들이 문제를 "겪는" 것','② dealt ❌ — 수동: 사람들이 다루어지는 것이 아님'],
tip:'💡 핵심 문법: deal with\n• deal with = ~를 다루다, ~에 대처하다\n• dealing with: 현재분사 (능동)\n• dealt with: 과거분사 (수동)\n\n⚠️ 함정\n• people은 deal의 주체이므로 반드시 능동(-ing)'}},

{id:12,type:'지칭추론',diff:'보통',pts:3,fmt:'mc',note:'문장15',
passage:`The program was created as a way to provide accessible mental health services. <u>It</u> offers talk therapy sessions to people dealing with issues such as depression or anxiety.`,
stem:'밑줄 친 <u>It</u>이 가리키는 것으로 가장 적절한 것은?',
ch:['① the community','② The program (= the Friendship Bench program)','③ Zimbabwe','④ a way','⑤ mental health'],ans:1,
det:{ref:'[원문] It offers talk therapy sessions to people dealing with issues such as depression or anxiety.\n[해석] 그것은 우울증이나 불안감과 같은 문제를 겪고 있는 사람들에게 대화 치료 세션을 제공한다. [문장 15 참고]',
correct:'정답: ②. It은 바로 앞 문장의 주어 The program(= the Friendship Bench program)을 가리킴.',
wrongs:['① ❌ — community는 문맥상 프로그램을 제공하는 주체가 아님','② ✅ — The program이 서비스를 제공하는 주체','③ ❌ — Zimbabwe는 국가이므로 세션을 제공하지 않음','④ ❌ — a way는 방법이므로 주어로 부적절','⑤ ❌ — mental health는 추상 개념'],
tip:'💡 지칭추론 전략\n• 대명사는 보통 바로 앞 문장의 주어를 받음\n• 의미상 동사와 호응하는지 확인\n\n⚠️ 함정\n• It이 가주어인 경우와 대명사인 경우 구별 필요'}},

{id:13,type:'어법',diff:'보통',pts:3,fmt:'mc',note:'문장16',
passage:``,
stem:'다음 중 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">The sessions are free and are provided by <b>(respected / respecting)</b> elderly women from the community.</div>',
ch:['① respected','② respecting'],ans:0,
det:{ref:'[원문] The sessions are free and are provided by respected elderly women from the community.\n[해석] 세션은 무료이며 지역사회의 존경받는 연세 많은 여성들에 의해 제공된다. [문장 16 참고]',
correct:'정답: respected. 과거분사가 elderly women을 앞에서 수식. 여성들이 "존경받는" 대상이므로 수동의 과거분사가 적절.',
wrongs:['① respected ✅ — 수동: 여성들이 존경"받는" 것','② respecting ❌ — 능동: 여성들이 존경"하는" 것이 됨 (의미 부적절)'],
tip:'💡 핵심 문법: 감정/평가 분사\n• respected (존경받는), interested (흥미를 느끼는)\n• respecting (존경하는), interesting (흥미로운)\n\n⚠️ 함정\n• 사람 수식 시 항상 p.p.는 아님. 의미 관계 확인 필수'}},

{id:14,type:'어법',diff:'보통',pts:3,fmt:'mc',note:'문장17',
passage:``,
stem:'다음 중 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">These women, called \\"grandmothers,\\" volunteer <b>(to sit / sitting)</b> with patients at the benches, listen to their stories, and provide them with emotional support.</div>',
ch:['① to sit','② sitting'],ans:0,
det:{ref:'[원문] These women, called "grandmothers," volunteer to sit with patients at the benches, listen to their stories, and provide them with emotional support.\n[해석] "할머니"라 불리는 이 여성들은 벤치에서 환자들과 함께 앉아, 이야기를 듣고, 정서적 지지를 제공하는 것을 자원한다. [문장 17 참고]',
correct:'정답: to sit. volunteer + to V (자원하여 ~하다). volunteer는 to부정사를 목적어로 취하는 동사.',
wrongs:['① to sit ✅ — volunteer + to V 구문','② sitting ❌ — volunteer + -ing 불가'],
tip:'💡 핵심 문법: to부정사를 목적어로 취하는 동사\n• volunteer, decide, hope, want, plan, promise + to V\n• 예: She volunteered to help.\n\n⚠️ 함정\n• enjoy, mind, avoid, finish + -ing와 구별'}},

{id:15,type:'연결사',diff:'보통',pts:3,fmt:'written',note:'문장20',
passage:`Grandmothers were chosen for our program because they are deeply connected to the community. ( ___ ), they have all the qualities of a counselor, such as excellent listening skills, empathy, and the ability to engage in meaningful discussions.`,
stem:'빈칸에 들어갈 알맞은 연결사를 쓰시오. (1단어, 영문 8자, M으로 시작)<br><b>힌트:</b> 할머니를 선택한 이유에 <u>추가 이유</u>를 더하는 관계',
wa:"Moreover",accept:["Moreover","moreover"],
det:{ref:'[원문] Moreover, they have all the qualities of a counselor, such as excellent listening skills, empathy, and the ability to engage in meaningful discussions.\n[해석] 더욱이, 그들은 훌륭한 경청 기술, 공감 능력, 의미 있는 토론에 참여하는 능력과 같은 상담사의 모든 자질을 갖추고 있다. [문장 20 참고]',
correct:'정답: Moreover. 앞 문장의 이유(지역사회 연결)에 추가 이유(상담사 자질)를 더하는 첨가 연결사.',
wrongs:[],
tip:'💡 첨가 연결사\n• Moreover = 더욱이 (격식적)\n• Furthermore = 게다가\n• Besides = 그 외에도\n\n⚠️ 함정\n• Moreover vs. However: 전자는 첨가, 후자는 역접'}},

{id:16,type:'의미파악',diff:'보통',pts:3,fmt:'mc',note:'문장19',
passage:`Grandmothers were chosen for our program because they are <u>deeply connected to the community</u>.`,
stem:'밑줄 친 <u>deeply connected to the community</u>의 의미와 가장 가까운 것은?',
ch:['① 지역사회에서 오래 거주한','② 지역사회와 깊은 유대감을 가진','③ 지역사회에 많은 기부를 한','④ 지역사회의 지도자인','⑤ 지역사회에서 유명한'],ans:1,
det:{ref:'[원문] Grandmothers were chosen for our program because they are deeply connected to the community.\n[해석] 할머니들은 지역사회에 깊이 연결되어 있기 때문에 우리 프로그램에 선정되었다. [문장 19 참고]',
correct:'정답: ②. deeply connected to the community는 지역사회와 깊은 유대 관계를 형성하고 있다는 의미.',
wrongs:['① ❌ — 단순 거주 기간이 아닌 관계의 깊이','② ✅ — connected = 유대감, 관계를 맺고 있는','③ ❌ — 기부와 무관','④ ❌ — 지도자가 아닌 구성원으로서의 유대','⑤ ❌ — 유명함이 아닌 유대감'],
tip:'💡 의미파악 전략\n• connected to = ~와 연결된, 유대를 가진\n• deeply = 깊이, 강하게\n\n⚠️ 주의\n• 문맥상 할머니들이 왜 선정되었는지와 연결하여 이해'}},

{id:17,type:'오류찾기',diff:'어려움',pts:4,fmt:'mc',note:'문장19-21',
passage:``,
stem:'다음 글에서 어법상 틀린 부분을 찾으시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #EF5350;">Grandmothers were chosen for our program because they are deeply connected to the community. Moreover, they have all the qualities of a counselor, such as excellent listening skills, empathy, and the ability to engage in meaningful discussions. They are also very <b>ⓐ reliable</b>, <b>ⓑ that</b> is important for our efforts to support mental health. At the beginning, we started with only fourteen <b>ⓒ volunteer</b> grandmothers. But today, there are thousands of grandmothers who have been <b>ⓓ trained</b> to provide Friendship Bench therapy in Zimbabwe.</div>',
ch:['① ⓐ reliable','② ⓑ that','③ ⓒ volunteer','④ ⓓ trained'],ans:1,
det:{ref:'[원문] They are also very reliable, which is important for our efforts to support mental health.\n[해석] 그들은 또한 매우 신뢰할 수 있으며, 이것은 정신건강을 지원하려는 우리의 노력에 중요하다. [문장 21 참고]',
correct:'정답: ⓑ that → which. 앞 절 전체를 선행사로 받는 계속적 용법의 관계대명사. 콤마 뒤에서 앞 절 전체를 선행사로 받을 때 that은 사용 불가, which만 가능.',
wrongs:['ⓐ reliable ✅ — 형용사, 보어로 적절','ⓑ that ❌ → which. 계속적 용법(콤마+관계대명사)에서 that 사용 불가','ⓒ volunteer ✅ — 명사가 형용사적으로 grandmothers 수식','ⓓ trained ✅ — have been trained 수동태 적절'],
tip:'💡 핵심 문법: 관계대명사 계속적 용법\n• , which = 그리고 그것은 (앞 절 전체 수식)\n• , that ❌ (계속적 용법에서 that 사용 불가!)\n\n⚠️ 함정\n• 제한적 용법에서는 that/which 모두 가능, 계속적 용법에서는 which만 가능'}},

{id:18,type:'어법',diff:'보통',pts:3,fmt:'mc',note:'문장23',
passage:``,
stem:'다음 중 어법상 알맞은 것을 고르시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;">But today, there are thousands of grandmothers who <b>(have been trained / have trained)</b> to provide Friendship Bench therapy in Zimbabwe.</div>',
ch:['① have been trained','② have trained'],ans:0,
det:{ref:'[원문] But today, there are thousands of grandmothers who have been trained to provide Friendship Bench therapy in Zimbabwe.\n[해석] 하지만 오늘날, 짐바브웨에서 우정 벤치 치료를 제공하도록 훈련받은 수천 명의 할머니가 있다. [문장 23 참고]',
correct:'정답: have been trained. 할머니들이 훈련을 "받는" 대상이므로 수동태(have been p.p.)가 적절. 현재완료 수동태.',
wrongs:['① have been trained ✅ — 현재완료 수동태. 할머니들이 훈련을 "받은" 것','② have trained ❌ — 현재완료 능동. 할머니들이 누군가를 훈련"시킨" 것이 됨'],
tip:'💡 핵심 문법: 현재완료 수동태\n• have/has been + p.p.\n• 예: The book has been published. (출판되었다)\n\n⚠️ 함정\n• train은 타동사로 능동/수동 모두 가능. 주어가 훈련의 대상인지 주체인지 확인'}},

{id:19,type:'서술형',diff:'어려움',pts:4,fmt:'written',note:'문장25',
passage:`When the sessions with the grandmothers are over, patients are ( ___ ) to join a community support group made up of former patients of the program.`,
stem:'빈칸에 들어갈 알맞은 단어를 쓰시오. (1단어, 영문 10자, e로 시작)<br><b>조건:</b> 「be + p.p. + to V」 구조의 수동태',
wa:"encouraged",accept:["encouraged","Encouraged"],
det:{ref:'[원문] When the sessions with the grandmothers are over, patients are encouraged to join a community support group made up of former patients of the program.\n[해석] 할머니들과의 세션이 끝나면, 환자들은 이전 환자들로 구성된 지역사회 지원 그룹에 참여하도록 격려받는다. [문장 25 참고]',
correct:'정답: encouraged. encourage + O + to V (목적격보어)의 수동태 → be encouraged to V.',
wrongs:[],
tip:'💡 핵심 문법: 5형식 수동태\n• encourage + O + to V → S + be encouraged + to V\n• advise, allow, expect도 같은 패턴\n\n⚠️ 함정\n• encouraging(능동/형용사)과 혼동 주의'}},

{id:20,type:'지칭추론',diff:'보통',pts:3,fmt:'mc',note:'문장26-27',
passage:`The members of these groups can easily relate to and support <u>one another</u>. This is because most of them come from the same community and have experienced similar struggles.`,
stem:'밑줄 친 <u>one another</u>가 가리키는 대상으로 가장 적절한 것은?',
ch:['① 할머니 상담사들','② 지역사회 지원 그룹의 구성원들(이전 환자들)','③ 정신과 의사들','④ 프로그램 설립자들','⑤ 짐바브웨 국민 전체'],ans:1,
det:{ref:'[원문] The members of these groups can easily relate to and support one another.\n[해석] 이 그룹의 구성원들은 서로 쉽게 공감하고 지지할 수 있다. [문장 26 참고]',
correct:'정답: ②. one another는 문장의 주어인 The members of these groups(지원 그룹 구성원들 = 이전 환자들)을 상호 대명사로 받음.',
wrongs:['① ❌ — 할머니들이 아닌 이전 환자들로 구성된 그룹','② ✅ — groups의 members가 서로를 가리킴','③ ❌ — 정신과 의사 관련 문맥 아님','④ ❌ — 설립자는 한 명(Dr. Chibanda)','⑤ ❌ — 범위가 너무 넓음'],
tip:'💡 상호대명사\n• one another = 서로 (3인 이상)\n• each other = 서로 (2인)\n• 문장의 주어를 상호적으로 받음\n\n⚠️ 함정\n• one another의 선행어는 반드시 복수 주어'}},

{id:21,type:'서술형',diff:'어려움',pts:4,fmt:'written',note:'문장31',
passage:`Our vision is for everyone to have a Friendship Bench ( ___ ) walking distance, and we are working hard to make it happen.`,
stem:'빈칸에 들어갈 알맞은 단어를 쓰시오. (1단어, 영문 6자, w로 시작)<br><b>힌트:</b> 「~ 이내에」를 의미하는 전치사',
wa:"within",accept:["within","Within"],
det:{ref:'[원문] Our vision is for everyone to have a Friendship Bench within walking distance, and we are working hard to make it happen.\n[해석] 우리의 비전은 모든 사람이 걸어서 갈 수 있는 거리 내에 우정 벤치를 갖는 것이며, 우리는 그것을 실현하기 위해 열심히 노력하고 있다. [문장 31 참고]',
correct:'정답: within. within walking distance = 걸어서 갈 수 있는 거리 내에. within은 "~ 이내에"를 의미하는 전치사.',
wrongs:[],
tip:'💡 핵심 표현\n• within walking distance = 도보 거리 내에\n• within + 범위/거리/시간 = ~ 이내에\n• 예: within an hour, within 5 km\n\n⚠️ 함정\n• in vs. within: in은 단순 위치, within은 범위/한계 강조'}},

{id:22,type:'한영영작',diff:'어려움',pts:4,fmt:'written',note:'문장39',
passage:``,
stem:'다음 한국어를 영어로 쓰시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #0891B2;">"상처받은" → 영어 1단어 (7자, w로 시작)<br>예문: 그들의 상처받은 마음을 치유하다</div>',
wa:"wounded",accept:["wounded","Wounded"],
det:{ref:'[원문] I knew that I could help heal their wounded hearts by supporting them.\n[해석] 나는 그들을 지지함으로써 그들의 상처받은 마음을 치유하는 데 도움이 될 수 있다는 것을 알았다. [문장 39 참고]',
correct:'정답: wounded. 과거분사로 "상처받은"이라는 의미의 형용사. wounded hearts = 상처받은 마음.',
wrongs:[],
tip:'💡 핵심 어휘\n• wounded: 상처받은, 부상당한 (wound의 p.p.)\n• wound (동사): 상처를 주다 / (명사): 상처\n\n⚠️ 함정\n• hurt vs. wounded: hurt는 감정/신체 모두, wounded는 주로 신체적 상처 + 비유적 마음의 상처'}},

{id:23,type:'어순배열',diff:'어려움',pts:4,fmt:'written',note:'문장32',
passage:``,
stem:'주어진 단어를 올바른 순서로 배열하시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #374151;">We\'ve also started expanding the program, and we now<br><b>[ through / counseling / offer / an app / online ]</b></div><br>(1단어로 답: 첫 번째 단어만, 영문 5자, o로 시작)',
wa:"offer",accept:["offer","Offer"],
det:{ref:'[원문] We\'ve also started expanding the program, and we now offer online counseling through an app.\n[해석] 우리는 또한 프로그램을 확장하기 시작했으며, 이제 앱을 통해 온라인 상담을 제공한다. [문장 32 참고]',
correct:'정답: offer (올바른 어순: offer online counseling through an app). 주어(we) + 동사(offer) + 목적어(online counseling) + 전치사구(through an app).',
wrongs:[],
tip:'💡 어순 원칙\n• S + V + O + 전치사구\n• offer + 목적어(online counseling) + through(수단)\n\n⚠️ 함정\n• through an app은 수단의 전치사구로 문장 끝에 위치'}},

{id:24,type:'오류찾기',diff:'어려움',pts:4,fmt:'mc',note:'문장43-45',
passage:``,
stem:'다음 글에서 어법상 틀린 부분을 찾으시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #EF5350;">One patient of mine, a nineteen-year-old girl, was going through a difficult time after her mom <b>ⓐ passed away</b>. I counseled her and helped her <b>ⓑ to begin</b> her recovery journey. Now her life is back on track, and she has even <b>ⓒ started</b> her own business! Cases like this <b>ⓓ makes</b> me so proud to be part of the program.</div>',
ch:['① ⓐ passed away','② ⓑ to begin','③ ⓒ started','④ ⓓ makes'],ans:3,
det:{ref:'[원문] Cases like this make me so proud to be part of the program.\n[해석] 이런 사례들은 내가 프로그램의 일부인 것을 너무 자랑스럽게 만든다. [문장 46 참고]',
correct:'정답: ⓓ makes → make. 주어가 Cases(복수)이므로 동사도 복수형 make가 되어야 함.',
wrongs:['ⓐ passed away ✅ — 과거시제. 어머니가 돌아가신 사실','ⓑ to begin ✅ — help + O + (to) V. to부정사/원형 모두 가능','ⓒ started ✅ — 현재완료(has started) 적절','ⓓ makes ❌ → make. Cases(복수) + make(복수동사)'],
tip:'💡 핵심 문법: 주어-동사 수일치\n• 복수 주어(Cases) → 복수 동사(make)\n• like this는 수식어일 뿐 주어에 영향 없음\n\n⚠️ 함정\n• "Cases like this"에서 this에 이끌려 단수 동사를 쓰기 쉬움\n• help + O + to V / V 모두 가능 (ⓑ는 정답)'}},

{id:25,type:'의미파악',diff:'보통',pts:3,fmt:'mc',note:'문장45',
passage:`I counseled her and helped her begin her recovery journey. Now her life is <u>back on track</u>, and she has even started her own business!`,
stem:'밑줄 친 <u>back on track</u>의 의미와 가장 가까운 것은?',

{id:27,type:'주제',diff:'보통',pts:3,fmt:'mc',note:'종합',
passage:`On today's show, we are going to learn about special park benches in Zimbabwe called Friendship Benches. We have two special guests. First, please welcome the founder of the Friendship Bench program, Dr. Dixon Chibanda. Can you tell us what inspired you to come up with the program?\n\nThe idea came from an experience I had as a psychiatrist. One of my patients had become severely depressed. However, she couldn't get help because she was unable to afford the bus ride to the hospital. This shocked me, as I had never considered such a problem before. In fact, it is difficult for many people in Zimbabwe to pay for transportation and receive medical treatment. Furthermore, there has been a lack of psychiatrists in the country for many years. When the Friendship Bench program started in 2006, there were only eleven psychiatrists serving Zimbabwe's population of over twelve million people. I needed to find a way to bring psychiatry into the community.\n\nThe program was created as a way to provide accessible mental health services. It offers talk therapy sessions to people dealing with issues such as depression or anxiety. The sessions are free and are provided by respected elderly women from the community. These women, called \"grandmothers,\" volunteer to sit with patients at the benches, listen to their stories, and provide them with emotional support.\n\nGrandmothers were chosen for our program because they are deeply connected to the community. Moreover, they have all the qualities of a counselor, such as excellent listening skills, empathy, and the ability to engage in meaningful discussions. They are also very reliable, which is important for our efforts to support mental health. At the beginning, we started with only fourteen volunteer grandmothers. But today, there are thousands of grandmothers who have been trained to provide Friendship Bench therapy in Zimbabwe.\n\nWhen the sessions with the grandmothers are over, patients are encouraged to join a community support group made up of former patients of the program. The members of these groups can easily relate to and support one another. This is because most of them come from the same community and have experienced similar struggles. The program has been incredibly successful. In 2022, we provided face-to-face counseling to about 90,000 patients in Zimbabwe. Now, Friendship Benches are available in more than twenty different regions around the country. Our vision is for everyone to have a Friendship Bench within walking distance, and we are working hard to make it happen. We've also started expanding the program, and we now offer online counseling through an app. This has helped us reach even more people.\n\nGrandma Moyo has been volunteering for the Friendship Bench program for about eight years. She joined the program because many people in her community struggle with mental health problems, and she wanted to do something about it. Seeking help for mental health problems is nothing to be ashamed of. One patient of hers, a nineteen-year-old girl, was going through a difficult time after her mom passed away. She counseled her and helped her begin her recovery journey. Now her life is back on track, and she has even started her own business! Cases like this make her so proud to be part of the program. It is such a rewarding experience to help people make positive changes in their lives.`,
stem:'윗글의 주제로 가장 적절한 것은?',

det:{ref:`[원문] 전체 지문
[해석] Friendship Bench 프로그램의 설립 배경, 운영 방식, 성과를 다룸`,
correct:'정답: ②. 본문은 Friendship Bench라는 지역사회 기반 정신건강 프로그램의 탄생 배경, 할머니 상담사 운영, 지원 그룹, 성과와 확장을 종합적으로 설명.',
wrongs:['① ❌ — 경제적 불평등은 배경일 뿐 주제 아님','② ✅ — 프로그램 전체를 포괄하는 주제','③ ❌ — 노인 봉사는 프로그램의 일부이지 주제 아님','④ ❌ — 오히려 의사 부족을 대안으로 해결한 내용','⑤ ❌ — 온라인 앱은 확장 수단일 뿐'],
tip:`💡 주제 찾기 전략
• 글 전체를 포괄하는 선지 선택
• 세부 사항이나 부분적 내용은 오답

⚠️ 함정
• ④처럼 본문 내용과 반대되는 선지 주의`}},

{id:28,type:'T/F',diff:'보통',pts:4,fmt:'mc',note:'종합',
passage:`On today's show, we are going to learn about special park benches in Zimbabwe called Friendship Benches. We have two special guests. First, please welcome the founder of the Friendship Bench program, Dr. Dixon Chibanda. Can you tell us what inspired you to come up with the program?\n\nThe idea came from an experience I had as a psychiatrist. One of my patients had become severely depressed. However, she couldn't get help because she was unable to afford the bus ride to the hospital. This shocked me, as I had never considered such a problem before. In fact, it is difficult for many people in Zimbabwe to pay for transportation and receive medical treatment. Furthermore, there has been a lack of psychiatrists in the country for many years. When the Friendship Bench program started in 2006, there were only eleven psychiatrists serving Zimbabwe's population of over twelve million people. I needed to find a way to bring psychiatry into the community.\n\nThe program was created as a way to provide accessible mental health services. It offers talk therapy sessions to people dealing with issues such as depression or anxiety. The sessions are free and are provided by respected elderly women from the community. These women, called \"grandmothers,\" volunteer to sit with patients at the benches, listen to their stories, and provide them with emotional support.\n\nGrandmothers were chosen for our program because they are deeply connected to the community. Moreover, they have all the qualities of a counselor, such as excellent listening skills, empathy, and the ability to engage in meaningful discussions. They are also very reliable, which is important for our efforts to support mental health. At the beginning, we started with only fourteen volunteer grandmothers. But today, there are thousands of grandmothers who have been trained to provide Friendship Bench therapy in Zimbabwe.\n\nWhen the sessions with the grandmothers are over, patients are encouraged to join a community support group made up of former patients of the program. The members of these groups can easily relate to and support one another. This is because most of them come from the same community and have experienced similar struggles. The program has been incredibly successful. In 2022, we provided face-to-face counseling to about 90,000 patients in Zimbabwe. Now, Friendship Benches are available in more than twenty different regions around the country. Our vision is for everyone to have a Friendship Bench within walking distance, and we are working hard to make it happen. We've also started expanding the program, and we now offer online counseling through an app. This has helped us reach even more people.\n\nGrandma Moyo has been volunteering for the Friendship Bench program for about eight years. She joined the program because many people in her community struggle with mental health problems, and she wanted to do something about it. Seeking help for mental health problems is nothing to be ashamed of. One patient of hers, a nineteen-year-old girl, was going through a difficult time after her mom passed away. She counseled her and helped her begin her recovery journey. Now her life is back on track, and she has even started her own business! Cases like this make her so proud to be part of the program. It is such a rewarding experience to help people make positive changes in their lives.`,
stem:'윗글의 내용과 <b>일치하지 않는</b> 것은?',
ch:['① Friendship Bench 프로그램은 2006년에 시작되었다.','② 할머니 상담사들은 유급으로 일한다.','③ 세션이 끝난 후 환자들은 지역사회 지원 그룹에 참여할 수 있다.','④ 2022년에 약 90,000명의 환자에게 대면 상담을 제공했다.','⑤ Grandma Moyo는 약 8년간 봉사해 왔다.'],ans:1,
det:{ref:`[원문] The sessions are free and are provided by respected elderly women from the community. / These women, called "grandmothers," volunteer to sit with patients.
[해석] 세션은 무료이며 할머니들은 자원봉사로 참여한다. [문장 16-17 참고]`,
correct:'정답: ②. 본문에서 세션은 무료(free)이고 할머니들은 자원봉사(volunteer)한다고 명시. 유급이라는 내용은 본문과 불일치.',
wrongs:['① ✅ — 문장 11에서 2006년 시작 확인','② ❌ — volunteer(자원봉사)이므로 유급 아님. 불일치','③ ✅ — 문장 25에서 community support group 참여 확인','④ ✅ — 문장 29에서 약 90,000명 대면 상담 확인','⑤ ✅ — Grandma Moyo가 약 8년간 봉사 확인'],
tip:`💡 T/F 문제 전략
• 키워드(숫자, 고유명사)를 본문에서 찾아 대조
• "volunteer"와 "유급"은 반대 개념

⚠️ 함정
• free는 세션 비용이 무료라는 뜻이고, volunteer는 자원봉사라는 뜻. 둘 다 무급을 암시`}},

{id:29,type:'요약문',diff:'어려움',pts:4,fmt:'written',note:'종합',
passage:`On today's show, we are going to learn about special park benches in Zimbabwe called Friendship Benches. We have two special guests. First, please welcome the founder of the Friendship Bench program, Dr. Dixon Chibanda. Can you tell us what inspired you to come up with the program?\n\nThe idea came from an experience I had as a psychiatrist. One of my patients had become severely depressed. However, she couldn't get help because she was unable to afford the bus ride to the hospital. This shocked me, as I had never considered such a problem before. In fact, it is difficult for many people in Zimbabwe to pay for transportation and receive medical treatment. Furthermore, there has been a lack of psychiatrists in the country for many years. When the Friendship Bench program started in 2006, there were only eleven psychiatrists serving Zimbabwe's population of over twelve million people. I needed to find a way to bring psychiatry into the community.\n\nThe program was created as a way to provide accessible mental health services. It offers talk therapy sessions to people dealing with issues such as depression or anxiety. The sessions are free and are provided by respected elderly women from the community. These women, called \"grandmothers,\" volunteer to sit with patients at the benches, listen to their stories, and provide them with emotional support.\n\nGrandmothers were chosen for our program because they are deeply connected to the community. Moreover, they have all the qualities of a counselor, such as excellent listening skills, empathy, and the ability to engage in meaningful discussions. They are also very reliable, which is important for our efforts to support mental health. At the beginning, we started with only fourteen volunteer grandmothers. But today, there are thousands of grandmothers who have been trained to provide Friendship Bench therapy in Zimbabwe.\n\nWhen the sessions with the grandmothers are over, patients are encouraged to join a community support group made up of former patients of the program. The members of these groups can easily relate to and support one another. This is because most of them come from the same community and have experienced similar struggles. The program has been incredibly successful. In 2022, we provided face-to-face counseling to about 90,000 patients in Zimbabwe. Now, Friendship Benches are available in more than twenty different regions around the country. Our vision is for everyone to have a Friendship Bench within walking distance, and we are working hard to make it happen. We've also started expanding the program, and we now offer online counseling through an app. This has helped us reach even more people.\n\nGrandma Moyo has been volunteering for the Friendship Bench program for about eight years. She joined the program because many people in her community struggle with mental health problems, and she wanted to do something about it. Seeking help for mental health problems is nothing to be ashamed of. One patient of hers, a nineteen-year-old girl, was going through a difficult time after her mom passed away. She counseled her and helped her begin her recovery journey. Now her life is back on track, and she has even started her own business! Cases like this make her so proud to be part of the program. It is such a rewarding experience to help people make positive changes in their lives.`,
stem:'윗글을 다음과 같이 요약할 때, 빈칸 (A)에 들어갈 단어를 쓰시오.<br><div style="background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #059669;">The Friendship Bench program provides free mental health ( A ) through trained grandmother volunteers in Zimbabwe.</div><br>(A): 1단어, 영문 8자, s로 시작',

correct:'정답: services. 본문에서 mental health services라는 핵심 표현이 반복적으로 사용됨.',
wrongs:[],
tip:`💡 요약문 전략

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name,answers:S.ans.slice()});if(h.length>20)h.length=20;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}

function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
