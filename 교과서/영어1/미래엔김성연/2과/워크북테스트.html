const EI={"subject":"영어1 미래엔(김성연)","pub":"2과","lesson":"Generation Gap","title":"Seeing Through the Generation Gap","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_eng1_mirae_L2_v1"};

const P1=`Have you ever had a conflict with your parents or other adults? If so, you are not alone. The generational conflict is a social phenomenon that has existed for as long as human civilization. Older generations have always complained about younger ones. But what exactly is a generation? A generation is a group of people born around the same time who share similar experiences and cultural influences. Let us look at how sociologists classify generations.`;

const P2=`Baby boomers are people born after World War II between 1946 and 1964 in the United States. In Korea, baby boomers are people born between 1955 and 1963. Generation X, or Gen X, refers to those born from 1965 to 1980. The term was popularized by Douglas Coupland\u2019s 1991 book Generation X: Tales for an Accelerated Culture. Gen Xers are often described as relaxed and laid-back. Generation Y, also known as millennials, includes those born from 1981 to 1996. The term millennials was used because they came of age around the new millennium. Generation Z refers to those born from 1997 to 2012.`;

const P3=`One factor that shapes generational characteristics is the cohort effect. People born around the same time are often socialized by similar political, economic, and social events, which can shape their attitudes and beliefs in distinct ways. For example, those who experienced the IMF crisis in 1997 may prioritize job stability. Generation Z, having grown up as digital natives accustomed to technology, may lack some traditional social skills.`;

const P4=`Another factor is the life cycle effect. Major life events such as leaving home, getting married, or having children can alter a person\u2019s values and perspectives. For instance, millennials were initially perceived as less committed to their work, but as they aged, they proved to be just as diligent as previous generations. Some traits like being adventurous or liberal are more characteristic of youth in general, rather than of any specific generation.`;

const P5=`Some changes affect everyone regardless of age. For example, the climate crisis is a concern that crosses generational boundaries. Studies show there is no significant age divide when it comes to ethical product consumption. Therefore, we should not make hasty judgments based on generation labels. Overgeneralizations can lead to misunderstandings and prejudice. Instead, we should try to understand each other as individuals.`;

const Q=[
// ━━━ 어법 빈칸 (Q1-Q4) ━━━

// Q1(4pts): 관계대명사 who · 쉬움
{id:1,type:`어법`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,
ch:[`which`,`what`,`who`,`whom`],
passage:`A generation is a group of people born around the same time __________ share similar experiences and cultural influences. Let us look at how sociologists classify generations.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`선행사 <b>people</b>(사람)을 수식하며 뒤에 동사 share의 주어 역할을 하는 주격 관계대명사 <b>who</b>가 적절하다.`,
analysis:`✅ ③ who: 사람 선행사(people) + 주격 관계대명사\n❌ ① which: 사물 선행사용 → people은 사람\n❌ ② what: 선행사 포함 관계대명사 → 앞에 선행사(people)가 있으므로 불가\n❌ ④ whom: 목격 관계대명사 → 뒤에 동사(share) 주어 필요`,
tip:`선행사(사람) + who + 동사: 사람을 수식하는 주격 관계대명사`}},

// Q2(5pts): 수동태 was popularized · 보통
{id:2,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`popularized`,`was popularized`,`has popularized`,`popularizing`],
passage:`Generation X, or Gen X, refers to those born from 1965 to 1980. The term __________ by Douglas Coupland\u2019s 1991 book Generation X: Tales for an Accelerated Culture.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`용어(The term)가 책에 의해 대중화<b>된</b> 것이므로 수동태 <b>was popularized</b>가 적절하다.`,
analysis:`✅ ② was popularized: 수동태 → "용어가 ~에 의해 대중화되었다"\n❌ ① popularized: 능동태 → 주어 The term이 대중화시킨 것이 아님\n❌ ③ has popularized: 능동 현재완료 → 주어가 행위자가 아님\n❌ ④ popularizing: 분사 → 주절 동사 없음`,
tip:`주어가 동작의 대상일 때 수동태(be + p.p.) 사용: The term was popularized by ~`}},

// Q3(5pts): 분사구문 having grown up · 보통
{id:3,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`grew up`,`grow up`,`to grow up`,`having grown up`],
passage:`Generation Z, __________ as digital natives accustomed to technology, may lack some traditional social skills.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`주절(may lack)보다 <b>앞선 시점</b>에 성장한 것이므로 완료 분사구문 <b>having grown up</b>이 적절하다.`,
analysis:`✅ ④ having grown up: 완료 분사구문 → 주절보다 앞선 동작\n❌ ① grew up: 과거형 → 접속사 없이 연결 불가\n❌ ② grow up: 원형 → 문법적으로 불가\n❌ ③ to grow up: to부정사 → 문맥에 부적절`,
tip:`완료 분사구문(Having p.p.): 주절보다 앞선 시점의 동작/상태를 나타냄`}},

// Q4(6pts): 가정법 과거 were · 어려움
{id:4,type:`어법`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`perceiving`,`perceive`,`perceived`,`to perceive`,`having perceived`],
passage:`In the early 2000s, when this group initially entered the job market, they were __________ as being less committed to their companies. However, as they aged and got used to their roles, they began to be increasingly recognized as diligent workers.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`"they were + <b>p.p.</b>" 수동태 구조에서 <b>perceived</b>(인식되었다)가 적절하다.`,
analysis:`✅ ③ perceived: were + p.p. 수동태 → "~로 인식되었다"\n❌ ① perceiving: 능동 분사 → 수동 맥락에 부적절\n❌ ② perceive: 원형 → were 뒤 부적절\n❌ ④ to perceive: to부정사 → 수동태 자리 부적절\n❌ ⑤ having perceived: 완료 분사 → 수동 맥락에 부적절`,
tip:`be + p.p.: 수동태. perceive(인식하다) → perceived(인식된)`}},

// ━━━ 어법 밑줄 오류 (Q5) ━━━

// Q5(5pts): 능동/수동 오류 · 보통
{id:5,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`①`,`②`,`③`],
passage:`For instance, millennials were initially \u2460<u>perceived</u> as less committed to their work, but as they aged, they \u2461<u>proving</u> to be just as diligent as previous generations. Some traits like being \u2462<u>adventurous</u> or liberal are more characteristic of youth in general.`,
stem:`다음 글의 밑줄 친 ①~③ 중, 어법상 <b>틀린</b> 것은?`,
det:{korean:`② proving → <b>proved</b>: 주절의 동사 자리이므로 과거형 proved가 적절하다. "그들이 마찬가지로 근면하다고 증명했다"`,
analysis:`❌ ② proving(현재분사) → proved(과거형): 주절 동사 필요. as they aged(접속사절) 뒤 주절에 동사원형/과거형이 와야 함\n✅ ① perceived: 수동태 → "인식되었다" 올바름\n✅ ③ adventurous: 형용사 → "모험적인" 올바름`,
tip:`접속사(but, as) 뒤의 주절에는 반드시 완전한 동사(과거형/현재형)가 필요`}},

// ━━━ 내용 이해 (Q6-Q8) ━━━

// Q6(4pts): 내용 일치 · 쉬움
{id:6,type:`내용이해`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`Gen X는 1981년부터 1996년 사이에 태어난 세대이다.`,`밀레니얼이라는 용어는 새 천년과 관련이 있다.`,`베이비붐 세대는 미국에서 1955년부터 1963년 사이에 태어났다.`,`Z세대는 1980년 이전에 태어난 사람들을 포함한다.`],
passage:P2,
stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,
det:{korean:`"The term millennials was used because they came of age around the <b>new millennium</b>" → 밀레니얼이라는 용어는 새 천년(밀레니엄)과 관련이 있다.`,
analysis:`✅ ② 밀레니얼 용어 = 새 천년: 본문과 일치\n❌ ① Gen X는 1965~1980 (밀레니얼이 1981~1996)\n❌ ③ 미국 베이비붐은 1946~1964 (한국이 1955~1963)\n❌ ④ Z세대는 1997~2012`,
tip:`내용 일치: 각 세대의 연도 범위를 정확히 대조`}},

// Q7(5pts): 내용 불일치 · 보통
{id:7,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`1997년 IMF 위기를 경험한 사람들은 직업 안정성을 우선시할 수 있다.`,`같은 시기에 태어난 사람들은 비슷한 사건에 의해 사회화된다.`,`Z세대는 전통적 사회 기술이 뛰어나다.`,`코호트 효과는 세대 특성을 형성하는 요인이다.`],
passage:P3,
stem:`다음 글의 내용과 <b>일치하지 않는</b> 것은?`,
det:{korean:`본문: "Generation Z ... may <b>lack</b> some traditional social skills" → Z세대는 전통적 사회 기술이 <b>부족</b>할 수 있다. 따라서 "뛰어나다"는 본문과 반대.`,
analysis:`❌ ③ Z세대 사회 기술 뛰어남: 본문 "may lack" → 부족할 수 있음과 반대\n✅ ① IMF 위기 → 직업 안정성 우선: 일치\n✅ ② 비슷한 사건에 의해 사회화: 일치\n✅ ④ 코호트 효과 = 세대 특성 형성 요인: 일치`,
tip:`불일치 문제: "may lack"(부족할 수 있다) ↔ "뛰어나다" — 핵심 동사의 의미 대조`}},

// Q8(5pts): 글의 주제 · 보통
{id:8,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`세대 간 갈등의 역사적 원인`,`세대별 기술 활용 능력 비교`,`세대 분류와 특성에 영향을 미치는 요인들`,`기후 위기에 대한 세대별 인식 차이`,`베이비붐 세대의 경제적 특징`],
passage:P1+` ... `+P5,
stem:`이 글(본문) 전체의 주제로 가장 적절한 것은?`,
det:{korean:`본문은 세대의 정의, 분류(베이비붐~Z세대), 코호트 효과, 생애주기 효과, 성급한 일반화 경계를 다룸 → <b>세대 분류와 특성에 영향을 미치는 요인들</b>`,
analysis:`✅ ③ 세대 분류와 특성 영향 요인: 본문 전체 내용 포괄\n❌ ① 역사적 원인만: 본문의 일부\n❌ ② 기술 활용 비교: Z세대 예시일 뿐\n❌ ④ 기후 위기: 보조 예시\n❌ ⑤ 베이비붐 경제: 일부 내용`,
tip:`글의 주제: 전체 내용을 포괄하는 선택지를 고르기`}},

// ━━━ 빈칸 추론 (Q9-Q11) ━━━

// Q9(5pts): cohort effect · 보통
{id:9,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`life cycle effect`,`cohort effect`,`generation gap`,`cultural influence`],
passage:`One factor that shapes generational characteristics is the __________. People born around the same time are often socialized by similar political, economic, and social events, which can shape their attitudes and beliefs in distinct ways. For example, those who experienced the IMF crisis in 1997 may prioritize job stability.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`같은 시기에 태어난 사람들이 비슷한 사회적 사건으로 인해 태도와 신념이 형성된다는 내용 → <b>코호트 효과(cohort effect)</b>`,
analysis:`✅ ② cohort effect: 출생 시기 + 비슷한 사건 → 태도 형성 = 코호트 효과\n❌ ① life cycle effect: 생애주기 효과는 결혼/출산 등 개인 생애사건\n❌ ③ generation gap: 세대 차이는 결과이지 요인 아님\n❌ ④ cultural influence: 너무 광범위`,
tip:`cohort effect: 같은 시기 출생 → 비슷한 사회적 사건 → 태도/신념 형성`}},

// Q10(6pts): overgeneralizations · 어려움
{id:10,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`Careful analyses`,`Overgeneralizations`,`Scientific studies`,`Personal experiences`],
passage:`Therefore, we should not make hasty judgments based on generation labels. __________ can lead to misunderstandings and prejudice. Instead, we should try to understand each other as individuals.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`세대 라벨에 근거한 성급한 판단을 하지 말아야 한다는 맥락에서, <b>과잉 일반화(Overgeneralizations)</b>가 오해와 편견을 초래할 수 있다.`,
analysis:`✅ ② Overgeneralizations: hasty judgments → 과잉 일반화 → 오해/편견\n❌ ① Careful analyses: 신중한 분석은 오해를 줄임\n❌ ③ Scientific studies: 과학적 연구는 편견과 반대\n❌ ④ Personal experiences: 개인 경험은 직접 관련 없음`,
tip:`hasty judgments + generation labels → overgeneralizations: 성급한 일반화의 위험`}},

// Q11(6pts): alter · 어려움
{id:11,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`alter`,`maintain`,`ignore`,`predict`],
passage:`Another factor is the life cycle effect. Major life events such as leaving home, getting married, or having children can __________ a person\u2019s values and perspectives. For instance, millennials were initially perceived as less committed to their work, but as they aged, they proved to be just as diligent as previous generations.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`집을 떠나거나 결혼, 출산 같은 생애 주요 사건이 가치관과 관점을 <b>변화시킬(alter)</b> 수 있다.`,
analysis:`✅ ① alter(변화시키다): 밀레니얼의 변화 예시가 뒷받침 → 가치관 변화\n❌ ② maintain(유지하다): 변화 맥락과 반대\n❌ ③ ignore(무시하다): 문맥과 무관\n❌ ④ predict(예측하다): 문맥과 부적절`,
tip:`life cycle effect: 생애 사건이 가치관을 alter(변화시킨다) — 밀레니얼의 변화가 단서`}},

// ━━━ 서술형 (Q12-Q16) ━━━

// Q12(4pts): 어형변환 — generation → generational · 쉬움
{id:12,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`generational`,accept:[`generational`,`Generational`],
passage:`Have you ever had a conflict with your parents or other adults? If so, you are not alone. The __________ (generation) conflict is a social phenomenon that has existed for as long as human civilization.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`generation(명사) → <b>generational(형용사)</b>: 명사 conflict를 수식하는 형용사가 필요. "세대 간의 갈등"`,
analysis:`generation(명사) → generational(형용사)\n빈칸 뒤 conflict(명사)를 수식하는 형용사 필요\ngenerational conflict = 세대 간 갈등`,
tip:`generation → generational / nation → national / tradition → traditional — 명사 → -al 형용사 변환`}},

// Q13(5pts): 어형변환 — society → socialized · 보통
{id:13,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`socialized`,accept:[`socialized`,`Socialized`],
passage:`People born around the same time are often __________ (society) by similar political, economic, and social events, which can shape their attitudes and beliefs in distinct ways.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`society(명사) → socialize(동사) → <b>socialized(과거분사)</b>: "are + 과거분사" 수동태 구문. "사회화되다"`,
analysis:`society(명사) → socialize(동사) → socialized(과거분사)\nare often socialized by ~ = ~에 의해 사회화되다 (수동태)`,
tip:`society → socialize → socialized / be socialized by = ~에 의해 사회화되다`}},

// Q14(5pts): 본문에서 찾기 — laid-back · 보통
{id:14,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`laid-back`,accept:[`laid-back`,`Laid-back`,`laid back`,`Laid back`],
passage:`Generation X, or Gen X, refers to those born from 1965 to 1980. The term was popularized by Douglas Coupland\u2019s 1991 book Generation X: Tales for an Accelerated Culture. Gen Xers are often described as relaxed and laid-back.`,
stem:`다음 글에서 X세대를 묘사하는 표현 중, relaxed와 함께 언급된 특성을 본문에서 <b>1단어(하이픈 포함)</b>로 찾아 쓰시오.`,
det:{korean:`"Gen Xers are often described as relaxed and <b>laid-back</b>" → 느긋한 = <b>laid-back</b>`,
analysis:`relaxed와 and로 연결된 것 = laid-back\n1단어(하이픈 포함) 답 = laid-back`,
tip:`"본문에서 찾기" 유형: and로 연결된 병렬 표현에서 답 찾기`}},

// Q15(4pts): 본문에서 찾기 — digital natives · 쉬움
{id:15,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`digital natives`,accept:[`digital natives`,`Digital natives`,`Digital Natives`],
passage:`Generation Z, having grown up as digital natives accustomed to technology, may lack some traditional social skills.`,
stem:`다음 글에서 Z세대가 기술에 익숙한 존재로 성장한 것을 나타내는 표현을 본문에서 <b>2단어</b>로 찾아 쓰시오.`,
det:{korean:`"having grown up as <b>digital natives</b> accustomed to technology" → 디지털 원주민 = <b>digital natives</b>`,
analysis:`Z세대의 특성 = digital natives (디지털 원주민)\naccustomed to technology = 기술에 익숙한`,
tip:`digital natives: 태어날 때부터 디지털 환경에서 자란 세대를 지칭`}},

// Q16(6pts): 본문에서 찾기 — overgeneralizations · 어려움
{id:16,type:`서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`hasty judgments`,accept:[`hasty judgments`,`Hasty judgments`,`hasty Judgments`,`Hasty Judgments`],
passage:P5,
stem:`다음 글에서 세대 꼬리표에 따라 하지 말아야 할 것을 본문에서 <b>2단어</b>로 찾아 쓰시오.`,
det:{korean:`"we should be careful not to make <b>hasty judgments</b> about people according to their generation labels" → 성급한 판단 = <b>hasty judgments</b>`,
analysis:`세대 꼬리표에 따라 하지 말아야 할 것 = hasty judgments (성급한 판단)\n2단어 답 = hasty judgments`,
tip:`hasty judgments: 성급한 판단 — make hasty judgments = 성급하게 판단하다`}},

// ━━━ T/F (Q17-Q20) ━━━

// Q17(4pts): T/F · 쉬움
{id:17,type:`T/F`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`True`,`False`],
passage:`Have you ever had a conflict with your parents or other adults? If so, you are not alone. The generational conflict is a social phenomenon that has existed for as long as human civilization. Older generations have always complained about younger ones.`,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>The generational conflict has existed throughout human civilization.</b>"`,
det:{korean:`"a social phenomenon that has existed for as long as human civilization" → 세대 간 갈등은 인류 문명만큼 오래 존재해 왔다. → <b>True</b>`,
analysis:`✅ True: "for as long as human civilization" = "throughout human civilization" → 동일한 의미`,
tip:`for as long as = throughout: ~동안 내내`}},

// Q18(5pts): T/F · 보통
{id:18,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`True`,`False`],
passage:P2,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>The term Generation X was coined by Douglas Coupland in his 1991 book.</b>"`,
det:{korean:`본문: "The term was <b>popularized</b>(대중화된) by Douglas Coupland\u2019s 1991 book" → 만들어진(coined) 것이 아니라 대중화된 것. → <b>False</b>`,
analysis:`❌ False: popularized(대중화) ≠ coined(만들어냄) → 의미가 다름`,
tip:`popularized(대중화했다) ≠ coined(처음 만들었다) — 단어의 미묘한 의미 차이에 주의`}},

// Q19(5pts): T/F · 보통
{id:19,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`True`,`False`],
passage:P5,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>There is no significant age divide when it comes to ethical product consumption.</b>"`,
det:{korean:`"Studies show there is no significant age divide when it comes to ethical product consumption" → 본문과 정확히 일치 → <b>True</b>`,
analysis:`✅ True: 본문 원문과 진술이 정확히 일치`,
tip:`본문의 문장을 그대로 인용한 진술 → True`}},

// Q20(6pts): T/F · 어려움
{id:20,type:`T/F`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`True`,`False`],
passage:P4,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>Being adventurous is a unique characteristic of millennials that distinguishes them from other generations.</b>"`,
det:{korean:`본문: "Some traits like being adventurous or liberal are more characteristic of <b>youth in general</b>, rather than of any specific generation" → 모험적인 것은 밀레니얼만의 고유한 특성이 아니라 <b>젊음 전반</b>의 특성이다. → <b>False</b>`,
analysis:`❌ False: "youth in general"(젊은이 전반) ≠ "unique characteristic of millennials"(밀레니얼 고유 특성)\n모험적 성향은 특정 세대가 아닌 젊음의 특성`,
tip:`"youth in general, rather than of any specific generation" → 특정 세대 고유가 아님`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법':'tag-grammar','내용이해':'tag-content','빈칸추론':'tag-blank','서술형':'tag-written','T/F':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch?(d.q.ch.length===5?'①②③④⑤':d.q.ch.length===4?'①②③④':d.q.ch.length===3?'①②③':'①②'):'';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:#EDE7F6;color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:#EDE7F6;color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000);
let txt=`📝 온라인워크북 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
