<script>
const EI={"subject":"영어1 미래엔(김성연)","pub":"2과","lesson":"Generation Gap","title":"Seeing Through the Generation Gap","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_eng1_mirae_L2_v1"};

const Q=[
// ━━━ 문장삽입/어순배열 FIRST ━━━

// Q1: 문장삽입 · 어려움 · 6pts
{id:1,type:`문장삽입`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`\u2460`,`\u2461`,`\u2462`,`\u2463`],
passage:`Have you ever had a conflict with your parents or other adults? If so, you are not alone. \u2460 The generational conflict is a social phenomenon that has existed for as long as human civilization. Older generations have always complained about younger ones. \u2461 A generation is a group of people born around the same time who share similar experiences and cultural influences. \u2462 Let us look at how sociologists classify generations. \u2463`,
stem:`다음 글에서 주어진 문장이 들어가기에 가장 적절한 곳은?\n<br><br><b>"But what exactly is a generation?"</b>`,
det:{korean:`세대 간 갈등과 불평에 대한 설명 후, 세대의 정의를 묻는 질문이 오고 바로 뒤에 정의("A generation is...")가 이어져야 자연스럽다.`,
analysis:`✅ ②: 세대 간 갈등 설명 → "그렇다면 세대란 정확히 무엇인가?" → 정의 제시로 자연스러운 흐름\n❌ ①: 갈등 언급 직후 → 아직 세대 정의 필요 없음\n❌ ③: 이미 정의가 나온 후 → 질문 위치 부적절\n❌ ④: 분류 시작 후 → 질문 위치 부적절`,
tip:`질문 → 답변(정의) 순서: "But what exactly is ~?" 다음에 정의가 바로 와야 함`}},

// Q2: 문장삽입 · 보통 · 5pts
{id:2,type:`문장삽입`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`\u2460`,`\u2461`,`\u2462`,`\u2463`],
passage:`One factor that shapes generational characteristics is the cohort effect. \u2460 People born around the same time are often socialized by similar political, economic, and social events. \u2461 These events can shape their attitudes and beliefs in distinct ways. \u2462 Generation Z, having grown up as digital natives accustomed to technology, may lack some traditional social skills. \u2463`,
stem:`다음 글에서 주어진 문장이 들어가기에 가장 적절한 곳은?\n<br><br><b>"For example, those who experienced the IMF crisis in 1997 may prioritize job stability."</b>`,
det:{korean:`"These events can shape their attitudes"라는 일반론 후, 구체적 예시(IMF 위기)가 오고, 그 다음에 또 다른 예시(Z세대)가 이어져야 한다.`,
analysis:`✅ ③: 일반론 → IMF 예시 → Z세대 예시 순으로 자연스러움\n❌ ①: 코호트 효과 정의 직후 → 너무 빠름\n❌ ②: 사회화 설명 중 → 구체적 예시 전에 일반론 마무리 필요\n❌ ④: Z세대 예시 후 → 순서 역전`,
tip:`일반론 → 구체적 예시 순서: 코호트 효과 설명 → IMF 예시 → Z세대 예시`}},

// Q3: 어순배열 · 어려움 · 6pts
{id:3,type:`어순배열`,diff:`어려움`,pts:6,fmt:"written",wa:`we should not make hasty judgments based on generation labels`,accept:[`we should not make hasty judgments based on generation labels`,`We should not make hasty judgments based on generation labels`],
passage:`Some changes affect everyone regardless of age. For example, the climate crisis is a concern that crosses generational boundaries. Studies show there is no significant age divide when it comes to ethical product consumption. Therefore, __________________________________________.`,
stem:`다음 주어진 단어를 올바른 순서로 배열하시오.\n<br><br><b>judgments / should / we / on / not / generation / make / labels / hasty / based</b>`,
det:{korean:`"<b>we should not make hasty judgments based on generation labels</b>" → 세대 라벨에 근거한 성급한 판단을 하지 말아야 한다.`,
analysis:`we(주어) + should not make(조동사+부정+동사) + hasty judgments(목적어) + based on generation labels(전치사구)`,
tip:`주어 + should not + 동사 + 목적어 + 전치사구: 부정 조동사 어순`}},

// ━━━ 어법/어휘 SECOND ━━━

// Q4: 어법 5지선다 · 보통 · 5pts
{id:4,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:4,
ch:[`\u2460`,`\u2461`,`\u2462`,`\u2463`,`\u2464`],
passage:`Baby boomers are people \u2460<u>born</u> after World War II between 1946 and 1964 in the United States. Generation X, or Gen X, \u2461<u>refers</u> to those born from 1965 to 1980. The term \u2462<u>was popularized</u> by Douglas Coupland\u2019s 1991 book. Gen Xers are often \u2463<u>described</u> as relaxed and laid-back. Generation Y, also \u2464<u>knowing</u> as millennials, includes those born from 1981 to 1996.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 어법상 <b>틀린</b> 것은?`,
det:{korean:`⑤ knowing → <b>known</b>: "~로 알려진"이라는 수동 의미이므로 과거분사 known이 적절하다.`,
analysis:`❌ ⑤ knowing(능동) → known(수동): "~로 알려진" = 수동 의미\n✅ ① born: 과거분사 → "태어난 사람들"\n✅ ② refers: 3인칭 단수 현재 → Gen X refers to\n✅ ③ was popularized: 수동태 → "대중화되었다"\n✅ ④ described: 수동태 → "묘사된다"`,
tip:`known as = ~로 알려진 (수동) vs. knowing = 알고 있는 (능동)`}},

// Q5: 어법 빈칸 · 보통 · 5pts
{id:5,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`shape`,`shaped`,`which`,`what`],
passage:`People born around the same time are often socialized by similar political, economic, and social events, __________ can shape their attitudes and beliefs in distinct ways.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`선행사 <b>events</b>(사물/복수)를 수식하며 뒤에 동사 can shape의 주어 역할을 하는 주격 관계대명사 <b>which</b>가 적절하다.`,
analysis:`✅ ③ which: 사물 선행사(events) + 주격 관계대명사 (계속적 용법)\n❌ ① shape: 동사 → 접속사 없이 두 절 연결 불가\n❌ ② shaped: 과거형 → 접속사 없이 불가\n❌ ④ what: 선행사 포함 → 앞에 events 있으므로 불가`,
tip:`선행사(사물), + which + 동사: 계속적 용법의 관계대명사`}},

// Q6: 어법 빈칸 · 보통 · 5pts
{id:6,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`accustomed`,`accustoming`,`accustom`,`to accustom`],
passage:`Generation Z, having grown up as digital natives __________ to technology, may lack some traditional social skills.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`digital natives를 수식하는 과거분사 형용사 <b>accustomed</b>가 적절하다. "기술에 익숙한"`,
analysis:`✅ ① accustomed: 과거분사 형용사 → "~에 익숙한" (accustomed to)\n❌ ② accustoming: 능동 분사 → 부적절\n❌ ③ accustom: 동사원형 → 문법적 불가\n❌ ④ to accustom: to부정사 → 수식 구조에 부적절`,
tip:`be accustomed to = ~에 익숙한 — accustomed는 형용사로도 사용`}},

// Q7: 부적절 어휘 · 보통 · 5pts
{id:7,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`\u2460`,`\u2461`,`\u2462`,`\u2463`,`\u2464`],
passage:`Another factor is the life cycle effect. Major life events such as leaving home, getting married, or having children can \u2460<u>alter</u> a person\u2019s values and perspectives. For instance, millennials were initially \u2461<u>perceived</u> as less committed to their work, but as they aged, they proved to be just as \u2462<u>lazy</u> as previous generations. Some traits like being \u2463<u>adventurous</u> or \u2464<u>liberal</u> are more characteristic of youth in general.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`원문은 "just as <b>diligent</b>"(근면한). ③ lazy(게으른)는 diligent의 반의어로 문맥에 부적절하다. 밀레니얼이 이전 세대만큼 근면하다고 증명한 맥락.`,
analysis:`❌ ③ lazy(게으른): 원문 diligent(근면한) → "이전 세대만큼 근면하다"는 맥락\n✅ ① alter(변화시키다): 원문 일치\n✅ ② perceived(인식된): 원문 일치\n✅ ④ adventurous(모험적인): 원문 일치\n✅ ⑤ liberal(자유로운): 원문 일치`,
tip:`diligent(근면한) ↔ lazy(게으른) — "proved to be just as ___" = 긍정적 증명`}},

// Q8: 빈칸추론 · 어려움 · 6pts
{id:8,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:3,
ch:[`physical strength`,`artistic talent`,`financial success`,`job stability`],
passage:`One factor that shapes generational characteristics is the cohort effect. People born around the same time are often socialized by similar political, economic, and social events. For example, those who experienced the IMF crisis in 1997 may prioritize __________.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`IMF 위기(경제 위기)를 경험한 사람들은 <b>직업 안정성(job stability)</b>을 우선시할 수 있다.`,
analysis:`✅ ④ job stability: IMF 경제 위기 경험 → 직업 안정성 추구\n❌ ① physical strength: 경제 위기와 무관\n❌ ② artistic talent: 문맥과 무관\n❌ ③ financial success: 안정성이 아닌 성공`,
tip:`IMF crisis(경제 위기) → prioritize(우선시) → job stability(직업 안정성): 위기 경험이 안정 추구로 이어짐`}},

// Q9: 빈칸추론 · 쉬움 · 4pts
{id:9,type:`빈칸추론`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`competition`,`cooperation`,`isolation`,`migration`],
passage:`Some changes affect everyone regardless of age. For example, the climate crisis is a concern that crosses generational boundaries. Therefore, we should not make hasty judgments. Instead, we should try to understand each other and promote __________ across generations.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`세대를 초월한 이해 → 세대 간 <b>협력(cooperation)</b>을 촉진해야 한다.`,
analysis:`✅ ② cooperation(협력): 이해 + 세대 간 → 협력 촉진\n❌ ① competition(경쟁): 이해와 반대\n❌ ③ isolation(고립): 반대\n❌ ④ migration(이주): 무관`,
tip:`understand each other → cooperation: 상호 이해 → 협력으로 이어짐`}},

// Q10: 서술형 어형변환 · 쉬움 · 4pts
{id:10,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`phenomenon`,accept:[`phenomenon`,`Phenomenon`],
passage:`The generational conflict is a social __________ (phenomenal) that has existed for as long as human civilization.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`phenomenal(형용사) → <b>phenomenon(명사)</b>: 관사 a + 형용사 social 뒤에 명사가 필요. "사회적 현상"`,
analysis:`phenomenal(형용사) → phenomenon(명사)\na social ___ = 관사 + 형용사 + 명사 구조\nphenomenon = 현상`,
tip:`phenomenal(현상적인, 형용사) → phenomenon(현상, 명사) — 형용사 → 명사 변환`}},

// Q11: 서술형 어형변환 · 보통 · 5pts
{id:11,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`committed`,accept:[`committed`,`Committed`],
passage:`For instance, millennials were initially perceived as less __________ (commit) to their work, but as they aged, they proved to be just as diligent as previous generations.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`commit(동사) → <b>committed(형용사)</b>: "be committed to ~" = ~에 헌신적인. less 뒤에 형용사가 필요.`,
analysis:`commit(동사) → committed(형용사/과거분사)\nless committed to = ~에 덜 헌신적인\nperceived as + 형용사 구조`,
tip:`be committed to = ~에 헌신적인 — commit → committed (과거분사 형용사화)`}},

// Q12: 서술형 본문찾기 · 보통 · 5pts
{id:12,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`cohort effect`,accept:[`cohort effect`,`Cohort effect`,`the cohort effect`],
passage:`One factor that shapes generational characteristics is the cohort effect. People born around the same time are often socialized by similar political, economic, and social events, which can shape their attitudes and beliefs in distinct ways.`,
stem:`다음 글에서 같은 시기에 태어난 사람들이 비슷한 사건에 의해 태도와 신념이 형성되는 현상을 본문에서 <b>2단어</b>로 찾아 쓰시오.`,
det:{korean:`"One factor ... is the <b>cohort effect</b>" → 코호트 효과`,
analysis:`세대 특성 형성 요인 = cohort effect\n출생 시기 + 비슷한 사건 → 태도/신념 형성`,
tip:`cohort effect: 같은 시기 출생 → 비슷한 사건으로 인한 태도 형성`}},

// Q13: 서술형 본문찾기 · 보통 · 5pts
{id:13,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`digital natives`,accept:[`digital natives`,`Digital natives`,`Digital Natives`],
passage:`Generation Z, having grown up as digital natives accustomed to technology, may lack some traditional social skills.`,
stem:`다음 글에서 Z세대를 지칭하는 표현으로, 기술에 익숙한 존재를 본문에서 <b>2단어</b>로 찾아 쓰시오.`,
det:{korean:`"having grown up as <b>digital natives</b> accustomed to technology" → 디지털 원주민`,
analysis:`Z세대 = digital natives (디지털 원주민)\naccustomed to technology = 기술에 익숙한`,
tip:`digital natives: 태어날 때부터 디지털 환경에서 자란 세대`}},

// Q14: 내용이해 일치 · 쉬움 · 4pts
{id:14,type:`내용이해`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`Gen X는 1981년부터 1996년 사이에 태어난 세대이다.`,`밀레니얼이라는 용어는 새 천년과 관련이 있다.`,`한국의 베이비붐 세대는 1946년에 시작된다.`,`Z세대는 2012년 이후에 태어난 사람들을 포함한다.`],
passage:`Generation Y, also known as millennials, includes those born from 1981 to 1996. The term millennials was used because they came of age around the new millennium. Generation Z refers to those born from 1997 to 2012.`,
stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,
det:{korean:`"The term millennials was used because they came of age around the <b>new millennium</b>" → 밀레니얼 용어는 새 천년과 관련.`,
analysis:`✅ ② 밀레니얼 용어 = 새 천년: 본문과 일치\n❌ ① Gen X는 1965~1980 (밀레니얼이 1981~1996)\n❌ ③ 한국 베이비붐은 1955~1963\n❌ ④ Z세대는 1997~2012 (2012년 이후가 아님)`,
tip:`세대별 연도와 명칭의 유래를 정확히 대조`}},

// Q15: 내용이해 불일치 · 어려움 · 6pts
{id:15,type:`내용이해`,diff:`어려움`,pts:6,fmt:"mc",ans:3,
ch:[`코호트 효과는 세대 특성을 형성하는 요인이다.`,`생애주기 효과는 가치관을 변화시킬 수 있다.`,`기후 위기는 세대를 초월한 관심사이다.`,`윤리적 소비에서 세대 간 뚜렷한 나이 차이가 있다.`],
passage:`Some changes affect everyone regardless of age. For example, the climate crisis is a concern that crosses generational boundaries. Studies show there is no significant age divide when it comes to ethical product consumption.`,
stem:`다음 글의 내용과 <b>일치하지 않는</b> 것은?`,
det:{korean:`본문: "there is <b>no significant age divide</b> when it comes to ethical product consumption" → 윤리적 소비에서 세대 간 뚜렷한 나이 차이가 <b>없다</b>. 따라서 "있다"는 본문과 반대.`,
analysis:`❌ ④ 나이 차이가 있다: 본문 "no significant age divide" → 없다와 반대\n✅ ① 코호트 효과 = 세대 특성 형성 요인: 일치\n✅ ② 생애주기 효과 = 가치관 변화: 일치\n✅ ③ 기후 위기 = 세대 초월 관심사: 일치`,
tip:`"no significant age divide" = 뚜렷한 나이 차이 없음 — 부정어에 주의`}},

// Q16: 글의 주제 · 쉬움 · 4pts
{id:16,type:`내용이해`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,
ch:[`기후 위기의 세대별 영향`,`밀레니얼 세대의 직장 문화`,`세대 분류와 특성에 영향을 미치는 요인들`,`베이비붐 세대의 경제적 기여`],
passage:`Have you ever had a conflict with your parents or other adults? The generational conflict is a social phenomenon. Let us look at how sociologists classify generations. One factor is the cohort effect. Another factor is the life cycle effect. We should not make hasty judgments based on generation labels.`,
stem:`이 글 전체의 주제로 가장 적절한 것은?`,
det:{korean:`세대 분류(베이비붐~Z세대) + 코호트 효과 + 생애주기 효과 + 성급한 일반화 경계 → <b>세대 분류와 특성에 영향을 미치는 요인들</b>`,
analysis:`✅ ③ 세대 분류와 특성 영향 요인: 전체 내용 포괄\n❌ ① 기후 위기: 보조 예시\n❌ ② 밀레니얼 직장 문화: 일부 내용\n❌ ④ 베이비붐 경제: 일부 내용`,
tip:`글의 주제: 전체 내용을 포괄하는 선택지를 고르기`}},

// Q17: T/F · 쉬움 · 4pts
{id:17,type:`T/F`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`True`,`False`],
passage:`Gen Xers are often described as relaxed and laid-back.`,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>Gen Xers are characterized as relaxed and laid-back.</b>"`,
det:{korean:`"Gen Xers are often described as relaxed and laid-back" → "characterized as relaxed and laid-back"과 동일한 의미 → <b>True</b>`,
analysis:`✅ True: "described as" = "characterized as" → 동의 표현`,
tip:`described as = characterized as = known as: ~로 묘사되다/특징지어지다`}},

// Q18: T/F · 보통 · 5pts
{id:18,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`True`,`False`],
passage:`Baby boomers are people born after World War II between 1946 and 1964 in the United States. In Korea, baby boomers are people born between 1955 and 1963.`,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>The baby boomer generation spans the same years in both the United States and Korea.</b>"`,
det:{korean:`미국: 1946~1964, 한국: 1955~1963 → 연도 범위가 <b>다르다</b>. "같은 연도"는 <b>False</b>.`,
analysis:`❌ False: US(1946~1964) ≠ Korea(1955~1963) → 연도 범위가 다름`,
tip:`미국과 한국의 베이비붐 연도가 다름: 미국(1946-1964) vs 한국(1955-1963)`}},

// Q19: T/F · 어려움 · 6pts
{id:19,type:`T/F`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`True`,`False`],
passage:`For instance, millennials were initially perceived as less committed to their work, but as they aged, they proved to be just as diligent as previous generations. Some traits like being adventurous or liberal are more characteristic of youth in general, rather than of any specific generation.`,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>Being liberal is a trait unique to the millennial generation.</b>"`,
det:{korean:`본문: "more characteristic of <b>youth in general</b>, rather than of any specific generation" → 자유로운 성향은 밀레니얼만의 고유 특성이 아니라 <b>젊음 전반</b>의 특성. → <b>False</b>`,
analysis:`❌ False: "youth in general" ≠ "unique to millennials" → 특정 세대 고유가 아님`,
tip:`"youth in general, rather than of any specific generation" → 특정 세대에 한정되지 않음`}},

{id:20,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:0,

passage:`Some changes affect everyone regardless of age. For example, the climate crisis is a concern that crosses generational boundaries. Studies show there is no significant age divide when it comes to ethical product consumption. Therefore, we should not make hasty judgments based on generation labels. Overgeneralizations can lead to misunderstandings and prejudice.`,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>Overgeneralizations can result in misunderstandings and prejudice.</b>"`,

];

function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'문장삽입':'tag-insert','어순배열':'tag-order','어법':'tag-grammar','어휘':'tag-vocab','빈칸추론':'tag-blank','서술형':'tag-written','내용이해':'tag-content','T/F':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch?(d.q.ch.length===5?'①②③④⑤':d.q.ch.length===4?'①②③④':d.q.ch.length===3?'①②③':'①②'):'';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--oxl);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--oxl);color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000);
let txt=`📝 온라인퀴즈 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
