.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0c8dc;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--o);color:var(--o);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}

const EI={"subject":"영어1 미래엔(김성연)","pub":"3과","lesson":"AI","title":"Can AI Think, Communicate, and See the World Like Us?","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_eng1_mirae_L3_v1"};

const P1=`The history of artificial intelligence is a story of humanity\u2019s long pursuit of creating machines that can think and act like humans. In 1942, Isaac Asimov introduced his Three Laws of Robotics, which provided an early ethical framework for AI. Then in 1950, Alan Turing, often called the father of computer science, posed the question, \u201CCan machines think?\u201D He proposed the Turing test, also known as the imitation game, which determines whether a machine can exhibit intelligent behavior. If a human judge cannot distinguish a computer from a human during the test, the computer is considered to have passed.`;

const P2=`One of the earliest attempts to make a computer communicate like a human was ELIZA, a chatbot developed between 1964 and 1967 by Joseph Weizenbaum at MIT. ELIZA was designed to play the role of a psychotherapist, using simple pattern-matching techniques to respond to users. Surprisingly, many users genuinely shared their worries with ELIZA as if it were a real therapist. Although ELIZA\u2019s technology was basic, it demonstrated the potential for machines to engage in human-like conversation.`;

const P3=`After a period known as the AI winter from 1974 to 1980, when funding and interest declined, AI research experienced a revival. In 1997, IBM\u2019s Deep Blue defeated world chess champion Garry Kasparov, demonstrating that machines could outperform humans in complex strategic tasks. By 2002, the first home robot was introduced, bringing AI into everyday life.`;

const P4=`A significant advancement came in 2011 when Jeff Dean and Andrew Ng used a neural network with 16,000 processors to analyze 10 million random images from the internet. Without any human intervention or labels, the system taught itself to detect faces, bodies, and cats after just three days of unsupervised learning. This was a major breakthrough in demonstrating the power of neural networks.`;

const P5=`As AI continues to evolve, it impacts all aspects of our lives. While there are concerns about job displacement and loss of control, many experts believe AI can be harnessed for the betterment of society. The key lies in developing AI responsibly and ensuring it serves humanity\u2019s best interests.`;

const PRM=`Search engines learn from our clicks, not from the accuracy of the information. For example, if a video of a cat playing a piano gets more clicks than a video of a professional piano tuner, the search engine may rank the cat video higher. This means that irrelevant information can appear relevant if it is clicked on enough times. Such mechanisms can mislead users and contribute to the spread of misinformation.`;

const Q=[
// ━━━ 어법 빈칸 (Q1-Q4) ━━━

// Q1(4pts): 관계대명사 which · 쉬움
{id:1,type:`어법`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`what`,`which`,`who`,`where`],
passage:`In 1942, Isaac Asimov introduced his Three Laws of Robotics, __________ provided an early ethical framework for AI. Then in 1950, Alan Turing, often called the father of computer science, posed the question, \u201CCan machines think?\u201D`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`선행사 <b>his Three Laws of Robotics</b>(사물)를 수식하는 주격 관계대명사 <b>which</b>가 적절하다.`,
analysis:`✅ ② which: 사물 선행사(Three Laws) + 주격 관계대명사\n❌ ① what: 선행사 포함 관계대명사 → 앞에 선행사가 있으므로 불가\n❌ ③ who: 사람 선행사용\n❌ ④ where: 관계부사 → 뒤에 완전한 절이 와야 하나, provided의 주어 필요`,
tip:`선행사(사물) + which + 동사: 사물을 수식하는 주격 관계대명사`}},

// Q2(5pts): 분사 designed · 보통
{id:2,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`designing`,`design`,`designed`,`to design`],
passage:`One of the earliest attempts to make a computer communicate like a human was ELIZA, a chatbot developed between 1964 and 1967 by Joseph Weizenbaum at MIT. ELIZA was __________ to play the role of a psychotherapist, using simple pattern-matching techniques to respond to users.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`ELIZA는 심리 치료사 역할을 하도록 <b>설계되었다(was designed)</b>. 수동태 "be + p.p." 구문.`,
analysis:`✅ ③ designed: was designed → 수동태 "설계되었다"\n❌ ① designing: 능동 → ELIZA가 설계하는 주체가 아님\n❌ ② design: 원형 → was 뒤에 원형 불가\n❌ ④ to design: to부정사 → be + to부정사는 예정/의무이며 문맥 부적절`,
tip:`be designed to + 동사원형: ~하도록 설계되다 (수동태)`}},

// Q3(5pts): 접속사 whether · 보통
{id:3,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`whether`,`that`,`what`,`how`],
passage:`He proposed the Turing test, also known as the imitation game, which determines __________ a machine can exhibit intelligent behavior. If a human judge cannot distinguish a computer from a human during the test, the computer is considered to have passed.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`"기계가 지능적 행동을 보일 수 있는지 <b>여부를(whether)</b> 판단한다"는 의미. determines의 목적절로 <b>whether</b>가 적절하다.`,
analysis:`✅ ① whether: ~인지 아닌지(여부) → determines whether S + V\n❌ ② that: 단순 사실 → "여부"의 의미 표현 불가\n❌ ③ what: "무엇을" → 문맥상 여부가 적절\n❌ ④ how: "어떻게" → 문맥 불일치`,
tip:`determine/decide + whether: ~인지 아닌지를 판단하다/결정하다`}},

// Q4(6pts): 동명사 demonstrating · 어려움
{id:4,type:`어법`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`demonstrate`,`demonstrating`,`demonstrated`,`to demonstrate`,`having demonstrated`],
passage:`In 1997, IBM\u2019s Deep Blue defeated world chess champion Garry Kasparov, __________ that machines could outperform humans in complex strategic tasks. By 2002, the first home robot was introduced, bringing AI into everyday life.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`주절(defeated)의 <b>결과/부대상황</b>을 나타내는 분사구문으로 현재분사 <b>demonstrating</b>이 적절하다.`,
analysis:`✅ ② demonstrating: 결과를 나타내는 분사구문 (현재분사)\n❌ ① demonstrate: 원형 → 문법적으로 불가\n❌ ③ demonstrated: 접속사 없이 두 절 연결 불가\n❌ ④ to demonstrate: to부정사 → 결과 표현에 부적절\n❌ ⑤ having demonstrated: 완료 분사구문 → 주절보다 앞선 동작이 아님`,
tip:`결과 분사구문: 주절, ~ing ... → "그 결과 ~하다"`}},

// ━━━ 어법 밑줄 오류 (Q5) ━━━

// Q5(5pts): 능동/수동 오류 · 보통
{id:5,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`①`,`②`,`③`,`④`],
passage:`Without any human \u2460<u>intervention</u> or labels, the system \u2461<u>taught</u> itself to detect faces, bodies, and cats after just three days of unsupervised learning. This was a major breakthrough in \u2462<u>demonstated</u> the power of neural networks. As AI continues to \u2463<u>evolve</u>, it impacts all aspects of our lives.`,
stem:`다음 글의 밑줄 친 ①~④ 중, 어법상 <b>틀린</b> 것은?`,
det:{korean:`③ demonstated → <b>demonstrating</b>: 전치사 in 뒤에는 동명사(~ing)가 와야 한다. "in demonstrating the power" = 힘을 보여주는 데 있어서`,
analysis:`❌ ③ demonstated → demonstrating: in + ~ing (전치사 + 동명사)\n✅ ① intervention: 명사 → 올바름\n✅ ② taught: teach의 과거형 → 올바름\n✅ ④ evolve: to + 동사원형 → 올바름`,
tip:`전치사(in/on/at/of) + 동명사(~ing): 전치사 뒤에는 명사/동명사가 온다`}},

// ━━━ 내용 이해 (Q6-Q8) ━━━

// Q6(4pts): 내용 일치 · 쉬움
{id:6,type:`내용이해`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`Isaac Asimov는 컴퓨터 과학의 아버지라 불린다.`,`Alan Turing은 "기계가 생각할 수 있는가?"라는 질문을 제기했다.`,`튜링 테스트는 1942년에 제안되었다.`,`ELIZA는 Turing이 개발한 챗봇이다.`],
passage:P1,
stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,
det:{korean:`"Alan Turing, often called the father of computer science, posed the question, \u2018Can machines think?\u2019" → Turing이 "기계가 생각할 수 있는가?" 질문을 제기했다.`,
analysis:`✅ ② Turing이 "Can machines think?" 질문 제기: 본문과 일치\n❌ ① 컴퓨터 과학의 아버지는 Asimov가 아닌 Turing\n❌ ③ 튜링 테스트는 1950년에 제안\n❌ ④ ELIZA는 Joseph Weizenbaum이 개발`,
tip:`인물과 업적을 정확히 매칭: Asimov = 로봇 3법칙, Turing = 튜링 테스트`}},

// Q7(5pts): 내용 불일치 · 보통
{id:7,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`ELIZA는 MIT에서 개발되었다.`,`ELIZA는 패턴 매칭 기술을 사용했다.`,`ELIZA의 사용자들은 그것이 기계임을 즉시 알아챘다.`,`ELIZA는 심리 치료사 역할을 하도록 설계되었다.`],
passage:P2,
stem:`다음 글의 내용과 <b>일치하지 않는</b> 것은?`,
det:{korean:`본문: "many users genuinely shared their worries with ELIZA as if it were a real therapist" → 사용자들은 마치 진짜 치료사인 것처럼 걱정을 나눴다. 따라서 "즉시 알아챘다"는 <b>불일치</b>.`,
analysis:`❌ ③ 사용자들은 기계임을 즉시 알아챘다: 본문과 반대 → "as if it were a real therapist"\n✅ ① MIT에서 개발: "by Joseph Weizenbaum at MIT" 일치\n✅ ② 패턴 매칭: "pattern-matching techniques" 일치\n✅ ④ 심리 치료사 역할: "play the role of a psychotherapist" 일치`,
tip:`"as if + 가정법": 마치 ~인 것처럼 → 실제로는 아님을 암시`}},

// Q8(5pts): 글의 주제 · 보통
{id:8,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`AI가 인간의 일자리를 완전히 대체할 것이라는 경고`,`신경망의 기술적 작동 원리에 대한 상세한 설명`,`AI의 발전 역사와 주요 이정표`,`AI 윤리 규범의 법적 효력`],
passage:P1,
stem:`이 글 전체의 주제로 가장 적절한 것은?`,
det:{korean:`"The history of artificial intelligence is a story of humanity\u2019s long pursuit" + 1942년부터 현재까지의 주요 사건들 → <b>AI의 발전 역사와 주요 이정표</b>`,
analysis:`✅ ③ AI의 발전 역사와 주요 이정표: 첫 문장 "The history of AI" + 연도별 사건 나열\n❌ ① 일자리 대체 경고: 본문의 부분적 언급, 주제 아님\n❌ ② 신경망 작동 원리: 한 단락의 소재일 뿐\n❌ ④ 윤리 규범 법적 효력: 언급 없음`,
tip:`글의 주제: 첫 문장 "The history of artificial intelligence"가 핵심 단서`}},

// ━━━ 빈칸 추론 (Q9-Q11) ━━━

// Q9(5pts): imitation game · 보통
{id:9,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`ethical framework`,`pattern-matching`,`imitation game`,`neural network`],
passage:`He proposed the Turing test, also known as the __________, which determines whether a machine can exhibit intelligent behavior. If a human judge cannot distinguish a computer from a human during the test, the computer is considered to have passed. Turing predicted that machines would eventually be considered intelligent.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`튜링 테스트는 <b>모방 게임(imitation game)</b>으로도 알려져 있다. 기계가 인간을 모방하여 구분할 수 없으면 통과.`,
analysis:`✅ ③ imitation game: "also known as the imitation game" → 원문 표현\n❌ ① ethical framework: 윤리적 틀 → 아시모프의 로봇 법칙과 관련\n❌ ② pattern-matching: ELIZA의 기술\n❌ ④ neural network: 2011년 실험과 관련`,
tip:`Turing test = imitation game: 기계가 인간처럼 행동할 수 있는지 판별`}},

// Q10(6pts): unsupervised · 어려움
{id:10,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`unsupervised`,`supervised`,`reinforced`,`manual`],
passage:`A significant advancement came in 2011 when Jeff Dean and Andrew Ng used a neural network with 16,000 processors to analyze 10 million random images from the internet. Without any human intervention or labels, the system taught itself to detect faces, bodies, and cats after just three days of __________ learning.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`"Without any human intervention or labels" → 인간의 개입이나 라벨 없이 스스로 학습 = <b>비지도 학습(unsupervised learning)</b>`,
analysis:`✅ ① unsupervised: 인간 개입 없이 스스로 학습 → 비지도 학습\n❌ ② supervised: 라벨 있는 지도 학습 → "without labels"와 모순\n❌ ③ reinforced: 보상 기반 강화 학습 → 문맥과 불일치\n❌ ④ manual: 수동 → "taught itself"와 모순`,
tip:`unsupervised learning: 라벨/지도 없이 데이터에서 패턴을 스스로 찾는 학습`}},

// Q11(6pts): misinformation · 어려움
{id:11,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`misinformation`,`innovation`,`optimization`,`personalization`],
passage:`Search engines learn from our clicks, not from the accuracy of the information. This means that irrelevant information can appear relevant if it is clicked on enough times. Such mechanisms can mislead users and contribute to the spread of __________.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`무관한 정보가 관련 있어 보이고, 사용자를 오도하는 메커니즘 → <b>잘못된 정보(misinformation)</b>의 확산에 기여`,
analysis:`✅ ① misinformation(잘못된 정보): mislead + irrelevant info → 허위정보 확산\n❌ ② innovation(혁신): 부정적 맥락과 불일치\n❌ ③ optimization(최적화): 문맥과 무관\n❌ ④ personalization(개인화): 문맥과 무관`,
tip:`mislead(오도하다) + irrelevant information → misinformation(잘못된 정보) 확산`}},

// ━━━ 서술형 (Q12-Q16) ━━━

// Q12(4pts): 어형변환 — artifice → artificial · 쉬움
{id:12,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`artificial`,accept:[`artificial`,`Artificial`],
passage:`The history of __________ (artifice) intelligence is a story of humanity\u2019s long pursuit of creating machines that can think and act like humans. In 1942, Isaac Asimov introduced his Three Laws of Robotics.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`artifice(명사, 기교) → <b>artificial(형용사)</b>: 명사 intelligence를 수식하는 형용사 필요. "인공적인 지능"`,
analysis:`artifice(명사) → artificial(형용사)\n빈칸 뒤 intelligence(명사)를 수식하는 형용사가 필요\nartificial intelligence = 인공 지능`,
tip:`artifice → artificial / benefit → beneficial / office → official — 명사 → -ial 형용사 변환`}},

// Q13(5pts): 어형변환 — significance → significant · 보통
{id:13,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`significant`,accept:[`significant`,`Significant`],
passage:`A __________ (significance) advancement came in 2011 when Jeff Dean and Andrew Ng used a neural network with 16,000 processors to analyze 10 million random images from the internet.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`significance(명사) → <b>significant(형용사)</b>: 명사 advancement를 수식하는 형용사 필요. "중대한 발전"`,
analysis:`significance(명사) → significant(형용사)\n빈칸 뒤 advancement(명사)를 수식하는 형용사가 필요\nsignificant advancement = 중대한 발전`,
tip:`significance → significant / importance → important / difference → different — 명사 → 형용사 변환`}},

// Q14(5pts): 본문에서 찾기 — psychotherapist · 보통
{id:14,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`psychotherapist`,accept:[`psychotherapist`,`Psychotherapist`,`a psychotherapist`],
passage:P2,
stem:`다음 글에서 ELIZA가 수행하도록 설계된 역할을 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`"ELIZA was designed to play the role of a <b>psychotherapist</b>" → 심리 치료사`,
analysis:`ELIZA의 역할 = a psychotherapist\n1단어 답 = psychotherapist`,
tip:`"play the role of ~" = ~의 역할을 하다 → 역할을 찾는 문제`}},

// Q15(4pts): 본문에서 찾기 — betterment · 쉬움
{id:15,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`betterment`,accept:[`betterment`,`Betterment`],
passage:P5,
stem:`다음 글에서 많은 전문가들이 AI가 기여할 수 있다고 믿는 것을 "the __________ of society" 형태로 본문에서 <b>1단어</b>를 찾아 쓰시오.`,
det:{korean:`"AI can be harnessed for the <b>betterment</b> of society" → 사회의 개선/향상`,
analysis:`많은 전문가 = many experts believe\nAI의 목적 = the betterment of society = 사회의 향상`,
tip:`betterment = 개선, 향상 — better(더 나은) + -ment(명사 접미사)`}},

// Q16(6pts): 본문에서 찾기 — distinguish · 어려움
{id:16,type:`서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`distinguish`,accept:[`distinguish`,`Distinguish`],
passage:P1,
stem:`다음 글에서 튜링 테스트에서 인간 심판이 할 수 없어야 통과가 되는 행위를 나타내는 <b>동사 1단어</b>를 본문에서 찾아 쓰시오.`,
det:{korean:`"If a human judge cannot <b>distinguish</b> a computer from a human" → 컴퓨터와 인간을 구별하다`,
analysis:`튜링 테스트 통과 조건 = 인간 심판이 구별할 수 없을 때\n동사 = distinguish (구별하다)`,
tip:`distinguish A from B = A와 B를 구별하다 — 튜링 테스트의 핵심 개념`}},

tip:`인과 관계를 정확히 파악: 순위 결정 요인 = 클릭 수(✓) ≠ 정확성(✗)`}}

function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법':'tag-grammar','내용이해':'tag-content','빈칸추론':'tag-blank','서술형':'tag-written','T/F':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch?(d.q.ch.length===5?'①②③④⑤':d.q.ch.length===4?'①②③④':d.q.ch.length===3?'①②③':'①②'):'';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:#EDE7F6;color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:#EDE7F6;color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000);
let txt=`📝 온라인워크북 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
