<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영어I 동아(박용예) 3과 온라인퀴즈TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>

:root{--o:#E8772E;--od:#B85A1A;--ol:#F5A623;--oxl:#FFF3E8;--oxxl:#FFFAF5;--bg:#F6F2EE;--text:#1E1B18;--tm:#6B6560;--tl:#A09890;--g:#1A9960;--gl:#E6F9F0;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--p:#7C4DFF;--pl:#F3EEFF;--sky:#0EA5E9;--skyl:#E8F6FF;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s cubic-bezier(.4,0,.2,1);}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,#FFF3E8,#FFE8D6 40%,#FFDDC8);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--o),#D97706);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--od),var(--o));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--o),#D97706);padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f0ede8;}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid #ddd8d2;border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid #d0c8c2;border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 4px rgba(232,119,46,.1);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;box-shadow:0 6px 20px rgba(232,119,46,.3);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid #c8c0b8;color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--o);color:var(--o);}
.history-badge{background:var(--oxl);color:var(--o);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid #ddd8d2;border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--o);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--o);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--o);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--o);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
/* Progress bar at top */
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--o),#D97706);transition:width .5s ease;border-radius:0 2px 2px 0;}
/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
/* Passage area - full screen scrollable */
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
/* Question info badge at top of passage */
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--oxl),var(--ol));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--od);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
/* Glass bottom panel */
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:12px 16px 16px;max-height:48vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
/* Stem */
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
/* Choices - premium feel */
.slide-choices{display:flex;flex-direction:column;gap:4px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;line-height:1.4;border:1.5px solid rgba(0,0,0,.06);border-radius:12px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--o);background:rgba(232,119,46,.08);box-shadow:0 0 0 3px rgba(232,119,46,.12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 rgba(232,119,46,.3)}70%{box-shadow:0 0 0 8px rgba(232,119,46,0)}100%{box-shadow:0 0 0 0 rgba(232,119,46,0)}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:24px;height:24px;font-size:11px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;}
/* Written input */
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 3px rgba(232,119,46,.1);}
/* Navigation */
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(232,119,46,.25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--o);}
/* Answer count indicator */
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--o);background:var(--oxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--ol);color:#BF360C;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f0ede8;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--o);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:linear-gradient(135deg,#FFFAF8,#F5F0EB);border-left:3px solid var(--o);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid #ddd8d2;border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--o);}.choice-btn.selected{border-color:var(--o);box-shadow:0 0 0 2px rgba(232,119,46,.12);background:var(--oxxl);}
.c-num{min-width:22px;height:22px;background:#e8e0d8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid #d0c8c2;border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--o);}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--oxl),var(--ol));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--od),var(--o));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8e0d8;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--o),var(--ol));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--oxxl);border-radius:var(--rs);border:1px solid #ddd8d2;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--oxl);}.info-cell.highlight .ic-value{color:var(--o);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0d8;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--ol);color:var(--o);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--oxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0c8c2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--o);color:var(--o);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #ddd8d2;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--oxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--oxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--ol);color:var(--o);}.expl-tag.tip{background:var(--oxl);color:var(--od);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--o);}.expl-box.tip-b{border-left:3px solid var(--o);background:var(--oxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">🎯 내신핏</div>
  <h1 class="start-title">온라인퀴즈 <span>TEST</span></h1>
  <p class="start-subtitle">동아(박용예) 3과 · Act for Our Planet</p>
  <div class="info-card"><div class="info-card-header">📚 시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">과목</span><span class="info-value">영어Ⅰ</span></div>
    <div class="info-row"><span class="info-label">출판사</span><span class="info-value">동아(박용예)</span></div>
    <div class="info-row"><span class="info-label">단원</span><span class="info-value">3과 Act for Our Planet</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">📝 20문항</div><div class="chip">⏱️ 20분</div><div class="chip">✅ 80점 이상 통과</div><div class="chip">📊 100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="startExam()">시험 시작하기 →</button>
  <button class="btn btn-outline" onclick="toggleHistory()">📋 시험 기록 보기 <span class="history-badge" id="hCount">0</span></button>
  <div id="historyPanel"></div>
</div>
</div>
<div id="examScreen" class="screen">
  <div class="exam-topbar"><div class="topbar-left"><div class="topbar-dot"></div><div class="topbar-info">영어Ⅰ · 동아(박용예) · <span>3과</span></div></div><div class="timer" id="timer">20:00</div><button class="btn-submit" onclick="submitExam()">제출하기</button></div>
  <div class="exam-progress"><div class="exam-progress-fill" id="progressFill"></div></div>
  <div class="ans-count" id="ansCount">0/20</div>
  <div class="exam-scroll" id="examScroll"></div>
  <div class="slide-wrap" id="slideWrap">
    <div class="slide-passage" id="slidePassage"></div>
    <div class="slide-bottom" id="slideBottom"></div>
  </div>
</div>
<div id="resultScreen" class="screen"></div>
<script>
const EI = {
  subject: '영어Ⅰ',
  pub: '동아(박용예)',
  lesson: '3과',
  title: 'Act for Our Planet',
  total: 100,
  time: 1200,
  histKey: 'quizH_동아박용예_3과_20',
  qCount: 20
};

const Q = [
{
  id:1, type:'어법', diff:'보통', pts:5, fmt:'mc',
  note:'어법 ⓐ~ⓔ',
  passage:`Whales are amazing creatures. They are enormous and live incredibly long lives. The largest blue whales can grow as long as 30 meters and weigh over 200 tons, and some whales have been <u>ⓐ known</u> to live for more than 100 years. These giants do extremely <u>ⓑ beneficial</u> things for the environment throughout their long lives and even after death. According to scientists, a single whale can absorb about 550 kilograms of CO₂ per year, while a tree can absorb only 22. Moreover, after they die, whales sink to the ocean floor with all the CO₂ they <u>ⓒ absorbing</u> during their lives. Their bodies then become food and habitats for deep-sea creatures. This process <u>ⓓ is called</u> a whale fall. Whale falls permanently <u>ⓔ bury</u> about 145,000 tons of CO₂ under the sea every year.`,
  stem:`다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 어색한 것을 고르시오.`,
  ch:['ⓐ known','ⓑ beneficial','ⓒ absorbing','ⓓ is called','ⓔ bury'],
  ans:2,
  det:{
    ref:'[원문] whales sink to the ocean floor with all the CO₂ they absorbed during their lives [해석] 고래는 살아있는 동안 흡수한 모든 CO₂와 함께 해저로 가라앉는다. 관계대명사 목적격 생략 구문에서 동사는 주절 시제(die → 과거)에 맞춰 과거형 absorbed가 되어야 하므로, 현재분사 absorbing은 어법상 어색하다.',
    correct:'ⓐ known: have been known to-v (…하는 것으로 알려져 있다) 현재완료 수동태 → known ✅\nⓑ beneficial: do beneficial things 형용사가 명사 things 수식 → beneficial ✅\nⓒ absorbing: 관계대명사 목적격 생략, \'CO₂ (that) they absorbed\' → 과거형 absorbed가 맞음. absorbing ❌ → absorbed ✅\nⓓ is called: This process is called ~ 수동태 → is called ✅\nⓔ bury: Whale falls(복수 주어) + bury(복수 동사) → bury ✅',
    wrongs:[],
    tip:'🔑 관계대명사 목적격 생략 구문: 선행사 + (that/which) + S + V → V의 시제·태를 확인!\n비교: absorbing(현재분사) vs. absorbed(과거분사/과거시제) — 여기서는 during their lives(그들의 삶 동안)와 함께 쓰여 과거시제가 필요.\nhave been known to-v ≈ be said to-v (…라고 알려져 있다)'
  }
},
{
  id:2, type:'어법', diff:'어려움', pts:6, fmt:'mc',
  note:'어법 A/B/C',
  passage:`Whales dive deep into the ocean to feed on prey such as krill and small fish, and they occasionally swim up to the surface to breathe. When they near the surface, they release an enormous amount of waste. This waste is rich in nutrients (A) [that / what] are essential for creatures living in that area. Specifically, it creates the perfect growing conditions for some microscopic creatures (B) [floating / floated] at the surface of the ocean. These creatures, called phytoplankton, may look tiny and insignificant, but when (C) [taking / taken] together, they play a significant role in reducing CO₂.`,
  stem:`다음 글의 괄호 (A), (B), (C) 안에서 어법에 맞는 표현으로 가장 적절한 것을 고르시오.`,
  ch:['(A) that – (B) floating – (C) taken','(A) what – (B) floating – (C) taken','(A) that – (B) floated – (C) taking','(A) what – (B) floated – (C) taken','(A) that – (B) floating – (C) taking'],
  ans:0,
  det:{
    ref:'[원문] nutrients that are essential for creatures / microscopic creatures floating at the surface / when taken together [해석] 생물에게 필수적인 영양분 / 해수면에 떠다니는 미세 생물 / 함께 고려하면. (A) 선행사 nutrients + 주격 관계대명사 that, (B) 능동·진행의 현재분사 floating이 creatures 수식, (C) 분사구문에서 주어 they가 take의 대상이므로 수동 taken.',
    correct:'(A) that vs. what: 선행사 nutrients가 있으므로 관계대명사 that ✅ / what은 선행사를 포함하므로 ❌\n(B) floating vs. floated: creatures가 \'떠다니는(능동·진행)\' 상태이므로 현재분사 floating ✅ / 과거분사 floated는 수동 의미로 부적절 ❌\n(C) taking vs. taken: 분사구문 when (they are) taken together에서 주어 they(phytoplankton)가 take의 대상(수동) → taken ✅ / taking(능동)은 의미상 부적절 ❌',
    wrongs:[],
    tip:'🔑 관계대명사 선택: 선행사 있으면 that/which/who, 선행사 포함이면 what\n현재분사(능동·진행) vs. 과거분사(수동·완료): creatures floating(떠다니는) / creatures floated(떠내려간?→❌)\n분사구문 수동: when taken = when they are taken\ntake together ≈ consider as a whole (전체로 고려하다)'
  }
},
{
  id:3, type:'어법', diff:'어려움', pts:6, fmt:'mc',
  note:'어법 ⓐ~ⓓ',
  passage:`Despite the important roles of whales in our environment, their lives are at serious risk. The number of whales <u>ⓐ had dramatically dropped</u> until killing them for commercial purposes was officially banned in 1986. It is estimated that the global whale population <u>ⓑ fell</u> from 4 to 5 million to just over 1 million during the decades before the ban. Today, whales are still threatened by various man-made dangers, such as fishing nets, ship strikes, and microplastic pollution in the ocean. It is important <u>ⓒ to recognize</u> that whales are valuable partners in our fight against the climate crisis and that <u>ⓓ protecting</u> them is an effective and cost-efficient way to address this global challenge.`,
  stem:`다음 글의 밑줄 친 ⓐ~ⓓ 중 어법상 어색한 것을 고르시오.`,
  ch:['ⓐ had dramatically dropped','ⓑ fell','ⓒ to recognize','ⓓ protecting'],
  ans:0,
  det:{
    ref:'[원문] The number of whales had dramatically dropped until killing them for commercial purposes was officially banned in 1986. [해석] 고래의 수는 1986년에 상업적 목적의 포획이 공식적으로 금지될 때까지 급격히 감소했다. until절의 동사 was banned가 과거시제이므로, 주절도 과거시제 dropped이 자연스럽다. 과거완료 had dropped은 기준 과거 시점이 명시되어야 하는데, 여기서는 until 1986이 종료 시점을 나타내므로 단순과거가 적절하다.',
    correct:'ⓐ had dramatically dropped: until + 과거(was banned in 1986) → 주절은 단순과거 dropped이 자연스러움. had dropped(과거완료)은 \'또 다른 과거 이전\'을 나타내야 하는데, 여기서는 1986년까지의 감소를 기술하므로 과거시제가 적합 ❌ → dropped ✅\nⓑ fell: It is estimated that ~ fell 추정 내용의 과거 사실 서술 → fell ✅\nⓒ to recognize: It is important to-v 가주어-진주어 구문 → to recognize ✅\nⓓ protecting: protecting them is ~ 동명사 주어 → protecting ✅',
    wrongs:[],
    tip:'🔑 과거완료 vs. 단순과거: 과거완료(had p.p.)는 \'과거의 과거\'를 나타낼 때 사용. until + 과거시제와 함께 쓸 때는 단순과거가 자연스러운 경우가 많음.\nIt is important to-v: 가주어(It) + 진주어(to-v) 구문\n동명사 주어: Protecting them is ~ (동명사구가 주어 → 단수 취급)'
  }
},
{
  id:4, type:'어휘', diff:'보통', pts:5, fmt:'mc',
  note:'어휘 A/B/C',
  passage:`Over the past two centuries, human activities have generated a (A) [significant / insignificant] amount of carbon dioxide. This gas itself is not dangerous when we encounter it in everyday situations. However, excessive amounts of this gas in the atmosphere have contributed to the greenhouse effect, resulting in a (B) [gradual / sudden] increase in the Earth's surface temperature. To make matters worse, this increase has sped up in recent years and is seriously (C) [threatening / protecting] life on our planet.`,
  stem:`다음 글의 괄호 (A), (B), (C) 안에서 문맥에 맞는 낱말로 가장 적절한 것을 고르시오.`,
  ch:['(A) significant – (B) gradual – (C) threatening','(A) insignificant – (B) gradual – (C) threatening','(A) significant – (B) sudden – (C) threatening','(A) significant – (B) gradual – (C) protecting','(A) insignificant – (B) sudden – (C) protecting'],
  ans:0,
  det:{
    ref:'[원문] have generated a significant amount of CO₂ / resulting in a gradual increase / seriously threatening life [해석] 상당한 양의 CO₂를 생성했다 / 점진적인 온도 상승을 초래하며 / 생명을 심각하게 위협하고 있다. (A) 인간 활동이 많은 CO₂를 만들었다는 맥락 → significant(상당한), (B) 온실효과로 인한 \'점진적\' 상승 → gradual, (C) 기후변화가 생명을 \'위협\'한다 → threatening.',
    correct:'(A) significant(상당한) vs. insignificant(미미한): 온실효과를 유발할 만큼 \'많은\' 양이므로 significant ✅ / insignificant는 문맥과 반대 ❌\n(B) gradual(점진적인) vs. sudden(갑작스러운): 원문에서 \'점진적 증가\'이며 최근 가속되었다고 했으므로 gradual ✅ / sudden은 원문과 불일치 ❌\n(C) threatening(위협하는) vs. protecting(보호하는): 기후변화가 생명을 \'위협\'하는 맥락 → threatening ✅ / protecting은 정반대 ❌',
    wrongs:[],
    tip:'🔑 significant ≈ considerable, substantial (상당한) ↔ insignificant ≈ negligible (미미한)\ngradual ≈ slow, steady (점진적인) ↔ sudden ≈ abrupt (갑작스러운)\nthreaten ≈ endanger, jeopardize (위협하다) ↔ protect ≈ safeguard (보호하다)\n문맥 흐름: CO₂ 많이 생성 → 온실효과 → 점진적 온도 상승 → 생명 위협'
  }
},
{
  id:5, type:'어휘', diff:'어려움', pts:6, fmt:'mc',
  note:'어휘 부적절',
  passage:`Whales dive deep into the ocean to feed on prey such as krill and small fish, and they occasionally swim up to the surface to breathe. When they near the surface, they release an enormous amount of waste. This waste is rich in nutrients that are ① <u>essential</u> for creatures living in that area. Specifically, it creates the perfect growing conditions for some ② <u>microscopic</u> creatures floating at the surface of the ocean. These creatures, called phytoplankton, may look tiny and ③ <u>significant</u>, but when taken together, they play a ④ <u>significant</u> role in reducing CO₂. They absorb about 40% of the carbon in the atmosphere and produce about 50% of the atmosphere's oxygen through photosynthesis, a process that creates energy using carbon, water, and ⑤ <u>light</u>.`,
  stem:`다음 글의 밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것을 고르시오.`,
  ch:['① essential','② microscopic','③ significant','④ significant','⑤ light'],
  ans:2,
  det:{
    ref:'[원문] may look tiny and insignificant [해석] 아주 작고 하찮아 보일 수 있다. 원문은 insignificant(하찮은)인데 ③에서 significant(중요한)로 바뀌어 있다. 문맥상 \'작고 하찮아 보이지만(but) 중요한 역할을 한다\'는 역접 구조이므로, ③은 insignificant가 되어야 한다.',
    correct:'① essential: 영양분이 생물에게 \'필수적인\' → essential ✅\n② microscopic: \'현미경으로 봐야 할 정도로 작은\' 생물 → microscopic ✅\n③ significant: 원문은 insignificant(하찮은). tiny and insignificant(작고 하찮은)이 but 이하의 significant role과 대조 → significant ❌ → insignificant ✅\n④ significant: play a significant role(중요한 역할을 하다) → significant ✅\n⑤ light: 광합성에 탄소, 물, 빛을 사용 → light ✅',
    wrongs:[],
    tip:'🔑 insignificant ≈ trivial, negligible (하찮은) ↔ significant ≈ important, considerable (중요한)\n역접(but) 앞뒤 의미 대조 패턴: tiny and insignificant ↔ play a significant role\nmicroscopic ≈ extremely small, minute (극히 작은)\nessential ≈ vital, indispensable, crucial (필수적인)'
  }
},
{
  id:6, type:'어휘', diff:'보통', pts:5, fmt:'mc',
  note:'어휘 부적절',
  passage:`Whales spread nutrients in the ocean not only vertically but also ① <u>horizontally</u> through a process called the great whale conveyor belt. These giant mammals ② <u>migrate</u> over long distances at certain times of the year. For example, in the summer, humpback whales tend to stay near Alaska, where the water is cold but rich in nutrients. As winter approaches, they travel up to 4,800 kilometers to breed in the warm waters near Hawaii. Nutrients are relatively ③ <u>abundant</u> in warm waters, which makes it difficult for phytoplankton to survive. Fortunately, when the whales arrive in Hawaii after eating their fill in Alaska, they release a large amount of ④ <u>nutrient-rich</u> waste. These nutrients support the life of many marine animals and, importantly, ⑤ <u>encourage</u> the growth of phytoplankton even in warm waters.`,
  stem:`다음 글의 밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것을 고르시오.`,
  ch:['① horizontally','② migrate','③ abundant','④ nutrient-rich','⑤ encourage'],
  ans:2,
  det:{
    ref:'[원문] Nutrients are relatively scarce in warm waters [해석] 따뜻한 물에서는 영양분이 비교적 부족하다. 원문은 scarce(부족한)인데 ③에서 abundant(풍부한)로 바뀌어 있다. 따뜻한 물에서 영양분이 부족하기 때문에 식물성 플랑크톤이 살기 어렵다는 맥락이므로, abundant는 부적절하다.',
    correct:'① horizontally: 수직적(vertically)뿐 아니라 수평적(horizontally)으로도 → horizontally ✅\n② migrate: 거대한 포유류가 장거리를 \'이동하다\' → migrate ✅\n③ abundant: 원문은 scarce(부족한). 따뜻한 물에서 영양분이 부족해서 식물성 플랑크톤이 살기 어렵다는 문맥 → abundant(풍부한) ❌ → scarce ✅\n④ nutrient-rich: \'영양분이 풍부한\' 배설물 → nutrient-rich ✅\n⑤ encourage: 성장을 \'촉진하다\' → encourage ✅',
    wrongs:[],
    tip:'🔑 scarce ≈ rare, insufficient (부족한, 드문) ↔ abundant ≈ plentiful, ample (풍부한)\nmigrate ≈ move, travel seasonally (이동하다)\nnutrient-rich ≈ nourishing (영양분이 풍부한)\nencourage ≈ promote, stimulate, foster (촉진하다)\n인과 관계 확인: 영양분 부족(scarce) → 생존 어려움(difficult to survive)'
  }
},
{
  id:7, type:'대의', diff:'보통', pts:5, fmt:'mc',
  note:'주제',
  passage:`In addition to their direct absorption and burial of CO₂ through whale falls, whales also make a significant indirect contribution to reducing CO₂ through an act called a whale pump. This refers to the vertical movements of whales that help circulate nutrients across different depths of the ocean. When they near the surface, they release an enormous amount of waste rich in nutrients that are essential for creatures living in that area. These creatures, called phytoplankton, absorb about 40% of the carbon in the atmosphere and produce about 50% of the atmosphere's oxygen through photosynthesis.`,
  stem:`다음 글의 주제로 가장 적절한 것을 고르시오.`,
  ch:['the role of whale pumps in reducing CO₂ through nutrient circulation','how whales absorb CO₂ directly from the atmosphere','the importance of phytoplankton in deep-sea ecosystems','various methods to protect endangered whale species','the harmful effects of CO₂ on marine life'],
  ans:0,
  det:{
    ref:'[원문] whales also make a significant indirect contribution to reducing CO₂ through an act called a whale pump [해석] 고래는 고래 펌프라 불리는 행동을 통해 CO₂ 감소에 상당한 간접적 기여를 한다. 지문은 고래 펌프가 영양분을 순환시켜 식물성 플랑크톤의 성장을 돕고, 이것이 CO₂ 흡수로 이어진다는 내용이다.',
    correct:'① the role of whale pumps in reducing CO₂ through nutrient circulation: 고래 펌프가 영양분 순환을 통해 CO₂를 줄이는 역할 → 지문의 핵심 내용과 정확히 일치 ✅\n② how whales absorb CO₂ directly from the atmosphere: 직접 흡수가 아닌 \'간접적 기여\'가 핵심 → 부분적, 부정확 ❌\n③ the importance of phytoplankton in deep-sea ecosystems: 식물성 플랑크톤은 해수면(surface)에 서식, deep-sea가 아님 ❌\n④ various methods to protect endangered whale species: 고래 보호 방법은 이 지문에서 다루지 않음 ❌\n⑤ the harmful effects of CO₂ on marine life: CO₂가 해양 생물에 미치는 피해는 이 지문의 주제가 아님 ❌',
    wrongs:[],
    tip:'🔑 주제 파악 전략: 반복 키워드(whale pump, nutrients, CO₂, phytoplankton) + 첫 문장의 핵심어(indirect contribution to reducing CO₂) 확인\nwhale pump = 고래의 수직 이동으로 인한 영양분 순환 메커니즘\nindirect contribution ≈ 간접적 기여'
  }
},
{
  id:8, type:'대의', diff:'보통', pts:5, fmt:'mc',
  note:'제목',
  passage:`While many high-tech solutions such as carbon capture have been proposed, they are often too expensive to be used widely. Fortunately, there are also low-tech, economical, and even long-lasting solutions available. According to scientists, a single whale can absorb about 550 kilograms of CO₂ per year, while a tree can absorb only 22. Moreover, after they die, whales sink to the ocean floor with all the CO₂ they absorbed during their lives. Whale falls permanently bury about 145,000 tons of CO₂ under the sea every year. This achievement is basically what expensive carbon capture technologies aim to do.`,
  stem:`다음 글의 제목으로 가장 적절한 것을 고르시오.`,
  ch:['Whales: Nature\'s Cost-Effective Carbon Capture Solution','Why Carbon Capture Technology Is Failing','Trees vs. Whales: Which Absorbs More Oxygen?','The Mystery of Whale Falls in the Deep Sea','High-Tech Solutions for a Warmer Planet'],
  ans:0,
  det:{
    ref:'[원문] there are also low-tech, economical, and even long-lasting solutions available / This achievement is basically what expensive carbon capture technologies aim to do [해석] 저비용이면서 오래 지속되는 해결책이 있다 / 이 성과는 기본적으로 비싼 탄소 포집 기술이 목표로 하는 것이다. 고비용 기술과 대비하여 고래가 경제적인 자연 기반 탄소 흡수원이라는 것이 핵심.',
    correct:'① Whales: Nature\'s Cost-Effective Carbon Capture Solution: 고래가 자연의 비용 효율적 탄소 포집 해결책이라는 지문 핵심과 정확히 부합 ✅\n② Why Carbon Capture Technology Is Failing: 탄소 포집 기술의 실패가 아닌 고비용 대비 고래의 장점이 핵심 ❌\n③ Trees vs. Whales: Which Absorbs More Oxygen?: 산소가 아닌 CO₂ 흡수 비교이며, 이것은 전체가 아닌 부분적 내용 ❌\n④ The Mystery of Whale Falls in the Deep Sea: whale fall은 소재 중 하나이지 신비(mystery)가 주제가 아님 ❌\n⑤ High-Tech Solutions for a Warmer Planet: 지문은 high-tech가 아닌 low-tech 해결책을 강조 ❌',
    wrongs:[],
    tip:'🔑 제목 = 글의 핵심 주제를 함축적으로 표현\ncost-effective ≈ economical ≈ affordable (비용 효율적인)\nnature-based solution (자연 기반 해결책) — 핵심 대조: high-tech & expensive ↔ low-tech & economical\ncarbon capture ≈ 탄소 포집 기술'
  }
},
{
  id:9, type:'대의', diff:'어려움', pts:6, fmt:'mc',
  note:'시사점',
  passage:`It is important to recognize that whales are valuable partners in our fight against the climate crisis and that protecting them is an effective and cost-efficient way to address this global challenge. Let's take action to help more whales live longer and healthier lives. Despite the important roles of whales in our environment, their lives are at serious risk. Today, whales are still threatened by various man-made dangers, such as fishing nets, ship strikes, and microplastic pollution in the ocean.`,
  stem:`다음 글을 읽고 필자가 전달하고자 하는 시사점으로 가장 적절한 것을 고르시오.`,
  ch:['Protecting whales is a practical and economical strategy for combating climate change.','The international ban on whaling in 1986 has completely solved the problem of declining whale populations.','Advanced technology is the only reliable solution for reducing atmospheric CO₂.','Climate change has minimal effects on marine ecosystems compared to land ecosystems.','Individual actions have little impact on global environmental issues.'],
  ans:0,
  det:{
    ref:'[원문] protecting them is an effective and cost-efficient way to address this global challenge [해석] 고래를 보호하는 것은 이 전 지구적 과제를 해결하는 효과적이고 비용 효율적인 방법이다. 필자는 고래 보호가 기후 위기에 대한 실질적이고 경제적인 전략임을 강조하며 행동을 촉구하고 있다.',
    correct:'① Protecting whales is a practical and economical strategy for combating climate change: 필자의 핵심 메시지와 정확히 일치 — effective, cost-efficient → practical, economical ✅\n② The international ban on whaling in 1986 has completely solved the problem: \'completely solved\'는 과장. 지문에서 여전히 위협받고 있다고 언급 ❌\n③ Advanced technology is the only reliable solution: 지문은 자연 기반 해결책(고래)을 강조, high-tech only가 아님 ❌\n④ Climate change has minimal effects on marine ecosystems: 지문 내용과 무관하며 오히려 반대 ❌\n⑤ Individual actions have little impact: 지문은 \'Let\'s take action\'이라며 행동을 촉구 → 반대 취지 ❌',
    wrongs:[],
    tip:'🔑 시사점 = 필자가 글 전체를 통해 궁극적으로 전달하려는 메시지\npractical ≈ effective ≈ workable (실질적인)\neconomical ≈ cost-efficient ≈ affordable (경제적인)\ncombat ≈ fight against ≈ tackle (맞서 싸우다)\n필자 태도 키워드: \'Let\'s take action\' → 행동 촉구'
  }
},
{
  id:10, type:'일치', diff:'쉬움', pts:3, fmt:'mc',
  note:'일치',
  passage:`Whales are amazing creatures. The largest blue whales can grow as long as 30 meters and weigh over 200 tons, and some whales have been known to live for more than 100 years. According to scientists, a single whale can absorb about 550 kilograms of CO₂ per year, while a tree can absorb only 22. Whale falls permanently bury about 145,000 tons of CO₂ under the sea every year. This achievement is basically what expensive carbon capture technologies aim to do—capture carbon and then store it underground.`,
  stem:`다음 글의 내용과 일치하는 것을 고르시오.`,
  ch:['A single whale absorbs about 25 times more CO₂ per year than a tree.','Blue whales can grow up to 200 meters long.','No whale has ever been known to live beyond 50 years.','Trees absorb more CO₂ per year than whales do.','Whale falls release CO₂ back into the atmosphere.'],
  ans:0,
  det:{
    ref:'[원문] a single whale can absorb about 550 kilograms of CO₂ per year, while a tree can absorb only 22 [해석] 한 마리 고래는 연간 약 550kg의 CO₂를 흡수할 수 있는 반면, 나무 한 그루는 22kg만 흡수할 수 있다. 550÷22=25로, 고래가 나무보다 약 25배 더 많은 CO₂를 흡수한다.',
    correct:'① A single whale absorbs about 25 times more CO₂ per year than a tree: 550÷22=25 → 약 25배 ✅\n② Blue whales can grow up to 200 meters: 30 meters가 맞음, 200은 무게(톤) ❌\n③ No whale has ever been known to live beyond 50 years: 100년 이상 사는 고래가 있다고 함 ❌\n④ Trees absorb more CO₂ than whales: 나무 22kg < 고래 550kg → 반대 ❌\n⑤ Whale falls release CO₂ back into the atmosphere: permanently bury(영구히 묻는다)이므로 방출이 아님 ❌',
    wrongs:[],
    tip:'🔑 수치 비교 문제: 550kg(고래) vs. 22kg(나무) → 550÷22≈25배\n일치 문제 풀이 전략: 선지의 숫자·단위·비교 방향을 원문과 정확히 대조\npermanently bury ≈ store forever (영구히 저장하다) ↔ release ≈ emit (방출하다)'
  }
},
{
  id:11, type:'불일치', diff:'보통', pts:5, fmt:'mc',
  note:'불일치',
  passage:`Whales spread nutrients in the ocean not only vertically but also horizontally through a process called the great whale conveyor belt. In the summer, humpback whales tend to stay near Alaska, where the water is cold but rich in nutrients and prey for them to feed on. As winter approaches, they travel up to 4,800 kilometers to breed in the warm waters near Hawaii. Nutrients are relatively scarce in warm waters, which makes it difficult for phytoplankton to survive. Fortunately, when the whales arrive in Hawaii after eating their fill in Alaska, they release a large amount of nutrient-rich waste.`,
  stem:`다음 글의 내용과 일치하지 않는 것을 고르시오.`,
  ch:['Humpback whales stay near Alaska during the summer.','Humpback whales travel up to 4,800 kilometers to breed.','Warm waters near Hawaii are rich in nutrients year-round.','The great whale conveyor belt moves nutrients horizontally.','Whales release nutrient-rich waste after eating their fill.'],
  ans:2,
  det:{
    ref:'[원문] Nutrients are relatively scarce in warm waters [해석] 따뜻한 물에서는 영양분이 비교적 부족하다. ③번은 \'하와이 근처 따뜻한 물은 연중 영양분이 풍부하다\'라고 했는데, 원문에서는 영양분이 부족(scarce)하다고 했으므로 불일치한다.',
    correct:'① Humpback whales stay near Alaska during the summer: 원문 \'In the summer, humpback whales tend to stay near Alaska\' 일치 ✅\n② Humpback whales travel up to 4,800 km to breed: 원문 \'they travel up to 4,800 kilometers to breed\' 일치 ✅\n③ Warm waters near Hawaii are rich in nutrients year-round: 원문 \'Nutrients are relatively scarce in warm waters\' → rich가 아닌 scarce이므로 불일치 ❌ (정답)\n④ The great whale conveyor belt moves nutrients horizontally: 원문 \'horizontally through a process called the great whale conveyor belt\' 일치 ✅\n⑤ Whales release nutrient-rich waste after eating their fill: 원문 일치 ✅',
    wrongs:[],
    tip:'🔑 불일치 문제 = 원문과 다른 내용 찾기\nscarce(부족한) ↔ rich/abundant(풍부한) — 반의어 함정에 주의!\nyear-round(연중) = 원문에 없는 추가 정보 삽입 → 불일치 근거\ntend to stay ≈ usually remain (보통 ~에 머무르다)'
  }
},
{
  id:12, type:'빈칸', diff:'어려움', pts:6, fmt:'mc',
  note:'빈칸(구)',
  passage:`Whales dive deep into the ocean to feed on prey such as krill and small fish, and they occasionally swim up to the surface to breathe. When they near the surface, they release an enormous amount of waste. This waste is rich in nutrients that are essential for creatures living in that area. Specifically, it creates the perfect growing conditions for some microscopic creatures floating at the surface of the ocean. These creatures, called phytoplankton, absorb about 40% of the carbon in the atmosphere and produce about 50% of the atmosphere's oxygen. It is estimated that increasing the world's phytoplankton by 1% is equivalent to planting 2 billion new trees. In this way, whales indirectly contribute to reducing CO₂ by ________________.`,
  stem:`다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.`,
  ch:['providing nutrients that support phytoplankton growth','directly absorbing carbon dioxide from the air','migrating to warmer waters during winter','sinking to the ocean floor after death','consuming large amounts of krill and fish'],
  ans:0,
  det:{
    ref:'[원문] This waste is rich in nutrients ... it creates the perfect growing conditions for ... phytoplankton [해석] 이 배설물은 영양분이 풍부하며 식물성 플랑크톤의 완벽한 성장 조건을 만든다. 고래가 간접적으로 CO₂ 감소에 기여하는 방식은 \'영양분을 제공하여 식물성 플랑크톤 성장을 돕는 것\'이다.',
    correct:'① providing nutrients that support phytoplankton growth: 고래 배설물 → 영양분 → 식물성 플랑크톤 성장 → CO₂ 흡수 연결 고리와 정확히 일치 ✅\n② directly absorbing carbon dioxide from the air: 직접 흡수가 아닌 \'간접적\' 기여가 핵심 ❌\n③ migrating to warmer waters during winter: 이동은 great whale conveyor belt 관련, 이 지문의 핵심이 아님 ❌\n④ sinking to the ocean floor after death: whale fall은 직접적 기여, 여기서는 간접적 기여를 설명 ❌\n⑤ consuming large amounts of krill and fish: 먹이 섭취는 과정의 일부이지 CO₂ 감소 기여 방식 자체가 아님 ❌',
    wrongs:[],
    tip:'🔑 빈칸(구) 전략: 빈칸 앞의 \'by\' = 수단/방법 → \'어떤 방법으로\' 간접 기여하는지 찾기\n논리 흐름: 고래 배설물(waste) → 영양분(nutrients) → 식물성 플랑크톤(phytoplankton) → CO₂ 흡수\nindirectly ≈ 간접적으로 ↔ directly ≈ 직접적으로\nprovide ≈ supply, deliver (제공하다)'
  }
},
{
  id:13, type:'빈칸', diff:'어려움', pts:6, fmt:'mc',
  note:'빈칸(문장)',
  passage:`Whales spread nutrients in the ocean not only vertically but also horizontally through a process called the great whale conveyor belt. In the summer, humpback whales tend to stay near Alaska, where the water is cold but rich in nutrients. As winter approaches, they travel up to 4,800 kilometers to breed in the warm waters near Hawaii. Nutrients are relatively scarce in warm waters. Fortunately, when the whales arrive in Hawaii after eating their fill in Alaska, they release a large amount of nutrient-rich waste. This means that the great whale conveyor belt essentially ________________________________.`,
  stem:`다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.`,
  ch:['transports nutrients from nutrient-rich cold waters to nutrient-poor warm waters','prevents phytoplankton from growing in cold water regions','helps whales avoid predators during their long migration','increases the temperature of the ocean along migration routes','reduces the amount of oxygen available in tropical waters'],
  ans:0,
  det:{
    ref:'[원문] This process can be thought of as a conveyor belt that moves nutrients from cold waters to warm waters [해석] 이 과정은 차가운 물에서 따뜻한 물로 영양분을 이동시키는 컨베이어 벨트로 생각할 수 있다. 고래가 알래스카(영양분 풍부한 찬 물)에서 먹고 하와이(영양분 부족한 따뜻한 물)로 이동하며 영양분을 운반하는 과정이다.',
    correct:'① transports nutrients from nutrient-rich cold waters to nutrient-poor warm waters: 알래스카(cold, nutrient-rich) → 하와이(warm, nutrient-scarce)로 영양분 운반 → 정확히 일치 ✅\n② prevents phytoplankton from growing in cold water regions: 오히려 성장을 촉진, 방해가 아님 ❌\n③ helps whales avoid predators during their long migration: 포식자 회피는 지문에 언급 없음 ❌\n④ increases the temperature of the ocean: 수온 변화는 지문 내용과 무관 ❌\n⑤ reduces the amount of oxygen available in tropical waters: 산소 감소가 아닌 영양분 공급이 핵심 ❌',
    wrongs:[],
    tip:'🔑 빈칸(문장) 전략: 빈칸 앞의 \'essentially\'(본질적으로)와 \'This means that\'(이것은 ~을 의미한다) → 앞 내용의 핵심 요약\nconveyor belt ≈ 컨베이어 벨트(자동 운반 장치) — 비유적 표현\ntransport ≈ move, carry, deliver (운반하다)\nnutrient-rich ↔ nutrient-poor (영양분 풍부한 ↔ 영양분 부족한)'
  }
},
{
  id:14, type:'함축', diff:'보통', pts:5, fmt:'mc',
  note:'함축',
  passage:`According to scientists, a single whale can absorb about 550 kilograms of CO₂ per year, while a tree can absorb only 22. Moreover, after they die, whales sink to the ocean floor with all the CO₂ they absorbed during their lives. Their bodies then become food and habitats for deep-sea creatures. This process is called a whale fall. Whale falls permanently bury about 145,000 tons of CO₂ under the sea every year. <u>This achievement is basically what expensive carbon capture technologies aim to do</u>—capture carbon and then store it underground.`,
  stem:`다음 글의 밑줄 친 'This achievement is basically what expensive carbon capture technologies aim to do'가 의미하는 바로 가장 적절한 것을 고르시오.`,
  ch:['Whale falls naturally accomplish the same goal that costly carbon capture technologies pursue.','Carbon capture technology was inspired by the study of whale falls.','Whales are more expensive to protect than developing new carbon capture systems.','The CO₂ buried by whale falls will eventually be released back into the atmosphere.','Scientists have abandoned carbon capture technology in favor of whale conservation.'],
  ans:0,
  det:{
    ref:'[원문] This achievement is basically what expensive carbon capture technologies aim to do—capture carbon and then store it underground [해석] 이 성과는 기본적으로 비싼 탄소 포집 기술이 목표로 하는 것, 즉 탄소를 포집하여 지하에 저장하는 것이다. 고래 낙하(whale fall)가 자연적으로 비싼 기술과 같은 목표를 달성한다는 뜻이다.',
    correct:'① Whale falls naturally accomplish the same goal that costly carbon capture technologies pursue: whale fall이 비싼 기술과 동일한 목표(탄소 포집·저장)를 자연적으로 달성 → 정확한 함축 ✅\n② Carbon capture technology was inspired by whale falls: 영감 관계는 언급 없음 ❌\n③ Whales are more expensive to protect: 지문은 고래가 \'경제적\' 해결책이라고 강조 → 반대 ❌\n④ CO₂ buried by whale falls will eventually be released: permanently(영구적으로) bury → 방출되지 않음 ❌\n⑤ Scientists have abandoned carbon capture technology: 포기했다는 내용 없음 ❌',
    wrongs:[],
    tip:'🔑 함축 의미 파악: 밑줄 문장의 핵심 = \'This achievement(whale fall의 CO₂ 매장) = expensive carbon capture(비싼 기술의 목표)\'\nbasically ≈ essentially, fundamentally (기본적으로)\naim to do ≈ seek to accomplish, pursue (목표로 하다)\naccomplish ≈ achieve ≈ fulfill (달성하다)'
  }
},
{
  id:15, type:'순서', diff:'보통', pts:5, fmt:'mc',
  note:'순서배열',
  passage:`Whales dive deep into the ocean to feed on prey such as krill and small fish, and they occasionally swim up to the surface to breathe.

(A) These creatures, called phytoplankton, may look tiny and insignificant, but when taken together, they play a significant role in reducing CO₂.
(B) When they near the surface, they release an enormous amount of waste. This waste is rich in nutrients that are essential for creatures living in that area.
(C) Specifically, it creates the perfect growing conditions for some microscopic creatures floating at the surface of the ocean.`,
  stem:`주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.`,
  ch:['(A)-(B)-(C)','(A)-(C)-(B)','(B)-(C)-(A)','(B)-(A)-(C)','(C)-(A)-(B)'],
  ans:2,
  det:{
    ref:'[해석] 주어진 문장: 고래가 먹이를 먹으려 깊이 잠수하고, 때때로 숨을 쉬기 위해 수면으로 올라온다.\n(B) 수면 가까이에서 엄청난 양의 배설물을 방출한다. 이 배설물은 영양분이 풍부하다.\n(C) 구체적으로, 해수면에 떠다니는 미세 생물의 완벽한 성장 조건을 만든다.\n(A) 이 생물을 식물성 플랑크톤이라 부르며, CO₂ 감소에 중요한 역할을 한다.\n→ B(배설물·영양분) → C(구체적으로: 미세 생물 성장 조건) → A(이 생물 = 식물성 플랑크톤의 역할)',
    correct:'정답 (B)-(C)-(A) ✅\n(B)가 먼저: 주어진 문장의 \'swim up to the surface\'에 이어 \'When they near the surface\' 연결\n(C)가 다음: \'Specifically\'(구체적으로)가 (B)의 \'nutrients\'를 구체화, \'it\'은 waste를 지칭\n(A)가 마지막: \'These creatures\'가 (C)의 \'microscopic creatures\'를 지칭\n나머지 선지: 지시어·접속부사 연결이 자연스럽지 않음 ❌',
    wrongs:[],
    tip:'🔑 순서배열 전략:\n1) 지시어 추적: These creatures(A) → microscopic creatures(C)를 받음 → C→A\n2) 접속부사: Specifically(구체적으로) → 앞 내용을 구체화 → B→C\n3) 대명사: it(C) = waste(B) → B→C\n4) 논리 흐름: 배설물 방출 → 영양분 → 성장 조건 → 역할'
  }
},
{
  id:16, type:'무관', diff:'쉬움', pts:3, fmt:'mc',
  note:'무관문장',
  passage:`① Over the past two centuries, human activities have generated a significant amount of carbon dioxide. ② This gas itself is not dangerous when we encounter it in everyday situations. ③ However, excessive amounts of this gas in the atmosphere have contributed to the greenhouse effect. ④ Meanwhile, many deep-sea fish have developed bioluminescence to survive in complete darkness. ⑤ To make matters worse, this increase has sped up in recent years and is seriously threatening life on our planet.`,
  stem:`다음 글에서 전체 흐름과 관계 없는 문장을 고르시오.`,
  ch:['①','②','③','④','⑤'],
  ans:3,
  det:{
    ref:'[해석] ①~③, ⑤는 CO₂와 온실효과로 인한 기후 위기에 대한 내용이다. ④ \'심해 물고기가 완전한 어둠 속에서 생존하기 위해 생물발광 능력을 발달시켰다\'는 심해 생물의 특성에 관한 내용으로, CO₂·온실효과·기후변화와 무관하다.',
    correct:'① CO₂ 대량 생성 → 전체 흐름(CO₂ 문제)과 일치 ✅\n② CO₂ 자체는 일상에서 위험하지 않음 → CO₂ 설명 흐름 유지 ✅\n③ 대기 중 과도한 CO₂가 온실효과에 기여 → 핵심 논지 ✅\n④ 심해 물고기의 생물발광 → CO₂·온실효과와 완전히 무관 ❌ (정답)\n⑤ 기온 상승이 가속화되어 생명 위협 → 핵심 논지 ✅',
    wrongs:[],
    tip:'🔑 무관문장 전략: 글의 중심 화제(CO₂ → 온실효과 → 기후 위기)를 파악하고, 이탈하는 문장 찾기\nbioluminescence = 생물발광 (심해 생물 관련 → 기후변화와 무관)\nMeanwhile(한편)는 화제 전환 신호 → 무관문장 단서\nTo make matters worse ≈ Even worse (설상가상으로) — 흐름 강화 신호'
  }
},
{
  id:17, type:'TF', diff:'쉬움', pts:3, fmt:'mc',
  note:'TF',
  passage:`These creatures, called phytoplankton, may look tiny and insignificant, but when taken together, they play a significant role in reducing CO₂. <u>They</u> absorb about 40% of the carbon in the atmosphere and produce about 50% of the atmosphere's oxygen. They do this through photosynthesis, a process that creates energy using carbon, water, and light.`,
  stem:`다음 글의 밑줄 친 'They'가 가리키는 대상으로, 'phytoplankton(식물성 플랑크톤)'이면 T, 'whales(고래)'이면 F를 고르시오.`,
  ch:['T','F'],

function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🔍 내신핏 약점 진단</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'var(--o)':p>=50?'var(--o)':'var(--r)';const icon=p===100?'✅':p>=50?'⚠️':'❌';h+=`<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:13px">${icon}</span><span style="font-size:13px;font-weight:700;flex:1">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-size:13px;font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div>${p<100?`<div style="font-size:11px;color:var(--tm);margin-top:3px;padding-left:21px">→ ${getTypeAdvice(type)}</div>`:''}</div>`;});h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 내신핏 처방</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">👑</div><div class="plan-text"><h4>마스터 달성!</h4><p>이 단원은 완벽합니다. 다음 단원에 도전하세요!</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">🌟</div><div class="plan-text"><h4>통과! 마스터까지 한 끗</h4><p>아래 약점 유형만 집중하면 마스터 달성!</p></div>`;else if(pct>=50)h+=`<div class="plan-icon">🔥</div><div class="plan-text"><h4>기본기는 있어요!</h4><p>오답 해설을 꼼꼼히 확인하고, 약점 유형부터 공략하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>지문 해석부터!</h4><p>본문을 완벽히 이해한 뒤 재도전하세요. 해설의 한글 해석을 활용!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid" style="grid-template-columns:1fr 1fr"><button class="act-btn" onclick="shareImage()"><span class="act-icon">📸</span><span class="act-label">이미지 공유</span></button><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">텍스트 복사</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:(d.q.wa||'');const open=!d.ok;
let chHtml='';if(d.q.fmt==='mc'&&d.q.ch){chHtml=`<div style="margin-top:8px">`;d.q.ch.forEach((c,ci)=>{const isAns=ci===d.q.ans;const isMy=d.ans===ci;const color=isAns?'var(--o)':(isMy&&!d.ok?'var(--r)':'var(--tm)');const bg=isAns?'var(--ol)':(isMy&&!d.ok?'var(--rl)':'transparent');const label=isAns?' ✅':(isMy&&!d.ok?' ❌':'');chHtml+=`<div style="padding:4px 8px;margin-bottom:2px;border-radius:6px;font-size:12px;color:${color};background:${bg}"><b>${mk[ci]}</b> ${c}${label}</div>`;});chHtml+=`</div>`;}
h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,8)}] ${d.q.diff} ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:10px"><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--ol);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:10px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--ol);color:var(--o)"><div style="font-size:10px;opacity:.7">정답</div>${ca}</div></div><div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📝 문제</div><div class="expl-box" style="font-size:12.5px;line-height:1.6;border-left:3px solid var(--b);margin-bottom:10px"><div style="font-weight:700;margin-bottom:6px">${d.q.stem}</div>${chHtml}</div>${d.q.passage?`<div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📖 원문</div><div class="expl-box" style="font-size:12px;line-height:1.75;border-left:3px solid #ddd;margin-bottom:10px">${d.q.passage}</div>`:''}${d.q.det?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean||''}</div><div class="expl-tag tip">📋 풀이 · 선지 분석</div><div class="expl-box" style="white-space:pre-line">${(d.q.det.analysis||'').replace(/\\n/g,'<br>')}</div><div class="expl-tag tip">💡 포인트</div><div class="expl-box tip-b">${d.q.det.tip||''}</div>`:''}</div></div>`;}); h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
