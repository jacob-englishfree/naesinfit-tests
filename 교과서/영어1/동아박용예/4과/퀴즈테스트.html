<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영어1 동아(박용예) 4과 온라인퀴즈TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>

:root{--o:#E8772E;--od:#B85A1A;--ol:#F5A623;--oxl:#FFF3E8;--oxxl:#FFFAF5;--bg:#F6F2EE;--text:#1A1A2E;--tm:#7A6A5E;--tl:#A89A8E;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--warn:#F59E0B;--wl:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,#FFF3E8,#FFE8D6 40%,#FFDDC8);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--o),#D97706);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--od),var(--o));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--o),#D97706);padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f0ede8;}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid #ddd8d2;border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid #d0c8c2;border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 4px rgba(232,119,46,.1);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;box-shadow:0 6px 20px rgba(232,119,46,.3);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid #c8c0b8;color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--o);color:var(--o);}
.history-badge{background:var(--oxl);color:var(--o);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid #ddd8d2;border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--o);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--o);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--o);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--o);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
/* Progress bar at top */
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--o),#D97706);transition:width .5s ease;border-radius:0 2px 2px 0;}
/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
/* Passage area - full screen scrollable */
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
/* Question info badge at top of passage */
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--oxl),var(--ol));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--od);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
/* Glass bottom panel */
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:12px 16px 16px;max-height:48vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
/* Stem */
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
/* Choices - premium feel */
.slide-choices{display:flex;flex-direction:column;gap:4px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;line-height:1.4;border:1.5px solid rgba(0,0,0,.06);border-radius:12px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--o);background:rgba(232,119,46,.08);box-shadow:0 0 0 3px rgba(232,119,46,.12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 rgba(232,119,46,.3)}70%{box-shadow:0 0 0 8px rgba(232,119,46,0)}100%{box-shadow:0 0 0 0 rgba(232,119,46,0)}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:24px;height:24px;font-size:11px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;}
/* Written input */
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 3px rgba(232,119,46,.1);}
/* Navigation */
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(232,119,46,.25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--o);}
/* Answer count indicator */
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--o);background:var(--oxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--ol);color:#BF360C;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f0ede8;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--o);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:linear-gradient(135deg,#FFFAF8,#F5F0EB);border-left:3px solid var(--o);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid #ddd8d2;border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--o);}.choice-btn.selected{border-color:var(--o);box-shadow:0 0 0 2px rgba(232,119,46,.12);background:var(--oxxl);}
.c-num{min-width:22px;height:22px;background:#e8e0d8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid #d0c8c2;border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--o);}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--oxl),var(--ol));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--od),var(--o));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8e0d8;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--o),var(--ol));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--oxxl);border-radius:var(--rs);border:1px solid #ddd8d2;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--oxl);}.info-cell.highlight .ic-value{color:var(--o);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0d8;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--ol);color:var(--o);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--oxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0c8c2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--o);color:var(--o);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #ddd8d2;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--oxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--oxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--ol);color:var(--o);}.expl-tag.tip{background:var(--oxl);color:var(--od);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--o);}.expl-box.tip-b{border-left:3px solid var(--o);background:var(--oxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">📝 온라인퀴즈 TEST</div>
  <h1 class="start-title">온라인퀴즈 <span>TEST</span></h1>
  <p class="start-subtitle">영어1 동아(박용예) · 4과 · Healthier Digital Life · 20문항</p>
  <div class="info-card"><div class="info-card-header">📚 시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">교과서</span><span class="info-value">영어1 동아(박용예)</span></div>
    <div class="info-row"><span class="info-label">과</span><span class="info-value">4과</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">Tips and Tricks for a Healthier Digital Life</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">📝 20문항</div><div class="chip">⏱️ 20분</div><div class="chip">✅ 80점 이상 통과</div><div class="chip">📊 100점 만점</div></div>

    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>

</div>
</div>

<script>
const EI={"subject":"영어1 동아(박용예)","pub":"4과","lesson":"Healthier Digital Life","title":"Tips and Tricks for a Healthier Digital Life","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_eng1_donga_L4_v1"};

const Q=[
// ━━━ 문장삽입/어순배열 FIRST ━━━

// Q1: 문장삽입 · 어려움 · 6pts
{id:1,type:`문장삽입`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`\u2460`,`\u2461`,`\u2462`,`\u2463`],
passage:`Cathy is a gamer who runs a popular channel. \u2460 One day, she found that her channel had been suspended. She was confused until she realized she had used background music in her videos without permission. \u2461 Like Cathy, many content creators unknowingly violate copyright laws by embedding copyrighted material such as music, images, or video clips in their content. \u2462 To avoid this, check all the components of your content and make sure they do not include copyrighted material. \u2463`,
stem:`다음 글에서 주어진 문장이 들어가기에 가장 적절한 곳은?\n<br><br><b>"This is a common mistake that can lead to serious consequences, including the loss of your channel."</b>`,
det:{korean:`Cathy의 채널이 정지된 이유를 알게 된 직후, 이것이 채널 상실을 포함한 심각한 결과를 초래하는 흔한 실수라는 설명이 와야 한다. 그 후 "Like Cathy"로 일반화가 이어진다.`,
analysis:`✅ ②: 저작권 위반 인지 직후 → 흔한 실수 경고 → 일반화("Like Cathy")로 자연스러운 흐름\n❌ ①: 아직 문제 발생 전\n❌ ③: 이미 일반화 진행 후\n❌ ④: 해결책 제시 후 → 문맥 불일치`,
tip:`문장삽입: "This is a common mistake" → 구체적 사례(Cathy) 직후, 일반화 직전이 적절`}},

// Q2: 문장삽입 · 보통 · 5pts
{id:2,type:`문장삽입`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`\u2460`,`\u2461`,`\u2462`,`\u2463`],
passage:`Min is a high school student who loves posting photos on social media. \u2460 Lately, he has become obsessed with the number of likes his posts receive. \u2461 When his posts get few likes, he feels shame, rejection, and anxiety. \u2462 To use social media more mindfully, consider the following guidelines. \u2463`,
stem:`다음 글에서 주어진 문장이 들어가기에 가장 적절한 곳은?\n<br><br><b>"Min is not alone. Many people, especially teenagers, unconsciously compare themselves to others on social media. This can make them feel inferior, harm their self-esteem, and even lead to depression."</b>`,
det:{korean:`Min이 수치심, 거부감, 불안을 느낀다는 개인 사례 직후, "Min만 그런 것이 아니다"라는 일반화로 넓혀야 한다. 그 후 가이드라인 제시가 이어진다.`,
analysis:`✅ ③: 개인 사례(수치심/불안) 직후 → 일반화("Min is not alone") → 가이드라인으로 연결\n❌ ①: 아직 문제 서술 전\n❌ ②: 좋아요 집착 직후 → 감정 반응 전\n❌ ④: 가이드라인 제시 후 → 문맥 단절`,
tip:`개인 → 일반화 패턴: 사례 직후 "not alone" → 같은 문제를 겪는 많은 사람`}},

// Q3: 어순배열 · 어려움 · 6pts
{id:3,type:`어순배열`,diff:`어려움`,pts:6,fmt:"written",wa:`what people post online shows only the highlights`,accept:[`what people post online shows only the highlights`,`What people post online shows only the highlights`],
passage:`To use social media more mindfully, consider the following guidelines. First, set time limits and take regular breaks. Second, remember that social media is a networking tool, not a competition. Third, keep in mind that __________________________________________ of their lives, not the full story.`,
stem:`다음 주어진 단어를 올바른 순서로 배열하시오.\n<br><br><b>people / online / only / the / what / post / highlights / shows</b>`,
det:{korean:`"<b>what people post online shows only the highlights</b>" → 사람들이 온라인에 올리는 것은 하이라이트만 보여준다.`,
analysis:`what people post online(주어절) + shows(동사) + only the highlights(목적어)\nwhat = 선행사 포함 관계대명사 → "~하는 것"`,
tip:`what + S + V(주어절) + shows(본동사): 관계대명사 what이 이끄는 명사절이 주어`}},

// Q4: 어법 5지선다 · 보통 · 5pts
{id:4,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:4,
ch:[`\u2460`,`\u2461`,`\u2462`,`\u2463`,`\u2464`],
passage:`Cathy is a gamer who \u2460<u>runs</u> a popular channel. One day, she found that her channel had been \u2461<u>suspended</u>. She was confused until she \u2462<u>realized</u> she had used background music without \u2463<u>permission</u>. Like Cathy, many content creators unknowingly violate copyright laws by \u2464<u>embed</u> copyrighted material in their content.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 어법상 <b>틀린</b> 것은?`,
det:{korean:`⑤ embed → <b>embedding</b>: 전치사 by 뒤에는 동명사(~ing)가 와야 한다. "삽입함으로써"`,
analysis:`❌ ⑤ embed: 전치사 by 뒤 → embedding(동명사)\n✅ ① runs: 주격 관계대명사 who + 3인칭 단수 동사\n✅ ② suspended: had been + p.p. (과거완료 수동태)\n✅ ③ realized: 과거형 동사\n✅ ④ permission: 명사 → without + 명사`,
tip:`by + ~ing(동명사): ~함으로써 — 전치사 뒤에는 동명사 형태가 필요`}},

// Q5: 어법 빈칸 · 보통 · 5pts
{id:5,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`base`,`based`,`basing`,`to base`],
passage:`Algorithms on websites and apps filter content __________ on your past purchases, likes, and search history.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`"과거 구매, 좋아요, 검색 기록에 <b>기반하여</b>" → 과거분사 <b>based</b>가 적절하다.`,
analysis:`✅ ② based: based on ~ = ~에 기반하여 (과거분사 분사구문)\n❌ ① base: 원형 → 문법적으로 불가\n❌ ③ basing: 능동 → content가 기반하는 주체가 아님\n❌ ④ to base: to부정사 → 부적절`,
tip:`based on = ~에 근거하여/기반하여 — 과거분사 분사구문`}},

// Q6: 어법 빈칸 · 보통 · 5pts
{id:6,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`what`,`which`,`that`,`where`],
passage:`Third, keep in mind that __________ people post online shows only the highlights of their lives, not the full story.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`<b>선행사를 포함하는</b> 관계대명사 <b>what</b>이 적절하다. "사람들이 온라인에 게시하는 것"이 주어절.`,
analysis:`✅ ① what: 선행사 포함 관계대명사 → "~하는 것" (명사절 주어)\n❌ ② which: 선행사 필요\n❌ ③ that: 선행사 필요\n❌ ④ where: 관계부사 → post의 목적어 필요`,
tip:`what + S + V = ~하는 것 (명사절) — what people post = 사람들이 게시하는 것`}},

// Q7: 부적절 어휘 · 보통 · 5pts
{id:7,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Alex is a fashion design student who loves online shopping. Recently, she noticed that the items \u2460<u>recommended</u> to her were always the same style. She had fallen into a filter bubble. Algorithms on websites and apps filter content based on your past purchases, likes, and search history. While this may seem \u2461<u>convenient</u>, it reinforces your existing beliefs and preferences, \u2462<u>expanding</u> your exposure to diverse perspectives. To check if you are in a filter bubble, try \u2463<u>logging</u> out and comparing the content you see. To manage filter bubbles, regularly clear your \u2464<u>cookies</u>.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`원문은 "<b>limiting</b>"(제한하는). ③ expanding(확장하는)은 limiting의 반의어로 부적절하다.`,
analysis:`❌ ③ expanding(확장하는): 원문 limiting(제한하는) → 다양한 관점 노출을 확장이 아닌 제한\n✅ ① recommended(추천된): 원문 일치\n✅ ② convenient(편리한): 원문 일치\n✅ ④ logging(로그): 원문 일치\n✅ ⑤ cookies(쿠키): 원문 일치`,
tip:`limiting(제한) ↔ expanding(확장) — "reinforces existing beliefs"가 다양성 제한의 단서`}},

// ━━━ 빈칸추론/서술형/내용/TF LAST ━━━

// Q8: 빈칸추론 · 어려움 · 6pts
{id:8,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:3,
ch:[`excitement`,`pride`,`confidence`,`depression`],
passage:`Many people, especially teenagers, unconsciously compare themselves to others on social media. This can make them feel inferior, harm their self-esteem, and even lead to __________.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`열등감을 느끼고 자존감이 손상되며, 심지어 <b>우울증(depression)</b>으로 이어진다.`,
analysis:`✅ ④ depression(우울증): feel inferior + harm self-esteem의 연장선 → 부정적 결과\n❌ ① excitement(흥분): 부정적 맥락과 불일치\n❌ ② pride(자부심): 반대 방향\n❌ ③ confidence(자신감): 반대 방향`,
tip:`feel inferior → harm self-esteem → depression: 부정적 감정의 연쇄 구조`}},

// Q9: 빈칸추론 · 보통 · 5pts
{id:9,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`a social trend`,`a filter bubble`,`a safety net`,`a comfort zone`],
passage:`Alex noticed that the items recommended to her were always the same style. She had fallen into __________. Algorithms on websites and apps filter content based on your past purchases, likes, and search history.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`항상 같은 스타일 추천 + 알고리즘 필터링 → <b>필터 버블(a filter bubble)</b>에 빠졌다.`,
analysis:`✅ ② a filter bubble: 알고리즘의 필터링 → 같은 콘텐츠만 노출\n❌ ① a social trend: 사회적 트렌드와는 다름\n❌ ③ a safety net: 안전망 → 무관\n❌ ④ a comfort zone: 비유적이지만 정확한 용어 아님`,
tip:`filter bubble = 필터 버블: 알고리즘이 맞춤 콘텐츠만 보여주는 현상`}},

// Q10: 서술형 어형변환 · 쉬움 · 4pts
{id:10,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`suspended`,accept:[`suspended`,`Suspended`],
passage:`Cathy is a gamer who runs a popular channel. One day, she found that her channel had been __________ (suspend).`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`suspend(동사) → <b>suspended(과거분사)</b>: "had been + p.p." 과거완료 수동태. "정지되었다"`,
analysis:`suspend(동사) → suspended(과거분사)\nhad been + p.p. = 과거완료 수동태\nhad been suspended = 정지되어 있었다`,
tip:`had been + p.p.: 과거완료 수동태 — 과거의 특정 시점 이전에 완료된 수동 사건`}},

// Q11: 서술형 어형변환 · 보통 · 5pts
{id:11,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`desperately`,accept:[`desperately`,`Desperately`],
passage:`Min __________ (desperate) wanted more likes on his posts, checking his phone every few minutes to see if the numbers had increased.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`desperate(형용사) → <b>desperately(부사)</b>: 동사 wanted를 수식하는 부사 필요. "필사적으로 원했다"`,
analysis:`desperate(형용사) → desperately(부사)\n동사 wanted를 수식하는 부사 필요\ndesperately wanted = 필사적으로 원했다`,
tip:`형용사 + -ly = 부사: desperate → desperately / excessive → excessively`}},

// Q12: 서술형 본문찾기 · 쉬움 · 4pts
{id:12,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`copyright`,accept:[`copyright`,`Copyright`],
passage:`Cathy is a gamer who runs a popular channel. One day, she found that her channel had been suspended. She was confused until she realized she had used background music in her videos without permission. Like Cathy, many content creators unknowingly violate copyright laws by embedding copyrighted material such as music, images, or video clips in their content.`,
stem:`다음 글에서 콘텐츠 제작자들이 모르는 사이에 위반하게 되는 법의 종류를 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`"violate <b>copyright</b> laws" → 저작권법 = <b>copyright</b>`,
analysis:`violate copyright laws = 저작권법을 위반하다\n1단어 답 = copyright`,
tip:`copyright = 저작권 — copyright law = 저작권법`}},

// Q13: 서술형 본문찾기 · 보통 · 5pts
{id:13,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`networking tool`,accept:[`networking tool`,`Networking tool`,`a networking tool`],
passage:`To use social media more mindfully, consider the following guidelines. First, set time limits and take regular breaks. Second, remember that social media is a networking tool, not a competition. Third, keep in mind that what people post online shows only the highlights of their lives, not the full story.`,
stem:`다음 글에서 소셜 미디어의 올바른 역할로 언급된 것을 본문에서 <b>2단어</b>로 찾아 쓰시오.`,
det:{korean:`"social media is a <b>networking tool</b>, not a competition" → 네트워킹 도구`,
analysis:`소셜 미디어의 역할 = networking tool(네트워킹 도구)\n"not a competition"과 대비되는 올바른 역할`,
tip:`networking tool = 네트워킹 도구 ↔ competition = 경쟁 — SNS의 본래 목적`}},

// Q14: 내용이해 일치 · 쉬움 · 4pts
{id:14,type:`내용이해`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`Cathy는 의도적으로 배경 음악을 사용했다.`,`CC 라이선스의 ND 기호는 변경 금지를 의미한다.`,`CC 라이선스는 저작자 표시 없이 사용할 수 있다.`,`저작권 위반 시 유일한 해결책은 채널을 삭제하는 것이다.`],
passage:`To avoid this, check all the components of your content and make sure they do not include copyrighted material. If they do, contact the owner for permission, or replace or remove the material. Another option is utilizing material with a Creative Commons (CC) license. CC licenses allow creators to share their work under specific conditions marked by the following symbols: BY (credit the creator), NC (non-commercial use only), ND (no changes allowed), and SA (share under the same license).`,
stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,
det:{korean:`"ND (no changes allowed)" → ND는 변경 금지를 의미한다.`,
analysis:`✅ ② ND = no changes allowed = 변경 금지: 원문과 일치\n❌ ① unknowingly → 의도적이 아님\n❌ ③ BY = credit the creator → 저작자 표시 필요\n❌ ④ contact/replace/remove 등 여러 방법 있음`,
tip:`CC 라이선스 기호: BY(저작자표시), NC(비영리), ND(변경금지), SA(동일조건공유)`}},

// Q15: 내용이해 불일치 · 어려움 · 6pts
{id:15,type:`내용이해`,diff:`어려움`,pts:6,fmt:"mc",ans:3,
ch:[`Min은 소셜 미디어에 사진 올리는 것을 좋아한다.`,`좋아요를 적게 받으면 수치심과 불안을 느낀다.`,`SNS에서 무의식적으로 다른 사람과 자신을 비교한다.`,`소셜 미디어에 올라온 게시물은 타인의 삶 전체를 보여준다.`],
passage:`Min is a high school student who loves posting photos on social media. Lately, he has become obsessed with the number of likes his posts receive. When his posts get few likes, he feels shame, rejection, and anxiety. Min is not alone. Many people, especially teenagers, unconsciously compare themselves to others on social media. This can make them feel inferior, harm their self-esteem, and even lead to depression. Third, keep in mind that what people post online shows only the highlights of their lives, not the full story.`,
stem:`다음 글의 내용과 <b>일치하지 않는</b> 것은?`,
det:{korean:`본문: "shows only the <b>highlights</b> of their lives, <b>not the full story</b>" → 하이라이트만 보여줄 뿐 전체를 보여주지 않는다. "삶 전체를 보여준다"는 반대.`,
analysis:`❌ ④ 삶 전체를 보여줌: 본문 "only the highlights, not the full story"와 반대\n✅ ① 사진 올리기 좋아함: 원문 일치\n✅ ② 수치심/불안: 원문 일치\n✅ ③ 무의식적 비교: 원문 일치`,
tip:`"only the highlights, not the full story" = 좋은 면만, 전체가 아님`}},

// Q16: 글의 흐름/주제 · 쉬움 · 4pts
{id:16,type:`내용이해`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,
ch:[`온라인 쇼핑의 장점과 단점`,`소셜 미디어 마케팅 전략`,`건강한 디지털 생활을 위한 조언`,`인공지능 알고리즘의 작동 원리`],
passage:`Tips and Tricks for a Healthier Digital Life: 저작권 위반, 필터 버블, SNS 행복에 대한 3가지 팁을 다루는 글이다.`,
stem:`이 글 전체의 주제로 가장 적절한 것은?`,
det:{korean:`저작권, 필터 버블, SNS 사용법 등 디지털 생활 개선 팁 → <b>건강한 디지털 생활을 위한 조언</b>`,
analysis:`✅ ③ 건강한 디지털 생활 조언: 제목과 내용 모두 일치\n❌ ① 온라인 쇼핑: 일부 예시일 뿐\n❌ ② 마케팅 전략: 언급 없음\n❌ ④ AI 원리: 알고리즘은 예시일 뿐`,
tip:`글의 주제: 제목 "Tips and Tricks for a Healthier Digital Life" = 핵심 요약`}},

// Q17: T/F · 쉬움 · 4pts
{id:17,type:`T/F`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,

h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:(d.q.wa||'');const open=!d.ok;
let chHtml='';if(d.q.fmt==='mc'&&d.q.ch){chHtml=`<div style="margin-top:8px">`;d.q.ch.forEach((c,ci)=>{const isAns=ci===d.q.ans;const isMy=d.ans===ci;const color=isAns?'var(--o)':(isMy&&!d.ok?'var(--r)':'var(--tm)');const bg=isAns?'var(--ol)':(isMy&&!d.ok?'var(--rl)':'transparent');const label=isAns?' ✅':(isMy&&!d.ok?' ❌':'');chHtml+=`<div style="padding:4px 8px;margin-bottom:2px;border-radius:6px;font-size:12px;color:${color};background:${bg}"><b>${mk[ci]}</b> ${c}${label}</div>`;});chHtml+=`</div>`;}
h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,8)}] ${d.q.diff} ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:10px"><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--ol);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:10px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--ol);color:var(--o)"><div style="font-size:10px;opacity:.7">정답</div>${ca}</div></div><div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📝 문제</div><div class="expl-box" style="font-size:12.5px;line-height:1.6;border-left:3px solid var(--b);margin-bottom:10px"><div style="font-weight:700;margin-bottom:6px">${d.q.stem}</div>${chHtml}</div>${d.q.passage?`<div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📖 원문</div><div class="expl-box" style="font-size:12px;line-height:1.75;border-left:3px solid #ddd;margin-bottom:10px">${d.q.passage}</div>`:''}${d.q.det?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean||''}</div><div class="expl-tag tip">📋 풀이 · 선지 분석</div><div class="expl-box" style="white-space:pre-line">${(d.q.det.analysis||'').replace(/\\n/g,'<br>')}</div><div class="expl-tag tip">💡 포인트</div><div class="expl-box tip-b">${d.q.det.tip||''}</div>`:''}</div></div>`;}); h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
