<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영어1 천재(조수경) 온라인워크북TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* NaesinFit — Purple Theme (워크북테스트) */
:root{
  --p:#7C3AED;--pd:#5B21B6;--pl:#A78BFA;--pxl:#F3F0FF;--pxxl:#FAF5FF;
  --bg:#F5F3FF;--text:#1A1A2E;--tm:#6B5B8A;--tl:#9A8DB8;
  --r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;
  --o:#F59E0B;--ol:#FFF8E1;
  --card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);
  --radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;
  --pborder:#d8d0e8;--pbg-muted:#e8e0f0;
  --passage-bg:linear-gradient(135deg,#FAFAFF,#F5F3FA);
  --start-grad:linear-gradient(160deg,#F3F0FF,#EDE7F6 40%,#E8E0F6);
  --accent2:#6D28D9;
  --p-rgba-08:rgba(124,58,237,.08);
  --p-rgba-10:rgba(124,58,237,.1);
  --p-rgba-12:rgba(124,58,237,.12);
  --p-rgba-25:rgba(124,58,237,.25);
  --p-rgba-30:rgba(124,58,237,.3);
}

/* NaesinFit Test Engine — Common CSS (theme-agnostic)
   Theme-specific colors come from :root variables defined in theme-*.css:
   --p      : primary color
   --pd     : primary dark
   --pl     : primary light
   --pxl    : primary extra-light
   --pxxl   : primary xx-light
   --bg     : page background
   --text   : main text
   --tm     : text muted
   --tl     : text light
   --pborder: border color (theme-tinted)
   --pbg-muted: muted bg for tracks/bars
   --start-grad: startScreen gradient
   --accent2: secondary gradient stop (badge/header)
   --p-rgba-08: rgba for selected bg
   --p-rgba-12: rgba for box-shadow
   --p-rgba-10: rgba for focus ring
   --p-rgba-25: rgba for button shadow
   --p-rgba-30: rgba for selectPulse
*/

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Start Screen */
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:var(--start-grad);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--p),var(--accent2));color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--p),var(--accent2));padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid var(--pborder);}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid var(--pborder);border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid var(--pborder);border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-rgba-10);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;box-shadow:0 6px 20px var(--p-rgba-30);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid var(--pborder);color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--p);color:var(--p);}
.history-badge{background:var(--pxl);color:var(--p);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid var(--pborder);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--p);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}

/* Exam Screen */
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--p);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--p);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--p);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--accent2));transition:width .5s ease;border-radius:0 2px 2px 0;}

/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--pxl),var(--pl));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--pd);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:10px 14px 14px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
.slide-choices{display:flex;flex-direction:column;gap:3px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12px;line-height:1.3;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--p);background:var(--p-rgba-08);box-shadow:0 0 0 3px var(--p-rgba-12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 var(--p-rgba-30)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:20px;height:20px;font-size:10px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--p-rgba-10);}
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;box-shadow:0 2px 8px var(--p-rgba-25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--p);}
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--p);background:var(--pxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}

/* Type tags — same across all themes */
.tag-combo{background:#E8F5E9;color:#166534;}.tag-wrong{background:#FFF0F0;color:#D63B3B;}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:#EDF2FF;color:#3B6FD9;}.tag-ant{background:#FFF8E1;color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}.tag-insert{background:#E3F2FD;color:#1565C0;}.tag-order{background:#FFF8E1;color:#F57F17;}

.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:var(--pbg-muted);padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--p);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:var(--passage-bg);border-left:3px solid var(--p);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--pborder);border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--p);}.choice-btn.selected{border-color:var(--p);box-shadow:0 0 0 2px var(--p-rgba-12);background:var(--pxxl);}
.c-num{min-width:22px;height:22px;background:var(--pbg-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid var(--pborder);border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--p);}

/* Result Screen */
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--pxl),var(--pl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:var(--pbg-muted);border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--pl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--pxxl);border-radius:var(--rs);border:1px solid var(--pborder);}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--pxl);}.info-cell.highlight .ic-value{color:var(--p);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:var(--pbg-muted);border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--pl);color:var(--p);}.tag-item.weak{background:#FFF0F0;color:#D63B3B;}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--pxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid var(--pborder);border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--p);color:var(--p);}.act-btn.primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid var(--pborder);border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--pxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--pxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--pl);color:var(--p);}.expl-tag.tip{background:var(--pxl);color:var(--pd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--p);}.expl-box.tip-b{border-left:3px solid var(--p);background:var(--pxl);}

@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">온라인워크북 TEST</div>
  <h1 class="start-title">온라인워크북 <span>TEST</span></h1>
  <p class="start-subtitle">영어1 · 천재(조수경) · 2과 · 20문항</p>
  <div class="info-card"><div class="info-card-header">시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">영어1</span></div>
    <div class="info-row"><span class="info-label">문항</span><span class="info-value">천재(조수경) (2과)</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">The Potential of Unconventional Thinking</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">20문항</div><div class="chip">20분</div><div class="chip">80점 이상 통과</div><div class="chip">100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="startExam()">시험 시작하기</button>
  <button class="btn btn-outline" onclick="toggleHistory()">시험 기록 보기 <span class="history-badge" id="hCount">0</span></button>
  <div id="historyPanel"></div>
</div>
</div>

<div id="examScreen" class="screen">
  <div class="exam-topbar"><div class="topbar-left"><div class="topbar-dot"></div><div class="topbar-info">영어1 · <span>천재(조수경)</span></div></div><div class="timer" id="timer">20:00</div><button class="btn-submit" onclick="submitExam()">제출하기</button></div>
  <div class="exam-progress"><div class="exam-progress-fill" id="progressFill"></div></div>
  <div class="ans-count" id="ansCount">0/20</div>

const FULL_PASSAGE="As we go through life, we may become stuck in a routine, missing out on extraordinary ideas or solutions. In such a situation, we can try considering things from a different angle. By doing so, we can expand our understanding of the world, challenge our assumptions, and find creative solutions to problems. Let's look at two stories that demonstrate the power of thinking differently.\n\nWho Makes the Pathways?\n\nWalter Gropius was a well-known architect, widely regarded as one of the pioneers of modernist architecture. However, even this expert architect was once troubled when designing an amusement park. He finished most of the main structures except for the pathways between the attractions. Gropius wanted to find the best design for the pathways but could not come up with anything that satisfied him.\n\nOne day, Gropius took a trip to France. The place he went to was famous for its vineyards. Farmers were selling grapes along the road near each vineyard. Then, one far ahead caught his eye because there was no one selling grapes but only a box by the side of the road. It turned out that the elderly couple who owned the vineyard were in poor health and could not pick the grapes themselves. Instead, they let people pick as many grapes as they wanted as long as they put five francs in the box. The couple not only prevented their grapes from becoming too ripe by permitting grape picking, but they also provided an enjoyable experience for their customers.\n\nAstonished by the elderly couple's idea of allowing customers to freely pick grapes, Gropius thought it would be good to extend this idea to the amusement park design and allow visitors to create their own paths. Upon returning to his project, he instructed the construction team to plant grass in areas where he wanted to create the pathways. When the grass started to grow, he opened the amusement park earlier than planned.\n\nIn places where people repeatedly walked, small footpaths started to form on the grass. The shapes of the paths were not unified, with some wide and some narrow, because they were formed naturally by visitors. The following year, Gropius used the grass pathways as an outline on which he built permanent pathways, resulting in the most convenient and efficient routes. This pathway design was later chosen as the best road design at the 1971 International Landscape Architecture Symposium in London.\n\nIt was contrary to common sense to allow people to walk on newly sprouted grass because it could damage the grass. Moreover, it was unprecedented for an architect to let people do the designing. Nonetheless, Gropius gained insight into creating ideal pathways by thinking outside the box.\n\nWhy Are There Mirrors in Elevators?\n\nHave you ever wondered why there are mirrors in elevators? The world's first successful passenger elevator was installed in a five-story building in New York in 1857. This prominent development brought excitement to the field of architecture by making it possible to build much taller buildings than ever before. Nevertheless, passengers were highly dissatisfied regardless of how practical it was.\n\nEmployees of the elevator company conducted a customer survey in order to find out why the passengers were so unhappy. The results of the questionnaire showed that it was the elevator's slow speed that was causing dissatisfaction. The trip from one floor to the next took nearly fifteen seconds. The employees also discovered that passengers thought the elevator was much slower than it actually was because passengers had nothing to do. During the slow ride, some passengers complained and said they felt trapped. Even though the employees identified speed as the main source of dissatisfaction, it was not something that could be improved immediately due to technological limitations.\n\nThen, one day, one employee of the elevator company began to look at the problem from a different perspective. She thought about it from a passenger's point of view. She thought that what mattered was not speed but discomfort and boredom. She asked herself what could be done in this case. After many days of searching for a solution, she proposed installing a mirror inside the elevator. She believed that it could make the elevator appear larger, reducing the feeling of being trapped. Also, she believed that people could relieve boredom by looking in the mirror.\n\nOn a survey done after the mirror was installed, passengers commented on how much faster the new elevator was, even though the speed was exactly the same. Passengers stopped paying attention to the speed of the elevator because they were looking in the mirror.\n\nIf the employee had thought only of ways to increase the speed of the elevator to resolve the problem, it might not have been possible to find a solution. However, by viewing the problem from a different perspective, the employee found the solution by speeding up the customers' perception of time.\n\nIn solving problems that are new to us, it is quite easy to get stuck in a particular point of view. However, even a simple shift in perspective can result in a creative solution. So, the next time you face a problem, try thinking about it from a different angle.\n\nWhen Not Selling Becomes the Best Sell\n\nHave you ever come across an advertisement that actually encourages customers not to buy a product? It does not seem to make sense, but there are instances where companies have successfully used this somewhat odd approach. For example, there was a fast-food company that was concerned about public criticism on negative health effects due to the high fat content of fast food. Instead of trying to dispute the public criticism and claim their food was healthy, the company tried something different. They discouraged customers from eating fast food, like hamburgers, too often. Unexpectedly, this approach had an interesting effect. The company gained a positive image as being socially responsible, attracting more customers. This approach was also successful in the world of fashion. There was a rising concern about buying clothes and throwing them away quickly. This type of fast fashion trend has a destructive impact on the environment because excessive production of clothes produces a massive amount of waste. Surprisingly, one fashion company started to persuade people not to buy their clothes. They argued that people should consume less and far more slowly. This unconventional marketing strategy not only raised awareness about the harmful effects of fast fashion on the environment, but also increased the company's sales. People thought that this brand really cared about the environment, and they started to buy more of this company's products. To sum up, both of these companies positioned themselves as responsible brands by discouraging consumption, which ultimately captured the attention and appreciation of a growing audience.";

{"id":4,"type":"어법","diff":"쉬움","pts":4,"fmt":"mc","passage":"As we go through life, we may become stuck in a routine, missing out on extraordinary ideas or solutions. In such a situation, we can try considering things from a different angle. By doing so, we can expand our understanding of the world, challenge our assumptions, and find creative solutions to problems. Let's look at two stories that demonstrate the power of thinking differently.\n\nWho Makes the Pathways?\n\nWalter Gropius was a well-known architect, widely regarded as one of the pioneers of modernist architecture. However, even this expert architect was once troubled when designing an amusement park. He finished most of the main structures except for the pathways between the attractions. Gropius wanted to find the best design for the pathways but could not come up with anything that satisfied him.\n\nOne day, Gropius took a trip to France. The place he went to was famous for its vineyards. Farmers were selling grapes along the road near each vineyard. Then, one far ahead caught his eye because there was no one selling grapes but only a box by the side of the road. It turned out that the elderly couple who owned the vineyard were in poor health and could not pick the grapes themselves. Instead, they let people pick as many grapes as they wanted as long as they put five francs in the box. The couple not only prevented their grapes from becoming too ripe by permitting grape picking, but they also provided an enjoyable experience for their customers.\n\nAstonished by the elderly couple's idea of allowing customers to freely pick grapes, Gropius thought it would be good to extend this idea to the amusement park design and allow visitors to create their own paths. Upon returning to his project, he instructed the construction team to plant grass in areas where he wanted to create the pathways. When the grass started to grow, he opened the amusement park earlier than planned.\n\nIn places where people repeatedly walked, small footpaths started to form on the grass. The shapes of the paths were not unified, with some wide and some narrow, because they were formed naturally by visitors. The following year, Gropius used the grass pathways as an outline on which he built permanent pathways, resulting in the most convenient and efficient routes. This pathway design was later chosen as the best road design at the 1971 International Landscape Architecture Symposium in London.\n\nIt was contrary to common sense to allow people to walk on newly sprouted grass because it could damage the grass. Moreover, it was unprecedented for an architect to let people do the designing. Nonetheless, Gropius gained insight into creating ideal pathways by thinking outside the box.\n\nWhy Are There Mirrors in Elevators?\n\nHave you ever wondered why there are mirrors in elevators? The world's first successful passenger elevator was installed in a five-story building in New York in 1857. This prominent development brought excitement to the field of architecture by making it possible to build much taller buildings than ever before. Nevertheless, passengers were highly dissatisfied regardless of how practical it was.\n\nEmployees of the elevator company conducted a customer survey in order to find out why the passengers were so unhappy. The results of the questionnaire showed that it was the elevator's slow speed that was causing dissatisfaction. The trip from one floor to the next took nearly fifteen seconds. The employees also discovered that passengers thought the elevator was much slower than it actually was because passengers had nothing to do. During the slow ride, some passengers complained and said they felt trapped. Even though the employees identified speed as the main source of dissatisfaction, it was not something that could be improved immediately due to technological limitations.\n\nThen, one day, one employee of the elevator company began to look at the problem from a different perspective. She thought about it from a passenger's point of view. She thought that what mattered was not speed but discomfort and boredom. She asked herself what could be done in this case. After many days of searching for a solution, she proposed installing a mirror inside the elevator. She believed that it could make the elevator appear larger, reducing the feeling of being trapped. Also, she believed that people could relieve boredom by looking in the mirror.\n\nOn a survey done after the mirror was installed, passengers commented on how much faster the new elevator was, even though the speed was exactly the same. Passengers stopped paying attention to the speed of the elevator because they were looking in the mirror.\n\nIf the employee had thought only of ways to increase the speed of the elevator to resolve the problem, it might not have been possible to find a solution. However, by viewing the problem from a different perspective, the employee found the solution by speeding up the customers' perception of time.\n\nIn solving problems that are new to us, it is quite easy to get stuck in a particular point of view. However, even a simple shift in perspective can result in a creative solution. So, the next time you face a problem, try thinking about it from a different angle.\n\nWhen Not Selling Becomes the Best Sell\n\nHave you ever come across an advertisement that actually encourages customers not to buy a product? It does not seem to make sense, but there are instances where companies have successfully used this somewhat odd approach. For example, there was a fast-food company that was concerned about public criticism on negative health effects due to the high fat content of fast food. Instead of trying to dispute the public criticism and claim their food was healthy, the company tried something different. They discouraged customers from eating fast food, like hamburgers, too often. Unexpectedly, this approach had an interesting effect. The company gained a positive image as being socially responsible, attracting more customers. This approach was also successful in the world of fashion. There was a rising concern about buying clothes and throwing them away quickly. This type of fast fashion trend has a destructive impact on the environment because excessive production of clothes produces a massive amount of waste. Surprisingly, one fashion company started to persuade people not to buy their clothes. They argued that people should consume less and far more slowly. This unconventional marketing strategy not only raised awareness about the harmful effects of fast fashion on the environment, but also increased the company's sales. People thought that this brand really cared about the environment, and they started to buy more of this company's products. To sum up, both of these companies positioned themselves as responsible brands by discouraging consumption, which ultimately captured the attention and appreciation of a growing audience.","stem":"다음 문장에서 빈칸에 알맞은 것을 고르시오.<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">The couple <b>[&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;]</b> prevented their grapes from becoming too ripe by permitting grape picking, <b>[&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;]</b> they also provided an enjoyable experience for their customers.</div>","det":{"ref":"The couple not only prevented their grapes from becoming too ripe by permitting grape picking, but they also provided an enjoyable experience for their customers.","correct":"not only ... but (also) — 상관접속사. '~뿐만 아니라 ...도'라는 의미로, 두 가지를 병렬로 나열하는 구문.","wrongs":["both ... and는 주어가 복수 취급되어 문맥상 어색","either ... or는 '둘 중 하나'의 의미로 문맥과 맞지 않음","neither ... nor는 부정의 의미로 원문과 반대","whether ... or는 '~인지 아닌지'로 접속사 구조가 다름"],"tip":"💡 'not only A but (also) B'는 'A뿐만 아니라 B도'라는 의미입니다. ⚠️ not only 뒤에 도치가 올 수도 있지만, 이 문장에서는 일반 어순입니다."},"ans":1,"ch":["① both ... and","② not only ... but","③ either ... or","④ neither ... nor"]},

{"id":8,"type":"어법","diff":"보통","pts":5,"fmt":"mc","passage":"As we go through life, we may become stuck in a routine, missing out on extraordinary ideas or solutions. In such a situation, we can try considering things from a different angle. By doing so, we can expand our understanding of the world, challenge our assumptions, and find creative solutions to problems. Let's look at two stories that demonstrate the power of thinking differently.\n\nWho Makes the Pathways?\n\nWalter Gropius was a well-known architect, widely regarded as one of the pioneers of modernist architecture. However, even this expert architect was once troubled when designing an amusement park. He finished most of the main structures except for the pathways between the attractions. Gropius wanted to find the best design for the pathways but could not come up with anything that satisfied him.\n\nOne day, Gropius took a trip to France. The place he went to was famous for its vineyards. Farmers were selling grapes along the road near each vineyard. Then, one far ahead caught his eye because there was no one selling grapes but only a box by the side of the road. It turned out that the elderly couple who owned the vineyard were in poor health and could not pick the grapes themselves. Instead, they let people pick as many grapes as they wanted as long as they put five francs in the box. The couple not only prevented their grapes from becoming too ripe by permitting grape picking, but they also provided an enjoyable experience for their customers.\n\nAstonished by the elderly couple's idea of allowing customers to freely pick grapes, Gropius thought it would be good to extend this idea to the amusement park design and allow visitors to create their own paths. Upon returning to his project, he instructed the construction team to plant grass in areas where he wanted to create the pathways. When the grass started to grow, he opened the amusement park earlier than planned.\n\nIn places where people repeat ective. She thought about it from a passenger's point of view. She thought that what mattered was not speed but discomfort and boredom. She asked herself what could be done in this case. After many days of searching for a solution, she proposed installing a mirror inside the elevator. She believed that it could make the elevator appear larger, reducing the feeling of being trapped. Also, she believed that people could relieve boredom by looking in the mirror.\n\nOn a survey done after the mirror was installed, passengers commented on how much faster the new elevator was, even though the speed was exactly the same. Passengers stopped paying attention to the speed of the elevator because they were looking in the mirror.\n\nIf the employee had thought only of ways to increase the speed of the elevator to resolve the problem, it might not have been possible to find a solution. However, by viewing the problem from a different perspective, the employee found the solution by speeding up the customers' perception of time.\n\nIn solving problems that are new to us, it is quite easy to get stuck in a particular point of view. However, even a simple shift in perspective can result in a creative solution. So, the next time you face a problem, try thinking about it from a different angle.\n\nWhen Not Selling Becomes the Best Sell\n\nHave you ever come across an advertisement that actually encourages customers not to buy a product? It does not seem to make sense, but there are instances where companies have successfully used this somewhat odd approach. For example, there was a fast-food company that was concerned about public criticism on negative health effects due to the high fat content of fast food. Instead of trying to dispute the public criticism and claim their food was healthy, the company tried something different. They discouraged customers from eating fast food, like hamburgers, too often. Unexpectedly, this approach had an interesting effect. The company gained a posi {"id":11,"type":"어휘","diff":"보통","pts":5,"fmt":"mc","passage":"As we go through life, we may become stuck in a routine, missing out on extraordinary ideas or solutions. In such a situation, we can try considering things from a different angle. By doing so, we can expand our understanding of the world, challenge our assumptions, and find creative solutions to problems. Let's look at two stories that demonstrate the power of thinking differently.\n\nWho Makes the Pathways?\n\nWalter Gropius was a well-known architect, widely regarded as one of the pioneers of modernist architecture. However, even this expert architect was once troubled when designing an amusement park. He finished most of the main structures except for the pathways between the attractions. Gropius wanted to find the best design for the pathways but could not come up with anything that satisfied him.\n\nOne day, Gropius took a trip to France. The place he went to was famous for its vineyards. Farmers were selling grapes along the road near each vineyard. Then, one far ahead caught his eye because there was no one selling grapes but only a box by the side of the road. It turned out that the elderly couple who owned the vineyard were in poor health and could not pick the grapes themselves. Instead, they let people pick as many grapes as they wanted as long as they put five francs in the box. The couple not only prevented their grapes from becoming too ripe by permitting grape picking, but they also provided an enjoyable experience for their customers.\n\nAstonished by the elderly couple's idea of allowing customers to freely pick grapes, Gropius thought it would be good to extend this idea to the amusement park design and allow visitors to create their own paths. Upon returning to his project, he instructed the construction team to plant grass in areas where he wanted to create the pathways. When the grass started to grow, he opened the amusement park earlier than planned.\n\nIn places where people repeatedly walked, small footpaths started to form on the grass. The shapes of the paths were not unified, with some wide and some narrow, because they were formed naturally by visitors. The following year, Gropius used the grass pathways as an outline on which he built permanent pathways, resulting in the most convenient and efficient routes. This pathway design was later chosen as the best road design at the 1971 International Landscape Architecture Symposium in London.\n\nIt was contrary to common sense to allow people to walk on newly sprouted grass because it could damage the grass. Moreover, it was unprecedented for an architect to let people do the designing. Nonetheless, Gropius gained insight into creating ideal pathways by thinking outside the box.\n\nWhy Are There Mirrors in Elevators?\n\nHave you ever wondered why there are mirrors in elevators? The world's first successful passenger elevator was installed in a five-story building in New York in 1857. This prominent development brought excitement to the field of architecture by making it possible to build much taller buildings than ever before. Nevertheless, passengers were highly dissatisfied regardless of how practical it was.\n\nEmployees of the elevator company conducted a customer survey in order to find out why the passengers were so unhappy. The results of the questionnaire showed that it was the elevator's slow speed that was causing dissatisfaction. The trip from one floor to the next took nearly fifteen seconds. The employees also discovered that passengers thought the elevator was much slower than it actually was because passengers had nothing to do. During the slow ride, some passengers complained and said they felt trapped. Even though the employees identified speed as the main source of dissatisfaction, it was not something that could be improved immediately due to technological limitations.\n\nThen, one day, one employee of the elevator company began to look at the problem from a different perspective. She thought about it from a passenger's point of view. She thought that what mattered was not speed but discomfort and boredom. She asked herself what could be done in this case. After many days of searching for a solution, she proposed installing a mirror inside the elevator. She believed that it could make the elevator appear larger, reducing the feeling of being trapped. Also, she believed that people could relieve boredom by looking in the mirror.\n\nOn a survey done after the mirror was installed, passengers commented on how much faster the new elevator was, even though the speed was exactly the same. Passengers stopped paying attention to the speed of the elevator because they were looking in the mirror.\n\nIf the employee had thought only of ways to increase the speed of the elevator to resolve the problem, it might not have been possible to find a solution. However, by viewing the problem from a different perspective, the employee found the solution by speeding up the customers' perception of time.\n\nIn solving problems that are new to us, it is quite easy to get stuck in a particular point of view. However, even a simple shift in perspective can result in a creative solution. So, the next time you face a problem, try thinking about it from a different angle.\n\nWhen Not Selling Becomes the Best Sell\n\nHave you ever come across an advertisement that actually encourages customers not to buy a product? It does not seem to make sense, but there are instances where companies have successfully used this somewhat odd approach. For example, there was a fast-food company that was concerned about public criticism on negative health effects due to the high fat content of fast food. Instead of trying to dispute the public criticism and claim their food was healthy, the company tried something different. They discouraged customers from eating fast food, like hamburgers, too often. Unexpectedly, this approach had an interesting effect. The company gained a positive image as being socially responsible, attracting more customers. This approach was also successful in the world of fashion. There was a rising concern about buying clothes and throwing them away quickly. This type of fast fashion trend has a destructive impact on the environment because excessive production of clothes produces a massive amount of waste. Surprisingly, one fashion company started to persuade people not to buy their clothes. They argued that people should consume less and far more slowly. This unconventional marketing strategy not only raised awareness about the harmful effects of fast fashion on the environment, but also increased the company's sales. People thought that this brand really cared about the environment, and they started to buy more of this company's products. To sum up, both of these companies positioned themselves as responsible brands by discouraging consumption, which ultimately captured the attention and appreciation of a growing audience.","stem":"다음 글에서 밑줄 친 (A), (B)에 들어갈 어휘로 가장 적절한 것은?<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">Instead of trying to (A)<u>[&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;]</u> the public criticism and claim their food was healthy, the company tried something different. They (B)<u>[&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;]</u> customers from eating fast food, like hamburgers, too often.</div>","det":{"ref":"Instead of trying to dispute the public criticism and claim their food was healthy, the company tried something different. They discouraged customers from eating fast food, like hamburgers, too often.","correct":"(A) dispute (반박하다) — (B) discouraged (만류하다). 대중의 비판에 반박하는 대신, 고객들에게 패스트푸드를 자주 먹지 말라고 만류했다는 문맥.","wrongs":["(A) accept-(B) encouraged는 비판을 수용+격려하는 것으로 원문과 반대","(A) dispute-(B) encouraged는 (B)가 원문과 반대","(A) support-(B) discouraged는 (A)가 비판을 지지하는 것으로 문맥과 맞지 않음","(A) accept-(B) discouraged는 (A)가 비판을 수용하는 것으로 문맥과 맞지 않음"],"tip" {"id":15,"type":"오류찾기","diff":"어려움","pts":6,"fmt":"mc","passage":"As we go through life, we may become stuck in a routine, missing out on extraordinary ideas or solutions. In such a situation, we can try considering things from a different angle. By doing so, we can expand our understanding of the world, challenge our assumptions, and find creative solutions to problems. Let's look at two stories that demonstrate the power of thinking differently.\n\nWho Makes the Pathways?\n\nWalter Gropius was a well-known architect, widely regarded as one of the pioneers of modernist architecture. However, even this expert architect was once troubled when designing an amusement park. He finished most of the main structures except for the pathways between the attractions. Gropius wanted to find the best design for the pathways but could not come up with anything that satisfied him.\n\nOne day, Gropius took a trip to France. The place he went to was famous for its vineyards. Farmers were selling grapes along the road near each vineyard. Then, one far ahead caught his eye because there was no one selling grapes but only a box by the side of the road. It turned out that the elderly couple who owned the vineyard were in poor health and could not pick the grapes themselves. Instead, they let people pick as many grapes as they wanted as long as they put five francs in the box. The couple not only prevented their grapes from becoming too ripe by permitting grape picking, but they also provided an enjoyable experience for their customers.\n\nAstonished by the elderly couple's idea of allowing customers to freely pick grapes, Gropius thought it would be good to extend this idea to the amusement park design and allow visitors to create their own paths. Upon returning to his project, he instructed the construction team to plant grass in areas where he wanted to create the pathways. When the grass started to grow, he opened the amusement park earlier than planned.\n\nIn places where people repeatedly walked, small footpaths started to form on the grass. The shapes of the paths were not unified, with some wide and some narrow, because they were formed naturally by visitors. The following year, Gropius used the grass pathways as an outline on which he built permanent pathways, resulting in the most convenient and efficient routes. This pathway design was later chosen as the best road design at the 1971 International Landscape Architecture Symposium in London.\n\nIt was contrary to common sense to allow people to walk on newly sprouted grass because it could damage the grass. Moreover, it was unprecedented for an architect to let people do the designing. Nonetheless, Gropius gained insight into creating ideal pathways by thinking outside the box.\n\nWhy Are There Mirrors in Elevators?\n\nHave you ever wondered why there are mirrors in elevators? The world's first successful passenger elevator was installed in a five-story building in New York in 1857. This prominent development brought excitement to the field of architecture by making it possible to build much taller buildings than ever before. Nevertheless, passengers were highly dissatisfied regardless of how practical it was.\n\nEmployees of the elevator company conducted a customer survey in order to find out why the passengers were so unhappy. The results of the questionnaire showed that it was the elevator's slow speed that was causing dissatisfaction. The trip from one floor to the next took nearly fifteen seconds. The employees also discovered that passengers thought the elevator was much slower than it actually was because passengers had nothing to do. During the slow ride, some passengers complained and said they felt trapped. Even though the employees identified speed as the main source of dissatisfaction, it was not something that could be improved immediately due to technological limitations.\n\nThen, one day, one employee of the elevator company began to look at the problem from a different perspective. She thought about it from a passenger's point of view. She thought that what mattered was not speed but discomfort and boredom. She asked herself what could be done in this case. After many days of searching for a solution, she proposed installing a mirror inside the elevator. She believed that it could make the elevator appear larger, reducing the feeling of being trapped. Also, she believed that people could relieve boredom by looking in the mirror.\n\nOn a survey done after the mirror was installed, passengers commented on how much faster the new elevator was, even though the speed was exactly the same. Passengers stopped paying attention to the speed of the elevator because they were looking in the mirror.\n\nIf the employee had thought only of ways to increase the speed of the elevator to resolve the problem, it might not have been possible to find a solution. However, by viewing the problem from a different perspective, the employee found the solution by speeding up the customers' perception of time.\n\nIn solving problems that are new to us, it is quite easy to get stuck in a particular point of view. However, even a simple shift in perspective can result in a creative solution. So, the next time you face a problem, try thinking about it from a different angle.\n\nWhen Not Selling Becomes the Best Sell\n\nHave you ever come across an advertisement that actually encourages customers not to buy a product? It does not seem to make sense, but there are instances where companies have successfully used this somewhat odd approach. For example, there was a fast-food company that was concerned about public criticism on negative health effects due to the high fat content of fast food. Instead of trying to dispute the public criticism and claim their food was healthy, the company tried something different. They discouraged customers from eating fast food, like hamburgers, too often. Unexpectedly, this approach had an interesting effect. The company gained a positive image as being socially responsible, attracting more customers. This approach was also successful in the world of fashion. There was a rising concern about buying clothes and throwing them away quickly. This type of fast fashion trend has a destructive impact on the environment because excessive production of clothes produces a massive amount of waste. Surprisingly, one fashion company started to persuade people not to buy their clothes. They argued that people should consume less and far more slowly. This unconventional marketing strategy not only raised awareness about the harmful effects of fast fashion on the environment, but also increased the company's sales. People thought that this brand really cared about the environment, and they started to buy more of this company's products. To sum up, both of these companies positioned themselves as responsible brands by discouraging consumption, which ultimately captured the attention and appreciation of a growing audience.","stem":"다음 글에서 밑줄 친 부분 중 어법상 틀린 것을 고르시오.<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\"><u>① Astonished</u> by the elderly couple's idea of allowing customers to freely pick grapes, Gropius thought it would be good to extend this idea to the amusement park design and allow visitors <u>② creating</u> their own paths. Upon <u>③ returning</u> to his project, he instructed the construction team <u>④ to plant</u> grass in areas <u>⑤ where</u> he wanted to create the pathways.</div>","det":{"ref":"...and allow visitors to create their own paths.","correct":"② creating → to create. 'allow + 목적어 + to부정사' 구문이다. allow는 목적격 보어로 to부정사를 취하므로 to create가 올바르다.","wrongs":["① Astonished는 분사구문으로 Gropius가 '놀란' 상태이므로 과거분사가 적절","③ returning은 'Upon + ~ing' 구문으로 올바름","④ to plant는 'instruct + 목적어 + to부정사' 구문으로 올바름","⑤ where는 areas를 선행사로 하는 관계부사로 올바름"],"tip":"💡 allow + O + to V (5형식). ⚠️ let + O + V(원형)과 혼동하지 마세요. allow/permit/enable은 to부정사, let/make/have는 원형부정사를 씁니다."},"ans":1,"ch":["① Astonished","② creating","③ returning","④ to plant"]},

ositive image as being socially responsible, attracting more customers. This approach was also successful in the world of fashion. There was a rising concern about buying clothes and throwing them away quickly. This type of fast fashion trend has a destructive impact on the environment because excessive production of clothes produces a massive amount of waste. Surprisingly, one fashion company started to persuade people not to buy their clothes. They argued that people should consume less and far more slowly. This unconventional marketing strategy not only raised awareness about the harmful effects of fast fashion on the environment, but also increased the company's sales. People thought that this brand really cared about the environment, and they started to buy more of this company's products. To sum up, both of these companies positioned themselves as responsible brands by discouraging consumption, which ultimately captured the attention and appreciation of a growing audience.","stem":"엘리베이터 거울에 대한 설명으로 본문의 내용과 <b>일치하는 것</b>은?","det":{"ref":"On a survey done after the mirror was installed, passengers commented on how much faster the new elevator was, even though the speed was exactly the same.","correct":"④ 거울 설치 후 승객들은 엘리베이터가 더 빨라졌다고 느꼈지만, 실제 속도는 동일했다 — 원문과 정확히 일치.","wrongs":["① 엘리베이터의 속도를 기술적으로 개선하여 문제를 해결했다 — 원문에서 기술적 한계로 불가능하다고 명시","② 거울 설치는 회사 경영진이 제안했다 — 원문에서 한 직원(employee)이 제안","③ 승객 불만의 원인은 엘리베이터의 좁은 공간이었다 — 불만 원인은 느린 속도(slow speed)","⑤ 거울 설치 후에도 승객 만족도는 변하지 않았다 — 승객들이 더 빨라졌다고 느꼈으므로 만족도 개선"],"tip":"💡 핵심: 실제 속도는 그대로인데 거울이 '체감 시간'을 바꿨다. ⚠️ 불만의 원인은 '좁은 공간'이 아니라 '느린 속도'입니다."},"ans":3,"ch":["① 엘리베이터의 속도를 기술적으로 개선하여 문제를 해결했다.","② 거울 설치는 회사 경영진이 제안했다.","③ 승객 불만의 주요 원인은 엘리베이터의 좁은 공간이었다.","④ 거울 설치 후 승객들은 더 빨라졌다고 느꼈지만 실제 속도는 동일했다."]},
{"id":18,"type":"T/F","diff":"어려움","pts":6,"fmt":"mc","passage":"As we go through life, we may become stuck in a routine, missing out on extraordinary ideas or solutions. In such a situation, we can try considering things from a different angle. By doing so, we can expand our understanding of the world, challenge our assumptions, and find creative solutions to problems. Let's look at two stories that demonstrate the power of thinking differently.\n\nWho Makes the Pathways?\n\nWalter Gropius was a well-known architect, widely regarded as one of the pioneers of modernist architecture. However, even this expert architect was once troubled when designing an amusement park. He finished most of the main structures except for the pathways between the attractions. Gropius wanted to find the best design for the pathways but could not come up with anything that satisfied him.\n\nOne day, Gropius took a trip to France. The place he went to was famous for its vineyards. Farmers were selling grapes along the road near each vineyard. Then, one far ahead caught his eye because there was no one selling grapes but only a box by the side of the road. It turned out that the elderly couple who owned the vineyard were in poor health and could not pick the grapes themselves. Instead, they let people pick as many grapes as they wanted as long as they put five francs in the box. The couple not only prevented their grapes from becoming too ripe by permitting grape picking, but they also provided an enjoyable experience for their customers.\n\nAstonished by the elderly couple's idea of allowing customers to freely pick grapes, Gropius thought it would be good to extend this idea to the amusement park design and allow visitors to create their own paths. Upon returning to his project, he instructed the construction team to plant grass in areas where he wanted to create the pathways. When the grass started to grow, he opened the amusement park earlier than planned.\n\nIn places where people repeatedly walked, small footpaths started to form on the grass. The shapes of the paths were not unified, with some wide and some narrow, because they were formed naturally by visitors. The following year, Gropius used the grass pathways as an outline on which he built permanent pathways, resulting in the most convenient and efficient routes. This pathway design was later chosen as the best road design at the 1971 International Landscape Architecture Symposium in London.\n\nIt was contrary to common sense to allow people to walk on newly sprouted grass because it could damage the grass. Moreover, it was unprecedented for an architect to let people do the designing. Nonetheless, Gropius gained insight into creating ideal pathways by thinking outside the box.\n\nWhy Are There Mirrors in Elevators?\n\nHave you ever wondered why there are mirrors in elevators? The world's first successful passenger elevator was installed in a five-story building in New York in 1857. This prominent development brought excitement to the field of architecture by making it possible to build much taller buildings than ever before. Nevertheless, passengers were highly dissatisfied regardless of how practical it was.\n\nEmployees of the elevator company conducted a customer survey in order to find out why the passengers were so unhappy. The results of the questionnaire showed that it was the elevator's slow speed that was causing dissatisfaction. The trip from one floor to the next took nearly fifteen seconds. The employees also discovered that passengers thought the elevator was much slower than it actually was because passengers had nothing to do. During the slow ride, some passengers complained and said they felt trapped. Even though the employees identified speed as the main source of dissatisfaction, it was not something that could be improved immediately due to technological limitations.\n\nThen, one day, one employee of the elevator company began to look at the problem from a different perspective. She thought about it from a passenger's point of view. She thought that what mattered was not speed but discomfort and boredom. She asked herself what could be done in this case. After many days of searching for a solution, she proposed installing a mirror inside the elevator. She believed that it could make the elevator appear larger, reducing the feeling of being trapped. Also, she believed that people could relieve boredom by looking in the mirror.\n\nOn a survey done after the mirror was installed, passengers commented on how much faster the new elevator was, even though the speed was exactly the same. Passengers stopped paying attention to the speed of the elevator because they were looking in the mirror.\n\nIf the employee had thought only of ways to increase the speed of the elevator to resolve the problem, it might not have been possible to find a solution. However, by viewing the problem from a different perspective, the employee found the solution by speeding up the customers' perception of time.\n\nIn solving problems that are new to us, it is quite easy to get stuck in a particular point of view. However, even a simple shift in perspective can result in a creative solution. So, the next time you face a problem, try thinking about it from a different angle.\n\nWhen Not Selling Becomes the Best Sell\n\nHave you ever come across an advertisement that actually encourages customers not to buy a product? It does not seem to make sense, but there are instances where companies have successfully used this somewhat odd approach. For example, there was a fast-food company that was concerned about public criticism on negative health effects due to the high fat content of fast food. Instead of trying to dispute the public criticism and claim their food was healthy, the company tried something different. They discouraged customers from eating fast food, like hamburgers, too often. Unexpectedly, this approach had an interesting effect. The company gained a positive image as being socially responsible, attracting more customers. This approach was also successful in the world of fashion. There was a rising concern about buying clothes and throwing them away quickly. This type of fast fashion trend has a destructive impact on the environment because excessive production of clothes produces a massive amount of waste. Surprisingly, one fashion company started to persuade people not to buy their clothes. They argued that people should consume less and far more slowly. This unconventional marketing strategy not only raised awareness about the harmful effects of fast fashion on the environment, but also increased the company's sales. People thought that this brand really cared about the environment, and they started to buy more of this company's products. To sum up, both of these companies positioned themselves as responsible brands by discouraging consumption, which ultimately captured the attention and appreciation of a growing audience.","stem":"'When Not Selling Becomes the Best Sell' 부분에 대한 다음 진술 중 본문의 내용과 <b>일치하지 않는 것</b>은?","det":{"ref":"This unconventional marketing strategy not only raised awareness about the harmful effects of fast fashion on the environment, but also increased the company's sales.","correct":"④가 일치하지 않음 — 원문에 따르면 비전통적 마케팅 전략이 환경에 대한 인식을 높이고 매출도 증가시켰다. 매출이 감소했다는 것은 원문과 반대.","wrongs":["① 패스트푸드 회사는 높은 지방 함량에 대한 대중 비판을 걱정했다 — 원문과 일치","② 패스트푸드 회사는 고객에게 패스트푸드를 자주 먹지 말라고 권유했다 — 원문과 일치","③ 패션 회사는 사람들에게 옷을 사지 말라고 설득했다 — 원문과 일치","⑤ 두 회사 모두 소비를 억제함으로써 책임감 있는 브랜드로 자리잡았다 — 원문과 일치"],"tip":"💡 역발상 마케팅: '사지 마세요'가 오히려 매출 증가로 이어졌다. ⚠️ 매출 '감소'가 아니라 '증가'입니다."},"ans":3,"ch":["① 패스트푸드 회사는 높은 지방 함량에 대한 대중의 비판을 우려했다.","② 패스트푸드 회사는 고객에게 패스트푸드를 자주 먹지 말라고 권유했다.","③ 한 패션 회사는 사람들에게 자사 옷을 사지 말라고 설득했다.","④ 비전통적 마케팅 전략은 환경 인식을 높였지만 매출은 감소시켰다."]},

ositive image as being socially responsible, attracting more customers. This approach was also successful in the world of fashion. There was a rising concern about buying clothes and throwing them away quickly. This type of fast fashion trend has a destructive impact on the environment because excessive production of clothes produces a massive amount of waste. Surprisingly, one fashion company started to persuade people not to buy their clothes. They argued that people should consume less and far more slowly. This unconventional marketing strategy not only raised awareness about the harmful effects of fast fashion on the environment, but also increased the company's sales. People thought that this brand really cared about the environment, and they started to buy more of this company's products. To sum up, both of these companies positioned themselves as responsible brands by discouraging consumption, which ultimately captured the attention and appreciation of a growing audience.","stem":"이 글의 세 가지 사례(산책로, 거울, 역발상 마케팅)에 공통으로 적용되는 주제로 가장 적절한 것은?","det":{"ref":"In such a situation, we can try considering things from a different angle. / However, even a simple shift in perspective can result in a creative solution.","correct":"④ 관점의 전환이 창의적 해결책을 이끌어낸다 — 세 사례 모두 기존 방식이 아닌 새로운 관점에서 접근하여 문제를 해결한 이야기.","wrongs":["① 전문가의 의견을 따르는 것이 최선이다 — Gropius 사례에서 전문가 본인이 기존 방식을 포기했으므로 반대","② 기술 발전만이 문제를 해결할 수 있다 — 엘리베이터 사례에서 기술적 해결이 불가능했음을 보여줌","③ 전통적 방법이 항상 효과적이다 — 세 사례 모두 비전통적 방법의 효과를 보여줌","⑤ 경쟁에서 이기려면 공격적 마케팅이 필요하다 — 역발상 마케팅 사례에서 소비를 억제하는 것이 효과적이었음"],"tip":"💡 글 전체 주제: 틀에 박힌 사고에서 벗어나 다른 각도에서 생각하면 창의적 해결책을 찾을 수 있다. ⚠️ 세 사례(Gropius의 산책로, 엘리베이터 거울, 역발상 마케팅)의 공통점을 찾으세요."},"ans":3,"ch":["① 전문가의 의견을 따르는 것이 최선의 방법이다.","② 기술 발전만이 문제를 근본적으로 해결할 수 있다.","③ 전통적 방법이 항상 가장 효과적이다.","④ 관점의 전환이 창의적 해결책을 이끌어낸다."]}];

function saveToHistory(r, elapsed) {
  const h = getHistory();
  h.unshift({
    name: document.getElementById('inpName').value.trim(),

    grade: document.getElementById('inpGrade').value,

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function startExam() {
  var nm = document.getElementById('inpName').value.trim();
  if (!nm) { toast('\uc774\ub984\uc744 \uc785\ub825\ud574\uc8fc\uc138\uc694!'); return; }

  /* Section filtering (if sec picker exists) */
  var secPicker = document.getElementById('secPicker');
  var filtered;
  if (secPicker) {
    var secs = getSelectedSections();
    if (secs.length === 0) { toast('\uc2dc\ud5d8 \ubc94\uc704\ub97c \ucd5c\uc18c 1\uac1c \uc120\ud0dd\ud574\uc8fc\uc138\uc694!'); return; }
    filtered = Q.map(function (q, i) { return { q: q, i: i }; }).filter(function (f) { return secs.includes(f.q.sec); });
    S = { ans: Array(filtered.length).fill(null), cur: 0, ti: null, left: EI.time, start: Date.now(), order: shuffle([].concat(Array(filtered.length).keys ? Array.from({ length: filtered.length }, function (_, i) { return i; }) : [])), filtered: filtered.map(function (f) { return f.i; }), secs: secs };
    EI._origTotalQ = EI.totalQ; EI._origTotal = EI.total;
    EI.totalQ = filtered.length;
    EI.total = filtered.reduce(function (s, f) { return s + Q[f.i].pts; }, 0);

    S = { ans: Array(Q.length).fill(null), cur: 0, ti: null, left: EI.time, start: Date.now(), order: shuffle(Array.from({ length: Q.length }, function (_, i) { return i; })), filtered: null, secs: null };
  }

  showScreen('examScreen');
  showQ(0);
  startTimer();
  updateProgress();
  initSwipe();
}

function showQ(idx, direction) {
  S.cur = idx;
  var oi = S.order ? S.order[idx] : idx;
  var qi = S.filtered ? S.filtered[oi] : oi;
  var q = Q[qi];
  var tc = typeTag[q.type] || '';
  var mk = '\u2460\u2461\u2462\u2463\u2464';
  var pp = document.getElementById('slidePassage');
  if (direction) {
    pp.classList.add(direction > 0 ? 'fade-out' : 'fade-in');
    setTimeout(function () {
      renderContent(idx, qi, q, tc, mk, pp);
      pp.classList.remove('fade-out', 'fade-in');
    }, 150);
  } else {
    renderContent(idx, qi, q, tc, mk, pp);
  }
}

function renderContent(idx, qi, q, tc, mk, pp) {
  var ph = '<div class="q-badge"><div class="q-num">' + (idx + 1) + '</div><span>' + q.type + '</span><span style="opacity:.6">' + q.diff + ' \u00b7 ' + q.pts + '\uc810</span></div>';
  if (q.passage) ph += '<div class="q-passage">' + q.passage + '</div>';
  else ph += '<div style="padding:30px;text-align:center;color:var(--tl)">\uc774 \ubb38\ud56d\uc740 \uc9c0\ubb38\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.</div>';
  pp.innerHTML = ph;
  pp.scrollTop = 0;
  var bt = document.getElementById('slideBottom');
  var bh = '<div class="slide-stem">' + q.stem + '</div><div class="slide-choices">';
  if (q.fmt === 'mc') {
    q.ch.forEach(function (c, ci) {
      var sel = S.ans[qi] === ci ? ' selected' : '';
      bh += '<button class="choice-btn' + sel + '" onclick="selectAns(' + idx + ',' + ci + ')"><span class="c-num">' + mk[ci] + '</span><span>' + c + '</span></button>';
    });
  }
  if (q.fmt === 'written') {
    var val = S.ans[qi] || '';
    bh += '<input class="written-input" value="' + val + '" placeholder="\ub2f5\uc548\uc744 \uc785\ub825\ud558\uc138\uc694..." oninput="writeAns(' + idx + ',this.value)">';
  }
  bh += '</div><div class="slide-nav"><button ' + (idx === 0 ? 'disabled ' : '') + ' onclick="navQ(-1)">\u2190 \uc774\uc804</button><span class="nav-cur">' + (idx + 1) + ' / ' + EI.totalQ + '</span><button class="sn-next" ' + (idx === EI.totalQ - 1 ? 'disabled ' : '') + ' onclick="navQ(1)">\ub2e4\uc74c \u2192</button></div>';
  bt.innerHTML = bh;
}

function selectAns(idx, ci) {
  var qi = S.order ? S.order[idx] : idx;
  if (S.filtered) qi = S.filtered[qi];
  S.ans[qi] = ci;
  var btns = document.querySelectorAll('.slide-choices .choice-btn');
  btns.forEach(function (b, i) {
    b.classList.toggle('selected', i === ci);
    if (i === ci) b.classList.add('just-selected');
  });
  updateProgress();
}

function writeAns(idx, val) {
  var qi = S.order ? S.order[idx] : idx;
  if (S.filtered) qi = S.filtered[qi];
  S.ans[qi] = val.trim() || null;
  updateProgress();
}

function navQ(dir) {
  var next = S.cur + dir;
  if (next >= 0 && next < EI.totalQ) showQ(next, dir);
}

function updateProgress() {
  var answered = S.ans.filter(function (a) { return a !== null; }).length;
  document.getElementById('progressFill').style.width = (answered / EI.totalQ * 100) + '%';
  document.getElementById('ansCount').textContent = answered + '/' + EI.totalQ;
}

function initSwipe() {
  var startX = 0, startY = 0;
  var el = document.getElementById('slideWrap');
  el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0 && S.cur < EI.totalQ - 1) navQ(1);
      if (dx > 0 && S.cur > 0) navQ(-1);
    }
  }, { passive: true });
}

function submitExam() {
  if (!confirm('\uc81c\ucd9c\ud558\uc2dc\uaca0\uc2b5\ub2c8\uae4c?')) return;
  clearInterval(S.ti);
  var elapsed = Math.floor((Date.now() - S.start) / 1000);
  var r = grade();
  saveToHistory(r, elapsed);
  renderResults(r, elapsed);
  showScreen('resultScreen');
  window.scrollTo(0, 0);
