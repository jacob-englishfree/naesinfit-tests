analysis:`✅ ① who: 사람 선행사 + 주격 관계대명사\n❌ ② which: 사물 선행사용\n❌ ③ whom: 목적격 → 뒤에 주어+동사가 와야 함\n❌ ④ what: 선행사 포함 관계대명사 → 앞에 선행사가 있으면 불가`,
tip:`사람 선행사 + 주격 = who / 사물 선행사 + 주격 = which`}},

// Q2: 분사 — Concerned · 보통 · 5pts
{id:2,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`Concerning`,`Concerned`,`To concern`,`Having concerned`],
passage:`Christine was a cat owner who loved her furry companion, Leo. One morning, she noticed that Leo was not feeling well. __________ for her beloved cat, Christine decided to take him to the animal hospital.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`Christine이 걱정을 <b>느끼는</b> 주체이므로 감정 분사 <b>Concerned(과거분사)</b>가 적절하다. 분사구문으로 이유를 나타낸다.`,
analysis:`✅ ② Concerned: 감정 분사(과거분사) → "걱정되어" (이유의 분사구문)\n❌ ① Concerning: "~에 관하여" 또는 "걱정시키는" → 의미 부적절\n❌ ③ To concern: to부정사는 이유 표현에 어색\n❌ ④ Having concerned: concern은 타동사로 "걱정시키다" → 의미 반대`,
tip:`감정동사 분사: 감정을 느끼는 주체 = 과거분사(concerned, surprised) / 감정을 유발하는 대상 = 현재분사(concerning, surprising)`}},

// Q3: 접속사 as — 시간/이유 · 보통 · 5pts
{id:3,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`Although`,`Despite`,`As`,`Unless`],
passage:`__________ she always brought Leo to this hospital, she was certain that the vet knew well about Leo. She desperately hoped Leo got the necessary care as soon as possible.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`"항상 이 병원에 데려왔으므로" 수의사가 Leo를 잘 안다고 확신 → <b>이유</b>의 접속사 <b>As</b>가 적절하다.`,
analysis:`✅ ③ As: 이유(~이므로) → 뒤 절과 인과 관계\n❌ ① Although(비록 ~이지만): 양보 → 인과 관계와 반대\n❌ ② Despite(~에도 불구하고): 전치사 → 뒤에 절 불가\n❌ ④ Unless(~하지 않으면): 조건 → 문맥과 무관`,
tip:`As = 이유(~이므로) / 시간(~할 때) / 비례(~함에 따라) — 문맥에 따라 의미 구분`}},

// Q4: 가주어 it — to부정사 · 어려움 · 6pts
{id:4,type:`어법`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`heartbreaking`,`heartbreakingly`,`heartbreak`,`heartbroken`],
passage:`It was __________ for Christine to leave Leo at the animal hospital, but she had to accept it was for the best.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`"It was __ for A to V" 가주어 구문에서 보어 자리에 <b>형용사 heartbreaking</b>이 적절하다. 상황이 "가슴 아프게 하는" 것이므로 현재분사형 형용사.`,
analysis:`✅ ① heartbreaking: "It is + 형용사 + for A + to V" 구문 → 상황의 성질을 나타내는 형용사\n❌ ② heartbreakingly: 부사 → 보어 자리에 부적절\n❌ ③ heartbreak: 명사 → was 뒤 보어로 어색\n❌ ④ heartbroken: "가슴이 찢어진" → 사람의 감정 상태(Christine is heartbroken)에 쓰임, It 가주어 구문에 부적절`,
tip:`It is heartbreaking to V = ~하는 것은 가슴 아프다 (상황 묘사 → -ing형 형용사)`}},

// Q5: 밑줄 3개 중 틀린 것 · 보통 · 5pts
{id:5,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`①`,`②`,`③`],
passage:`Christine was a cat owner who loved her furry companion, Leo. One morning, she noticed that Leo was not feeling well. Concerned for her beloved cat, Christine decided to take him to the animal hospital. As she always brought Leo to this hospital, she was certain that the vet knew well about Leo. She desperately hoped Leo got the necessary care as soon as possible. The waiting room was filled with other pet owners. Finally, it was Leo\u2019s turn to see the vet. Christine watched as the vet gently ①<u>examined</u> him. The vet said, \u201CI think Leo has a minor infection.\u201D \u201CWe need to do some tests to see if he is ②<u>infected</u>. But for the tests, it\u2019s best for Leo to stay here,\u201D replied the vet. Relieved to hear the news, Christine rushed back to the animal hospital to ③<u>picking</u> up Leo.`,
stem:`다음 글의 밑줄 친 ①~③ 중, 어법상 <b>틀린</b> 것은? (번호는 지문 등장 순서)`,
det:{korean:`③ picking → <b>pick</b>: to부정사(to + 동사원형) 구조에서 동사원형 pick이 와야 한다.`,
analysis:`❌ ③ picking: to pick up(데리러 가다) → to 뒤에 동사원형 필요\n✅ ① examined: watched as the vet examined → 과거형 올바름\n✅ ② infected: if he is infected → 수동태 올바름`,
tip:`to + 동사원형: to pick up(데리러 가다) — to 뒤에 -ing형 불가`}},

passage:FULL_PASSAGE,
stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,

// Q8: 글의 순서 · 보통 · 5pts
{id:8,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`(B)-(D)-(C)`,`(C)-(B)-(D)`,`(C)-(D)-(B)`,`(D)-(B)-(C)`,`(D)-(C)-(B)`],
passage:`(A) Christine was a cat owner who loved her furry companion, Leo. One morning, she noticed that Leo was not feeling well. Concerned for her beloved cat, Christine decided to take him to the animal hospital. As she always brought Leo to this hospital, she was certain that the vet knew well about Leo. She desperately hoped Leo got the necessary care as soon as possible.\n\n(B) \u201CI\u2019ll call you with updates as soon as we know anything,\u201D said the vet. Throughout the day, Christine anxiously awaited news about Leo. Later that day, the phone rang and it was the vet. \u201CThe tests revealed a minor infection. Leo needs some medication and rest, but he\u2019ll be back to his playful self soon.\u201D Relieved to hear the news, Christine rushed back to the animal hospital to pick up Leo.\n\n(C) The vet provided detailed instructions on how to administer the medication and shared tips for a speedy recovery. Back at home, Christine created a comfortable space for Leo to rest and heal. She patted him with love and attention, ensuring that he would recover in no time. As the days passed, Leo gradually regained his strength and playful spirit.\n\n(D) The waiting room was filled with other pet owners. Finally, it was Leo\u2019s turn to see the vet. Christine watched as the vet gently examined him. The vet said, \u201CI think Leo has a minor infection.\u201D \u201CInfection? Will he be okay?\u201D asked Christine. \u201CWe need to do some tests to see if he is infected. But for the tests, it\u2019s best for Leo to stay here,\u201D replied the vet. It was heartbreaking for Christine to leave Leo at the animal hospital, but she had to accept it was for the best.`,
stem:`주어진 글 (A)에 이어질 내용을 순서에 맞게 배열한 것으로 가장 적절한 것은?`,
det:{korean:`(A) 병원 방문 → (D) 대기/진찰/검사 필요 → (B) 전화 결과/데리러 감 → (C) 약 투여/집 회복. 정답: <b>(D)-(B)-(C)</b>`,
analysis:`✅ ④ (D)-(B)-(C): 시간 순서로 자연스러운 흐름\n❌ ① (B)-(D)-(C): 전화가 진찰보다 먼저 올 수 없음\n❌ ② (C)-(B)-(D): 회복이 진찰보다 먼저 올 수 없음\n❌ ③ (C)-(D)-(B): 회복이 가장 먼저 올 수 없음\n❌ ⑤ (D)-(C)-(B): 약 투여가 결과 통보보다 먼저 올 수 없음`,
tip:`순서배열: (D)의 "tests"가 (B)의 "The tests revealed"로 연결되는 단서를 확인`}},

function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#7C3AED':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#FFF3E8,#FFE8D5':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#7C3AED':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
