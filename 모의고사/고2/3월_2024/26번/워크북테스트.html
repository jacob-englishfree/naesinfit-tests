const Q=[
{id:1,type:"(A)(B)(C) 조합형",diff:"쉬움",pts:4,fmt:"mc",ans:2,ch:["talent — doctoral — consultant","mind — doctoral — director","talent — doctoral — director","talent — master's — consultant","mind — master's — director"],passage:`Theodore von Kármán, a Hungarian-American engineer, was one of the greatest <b>(A)</b> of the twentieth century. He was born in Hungary and at an early age, he showed a <b>(A)</b> for math and science. In 1908, he received a <b>(B)</b> degree in engineering at the University of Göttingen in Germany. In the 1920s, he began traveling as a lecturer and consultant to industry. He was invited to the United States to advise engineers on the design of a wind tunnel at Caltech. He became the <b>(C)</b> of the Guggenheim Aeronautical Laboratory at Caltech in 1930.`,stem:"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?",det:{korean:"20세기 가장 위대한 <b>지성(minds)</b> 중 한 명이며 수학과 과학에 <b>재능(talent)</b>을 보였고, <b>박사(doctoral)</b> 학위를 받았으며, 연구소의 <b>소장(director)</b>이 되었다.",analysis:"✅ ③ talent — doctoral — director: 원문 일치\n❌ ① consultant: director가 아닌 자문위원\n❌ ② mind: (A)에 두 가지 의미로 들어가야 하므로 부적합\n❌ ④ master's: doctoral이 맞음\n❌ ⑤ mind/master's: 둘 다 부적절",tip:"talent(재능), doctoral degree(박사 학위), director(소장/감독)"}},
{id:2,type:"(A)(B)(C) 조합형",diff:"보통",pts:5,fmt:"mc",ans:0,ch:["lecturer — advise — awarded","lecturer — advise — denied","professor — advise — awarded","lecturer — reject — awarded","professor — reject — denied"],passage:`In the 1920s, he began traveling as a <b>(A)</b> and consultant to industry. He was invited to the United States to <b>(B)</b> engineers on the design of a wind tunnel at California Institute of Technology (Caltech). He became the director of the Guggenheim Aeronautical Laboratory at Caltech in 1930. Later, he was <b>(C)</b> the National Medal of Science for his leadership in science and engineering.`,stem:"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?",det:{korean:"1920년대에 <b>강연자(lecturer)</b>로 다니기 시작했고, 풍동 설계에 <b>조언(advise)</b>하도록 초청받았으며, National Medal of Science를 <b>수여받았다(awarded)</b>.",analysis:"✅ ① lecturer — advise — awarded: 원문 일치\n❌ ② denied: awarded의 반의어\n❌ ③ professor: lecturer가 맞음\n❌ ④ reject: advise의 반의어\n❌ ⑤ professor/reject/denied: 모두 부적절",tip:"lecturer(강연자), advise(조언하다), award(수여하다)"}},
{id:3,type:"문맥상 부적절한 어휘",diff:"쉬움",pts:4,fmt:"mc",ans:3,ch:["①","②","③","④","⑤"],passage:`Theodore von Kármán, a Hungarian-American engineer, was one of the greatest minds of the twentieth century. He was born in Hungary and at an early age, he showed a ①<u>talent</u> for math and science. In 1908, he received a doctoral degree in engineering at the University of Göttingen in Germany. In the 1920s, he began traveling as a ②<u>lecturer</u> and consultant to industry. He was invited to the United States to ③<u>advise</u> engineers on the design of a wind tunnel at Caltech. He became the ④<u>student</u> of the Guggenheim Aeronautical Laboratory at Caltech in 1930. Later, he was ⑤<u>awarded</u> the National Medal of Science.`,stem:"다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?",det:{korean:"그는 Caltech 구겐하임 항공 연구소의 <b>소장(director)</b>이 되었다. ④ student(학생)는 director의 부적절한 대체어.",analysis:"❌ ④ student(학생): 원문은 'director(소장)' → 부적절\n✅ ① talent: 재능 → 적절\n✅ ② lecturer: 강연자 → 적절\n✅ ③ advise: 조언하다 → 적절\n✅ ⑤ awarded: 수여받다 → 적절",tip:"director(소장/감독) ↔ student(학생) — 핵심 반의어"}},
{id:4,type:"문맥상 부적절한 어휘",diff:"보통",pts:5,fmt:"mc",ans:1,ch:["①","②","③","④","⑤"],passage:`Theodore von Kármán, a Hungarian-American engineer, was one of the greatest ①<u>minds</u> of the twentieth century. He was born in Hungary and at an early age, he ②<u>concealed</u> a talent for math and science. In 1908, he received a doctoral degree in engineering at the University of Göttingen in Germany. In the 1920s, he began traveling as a lecturer and ③<u>consultant</u> to industry. He was ④<u>invited</u> to the United States to advise engineers on the design of a wind tunnel at Caltech. He became the director of the Guggenheim Aeronautical Laboratory at Caltech in 1930. Later, he was awarded the National Medal of Science for his ⑤<u>leadership</u> in science and engineering.`,stem:"다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?",det:{korean:"어린 나이에 수학과 과학에 재능을 <b>보였다(showed)</b>. ② concealed(숨겼다)는 showed의 반의어로 부적절.",analysis:"❌ ② concealed(숨겼다): 원문은 'showed(보였다)' → 부적절\n✅ ① minds: 지성인 → 적절\n✅ ③ consultant: 자문위원 → 적절\n✅ ④ invited: 초대받다 → 적절\n✅ ⑤ leadership: 리더십 → 적절",tip:"showed(보이다) ↔ concealed(숨기다) — 핵심 반의어"}},
{id:5,type:"동의어 고르기",diff:"쉬움",pts:4,fmt:"mc",ans:1,ch:["weakness","gift","failure","indifference"],passage:`He showed a <u>talent</u> for math and science.`,stem:"밑줄 친 <b>talent</b>의 의미와 가장 <b>가까운</b> 것은?",det:{korean:"talent = 재능, gift = 재능 → 동의어",analysis:"✅ ② gift: 재능 → talent의 동의어\n❌ ① weakness: 약점\n❌ ③ failure: 실패\n❌ ④ indifference: 무관심",tip:"talent = gift = aptitude = knack = 재능"}},
{id:6,type:"동의어 고르기",diff:"쉬움",pts:4,fmt:"mc",ans:0,ch:["counsel","ignore","reject","prohibit"],passage:`He was invited to the United States to <u>advise</u> engineers.`,stem:"밑줄 친 <b>advise</b>의 의미와 가장 <b>가까운</b> 것은?",det:{korean:"advise = 조언하다, counsel = 조언하다 → 동의어",analysis:"✅ ① counsel: 조언하다 → advise의 동의어\n❌ ② ignore: 무시하다\n❌ ③ reject: 거부하다\n❌ ④ prohibit: 금지하다",tip:"advise = counsel = guide = recommend = 조언하다"}},
{id:7,type:"동의어 고르기",diff:"보통",pts:5,fmt:"mc",ans:2,ch:["punished","refused","granted","purchased"],passage:`He was <u>awarded</u> the National Medal of Science.`,stem:"밑줄 친 <b>awarded</b>의 의미와 가장 <b>가까운</b> 것은?",det:{korean:"awarded = 수여받다, granted = 수여받다 → 동의어",analysis:"✅ ③ granted: 수여받다 → awarded의 동의어\n❌ ① punished: 처벌받다\n❌ ② refused: 거부당하다\n❌ ④ purchased: 구매하다",tip:"award = grant = bestow = confer = 수여하다"}},
{id:8,type:"반의어 고르기",diff:"쉬움",pts:4,fmt:"mc",ans:3,ch:["displayed","exhibited","revealed","hid"],passage:`He <u>showed</u> a talent for math and science.`,stem:"밑줄 친 <b>showed</b>의 의미와 가장 <b>먼</b> 것은?",det:{korean:"showed = 보이다 ↔ hid = 숨기다",analysis:"❌ ④ hid(숨기다): showed의 반의어 → 가장 먼 의미\n✅ ① displayed: 보여주다 → 동의어\n✅ ② exhibited: 나타내다 → 동의어\n✅ ③ revealed: 드러내다 → 동의어",tip:"show = display = exhibit = reveal ↔ hide = conceal = 숨기다"}},
{id:9,type:"반의어 고르기",diff:"보통",pts:5,fmt:"mc",ans:0,ch:["dismissed","welcomed","accepted","greeted"],passage:`He was <u>invited</u> to the United States.`,stem:"밑줄 친 <b>invited</b>의 의미와 가장 <b>먼</b> 것은?",det:{korean:"invited = 초대받다 ↔ dismissed = 내쫓다",analysis:"❌ ① dismissed(내쫓다): invited의 반의어 → 가장 먼 의미\n✅ ② welcomed: 환영받다 → 유사어\n✅ ③ accepted: 받아들여지다 → 유사어\n✅ ④ greeted: 맞이하다 → 유사어",tip:"invite = welcome ↔ dismiss = expel = 내쫓다, 해고하다"}},
{id:10,type:"빈칸 어휘 완성",diff:"쉬움",pts:4,fmt:"mc",ans:1,ch:["weakness","talent","complaint","doubt"],passage:`Theodore von Kármán, a Hungarian-American engineer, was one of the greatest minds of the twentieth century. He was born in Hungary and at an early age, he showed a __________ for math and science. In 1908, he received a doctoral degree in engineering at the University of Göttingen in Germany.`,stem:"다음 빈칸에 들어갈 말로 가장 적절한 것은?",det:{korean:"어린 나이에 수학과 과학에 대한 <b>재능(talent)</b>을 보였다.",analysis:"✅ ② talent: 재능 → 원문 일치\n❌ ① weakness: 약점\n❌ ③ complaint: 불만\n❌ ④ doubt: 의심",tip:"show a talent for ~: ~에 재능을 보이다"}},
{id:11,type:"빈칸 어휘 완성",diff:"보통",pts:5,fmt:"mc",ans:2,ch:["visitor","critic","consultant","competitor"],passage:`In the 1920s, he began traveling as a lecturer and __________ to industry. He was invited to the United States to advise engineers on the design of a wind tunnel at California Institute of Technology (Caltech).`,stem:"다음 빈칸에 들어갈 말로 가장 적절한 것은?",det:{korean:"산업계의 강연자 겸 <b>자문위원(consultant)</b>으로 다니기 시작했다.",analysis:"✅ ③ consultant: 자문위원 → 원문 일치\n❌ ① visitor: 방문객\n❌ ② critic: 비평가\n❌ ④ competitor: 경쟁자",tip:"consultant = adviser = 자문위원, 고문"}},
{id:12,type:"빈칸 어휘 완성",diff:"보통",pts:5,fmt:"mc",ans:0,ch:["leadership","failure","opposition","ignorance"],passage:`Later, he was awarded the National Medal of Science for his __________ in science and engineering.`,stem:"다음 빈칸에 들어갈 말로 가장 적절한 것은?",det:{korean:"과학과 공학 분야에서의 <b>리더십(leadership)</b>으로 National Medal of Science를 수여받았다.",analysis:"✅ ① leadership: 리더십 → 원문 일치\n❌ ② failure: 실패\n❌ ③ opposition: 반대\n❌ ④ ignorance: 무지",tip:"leadership = 리더십, 지도력"}},
{id:13,type:"다의어 문맥적 의미",diff:"보통",pts:5,fmt:"mc",ans:1,ch:["학위, 정도","(공학) 학위","온도 단위","각도"],passage:`He received a doctoral <u>degree</u> in engineering at the University of Göttingen.`,stem:"밑줄 친 <b>degree</b>의 문맥적 의미로 가장 적절한 것은?",det:{korean:"공학 박사 <b>학위(degree)</b>를 받았다.",analysis:"✅ ② (공학) 학위: doctoral degree in engineering = 공학 박사 학위\n❌ ① 학위, 정도: 너무 광범위\n❌ ③ 온도 단위: 30 degrees Celsius\n❌ ④ 각도: 90 degrees",tip:"degree 다의어: 학위(명사) / 정도(명사) / 온도 단위 / 각도"}},
{id:14,type:"다의어 문맥적 의미",diff:"보통",pts:5,fmt:"mc",ans:3,ch:["설계도","의도","무늬","설계"],passage:`He was invited to advise engineers on the <u>design</u> of a wind tunnel.`,stem:"밑줄 친 <b>design</b>의 문맥적 의미로 가장 적절한 것은?",det:{korean:"풍동의 <b>설계(design)</b>에 관해 조언하도록 초청받았다.",analysis:"✅ ④ 설계: 풍동의 설계 = the design of a wind tunnel\n❌ ① 설계도: a design (도면)\n❌ ② 의도: by design (의도적으로)\n❌ ③ 무늬: floral design (꽃무늬)",tip:"design 다의어: 설계(명사) / 디자인 / 의도 / 무늬"}},
{id:15,type:"영영풀이 매칭",diff:"보통",pts:5,fmt:"mc",ans:2,ch:["talent","lecturer","consultant","director"],passage:"<i>a person who gives expert advice professionally to a company or organization</i>",stem:"다음 영영풀이에 해당하는 단어로 가장 적절한 것은?",det:{korean:"회사나 조직에 전문적 조언을 제공하는 사람 → <b>consultant(자문위원)</b>",analysis:"✅ ③ consultant: 자문위원 → 영영 정의와 일치\n❌ ① talent: 재능\n❌ ② lecturer: 강연자\n❌ ④ director: 소장, 감독",tip:"consultant = adviser = 전문적 조언을 제공하는 사람"}},
{id:16,type:"영영풀이 매칭",diff:"보통",pts:5,fmt:"mc",ans:0,ch:["awarded","received","designed","traveled"],passage:"<i>to give someone a prize or other recognition officially as a reward for their achievements</i>",stem:"다음 영영풀이에 해당하는 단어로 가장 적절한 것은?",det:{korean:"성취에 대한 보상으로 공식적으로 상을 주다 → <b>awarded(수여하다)</b>",analysis:"✅ ① awarded: 수여하다 → 영영 정의와 일치\n❌ ② received: 받다\n❌ ③ designed: 설계하다\n❌ ④ traveled: 여행하다",tip:"award = grant = bestow = 공식적으로 상·상금을 수여하다"}},
{id:17,type:"어형 변환 (서술형)",diff:"쉬움",pts:4,fmt:"written",wa:"engineering",accept:["engineering","Engineering"],passage:`In 1908, he received a doctoral degree in __________ (engineer) at the University of Göttingen in Germany. In the 1920s, he began traveling as a lecturer and consultant to industry.`,stem:"다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.",det:{korean:"전치사 in 다음에 학문 분야명이 와야 한다 → engineer → <b>engineering</b>",analysis:"engineer → engineering: 명사(사람) → 명사(학문 분야)\n'a degree in engineering' = 공학 학위",tip:"engineer(공학자) → engineering(공학) — 학문명은 -ing 형태"}},
{id:18,type:"어형 변환 (서술형)",diff:"보통",pts:5,fmt:"written",wa:"traveling",accept:["traveling","travelling","Traveling","Travelling"],passage:`In the 1920s, he began __________ (travel) as a lecturer and consultant to industry. He was invited to the United States to advise engineers on the design of a wind tunnel at California Institute of Technology (Caltech).`,stem:"다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.",det:{korean:"begin + 동명사(-ing) 구문 → travel → <b>traveling</b>",analysis:"travel → traveling: begin + V-ing (동명사)\n'began traveling as a lecturer' = 강연자로 다니기 시작했다",tip:"begin + V-ing / to-V 모두 가능. 여기서는 원문이 traveling 사용"}},
{id:19,type:"내용 일치/불일치 (TF)",diff:"어려움",pts:6,fmt:"mc",ans:3,ch:["어린 시절 수학과 과학에 재능을 보였다.","University of Göttingen에서 공학 박사 학위를 받았다.","1920년대에 강연자 겸 자문 위원으로 다니기 시작했다.","Caltech의 공학자들을 초청하여 조언을 구했다.","National Medal of Science를 받았다."],passage:FULL_PASSAGE,stem:"Theodore von Kármán에 관한 다음 글의 내용과 <b>일치하지 않는</b> 것은?",det:{korean:"④ 원문에 따르면 그가 미국으로 초청받아 Caltech 풍동 설계에 조언했지, Caltech 공학자들을 초청해 조언을 구한 것이 아니다.",analysis:"❌ ④ Caltech의 공학자들을 초청하여 조언을 구했다: 원문과 반대 — 그가 미국에 초청받아 조언한 것\n✅ ① 재능을 보였다: 원문 일치\n✅ ② 박사 학위: 원문 일치\n✅ ③ 강연자 겸 자문위원: 원문 일치\n✅ ⑤ National Medal: 원문 일치",tip:"원문: 'He was invited to the US to advise engineers' → 그가 초대받은 것"}},
{id:20,type:"내용 일치/불일치 (TF)",diff:"어려움",pts:6,fmt:"mc",ans:1,ch:["헝가리에서 태어나 어린 시절부터 수학에 재능이 있었다.","1908년에 미국 Caltech에서 박사 학위를 받았다.","1920년대에 산업체 자문위원으로 활동하기 시작했다.","Caltech의 Guggenheim 항공 연구소 소장이 되었다.","과학과 공학 분야의 리더십으로 상을 받았다."],passage:FULL_PASSAGE,stem:"Theodore von Kármán에 관한 다음 글의 내용과 <b>일치하지 않는</b> 것은?",det:{korean:"② 원문에 따르면 1908년에 <b>독일 Göttingen 대학교</b>에서 박사 학위를 받았지, 미국 Caltech에서 받은 것이 아니다.",analysis:"❌ ② 1908년에 미국 Caltech에서 박사 학위를 받았다: 원문은 독일 Göttingen 대학교\n✅ ① 헝가리 출생, 수학 재능: 원문 일치\n✅ ③ 1920년대 자문위원: 원문 일치\n✅ ④ Guggenheim 소장: 원문 일치\n✅ ⑤ 과학·공학 리더십: 원문 일치",tip:"박사 학위: University of Göttingen in Germany (독일), Caltech이 아님"}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx','내용 일치/불일치 (TF)':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📓 온라인워크북 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
