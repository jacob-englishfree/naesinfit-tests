.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}

const FULL_PASSAGE="Technologists are always on the lookout for quantifiable metrics. Measurable inputs to a model are their lifeblood, and like a social scientist, a technologist needs to identify concrete measures, or \"proxies,\" for assessing progress. This need for quantifiable proxies produces a bias toward measuring things that are easy to quantify. But simple metrics can take us further away from the important goals we really care about, which may require complicated metrics or be extremely difficult, or perhaps impossible, to reduce to any measure. And when we have imperfect or bad proxies, we can easily fall under the illusion that we are solving for a good end without actually making genuine progress toward a worthy solution. The problem of proxies results in technologists frequently substituting what is measurable for what is meaningful. As the saying goes, \"Not everything that counts can be counted, and not everything that can be counted counts.\"";

const Q=[{"id":1,"type":"(A)(B)(C) 조합형","diff":"쉬움","pts":4,"fmt":"mc","ans":1,"ch":["quantifiable — complicated — illusion","quantifiable — complicated — illusion","measurable — simple — reality","quantifiable — simple — illusion","measurable — complicated — reality"],"passage":"This need for <b>(A)</b> proxies produces a bias toward measuring things that are easy to quantify. But simple metrics can take us further away from the important goals we really care about, which may require <b>(B)</b> metrics. And when we have imperfect or bad proxies, we can easily fall under the <b>(C)</b> that we are solving for a good end.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"<b>정량화 가능한(quantifiable)</b> 대리 지표에 대한 필요가 편향을 만들며, <b>복잡한(complicated)</b> 지표가 필요할 수 있고, 불완전한 대리 지표에서 <b>착각(illusion)</b>에 빠질 수 있다.","analysis":"✅ ② quantifiable — complicated — illusion: 원문 일치\n❌ ① 번호 중복\n❌ ③ simple/reality: complicated와 illusion이 맞음\n❌ ④ simple: complicated가 맞음\n❌ ⑤ reality: illusion이 맞음","tip":"quantifiable(정량화 가능한), complicated(복잡한), illusion(착각)"}},{"id":2,"type":"(A)(B)(C) 조합형","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["concrete — bias — genuine","concrete — bias — genuine","abstract — bias — genuine","concrete — benefit — genuine","concrete — bias — artificial"],"passage":"A technologist needs to identify <b>(A)</b> measures, or \"proxies,\" for assessing progress. This need for quantifiable proxies produces a <b>(B)</b> toward measuring things that are easy to quantify. We can easily fall under the illusion that we are solving for a good end without actually making <b>(C)</b> progress toward a worthy solution.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"<b>구체적인(concrete)</b> 측정치를 식별해야 하며, 정량화 가능한 대리 지표에 대한 <b>편향(bias)</b>을 만들고, 가치 있는 해결책을 향한 <b>진정한(genuine)</b> 진전 없이 착각에 빠진다.","analysis":"✅ ① concrete — bias — genuine: 원문 일치\n❌ ② 번호 중복\n❌ ③ abstract: concrete가 맞음\n❌ ④ benefit: bias가 맞음\n❌ ⑤ artificial: genuine이 맞음","tip":"concrete(구체적인), bias(편향), genuine(진정한)"}},{"id":3,"type":"문맥상 부적절한 어휘","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["①","②","③","④","⑤"],"passage":"Technologists are always on the lookout for ①<u>quantifiable</u> metrics. Measurable inputs to a model are their ②<u>lifeblood</u>. This need for quantifiable proxies produces a bias toward measuring things that are easy to quantify. But simple metrics can take us ③<u>closer to</u> the important goals we really care about. And when we have ④<u>imperfect</u> or bad proxies, we can easily fall under the ⑤<u>illusion</u> that we are solving for a good end.","stem":"다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?","det":{"korean":"단순한 지표는 중요한 목표에서 <b>더 멀어지게(further away)</b> 할 수 있다. ③ closer to(더 가까이)는 further away의 반의어로 부적절.","analysis":"❌ ③ closer to(더 가까이): 원문은 'further away(더 멀리)' → 부적절\n✅ ① quantifiable: 정량화 가능한 → 적절\n✅ ② lifeblood: 생명줄 → 적절\n✅ ④ imperfect: 불완전한 → 적절\n✅ ⑤ illusion: 착각 → 적절","tip":"further away(더 멀리) ↔ closer to(더 가까이) — 핵심 반의어"}},{"id":4,"type":"문맥상 부적절한 어휘","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["①","②","③","④","⑤"],"passage":"A technologist needs to identify ①<u>concrete</u> measures, or \"proxies,\" for assessing progress. This need produces a ②<u>bias</u> toward measuring things that are easy to quantify. Important goals may require ③<u>complicated</u> metrics. We can fall under the illusion that we are solving for a good end without actually making ④<u>superficial</u> progress toward a worthy solution. The problem results in technologists frequently ⑤<u>substituting</u> what is measurable for what is meaningful.","stem":"다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?","det":{"korean":"가치 있는 해결책을 향한 <b>진정한(genuine)</b> 진전을 이루지 못한다. ④ superficial(피상적인)은 genuine의 부적절한 대체어.","analysis":"❌ ④ superficial(피상적인): 원문은 'genuine(진정한)' → 부적절\n✅ ① concrete: 구체적인 → 적절\n✅ ② bias: 편향 → 적절\n✅ ③ complicated: 복잡한 → 적절\n✅ ⑤ substituting: 대체하다 → 적절","tip":"genuine(진정한) ≠ superficial(피상적인)"}},{"id":5,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["abstract","vague","specific","general"],"passage":"A technologist needs to identify <u>concrete</u> measures.","stem":"밑줄 친 <b>concrete</b>의 의미와 가장 <b>가까운</b> 것은?","det":{"korean":"concrete = 구체적인, specific = 구체적인 → 동의어","analysis":"✅ ③ specific: 구체적인 → concrete의 동의어\n❌ ① abstract: 추상적인\n❌ ② vague: 모호한\n❌ ④ general: 일반적인","tip":"concrete = specific = tangible = definite = 구체적인"}},{"id":6,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["tendency","balance","accuracy","fairness"],"passage":"This need produces a <u>bias</u> toward measuring things that are easy to quantify.","stem":"밑줄 친 <b>bias</b>의 의미와 가장 <b>가까운</b> 것은?","det":{"korean":"bias = 편향, tendency = 경향 → 동의어","analysis":"✅ ① tendency: 경향 → bias의 동의어\n❌ ② balance: 균형\n❌ ③ accuracy: 정확성\n❌ ④ fairness: 공정성","tip":"bias = tendency = inclination = prejudice = 편향, 편견"}},{"id":7,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["false","real","fake","imaginary"],"passage":"Without actually making <u>genuine</u> progress toward a worthy solution.","stem":"밑줄 친 <b>genuine</b>의 의미와 가장 <b>가까운</b> 것은?","det":{"korean":"genuine = 진정한, real = 진정한 → 동의어","analysis":"✅ ② real: 진정한 → genuine의 동의어\n❌ ① false: 거짓된\n❌ ③ fake: 가짜의\n❌ ④ imaginary: 상상의","tip":"genuine = real = authentic = true = 진정한, 진짜의"}},{"id":8,"type":"반의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":3,"ch":["fantasy","vision","dream","reality"],"passage":"We can easily fall under the <u>illusion</u> that we are solving for a good end.","stem":"밑줄 친 <b>illusion</b>의 의미와 가장 <b>먼</b> 것은?","det":{"korean":"illusion = 착각 ↔ reality = 현실","analysis":"❌ ④ reality(현실): illusion의 반의어 → 가장 먼 의미\n✅ ① fantasy: 환상 → 유사어\n✅ ② vision: 환영 → 유사어\n✅ ③ dream: 꿈 → 유사어","tip":"illusion = fantasy ↔ reality = fact = 현실"}},{"id":9,"type":"반의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["abstract","tangible","definite","specific"],"passage":"A technologist needs to identify <u>concrete</u> measures.","stem":"밑줄 친 <b>concrete</b>의 의미와 가장 <b>먼</b> 것은?","det":{"korean":"concrete = 구체적인 ↔ abstract = 추상적인","analysis":"❌ ① abstract(추상적인): concrete의 반의어 → 가장 먼 의미\n✅ ② tangible: 만질 수 있는, 구체적인 → 동의어\n✅ ③ definite: 확실한 → 유사어\n✅ ④ specific: 구체적인 → 동의어","tip":"concrete = specific ↔ abstract = vague = 추상적인"}},{"id":10,"type":"빈칸 어휘 완성","diff":"쉬움","pts":4,"fmt":"mc","ans":1,"ch":["essential","quantifiable","permanent","flexible"],"passage":"Technologists are always on the lookout for __________ metrics. Measurable inputs to a model are their lifeblood.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"기술자들은 항상 <b>정량화 가능한(quantifiable)</b> 지표를 찾고 있다.","analysis":"✅ ② quantifiable: 정량화 가능한 → 원문 일치\n❌ ① essential: 필수적인\n❌ ③ permanent: 영구적인\n❌ ④ flexible: 유연한","tip":"quantifiable = measurable = 정량화 가능한, 측정 가능한"}},{"id":11,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["opportunities","benefits","illusion","certainty"],"passage":"When we have imperfect or bad proxies, we can easily fall under the __________ that we are solving for a good end without actually making genuine progress.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"불완전한 대리 지표가 있을 때 진정한 진전 없이 좋은 결과를 위해 해결하고 있다는 <b>착각(illusion)</b>에 빠진다.","analysis":"✅ ③ illusion: 착각 → 원문 일치\n❌ ① opportunities: 기회\n❌ ② benefits: 이점\n❌ ④ certainty: 확실성","tip":"fall under the illusion = 착각에 빠지다"}},{"id":12,"type":"빈칸 어휘 완성","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["regarding continuous progress as a valid solution","prioritizing short-term goals over long-term visions","mistaking a personal bias for an established theory","substituting what is measurable for what is meaningful"],"passage":"The problem of proxies results in technologists frequently __________. As the saying goes, \"Not everything that counts can be counted, and not everything that can be counted counts.\"","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은? (원래 모의고사 34번 문제)","det":{"korean":"대리 지표의 문제는 기술자들이 자주 <b>측정 가능한 것을 의미 있는 것으로 대체(substituting what is measurable for what is meaningful)</b>하는 결과를 낳는다.","analysis":"✅ ④ substituting what is measurable for what is meaningful: 원문 일치 (모의고사 정답 ④)\n❌ ① 지속적 진전: 부정확\n❌ ② 단기 목표 우선: 부정확\n❌ ③ 개인적 편향: 부정확","tip":"원래 시험 34번 빈칸 정답: ④ substituting what is measurable for what is meaningful"}},{"id":13,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["모형, 모델","모델(분석 도구)","모범","패션 모델"],"passage":"Measurable inputs to a <u>model</u> are their lifeblood.","stem":"밑줄 친 <b>model</b>의 문맥적 의미로 가장 적절한 것은?","det":{"korean":"<b>모델(분석 도구)</b>에 대한 측정 가능한 입력이 그들의 생명줄이다.","analysis":"✅ ② 모델(분석 도구): a model = 분석 모델, 예측 모델\n❌ ① 모형: scale model\n❌ ③ 모범: role model\n❌ ④ 패션 모델: fashion model","tip":"model 다의어: 분석 모델 / 모형 / 모범 / 모델(사람)"}},{"id":14,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["세다, 계산하다","숫자를 세다","포함하다","중요하다"],"passage":"Not everything that <u>counts</u> can be counted.","stem":"밑줄 친 <b>counts</b>의 문맥적 의미로 가장 적절한 것은?","det":{"korean":"<b>중요한(counts)</b> 모든 것이 셀 수 있는 것은 아니다.","analysis":"✅ ④ 중요하다: counts = matters = is important\n❌ ① 세다: count the money\n❌ ② 숫자를 세다: count to ten\n❌ ③ 포함하다: count someone in","tip":"count 다의어: 중요하다(동사) / 세다 / 포함하다 / 간주하다"}},{"id":15,"type":"영영풀이 매칭","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["metric","proxy","bias","illusion"],"passage":"<i>a substitute or representative measure used to assess something that is difficult to measure directly</i>","stem":"다음 영영풀이에 해당하는 단어로 가장 적절한 것은?","det":{"korean":"직접 측정하기 어려운 것을 평가하기 위해 사용하는 대리 또는 대표 측정치 → <b>proxy(대리 지표)</b>","analysis":"✅ ② proxy: 대리 지표 → 영영 정의와 일치\n❌ ① metric: 측정 기준\n❌ ③ bias: 편향\n❌ ④ illusion: 착각","tip":"proxy = substitute measure = 대리 지표, 대용물"}},{"id":16,"type":"영영풀이 매칭","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["bias","proxy","metric","illusion"],"passage":"<i>a false idea or belief, especially one that is caused by the way things appear</i>","stem":"다음 영영풀이에 해당하는 단어로 가장 적절한 것은?","det":{"korean":"거짓된 관념이나 믿음, 특히 사물이 보이는 방식에 의해 야기되는 → <b>illusion(착각)</b>","analysis":"✅ ④ illusion: 착각 → 영영 정의와 일치\n❌ ① bias: 편향\n❌ ② proxy: 대리 지표\n❌ ③ metric: 측정 기준","tip":"illusion = delusion = false belief = 착각, 환상"}},{"id":17,"type":"어형 변환 (서술형)","diff":"쉬움","pts":4,"fmt":"written","wa":"measurable","accept":["measurable","Measurable"],"passage":"Measurable inputs to a model are their lifeblood. This need for quantifiable proxies produces a bias toward measuring things that are easy to quantify. The problem results in technologists frequently substituting what is __________ (measure) for what is meaningful.","stem":"다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.","det":{"korean":"what is + 형용사 구문 → measure → <b>measurable</b>","analysis":"measure → measurable: 동사/명사 → 형용사\n'what is measurable' = 측정 가능한 것","tip":"measure(측정하다) → measurable(측정 가능한, 형용사)"}},{"id":18,"type":"어형 변환 (서술형)","diff":"보통","pts":5,"fmt":"written","wa":"meaningful","accept":["meaningful","Meaningful"],"passage":"The problem results in technologists frequently substituting what is measurable for what is __________ (meaning).","stem":"다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.","det":{"korean":"what is + 형용사 구문 → meaning → <b>meaningful</b>","analysis":"meaning → meaningful: 명사 → 형용사\n'what is meaningful' = 의미 있는 것","tip":"meaning(의미, 명사) → meaningful(의미 있는, 형용사)"}},{"id":19,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["정량화 가능한 지표가 항상 정확하다","단순한 지표가 복잡한 지표보다 낫다","모든 중요한 것은 측정 가능하다","측정 가능한 것이 항상 의미 있는 것은 아니다"],"passage":"Technologists are always on the lookout for quantifiable metrics. Measurable inputs to a model are their lifeblood, and like a social scientist, a technologist needs to identify concrete measures, or \"proxies,\" for assessing progress. This need for quantifiable proxies produces a bias toward measuring things that are easy to quantify. But simple metrics can take us further away from the important goals we really care about, which may require complicated metrics or be extremely difficult, or perhaps impossible, to reduce to any measure. And when we have imperfect or bad proxies, we can easily fall under the illusion that we are solving for a good end without actually making genuine progress toward a worthy solution. The problem of proxies results in technologists frequently substituting what is measurable for what is meaningful. As the saying goes, \"Not everything that counts can be counted, and not everything that can be counted counts.\"","stem":"다음 글의 핵심 주장으로 가장 적절한 것은?","det":{"korean":"'셀 수 있는 모든 것이 중요한 것은 아니고, 중요한 모든 것이 셀 수 있는 것은 아니다' — <b>측정 가능한 것이 항상 의미 있는 것은 아니다</b>.","analysis":"✅ ④ 측정 가능한 것이 항상 의미 있는 것은 아니다: 원문 핵심\n❌ ① 항상 정확: 원문 반대\n❌ ② 단순 > 복잡: 원문 반대\n❌ ③ 모든 중요한 것 측정 가능: 원문 반대","tip":"핵심: 'Not everything that counts can be counted'"}},{"id":20,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["regarding continuous progress as a valid solution","prioritizing short-term goals over long-term visions","mistaking a personal bias for an established theory","substituting what is measurable for what is meaningful"],"passage":"The problem of proxies results in technologists frequently __________.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"대리 지표의 문제는 기술자들이 <b>측정 가능한 것을 의미 있는 것으로 대체</b>하는 결과를 낳는다.","analysis":"✅ ④ substituting what is measurable for what is meaningful: 원문 일치\n❌ ① 지속적 진전: 부정확\n❌ ② 단기 목표: 부정확\n❌ ③ 개인적 편향: 부정확","tip":"substitute A for B = A를 B 대신 사용하다"}}];

let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx','내용 일치/불일치 (TF)':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
