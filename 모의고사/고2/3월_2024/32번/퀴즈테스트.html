const FULL_PASSAGE="We must explore the relationship between children's film production and consumption habits. The term \"children's film\" implies ownership by children — their cinema — but films supposedly made for children have always been consumed by audiences of all ages, particularly in commercial cinemas. The considerable crossover in audience composition for children's films can be shown by the fact that, in 2007, eleven Danish children's and youth films attracted 59 per cent of theatrical admissions, and in 2014, German children's films comprised seven out of the top twenty films at the national box office. This phenomenon corresponds with a broader, international embrace of what is seemingly children's culture among audiences of diverse ages. The old prejudice that children's film is some other realm, separate from (and forever subordinate to) a more legitimate cinema for adults is not supported by the realities of consumption: children's film is at the heart of contemporary popular culture.";

const Q=[{"id":1,"type":"(A)(B)(C) 조합형","diff":"쉬움","pts":4,"fmt":"mc","ans":1,"ch":["production — ownership — diverse","consumption — ownership — diverse","production — rejection — diverse","consumption — ownership — limited","production — ownership — limited"],"passage":"We must explore the relationship between children's film production and <b>(A)</b> habits. The term \"children's film\" implies <b>(B)</b> by children — their cinema — but films supposedly made for children have always been consumed by audiences of <b>(C)</b> ages.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"아동 영화의 제작과 <b>소비(consumption)</b> 습관, '아동 영화'라는 용어는 아동의 <b>소유권(ownership)</b>을 암시하지만 <b>다양한(diverse)</b> 연령대가 소비한다.","analysis":"✅ ② consumption — ownership — diverse: 원문 일치\n❌ ① production: consumption이 맞음\n❌ ③ rejection: ownership이 맞음\n❌ ④ limited: diverse가 맞음\n❌ ⑤ limited: diverse가 맞음","tip":"consumption(소비), ownership(소유권), diverse(다양한)"}},{"id":2,"type":"(A)(B)(C) 조합형","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["considerable — embrace — contemporary","considerable — rejection — contemporary","minimal — embrace — contemporary","considerable — embrace — traditional","minimal — rejection — traditional"],"passage":"The <b>(A)</b> crossover in audience composition for children's films can be shown by the fact that Danish and German children's films dominated box offices. This phenomenon corresponds with a broader, international <b>(B)</b> of what is seemingly children's culture among audiences of diverse ages. Children's film is at the heart of <b>(C)</b> popular culture.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"관객 구성에서 <b>상당한(considerable)</b> 교차가 있으며, 아동 문화에 대한 국제적 <b>수용(embrace)</b>에 해당하고, <b>현대(contemporary)</b> 대중문화의 핵심이다.","analysis":"✅ ① considerable — embrace — contemporary: 원문 일치\n❌ ② rejection: embrace가 맞음\n❌ ③ minimal: considerable가 맞음\n❌ ④ traditional: contemporary가 맞음\n❌ ⑤ 모두 부적절","tip":"considerable(상당한), embrace(수용), contemporary(현대의)"}},{"id":3,"type":"문맥상 부적절한 어휘","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["①","②","③","④","⑤"],"passage":"The term \"children's film\" implies ①<u>ownership</u> by children. But films supposedly made for children have always been ②<u>consumed</u> by audiences of all ages. The considerable crossover in audience composition can be shown by the fact that Danish children's films attracted 59 per cent of theatrical admissions. This phenomenon corresponds with a broader, international ③<u>rejection</u> of what is seemingly children's culture among audiences of diverse ages. Children's film is at the heart of ④<u>contemporary</u> ⑤<u>popular</u> culture.","stem":"다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?","det":{"korean":"아동 문화에 대한 국제적 <b>수용(embrace)</b>에 해당한다. ③ rejection(거부)은 embrace의 반의어로 부적절.","analysis":"❌ ③ rejection(거부): 원문은 'embrace(수용)' → 부적절\n✅ ① ownership: 소유권 → 적절\n✅ ② consumed: 소비된 → 적절\n✅ ④ contemporary: 현대의 → 적절\n✅ ⑤ popular: 대중적인 → 적절","tip":"embrace(수용) ↔ rejection(거부) — 핵심 반의어"}},{"id":4,"type":"문맥상 부적절한 어휘","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["①","②","③","④","⑤"],"passage":"We must explore the relationship between children's film production and consumption habits. Films supposedly made for children have always been consumed by audiences of all ages, particularly in ①<u>commercial</u> cinemas. The ②<u>considerable</u> crossover in audience composition can be shown by box office data. The old ③<u>prejudice</u> that children's film is some other realm, separate from a more ④<u>inferior</u> cinema for adults is not supported by the realities of consumption: children's film is at the heart of contemporary ⑤<u>popular</u> culture.","stem":"다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?","det":{"korean":"어른을 위한 더 <b>정당한(legitimate)</b> 영화로부터 분리되어 있다는 편견. ④ inferior(열등한)는 legitimate의 부적절한 대체어.","analysis":"❌ ④ inferior(열등한): 원문은 'legitimate(정당한)' → 부적절\n✅ ① commercial: 상업적인 → 적절\n✅ ② considerable: 상당한 → 적절\n✅ ③ prejudice: 편견 → 적절\n✅ ⑤ popular: 대중적인 → 적절","tip":"legitimate(정당한) ≠ inferior(열등한)"}},{"id":5,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":1,"ch":["rejection","acceptance","criticism","indifference"],"passage":"A broader, international <u>embrace</u> of children's culture.","stem":"밑줄 친 <b>embrace</b>의 의미와 가장 <b>가까운</b> 것은?","det":{"korean":"embrace = 수용, acceptance = 수용 → 동의어","analysis":"✅ ② acceptance: 수용 → embrace의 동의어\n❌ ① rejection: 거부\n❌ ③ criticism: 비판\n❌ ④ indifference: 무관심","tip":"embrace = accept = welcome = adopt = 수용하다"}},{"id":6,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["significant","minor","trivial","negligible"],"passage":"The <u>considerable</u> crossover in audience composition.","stem":"밑줄 친 <b>considerable</b>의 의미와 가장 <b>가까운</b> 것은?","det":{"korean":"considerable = 상당한, significant = 상당한 → 동의어","analysis":"✅ ① significant: 상당한 → considerable의 동의어\n❌ ② minor: 사소한\n❌ ③ trivial: 하찮은\n❌ ④ negligible: 무시할 만한","tip":"considerable = significant = substantial = 상당한"}},{"id":7,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["ancient","traditional","modern","historical"],"passage":"Children's film is at the heart of <u>contemporary</u> popular culture.","stem":"밑줄 친 <b>contemporary</b>의 의미와 가장 <b>가까운</b> 것은?","det":{"korean":"contemporary = 현대의, modern = 현대의 → 동의어","analysis":"✅ ③ modern: 현대의 → contemporary의 동의어\n❌ ① ancient: 고대의\n❌ ② traditional: 전통적인\n❌ ④ historical: 역사적인","tip":"contemporary = modern = current = present-day = 현대의"}},{"id":8,"type":"반의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":3,"ch":["notable","significant","substantial","insignificant"],"passage":"The <u>considerable</u> crossover in audience composition.","stem":"밑줄 친 <b>considerable</b>의 의미와 가장 <b>먼</b> 것은?","det":{"korean":"considerable = 상당한 ↔ insignificant = 대수롭지 않은","analysis":"❌ ④ insignificant(대수롭지 않은): considerable의 반의어 → 가장 먼 의미\n✅ ① notable: 주목할 만한 → 유사어\n✅ ② significant: 상당한 → 동의어\n✅ ③ substantial: 상당한 → 동의어","tip":"considerable = signifi ted by the realities of consumption.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"아동 영화가 다른 영역이라는 오래된 <b>편견(prejudice)</b>은 소비 현실에 의해 뒷받침되지 않는다.","analysis":"✅ ① prejudice: 편견 → 원문 일치\n❌ ② support: 지지\n❌ ③ evidence: 증거\n❌ ④ reality: 현실","tip":"prejudice = bias = preconception = 편견"}},{"id":13,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["구성, 작곡","구성, 조성","합성","화합물"],"passage":"The considerable crossover in audience <u>composition</u> for children's films.","stem":"밑줄 친 <b>composition</b>의 문맥적 의미로 가장 적절한 것은?","det":{"korean":"관객 <b>구성(composition)</b>에서의 상당한 교차.","analysis":"✅ ② 구성, 조성: audience composition = 관객 구성\n❌ ① 구성, 작곡: musical composition\n❌ ③ 합성: chemical composition\n❌ ④ 화합물: composition of substances","tip":"composition 다의어: 구성 / 작곡 / 작문 / 합성"}},{"id":14,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["심장","마음","용기","핵심, 중심"],"passage":"Children's film is at the <u>heart</u> of contemporary popular culture.","stem":"밑줄 친 <b>heart</b>의 문맥적 의미로 가장 적절한 것은?","det":{"korean":"아동 영화는 현대 대중문화의 <b>핵심(heart)</b>에 있다.","analysis":"✅ ④ 핵심, 중심: at the heart of = ~의 핵심에\n❌ ① 심장: the human heart\n❌ ② 마음: with all my heart\n❌ ③ 용기: take heart","tip":"heart 다의어: 핵심(비유) / 심장(기관) / 마음(감정) / 용기"}},{"id":15,"type":"영영풀이 매칭","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["composition","prejudice","embrace","realm"],"passage":"<i>a preconceived opinion that is not based on reason or actual experience; an unfair bias</i>","stem":"다음 영영풀이에 해당하는 단어로 가장 적절한 것은?","det":{"korean":"이성이나 실제 경험에 기반하지 않은 선입관; 불공정한 편향 → <b>prejudice(편견)</b>","analysis":"✅ ② prejudice: 편견 → 영영 정의와 일치\n❌ ① composition: 구성\n❌ ③ embrace: 수용\n❌ ④ realm: 영역","tip":"prejudice = bias = preconception = 편견, 선입견"}},{"id":16,"type":"영영풀이 매칭","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["consumption","composition","prejudice","phenomenon"],"passage":"<i>a fact or situation that is observed to exist or happen, especially one whose cause is in question</i>","stem":"다음 영영풀이에 해당하는 단어로 가장 적절한 것은?","det":{"korean":"존재하거나 일어나는 것으로 관찰되는 사실이나 상황 → <b>phenomenon(현상)</b>","analysis":"✅ ④ phenomenon: 현상 → 영영 정의와 일치\n❌ ① consumption: 소비\n❌ ② composition: 구성\n❌ ③ prejudice: 편견","tip":"phenomenon = 현상 — 복수형: phenomena"}},{"id":17,"type":"어형 변환 (서술형)","diff":"쉬움","pts":4,"fmt":"written","wa":"supposedly","accept":["supposedly","Supposedly"],"passage":"Films __________ (suppose) made for children have always been consumed by audiences of all ages, particularly in commercial cinemas.","stem":"다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.","det":{"korean":"과거분사 made를 수식하는 부사 필요 → suppose → <b>supposedly</b>","analysis":"suppose → supposedly: 동사 → 부사\n'supposedly made for children' = 아동을 위해 만들어졌다고 여겨지는","tip":"suppose(추정하다) → supposedly(추정상, 부사)"}},{"id":18,"type":"어형 변환 (서술형)","diff":"보통","pts":5,"fmt":"written","wa":"theatrical","accept":["theatrical","Theatrical"],"passage":"Eleven Danish children's and youth films attracted 59 per cent of __________ (theater) admissions.","stem":"다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.","det":{"korean":"명사 admissions를 수식하는 형용사 필요 → theater → <b>theatrical</b>","analysis":"theater → theatrical: 명사 → 형용사\n'theatrical admissions' = 극장 입장","tip":"theater(극장, 명사) → theatrical(극장의, 형용사)"}},{"id":19,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["아동 영화는 성인 영화와 완전히 다른 장르이다","아동 영화는 어린이만 보는 영화이다","아동 영화는 현대 대중문화의 핵심에 있다","아동 영화의 제작비가 점점 증가하고 있다"],"passage":"We must explore the relationship between children's film production and consumption habits. The term \"children's film\" implies ownership by children — their cinema — but films supposedly made for children have always been consumed by audiences of all ages, particularly in commercial cinemas. The considerable crossover in audience composition for children's films can be shown by the fact that, in 2007, eleven Danish children's and youth films attracted 59 per cent of theatrical admissions, and in 2014, German children's films comprised seven out of the top twenty films at the national box office. This phenomenon corresponds with a broader, international embrace of what is seemingly children's culture among audiences of diverse ages. The old prejudice that children's film is some other realm, separate from (and forever subordinate to) a more legitimate cinema for adults is not supported by the realities of consumption: children's film is at the heart of contemporary popular culture.","stem":"다음 글의 핵심 주장으로 가장 적절한 것은?","det":{"korean":"아동 영화가 어른 영화와 분리된 다른 영역이라는 편견은 소비 현실에 의해 뒷받침되지 않으며, <b>현대 대중문화의 핵심</b>에 있다.","analysis":"✅ ③ 아동 영화는 현대 대중문화의 핵심에 있다: 원문 마지막 문장과 일치\n❌ ① 완전히 다른 장르: 오래된 편견\n❌ ② 어린이만 시청: 원문 반대\n❌ ④ 제작비 증가: 언급 없음","tip":"핵심: 'children's film is at the heart of contemporary popular culture'"}},{"id":20,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","ans":1,"ch":["centered on giving moral lessons","consumed by audiences of all ages","appreciated through an artistic view","produced by inexperienced directors"],"passage":"Films supposedly made for children have always been __________, particularly in commercial cinemas.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"아동을 위해 만들어졌다는 영화들은 항상 <b>모든 연령대의 관객에 의해 소비되어 왔다</b>.","analysis":"✅ ② consumed by audiences of all ages: 원문 일치\n❌ ① 도덕적 교훈: 언급 없음\n❌ ③ 예술적 시각: 언급 없음\n❌ ④ 미숙한 감독: 언급 없음","tip":"원문: 'consumed by audiences of all ages, particularly in commercial cinemas'"}}];

let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx','내용 일치/불일치 (TF)':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
