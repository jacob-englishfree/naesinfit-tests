<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--g:#16A34A;--gd:#14532D;--gl:#E8F5E9;--gxl:#F0FDF4;--gxxl:#F8FDF9;--bg:#F4F8F5;--text:#1A1A2E;--tm:#5A6A5E;--tl:#8A9A8E;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--o:#F59E0B;--ol:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}

.tag-combo{background:var(--gl);color:#166534;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}

.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--g),#15A35A);color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}

.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8efe9;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),#4ADE80);transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FAFDFB;border-radius:var(--rs);border:1px solid #dde8df;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8efe9;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #dde8df;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FAFDFB;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F0F8F1;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

<script>
const EI={"subject":"2025 고2 3월 모의고사","pub":"24번","lesson":"제목","title":"Sitcoms and Social Change","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_2025_g2_mar_24_v1"};

const FULL_PASSAGE=`Since their start in the early 1950s U.S. television sitcoms have charted many of the social conflicts in U.S. society: civil rights, women's rights in the home and in the workplace, children's rights, immigration and multiculturalism, as well as evolving conceptions of the family. Each of these issues has been addressed through humour in a way that has helped to make more progressive values more acceptable than previously. Often a character, usually someone marked as a bigot, resisted one or more of these developments and was then made to appear ridiculous. They were cut down either through their own stupidity, a brief scolding from others, or both. In this way, the humour of sitcoms acted as a cost-effective means to encourage acceptance of a more pluralistic and tolerant society.`;

const Q=[
{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`charted — progressive — pluralistic`,`charted — regressive — pluralistic`,`ignored — progressive — pluralistic`,`charted — progressive — uniform`,`ignored — regressive — uniform`],
passage:`Since their start in the early 1950s U.S. television sitcoms have <b>(A)</b> many of the social conflicts in U.S. society: civil rights, women's rights in the home and in the workplace, children's rights, immigration and multiculturalism, as well as evolving conceptions of the family. Each of these issues has been addressed through humour in a way that has helped to make more <b>(B)</b> values more acceptable than previously. Often a character, usually someone marked as a bigot, resisted one or more of these developments and was then made to appear ridiculous. They were cut down either through their own stupidity, a brief scolding from others, or both. In this way, the humour of sitcoms acted as a cost-effective means to encourage acceptance of a more <b>(C)</b> and tolerant society.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`시트콤은 사회적 갈등을 <b>기록해 왔고(charted)</b>, <b>진보적(progressive)</b> 가치를 수용하게 했으며, 더 <b>다원적(pluralistic)</b>이고 관용적인 사회를 장려했다.`,
analysis:`✅ ① charted — progressive — pluralistic: 원문과 정확히 일치\n❌ ② regressive(퇴보적): progressive의 반의어\n❌ ③ ignored(무시했다): charted의 반의어\n❌ ④ uniform(획일적): pluralistic의 반의어\n❌ ⑤ 세 단어 모두 부적절`,
tip:`charted(기록하다)↔ignored(무시하다), progressive(진보적)↔regressive(퇴보적), pluralistic(다원적)↔uniform(획일적)`}},

{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`addressed — ridiculous — tolerance`,`addressed — admirable — tolerance`,`avoided — ridiculous — tolerance`,`addressed — ridiculous — hostility`,`avoided — admirable — hostility`],
passage:`Since their start in the early 1950s U.S. television sitcoms have charted many of the social conflicts in U.S. society: civil rights, women's rights in the home and in the workplace, children's rights, immigration and multiculturalism, as well as evolving conceptions of the family. Each of these issues has been <b>(A)</b> through humour in a way that has helped to make more progressive values more acceptable than previously. Often a character, usually someone marked as a bigot, resisted one or more of these developments and was then made to appear <b>(B)</b>. They were cut down either through their own stupidity, a brief scolding from others, or both. In this way, the humour of sitcoms acted as a cost-effective means to encourage acceptance of a more pluralistic and <b>(C)</b> society.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`각 이슈는 유머를 통해 <b>다루어졌고(addressed)</b>, 편견을 가진 인물은 <b>우스꽝스럽게(ridiculous)</b> 보이게 되었으며, 더 <b>관용적인(tolerant)</b> 사회를 장려했다.`,
analysis:`✅ ① addressed — ridiculous — tolerance: 원문과 일치\n❌ ② admirable(존경할 만한): ridiculous의 반의어\n❌ ③ avoided(회피했다): addressed의 반의어\n❌ ④ hostility(적대감): tolerance의 반의어\n❌ ⑤ 모두 부적절`,
tip:`addressed(다루다)↔avoided(회피하다), ridiculous(우스꽝스러운)↔admirable(존경할 만한), tolerant(관용적)↔hostile(적대적)`}},

{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Since their start in the early 1950s U.S. television sitcoms have charted many of the social conflicts in U.S. society: civil rights, women's rights in the home and in the workplace, children's rights, immigration and multiculturalism, as well as ①<u>evolving</u> conceptions of the family. Each of these issues has been addressed through humour in a way that has helped to make more progressive values more ②<u>acceptable</u> than previously. Often a character, usually someone marked as a bigot, ③<u>resisted</u> one or more of these developments and was then made to appear ridiculous. They were cut down either through their own stupidity, a brief scolding from others, or both. In this way, the humour of sitcoms acted as a cost-effective means to ④<u>discourage</u> acceptance of a more ⑤<u>pluralistic</u> and tolerant society.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`시트콤의 유머는 다원적 사회의 수용을 <b>장려했다(encourage)</b>. ④ discourage(억제하다)는 encourage의 반의어로 부적절.`,
analysis:`❌ ④ discourage(억제하다): 원문은 encourage(장려하다) → 문맥상 반대\n✅ ① evolving(진화하는): 원문 일치\n✅ ② acceptable(수용 가능한): 원문 일치\n✅ ③ resisted(저항했다): 원문 일치\n✅ ⑤ pluralistic(다원적인): 원문 일치`,
tip:`encourage(장려하다) ↔ discourage(억제하다)`}},

{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Since their start in the early 1950s U.S. television sitcoms have charted many of the social conflicts in U.S. society: civil rights, women's rights in the home and in the workplace, children's rights, immigration and ①<u>multiculturalism</u>, as well as evolving conceptions of the family. Each of these issues has been addressed through humour in a way that has helped to make more ②<u>conservative</u> values more acceptable than previously. Often a character, usually someone marked as a bigot, resisted one or more of these developments and was then made to appear ③<u>ridiculous</u>. They were cut down either through their own ④<u>stupidity</u>, a brief scolding from others, or both. In this way, the humour of sitcoms acted as a cost-effective means to encourage acceptance of a more ⑤<u>pluralistic</u> and tolerant society.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`시트콤은 더 <b>진보적(progressive)</b> 가치를 수용하게 했다. ② conservative(보수적인)는 progressive의 반의어로 부적절.`,
analysis:`❌ ② conservative(보수적인): 원문은 progressive(진보적인) → 문맥상 반대\n✅ ① multiculturalism(다문화주의): 원문 일치\n✅ ③ ridiculous(우스꽝스러운): 원문 일치\n✅ ④ stupidity(어리석음): 원문 일치\n✅ ⑤ pluralistic(다원적인): 원문 일치`,
tip:`progressive(진보적) ↔ conservative(보수적)`}},

{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`ignored`,`documented`,`challenged`,`celebrated`],
passage:`U.S. television sitcoms have <u>charted</u> many of the social conflicts in U.S. society.`,
stem:`밑줄 친 <b>charted</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`charted = 기록하다, documented = 문서화하다/기록하다 → 의미 유사`,
analysis:`✅ ② documented(기록하다): charted의 동의어\n❌ ① ignored(무시하다): 반의어\n❌ ③ challenged(도전하다): 다른 의미\n❌ ④ celebrated(축하하다): 다른 의미`,
tip:`charted = documented = recorded = 기록하다`}},

{id:6,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`avoided`,`denied`,`tackled`,`created`],
passage:`Each of these issues has been <u>addressed</u> through humour.`,
stem:`밑줄 친 <b>addressed</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`addressed = 다루다, tackled = (문제를) 다루다 → 의미 유사`,
analysis:`✅ ③ tackled(다루다): addressed의 동의어\n❌ ① avoided(피하다): 반의어\n❌ ② denied(부인하다): 다른 의미\n❌ ④ created(만들다): 다른 의미`,
tip:`address = tackle = deal with = handle = 다루다`}},

{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`approved`,`supported`,`opposed`,`embraced`],
passage:`A character, usually someone marked as a bigot, <u>resisted</u> one or more of these developments.`,
stem:`밑줄 친 <b>resisted</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`resisted = 저항하다, opposed = 반대하다 → 의미 유사`,
analysis:`✅ ③ opposed(반대하다): resisted의 동의어\n❌ ① approved(승인하다): 반의어\n❌ ② supported(지지하다): 반의어\n❌ ④ embraced(받아들이다): 반의어`,
tip:`resisted = opposed = fought against = 저항하다, 반대하다`}},

{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`absurd`,`laughable`,`foolish`,`sensible`],
passage:`Was then made to appear <u>ridiculous</u>.`,
stem:`밑줄 친 <b>ridiculous</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`ridiculous = 우스꽝스러운 ↔ sensible = 분별 있는, 합리적인`,
analysis:`❌ ④ sensible(분별 있는): ridiculous의 반의어 → 가장 먼 의미\n✅ ① absurd(터무니없는): 동의어\n✅ ② laughable(우스운): 동의어\n✅ ③ foolish(어리석은): 유사어`,
tip:`ridiculous = absurd = laughable ↔ sensible = reasonable`}},

{id:9,type:`반의어 고르기`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`developing`,`changing`,`fixed`,`shifting`],
passage:`As well as <u>evolving</u> conceptions of the family.`,
stem:`밑줄 친 <b>evolving</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`evolving = 진화하는, 변화하는 ↔ fixed = 고정된`,
analysis:`❌ ③ fixed(고정된): evolving의 반의어 → 가장 먼 의미\n✅ ① developing(발전하는): 동의어\n✅ ② changing(변하는): 동의어\n✅ ④ shifting(이동하는): 유사어`,
tip:`evolving = developing = changing ↔ fixed = static = unchanging`}},

{id:10,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`ignored`,`suppressed`,`charted`,`invented`],
passage:`Since their start in the early 1950s U.S. television sitcoms have __________ many of the social conflicts in U.S. society: civil rights, women's rights in the home and in the workplace, children's rights, immigration and multiculturalism, as well as evolving conceptions of the family.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`미국 TV 시트콤은 사회적 갈등을 <b>기록해 왔다(charted)</b>.`,
analysis:`✅ ③ charted(기록하다): 시민권, 여성 인권 등을 다뤄온 맥락\n❌ ① ignored(무시했다): 문맥과 반대\n❌ ② suppressed(억압했다): 문맥과 반대\n❌ ④ invented(발명했다): 갈등을 발명한 것이 아님`,
tip:`chart = record = document: 기록하다, 도표로 나타내다`}},

{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`expensive`,`inefficient`,`risky`,`cost-effective`],
passage:`In this way, the humour of sitcoms acted as a __________ means to encourage acceptance of a more pluralistic and tolerant society.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`시트콤의 유머는 다원적 사회 수용을 장려하는 <b>비용 효율적인(cost-effective)</b> 수단이었다.`,
analysis:`✅ ④ cost-effective(비용 효율적인): 원문 일치\n❌ ① expensive(비싼): 반의어\n❌ ② inefficient(비효율적인): 반의어\n❌ ③ risky(위험한): 무관`,
tip:`cost-effective = 비용 대비 효과적인 ↔ expensive, inefficient`}},

{id:12,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`progressive`,`traditional`,`radical`,`outdated`],
passage:`Each of these issues has been addressed through humour in a way that has helped to make more __________ values more acceptable than previously.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`유머를 통해 더 <b>진보적인(progressive)</b> 가치를 수용 가능하게 만들었다.`,
analysis:`✅ ① progressive(진보적인): 시민권, 여성 인권 등을 장려하는 맥락\n❌ ② traditional(전통적인): 반의어\n❌ ③ radical(급진적인): 뉘앙스 다름\n❌ ④ outdated(구식의): 문맥과 반대`,
tip:`progressive values = 진보적 가치 (시민권, 다문화주의 등)`}},

{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`연설하다`,`편지를 보내다`,`다루다`,`주소를 쓰다`],
passage:`Each of these issues has been <u>addressed</u> through humour.`,
stem:`밑줄 친 <b>addressed</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`address = 여기서는 (문제를) <b>다루다</b>`,
analysis:`✅ ③ 다루다: address + issue/problem = 문제를 다루다\n❌ ① 연설하다: address the audience\n❌ ② 편지를 보내다: address a letter\n❌ ④ 주소를 쓰다: address an envelope`,
tip:`address: 다루다(문제) | 연설하다(청중에게) | 주소를 쓰다(편지에)`}},

{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`수단, 방법`,`의미하다`,`평균`,`비열한`],
passage:`The humour of sitcoms acted as a cost-effective <u>means</u> to encourage acceptance.`,
stem:`밑줄 친 <b>means</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`means = 여기서는 <b>수단, 방법</b>`,
analysis:`✅ ① 수단, 방법: a means to encourage = 장려하는 수단\n❌ ② 의미하다: 동사 mean\n❌ ③ 평균: 통계 용어\n❌ ④ 비열한: 형용사 mean`,
tip:`means(명사): 수단, 방법 | mean(동사): 의미하다 | mean(형용사): 비열한, 평균의`}},

{id:15,type:`영영풀이 매칭`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`resisted`,`addressed`,`charted`,`evolved`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"to record or follow the progress or development of something over time"</b>`,
det:{korean:`'무언가의 진행이나 발전을 시간에 걸쳐 기록하다' → <b>charted(기록하다)</b>`,
analysis:`✅ ③ charted: 영영 정의와 정확히 일치\n❌ ① resisted: 저항하다\n❌ ② addressed: 다루다\n❌ ④ evolved: 진화하다`,
tip:`chart = record/follow progress over time → 기록하다, 추적하다`}},

{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`progressive`,`evolving`,`acceptable`,`pluralistic`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"relating to a society in which members of diverse groups maintain their own traditions while coexisting peacefully"</b>`,
det:{korean:`'다양한 집단의 구성원들이 고유 전통을 유지하며 평화롭게 공존하는 사회' → <b>pluralistic(다원적인)</b>`,
analysis:`✅ ④ pluralistic: 영영 정의와 일치\n❌ ① progressive: 진보적인\n❌ ② evolving: 진화하는\n❌ ③ acceptable: 수용 가능한`,
tip:`pluralistic = 다원적인, 다양한 가치가 공존하는`}},

{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`acceptable`,accept:[`acceptable`,`Acceptable`],
passage:`Each of these issues has been addressed through humour in a way that has helped to make more progressive values more __________ (accept) than previously.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`accept(동사) → <b>acceptable(형용사)</b>: make + O + C(형용사) 구조에서 보어로 형용사 필요`,
analysis:`accept(동사) → acceptable(형용사)\nmake values more acceptable — 5형식 구조에서 보어 자리에 형용사`,
tip:`accept → acceptable / access → accessible — 동사 → -able 형용사 변환`}},

{id:18,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`acceptance`,accept:[`acceptance`,`Acceptance`],
passage:`In this way, the humour of sitcoms acted as a cost-effective means to encourage __________ (accept) of a more pluralistic and tolerant society.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`accept(동사) → <b>acceptance(명사)</b>: encourage + 목적어(명사) 구조에서 명사 필요`,
analysis:`accept(동사) → acceptance(명사)\nencourage + 명사 → "수용을 장려하다"`,
tip:`accept → acceptance / resist → resistance — 동사 → -ance 명사 변환`}},

{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`support`,`celebrate`,`encourage`,`prevent`,`question`],
passage:FULL_PASSAGE.replace('to encourage acceptance','to __________ acceptance'),
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`시트콤의 유머는 다원적 사회의 수용을 <b>장려하는(encourage)</b> 수단이었다.`,
analysis:`✅ ③ encourage(장려하다): 편견을 가진 인물을 우스꽝스럽게 만들어 수용을 촉진\n❌ ① support(지지하다): 가능하나 encourage가 더 적절\n❌ ② celebrate(축하하다): 문맥에 부적합\n❌ ④ prevent(막다): 반의어\n❌ ⑤ question(의문시하다): 문맥에 부적합`,
tip:`encourage acceptance = 수용을 장려하다 — 시트콤의 사회적 기능`}},

{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:4,
ch:[`Why Do Sitcoms Criticize Progressive Ideas?`,`Acceptability of Humour in Multicultural Society`,`The Decline of U.S. Sitcoms along with Social Change`,`Production Costs: Why TV Commercials Are Necessary`,`Humour in Sitcoms Helps Acceptance of Progressive Values`],
passage:FULL_PASSAGE,
stem:`다음 글의 제목으로 가장 적절한 것은?`,
det:{korean:`시트콤은 유머를 통해 편견을 가진 인물을 우스꽝스럽게 만들어 <b>진보적 가치의 수용을 장려</b>했다.`,
analysis:`✅ ⑤ Humour in Sitcoms Helps Acceptance of Progressive Values: 글의 핵심 내용 일치\n❌ ① Criticize Progressive Ideas: 진보적 가치를 비판하지 않음\n❌ ② Acceptability of Humour: 유머의 수용성이 주제가 아님\n❌ ③ Decline of Sitcoms: 시트콤의 쇠퇴는 언급 없음\n❌ ④ Production Costs: 제작비는 주제가 아님`,
tip:`제목 파악: 시트콤의 유머 → 진보적 가치 수용 장려 → ⑤가 핵심 요약`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch&&q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인단어 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
