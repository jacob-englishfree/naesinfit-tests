.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--gl);color:#166534;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f0f5f1;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--g);font-weight:800;}

.c-num{min-width:22px;height:22px;background:#e8efe9;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid #d0dcd2;border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}

.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8efe9;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),var(--gl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--gxxl);border-radius:var(--rs);border:1px solid #dde8df;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8efe9;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #dde8df;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--gxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--gxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

<script>

const EI={"subject":"2025 고2 3월 모의고사","pub":"24번","lesson":"제목","title":"Sitcoms and Social Change","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_2025_g2_mar_24_v1"};

const FULL_PASSAGE=`Since their start in the early 1950s U.S. television sitcoms have charted many of the social conflicts in U.S. society: civil rights, women's rights in the home and in the workplace, children's rights, immigration and multiculturalism, as well as evolving conceptions of the family. Each of these issues has been addressed through humour in a way that has helped to make more progressive values more acceptable than previously. Often a character, usually someone marked as a bigot, resisted one or more of these developments and was then made to appear ridiculous. They were cut down either through their own stupidity, a brief scolding from others, or both. In this way, the humour of sitcoms acted as a cost-effective means to encourage acceptance of a more pluralistic and tolerant society.`;

const Q=[
{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`charted — progressive — pluralistic`,`charted — regressive — pluralistic`,`ignored — progressive — pluralistic`,`charted — progressive — uniform`,`ignored — regressive — uniform`],
passage:`Since their start in the early 1950s U.S. television sitcoms have <b>(A)</b> many of the social conflicts in U.S. society: civil rights, women's rights in the home and in the workplace, children's rights, immigration and multiculturalism, as well as evolving conceptions of the family. Each of these issues has been addressed through humour in a way that has helped to make more <b>(B)</b> values more acceptable than previously. Often a character, usually someone marked as a bigot, resisted one or more of these developments and was then made to appear ridiculous. They were cut down either through their own stupidity, a brief scolding from others, or both. In this way, the humour of sitcoms acted as a cost-effective means to encourage acceptance of a more <b>(C)</b> and tolerant society.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`시트콤은 사회적 갈등을 <b>기록해 왔고(charted)</b>, <b>진보적(progressive)</b> 가치를 수용하게 했으며, 더 <b>다원적(pluralistic)</b>이고 관용적인 사회를 장려했다.`,
analysis:`✅ ① charted — progressive — pluralistic: 원문과 정확히 일치<br>❌ ② regressive(퇴보적): progressive의 반의어<br>❌ ③ ignored(무시했다): charted의 반의어<br>❌ ④ uniform(획일적): pluralistic의 반의어<br>❌ ⑤ 세 단어 모두 부적절`,
tip:`charted(기록하다)↔ignored(무시하다), progressive(진보적)↔regressive(퇴보적), pluralistic(다원적)↔uniform(획일적)`}},

{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`addressed — ridiculous — tolerance`,`addressed — admirable — tolerance`,`avoided — ridiculous — tolerance`,`addressed — ridiculous — hostility`,`avoided — admirable — hostility`],
passage:`Since their start in the early 1950s U.S. television sitcoms have charted many of the social conflicts in U.S. society: civil rights, women's rights in the home and in the workplace, children's rights, immigration and multiculturalism, as well as evolving conceptions of the family. Each of these issues has been <b>(A)</b> through humour in a way that has helped to make more progressive values more acceptable than previously. Often a character, usually someone marked as a bigot, resisted one or more of these developments and was then made to appear <b>(B)</b>. They were cut down either through their own stupidity, a brief scolding from others, or both. In this way, the humour of sitcoms acted as a cost-effective means to encourage acceptance of a more pluralistic and <b>(C)</b> society.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`각 이슈는 유머를 통해 <b>다루어졌고(addressed)</b>, 편견을 가진 인물은 <b>우스꽝스럽게(ridiculous)</b> 보이게 되었으며, 더 <b>관용적인(tolerant)</b> 사회를 장려했다.`,
analysis:`✅ ① addressed — ridiculous — tolerance: 원문과 일치<br>❌ ② admirable(존경할 만한): ridiculous의 반의어<br>❌ ③ avoided(회피했다): addressed의 반의어<br>❌ ④ hostility(적대감): tolerance의 반의어<br>❌ ⑤ 모두 부적절`,
tip:`addressed(다루다)↔avoided(회피하다), ridiculous(우스꽝스러운)↔admirable(존경할 만한), tolerant(관용적)↔hostile(적대적)`}},

{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Since their start in the early 1950s U.S. television sitcoms have charted many of the social conflicts in U.S. society: civil rights, women's rights in the home and in the workplace, children's rights, immigration and multiculturalism, as well as ①<u>evolving</u> conceptions of the family. Each of these issues has been addressed through humour in a way that has helped to make more progressive values more ②<u>acceptable</u> than previously. Often a character, usually someone marked as a bigot, ③<u>resisted</u> one or more of these developments and was then made to appear ridiculous. They were cut down either through their own stupidity, a brief scolding from others, or both. In this way, the humour of sitcoms acted as a cost-effective means to ④<u>discourage</u> acceptance of a more ⑤<u>pluralistic</u> and tolerant society.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`시트콤의 유머는 다원적 사회의 수용을 <b>장려했다(encourage)</b>. ④ discourage(억제하다)는 encourage의 반의어로 부적절.`,
analysis:`❌ ④ discourage(억제하다): 원문은 encourage(장려하다) → 문맥상 반대<br>✅ ① evolving(진화하는): 원문 일치<br>✅ ② acceptable(수용 가능한): 원문 일치<br>✅ ③ resisted(저항했다): 원문 일치<br>✅ ⑤ pluralistic(다원적인): 원문 일치`,
tip:`encourage(장려하다) ↔ discourage(억제하다)`}},

{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Since their start in the early 1950s U.S. television sitcoms have charted many of the social conflicts in U.S. society: civil rights, women's rights in the home and in the workplace, children's rights, immigration and ①<u>multiculturalism</u>, as well as evolving conceptions of the family. Each of these issues has been addressed through humour in a way that has helped to make more ②<u>conservative</u> values more acceptable than previously. Often a character, usually someone marked as a bigot, resisted one or more of these developments and was then made to appear ③<u>ridiculous</u>. They were cut down either through their own ④<u>stupidity</u>, a brief scolding from others, or both. In this way, the humour of sitcoms acted as a cost-effective means to encourage acceptance of a more ⑤<u>pluralistic</u> and tolerant society.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`시트콤은 더 <b>진보적(progressive)</b> 가치를 수용하게 했다. ② conservative(보수적인)는 progressive의 반의어로 부적절.`,
analysis:`❌ ② conservative(보수적인): 원문은 progressive(진보적인) → 문맥상 반대<br>✅ ① multiculturalism(다문화주의): 원문 일치<br>✅ ③ ridiculous(우스꽝스러운): 원문 일치<br>✅ ④ stupidity(어리석음): 원문 일치<br>✅ ⑤ pluralistic(다원적인): 원문 일치`,
tip:`progressive(진보적) ↔ conservative(보수적)`}},

{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`ignored`,`documented`,`challenged`,`celebrated`,`해당 사항 없음`]> many of the social conflicts in U.S. society.`,
stem:`밑줄 친 <b>charted</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`charted = 기록하다, documented = 문서화하다/기록하다 → 의미 유사`,
analysis:`✅ ② documented(기록하다): charted의 동의어<br>❌ ① ignored(무시하다): 반의어<br>❌ ③ challenged(도전하다): 다른 의미<br>❌ ④ celebrated(축하하다): 다른 의미`,
tip:`charted = documented = recorded = 기록하다`}},

{id:6,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`avoided`,`denied`,`tackled`,`created`,`해당 사항 없음`]</u> through humour.`,
stem:`밑줄 친 <b>addressed</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`addressed = 다루다, tackled = (문제를) 다루다 → 의미 유사`,
analysis:`✅ ③ tackled(다루다): addressed의 동의어<br>❌ ① avoided(피하다): 반의어<br>❌ ② denied(부인하다): 다른 의미<br>❌ ④ created(만들다): 다른 의미`,
tip:`address = tackle = deal with = handle = 다루다`}},

{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`approved`,`supported`,`opposed`,`embraced`,`해당 사항 없음`]igot, <u>resisted</u> one or more of these developments.`,
stem:`밑줄 친 <b>resisted</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`resisted = 저항하다, opposed = 반대하다 → 의미 유사`,
analysis:`✅ ③ opposed(반대하다): resisted의 동의어<br>❌ ① approved(승인하다): 반의어<br>❌ ② supported(지지하다): 반의어<br>❌ ④ embraced(받아들이다): 반의어`,
tip:`resisted = opposed = fought against = 저항하다, 반대하다`}},

{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`absurd`,`laughable`,`foolish`,`sensible`,`해당 사항 없음`]`,
stem:`밑줄 친 <b>ridiculous</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`ridiculous = 우스꽝스러운 ↔ sensible = 분별 있는, 합리적인`,
analysis:`❌ ④ sensible(분별 있는): ridiculous의 반의어 → 가장 먼 의미<br>✅ ① absurd(터무니없는): 동의어<br>✅ ② laughable(우스운): 동의어<br>✅ ③ foolish(어리석은): 유사어`,
tip:`ridiculous = absurd = laughable ↔ sensible = reasonable`}},

{id:9,type:`반의어 고르기`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`developing`,`changing`,`fixed`,`shifting`,`해당 사항 없음`]he family.`,
stem:`밑줄 친 <b>evolving</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`evolving = 진화하는, 변화하는 ↔ fixed = 고정된`,
analysis:`❌ ③ fixed(고정된): evolving의 반의어 → 가장 먼 의미<br>✅ ① developing(발전하는): 동의어<br>✅ ② changing(변하는): 동의어<br>✅ ④ shifting(이동하는): 유사어`,
tip:`evolving = developing = changing ↔ fixed = static = unchanging`}},

{id:10,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`ignored`,`suppressed`,`charted`,`invented`,`해당 사항 없음`]levision sitcoms have __________ many of the social conflicts in U.S. society: civil rights, women's rights in the home and in the workplace, children's rights, immigration and multiculturalism, as well as evolving conceptions of the family.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`미국 TV 시트콤은 사회적 갈등을 <b>기록해 왔다(charted)</b>.`,
analysis:`✅ ③ charted(기록하다): 시민권, 여성 인권 등을 다뤄온 맥락<br>❌ ① ignored(무시했다): 문맥과 반대<br>❌ ② suppressed(억압했다): 문맥과 반대<br>❌ ④ invented(발명했다): 갈등을 발명한 것이 아님`,
tip:`chart = record = document: 기록하다, 도표로 나타내다`}},

{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`expensive`,`inefficient`,`risky`,`cost-effective`,`해당 사항 없음`]a __________ means to encourage acceptance of a more pluralistic and tolerant society.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`시트콤의 유머는 다원적 사회 수용을 장려하는 <b>비용 효율적인(cost-effective)</b> 수단이었다.`,
analysis:`✅ ④ cost-effective(비용 효율적인): 원문 일치<br>❌ ① expensive(비싼): 반의어<br>❌ ② inefficient(비효율적인): 반의어<br>❌ ③ risky(위험한): 무관`,
tip:`cost-effective = 비용 대비 효과적인 ↔ expensive, inefficient`}},

{id:12,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`progressive`,`traditional`,`radical`,`outdated`,`해당 사항 없음`]gh humour in a way that has helped to make more __________ values more acceptable than previously.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`유머를 통해 더 <b>진보적인(progressive)</b> 가치를 수용 가능하게 만들었다.`,
analysis:`✅ ① progressive(진보적인): 시민권, 여성 인권 등을 장려하는 맥락<br>❌ ② traditional(전통적인): 반의어<br>❌ ③ radical(급진적인): 뉘앙스 다름<br>❌ ④ outdated(구식의): 문맥과 반대`,
tip:`progressive values = 진보적 가치 (시민권, 다문화주의 등)`}},

{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`연설하다`,`편지를 보내다`,`다루다`,`주소를 쓰다`,`해당 사항 없음`] through humour.`,
stem:`밑줄 친 <b>addressed</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`address = 여기서는 (문제를) <b>다루다</b>`,
analysis:`✅ ③ 다루다: address + issue/problem = 문제를 다루다<br>❌ ① 연설하다: address the audience<br>❌ ② 편지를 보내다: address a letter<br>❌ ④ 주소를 쓰다: address an envelope`,
tip:`address: 다루다(문제) | 연설하다(청중에게) | 주소를 쓰다(편지에)`}},

{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`수단, 방법`,`의미하다`,`평균`,`비열한`,`해당 사항 없음`]e <u>means</u> to encourage acceptance.`,
stem:`밑줄 친 <b>means</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`means = 여기서는 <b>수단, 방법</b>`,
analysis:`✅ ① 수단, 방법: a means to encourage = 장려하는 수단<br>❌ ② 의미하다: 동사 mean<br>❌ ③ 평균: 통계 용어<br>❌ ④ 비열한: 형용사 mean`,
tip:`means(명사): 수단, 방법 | mean(동사): 의미하다 | mean(형용사): 비열한, 평균의`}},

{id:15,type:`영영풀이 매칭`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`resisted`,`addressed`,`charted`,`evolved`,`해당 사항 없음`]b>"to record or follow the progress or development of something over time"</b>`,
det:{korean:`'무언가의 진행이나 발전을 시간에 걸쳐 기록하다' → <b>charted(기록하다)</b>`,
analysis:`✅ ③ charted: 영영 정의와 정확히 일치<br>❌ ① resisted: 저항하다<br>❌ ② addressed: 다루다<br>❌ ④ evolved: 진화하다`,
tip:`chart = record/follow progress over time → 기록하다, 추적하다`}},

{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`progressive`,`evolving`,`acceptable`,`pluralistic`,`해당 사항 없음`]<b>"relating to a society in which members of diverse groups maintain their own traditions while coexisting peacefully"</b>`,
det:{korean:`'다양한 집단의 구성원들이 고유 전통을 유지하며 평화롭게 공존하는 사회' → <b>pluralistic(다원적인)</b>`,
analysis:`✅ ④ pluralistic: 영영 정의와 일치<br>❌ ① progressive: 진보적인<br>❌ ② evolving: 진화하는<br>❌ ③ acceptable: 수용 가능한`,
tip:`pluralistic = 다원적인, 다양한 가치가 공존하는`}},

{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`acceptable`,accept:[`acceptable`,`Acceptable`],
passage:`Each of these issues has been addressed through humour in a way that has helped to make more progressive values more __________ (accept) than previously.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`accept(동사) → <b>acceptable(형용사)</b>: make + O + C(형용사) 구조에서 보어로 형용사 필요`,
analysis:`accept(동사) → acceptable(형용사)<br>make values more acceptable — 5형식 구조에서 보어 자리에 형용사`,
tip:`accept → acceptable / access → accessible — 동사 → -able 형용사 변환`}},

{id:18,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`acceptance`,accept:[`acceptance`,`Acceptance`],
passage:`In this way, the humour of sitcoms acted as a cost-effective means to encourage __________ (accept) of a more pluralistic and tolerant society.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,

analysis:`accept(동사) → acceptance(명사)<br>encourage + 명사 → "수용을 장려하다"`,
tip:`accept → acceptance / resist → resistance — 동사 → -ance 명사 변환`}},

{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`support`,`celebrate`,`encourage`,`prevent`,`question`],
passage:FULL_PASSAGE.replace('to encourage acceptance','to __________ acceptance'),
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,

analysis:`✅ ③ encourage(장려하다): 편견을 가진 인물을 우스꽝스럽게 만들어 수용을 촉진<br>❌ ① support(지지하다): 가능하나 encourage가 더 적절<br>❌ ② celebrate(축하하다): 문맥에 부적합<br>❌ ④ prevent(막다): 반의어<br>❌ ⑤ question(의문시하다): 문맥에 부적합`,
tip:`encourage acceptance = 수용을 장려하다 — 시트콤의 사회적 기능`}},

analysis:`✅ ⑤ Humour in Sitcoms Helps Acceptance of Progressive Values: 글의 핵심 내용 일치<br>❌ ① Criticize Progressive Ideas: 진보적 가치를 비판하지 않음<br>❌ ② Acceptability of Humour: 유머의 수용성이 주제가 아님<br>❌ ③ Decline of Sitcoms: 시트콤의 쇠퇴는 언급 없음<br>❌ ④ Production Costs: 제작비는 주제가 아님`,
tip:`제목 파악: 시트콤의 유머 → 진보적 가치 수용 장려 → ⑤가 핵심 요약`}}
];

let S={ans:[],cur:0,ti:null,left:EI.time,start:0};

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name,answers:S.ans.slice()});if(h.length>20)h.length=20;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}

function getLevel(s){if(s>=95)return{name:'마스터',icon:'👑',range:'95~100',msg:'이 단원은 정복했어요!'};if(s>=85)return{name:'챌린저',icon:'🌟',range:'85~94',msg:'거의 완벽, 한 끗 차이!'};if(s>=75)return{name:'파이터',icon:'💎',range:'75~84',msg:'통과! 약점만 잡으면 마스터'};if(s>=50)return{name:'루키',icon:'🔥',range:'50~74',msg:'기본기 OK, 유형별 훈련 필요'};return{name:'스타터',icon:'📖',range:'0~49',msg:'지문 해석부터 다시!'};}
function getTypeAdvice(t){const m={'(A)(B)(C) 조합형':'반의어 함정 주의, 원문 단어 정확히 암기','문맥상 부적절한 어휘':'밑줄 단어가 반의어로 바뀌었는지 확인','동의어 고르기':'동의어 쌍을 세트로 묶어 암기','반의어 고르기':'반의어 쌍을 세트로 묶어 암기','빈칸 어휘 완성':'문맥 단서(clue) 찾기 연습 필요','다의어 문맥적 의미':'다의어의 여러 뜻을 문맥별로 구분','영영풀이 매칭':'영영사전 정의 읽기 연습','어형 변환 (서술형)':'품사 변환 규칙(명↔형, 동↔명) 정리','빈칸 문맥 완성':'글의 흐름과 논리적 연결 파악','어법':'핵심 어법 규칙 정리 및 반복 연습','내용일치':'지문과 선지를 꼼꼼히 대조','내용불일치':'함정 선지의 미세한 차이 찾기','T/F':'원문과 진술을 정확히 대조','서술형':'정확한 철자와 어형 변환 주의','빈칸추론':'빈칸 전후 문맥 단서 찾기','빈칸 추론':'빈칸 전후 문맥 단서 찾기','문장삽입':'글의 흐름과 연결사 파악','어순배열':'문장 구조(S+V+O) 정확히 파악','어휘':'문맥에서 적절한 어휘 고르기 연습','내용이해':'지문 핵심 내용 정확히 파악'};return m[t]||'해당 유형 집중 복습 필요';}

function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();

</script>
</body>
