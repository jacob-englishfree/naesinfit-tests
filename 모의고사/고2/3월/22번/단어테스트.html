<script>
const EI={"subject":"2025 고2 3월 모의고사","pub":"22번","lesson":"글의 요지","title":"Commitment in Social Life","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_2025_g2_mar_22"};

const FULL_PASSAGE=`Commitment is the glue holding together characteristically human forms of social life. Commitments make individuals\u2019 behavior predictable in the face of fluctuations in their desires and interests, thereby facilitating the planning and coordination of joint actions involving multiple agents. Moreover, commitments make people willing to perform actions that they would not otherwise perform. For example, a taxi driver picks up his clients and transports them to their desired destination because they are committed to paying him afterwards for the service, and a construction worker performs her job every day because her employer has made a credible commitment to pay her at the end of the month. Indeed, the taxi driver and the construction worker are willing to accept money as payment only because a network of other agents (notably the central bank) is committed to taking various measures to sustain the currency in question. Thus, social objects and institutions such as jobs, money, government, scientific collaborations and marriage depend for their origin and stability upon the credibility of commitments.`;

const Q=[
{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`predictable — facilitating — credibility`,`unpredictable — facilitating — credibility`,`predictable — hindering — credibility`,`predictable — facilitating — fragility`,`unpredictable — hindering — fragility`],
passage:`Commitment is the glue holding together characteristically human forms of social life. Commitments make individuals\u2019 behavior <b>(A)</b> in the face of fluctuations in their desires and interests, thereby <b>(B)</b> the planning and coordination of joint actions involving multiple agents. Moreover, commitments make people willing to perform actions that they would not otherwise perform. For example, a taxi driver picks up his clients and transports them to their desired destination because they are committed to paying him afterwards for the service, and a construction worker performs her job every day because her employer has made a credible commitment to pay her at the end of the month. Indeed, the taxi driver and the construction worker are willing to accept money as payment only because a network of other agents (notably the central bank) is committed to taking various measures to sustain the currency in question. Thus, social objects and institutions such as jobs, money, government, scientific collaborations and marriage depend for their origin and stability upon the <b>(C)</b> of commitments.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`약속은 행동을 <b>예측 가능하게(predictable)</b> 만들어 공동 행동의 계획을 <b>촉진(facilitating)</b>하며, 사회 제도는 약속의 <b>신뢰성(credibility)</b>에 의존한다.`,
analysis:`✅ ① predictable — facilitating — credibility: 원문과 정확히 일치\n❌ ② unpredictable(예측 불가): predictable의 반의어\n❌ ③ hindering(방해하는): facilitating의 반의어\n❌ ④ fragility(취약성): credibility와 다름\n❌ ⑤ 세 단어 모두 반의어`,
tip:`predictable(예측 가능한)↔unpredictable(예측 불가), facilitating(촉진하는)↔hindering(방해하는), credibility(신뢰성)↔fragility(취약성)`}},

{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`fluctuations — committed — sustain`,`fluctuations — reluctant — sustain`,`stabilities — committed — sustain`,`fluctuations — committed — undermine`,`stabilities — reluctant — undermine`],
passage:`Commitments make individuals\u2019 behavior predictable in the face of <b>(A)</b> in their desires and interests, thereby facilitating the planning and coordination of joint actions involving multiple agents. Moreover, commitments make people willing to perform actions that they would not otherwise perform. For example, a taxi driver picks up his clients and transports them to their desired destination because they are <b>(B)</b> to paying him afterwards for the service. Indeed, the taxi driver and the construction worker are willing to accept money as payment only because a network of other agents (notably the central bank) is committed to taking various measures to <b>(C)</b> the currency in question.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`욕구의 <b>변동(fluctuations)</b> 속에서도 행동을 예측 가능하게 하고, 승객은 요금 지불에 <b>헌신(committed)</b>하며, 중앙은행은 화폐를 <b>유지(sustain)</b>하기 위해 조치를 취한다.`,
analysis:`✅ ① fluctuations — committed — sustain: 원문 일치\n❌ ② reluctant(꺼리는): committed의 반의어\n❌ ③ stabilities(안정): fluctuations의 반의어\n❌ ④ undermine(약화시키다): sustain의 반의어\n❌ ⑤ 부적절 조합`,
tip:`fluctuations(변동)↔stabilities(안정), committed(헌신한)↔reluctant(꺼리는), sustain(유지하다)↔undermine(약화시키다)`}},

{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Commitment is the glue ①<u>holding</u> together characteristically human forms of social life. Commitments make individuals\u2019 behavior ②<u>predictable</u> in the face of fluctuations in their desires and interests, thereby facilitating the planning and coordination of joint actions involving multiple agents. Moreover, commitments make people willing to perform actions that they would not otherwise perform. For example, a taxi driver picks up his clients and ③<u>transports</u> them to their desired destination because they are committed to paying him afterwards for the service, and a construction worker performs her job every day because her employer has made a ④<u>doubtful</u> commitment to pay her at the end of the month. Thus, social objects and institutions depend for their origin and ⑤<u>stability</u> upon the credibility of commitments.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`고용주가 월급을 지급하겠다는 <b>신뢰할 수 있는(credible)</b> 약속을 했다. ④ doubtful(의심스러운)은 credible의 반의어로 부적절.`,
analysis:`❌ ④ doubtful(의심스러운): 원문은 credible(신뢰할 수 있는) → 노동자가 일하려면 약속이 "신뢰"되어야 함\n✅ ① holding(잡아두는): 원문 일치\n✅ ② predictable(예측 가능한): 원문 일치\n✅ ③ transports(운송하다): 원문 일치\n✅ ⑤ stability(안정성): 원문 일치`,
tip:`credible(신뢰할 수 있는) ↔ doubtful(의심스러운) — 약속이 "신뢰"되어야 사회가 작동`}},

{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Commitment is the glue holding together characteristically human forms of social life. Commitments make individuals\u2019 behavior predictable in the face of ①<u>fluctuations</u> in their desires and interests, thereby ②<u>hindering</u> the planning and coordination of joint actions involving multiple agents. Moreover, commitments make people willing to ③<u>perform</u> actions that they would not otherwise perform. For example, a taxi driver picks up his clients and transports them to their desired ④<u>destination</u> because they are committed to paying him afterwards for the service. Thus, social objects and institutions depend for their origin and stability upon the ⑤<u>credibility</u> of commitments.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`약속은 공동 행동의 계획과 조정을 <b>촉진한다(facilitating)</b>. ② hindering(방해하는)은 facilitating의 반의어로 부적절.`,
analysis:`❌ ② hindering(방해하는): 원문은 facilitating(촉진하는) → 약속이 계획을 "방해"하면 논리와 반대\n✅ ① fluctuations(변동): 원문 일치\n✅ ③ perform(수행하다): 원문 일치\n✅ ④ destination(목적지): 원문 일치\n✅ ⑤ credibility(신뢰성): 원문 일치`,
tip:`facilitating(촉진하는) ↔ hindering(방해하는) — 약속은 계획을 "촉진"한다`}},

{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`dissolving`,`bonding`,`separating`,`weakening`],
passage:`Commitment is the <u>glue</u> holding together human forms of social life.`,
stem:`밑줄 친 <b>glue</b>의 의미와 가장 <b>가까운</b> 것은? (비유적 의미 기준)`,
det:{korean:`glue = 접착제 → 비유적으로 bonding(결합시키는 것)과 유사`,
analysis:`✅ ② bonding(결합): glue의 비유적 동의어\n❌ ① dissolving(녹이는): 반의어\n❌ ③ separating(분리하는): 반의어\n❌ ④ weakening(약화시키는): 반의어`,
tip:`glue = bond = cement = 접착제(비유: 결합시키는 것)`}},

{id:6,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`promoting`,`preventing`,`replacing`,`delaying`],
passage:`Thereby <u>facilitating</u> the planning and coordination of joint actions.`,
stem:`밑줄 친 <b>facilitating</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`facilitating = 촉진하는, promoting = 촉진하는 → 동의어`,
analysis:`✅ ① promoting(촉진하는): facilitating의 동의어\n❌ ② preventing(막는): 반의어\n❌ ③ replacing(대체하는): 다른 의미\n❌ ④ delaying(지연시키는): 반의어`,
tip:`facilitating = promoting = enabling = fostering = 촉진하는`}},

{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`constancies`,`agreements`,`variations`,`certainties`],
passage:`Commitments make behavior predictable in the face of <u>fluctuations</u>.`,
stem:`밑줄 친 <b>fluctuations</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`fluctuations = 변동, variations = 변화 → 동의어`,
analysis:`✅ ③ variations(변화): fluctuations의 동의어\n❌ ① constancies(불변): 반의어\n❌ ② agreements(합의): 다른 의미\n❌ ④ certainties(확실성): 반의어`,
tip:`fluctuations = variations = changes = shifts = 변동, 변화`}},

{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`trustworthiness`,`reliability`,`dependability`,`unreliability`],
passage:`Social objects depend upon the <u>credibility</u> of commitments.`,
stem:`밑줄 친 <b>credibility</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`credibility = 신뢰성 ↔ unreliability = 신뢰할 수 없음`,
analysis:`❌ ④ unreliability(신뢰 불가): credibility의 반의어 → 가장 먼 의미\n✅ ① trustworthiness(신뢰성): 동의어\n✅ ② reliability(신뢰성): 동의어\n✅ ③ dependability(의존 가능성): 동의어`,
tip:`credibility = trustworthiness = reliability(신뢰성) ↔ unreliability = distrust(불신)`}},

{id:9,type:`반의어 고르기`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`foreseeable`,`anticipated`,`erratic`,`expected`],
passage:`Commitments make individuals\u2019 behavior <u>predictable</u>.`,
stem:`밑줄 친 <b>predictable</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`predictable = 예측 가능한 ↔ erratic = 불규칙한, 예측 불가한`,
analysis:`❌ ③ erratic(불규칙한): predictable의 반의어 → 가장 먼 의미\n✅ ① foreseeable(예견할 수 있는): 동의어\n✅ ② anticipated(예상된): 동의어\n✅ ④ expected(예상되는): 동의어`,
tip:`predictable = foreseeable = anticipated(예측 가능한) ↔ erratic = unpredictable(예측 불가한)`}},

{id:10,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`separating`,`dissolving`,`holding`,`breaking`],
passage:`Commitment is the glue __________ together characteristically human forms of social life. Commitments make individuals\u2019 behavior predictable in the face of fluctuations in their desires and interests.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`약속은 사회생활을 <b>결합시키는(holding)</b> 접착제이다.`,
analysis:`✅ ③ holding(잡아두는): "the glue holding together"가 관용적 표현\n❌ ① separating(분리하는): 반의어\n❌ ② dissolving(녹이는): 반의어\n❌ ④ breaking(깨뜨리는): 반의어`,
tip:`the glue holding together = 결합시키는 접착제 — 비유적 표현`}},

{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`weaken`,`abandon`,`resist`,`sustain`],
passage:`The taxi driver and the construction worker are willing to accept money as payment only because a network of other agents (notably the central bank) is committed to taking various measures to __________ the currency in question.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`중앙은행이 화폐를 <b>유지(sustain)</b>하기 위해 다양한 조치를 취한다.`,
analysis:`✅ ④ sustain(유지하다): "the currency"와 자연스럽게 연결\n❌ ① weaken(약화시키다): 반의어\n❌ ② abandon(포기하다): 반의어\n❌ ③ resist(저항하다): 문맥과 무관`,
tip:`sustain the currency = 화폐를 유지하다 — sustain = maintain = preserve`}},

{id:12,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`credibility`,`flexibility`,`complexity`,`simplicity`],
passage:`Thus, social objects and institutions such as jobs, money, government, scientific collaborations and marriage depend for their origin and stability upon the __________ of commitments.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`사회 제도는 약속의 <b>신뢰성(credibility)</b>에 의존한다.`,
analysis:`✅ ① credibility(신뢰성): "credible commitment" 앞 문장과 연결, 약속이 신뢰받아야 사회가 작동\n❌ ② flexibility(유연성): 핵심이 아님\n❌ ③ complexity(복잡성): 무관\n❌ ④ simplicity(단순성): 무관`,
tip:`credibility of commitments = 약속의 신뢰성 — 사회 제도의 근간`}},

{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`직면하여, ~앞에서`,`얼굴`,`정면, 전면`,`대면하다`],
passage:`Commitments make behavior predictable in the <u>face</u> of fluctuations.`,
stem:`밑줄 친 <b>face</b>의 문맥적 의미로 가장 적절한 것은? ("in the face of"의 의미 기준)`,
det:{korean:`in the face of = ~에 직면하여, ~앞에서`,
analysis:`✅ ① 직면하여, ~앞에서: in the face of = ~에 직면하여\n❌ ② 얼굴: 기본 의미\n❌ ③ 정면: the face of the building\n❌ ④ 대면하다: face the truth`,
tip:`in the face of = ~에 직면하여 = despite = in spite of`}},

{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`돈, 화폐`,`통화, 화폐 체계`,`유통, 통용`,`현재의`],
passage:`A network of other agents is committed to sustain the <u>currency</u> in question.`,
stem:`밑줄 친 <b>currency</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`중앙은행이 유지하는 것 = <b>통화, 화폐 체계</b>`,
analysis:`✅ ② 통화, 화폐 체계: 중앙은행이 관리하는 대상\n❌ ① 돈: 구체적 물질이 아닌 체계\n❌ ③ 유통: currency of ideas 등\n❌ ④ 현재의: current와 혼동`,
tip:`currency: 통화(중앙은행이 관리) | gain currency = 널리 퍼지다 | current(현재의)와 구별`}},

{id:15,type:`영영풀이 매칭`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`predictable`,`credible`,`commitment`,`fluctuation`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"a pledge or promise to do something; dedication to a cause or activity"</b>`,
det:{korean:`'무언가를 하겠다는 맹세나 약속; 대의나 활동에 대한 헌신' → <b>commitment(약속, 헌신)</b>`,
analysis:`✅ ③ commitment: 영영 정의와 정확히 일치\n❌ ① predictable: 예측 가능한\n❌ ② credible: 신뢰할 수 있는\n❌ ④ fluctuation: 변동`,
tip:`commitment = pledge = promise = dedication → 약속, 헌신`}},

{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`commitment`,`credible`,`predictable`,`fluctuation`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"able to be believed; convincing and trustworthy"</b>`,
det:{korean:`'믿을 수 있는; 설득력 있고 신뢰할 만한' → <b>credible(신뢰할 수 있는)</b>`,
analysis:`✅ ② credible: 영영 정의와 일치\n❌ ① commitment: 약속, 헌신\n❌ ③ predictable: 예측 가능한\n❌ ④ fluctuation: 변동`,
tip:`credible = believable = convincing = trustworthy → 신뢰할 수 있는`}},

{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`predictable`,accept:[`predictable`,`Predictable`],
passage:`Commitments make individuals\u2019 behavior __________ (predict) in the face of fluctuations in their desires and interests.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`predict(동사) → <b>predictable(형용사)</b>: make + 목적어 + 형용사(보어) 구조`,
analysis:`predict(동사) → predictable(형용사)\nmake behavior predictable → 5형식: make + O + OC(형용사)`,
tip:`predict → predictable / rely → reliable — 동사 → -able 형용사화`}},

{id:18,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`stability`,accept:[`stability`,`Stability`],
passage:`Social objects and institutions depend for their origin and __________ (stable) upon the credibility of commitments.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`stable(형용사) → <b>stability(명사)</b>: origin and ________ → and 병렬로 명사 필요`,
analysis:`stable(형용사) → stability(명사)\norigin(명사) and ________(명사) → and 병렬 구조로 명사`,
tip:`stable → stability / able → ability — 형용사 → -ity 명사화 패턴`}},

{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`약속에 대한 신뢰가 사회 체계를 형성하고 지탱한다.`,`사회적 압력이 개인의 비자발적인 행동을 유도한다.`,`사회가 발전함에 따라 사회 제도가 더 복잡해진다.`,`사회 구성원들 간의 결속은 인위적으로 유지될 수 없다.`,`위험도에 따른 차등적 보상의 약속이 직업 선택의 기준이 된다.`],
passage:`Commitment is the glue holding together characteristically human forms of social life. Commitments make individuals\u2019 behavior predictable in the face of fluctuations in their desires and interests, thereby facilitating the planning and coordination of joint actions involving multiple agents. Moreover, commitments make people willing to perform actions that they would not otherwise perform. For example, a taxi driver picks up his clients and transports them to their desired destination because they are committed to paying him afterwards for the service, and a construction worker performs her job every day because her employer has made a credible commitment to pay her at the end of the month. Indeed, the taxi driver and the construction worker are willing to accept money as payment only because a network of other agents (notably the central bank) is committed to taking various measures to sustain the currency in question. Thus, social objects and institutions such as jobs, money, government, scientific collaborations and marriage depend for their origin and stability upon the credibility of commitments.`,
stem:`다음 글의 요지로 가장 적절한 것은?`,
det:{korean:`직업, 돈, 정부 등 사회 제도는 <b>약속의 신뢰성에 의존</b>한다 → 약속에 대한 신뢰가 사회를 지탱.`,
analysis:`✅ ① 약속에 대한 신뢰가 사회 체계를 형성하고 지탱한다: "depend ... upon the credibility of commitments"\n❌ ② 사회적 압력: 압력이 아닌 자발적 약속\n❌ ③ 복잡해진다: 복잡성이 주제가 아님\n❌ ④ 인위적 불가: 약속으로 가능\n❌ ⑤ 차등적 보상: 핵심이 아님`,
tip:`요지: commitment = glue of social life + credibility → 약속의 신뢰성이 사회의 근간`}},

{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`사회 제도는 개인의 이익 추구와 무관하게 존재한다.`,`약속과 헌신이 없으면 직업, 돈, 정부 같은 사회 제도가 유지될 수 없다.`,`화폐 가치는 오직 중앙은행의 결정에 의해서만 결정된다.`,`택시 기사와 건설 노동자는 약속 없이도 일할 동기가 있다.`,`사회적 협력은 개인의 도덕성에만 의존한다.`],
passage:`Commitment is the glue holding together characteristically human forms of social life. Commitments make individuals\u2019 behavior predictable in the face of fluctuations in their desires and interests, thereby facilitating the planning and coordination of joint actions involving multiple agents. Moreover, commitments make people willing to perform actions that they would not otherwise perform. For example, a taxi driver picks up his clients and transports them to their desired destination because they are committed to paying him afterwards for the service, and a construction worker performs her job every day because her employer has made a credible commitment to pay her at the end of the month. Indeed, the taxi driver and the construction worker are willing to accept money as payment only because a network of other agents (notably the central bank) is committed to taking various measures to sustain the currency in question. Thus, social objects and institutions such as jobs, money, government, scientific collaborations and marriage depend for their origin and stability upon the credibility of commitments.`,
stem:`다음 글의 핵심 내용으로 가장 적절한 것은?`,
det:{korean:`<b>약속과 헌신이 없으면</b> 직업, 돈, 정부 같은 사회 제도가 <b>유지될 수 없다</b>.`,
analysis:`✅ ② 약속 없이는 사회 제도 유지 불가: "commitment is the glue" + "depend upon the credibility"\n❌ ① 이익 추구와 무관: 이익과 연결됨 (택시비, 월급)\n❌ ③ 오직 중앙은행: 하나의 예시일 뿐\n❌ ④ 동기가 있다: 약속 없이는 "would not otherwise perform"\n❌ ⑤ 도덕성: 약속/신뢰성이 핵심, 도덕성 아님`,
tip:`commitment is the glue → 약속 없으면 사회가 해체 = 핵심 내용`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch?(d.q.ch.length===5?'①②③④⑤':'①②③④'):'';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인단어 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
