.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0f0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:#EDE7F6;color:var(--o);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--oxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0c8dc;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--o);color:var(--o);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #d8d0e8;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FAFBFF;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F3F0FF;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:#EDE7F6;color:var(--o);}.expl-tag.tip{background:var(--oxl);color:var(--od);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--o);}.expl-box.tip-b{border-left:3px solid var(--o);background:var(--oxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

<script>
const EI={"subject":"2025 고2 3월 모의고사","pub":"40번","lesson":"요약문","title":"Language Borrowing","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_2025_g2_mar_40_v1"};

const FULL_PASSAGE=`Quite often the interaction between groups is socially unequal, and this is reflected in the fact that in many cases borrowing of words or constructions goes mostly or entirely in one direction, from the more powerful or prestigious group to the less favored one. The languages of socially subordinated groups may from quite an early period of contact provide terminology for objects or practices with which speakers of the more powerful group were previously unfamiliar, but the effects of contact in that direction may not progress any further than this. In some cases, as with the Dharug language of Sydney, Australia, the source of some of the earliest loans from Indigenous Australian languages into English, the fate of the language system is extinction after the obliteration of many of its speakers. The remainder shifted to varieties of English, the language of the people who had suppressed them.`;

const Q=[

{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`prestigious — subordinated — obliteration`,`modest — subordinated — obliteration`,`prestigious — dominant — obliteration`,`prestigious — subordinated — preservation`,`modest — dominant — preservation`],
passage:`... from the more powerful or <b>(A)</b> group to the less favored one. The languages of socially <b>(B)</b> groups may provide terminology... the fate of the language system is extinction after the <b>(C)</b> of many of its speakers.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`더 강력하거나 <b>명망 있는(prestigious)</b> 집단에서, 사회적으로 <b>종속된(subordinated)</b> 집단의 언어는 화자들의 <b>말살(obliteration)</b> 후 소멸한다.`,
analysis:`✅ ① prestigious — subordinated — obliteration: 원문 일치\n❌ ② modest(겸손한): prestigious의 반의어\n❌ ③ dominant(지배적): subordinated의 반의어\n❌ ④ preservation(보존): obliteration의 반의어\n❌ ⑤ 모두 부적절`,
tip:`prestigious(명망)↔modest(겸손), subordinated(종속)↔dominant(지배), obliteration(말살)↔preservation(보존)`}},

{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`unequal — extinction — suppressed`,`equal — extinction — suppressed`,`unequal — survival — suppressed`,`unequal — extinction — supported`,`equal — survival — supported`],
passage:`The interaction between groups is socially <b>(A)</b>... the fate of the language system is <b>(B)</b>... the language of the people who had <b>(C)</b> them.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`집단 간 상호작용은 사회적으로 <b>불평등(unequal)</b>하고, 언어 체계의 운명은 <b>소멸(extinction)</b>이며, 그들을 <b>억압했던(suppressed)</b> 사람들의 언어로 전환한다.`,
analysis:`✅ ① unequal — extinction — suppressed: 원문 일치\n❌ ② equal: 반의어\n❌ ③ survival: 반의어\n❌ ④ supported: 반의어\n❌ ⑤ 모두 부적절`,
tip:`unequal(불평등)↔equal(평등), extinction(소멸)↔survival(생존), suppressed(억압)↔supported(지지)`}},

{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`The interaction between groups is socially ①<u>unequal</u>. In many cases borrowing of words goes mostly in one direction, from the more powerful or ②<u>prestigious</u> group to the less favored one. The languages of socially ③<u>subordinated</u> groups may provide terminology. The fate of the language system is ④<u>survival</u> after the obliteration of many of its speakers. The remainder shifted to varieties of English, the language of the people who had ⑤<u>suppressed</u> them.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`화자들의 말살 후 언어 체계의 운명은 <b>소멸(extinction)</b>이다. ④ survival(생존)은 extinction의 반의어로 부적절.`,
analysis:`❌ ④ survival(생존): 원문은 extinction(소멸) → 화자 말살 후 언어도 소멸\n✅ ①②③⑤ 원문 일치`,
tip:`extinction(소멸) ↔ survival(생존)`}},

{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`The interaction between groups is socially ①<u>unequal</u>. In many cases borrowing of words goes mostly in one ②<u>direction</u>, from the more powerful group to the less ③<u>privileged</u> one. The languages of socially subordinated groups may provide terminology for objects with which speakers of the more powerful group were previously ④<u>familiar</u>. The remainder shifted to varieties of English, the language of the people who had ⑤<u>suppressed</u> them.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`강력한 집단의 화자들이 이전에 <b>익숙하지 않았던(unfamiliar)</b> 대상. ④ familiar(익숙한)는 unfamiliar의 반의어로 부적절.`,
analysis:`❌ ④ familiar(익숙한): 원문은 unfamiliar(익숙하지 않은) → 처음 접하는 대상\n✅ ①②③⑤ 원문 일치`,
tip:`unfamiliar(익숙하지 않은) ↔ familiar(익숙한)`}},

{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`humble`,`respected`,`ordinary`,`poor`],
passage:`... from the more powerful or <u>prestigious</u> group to the less favored one.`,
stem:`밑줄 친 <b>prestigious</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`prestigious = 명망 있는, respected = 존경받는 → 유사`,
analysis:`✅ ② respected: prestigious의 동의어\n❌ ① humble: 반의어\n❌ ③ ordinary: 다른 의미\n❌ ④ poor: 다른 의미`,
tip:`prestigious = respected = renowned = 명망 있는`}},

{id:6,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`dominant`,`independent`,`dependent`,`autonomous`],
passage:`The languages of socially <u>subordinated</u> groups may provide terminology.`,
stem:`밑줄 친 <b>subordinated</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`subordinated = 종속된, dependent = 의존적인 → 유사`,
analysis:`✅ ③ dependent(의존적인): subordinated의 유사어\n❌ ① dominant(지배적): 반의어\n❌ ② independent(독립적): 반의어\n❌ ④ autonomous(자율적): 반의어`,
tip:`subordinated = dependent = inferior(종속된) ↔ dominant = independent(지배적, 독립적)`}},

{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`liberation`,`celebration`,`destruction`,`creation`],
passage:`The fate of the language system is extinction after the <u>obliteration</u> of many of its speakers.`,
stem:`밑줄 친 <b>obliteration</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`obliteration = 말살, destruction = 파괴 → 유사`,
analysis:`✅ ③ destruction(파괴): obliteration의 동의어\n❌ ① liberation(해방): 다른 의미\n❌ ② celebration(축하): 다른 의미\n❌ ④ creation(창조): 반의어`,
tip:`obliteration = destruction = annihilation = 말살, 파괴`}},

{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`disappearance`,`loss`,`death`,`survival`],
passage:`The fate of the language system is <u>extinction</u>.`,
stem:`밑줄 친 <b>extinction</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`extinction = 소멸 ↔ survival = 생존`,
analysis:`❌ ④ survival(생존): extinction의 반의어\n✅ ① disappearance: 유사어\n✅ ② loss: 유사어\n✅ ③ death: 유사어`,
tip:`extinction = disappearance = death(소멸) ↔ survival = preservation(생존, 보존)`}},

{id:9,type:`반의어 고르기`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`oppressed`,`dominated`,`liberated`,`crushed`],
passage:`The language of the people who had <u>suppressed</u> them.`,
stem:`밑줄 친 <b>suppressed</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`suppressed = 억압한 ↔ liberated = 해방시킨`,
analysis:`❌ ③ liberated(해방시킨): suppressed의 반의어\n✅ ① oppressed: 유사어\n✅ ② dominated: 유사어\n✅ ④ crushed: 유사어`,
tip:`suppressed = oppressed = dominated(억압) ↔ liberated = freed(해방)`}},

{id:10,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`survival`,`growth`,`extinction`,`revival`],
passage:`The fate of the language system is __________ after the obliteration of many of its speakers.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`화자들의 말살 후 언어의 운명은 <b>소멸(extinction)</b>이다.`,
analysis:`✅ ③ extinction: "obliteration of speakers" → 언어 소멸\n❌ ① survival: 반대\n❌ ② growth: 반대\n❌ ④ revival: 반대`,
tip:`obliteration(말살) → extinction(소멸)`}},

{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`supported`,`encouraged`,`protected`,`suppressed`],
passage:`The remainder shifted to varieties of English, the language of the people who had __________ them.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`그들을 <b>억압했던(suppressed)</b> 사람들의 언어로 전환했다.`,
analysis:`✅ ④ suppressed: "shifted to... the language of the people who had __" → 억압자의 언어로 전환\n❌ ①②③ 모두 긍정적 의미로 문맥과 반대`,
tip:`suppress = 억압하다 — 종속 집단이 억압자의 언어를 채택`}},

{id:12,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`unequal`,`balanced`,`fair`,`harmonious`],
passage:`Quite often the interaction between groups is socially __________, and this is reflected in the fact that in many cases borrowing of words goes mostly in one direction.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`집단 간 상호작용은 사회적으로 <b>불평등(unequal)</b>하다.`,
analysis:`✅ ① unequal: "in one direction"과 연결 → 불평등\n❌ ②③④ 평등/공정/조화 → "one direction"과 모순`,
tip:`unequal → one direction: 불평등 → 한 방향으로만`}},

{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`운명을 믿다`,`숙명`,`운명, 결과`,`요금`],
passage:`The <u>fate</u> of the language system is extinction.`,
stem:`밑줄 친 <b>fate</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`fate = 언어 체계의 <b>운명, 결과</b>`,
analysis:`✅ ③ 운명, 결과: the fate of = ~의 운명\n❌ ① 운명을 믿다: 다른 용법\n❌ ② 숙명: 유사하나 ③이 더 정확\n❌ ④ 요금: fare와 혼동`,
tip:`fate: 운명, 결과 | fare: 요금 — 혼동 주의`}},

{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`교대, 근무 시간`,`이동하다`,`전환하다`,`옮기다`],
passage:`The remainder <u>shifted</u> to varieties of English.`,
stem:`밑줄 친 <b>shifted</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`shifted to = ~로 <b>전환하다</b>`,
analysis:`✅ ③ 전환하다: shift to = ~로 바꾸다/전환하다\n❌ ① 교대: work shift\n❌ ② 이동하다: 물리적 이동\n❌ ④ 옮기다: 다른 의미`,
tip:`shift to: 전환하다(언어, 방향 등) | shift(명사): 교대, 변화`}},

{id:15,type:`영영풀이 매칭`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`extinction`,`suppression`,`obliteration`,`subordination`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"the complete destruction or elimination of something so that nothing remains"</b>`,
det:{korean:`'아무것도 남지 않도록 완전히 파괴하거나 제거하는 것' → <b>obliteration(말살)</b>`,
analysis:`✅ ③ obliteration: 영영 정의와 일치\n❌ ① extinction: 소멸(종의 멸종)\n❌ ② suppression: 억압\n❌ ④ subordination: 종속`,
tip:`obliteration = complete destruction = 완전한 파괴/말살`}},

{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`obliteration`,`subordination`,`prestigious`,`extinction`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"the state of no longer existing; the dying out of a species or language"</b>`,
det:{korean:`'더 이상 존재하지 않는 상태; 종이나 언어의 소멸' → <b>extinction(소멸)</b>`,
analysis:`✅ ④ extinction: 영영 정의와 일치\n❌ ① obliteration: 완전한 파괴\n❌ ② subordination: 종속\n❌ ③ prestigious: 명망 있는`,
tip:`extinction = dying out = 소멸, 멸종`}},

{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`socially`,accept:[`socially`,`Socially`],
passage:`The interaction between groups is __________ (social) unequal.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`social(형용사) → <b>socially(부사)</b>: 형용사 unequal을 수식하는 부사 필요`,
analysis:`social → socially(부사)\n형용사 unequal 수식 → 부사`,
tip:`social → socially — 부사화`}},

{id:18,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`unfamiliar`,accept:[`unfamiliar`,`Unfamiliar`],
passage:`Speakers of the more powerful group were previously __________ (familiar) with these objects.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 문맥에 맞게 변형하여 쓰시오. (필요시 접두사 추가)`,
det:{korean:`familiar → <b>unfamiliar</b>: "previously"와 함께 이전에 익숙하지 않았음을 나타냄`,
analysis:`familiar → unfamiliar (접두사 un- 추가)\n강력한 집단이 종속 집단의 대상에 익숙하지 않았음`,
tip:`un- + familiar = unfamiliar — 접두사로 반의어 형성`}},

{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`언어 차용은 양 방향으로 균등하게 일어난다.`,`종속 집단의 언어가 지배 집단의 언어를 대체한다.`,`사회적 불평등은 언어 차용의 방향과 언어 소멸에 영향을 미친다.`,`모든 언어는 동등하게 보존된다.`,`영어는 다른 언어에서 차용하지 않는다.`],
passage:FULL_PASSAGE,
stem:`다음 글의 주제로 가장 적절한 것은?`,
det:{korean:`사회적 불평등이 언어 차용의 방향(한쪽 방향)과 종속 언어의 소멸에 영향을 미친다.`,
analysis:`✅ ③ 사회적 불평등 → 언어 차용 방향 + 소멸\n❌ ①④ 원문과 반대\n❌ ② 원문과 반대\n❌ ⑤ Dharug 차용 예시와 모순`,
tip:`주제: social inequality → one-direction borrowing → language extinction`}},

{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`inequality — vanish`,`inequality — prevail`,`integration — vanish`,`variety — prosper`,`coordination — disappear`],
passage:`Language borrowing from dominant to subordinate groups reflects social ______(A)______, where the language systems of the latter often ______(B)______ even though they may have provided some terms, as exemplified by Dharug in Australia.`,
stem:`요약문의 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`사회적 <b>불평등(inequality)</b>을 반영하며, 종속 집단의 언어는 소멸하지만... 원문 정답 1번. 요약문에서 후자(the latter)의 언어가 prevail(우세하다)이 아니라 vanish해야 맞지만 보기를 다시 확인.\n\n수정: 정답은 ① inequality — vanish`,
analysis:`✅ ① inequality — vanish: 사회적 불평등 + 언어 소멸\n❌ ② prevail(우세하다): 종속 언어가 우세할 수 없음\n❌ ③④⑤ 부적절`,
tip:`inequality(불평등) + vanish(사라지다) = 사회적 불평등으로 종속 언어 소멸`}}

];

let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법':'tag-grammar','내용이해':'tag-content','빈칸추론':'tag-blank','서술형':'tag-written','T/F':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:#EDE7F6;color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:#EDE7F6;color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인워크북 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
