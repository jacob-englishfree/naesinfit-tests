<script>
const EI={"subject":"2025 고2 3월 모의고사","pub":"23번","lesson":"글의 주제","title":"Recall vs Recognition in Memory","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g2_mar_23"};

const FULL_PASSAGE=`If the brain has already stored someone's face and name, why do we still end up remembering one and not the other? This is because the brain has something of a two-tier memory system at work when it comes to retrieving memories, and this gives rise to a common yet infuriating sensation: recognising someone, but not being able to remember how or why, or what their name is. This happens because the brain differentiates between familiarity and recall. To clarify, familiarity (or recognition) is when you encounter someone or something and you know you've done so before. But beyond that, you've got nothing; all you can say is this person/thing is already in your memories. Recall is when you can access the original memory of how and why you know this person; recognition is just flagging up the fact that the memory exists.`;

const Q=[
{id:1,type:`어순배열`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`retrieving — differentiates — recognition`,`storing — differentiates — recognition`,`retrieving — combines — recognition`,`retrieving — differentiates — creation`,`storing — combines — creation`],
passage:`If the brain has already stored someone's face and name, why do we still end up remembering one and not the other? This is because the brain has something of a two-tier memory system at work when it comes to <b>(A)</b> memories, and this gives rise to a common yet infuriating sensation: recognising someone, but not being able to remember how or why, or what their name is. This happens because the brain <b>(B)</b> between familiarity and recall. To clarify, familiarity (or <b>(C)</b>) is when you encounter someone or something and you know you've done so before.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`기억을 <b>인출(retrieving)</b>할 때 뇌는 친숙함과 회상을 <b>구별(differentiates)</b>하며, 친숙함은 <b>인식(recognition)</b>이라고도 한다.`,
analysis:`✅ ① retrieving — differentiates — recognition: 원문과 정확히 일치<br>❌ ② storing(저장): retrieving의 반의어<br>❌ ③ combines(결합): differentiates의 반의어<br>❌ ④ creation(창조): recognition과 다름<br>❌ ⑤ 세 단어 모두 반의어`,
tip:`retrieving(인출)↔storing(저장), differentiates(구별)↔combines(결합), recognition(인식)↔creation(창조)`}},

{id:2,type:`문장삽입`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`infuriating — familiarity — encounter`,`pleasant — familiarity — encounter`,`infuriating — strangeness — encounter`,`infuriating — familiarity — forget`,`pleasant — strangeness — forget`],
passage:`The brain has something of a two-tier memory system at work when it comes to retrieving memories, and this gives rise to a common yet <b>(A)</b> sensation: recognising someone, but not being able to remember how or why, or what their name is. This happens because the brain differentiates between <b>(B)</b> and recall. To clarify, familiarity (or recognition) is when you <b>(C)</b> someone or something and you know you've done so before.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`이것은 <b>짜증나는(infuriating)</b> 감각을 일으키며, 뇌는 <b>친숙함(familiarity)</b>과 회상을 구별하고, 친숙함은 누군가를 <b>마주칠(encounter)</b> 때 느끼는 것이다.`,
analysis:`✅ ① infuriating — familiarity — encounter: 원문 일치<br>❌ ② pleasant(즐거운): infuriating의 반의어<br>❌ ③ strangeness(낯섦): familiarity의 반의어<br>❌ ④ forget(잊다): encounter의 반의어<br>❌ ⑤ 세 단어 모두 반의어`,
tip:`infuriating(짜증나는)↔pleasant(즐거운), familiarity(친숙함)↔strangeness(낯섦), encounter(마주치다)↔forget(잊다)`}},

{id:3,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`If the brain has already ①<u>stored</u> someone's face and name, why do we still end up remembering one and not the other? This is because the brain has something of a ②<u>two-tier</u> memory system at work when it comes to retrieving memories, and this gives rise to a common yet infuriating sensation: recognising someone, but not being able to remember how or why, or what their name is. This happens because the brain ③<u>differentiates</u> between familiarity and recall. To clarify, familiarity (or recognition) is when you encounter someone or something and you know you've done so before. But beyond that, you've got nothing; all you can say is this person/thing is already in your memories. Recall is when you can ④<u>erase</u> the original memory of how and why you know this person; recognition is just ⑤<u>flagging up</u> the fact that the memory exists.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`회상(Recall)은 원래의 기억에 <b>접근(access)</b>할 수 있는 것이다. ④ erase(지우다)는 access의 반의어로 부적절.`,
analysis:`❌ ④ erase(지우다): 원문은 access(접근하다) → 기억을 "지우는" 것이 아니라 "접근"하는 것<br>✅ ① stored(저장한): 원문 일치<br>✅ ② two-tier(2단계의): 원문 일치<br>✅ ③ differentiates(구별한다): 원문 일치<br>✅ ⑤ flagging up(표시하는): 원문 일치`,
tip:`access(접근하다) ↔ erase(지우다) — 회상은 기억에 "접근"하는 것이지 "지우는" 것이 아님`}},

{id:4,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`If the brain has already stored someone's face and name, why do we still end up remembering one and not the other? This is because the brain has something of a two-tier memory system at work when it comes to ①<u>retrieving</u> memories, and this gives rise to a common yet ②<u>delightful</u> sensation: recognising someone, but not being able to remember how or why, or what their name is. This happens because the brain ③<u>differentiates</u> between familiarity and recall. To clarify, familiarity (or recognition) is when you ④<u>encounter</u> someone or something and you know you've done so before. Recall is when you can access the original memory; recognition is just ⑤<u>flagging up</u> the fact that the memory exists.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`얼굴은 알겠는데 이름이 생각나지 않는 것은 <b>짜증나는(infuriating)</b> 감각이다. ② delightful(즐거운)은 infuriating의 반의어로 부적절.`,
analysis:`❌ ② delightful(즐거운): 원문은 infuriating(짜증나는) → 이름이 생각나지 않는 것은 "즐거운" 것이 아님<br>✅ ① retrieving(인출하는): 원문 일치<br>✅ ③ differentiates(구별한다): 원문 일치<br>✅ ④ encounter(마주치다): 원문 일치<br>✅ ⑤ flagging up(표시하는): 원문 일치`,
tip:`infuriating(짜증나는) ↔ delightful(즐거운) — 이름 기억 실패는 "짜증"나는 경험`}},

{id:5,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`recovering`,`storing`,`deleting`,`creating`,`해당 사항 없음`] it comes to <u>retrieving</u> memories.`,
stem:`밑줄 친 <b>retrieving</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`retrieving = 인출하는, 되찾는, recovering = 회복하는/되찾는 → 동의어`,
analysis:`✅ ① recovering(되찾는): retrieving의 동의어<br>❌ ② storing(저장하는): 반의어<br>❌ ③ deleting(삭제하는): 반의어<br>❌ ④ creating(만드는): 다른 의미`,
tip:`retrieving = recovering = recalling = fetching = 인출하는, 되찾는`}},

{id:6,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`distinguishes`,`merges`,`ignores`,`strengthens`,`해당 사항 없음`]en familiarity and recall.`,
stem:`밑줄 친 <b>differentiates</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`differentiates = 구별한다, distinguishes = 구별한다 → 동의어`,
analysis:`✅ ① distinguishes(구별한다): differentiates의 동의어<br>❌ ② merges(합친다): 반의어<br>❌ ③ ignores(무시한다): 다른 의미<br>❌ ④ strengthens(강화한다): 다른 의미`,
tip:`differentiates = distinguishes = tells apart = discriminates = 구별한다`}},

{id:7,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`calming`,`boring`,`maddening`,`satisfying`,`해당 사항 없음`]tion.`,
stem:`밑줄 친 <b>infuriating</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`infuriating = 몹시 짜증나는, maddening = 미칠 듯이 화나는 → 동의어`,
analysis:`✅ ③ maddening(미칠 듯이 화나는): infuriating의 동의어<br>❌ ① calming(진정시키는): 반의어<br>❌ ② boring(지루한): 다른 의미<br>❌ ④ satisfying(만족스러운): 반의어`,
tip:`infuriating = maddening = exasperating = frustrating = 몹시 짜증나는`}},

{id:8,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`acquaintance`,`closeness`,`awareness`,`novelty`,`해당 사항 없음`]amiliarity</u> and recall.`,
stem:`밑줄 친 <b>familiarity</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`familiarity = 친숙함 ↔ novelty = 새로움, 신선함`,
analysis:`❌ ④ novelty(새로움): familiarity의 반의어 → 가장 먼 의미<br>✅ ① acquaintance(아는 것): 유사어<br>✅ ② closeness(친밀함): 유사어<br>✅ ③ awareness(인식): 유사어`,
tip:`familiarity = acquaintance = closeness(친숙함) ↔ novelty = strangeness(새로움, 낯섦)`}},

{id:9,type:`어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`recollection`,`remembrance`,`oblivion`,`reminiscence`,`해당 사항 없음`]he original memory.`,
stem:`밑줄 친 <b>Recall</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`recall = 회상 ↔ oblivion = 망각`,
analysis:`❌ ③ oblivion(망각): recall의 반의어 → 가장 먼 의미<br>✅ ① recollection(회상): 동의어<br>✅ ② remembrance(기억): 동의어<br>✅ ④ reminiscence(회고): 유사어`,
tip:`recall = recollection = remembrance(회상) ↔ oblivion = forgetfulness(망각)`}},

{id:10,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`combining`,`storing`,`retrieving`,`creating`,`obligation`]of a two-tier memory system at work when it comes to __________ memories, and this gives rise to a common yet infuriating sensation: recognising someone, but not being able to remember how or why.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`기억을 <b>인출(retrieving)</b>할 때 2단계 시스템이 작동한다.`,
analysis:`✅ ③ retrieving(인출하는): 기억을 끄집어내는 과정<br>❌ ① combining(결합하는): 무관<br>❌ ② storing(저장하는): 반대 과정<br>❌ ④ creating(만드는): 무관`,
tip:`retrieving memories = 기억을 인출하다 — 저장이 아닌 인출 과정의 문제`}},

{id:11,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`combines`,`confuses`,`ignores`,`differentiates`,`obligation`]_ between familiarity and recall. To clarify, familiarity (or recognition) is when you encounter someone and you know you've done so before. Recall is when you can access the original memory.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`뇌는 친숙함과 회상을 <b>구별한다(differentiates)</b>.`,
analysis:`✅ ④ differentiates(구별한다): "between familiarity and recall"과 자연스럽게 연결<br>❌ ① combines(결합한다): 반의어<br>❌ ② confuses(혼동한다): 반의어적<br>❌ ③ ignores(무시한다): 문맥과 반대`,
tip:`differentiates between A and B = A와 B를 구별한다`}},

{id:12,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`encounter`,`forget`,`avoid`,`imagine`,`obligation`]__________ someone or something and you know you've done so before. But beyond that, you've got nothing; all you can say is this person/thing is already in your memories.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`친숙함은 누군가를 <b>마주칠(encounter)</b> 때 이전에 만난 적이 있다고 느끼는 것이다.`,
analysis:`✅ ① encounter(마주치다): 이전 경험이 있는 사람/사물을 만났을 때<br>❌ ② forget(잊다): 반의어<br>❌ ③ avoid(피하다): 문맥과 반대<br>❌ ④ imagine(상상하다): 실제 만남이 아님`,
tip:`encounter = come across = meet = run into = 마주치다`}},

{id:13,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`(비유) 떠오르다`,`구별하다, 구분하다`,`(수학) 미분하다`,`차이를 만들다`,`글의 세부 내용과 일치하지 않는 진술이다`]familiarity and recall.`,
stem:`밑줄 친 <b>differentiates</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`differentiates between = <b>구별하다, 구분하다</b>`,
analysis:`✅ ② 구별하다, 구분하다: differentiate between A and B = A와 B를 구별하다<br>❌ ① 떠오르다: 다른 동사<br>❌ ③ 미분하다: 수학 용어<br>❌ ④ 차이를 만들다: 다른 용법`,
tip:`differentiate between = distinguish between = tell apart = 구별하다`}},

{id:14,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`접근, 입장`,`이용권, 접속`,`접근하다, 열람하다`,`출입구`,`글의 세부 내용과 일치하지 않는 진술이다`] original memory.`,
stem:`밑줄 친 <b>access</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`access the original memory = 원래 기억에 <b>접근하다</b>`,
analysis:`✅ ③ 접근하다, 열람하다: access + 목적어 = ~에 접근하다 (동사)<br>❌ ① 접근, 입장: 명사적 의미<br>❌ ② 이용권: 명사적 의미<br>❌ ④ 출입구: 명사적 의미`,
tip:`access(동사): ~에 접근하다 | access(명사): 접근, 입장 | have access to = ~에 접근하다`}},

{id:15,type:`어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`recall`,`recognition`,`familiarity`,`memory`,`해당 사항 없음`]<br><b>"the state of knowing someone or something well, through experience or close association"</b>`,
det:{korean:`'경험이나 밀접한 관계를 통해 누군가나 무언가를 잘 아는 상태' → <b>familiarity(친숙함)</b>`,
analysis:`✅ ③ familiarity: 영영 정의와 정확히 일치<br>❌ ① recall: 회상 (더 구체적인 기억 접근)<br>❌ ② recognition: 인식 (familiarity의 하위 개념)<br>❌ ④ memory: 기억 (더 넓은 개념)`,
tip:`familiarity = knowing something well through experience → 친숙함`}},

{id:16,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`infuriating`,`familiar`,`memorable`,`forgetful`,`해당 사항 없음`]n<br><b>"extremely annoying; making one feel very angry"</b>`,
det:{korean:`'극도로 짜증나는; 매우 화나게 하는' → <b>infuriating(몹시 짜증나는)</b>`,
analysis:`✅ ① infuriating: 영영 정의와 일치<br>❌ ② familiar: 친숙한<br>❌ ③ memorable: 기억에 남는<br>❌ ④ forgetful: 잘 잊는`,
tip:`infuriating = extremely annoying = exasperating → 몹시 짜증나는`}},

{id:17,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`familiarity`,accept:[`familiarity`,`Familiarity`],
passage:`This happens because the brain differentiates between __________ (familiar) and recall.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`familiar(형용사) → <b>familiarity(명사)</b>: between + 명사 + and + 명사 구조`,
analysis:`familiar(형용사) → familiarity(명사)<br>between familiarity and recall → 전치사 뒤에 명사`,
tip:`familiar → familiarity / popular → popularity — 형용사 → -ity 명사화`}},

{id:18,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`recognition`,accept:[`recognition`,`Recognition`],
passage:`To clarify, familiarity (or __________ (recognize)) is when you encounter someone or something and you know you've done so before.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`recognize(동사) → <b>recognition(명사)</b>: or 뒤에 familiarity와 동격인 명사 필요`,
analysis:`recognize(동사) → recognition(명사)<br>familiarity (or recognition) → 동격 관계로 명사`,
tip:`recognize → recognition / organize → organization — -ize → -ition/-ization 명사화`}},

{id:19,type:`내용이해`,diff:`어려움`,pts:6,fmt:"mc",ans:4,
ch:[`process of recalling details from partial memories`,`impact of emotional responses on memory retrieval patterns`,`dangers of memory loss regarding face and name recognition`,`ways to manage the difficulty of recognising faces and names`,`distinction between recall and familiarity in the memory system`],
passage:`If the brain has already stored someone's face and name, why do we still end up remembering one and not the other? This is because the brain has something of a two-tier memory system at work when it comes to retrieving memories, and this gives rise to a common yet infuriating sensation: recognising someone, but not being able to remember how or why, or what their name is. This happens because the brain differentiates between familiarity and recall. To clarify, familiarity (or recognition) is when you encounter someone or something and you know you've done so before. But beyond that, you've got nothing; all you can say is this person/thing is already in your memories. Recall is when you can access the original memory of how and why you know this person; recognition is just flagging up the fact that the memory exists.`,
stem:`다음 글의 주제로 가장 적절한 것은?`,
det:{korean:`기억 체계에서 <b>회상(recall)과 친숙함(familiarity)의 구별</b>이 핵심 주제.`,
analysis:`✅ ⑤ distinction between recall and familiarity in the memory system: 글 전체가 이 구별을 설명<br>❌ ① partial memories: 부분 기억이 아닌 전체 시스템<br>❌ ② emotional responses: 감정 반응이 주제가 아님<br>❌ ③ memory loss: 기억 상실이 아닌 기억 구분<br>❌ ④ managing difficulty: 관리 방법이 아님`,
tip:`주제: familiarity vs recall = 친숙함 vs 회상 — 2단계 기억 시스템의 핵심 구별`}},

{id:20,type:`내용이해`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`뇌는 얼굴과 이름을 항상 동시에 기억한다.`,`뇌는 친숙함(인식)과 회상을 구별하며, 인식은 기억의 존재만 알려주고 회상은 구체적 기억에 접근하는 것이다.`,`기억력이 좋은 사람은 친숙함과 회상을 동시에 사용할 수 있다.`,`이름을 기억하지 못하는 것은 뇌의 결함 때문이다.`,`친숙함은 회상보다 더 정확한 기억 형태이다.`],
passage:`If the brain has already stored someone's face and name, why do we still end up remembering one and not the other? This is because the brain has something of a two-tier memory system at work when it comes to retrieving memories, and this gives rise to a common yet infuriating sensation: recognising someone, but not being able to remember how or why, or what their name is. This happens because the brain differentiates between familiarity and recall. To clarify, familiarity (or recognition) is when you encounter someone or something and you know you've done so before. But beyond that, you've got nothing; all you can say is this person/thing is already in your memories. Recall is when you can access the original memory of how and why you know this person; recognition is just flagging up the fact that the memory exists.`,
stem:`다음 글의 핵심 내용으로 가장 적절한 것은?`,
det:{korean:`뇌는 <b>친숙함(인식)</b>과 <b>회상</b>을 구별하며, 인식은 기억의 존재를 알려주고 회상은 구체적 기억에 접근하는 것이다.`,
analysis:`✅ ② 뇌는 친숙함과 회상을 구별: "differentiates between familiarity and recall"이 핵심<br>❌ ① 동시에 기억: 그렇지 않다고 설명<br>❌ ③ 동시 사용: 2단계가 분리되어 작동<br>❌ ④ 뇌의 결함: 정상적 시스템의 특성<br>❌ ⑤ 더 정확: 친숙함은 덜 구체적`,
tip:`핵심: familiarity = flagging up(존재 표시) vs recall = access(구체적 접근)`}}
];

function getTypeAdvice(t){const m={'(A)(B)(C) 조합형':'반의어 함정 주의, 원문 단어 정확히 암기','문맥상 부적절한 어휘':'밑줄 단어가 반의어로 바뀌었는지 확인','동의어 고르기':'동의어 쌍을 세트로 묶어 암기','반의어 고르기':'반의어 쌍을 세트로 묶어 암기','빈칸 어휘 완성':'문맥 단서(clue) 찾기 연습 필요','다의어 문맥적 의미':'다의어의 여러 뜻을 문맥별로 구분','영영풀이 매칭':'영영사전 정의 읽기 연습','어형 변환 (서술형)':'품사 변환 규칙(명↔형, 동↔명) 정리','빈칸 문맥 완성':'글의 흐름과 논리적 연결 파악','어법':'핵심 어법 규칙 정리 및 반복 연습','내용일치':'지문과 선지를 꼼꼼히 대조','내용불일치':'함정 선지의 미세한 차이 찾기','T/F':'원문과 진술을 정확히 대조','서술형':'정확한 철자와 어형 변환 주의','빈칸추론':'빈칸 전후 문맥 단서 찾기','빈칸 추론':'빈칸 전후 문맥 단서 찾기','문장삽입':'글의 흐름과 연결사 파악','어순배열':'문장 구조(S+V+O) 정확히 파악','어휘':'문맥에서 적절한 어휘 고르기 연습','내용이해':'지문 핵심 내용 정확히 파악'};return m[t]||'해당 유형 집중 복습 필요';}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function showQ(idx,direction){

  const tc=typeTag[q.type]||'';

function renderContent(idx,qi,q,tc,mk,pp){
  let ph='<div class="q-badge"><div class="q-num">'+( idx+1)+'</div><span>'+q.type+'</span><span style="opacity:.6">'+q.diff+' \u00b7 '+q.pts+'\uc810</span></div>';

  else ph+='<div style="padding:30px;text-align:center;color:var(--tl)">\uc774 \ubb38\ud56d\uc740 \uc9c0\ubb38\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.</div>';

    });
  }
  if(q.fmt==='written'){
    var val=S.ans[qi]||'';
    bh+='<input class="written-input" value="'+val+'" placeholder="\ub2f5\uc548\uc744 \uc785\ub825\ud558\uc138\uc694..." oninput="writeAns('+idx+',this.value)">';

  bt.innerHTML=bh;
}
function selectAns(idx,ci){
  var qi=S.order?S.order[idx]:idx;
  S.ans[qi]=ci;
  var btns=document.querySelectorAll('.slide-choices .choice-btn');
  btns.forEach(function(b,i){
    b.classList.toggle('selected',i===ci);
    if(i===ci)b.classList.add('just-selected');
  });
  updateProgress();
  setTimeout(function(){if(idx<EI.totalQ-1)showQ(idx+1,1);},400);
}
function writeAns(idx,val){
  var qi=S.order?S.order[idx]:idx;
  S.ans[qi]=val.trim()||null;
  updateProgress();
}
function navQ(dir){
  var next=S.cur+dir;
  if(next>=0&&next<EI.totalQ)showQ(next,dir);
}
function updateProgress(){
  var answered=S.ans.filter(function(a){return a!==null;}).length;
  document.getElementById('progressFill').style.width=(answered/EI.totalQ*100)+'%';
  document.getElementById('ansCount').textContent=answered+'/'+EI.totalQ;
}
function initSwipe(){
  var startX=0,startY=0;
  var el=document.getElementById('slideWrap');
  el.addEventListener('touchstart',function(e){startX=e.touches[0].clientX;startY=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-startX;
    var dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0&&S.cur<EI.totalQ-1)navQ(1);
      if(dx>0&&S.cur>0)navQ(-1);
    }
  },{passive:true});
}

h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:(d.q.wa||'');const open=!d.ok;
let chHtml='';if(d.q.fmt==='mc'&&d.q.ch){chHtml=`<div style="margin-top:8px">`;d.q.ch.forEach((c,ci)=>{const isAns=ci===d.q.ans;const isMy=d.ans===ci;const color=isAns?'var(--o)':(isMy&&!d.ok?'var(--r)':'var(--tm)');const bg=isAns?'var(--ol)':(isMy&&!d.ok?'var(--rl)':'transparent');const label=isAns?' ✅':(isMy&&!d.ok?' ❌':'');chHtml+=`<div style="padding:4px 8px;margin-bottom:2px;border-radius:6px;font-size:12px;color:${color};background:${bg}"><b>${mk[ci]}</b> ${c}${label}</div>`;});chHtml+=`</div>`;}
h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,8)}] ${d.q.diff} ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:10px"><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--ol);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:10px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--ol);color:var(--o)"><div style="font-size:10px;opacity:.7">정답</div>${ca}</div></div><div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📝 문제</div><div class="expl-box" style="font-size:12.5px;line-height:1.6;border-left:3px solid var(--b);margin-bottom:10px"><div style="font-weight:700;margin-bottom:6px">${d.q.stem}</div>${chHtml}</div>${d.q.passage?`<div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📖 원문</div><div class="expl-box" style="font-size:12px;line-height:1.75;border-left:3px solid #ddd;margin-bottom:10px">${d.q.passage}</div>`:''}${d.q.det?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean||''}</div><div class="expl-tag tip">📋 풀이 · 선지 분석</div><div class="expl-box" style="white-space:pre-line">${(d.q.det.analysis||'').replace(/\\n/g,'<br>')}</div><div class="expl-tag tip">💡 포인트</div><div class="expl-box tip-b">${d.q.det.tip||''}</div>`:''}</div></div>`;}); h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
