const FULL_PASSAGE=`Nathan boarded the train on Saturday evening. As he made his way to his seat, he found someone already sitting there. Confused, he checked his ticket and realized his mistake \u2014 it was for Sunday, not Saturday! A flush of panic spread across his face. He quickly approached a train attendant and explained the situation. "Is there anything I can do to resolve this?" Nathan asked. "Don\u2019t worry, sir. We still have seats available," the attendant said with a reassuring smile. Nathan exchanged his old ticket for a new one, his worries melting away. Settling into his seat, he let out a deep breath, feeling the tension in his shoulders ease as the train began to move.`;

passage:`Nathan boarded the train on Saturday evening. As he made his way to his seat, he found someone already sitting there. <b>(A)</b>, he checked his ticket and realized his mistake \u2014 it was for Sunday, not Saturday! A flush of <b>(B)</b> spread across his face. He quickly approached a train attendant and explained the situation. "Is there anything I can do to resolve this?" Nathan asked. "Don\u2019t worry, sir. We still have seats available," the attendant said with a <b>(C)</b> smile. Nathan exchanged his old ticket for a new one, his worries melting away. Settling into his seat, he let out a deep breath, feeling the tension in his shoulders ease as the train began to move.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`자리에 누가 앉아 있어 <b>당황한(Confused)</b> Nathan은 <b>공포(panic)</b>에 휩싸였고, 승무원의 <b>안심시키는(reassuring)</b> 미소에 걱정이 사라졌다.`,

passage:`Nathan boarded the train on Saturday evening. As he made his way to his seat, he found someone already sitting there. Confused, he checked his ticket and realized his ①<u>mistake</u> \u2014 it was for Sunday, not Saturday! A flush of ②<u>panic</u> spread across his face. He quickly approached a train attendant and explained the ③<u>situation</u>. "Is there anything I can do to resolve this?" Nathan asked. "Don\u2019t worry, sir. We still have seats ④<u>occupied</u>," the attendant said with a reassuring smile. Nathan ⑤<u>exchanged</u> his old ticket for a new one, his worries melting away.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`승무원은 좌석이 아직 <b>이용 가능하다(available)</b>고 말했다. ④ occupied(점유된)는 available의 반의어로 부적절.`,
analysis:`❌ ④ occupied(점유된): 원문은 available(이용 가능한) → 좌석이 있다는 맥락과 어울리지 않음\n✅ ① mistake(실수): 원문 일치\n✅ ② panic(공포): 원문 일치\n✅ ③ situation(상황): 원문 일치\n✅ ⑤ exchanged(교환했다): 원문 일치`,
tip:`available(이용 가능한) ↔ occupied(점유된) — 빈 좌석이 있다는 의미와 반대`}},

{id:4,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Nathan boarded the train on Saturday evening. As he made his way to his seat, he found someone already sitting there. Confused, he checked his ticket and ①<u>realized</u> his mistake \u2014 it was for Sunday, not Saturday! A flush of panic spread across his face. He quickly approached a train attendant and ②<u>concealed</u> the situation. "Is there anything I can do to resolve this?" Nathan asked. "Don\u2019t worry, sir. We still have seats available," the attendant said with a ③<u>reassuring</u> smile. Nathan exchanged his old ticket for a new one, his worries ④<u>melting</u> away. Settling into his seat, he let out a deep ⑤<u>breath</u>, feeling the tension in his shoulders ease.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`Nathan은 상황을 <b>설명했다(explained)</b>. ② concealed(숨겼다)는 explained의 반의어로 부적절.`,
analysis:`❌ ② concealed(숨겼다): 원문은 explained(설명했다) → 도움을 요청하는 맥락과 어울리지 않음\n✅ ① realized(깨달았다): 원문 일치\n✅ ③ reassuring(안심시키는): 원문 일치\n✅ ④ melting(녹아내리는): 원문 일치\n✅ ⑤ breath(숨): 원문 일치`,
tip:`explained(설명하다) ↔ concealed(숨기다) — 도움을 구하려면 설명해야지 숨기면 안 됨`}},

{id:5,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,
ch:[`ignore`,`worsen`,`solve`,`avoid`],
passage:`"Is there anything I can do to <u>resolve</u> this?" Nathan asked.`,
stem:`밑줄 친 <b>resolve</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`resolve = 해결하다, solve = 풀다/해결하다 → 의미 유사`,
analysis:`✅ ③ solve(해결하다): resolve의 동의어\n❌ ① ignore(무시하다): 반의어\n❌ ② worsen(악화시키다): 반의어\n❌ ④ avoid(피하다): 다른 의미`,
tip:`resolve = solve = settle = fix = 해결하다`}},

{id:6,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`comforting`,`alarming`,`confusing`,`demanding`],
passage:`The attendant said with a <u>reassuring</u> smile.`,
stem:`밑줄 친 <b>reassuring</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`reassuring = 안심시키는, comforting = 위안이 되는 → 의미 유사`,
analysis:`✅ ① comforting(위안이 되는): reassuring의 동의어\n❌ ② alarming(불안하게 하는): 반의어\n❌ ③ confusing(혼란스러운): 다른 의미\n❌ ④ demanding(요구하는): 다른 의미`,
tip:`reassuring = comforting = soothing = 안심시키는, 위안이 되는`}},

{id:7,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`tightening`,`lessening`,`increasing`,`spreading`],
passage:`Feeling the tension in his shoulders <u>ease</u> as the train began to move.`,
stem:`밑줄 친 <b>ease</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`ease = (긴장이) 풀리다, lessening = 줄어들다 → 의미 유사`,
analysis:`✅ ② lessening(줄어들다): ease의 동의어 (긴장이 줄어듦)\n❌ ① tightening(조이다): 반의어\n❌ ③ increasing(증가하다): 반의어\n❌ ④ spreading(퍼지다): 다른 의미`,
tip:`ease(풀리다) = lessen = relieve = diminish ↔ tighten = increase(증가하다)`}},

{id:8,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`bewildered`,`puzzled`,`perplexed`,`certain`],
passage:`<u>Confused</u>, he checked his ticket and realized his mistake.`,
stem:`밑줄 친 <b>Confused</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`Confused = 당황한, 혼란스러운 ↔ certain = 확신하는`,
analysis:`❌ ④ certain(확신하는): Confused의 반의어 → 가장 먼 의미\n✅ ① bewildered(어리둥절한): 동의어\n✅ ② puzzled(의아한): 동의어\n✅ ③ perplexed(당혹한): 동의어`,
tip:`Confused = bewildered = puzzled = perplexed(혼란스러운) ↔ certain = sure(확신하는)`}},

{id:9,type:`어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`traded`,`swapped`,`retained`,`replaced`],
passage:`Nathan <u>exchanged</u> his old ticket for a new one.`,
stem:`밑줄 친 <b>exchanged</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`exchanged = 교환했다 ↔ retained = 보유했다, 유지했다`,
analysis:`❌ ③ retained(보유했다): exchanged의 반의어 → 가장 먼 의미\n✅ ① traded(거래했다): 동의어\n✅ ② swapped(바꿨다): 동의어\n✅ ④ replaced(교체했다): 유사어`,
tip:`exchanged = traded = swapped(교환하다) ↔ retained = kept(보유하다)`}},

{id:10,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`joy`,`excitement`,`panic`,`curiosity`],
passage:`Nathan boarded the train on Saturday evening. As he made his way to his seat, he found someone already sitting there. Confused, he checked his ticket and realized his mistake \u2014 it was for Sunday, not Saturday! A flush of __________ spread across his face. He quickly approached a train attendant and explained the situation.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`잘못된 날짜의 표를 가지고 있다는 것을 깨닫고 <b>공포(panic)</b>에 휩싸였다.`,
analysis:`✅ ③ panic(공포): 실수를 깨달은 후의 당황/공포와 일치\n❌ ① joy(기쁨): 문맥과 반대\n❌ ② excitement(흥분): 부정적 상황과 맞지 않음\n❌ ④ curiosity(호기심): 문맥과 무관`,
tip:`a flush of panic = 순간적인 공포감 — flush는 갑작스러운 감정의 물결`}},

{id:11,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`building up`,`coming back`,`piling on`,`melting away`],
passage:`Nathan boarded the train on Saturday evening. As he made his way to his seat, he found someone already sitting there. Confused, he checked his ticket and realized his mistake \u2014 it was for Sunday, not Saturday! A flush of panic spread across his face. He quickly approached a train attendant and explained the situation. "Is there anything I can do to resolve this?" Nathan asked. "Don\u2019t worry, sir. We still have seats available," the attendant said with a reassuring smile. Nathan exchanged his old ticket for a new one, his worries __________. Settling into his seat, he let out a deep breath.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`새 표를 받은 후 걱정이 <b>사라졌다(melting away)</b>.`,
analysis:`✅ ④ melting away(녹아내리다/사라지다): 문제가 해결되어 걱정이 사라짐\n❌ ① building up(쌓이다): 반의어\n❌ ② coming back(돌아오다): 문맥과 반대\n❌ ③ piling on(쌓이다): 반의어`,
tip:`worries melting away = 걱정이 녹아 사라지다 — 비유적 표현`}},

{id:12,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`tension`,`excitement`,`anticipation`,`enthusiasm`],
passage:`Nathan boarded the train on Saturday evening. As he made his way to his seat, he found someone already sitting there. Confused, he checked his ticket and realized his mistake \u2014 it was for Sunday, not Saturday! A flush of panic spread across his face. He quickly approached a train attendant and explained the situation. "Is there anything I can do to resolve this?" Nathan asked. "Don\u2019t worry, sir. We still have seats available," the attendant said with a reassuring smile. Nathan exchanged his old ticket for a new one, his worries melting away. Settling into his seat, he let out a deep breath, feeling the __________ in his shoulders ease as the train began to move.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`어깨의 <b>긴장(tension)</b>이 풀리는 것을 느꼈다.`,
analysis:`✅ ① tension(긴장): 스트레스 상황 후 어깨의 긴장이 풀리는 표현과 일치\n❌ ② excitement(흥분): 긴장 해소 맥락과 다름\n❌ ③ anticipation(기대): 문맥과 무관\n❌ ④ enthusiasm(열정): 문맥과 무관`,
tip:`tension in shoulders ease = 어깨의 긴장이 풀리다 — 신체적 긴장 해소의 표현`}},

{id:13,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`탑승시키다`,`타다, 승차하다`,`판자, 게시판`,`하숙하다`],
passage:`Nathan <u>boarded</u> the train on Saturday evening.`,
stem:`밑줄 친 <b>boarded</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`boarded the train = 기차에 <b>탑승했다</b>`,
analysis:`✅ ② 타다, 승차하다: board + 교통수단 = 탑승하다\n❌ ① 탑승시키다: 타동사 다른 용법\n❌ ③ 판자, 게시판: 명사적 의미\n❌ ④ 하숙하다: board with someone`,
tip:`board + 교통수단 = 탑승하다 | board game = 보드 게임 | board and lodging = 숙식`}},

{id:14,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`퍼뜨리다, 바르다`,`(뉴스가) 전파되다`,`(감정이) 퍼지다`,`(음식을) 차리다`],
passage:`A flush of panic <u>spread</u> across his face.`,
stem:`밑줄 친 <b>spread</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`공포가 얼굴에 <b>퍼졌다</b> → 감정이 퍼지는 비유적 표현`,
analysis:`✅ ③ (감정이) 퍼지다: "panic spread across his face" = 공포가 얼굴에 퍼졌다\n❌ ① 퍼뜨리다: spread butter 등 물리적 행위\n❌ ② 전파되다: 뉴스/소문 맥락\n❌ ④ 차리다: spread a table`,
tip:`spread across one's face = (감정/표정이) 얼굴에 퍼지다 — 감정의 신체적 표현`}},

{id:15,type:`어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`panic`,`confusion`,`reassuring`,`tension`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"making someone feel less worried or uncertain about something"</b>`,
det:{korean:`'누군가의 걱정이나 불확실함을 줄여주는' → <b>reassuring(안심시키는)</b>`,
analysis:`✅ ③ reassuring: 영영 정의와 정확히 일치\n❌ ① panic: 공포\n❌ ② confusion: 혼란\n❌ ④ tension: 긴장`,
tip:`reassuring = making someone feel less worried → 안심시키는`}},

{id:16,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`exchanged`,`resolved`,`approached`,`settled`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"gave something and received something else in return"</b>`,
det:{korean:`'무언가를 주고 대신 다른 것을 받았다' → <b>exchanged(교환했다)</b>`,
analysis:`✅ ① exchanged: 영영 정의와 일치\n❌ ② resolved: 해결했다\n❌ ③ approached: 다가갔다\n❌ ④ settled: 자리 잡았다`,
tip:`exchanged = gave + received in return → 교환했다`}},

{id:17,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`Confused`,accept:[`Confused`,`confused`],
passage:`Nathan boarded the train on Saturday evening. As he made his way to his seat, he found someone already sitting there. __________ (confuse), he checked his ticket and realized his mistake \u2014 it was for Sunday, not Saturday!`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`confuse(동사) → <b>Confused(과거분사/형용사)</b>: Nathan의 감정 상태를 나타내는 분사구문`,
analysis:`confuse(동사) → Confused(과거분사)\n감정을 나타내는 분사 → 사람의 감정이므로 과거분사(-ed)`,
tip:`confuse → confused(당황한, 사람) / confusing(혼란스러운, 사물) — 감정 분사 구별`}},

{id:18,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`reassuring`,accept:[`reassuring`,`Reassuring`],
passage:`"Don\u2019t worry, sir. We still have seats available," the attendant said with a __________ (reassure) smile. Nathan exchanged his old ticket for a new one, his worries melting away.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`reassure(동사) → <b>reassuring(현재분사/형용사)</b>: smile을 수식하는 형용사 필요. 미소가 안심을 "주는" 것이므로 현재분사.`,
analysis:`reassure(동사) → reassuring(현재분사/형용사)\na reassuring smile = 안심시키는 미소 → 능동적 의미이므로 현재분사(-ing)`,
tip:`reassure → reassuring(안심시키는, 사물) / reassured(안심한, 사람) — 능동/수동 구별`}},

{id:19,type:`내용이해`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`embarrassed → relieved`,`indifferent → surprised`,`hopeful → disappointed`,`ashamed → sympathetic`,`bored → excited`],
passage:`Nathan boarded the train on Saturday evening. As he made his way to his seat, he found someone already sitting there. Confused, he checked his ticket and realized his mistake \u2014 it was for Sunday, not Saturday! A flush of panic spread across his face. He quickly approached a train attendant and explained the situation. "Is there anything I can do to resolve this?" Nathan asked. "Don\u2019t worry, sir. We still have seats available," the attendant said with a reassuring smile. Nathan exchanged his old ticket for a new one, his worries melting away. Settling into his seat, he let out a deep breath, feeling the tension in his shoulders ease as the train began to move.`,
stem:`다음 글에 드러난 Nathan의 심경 변화로 가장 적절한 것은?`,
det:{korean:`잘못된 표를 가져와 <b>당황(embarrassed)</b>했다가, 문제가 해결되어 <b>안도(relieved)</b>했다.`,
analysis:`✅ ① embarrassed → relieved: 실수로 당황 → 해결 후 안도\n❌ ② indifferent → surprised: 무관심하지 않았음\n❌ ③ hopeful → disappointed: 반대 흐름\n❌ ④ ashamed → sympathetic: 부끄러움→동정은 아님\n❌ ⑤ bored → excited: 지루하지 않았음`,
tip:`심경 변화: panic/embarrassed(당황/공포) → worries melting away/ease(걱정 해소/안도)`}},

{id:20,type:`내용이해`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`Nathan은 기차를 놓쳐서 다음 기차를 기다렸다.`,`Nathan은 다른 승객의 자리를 빼앗으려 했다.`,`Nathan은 잘못된 날짜의 표를 가져왔으나 승무원의 도움으로 문제를 해결했다.`,`Nathan은 표를 환불받고 기차에서 내렸다.`,`Nathan은 승무원에게 화를 내며 항의했다.`],
passage:`Nathan boarded the train on Saturday evening. As he made his way to his seat, he found someone already sitting there. Confused, he checked his ticket and realized his mistake \u2014 it was for Sunday, not Saturday! A flush of panic spread across his face. He quickly approached a train attendant and explained the situation. "Is there anything I can do to resolve this?" Nathan asked. "Don\u2019t worry, sir. We still have seats available," the attendant said with a reassuring smile. Nathan exchanged his old ticket for a new one, his worries melting away. Settling into his seat, he let out a deep breath, feeling the tension in his shoulders ease as the train began to move.`,
stem:`다음 글의 내용을 가장 잘 요약한 것은?`,
det:{korean:`Nathan은 일요일 표를 토요일에 가져오는 실수를 했지만, 승무원의 도움으로 새 표를 받아 문제를 해결했다.`,
analysis:`✅ ③ 잘못된 날짜의 표를 가져왔으나 승무원 도움으로 해결: 원문 내용과 정확히 일치\n❌ ① 기차를 놓침: 기차에 탑승함\n❌ ② 자리 빼앗기: 승무원에게 도움 요청\n❌ ④ 환불/하차: 새 표로 교환\n❌ ⑤ 항의: 정중하게 요청`,
tip:`글 전체 흐름: 실수 발견 → 당황 → 승무원 도움 요청 → 새 표 교환 → 안도`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'문장삽입':'tag-insert','어순배열':'tag-order','어법':'tag-grammar','어휘':'tag-vocab','빈칸추론':'tag-blank','서술형':'tag-written','내용이해':'tag-content','T/F':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch?(d.q.ch.length===5?'①②③④⑤':d.q.ch.length===4?'①②③④':d.q.ch.length===3?'①②③':'①②'):'';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--oxl);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--oxl);color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인퀴즈 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
