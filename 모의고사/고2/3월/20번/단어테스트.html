<script>
const EI={"subject":"2025 고2 3월 모의고사","pub":"20번","lesson":"필자의 주장","title":"Fan-Athlete Obligations","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_2025_g2_mar_20"};

const FULL_PASSAGE=`Fans who are inclined to spend a lot of time thinking about what athletes owe them as fans should also think about the corresponding obligations that fans might have as fans. One who thinks only about what they are entitled to receive from their friends without ever giving a moment\u2019s thought to what they owe their friends is, to put it mildly, not a very good friend. Similarly, fans who only think about what athletes owe them without ever thinking about what they owe to athletes have failed to take the fan/athlete relationship all that seriously. As in nearly every other area of human life, whatever special rights fans may possess are limited by a corresponding set of obligations, and fans who never think about how they can be better fans even as they confidently opine about what athletes owe them are hardly fulfilling their end of the bargain.`;

const Q=[
{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`obligations — entitled — bargain`,`rights — entitled — bargain`,`obligations — obliged — bargain`,`obligations — entitled — agreement`,`rights — obliged — agreement`],
passage:`Fans who are inclined to spend a lot of time thinking about what athletes owe them as fans should also think about the corresponding <b>(A)</b> that fans might have as fans. One who thinks only about what they are <b>(B)</b> to receive from their friends without ever giving a moment\u2019s thought to what they owe their friends is, to put it mildly, not a very good friend. Similarly, fans who only think about what athletes owe them without ever thinking about what they owe to athletes have failed to take the fan/athlete relationship all that seriously. As in nearly every other area of human life, whatever special rights fans may possess are limited by a corresponding set of obligations, and fans who never think about how they can be better fans even as they confidently opine about what athletes owe them are hardly fulfilling their end of the <b>(C)</b>.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`팬에게도 상응하는 <b>의무(obligations)</b>가 있고, 자신이 받을 <b>자격(entitled)</b>만 생각하면 좋은 친구가 아니며, 팬은 <b>거래(bargain)</b>에서 자기 몫을 다해야 한다.`,
analysis:`✅ ① obligations — entitled — bargain: 원문과 정확히 일치\n❌ ② rights: obligations의 반의어적\n❌ ③ obliged: entitled과 다른 뉘앙스\n❌ ④ agreement: bargain과 유사하나 원문은 bargain\n❌ ⑤ 부적절 조합`,
tip:`obligations(의무)↔rights(권리), entitled(자격이 있는)↔obliged(의무가 있는), bargain(거래)의 관용표현: end of the bargain`}},

{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`inclined — corresponding — possess`,`reluctant — corresponding — possess`,`inclined — unrelated — possess`,`inclined — corresponding — abandon`,`reluctant — unrelated — abandon`],
passage:`Fans who are <b>(A)</b> to spend a lot of time thinking about what athletes owe them as fans should also think about the <b>(B)</b> obligations that fans might have as fans. One who thinks only about what they are entitled to receive from their friends without ever giving a moment\u2019s thought to what they owe their friends is, to put it mildly, not a very good friend. Similarly, fans who only think about what athletes owe them without ever thinking about what they owe to athletes have failed to take the fan/athlete relationship all that seriously. As in nearly every other area of human life, whatever special rights fans may <b>(C)</b> are limited by a corresponding set of obligations.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`선수에 대해 생각하는 데 시간을 쓰는 <b>성향(inclined)</b>의 팬들은 <b>상응하는(corresponding)</b> 의무를 생각해야 하며, 팬이 <b>가지는(possess)</b> 특별한 권리에는 한계가 있다.`,
analysis:`✅ ① inclined — corresponding — possess: 원문 일치\n❌ ② reluctant(꺼리는): inclined의 반의어\n❌ ③ unrelated(무관한): corresponding의 반의어\n❌ ④ abandon(포기하다): possess의 반의어\n❌ ⑤ 세 단어 모두 반의어`,
tip:`inclined(~하는 성향의)↔reluctant(꺼리는), corresponding(상응하는)↔unrelated(무관한), possess(소유하다)↔abandon(포기하다)`}},

{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Fans who are inclined to spend a lot of time thinking about what athletes owe them as fans should also think about the corresponding ①<u>obligations</u> that fans might have as fans. One who thinks only about what they are ②<u>entitled</u> to receive from their friends without ever giving a moment\u2019s thought to what they owe their friends is, to put it mildly, not a very good friend. Similarly, fans who only think about what athletes owe them without ever thinking about what they owe to athletes have failed to take the fan/athlete ③<u>relationship</u> all that seriously. As in nearly every other area of human life, whatever special rights fans may possess are ④<u>expanded</u> by a corresponding set of obligations, and fans who never think about how they can be better fans even as they confidently ⑤<u>opine</u> about what athletes owe them are hardly fulfilling their end of the bargain.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`팬의 권리는 의무에 의해 <b>제한된다(limited)</b>. ④ expanded(확장된)는 limited의 반의어로 부적절.`,
analysis:`❌ ④ expanded(확장된): 원문은 limited(제한된) → 권리가 의무에 의해 "확장"되는 것이 아니라 "제한"됨\n✅ ① obligations(의무): 원문 일치\n✅ ② entitled(자격이 있는): 원문 일치\n✅ ③ relationship(관계): 원문 일치\n✅ ⑤ opine(의견을 말하다): 원문 일치`,
tip:`limited(제한된) ↔ expanded(확장된) — 권리는 의무에 의해 제한된다는 핵심 논지`}},

{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Fans who are ①<u>inclined</u> to spend a lot of time thinking about what athletes owe them as fans should also think about the corresponding obligations that fans might have as fans. One who thinks only about what they are entitled to receive from their friends without ever giving a moment\u2019s thought to what they owe their friends is, to put it ②<u>harshly</u>, not a very good friend. Similarly, fans who only think about what athletes owe them without ever thinking about what they owe to athletes have ③<u>failed</u> to take the fan/athlete relationship all that seriously. As in nearly every other area of human life, whatever special rights fans may possess are limited by a ④<u>corresponding</u> set of obligations, and fans who never think about how they can be better fans even as they ⑤<u>confidently</u> opine about what athletes owe them are hardly fulfilling their end of the bargain.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`<b>부드럽게 말하자면(to put it mildly)</b> 좋은 친구가 아니다. ② harshly(거칠게)는 mildly의 반의어로 부적절.`,
analysis:`❌ ② harshly(거칠게): 원문은 mildly(부드럽게) → "to put it mildly"는 완곡한 표현의 관용구\n✅ ① inclined(~하는 성향의): 원문 일치\n✅ ③ failed(실패했다): 원문 일치\n✅ ④ corresponding(상응하는): 원문 일치\n✅ ⑤ confidently(자신있게): 원문 일치`,
tip:`mildly(부드럽게) ↔ harshly(거칠게) — "to put it mildly"는 '완곡하게 말하자면'이라는 관용 표현`}},

{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`reluctant`,`prone`,`unable`,`opposed`],
passage:`Fans who are <u>inclined</u> to spend a lot of time thinking about what athletes owe them.`,
stem:`밑줄 친 <b>inclined</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`inclined = ~하는 경향이 있는, prone = ~하기 쉬운 → 의미 유사`,
analysis:`✅ ② prone(~하기 쉬운): inclined의 동의어\n❌ ① reluctant(꺼리는): 반의어\n❌ ③ unable(할 수 없는): 다른 의미\n❌ ④ opposed(반대하는): 반의어`,
tip:`inclined = prone = apt = likely = ~하는 경향이 있는`}},

{id:6,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`deny`,`reject`,`have`,`abandon`],
passage:`Whatever special rights fans may <u>possess</u> are limited.`,
stem:`밑줄 친 <b>possess</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`possess = 소유하다, have = 가지다 → 동의어`,
analysis:`✅ ③ have(가지다): possess의 동의어\n❌ ① deny(부인하다): 다른 의미\n❌ ② reject(거부하다): 다른 의미\n❌ ④ abandon(버리다): 반의어`,
tip:`possess = have = own = hold = 소유하다, 가지다`}},

{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`duties`,`privileges`,`matching`,`unrelated`],
passage:`They should think about the <u>corresponding</u> obligations.`,
stem:`밑줄 친 <b>corresponding</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`corresponding = 상응하는, matching = 일치하는/대응하는 → 동의어`,
analysis:`✅ ③ matching(대응하는): corresponding의 동의어\n❌ ① duties(의무): 명사이므로 품사 불일치\n❌ ② privileges(특권): 다른 의미\n❌ ④ unrelated(무관한): 반의어`,
tip:`corresponding = matching = equivalent = proportional = 상응하는`}},

{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`duties`,`responsibilities`,`commitments`,`privileges`],
passage:`They should think about the corresponding <u>obligations</u>.`,
stem:`밑줄 친 <b>obligations</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`obligations = 의무 ↔ privileges = 특권`,
analysis:`❌ ④ privileges(특권): obligations의 반의어 → 가장 먼 의미\n✅ ① duties(의무): 동의어\n✅ ② responsibilities(책임): 동의어\n✅ ③ commitments(약속/헌신): 유사어`,
tip:`obligations = duties = responsibilities(의무) ↔ privileges = rights(특권, 권리)`}},

{id:9,type:`반의어 고르기`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`reliably`,`boldly`,`hesitantly`,`assuredly`],
passage:`Fans who <u>confidently</u> opine about what athletes owe them.`,
stem:`밑줄 친 <b>confidently</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`confidently = 자신있게 ↔ hesitantly = 머뭇거리며`,
analysis:`❌ ③ hesitantly(머뭇거리며): confidently의 반의어 → 가장 먼 의미\n✅ ① reliably(신뢰할 수 있게): 유사 뉘앙스\n✅ ② boldly(대담하게): 동의어\n✅ ④ assuredly(확실히): 동의어`,
tip:`confidently = boldly = assuredly(자신있게) ↔ hesitantly = timidly(머뭇거리며)`}},

{id:10,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`rights`,`rewards`,`obligations`,`talents`],
passage:`Fans who are inclined to spend a lot of time thinking about what athletes owe them as fans should also think about the corresponding __________ that fans might have as fans. One who thinks only about what they are entitled to receive from their friends without ever giving a moment\u2019s thought to what they owe their friends is, to put it mildly, not a very good friend.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`팬에게도 상응하는 <b>의무(obligations)</b>가 있다는 것이 핵심.`,
analysis:`✅ ③ obligations(의무): "what they owe"와 연결 → 의무\n❌ ① rights(권리): 이미 권리만 생각하는 것을 비판\n❌ ② rewards(보상): 문맥과 무관\n❌ ④ talents(재능): 문맥과 무관`,
tip:`corresponding obligations = 상응하는 의무 — 권리에 대응하는 의무`}},

{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`rewarding`,`ignoring`,`exceeding`,`fulfilling`],
passage:`Fans who never think about how they can be better fans even as they confidently opine about what athletes owe them are hardly __________ their end of the bargain.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`팬으로서 자신의 의무를 <b>이행하지(fulfilling)</b> 못하고 있다.`,
analysis:`✅ ④ fulfilling(이행하다): "their end of the bargain"과 관용적으로 결합\n❌ ① rewarding(보상하다): 문맥과 무관\n❌ ② ignoring(무시하다): 뉘앙스 다름\n❌ ③ exceeding(초과하다): 문맥과 무관`,
tip:`fulfill one's end of the bargain = 자신의 몫의 의무를 다하다 — 관용 표현`}},

{id:12,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`limited`,`expanded`,`eliminated`,`guaranteed`],
passage:`As in nearly every other area of human life, whatever special rights fans may possess are __________ by a corresponding set of obligations, and fans who never think about how they can be better fans even as they confidently opine about what athletes owe them are hardly fulfilling their end of the bargain.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`팬이 가진 특별한 권리는 상응하는 의무에 의해 <b>제한된다(limited)</b>.`,
analysis:`✅ ① limited(제한된): 권리가 의무에 의해 제한된다는 핵심 논지\n❌ ② expanded(확장된): 반의어\n❌ ③ eliminated(제거된): 너무 극단적\n❌ ④ guaranteed(보장된): 문맥과 반대`,
tip:`rights are limited by obligations = 권리는 의무에 의해 제한된다`}},

{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`빚지다, ~해야 하다`,`소유하다`,`감사하다`,`원인이다`],
passage:`Fans should think about what they <u>owe</u> to athletes.`,
stem:`밑줄 친 <b>owe</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`owe to athletes = 선수에게 <b>빚지다/해야 할 것이 있다</b>`,
analysis:`✅ ① 빚지다, ~해야 하다: owe + to + 사람 = ~에게 해야 할 것이 있다\n❌ ② 소유하다: own과 혼동\n❌ ③ 감사하다: owe thanks의 축약이나 여기서는 의무\n❌ ④ 원인이다: owe ~ to ~의 다른 용법`,
tip:`owe + 의무/빚 + to 사람 = ~에게 ~을 빚지다/해야 하다 | owe ~ to ~ = ~의 덕분이다`}},

{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`거래, 할인`,`협상하다`,`합의, 약속`,`싸게 산 물건`],
passage:`Fans are hardly fulfilling their end of the <u>bargain</u>.`,
stem:`밑줄 친 <b>bargain</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`end of the bargain = <b>합의/약속</b>에서의 자기 몫`,
analysis:`✅ ③ 합의, 약속: "one's end of the bargain" = 합의에서 자기 몫\n❌ ① 거래, 할인: 쇼핑 맥락\n❌ ② 협상하다: 동사적 의미\n❌ ④ 싸게 산 물건: 쇼핑 맥락`,
tip:`bargain: 합의/약속(one's end of the bargain) | 할인(a real bargain) | 협상하다(bargain with)`}},

{id:15,type:`영영풀이 매칭`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`inclined`,`entitled`,`opine`,`possess`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"to express one's opinion or belief about something"</b>`,
det:{korean:`'무언가에 대해 자신의 의견이나 믿음을 표현하다' → <b>opine(의견을 말하다)</b>`,
analysis:`✅ ③ opine: 영영 정의와 정확히 일치\n❌ ① inclined: ~하는 경향이 있는\n❌ ② entitled: 자격이 있는\n❌ ④ possess: 소유하다`,
tip:`opine = express one's opinion = state one's view → 의견을 말하다`}},

{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`obligations`,`corresponding`,`confidently`,`inclined`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"matching or equivalent in character, amount, or function"</b>`,
det:{korean:`'성격, 양, 기능이 일치하거나 대등한' → <b>corresponding(상응하는)</b>`,
analysis:`✅ ② corresponding: 영영 정의와 일치\n❌ ① obligations: 의무\n❌ ③ confidently: 자신있게\n❌ ④ inclined: 경향이 있는`,
tip:`corresponding = matching = equivalent = proportional → 상응하는, 대응하는`}},

{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`obligations`,accept:[`obligations`,`Obligations`],
passage:`Fans who are inclined to spend a lot of time thinking about what athletes owe them as fans should also think about the corresponding __________ (oblige) that fans might have as fans.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`oblige(동사) → <b>obligations(명사, 복수)</b>: the corresponding + 명사 구조, 복수형 의무`,
analysis:`oblige(동사) → obligation(명사) → obligations(복수)\n"corresponding obligations" = 상응하는 의무들`,
tip:`oblige → obligation(s) / regulate → regulation(s) — 동사 → 명사화 + 복수`}},

{id:18,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`credibility`,accept:[`credibility`,`Credibility`],
passage:`Thus, social objects and institutions such as jobs, money, government, scientific collaborations and marriage depend for their origin and stability upon the __________ (credible) of commitments.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`credible(형용사) → <b>credibility(명사)</b>: the + 명사 + of 구조에서 명사가 필요`,
analysis:`credible(형용사) → credibility(명사)\nthe ______ of commitments → 관사 the 뒤에 명사 필요`,
tip:`credible → credibility / visible → visibility — -ible → -ibility 명사화 패턴`}},

{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`팬과 선수는 승리를 위해 동반자 관계를 유지해야 한다.`,`팬은 팀의 경기 결과보다 자기의 삶에 더 집중해야 한다.`,`팬은 선수에게 요구하는 만큼 자신의 의무도 고민해야 한다.`,`선수는 팬의 기대를 충족시키기 위해 경기력을 향상해야 한다.`,`선수는 팬을 친구처럼 여기고 팬과 적극적으로 소통해야 한다.`],
passage:`Fans who are inclined to spend a lot of time thinking about what athletes owe them as fans should also think about the corresponding obligations that fans might have as fans. One who thinks only about what they are entitled to receive from their friends without ever giving a moment\u2019s thought to what they owe their friends is, to put it mildly, not a very good friend. Similarly, fans who only think about what athletes owe them without ever thinking about what they owe to athletes have failed to take the fan/athlete relationship all that seriously. As in nearly every other area of human life, whatever special rights fans may possess are limited by a corresponding set of obligations, and fans who never think about how they can be better fans even as they confidently opine about what athletes owe them are hardly fulfilling their end of the bargain.`,
stem:`다음 글에서 필자가 주장하는 바로 가장 적절한 것은?`,
det:{korean:`선수에게 요구만 하지 말고, 팬으로서 <b>자신의 의무도 고민해야 한다</b>는 것이 핵심 주장.`,
analysis:`✅ ③ 팬은 선수에게 요구하는 만큼 자신의 의무도 고민해야 한다: "corresponding obligations" + "fulfilling their end of the bargain"\n❌ ① 동반자 관계: 언급 없음\n❌ ② 삶에 집중: 주제와 다름\n❌ ④ 경기력 향상: 선수 관점이 아님\n❌ ⑤ 적극적 소통: 언급 없음`,
tip:`핵심 주장: 권리에는 상응하는 의무가 따른다 → 팬도 자신의 의무를 다해야 한다`}},

{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`팬의 권리는 무제한적이므로 선수에게 많은 것을 요구할 수 있다.`,`팬의 권리에는 상응하는 의무가 따르므로 팬도 자신의 몫을 다해야 한다.`,`선수는 팬의 기대에 항상 부응해야 할 의무가 있다.`,`팬과 선수의 관계는 친구 관계와 본질적으로 다르다.`,`운동 선수의 의무는 경기에서 최선을 다하는 것이다.`],
passage:`Fans who are inclined to spend a lot of time thinking about what athletes owe them as fans should also think about the corresponding obligations that fans might have as fans. One who thinks only about what they are entitled to receive from their friends without ever giving a moment\u2019s thought to what they owe their friends is, to put it mildly, not a very good friend. Similarly, fans who only think about what athletes owe them without ever thinking about what they owe to athletes have failed to take the fan/athlete relationship all that seriously. As in nearly every other area of human life, whatever special rights fans may possess are limited by a corresponding set of obligations, and fans who never think about how they can be better fans even as they confidently opine about what athletes owe them are hardly fulfilling their end of the bargain.`,
stem:`다음 글의 요지로 가장 적절한 것은?`,
det:{korean:`팬의 특별한 권리는 상응하는 의무에 의해 제한되며, 팬도 <b>자신의 몫을 다해야 한다</b>.`,
analysis:`✅ ② 팬의 권리에는 상응하는 의무가 따르므로 팬도 자신의 몫을 다해야 한다: 글 전체 논지\n❌ ① 무제한적 권리: "limited by obligations"와 반대\n❌ ③ 선수 의무: 글은 팬의 의무를 강조\n❌ ④ 본질적으로 다름: 친구 관계와 비교하여 유사성 강조\n❌ ⑤ 경기에서 최선: 선수 관점이 아님`,
tip:`요지 = 주장의 핵심: rights are limited by obligations + fulfilling their end of the bargain`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch?(d.q.ch.length===5?'①②③④⑤':'①②③④'):'';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인단어 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
