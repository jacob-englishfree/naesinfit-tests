<script>
const EI={"subject":"2025 고2 3월 모의고사","pub":"37번","lesson":"순서","title":"Stress and the Brain","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_2025_g2_mar_37_v1"};

const FULL_PASSAGE=`Stress not only affects physical disease but also the very structure of our brains, making us even more likely to experience a drained brain. Why does this matter? This part of the brain helps you remain resilient in the face of stress and is involved in mood regulation. It also helps you to monitor the safety of your environment and store dangerous images in your long-term memory so you can avoid them in the future. It does all these things as part of its duties of regulating your sympathetic and parasympathetic nervous systems. But chronic stress can confuse the hippocampus and lead to turning signals for cortisol "on" instead of "off," which can trap you in a constant state of fight, flight, or freeze. A number of studies have been done to reveal what happens in healthy people's brains when they go through something stressful. One study demonstrated a link between a smaller hippocampus and people who had experienced long-lasting stress.`;

const Q=[
// ━━━ Q1: (A)(B)(C) 조합형 · 쉬움 · 4pts ━━━
{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`resilient — regulate — confuse`,`vulnerable — regulate — confuse`,`resilient — stimulate — confuse`,`resilient — regulate — enhance`,`vulnerable — stimulate — enhance`],
passage:`Stress not only affects physical disease but also the very structure of our brains, making us even more likely to experience a drained brain. Why does this matter? This part of the brain helps you remain <b>(A)</b> in the face of stress and is involved in mood regulation. It also helps you to monitor the safety of your environment and store dangerous images in your long-term memory so you can avoid them in the future. It does all these things as part of its duties of <b>(B)</b> your sympathetic and parasympathetic nervous systems. But chronic stress can <b>(C)</b> the hippocampus and lead to turning signals for cortisol "on" instead of "off," which can trap you in a constant state of fight, flight, or freeze.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`뇌의 이 부분은 스트레스 속에서 <b>회복력 있게(resilient)</b> 유지하도록 돕고, 교감·부교감 신경계를 <b>조절(regulate)</b>하며, 만성 스트레스는 해마를 <b>혼란시킨다(confuse)</b>.`,
analysis:`✅ ① resilient — regulate — confuse: 원문과 정확히 일치\n❌ ② vulnerable(취약한): resilient의 반의어\n❌ ③ stimulate(자극하다): regulate와 다른 의미\n❌ ④ enhance(향상시키다): confuse의 반의어\n❌ ⑤ 세 단어 모두 부적절`,
tip:`resilient(회복력 있는)↔vulnerable(취약한), regulate(조절하다)↔stimulate(자극하다), confuse(혼란시키다)↔enhance(향상시키다)`}},

// ━━━ Q2: (A)(B)(C) 조합형 · 보통 · 5pts ━━━
{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`monitor — avoid — trap`,`monitor — avoid — free`,`ignore — avoid — trap`,`monitor — attract — trap`,`ignore — attract — free`],
passage:`Stress not only affects physical disease but also the very structure of our brains, making us even more likely to experience a drained brain. Why does this matter? This part of the brain helps you remain resilient in the face of stress and is involved in mood regulation. It also helps you to <b>(A)</b> the safety of your environment and store dangerous images in your long-term memory so you can <b>(B)</b> them in the future. It does all these things as part of its duties of regulating your sympathetic and parasympathetic nervous systems. But chronic stress can confuse the hippocampus and lead to turning signals for cortisol "on" instead of "off," which can <b>(C)</b> you in a constant state of fight, flight, or freeze.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`환경의 안전을 <b>감시(monitor)</b>하고, 위험한 이미지를 저장하여 <b>피할(avoid)</b> 수 있게 하며, 만성 스트레스는 당신을 투쟁·도주·동결 상태에 <b>가둔다(trap)</b>.`,
analysis:`✅ ① monitor — avoid — trap: 원문과 정확히 일치\n❌ ② free(해방시키다): trap의 반의어\n❌ ③ ignore(무시하다): monitor의 반의어\n❌ ④ attract(끌어들이다): avoid의 반의어\n❌ ⑤ 세 단어 모두 부적절`,
tip:`monitor(감시하다)↔ignore(무시하다), avoid(피하다)↔attract(끌어들이다), trap(가두다)↔free(해방시키다)`}},

// ━━━ Q3: 부적절 어휘 · 쉬움 · 4pts ━━━
{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Stress not only affects physical disease but also the very structure of our brains, making us even more likely to experience a ①<u>drained</u> brain. Why does this matter? This part of the brain helps you remain ②<u>resilient</u> in the face of stress and is involved in mood regulation. It also helps you to monitor the safety of your environment and store ③<u>dangerous</u> images in your long-term memory so you can avoid them in the future. It does all these things as part of its duties of regulating your sympathetic and parasympathetic nervous systems. But chronic stress can ④<u>clarify</u> the hippocampus and lead to turning signals for cortisol "on" instead of "off," which can trap you in a constant state of fight, flight, or freeze. A number of studies have been done to reveal what happens in healthy people's brains when they go through something ⑤<u>stressful</u>.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`만성 스트레스는 해마를 <b>혼란시킨다(confuse)</b>. ④ clarify(명확히 하다)는 confuse의 반의어로 부적절.`,
analysis:`❌ ④ clarify(명확히 하다): 원문은 confuse(혼란시키다) → 코르티솔 신호를 잘못 보내게 만드는 문맥과 불일치\n✅ ① drained(고갈된): 원문 일치\n✅ ② resilient(회복력 있는): 원문 일치\n✅ ③ dangerous(위험한): 원문 일치\n✅ ⑤ stressful(스트레스를 주는): 원문 일치`,
tip:`confuse(혼란시키다) ↔ clarify(명확히 하다) — 만성 스트레스가 해마를 "혼란"시키므로 clarify는 부적절`}},

// ━━━ Q4: 부적절 어휘 · 보통 · 5pts ━━━
{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Stress not only affects physical disease but also the very ①<u>structure</u> of our brains, making us even more likely to experience a drained brain. Why does this matter? This part of the brain helps you remain resilient in the face of stress and is involved in mood regulation. It also helps you to monitor the ②<u>danger</u> of your environment and store dangerous images in your long-term memory so you can avoid them in the future. It does all these things as part of its duties of regulating your sympathetic and parasympathetic nervous systems. But chronic stress can confuse the hippocampus and lead to turning signals for cortisol "on" instead of "off," which can trap you in a ③<u>constant</u> state of fight, flight, or freeze. A number of studies have been done to ④<u>reveal</u> what happens in healthy people's brains when they go through something stressful. One study demonstrated a ⑤<u>link</u> between a smaller hippocampus and people who had experienced long-lasting stress.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`이 부분은 환경의 <b>안전(safety)</b>을 감시한다. ② danger(위험)는 safety의 반의어로 부적절.`,
analysis:`❌ ② danger(위험): 원문은 safety(안전) → 환경의 안전을 감시하는 것이 논리적\n✅ ① structure(구조): 원문 일치\n✅ ③ constant(지속적인): 원문 일치\n✅ ④ reveal(드러내다): 원문 일치\n✅ ⑤ link(연결, 관련): 원문 일치`,
tip:`safety(안전) ↔ danger(위험) — 뇌가 환경의 "안전"을 감시하는 것이므로 danger는 부적절`}},

// ━━━ Q5: 동의어 · 쉬움 · 4pts ━━━
{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`vulnerable`,`tough`,`sensitive`,`fragile`],
passage:`This part of the brain helps you remain <u>resilient</u> in the face of stress.`,
stem:`밑줄 친 <b>resilient</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`resilient = 회복력이 있는, tough = 강인한 → 의미 유사`,
analysis:`✅ ② tough(강인한): resilient의 동의어\n❌ ① vulnerable(취약한): 반의어\n❌ ③ sensitive(민감한): 다른 의미\n❌ ④ fragile(깨지기 쉬운): 반의어`,
tip:`resilient = tough = hardy = 회복력이 있는, 강인한 ↔ vulnerable = fragile(취약한)`}},

// ━━━ Q6: 동의어 · 보통 · 5pts ━━━
{id:6,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`release`,`produce`,`observe`,`neglect`],
passage:`It also helps you to <u>monitor</u> the safety of your environment.`,
stem:`밑줄 친 <b>monitor</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`monitor = 감시하다, observe = 관찰하다 → 의미 유사`,
analysis:`✅ ③ observe(관찰하다): monitor의 동의어\n❌ ① release(방출하다): 다른 의미\n❌ ② produce(생산하다): 다른 의미\n❌ ④ neglect(방치하다): 반의어`,
tip:`monitor = observe = watch = keep track of = 감시·관찰하다 ↔ neglect(방치하다)`}},

// ━━━ Q7: 동의어 · 보통 · 5pts ━━━
{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`temporary`,`occasional`,`persistent`,`moderate`],
passage:`But <u>chronic</u> stress can confuse the hippocampus.`,
stem:`밑줄 친 <b>chronic</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`chronic = 만성적인, persistent = 지속적인 → 의미 유사`,
analysis:`✅ ③ persistent(지속적인): chronic의 동의어\n❌ ① temporary(일시적인): 반의어\n❌ ② occasional(가끔의): 반의어\n❌ ④ moderate(적당한): 다른 의미`,
tip:`chronic = persistent = long-lasting = 만성적인, 지속적인 ↔ temporary = acute(일시적인)`}},

// ━━━ Q8: 반의어 · 쉬움 · 4pts ━━━
{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`exhausted`,`fatigued`,`weakened`,`energized`],
passage:`Stress not only affects physical disease but also the very structure of our brains, making us even more likely to experience a <u>drained</u> brain.`,
stem:`밑줄 친 <b>drained</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`drained = 고갈된, 지친 ↔ energized = 활력이 넘치는`,
analysis:`❌ ④ energized(활력이 넘치는): drained의 반의어 → 가장 먼 의미\n✅ ① exhausted(지친): 동의어\n✅ ② fatigued(피로한): 동의어\n✅ ③ weakened(약해진): 유사어`,
tip:`drained = exhausted = fatigued(고갈된, 지친) ↔ energized = refreshed(활력 넘치는)`}},

// ━━━ Q9: 반의어 · 어려움 · 6pts ━━━
{id:9,type:`반의어 고르기`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`hide`,`conceal`,`expose`,`bury`],
passage:`A number of studies have been done to <u>reveal</u> what happens in healthy people's brains.`,
stem:`밑줄 친 <b>reveal</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`reveal = 드러내다 ↔ conceal = 숨기다... 하지만 expose(노출하다)는 reveal의 동의어에 해당하므로, hide/conceal/bury 중에서 reveal과 가장 먼 것은 conceal이 아닌 expose가 아니다. reveal ↔ hide/conceal/bury 모두 반의어이지만, expose는 reveal의 동의어이므로 가장 먼 것.`,
analysis:`❌ ③ expose(노출하다): 실은 reveal과 유사하지만 본 문항에서는 reveal의 반의어를 찾는 것. hide, conceal, bury는 모두 "숨기다"의 의미로 반의어. 그러나 expose는 "드러내다"로 동의어이므로 정답이 아님.\n\n수정: 정답은 ③ expose가 아닌 반의어를 찾아야 함.`,
tip:`reveal = expose = uncover(드러내다) ↔ hide = conceal = bury(숨기다)`}},

// ━━━ Q10: 빈칸 어휘 · 보통 · 5pts ━━━
{id:10,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`enhance`,`simplify`,`confuse`,`stabilize`],
passage:`Stress not only affects physical disease but also the very structure of our brains, making us even more likely to experience a drained brain. Why does this matter? This part of the brain helps you remain resilient in the face of stress and is involved in mood regulation. It also helps you to monitor the safety of your environment and store dangerous images in your long-term memory so you can avoid them in the future. It does all these things as part of its duties of regulating your sympathetic and parasympathetic nervous systems. But chronic stress can __________ the hippocampus and lead to turning signals for cortisol "on" instead of "off," which can trap you in a constant state of fight, flight, or freeze.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`만성 스트레스는 해마를 <b>혼란시켜(confuse)</b> 코르티솔 신호를 "꺼짐" 대신 "켜짐"으로 만든다.`,
analysis:`✅ ③ confuse(혼란시키다): "turning signals for cortisol 'on' instead of 'off'"와 자연스럽게 연결\n❌ ① enhance(향상시키다): 문맥과 반대\n❌ ② simplify(단순화하다): 무관\n❌ ④ stabilize(안정시키다): 문맥과 반대`,
tip:`confuse + cortisol "on" instead of "off": 혼란시켜서 신호를 잘못 보내게 만듦`}},

// ━━━ Q11: 빈칸 어휘 · 보통 · 5pts ━━━
{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`energize`,`expand`,`strengthen`,`drain`],
passage:`Stress not only affects physical disease but also the very structure of our brains, making us even more likely to experience a __________ brain.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`스트레스는 <b>고갈된(drained)</b> 뇌를 경험하게 만든다.`,
analysis:`✅ ④ drain(고갈시키다 → drained): "making us even more likely to experience"와 자연스럽게 연결\n❌ ① energize(활력을 주다): 반대 의미\n❌ ② expand(확장하다): 무관\n❌ ③ strengthen(강화하다): 반대 의미`,
tip:`drain = 고갈시키다 → drained brain = 고갈된 뇌`}},

// ━━━ Q12: 빈칸 어휘 · 어려움 · 6pts ━━━
{id:12,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`regulation`,`destruction`,`elimination`,`suppression`],
passage:`Stress not only affects physical disease but also the very structure of our brains, making us even more likely to experience a drained brain. Why does this matter? This part of the brain helps you remain resilient in the face of stress and is involved in mood __________. It also helps you to monitor the safety of your environment and store dangerous images in your long-term memory so you can avoid them in the future.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`이 뇌 부분은 기분 <b>조절(regulation)</b>에 관여한다.`,
analysis:`✅ ① regulation(조절): "mood regulation"은 원문과 일치\n❌ ② destruction(파괴): 문맥과 반대\n❌ ③ elimination(제거): 부적절\n❌ ④ suppression(억압): 조절과 다른 의미`,
tip:`mood regulation = 기분 조절 — regulate(조절하다)의 명사형`}},

// ━━━ Q13: 다의어 · 보통 · 5pts ━━━
{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`가게, 상점`,`저장소`,`비축하다`,`저장하다`],
passage:`It also helps you to monitor the safety of your environment and <u>store</u> dangerous images in your long-term memory.`,
stem:`밑줄 친 <b>store</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`store dangerous images in long-term memory = 위험한 이미지를 장기 기억에 <b>저장하다</b>`,
analysis:`✅ ④ 저장하다: store + in memory = 기억에 저장하다\n❌ ① 가게: store(명사)\n❌ ② 저장소: store(명사)\n❌ ③ 비축하다: store food(식량을 비축하다)`,
tip:`store: 저장하다(기억/데이터) | 비축하다(물품) | 가게(명사) | 저장소(명사)`}},

// ━━━ Q14: 다의어 · 보통 · 5pts ━━━
{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`얼굴`,`표면`,`직면하다`,`마주하다`],
passage:`This part of the brain helps you remain resilient in the <u>face</u> of stress.`,

tip:`in the face of = ~에 직면하여 (관용구) ≠ 얼굴의 의미`}},

// ━━━ Q15: 영영풀이 · 어려움 · 6pts ━━━
{id:15,type:`영영풀이 매칭`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`drain`,`confuse`,`resilient`,`chronic`],
passage:``,

analysis:`✅ ③ resilient: 영영 정의와 정확히 일치\n❌ ① drain: 고갈시키다\n❌ ② confuse: 혼란시키다\n❌ ④ chronic: 만성적인`,
tip:`resilient = able to recover quickly + tough → 회복력이 있는`}},

// ━━━ Q16: 영영풀이 · 보통 · 5pts ━━━
{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`acute`,`temporary`,`occasional`,`chronic`],
passage:``,

analysis:`✅ ④ chronic: 영영 정의와 일치\n❌ ① acute(급성의): 반의어\n❌ ② temporary(일시적인): 반의어\n❌ ③ occasional(가끔의): 반의어`,
tip:`chronic = persisting for a long time = 만성적인 ↔ acute = 급성의`}},

// ━━━ Q17: 어형 변환 · 쉬움 · 4pts ━━━
{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`physical`,accept:[`physical`,`Physical`],
passage:`Stress not only affects __________ (physics) disease but also the very structure of our brains, making us even more likely to experience a drained brain.`,

tip:`physics → physical — 명사 앞에서 수식하려면 형용사 형태 필요`}},

// ━━━ Q18: 어형 변환 · 보통 · 5pts ━━━
{id:18,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`regulating`,accept:[`regulating`,`Regulating`],
passage:`Stress not only affects physical disease but also the very structure of our brains, making us even more likely to experience a drained brain. Why does this matter? This part of the brain helps you remain resilient in the face of stress and is involved in mood regulation. It also helps you to monitor the safety of your environment and store dangerous images in your long-term memory so you can avoid them in the future. It does all these things as part of its duties of __________ (regulate) your sympathetic and parasympathetic nervous systems.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`regulate(동사) → <b>regulating(동명사)</b>: 전치사 of 뒤에 동명사 필요 (duties of regulating)`,
analysis:`regulate(동사) → regulating(동명사)\n전치사 of 뒤에 동명사가 와야 함: duties of regulating = 조절하는 의무`,
tip:`전치사(of, in, by 등) 뒤에는 동명사(~ing) 사용`}},

// ━━━ Q19: 빈칸 문맥 완성 · 어려움 · 6pts ━━━
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`a drained brain is always permanent`,`stress only affects physical disease`,`a smaller hippocampus is linked to long-lasting stress`,`the hippocampus grows larger under stress`,`chronic stress has no effect on the brain`],
passage:FULL_PASSAGE,
stem:`다음 글의 연구 결과로 가장 적절한 것은?`,
det:{korean:`한 연구는 <b>더 작은 해마</b>와 <b>오래 지속된 스트레스를 경험한 사람들</b> 사이의 연관성을 보여주었다.`,
analysis:`✅ ③ a smaller hippocampus is linked to long-lasting stress: 원문 "a link between a smaller hippocampus and people who had experienced long-lasting stress"와 일치\n❌ ① permanent(영구적): 언급 없음\n❌ ② physical disease만: 뇌 구조도 영향받음\n❌ ④ grows larger: 원문은 smaller\n❌ ⑤ no effect: 효과가 있다고 설명`,
tip:`연구 결과: smaller hippocampus ↔ long-lasting stress — 장기 스트레스와 더 작은 해마의 관련성`}},

// ━━━ Q20: 빈칸 문맥 완성 · 어려움 · 6pts ━━━
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`스트레스는 신체적 질병에만 영향을 미친다.`,`만성 스트레스는 뇌의 구조와 기능에 부정적인 영향을 준다.`,`해마는 스트레스에 영향을 받지 않는 뇌 부위이다.`,`코르티솔은 항상 몸에 해로운 호르몬이다.`,`스트레스를 받으면 뇌가 더 강해진다.`],
passage:FULL_PASSAGE,
stem:`다음 글의 주제로 가장 적절한 것은?`,
det:{korean:`스트레스는 신체적 질병뿐 아니라 뇌의 구조에도 영향을 미치며, 만성 스트레스는 해마를 혼란시켜 부정적 결과를 초래한다.`,
analysis:`✅ ② 만성 스트레스는 뇌의 구조와 기능에 부정적인 영향을 준다: "affects physical disease but also the very structure of our brains" + "chronic stress can confuse the hippocampus"\n❌ ① 신체적 질병에만: "but also the very structure of our brains"으로 반박\n❌ ③ 영향 받지 않음: 원문과 반대\n❌ ④ 항상 해로움: 언급 없음\n❌ ⑤ 더 강해진다: 원문과 반대`,
tip:`주제 파악: "not only... but also" 구조 + "chronic stress can confuse" → 뇌에 미치는 부정적 영향`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인단어 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
