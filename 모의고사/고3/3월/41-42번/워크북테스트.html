<style>

.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0f0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:#EDE7F6;color:var(--o);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--oxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0c8dc;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--o);color:var(--o);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #d8d0e8;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FAFBFF;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F3F0FF;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:#EDE7F6;color:var(--o);}.expl-tag.tip{background:var(--oxl);color:var(--od);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--o);}.expl-box.tip-b{border-left:3px solid var(--o);background:var(--oxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

<div class="start-container">

  <h1 class="start-title">온라인워크북 <span>TEST</span></h1>
  <p class="start-subtitle">2025 고3 3월 모의고사 · 41-42번 · 제목+어휘 · 20문항</p>
  <div class="info-card"><div class="info-card-header">📚 시험 정보</div><div class="info-rows">

  </div></div>
  <div class="chip-row"><div class="chip">📝 20문항</div><div class="chip">⏱️ 20분</div><div class="chip">✅ 80점 이상 통과</div><div class="chip">📊 100점 만점</div></div>

<script>
const EI={"subject":"2025 고3 3월 모의고사","pub":"41-42번","lesson":"제목+어휘","title":"Literary Translation & Philosophy","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_2025_g3_mar_41-42_v1"};

const FULL_PASSAGE=`Translating a literary text is challenging, and it\u2019s often said there will be an inevitable loss in translation. But that challenge frequently inspires creative re-renderings that offer the prospect of a gain in translation as well. A washing-machine manual doesn\u2019t present the same challenges, nor therefore does it inspire the same creativity either. But where, in terms of the opposition between literary and nonliterary language, might we position philosophy\u2019s language? Might philosophy want to avoid a translatory economy that aims for a gain in translation but risks a loss? Philosophy wishes to convey its truths intact, without loss\u2014and without gain either, or at least it might hesitate to offer its truths to translation without further clarification of what a gain, and indeed a gain in depth, actually means. It cannot be a matter of offsetting \u201cstylistic losses.\u201d The loss philosophy fears is a loss of meaning, the compromising of a truth. Thus, philosophy might refuse to be placed on the side of nonliterary language, and express itself in unstylish language, like Badiou\u2019s mathematical writing, so that no translator is prompted to rude and bold acts of creative rewriting. If philosophy wishes to increase its range and avoid being restricted to a national or regional tradition, it needs a translation model that conveys philosophical truths to the world without any \u201ceconomic\u201d fluctuations of loss and gain.`;

const Q=[
// ━━━ 어법 빈칸 (Q1-Q5) ━━━
{id:1,type:`어법`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`challenge`,`challenging`,`challenged`,`to challenge`],
passage:FULL_PASSAGE.replace('is challenging','is __________'),
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`be동사(is) 뒤 보어 자리에 <b>형용사 challenging</b>이 와야 한다. "번역은 도전적이다"`,
analysis:`✅ ② challenging: be동사 뒤 보어 → 형용사 필요\n❌ ① challenge: 명사/동사 원형\n❌ ③ challenged: 과거분사 → "도전받은"의 의미\n❌ ④ to challenge: to부정사 → 보어 자리 부적절`,
tip:`be동사 + 형용사(보어): is challenging = 도전적이다`}},

{id:2,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`inspire`,`inspiring`,`inspires`,`inspired`],
passage:`Translating a literary text is challenging, and it\u2019s often said there will be an inevitable loss in translation. But that challenge frequently __________ creative re-renderings that offer the prospect of a gain in translation as well.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`주어 "that challenge"가 3인칭 단수이므로 <b>단수 동사 inspires</b>가 적절하다.`,
analysis:`✅ ③ inspires: 주어 that challenge = 단수 → 단수 동사\n❌ ① inspire: 복수 동사\n❌ ② inspiring: 분사 → 동사 자리 불가\n❌ ④ inspired: 과거형이지만 문맥상 현재 시제`,
tip:`주어-동사 수 일치: that challenge(단수) → inspires(단수 동사)`}},

{id:3,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`where`,`which`,`what`,`how`],
passage:`But __________, in terms of the opposition between literary and nonliterary language, might we position philosophy\u2019s language?`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`"문학적 언어와 비문학적 언어의 대립에서 철학의 언어를 <b>어디에(where)</b> 위치시킬 것인가?" → 위치를 묻는 의문부사`,
analysis:`✅ ① where: position(위치시키다)의 장소를 묻는 의문부사\n❌ ② which: 선택을 묻는 의문사 → 문맥 부적절\n❌ ③ what: 대상을 묻는 의문사 → position과 어울리지 않음\n❌ ④ how: 방법을 묻는 의문부사 → position과 어울리지 않음`,
tip:`position(위치시키다) + where = 어디에 위치시킬까?`}},

{id:4,type:`어법`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`restrict`,`restricted`,`restricting`,`to restrict`],
passage:`If philosophy wishes to increase its range and avoid being __________ to a national or regional tradition, it needs a translation model that conveys philosophical truths to the world.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`"avoid being + 과거분사(수동)" 구조에서 <b>restricted(제한된)</b>가 적절하다. 철학이 국가적/지역적 전통에 <b>제한되는 것</b>을 피하고자 한다.`,
analysis:`✅ ② restricted: avoid being restricted = 제한되는 것을 피하다 (수동태)\n❌ ① restrict: 동사원형 → being 뒤에 부적절\n❌ ③ restricting: 능동 의미 → 철학이 제한하는 것이 아니라 제한되는 것\n❌ ④ to restrict: to부정사 → being 뒤에 부적절`,
tip:`avoid being + p.p.(과거분사) = ~되는 것을 피하다 (수동태 동명사)`}},

{id:5,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`①`,`②`,`③`],
passage:`Translating a literary text is challenging, and it\u2019s often said there will be an inevitable loss in translation. But that challenge frequently inspires creative re-renderings that offer the prospect of a gain in translation as well. A washing-machine manual doesn\u2019t present the same challenges, nor therefore does it inspire the same creativity either. But where, in terms of the opposition between literary and nonliterary language, might we position philosophy\u2019s language? Might philosophy want to avoid a translatory economy that aims for a gain in translation but risks a loss? Philosophy wishes to convey its truths intact, without loss\u2014and without gain either, or at least it might hesitate to offer its truths to translation without further clarification of ①<u>what</u> a gain, and indeed a gain in depth, actually means. It cannot be a matter of offsetting "stylistic losses." The loss philosophy fears is a loss of meaning, the compromising of a truth. Thus, philosophy might refuse to be placed on the side of nonliterary language, and express itself in unstylish language, like Badiou\u2019s mathematical writing, so that no translator is ②<u>prompted</u> to rude and bold acts of creative rewriting. If philosophy wishes to increase its range and avoid being restricted to a national or regional tradition, it needs a translation model that ③<u>conveying</u> philosophical truths to the world without any "economic" fluctuations of loss and gain.`,
stem:`다음 글의 밑줄 친 ①~③ 중, 어법상 <b>틀린</b> 것은?`,
det:{korean:`③ conveying → <b>conveys</b>: 관계대명사 that의 선행사 a translation model(단수)에 맞는 동사가 필요하다.`,
analysis:`❌ ③ conveying: 주어가 필요한 동사 자리에 분사 → conveys(단수 동사)가 되어야 함\n✅ ① what: 간접의문문의 의문대명사 → 올바름\n✅ ② prompted: be prompted to = ~하도록 유도되다 → 수동태 올바름`,
tip:`관계대명사 that + 동사: 선행사의 수에 맞는 동사 필요 (a model that conveys)`}},

// ━━━ 내용 이해 (Q6-Q8) ━━━
{id:6,type:`내용이해`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`세탁기 설명서는 문학 번역과 같은 창의적 도전을 제시한다.`,`문학 번역의 도전은 창의적 재해석을 불러일으킬 수 있다.`,`철학은 번역에서 문체적 손실을 상쇄하는 것을 목표로 한다.`,`철학의 언어는 명확히 비문학적 언어에 속한다.`],
passage:FULL_PASSAGE,
stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,
det:{korean:`"that challenge frequently inspires creative re-renderings" → 문학 번역의 도전은 창의적 재해석을 불러일으킨다.`,
analysis:`✅ ② 문학 번역의 도전은 창의적 재해석을 불러일으킬 수 있다: 원문과 일치\n❌ ① 세탁기 설명서는 같은 도전을 제시하지 않음 (doesn't present)\n❌ ③ 철학은 상쇄가 아닌 변동 없는 전달을 원함\n❌ ④ 철학의 언어 위치는 불분명하다고 질문함`,
tip:`내용 일치: "challenge inspires creative re-renderings" = 도전이 창의적 재해석을 불러일으킴`}},

{id:7,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`번역에서의 손실은 피할 수 있다.`,`세탁기 설명서도 문학 번역과 같은 창의성을 필요로 한다.`,`철학은 번역에서 의미의 손실과 진리의 훼손을 두려워한다.`,`Badiou의 글은 번역자에게 창의적 개작을 장려한다.`],
passage:FULL_PASSAGE,
stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,
det:{korean:`"The loss philosophy fears is a loss of meaning, the compromising of a truth" → 철학은 의미의 손실과 진리의 훼손을 두려워한다.`,
analysis:`✅ ③ 원문과 일치: 의미 손실 + 진리 훼손을 두려워함\n❌ ① inevitable(불가피한)이라고 함\n❌ ② doesn't present the same challenges\n❌ ④ Badiou의 글은 창의적 개작을 방지하기 위한 예시`,
tip:`philosophy fears: loss of meaning + compromising of a truth`}},

{id:8,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`문학 번역은 항상 원문보다 나쁜 결과를 낳는다.`,`철학은 번역에서 이득과 손실의 경제적 변동 없이 진리를 전달하는 모델이 필요하다.`,`비문학적 언어는 문학적 언어보다 번역에 유리하다.`,`모든 철학서는 수학적 문체로 써야 한다.`],
passage:FULL_PASSAGE,
stem:`다음 글에서 필자의 주장에 가장 가까운 것은?`,
det:{korean:`"without any 'economic' fluctuations of loss and gain" → 이득과 손실의 변동 없이 진리를 전달하는 번역 모델 필요`,
analysis:`✅ ② 원문 핵심과 일치\n❌ ① 항상 나쁜 결과: "gain in translation" 가능성도 언급\n❌ ③ 비문학적 언어 유리: 그런 비교 없음\n❌ ④ 모든 철학서: Badiou는 하나의 예시`,
tip:`핵심: "without any 'economic' fluctuations" → 변동 없는 번역 모델`}},

// ━━━ 빈칸 추론 (Q9-Q11) ━━━
{id:9,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`conceal`,`fabricate`,`convey`,`distort`],
passage:FULL_PASSAGE.replace('wishes to convey its truths','wishes to __________ its truths'),
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`철학은 진리를 온전하게 <b>전달하고자(convey)</b> 한다.`,
analysis:`✅ ③ convey(전달하다): "intact, without loss"와 자연스럽게 연결\n❌ ① conceal(숨기다): 반대\n❌ ② fabricate(날조하다): 반대\n❌ ④ distort(왜곡하다): 반대`,
tip:`convey + intact = 온전하게 전달하다`}},

{id:10,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`refuse`,`agree`,`prefer`,`aspire`],
passage:FULL_PASSAGE.replace('might refuse to be placed','might __________ to be placed'),
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`철학은 비문학적 언어 쪽에 놓이기를 <b>거부할(refuse)</b> 수 있다. 세련되지 않은 언어로 표현하여 번역자가 창의적 개작을 하지 않도록.`,
analysis:`✅ ① refuse(거부하다): 문맥상 비문학적 언어 쪽에 놓이기를 거부\n❌ ② agree(동의하다): 문맥과 반대\n❌ ③ prefer(선호하다): 문맥과 반대\n❌ ④ aspire(열망하다): 문맥과 반대`,
tip:`refuse to be placed on the side of nonliterary language = 비문학 쪽에 놓이길 거부`}},

{id:11,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:3,
ch:[`확장`,`축소`,`보존`,`변동`],
passage:FULL_PASSAGE,
stem:`다음 글에서 철학이 번역 모델에서 배제하고자 하는 "경제적" 요소는 무엇인가?`,
det:{korean:`"without any 'economic' fluctuations of loss and gain" → 이득과 손실의 <b>변동(fluctuations)</b>을 배제하고자 한다.`,
analysis:`✅ ④ 변동: fluctuations = 변동, 등락 → 이득과 손실의 변동을 없애고자 함\n❌ ① 확장: 언급 없음\n❌ ② 축소: 언급 없음\n❌ ③ 보존: 진리 보존은 목표이지 배제 대상이 아님`,
tip:`fluctuations of loss and gain = 이득과 손실의 변동/등락`}},

// ━━━ 서술형 (Q12-Q16) ━━━
{id:12,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`challenging`,accept:[`challenging`,`Challenging`],
passage:`Translating a literary text is __________ (challenge), and it\u2019s often said there will be an inevitable loss in translation.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`challenge → <b>challenging</b>: be동사 뒤 보어 자리에 형용사 필요`,
analysis:`challenge(명사) → challenging(형용사)\nbe동사 뒤 보어 = 형용사`,
tip:`challenge → challenging / interest → interesting — 감정유발 형용사`}},

{id:13,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`clarification`,accept:[`clarification`,`Clarification`],
passage:`...it might hesitate to offer its truths to translation without further __________ (clarify) of what a gain actually means.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`clarify(동사) → <b>clarification(명사)</b>: further(형용사) 뒤에 명사 필요`,
analysis:`clarify → clarification: without further + 명사 구조`,
tip:`clarify → clarification / simplify → simplification — -fy → -fication`}},

{id:14,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`intact`,accept:[`intact`,`Intact`],
passage:FULL_PASSAGE,
stem:`다음 글에서 철학이 진리를 전달할 때 원하는 상태를 나타내는 <b>1단어</b>를 본문에서 찾아 쓰시오.`,
det:{korean:`"convey its truths <b>intact</b>" → 온전하게, 손상 없이`,
analysis:`convey its truths intact → 진리를 온전하게 전달하다 → intact`,
tip:`intact = 온전한, 손상되지 않은 — 철학의 핵심 목표`}},

{id:15,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`loss of meaning`,accept:[`loss of meaning`,`a loss of meaning`,`Loss of meaning`],
passage:FULL_PASSAGE,
stem:`다음 글에서 철학이 두려워하는 것을 본문에서 <b>3단어</b>로 찾아 쓰시오.`,
det:{korean:`"The loss philosophy fears is a <b>loss of meaning</b>" → 의미의 상실`,
analysis:`philosophy fears → a loss of meaning(의미의 상실)`,
tip:`loss of meaning = 의미의 상실 — 철학이 번역에서 가장 두려워하는 것`}},

{id:16,type:`서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`fluctuations`,accept:[`fluctuations`,`Fluctuations`],
passage:FULL_PASSAGE,
stem:`다음 글에서 철학이 번역에서 배제하고자 하는 "경제적" 현상을 나타내는 <b>1단어</b>를 본문에서 찾아 쓰시오.`,
det:{korean:`"without any 'economic' <b>fluctuations</b> of loss and gain" → 변동`,
analysis:`fluctuations = 변동, 등락 → 이득과 손실의 경제적 변동`,
tip:`fluctuations of loss and gain = 이득과 손실의 변동/등락`}},

// ━━━ T/F (Q17-Q20) ━━━
{id:17,type:`T/F`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`True`,`False`],
passage:FULL_PASSAGE,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>Literary translation often involves an inevitable loss.</b>"`,
det:{korean:`"it's often said there will be an inevitable loss in translation" → <b>True</b>`,
analysis:`✅ True: 원문과 일치`,
tip:`inevitable loss in translation = 번역에서의 불가피한 손실`}},

{id:18,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`True`,`False`],
passage:FULL_PASSAGE,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>A washing-machine manual presents the same creative challenges as literary texts.</b>"`,
det:{korean:`"A washing-machine manual doesn't present the same challenges" → 같은 도전을 제시하지 않는다 → <b>False</b>`,
analysis:`❌ False: 원문은 "doesn't present the same challenges" → 같은 도전이 아님`,
tip:`doesn't present the same challenges = 같은 도전을 제시하지 않는다`}},

{id:19,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`True`,`False`],
passage:FULL_PASSAGE,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>Philosophy fears a loss of meaning in translation.</b>"`,
det:{korean:`"The loss philosophy fears is a loss of meaning" → <b>True</b>`,
analysis:`✅ True: 원문과 정확히 일치`,
tip:`philosophy fears: loss of meaning = 의미의 상실을 두려워함`}},

{id:20,type:`T/F`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`True`,`False`],
passage:FULL_PASSAGE,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>Philosophy prefers to be placed on the side of nonliterary language.</b>"`,
det:{korean:`본문: "philosophy might refuse to be placed on the side of nonliterary language" → 거부한다. "선호한다(prefers)"는 <b>False</b>.`,
analysis:`❌ False: refuse(거부) ≠ prefer(선호) → 본문과 반대`,
tip:`refuse(거부) ↔ prefer(선호) — 철학은 비문학 쪽에 놓이기를 거부함`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법':'tag-grammar','내용이해':'tag-content','빈칸추론':'tag-blank','서술형':'tag-written','T/F':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch?(d.q.ch.length===5?'①②③④⑤':d.q.ch.length===4?'①②③④':d.q.ch.length===3?'①②③':'①②'):'';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:#EDE7F6;color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:#EDE7F6;color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인워크북 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
