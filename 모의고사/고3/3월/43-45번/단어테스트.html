.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}

.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #dde8df;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--gxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--gxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}

</style>

const EI={"subject":"2025 고3 3월 모의고사","pub":"43-45번","lesson":"순서+지칭+내용","title":"Spark Fellowship Brothers","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_2025_g3_mar_43-45_v1"};

const FULL_PASSAGE=`In a small town known for its flourishing academic community, two brothers, James and Daniel Carter, stood out for their exceptional effort and talent. James and his younger brother, Daniel, both applied for the Spark Fellowship. The Spark Fellowship was a highly respected program that selects and supports outstanding students every two years. Unsurprisingly, both brothers advanced to the final round.
Without Daniel knowing, James went to the selection committee. He told the committee, "Daniel has always been the more dedicated and talented one. He will excel in this program like no one else." Meanwhile, Daniel had the same idea as his older brother. He believed that his brother was the more ideal and deserving candidate. He also decided to visit and speak to the committee.
However, the program had a strict rule: only one family member could be selected in the same year. This posed a challenge to the selection committee, who thought it almost impossible to choose between the two equally impressive candidates. The committee gathered together, struggling all day long to decide. When James found out about this rule, he tried to seek a way to demonstrate Daniel's exceptional talent to the selection committee.
Not long after James had left, Daniel showed up at the selection committee and advocated for his brother, saying "James' leadership and vision make him the perfect choice. He deserves this chance more than I do." Moved by their selflessness, the committee made an exception by selecting both brothers in the same year, for the first time in its history. Their story inspired others, showing that true success lies not only in individual achievements but also in supporting and encouraging others.`;

const Q=[
{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`flourishing — exceptional — outstanding`,`declining — exceptional — outstanding`,`flourishing — mediocre — outstanding`,`flourishing — exceptional — average`,`declining — mediocre — average`],
passage:`In a small town known for its <b>(A)</b> academic community, two brothers, James and Daniel Carter, stood out for their <b>(B)</b> effort and talent. James and his younger brother, Daniel, both applied for the Spark Fellowship. The Spark Fellowship was a highly respected program that selects and supports <b>(C)</b> students every two years.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`<b>번창하는(flourishing)</b> 학술 공동체, <b>뛰어난(exceptional)</b> 노력과 재능, <b>우수한(outstanding)</b> 학생들을 선발한다.`,
analysis:`✅ ① flourishing — exceptional — outstanding: 원문과 일치\n❌ ② declining(쇠퇴하는): flourishing의 반의어\n❌ ③ mediocre(평범한): exceptional의 반의어\n❌ ④ average(보통의): outstanding의 반의어\n❌ ⑤ 세 단어 모두 반의어`,
tip:`flourishing(번창하는)↔declining(쇠퇴하는), exceptional(뛰어난)↔mediocre(평범한), outstanding(우수한)↔average(보통의)`}},
{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`dedicated — deserving — selflessness`,`lazy — deserving — selflessness`,`dedicated — unworthy — selflessness`,`dedicated — deserving — selfishness`,`lazy — unworthy — selfishness`],
passage:`He told the committee, "Daniel has always been the more <b>(A)</b> and talented one. He will excel in this program like no one else." Meanwhile, Daniel had the same idea as his older brother. He believed that his brother was the more ideal and <b>(B)</b> candidate. He also decided to visit and speak to the committee. ... Moved by their <b>(C)</b>, the committee made an exception by selecting both brothers in the same year.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`더 <b>헌신적인(dedicated)</b> 사람, 더 <b>자격 있는(deserving)</b> 후보, 그들의 <b>이타심(selflessness)</b>에 감동.`,
analysis:`✅ ① dedicated — deserving — selflessness: 원문과 일치\n❌ ② lazy(게으른): dedicated의 반의어\n❌ ③ unworthy(자격 없는): deserving의 반의어\n❌ ④ selfishness(이기심): selflessness의 반의어\n❌ ⑤ 모두 반의어`,
tip:`dedicated(헌신적인)↔lazy(게으른), deserving(자격 있는)↔unworthy(자격 없는), selflessness(이타심)↔selfishness(이기심)`}},
{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`In a small town known for its ①<u>flourishing</u> academic community, two brothers, James and Daniel Carter, stood out for their ②<u>exceptional</u> effort and talent. James and his younger brother, Daniel, both applied for the Spark Fellowship. The Spark Fellowship was a highly ③<u>respected</u> program that selects and supports outstanding students every two years. Unsurprisingly, both brothers advanced to the final round. Without Daniel knowing, James went to the selection committee. He told the committee, "Daniel has always been the more dedicated and talented one. He will excel in this program like no one else." Meanwhile, Daniel had the same idea as his older brother. He believed that his brother was the more ideal and deserving candidate. ... Moved by their ④<u>selfishness</u>, the committee made an exception by selecting both brothers in the same year, for the first time in its history. Their story inspired others, showing that true success lies not only in individual ⑤<u>achievements</u> but also in supporting and encouraging others.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`위원회는 두 형제의 <b>이타심(selflessness)</b>에 감동받았다. ④ selfishness(이기심)는 selflessness의 반의어로 부적절.`,
analysis:`❌ ④ selfishness(이기심): 원문은 selflessness(이타심) → 서로를 위해 양보하는 모습과 어울리지 않음\n✅ ① flourishing: 원문 일치\n✅ ② exceptional: 원문 일치\n✅ ③ respected: 원문 일치\n✅ ⑤ achievements: 원문 일치`,
tip:`selflessness(이타심) ↔ selfishness(이기심) — 형제가 서로를 추천하는 이타적 행동`}},
{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`In a small town known for its flourishing academic community, two brothers, James and Daniel Carter, stood out for their exceptional effort and talent. James and his younger brother, Daniel, both applied for the Spark Fellowship. The Spark Fellowship was a highly respected program that selects and supports outstanding students every two years. Unsurprisingly, both brothers ①<u>advanced</u> to the final round. Without Daniel knowing, James went to the selection committee. He told the committee, "Daniel has always been the more ②<u>dedicated</u> and talented one." ... However, the program had a strict rule: only one family member could be selected in the same year. This posed a ③<u>solution</u> to the selection committee, who thought it almost impossible to choose between the two equally impressive candidates. The committee gathered together, ④<u>struggling</u> all day long to decide. ... Moved by their selflessness, the committee made an ⑤<u>exception</u> by selecting both brothers in the same year.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`한 가족에서 한 명만 선발할 수 있다는 규정은 위원회에 <b>도전/난제(challenge)</b>를 던졌다. ③ solution(해결책)은 challenge의 반의어로 부적절.`,
analysis:`❌ ③ solution(해결책): 원문은 challenge(난제) → 한 가족 1명 규정이 해결책이 아니라 문제를 야기함\n✅ ① advanced: 원문 일치\n✅ ② dedicated: 원문 일치\n✅ ④ struggling: 원문 일치\n✅ ⑤ exception: 원문 일치`,
tip:`challenge(난제) ↔ solution(해결책) — 규정이 위원회에 문제를 야기했다`}},
{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,
ch:[`declining`,`struggling`,`thriving`,`stagnating`,`eliminate`],
passage:`In a small town known for its <u>flourishing</u> academic community...`,
stem:`밑줄 친 <b>flourishing</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`flourishing = 번창하는, thriving = 번성하는 → 동의어`,
analysis:`✅ ③ thriving(번성하는): flourishing의 동의어\n❌ ① declining(쇠퇴하는): 반의어\n❌ ② struggling(고군분투하는): 다른 의미\n❌ ④ stagnating(정체하는): 반의어`,
tip:`flourishing = thriving = prospering = 번창하는`}},
{id:6,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`protested`,`supported`,`criticized`,`ignored`,`eliminate`],
passage:`Daniel showed up at the selection committee and <u>advocated</u> for his brother.`,
stem:`밑줄 친 <b>advocated</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`advocated for = ~를 옹호하다/지지하다, supported = 지지하다 → 동의어`,
analysis:`✅ ② supported(지지하다): advocated for의 동의어\n❌ ① protested(항의하다): 다른 의미\n❌ ③ criticized(비판하다): 반의어\n❌ ④ ignored(무시하다): 반의어`,
tip:`advocate for = support = champion = 지지하다, 옹호하다`}},
{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`unselfishness`,`generosity`,`pride`,`ambition`,`eliminate`],
passage:`Moved by their <u>selflessness</u>, the committee made an exception.`,
stem:`밑줄 친 <b>selflessness</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`selflessness = 이타심, unselfishness = 비이기적임 → 동의어`,
analysis:`✅ ① unselfishness(비이기적임): selflessness의 동의어\n✅ ② generosity(관대함): 유사하지만 정확히 같지 않음\n❌ ③ pride(자존심): 다른 의미\n❌ ④ ambition(야망): 다른 의미`,
tip:`selflessness = unselfishness = altruism = 이타심`}},
{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`remarkable`,`extraordinary`,`notable`,`ordinary`,`eliminate`],
passage:`Two brothers, James and Daniel Carter, stood out for their <u>exceptional</u> effort and talent.`,
stem:`밑줄 친 <b>exceptional</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`exceptional = 뛰어난 ↔ ordinary = 보통의, 평범한`,
analysis:`❌ ④ ordinary(보통의): exceptional의 반의어 → 가장 먼 의미\n✅ ① remarkable(주목할 만한): 유사어\n✅ ② extraordinary(비범한): 동의어\n✅ ③ notable(주목할 만한): 유사어`,
tip:`exceptional = remarkable = extraordinary ↔ ordinary = common = average`}},
{id:9,type:`반의어 고르기`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`committed`,`devoted`,`indifferent`,`passionate`,`eliminate`],
passage:`"Daniel has always been the more <u>dedicated</u> and talented one."`,
stem:`밑줄 친 <b>dedicated</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`dedicated = 헌신적인 ↔ indifferent = 무관심한`,
analysis:`❌ ③ indifferent(무관심한): dedicated의 반의어 → 가장 먼 의미\n✅ ① committed(헌신적인): 동의어\n✅ ② devoted(헌신적인): 동의어\n✅ ④ passionate(열정적인): 유사어`,
tip:`dedicated = committed = devoted ↔ indifferent = apathetic`}},
{id:10,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,

{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:1,

analysis:`✅ ④ selflessness(이타심): 서로를 추천하는 이타적 행동에 감동\n❌ ① selfishness(이기심): 반대\n❌ ② competitiveness(경쟁심): 문맥과 반대\n❌ ③ rivalry(경쟁): 문맥과 반대`,

{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`지위, 직위`,`서다, 일어서다`,`두드러지다, 눈에 띄다`,`참다, 견디다`,`위의 어느 것도 해당하지 않는다.`],

analysis:`✅ ③ 두드러지다: stood out for = ~로 인해 두각을 나타내다\n❌ ① 지위: 다른 의미\n❌ ② 서다: 기본 의미\n❌ ④ 참다: stand의 다른 의미`,
tip:`stand out = be conspicuous = 두드러지다, 눈에 띄다`}},
{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`예외 없이`,`예외, 특례`,`반대, 이의`,`제외, 배제`,`위의 어느 것도 해당하지 않는다.`],
passage:`The committee made an <u>exception</u> by selecting both brothers in the same year.`,
stem:`밑줄 친 <b>exception</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`made an exception = <b>예외/특례</b>를 두다 → 같은 해에 두 형제를 모두 선발`,

tip:`make an exception = 예외를 두다 | without exception = 예외 없이`}},
{id:15,type:`영영풀이 매칭`,diff:`어려움`,pts:6,fmt:"mc",ans:2,

det:{korean:`'다른 사람들의 필요와 소망을 자신의 것보다 더 걱정하는 자질' → <b>selflessness(이타심)</b>`,

passage:``,

{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`exceptional`,accept:[`exceptional`,`Exceptional`],

function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
