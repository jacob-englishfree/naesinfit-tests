const FULL_PASSAGE=`We lack a sufficient vocabulary for making sense of the sources of error. The more scientific knowledge we accumulate, the better we understand that the ignorance over which the knowledge enterprise is built is shockingly deep. For instance, it turned out that psychoanalysis\u2019s attempt to delimit the sources of error by categorizing the kinds of mistakes to which humans are subject in light of the therapeutic situation in the talking cure drew on misguided assumptions about the normalcy conditions for subjects. Digging deeper into the structure of the human mind as well as into the specific embodiment of human knowers equipped with a complex nervous system showed that our mental life is filled with illusions on all levels of knowledge acquisition, from sensation to perception, from scientific discourse to the use of technology based on the latest scientific discovery. Yet, once again, we cannot make sense of this picture of ourselves as immersed in the area of ignorance and illusion without at the same time relying on a huge background of shared, objective knowledge that makes our ignorance available to us. Subjectivity and objectivity are interwoven with our fallibility.`;

stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`과학적 지식을 <b>축적(accumulate)</b>할수록, 오류의 근원을 <b>한정(delimit)</b>하려 했으나, 무지를 우리에게 <b>이용가능(available)</b>하게 만든다.`,
analysis:`✅ ① accumulate — delimit — available: 원문과 정확히 일치\n❌ ② diminish(줄이다): accumulate의 반의어\n❌ ③ expand(확장하다): delimit의 반의어\n❌ ④ invisible(보이지 않는): available의 반의어\n❌ ⑤ 세 단어 모두 반의어`,
tip:`accumulate(축적)↔diminish(감소), delimit(한정)↔expand(확장), available(이용가능)↔invisible(보이지 않는)`}},

// ━━━ Q2: (A)(B)(C) 조합형 · 보통 · 5pts ━━━
{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`sufficient — misguided — objective`,`sufficient — accurate — objective`,`excessive — misguided — subjective`,`sufficient — misguided — subjective`,`excessive — accurate — objective`],
passage:`We lack a <b>(A)</b> vocabulary for making sense of the sources of error. The more scientific knowledge we accumulate, the better we understand that the ignorance over which the knowledge enterprise is built is shockingly deep. For instance, it turned out that psychoanalysis's attempt to delimit the sources of error by categorizing the kinds of mistakes to which humans are subject in light of the therapeutic situation in the talking cure drew on <b>(B)</b> assumptions about the normalcy conditions for subjects. Digging deeper into the structure of the human mind as well as into the specific embodiment of human knowers equipped with a complex nervous system showed that our mental life is filled with illusions on all levels of knowledge acquisition, from sensation to perception, from scientific discourse to the use of technology based on the latest scientific discovery. Yet, once again, we cannot make sense of this picture of ourselves as immersed in the area of ignorance and illusion without at the same time relying on a huge background of shared, <b>(C)</b> knowledge that makes our ignorance available to us. Subjectivity and objectivity are interwoven with our fallibility.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`<b>충분한(sufficient)</b> 어휘가 부족하고, <b>잘못된(misguided)</b> 가정에 기반했으며, 공유되고 <b>객관적인(objective)</b> 지식에 의존한다.`,
analysis:`✅ ① sufficient — misguided — objective: 원문 일치\n❌ ② accurate(정확한): misguided의 반의어\n❌ ③ excessive(과도한)/subjective(주관적인): 반의어 조합\n❌ ④ subjective: objective의 반의어\n❌ ⑤ excessive/accurate: 둘 다 반의어`,
tip:`sufficient(충분한)↔excessive(과도한), misguided(잘못된)↔accurate(정확한), objective(객관적)↔subjective(주관적)`}},

// ━━━ Q3: 부적절 어휘 · 쉬움 · 4pts ━━━
{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`We lack a sufficient vocabulary for making sense of the sources of error. The more scientific knowledge we ①<u>accumulate</u>, the better we understand that the ②<u>ignorance</u> over which the knowledge enterprise is built is shockingly deep. For instance, it turned out that psychoanalysis's attempt to delimit the sources of error by categorizing the kinds of mistakes to which humans are subject in light of the therapeutic situation in the talking cure drew on misguided assumptions about the normalcy conditions for subjects. Digging deeper into the structure of the human mind as well as into the specific embodiment of human knowers equipped with a complex nervous system ③<u>showed</u> that our mental life is filled with illusions on all levels of knowledge acquisition, from sensation to perception, from scientific discourse to the use of technology based on the latest scientific discovery. Yet, once again, we cannot make sense of this picture of ourselves as immersed in the area of ignorance and illusion without at the same time relying on a huge background of shared, objective knowledge that makes our ignorance ④<u>invisible</u> to us. Subjectivity and ⑤<u>objectivity</u> are interwoven with our fallibility.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`무지를 우리에게 <b>이용가능(available)</b>하게 만드는 것이지, ④ invisible(보이지 않는)은 available의 반의어로 부적절.`,
analysis:`❌ ④ invisible(보이지 않는): 원문은 available(이용 가능한) → 공유된 객관적 지식이 무지를 인식 가능하게 만든다\n✅ ① accumulate(축적하다): 원문 일치\n✅ ② ignorance(무지): 원문 일치\n✅ ③ showed(보여주었다): 원문 일치\n✅ ⑤ objectivity(객관성): 원문 일치`,
tip:`available(이용 가능한) ↔ invisible(보이지 않는) — 객관적 지식이 무지를 "인식 가능"하게 한다`}},

// ━━━ Q4: 부적절 어휘 · 보통 · 5pts ━━━
{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`We lack a sufficient vocabulary for making sense of the sources of error. The more scientific knowledge we accumulate, the better we understand that the ignorance over which the knowledge enterprise is built is shockingly ①<u>deep</u>. For instance, it turned out that psychoanalysis's attempt to ②<u>expand</u> the sources of error by categorizing the kinds of mistakes to which humans are subject in light of the therapeutic situation in the talking cure drew on misguided assumptions about the normalcy conditions for subjects. Digging deeper into the structure of the human mind as well as into the specific ③<u>embodiment</u> of human knowers equipped with a complex nervous system showed that our mental life is filled with ④<u>illusions</u> on all levels of knowledge acquisition, from sensation to perception, from scientific discourse to the use of technology based on the latest scientific discovery. Yet, once again, we cannot make sense of this picture of ourselves as immersed in the area of ignorance and illusion without at the same time relying on a huge background of shared, objective knowledge that makes our ignorance available to us. Subjectivity and objectivity are ⑤<u>interwoven</u> with our fallibility.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`오류의 근원을 <b>한정(delimit)</b>하려 했지, ② expand(확장하다)는 delimit의 반의어로 부적절.`,
analysis:`❌ ② expand(확장하다): 원문은 delimit(한정하다) → 오류의 범위를 좁히려 한 것이지 넓히려 한 것이 아님\n✅ ① deep(깊은): 원문 일치\n✅ ③ embodiment(구현, 화신): 원문 일치\n✅ ④ illusions(환상): 원문 일치\n✅ ⑤ interwoven(엮여 있는): 원문 일치`,
tip:`delimit(한정하다) ↔ expand(확장하다) — 오류의 범위를 "한정"하려 했다`}},

// ━━━ Q5: 동의어 · 쉬움 · 4pts ━━━
{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,

// ━━━ Q6: 동의어 · 보통 · 5pts ━━━
{id:6,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`expand`,`reveal`,`restrict`,`classify`,`eliminate`],
passage:`Psychoanalysis's attempt to <u>delimit</u> the sources of error by categorizing the kinds of mistakes to which humans are subject.`,

// ━━━ Q7: 동의어 · 보통 · 5pts ━━━

// ━━━ Q8: 반의어 · 쉬움 · 4pts ━━━
{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,

// ━━━ Q9: 반의어 · 어려움 · 6pts ━━━

// ━━━ Q10: 빈칸 어휘 · 보통 · 5pts ━━━
{id:10,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`simplify`,`expand`,`accumulate`,`discard`,`eliminate`],
passage:`We lack a sufficient vocabulary for making sense of the sources of error. The more scientific knowledge we __________, the better we understand that the ignorance over which the knowledge enterprise is built is shockingly deep.`,

// ━━━ Q11: 빈칸 어휘 · 보통 · 5pts ━━━
{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`celebrated`,`justified`,`well-founded`,`misguided`,`eliminate`],
passage:`It turned out that psychoanalysis's attempt to delimit the sources of error by categorizing the kinds of mistakes to which humans are subject in light of the therapeutic situation in the talking cure drew on __________ assumptions about the normalcy conditions for subjects.`,

analysis:`✅ ④ misguided(잘못된): 오류의 근원을 분류하려는 시도가 잘못된 가정에 기반\n❌ ① celebrated(유명한): 문맥 부적합\n❌ ② justified(정당한): 반의어\n❌ ③ well-founded(근거 있는): 반의어`,

// ━━━ Q12: 빈칸 어휘 · 어려움 · 6pts ━━━
{id:12,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`fallibility`,`infallibility`,`superiority`,`independence`,`eliminate`],
passage:`Yet, once again, we cannot make sense of this picture of ourselves as immersed in the area of ignorance and illusion without at the same time relying on a huge background of shared, objective knowledge that makes our ignorance available to us. Subjectivity and objectivity are interwoven with our __________.`,

tip:`fallibility = 불완전성, 틀릴 가능성 — 인간 인식의 한계를 나타내는 핵심 단어`}},

// ━━━ Q16: 영영풀이 · 보통 · 5pts ━━━

// ━━━ Q18: 어형 변환 · 보통 · 5pts ━━━

function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){return '퀴즈(예상문제)테스트';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#E8772E':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#FFF3E8,#FFE8D5':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_퀴즈_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 퀴즈 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_퀴즈_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고3';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
