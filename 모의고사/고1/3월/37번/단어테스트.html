.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FAFDFB;border-radius:var(--rs);border:1px solid #dde8df;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8efe9;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #dde8df;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FAFDFB;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F0F8F1;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"37번","lesson":"순서","title":"Cartilage and Joint Function","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_2025_g1_mar_37"};

const FULL_PASSAGE=`Cartilage is extremely important for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`;

const Q=[
{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`extremely — healthy — weight`,`extremely — healthy — weight`,`relatively — unhealthy — height`,`extremely — unhealthy — weight`,`relatively — healthy — height`],passage:`Cartilage is <b>(A)</b> important for the <b>(B)</b> functioning of a joint, especially if that joint bears <b>(C)</b>, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`연골은 관절의 <b>건강한(healthy)</b> 기능에 <b>극도로(extremely)</b> 중요하며, 특히 무릎처럼 <b>체중(weight)</b>을 지탱하는 관절에서 그렇다.`,analysis:`✅ ② extremely — healthy — weight: 원문 일치\n❌ ③ relatively/unhealthy: 반의어\n❌ ④ unhealthy: 반의어\n❌ ⑤ relatively/height: 부적절`,tip:`extremely(극도로)↔relatively(상대적으로), healthy↔unhealthy, weight(체중)↔height(키)`}},
{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`shift — released — drinks in`,`shift — increased — drinks in`,`shift — released — pushes out`,`maintain — released — drinks in`,`shift — increased — pushes out`],passage:`Cartilage is extremely important for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you <b>(A)</b> your weight from your left leg to your right, the pressure on your left knee is <b>(B)</b>.\n\n(B) The cartilage in your left knee then "<b>(C)</b>" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`체중을 <b>옮기면(shift)</b> 압력이 <b>풀리고(released)</b>, 연골이 활액을 <b>흡수한다(drinks in)</b>.`,analysis:`✅ ① shift — released — drinks in: 원문 일치\n❌ ② increased: released의 반의어\n❌ ③ pushes out: drinks in의 반의어\n❌ ④ maintain: shift의 반의어\n❌ ⑤ increased/pushes out: 둘 다 반의어`,tip:`shift(옮기다)↔maintain(유지하다), released(풀린)↔increased(증가한), drinks in(흡수)↔pushes out(밀어냄)`}},
{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Cartilage is ①<u>extremely</u> important for the ②<u>healthy</u> functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then ③<u>rejects</u> synovial fluid, in much the same way that a sponge ④<u>soaks up</u> liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it ⑤<u>respond</u> to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`연골은 활액을 <b>흡수한다(drinks in)</b>. ③ rejects(거부하다)는 drinks in의 반의어로 부적절.`,analysis:`❌ ③ rejects(거부하다): 원문은 'drinks in(흡수하다)' → 부적절\n✅ ① extremely: 극도로 → 적절\n✅ ② healthy: 건강한 → 적절\n✅ ④ soaks up: 흡수하다 → 적절\n✅ ⑤ respond: 반응하다 → 적절`,tip:`drinks in(흡수하다) ↔ rejects(거부하다) — 핵심 반의어`}},
{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Cartilage is extremely important for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the ①<u>pressure</u> on your left knee is ②<u>released</u>.\n\n(B) The cartilage in your left knee then drinks in ③<u>synovial</u> fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid ④<u>remains in</u> the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without ⑤<u>breaking</u> under the pressure.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`체중을 다시 옮기면 유체가 연골에서 <b>빠져나온다(squeezes out)</b>. ④ remains in(남아있다)은 squeezes out의 반의어로 부적절.`,analysis:`❌ ④ remains in(남아있다): 원문은 'squeezes out(빠져나온다)' → 부적절\n✅ ① pressure: 압력 → 적절\n✅ ② released: 풀린 → 적절\n✅ ③ synovial: 활액의 → 적절\n✅ ⑤ breaking: 부러지는 → 적절`,tip:`squeezes out(빠져나오다) ↔ remains in(남아있다) — 핵심 반의어`}},
{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`unimportant`,`slightly`,`moderately`,`very`],passage:`Cartilage is <u>extremely</u> important for the healthy functioning of a joint.`,stem:`밑줄 친 <b>extremely</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`extremely = 극도로, very = 매우 → 동의어`,analysis:`✅ ④ very: 매우 → extremely의 동의어\n❌ ① unimportant: 중요하지 않은\n❌ ② slightly: 약간\n❌ ③ moderately: 적당히`,tip:`extremely = very = highly = exceedingly = 극도로, 매우`}},
{id:6,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`ignores`,`absorbs`,`releases`,`creates`],passage:`The cartilage "<u>drinks in</u>" synovial fluid, in much the same way that a sponge soaks up liquid.`,stem:`밑줄 친 <b>drinks in</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`drinks in = 흡수하다, absorbs = 흡수하다 → 동의어`,analysis:`✅ ② absorbs: 흡수하다 → drinks in의 동의어\n❌ ① ignores: 무시하다\n❌ ③ releases: 방출하다\n❌ ④ creates: 만들다`,tip:`drink in = absorb = soak up = take in = 흡수하다`}},
{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`maintained`,`increased`,`freed`,`created`],passage:`When you shift your weight from your left leg to your right, the pressure on your left knee is <u>released</u>.`,stem:`밑줄 친 <b>released</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`released = 풀린, freed = 자유롭게 된 → 동의어`,analysis:`✅ ③ freed: 풀려난 → released의 동의어\n❌ ① maintained: 유지된\n❌ ② increased: 증가된\n❌ ④ created: 생성된`,tip:`release = free = let go = 풀다, 해방하다`}},
{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`repairing`,`damaging`,`cracking`,`destroying`],passage:`This squeezing of joint fluid helps it respond to the pressure of walking without <u>breaking</u> under the pressure.`,stem:`밑줄 친 <b>breaking</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`breaking = 부서지는 ↔ repairing = 수리하는`,analysis:`❌ ① repairing(수리하는): breaking의 반의어 → 가장 먼 의미\n✅ ② damaging: 손상시키는 → 유사어\n✅ ③ cracking: 균열이 가는 → 유사어\n✅ ④ destroying: 파괴하는 → 유사어`,tip:`break = crack = damage ↔ repair = fix = mend = 수리하다`}},
{id:9,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`move`,`relocate`,`keep`,`transfer`],passage:`When you <u>shift</u> your weight from your left leg to your right.`,stem:`밑줄 친 <b>shift</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`shift = 옮기다 ↔ keep = 유지하다`,analysis:`❌ ③ keep(유지하다): shift의 반의어 → 가장 먼 의미\n✅ ① move: 이동하다 → 유사어\n✅ ② relocate: 재배치하다 → 유사어\n✅ ④ transfer: 이동시키다 → 동의어`,tip:`shift = move = transfer ↔ keep = maintain = stay = 유지하다`}},
{id:10,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`unimportant`,`important`,`irrelevant`,`optional`],passage:`Cartilage is extremely __________ for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`연골은 관절의 건강한 기능에 극도로 <b>중요하다(important)</b>.`,analysis:`✅ ② important: 중요한 → 원문 일치\n❌ ① unimportant: 중요하지 않은\n❌ ③ irrelevant: 관련 없는\n❌ ④ optional: 선택적인`,tip:`extremely important = 극도로 중요한`}},
{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`sponge`,`stone`,`metal`,`glass`],passage:`Cartilage is extremely important for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a __________ soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`연골이 활액을 흡수하는 것은 <b>스펀지(sponge)</b>가 물에 넣으면 액체를 빨아들이는 것과 같다.`,analysis:`✅ ① sponge: 스펀지 → 원문 일치 (흡수 비유)\n❌ ② stone: 돌 (흡수하지 않음)\n❌ ③ metal: 금속 (흡수하지 않음)\n❌ ④ glass: 유리 (흡수하지 않음)`,tip:`sponge(스펀지): 흡수력의 대표적 비유 표현`}},
{id:12,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`flows into`,`stays in`,`squeezes out of`,`disappears from`],passage:`Cartilage is extremely important for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid __________ the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`다시 체중을 옮기면 유체의 대부분이 연골에서 <b>빠져나온다(squeezes out of)</b>.`,analysis:`✅ ③ squeezes out of: 빠져나오다 → 원문 일치\n❌ ① flows into: 흘러 들어가다\n❌ ② stays in: 머무르다\n❌ ④ disappears from: 사라지다`,tip:`squeeze out of = 짜내다, 밀려 나오다`}},
{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`체중, 무게`,`중요성`,`저울추`,`부담`],passage:`Cartilage is extremely important for the healthy functioning of a joint, especially if that joint bears <u>weight</u>.`,stem:`밑줄 친 <b>weight</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`관절이 <b>체중(weight)</b>을 지탱하는 맥락에서 사용됨.`,analysis:`✅ ① 체중, 무게: bears weight = 체중을 지탱하다\n❌ ② 중요성: carry weight = 중요성을 갖다\n❌ ③ 저울추: weight on a scale\n❌ ④ 부담: weight of responsibility`,tip:`bear weight = 무게를 지탱하다 (물리적 의미)`}},
{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`압박감 (심리적)`,`기압`,`물리적 압력`,`강요`],passage:`This squeezing of joint fluid helps it respond to the off-and-on <u>pressure</u> of walking without breaking.`,stem:`밑줄 친 <b>pressure</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`걸을 때의 반복적인 <b>물리적 압력(pressure)</b>에 반응한다.`,analysis:`✅ ③ 물리적 압력: 걷기의 on-and-off pressure = 물리적 압력\n❌ ① 압박감: psychological pressure\n❌ ② 기압: atmospheric pressure\n❌ ④ 강요: peer pressure`,tip:`pressure 다의어: 물리적 압력 / 심리적 압박 / 기압 / 강요`}},
{id:15,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`joint`,`fluid`,`sponge`,`cartilage`],passage:`<i>a strong, flexible connective tissue found in joints that cushions the bones</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`관절에서 발견되는 뼈를 보호하는 강하고 유연한 결합 조직 → <b>cartilage(연골)</b>`,analysis:`✅ ④ cartilage: 연골 → 영영 정의와 일치\n❌ ① joint: 관절\n❌ ② fluid: 유체\n❌ ③ sponge: 스펀지`,tip:`cartilage = 연골 — 관절에서 뼈를 보호하는 조직`}},
{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`cartilage`,`synovial fluid`,`sponge`,`pressure`],passage:`<i>a thick liquid found in joints that reduces friction and provides nutrients to cartilage</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`관절에서 마찰을 줄이고 연골에 영양을 공급하는 점성 액체 → <b>synovial fluid(활액)</b>`,analysis:`✅ ② synovial fluid: 활액 → 영영 정의와 일치\n❌ ① cartilage: 연골\n❌ ③ sponge: 스펀지\n❌ ④ pressure: 압력`,tip:`synovial fluid = 활액 — 관절을 윤활하는 체액`}},
{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`functioning`,accept:[`functioning`,`Functioning`],passage:`Cartilage is extremely important for the healthy __________ (function) of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`관절의 건강한 <b>기능(functioning)</b>에 → 형용사 healthy 뒤에 명사/동명사 필요`,analysis:`function → functioning: 동명사형 명사\n'healthy functioning' = 건강한 기능 (동명사가 명사로 사용)`,tip:`function(동사/명사) → functioning(동명사/명사): 기능, 작동`}},
{id:18,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`squeezing`,accept:[`squeezing`,`Squeezing`],passage:`Cartilage is extremely important for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This __________ (squeeze) of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`관절액의 <b>짜짐(squeezing)</b>이 연골이 압력에 반응하도록 돕는다 → 주어 자리에 동명사 필요`,analysis:`squeeze → squeezing: 동명사 (주어 역할)\n'This squeezing' = 이 짜는 과정이 → 주어`,tip:`squeeze → squeezing: 동명사가 주어 역할을 할 때 This/The + V-ing 구문`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:4,ch:[`(A)-(B)-(C)`,`(A)-(C)-(B)`,`(B)-(A)-(C)`,`(B)-(C)-(A)`,`(C)-(B)-(A)`],passage:FULL_PASSAGE,stem:`주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은? (원래 모의고사 37번 문제)`,det:{korean:`주어진 문장에서 연골의 중요성을 언급 → (C) 무릎 내부를 상상하며 체중 이동 시 압력 해제 → (B) 연골이 활액을 흡수하고 다시 짜냄 → (A) 이 과정이 걷기 압력에 대응하는 데 도움`,analysis:`✅ ⑤ (C)-(B)-(A): 올바른 순서\n(C) Imagine... pressure released → (B) drinks in... squeezes out → (A) This squeezing helps...\n❌ 나머지: 논리적 흐름 불일치`,tip:`순서 문제 핵심: 지시어(This squeezing)와 대명사 연결 추적`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`to prevent the joint from moving freely`,`to help the cartilage withstand repeated pressure`,`to increase the friction between bones`,`to stop the production of synovial fluid`],passage:`Cartilage drinks in synovial fluid when pressure is released, and squeezes it out when pressure returns. The main purpose of this process is __________.`,stem:`이 과정의 주된 목적으로 가장 적절한 것은?`,det:{korean:`연골이 활액을 흡수하고 내보내는 과정의 목적은 <b>반복적인 압력을 견디도록 돕는 것(to help the cartilage withstand repeated pressure)</b>이다.`,analysis:`✅ ② to help the cartilage withstand repeated pressure: 본문의 핵심 → off-and-on pressure에 대응\n❌ ① prevent from moving: 관절 움직임 방해 → 반대\n❌ ③ increase friction: 마찰 증가 → 반대\n❌ ④ stop production: 활액 생산 중단 → 언급 없음`,tip:`off-and-on pressure = 반복적 압력, withstand = 견디다 = respond without breaking`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;const mk5='①②③④⑤',mk4='①②③④';const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={t:0,o:0,w:[]};typeMap[t].t++;if(d.ok)typeMap[t].o++;else typeMap[t].w.push(d.q.id);});
let txt=`📝 온라인단어 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
