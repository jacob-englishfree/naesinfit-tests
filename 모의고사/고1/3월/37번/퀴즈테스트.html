<style>
:root{--g:#E8772E;--gd:#B85A1A;--gl:#FFF3E8;--gxl:#FFF3E8;--gxxl:#FFFAF5;--bg:#F6F2EE;--text:#1A1A2E;--tm:#7A6A5A;--tl:#A89888;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--o:#F59E0B;--ol:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}

.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--g),#D4691E);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f5efe8;}.info-row:last-child{border:none;}

.chip{background:var(--card);border:1.5px solid #e8ddd0;border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}

.history-badge{background:var(--gxl);color:var(--g);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}

.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{max-width:820px;margin:0 auto;padding:24px 20px 100px;}

.q-num{width:36px;height:36px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--gl);color:#B85A1A;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f5efe8;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--g);font-weight:800;}

.c-num{min-width:26px;height:26px;background:#f0e8dd;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}
.written-input{width:100%;padding:14px 16px;border:2px solid #d8ccbe;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);padding:10px 16px;display:flex;align-items:center;gap:5px;justify-content:center;z-index:100;overflow-x:auto;flex-wrap:wrap;}
.nav-dot{width:28px;height:28px;border-radius:50%;background:#e8ddd0;cursor:pointer;border:none;font-size:10px;font-weight:800;color:var(--tm);display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;}.nav-dot.answered{background:var(--g);color:#fff;}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,#FFF3E8,#FFE8D5);}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--g),#E8772E);color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#f0e8dd;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),#F5A623);transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FFFCFA;border-radius:var(--rs);border:1px solid #e8ddd0;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#f0e8dd;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d8ccbe;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #e8ddd0;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FFFCFA;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#FFF8F2;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"37번","lesson":"순서","title":"Cartilage and Joint Function","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g1_mar_37"};

const FULL_PASSAGE=`Cartilage is extremely important for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`;

const Q=[
{id:1,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`cartilage`,`muscle`,`tendon`,`ligament`],passage:`__________ is extremely important for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`<b>연골(Cartilage)</b>은 관절의 건강한 기능에 극도로 중요하다.`,analysis:`✅ ① cartilage: 연골 → 원문의 주어\n❌ ② muscle: 근육\n❌ ③ tendon: 힘줄\n❌ ④ ligament: 인대`,tip:`cartilage(연골): 관절의 뼈를 보호하는 탄력 있는 조직`}},
{id:2,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`destroys`,`ignores`,`bears`,`avoids`],passage:`Cartilage is extremely important for the healthy functioning of a joint, especially if that joint __________ weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`관절이 체중을 <b>지탱하는(bears)</b> 경우에 특히 중요하다.`,analysis:`✅ ③ bears: 지탱하다 → 원문 일치\n❌ ① destroys: 파괴하다\n❌ ② ignores: 무시하다\n❌ ④ avoids: 피하다`,tip:`bear weight = 체중을 지탱하다, 무게를 감당하다`}},
{id:3,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`picture`,`visualize`,`forget`,`deny`],passage:`<u>Imagine</u> for a moment that you're looking into the inner workings of your left knee.`,stem:`밑줄 친 <b>Imagine</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`imagine = 상상하다, visualize = 시각화하다/머릿속에 그리다 → 동의어`,analysis:`✅ ② visualize: 시각화하다 → imagine의 동의어\n❌ ① picture: 그림/사진 (동사로는 유사하나 visualize가 더 적확)\n❌ ③ forget: 잊다\n❌ ④ deny: 부인하다`,tip:`imagine = visualize = picture = envision = 상상하다`}},
{id:4,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`hardens`,`melts`,`evaporates`,`compresses`],passage:`Much of the fluid <u>squeezes</u> out of the cartilage.`,stem:`밑줄 친 <b>squeezes</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`squeezes = 짜내다, compresses = 압축하다 → 유사어`,analysis:`✅ ④ compresses: 압축하다 → squeeze의 유사어 (압력으로 밀어내는 의미)\n❌ ① hardens: 굳어지다\n❌ ② melts: 녹다\n❌ ③ evaporates: 증발하다`,tip:`squeeze = compress = press = 짜다, 압축하다`}},
{id:5,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`vital`,`crucial`,`negligible`,`significant`],passage:`Cartilage is <u>extremely important</u> for the healthy functioning of a joint.`,stem:`밑줄 친 <b>extremely important</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`extremely important = 극도로 중요한 ↔ negligible = 무시해도 될 만큼 사소한`,analysis:`❌ ③ negligible(무시해도 될): extremely important의 반의어 → 가장 먼 의미\n✅ ① vital: 필수적인 → 유사어\n✅ ② crucial: 결정적인 → 유사어\n✅ ④ significant: 중요한 → 유사어`,tip:`important = vital = crucial ↔ negligible = trivial = insignificant`}},
{id:6,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`expelled`,`consumed`,`absorbed`,`attracted`],passage:`The cartilage then "<u>drinks in</u>" synovial fluid.`,stem:`밑줄 친 <b>drinks in</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`drinks in = 흡수하다 ↔ expelled = 배출하다`,analysis:`❌ ① expelled(배출하다): drinks in의 반의어 → 가장 먼 의미\n✅ ② consumed: 소비하다 → 유사어\n✅ ③ absorbed: 흡수하다 → 동의어\n✅ ④ attracted: 끌어당기다 → 유사어`,tip:`drink in = absorb = take in ↔ expel = push out = 배출하다`}},
{id:7,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Cartilage is ①<u>slightly</u> important for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you ②<u>shift</u> your weight from your left leg to your right, the pressure on your left knee is ③<u>released</u>.\n\n(B) The cartilage in your left knee then ④<u>drinks in</u> synovial fluid, in much the same way that a ⑤<u>sponge</u> soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`연골은 <b>극도로(extremely)</b> 중요하다. ① slightly(약간)는 extremely의 반의어로 부적절.`,analysis:`❌ ① slightly(약간): 원문은 'extremely(극도로)' → 부적절\n✅ ② shift: 옮기다 → 적절\n✅ ③ released: 풀린 → 적절\n✅ ④ drinks in: 흡수하다 → 적절\n✅ ⑤ sponge: 스펀지 → 적절`,tip:`extremely(극도로) ↔ slightly(약간) — 정도 부사 반의어`}},
{id:8,type:`문맥상 부적절한 어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Cartilage is extremely important for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the ①<u>pressure</u> on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge ②<u>soaks up</u> liquid when put in water. When you take another step and ③<u>maintain</u> the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it ④<u>respond</u> to the ⑤<u>off-and-on</u> pressure of walking without breaking under the pressure.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`체중을 다시 왼쪽 다리로 <b>옮기면(transfer)</b>. ③ maintain(유지하다)은 transfer의 반의어로 부적절.`,analysis:`❌ ③ maintain(유지하다): 원문은 'transfer(옮기다)' → 부적절\n✅ ① pressure: 압력 → 적절\n✅ ② soaks up: 흡수하다 → 적절\n✅ ④ respond: 반응하다 → 적절\n✅ ⑤ off-and-on: 간헐적인 → 적절`,tip:`transfer(옮기다) ↔ maintain(유지하다) — 핵심 반의어`}},
{id:9,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`functioning — released — squeezes out`,`malfunctioning — released — squeezes out`,`functioning — increased — squeezes out`,`functioning — released — flows in`,`malfunctioning — increased — flows in`],passage:`Cartilage is extremely important for the healthy <b>(A)</b> of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is <b>(B)</b>.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid <b>(C)</b> of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`관절의 건강한 <b>기능(functioning)</b>에 중요하다. 체중을 옮기면 압력이 <b>풀리고(released)</b>, 다시 디디면 유체가 <b>빠져나온다(squeezes out)</b>.`,analysis:`✅ ① functioning — released — squeezes out: 원문 일치\n❌ ② malfunctioning: 오작동\n❌ ③ increased: released의 반의어\n❌ ④ flows in: squeezes out의 반의어\n❌ ⑤ 모두 반의어`,tip:`functioning↔malfunctioning, released↔increased, squeezes out↔flows in`}},
{id:10,type:`(A)(B)(C) 조합형`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`sponge — breaking — off-and-on`,`sponge — responding — constant`,`sponge — breaking — off-and-on`,`towel — breaking — off-and-on`,`sponge — breaking — continuous`],passage:`Cartilage is extremely important for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a <b>(A)</b> soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the <b>(C)</b> pressure of walking without <b>(B)</b> under the pressure.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`<b>스펀지(sponge)</b>처럼 흡수하고, <b>부서지지(breaking)</b> 않고 걷기의 <b>간헐적인(off-and-on)</b> 압력에 반응한다.`,analysis:`✅ ③ sponge — breaking — off-and-on: 원문 일치\n❌ ② responding/constant: 부적절\n❌ ④ towel: sponge가 아닌 수건\n❌ ⑤ continuous: off-and-on의 반의어`,tip:`비유: 연골 = sponge(스펀지), off-and-on = intermittent = 간헐적인`}},
{id:11,type:`영영풀이 매칭`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`cartilage`,`sponge`,`joint`,`fluid`],passage:`<i>a soft, porous material that absorbs liquid easily</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`액체를 쉽게 흡수하는 부드럽고 다공성 물질 → <b>sponge(스펀지)</b>`,analysis:`✅ ② sponge: 스펀지 → 영영 정의와 일치\n❌ ① cartilage: 연골\n❌ ③ joint: 관절\n❌ ④ fluid: 유체`,tip:`sponge = 스펀지 — 흡수력의 대표적 비유`}},
{id:12,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`shift`,`break`,`absorb`,`respond`],passage:`<i>to react or answer to something, especially a change or stimulus</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`변화나 자극에 대해 반응하거나 답하다 → <b>respond(반응하다)</b>`,analysis:`✅ ④ respond: 반응하다 → 영영 정의와 일치\n❌ ① shift: 옮기다\n❌ ② break: 부서지다\n❌ ③ absorb: 흡수하다`,tip:`respond = react = answer = 반응하다, 응답하다`}},
{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`걸음, 단계`,`발을 내딛다`,`춤 스텝`,`계단`],passage:`When you take another <u>step</u> and transfer the weight back onto your left leg.`,stem:`밑줄 친 <b>step</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`다른 <b>발을 내딛고(step)</b> 체중을 다시 옮긴다.`,analysis:`✅ ② 발을 내딛다: take a step = 한 걸음 내딛다 (걷기 맥락)\n❌ ① 단계: step by step\n❌ ③ 춤 스텝: dance step\n❌ ④ 계단: steps of a staircase`,tip:`step 다의어: 걸음(명사) / 발을 내딛다(동사) / 단계 / 계단`}},
{id:14,type:`다의어 문맥적 의미`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`(액체 등) 유체`,`유창한`,`유동적인`,`변하기 쉬운`],passage:`The cartilage drinks in synovial <u>fluid</u>, in much the same way that a sponge soaks up liquid.`,stem:`밑줄 친 <b>fluid</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`연골이 활액 <b>유체(fluid)</b>를 흡수한다.`,analysis:`✅ ① 유체: synovial fluid = 활액 (액체 명사)\n❌ ② 유창한: fluid speech\n❌ ③ 유동적인: fluid situation\n❌ ④ 변하기 쉬운: fluid plans`,tip:`fluid 다의어: 유체/액체(명사) / 유창한·유동적인(형용사)`}},
{id:15,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`healthy`,accept:[`healthy`,`Healthy`],passage:`Cartilage is extremely important for the __________ (health) functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`관절의 <b>건강한(healthy)</b> 기능 → 명사 functioning을 수식하는 형용사 필요`,analysis:`health → healthy: 명사 → 형용사\n'healthy functioning' = 건강한 기능`,tip:`health(명사: 건강) → healthy(형용사: 건강한)`}},
{id:16,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`extremely`,accept:[`extremely`,`Extremely`],passage:`Cartilage is __________ (extreme) important for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the off-and-on pressure of walking without breaking under the pressure.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`<b>극도로(extremely)</b> 중요한 → 형용사 important를 수식하는 부사 필요`,analysis:`extreme → extremely: 형용사 → 부사 (-ly)\n형용사(important)를 수식하므로 부사 형태`,tip:`extreme(형용사: 극단적인) → extremely(부사: 극도로)`}},
{id:17,type:`빈칸 문맥 완성`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`cartilage becomes weaker over time`,`cartilage works like a sponge to handle pressure`,`synovial fluid damages the cartilage`,`walking always harms your knees`],passage:FULL_PASSAGE,stem:`이 글의 요지로 가장 적절한 것은?`,det:{korean:`연골이 <b>스펀지처럼 작동하여 압력을 감당한다</b>는 것이 요지이다.`,analysis:`✅ ② cartilage works like a sponge to handle pressure: 본문의 핵심 비유와 기능 설명\n❌ ① becomes weaker: 약화 언급 없음\n❌ ③ damages: 손상 언급 없음\n❌ ④ always harms: 항상 해로움 → 반대`,tip:`핵심 비유: 연골 = 스펀지 (활액을 흡수·방출하며 압력에 대응)`}},
{id:18,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`continuous`,`permanent`,`constant`,`off-and-on`],passage:`Cartilage is extremely important for the healthy functioning of a joint, especially if that joint bears weight, like your knee.\n\n(C) Imagine for a moment that you're looking into the inner workings of your left knee as you walk down the street. When you shift your weight from your left leg to your right, the pressure on your left knee is released.\n\n(B) The cartilage in your left knee then "drinks in" synovial fluid, in much the same way that a sponge soaks up liquid when put in water. When you take another step and transfer the weight back onto your left leg, much of the fluid squeezes out of the cartilage.\n\n(A) This squeezing of joint fluid into and out of the cartilage helps it respond to the __________ pressure of walking without breaking under the pressure.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`걷기의 <b>간헐적인(off-and-on)</b> 압력에 반응한다.`,analysis:`✅ ④ off-and-on: 간헐적인 → 원문 일치 (걷기는 한 발씩 번갈아 압력이 가해짐)\n❌ ① continuous: 지속적인\n❌ ② permanent: 영구적인\n❌ ③ constant: 일정한`,tip:`off-and-on = intermittent = 간헐적인 ↔ continuous = constant = 지속적인`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:4,ch:[`(A)-(B)-(C)`,`(A)-(C)-(B)`,`(B)-(A)-(C)`,`(B)-(C)-(A)`,`(C)-(B)-(A)`],passage:FULL_PASSAGE,stem:`주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은? (원래 모의고사 37번 문제)`,det:{korean:`주어진 문장에서 연골의 중요성을 언급 → (C) 무릎 내부를 상상하며 체중 이동 시 압력 해제 → (B) 연골이 활액을 흡수하고 다시 짜냄 → (A) 이 과정이 걷기 압력에 대응하는 데 도움`,analysis:`✅ ⑤ (C)-(B)-(A): 올바른 순서\n(C) Imagine... pressure released → (B) drinks in... squeezes out → (A) This squeezing helps...\n❌ 나머지: 논리적 흐름 불일치`,tip:`순서 문제 핵심: 지시어(This squeezing)와 대명사 연결 추적`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`to protect the bones from infection`,`to store energy for later use`,`to nourish and cushion the cartilage`,`to increase the weight on the joint`],passage:`When pressure is released, cartilage drinks in synovial fluid. When pressure returns, the fluid squeezes out. The biological purpose of this cycle is __________.`,stem:`이 순환의 생물학적 목적으로 가장 적절한 것은?`,det:{korean:`압력이 풀리면 흡수하고, 돌아오면 내보내는 이 순환의 목적은 <b>연골에 영양을 공급하고 충격을 완화하는 것(to nourish and cushion the cartilage)</b>이다.`,analysis:`✅ ③ to nourish and cushion the cartilage: 활액이 영양분을 공급하고 충격을 흡수\n❌ ① protect from infection: 감염 방어 → 언급 없음\n❌ ② store energy: 에너지 저장 → 언급 없음\n❌ ④ increase weight: 무게 증가 → 반대`,tip:`synovial fluid의 역할: 윤활 + 영양 공급 + 충격 흡수`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;const mk5='①②③④⑤',mk4='①②③④';const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={t:0,o:0,w:[]};typeMap[t].t++;if(d.ok)typeMap[t].o++;else typeMap[t].w.push(d.q.id);});
let txt=`🧩 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
