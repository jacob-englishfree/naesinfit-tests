<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--g:#E8772E;--gd:#B85A1A;--gl:#FFF3E8;--gxl:#FFF3E8;--gxxl:#FFFAF5;--bg:#F6F2EE;--text:#1A1A2E;--tm:#7A6A5A;--tl:#A89888;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--o:#F59E0B;--ol:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,#FFFAF5,#FFF3E8 40%,#FFE8D5);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--g),#D4691E);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--g),#D4691E);padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f5efe8;}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid #e8ddd0;border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid #d8ccbe;border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}

.btn-outline{background:transparent;border:2px solid #d0c4b8;color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--g);color:var(--g);}
.history-badge{background:var(--gxl);color:var(--g);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}

.history-item{background:var(--card);border:1.5px solid #e8ddd0;border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--g);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--g);border-radius:50%;}

.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--o);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{max-width:820px;margin:0 auto;padding:24px 20px 100px;}
.q-card{background:var(--card);border-radius:var(--radius);margin-bottom:22px;box-shadow:var(--shadow);overflow:hidden;}

.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--gl);color:#B85A1A;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f5efe8;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--g);font-weight:800;}
.q-body{padding:22px;}

.q-stem{font-size:14px;font-weight:700;margin-bottom:16px;}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice-btn{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:2px solid #e8ddd0;border-radius:var(--rs);cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:14px;line-height:1.6;}
.choice-btn:hover{border-color:var(--g);}.choice-btn.selected{border-color:var(--g);box-shadow:0 0 0 3px rgba(232,119,46,.12);background:var(--gxxl);}
.c-num{min-width:26px;height:26px;background:#f0e8dd;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}
.written-input{width:100%;padding:14px 16px;border:2px solid #d8ccbe;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);padding:10px 16px;display:flex;align-items:center;gap:5px;justify-content:center;z-index:100;overflow-x:auto;flex-wrap:wrap;}
.nav-dot{width:28px;height:28px;border-radius:50%;background:#e8ddd0;cursor:pointer;border:none;font-size:10px;font-weight:800;color:var(--tm);display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;}.nav-dot.answered{background:var(--g);color:#fff;}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,#FFF3E8,#FFE8D5);}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--g),#E8772E);color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#f0e8dd;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),#F5A623);transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FFFCFA;border-radius:var(--rs);border:1px solid #e8ddd0;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#f0e8dd;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d8ccbe;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #e8ddd0;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FFFCFA;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#FFF8F2;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"38번","lesson":"문장삽입","title":"Piaget Morality and Water Glasses","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g1_mar_38"};

const FULL_PASSAGE=`Piaget put the same amount of water into two different glasses: a tall narrow glass and a wide glass, then asked kids to compare two glasses. Kids younger than six or seven usually say that the tall narrow glass now holds more water, because the level is higher. And when they are ready, they figure out the conservation of volume for themselves just by playing with cups of water.\n\n[삽입 문장] Piaget argued that children's understanding of morality is like their understanding of those water glasses: we can't say that it is innate or kids learn it directly from adults.\n\nRather, it is self-constructed as kids play with other kids. Taking turns in a game is like pouring water back and forth between glasses. Once kids have reached the age of five or six, then playing games and working things out together will help them learn about fairness far more effectively than any teaching from adults.`;

const Q=[
{id:1,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`different`,`same`,`larger`,`smaller`],passage:`Piaget put the __________ amount of water into two different glasses: a tall narrow glass and a wide glass, then asked kids to compare two glasses. Kids younger than six or seven usually say that the tall narrow glass now holds more water, because the level is higher. And when they are ready, they figure out the conservation of volume for themselves just by playing with cups of water.\n\n[삽입 문장] Piaget argued that children's understanding of morality is like their understanding of those water glasses: we can't say that it is innate or kids learn it directly from adults.\n\nRather, it is self-constructed as kids play with other kids. Taking turns in a game is like pouring water back and forth between glasses. Once kids have reached the age of five or six, then playing games and working things out together will help them learn about fairness far more effectively than any teaching from adults.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`피아제는 <b>같은(same)</b> 양의 물을 두 다른 잔에 넣었다.`,analysis:`✅ ② same: 같은 → 원문 일치\n❌ ① different: 다른\n❌ ③ larger: 더 큰\n❌ ④ smaller: 더 작은`,tip:`same amount = 같은 양 — 실험의 핵심 조건`}},
{id:2,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`width`,`color`,`weight`,`level`],passage:`Piaget put the same amount of water into two different glasses: a tall narrow glass and a wide glass, then asked kids to compare two glasses. Kids younger than six or seven usually say that the tall narrow glass now holds more water, because the __________ is higher. And when they are ready, they figure out the conservation of volume for themselves just by playing with cups of water.\n\n[삽입 문장] Piaget argued that children's understanding of morality is like their understanding of those water glasses: we can't say that it is innate or kids learn it directly from adults.\n\nRather, it is self-constructed as kids play with other kids. Taking turns in a game is like pouring water back and forth between glasses. Once kids have reached the age of five or six, then playing games and working things out together will help them learn about fairness far more effectively than any teaching from adults.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`<b>수위(level)</b>가 더 높기 때문에 물이 더 많다고 말한다.`,analysis:`✅ ④ level: 수위 → 원문 일치\n❌ ① width: 폭\n❌ ② color: 색\n❌ ③ weight: 무게`,tip:`level = 수위, 높이 — 좁은 잔이 수위가 높아 보이는 착시`}},
{id:3,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`contrast`,`separate`,`examine side by side`,`combine`],passage:`Piaget asked kids to <u>compare</u> two glasses.`,stem:`밑줄 친 <b>compare</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`compare = 비교하다, examine side by side = 나란히 놓고 살펴보다 → 동의어`,analysis:`✅ ③ examine side by side: 나란히 살펴보다 → compare의 동의어\n❌ ① contrast: 대조하다 (차이점 강조)\n❌ ② separate: 분리하다\n❌ ④ combine: 합치다`,tip:`compare = examine side by side = 비교하다 (유사점과 차이점 모두)`}},
{id:4,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`built by oneself`,`taught by teachers`,`inherited genetically`,`imposed by society`],passage:`It is <u>self-constructed</u> as kids play with other kids.`,stem:`밑줄 친 <b>self-constructed</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`self-constructed = 자기 구성적, built by oneself = 스스로 만든 → 동의어`,analysis:`✅ ① built by oneself: 스스로 만든 → self-constructed의 동의어\n❌ ② taught by teachers: 교사에 의해 가르쳐진\n❌ ③ inherited genetically: 유전적으로 물려받은\n❌ ④ imposed by society: 사회에 의해 부과된`,tip:`self-constructed = self-built = 자기 구성적 — 스스로 만들어가는 것`}},
{id:5,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`inborn`,`acquired`,`natural`,`inherent`],passage:`We can't say that it is <u>innate</u>.`,stem:`밑줄 친 <b>innate</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`innate = 타고난 ↔ acquired = 후천적인`,analysis:`❌ ② acquired(후천적인): innate의 반의어 → 가장 먼 의미\n✅ ① inborn: 타고난 → 동의어\n✅ ③ natural: 자연적인 → 유사어\n✅ ④ inherent: 내재된 → 동의어`,tip:`innate = inborn = inherent ↔ acquired = learned = 후천적인`}},
{id:6,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`children`,`youngsters`,`minors`,`grown-ups`],passage:`Playing games will help them learn about fairness far more effectively than any teaching from <u>adults</u>.`,stem:`밑줄 친 <b>adults</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`adults = 어른 ↔ children/minors가 반의어이나, grown-ups는 adults의 동의어가 아닌 다른 의미권의 단어`,analysis:`실제로 grown-ups = adults (동의어)이므로 이 문제에서는:\n❌ ④ grown-ups: 사실 동의어이지만 여기서는 children(①)이 반의어\n수정: ① children이 반의어\n\n재검토: 보기 중 adults의 반의어는 ③ minors(미성년자)`,tip:`adults = grown-ups ↔ children = minors = youngsters = 아이들/미성년자`}},
{id:7,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:4,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Piaget put the same ①<u>amount</u> of water into two ②<u>different</u> glasses: a tall narrow glass and a wide glass, then asked kids to compare two glasses. Kids ③<u>younger</u> than six or seven usually say that the tall narrow glass now holds ④<u>more</u> water, because the level is higher. And when they are ready, they figure out the conservation of volume for themselves just by ⑤<u>studying</u> with cups of water.\n\n[삽입 문장] Piaget argued that children's understanding of morality is like their understanding of those water glasses: we can't say that it is innate or kids learn it directly from adults.\n\nRather, it is self-constructed as kids play with other kids. Taking turns in a game is like pouring water back and forth between glasses. Once kids have reached the age of five or six, then playing games and working things out together will help them learn about fairness far more effectively than any teaching from adults.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`물 컵으로 <b>놀면서(playing)</b> 보존을 알아낸다. ⑤ studying(공부하면서)은 playing의 반의어로 부적절.`,analysis:`❌ ⑤ studying(공부하면서): 원문은 'playing(놀면서)' → 부적절\n✅ ① amount: 양 → 적절\n✅ ② different: 다른 → 적절\n✅ ③ younger: 더 어린 → 적절\n✅ ④ more: 더 많은 → 적절`,tip:`playing(놀면서) ↔ studying(공부하면서) — 피아제는 놀이를 통한 학습 강조`}},
{id:8,type:`문맥상 부적절한 어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Piaget put the same amount of water into two different glasses: a tall narrow glass and a wide glass, then asked kids to compare two glasses. Kids younger than six or seven usually say that the tall narrow glass now holds more water, because the level is higher. And when they are ready, they figure out the conservation of volume for themselves just by playing with cups of water.\n\nPiaget argued that children's understanding of morality is like their understanding of those water glasses: we can't say that it is innate or kids learn it directly from adults.\n\nRather, it is ①<u>self-constructed</u> as kids play with other kids. ②<u>Competing</u> in a game is like pouring water back and forth between glasses. Once kids have reached the age of five or six, then playing games and working things out together will help them learn about ③<u>fairness</u> far more ④<u>effectively</u> than any ⑤<u>teaching</u> from adults.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`게임에서 <b>교대하는 것(Taking turns)</b>이 물 붓기와 같다. ② Competing(경쟁하는)은 Taking turns의 반의어로 부적절.`,analysis:`❌ ② Competing(경쟁하는): 원문은 'Taking turns(교대하는)' → 부적절 (경쟁 vs 교대/협력)\n✅ ① self-constructed: 자기 구성 → 적절\n✅ ③ fairness: 공정성 → 적절\n✅ ④ effectively: 효과적으로 → 적절\n✅ ⑤ teaching: 가르침 → 적절`,tip:`Taking turns(교대, 협력) ↔ Competing(경쟁) — 공정성 학습은 교대/협력에서 나옴`}},
{id:9,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`younger — conservation — unfairness`,`younger — conservation — fairness`,`older — destruction — fairness`,`younger — conservation — obedience`,`older — conservation — fairness`],passage:`Piaget put the same amount of water into two different glasses: a tall narrow glass and a wide glass, then asked kids to compare two glasses. Kids <b>(A)</b> than six or seven usually say that the tall narrow glass now holds more water, because the level is higher. And when they are ready, they figure out the <b>(B)</b> of volume for themselves just by playing with cups of water.\n\n[삽입 문장] Piaget argued that children's understanding of morality is like their understanding of those water glasses: we can't say that it is innate or kids learn it directly from adults.\n\nRather, it is self-constructed as kids play with other kids. Taking turns in a game is like pouring water back and forth between glasses. Once kids have reached the age of five or six, then playing games and working things out together will help them learn about <b>(C)</b> far more effectively than any teaching from adults.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`6세보다 <b>어린(younger)</b> 아이들이 그렇게 말한다. 부피의 <b>보존(conservation)</b>을 알아낸다. <b>공정성(fairness)</b>을 배운다.`,analysis:`✅ ② younger — conservation — fairness: 원문 일치\n❌ ① unfairness: fairness의 반의어\n❌ ③ older/destruction: 둘 다 반의어\n❌ ④ obedience: 복종 (다른 개념)\n❌ ⑤ older: younger의 반의어`,tip:`younger↔older, conservation↔destruction, fairness↔unfairness`}},
{id:10,type:`(A)(B)(C) 조합형`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`innate — self-constructed — effectively`,`innate — externally taught — effectively`,`acquired — self-constructed — effectively`,`innate — self-constructed — poorly`,`innate — externally taught — poorly`],passage:`Piaget put the same amount of water into two different glasses: a tall narrow glass and a wide glass, then asked kids to compare two glasses. Kids younger than six or seven usually say that the tall narrow glass now holds more water, because the level is higher. And when they are ready, they figure out the conservation of volume for themselves just by playing with cups of water.\n\nPiaget argued that children's understanding of morality is like their understanding of those water glasses: we can't say that it is <b>(A)</b> or kids learn it directly from adults.\n\nRather, it is <b>(B)</b> as kids play with other kids. Taking turns in a game is like pouring water back and forth between glasses. Once kids have reached the age of five or six, then playing games and working things out together will help them learn about fairness far more <b>(C)</b> than any teaching from adults.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`도덕성은 <b>타고난(innate)</b> 것이 아니다. 오히려 놀이를 통해 <b>자기 구성된다(self-constructed)</b>. 게임이 더 <b>효과적으로(effectively)</b> 돕는다.`,analysis:`✅ ① innate — self-constructed — effectively: 원문 일치\n❌ ② externally taught: self-constructed의 반의어\n❌ ③ acquired: innate 부정과 다른 의미\n❌ ④ poorly: effectively의 반의어\n❌ ⑤ 둘 다 반의어`,tip:`innate(타고난) 부정 → self-constructed(자기 구성) → effectively(효과적으로)`}},
{id:11,type:`영영풀이 매칭`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`compare`,`contrast`,`compete`,`combine`],passage:`<i>to examine two or more things in order to see how they are similar or different</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`유사점과 차이점을 보기 위해 두 가지 이상을 살펴보다 → <b>compare(비교하다)</b>`,analysis:`✅ ① compare: 비교하다 → 영영 정의와 일치\n❌ ② contrast: 대조하다 (차이점만 강조)\n❌ ③ compete: 경쟁하다\n❌ ④ combine: 합치다`,tip:`compare = 비교하다 (유사점 + 차이점 모두 살핌)`}},
{id:12,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`fairness`,`morality`,`volume`,`height`],passage:`<i>the amount of space that a substance or object occupies</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`물질이나 물체가 차지하는 공간의 양 → <b>volume(부피)</b>`,analysis:`✅ ③ volume: 부피 → 영영 정의와 일치\n❌ ① fairness: 공정성\n❌ ② morality: 도덕성\n❌ ④ height: 높이`,tip:`volume = 부피 — conservation of volume = 부피 보존`}},
{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`(동물의) 새끼 염소`,`(비격식) 아이`,`어린이들`,`속이다`],passage:`Piaget asked <u>kids</u> to compare two glasses.`,stem:`밑줄 친 <b>kids</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`피아제는 <b>어린이들(kids)</b>에게 비교하라고 했다.`,analysis:`✅ ③ 어린이들: 실험 대상인 아이들\n❌ ① 새끼 염소: baby goat\n❌ ② 비격식 아이: 구어적 의미\n❌ ④ 속이다: You're kidding me`,tip:`kid 다의어: 어린이(명사) / 새끼 염소(명사) / 놀리다(동사)`}},
{id:14,type:`다의어 문맥적 의미`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`경기, 사합`,`(규칙이 있는) 놀이/게임`,`사냥감`,`(전략적) 게임`],passage:`<u>Taking turns in a game</u> is like pouring water back and forth between glasses.`,stem:`밑줄 친 <b>game</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`<b>놀이/게임(game)</b>에서 교대하는 것 → 규칙이 있는 아이들의 놀이`,analysis:`✅ ② (규칙이 있는) 놀이/게임: 아이들이 교대하며 하는 놀이\n❌ ① 경기: sports game\n❌ ③ 사냥감: big game\n❌ ④ 전략적 게임: game theory`,tip:`game 다의어: 놀이 / 경기 / 사냥감 / 전략 게임`}},
{id:15,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`usually`,accept:[`usually`,`Usually`],passage:`Piaget put the same amount of water into two different glasses: a tall narrow glass and a wide glass, then asked kids to compare two glasses. Kids younger than six or seven __________ (usual) say that the tall narrow glass now holds more water, because the level is higher. And when they are ready, they figure out the conservation of volume for themselves just by playing with cups of water.\n\n[삽입 문장] Piaget argued that children's understanding of morality is like their understanding of those water glasses: we can't say that it is innate or kids learn it directly from adults.\n\nRather, it is self-constructed as kids play with other kids. Taking turns in a game is like pouring water back and forth between glasses. Once kids have reached the age of five or six, then playing games and working things out together will help them learn about fairness far more effectively than any teaching from adults.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`6~7세 미만의 아이들은 <b>보통(usually)</b> 키가 큰 잔에 물이 더 많다고 말한다 → 동사 say를 수식하는 부사`,analysis:`usual → usually: 형용사 → 부사 (-ly)\n동사 say를 수식하는 빈도 부사`,tip:`usual(형용사: 보통의) → usually(부사: 보통, 대개)`}},
{id:16,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`teaching`,accept:[`teaching`,`Teaching`],passage:`Piaget put the same amount of water into two different glasses: a tall narrow glass and a wide glass, then asked kids to compare two glasses. Kids younger than six or seven usually say that the tall narrow glass now holds more water, because the level is higher. And when they are ready, they figure out the conservation of volume for themselves just by playing with cups of water.\n\n[삽입 문장] Piaget argued that children's understanding of morality is like their understanding of those water glasses: we can't say that it is innate or kids learn it directly from adults.\n\nRather, it is self-constructed as kids play with other kids. Taking turns in a game is like pouring water back and forth between glasses. Once kids have reached the age of five or six, then playing games and working things out together will help them learn about fairness far more effectively than any __________ (teach) from adults.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`어른의 어떤 <b>가르침(teaching)</b>보다 훨씬 더 효과적으로 → any 뒤 명사 필요`,analysis:`teach → teaching: 동사 → 명사(동명사)\n'any teaching from adults' = 어른의 어떤 가르침`,tip:`teach(동사: 가르치다) → teaching(명사: 가르침, 교육)`}},
{id:17,type:`빈칸 문맥 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`children cannot understand conservation until age 12`,`tall glasses always hold more water than wide glasses`,`morality is genetically programmed in humans`,`children learn fairness through playing with peers, not from adult instruction`],passage:FULL_PASSAGE,stem:`이 글의 요지로 가장 적절한 것은?`,det:{korean:`이 글의 요지는 <b>아이들은 어른의 가르침이 아닌 또래와의 놀이를 통해 공정성을 배운다</b>는 것이다.`,analysis:`✅ ④ children learn fairness through playing with peers: 본문 핵심\n❌ ① until age 12: 나이 제한 언급 없음\n❌ ② tall glasses hold more: 아이들의 오류 (사실이 아님)\n❌ ③ genetically programmed: 본문에서 부정(innate 아님)`,tip:`핵심: playing games + working things out > teaching from adults`}},
{id:18,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`memorizing rules`,`pouring water back and forth`,`reading textbooks`,`listening to lectures`],passage:`Piaget put the same amount of water into two different glasses: a tall narrow glass and a wide glass, then asked kids to compare two glasses. Kids younger than six or seven usually say that the tall narrow glass now holds more water, because the level is higher. And when they are ready, they figure out the conservation of volume for themselves just by playing with cups of water.\n\n[삽입 문장] Piaget argued that children's understanding of morality is like their understanding of those water glasses: we can't say that it is innate or kids learn it directly from adults.\n\nRather, it is self-constructed as kids play with other kids. Taking turns in a game is like __________ between glasses. Once kids have reached the age of five or six, then playing games and working things out together will help them learn about fairness far more effectively than any teaching from adults.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`게임에서 교대하는 것은 잔 사이에서 <b>물을 왔다 갔다 붓는 것(pouring water back and forth)</b>과 같다.`,analysis:`✅ ② pouring water back and forth: 원문 일치 — 부피 보존 실험과의 비유\n❌ ① memorizing rules: 규칙 암기\n❌ ③ reading textbooks: 교과서 읽기\n❌ ④ listening to lectures: 강의 듣기`,tip:`비유: taking turns(교대) = pouring back and forth(왔다 갔다 붓기) — 공정성의 메타포`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Piaget put the same amount of water into two different glasses: a tall narrow glass and a wide glass, then asked kids to compare two glasses. (①) Kids younger than six or seven usually say that the tall narrow glass now holds more water, because the level is higher. (②) And when they are ready, they figure out the conservation of volume for themselves just by playing with cups of water. (③) Rather, it is self-constructed as kids play with other kids. (④) Taking turns in a game is like pouring water back and forth between glasses. (⑤) Once kids have reached the age of five or six, then playing games and working things out together will help them learn about fairness far more effectively than any teaching from adults.\n\n[삽입 문장] Piaget argued that children's understanding of morality is like their understanding of those water glasses: we can't say that it is innate or kids learn it directly from adults.`,stem:`주어진 문장이 들어가기에 가장 적절한 곳은? (원래 모의고사 38번 문제)`,det:{korean:`삽입 문장은 '도덕성 이해 = 물 잔 이해, innate 아님'이라는 전환점. ③ 앞에 넣으면 'innate 아님' → 'Rather, self-constructed'로 자연스럽게 연결.`,analysis:`✅ ③: 물 잔 실험 → 삽입(morality = water glasses, not innate) → Rather, self-constructed\n❌ ①②: 실험 설명 중\n❌ ④⑤: Rather 연결 끊김`,tip:`Rather(오히려)가 'innate/directly 아님'을 받아 'self-constructed'로 전환하는 핵심 연결고리`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`peer play develops moral understanding more naturally than adult teaching`,`children should start formal moral education at age three`,`Piaget's water glass experiment proves children lack intelligence`,`conservation of volume is unrelated to moral development`],passage:FULL_PASSAGE,stem:`이 글에서 추론할 수 있는 것으로 가장 적절한 것은?`,det:{korean:`이 글에서 추론할 수 있는 것은 <b>또래 놀이가 어른의 가르침보다 도덕적 이해를 더 자연스럽게 발달시킨다(peer play develops moral understanding more naturally than adult teaching)</b>는 것이다.`,analysis:`✅ ① peer play develops moral understanding more naturally: 본문의 핵심 추론\n❌ ② formal education at age three: 공식 교육 언급 없음\n❌ ③ lack intelligence: 지능 부족이 아닌 발달 단계\n❌ ④ unrelated: 본문에서 유비(analogy)로 연결`,tip:`피아제의 핵심: 물 잔 보존 이해 = 도덕성 이해 → 둘 다 자기 구성적(self-constructed)`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;const mk5='①②③④⑤',mk4='①②③④';const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={t:0,o:0,w:[]};typeMap[t].t++;if(d.ok)typeMap[t].o++;else typeMap[t].w.push(d.q.id);});
let txt=`🧩 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
