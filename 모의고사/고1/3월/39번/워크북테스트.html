<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"39번","lesson":"문장삽입","title":"Air-conditioning과 전통 건축의 지혜","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_2025_g1_mar_39"};

const FULL_PASSAGE=`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`;

const Q=[
{id:1,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`decreased`,`accelerated`,`maintained`,`eliminated`],passage:`The rise of air-conditioning __________ the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`에어컨의 부상은 밀폐된 상자의 건설을 <b>가속화했다(accelerated)</b>.`,analysis:`✅ ② accelerated: 가속화하다 → 원문 일치\n❌ ① decreased: 감소시키다\n❌ ③ maintained: 유지하다\n❌ ④ eliminated: 제거하다`,tip:`accelerate = speed up = 가속화하다. 에어컨이 밀폐 건물 건설을 촉진했다는 맥락.`}},
{id:2,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`airflow`,`temperature`,`pressure`,`moisture`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only __________ is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`건물의 유일한 <b>공기 흐름(airflow)</b>은 에어컨 유닛의 여과된 덕트를 통해서이다.`,analysis:`✅ ① airflow: 공기 흐름 → 원문 일치\n❌ ② temperature: 온도\n❌ ③ pressure: 압력\n❌ ④ moisture: 습기`,tip:`airflow = 공기 흐름. sealed boxes(밀폐 상자)에서는 덕트만이 유일한 공기 통로.`}},
{id:3,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`filtered`,accept:[`filtered`,`Filtered`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the __________ (filter) ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`명사 ducts를 수식하는 과거분사가 필요 → filter → <b>filtered</b>`,analysis:`filter(동사/명사) → filtered(과거분사): 명사 앞에서 수동 의미의 분사\n'filtered ducts' = 여과된 덕트`,tip:`filter → filtered: 여과된 — 과거분사가 명사를 수식 (수동 의미)`}},
{id:4,type:`빈칸 문맥 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`It has always been this way`,`This is the only possible approach`,`It doesn't have to be this way`,`This method is the most efficient`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes. __________. Look at any old building in a hot climate.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`밀폐 건물 이후, 전통 건축물을 보라고 하므로 <b>"꼭 이럴 필요는 없다(It doesn't have to be this way)"</b>가 적절.`,analysis:`✅ ③ It doesn't have to be this way: 대안이 있다는 전환 → 원문 일치\n❌ ① 항상 이래왔다: 반대 맥락\n❌ ② 유일한 접근법: 반대 맥락\n❌ ④ 가장 효율적: 반대 맥락`,tip:`"It doesn't have to be this way" = 전환 표현. 밀폐 건물만이 답이 아니라는 의미.`}},
{id:5,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`importance`,accept:[`importance`,`Importance`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the __________ (important) of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`the 뒤에 명사가 필요 → important → <b>importance</b>`,analysis:`important(형용사) → importance(명사): 'the + 명사' 구조\n'the importance of' = ~의 중요성`,tip:`important(중요한) → importance(중요성) — the 다음에는 명사가 와야 함`}},
{id:6,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`capture — welcome — discourage`,`release — block — encourage`,`capture — block — encourage`,`avoid — block — encourage`,`capture — block — discourage`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They <b>(A)</b> buildings to capture cool breezes and <b>(B)</b> the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to <b>(C)</b> airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`시원한 바람을 <b>포착하고(capture)</b>, 오후의 열기를 <b>차단하며(block)</b>, 공기 흐름을 <b>촉진하기(encourage)</b> 위해 지었다.`,analysis:`✅ ③ capture — block — encourage: 원문 일치\n❌ ① welcome: block의 반의어\n❌ ② release: capture의 반의어\n❌ ④ avoid: oriented의 의미와 불일치\n❌ ⑤ discourage: encourage의 반의어`,tip:`capture(포착)↔release(방출), block(차단)↔welcome(환영), encourage(촉진)↔discourage(억제)`}},
{id:7,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot ①<u>climate</u>, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of ②<u>darkness</u>, airflow, light colors. They oriented buildings to ③<u>capture</u> cool breezes and block the worst heat of the afternoon. They built with ④<u>thick</u> walls and white ⑤<u>roofs</u> and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`원문은 <b>그늘(shade)</b>의 중요성. ② darkness(어둠)는 shade와 유사하지만 건축 맥락에서 부적절.`,analysis:`❌ ② darkness(어둠): 원문은 'shade(그늘)' → 건축적으로 부적절. shade는 햇빛을 차단하는 그늘, darkness는 완전한 어둠\n✅ ① climate: 기후 → 적절\n✅ ③ capture: 포착하다 → 적절\n✅ ④ thick: 두꺼운 → 적절\n✅ ⑤ roofs: 지붕 → 적절`,tip:`shade(그늘, 차양) ≠ darkness(어둠). 건축에서 shade는 햇빛 차단을 위한 긍정적 개념.`}},
{id:8,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`randomized`,`decorated`,`positioned`,`directed`],passage:`They <u>oriented</u> buildings to capture cool breezes.`,stem:`밑줄 친 <b>oriented</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`oriented = 방향을 맞추다, directed = 향하게 하다 → 동의어`,analysis:`✅ ④ directed: 향하게 하다 → oriented의 동의어\n❌ ① randomized: 무작위로 하다\n❌ ② decorated: 장식하다\n❌ ③ positioned: 위치시키다 (유사하지만 방향성 부족)`,tip:`orient = direct = aim = 방향을 맞추다, 향하게 하다`}},
{id:9,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`built`,`constructed`,`demolished`,`designed`],passage:`They <u>built</u> with thick walls and white roofs and transoms over doors.`,stem:`밑줄 친 <b>built</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`built = 지었다 ↔ demolished = 허물다`,analysis:`❌ ③ demolished(허물다): built의 반의어 → 가장 먼 의미\n✅ ① built: 동일 단어\n✅ ② constructed: 건설하다 → 동의어\n✅ ④ designed: 설계하다 → 유사어`,tip:`build = construct ↔ demolish = tear down = 짓다 ↔ 허물다`}},
{id:10,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`mudbrick`,`concrete`,`marble`,`timber`],passage:`<i>a building material made from a mixture of mud and straw, dried in the sun</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`진흙과 짚을 섞어 햇볕에 말린 건축 재료 → <b>mudbrick(흙벽돌)</b>`,analysis:`✅ ① mudbrick: 흙벽돌 → 영영 정의와 일치\n❌ ② concrete: 콘크리트\n❌ ③ marble: 대리석\n❌ ④ timber: 목재`,tip:`mudbrick = 흙벽돌 — mud(진흙) + brick(벽돌). 투싼(Tucson) 등 건조 지역의 전통 건축 재료.`}},
{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`remembered`,`ignored`,`celebrated`,`preserved`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often __________. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`이 모든 지혜가 너무 자주 <b>무시된다(ignored)</b>.`,analysis:`✅ ② ignored: 무시되다 → 원문 일치\n❌ ① remembered: 기억되다\n❌ ③ celebrated: 축하되다\n❌ ④ preserved: 보존되다`,tip:`all too often = 너무나 자주. ignored = neglected = overlooked = 무시되다`}},
{id:12,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`상승하다 (동사)`,`부상, 증가 (명사)`,`일어나다 (동사)`,`높이 (명사)`],passage:`The <u>rise</u> of air-conditioning accelerated the construction of sealed boxes.`,stem:`밑줄 친 <b>rise</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`the rise of에서 rise는 <b>부상, 증가</b>라는 명사로 사용됨.`,analysis:`✅ ② 부상, 증가 (명사): the rise of = ~의 부상/증가\n❌ ① 상승하다: 동사로 사용될 때\n❌ ③ 일어나다: rise early\n❌ ④ 높이: 다른 의미`,tip:`the rise of = ~의 부상/증가 — 관사(the) + of와 함께 명사로 사용`}},
{id:13,type:`어형 변환 (서술형)`,diff:`어려움`,pts:6,fmt:"written",wa:`accumulated`,accept:[`accumulated`,`Accumulated`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, __________ (accumulate) over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`wisdom을 수식하는 과거분사 필요 → accumulate → <b>accumulated</b> (수동: 축적된)`,analysis:`accumulate → accumulated: 과거분사(수동)\n'wisdom accumulated over centuries' = 수세기에 걸쳐 축적된 지혜`,tip:`accumulate → accumulated: 축적된 — 과거분사가 명사(wisdom)를 후치 수식`}},
{id:14,type:`빈칸 문맥 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`에어컨을 사용하지 말아야 한다`,`현대 건축이 전통보다 우수하다`,`밀폐 건물이 가장 효율적이다`,`에어컨은 전통 건축 지혜를 잊게 만드는 기술이다`],passage:FULL_PASSAGE,stem:`이 글의 요지로 가장 적절한 것은?`,det:{korean:`에어컨이 개인 편의의 기술일 뿐 아니라 <b>망각의 기술</b>이라는 것이 요지이다.`,analysis:`✅ ④ 에어컨은 전통 건축 지혜를 잊게 만드는 기술이다: "technology of forgetting" → 핵심 요지\n❌ ① 에어컨 사용 금지: 극단적 주장 없음\n❌ ② 현대 건축이 우수: 글의 주장 반대\n❌ ③ 밀폐 건물이 효율적: 글의 주장 반대`,tip:`"technology of forgetting" = 글의 핵심 키워드. 전통 건축의 지혜가 무시(ignored)되고 있다.`}},
{id:15,type:`문맥상 부적절한 어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:4,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to ①<u>deal with</u> heat, accumulated over centuries of practical experience, is all too often ②<u>ignored</u>. In this ③<u>sense</u>, air-conditioning is not just a technology of ④<u>personal</u> comfort: it is also a technology of ⑤<u>remembering</u>.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`원문은 <b>망각(forgetting)</b>의 기술. ⑤ remembering(기억)은 forgetting의 반의어로 부적절.`,analysis:`❌ ⑤ remembering(기억하는): 원문은 'forgetting(망각)' → 부적절\n✅ ① deal with: 다루다 → 적절\n✅ ② ignored: 무시되다 → 적절\n✅ ③ sense: 의미 → 적절\n✅ ④ personal: 개인적인 → 적절`,tip:`forgetting(망각) ↔ remembering(기억) — 글의 핵심 단어가 반의어로 바뀌면 의미가 완전히 반대.`}},
{id:16,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`handle`,`avoid`,`create`,`increase`],passage:`All this wisdom about how to <u>deal with</u> heat.`,stem:`밑줄 친 <b>deal with</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`deal with = 다루다, handle = 다루다 → 동의어`,analysis:`✅ ① handle: 다루다 → deal with의 동의어\n❌ ② avoid: 피하다\n❌ ③ create: 만들다\n❌ ④ increase: 증가시키다`,tip:`deal with = handle = cope with = manage = 다루다, 처리하다`}},
{id:17,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`wide`,`broad`,`tight`,`slim`],passage:`Anyone who has walked on the <u>narrow</u> streets of old Seville.`,stem:`밑줄 친 <b>narrow</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`narrow = 좁은 ↔ broad = 넓은`,analysis:`❌ ② broad(넓은): narrow의 반의어 → 가장 먼 의미\n✅ ① wide: 넓은 (반의어이지만 broad가 더 대조적)\n✅ ③ tight: 좁은/빡빡한 → 유사어\n✅ ④ slim: 가느다란 → 유사어`,tip:`narrow = 좁은 ↔ broad = wide = 넓은`}},
{id:18,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`airflow`,`shade`,`climate`,`comfort`],passage:`<i>the weather conditions prevailing in an area over a long period of time</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`한 지역에서 오랜 기간에 걸쳐 지배적인 기상 조건 → <b>climate(기후)</b>`,analysis:`✅ ③ climate: 기후 → 영영 정의와 일치\n❌ ① airflow: 공기 흐름\n❌ ② shade: 그늘\n❌ ④ comfort: 편안함`,tip:`climate = 기후 (장기간), weather = 날씨 (단기간). climate ≠ weather`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:4,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. (<b>①</b>) Architects understood the importance of shade, airflow, light colors. (<b>②</b>) They oriented buildings to capture cool breezes and block the worst heat of the afternoon. (<b>③</b>) They built with thick walls and white roofs and transoms over doors to encourage airflow. (<b>④</b>) Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. (<b>⑤</b>) In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.\n\n<b>[주어진 문장]</b>\nBut all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored.`,stem:`주어진 문장이 들어가기에 가장 적절한 곳은? (원래 모의고사 39번 문제)`,det:{korean:`주어진 문장은 "하지만 이 모든 지혜가 무시된다"는 역접. ④ 뒤(전통 방법이 잘 작동한다는 내용 후)에서 ⑤ 앞(망각의 기술이라는 결론)으로 연결되므로 <b>⑤</b>가 적절.`,analysis:`✅ ⑤: "these construction methods work" → But... ignored → "technology of forgetting" 자연스러운 흐름\n❌ ①~④: 전통 건축의 장점 나열 중간에 역접이 오면 흐름 단절`,tip:`But(역접) → 앞의 긍정적 내용과 대비. "ignored"와 "forgetting"이 의미적으로 연결.`}},
{id:20,type:`(A)(B)(C) 조합형`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`personal — comfort — innovation`,`personal — comfort — forgetting`,`public — discomfort — forgetting`,`personal — comfort — remembering`,`public — comfort — forgetting`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of <b>(C)</b>.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`에어컨은 <b>개인적(personal)</b> <b>편안함(comfort)</b>의 기술일 뿐 아니라 <b>망각(forgetting)</b>의 기술이다.`,analysis:`✅ ② personal — comfort — forgetting: 원문 일치\n❌ ① innovation: 혁신 (forgetting이 아님)\n❌ ③ public/discomfort: 반대 의미\n❌ ④ remembering: forgetting의 반의어\n❌ ⑤ public: personal의 반의어`,tip:`personal comfort(개인적 편안함) ↔ forgetting(망각): 에어컨의 두 가지 측면을 대비하는 글의 결론부`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📖 온라인워크북 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
