.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8efe9;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #dde8df;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FAFDFB;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F0F8F1;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}

</style>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"39번","lesson":"문장삽입","title":"Air-conditioning과 전통 건축의 지혜","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_2025_g1_mar_39"};

const FULL_PASSAGE=`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`;

const Q=[
{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`accelerated — sealed — filtered`,`decelerated — sealed — filtered`,`accelerated — opened — filtered`,`accelerated — sealed — unfiltered`,`decelerated — opened — unfiltered`],passage:`The rise of air-conditioning <b>(A)</b> the construction of <b>(B)</b> boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`에어컨의 부상은 <b>밀폐된(sealed)</b> 상자의 건설을 <b>가속화했고(accelerated)</b>, 건물의 유일한 공기 흐름은 <b>여과된(filtered)</b> 덕트를 통해서이다.`,analysis:`✅ ① accelerated — sealed — filtered: 원문 일치\n❌ ② decelerated: accelerated의 반의어\n❌ ③ opened: sealed의 반의어\n❌ ④ unfiltered: filtered의 반의어\n❌ ⑤ 모두 반의어`,tip:`accelerate(가속화하다)↔decelerate(감속하다), sealed(밀폐된)↔opened(개방된), filtered(여과된)↔unfiltered(여과되지 않은)`}},
{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`wisdom — accumulated — remembered`,`wisdom — accumulated — ignored`,`foolishness — accumulated — ignored`,`wisdom — scattered — ignored`,`foolishness — scattered — remembered`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this <b>(A)</b> about how to deal with heat, <b>(B)</b> over centuries of practical experience, is all too often <b>(C)</b>. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`열을 다루는 이 모든 <b>지혜(wisdom)</b>는 수세기의 실용적 경험을 통해 <b>축적되었지만(accumulated)</b>, 너무 자주 <b>무시된다(ignored)</b>.`,analysis:`✅ ② wisdom — accumulated — ignored: 원문 일치\n❌ ① remembered: ignored의 반의어\n❌ ③ foolishness: wisdom의 반의어\n❌ ④ scattered: accumulated의 반의어\n❌ ⑤ 모두 반의어`,tip:`wisdom(지혜)↔foolishness(어리석음), accumulated(축적된)↔scattered(흩어진), ignored(무시된)↔remembered(기억된)`}},
{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the ①<u>importance</u> of shade, airflow, light colors. They ②<u>oriented</u> buildings to capture cool breezes and block the worst heat of the afternoon. They built with ③<u>thin</u> walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the ④<u>narrow</u> streets of old Seville, knows how well these ⑤<u>construction</u> methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`원문은 <b>두꺼운(thick)</b> 벽으로 지었다. ③ thin(얇은)은 thick의 반의어로 부적절.`,analysis:`❌ ③ thin(얇은): 원문은 'thick(두꺼운)' → 부적절\n✅ ① importance: 중요성 → 적절\n✅ ② oriented: 방향을 맞추다 → 적절\n✅ ④ narrow: 좁은 → 적절\n✅ ⑤ construction: 건축 → 적절`,tip:`thick(두꺼운) ↔ thin(얇은) — 핵심 반의어`}},
{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`The ①<u>rise</u> of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a ②<u>hot</u> climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to ③<u>capture</u> cool breezes and ④<u>welcome</u> the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of ⑤<u>forgetting</u>.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`원문은 오후의 최악의 열기를 <b>차단하다(block)</b>. ④ welcome(환영하다)은 block의 반의어로 부적절.`,analysis:`❌ ④ welcome(환영하다): 원문은 'block(차단하다)' → 부적절\n✅ ① rise: 부상 → 적절\n✅ ② hot: 더운 → 적절\n✅ ③ capture: 포착하다 → 적절\n✅ ⑤ forgetting: 망각 → 적절`,tip:`block(차단하다) ↔ welcome(환영하다) — 핵심 반의어`}},
{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`slowed`,`sped up`,`prevented`,`reversed`],passage:`The rise of air-conditioning <u>accelerated</u> the construction of sealed boxes.`,stem:`밑줄 친 <b>accelerated</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`accelerated = 가속화했다, sped up = 속도를 높였다 → 동의어`,analysis:`✅ ② sped up: 속도를 높이다 → accelerated의 동의어\n❌ ① slowed: 느리게 하다\n❌ ③ prevented: 막다\n❌ ④ reversed: 뒤집다`,tip:`accelerate = speed up = hasten = 가속화하다`}},
{id:6,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`released`,`displayed`,`caught`,`avoided`],passage:`They oriented buildings to <u>capture</u> cool breezes.`,stem:`밑줄 친 <b>capture</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`capture = 포착하다, caught = 잡다 → 동의어`,analysis:`✅ ③ caught: 잡다 → capture의 동의어\n❌ ① released: 풀어주다\n❌ ② displayed: 전시하다\n❌ ④ avoided: 피하다`,tip:`capture = catch = seize = 포착하다, 잡다`}},
{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`gathered`,`wasted`,`distributed`,`lost`],passage:`All this wisdom about how to deal with heat, <u>accumulated</u> over centuries of practical experience.`,stem:`밑줄 친 <b>accumulated</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`accumulated = 축적된, gathered = 모인 → 동의어`,analysis:`✅ ① gathered: 모은 → accumulated의 동의어\n❌ ② wasted: 낭비된\n❌ ③ distributed: 분배된\n❌ ④ lost: 잃어버린`,tip:`accumulate = gather = collect = amass = 축적하다, 모으다`}},
{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`closed`,`locked`,`shut`,`open`],passage:`The rise of air-conditioning accelerated the construction of <u>sealed</u> boxes.`,stem:`밑줄 친 <b>sealed</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`sealed = 밀폐된 ↔ open = 개방된`,analysis:`❌ ④ open(개방된): sealed의 반의어 → 가장 먼 의미\n✅ ① closed: 닫힌 → 유사어\n✅ ② locked: 잠긴 → 유사어\n✅ ③ shut: 닫힌 → 유사어`,tip:`sealed = closed = shut ↔ open = 밀폐된 ↔ 개방된`}},
{id:9,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`neglected`,`valued`,`overlooked`,`disregarded`],passage:`All this wisdom is all too often <u>ignored</u>.`,stem:`밑줄 친 <b>ignored</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`ignored = 무시된 ↔ valued = 가치 있게 여겨진`,analysis:`❌ ② valued(가치 있게 여겨진): ignored의 반의어 → 가장 먼 의미\n✅ ① neglected: 방치된 → 유사어\n✅ ③ overlooked: 간과된 → 유사어\n✅ ④ disregarded: 무시된 → 동의어`,tip:`ignore = neglect = overlook ↔ value = appreciate = 무시하다 ↔ 가치 있게 여기다`}},
{id:10,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`darkness`,`humidity`,`wind`,`shade`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of __________, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`건축가들은 <b>그늘(shade)</b>, 공기 흐름, 밝은 색상의 중요성을 이해했다.`,analysis:`✅ ④ shade: 그늘 → 원문 일치\n❌ ① darkness: 어둠 (부정적 뉘앙스)\n❌ ② humidity: 습도\n❌ ③ wind: 바람 (airflow와 중복)`,tip:`shade = 그늘, 차양 — 더운 기후 건축의 핵심 요소`}},
{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`encourage`,`prevent`,`reduce`,`eliminate`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to __________ airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`문 위의 트랜섬(환기창)으로 공기 흐름을 <b>촉진하기(encourage)</b> 위해 지었다.`,analysis:`✅ ① encourage: 촉진하다 → 원문 일치\n❌ ② prevent: 방지하다\n❌ ③ reduce: 줄이다\n❌ ④ eliminate: 제거하다`,tip:`encourage = promote = foster = 촉진하다, 장려하다`}},
{id:12,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`innovation`,`progress`,`forgetting`,`improvement`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of __________.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`에어컨은 개인적 편안함의 기술일 뿐만 아니라 <b>망각(forgetting)</b>의 기술이기도 하다.`,analysis:`✅ ③ forgetting: 망각 → 원문 일치\n❌ ① innovation: 혁신\n❌ ② progress: 진보\n❌ ④ improvement: 개선`,tip:`forgetting(망각): 전통 건축 지혜를 잊게 만든다는 글의 핵심 주장`}},
{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`밝은, 연한 (색상)`,`가벼운 (무게)`,`빛, 조명`,`가볍게 (부사)`],passage:`Architects understood the importance of shade, airflow, <u>light</u> colors.`,stem:`밑줄 친 <b>light</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`light colors에서 light는 <b>밝은, 연한</b> 색상의 의미로 사용됨. 더운 기후에서 열 반사를 위한 밝은 색상.`,analysis:`✅ ① 밝은, 연한 (색상): light colors = 밝은 색상\n❌ ② 가벼운: light weight\n❌ ③ 빛, 조명: turn on the light\n❌ ④ 가볍게: travel light`,tip:`light 다의어: 밝은(형용사) / 가벼운(형용사) / 빛(명사)`}},
{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`감각, 감정`,`방향`,`의미에서, 점에서`,`분별력`],passage:`In this <u>sense</u>, air-conditioning is not just a technology of personal comfort.`,stem:`밑줄 친 <b>sense</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`in this sense에서 sense는 <b>의미에서, 점에서</b>라는 뜻으로 사용됨.`,analysis:`✅ ③ 의미에서, 점에서: in this sense = 이러한 의미에서\n❌ ① 감각, 감정: sense of touch\n❌ ② 방향: sense of direction\n❌ ④ 분별력: common sense`,tip:`in this sense = 이러한 의미에서/관점에서 — 논점 전환 표현`}},
{id:15,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`climate`,`airflow`,`wisdom`,`comfort`],passage:`<i>the quality of having experience, knowledge, and good judgment</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`경험, 지식, 좋은 판단력을 갖추고 있는 자질 → <b>wisdom(지혜)</b>`,analysis:`✅ ③ wisdom: 지혜 → 영영 정의와 일치\n❌ ① climate: 기후\n❌ ② airflow: 공기 흐름\n❌ ④ comfort: 편안함`,tip:`wisdom = 지혜 — experience + knowledge + good judgment`}},
{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`shade`,`transoms`,`roofs`,`ducts`],passage:`<i>small windows above doors that allow air to pass through while the door is closed</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`문 위에 있는 작은 창문으로 문이 닫혀 있을 때도 공기가 통하게 하는 것 → <b>transoms(환기창)</b>`,analysis:`✅ ② transoms: 환기창 → 영영 정의와 일치\n❌ ① shade: 그늘\n❌ ③ roofs: 지붕\n❌ ④ ducts: 덕트, 관`,tip:`transom = 문 위의 환기창 — 전통 건축에서 자연 통풍을 위한 구조물`}},
{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`practical`,accept:[`practical`,`Practical`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. But all this wisdom about how to deal with heat, accumulated over centuries of __________ (practice) experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`명사 experience를 수식하는 형용사가 필요 → practice → <b>practical</b>`,analysis:`practice(명사/동사) → practical(형용사): 명사 앞에 형용사\n'practical experience' = 실용적 경험`,tip:`practice(연습, 실천) → practical(실용적인) — 명사를 수식할 때 형용사형 사용`}},
{id:18,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`construction`,accept:[`construction`,`Construction`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. Architects understood the importance of shade, airflow, light colors. They oriented buildings to capture cool breezes and block the worst heat of the afternoon. They built with thick walls and white roofs and transoms over doors to encourage airflow. Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these __________ (construct) methods work. But all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored. In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`명사 methods를 수식하는 명사가 필요 → construct → <b>construction</b> (복합명사)`,analysis:`construct(동사) → construction(명사): 복합명사 'construction methods'\n건축 방법 = construction methods`,tip:`construct(건설하다) → construction(건설, 건축) — 복합명사에서 앞 명사가 형용사 역할`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:4,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`The rise of air-conditioning accelerated the construction of sealed boxes, where the building's only airflow is through the filtered ducts of the air-conditioning unit. It doesn't have to be this way. Look at any old building in a hot climate, whether it's in Sicily or Marrakesh or Tehran. (<b>①</b>) Architects understood the importance of shade, airflow, light colors. (<b>②</b>) They oriented buildings to capture cool breezes and block the worst heat of the afternoon. (<b>③</b>) They built with thick walls and white roofs and transoms over doors to encourage airflow. (<b>④</b>) Anyone who has ever spent a few minutes in a mudbrick house in Tucson, or walked on the narrow streets of old Seville, knows how well these construction methods work. (<b>⑤</b>) In this sense, air-conditioning is not just a technology of personal comfort: it is also a technology of forgetting.\n\n<b>[주어진 문장]</b>\nBut all this wisdom about how to deal with heat, accumulated over centuries of practical experience, is all too often ignored.`,stem:`주어진 문장이 들어가기에 가장 적절한 곳은? (원래 모의고사 39번 문제)`,det:{korean:`주어진 문장은 "하지만 이 모든 지혜가 무시된다"는 내용이다. ④ 뒤에서 전통 건축 방법이 잘 작동한다는 내용 후, ⑤ 앞에서 에어컨이 망각의 기술이라는 결론으로 연결되므로 <b>⑤</b>이 가장 적절하다.`,analysis:`✅ ⑤: "these construction methods work" 다음에 "But... ignored"가 와야 역접 연결이 자연스럽고, 이후 "technology of forgetting"으로 마무리\n❌ ①~④: 전통 건축의 장점을 나열하는 중간에 역접이 오면 흐름이 끊김`,tip:`But(역접) + ignored(무시) → 앞의 긍정적 내용(전통 건축의 지혜)과 대비. "forgetting"과 "ignored"가 의미상 연결됨`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`modern buildings are cooler than traditional ones`,`we have forgotten centuries of architectural wisdom about heat`,`air-conditioning should be banned in hot climates`,`traditional buildings cannot survive in modern cities`],passage:`The author argues that the rise of air-conditioning led to sealed buildings, while traditional architecture used shade, airflow, thick walls, and transoms effectively. The main point is that __________.`,stem:`글의 요지로 가장 적절한 것은?`,det:{korean:`글의 요지는 에어컨의 발달로 인해 <b>수세기에 걸친 건축 지혜를 잊어버렸다</b>는 것이다.`,analysis:`✅ ② we have forgotten centuries of architectural wisdom about heat: 글의 핵심 — "technology of forgetting"\n❌ ① 현대 건물이 더 시원하다: 글의 주장이 아님\n❌ ③ 에어컨을 금지해야 한다: 극단적 주장 없음\n❌ ④ 전통 건물이 살아남을 수 없다: 오히려 전통 건축을 긍정적으로 평가`,tip:`"technology of forgetting" = 핵심 키워드. 에어컨이 전통 지혜를 망각하게 만든다는 것이 글의 요지`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;const mk5='①②③④⑤',mk4='①②③④';const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={t:0,o:0,w:[]};typeMap[t].t++;if(d.ok)typeMap[t].o++;else typeMap[t].w.push(d.q.id);});
let txt=`📝 온라인단어 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
