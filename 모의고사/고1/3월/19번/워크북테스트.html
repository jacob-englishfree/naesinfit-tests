const Q=[
{id:1,type:`어법`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`shake`,`shaking`,`shaken`,`to shake`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice __________ with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`빈칸에 어법상 가장 적절한 것은?`,det:{korean:`독립분사구문: my voice + 현재분사(능동) → <b>shaking</b> (목소리가 떨리면서)`,analysis:`✅ ② shaking: 분사구문(동시동작) — 목소리가 떨리면서\n❌ ① shake: 동사원형 불가\n❌ ③ shaken: 과거분사(수동) — 부적절\n❌ ④ to shake: to부정사 부적절`,tip:`독립분사구문: 주어(my voice) + 현재분사(shaking) = 목소리가 떨리면서`}},
{id:2,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`breaking`,`broken`,`to break`,`break`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light __________ through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`빈칸에 어법상 가장 적절한 것은?`,det:{korean:`빛이 벽의 틈을 <b>뚫고 들어오는(breaking)</b> — 능동/진행 의미의 현재분사`,analysis:`✅ ① breaking: 현재분사(능동) — 빛이 뚫고 들어오는\n❌ ② broken: 과거분사(수동) — 빛이 깨진(X)\n❌ ③ to break: to부정사 부자연스러움\n❌ ④ break: 동사원형 불가`,tip:`현재분사(능동): light breaking through = 뚫고 들어오는 빛`}},
{id:3,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`disappear`,`disappeared`,`disappearing`,`to disappear`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, __________ back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`빈칸에 어법상 가장 적절한 것은?`,det:{korean:`분사구문(동시동작): 뛰어가면서 동시에 <b>사라지며(disappearing)</b>`,analysis:`✅ ③ disappearing: 분사구문(동시동작)\n❌ ① disappear: 동사원형\n❌ ② disappeared: 과거형\n❌ ④ to disappear: to부정사`,tip:`분사구문: ~하면서(동시) → V-ing / hops away, disappearing = 뛰어가면서 사라지며`}},
{id:4,type:`어법`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`(A) shaking — (B) broken — (C) disappear`,`(A) shake — (B) breaking — (C) disappearing`,`(A) shaking — (B) breaking — (C) disappearing`,`(A) shaken — (B) breaking — (C) disappeared`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice <b>(A)</b> with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light <b>(B)</b> through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, <b>(C)</b> back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`(A), (B), (C)에 어법상 적절한 것끼리 짝지은 것은?`,det:{korean:`(A) 능동분사 → shaking (B) 능동분사 → breaking (C) 분사구문 → disappearing`,analysis:`✅ ③ shaking — breaking — disappearing: 모두 현재분사(능동)\n❌ ① broken: 수동(X)\n❌ ② shake: 동사원형(X)\n❌ ④ shaken: 수동(X), disappeared: 과거형(X)`,tip:`현재분사 3종: 독립분사구문(shaking) / 후치수식(breaking) / 분사구문(disappearing)`}},
{id:5,type:`어법`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`beating`,`beaten`,`beat`,`to beat`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is __________ fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`빈칸에 어법상 가장 적절한 것은?`,det:{korean:`현재진행형(is + V-ing): 심장이 빠르게 <b>뛰고 있다(beating)</b>`,analysis:`✅ ① beating: is + V-ing (현재진행형)\n❌ ② beaten: is + p.p. (수동태) — 심장이 맞은(X)\n❌ ③ beat: 동사원형\n❌ ④ to beat: to부정사`,tip:`현재진행형: is/am/are + V-ing = ~하고 있다`}},
{id:6,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`The shed was ①<u>cold</u> and damp, the air thick with the smell of old wood and earth. It's dark, and I can't ②<u>make out</u> what's moving in the shadows. 'Who's there?' I ask, my voice shaking with ③<u>courage</u>. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A ④<u>laugh</u> escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ⑤<u>ease</u>.`,stem:`밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`③ courage(용기)는 원문의 fear(두려움)를 대체 → 부적절`,analysis:`❌ ③ courage(용기): 원문은 'fear(두려움)' → 부적절\n✅ ① cold: 추운 → 적절\n✅ ② make out: 분간하다 → 적절\n✅ ④ escapes: 나오다 → 적절\n✅ ⑤ ease: 편안함 → 적절`,tip:`fear(두려움) ↔ courage(용기) — 핵심 반의어`}},
{id:7,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves ①<u>closer</u>, and my heart is beating fast — until the figure steps into a ②<u>bright</u> beam of light breaking through a crack in the wall. A ③<u>rabbit</u>. A laugh escapes my lips as it stares at me with ④<u>wide</u>, curious eyes. 'You scared me,' I say, feeling much better. The rabbit ⑤<u>pauses</u> for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`② bright(밝은)는 원문의 faint(희미한)를 대체 → 부적절`,analysis:`❌ ② bright(밝은): 원문은 'faint(희미한)' → 부적절\n✅ ① closer: 더 가까이 → 적절\n✅ ③ rabbit: 토끼 → 적절\n✅ ④ wide: 넓은 → 적절\n✅ ⑤ pauses: 멈추다 → 적절`,tip:`faint(희미한) ↔ bright(밝은) — 핵심 반의어`}},
{id:8,type:`빈칸`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`frightened → more frightened`,`relieved → frightened`,`frightened → relieved`,`excited → bored`],passage:FULL_PASSAGE,stem:`화자의 심경 변화로 가장 적절한 것은?`,det:{korean:`어둠 속 그림자에 <b>겁먹었다가(frightened)</b>, 토끼임을 알고 <b>안도한다(relieved)</b>.`,analysis:`✅ ③ frightened → relieved: 공포 → 안도\n❌ ① more frightened: 더 무서워짐(X)\n❌ ② relieved → frightened: 순서 반대\n❌ ④ excited → bored: 맥락과 무관`,tip:`심경 변화 단서: shaking/fear/beating fast(공포) → laugh/smiling/at ease(안도)`}},
{id:9,type:`빈칸`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`심장이 빠르게 뛴다`,`그림자 속에서 움직임이 있다`,`창고가 춥고 축축하다`,`토끼가 희미한 빛 속에 나타난다`],passage:FULL_PASSAGE,stem:`화자의 심경이 공포에서 안도로 바뀌는 <b>전환점(turning point)</b>이 되는 사건은?`,det:{korean:`토끼가 희미한 빛 속에 나타나면서 화자의 공포가 안도로 바뀐다.`,analysis:`✅ ④ 토끼가 빛 속에 나타남: 정체가 드러나며 심경 전환\n❌ ① 심장이 뛴다: 공포 상태 묘사\n❌ ② 움직임: 공포 유발\n❌ ③ 춥고 축축: 배경 묘사`,tip:`심경 전환점: "until the figure steps into a faint beam of light" — until이 전환 신호`}},
{id:10,type:`일치`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`창고는 춥고 축축했다.`,`창고 안은 밝고 따뜻했다.`,`화자는 처음부터 편안했다.`,`그림자의 정체는 고양이였다.`],passage:FULL_PASSAGE,stem:`위 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`원문: "The shed was cold and damp" → 창고는 춥고 축축했다.`,analysis:`✅ ① 춥고 축축: cold and damp → 일치\n❌ ② 밝고 따뜻: dark, cold → 불일치\n❌ ③ 처음부터 편안: shaking with fear → 불일치\n❌ ④ 고양이: rabbit → 불일치`,tip:`내용 일치: 원문의 형용사(cold, damp, dark)를 정확히 확인`}},
{id:11,type:`일치`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`화자는 그림자를 보고 웃었다.`,`토끼는 화자에게 다가왔다.`,`빛은 문을 통해 들어왔다.`,`토끼는 화자를 잠시 바라본 후 뛰어갔다.`],passage:FULL_PASSAGE,stem:`위 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`"The rabbit pauses for a moment, then hops away" → 토끼는 잠시 멈추고 뛰어갔다.`,analysis:`✅ ④ 잠시 바라보고 뛰어감: pauses, then hops away → 일치\n❌ ① 그림자 보고 웃음: 토끼를 보고 웃음\n❌ ② 다가옴: hops away(떠남)\n❌ ③ 문을 통해: crack in the wall(벽의 틈)`,tip:`세부 정보 확인: through a crack in the wall ≠ through the door`}},
{id:12,type:`TF`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`화자는 처음에 그림자를 보고 두려움을 느꼈다. (T/F)`,det:{korean:`"my voice shaking with fear" → 두려움을 느낌 → <b>True</b>`,analysis:`✅ True: shaking with fear = 두려움으로 떨림`,tip:`fear(두려움) = 화자의 초반 감정`}},
{id:13,type:`TF`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`빛은 창문을 통해 들어왔다. (T/F)`,det:{korean:`원문: "a crack in the wall(벽의 틈)"이지 window(창문)가 아님 → <b>False</b>`,analysis:`❌ False: crack in the wall ≠ window`,tip:`crack(틈) ≠ window(창문): 세부 정보 함정`}},
{id:14,type:`TF`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`글의 마지막에서 화자는 편안함을 느끼고 있다. (T/F)`,det:{korean:`"I start to feel at ease" → 편안함 → <b>True</b>`,analysis:`✅ True: at ease = 편안한 상태`,tip:`at ease = comfortable = relaxed = 편안한`}},
{id:15,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`frightened`,accept:[`frightened`,`Frightened`,`scared`,`Scared`,`afraid`,`fearful`],passage:FULL_PASSAGE,stem:`화자의 <b>초반</b> 심경을 영어 한 단어로 쓰시오.`,det:{korean:`초반: 두려움, 공포 → <b>frightened</b> (또는 scared)`,analysis:`frightened = scared = afraid = 겁에 질린\n단서: shaking with fear, heart beating fast`,tip:`심경 어휘: frightened = scared = terrified = 겁에 질린`}},
{id:16,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`relieved`,accept:[`relieved`,`Relieved`,`at ease`],passage:FULL_PASSAGE,stem:`화자의 <b>후반</b> 심경을 영어 한 단어로 쓰시오.`,det:{korean:`후반: 안도감 → <b>relieved</b>`,analysis:`relieved = 안도한\n단서: laugh, feeling much better, smiling, at ease`,tip:`심경 어휘: relieved = 안도한 / at ease = 편안한`}},
{id:17,type:`서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`rabbit`,accept:[`rabbit`,`Rabbit`,`a rabbit`,`A rabbit`],passage:FULL_PASSAGE,stem:`화자의 심경 변화를 일으킨 <b>대상</b>을 영어로 쓰시오. (1단어)`,det:{korean:`그림자의 정체 = <b>rabbit</b> (토끼)`,analysis:`A rabbit = 토끼 → 공포의 대상이 사실 무해한 토끼임을 알게 되며 안도`,tip:`심경 전환의 핵심 대상: rabbit(토끼)`}},
{id:18,type:`빈칸`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`The shed was bright and warm inside.`,`A laugh escapes my lips as it stares at me.`,`The shadow attacked me suddenly.`,`I ran out of the shed immediately.`],passage:FULL_PASSAGE,stem:`화자가 <b>안도감</b>을 느끼기 시작했음을 보여주는 문장은?`,det:{korean:`"A laugh escapes my lips" → 웃음이 나온다 = 안도감의 시작`,analysis:`✅ ② 웃음이 나옴: 공포 → 안도 전환 직후 반응\n❌ ① 밝고 따뜻: 원문과 불일치\n❌ ③ 공격: 언급 없음\n❌ ④ 도망: 언급 없음`,tip:`안도 표현: laugh(웃음), feeling much better, smiling, at ease`}},
{id:19,type:`어법`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`I'm leaving smiling.`,`I'm left smile.`,`I'm left to smile.`,`I'm left smiling.`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. __________. I start to feel at ease.`,stem:`원문에 맞는 문장을 고르시오.`,det:{korean:`be left + V-ing = ~하는 상태로 남겨지다 → <b>I'm left smiling.</b>`,analysis:`✅ ④ I'm left smiling: be left + 현재분사 = ~한 채 남겨지다\n❌ ① leaving: 떠나는(X)\n❌ ② smile: 동사원형 불가\n❌ ③ to smile: be left to V = ~하도록 남겨지다(의미 다름)`,tip:`be left + V-ing = ~하는 상태로 남겨지다 (결과 상태)`}},
{id:20,type:`빈칸`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`until`,`because`,`although`,`before`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast — __________ the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`빈칸에 들어갈 접속사로 가장 적절한 것은?`,det:{korean:`심장이 빠르게 뛰었다 — 그 모습이 빛 속으로 나타날 <b>때까지(until)</b>`,analysis:`✅ ① until: ~할 때까지 → 공포 상태가 전환되는 시점\n❌ ② because: ~때문에\n❌ ③ although: ~에도 불구하고\n❌ ④ before: ~전에`,tip:`until = ~할 때까지: 심경 전환의 시간적 경계를 나타냄`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법':'tag-grammar','어휘':'tag-vocab','빈칸':'tag-blankcloze','서술형':'tag-written','일치':'tag-match','TF':'tag-tf','심경':'tag-emotion'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인워크북 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
