<!DOCTYPE html>

<head>

<title>2025 고1 3월 19번 온라인퀴즈TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--g:#E8772E;--gd:#B85A1A;--gl:#FFF3E0;--gxl:#FFF8F0;--gxxl:#FFFCF8;--bg:#FFF8F0;--text:#1A1A2E;--tm:#6A5A4E;--tl:#9A8A7E;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--o:#F59E0B;--ol:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,#FFF8F0,#FFF3E0 40%,#FFE8CC);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--g),#D2691E);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--g),#D2691E);padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f5ece0;}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid #e8d8c0;border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid #dcd0c0;border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px rgba(232,119,46,.1);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;box-shadow:0 6px 20px rgba(232,119,46,.3);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid #d0c0a8;color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--g);color:var(--g);}
.history-badge{background:var(--gxl);color:var(--g);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}

.history-item{background:var(--card);border:1.5px solid #e8d8c0;border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--g);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--g);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--g);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--o);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{max-width:820px;margin:0 auto;padding:24px 20px 100px;}
.q-card{background:var(--card);border-radius:var(--radius);margin-bottom:22px;box-shadow:var(--shadow);overflow:hidden;}
.q-header{display:flex;align-items:center;gap:10px;padding:16px 22px;background:linear-gradient(135deg,#FFF8F0,#FFF3E0);border-bottom:1px solid #ecdcc8;flex-wrap:wrap;}
.q-num{width:36px;height:36px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-comprehension{background:#E8F6FF;color:#0277BD;}.tag-vocabulary{background:#E0F7FA;color:#00838F;}.tag-grammar{background:#EDE7F6;color:#5E35B1;}.tag-tf{background:var(--ol);color:#B45309;}.tag-short{background:#FCE4EC;color:#C2185B;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f5ece0;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--g);font-weight:800;}
.q-body{padding:22px;}
.q-passage{background:linear-gradient(135deg,#FFFCF8,#FFF8F0);border-left:4px solid var(--g);padding:16px 18px;margin-bottom:18px;border-radius:0 var(--rs) var(--rs) 0;font-size:13.5px;line-height:1.95;}
.q-stem{font-size:14px;font-weight:700;margin-bottom:16px;}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice-btn{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:2px solid #e8d8c0;border-radius:var(--rs);cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:14px;line-height:1.6;}
.choice-btn:hover{border-color:var(--g);}.choice-btn.selected{border-color:var(--g);box-shadow:0 0 0 3px rgba(232,119,46,.12);background:var(--gxxl);}
.c-num{min-width:26px;height:26px;background:#f0e0d0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}
.written-input{width:100%;padding:14px 16px;border:2px solid #dcd0c0;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);padding:10px 16px;display:flex;align-items:center;gap:5px;justify-content:center;z-index:100;overflow-x:auto;flex-wrap:wrap;}
.nav-dot{width:28px;height:28px;border-radius:50%;background:#e8d8c0;cursor:pointer;border:none;font-size:10px;font-weight:800;color:var(--tm);display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;}.nav-dot.answered{background:var(--g);color:#fff;}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,#FFF3E0,#FFE8CC);}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--g),#D2691E);color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#f0e0d0;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),#F5A623);transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FFFCF8;border-radius:var(--rs);border:1px solid #e8d8c0;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#f0e0d0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #dcd0c0;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #e8d8c0;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FFFCF8;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#FFF5EA;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>
</head>
<body>

<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">📝 온라인퀴즈 TEST</div>
  <h1 class="start-title">온라인퀴즈 <span>TEST</span></h1>
  <p class="start-subtitle">2025 고1 3월 모의고사 · 19번 · 심경 변화 · 20문항</p>
  <div class="info-card"><div class="info-card-header">📚 시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">2025 고1 3월 모의고사</span></div>
    <div class="info-row"><span class="info-label">문항</span><span class="info-value">19번 (심경 변화)</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">The Shed — 창고에서의 심경 변화</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">📝 20문항</div><div class="chip">⏱️ 20분</div><div class="chip">✅ 80점 이상 통과</div><div class="chip">📊 100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"19번","lesson":"심경 변화","title":"The Shed","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g1_mar_19"};

const FULL_PASSAGE=`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`;

const Q=[
{id:1,type:`comprehension`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`a kitchen`,`a classroom`,`a shed`,`a garage`],passage:FULL_PASSAGE,stem:`Where does this story take place?`,det:{korean:`이야기의 배경: <b>shed(창고)</b>`,analysis:`✅ ③ a shed: "The shed was cold and damp" → 창고\n❌ ① kitchen: 부엌\n❌ ② classroom: 교실\n❌ ④ garage: 차고`,tip:`shed = 헛간, 창고 (작은 건물)`}},
{id:2,type:`comprehension`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`a cat`,`a rabbit`,`a mouse`,`a bird`],passage:FULL_PASSAGE,stem:`What was the mysterious figure in the shadows?`,det:{korean:`그림자의 정체: <b>rabbit(토끼)</b>`,analysis:`✅ ② a rabbit: "A rabbit." → 토끼\n❌ ① cat: 고양이\n❌ ③ mouse: 쥐\n❌ ④ bird: 새`,tip:`정체 확인: "A rabbit." — 짧은 문장으로 극적 효과`}},
{id:3,type:`vocabulary`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`축축한`,`따뜻한`,`밝은`,`넓은`],passage:`The shed was cold and <u>damp</u>.`,stem:`밑줄 친 <b>damp</b>의 뜻은?`,det:{korean:`damp = <b>축축한</b>, 눅눅한`,analysis:`✅ ① 축축한: damp = moist\n❌ ② 따뜻한: warm\n❌ ③ 밝은: bright\n❌ ④ 넓은: wide`,tip:`damp = moist = humid = 축축한`}},
{id:4,type:`vocabulary`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`만들다`,`발견하다`,`분간하다`,`외출하다`],passage:`I can't <u>make out</u> what's moving.`,stem:`밑줄 친 <b>make out</b>의 뜻은?`,det:{korean:`make out = <b>분간하다</b>, 알아보다`,analysis:`✅ ③ 분간하다: make out = distinguish\n❌ ① 만들다: make\n❌ ② 발견하다: find\n❌ ④ 외출하다: go out`,tip:`make out = distinguish = recognize = 분간하다`}},
{id:5,type:`vocabulary`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`강한`,`희미한`,`빠른`,`큰`],passage:`A <u>faint</u> beam of light.`,stem:`밑줄 친 <b>faint</b>의 뜻은?`,det:{korean:`faint = <b>희미한</b>`,analysis:`✅ ② 희미한: faint = dim\n❌ ① 강한: strong\n❌ ③ 빠른: fast\n❌ ④ 큰: big`,tip:`faint = dim = weak (빛/소리가 희미한)`}},
{id:6,type:`vocabulary`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`뛰다`,`걷다`,`기어가다`,`깡충 뛰다`],passage:`The rabbit <u>hops</u> away.`,stem:`밑줄 친 <b>hops</b>의 뜻은?`,det:{korean:`hops = <b>깡충 뛰다</b> (토끼의 움직임)`,analysis:`✅ ④ 깡충 뛰다: hop = 깡충깡충 뛰다\n❌ ① 뛰다: run (달리다)\n❌ ② 걷다: walk\n❌ ③ 기어가다: crawl`,tip:`hop = 깡충 뛰다 (토끼, 개구리 등의 특유의 움직임)`}},
{id:7,type:`grammar`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`shake`,`shaking`,`shaken`,`shook`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice __________ with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`빈칸에 어법상 적절한 것은?`,det:{korean:`독립분사구문: my voice + 현재분사 → <b>shaking</b>`,analysis:`✅ ② shaking: 분사구문(능동)\n❌ ① shake: 동사원형\n❌ ③ shaken: 과거분사(수동)\n❌ ④ shook: 과거형`,tip:`독립분사구문: 주어 + V-ing (동시동작)`}},
{id:8,type:`grammar`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`breaking`,`broken`,`broke`,`to break`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light __________ through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`빈칸에 어법상 적절한 것은?`,det:{korean:`빛이 틈을 뚫고 <b>들어오는(breaking)</b> — 능동의 현재분사`,analysis:`✅ ① breaking: 현재분사(능동) — 빛이 뚫고 나오는\n❌ ② broken: 수동(깨진)\n❌ ③ broke: 과거형\n❌ ④ to break: to부정사`,tip:`현재분사(능동): light breaking through = 뚫고 나오는 빛`}},
{id:9,type:`tf`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`The shed was cold and damp. (T/F)`,det:{korean:`원문 첫 문장과 일치 → <b>True</b>`,analysis:`✅ True: "The shed was cold and damp" → 일치`,tip:`첫 문장에서 배경 묘사 확인`}},
{id:10,type:`tf`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`The narrator felt calm at the beginning. (T/F)`,det:{korean:`처음에 voice shaking with fear → 차분하지 않음 → <b>False</b>`,analysis:`❌ False: shaking with fear = 두려움 → calm(차분)이 아님`,tip:`calm ↔ shaking with fear: 반대 감정`}},
{id:11,type:`tf`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`The light came through a crack in the wall. (T/F)`,det:{korean:`"a crack in the wall" → 벽의 틈 → <b>True</b>`,analysis:`✅ True: crack in the wall = 벽의 틈`,tip:`세부 정보: crack in the wall (창문이 아님)`}},
{id:12,type:`tf`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`The rabbit stayed with the narrator at the end. (T/F)`,det:{korean:`토끼는 "hops away, disappearing" → 떠남 → <b>False</b>`,analysis:`❌ False: hops away = 뛰어서 떠남`,tip:`stayed(머물렀다) ↔ hops away(뛰어서 떠남)`}},
{id:13,type:`comprehension`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`frightened → more frightened`,`happy → sad`,`frightened → relieved`,`bored → excited`],passage:FULL_PASSAGE,stem:`화자의 심경 변화로 가장 적절한 것은?`,det:{korean:`공포(frightened) → 안도(relieved)`,analysis:`✅ ③ frightened → relieved\n❌ ① more frightened: 더 무서워짐(X)\n❌ ② happy → sad: 반대\n❌ ④ bored → excited: 맥락 무관`,tip:`심경 변화 단서: fear/beating fast → laugh/smiling/at ease`}},
{id:14,type:`short`,diff:`보통`,pts:5,fmt:"written",wa:`damp`,accept:[`damp`,`Damp`],passage:`The shed was cold and __________, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`빈칸에 들어갈 단어를 쓰시오.`,det:{korean:`창고는 춥고 <b>축축했다(damp)</b>`,analysis:`damp = 축축한, 눅눅한`,tip:`damp = moist = humid`}},
{id:15,type:`short`,diff:`보통`,pts:5,fmt:"written",wa:`crack`,accept:[`crack`,`Crack`,`a crack`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a __________ in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`빈칸에 들어갈 단어를 쓰시오.`,det:{korean:`벽의 <b>틈(crack)</b>으로 빛이 들어옴`,analysis:`crack = 틈, 균열\na crack in the wall = 벽의 틈`,tip:`crack = gap = opening = 틈`}},
{id:16,type:`short`,diff:`어려움`,pts:6,fmt:"written",wa:`at ease`,accept:[`at ease`,`At ease`,`at ease.`],passage:FULL_PASSAGE,stem:`화자가 마지막에 느끼는 감정 상태를 본문에서 영어 2단어로 쓰시오.`,det:{korean:`<b>at ease</b> = 편안한`,analysis:`"I start to feel at ease" = 편안함을 느끼기 시작하다\nat ease = comfortable = relaxed`,tip:`at ease = 편안한, 마음이 놓인`}},
{id:17,type:`comprehension`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`The shed was getting warmer.`,`The narrator found a door.`,`The shadow attacked the narrator.`,`The figure turned out to be a rabbit.`],passage:FULL_PASSAGE,stem:`What caused the narrator's emotional change?`,det:{korean:`그림자의 정체가 <b>토끼</b>였음을 알게 된 것이 심경 전환의 원인이다.`,analysis:`✅ ④ 정체가 토끼: 공포의 원인이 무해한 존재 → 안도\n❌ ① 따뜻해짐: 언급 없음\n❌ ② 문 발견: 언급 없음\n❌ ③ 공격: 언급 없음`,tip:`심경 전환점: "A rabbit." — 한 단어로 반전`}},
{id:18,type:`vocabulary`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`The shed was ①<u>cold</u> and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the ②<u>brightness</u>. 'Who's there?' I ask, my voice shaking with ③<u>fear</u>. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A ④<u>laugh</u> escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ⑤<u>ease</u>.`,stem:`밑줄 친 ①~⑤ 중 문맥상 부적절한 것은?`,det:{korean:`② brightness(밝음)는 원문의 shadows(그림자)를 대체 → 부적절`,analysis:`❌ ② brightness(밝음): 원문은 'shadows(그림자)' → 부적절\n✅ ① cold: 적절\n✅ ③ fear: 적절\n✅ ④ laugh: 적절\n✅ ⑤ ease: 적절`,tip:`shadows(그림자) ↔ brightness(밝음)`}},
{id:19,type:`grammar`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`(A) shaken — (B) broke — (C) disappear`,`(A) shake — (B) breaking — (C) disappeared`,`(A) shaking — (B) breaking — (C) disappearing`,`(A) shaking — (B) broken — (C) to disappear`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice <b>(A)</b> with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light <b>(B)</b> through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, <b>(C)</b> back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`(A), (B), (C)에 어법상 적절한 것끼리 짝지은 것은?`,det:{korean:`(A) 능동분사 → shaking (B) 능동분사 → breaking (C) 분사구문 → disappearing`,analysis:`✅ ③ shaking — breaking — disappearing: 모두 현재분사\n❌ ① shaken/broke: 수동/과거형\n❌ ② shake: 동사원형\n❌ ④ broken: 수동`,tip:`현재분사 3종: 분사구문(shaking) / 후치수식(breaking) / 동시동작(disappearing)`}},
{id:20,type:`comprehension`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`I'm left smiling.`,`I screamed and ran away.`,`I caught the rabbit.`,`The shed became bright.`],passage:FULL_PASSAGE,stem:`How does the narrator feel at the end of the story?`,det:{korean:`마지막에 화자는 미소 짓고 있다: "I'm left smiling. I start to feel at ease."`,analysis:`✅ ① I'm left smiling: 미소 짓고 편안함 = 원문 일치\n❌ ② 비명/도망: 언급 없음\n❌ ③ 토끼 잡음: hops away(떠남)\n❌ ④ 밝아짐: 언급 없음`,tip:`마지막 문장들: smiling + at ease = 편안하고 안도한 상태`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'comprehension':'tag-comprehension','vocabulary':'tag-vocabulary','grammar':'tag-grammar','tf':'tag-tf','short':'tag-short'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.slice(0,8)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,8)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
