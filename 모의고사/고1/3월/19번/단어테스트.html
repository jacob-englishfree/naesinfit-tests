.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #dde8df;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FAFDFB;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F0F8F1;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}

.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"19번","lesson":"심경 변화","title":"The Shed","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_2025_g1_mar_19"};

const FULL_PASSAGE=`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`;

const Q=[
{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`damp — bright — crack`,`damp — faint — crack`,`dry — faint — crack`,`damp — faint — hole`,`dry — bright — hole`],passage:`The shed was cold and <b>(A)</b>, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a <b>(B)</b> beam of light breaking through a <b>(C)</b> in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`창고는 춥고 <b>축축했다(damp)</b>. 인물이 벽의 <b>틈(crack)</b>으로 들어오는 <b>희미한(faint)</b> 빛 속으로 들어선다.`,analysis:`✅ ② damp — faint — crack: 원문 일치\n❌ ① bright: faint(희미한)의 반의어\n❌ ③ dry: damp(축축한)의 반의어\n❌ ④ hole: crack이 원문\n❌ ⑤ dry/bright: 둘 다 반의어`,tip:`damp(축축한)↔dry(건조한), faint(희미한)↔bright(밝은), crack(틈)≈hole(구멍)`}},
{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`shaking — curious — ease`,`shaking — angry — ease`,`steady — curious — ease`,`shaking — curious — tension`,`steady — angry — tension`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice <b>(A)</b> with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, <b>(B)</b> eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at <b>(C)</b>.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`목소리가 두려움으로 <b>떨리고(shaking)</b>, 토끼가 <b>호기심 가득한(curious)</b> 눈으로 바라보고, <b>편안함(ease)</b>을 느낀다.`,analysis:`✅ ① shaking — curious — ease: 원문 일치\n❌ ② angry: curious의 반의어\n❌ ③ steady: shaking의 반의어\n❌ ④ tension: ease의 반의어\n❌ ⑤ steady/angry/tension: 모두 부적절`,tip:`shaking(떨리는)↔steady(안정된), curious(호기심 있는)↔indifferent, at ease(편안한)↔tense(긴장한)`}},
{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`The shed was cold and ①<u>damp</u>, the air thick with the smell of old wood and earth. It's dark, and I can't ②<u>make out</u> what's moving in the shadows. 'Who's there?' I ask, my voice ③<u>steady</u> with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a ④<u>faint</u> beam of light breaking through a crack in the wall. A rabbit. A ⑤<u>laugh</u> escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`두려움으로 목소리가 <b>떨리는(shaking)</b>데, ③ steady(안정된)는 반대 의미로 부적절.`,analysis:`❌ ③ steady(안정된): 원문은 'shaking(떨리는)' → 부적절\n✅ ① damp: 축축한 → 적절\n✅ ② make out: 분간하다 → 적절\n✅ ④ faint: 희미한 → 적절\n✅ ⑤ laugh: 웃음 → 적절`,tip:`shaking(떨리는) ↔ steady(안정된) — 핵심 반의어`}},
{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is ①<u>beating</u> fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh ②<u>escapes</u> my lips as it ③<u>stares</u> at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit ④<u>rushes toward</u> me, then disappears back into the shadows. I'm left smiling. I start to feel at ⑤<u>ease</u>.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`토끼는 잠시 멈춘 뒤 <b>깡충 뛰어 떠났다(hops away)</b>. ④ rushes toward(돌진하다)는 부적절.`,analysis:`❌ ④ rushes toward(돌진하다): 원문은 'hops away(깡충 뛰어 떠나다)' → 부적절\n✅ ① beating: 뛰다 → 적절\n✅ ② escapes: (웃음이) 나오다 → 적절\n✅ ③ stares: 응시하다 → 적절\n✅ ⑤ ease: 편안함 → 적절`,tip:`hops away(깡충 뛰어가다) ↔ rushes toward(돌진하다)`}},
{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`dry`,`warm`,`moist`,`clean`],passage:`The shed was cold and <u>damp</u>.`,stem:`밑줄 친 <b>damp</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`damp = 축축한, moist = 축축한 → 동의어`,analysis:`✅ ③ moist: 축축한 → damp의 동의어\n❌ ① dry: 건조한 (반의어)\n❌ ② warm: 따뜻한\n❌ ④ clean: 깨끗한`,tip:`damp = moist = humid = 축축한, 눅눅한 ↔ dry = 건조한`}},
{id:6,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`recognize`,`forget`,`create`,`destroy`],passage:`I can't <u>make out</u> what's moving in the shadows.`,stem:`밑줄 친 <b>make out</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`make out = 분간하다, recognize = 알아보다 → 유사 의미`,analysis:`✅ ① recognize: 알아보다 → make out의 유사어\n❌ ② forget: 잊다\n❌ ③ create: 만들다\n❌ ④ destroy: 파괴하다`,tip:`make out = distinguish = recognize = 분간하다, 알아보다`}},
{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`bright`,`dim`,`strong`,`loud`],passage:`The figure steps into a <u>faint</u> beam of light.`,stem:`밑줄 친 <b>faint</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`faint = 희미한, dim = 희미한 → 동의어`,analysis:`✅ ② dim: 희미한 → faint의 동의어\n❌ ① bright: 밝은 (반의어)\n❌ ③ strong: 강한\n❌ ④ loud: 시끄러운`,tip:`faint = dim = weak = 희미한 ↔ bright = vivid = 밝은, 선명한`}},
{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`trembling`,`quivering`,`vibrating`,`calm`],passage:`My voice <u>shaking</u> with fear.`,stem:`밑줄 친 <b>shaking</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`shaking = 떨리는 ↔ calm = 차분한`,analysis:`❌ ④ calm(차분한): shaking의 반의어 → 가장 먼 의미\n✅ ① trembling: 떨리는 → 동의어\n✅ ② quivering: 떨리는 → 동의어\n✅ ③ vibrating: 진동하는 → 유사어`,tip:`shake = tremble = quiver = 떨다 ↔ calm = steady = 차분한, 안정된`}},
{id:9,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`indifferent`,`interested`,`fascinated`,`eager`],passage:`It stares at me with wide, <u>curious</u> eyes.`,stem:`밑줄 친 <b>curious</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`curious = 호기심 있는 ↔ indifferent = 무관심한`,analysis:`❌ ① indifferent(무관심한): curious의 반의어 → 가장 먼 의미\n✅ ② interested: 관심 있는 → 유사어\n✅ ③ fascinated: 매료된 → 유사어\n✅ ④ eager: 열망하는 → 유사어`,tip:`curious = interested ↔ indifferent = apathetic = 무관심한`}},
{id:10,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`running`,`walking`,`beating`,`stopping`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is __________ fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`그림자가 다가오자 심장이 빠르게 <b>뛰고(beating)</b> 있다.`,analysis:`✅ ③ beating: 심장이 뛰다 → 원문 일치\n❌ ① running: 달리다\n❌ ② walking: 걷다\n❌ ④ stopping: 멈추다`,tip:`heart is beating fast = 심장이 빠르게 뛰다 (긴장/공포)`}},
{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`cry`,`laugh`,`scream`,`whisper`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A __________ escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`토끼를 보고 안도하며 <b>웃음(laugh)</b>이 터져 나왔다.`,analysis:`✅ ② laugh: 웃음 → 안도감 표현\n❌ ① cry: 울음 → 맥락과 불일치\n❌ ③ scream: 비명\n❌ ④ whisper: 속삭임`,tip:`A laugh escapes my lips = 웃음이 나오다 (안도의 표현)`}},
{id:12,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`flies`,`crawls`,`runs`,`hops`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then __________ away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`토끼가 잠시 멈추고 <b>깡충 뛰어(hops)</b> 사라졌다.`,analysis:`✅ ④ hops: 깡충 뛰다 → 토끼의 움직임\n❌ ① flies: 날다\n❌ ② crawls: 기어가다\n❌ ③ runs: 달리다 (가능하지만 원문은 hops)`,tip:`hop = 깡충 뛰다 (토끼, 개구리 등의 움직임)`}},
{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`두꺼운 (두께)`,`무거운`,`짙은, 가득 찬`,`어려운`],passage:`The air <u>thick</u> with the smell of old wood and earth.`,stem:`밑줄 친 <b>thick</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`공기가 오래된 나무와 흙 냄새로 <b>짙은/가득 찬(thick)</b> 상태이다.`,analysis:`✅ ③ 짙은, 가득 찬: thick with = ~로 가득 찬\n❌ ① 두꺼운: thick book(두꺼운 책)의 thick\n❌ ② 무거운: heavy\n❌ ④ 어려운: difficult`,tip:`thick 다의어: 두꺼운(물리적) / 짙은(농도) / 빽빽한(밀도)`}},
{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`빛줄기, 광선`,`대들보`,`환하게 웃다`,`(전파를) 보내다`],passage:`A faint <u>beam</u> of light breaking through a crack in the wall.`,stem:`밑줄 친 <b>beam</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`벽의 틈으로 들어오는 희미한 <b>빛줄기(beam)</b>`,analysis:`✅ ① 빛줄기, 광선: a beam of light = 한 줄기 빛\n❌ ② 대들보: 건축 용어\n❌ ③ 환하게 웃다: beam with joy\n❌ ④ 전파를 보내다: beam a signal`,tip:`beam 다의어: 빛줄기(명사) / 대들보(명사) / 환하게 웃다(동사)`}},
{id:15,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`beam`,`crack`,`shadow`,`shed`],passage:`<i>a narrow opening or gap, especially in a wall or surface</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`벽이나 표면의 좁은 틈 → <b>crack(틈, 균열)</b>`,analysis:`✅ ② crack: 틈, 균열 → 영영 정의와 일치\n❌ ① beam: 빛줄기\n❌ ③ shadow: 그림자\n❌ ④ shed: 창고`,tip:`crack = gap = opening = 틈, 균열`}},
{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`crack`,`beam`,`shadow`,`stare`],passage:`<i>to look at someone or something for a long time without moving your eyes</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`눈을 움직이지 않고 오랫동안 바라보다 → <b>stare(응시하다)</b>`,analysis:`✅ ④ stare: 응시하다 → 영영 정의와 일치\n❌ ① crack: 틈\n❌ ② beam: 빛줄기\n❌ ③ shadow: 그림자`,tip:`stare = gaze = 응시하다 (오래 쳐다보다)`}},
{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`shaking`,accept:[`shaking`,`Shaking`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice __________ (shake) with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`목소리가 두려움으로 <b>떨리고 있는(shaking)</b> 상태 → 현재분사`,analysis:`shake → shaking: 현재분사(능동/진행)\n'my voice shaking' = 분사구문 (목소리가 떨리면서)`,tip:`현재분사: 능동/진행 의미 — voice shaking = 떨리는 목소리`}},
{id:18,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`disappearing`,accept:[`disappearing`,`Disappearing`],passage:`The shed was cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. 'Who's there?' I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. 'You scared me,' I say, feeling much better. The rabbit pauses for a moment, then hops away, __________ (disappear) back into the shadows. I'm left smiling. I start to feel at ease.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`토끼가 뛰어가며 그림자 속으로 <b>사라지며(disappearing)</b> → 분사구문(동시동작)`,analysis:`disappear → disappearing: 현재분사(분사구문)\n분사구문: 주어(rabbit)가 뛰어가면서 동시에 사라지는 동작`,tip:`분사구문(동시동작): ~하면서 → V-ing (= and + V)`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`frightened → more frightened`,`relieved → frightened`,`frightened → relieved`,`curious → bored`],passage:FULL_PASSAGE,stem:`이 글에서 화자의 심경 변화로 가장 적절한 것은?`,det:{korean:`처음에는 어둠 속 그림자에 <b>겁먹었다가(frightened)</b>, 토끼임을 알고 <b>안도한다(relieved)</b>.`,analysis:`✅ ③ frightened → relieved: 공포 → 안도\n❌ ① more frightened: 계속 무서움 X\n❌ ② relieved → frightened: 순서 반대\n❌ ④ curious → bored: 맥락과 무관`,tip:`심경 변화 단서: shaking with fear(공포) → laugh/smiling/at ease(안도)`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`a dangerous snake`,`a harmless rabbit`,`a lost puppy`,`a mysterious stranger`],passage:`The shadow moves closer, and my heart is beating fast — until the figure steps into a faint beam of light. It turned out to be __________.`,stem:`빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`그림자의 정체는 <b>무해한 토끼(a harmless rabbit)</b>였다.`,analysis:`✅ ② a harmless rabbit: 원문 "A rabbit" → 무해한 토끼\n❌ ① a dangerous snake: 위험한 뱀\n❌ ③ a lost puppy: 길 잃은 강아지\n❌ ④ a mysterious stranger: 낯선 사람`,tip:`그림자의 정체 = rabbit(토끼) → 공포에서 안도로 심경 변화의 전환점`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인단어 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
