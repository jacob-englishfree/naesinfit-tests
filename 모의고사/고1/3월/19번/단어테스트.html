.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #dde8df;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FAFDFB;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F0F8F1;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"19번","lesson":"심경 변화","title":"The Shed — A Rabbit Encounter","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_2025_g1_mar_19"};

const FULL_PASSAGE=`The shed is cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. "Who's there?" I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast \u2014 until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. "You scared me," I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`;

const Q=[
{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`damp — shaking — faint`,`dry — shaking — faint`,`damp — steady — faint`,`damp — shaking — bright`,`dry — steady — bright`],
passage:`The shed is cold and <b>(A)</b>, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. "Who's there?" I ask, my voice <b>(B)</b> with fear. The shadow moves closer, and my heart is beating fast \u2014 until the figure steps into a <b>(C)</b> beam of light breaking through a crack in the wall.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`헛간은 춥고 <b>축축하며(damp)</b>, 목소리는 두려움으로 <b>떨리고(shaking)</b>, <b>희미한(faint)</b> 빛줄기가 비친다.`,
analysis:`✅ ① damp — shaking — faint: 원문 일치\n❌ ② dry: damp의 반의어\n❌ ③ steady: shaking의 반의어\n❌ ④ bright: faint의 반의어\n❌ ⑤ 세 단어 모두 부적절`,
tip:`damp(축축한)↔dry(건조한), shaking(떨리는)↔steady(안정된), faint(희미한)↔bright(밝은)`}},

{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`escapes — curious — disappearing`,`escapes — indifferent — disappearing`,`escapes — curious — appearing`,`suppresses — curious — disappearing`,`suppresses — indifferent — appearing`],
passage:`A rabbit. A laugh <b>(A)</b> my lips as it stares at me with wide, <b>(B)</b> eyes. "You scared me," I say, feeling much better. The rabbit pauses for a moment, then hops away, <b>(C)</b> back into the shadows. I'm left smiling. I start to feel at ease.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`웃음이 입술에서 <b>새어 나오고(escapes)</b>, 토끼가 <b>호기심 어린(curious)</b> 눈으로 쳐다보며, 그림자 속으로 <b>사라진다(disappearing)</b>.`,
analysis:`✅ ① escapes — curious — disappearing: 원문 일치\n❌ ② indifferent(무관심한): curious의 반의어\n❌ ③ appearing(나타나는): disappearing의 반의어\n❌ ④ suppresses(억누르다): escapes의 반의어\n❌ ⑤ 세 단어 모두 부적절`,
tip:`escape(빠져나오다)↔suppress(억누르다), curious(호기심 있는)↔indifferent(무관심한)`}},

{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`The shed is cold and damp, the air ①<u>thick</u> with the smell of old wood and earth. It's dark, and I can't ②<u>make out</u> what's moving in the shadows. "Who's there?" I ask, my voice ③<u>shaking</u> with fear. The shadow moves closer, and my heart is beating fast \u2014 until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. "You scared me," I say, feeling much ④<u>worse</u>. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left ⑤<u>smiling</u>. I start to feel at ease.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`토끼인 것을 알고 <b>훨씬 나아졌다(better)</b>는 맥락인데, ④ worse(더 나쁜)는 better의 반의어로 부적절.`,
analysis:`❌ ④ worse(더 나쁜): 원문은 better(더 나은) → 토끼를 보고 안심한 맥락과 반대\n✅ ① thick(짙은): 원문 일치\n✅ ② make out(알아보다): 원문 일치\n✅ ③ shaking(떨리는): 원문 일치\n✅ ⑤ smiling(미소 짓는): 원문 일치`,
tip:`better(더 나은) ↔ worse(더 나쁜) — 심경 변화: 두려움 → 안도`}},

{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`The shed is cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the ①<u>shadows</u>. "Who's there?" I ask, my voice shaking with fear. The shadow moves ②<u>farther</u>, and my heart is beating fast \u2014 until the figure steps into a faint beam of light breaking through a ③<u>crack</u> in the wall. A rabbit. A laugh ④<u>escapes</u> my lips as it stares at me with wide, curious eyes. "You scared me," I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ⑤<u>ease</u>.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`그림자가 <b>더 가까이(closer)</b> 다가온다는 맥락인데, ② farther(더 멀리)는 closer의 반의어로 부적절.`,
analysis:`❌ ② farther(더 멀리): 원문은 closer(더 가까이) → 긴장감 고조 맥락과 반대\n✅ ① shadows(그림자): 원문 일치\n✅ ③ crack(갈라진 틈): 원문 일치\n✅ ④ escapes(빠져나오다): 원문 일치\n✅ ⑤ ease(편안함): 원문 일치`,
tip:`closer(더 가까이) ↔ farther(더 멀리) — 그림자가 다가오며 공포 고조`}},

{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`dry`,`warm`,`bright`,`moist`],
passage:`The shed is cold and <u>damp</u>, the air thick with the smell of old wood and earth.`,
stem:`밑줄 친 <b>damp</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`damp = 축축한, moist = 축축한 → 동의어`,
analysis:`✅ ④ moist(축축한): damp의 동의어\n❌ ① dry(건조한): 반의어\n❌ ② warm(따뜻한): 다른 의미\n❌ ③ bright(밝은): 다른 의미`,
tip:`damp = moist = humid = 축축한 ↔ dry(건조한)`}},

{id:6,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`strong`,`weak`,`narrow`,`steady`],
passage:`The figure steps into a <u>faint</u> beam of light breaking through a crack in the wall.`,
stem:`밑줄 친 <b>faint</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`faint = 희미한, weak = 약한/희미한 → 유사어`,
analysis:`✅ ② weak(약한, 희미한): faint의 동의어\n❌ ① strong(강한): 반의어\n❌ ③ narrow(좁은): 다른 의미\n❌ ④ steady(안정된): 다른 의미`,
tip:`faint = weak = dim = 희미한 ↔ strong = bright(밝은, 강한)`}},

{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`closing`,`opening`,`vanishing`,`approaching`],
passage:`The rabbit pauses for a moment, then hops away, <u>disappearing</u> back into the shadows.`,
stem:`밑줄 친 <b>disappearing</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`disappearing = 사라지는, vanishing = 사라지는 → 동의어`,
analysis:`✅ ③ vanishing(사라지는): disappearing의 동의어\n❌ ① closing(닫히는): 다른 의미\n❌ ② opening(열리는): 다른 의미\n❌ ④ approaching(다가오는): 반의어`,
tip:`disappear = vanish = fade away = 사라지다 ↔ appear(나타나다)`}},

{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`anxiety`,`comfort`,`relief`,`peace`],
passage:`I'm left smiling. I start to feel at <u>ease</u>.`,
stem:`밑줄 친 <b>ease</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`ease = 편안함 ↔ anxiety = 불안`,
analysis:`❌ ① anxiety(불안): ease의 반의어 → 가장 먼 의미\n✅ ② comfort(편안함): 동의어\n✅ ③ relief(안도): 유사어\n✅ ④ peace(평화): 유사어`,
tip:`ease = comfort = relief ↔ anxiety = unease = tension`}},

{id:9,type:`반의어 고르기`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`identify`,`recognize`,`distinguish`,`confuse`],
passage:`It's dark, and I can't <u>make out</u> what's moving in the shadows.`,
stem:`밑줄 친 <b>make out</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`make out = 알아보다, 식별하다 ↔ confuse = 혼동하다`,
analysis:`❌ ④ confuse(혼동하다): make out의 반의어 → 가장 먼 의미\n✅ ① identify(확인하다): 동의어\n✅ ② recognize(인식하다): 동의어\n✅ ③ distinguish(구별하다): 유사어`,
tip:`make out = identify = recognize = 알아보다 ↔ confuse(혼동하다)`}},

{id:10,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`steady`,`calm`,`confident`,`shaking`],
passage:`The shed is cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. "Who's there?" I ask, my voice __________ with fear. The shadow moves closer, and my heart is beating fast \u2014 until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. "You scared me," I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`두려움으로 목소리가 <b>떨리고(shaking)</b> 있다.`,
analysis:`✅ ④ shaking(떨리는): "with fear"와 자연스럽게 연결\n❌ ① steady(안정된): 두려움과 반대\n❌ ② calm(차분한): 두려움과 반대\n❌ ③ confident(자신감 있는): 두려움과 반대`,
tip:`shaking with fear = 두려움으로 떨리는`}},

{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`crack`,`beam`,`shadow`,`wall`],
passage:`The shed is cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. "Who's there?" I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast \u2014 until the figure steps into a faint __________ of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. "You scared me," I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at ease.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`벽의 틈새로 들어오는 희미한 빛<b>줄기(beam)</b>.`,
analysis:`✅ ② beam(줄기, 광선): "a faint ______ of light" → beam of light(빛줄기)\n❌ ① crack(틈): 이미 뒤에 등장\n❌ ③ shadow(그림자): 빛과 반대\n❌ ④ wall(벽): 의미 부적절`,
tip:`beam of light = 빛줄기 — faint beam = 희미한 빛줄기`}},

{id:12,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`anxiety`,`tension`,`ease`,`discomfort`],
passage:`The shed is cold and damp, the air thick with the smell of old wood and earth. It's dark, and I can't make out what's moving in the shadows. "Who's there?" I ask, my voice shaking with fear. The shadow moves closer, and my heart is beating fast \u2014 until the figure steps into a faint beam of light breaking through a crack in the wall. A rabbit. A laugh escapes my lips as it stares at me with wide, curious eyes. "You scared me," I say, feeling much better. The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left smiling. I start to feel at __________.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`미소를 지으며 <b>편안함(ease)</b>을 느끼기 시작한다.`,
analysis:`✅ ③ ease(편안함): "I'm left smiling" + "feel at ______" → 안도/편안\n❌ ① anxiety(불안): 반대\n❌ ② tension(긴장): 반대\n❌ ④ discomfort(불편): 반대`,
tip:`feel at ease = 편안하게 느끼다 — 심경 변화의 결과`}},

{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`알아보다`,`만들다`,`구성하다`,`~인 체하다`],
passage:`It's dark, and I can't <u>make out</u> what's moving in the shadows.`,
stem:`밑줄 친 <b>make out</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`어둠 속에서 움직이는 것을 <b>알아볼(make out)</b> 수 없다.`,
analysis:`✅ ① 알아보다: can't make out = 식별할 수 없다\n❌ ② 만들다: make의 기본 의미\n❌ ③ 구성하다: make up과 혼동\n❌ ④ ~인 체하다: make believe와 혼동`,
tip:`make out: 알아보다(시각) | 이해하다 | ~인 체하다 | 키스하다(구어)`}},

{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`빛이 나다`,`고장 나다`,`탈출하다, 빠져나오다`,`도망치다`],
passage:`A laugh <u>escapes</u> my lips as it stares at me with wide, curious eyes.`,
stem:`밑줄 친 <b>escapes</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`웃음이 입술에서 <b>빠져나온다(escapes)</b> = 자기도 모르게 웃음이 나온다.`,
analysis:`✅ ③ 탈출하다, 빠져나오다: 웃음이 자연스럽게 빠져나옴\n❌ ① 빛이 나다: 다른 의미\n❌ ② 고장 나다: 다른 의미\n❌ ④ 도망치다: 사람이 도망칠 때 사용`,
tip:`A laugh escapes one's lips = 웃음이 저절로 나오다 — escape의 비유적 용법`}},

{id:15,type:`영영풀이 매칭`,diff:`어려움`,pts:6,fmt:"mc",ans:3,
ch:[`shaking`,`disappearing`,`escaping`,`damp`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"slightly wet, often in a way that is unpleasant"</b>`,
det:{korean:`'약간 젖어 있는, 종종 불쾌한 방식으로' → <b>damp(축축한)</b>`,
analysis:`✅ ④ damp: 영영 정의와 정확히 일치\n❌ ① shaking: 떨리는\n❌ ② disappearing: 사라지는\n❌ ③ escaping: 빠져나오는`,
tip:`damp = slightly wet = 약간 축축한`}},

{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`beam`,`crack`,`shadow`,`figure`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"a narrow opening or gap in a surface"</b>`,
det:{korean:`'표면의 좁은 틈 또는 간격' → <b>crack(갈라진 틈)</b>`,
analysis:`✅ ② crack: 영영 정의와 일치\n❌ ① beam: 빛줄기\n❌ ③ shadow: 그림자\n❌ ④ figure: 형체`,
tip:`crack = narrow opening = gap = 틈, 갈라진 곳`}},

{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`smiling`,accept:[`smiling`,`Smiling`],
passage:`The rabbit pauses for a moment, then hops away, disappearing back into the shadows. I'm left __________ (smile). I start to feel at ease.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`smile → <b>smiling</b>: "be left + ~ing" = ~한 상태로 남겨지다`,
analysis:`smile(동사) → smiling(현재분사)\nbe left smiling = 미소 짓고 있는 상태로 남겨지다`,
tip:`be left + ~ing: ~하는 상태로 남다 — 결과 상태를 나타내는 분사`}},

{id:18,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`curious`,accept:[`curious`,`Curious`],
passage:`A rabbit. A laugh escapes my lips as it stares at me with wide, __________ (curiosity) eyes.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`curiosity(명사) → <b>curious(형용사)</b>: eyes를 수식하는 형용사 필요`,
analysis:`curiosity(명사) → curious(형용사)\n"wide, curious eyes" — 형용사가 명사 eyes를 수식`,
tip:`curiosity(호기심, 명사) → curious(호기심 많은, 형용사)`}},

{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`envious → hopeful`,`anxious → angry`,`frightened → relieved`,`curious → regretful`,`excited → disappointed`],
passage:FULL_PASSAGE,
stem:`다음 글에 드러난 'I'의 심경 변화로 가장 적절한 것은?`,
det:{korean:`처음에는 어둠 속 그림자에 <b>두려움(frightened)</b>을 느끼다가, 토끼임을 알고 <b>안도(relieved)</b>하며 편안해진다.`,
analysis:`✅ ③ frightened → relieved: "shaking with fear" → "feeling much better" + "feel at ease"\n❌ ① envious → hopeful: 부러움 없음\n❌ ② anxious → angry: 화남 없음\n❌ ④ curious → regretful: 후회 없음\n❌ ⑤ excited → disappointed: 실망 없음`,
tip:`심경 변화: fear/shaking(두려움) → better/smiling/ease(안도) = frightened → relieved`}},

{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`horrified`,`relieved`,`confused`,`bored`,`frustrated`],
passage:FULL_PASSAGE.replace('I start to feel at ease','I start to feel __________'),
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`토끼를 보고 안심한 후 미소를 짓고 있으므로 <b>안도한(relieved)</b>이 적절.`,
analysis:`✅ ② relieved(안도한): "I'm left smiling" + "feel __" → 안도\n❌ ① horrified(공포에 질린): 반대\n❌ ③ confused(혼란스러운): 미소와 어울리지 않음\n❌ ④ bored(지루한): 무관\n❌ ⑤ frustrated(좌절한): 무관`,
tip:`relieved = 안도한 — 두려움이 해소된 후의 감정`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch?(d.q.ch.length===5?'①②③④⑤':'①②③④'):'';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인단어 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
