const EI={"subject":"2025 고1 3월 모의고사","pub":"35번","lesson":"무관한 문장","title":"Hero vs Villain","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_2025_g1_mar_35"};

const FULL_PASSAGE=`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. ①In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. ②Likewise, the line between friends and enemies is not clear in reality. ③Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. ④Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. ⑤In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`;

const Q=[
{id:1,type:`빈칸 문맥 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`the audience should avoid emotional films`,`villains are more interesting than heroes`,`entertainment should focus on realistic portrayals`,`authors must build a bond between protagonist and audience`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`이 글의 핵심 주장으로 가장 적절한 것은?`,det:{korean:`작가는 주인공과 관객 사이에 <b>긍정적 관계(bond)</b>를 형성해야 한다는 것이 핵심 주장이다.`,analysis:`✅ ④ authors must build a bond between protagonist and audience: 핵심 주장과 일치\n❌ ① 감정적 영화 회피: 반대\n❌ ② 악당이 더 흥미로움: 언급 없음\n❌ ③ 현실적 묘사: 글의 핵심 아님`,tip:`establish a positive relationship = build a bond = 유대를 형성하다`}},
{id:2,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`artistic`,accept:[`artistic`,`Artistic`],passage:`What does it mean for a character to be a hero as opposed to a villain? In __________ (art) and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`명사 descriptions를 수식하는 형용사가 필요하다 → art → <b>artistic</b>`,analysis:`art(명사) → artistic(형용사): 명사 앞에서 수식\n'artistic descriptions' = 예술적 묘사`,tip:`art(예술, 명사) → artistic(예술적인, 형용사) — -istic 접미사`}},
{id:3,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`entertainment`,accept:[`entertainment`,`Entertainment`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and __________ (entertain) descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`and로 artistic과 병렬 구조이나, entertainment는 명사가 형용사처럼 명사를 수식하는 구조 → <b>entertainment</b>`,analysis:`entertain(동사) → entertainment(명사): 명사의 형용사적 사용\n'entertainment descriptions' = 오락/엔터테인먼트 묘사`,tip:`entertain(즐겁게 하다) → entertainment(오락, 명사) — 명사가 명사를 수식하는 복합명사`}},
{id:4,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`negative`,`positive`,`neutral`,`hostile`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a __________ relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`작가는 주인공과 관객 사이에 <b>긍정적인(positive)</b> 관계를 형성해야 한다.`,analysis:`✅ ② positive: 긍정적인 → 원문 일치\n❌ ① negative: 부정적인\n❌ ③ neutral: 중립적인\n❌ ④ hostile: 적대적인`,tip:`positive(긍정적인) ↔ negative(부정적인)`}},
{id:5,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`adjusted`,`abandoned`,`amplified`,`abolished`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be __________ so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`캐릭터는 친구나 적으로 알아볼 수 있도록 <b>조정되어야(adjusted)</b> 한다.`,analysis:`✅ ① adjusted: 조정된 → 원문 일치\n❌ ② abandoned: 버려진\n❌ ③ amplified: 증폭된\n❌ ④ abolished: 폐지된`,tip:`adjust = 조정하다, 적응시키다`}},
{id:6,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to ①<u>establish</u> a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be ②<u>unrecognizable</u> as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions ③<u>benefit</u> us: the protagonist is, or would be, a ④<u>worthy</u> companion or ⑤<u>valued</u> ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`캐릭터는 친구나 적으로 <b>알아볼 수 있도록(recognizable)</b> 조정되어야 한다. ② unrecognizable(알아볼 수 없는)은 recognizable의 반의어로 부적절.`,analysis:`❌ ② unrecognizable(알아볼 수 없는): 원문은 'recognizable(알아볼 수 있는)' → 부적절\n✅ ① establish: 형성하다 → 적절\n✅ ③ benefit: 이롭게 하다 → 적절\n✅ ④ worthy: 가치 있는 → 적절\n✅ ⑤ valued: 소중한 → 적절`,tip:`recognizable(알아볼 수 있는) ↔ unrecognizable(알아볼 수 없는)`}},
{id:7,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`fictional — harm — ally`,`fictional — benefit — ally`,`factual — benefit — enemy`,`fictional — benefit — enemy`,`factual — harm — ally`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is <b>(A)</b> or documentary, we must feel that the protagonist is someone whose actions <b>(B)</b> us: the protagonist is, or would be, a worthy companion or valued <b>(C)</b>. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`묘사가 <b>허구적(fictional)</b>이든 다큐멘터리이든, 주인공의 행동이 우리에게 <b>이로운(benefit)</b> 사람이라고 느껴야 한다. 주인공은 가치 있는 동반자이자 소중한 <b>동맹(ally)</b>이다.`,analysis:`✅ ② fictional — benefit — ally: 원문 일치\n❌ ① harm: benefit의 반의어\n❌ ③ factual/enemy: 부적절\n❌ ④ enemy: ally의 반의어\n❌ ⑤ factual/harm: 부적절`,tip:`fictional(허구적) ↔ factual(사실적), benefit(이롭게 하다) ↔ harm(해치다), ally(동맹) ↔ enemy(적)`}},
{id:8,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`villain`,`hero`,`protagonist`,`companion`],passage:`<i>a character in a story whose evil actions or motives are important to the plot</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`이야기에서 악한 행동이나 동기가 줄거리에 중요한 캐릭터 → <b>villain(악당)</b>`,analysis:`✅ ① villain: 악당 → 영영 정의와 일치\n❌ ② hero: 영웅 (반대)\n❌ ③ protagonist: 주인공\n❌ ④ companion: 동반자`,tip:`villain = antagonist = 악당, 악역 ↔ hero`}},
{id:9,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`happiness`,`comedy`,`tragedy`,`romance`],passage:`<i>a serious form of drama dealing with the downfall of a heroic or important character</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`영웅적이거나 중요한 인물의 몰락을 다루는 심각한 형태의 드라마 → <b>tragedy(비극)</b>`,analysis:`✅ ③ tragedy: 비극 → 영영 정의와 일치\n❌ ① happiness: 행복\n❌ ② comedy: 희극 (반의어)\n❌ ④ romance: 로맨스`,tip:`tragedy(비극) ↔ comedy(희극)`}},
{id:10,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`accidental`,`secondary`,`random`,`unimportant`],passage:`Violent action films are often filled with dozens of <u>incidental</u> deaths of minor characters.`,stem:`밑줄 친 <b>incidental</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`incidental = 부수적인, unimportant = 중요하지 않은 → 유사어`,analysis:`✅ ④ unimportant: 중요하지 않은 → incidental과 가장 유사\n❌ ① accidental: 우연의 (유사하나 뉘앙스 다름)\n❌ ② secondary: 이차적인 (다소 다름)\n❌ ③ random: 무작위의`,tip:`incidental = minor = unimportant = 부수적인, 사소한`}},
{id:11,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`description`,`rejection`,`destruction`,`prediction`],passage:`Whether the <u>portrayal</u> is fictional or documentary.`,stem:`밑줄 친 <b>portrayal</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`portrayal = 묘사, description = 묘사 → 동의어`,analysis:`✅ ① description: 묘사 → portrayal의 동의어\n❌ ② rejection: 거부\n❌ ③ destruction: 파괴\n❌ ④ prediction: 예측`,tip:`portrayal = description = depiction = 묘사`}},
{id:12,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`protagonist`,`hero`,`ally`,`companion`],passage:`What does it mean for a character to be a hero as opposed to a <u>villain</u>?`,stem:`밑줄 친 <b>villain</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`villain = 악당 ↔ hero = 영웅`,analysis:`❌ ② hero(영웅): villain의 반의어 → 가장 먼 의미\n✅ ① protagonist: 주인공 (반드시 영웅은 아님)\n✅ ③ ally: 동맹\n✅ ④ companion: 동반자`,tip:`villain(악당) ↔ hero(영웅) — 가장 직접적 반의어`}},
{id:13,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`partner`,`friend`,`opponent`,`colleague`],passage:`The protagonist is, or would be, a worthy companion or valued <u>ally</u>.`,stem:`밑줄 친 <b>ally</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`ally = 동맹 ↔ opponent = 적, 상대방`,analysis:`❌ ③ opponent(상대방): ally의 반의어 → 가장 먼 의미\n✅ ① partner: 파트너 → 유사어\n✅ ② friend: 친구 → 유사어\n✅ ④ colleague: 동료 → 유사어`,tip:`ally(동맹) ↔ opponent/adversary/enemy(적, 상대방)`}},
{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`이끌어 내다`,`(서랍 등을) 꺼내다`,`(그림을) 그리다`,`(줄을) 긋다`],passage:`In order for tragedy or misfortune to <u>draw out</u> an emotional response in viewers.`,stem:`밑줄 친 <b>draw out</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`비극이나 불행이 관객에게 감정적 반응을 <b>이끌어 내다(draw out)</b>`,analysis:`✅ ① 이끌어 내다: draw out an emotional response = 감정적 반응을 이끌어 내다\n❌ ② 꺼내다: draw out a drawer\n❌ ③ 그리다: draw a picture\n❌ ④ 긋다: draw a line`,tip:`draw out 다의어: 이끌어내다 / 꺼내다 / 늘이다 / 끌어내다`}},
{id:15,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`반대편에`,`~에 대하여`,`~와 대조하여`,`~에 반하여`],passage:`What does it mean for a character to be a hero <u>as opposed to</u> a villain?`,stem:`밑줄 친 <b>as opposed to</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`영웅이 악당<b>과 대조하여(as opposed to)</b> → ~와 대비되는`,analysis:`✅ ③ ~와 대조하여: as opposed to = ~와 대비/대조하여\n❌ ① 반대편에: 물리적 위치\n❌ ② ~에 대하여: about\n❌ ④ ~에 반하여: against (다소 다른 뉘앙스)`,tip:`as opposed to = in contrast to = ~와 대조하여, ~와는 반대로`}},
{id:16,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`emotionally`,accept:[`emotionally`,`Emotionally`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be __________ (emotional) invested in a character as either ally or enemy.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`형용사 invested를 수식하는 부사가 필요하다 → emotional → <b>emotionally</b>`,analysis:`emotional(형용사) → emotionally(부사): 형용사/분사 수식\n'emotionally invested' = 감정적으로 몰입한`,tip:`emotional(감정적인, 형용사) → emotionally(감정적으로, 부사) — -ly 접미사`}},
{id:17,type:`어형 변환 (서술형)`,diff:`어려움`,pts:6,fmt:"written",wa:`descriptions`,accept:[`descriptions`,`Descriptions`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment __________ (describe), it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`artistic and entertainment 뒤에 복수 명사가 필요하다 → describe → <b>descriptions</b>`,analysis:`describe(동사) → description(명사) → descriptions(복수명사)\n'artistic descriptions' = 예술적 묘사들`,tip:`describe(묘사하다, 동사) → description(묘사, 명사) → descriptions(복수)`}},
{id:18,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`companion`,`audience`,`protagonist`,`villain`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the __________ is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`묘사가 허구적이든 다큐멘터리이든, <b>주인공(protagonist)</b>이 우리에게 이로운 존재라고 느껴야 한다.`,analysis:`✅ ③ protagonist: 주인공 → 원문 일치\n❌ ① companion: 동반자\n❌ ② audience: 관객\n❌ ④ villain: 악당`,tip:`protagonist = main character = 주인공`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:FULL_PASSAGE,stem:`다음 글에서 전체 흐름과 <b>관계없는</b> 문장은? (원래 모의고사 35번 문제)`,det:{korean:`글의 주제는 '작가가 주인공과 관객 사이의 긍정적 관계를 형성해야 한다'이다. ② "현실에서 친구와 적의 경계가 명확하지 않다"는 내용은 글의 흐름과 <b>무관</b>하다.`,analysis:`❌ ② Likewise, the line between friends and enemies is not clear in reality: 글은 '허구 속 캐릭터'를 다루는데, ②는 '현실'의 이야기 → 무관\n✅ ① 비극이 감정 반응을 이끌어내려면 → 흐름 일치\n✅ ③ 주인공이 우리에게 이로운 존재여야 → 흐름 일치\n✅ ④ 단역의 죽음은 반응을 거의 이끌어내지 못함 → 흐름 일치\n✅ ⑤ 강한 감정을 느끼려면 몰입해야 → 흐름 일치`,tip:`무관 문장 찾기: 글의 주제(허구 속 캐릭터-관객 관계)와 다른 소재(현실)를 다루는 문장`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`all character deaths in films are equally impactful`,`the distinction between fiction and reality is unimportant`,`minor characters should receive more screen time`,`emotional engagement depends on the audience's connection with a character`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.\n\nBased on these sentences, the author suggests that __________.`,stem:`이 두 문장을 근거로, 저자가 시사하는 바로 가장 적절한 것은?`,det:{korean:`단역의 죽음에는 반응이 적지만 강한 감정을 느끼려면 캐릭터에 몰입해야 한다 → <b>감정적 몰입은 관객과 캐릭터의 연결에 달려 있다</b>`,analysis:`✅ ④ emotional engagement depends on the audience's connection with a character: 글의 핵심 시사점\n❌ ① 모든 캐릭터의 죽음이 동등한 영향: 글과 반대\n❌ ② 허구와 현실의 구분 중요하지 않음: 언급 없음\n❌ ③ 단역에 더 많은 시간: 글의 주제 아님`,tip:`emotional investment/engagement = 감정적 몰입 — 핵심 개념`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;const mk5='①②③④⑤',mk4='①②③④';const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={t:0,o:0,w:[]};typeMap[t].t++;if(d.ok)typeMap[t].o++;else typeMap[t].w.push(d.q.id);});
let txt=`📖 온라인워크북 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
