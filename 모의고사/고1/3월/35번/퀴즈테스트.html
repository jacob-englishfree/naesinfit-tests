.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d8d0c8;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #e0d8d0;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FFFCFA;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#FFF5ED;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}

const EI={"subject":"2025 고1 3월 모의고사","pub":"35번","lesson":"무관한 문장","title":"Hero vs Villain","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g1_mar_35"};

const FULL_PASSAGE=`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. ①In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. ②Likewise, the line between friends and enemies is not clear in reality. ③Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. ④Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. ⑤In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`;

const Q=[
{id:1,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`hero`,`audience`,`author`,`viewer`],passage:`What does it mean for a character to be a __________ as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`캐릭터가 악당과 반대되는 <b>영웅(hero)</b>이 된다는 것은 무엇을 의미하는가?`,analysis:`✅ ① hero: 영웅 → villain의 반대\n❌ ② audience: 관객\n❌ ③ author: 작가\n❌ ④ viewer: 시청자`,tip:`hero(영웅) ↔ villain(악당) — as opposed to = ~와 반대되는`}},
{id:2,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`tragedy`,`misfortune`,`audience`,`character`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the __________. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`작가는 주인공과 <b>관객(audience)</b> 사이에 긍정적인 관계를 형성해야 한다.`,analysis:`✅ ③ audience: 관객 → 원문 일치\n❌ ① tragedy: 비극\n❌ ② misfortune: 불행\n❌ ④ character: 등장인물`,tip:`protagonist(주인공)과 audience(관객)의 관계가 핵심`}},
{id:3,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`opposed`,`adjusted`,`invested`,`recognized`],passage:`The character must be <u>modified</u> so as to be recognizable as either friend or enemy.`,stem:`밑줄 친 <b>modified</b>의 의미와 가장 <b>가까운</b> 것은? (원문: adjusted)`,det:{korean:`modified = 수정된, adjusted = 조정된 → 동의어`,analysis:`✅ ② adjusted: 조정된 → modified의 동의어\n❌ ① opposed: 반대된\n❌ ③ invested: 투자된\n❌ ④ recognized: 인식된`,tip:`modify = adjust = alter = 수정하다, 조정하다`}},
{id:4,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`harmful`,`useless`,`worthless`,`valuable`],passage:`The protagonist is, or would be, a <u>worthy</u> companion.`,stem:`밑줄 친 <b>worthy</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`worthy = 가치 있는, valuable = 소중한 → 동의어`,analysis:`✅ ④ valuable: 소중한 → worthy의 동의어\n❌ ① harmful: 해로운\n❌ ② useless: 쓸모없는\n❌ ③ worthless: 가치 없는 (반의어)`,tip:`worthy = valuable = deserving = 가치 있는 ↔ worthless`}},
{id:5,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`comedy`,`sadness`,`disaster`,`loss`],passage:`In order for <u>tragedy</u> or misfortune to draw out an emotional response.`,stem:`밑줄 친 <b>tragedy</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`tragedy = 비극 ↔ comedy = 희극`,analysis:`❌ ① comedy(희극): tragedy의 반의어 → 가장 먼 의미\n✅ ② sadness: 슬픔 → 유사어\n✅ ③ disaster: 재앙 → 유사어\n✅ ④ loss: 상실 → 유사어`,tip:`tragedy(비극) ↔ comedy(희극)`}},
{id:6,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`small`,`secondary`,`major`,`trivial`],passage:`Violent action films are often filled with dozens of incidental deaths of <u>minor</u> characters.`,stem:`밑줄 친 <b>minor</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`minor = 사소한, 중요하지 않은 ↔ major = 주요한, 중요한`,analysis:`❌ ③ major(주요한): minor의 반의어 → 가장 먼 의미\n✅ ① small: 작은 → 유사어\n✅ ② secondary: 이차적인 → 유사어\n✅ ④ trivial: 사소한 → 동의어`,tip:`minor(사소한) ↔ major(주요한)`}},
{id:7,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`essential — positive — protagonist`,`essential — negative — villain`,`optional — positive — protagonist`,`essential — positive — villain`,`optional — negative — protagonist`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's <b>(A)</b> for the author to establish a <b>(B)</b> relationship between a <b>(C)</b> and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`작가가 <b>주인공(protagonist)</b>과 관객 사이에 <b>긍정적인(positive)</b> 관계를 형성하는 것은 <b>필수적(essential)</b>이다.`,analysis:`✅ ① essential — positive — protagonist: 원문 일치\n❌ ② negative/villain: 부적절\n❌ ③ optional: essential의 반의어\n❌ ④ villain: protagonist와 다름\n❌ ⑤ optional/negative: 부적절`,tip:`essential(필수적) ↔ optional(선택적), positive(긍정적) ↔ negative(부정적)`}},
{id:8,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`violent — major — little`,`peaceful — incidental — great`,`violent — incidental — little`,`violent — incidental — great`,`peaceful — major — little`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. <b>(A)</b> action films are often filled with dozens of <b>(B)</b> deaths of minor characters that draw out <b>(C)</b> response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`<b>폭력적인(violent)</b> 액션 영화는 단역 캐릭터들의 <b>부수적인(incidental)</b> 죽음으로 가득하며, 관객에게 <b>거의 없는(little)</b> 반응을 이끌어낸다.`,analysis:`✅ ③ violent — incidental — little: 원문 일치\n❌ ① major: incidental의 반의어\n❌ ② peaceful/great: 부적절\n❌ ④ great: little의 반의어\n❌ ⑤ peaceful/major: 부적절`,tip:`violent(폭력적인) ↔ peaceful(평화로운), incidental(부수적인) ↔ major(주요한)`}},
{id:9,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:4,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`What does it mean for a character to be a ①<u>hero</u> as opposed to a villain? In artistic and entertainment descriptions, it's ②<u>essential</u> for the author to establish a ③<u>positive</u> relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be ④<u>adjusted</u> so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally ⑤<u>detached</u> from a character as either ally or enemy.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`관객은 캐릭터에 감정적으로 <b>몰입해야(invested)</b> 한다. ⑤ detached(분리된)는 invested의 반의어로 부적절.`,analysis:`❌ ⑤ detached(분리된): 원문은 'invested(몰입한)' → 부적절\n✅ ① hero: 영웅 → 적절\n✅ ② essential: 필수적인 → 적절\n✅ ③ positive: 긍정적인 → 적절\n✅ ④ adjusted: 조정된 → 적절`,tip:`invested(몰입한) ↔ detached(분리된, 무관심한)`}},
{id:10,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`hero`,`audience`,`author`,`villain`],passage:`<i>the assembled spectators or listeners at a public event, such as a play, movie, or concert</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`연극, 영화, 콘서트 등 공공 행사에 모인 관중이나 청중 → <b>audience(관객)</b>`,analysis:`✅ ② audience: 관객 → 영영 정의와 일치\n❌ ① hero: 영웅\n❌ ③ author: 작가\n❌ ④ villain: 악당`,tip:`audience = spectators = viewers = 관객, 청중`}},
{id:11,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`portrayal`,`description`,`entertainment`,`misfortune`],passage:`<i>bad luck; an unfortunate condition or event</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`불운; 불행한 상태나 사건 → <b>misfortune(불행)</b>`,analysis:`✅ ④ misfortune: 불행 → 영영 정의와 일치\n❌ ① portrayal: 묘사\n❌ ② description: 묘사\n❌ ③ entertainment: 오락`,tip:`misfortune = bad luck = ill fortune = 불행, 불운`}},
{id:12,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`(감정·돈 등을) 투자한, 몰입한`,`투자된 (금융)`,`(옷을) 입힌`,`(권한을) 부여받은`],passage:`The audience must be emotionally <u>invested</u> in a character as either ally or enemy.`,stem:`밑줄 친 <b>invested</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`관객은 캐릭터에 감정적으로 <b>몰입한(invested)</b> 상태여야 한다.`,analysis:`✅ ① 감정·돈 등을 투자한, 몰입한: emotionally invested = 감정적으로 몰입한\n❌ ② 투자된 (금융): invested money\n❌ ③ 옷을 입힌: 고어적 용법\n❌ ④ 권한을 부여받은: invested with authority`,tip:`invested 다의어: 몰입한/투자한(감정) / 투자된(금융) / 부여받은(권한)`}},
{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`수십 개의 (정확히 12씩)`,`수십 명의 (많은 수)`,`12개들이의`,`여러 종류의`],passage:`Violent action films are often filled with <u>dozens of</u> incidental deaths.`,stem:`밑줄 친 <b>dozens of</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`폭력적인 액션 영화는 <b>수십 명의(dozens of)</b> 부수적 죽음으로 가득하다. dozens of = 많은 수의`,analysis:`✅ ② 수십 명의 (많은 수): dozens of = 수십 개의, 많은\n❌ ① 정확히 12씩: a dozen = 12개\n❌ ③ 12개들이: a dozen eggs\n❌ ④ 여러 종류의: 다른 의미`,tip:`a dozen = 12개 (정확한 수) / dozens of = 수십 개의 (불특정 다수)`}},
{id:14,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`violent`,accept:[`violent`,`Violent`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. __________ (violence) action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`명사 action films를 수식하는 형용사가 필요하다 → violence → <b>violent</b>`,analysis:`violence(명사) → violent(형용사): 명사 앞에서 수식\n'violent action films' = 폭력적인 액션 영화`,tip:`violence(폭력, 명사) → violent(폭력적인, 형용사) — 명사 수식은 형용사`}},
{id:15,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`fictional`,accept:[`fictional`,`Fictional`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is __________ (fiction) or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`be 동사 뒤에 보어 역할을 하는 형용사가 필요하다 → fiction → <b>fictional</b>`,analysis:`fiction(명사) → fictional(형용사): be + 형용사\n'is fictional or documentary' = 허구적이거나 다큐멘터리이다`,tip:`fiction(허구, 명사) → fictional(허구적인, 형용사) — -al 접미사`}},
{id:16,type:`어형 변환 (서술형)`,diff:`어려움`,pts:6,fmt:"written",wa:`recognizable`,accept:[`recognizable`,`Recognizable`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be __________ (recognize) as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`be 동사 뒤에 보어 역할을 하는 형용사가 필요하다 → recognize → <b>recognizable</b>`,analysis:`recognize(동사) → recognizable(형용사): be + 형용사\n'be recognizable as' = ~로 알아볼 수 있는`,tip:`recognize(인식하다) → recognizable(인식 가능한) — -able 접미사`}},
{id:17,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`enemy`,`companion`,`villain`,`audience`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy __________ or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`주인공은 가치 있는 <b>동반자(companion)</b>이자 소중한 동맹이다.`,analysis:`✅ ② companion: 동반자 → 원문 일치\n❌ ① enemy: 적\n❌ ③ villain: 악당\n❌ ④ audience: 관객`,tip:`companion = partner = 동반자, 친구`}},
{id:18,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`viewers`,`readers`,`critics`,`the audience`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in __________. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`단역 캐릭터들의 부수적인 죽음은 <b>관객(the audience)</b>에게 거의 반응을 이끌어내지 못한다.`,analysis:`✅ ④ the audience: 관객 → 원문 일치\n❌ ① viewers: 시청자 (유사하지만 원문은 audience)\n❌ ② readers: 독자\n❌ ③ critics: 비평가`,tip:`audience = 관객 (집합명사, 단수 취급)`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:FULL_PASSAGE,stem:`다음 글에서 전체 흐름과 <b>관계없는</b> 문장은? (원래 모의고사 35번 문제)`,det:{korean:`글의 주제는 '작가가 주인공과 관객 사이의 긍정적 관계를 형성해야 한다'이다. ② "현실에서 친구와 적의 경계가 명확하지 않다"는 내용은 글의 흐름과 <b>무관</b>하다.`,analysis:`❌ ② Likewise, the line between friends and enemies is not clear in reality: 글은 '허구 속 캐릭터'를 다루는데, ②는 '현실'의 이야기 → 무관\n✅ ① 비극이 감정 반응을 이끌어내려면 → 흐름 일치\n✅ ③ 주인공이 우리에게 이로운 존재여야 → 흐름 일치\n✅ ④ 단역의 죽음은 반응을 거의 이끌어내지 못함 → 흐름 일치\n✅ ⑤ 강한 감정을 느끼려면 몰입해야 → 흐름 일치`,tip:`무관 문장 찾기: 'in reality'라는 표현이 허구 중심 글에서 벗어남`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`creating emotional bonds between characters and audiences`,`making all characters equally important in a story`,`focusing on realistic portrayals rather than fictional ones`,`increasing the number of violent scenes in films`],passage:`What does it mean for a character to be a hero as opposed to a villain? In artistic and entertainment descriptions, it's essential for the author to establish a positive relationship between a protagonist and the audience. In order for tragedy or misfortune to draw out an emotional response in viewers, the character must be adjusted so as to be recognizable as either friend or enemy. Likewise, the line between friends and enemies is not clear in reality. Whether the portrayal is fictional or documentary, we must feel that the protagonist is someone whose actions benefit us: the protagonist is, or would be, a worthy companion or valued ally. Violent action films are often filled with dozens of incidental deaths of minor characters that draw out little response in the audience. In order to feel strong emotions, the audience must be emotionally invested in a character as either ally or enemy.\n\nThe passage discusses the importance of __________ in artistic and entertainment works.`,stem:`이 글이 논의하는 핵심 주제로 가장 적절한 것은?`,det:{korean:`이 글은 예술·오락 작품에서 <b>캐릭터와 관객 사이의 감정적 유대를 형성하는 것(creating emotional bonds)</b>의 중요성을 논의한다.`,analysis:`✅ ① creating emotional bonds between characters and audiences: 글의 핵심 주제\n❌ ② 모든 캐릭터를 동등하게: 글과 반대 (주인공 중심)\n❌ ③ 현실적 묘사 집중: 글의 주제 아님\n❌ ④ 폭력 장면 증가: 글의 주제 아님`,tip:`핵심 키워드: positive relationship, emotional response, emotionally invested`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;const mk5='①②③④⑤',mk4='①②③④';const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={t:0,o:0,w:[]};typeMap[t].t++;if(d.ok)typeMap[t].o++;else typeMap[t].w.push(d.q.id);});
let txt=`🧩 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
