<!DOCTYPE html>

<head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--g:#E8772E;--gd:#B85A1A;--gl:#FFF3E8;--gxl:#FFF3E8;--gxxl:#FFFAF5;--bg:#F6F2EE;--text:#1A1A2E;--tm:#7A6A5A;--tl:#A89888;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--o:#F5A623;--ol:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,#FFFAF5,#FFF3E8 40%,#FFE8D5);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--g),#D4691A);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--g),#D4691A);padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f5efe8;}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid #e0d8cf;border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid #d8d0c5;border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px rgba(232,119,46,.1);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;box-shadow:0 6px 20px rgba(232,119,46,.3);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid #d0c8be;color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--g);color:var(--g);}
.history-badge{background:var(--gxl);color:var(--g);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid #e0d8cf;border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--g);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--g);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--g);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--o);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{max-width:820px;margin:0 auto;padding:24px 20px 100px;}
.q-card{background:var(--card);border-radius:var(--radius);margin-bottom:22px;box-shadow:var(--shadow);overflow:hidden;}
.q-header{display:flex;align-items:center;gap:10px;padding:16px 22px;background:linear-gradient(135deg,#FFFAF5,#FFF3E8);border-bottom:1px solid #e8ddd0;flex-wrap:wrap;}
.q-num{width:36px;height:36px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--gl);color:#B85A1A;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f5efe8;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--g);font-weight:800;}
.q-body{padding:22px;}
.q-passage{background:linear-gradient(135deg,#FFFCFA,#FFF8F0);border-left:4px solid var(--g);padding:16px 18px;margin-bottom:18px;border-radius:0 var(--rs) var(--rs) 0;font-size:13.5px;line-height:1.95;}
.q-stem{font-size:14px;font-weight:700;margin-bottom:16px;}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice-btn{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:2px solid #e0d8cf;border-radius:var(--rs);cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:14px;line-height:1.6;}
.choice-btn:hover{border-color:var(--g);}.choice-btn.selected{border-color:var(--g);box-shadow:0 0 0 3px rgba(232,119,46,.12);background:var(--gxxl);}
.c-num{min-width:26px;height:26px;background:#f0e8df;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}
.written-input{width:100%;padding:14px 16px;border:2px solid #d8d0c5;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);padding:10px 16px;display:flex;align-items:center;gap:5px;justify-content:center;z-index:100;overflow-x:auto;flex-wrap:wrap;}
.nav-dot{width:28px;height:28px;border-radius:50%;background:#e0d8cf;cursor:pointer;border:none;font-size:10px;font-weight:800;color:var(--tm);display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;}.nav-dot.answered{background:var(--g);color:#fff;}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,#FFF3E8,#FFE8D5);}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--g),#D4691A);color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#f0e8df;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),#F5A623);transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FFFCFA;border-radius:var(--rs);border:1px solid #e0d8cf;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#f0e8df;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d8d0c5;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #e0d8cf;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FFFCFA;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#FFF5EE;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">🧩 온라인퀴즈 TEST</div>

  <div class="info-card"><div class="info-card-header">📚 시험 정보</div><div class="info-rows">

  </div></div>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"24번","lesson":"글의 제목","title":"Reading Aloud","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g1_mar_24"};

const FULL_PASSAGE=`Modern brain-scanning techniques such as fMRI (functional Magnetic Resonance Imaging) have revealed that reading aloud lights up many areas of the brain. There is intense activity in areas associated with pronunciation and hearing the sound of the spoken response, which strengthens the connective structures of your brain cells for more brainpower. This leads to an overall improvement in concentration. Reading aloud is also a good way to develop your public speaking skills because it forces you to read each and every word — something people don't often do when reading quickly, or reading in silence. Children, in particular, should be encouraged to read aloud because the brain is wired for learning through connections that are created by positive stimulation, such as singing, touching, and reading aloud.`;

const Q=[
{id:1,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`methods`,`techniques`,`tools`,`devices`],passage:`Modern brain-scanning __________ such as fMRI (functional Magnetic Resonance Imaging) have revealed that reading aloud lights up many areas of the brain. There is intense activity in areas associated with pronunciation and hearing the sound of the spoken response, which strengthens the connective structures of your brain cells for more brainpower. This leads to an overall improvement in concentration. Reading aloud is also a good way to develop your public speaking skills because it forces you to read each and every word \u2014 something people don't often do when reading quickly, or reading in silence. Children, in particular, should be encouraged to read aloud because the brain is wired for learning through connections that are created by positive stimulation, such as singing, touching, and reading aloud.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`fMRI와 같은 현대 뇌 스캔 <b>기법(techniques)</b>이 밝혀냈다.`,analysis:`✅ ② techniques: 기법 → 원문 일치\n❌ ① methods: 방법 (유사하나 원문은 techniques)\n❌ ③ tools: 도구\n❌ ④ devices: 장치`,tip:`technique = 기법, 기술 (전문적 방법론을 가리킴)`}},
{id:2,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`associated`,`compared`,`replaced`,`confused`],passage:`Modern brain-scanning techniques such as fMRI (functional Magnetic Resonance Imaging) have revealed that reading aloud lights up many areas of the brain. There is intense activity in areas __________ with pronunciation and hearing the sound of the spoken response, which strengthens the connective structures of your brain cells for more brainpower. This leads to an overall improvement in concentration. Reading aloud is also a good way to develop your public speaking skills because it forces you to read each and every word \u2014 something people don't often do when reading quickly, or reading in silence. Children, in particular, should be encouraged to read aloud because the brain is wired for learning through connections that are created by positive stimulation, such as singing, touching, and reading aloud.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`발음과 청취에 <b>관련된(associated)</b> 영역에서 강렬한 활동이 있다.`,analysis:`✅ ① associated: 관련된 → 원문 일치\n❌ ② compared: 비교된\n❌ ③ replaced: 대체된\n❌ ④ confused: 혼동된`,tip:`be associated with = ~와 관련되다`}},
{id:3,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`processes`,`styles`,`methods`,`results`],passage:`Modern brain-scanning <u>techniques</u> such as fMRI have revealed important findings.`,stem:`밑줄 친 <b>techniques</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`techniques = 기법, methods = 방법 → 동의어`,analysis:`✅ ③ methods: 방법 → techniques의 동의어\n❌ ① processes: 과정\n❌ ② styles: 스타일\n❌ ④ results: 결과`,tip:`technique = method = approach = way = 방법, 기법`}},
{id:4,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`total`,`comprehensive`,`partial`,`minor`],passage:`This leads to an <u>overall</u> improvement in concentration.`,stem:`밑줄 친 <b>overall</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`overall = 전반적인, comprehensive = 포괄적인 → 동의어`,analysis:`✅ ② comprehensive: 포괄적인 → overall의 동의어\n❌ ① total: 총, 전체의 (양적 의미)\n❌ ③ partial: 부분적인\n❌ ④ minor: 사소한`,tip:`overall = comprehensive = general = 전반적인, 포괄적인`}},
{id:5,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`weakens`,`supports`,`builds`,`boosts`],passage:`This <u>strengthens</u> the connective structures of your brain cells.`,stem:`밑줄 친 <b>strengthens</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`strengthens = 강화하다 ↔ weakens = 약화시키다`,analysis:`❌ ① weakens(약화시키다): strengthens의 반의어 → 가장 먼 의미\n✅ ② supports: 지지하다 → 유사어\n✅ ③ builds: 구축하다 → 유사어\n✅ ④ boosts: 향상시키다 → 유사어`,tip:`strengthen = boost = reinforce ↔ weaken = undermine = 약화시키다`}},
{id:6,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`urged`,`supported`,`promoted`,`discouraged`],passage:`Children should be <u>encouraged</u> to read aloud.`,stem:`밑줄 친 <b>encouraged</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`encouraged = 격려받다 ↔ discouraged = 낙담시키다`,analysis:`❌ ④ discouraged(낙담시키다): encouraged의 반의어 → 가장 먼 의미\n✅ ① urged: 촉구하다 → 유사어\n✅ ② supported: 지지하다 → 유사어\n✅ ③ promoted: 촉진하다 → 유사어`,tip:`encourage ↔ discourage — 접두사 dis-가 반의어를 만듦`}},
{id:7,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`revealed — pronunciation — negative`,`revealed — pronunciation — positive`,`concealed — grammar — positive`,`revealed — grammar — negative`,`concealed — pronunciation — positive`],passage:`Modern brain-scanning techniques such as fMRI (functional Magnetic Resonance Imaging) have <b>(A)</b> that reading aloud lights up many areas of the brain. There is intense activity in areas associated with <b>(B)</b> and hearing the sound of the spoken response, which strengthens the connective structures of your brain cells for more brainpower. This leads to an overall improvement in concentration. Reading aloud is also a good way to develop your public speaking skills because it forces you to read each and every word \u2014 something people don't often do when reading quickly, or reading in silence. Children, in particular, should be encouraged to read aloud because the brain is wired for learning through connections that are created by <b>(C)</b> stimulation, such as singing, touching, and reading aloud.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`뇌 스캔 기법이 <b>밝혀냈다(revealed)</b>. <b>발음(pronunciation)</b>과 관련된 영역. <b>긍정적(positive)</b> 자극.`,analysis:`✅ ② revealed — pronunciation — positive: 원문 일치\n❌ ① negative: positive의 반의어\n❌ ③ concealed/grammar: 둘 다 부적절\n❌ ④ grammar/negative: 둘 다 부적절\n❌ ⑤ concealed: revealed의 반의어`,tip:`reveal(밝히다)↔conceal(숨기다), pronunciation(발음), positive(긍정적)↔negative(부정적)`}},
{id:8,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Reading aloud ①<u>lights up</u> many areas of the brain. There is intense activity in areas associated with ②<u>pronunciation</u>. This ③<u>diminishes</u> the connective structures of your brain cells. This leads to an overall ④<u>improvement</u> in ⑤<u>concentration</u>.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`연결 구조를 <b>강화한다(strengthens)</b>. ③ diminishes(줄인다)는 strengthens의 반의어로 부적절.`,analysis:`❌ ③ diminishes(줄인다): 원문은 'strengthens(강화하다)' → 부적절\n✅ ① lights up: 활성화하다 → 적절\n✅ ② pronunciation: 발음 → 적절\n✅ ④ improvement: 향상 → 적절\n✅ ⑤ concentration: 집중력 → 적절`,tip:`strengthen(강화하다) ↔ diminish(줄이다, 약화시키다)`}},
{id:9,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`concentration`,`stimulation`,`pronunciation`,`improvement`],passage:`<i>the ability to focus all your attention on something</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`무언가에 모든 주의를 집중하는 능력 → <b>concentration(집중력)</b>`,analysis:`✅ ① concentration: 집중력 → 영영 정의와 일치\n❌ ② stimulation: 자극\n❌ ③ pronunciation: 발음\n❌ ④ improvement: 향상`,tip:`concentration = focus = attention = 집중력`}},
{id:10,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`brainpower`,`technique`,`response`,`structure`],passage:`<i>a reply or reaction to something that has been said or done</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`말해지거나 행해진 것에 대한 답변 또는 반응 → <b>response(반응)</b>`,analysis:`✅ ③ response: 반응, 응답 → 영영 정의와 일치\n❌ ① brainpower: 두뇌 능력\n❌ ② technique: 기법\n❌ ④ structure: 구조`,tip:`response = reply = reaction = answer = 반응, 응답`}},
{id:11,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`구조물, 건축물`,`체계, 제도`,`(세포 등의) 구조`,`조직, 기관`],passage:`This strengthens the connective <u>structures</u> of your brain cells for more brainpower.`,stem:`밑줄 친 <b>structures</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`뇌세포의 연결 <b>구조(structures)</b>를 강화한다 → 세포 수준의 구조를 의미.`,analysis:`✅ ③ (세포 등의) 구조: 뇌세포의 연결 구조 맥락\n❌ ① 구조물, 건축물: 물리적 건축물\n❌ ② 체계, 제도: 사회적 구조\n❌ ④ 조직, 기관: 단체 의미`,tip:`structure 다의어: 구조(과학) / 건축물 / 체계 / 조직`}},
{id:12,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`improvement`,accept:[`improvement`,`Improvement`],passage:`Modern brain-scanning techniques such as fMRI (functional Magnetic Resonance Imaging) have revealed that reading aloud lights up many areas of the brain. There is intense activity in areas associated with pronunciation and hearing the sound of the spoken response, which strengthens the connective structures of your brain cells for more brainpower. This leads to an overall __________ (improve) in concentration. Reading aloud is also a good way to develop your public speaking skills because it forces you to read each and every word \u2014 something people don't often do when reading quickly, or reading in silence. Children, in particular, should be encouraged to read aloud because the brain is wired for learning through connections that are created by positive stimulation, such as singing, touching, and reading aloud.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`집중력의 전반적인 <b>향상(improvement)</b>으로 이어진다. → 명사 형태`,analysis:`improve(동사) → improvement(명사)\n'an overall improvement' = 전반적인 향상 (관사 an + 형용사 + 명사)`,tip:`improve(동사: 향상시키다) → improvement(명사: 향상)`}},
{id:13,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`created`,accept:[`created`,`Created`],passage:`Modern brain-scanning techniques such as fMRI (functional Magnetic Resonance Imaging) have revealed that reading aloud lights up many areas of the brain. There is intense activity in areas associated with pronunciation and hearing the sound of the spoken response, which strengthens the connective structures of your brain cells for more brainpower. This leads to an overall improvement in concentration. Reading aloud is also a good way to develop your public speaking skills because it forces you to read each and every word \u2014 something people don't often do when reading quickly, or reading in silence. Children, in particular, should be encouraged to read aloud because the brain is wired for learning through connections that are __________ (create) by positive stimulation, such as singing, touching, and reading aloud.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`긍정적 자극에 의해 <b>만들어진(created)</b> 연결 → 수동태`,analysis:`create → created: 'are created' 수동태\n'connections that are created by' = ~에 의해 만들어진 연결`,tip:`be + p.p. + by: 수동태 구문 (create → created)`}},
{id:14,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`whispering`,`writing`,`thinking`,`reading aloud`],passage:`Modern brain-scanning techniques such as fMRI (functional Magnetic Resonance Imaging) have revealed that reading aloud lights up many areas of the brain. There is intense activity in areas associated with pronunciation and hearing the sound of the spoken response, which strengthens the connective structures of your brain cells for more brainpower. This leads to an overall improvement in concentration. Reading aloud is also a good way to develop your public speaking skills because it forces you to read each and every word \u2014 something people don't often do when reading quickly, or reading in silence. Children, in particular, should be encouraged to __________ because the brain is wired for learning through connections that are created by positive stimulation, such as singing, touching, and reading aloud.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`뇌가 긍정적 자극을 통한 학습에 맞게 설계되어 있으므로, 아이들은 <b>소리 내어 읽기(reading aloud)</b>를 권장받아야 한다.`,analysis:`✅ ④ reading aloud: 소리 내어 읽기 → 원문 일치\n❌ ① whispering: 속삭이기\n❌ ② writing: 쓰기\n❌ ③ thinking: 생각하기`,tip:`글의 핵심 주제인 reading aloud가 정답`}},
{id:15,type:`문맥상 부적절한 어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Modern brain-scanning techniques have ①<u>revealed</u> that reading aloud lights up many areas. This leads to an overall ②<u>improvement</u> in concentration. Reading aloud ③<u>forces</u> you to read each and every word. Children should be encouraged to read aloud because the brain is ④<u>disconnected</u> for learning through ⑤<u>connections</u>.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`뇌가 학습을 위해 <b>연결되어 있다(wired)</b>. ④ disconnected(연결이 끊긴)는 wired의 반의어로 부적절.`,analysis:`❌ ④ disconnected(연결이 끊긴): 원문은 'wired(연결된, 설계된)' → 부적절\n✅ ① revealed: 밝혀냈다 → 적절\n✅ ② improvement: 향상 → 적절\n✅ ③ forces: 강제하다 → 적절\n✅ ⑤ connections: 연결 → 적절`,tip:`wired(연결된, 설계된) ↔ disconnected(연결이 끊긴) — 핵심 반의어`}},
{id:16,type:`(A)(B)(C) 조합형`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`lights up — connective — encouraged`,`shuts down — connective — encouraged`,`lights up — destructive — discouraged`,`lights up — connective — discouraged`,`shuts down — destructive — encouraged`],passage:`Modern brain-scanning techniques such as fMRI (functional Magnetic Resonance Imaging) have revealed that reading aloud <b>(A)</b> many areas of the brain. There is intense activity in areas associated with pronunciation and hearing the sound of the spoken response, which strengthens the <b>(B)</b> structures of your brain cells for more brainpower. This leads to an overall improvement in concentration. Reading aloud is also a good way to develop your public speaking skills because it forces you to read each and every word \u2014 something people don't often do when reading quickly, or reading in silence. Children, in particular, should be <b>(C)</b> to read aloud because the brain is wired for learning through connections that are created by positive stimulation, such as singing, touching, and reading aloud.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`소리 내어 읽기가 뇌의 많은 영역을 <b>활성화시킨다(lights up)</b>. <b>연결(connective)</b> 구조를 강화. 아이들은 <b>격려받아야(encouraged)</b> 한다.`,analysis:`✅ ① lights up — connective — encouraged: 원문 일치\n❌ ② shuts down: lights up의 반의어\n❌ ③ destructive/discouraged: 둘 다 반의어\n❌ ④ discouraged: encouraged의 반의어\n❌ ⑤ shuts down/destructive: 둘 다 반의어`,tip:`light up(활성화)↔shut down(폐쇄), connective(연결의)↔destructive(파괴적), encourage(격려)↔discourage(단념)`}},
{id:17,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`특히, 특별히`,`특히, 그중에서도`,`상세히`,`부분적으로`],passage:`Children, <u>in particular</u>, should be encouraged to read aloud.`,stem:`밑줄 친 <b>in particular</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`아이들은 <b>특히(in particular)</b> 소리 내어 읽기를 격려받아야 한다.`,analysis:`✅ ② 특히, 그중에서도: in particular = especially\n❌ ① 특히, 특별히: 의미는 유사하나 ②가 더 정확\n❌ ③ 상세히: in detail의 의미\n❌ ④ 부분적으로: partially의 의미`,tip:`in particular = especially = particularly = 특히, 그중에서도`}},
{id:18,type:`어형 변환 (서술형)`,diff:`어려움`,pts:6,fmt:"written",wa:`reading`,accept:[`reading`,`Reading`],passage:`Modern brain-scanning techniques such as fMRI (functional Magnetic Resonance Imaging) have revealed that reading aloud lights up many areas of the brain. There is intense activity in areas associated with pronunciation and hearing the sound of the spoken response, which strengthens the connective structures of your brain cells for more brainpower. This leads to an overall improvement in concentration. __________ (read) aloud is also a good way to develop your public speaking skills because it forces you to read each and every word \u2014 something people don't often do when reading quickly, or reading in silence. Children, in particular, should be encouraged to read aloud because the brain is wired for learning through connections that are created by positive stimulation, such as singing, touching, and reading aloud.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`<b>소리 내어 읽기(Reading aloud)</b>는 말하기 능력을 발전시키는 좋은 방법이다. → 동명사 주어`,analysis:`read → reading: 동명사 주어\n'Reading aloud is a good way' = 소리 내어 읽기는 좋은 방법이다`,tip:`동명사 주어: V-ing + 동사 (Reading aloud is... / Swimming is...)`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`Reading Aloud: Improving Brainpower and Speaking Skills`,`Reading Practices: Shortcuts to Academic Achievements`,`Improve Your Writing Skills Through Reading Aloud`,`How Your Brain Changes When You Read in Silence`,`Techniques for Faster and More Effective Reading`],passage:FULL_PASSAGE,stem:`다음 글의 제목으로 가장 적절한 것은? (원래 모의고사 24번 문제)`,det:{korean:`소리 내어 읽기가 <b>두뇌 능력(brainpower)</b>과 <b>말하기 능력(speaking skills)</b>을 향상시킨다.`,analysis:`✅ ① Reading Aloud: Improving Brainpower and Speaking Skills: 글의 핵심 주제\n❌ ② Academic Achievements: 언급 없음\n❌ ③ Writing Skills: 쓰기가 아닌 말하기\n❌ ④ Read in Silence: 반대 내용\n❌ ⑤ Faster Reading: 빠른 읽기가 아닌 소리 내어 읽기`,tip:`제목 = 핵심 키워드 조합: reading aloud + brainpower + speaking skills`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`only benefits adults in professional settings`,`is harmful to children's brain development`,`helps build neural connections through positive stimulation`,`should be avoided when studying for exams`],passage:FULL_PASSAGE,stem:`본문에 따르면, 소리 내어 읽기는 어떤 효과가 있는가?`,det:{korean:`본문에 따르면 소리 내어 읽기는 <b>긍정적 자극을 통해 신경 연결을 구축하는 데 도움</b>이 된다.`,analysis:`✅ ③ helps build neural connections through positive stimulation: 본문 핵심 내용\n❌ ① only benefits adults: 아이들에게도 이로움\n❌ ② harmful to children: 반대 내용\n❌ ④ should be avoided: 반대 내용`,tip:`positive stimulation → connections → learning: 본문의 인과관계 흐름`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;const mk5='①②③④⑤',mk4='①②③④';const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={t:0,o:0,w:[]};typeMap[t].t++;if(d.ok)typeMap[t].o++;else typeMap[t].w.push(d.q.id);});
let txt=`🧩 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
