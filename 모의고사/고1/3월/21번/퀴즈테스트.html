{id:1,type:"문장삽입",diff:"어려움",pts:6,fmt:"mc",ans:2,ch:["①","②","③","④"],passage:"Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. <b>①</b> Yet once it becomes possible to transform an embryo’s mutated genes into “normal” ones, there will certainly be temptations to upgrade normal genes to superior versions. <b>②</b> Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? <b>③</b> The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up. <b>④</b>",stem:"다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class=\"q-given-sentence\">What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color?</div>",det:{"korean":"심장병이나 암 위험을 낮추는 질문(②) 뒤에, 유익한 특성(힘, 정신 능력)과 신체 특성(눈, 머리카락 색) 변경 질문이 이어지는 것이 자연스럽다.","analysis":"✅③: 질병 위험 → 유익한 특성/신체 특성 (확대되는 논리)<br>❌①: 아직 교정 단계<br>❌②: 업그레이드 유혹 직후<br>❌④: 결론 뒤","tip":"질문의 범위가 확대: 질병 교정 → 유익한 특성 → 완벽 추구"}},
{id:2,type:"문장삽입",diff:"어려움",pts:6,fmt:"mc",ans:1,ch:["①","②","③","④"],passage:"Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. <b>①</b> Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? <b>②</b> The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up. <b>③</b> <b>④</b>",stem:"다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class=\"q-given-sentence\">Yet once it becomes possible to transform an embryo’s mutated genes into “normal” ones, there will certainly be temptations to upgrade normal genes to superior versions.</div>",det:{"korean":"질병 교정이 바람직해 보인다는 내용(①) 뒤에, 'Yet(그러나)'으로 시작하는 업그레이드 유혹 문장이 이어지는 것이 자연스럽다.","analysis":"✅②: 교정 가능성 → Yet 업그레이드 유혹<br>❌①: 아직 교정 단계 설명 전<br>❌③: 이미 결론부<br>❌④: 글 끝","tip":"Yet = 역접 연결사 → 교정 가능성 직후에 위치"}},
{id:3,type:"어순배열",diff:"어려움",pts:6,fmt:"written",ans:undefined,ch:null,wa:"to upgrade normal genes to superior versions",accept:["to upgrade normal genes to superior versions"],passage:"Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo’s mutated genes into “normal” ones, there will certainly be temptations __________. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.",stem:"주어진 단어를 올바른 순서로 배열하시오.<div class=\"q-given-sentence\">versions / genes / to / superior / upgrade / normal / to</div>",det:{"korean":"temptations + to upgrade normal genes to superior versions","analysis":"to(부정사) + upgrade(동사) + normal genes(목적어) + to superior versions(전치사구)","tip":"temptation to V = ~하려는 유혹"}},
{id:4,type:"어순배열",diff:"보통",pts:5,fmt:"written",ans:undefined,ch:null,wa:"at the earliest possible stage of life",accept:["at the earliest possible stage of life"],passage:"Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations __________, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo’s mutated genes into “normal” ones, there will certainly be temptations to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.",stem:"주어진 단어를 올바른 순서로 배열하시오.<div class=\"q-given-sentence\">life / stage / at / earliest / possible / the / of</div>",det:{"korean":"at the earliest possible stage of life = 삶의 가능한 가장 이른 단계에서","analysis":"at(전치사) + the earliest possible(최상급+형용사) + stage(명사) + of life(전치사구)","tip":"at the earliest possible stage = 가능한 가장 이른 단계에서"}},
{id:5,type:"어법",diff:"쉬움",pts:4,fmt:"mc",ans:1,ch:["prove","proves","proving","to prove","proved"],passage:"Assuming gene editing in humans __________ to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo’s mutated genes into “normal” ones, there will certainly be temptations to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.",stem:"다음 빈칸에 들어갈 말로 가장 적절한 것은?",det:{"korean":"gene editing이 안전하고 효과적임이 <b>증명되면(proves)</b>. 3인칭 단수 현재시제.","analysis":"✅ ② proves: 3인칭 단수 현재<br>❌ ① prove: 복수형<br>❌ ③ proving: 분사<br>❌ ④ to prove: 부정사<br>❌ ⑤ proved: 과거시제","tip":"주어 gene editing(단수) + 현재시제 = proves"}},
{id:6,type:"어법",diff:"보통",pts:5,fmt:"mc",ans:2,ch:["correct","correcting","to correct","corrected","being corrected"],passage:"Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, __________ disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo’s mutated genes into “normal” ones, there will certainly be temptations to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.",stem:"다음 빈칸에 들어갈 말로 가장 적절한 것은?",det:{"korean":"돌연변이를 <b>교정하는 것(to correct)</b>이 바람직해 보인다. it seems logical to V 구조.","analysis":"✅ ③ to correct: it seems logical to V 구조<br>❌ ① correct: 원형<br>❌ ② correcting: 동명사<br>❌ ④ corrected: 과거분사<br>❌ ⑤ being corrected: 수동진행","tip":"it seems + adj + to V (가주어-진주어 구문)"}},
{id:7,type:"어법",diff:"보통",pts:5,fmt:"mc",ans:3,ch:["①","②","③","④","⑤"],passage:"Assuming gene editing in humans proves to be safe and effective, ①<u>it might seem</u> logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once ②<u>it becomes possible</u> to transform an embryo’s mutated genes into “normal” ones, there will certainly be temptations to upgrade normal genes to superior versions. ③<u>Should we begin</u> editing genes in unborn children to lower their lifetime risk of heart disease or cancer? ④<u>What about give</u> unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, ⑤<u>we may not like</u> where we end up.",stem:"밑줄 친 ①~⑤ 중 어법상 틀린 것은?",det:{"korean":"④ What about + 동명사(giving)가 올바른 구조. give(원형)는 부적절.","analysis":"❌ ④ give → giving: What about + ~ing 구문<br>✅ ① it might seem: 가주어 구문<br>✅ ② it becomes possible: 주격 it<br>✅ ③ Should we begin: 의문문<br>✅ ⑤ we may not like: 조동사 may","tip":"What about + ~ing (제안/의문 표현)"}},
{id:8,type:"부적절어휘",diff:"쉬움",pts:4,fmt:"mc",ans:3,ch:["① mutations","② temptations","③ beneficial","④ unnatural","⑤ end up"],passage:"Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing ①<u>mutations</u> at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo’s mutated genes into “normal” ones, there will certainly be ②<u>temptations</u> to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children ③<u>beneficial</u> features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost ④<u>unnatural</u> to human nature, but if we start down this slippery slope, we may not like where we ⑤<u>end up</u>.",stem:"밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?",det:{"korean":"④ unnatural → natural: 완벽 추구가 인간 본성에 자연스러운 것.","analysis":"❌ ④ unnatural → natural<br>✅ ①②③⑤: 원문 일치","tip":"natural ↔ unnatural"}},
{id:9,type:"부적절어휘",diff:"보통",pts:5,fmt:"mc",ans:1,ch:["① harmful","② downgrade","③ strength","④ characteristics","⑤ slippery slope"],passage:"Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before ①<u>harmful</u> genes begin causing serious problems. Yet once it becomes possible to transform an embryo’s mutated genes into “normal” ones, there will certainly be temptations to ②<u>downgrade</u> normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater ③<u>strength</u> and increased mental abilities, or changing physical ④<u>characteristics</u>, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this ⑤<u>slippery slope</u>, we may not like where we end up.",stem:"밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?",det:{"korean":"② downgrade → upgrade: 우수한 버전으로 업그레이드.","analysis":"❌ ② downgrade → upgrade: 'to superior versions'<br>✅ ①③④⑤: 원문 일치","tip":"upgrade ↔ downgrade"}},
{id:10,type:"빈칸추론",diff:"보통",pts:5,fmt:"mc",ans:1,ch:["rejecting genetic modification entirely","correcting disease-causing mutations at the earliest stage","promoting natural selection over technology","ignoring the ethical implications of genetics","forbidding all forms of genetic research"],passage:"Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo’s mutated genes into “normal” ones, there will certainly be temptations to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.",stem:"다음 글의 내용에 따르면, 유전자 편집이 안전하고 효과적이라면 가장 논리적으로 보이는 것은?",det:{"korean":"유전자 편집이 안전하고 효과적이라면 가장 이른 단계에서 돌연변이를 교정하는 것이 논리적.","analysis":"✅ ② 원문: 'to correct disease-causing mutations at the earliest possible stage'<br>❌ ① 거부: 반대<br>❌ ③ 자연선택: 언급 없음<br>❌ ④ 윤리적 문제 무시: 반대<br>❌ ⑤ 연구 금지: 반대","tip":"logical to correct mutations at the earliest stage"}},
{id:11,type:"빈칸추론",diff:"어려움",pts:6,fmt:"mc",ans:2,ch:["a guaranteed path to human improvement","a minor ethical concern that can be easily resolved","a dangerous progression from correction to enhancement","a natural and harmless tendency in human evolution","a problem only for future generations to address"],passage:"Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo’s mutated genes into “normal” ones, there will certainly be temptations to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.",stem:"글쓴이가 'slippery slope'이라는 표현을 통해 경고하는 것은?",det:{"korean":"교정에서 개선으로의 위험한 진행 — 통제 불능의 비유.","analysis":"✅ ③ 교정 → 개선으로의 위험한 진행<br>❌ ① 보장된 개선 경로: 경고와 반대<br>❌ ② 쉽게 해결 가능: 경고 어조와 불일치<br>❌ ④ 무해한 경향: 경고와 반대<br>❌ ⑤ 미래 세대 문제: 현재 우려","tip":"slippery slope = 한 번 시작하면 통제 불능"}},
{id:12,type:"빈칸추론",diff:"보통",pts:5,fmt:"mc",ans:0,ch:["완벽 추구가 통제를 벗어날 수 있는 위험에 대한 경고","유전자 편집 기술의 발전 속도에 대한 칭찬","유전자 편집의 의학적 혜택에 대한 낙관","유전자 편집 연구에 대한 투자 촉구","유전자 편집의 법적 규제에 대한 설명"],passage:"Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo’s mutated genes into “normal” ones, there will certainly be temptations to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.",stem:"다음 글의 주된 논지로 가장 적절한 것은?",det:{"korean":"유전자 편집이 가능해지면 완벽 추구로 이어질 수 있다는 경고.","analysis":"✅ ① 완벽 추구의 위험 경고: 글의 핵심 논지<br>❌ ② 발전 칭찬: 경고 어조<br>❌ ③ 의학적 낙관: 부분적<br>❌ ④ 투자 촉구: 언급 없음<br>❌ ⑤ 법적 규제: 언급 없음","tip":"slippery slope = 통제 불능 경고"}},

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name,answers:S.ans.slice()});if(h.length>20)h.length=20;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map((x,idx)=>`<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade} · ${x.level||''}</div></div><div class="hi-right"><div class="hi-score" style="color:${x.score>=80?'var(--o)':'var(--r)'}">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div></div>${x.answers?`<button onclick="reviewHistory(${idx})" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid #E0D8CF;border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--o)">📝 정답·해설 다시 보기</button>`:''}</div>`).join('');p.style.display='block';}
function getLevel(s){if(s>=95)return{name:'마스터',icon:'👑',range:'95~100',msg:'이 단원은 정복했어요!'};if(s>=85)return{name:'챌린저',icon:'🌟',range:'85~94',msg:'거의 완벽, 한 끗 차이!'};if(s>=75)return{name:'파이터',icon:'💎',range:'75~84',msg:'통과! 약점만 잡으면 마스터'};if(s>=50)return{name:'루키',icon:'🔥',range:'50~74',msg:'기본기 OK, 유형별 훈련 필요'};return{name:'스타터',icon:'📖',range:'0~49',msg:'지문 해석부터 다시!'};}
function getTypeAdvice(t){const m={'(A)(B)(C) 조합형':'반의어 함정 주의, 원문 단어 정확히 암기','문맥상 부적절한 어휘':'밑줄 단어가 반의어로 바뀌었는지 확인','동의어 고르기':'동의어 쌍을 세트로 묶어 암기','반의어 고르기':'반의어 쌍을 세트로 묶어 암기','빈칸 어휘 완성':'문맥 단서(clue) 찾기 연습 필요','다의어 문맥적 의미':'다의어의 여러 뜻을 문맥별로 구분','영영풀이 매칭':'영영사전 정의 읽기 연습','어형 변환 (서술형)':'품사 변환 규칙(명↔형, 동↔명) 정리','빈칸 문맥 완성':'글의 흐름과 논리적 연결 파악','어법':'핵심 어법 규칙 정리 및 반복 연습','내용일치':'지문과 선지를 꼼꼼히 대조','내용불일치':'함정 선지의 미세한 차이 찾기','T/F':'원문과 진술을 정확히 대조','서술형':'정확한 철자와 어형 변환 주의','빈칸추론':'빈칸 전후 문맥 단서 찾기','빈칸 추론':'빈칸 전후 문맥 단서 찾기','문장삽입':'글의 흐름과 연결사 파악','어순배열':'문장 구조(S+V+O) 정확히 파악','어휘':'문맥에서 적절한 어휘 고르기 연습','내용이해':'지문 핵심 내용 정확히 파악'};return m[t]||'해당 유형 집중 복습 필요';}
function fmtTime(s){return Math.floor(s/60)+'분 '+s%60+'초';}

function startExam(){const nm=document.getElementById('inpName').value.trim();if(!nm){toast('이름을 입력해주세요!');return;}S={ans:Array(EI.totalQ).fill(null),cur:0,ti:null,left:EI.time,start:Date.now()};showScreen('examScreen');renderSlide(0);startTimer();}

function renderSlide(idx){
S.cur=idx;const q=Q[idx];const tc=typeTag[q.type]||'';const mk=q.ch&&q.ch.length===5?'①②③④⑤':q.ch&&q.ch.length===4?'①②③④':q.ch&&q.ch.length===3?'①②③':'①②';
// passage area
const pp=document.getElementById('slidePassage');
let ph=`<div class="slide-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}" style="font-size:10px;padding:3px 8px">${q.type}</span><span style="margin-left:auto;font-size:11px;color:var(--tl)">${q.diff} · ${q.pts}점</span></div>`;
if(q.passage)ph+=`<div class="q-passage">${q.passage}</div>`;
if(!q.passage)ph+=`<div style="padding:20px;text-align:center;color:var(--tl);font-size:13px">이 문항은 지문이 없습니다.</div>`;
pp.innerHTML=ph;pp.scrollTop=0;
// bottom area

let bh=`<div class="slide-stem">${q.stem}</div>`;
if(q.fmt==='mc'){bh+=`<div class="slide-choices">`;q.ch.forEach((c,ci)=>{const sel=S.ans[idx]===ci?' selected':'';bh+=`<button class="choice-btn${sel}" onclick="slideSel(${idx},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`;});bh+=`</div>`;}
if(q.fmt==='written'){const val=S.ans[idx]||'';bh+=`<input class="written-input" id="sw-${idx}" value="${val}" placeholder="답안을 입력하세요..." oninput="slideWrite(${idx})">`;}
bh+=`<div class="slide-nav"><button ${idx===0?'disabled':''}onclick="renderSlide(${idx-1})">&larr; 이전</button><span class="nav-cur">${idx+1} / ${EI.totalQ}</span><button class="sn-next" ${idx===EI.totalQ-1?'disabled':''}onclick="renderSlide(${idx+1})">다음 &rarr;</button></div>`;
bt.innerHTML=bh;bt.scrollTop=0;
}

function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';

h+=`<div class="rs"><div class="rs-title">🔍 내신핏 약점 진단</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'var(--o)':p>=50?'var(--warn)':'var(--r)';const icon=p===100?'✅':p>=50?'⚠️':'❌';h+=`<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:13px">${icon}</span><span style="font-size:13px;font-weight:700;flex:1">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-size:13px;font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div>${p<100?`<div style="font-size:11px;color:var(--tm);margin-top:3px;padding-left:21px">→ ${getTypeAdvice(type)}</div>`:''}</div>`;});h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 내신핏 처방</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">👑</div><div class="plan-text"><h4>마스터 달성!</h4><p>이 단원은 완벽합니다. 다음 단원에 도전하세요!</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">🌟</div><div class="plan-text"><h4>통과! 마스터까지 한 끗</h4><p>아래 약점 유형만 집중하면 마스터 달성!</p></div>`;else if(pct>=50)h+=`<div class="plan-icon">🔥</div><div class="plan-text"><h4>기본기는 있어요!</h4><p>오답 해설을 꼼꼼히 확인하고, 약점 유형부터 공략하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>지문 해석부터!</h4><p>본문을 완벽히 이해한 뒤 재도전하세요. 해설의 한글 해석을 활용!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid" style="grid-template-columns:1fr 1fr"><button class="act-btn" onclick="shareImage()"><span class="act-icon">📸</span><span class="act-label">이미지 공유</span></button><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">텍스트 복사</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':d.q.ch&&d.q.ch.length===4?'①②③④':d.q.ch&&d.q.ch.length===3?'①②③':'①②';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:(d.q.wa||'');const open=!d.ok;
let chHtml='';if(d.q.fmt==='mc'&&d.q.ch){chHtml=`<div style="margin-top:8px">`;d.q.ch.forEach((c,ci)=>{const isAns=ci===d.q.ans;const isMy=d.ans===ci;const color=isAns?'var(--o)':(isMy&&!d.ok?'var(--r)':'var(--tm)');const bg=isAns?'var(--oxl)':(isMy&&!d.ok?'var(--rl)':'transparent');const label=isAns?' ✅':(isMy&&!d.ok?' ❌':'');chHtml+=`<div style="padding:4px 8px;margin-bottom:2px;border-radius:6px;font-size:12px;color:${color};background:${bg}"><b>${mk[ci]}</b> ${c}${label}</div>`;});chHtml+=`</div>`;}
h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,8)}] ${d.q.diff} ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:10px"><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--oxl);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:10px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--oxl);color:var(--o)"><div style="font-size:10px;opacity:.7">정답</div>${ca}</div></div><div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📝 문제</div><div class="expl-box" style="font-size:12.5px;line-height:1.6;border-left:3px solid var(--b);margin-bottom:10px"><div style="font-weight:700;margin-bottom:6px">${d.q.stem}</div>${chHtml}</div>${d.q.passage?`<div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📖 원문</div><div class="expl-box" style="font-size:12px;line-height:1.75;border-left:3px solid #ddd;margin-bottom:10px">${d.q.passage}</div>`:''}${d.q.det?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean||''}</div><div class="expl-tag tip">📋 풀이 · 선지 분석</div><div class="expl-box" style="white-space:pre-line">${(d.q.det.analysis||'').replace(/\\n/g,'<br>')}</div><div class="expl-tag tip">💡 포인트</div><div class="expl-box tip-b">${d.q.det.tip||''}</div>`:''}</div></div>`;}); h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#E8772E':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#FFF3E8,#FFE8D5':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#E8772E':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
