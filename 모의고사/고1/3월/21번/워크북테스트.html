body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}

.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--o);border-radius:50%;}

.tag-grammar{background:#EDE9FE;color:#5B21B6;}.tag-vocab{background:#E8F5E9;color:#166534;}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-written{background:#FFF3E0;color:#E65100;}.tag-tf{background:#FFF0F0;color:#D63B3B;}.tag-content{background:#EDF2FF;color:#3B6FD9;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f0edf5;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--o);font-weight:800;}

.written-input{width:100%;padding:14px 16px;border:2px solid #d0c8e2;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--o);}

.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--od),var(--o));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8e0f5;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--o),var(--ol));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FDFBFF;border-radius:var(--rs);border:1px solid #ddd6f3;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--oxl);}.info-cell.highlight .ic-value{color:var(--o);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0f5;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:#EDE9FE;color:var(--o);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--oxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0c8e2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--o);color:var(--o);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #ddd6f3;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FDFBFF;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F8F5FD;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:#EDE9FE;color:var(--o);}.expl-tag.tip{background:var(--oxl);color:var(--od);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--o);}.expl-box.tip-b{border-left:3px solid var(--o);background:var(--oxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

{id:1,type:`어법`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`①<u>Assume</u> gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to ②<u>correct</u> disease-causing mutations at the ③<u>earliest</u> possible stage of life, before harmful genes ④<u>begin</u> ⑤<u>causing</u> serious problems. Yet once it becomes possible to transform an embryo's mutated genes into 'normal' ones, there will certainly be temptations to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 어법상 틀린 것은?`,det:{korean:`분사구문 '~라고 가정하면' → ① Assume → <b>Assuming</b>`,analysis:`❌ ① Assume: 분사구문으로 Assuming이 맞음\n✅ ② correct: to부정사 목적\n✅ ③ earliest: 최상급\n✅ ④ begin: 복수주어(genes) + 현재시제\n✅ ⑤ causing: begin + V-ing`,tip:`Assuming (that) = If we assume (that) = ~라고 가정하면 — 분사구문`}},
{id:2,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to ①<u>transform</u> an embryo's ②<u>mutated</u> genes into normal ones, there will certainly be temptations ③<u>upgrading</u> normal genes to ④<u>superior</u> ⑤<u>versions</u>. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 어법상 틀린 것은?`,det:{korean:`temptations to upgrade → to부정사가 맞음. ③ upgrading → <b>to upgrade</b>`,analysis:`❌ ③ upgrading: temptation 뒤에는 to부정사 → to upgrade\n✅ ① transform: to부정사\n✅ ② mutated: 과거분사(수동)\n✅ ④ superior: 형용사\n✅ ⑤ versions: 복수명사`,tip:`temptation to + 동사원형 = ~하려는 유혹 (to부정사가 temptation 수식)`}},
{id:3,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo's mutated genes into 'normal' ones, there will certainly be temptations to upgrade normal genes to superior versions. Should we begin ①<u>editing</u> genes in unborn children to ②<u>lower</u> their lifetime risk of heart disease or cancer? What about ③<u>giving</u> them beneficial features, like ④<u>greater</u> strength and ⑤<u>increasing</u> mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 어법상 틀린 것은?`,det:{korean:`greater strength와 병렬 → ⑤ increasing → <b>increased</b> (과거분사: 증가된)`,analysis:`❌ ⑤ increasing: greater와 병렬이므로 increased(과거분사/형용사)\n✅ ① editing: begin + V-ing\n✅ ② lower: to부정사(목적)\n✅ ③ giving: What about + V-ing\n✅ ④ greater: 비교급`,tip:`increased(증가된) = 형용사 역할. increasing(증가하는)과 구별`}},
{id:4,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to ①<u>correct</u> disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo's mutated genes into 'normal' ones, there will certainly be ②<u>resistance</u> to upgrade normal genes to ③<u>superior</u> versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for ④<u>perfection</u> seems almost natural to human ⑤<u>nature</u>, but if we start down this slippery slope, we may not like where we end up.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`정상 유전자를 업그레이드하려는 <b>유혹(temptations)</b>이 있을 것이다. ② resistance(저항)는 temptations의 반의어로 부적절.`,analysis:`❌ ② resistance(저항): 원문은 'temptations(유혹)' → 부적절\n✅ ① correct: 교정하다\n✅ ③ superior: 우월한\n✅ ④ perfection: 완벽함\n✅ ⑤ nature: 본성`,tip:`temptations(유혹) ↔ resistance(저항) — 핵심 반의어`}},
{id:5,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo's mutated genes into 'normal' ones, there will certainly be temptations to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to ①<u>lower</u> their lifetime ②<u>risk</u> of heart disease or cancer? What about giving unborn children ③<u>beneficial</u> features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for ④<u>imperfection</u> seems almost natural to human nature, but if we start down this ⑤<u>slippery</u> slope, we may not like where we end up.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`<b>완벽함(perfection)</b>에 대한 추구. ④ imperfection(불완전함)은 perfection의 반의어로 부적절.`,analysis:`❌ ④ imperfection(불완전함): 원문은 'perfection(완벽함)' → 부적절\n✅ ① lower: 낮추다\n✅ ② risk: 위험\n✅ ③ beneficial: 유익한\n✅ ⑤ slippery: 미끄러운`,tip:`perfection(완벽함) ↔ imperfection(불완전함)`}},
{id:6,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`ignore disease-causing genes entirely`,`make all children look the same`,`upgrade normal genes to superior versions`,`eliminate all genetic research immediately`],passage:`Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo's mutated genes into 'normal' ones, there will certainly be temptations to __________. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`정상 유전자를 <b>우월한 버전으로 업그레이드(upgrade to superior versions)</b>하려는 유혹이 있을 것이다.`,analysis:`✅ ③ upgrade normal genes to superior versions: 원문 일치\n❌ ① ignore: 무시 → 반대\n❌ ② look the same: 언급 없음\n❌ ④ eliminate research: 극단적`,tip:`transform mutated → normal → upgrade normal → superior: 단계적 확대`}},
{id:7,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`scientific progress always leads to positive outcomes`,`the pursuit for perfection through gene editing could lead to unintended consequences`,`gene editing should be banned in all circumstances`,`physical characteristics cannot be changed through gene editing`],passage:FULL_PASSAGE,stem:`다음 글의 요지로 가장 적절한 것은?`,det:{korean:`유전자 편집을 통한 <b>완벽함의 추구</b>가 <b>의도치 않은 결과(unintended consequences)</b>를 초래할 수 있다.`,analysis:`✅ ② pursuit for perfection could lead to unintended consequences: 글의 핵심 우려\n❌ ① always positive: 반대\n❌ ③ banned: 글은 금지 주장 아님\n❌ ④ cannot be changed: 변경 가능성 논의`,tip:`slippery slope = 한 번 시작하면 멈출 수 없는 위험한 과정`}},
{id:8,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`mutations`,accept:[`mutations`,`Mutations`,`mutation`],passage:`Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing __________ at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo's mutated genes into 'normal' ones, there will certainly be temptations to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.`,stem:`다음 빈칸에 들어갈 단어를 본문에서 찾아 쓰시오.`,det:{korean:`질병 유발 <b>돌연변이(mutations)</b>를 교정하다`,analysis:`mutations: 돌연변이 → disease-causing과 결합`,tip:`mutation = 돌연변이 (gene의 구조 변화)`}},
{id:9,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`temptations`,accept:[`temptations`,`Temptations`,`temptation`],passage:`Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo's mutated genes into 'normal' ones, there will certainly be __________ to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.`,stem:`다음 빈칸에 들어갈 단어를 본문에서 찾아 쓰시오.`,det:{korean:`정상 유전자를 업그레이드하려는 <b>유혹(temptations)</b>이 있을 것이다.`,analysis:`temptations: 유혹 → upgrade하려는 욕구`,tip:`temptation to + V = ~하려는 유혹`}},
{id:10,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`perfection`,accept:[`perfection`,`Perfection`],passage:`Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo's mutated genes into 'normal' ones, there will certainly be temptations to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for __________ seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.`,stem:`다음 빈칸에 들어갈 단어를 본문에서 찾아 쓰시오.`,det:{korean:`<b>완벽함(perfection)</b>에 대한 추구는 인간 본성에 거의 자연스러운 것처럼 보인다.`,analysis:`perfection: 완벽함 → pursuit(추구)의 대상`,tip:`pursuit for perfection = 완벽함에 대한 추구`}},
{id:11,type:`서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`slippery slope`,accept:[`slippery slope`,`Slippery slope`,`this slippery slope`],passage:`Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an embryo's mutated genes into 'normal' ones, there will certainly be temptations to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this __________, we may not like where we end up.`,stem:`다음 빈칸에 들어갈 표현을 본문에서 찾아 쓰시오. (2단어)`,det:{korean:`이 <b>미끄러운 비탈길(slippery slope)</b>을 내려가기 시작하면, 결국 어디에 도달할지 좋아하지 않을 수 있다.`,analysis:`slippery slope: 한 번 시작하면 멈출 수 없는 위험한 과정 (관용적 표현)`,tip:`slippery slope = 미끄러운 비탈길 → 점점 통제 불가능해지는 상황의 비유`}},
{id:12,type:`내용일치`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`Gene editing has already been proven completely safe.`,`The author fully supports editing genes for physical appearance.`,`The passage discusses the ethical concerns of gene editing.`,`Gene editing can only treat heart disease.`],passage:FULL_PASSAGE,stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`이 글은 유전자 편집의 <b>윤리적 우려(ethical concerns)</b>를 논의한다.`,analysis:`✅ ③ discusses ethical concerns: 글의 핵심 주제\n❌ ① proven safe: 'assuming' = 가정\n❌ ② fully supports: 우려를 표현\n❌ ④ only heart disease: 암, 외모 등도 언급`,tip:`Assuming = 가정하면 → 아직 확실하지 않음`}},
{id:13,type:`내용일치`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`The author warns that correcting diseases could lead to designing 'perfect' humans.`,`Gene editing is currently used to change eye and hair color.`,`The author believes perfection is unnatural to human nature.`,`Unborn children have already received enhanced mental abilities.`],passage:FULL_PASSAGE,stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`필자는 질병 치료가 <b>'완벽한' 인간 설계</b>로 이어질 수 있다고 경고한다.`,analysis:`✅ ① correcting diseases could lead to designing perfect humans: 글의 핵심 논리\n❌ ② currently used: 가정 단계\n❌ ③ unnatural: 'seems almost natural'\n❌ ④ already received: 미래 가능성 논의`,tip:`correct → upgrade → beneficial features → physical characteristics: 단계적 확대 경고`}},
{id:14,type:`TF`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`True`,`False`],passage:`"The pursuit for perfection seems almost natural to human nature."`,stem:`완벽함에 대한 추구는 인간 본성에 거의 자연스러운 것이다. (T/F)`,det:{korean:`원문 그대로: 완벽함 추구는 인간 본성에 <b>거의 자연스럽다(almost natural)</b> → <b>True</b>`,analysis:`True: 원문과 정확히 일치`,tip:`almost natural = 거의 자연스러운`}},
{id:15,type:`TF`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`True`,`False`],passage:`"Assuming gene editing in humans proves to be safe and effective..."`,stem:`유전자 편집은 이미 안전하고 효과적이라고 증명되었다. (T/F)`,det:{korean:`원문: 'Assuming' = <b>가정하면</b> → 아직 증명되지 않았다 → <b>False</b>`,analysis:`False: Assuming = 가정 → 확정된 사실이 아님`,tip:`Assuming = If we assume = 가정하면 (확정 아님)`}},
{id:16,type:`TF`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`True`,`False`],passage:`"Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer?"`,stem:`필자는 태어나지 않은 아이의 심장병이나 암 위험을 줄이기 위해 유전자를 편집할지에 대한 질문을 제기한다. (T/F)`,det:{korean:`원문에서 수사적 질문으로 이 문제를 <b>제기(raise)</b>한다 → <b>True</b>`,analysis:`True: 수사적 질문(rhetorical question)으로 윤리적 문제 제기`,tip:`수사적 질문 = 답을 기대하지 않고 문제를 제기하는 질문`}},
{id:17,type:`TF`,diff:`보통`,pts:4,fmt:"mc",ans:1,ch:[`True`,`False`],passage:`"If we start down this slippery slope, we may not like where we end up."`,stem:`필자는 유전자 편집의 확대가 반드시 좋은 결과를 가져올 것이라고 확신한다. (T/F)`,det:{korean:`원문: '우리가 도달하는 곳을 <b>좋아하지 않을 수 있다(may not like)</b>' → <b>False</b>`,analysis:`False: may not like = 좋아하지 않을 수 있다 → 부정적 결과 우려`,tip:`slippery slope = 위험한 과정 → 부정적 전망`}},
{id:18,type:`내용일치`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`The passage argues gene editing should be completely prohibited.`,`The passage suggests that gene editing for diseases could expand to designing ideal traits.`,`The passage says all parents want to change their children's eye color.`,`The passage proves that gene editing causes more harm than good.`],passage:FULL_PASSAGE,stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`글은 질병 치료를 위한 유전자 편집이 <b>이상적 특성 설계(designing ideal traits)</b>로 확대될 수 있음을 시사한다.`,analysis:`✅ ② suggests gene editing could expand to designing ideal traits: 글의 핵심 논리\n❌ ① completely prohibited: 금지 주장 아님\n❌ ③ all parents: 과도한 일반화\n❌ ④ proves harm: 가능성 논의이지 증명 아님`,tip:`correct mutations → upgrade genes → beneficial features → physical traits: 확대 논리`}},
{id:19,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`한 번 시작하면 점점 통제할 수 없는 위험한 과정에 빠질 수 있다`,`유전자 편집 기술이 물리적으로 미끄러운 경사면에서만 작동한다`,`유전자 편집은 항상 실패하여 미끄러지듯 멈추게 된다`,`과학자들이 미끄러운 길에서 연구하고 있다`],passage:FULL_PASSAGE,stem:`밑줄 친 "start down this slippery slope"가 의미하는 바로 가장 적절한 것은?`,det:{korean:`<b>slippery slope</b> = 한 번 시작하면 멈출 수 없는 <b>위험한 과정</b>. 질병 치료 → 유전자 업그레이드 → 외모 변경으로 확대되는 과정을 경고.`,analysis:`✅ ① 한 번 시작하면 점점 통제할 수 없는 위험한 과정: slippery slope의 비유적 의미\n❌ ② 물리적 경사면: 비유를 문자 그대로 해석\n❌ ③ 실패: 언급 없음\n❌ ④ 미끄러운 길: 문자적 해석`,tip:`slippery slope(미끄러운 비탈길) = 한 단계가 다음 단계로 이어져 통제 불가능해지는 상황`}},
{id:20,type:`서술형`,diff:`어려움`,pts:7,fmt:"written",wa:`embryo`,accept:[`embryo`,`Embryo`,`an embryo`],passage:`Assuming gene editing in humans proves to be safe and effective, it might seem logical, even preferable, to correct disease-causing mutations at the earliest possible stage of life, before harmful genes begin causing serious problems. Yet once it becomes possible to transform an __________'s mutated genes into 'normal' ones, there will certainly be temptations to upgrade normal genes to superior versions. Should we begin editing genes in unborn children to lower their lifetime risk of heart disease or cancer? What about giving unborn children beneficial features, like greater strength and increased mental abilities, or changing physical characteristics, like eye and hair color? The pursuit for perfection seems almost natural to human nature, but if we start down this slippery slope, we may not like where we end up.`,stem:`다음 빈칸에 들어갈 단어를 본문에서 찾아 쓰시오.`,det:{korean:`<b>배아(embryo)</b>의 돌연변이 유전자를 정상으로 변환하는 것이 가능해지면`,analysis:`embryo: 배아 → 생명 초기 단계의 존재, 유전자 편집의 대상`,tip:`embryo = 배아 (수정 후 초기 발달 단계)`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법':'tag-grammar','어휘':'tag-vocab','빈칸추론':'tag-blank','서술형':'tag-written','내용일치':'tag-content','TF':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'#F59E0B':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:#EDE9FE;color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:#EDE9FE;color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📖 온라인워크북 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
