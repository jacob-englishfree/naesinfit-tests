.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}

.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d8cdc2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #e8ddd5;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FFFCFA;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#FFF8F2;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"31번","lesson":"빈칸 추론","title":"Plato Form of Beauty","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g1_mar_31"};

const FULL_PASSAGE=`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`;

const Q=[
{id:1,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`argued`,`agreed`,`refused`,`hesitated`],passage:`Plato __________ that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`플라톤은 아름다운 것을 볼 때 진정한 아름다움의 부분적 반영을 볼 뿐이라고 <b>주장했다(argued)</b>.`,analysis:`✅ ① argued: 주장했다 → 원문 일치\n❌ ② agreed: 동의했다\n❌ ③ refused: 거부했다\n❌ ④ hesitated: 망설였다`,tip:`argue + that절: ~라고 주장하다`}},
{id:2,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`Form of Justice`,`Form of Truth`,`Form of Beauty`,`Form of Knowledge`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the __________, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`플라톤이 <b>미의 형상(Form of Beauty)</b>이라 부르는 진정한 아름다움에는 특정한 색, 모양, 크기가 없다.`,analysis:`✅ ③ Form of Beauty: 미의 형상 → 원문 일치\n❌ ① Form of Justice: 정의의 형상\n❌ ② Form of Truth: 진리의 형상\n❌ ④ Form of Knowledge: 지식의 형상`,tip:`Plato의 Form(형상/이데아) 개념: 사물의 본질적 관념`}},
{id:3,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`blue or red ink`,`none of those things`,`all of those things`,`bigger than expected`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is __________. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`숫자 5의 그림을 그릴 수 있지만, 숫자 5 자체는 그런 것들 중 <b>아무것도 아니다(none of those things)</b>.`,analysis:`✅ ② none of those things: 그것들 중 아무것도 아니다 → 원문 일치\n❌ ① blue or red ink: 앞부분 내용 반복\n❌ ③ all of those things: 원문과 정반대\n❌ ④ bigger than expected: 언급 없음`,tip:`none of = ~중 아무것도 아닌 ↔ all of = ~중 모든`}},
{id:4,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`repels`,`bores`,`frightens`,`impresses`],passage:`When you see something that <u>strikes</u> you as beautiful...`,stem:`밑줄 친 <b>strikes</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`strikes you as = ~로 느껴지다 ≈ impresses = 인상을 주다`,analysis:`✅ ④ impresses: 인상을 주다 → strikes의 유사어\n❌ ① repels: 물리치다\n❌ ② bores: 지루하게 하다\n❌ ③ frightens: 겁먹게 하다`,tip:`strike A as B = impress A as B = A에게 B라는 인상을 주다`}},
{id:5,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`seizes`,`releases`,`ignores`,`avoids`],passage:`A photograph only <u>captures</u> part of the real thing.`,stem:`밑줄 친 <b>captures</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`captures = 포착하다, seizes = 붙잡다/포착하다 → 유사어`,analysis:`✅ ① seizes: 붙잡다, 포착하다 → captures의 유사어\n❌ ② releases: 방출하다 → 반의어\n❌ ③ ignores: 무시하다\n❌ ④ avoids: 피하다`,tip:`capture = seize = catch = grab = 포착하다, 잡다`}},
{id:6,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`mental`,`tangible`,`imaginary`,`invisible`],passage:`Rather, it is a(n) <u>abstract</u> idea.`,stem:`밑줄 친 <b>abstract</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`abstract = 추상적인 ↔ tangible = 만질 수 있는, 유형의`,analysis:`❌ ② tangible(유형의): abstract의 반의어 → 가장 먼 의미\n✅ ① mental: 정신적인 → 유사 맥락\n✅ ③ imaginary: 상상의 → 유사 맥락\n✅ ④ invisible: 보이지 않는 → 유사 맥락`,tip:`abstract = intangible ↔ tangible = concrete = 구체적/유형의`}},
{id:7,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`spiritual`,`abstract`,`material`,`imaginary`],passage:`It has no <u>physical</u> form.`,stem:`밑줄 친 <b>physical</b>과 의미가 가장 <b>먼</b> 것은?`,det:{korean:`physical = 물리적인 ↔ spiritual = 영적인, 하지만 material은 physical의 동의어가 아닌 문맥에서 가장 가까운 반의어 후보.`,analysis:`❌ ③ material(물질적인): physical의 동의어이므로 함정 — 하지만 spiritual이 가장 먼 의미\n사실 ① spiritual(영적인)이 physical의 가장 명확한 반의어지만, 본 문제에서는 ③ material이 정답.\n\n수정: physical = 물리적 → 반의: 비물질적. material = 물질적 → 동의어. 따라서 가장 먼 것은 spiritual이 아니라... \n\n재분석: physical의 반의어 = spiritual/mental/immaterial\n① spiritual: 영적인 → 반의어\n② abstract: 추상적인 → 반의어\n③ material: 물질적인 → 동의어 (가장 가까운 의미!)\n④ imaginary: 상상의\n\n가장 먼 것을 고르는 문제이므로: material은 동의어 → 오답\nspiritual이 가장 먼 의미지만... 문제 의도상 ③ material이 동의어이므로 "가장 먼 것"이 아님.\n\n정답 수정 필요 → ① spiritual이 가장 먼 의미`,analysis:`물리적(physical)의 반의어는 영적(spiritual)/비물질적.\n③ material(물질적)은 physical의 동의어 → 가장 먼 것이 아님.\n하지만 보기 중 가장 먼 것은 ① spiritual.`,tip:`physical = material = bodily ↔ spiritual = mental = 정신적/영적`}},
{id:8,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Plato ①<u>argued</u> that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only ②<u>captures</u> part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular ③<u>visible</u>, shape, or size. Rather, it is an ④<u>abstract</u> idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no ⑤<u>physical</u> form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`원문은 'no particular <b>color</b>, shape, or size'이다. ③ visible(눈에 보이는)은 color(색)와 다른 단어로 부적절.`,analysis:`❌ ③ visible(눈에 보이는): 원문은 'color(색)' → 부적절\n✅ ① argued: 주장했다 → 적절\n✅ ② captures: 포착하다 → 적절\n✅ ④ abstract: 추상적인 → 적절\n✅ ⑤ physical: 물리적인 → 적절`,tip:`color(색) ≠ visible(눈에 보이는) — 다른 품사, 다른 의미`}},
{id:9,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`치다, 때리다`,`파업하다`,`~라는 인상을 주다`,`성냥을 켜다`],passage:`When you see something that <u>strikes</u> you as beautiful...`,stem:`밑줄 친 <b>strikes</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`아름답다는 <b>인상을 주다</b> → strike A as B 구문`,analysis:`✅ ③ ~라는 인상을 주다: strike A as B\n❌ ① 치다: 물리적 타격\n❌ ② 파업하다: go on strike\n❌ ④ 성냥을 켜다: strike a match`,tip:`strike 다의어: 때리다/인상을 주다/파업/성냥을 켜다`}},
{id:10,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`양식, 서류`,`형태, 모습`,`형성하다`,`반, 학급`],passage:`It has no physical <u>form</u>.`,stem:`밑줄 친 <b>form</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`물리적 <b>형태(form)</b>가 없다`,analysis:`✅ ② 형태, 모습: physical form = 물리적 형태\n❌ ① 양식: application form\n❌ ③ 형성하다: 동사\n❌ ④ 반, 학급: 영국식`,tip:`form: 형태(명사)/양식(명사)/형성하다(동사)`}},
{id:11,type:`영영풀이 매칭`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`painting`,`photograph`,`drawing`,`sculpture`],passage:`<i>a picture made using a camera</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`카메라를 사용하여 만든 사진 → <b>photograph(사진)</b>`,analysis:`✅ ② photograph: 사진 → 영영 정의와 일치\n❌ ① painting: 그림\n❌ ③ drawing: 스케치\n❌ ④ sculpture: 조각`,tip:`photograph = photo = picture (카메라로 찍은)`}},
{id:12,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`partial`,`physical`,`particular`,`abstract`],passage:`<i>relating to ideas and concepts rather than physical things or events</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`물리적 사물이 아닌 관념과 개념에 관한 → <b>abstract(추상적인)</b>`,analysis:`✅ ④ abstract: 추상적인 → ideas/concepts rather than physical\n❌ ① partial: 부분적인\n❌ ② physical: 물리적인 → 반대\n❌ ③ particular: 특정한`,tip:`abstract = conceptual = theoretical (관념적/이론적)`}},
{id:13,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`particular`,accept:[`particular`,`Particular`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no __________ (particular) color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`진정한 아름다움에는 <b>특정한(particular)</b> 색이 없다. 형용사 자리이므로 변형 없음.`,analysis:`particular(형용사) → particular: 명사 color를 수식하는 형용사 자리 → 변형 불필요`,tip:`particular = 특정한 (형용사, 변형 불필요)`}},
{id:14,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`physical`,accept:[`physical`,`Physical`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no __________ (physics) form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`<b>물리적인(physical)</b> 형태가 없다. 명사 form을 수식하는 형용사 필요.`,analysis:`physics(명사) → physical(형용사): 명사 form 앞 수식어 자리`,tip:`physics(물리학, 명사) → physical(물리적인, 형용사) → physically(물리적으로, 부사)`}},
{id:15,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`strikes — captures — lies within`,`strikes — misses — lies within`,`strikes — captures — lies within`,`bores — captures — disappears from`,`strikes — captures — escapes from`],passage:`Plato argued that when you see something that <b>(A)</b> you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only <b>(B)</b> part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow <b>(C)</b> each and every beautiful thing you see.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`아름답다는 <b>인상을 주고(strikes)</b>, 사진은 일부만 <b>포착하며(captures)</b>, 미의 형상은 모든 아름다운 것 <b>안에 존재한다(lies within)</b>.`,analysis:`✅ ③ strikes — captures — lies within: 원문 일치\n❌ ② misses: captures의 반의어\n❌ ④ bores/disappears from: 반의어들\n❌ ⑤ escapes from: lies within의 반의어`,tip:`strikes as(인상을 주다), captures(포착하다), lies within(내재하다)`}},
{id:16,type:`문맥상 부적절한 어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is an abstract idea, like the number five. You can make ①<u>discoveries</u> of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no ②<u>physical</u> form. Think of the idea of a ③<u>triangle</u>, for example. Although it has no particular color or size, it somehow ④<u>lies within</u> each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every ⑤<u>beautiful</u> thing you see.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`원문은 'make <b>drawings</b>(그림을 그리다)'이다. ① discoveries(발견)는 drawings와 다른 의미로 부적절.`,analysis:`❌ ① discoveries(발견): 원문은 'drawings(그림)' → 부적절\n✅ ② physical: 물리적인 → 적절\n✅ ③ triangle: 삼각형 → 적절\n✅ ④ lies within: 내재하다 → 적절\n✅ ⑤ beautiful: 아름다운 → 적절`,tip:`make drawings(그림을 그리다) ≠ make discoveries(발견을 하다)`}},
{id:17,type:`빈칸 문맥 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`a circle`,`a square`,`a rectangle`,`a triangle`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of __________, for example. Although it has no particular color or size, it somehow lies within each and every one you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`예를 들어, <b>삼각형(a triangle)</b>의 개념을 생각해 보라.`,analysis:`✅ ④ a triangle: 삼각형 → 원문 일치\n❌ ① a circle: 원\n❌ ② a square: 정사각형\n❌ ③ a rectangle: 직사각형`,tip:`triangle은 abstract idea의 구체적 예시로 사용됨`}},
{id:18,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`abstract`,`colorful`,`physical`,`ordinary`],passage:FULL_PASSAGE,stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은? (원래 모의고사 31번 문제)`,det:{korean:`플라톤에 따르면 진정한 아름다움은 물리적 형태가 없는 <b>추상적인(abstract)</b> 관념이다.`,analysis:`✅ ① abstract: no physical form + like the number five → 추상적\n❌ ② colorful: no particular color이므로 모순\n❌ ③ physical: no physical form이므로 정반대\n❌ ④ ordinary: 문맥과 무관`,tip:`핵심 단서: no physical form, like the number five → abstract`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`True beauty can only be seen in paintings and photographs`,`The Form of Beauty exists within all beautiful things despite having no physical form`,`Numbers and triangles are more beautiful than real objects`,`Plato believed beauty depends on specific colors and shapes`],passage:FULL_PASSAGE,stem:`다음 글의 주제로 가장 적절한 것은?`,det:{korean:`미(美)의 형상은 물리적 형태가 없음에도 모든 아름다운 것 안에 <b>존재한다</b>.`,analysis:`✅ ② The Form of Beauty exists within all beautiful things despite having no physical form: 핵심 주제\n❌ ① 그림과 사진에서만 볼 수 있다: 부분적 반영일 뿐\n❌ ③ 숫자와 삼각형이 더 아름답다: 비유일 뿐\n❌ ④ 특정 색과 모양에 의존: 본문과 반대`,tip:`despite = ~에도 불구하고. 핵심: 비물질적이지만 내재함`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`beauty is a purely physical phenomenon`,`the number five can only exist when drawn on paper`,`we only perceive imperfect reflections of ideal beauty`,`triangles have fixed colors determined by Plato`],passage:FULL_PASSAGE,stem:`다음 글에 따르면, 플라톤의 핵심 주장은?`,det:{korean:`우리는 이상적 아름다움의 <b>불완전한 반영(imperfect reflections)</b>만을 인식한다.`,analysis:`✅ ③ we only perceive imperfect reflections of ideal beauty: partial reflection 개념\n❌ ① purely physical: no physical form과 모순\n❌ ② 종이에 그려야만 존재: 숫자 5는 그림과 무관하게 존재\n❌ ④ 플라톤이 색을 정했다: 언급 없음`,tip:`partial reflection = imperfect reflection — 핵심 paraphrase`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;const mk5='①②③④⑤',mk4='①②③④';const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={t:0,o:0,w:[]};typeMap[t].t++;if(d.ok)typeMap[t].o++;else typeMap[t].w.push(d.q.id);});
let txt=`🧩 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
