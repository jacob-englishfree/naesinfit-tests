.rev-card{border:1.5px solid #dde8df;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FAFDFB;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F0F8F1;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}

.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}

const EI={"subject":"2025 고1 3월 모의고사","pub":"31번","lesson":"빈칸 추론","title":"Plato Form of Beauty","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_2025_g1_mar_31"};

const FULL_PASSAGE=`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`;

const Q=[
{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`partial — particular — physical`,`complete — particular — physical`,`partial — universal — physical`,`partial — particular — mental`,`complete — universal — mental`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a <b>(A)</b> reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no <b>(B)</b> color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no <b>(C)</b> form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`진정한 아름다움의 <b>부분적인(partial)</b> 반영만을 보고 있다. 진정한 미에는 <b>특정한(particular)</b> 색이나 모양이 없다. <b>물리적(physical)</b> 형태가 없다.`,analysis:`✅ ① partial — particular — physical: 원문 일치\n❌ ② complete: partial의 반의어\n❌ ③ universal: particular의 반의어\n❌ ④ mental: physical의 반의어\n❌ ⑤ complete/universal/mental: 모두 반의어`,tip:`partial(부분적) ↔ complete(완전한), particular(특정한) ↔ universal(보편적), physical(물리적) ↔ mental(정신적)`}},
{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`argued — captures — drawings`,`argued — captures — drawings`,`denied — captures — drawings`,`argued — misses — drawings`,`argued — captures — sculptures`],passage:`Plato <b>(A)</b> that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only <b>(B)</b> part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make <b>(C)</b> of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`플라톤은 <b>주장했다(argued)</b>. 사진은 실물의 일부만 <b>포착한다(captures)</b>. 숫자 5의 <b>그림(drawings)</b>을 그릴 수 있다.`,analysis:`✅ ② argued — captures — drawings: 원문 일치\n❌ ③ denied: argued의 반의어\n❌ ④ misses: captures의 반의어\n❌ ⑤ sculptures: drawings와 다른 의미`,tip:`argue(주장하다) ↔ deny(부정하다), capture(포착하다) ↔ miss(놓치다)`}},
{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Plato ①<u>argued</u> that when you see something that ②<u>strikes</u> you as beautiful, you are really just seeing a partial ③<u>distortion</u> of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no ④<u>particular</u> color, shape, or size. Rather, it is an ⑤<u>abstract</u> idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`진정한 아름다움의 부분적인 <b>반영(reflection)</b>을 보는 것이다. ③ distortion(왜곡)은 reflection(반영)과 다른 의미로 부적절.`,analysis:`❌ ③ distortion(왜곡): 원문은 'reflection(반영)' → 부적절\n✅ ① argued: 주장했다 → 적절\n✅ ② strikes: ~로 느껴지다 → 적절\n✅ ④ particular: 특정한 → 적절\n✅ ⑤ abstract: 추상적인 → 적절`,tip:`reflection(반영, 반사) ↔ distortion(왜곡) — 핵심 반의어`}},
{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make ①<u>drawings</u> of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no ②<u>physical</u> form. Think of the idea of a ③<u>triangle</u>, for example. Although it has no particular color or size, it somehow ④<u>disappears from</u> each and every triangle you see. Plato thought the same was ⑤<u>true</u> of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`삼각형의 개념은 우리가 보는 모든 삼각형 <b>안에 존재한다(lies within)</b>. ④ disappears from(사라지다)은 lies within(내재하다)의 반의어로 부적절.`,analysis:`❌ ④ disappears from(사라지다): 원문은 'lies within(내재하다)' → 부적절\n✅ ① drawings: 그림 → 적절\n✅ ② physical: 물리적 → 적절\n✅ ③ triangle: 삼각형 → 적절\n✅ ⑤ true: 사실인 → 적절`,tip:`lies within(내재하다) ↔ disappears from(사라지다) — 핵심 반의어`}},
{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`denied`,`claimed`,`doubted`,`ignored`],passage:`Plato <u>argued</u> that when you see something that strikes you as beautiful...`,stem:`밑줄 친 <b>argued</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`argued = 주장했다, claimed = 주장했다 → 동의어`,analysis:`✅ ② claimed: 주장했다 → argued의 동의어\n❌ ① denied: 부정했다\n❌ ③ doubted: 의심했다\n❌ ④ ignored: 무시했다`,tip:`argue = claim = assert = maintain = 주장하다`}},
{id:6,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`impresses`,`bores`,`confuses`,`angers`],passage:`When you see something that <u>strikes</u> you as beautiful...`,stem:`밑줄 친 <b>strikes</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`strikes you as = ~로 느껴지다, impresses = 인상을 주다 → 유사어`,analysis:`✅ ① impresses: ~에게 인상을 주다 → strikes의 유사어\n❌ ② bores: 지루하게 하다\n❌ ③ confuses: 혼란시키다\n❌ ④ angers: 화나게 하다`,tip:`strike A as B = A에게 B로 느껴지다 = impress A as B`}},
{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`concrete`,`visual`,`theoretical`,`practical`],passage:`Rather, it is a(n) <u>abstract</u> idea, like the number five.`,stem:`밑줄 친 <b>abstract</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`abstract = 추상적인, theoretical = 이론적인/관념적인 → 유사어`,analysis:`✅ ③ theoretical: 이론적인 → abstract의 유사어\n❌ ① concrete: 구체적인 → 반의어\n❌ ② visual: 시각적인\n❌ ④ practical: 실용적인`,tip:`abstract = theoretical = conceptual ↔ concrete = tangible = 구체적인`}},
{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`incomplete`,`fractional`,`fragmentary`,`complete`],passage:`You are really just seeing a <u>partial</u> reflection of true beauty.`,stem:`밑줄 친 <b>partial</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`partial = 부분적인 ↔ complete = 완전한`,analysis:`❌ ④ complete(완전한): partial의 반의어 → 가장 먼 의미\n✅ ① incomplete: 불완전한 → 유사어\n✅ ② fractional: 부분적인 → 동의어\n✅ ③ fragmentary: 단편적인 → 유사어`,tip:`partial = incomplete ↔ complete = whole = total = 완전한`}},
{id:9,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`concrete`,`intangible`,`theoretical`,`conceptual`],passage:`Rather, it is a(n) <u>abstract</u> idea, like the number five.`,stem:`밑줄 친 <b>abstract</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`abstract = 추상적인 ↔ concrete = 구체적인`,analysis:`❌ ① concrete(구체적인): abstract의 반의어 → 가장 먼 의미\n✅ ② intangible: 무형의 → 유사어\n✅ ③ theoretical: 이론적인 → 유사어\n✅ ④ conceptual: 개념적인 → 유사어`,tip:`abstract(추상적) ↔ concrete(구체적) / tangible(유형의) — 대표 반의어`}},
{id:10,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`distortion`,`reflection`,`creation`,`rejection`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial __________ of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`진정한 아름다움의 부분적인 <b>반영(reflection)</b>을 보고 있는 것이다.`,analysis:`✅ ② reflection: 반영 → 원문 일치\n❌ ① distortion: 왜곡\n❌ ③ creation: 창조\n❌ ④ rejection: 거부`,tip:`reflection = 반영, 반사, 성찰 (다의어)`}},
{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`general`,`universal`,`particular`,`ordinary`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no __________ color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`진정한 아름다움에는 <b>특정한(particular)</b> 색, 모양, 크기가 없다.`,analysis:`✅ ③ particular: 특정한 → 원문 일치\n❌ ① general: 일반적인\n❌ ② universal: 보편적인\n❌ ④ ordinary: 평범한`,tip:`particular = specific = certain = 특정한`}},
{id:12,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`captures`,`releases`,`ignores`,`destroys`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only __________ part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`그림이나 사진은 실물의 일부만 <b>포착한다(captures)</b>.`,analysis:`✅ ① captures: 포착하다 → 원문 일치\n❌ ② releases: 방출하다\n❌ ③ ignores: 무시하다\n❌ ④ destroys: 파괴하다`,tip:`capture = catch = seize = 포착하다, 사로잡다`}},
{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`양식, 서류`,`형태, 모습`,`형성하다`,`구성하다`],passage:`It has no physical <u>form</u>.`,stem:`밑줄 친 <b>form</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`물리적 <b>형태(form)</b>가 없다 → 모양/모습의 의미`,analysis:`✅ ② 형태, 모습: physical form = 물리적 형태\n❌ ① 양식, 서류: application form\n❌ ③ 형성하다: 동사적 의미\n❌ ④ 구성하다: 동사적 의미`,tip:`form 다의어: 형태(명사) / 양식(명사) / 형성하다(동사)`}},
{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`치다, 때리다`,`파업하다`,`~라는 인상을 주다`,`성냥을 켜다`],passage:`When you see something that <u>strikes</u> you as beautiful...`,stem:`밑줄 친 <b>strikes</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`아름답다는 <b>인상을 주다(strikes)</b> → 감정/인상의 의미`,analysis:`✅ ③ ~라는 인상을 주다: strike A as B = A에게 B라는 인상을 주다\n❌ ① 치다, 때리다: 물리적 타격\n❌ ② 파업하다: go on strike\n❌ ④ 성냥을 켜다: strike a match`,tip:`strike 다의어: 때리다 / 인상을 주다 / 파업 / 성냥을 켜다`}},
{id:15,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`particular`,`physical`,`abstract`,`partial`],passage:`<i>existing in thought or as an idea but not having a physical or concrete existence</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`생각이나 관념으로 존재하지만 물리적/구체적 존재는 아닌 → <b>abstract(추상적인)</b>`,analysis:`✅ ③ abstract: 추상적인 → 영영 정의와 일치\n❌ ① particular: 특정한\n❌ ② physical: 물리적인\n❌ ④ partial: 부분적인`,tip:`abstract = 추상적인: thought/idea로 존재하나 물리적 실체 없음`}},
{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`reflection`,`photograph`,`triangle`,`drawing`],passage:`<i>an image or idea that mirrors or shows the essential character of something else</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`다른 것의 본질을 비추거나 보여주는 이미지나 관념 → <b>reflection(반영)</b>`,analysis:`✅ ① reflection: 반영 → 영영 정의와 일치\n❌ ② photograph: 사진\n❌ ③ triangle: 삼각형\n❌ ④ drawing: 그림`,tip:`reflection = mirror image = 반영, 반사, 성찰`}},
{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`beautiful`,accept:[`beautiful`,`Beautiful`],passage:`Plato argued that when you see something that strikes you as __________ (beauty), you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`strikes you as + 형용사 → beauty → <b>beautiful</b>`,analysis:`beauty(명사) → beautiful(형용사): 'as + 형용사' 보어 자리`,tip:`beauty(명사) → beautiful(형용사) → beautifully(부사)`}},
{id:18,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`somehow`,accept:[`somehow`,`Somehow`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it __________ (somehow) lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`색이나 크기가 없지만 <b>어떻게든(somehow)</b> 모든 삼각형 안에 존재한다.`,analysis:`somehow(부사): 동사 lies를 수식하는 부사 자리 → 변형 없이 그대로 사용`,tip:`somehow = 어떻게든, 왠지 모르게 (부사, 변형 불필요)`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`abstract`,`colorful`,`physical`,`ordinary`],passage:FULL_PASSAGE,stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은? (원래 모의고사 31번 문제)`,det:{korean:`플라톤에 따르면 진정한 아름다움은 물리적 형태가 없는 <b>추상적인(abstract)</b> 관념이다. 숫자 5처럼 구체적 색이나 크기 없이 존재한다.`,analysis:`✅ ① abstract: 추상적인 → 물리적 형태 없는 관념\n❌ ② colorful: 다채로운 → 오히려 물리적 속성\n❌ ③ physical: 물리적인 → 본문과 정반대\n❌ ④ ordinary: 평범한 → 문맥과 무관`,tip:`핵심 논리: no physical form + like the number five → abstract(추상적)`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`beauty cannot be perceived by humans at all`,`each triangle has its own unique color and size`,`the Form of Beauty exists within every beautiful thing`,`physical objects have nothing to do with true beauty`],passage:FULL_PASSAGE,stem:`다음 글의 요지로 가장 적절한 것은?`,det:{korean:`플라톤은 미(美)의 형상이 모든 아름다운 것 안에 <b>내재한다</b>고 주장했다.`,analysis:`✅ ③ the Form of Beauty exists within every beautiful thing: 핵심 요지\n❌ ① 인간이 미를 전혀 인식할 수 없다: 본문과 반대 (partial reflection을 볼 수 있음)\n❌ ② 각 삼각형이 고유한 색과 크기를 가진다: 본문과 반대\n❌ ④ 물리적 대상이 진정한 아름다움과 무관하다: 부분적 반영이므로 무관하지 않음`,tip:`The Form of Beauty somehow lies within each and every beautiful thing → 핵심 문장`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;const mk5='①②③④⑤',mk4='①②③④';const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={t:0,o:0,w:[]};typeMap[t].t++;if(d.ok)typeMap[t].o++;else typeMap[t].w.push(d.q.id);});
let txt=`📝 온라인단어 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
