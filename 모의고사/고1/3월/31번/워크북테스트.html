.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0ccd8;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #ddd8e8;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FDFAFF;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F8F5FC;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}

.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"31번","lesson":"빈칸 추론","title":"Plato Form of Beauty","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_2025_g1_mar_31"};

const FULL_PASSAGE=`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`;

const Q=[
{id:1,type:`빈칸 문맥 완성`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`a painting captures the entire real thing`,`a painting only captures part of the real thing`,`a painting creates something better than reality`,`a painting has nothing to do with real beauty`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as __________. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`진정한 아름다움의 부분적 반영을 보는 것이며, <b>그림이 실물의 일부만 포착하는 것</b>과 같다.`,analysis:`✅ ② a painting only captures part of the real thing: 원문의 비유와 일치\n❌ ① entire: partial과 모순\n❌ ③ creates something better: 언급 없음\n❌ ④ nothing to do with: 비유 관계 부정`,tip:`just as = ~처럼 — 비유 표현. partial reflection ≈ captures part`}},
{id:2,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`abstract`,`colorful`,`physical`,`ordinary`],passage:FULL_PASSAGE,stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은? (원래 모의고사 31번 문제)`,det:{korean:`플라톤에 따르면 진정한 아름다움은 물리적 형태가 없는 <b>추상적인(abstract)</b> 관념이다.`,analysis:`✅ ① abstract: 물리적 형태 없이 관념으로 존재 → 숫자 5, 삼각형 비유와 일치\n❌ ② colorful: 색이 없다고 했으므로 모순\n❌ ③ physical: no physical form이라 했으므로 모순\n❌ ④ ordinary: 문맥과 무관`,tip:`no physical form + like the number five → abstract(추상적)`}},
{id:3,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`complete`,`distorted`,`partial`,`perfect`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a __________ reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`진정한 아름다움의 <b>부분적인(partial)</b> 반영만을 보고 있다.`,analysis:`✅ ③ partial: 부분적인 → 원문 일치\n❌ ① complete: 완전한 → 반의어\n❌ ② distorted: 왜곡된\n❌ ④ perfect: 완벽한`,tip:`partial = 부분적인 ↔ complete = 완전한`}},
{id:4,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`emerges from`,`separates from`,`escapes from`,`lies within`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow __________ each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`특정한 색이나 크기가 없지만, 어떻게든 우리가 보는 모든 삼각형 <b>안에 존재한다(lies within)</b>.`,analysis:`✅ ④ lies within: 안에 존재하다 → 원문 일치\n❌ ① emerges from: ~에서 나타나다\n❌ ② separates from: ~에서 분리되다\n❌ ③ escapes from: ~에서 벗어나다`,tip:`lie within = exist inside = 내재하다`}},
{id:5,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`beautiful`,accept:[`beautiful`,`Beautiful`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every __________ (beauty) thing you see.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`모든 <b>아름다운(beautiful)</b> 것 안에 미의 형상이 존재한다. 명사 thing을 수식하는 형용사 필요.`,analysis:`beauty(명사) → beautiful(형용사): 명사 앞 수식어 자리`,tip:`beauty(명사) → beautiful(형용사) → beautifully(부사)`}},
{id:6,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`reflection`,accept:[`reflection`,`Reflection`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial __________ (reflect) of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`진정한 아름다움의 부분적인 <b>반영(reflection)</b>을 보는 것이다. 관사 a + 형용사 partial 뒤 → 명사 필요`,analysis:`reflect(동사) → reflection(명사): a partial _____ → 명사 자리`,tip:`reflect(동사) → reflection(명사): -tion 접미사로 명사화`}},
{id:7,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`drawings`,accept:[`drawings`,`Drawings`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make __________ (draw) of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`숫자 5의 <b>그림들(drawings)</b>을 그릴 수 있다. 복수 명사 필요.`,analysis:`draw(동사) → drawings(복수명사): make + 목적어(복수) 구조`,tip:`draw → drawing(그림, 명사) → drawings(복수)`}},
{id:8,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:4,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Plato ①<u>argued</u> that when you see something that strikes you as beautiful, you are really just seeing a ②<u>partial</u> reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no ③<u>particular</u> color, shape, or size. Rather, it is an ④<u>abstract</u> idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty ⑤<u>always</u> lies within each and every beautiful thing you see.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`원문은 <b>somehow(어떻게든)</b>이다. ⑤ always(항상)는 somehow과 의미가 다르다. somehow은 불확실성을 내포하지만 always는 확정적.`,analysis:`❌ ⑤ always(항상): 원문은 'somehow(어떻게든)' → 뉘앙스 부적절\n✅ ① argued: 주장했다 → 적절\n✅ ② partial: 부분적인 → 적절\n✅ ③ particular: 특정한 → 적절\n✅ ④ abstract: 추상적인 → 적절`,tip:`somehow(어떻게든, 불확실) ≠ always(항상, 확정적)`}},
{id:9,type:`문맥상 부적절한 어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is an ①<u>abstract</u> idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is ②<u>all</u> of those things. It has no ③<u>physical</u> form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow ④<u>lies within</u> each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every ⑤<u>beautiful</u> thing you see.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`숫자 5 자체는 그런 것들 중 <b>아무것도 아니다(none)</b>. ② all(모든)은 none의 반의어로 부적절.`,analysis:`❌ ② all(모든): 원문은 'none(아무것도 아닌)' → 부적절\n✅ ① abstract: 추상적인 → 적절\n✅ ③ physical: 물리적인 → 적절\n✅ ④ lies within: 내재하다 → 적절\n✅ ⑤ beautiful: 아름다운 → 적절`,tip:`none(아무것도 아닌) ↔ all(모든) — 핵심 반의어`}},
{id:10,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`claimed`,`denied`,`questioned`,`forgot`],passage:`Plato <u>argued</u> that when you see something beautiful...`,stem:`밑줄 친 <b>argued</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`argued = 주장했다, claimed = 주장했다 → 동의어`,analysis:`✅ ① claimed: 주장했다 → argued의 동의어\n❌ ② denied: 부정했다\n❌ ③ questioned: 질문했다\n❌ ④ forgot: 잊었다`,tip:`argue = claim = assert = contend = 주장하다`}},
{id:11,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`tangible`,`visible`,`conceptual`,`measurable`],passage:`Rather, it is a(n) <u>abstract</u> idea, like the number five.`,stem:`밑줄 친 <b>abstract</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`abstract = 추상적인, conceptual = 개념적인 → 유사어`,analysis:`✅ ③ conceptual: 개념적인 → abstract의 유사어\n❌ ① tangible: 만질 수 있는 → 반의어\n❌ ② visible: 눈에 보이는\n❌ ④ measurable: 측정 가능한`,tip:`abstract = conceptual = theoretical ↔ tangible = concrete`}},
{id:12,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`incomplete`,`fractional`,`whole`,`limited`],passage:`You are really just seeing a <u>partial</u> reflection of true beauty.`,stem:`밑줄 친 <b>partial</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`partial = 부분적인 ↔ whole = 전체의`,analysis:`❌ ③ whole(전체의): partial의 반의어 → 가장 먼 의미\n✅ ① incomplete: 불완전한 → 유사어\n✅ ② fractional: 부분적인 → 동의어\n✅ ④ limited: 제한된 → 유사어`,tip:`partial ↔ whole = complete = entire = total`}},
{id:13,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`intangible`,`concrete`,`immaterial`,`invisible`],passage:`Rather, it is a(n) <u>abstract</u> idea.`,stem:`밑줄 친 <b>abstract</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`abstract = 추상적인 ↔ concrete = 구체적인`,analysis:`❌ ② concrete(구체적인): abstract의 반의어 → 가장 먼 의미\n✅ ① intangible: 무형의 → 유사어\n✅ ③ immaterial: 비물질적 → 유사어\n✅ ④ invisible: 보이지 않는 → 유사어`,tip:`abstract ↔ concrete = tangible = 구체적/유형의`}},
{id:14,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`argued`,`captures`,`strikes`,`reflection`],passage:`<i>an image or representation of something; the process of sending back light, heat, or sound from a surface</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`무언가의 이미지 또는 표현; 표면에서 빛, 열, 소리를 되돌리는 과정 → <b>reflection(반영, 반사)</b>`,analysis:`✅ ④ reflection: 반영/반사 → 영영 정의와 일치\n❌ ① argued: 주장했다\n❌ ② captures: 포착하다\n❌ ③ strikes: 치다/인상을 주다`,tip:`reflection = 반영, 반사, 성찰 (다의어)`}},
{id:15,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`particular`,`abstract`,`physical`,`partial`],passage:`<i>used to single out an individual member of a specified group or class; specific rather than general</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`특정 집단의 개별 구성원을 지칭; 일반적이 아닌 특정한 → <b>particular(특정한)</b>`,analysis:`✅ ① particular: 특정한 → 영영 정의와 일치\n❌ ② abstract: 추상적인\n❌ ③ physical: 물리적인\n❌ ④ partial: 부분적인`,tip:`particular = specific = certain = 특정한`}},
{id:16,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`형태, 모습`,`양식, 서류`,`형성하다`,`반, 학급`],passage:`It has no physical <u>form</u>.`,stem:`밑줄 친 <b>form</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`물리적 <b>형태(form)</b>가 없다 → 모양/형태의 의미`,analysis:`✅ ① 형태, 모습: physical form = 물리적 형태\n❌ ② 양식, 서류: application form\n❌ ③ 형성하다: 동사적 용법\n❌ ④ 반, 학급: 영국식 영어`,tip:`form: 형태(명사) / 양식(명사) / 형성하다(동사) / 학급(명사)`}},
{id:17,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`partial — abstract — physical`,`complete — abstract — physical`,`partial — concrete — physical`,`partial — abstract — mental`,`complete — concrete — mental`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a <b>(A)</b> reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) <b>(B)</b> idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no <b>(C)</b> form. Think of the idea of a triangle, for example. Although it has no particular color or size, it somehow lies within each and every triangle you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`<b>부분적인(partial)</b> 반영, <b>추상적인(abstract)</b> 관념, <b>물리적(physical)</b> 형태가 없다.`,analysis:`✅ ① partial — abstract — physical: 원문 일치\n❌ ② complete: partial의 반의어\n❌ ③ concrete: abstract의 반의어\n❌ ④ mental: physical과 다른 의미\n❌ ⑤ complete/concrete/mental: 모두 부적절`,tip:`partial(부분적), abstract(추상적), physical(물리적) — 지문 핵심 3어휘`}},
{id:18,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`painting`,`photograph`,`sculpture`,`triangle`],passage:`Plato argued that when you see something that strikes you as beautiful, you are really just seeing a partial reflection of true beauty, just as a painting or even a photograph only captures part of the real thing. True beauty, or what Plato calls the Form of Beauty, has no particular color, shape, or size. Rather, it is a(n) abstract idea, like the number five. You can make drawings of the number five in blue or red ink, big or small, but the number five itself is none of those things. It has no physical form. Think of the idea of a __________, for example. Although it has no particular color or size, it somehow lies within each and every one you see. Plato thought the same was true of beauty. The Form of Beauty somehow lies within each and every beautiful thing you see.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`예를 들어, <b>삼각형(triangle)</b>의 개념을 생각해보라.`,analysis:`✅ ④ triangle: 삼각형 → 원문 일치\n❌ ① painting: 그림 → 앞부분 비유\n❌ ② photograph: 사진 → 앞부분 비유\n❌ ③ sculpture: 조각 → 언급 없음`,tip:`triangle은 abstract idea의 두 번째 예시 (첫 번째: number five)`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`beauty is only found in physical objects with color and shape`,`the number five changes depending on how you draw it`,`the Form of Beauty exists within every beautiful thing we see`,`Plato believed beauty could be measured by size and color`],passage:FULL_PASSAGE,stem:`다음 글의 요지로 가장 적절한 것은?`,det:{korean:`플라톤은 미(美)의 형상이 모든 아름다운 것 안에 <b>내재한다</b>고 주장했다.`,analysis:`✅ ③ the Form of Beauty exists within every beautiful thing we see: 핵심 요지\n❌ ① 물리적 대상에서만 발견: 본문과 반대\n❌ ② 숫자 5가 그림에 따라 변한다: 본문과 반대 (none of those things)\n❌ ④ 크기와 색으로 측정: 본문과 반대 (no particular color, shape, or size)`,tip:`마지막 문장이 핵심: The Form of Beauty somehow lies within each and every beautiful thing`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`physical objects perfectly represent the Form of Beauty`,`beautiful things are imperfect reflections of an ideal Form`,`drawings of numbers are more real than numbers themselves`,`triangles prove that beauty must have color and size`],passage:FULL_PASSAGE,stem:`다음 글에서 플라톤의 주장을 가장 잘 요약한 것은?`,det:{korean:`아름다운 것들은 이상적 형상(Form)의 <b>불완전한 반영(imperfect reflections)</b>이다.`,analysis:`✅ ② beautiful things are imperfect reflections of an ideal Form: partial reflection 개념 요약\n❌ ① perfectly represent: partial이므로 모순\n❌ ③ drawings more real: 본문과 반대\n❌ ④ beauty must have color and size: 본문과 반대`,tip:`partial reflection = imperfect reflection — 핵심 개념 paraphrase`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;const mk5='①②③④⑤',mk4='①②③④';const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={t:0,o:0,w:[]};typeMap[t].t++;if(d.ok)typeMap[t].o++;else typeMap[t].w.push(d.q.id);});
let txt=`📖 온라인워크북 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
