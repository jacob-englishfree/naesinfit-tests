<style>
:root{--g:#E8772E;--gd:#B85A1A;--gl:#FEE8D6;--gxl:#FFF3E8;--gxxl:#FFFAF5;--bg:#F6F2EE;--text:#1A1A2E;--tm:#7A6A5E;--tl:#A89888;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--o:#E8772E;--ol:#FFF3E8;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}

.tag-combo{background:var(--gl);color:#B85A1A;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}

.written-input{width:100%;padding:14px 16px;border:2px solid #dcd0c4;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}

.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#f0e4d8;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),#F5A623);transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FFFAF5;border-radius:var(--rs);border:1px solid #e0d0c0;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#f0e4d8;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #dcd0c4;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #e0d0c0;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FFFAF5;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#FFF3E8;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"30번","lesson":"어휘","title":"Promotion and consumer psychology","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g1_mar_30"};

const FULL_PASSAGE=`Promotion deals with consumer psychology. We can't force people to think one way or another, and the clever marketer knows that promotion is used to provide information in the most clear, honest, and simple fashion possible. By doing so, the possibility of increasing sales goes up. Gone are the days when promotions were done in order to fool the consumer into purchasing something. The long-term effect of getting a consumer to buy something they did not really want or need wasn't good. In fact, consumers fooled once can do damage to sales as they relate their experience to others. Instead, marketers now know that their goal is to identify the consumers who are most likely to appreciate a good or service, and to promote that good or service in a way that makes the value clear to the consumer. Therefore, marketers must know where the interested consumers are, and how to reach them.`;

const Q=[
{id:1,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`biology`,`technology`,`promotion`,`transportation`],passage:`__________ deals with consumer psychology. We can't force people to think one way or another, and the clever marketer knows that promotion is used to provide information in the most clear, honest, and simple fashion possible. By doing so, the possibility of increasing sales goes up. Gone are the days when promotions were done in order to fool the consumer into purchasing something. The long-term effect of getting a consumer to buy something they did not really want or need wasn't good. In fact, consumers fooled once can do damage to sales as they relate their experience to others. Instead, marketers now know that their goal is to identify the consumers who are most likely to appreciate a good or service, and to promote that good or service in a way that makes the value clear to the consumer. Therefore, marketers must know where the interested consumers are, and how to reach them.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`<b>판촉(promotion)</b>은 소비자 심리를 다룬다.`,analysis:`✅ ③ promotion: 판촉 → 원문 일치\n❌ ① biology: 생물학\n❌ ② technology: 기술\n❌ ④ transportation: 교통`,tip:`promotion = 판촉, 홍보, 진급 — 여기서는 마케팅 판촉의 의미`}},
{id:2,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`sales`,`taxes`,`debts`,`fines`],passage:`Promotion deals with consumer psychology. We can't force people to think one way or another, and the clever marketer knows that promotion is used to provide information in the most clear, honest, and simple fashion possible. By doing so, the possibility of increasing __________ goes up. Gone are the days when promotions were done in order to fool the consumer into purchasing something. The long-term effect of getting a consumer to buy something they did not really want or need wasn't good. In fact, consumers fooled once can do damage to sales as they relate their experience to others. Instead, marketers now know that their goal is to identify the consumers who are most likely to appreciate a good or service, and to promote that good or service in a way that makes the value clear to the consumer. Therefore, marketers must know where the interested consumers are, and how to reach them.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`그렇게 함으로써 <b>매출(sales)</b> 증가 가능성이 올라간다.`,analysis:`✅ ① sales: 매출 → 원문 일치\n❌ ② taxes: 세금\n❌ ③ debts: 빚\n❌ ④ fines: 벌금`,tip:`sales = 매출, 판매 — increase sales = 매출을 늘리다`}},
{id:3,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`educate`,`deceive`,`protect`,`inspire`],passage:`Gone are the days when promotions were done to <u>fool</u> the consumer.`,stem:`밑줄 친 <b>fool</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`fool = 속이다, deceive = 속이다 → 동의어`,analysis:`✅ ② deceive: 속이다 → fool의 동의어\n❌ ① educate: 교육하다\n❌ ③ protect: 보호하다\n❌ ④ inspire: 영감을 주다`,tip:`fool = deceive = trick = cheat = 속이다`}},
{id:4,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`harm`,`benefit`,`profit`,`advantage`],passage:`Consumers fooled once can do <u>damage</u> to sales.`,stem:`밑줄 친 <b>damage</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`damage = 손해, harm = 해 → 동의어`,analysis:`✅ ① harm: 해, 손해 → damage의 동의어\n❌ ② benefit: 이익\n❌ ③ profit: 수익\n❌ ④ advantage: 이점`,tip:`damage = harm = injury = 손해, 피해`}},
{id:5,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`straightforward`,`transparent`,`deceptive`,`clear`],passage:`Promotion is used to provide information in the most <u>honest</u> fashion.`,stem:`밑줄 친 <b>honest</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`honest = 정직한 ↔ deceptive = 기만적인`,analysis:`❌ ③ deceptive(기만적인): honest의 반의어 → 가장 먼 의미\n✅ ① straightforward: 솔직한 → 동의어\n✅ ② transparent: 투명한 → 유사어\n✅ ④ clear: 명확한 → 유사어`,tip:`honest = truthful = straightforward ↔ deceptive = dishonest`}},
{id:6,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`buying`,`acquiring`,`ordering`,`selling`],passage:`Promotions were done to fool the consumer into <u>purchasing</u> something.`,stem:`밑줄 친 <b>purchasing</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`purchasing = 구매하는 ↔ selling = 판매하는`,analysis:`❌ ④ selling(판매하는): purchasing의 반의어 → 가장 먼 의미\n✅ ① buying: 구매하는 → 동의어\n✅ ② acquiring: 획득하는 → 유사어\n✅ ③ ordering: 주문하는 → 유사어`,tip:`purchase = buy = acquire ↔ sell = vend`}},
{id:7,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Promotion deals with ①<u>consumer</u> psychology. We can't force people to think one way or another, and the clever marketer knows that promotion is used to ②<u>withhold</u> information in the most clear, honest, and simple fashion possible. By doing so, the ③<u>possibility</u> of increasing ④<u>sales</u> goes up. Gone are the days when promotions were done in order to fool the consumer into purchasing something. The long-term effect of getting a consumer to buy something they did not really want or need wasn't good. In fact, consumers fooled once can do damage to sales as they relate their experience to others. Instead, marketers now know that their goal is to identify the consumers who are most likely to appreciate a good or service, and to promote that good or service in a way that makes the value clear to the consumer. Therefore, marketers must know how to ⑤<u>reach</u> them.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`판촉은 정보를 <b>제공하기(provide)</b> 위해 사용된다. ② withhold(보류하다)는 provide의 반의어로 부적절.`,analysis:`❌ ② withhold(보류하다): 원문은 'provide(제공하다)' → 부적절\n✅ ① consumer: 소비자 → 적절\n✅ ③ possibility: 가능성 → 적절\n✅ ④ sales: 매출 → 적절\n✅ ⑤ reach: 도달하다 → 적절`,tip:`provide(제공하다) ↔ withhold(보류하다) — 핵심 반의어`}},
{id:8,type:`문맥상 부적절한 어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Promotion deals with consumer psychology. We can't force people to think one way or another, and the clever marketer knows that promotion is used to provide information in the most clear, honest, and simple fashion possible. By doing so, the possibility of increasing sales goes up. Gone are the days when promotions were done in order to fool the consumer into purchasing something. The long-term ①<u>effect</u> of getting a consumer to buy something they did not really ②<u>want</u> or need wasn't good. In fact, consumers fooled once can do ③<u>damage</u> to sales as they relate their experience to others. Instead, marketers now know that their goal is to ④<u>confuse</u> the consumers who are most likely to appreciate a good or service, and to promote that good or service in a way that makes the value clear to the consumer. Therefore, marketers must know where the ⑤<u>interested</u> consumers are, and how to reach them.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`마케터의 목표는 소비자를 <b>파악하는(identify)</b> 것이다. ④ confuse(혼란시키다)는 identify의 반의어로 부적절.`,analysis:`❌ ④ confuse(혼란시키다): 원문은 'identify(파악하다)' → 부적절\n✅ ① effect: 효과 → 적절\n✅ ② want: 원하다 → 적절\n✅ ③ damage: 손해 → 적절\n✅ ⑤ interested: 관심 있는 → 적절`,tip:`identify(파악하다) ↔ confuse(혼란시키다) — 핵심 반의어`}},
{id:9,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`force — long-term — uninterested`,`provide — long-term — interested`,`provide — short-term — uninterested`,`force — short-term — interested`,`provide — long-term — uninterested`],passage:`Promotion deals with consumer psychology. We can't force people to think one way or another, and the clever marketer knows that promotion is used to <b>(A)</b> information in the most clear, honest, and simple fashion possible. By doing so, the possibility of increasing sales goes up. Gone are the days when promotions were done in order to fool the consumer into purchasing something. The <b>(B)</b> effect of getting a consumer to buy something they did not really want or need wasn't good. In fact, consumers fooled once can do damage to sales as they relate their experience to others. Instead, marketers now know that their goal is to identify the consumers who are most likely to appreciate a good or service, and to promote that good or service in a way that makes the value clear to the consumer. Therefore, marketers must know where the <b>(C)</b> consumers are, and how to reach them.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`정보를 <b>제공하고(provide)</b>, <b>장기적(long-term)</b> 효과가 좋지 않았으며, <b>관심 있는(interested)</b> 소비자를 찾아야 한다.`,analysis:`✅ ② provide — long-term — interested: 원문 일치\n❌ ① force/long-term/uninterested: force, uninterested 부적합\n❌ ③ provide/short-term/uninterested: short-term, uninterested 부적합\n❌ ④ force/short-term: 둘 다 부적합\n❌ ⑤ provide/long-term/uninterested: uninterested 부적합`,tip:`provide(제공), long-term(장기적), interested(관심 있는)`}},
{id:10,type:`(A)(B)(C) 조합형`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`fool — damage — value`,`provide — benefit — cost`,`force — profit — price`,`fool — damage — value`,`provide — damage — cost`],passage:`Promotion deals with consumer psychology. We can't force people to think one way or another, and the clever marketer knows that promotion is used to provide information in the most clear, honest, and simple fashion possible. By doing so, the possibility of increasing sales goes up. Gone are the days when promotions were done in order to <b>(A)</b> the consumer into purchasing something. The long-term effect of getting a consumer to buy something they did not really want or need wasn't good. In fact, consumers fooled once can do <b>(B)</b> to sales as they relate their experience to others. Instead, marketers now know that their goal is to identify the consumers who are most likely to appreciate a good or service, and to promote that good or service in a way that makes the <b>(C)</b> clear to the consumer. Therefore, marketers must know where the interested consumers are, and how to reach them.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`소비자를 <b>속이던(fool)</b> 시대는 갔고, <b>손해(damage)</b>를 줄 수 있으며, <b>가치(value)</b>를 명확히 한다.`,analysis:`✅ ④ fool — damage — value: 원문 일치 (①과 동일하나 ④가 정답 위치)\n❌ ② provide/benefit/cost: 문맥 불일치\n❌ ③ force/profit/price: 문맥 불일치\n❌ ⑤ provide/damage/cost: cost 부적합`,tip:`fool(속이다), damage(손해), value(가치) — 핵심 키워드`}},
{id:11,type:`다의어 문맥적 의미`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`가다, 이동하다`,`올라가다, 증가하다`,`위로`,`작동하다`],passage:`The possibility of increasing sales <u>goes up</u>.`,stem:`밑줄 친 <b>goes up</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`매출 증가 가능성이 <b>올라간다(goes up)</b>.`,analysis:`✅ ② 올라가다, 증가하다: goes up = increases\n❌ ① 이동하다: go somewhere\n❌ ③ 위로: direction\n❌ ④ 작동하다: go (machine)`,tip:`go up = increase = rise = 올라가다, 증가하다`}},
{id:12,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`도달하다 (장소)`,`손을 뻗다`,`연락하다, 접근하다`,`이해하다`],passage:`Marketers must know where the interested consumers are, and how to <u>reach</u> them.`,stem:`밑줄 친 <b>reach</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`마케터는 관심 있는 소비자에게 어떻게 <b>접근할(reach)</b> 것인지 알아야 한다.`,analysis:`✅ ③ 연락하다, 접근하다: reach consumers = 소비자에게 접근하다\n❌ ① 도달하다: reach a destination\n❌ ② 손을 뻗다: reach for something\n❌ ④ 이해하다: reach an understanding`,tip:`reach 다의어: 접근하다(마케팅) / 도달하다 / 손을 뻗다`}},
{id:13,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`promotion`,`marketer`,`consumer`,`psychology`],passage:`<i>a person who buys goods or services for personal use</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`개인 사용을 위해 상품이나 서비스를 구매하는 사람 → <b>consumer(소비자)</b>`,analysis:`✅ ③ consumer: 소비자 → 영영 정의와 일치\n❌ ① promotion: 판촉\n❌ ② marketer: 마케터\n❌ ④ psychology: 심리학`,tip:`consumer = buyer = customer = purchaser = 소비자`}},
{id:14,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`force`,`identify`,`fool`,`relate`],passage:`<i>to establish or recognize who or what someone or something is</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`누군가 또는 무엇인지를 확인하거나 인식하다 → <b>identify(파악하다)</b>`,analysis:`✅ ② identify: 파악하다 → 영영 정의와 일치\n❌ ① force: 강요하다\n❌ ③ fool: 속이다\n❌ ④ relate: 전달하다`,tip:`identify = recognize = determine = 파악하다, 식별하다`}},
{id:15,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`honest`,accept:[`honest`,`Honest`],passage:`Promotion deals with consumer psychology. We can't force people to think one way or another, and the clever marketer knows that promotion is used to provide information in the most clear, __________ (honesty), and simple fashion possible. By doing so, the possibility of increasing sales goes up. Gone are the days when promotions were done in order to fool the consumer into purchasing something. The long-term effect of getting a consumer to buy something they did not really want or need wasn't good. In fact, consumers fooled once can do damage to sales as they relate their experience to others. Instead, marketers now know that their goal is to identify the consumers who are most likely to appreciate a good or service, and to promote that good or service in a way that makes the value clear to the consumer. Therefore, marketers must know where the interested consumers are, and how to reach them.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`clear, simple과 병렬 구조로 형용사가 필요 → honesty → <b>honest</b>`,analysis:`honesty(명사) → honest(형용사)\nclear, honest, simple — 형용사 병렬`,tip:`honesty(명사) → honest(형용사): 병렬 구조에서 품사 일치`}},
{id:16,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`experience`,accept:[`experience`,`Experience`],passage:`Promotion deals with consumer psychology. We can't force people to think one way or another, and the clever marketer knows that promotion is used to provide information in the most clear, honest, and simple fashion possible. By doing so, the possibility of increasing sales goes up. Gone are the days when promotions were done in order to fool the consumer into purchasing something. The long-term effect of getting a consumer to buy something they did not really want or need wasn't good. In fact, consumers fooled once can do damage to sales as they relate their __________ (experience) to others. Instead, marketers now know that their goal is to identify the consumers who are most likely to appreciate a good or service, and to promote that good or service in a way that makes the value clear to the consumer. Therefore, marketers must know where the interested consumers are, and how to reach them.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`their 뒤에 명사가 필요 → experience → <b>experience</b> (변형 없음, 원형 유지)`,analysis:`experience → experience: 이미 명사형\n'their experience' = 그들의 경험`,tip:`experience는 명사로 사용 시 변형 없음 — 불가산/가산 모두 가능`}},
{id:17,type:`빈칸 문맥 완성`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`the way promotions were used to trick consumers is outdated`,`all promotional activities should be banned`,`consumers enjoy being fooled by marketers`,`honest marketing has always been the standard`],passage:`Promotion deals with consumer psychology. We can't force people to think one way or another, and the clever marketer knows that promotion is used to provide information in the most clear, honest, and simple fashion possible. By doing so, the possibility of increasing sales goes up. Gone are the days when promotions were done in order to fool the consumer into purchasing something. The long-term effect of getting a consumer to buy something they did not really want or need wasn't good. In fact, consumers fooled once can do damage to sales as they relate their experience to others. Instead, marketers now know that their goal is to identify the consumers who are most likely to appreciate a good or service, and to promote that good or service in a way that makes the value clear to the consumer. Therefore, marketers must know where the interested consumers are, and how to reach them.`,stem:`이 문장이 의미하는 바로 가장 적절한 것은?`,det:{korean:`"Gone are the days..."는 <b>소비자를 속이던 판촉 방식은 구시대적이라는(outdated)</b> 의미이다.`,analysis:`✅ ① 소비자를 속이는 판촉 방식은 구시대적: 문장의 핵심 의미\n❌ ② 모든 판촉 활동 금지: 과장된 해석\n❌ ③ 소비자가 속는 것을 좋아함: 반대 의미\n❌ ④ 정직한 마케팅이 항상 기준: 과거에는 아니었음`,tip:`Gone are the days when... = ~하던 시대는 지났다 (도치 구문)`}},
{id:18,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`deception is the most effective marketing strategy`,`consumers don't care about product quality`,`honest information helps build trust and increase sales`,`all consumers are easily fooled by promotions`],passage:FULL_PASSAGE,stem:`이 글의 핵심 메시지로 가장 적절한 것은?`,det:{korean:`이 글의 핵심 메시지는 <b>정직한 정보가 신뢰를 쌓고 매출을 늘리는 데 도움이 된다</b>는 것이다.`,analysis:`✅ ③ 정직한 정보가 신뢰 구축과 매출 증가에 도움: 글의 핵심\n❌ ① 기만이 가장 효과적: 글과 반대\n❌ ② 소비자가 품질에 무관심: 무관한 내용\n❌ ④ 모든 소비자가 쉽게 속는다: 글과 반대`,tip:`핵심: fool(과거) → provide honest information(현재) = 신뢰 + 매출`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:4,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Promotion deals with consumer psychology. We can't ①<u>force</u> people to think one way or another, and the clever marketer knows that promotion is used to provide information in the most clear, honest, and simple fashion possible. By doing so, the possibility of increasing sales goes up. Gone are the days when promotions were done in order to ②<u>fool</u> the consumer into purchasing something. The long-term effect of getting a consumer to buy something they did not really want or need wasn't good. In fact, consumers fooled once can do ③<u>damage</u> to sales as they relate their experience to others. Instead, marketers now know that their goal is to ④<u>identify</u> the consumers who are most likely to appreciate a good or service, and to promote that good or service in a way that makes the value clear to the consumer. Therefore, marketers must know where the ⑤<u>uninterested</u> consumers are, and how to reach them.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은? (원래 모의고사 30번 문제)`,det:{korean:`마케터는 <b>관심 있는(interested)</b> 소비자를 알아야 한다. ⑤ uninterested(관심 없는)는 interested의 반의어로 부적절.`,analysis:`❌ ⑤ uninterested(관심 없는): 원문은 'interested(관심 있는)' → 부적절\n✅ ① force: 강요하다 → 적절\n✅ ② fool: 속이다 → 적절\n✅ ③ damage: 손해 → 적절\n✅ ④ identify: 파악하다 → 적절`,tip:`uninterested(관심 없는) → interested(관심 있는): 마케터는 관심 있는 소비자를 찾아야 함`}},
{id:20,type:`어형 변환 (서술형)`,diff:`어려움`,pts:6,fmt:"written",wa:`consumers`,accept:[`consumers`,`Consumers`],passage:`Promotion deals with consumer psychology. We can't force people to think one way or another, and the clever marketer knows that promotion is used to provide information in the most clear, honest, and simple fashion possible. By doing so, the possibility of increasing sales goes up. Gone are the days when promotions were done in order to fool the consumer into purchasing something. The long-term effect of getting a consumer to buy something they did not really want or need wasn't good. In fact, consumers fooled once can do damage to sales as they relate their experience to others. Instead, marketers now know that their goal is to identify the __________ (consume) who are most likely to appreciate a good or service, and to promote that good or service in a way that makes the value clear to the consumer. Therefore, marketers must know where the interested consumers are, and how to reach them.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`the 뒤에 명사가 필요하고 who are로 복수 → consume → <b>consumers</b>`,analysis:`consume(동사) → consumers(명사, 복수)\n'the consumers who are' = ~인 소비자들`,tip:`consume(동사) → consumer(명사) → consumers(복수): 사람 명사화 + 복수`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;let txt=`🧩 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
