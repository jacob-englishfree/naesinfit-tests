<style>
:root{--g:#7C3AED;--gd:#5B21B6;--gl:#EDE9FE;--gxl:#F3F0FF;--gxxl:#FAF5FF;--bg:#F5F3FF;--text:#1A1A2E;--tm:#6B5B8A;--tl:#9B8DB8;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--o:#F59E0B;--ol:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--g),#6D28D9);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--g);border-radius:50%;}

.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{max-width:820px;margin:0 auto;padding:24px 20px 100px;}

.tag-grammar{background:var(--gl);color:#5B21B6;}.tag-vocab{background:#FCE4EC;color:#C2185B;}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-written{background:#FFF3E0;color:#E65100;}.tag-content{background:var(--bl);color:var(--b);}.tag-tf{background:var(--ol);color:#B45309;}

.written-input{width:100%;padding:14px 16px;border:2px solid #d0c8dc;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}

.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,#EDE9FE,#DDD6FE);}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--g),#8B5CF6);color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}

.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8e0f0;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),#A78BFA);transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FDFAFF;border-radius:var(--rs);border:1px solid #d8d0e8;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0f0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0c8dc;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #d8d0e8;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FDFAFF;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F5F0FF;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

const EI={"subject":"2025 고1 3월 모의고사","pub":"23번","lesson":"주제","title":"동기부여에서 관계의 중요성","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_2025_g1_mar_23"};

const FULL_PASSAGE=`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power — we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`;

const Q=[
{id:1,type:`어법 선택`,diff:`쉬움`,pts:3,fmt:"mc",ans:0,ch:[`perceived`,`perceiving`,`perceive`,`to perceive`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are __________ as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`다음 빈칸에 들어갈 어법상 가장 적절한 것은?`,det:{korean:`부모와 교사가 관여하고 배려하는 것으로 <b>인식될(perceived)</b> 때 → 수동태`,analysis:`✅ ① perceived: 수동태(are perceived) — 인식되다\n❌ ② perceiving: 능동 — 주어가 인식하는 것이 아님\n❌ ③ perceive: 동사원형 — be 뒤에 원형 불가\n❌ ④ to perceive: 부정사 — 문맥 부적절`,tip:`be perceived as = ~으로 인식되다 (수동태)`}},
{id:2,type:`어법 선택`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`value`,`valued`,`valuing`,`to value`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel __________ and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`다음 빈칸에 들어갈 어법상 가장 적절한 것은?`,det:{korean:`동료에게 <b>가치 있게 여겨지는(valued)</b> 느낌이 필요하다 → 과거분사`,analysis:`✅ ② valued: 과거분사 — feel + p.p. (감정 수동)\n❌ ① value: 동사원형 — feel 뒤에 부적절\n❌ ③ valuing: 현재분사 — 능동이므로 부적절\n❌ ④ to value: 부정사 — 문맥 부적절`,tip:`feel + p.p.: 감정의 수동 표현 (feel valued = 가치 있게 느끼다)`}},
{id:3,type:`어법 선택`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`provide`,`provides`,`provided`,`providing`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, __________ that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`다음 빈칸에 들어갈 어법상 가장 적절한 것은?`,det:{korean:`자율성과 능력에 대한 지원이 있다면 → <b>provided that</b> = if (조건 접속사)`,analysis:`✅ ③ provided: provided that = ~라는 조건 하에\n❌ ① provide: 동사원형 — 접속사 역할 불가\n❌ ② provides: 3인칭 동사 — 접속사 아님\n❌ ④ providing: providing that도 가능하지만 보기에서 provided가 더 적절`,tip:`provided (that) = on condition that = if = ~라면`}},
{id:4,type:`어법 선택`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`from which`,`which from`,`from that`,`that from`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis __________ to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`다음 빈칸에 들어갈 어법상 가장 적절한 것은?`,det:{korean:`시작할 <b>기반(from which)</b> → 전치사+관계대명사`,analysis:`✅ ① from which: 전치사+관계대명사 — begin from a basis\n❌ ② which from: 어순 오류\n❌ ③ from that: that은 전치사 뒤에 올 수 없음\n❌ ④ that from: 문법적으로 부적절`,tip:`전치사+관계대명사: from which = which ~ from`}},
{id:5,type:`어휘 문맥`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`내면화`,`동기부여`,`경쟁`,`독립`],passage:`When the need for relatedness is met, <u>motivation</u> and internalization are fueled.`,stem:`밑줄 친 <b>motivation</b>의 의미로 가장 적절한 것은?`,det:{korean:`motivation = <b>동기부여</b>`,analysis:`✅ ② 동기부여: motivation의 정확한 번역\n❌ ① 내면화: internalization\n❌ ③ 경쟁: competition\n❌ ④ 독립: independence`,tip:`motivation = 동기, 동기부여`}},
{id:6,type:`어휘 문맥`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`자율성`,`권위`,`복종`,`통제`],passage:`Provided that support for <u>autonomy</u> and competence are also there.`,stem:`밑줄 친 <b>autonomy</b>의 의미로 가장 적절한 것은?`,det:{korean:`autonomy = <b>자율성</b>`,analysis:`✅ ① 자율성: autonomy의 정확한 번역\n❌ ② 권위: authority\n❌ ③ 복종: obedience\n❌ ④ 통제: control`,tip:`autonomy = 자율성, 자치 — auto(스스로) + nomy(법칙)`}},
{id:7,type:`빈칸 추론`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`authority and control`,`competition and rivalry`,`independence and isolation`,`connection and belonging`],passage:FULL_PASSAGE,stem:`The passage emphasizes that motivation is strongly linked to __________.`,det:{korean:`본문은 동기부여가 <b>연결과 소속감</b>에 강하게 연결되어 있음을 강조한다.`,analysis:`✅ ④ connection and belonging: relatedness, connectedness와 일치\n❌ ① authority and control: 권위와 통제 강조 아님\n❌ ② competition: 경쟁 언급 없음\n❌ ③ isolation: 반대`,tip:`relatedness + connectedness = connection and belonging`}},
{id:8,type:`빈칸 추론`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`establishing strict rules and guidelines`,`forming supportive and caring relationships`,`offering financial incentives and rewards`,`providing competitive environments`],passage:FULL_PASSAGE,stem:`According to the author, the first step in motivating others should be __________.`,dem:`다음 빈칸에 가장 적절한 것은?`,det:{korean:`타인을 동기부여하려면 먼저 <b>지지적이고 배려하는 관계를 형성</b>해야 한다.`,analysis:`✅ ② forming supportive and caring relationships: "a caring relationship is a crucial basis from which to begin"\n❌ ① strict rules: 언급 없음\n❌ ③ financial incentives: 언급 없음\n❌ ④ competitive environments: 언급 없음`,tip:`"a crucial basis from which to begin" = 시작의 핵심 기반`}},
{id:9,type:`서술형 영작`,diff:`보통`,pts:5,fmt:"written",wa:`persistence`,accept:[`persistence`,`Persistence`],passage:`연결감을 강화하는 것은 장기적 __________에 중요하다.`,stem:`다음 한국어에 해당하는 영어 단어를 쓰시오. (지속, 인내)`,det:{korean:`지속, 인내 = <b>persistence</b>`,analysis:`persistence: 지속, 인내\n원문: "crucial to long-term persistence"`,tip:`persist(지속하다) → persistence(지속, 인내)`}},
{id:10,type:`서술형 영작`,diff:`어려움`,pts:6,fmt:"written",wa:`connectedness`,accept:[`connectedness`,`Connectedness`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of __________ to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`다음 빈칸에 들어갈 단어를 쓰시오.`,det:{korean:`타인에 대한 <b>연결감(connectedness)</b>을 강화하는 것`,analysis:`connectedness: 연결감\nconnected(연결된) + -ness = 명사`,tip:`connected → connectedness: 형용사 + -ness = 명사`}},
{id:11,type:`내용 일치`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`권력 있는 사람의 인정만이 동기부여에 영향을 준다`,`동료와 동업자에게 가치 있게 여겨지는 것도 중요하다`,`자율성만 있으면 동기부여가 충분하다`,`운동은 동기부여와 관련이 없다`],passage:FULL_PASSAGE,stem:`위 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`"it is not just those people with power — we need to feel valued and respected by peers and coworkers" → <b>동료에게 가치 있게 여겨지는 것도 중요</b>`,analysis:`✅ ② 동료에게 가치 있게 여겨지는 것도 중요: 원문과 일치\n❌ ① 권력 있는 사람만: "not just"이라고 명시\n❌ ③ 자율성만: autonomy + competence + relatedness 모두 필요\n❌ ④ 운동 무관: "exercise with a friend" 언급`,tip:`not just A — B도 중요하다 → A만이 아니라 B도`}},
{id:12,type:`내용 일치`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`동기부여는 경쟁을 통해 강화된다`,`자율성은 관계성보다 더 중요하다`,`배려하는 관계는 타인을 동기부여하는 중요한 기반이다`,`스스로를 동기부여할 때 타인과의 연결은 불필요하다`],passage:FULL_PASSAGE,stem:`위 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`"a caring relationship is a crucial basis from which to begin" → <b>배려하는 관계는 중요한 기반</b>`,analysis:`✅ ③ 배려하는 관계는 중요한 기반: 원문 일치\n❌ ① 경쟁: 언급 없음\n❌ ② 자율성이 더 중요: 비교하지 않음\n❌ ④ 연결 불필요: 반대 (connectedness 강조)`,tip:`crucial basis = 중요한 기반, 핵심 토대`}},
{id:13,type:`T/F 판별`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`본문에 따르면, 부모와 교사가 관여하고 배려하는 것으로 인식되면 사람들은 더 행복하고 동기부여된다. (T/F)`,det:{korean:`원문: "perceived as involved and caring, people feel happier and more motivated" → <b>True</b>`,analysis:`✅ True: 원문과 정확히 일치`,tip:`perceived as = ~으로 인식되는`}},
{id:14,type:`T/F 판별`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`본문에 따르면, 관계성 욕구만 충족되면 자율성과 능력 없이도 동기부여가 된다. (T/F)`,det:{korean:`"provided that support for autonomy and competence are also there" → 자율성과 능력 지원도 필요 → <b>False</b>`,analysis:`✅ False: provided that = ~라는 조건 하에 → 자율성과 능력도 필요`,tip:`provided that = if = 조건 (자율성+능력도 함께 필요)`}},
{id:15,type:`T/F 판별`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`본문은 자기 동기부여를 위해 타인과의 연결감을 강화하라고 조언한다. (T/F)`,det:{korean:`"doing things to enhance a sense of connectedness to others can be crucial" → <b>True</b>`,analysis:`✅ True: connectedness 강화를 조언`,tip:`enhance connectedness = 연결감 강화`}},
{id:16,type:`서술형 해석`,diff:`보통`,pts:5,fmt:"written",wa:`배려하는 관계는 시작하기 위한 중요한 기반이다`,accept:[`배려하는 관계는 시작하기 위한 중요한 기반이다`,`돌보는 관계는 시작할 중요한 기반이다`,`배려하는 관계는 시작의 중요한 기반이다`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`위 문장을 한국어로 해석하시오.`,det:{korean:`<b>배려하는 관계는 시작하기 위한 중요한 기반이다.</b>`,analysis:`caring(배려하는) relationship(관계) → crucial(중요한) basis(기반) → from which to begin(시작하기 위한)`,tip:`from which to begin = 거기서부터 시작하기 위한`}},
{id:17,type:`어법 고치기`,diff:`보통`,pts:5,fmt:"written",wa:`fueled`,accept:[`fueled`,`Fueled`,`fuelled`,`Fuelled`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are <u>fueling</u>, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.`,det:{korean:`수동태이므로 과거분사 <b>fueled</b>가 적절하다. 동기와 내면화가 <b>촉진된다</b>(are fueled).`,analysis:`fueling(현재분사) → fueled(과거분사)\nare fueled = 촉진되다 (수동태)`,tip:`are + p.p. = 수동태 / fuel(촉진하다) → fueled`}},
{id:18,type:`배열 서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`a sense of connectedness to others`,accept:[`a sense of connectedness to others`,`A sense of connectedness to others`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance __________ can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`다음 단어들을 올바른 순서로 배열하시오: [others / of / to / a / connectedness / sense]`,det:{korean:`타인과의 연결감 = <b>a sense of connectedness to others</b>`,analysis:`a sense of + 명사 + to others: 정해진 구조`,tip:`a sense of connectedness to others = 타인과의 연결감`}},
{id:19,type:`주제 추론`,diff:`어려움`,pts:6,fmt:"mc",ans:4,ch:[`importance of strict discipline in building motivation`,`ways to improve academic performance through competition`,`benefits of working independently without social support`,`methods of reducing stress through physical exercise`,`importance of building connected relationships in motivation`],passage:FULL_PASSAGE,stem:`다음 글의 주제로 가장 적절한 것은?`,det:{korean:`글의 핵심 주제: <b>동기부여에서 연결된 관계를 구축하는 것의 중요성</b>`,analysis:`✅ ⑤ importance of building connected relationships in motivation: 핵심 주제\n❌ ① strict discipline: 엄격한 규율 언급 없음\n❌ ② competition: 경쟁 언급 없음\n❌ ③ independently: 반대\n❌ ④ physical exercise: 일부 예시일 뿐`,tip:`주제 = 글 전체의 핵심 (relatedness + motivation)`}},
{id:20,type:`빈칸 추론`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`compete with each other for recognition`,`focus exclusively on personal goals and achievements`,`build caring relationships and strengthen social bonds`,`establish authority over peers and subordinates`],passage:FULL_PASSAGE,stem:`The author advises that to sustain motivation, people should __________.`,det:{korean:`저자는 동기부여를 유지하기 위해 <b>배려하는 관계를 구축하고 사회적 유대를 강화해야</b> 한다고 조언한다.`,analysis:`✅ ③ build caring relationships and strengthen social bonds: 글의 핵심 조언\n❌ ① compete: 경쟁 언급 없음\n❌ ② exclusively personal: 반대 (연결 강조)\n❌ ④ establish authority: 권위 확립 아님`,tip:`caring relationship + connectedness = social bonds`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법 선택':'tag-grammar','어휘 문맥':'tag-vocab','빈칸 추론':'tag-blank','서술형 영작':'tag-written','서술형 해석':'tag-written','어법 고치기':'tag-written','배열 서술형':'tag-written','내용 일치':'tag-content','T/F 판별':'tag-tf','주제 추론':'tag-blank'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem||q.dem||''}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📖 온라인워크북 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
