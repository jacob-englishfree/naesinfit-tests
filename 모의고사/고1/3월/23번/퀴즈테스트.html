<!DOCTYPE html>

<head>

<title>2025 고1 3월 23번 온라인퀴즈TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--g:#E8772E;--gd:#B85A1A;--gl:#FFF3E8;--gxl:#FFF8F0;--gxxl:#FFFAF5;--bg:#F6F2EE;--text:#1A1A2E;--tm:#7A6A5E;--tl:#A89A8E;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--o:#F5A623;--ol:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,#FFFAF5,#FFF3E8 40%,#FFE8D5);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--g),#D4691E);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--g),#D4691E);padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f5efe8;}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid #e0d8d0;border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid #d8d0c8;border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px rgba(232,119,46,.1);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;box-shadow:0 6px 20px rgba(232,119,46,.3);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid #d0c8c0;color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--g);color:var(--g);}
.history-badge{background:var(--gxl);color:var(--g);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid #e0d8d0;border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--g);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--g);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--g);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--o);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{max-width:820px;margin:0 auto;padding:24px 20px 100px;}
.q-card{background:var(--card);border-radius:var(--radius);margin-bottom:22px;box-shadow:var(--shadow);overflow:hidden;}
.q-header{display:flex;align-items:center;gap:10px;padding:16px 22px;background:linear-gradient(135deg,#FFFAF5,#FFF3E8);border-bottom:1px solid #f0e0d0;flex-wrap:wrap;}
.q-num{width:36px;height:36px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-vocab{background:var(--gl);color:#B85A1A;}.tag-grammar{background:#EDE9FE;color:#5B21B6;}.tag-reading{background:#E0F7FA;color:#00838F;}.tag-written{background:#FFF3E0;color:#E65100;}.tag-tf{background:var(--bl);color:var(--b);}.tag-order{background:#FCE4EC;color:#C2185B;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f5f0e8;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--g);font-weight:800;}
.q-body{padding:22px;}
.q-passage{background:linear-gradient(135deg,#FFFCF8,#FFF8F0);border-left:4px solid var(--g);padding:16px 18px;margin-bottom:18px;border-radius:0 var(--rs) var(--rs) 0;font-size:13.5px;line-height:1.95;}
.q-stem{font-size:14px;font-weight:700;margin-bottom:16px;}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice-btn{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:2px solid #e0d8d0;border-radius:var(--rs);cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:14px;line-height:1.6;}
.choice-btn:hover{border-color:var(--g);}.choice-btn.selected{border-color:var(--g);box-shadow:0 0 0 3px rgba(232,119,46,.12);background:var(--gxxl);}
.c-num{min-width:26px;height:26px;background:#f0e8e0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}
.written-input{width:100%;padding:14px 16px;border:2px solid #d8d0c8;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);padding:10px 16px;display:flex;align-items:center;gap:5px;justify-content:center;z-index:100;overflow-x:auto;flex-wrap:wrap;}
.nav-dot{width:28px;height:28px;border-radius:50%;background:#e0d8d0;cursor:pointer;border:none;font-size:10px;font-weight:800;color:var(--tm);display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;}.nav-dot.answered{background:var(--g);color:#fff;}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,#FFF3E8,#FFE8D5);}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--g),#F5A623);color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#f0e8e0;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),#F5A623);transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FFFCF8;border-radius:var(--rs);border:1px solid #e0d8d0;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#f0e8e0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d8d0c8;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #e0d8d0;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FFFCF8;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#FFF8F0;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>
</head>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"23번","lesson":"주제","title":"동기부여에서 관계의 중요성","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g1_mar_23"};

const FULL_PASSAGE=`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power — we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`;

const Q=[
{id:1,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`무시당하는`,`가치 있게 여겨지는`,`처벌받는`,`해고당하는`],passage:`We need to feel <u>valued</u> and respected by peers and coworkers.`,stem:`밑줄 친 <b>valued</b>의 뜻으로 가장 적절한 것은?`,det:{korean:`valued = <b>가치 있게 여겨지는</b>`,analysis:`✅ ② 가치 있게 여겨지는: valued의 정확한 번역\n❌ ① 무시당하는: ignored\n❌ ③ 처벌받는: punished\n❌ ④ 해고당하는: dismissed`,tip:`value(가치) → valued(가치 있게 여겨지는)`}},
{id:2,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`경쟁`,`독립`,`의존`,`관계성`],passage:`When the need for <u>relatedness</u> is met, motivation and internalization are fueled.`,stem:`밑줄 친 <b>relatedness</b>의 뜻으로 가장 적절한 것은?`,det:{korean:`relatedness = <b>관계성</b>`,analysis:`✅ ④ 관계성: relatedness의 정확한 번역\n❌ ① 경쟁: competition\n❌ ② 독립: independence\n❌ ③ 의존: dependence`,tip:`relate(관련되다) → related(관련된) → relatedness(관계성)`}},
{id:3,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`내면화`,`외면화`,`표면화`,`일반화`],passage:`Motivation and <u>internalization</u> are fueled.`,stem:`밑줄 친 <b>internalization</b>의 뜻으로 가장 적절한 것은?`,det:{korean:`internalization = <b>내면화</b> (외부 가치를 자신의 것으로 만드는 과정)`,analysis:`✅ ① 내면화: internalization의 정확한 번역\n❌ ② 외면화: externalization (반대)\n❌ ③ 표면화: surfacing\n❌ ④ 일반화: generalization`,tip:`internal(내부의) → internalize(내면화하다) → internalization(내면화)`}},
{id:4,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`perceive`,`perceiving`,`perceived`,`to perceive`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are __________ as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`빈칸에 들어갈 어법상 가장 적절한 것은?`,det:{korean:`be perceived as = ~으로 인식되다 → 수동태이므로 <b>perceived</b>`,analysis:`✅ ③ perceived: are perceived = 수동태\n❌ ① perceive: 원형 — be 뒤에 부적절\n❌ ② perceiving: 능동 — 의미 부적절\n❌ ④ to perceive: 부정사 — 문맥 부적절`,tip:`be perceived as = ~으로 인식되다`}},
{id:5,type:`어법`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`enhancing — persist`,`enhance — persistence`,`enhanced — persistent`,`to enhance — persisting`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to __________ a sense of connectedness to others can be crucial to long-term __________. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`두 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`to <b>enhance</b>(강화하다) — 동사원형, long-term <b>persistence</b>(지속) — 명사`,analysis:`✅ ② enhance — persistence: to + 동사원형, long-term + 명사\n❌ ① enhancing/persist: to 뒤 동명사 불가\n❌ ③ enhanced/persistent: 수동/형용사로 부적절\n❌ ④ to enhance/persisting: persisting은 명사로 부적절`,tip:`to + 동사원형(목적), long-term + 명사`}},
{id:6,type:`독해`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`동료에게 인정받을 필요가 없다`,`권력 있는 사람의 인정만 중요하다`,`동료와 동업자에게도 가치 있게 여겨져야 한다`,`경쟁을 통해 동기부여가 된다`],passage:FULL_PASSAGE,stem:`본문에 따르면, "those people with power" 외에도 무엇이 중요한가?`,det:{korean:`"not just those people with power" → 동료(peers)와 동업자(coworkers)에게도 <b>가치 있게 여겨져야</b> 한다.`,analysis:`✅ ③ 동료와 동업자에게도 가치 있게 여겨져야: "valued and respected by peers and coworkers"\n❌ ① 필요 없다: 반대\n❌ ② 권력자만: "not just"\n❌ ④ 경쟁: 언급 없음`,tip:`not just A: A만이 아니라 (다른 것도 중요하다)`}},
{id:7,type:`독해`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`배려하는 관계를 형성하는 것`,`경쟁 환경을 조성하는 것`,`엄격한 규칙을 세우는 것`,`보상을 제공하는 것`],passage:FULL_PASSAGE,stem:`저자에 따르면, 타인을 동기부여하려면 먼저 해야 할 것은?`,det:{korean:`"a caring relationship is a crucial basis from which to begin" → <b>배려하는 관계를 형성하는 것</b>`,analysis:`✅ ① 배려하는 관계 형성: 원문 일치\n❌ ② 경쟁 환경: 언급 없음\n❌ ③ 엄격한 규칙: 언급 없음\n❌ ④ 보상 제공: 언급 없음`,tip:`crucial basis from which to begin = 시작의 중요한 기반`}},
{id:8,type:`독해`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`혼자 운동하기`,`어려운 결정을 피하기`,`경쟁을 통해 자신을 시험하기`,`친구와 운동하고 어려울 때 누군가에게 전화하기`],passage:FULL_PASSAGE,stem:`저자가 자기 동기부여를 위해 제시한 구체적 조언은?`,det:{korean:`"exercise with a friend, call someone when you have a difficult decision" → <b>친구와 운동하고 어려울 때 전화하기</b>`,analysis:`✅ ④ 친구와 운동, 전화하기: 원문의 구체적 조언과 일치\n❌ ① 혼자 운동: "with a friend" (함께)\n❌ ② 결정 피하기: 반대 (전화해서 도움 받기)\n❌ ③ 경쟁: 언급 없음`,tip:`구체적 조언 3가지: 친구와 운동, 전화하기, 타인 지원하기`}},
{id:9,type:`T/F`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`본문에 따르면, 관계성 욕구가 충족되면 동기와 내면화가 촉진된다. (T/F)`,det:{korean:`"when the need for relatedness is met, motivation and internalization are fueled" → <b>True</b>`,analysis:`✅ True: 원문과 정확히 일치`,tip:`fueled = 촉진되다, 연료를 공급받다`}},
{id:10,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`본문에 따르면, 동기부여에는 관계성만 있으면 충분하며 자율성과 능력은 필요 없다. (T/F)`,det:{korean:`"provided that support for autonomy and competence are also there" → 자율성과 능력도 필요 → <b>False</b>`,analysis:`✅ False: autonomy와 competence도 필요하다고 명시`,tip:`provided that = ~라는 조건 하에 → 추가 조건 존재`}},
{id:11,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`motivated`,accept:[`motivated`,`Motivated`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more __________. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`다음 빈칸에 들어갈 단어를 쓰시오.`,det:{korean:`사람들은 더 행복하고 더 <b>동기부여된(motivated)</b> 느낌이 든다.`,analysis:`motivated: 동기부여된\n원문: "feel happier and more motivated"`,tip:`motivate(동기를 부여하다) → motivated(동기부여된)`}},
{id:12,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`crucial`,accept:[`crucial`,`Crucial`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a __________ basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`다음 빈칸에 들어갈 단어를 쓰시오.`,det:{korean:`배려하는 관계는 <b>중요한(crucial)</b> 기반이다.`,analysis:`crucial: 중요한, 결정적인\n원문의 핵심 형용사`,tip:`crucial = essential = vital = 매우 중요한`}},
{id:13,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`참여하는`,`배려하는, 돌보는`,`경쟁하는`,`독립적인`],passage:`When parents and teachers are perceived as involved and <u>caring</u>.`,stem:`밑줄 친 <b>caring</b>의 뜻으로 가장 적절한 것은?`,det:{korean:`caring = <b>배려하는, 돌보는</b>`,analysis:`✅ ② 배려하는, 돌보는: caring의 정확한 번역\n❌ ① 참여하는: involved\n❌ ③ 경쟁하는: competing\n❌ ④ 독립적인: independent`,tip:`care(돌보다) → caring(배려하는) — 현재분사 형용사`}},
{id:14,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`from which`,`which from`,`from where`,`where from`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis __________ to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`빈칸에 들어갈 어법상 가장 적절한 것은?`,det:{korean:`<b>from which</b> to begin = 시작할 기반 → 전치사+관계대명사`,analysis:`✅ ① from which: 전치사+관계대명사\n❌ ② which from: 어순 오류\n❌ ③ from where: 장소가 아님\n❌ ④ where from: 어순 오류`,tip:`from which to V = V할 ~(전치사+관계대명사+to부정사)`}},
{id:15,type:`독해`,diff:`어려움`,pts:6,fmt:"mc",ans:4,ch:[`importance of strict discipline in building motivation`,`ways to improve academic performance through competition`,`benefits of working independently without social support`,`methods of reducing stress through physical exercise`,`importance of building connected relationships in motivation`],passage:FULL_PASSAGE,stem:`다음 글의 주제로 가장 적절한 것은?`,det:{korean:`글의 핵심 주제: <b>동기부여에서 연결된 관계를 구축하는 것의 중요성</b>`,analysis:`✅ ⑤ importance of building connected relationships in motivation: 핵심 주제\n❌ ① strict discipline: 언급 없음\n❌ ② competition: 언급 없음\n❌ ③ independently: 반대\n❌ ④ physical exercise: 일부 예시일 뿐`,tip:`주제 = relatedness + motivation + connectedness`}},
{id:16,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`autonomy`,accept:[`autonomy`,`Autonomy`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for __________ and competence are also there. If we are trying to motivate others, a caring relationship is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`다음 빈칸에 들어갈 단어를 쓰시오.`,det:{korean:`<b>자율성(autonomy)</b>과 능력에 대한 지원이 있다면`,analysis:`autonomy: 자율성\n자기결정이론의 3대 욕구: autonomy, competence, relatedness`,tip:`autonomy = 자율성 — auto(스스로) + nomy(법칙)`}},
{id:17,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`약화시키다`,`제거하다`,`강화하다`,`무시하다`],passage:`Doing things to <u>enhance</u> a sense of connectedness to others.`,stem:`밑줄 친 <b>enhance</b>의 뜻으로 가장 적절한 것은?`,det:{korean:`enhance = <b>강화하다</b>`,analysis:`✅ ③ 강화하다: enhance의 정확한 번역\n❌ ① 약화시키다: weaken\n❌ ② 제거하다: remove\n❌ ④ 무시하다: ignore`,tip:`enhance = strengthen = boost = 강화하다`}},
{id:18,type:`순서 배열`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`(B) — (C) — (A)`,`(A) — (C) — (B)`,`(C) — (A) — (B)`,`(B) — (A) — (C)`],passage:`(A) Thus, when the need for relatedness is met, motivation and internalization are fueled.\n\n(B) So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others.\n\n(C) If we are trying to motivate others, a caring relationship is a crucial basis from which to begin.`,stem:`주어진 글 다음에 이어질 순서로 가장 적절한 것은? (첫 문장: There is a wealth of evidence that when parents and teachers are perceived as caring, people feel happier and more motivated.)`,det:{korean:`배려 → 인식 → (A) 관계성 충족 시 동기 촉진 → (C) 타인 동기부여의 기반 → (B) 구체적 조언`,analysis:`✅ ② (A) — (C) — (B): 논리적 흐름 일치\n일반 원칙(A) → 적용(C) → 구체적 조언(B)`,tip:`글의 흐름: 원칙 → 적용 → 실천 조언`}},
{id:19,type:`서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`a caring relationship`,accept:[`a caring relationship`,`A caring relationship`,`caring relationship`],passage:`There is a wealth of evidence that when parents, teachers, supervisors, and coaches are perceived as involved and caring, people feel happier and more motivated. And it is not just those people with power \u2014 we need to feel valued and respected by peers and coworkers. Thus, when the need for relatedness is met, motivation and internalization are fueled, provided that support for autonomy and competence are also there. If we are trying to motivate others, __________ is a crucial basis from which to begin. And when we are trying to motivate ourselves, doing things to enhance a sense of connectedness to others can be crucial to long-term persistence. So exercise with a friend, call someone when you have a difficult decision to make, and be there as a support for others as they take on challenges.`,stem:`다음 빈칸에 들어갈 표현을 영어로 쓰시오. (배려하는 관계)`,det:{korean:`배려하는 관계 = <b>a caring relationship</b>`,analysis:`a caring relationship: 배려하는 관계\n원문의 핵심 표현`,tip:`caring(배려하는) + relationship(관계) = 배려하는 관계`}},
{id:20,type:`독해`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`Motivation comes only from people in positions of authority`,`Competition is the best way to sustain long-term motivation`,`Nurturing social connections is fundamental to sustaining motivation`,`Individual competence alone is sufficient for motivation`],passage:FULL_PASSAGE,stem:`Which statement best captures the main argument of the passage?`,det:{korean:`본문의 핵심 주장: <b>사회적 연결을 키우는 것이 동기부여를 유지하는 데 근본적이다</b>`,analysis:`✅ ③ Nurturing social connections is fundamental: 핵심 주장\n❌ ① only from authority: "not just those people with power"\n❌ ② competition: 언급 없음\n❌ ④ competence alone: 관계성도 필요`,tip:`nurturing = 기르는, 키우는 / fundamental = 근본적인`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어휘':'tag-vocab','어법':'tag-grammar','독해':'tag-reading','서술형':'tag-written','T/F':'tag-tf','순서 배열':'tag-order'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`🧩 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
