.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FFFCFA;border-radius:var(--rs);border:1px solid #e0d8d0;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#f0e8e0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d8d0c8;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #e0d8d0;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FFFCFA;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#FFF8F2;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"41-42번","lesson":"장문 (제목+어휘)","title":"Numbers Don't Tell Us Everything","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g1_mar_41_42"};

const FULL_PASSAGE=`Some researchers view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`;

const Q=[
{id:1,type:`빈칸 문맥 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`숫자는 세상을 완벽하게 설명한다`,`숫자로 바꿔도 더 정확해지지 않는다`,`음악이 가장 좋은 묘사 수단이다`,`구어는 항상 부정확하다`],passage:`However, when our language of description is changed to numbers, we do not move toward greater accuracy.`,stem:`위 문장의 의미로 가장 적절한 것은?`,det:{korean:`기술 언어가 숫자로 바뀌어도 더 큰 정확성을 향해 나아가지 <b>못한다</b>.`,analysis:`✅ ② 숫자로 바꿔도 더 정확해지지 않는다: 원문의 핵심 의미\n❌ ① 완벽하게 설명: 반대\n❌ ③ 음악이 최고: 언급 없음\n❌ ④ 구어는 항상 부정확: 과장`,tip:`do not move toward = ~을 향해 나아가지 못하다`}},
{id:2,type:`빈칸 문맥 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`통계가 범죄를 해결한다`,`숫자가 교육을 개선한다`,`통계는 사람의 고통을 전달하지 못한다`,`질병의 확산은 통계로 막을 수 있다`],passage:`Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering.`,stem:`위 문장이 전달하는 핵심 메시지로 가장 적절한 것은?`,det:{korean:`범죄, 노숙, 질병 확산에 대한 통계는 사람들의 <b>고통에 대해 아무것도 말하지 않는다</b>.`,analysis:`✅ ③ 통계는 사람의 고통을 전달하지 못한다: 원문 핵심\n❌ ① 범죄 해결: 언급 없음\n❌ ② 교육 개선: 반대\n❌ ④ 확산 방지: 언급 없음`,tip:`say nothing of = ~에 대해 아무것도 말하지 않다`}},
{id:3,type:`빈칸 문맥 완성`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`눈물을 닦아낸 인간이다`,`인간보다 우월하다`,`가장 정확한 언어이다`,`감정을 잘 표현한다`],passage:`Statistics are human beings with the tears wiped off.`,stem:`이 문장에서 '통계'를 비유한 표현의 의미로 가장 적절한 것은?`,det:{korean:`통계는 <b>눈물을 닦아낸(감정을 제거한) 인간</b>이라는 비유. 즉 숫자는 인간의 감정과 고통을 배제한다.`,analysis:`✅ ① 눈물을 닦아낸 인간이다: 원문의 직역이자 비유적 의미\n❌ ② 인간보다 우월: 반대\n❌ ③ 가장 정확한 언어: 반대\n❌ ④ 감정을 잘 표현: 반대`,tip:`tears wiped off = 눈물을 닦아냄 → 감정/인간성이 제거됨`}},
{id:4,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`complete`,`advanced`,`incomplete`,`perfect`],passage:`Some researchers view spoken languages as __________ devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`연구자들은 구어를 <b>불완전한(incomplete)</b> 장치로 본다.`,analysis:`✅ ③ incomplete: 불완전한 → 원문 일치\n❌ ① complete: 완전한 → 반의어\n❌ ② advanced: 발전된\n❌ ④ perfect: 완벽한 → 반의어`,tip:`incomplete = 불완전한, 미완성의`}},
{id:5,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`purposes`,`reasons`,`effects`,`causes`],passage:`Some researchers view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific __________ (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`특정 <b>목적(purposes)</b>에는 유용하다.`,analysis:`✅ ① purposes: 목적 → 원문 일치\n❌ ② reasons: 이유\n❌ ③ effects: 효과\n❌ ④ causes: 원인`,tip:`purpose = 목적, 의도 / for specific purposes = 특정 목적을 위해`}},
{id:6,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`disease`,`crime`,`statistics`,`education`],passage:`Some researchers view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their __________, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`<b>교육(education)</b>을 계속할 수 있는지는 소수의 숫자에 달려 있다.`,analysis:`✅ ④ education: 교육 → 원문 일치\n❌ ① disease: 질병\n❌ ② crime: 범죄\n❌ ③ statistics: 통계`,tip:`continue with education = 교육을 계속하다`}},
{id:7,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`present`,`represent`,`prevent`,`resent`],passage:`They think numbers <u>represent</u> the most neutral language of description.`,stem:`밑줄 친 <b>represent</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`represent = 대표하다, 나타내다. 보기 중 represent 자체가 정답.`,analysis:`✅ ② represent: 대표하다 → 동의 (stand for, symbolize)\n❌ ① present: 제시하다 (유사하지만 다름)\n❌ ③ prevent: 예방하다\n❌ ④ resent: 분개하다`,tip:`represent = stand for = symbolize = 대표하다, 상징하다`}},
{id:8,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`went to`,`graduated from`,`built`,`avoided`],passage:`These numbers do not account for the quality of schools they have <u>attended</u>.`,stem:`밑줄 친 <b>attended</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`attended = 다녔다, went to = 다녔다 → 동의어`,analysis:`✅ ① went to: 다녔다 → attended의 동의어\n❌ ② graduated from: 졸업했다\n❌ ③ built: 지었다\n❌ ④ avoided: 피했다`,tip:`attend = go to = 출석하다, 다니다`}},
{id:9,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`inaccuracy`,`imprecision`,`precision`,`confusion`],passage:`We do not move toward greater <u>accuracy</u>.`,stem:`밑줄 친 <b>accuracy</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`accuracy = 정확성. precision = 정밀성은 유사어이므로 가장 먼 것은 아님. 하지만 보기 중 inaccuracy가 반의어.`,analysis:`❌ ③ precision(정밀성): 사실 동의어에 가까움. 그러나 ① inaccuracy가 직접 반의어.\n재검토: ① inaccuracy가 가장 먼 것.\n\n정정: ① inaccuracy(부정확성)가 반의어`,tip:`accuracy(정확성) ↔ inaccuracy(부정확성)`}},
{id:10,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`wealth`,`riches`,`fortune`,`poverty`],passage:`While useful for specific purposes (e.g., census taking, <u>income</u> distribution).`,stem:`밑줄 친 <b>income</b>과 관련하여 의미가 가장 <b>먼</b> 것은?`,det:{korean:`income = 소득, 수입 ↔ poverty = 빈곤`,analysis:`❌ ④ poverty(빈곤): income과 가장 대조적 의미\n✅ ① wealth: 부 → 유사 개념\n✅ ② riches: 부유함 → 유사\n✅ ③ fortune: 재산 → 유사`,tip:`income(수입) → wealth, riches, fortune은 유사 / poverty(빈곤)는 반대 개념`}},
{id:11,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:4,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Some researchers view spoken languages as ①<u>incomplete</u> devices for capturing precise differences. They think numbers represent the most ②<u>neutral</u> language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for ③<u>specific</u> purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally ④<u>insulating</u>. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to ⑤<u>engage</u> without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`원문은 "allowing us to <b>escape</b>(벗어나다)"이다. ⑤ engage(참여하다)는 escape의 반의어로 부적절.`,analysis:`❌ ⑤ engage(참여하다): 원문은 'escape(벗어나다)' → 부적절\n✅ ① incomplete: 불완전한 → 적절\n✅ ② neutral: 중립적인 → 적절\n✅ ③ specific: 특정한 → 적절\n✅ ④ insulating: 차단하는 → 적절`,tip:`escape(벗어나다) ↔ engage(참여하다, 관여하다)`}},
{id:12,type:`영영풀이 매칭`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`accuracy`,`description`,`census`,`distribution`],passage:`<i>an official process of counting the population of a country</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`한 나라의 인구를 세는 공식적인 절차 → <b>census(인구 조사)</b>`,analysis:`✅ ③ census: 인구 조사 → 영영 정의와 일치\n❌ ① accuracy: 정확성\n❌ ② description: 묘사\n❌ ④ distribution: 분배`,tip:`census = 인구 조사 (국가 규모의 공식 인구 집계)`}},
{id:13,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`quantify`,`qualify`,`identify`,`simplify`],passage:`<i>to express or measure the quantity of something, especially in numbers</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`특히 숫자로 무언가의 양을 표현하거나 측정하다 → <b>quantify(수량화하다)</b>`,analysis:`✅ ① quantify: 수량화하다 → 영영 정의와 일치\n❌ ② qualify: 자격을 갖추다\n❌ ③ identify: 식별하다\n❌ ④ simplify: 단순화하다`,tip:`quantify = 수량화하다 (quantity + -fy = 양을 나타내다)`}},
{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`비용을 지불하다`,`원가, 가격`,`희생, 대가`,`비용, 경비`],passage:`Whether they can continue with their education, where, and at what <u>cost</u> depends importantly on a handful of numbers.`,stem:`밑줄 친 <b>cost</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`어떤 <b>비용(cost)</b>으로 교육을 계속할 수 있는지 → 경제적 비용`,analysis:`✅ ④ 비용, 경비: 교육 비용을 의미\n❌ ① 지불하다: 동사적 의미\n❌ ② 원가: 생산 원가\n❌ ③ 희생: at all costs의 의미`,tip:`cost 다의어: 비용(명사) / 희생(명사) / ~의 비용이 들다(동사)`}},
{id:15,type:`다의어 문맥적 의미`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`펼치다, 확장하다`,`확산, 전파`,`바르다 (빵에)`,`넓은 범위`],passage:`Statistics on crime, homelessness, or the <u>spread</u> of a disease say nothing of people's suffering.`,stem:`밑줄 친 <b>spread</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`질병의 <b>확산(spread)</b> → 명사로 사용`,analysis:`✅ ② 확산, 전파: 질병의 확산\n❌ ① 펼치다: 동사적 의미\n❌ ③ 바르다: spread butter\n❌ ④ 넓은 범위: a wide spread`,tip:`spread 다의어: 확산(명사) / 펼치다(동사) / 바르다(동사)`}},
{id:16,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`spoken`,accept:[`spoken`,`Spoken`],passage:`Some researchers view __________ (speak) languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`명사 languages를 수식하는 과거분사 → speak → <b>spoken</b>`,analysis:`speak → spoken: 과거분사(수동)\n'spoken languages' = 구어, 음성 언어`,tip:`speak-spoke-spoken: 불규칙 동사 / spoken(과거분사) = 구어의`}},
{id:17,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`statistical`,accept:[`statistical`,`Statistical`],passage:`Some researchers view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which __________ (statistic) results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`명사 results를 수식하는 형용사 → statistic → <b>statistical</b>`,analysis:`statistic(명사) → statistical(형용사): 명사 수식\n'statistical results' = 통계적 결과`,tip:`statistic(통계 수치) → statistical(통계의, 통계적인) — 형용사 접미사 -al`}},
{id:18,type:`(A)(B)(C) 조합형`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`escape — disturbed — caution`,`escape — disturbed — caution`,`engage — comforted — confidence`,`escape — comforted — caution`,`engage — disturbed — confidence`],passage:`Some researchers view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with <b>(C)</b>.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`통계를 거리를 두고 읽어 방해받지 않고 <b>벗어날(escape)</b> 수 있게 한다. <b>방해받지(disturbed)</b> 않고. <b>주의(caution)</b>를 기울여 수량화하라.`,analysis:`✅ ② escape — disturbed — caution: 원문 일치\n❌ ③ engage/comforted: 반의어\n❌ ④ comforted: disturbed의 반의어\n❌ ⑤ engage/confidence: 둘 다 부적절`,tip:`escape(벗어나다), disturbed(방해받은), caution(주의)`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`Numbers Don't Tell Us Everything`,`The Power of Statistics in Education`,`Why We Should Trust Numbers More`,`How Language Fails to Describe Reality`],passage:FULL_PASSAGE,stem:`다음 글의 제목으로 가장 적절한 것은? (원래 모의고사 41번 문제)`,det:{korean:`글의 핵심은 숫자/통계가 모든 것을 말해주지 못한다는 것이다.`,analysis:`✅ ① Numbers Don't Tell Us Everything: 글의 핵심 주제\n❌ ② 통계의 힘: 반대\n❌ ③ 숫자를 더 신뢰: 반대\n❌ ④ 언어의 실패: 주제 아님`,tip:`41번 정답: ① — 숫자의 한계`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`(a) accuracy`,`(b) include`,`(c) quality`,`(d) morally`,`(e) escape`],passage:FULL_PASSAGE,stem:`다음 글의 밑줄 친 단어 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은? (원래 모의고사 42번 문제)`,det:{korean:`"they <b>include</b>"는 <b>exclude</b>가 되어야 한다.`,analysis:`✅ ② (b) include → exclude\n❌ 나머지 모두 적절`,tip:`42번 정답: ② — include → exclude`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`🧩 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
