body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}

.written-input{width:100%;padding:14px 16px;border:2px solid #d0c8d8;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);padding:10px 16px;display:flex;align-items:center;gap:5px;justify-content:center;z-index:100;overflow-x:auto;flex-wrap:wrap;}

.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--g),#8B5CF6);color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}

.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8e0f0;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),#A78BFA);transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FDFBFF;border-radius:var(--rs);border:1px solid #ddd8e8;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0f0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0c8d8;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #ddd8e8;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FDFBFF;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F8F5FC;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"41-42번","lesson":"장문 (제목+어휘)","title":"Numbers Don't Tell Us Everything","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_2025_g1_mar_41_42"};

const FULL_PASSAGE=`Some researchers view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`;

const Q=[
{id:1,type:`빈칸 문맥 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`languages are better than numbers`,`numbers are always accurate`,`music describes the world best`,`numbers are not better descriptions than words`],passage:`Numbers are no more appropriate 'pictures of the world' than words, music, or painting.`,stem:`위 문장이 의미하는 바로 가장 적절한 것은?`,det:{korean:`숫자는 단어, 음악, 회화보다 더 적절한 '세상의 그림'이 <b>아니다</b>. 즉 숫자가 단어보다 나은 묘사가 아니라는 뜻.`,analysis:`✅ ④ numbers are not better descriptions than words: 원문의 핵심 의미\n❌ ① languages are better: 언어가 더 낫다고 단정하지 않음\n❌ ② always accurate: 항상 정확하다 → 반대\n❌ ③ music describes best: 음악이 최고 → 언급 없음`,tip:`no more A than B = B만큼이나 A가 아니다 (둘 다 아니다)`}},
{id:2,type:`빈칸 문맥 완성`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`numbers perfectly reflect reality`,`numbers fail to capture important factors`,`students always succeed with good scores`,`schools don't affect test scores`],passage:`These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on.`,stem:`위 문장의 핵심 주장으로 가장 적절한 것은?`,det:{korean:`숫자는 학교의 질, 과외 여부, 부모 지원, 시험 불안 등 중요한 요소를 <b>설명하지 못한다</b>.`,analysis:`✅ ② numbers fail to capture important factors: 숫자가 중요한 요소를 포착하지 못함\n❌ ① perfectly reflect: 완벽하게 반영 → 반대\n❌ ③ always succeed: 항상 성공 → 과장\n❌ ④ schools don't affect: 학교가 영향 없음 → 반대`,tip:`account for = 설명하다, 고려하다 — 숫자가 하지 못하는 것`}},
{id:3,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`makes us more empathetic`,`brings us closer to reality`,`shields us from emotional impact`,`improves our understanding of suffering`],passage:`There are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering.`,stem:`위 문장에서 'morally insulating'이 의미하는 바로 가장 적절한 것은?`,det:{korean:`사람들의 삶을 숫자로 바꾸는 것은 도덕적으로 <b>차단하는(insulating)</b> 것이다. 즉 감정적 영향으로부터 우리를 보호한다.`,analysis:`✅ ③ shields us from emotional impact: 감정적 충격으로부터 차단\n❌ ① more empathetic: 더 공감적 → 반대\n❌ ② closer to reality: 현실에 가깝게 → 반대\n❌ ④ improves understanding: 이해 향상 → 반대`,tip:`insulating = 절연하는, 차단하는 — 도덕적/감정적 둔감화`}},
{id:4,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`researchers`,accept:[`researchers`,`Researchers`],passage:`Some __________ (research) view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`some 뒤에 복수 명사가 필요 → research → <b>researchers</b>`,analysis:`research(연구) → researchers(연구자들): 복수 명사\n'Some researchers' = 일부 연구자들`,tip:`research(명사: 연구) → researcher(명사: 연구자) → researchers(복수)`}},
{id:5,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`manipulated`,accept:[`manipulated`,`Manipulated`],passage:`Some researchers view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be __________ (manipulate) there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`수동태(can be + p.p.) → manipulate → <b>manipulated</b>`,analysis:`manipulate → manipulated: 수동태(can be + p.p.)\n'can be manipulated' = 조작될 수 있다`,tip:`조동사 + be + p.p. = 수동태: can be manipulated = 조작될 수 있다`}},
{id:6,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`disturbed`,accept:[`disturbed`,`Disturbed`],passage:`Some researchers view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being __________ (disturb). Statistics are human beings with the tears wiped off. Quantify with caution.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`전치사 without + being + p.p. → disturb → <b>disturbed</b>`,analysis:`disturb → disturbed: 수동태(being + p.p.)\n'without being disturbed' = 방해받지 않고`,tip:`without being + p.p. = ~되지 않고 (수동 동명사)`}},
{id:7,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Some researchers view spoken languages as ①<u>incomplete</u> devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we ②<u>do</u> not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not ③<u>account for</u> the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say ④<u>nothing</u> of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears ⑤<u>wiped off</u>. Quantify with caution.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`원문은 "we do <b>not</b> move toward greater accuracy"이다. ② do는 not 없이 쓰여 긍정이 되므로 부적절.`,analysis:`❌ ② do(긍정): 원문은 'do not move' → 부정이어야 함\n✅ ① incomplete: 불완전한 → 적절\n✅ ③ account for: 설명하다 → 적절\n✅ ④ nothing: 아무것도 → 적절\n✅ ⑤ wiped off: 닦아낸 → 적절`,tip:`do not move ≠ do move — 부정과 긍정의 차이가 의미를 완전히 바꿈`}},
{id:8,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`neutral`,`emotional`,`biased`,`subjective`],passage:`Some researchers view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most __________ language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`숫자가 가장 <b>중립적인(neutral)</b> 기술 언어를 대표한다고 생각한다.`,analysis:`✅ ① neutral: 중립적인 → 원문 일치\n❌ ② emotional: 감정적인\n❌ ③ biased: 편향된\n❌ ④ subjective: 주관적인`,tip:`neutral(중립적) = unbiased = objective`}},
{id:9,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`connected`,`related`,`tied`,`linked`],passage:`Some researchers view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are __________ to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`학생들의 미래는 시험 점수에 <b>묶여(tied)</b> 있다.`,analysis:`✅ ③ tied: 묶인 → 원문 일치 (tied to)\n❌ ① connected: 연결된 (connected to/with)\n❌ ② related: 관련된 (related to)\n❌ ④ linked: 연결된 (linked to) — 유사하지만 원문은 tied`,tip:`be tied to = ~에 묶여 있다, 좌우되다`}},
{id:10,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`distribution`,`anxiety`,`preparation`,`confidence`],passage:`Some researchers view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test __________, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`시험 <b>불안(anxiety)</b>이 있는지 여부를 설명하지 못한다.`,analysis:`✅ ② anxiety: 불안 → 원문 일치\n❌ ① distribution: 분배\n❌ ③ preparation: 준비\n❌ ④ confidence: 자신감`,tip:`test anxiety = 시험 불안 — 시험에 대한 걱정/스트레스`}},
{id:11,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`general`,`approximate`,`broad`,`specific`],passage:`While useful for <u>specific</u> purposes (e.g., census taking, income distribution).`,stem:`밑줄 친 <b>specific</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`specific = 특정한, particular과 동의어. 보기 중 specific 자체가 정답.`,analysis:`✅ ④ specific: 특정한 → 원문 그대로 (particular과 동의)\n❌ ① general: 일반적인 → 반의어\n❌ ② approximate: 대략적인\n❌ ③ broad: 넓은`,tip:`specific = particular = certain = 특정한, 구체적인`}},
{id:12,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`careful attention`,`speed`,`quantity`,`courage`],passage:`Statistics are human beings with the tears wiped off. Quantify with <u>caution</u>.`,stem:`밑줄 친 <b>caution</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`caution = 주의, careful attention = 세심한 주의 → 동의어`,analysis:`✅ ① careful attention: 세심한 주의 → caution의 동의어\n❌ ② speed: 속도\n❌ ③ quantity: 양\n❌ ④ courage: 용기`,tip:`caution = care = prudence = 주의, 신중함`}},
{id:13,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`imprecise`,`vague`,`biased`,`impartial`],passage:`They think numbers represent the most <u>neutral</u> language of description.`,stem:`밑줄 친 <b>neutral</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`neutral = 중립적인 ↔ biased = 편향된`,analysis:`❌ ③ biased(편향된): neutral의 반의어 → 가장 먼 의미\n✅ ① imprecise: 부정확한 → 다른 범주\n✅ ② vague: 모호한 → 다른 범주\n✅ ④ impartial: 공정한 → 동의어`,tip:`neutral = impartial = unbiased ↔ biased = partial = 편향된`}},
{id:14,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`census`,`insulating`,`quantify`,`caution`],passage:`<i>protecting from unpleasant effects or feelings; making someone less aware of or less affected by something</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`불쾌한 영향이나 감정으로부터 보호하는; 덜 인식하거나 영향받게 하는 → <b>insulating(차단하는)</b>`,analysis:`✅ ② insulating: 차단하는, 둔감하게 하는 → 영영 정의와 일치\n❌ ① census: 인구 조사\n❌ ③ quantify: 수량화하다\n❌ ④ caution: 주의`,tip:`insulate = 절연하다, 차단하다 → morally insulating = 도덕적으로 무감각하게 하는`}},
{id:15,type:`영영풀이 매칭`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`distribution`,`description`,`manipulation`,`suffering`],passage:`<i>the state of undergoing pain, distress, or hardship</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`고통, 괴로움, 어려움을 겪고 있는 상태 → <b>suffering(고통)</b>`,analysis:`✅ ④ suffering: 고통 → 영영 정의와 일치\n❌ ① distribution: 분배\n❌ ② description: 묘사\n❌ ③ manipulation: 조작`,tip:`suffering = pain = agony = distress = 고통`}},
{id:16,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`그림, 회화 작품`,`사진`,`모습, 상황`,`영화`],passage:`Numbers are no more appropriate '<u>pictures</u> of the world' than words, music, or painting.`,stem:`밑줄 친 <b>pictures</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`'세상의 그림(pictures)'은 여기서 세상의 <b>모습, 상황</b>을 묘사하는 것을 비유적으로 표현한 것.`,analysis:`✅ ③ 모습, 상황: 세상을 묘사/반영하는 것의 비유\n❌ ① 회화 작품: 실제 그림이 아님\n❌ ② 사진: photograph가 아님\n❌ ④ 영화: movie가 아님`,tip:`picture 다의어: 그림(명사) / 사진(명사) / 상황, 모습(비유적) / 이해하다(동사)`}},
{id:17,type:`문맥상 부적절한 어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Some researchers view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for ①<u>specific</u> purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are ②<u>tied</u> to their scores on national tests. In effect, whether they can ③<u>continue</u> with their education, where, and at what cost depends importantly on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a ④<u>closeness</u>, thus allowing us to escape without being disturbed. Statistics are human beings with the tears ⑤<u>wiped off</u>. Quantify with caution.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`원문은 "at a <b>distance</b>(거리를 두고)"이다. ④ closeness(가까움)는 distance의 반의어로 부적절.`,analysis:`❌ ④ closeness(가까움): 원문은 'distance(거리)' → 부적절\n✅ ① specific: 특정한 → 적절\n✅ ② tied: 묶인 → 적절\n✅ ③ continue: 계속하다 → 적절\n✅ ⑤ wiped off: 닦아낸 → 적절`,tip:`distance(거리) ↔ closeness(가까움) — 통계를 거리를 두고 읽는다`}},
{id:18,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`Numbers Don't Tell Us Everything`,`The Power of Statistics in Education`,`Why We Should Trust Numbers More`,`How Language Fails to Describe Reality`],passage:FULL_PASSAGE,stem:`다음 글의 제목으로 가장 적절한 것은? (원래 모의고사 41번 문제)`,det:{korean:`글의 핵심은 숫자/통계가 모든 것을 말해주지 못한다는 것이다.`,analysis:`✅ ① Numbers Don't Tell Us Everything: 글의 핵심 주제\n❌ ② The Power of Statistics: 통계의 힘 → 반대\n❌ ③ Trust Numbers More: 더 신뢰 → 반대\n❌ ④ Language Fails: 언어 실패가 아닌 숫자의 한계`,tip:`41번 정답: ① — 숫자/통계의 한계와 주의 필요성`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`(a) accuracy`,`(b) include`,`(c) quality`,`(d) morally`,`(e) escape`],passage:FULL_PASSAGE,stem:`다음 글의 밑줄 친 단어 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은? (원래 모의고사 42번 문제)`,det:{korean:`"they <b>include</b>"는 문맥상 <b>exclude(배제하다)</b>가 되어야 한다.`,analysis:`✅ ② (b) include → exclude가 되어야 함\n❌ ① (a) accuracy: 적절\n❌ ③ (c) quality: 적절\n❌ ④ (d) morally: 적절\n❌ ⑤ (e) escape: 적절`,tip:`42번 정답: ② — include → exclude`}},
{id:20,type:`어형 변환 (서술형)`,diff:`어려움`,pts:6,fmt:"written",wa:`importantly`,accept:[`importantly`,`Importantly`],passage:`Some researchers view spoken languages as incomplete devices for capturing precise differences. They think numbers represent the most neutral language of description. However, when our language of description is changed to numbers, we do not move toward greater accuracy. Numbers are no more appropriate 'pictures of the world' than words, music, or painting. While useful for specific purposes (e.g., census taking, income distribution), they include information of enormous value. For example, the future lives of young students are tied to their scores on national tests. In effect, whether they can continue with their education, where, and at what cost depends __________ (important) on a handful of numbers. These numbers do not account for the quality of schools they have attended, whether they have been tutored, have supportive parents, have test anxiety, and so on. Finally, putting aside the many ways in which statistical results can be manipulated, there are ways in which turning people's lives into numbers is morally insulating. Statistics on crime, homelessness, or the spread of a disease say nothing of people's suffering. We read the statistics as reports on events at a distance, thus allowing us to escape without being disturbed. Statistics are human beings with the tears wiped off. Quantify with caution.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`동사 depends를 수식하는 부사가 필요 → important → <b>importantly</b>`,analysis:`important(형용사) → importantly(부사): 동사 수식\n'depends importantly on' = 중요하게 ~에 달려 있다`,tip:`important(형용사: 중요한) → importantly(부사: 중요하게) — -ly 접미사`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📖 온라인워크북 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
