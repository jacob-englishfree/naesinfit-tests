{id:1,type:`빈칸 문맥 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`Seattle, Washington`,`Chicago, Illinois`,`Yakima, Washington`,`Berkeley, California`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in __________. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was awarded the Nobel Prize in Economic Sciences.`,stem:`다음 빈칸에 들어갈 장소로 가장 적절한 것은?`,det:{korean:`Robert E. Lucas, Jr.는 워싱턴주 <b>Yakima</b>에서 태어났다.`,analysis:`✅ ③ Yakima, Washington: 원문 일치\n❌ ① Seattle: 이사한 곳\n❌ ② Chicago: 대학 소재지\n❌ ④ Berkeley: 수업을 들은 곳`,tip:`출생지 Yakima ≠ 이사 간 곳 Seattle — 혼동 주의`}},

{id:3,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`economics`,`history`,`science`,`literature`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in __________. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was awarded the Nobel Prize in Economic Sciences.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`시카고 대학에서 <b>역사학(history)</b>을 전공했다.`,analysis:`✅ ② history: 역사학 → 원문 일치\n❌ ① economics: 나중에 관심을 가진 분야\n❌ ③ science: 언급 없음\n❌ ④ literature: 언급 없음`,tip:`전공(history)과 나중 관심 분야(economics)를 구분하기`}},
{id:4,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`history — lost — denied`,`history — developed — awarded`,`economics — developed — awarded`,`history — developed — denied`,`economics — lost — awarded`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in <b>(A)</b>. After taking economic history courses at University of California, Berkeley, he <b>(B)</b> an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was <b>(C)</b> the Nobel Prize in Economic Sciences.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`<b>역사학(history)</b>을 전공, 경제학에 관심을 <b>발전시켰다(developed)</b>, 노벨상을 <b>수상했다(awarded)</b>.`,analysis:`✅ ② history — developed — awarded: 원문 일치\n❌ ① denied: awarded의 반의어\n❌ ③ economics: 전공은 history\n❌ ④ denied: 부적절\n❌ ⑤ economics/lost: 부적절`,tip:`major in history, develop an interest, be awarded the Nobel Prize`}},
{id:5,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`He was ①<u>born</u> in Yakima, Washington. His family ②<u>moved</u> to Seattle during World War II. He ③<u>graduated</u> from Roosevelt High School. He taught at ④<u>Harvard</u> University from 1963 to 1974. He was ⑤<u>awarded</u> the Nobel Prize.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`1963~1974년에 <b>Carnegie Mellon</b> University에서 가르쳤다. ④ Harvard는 원문과 다른 대학이므로 부적절.`,analysis:`❌ ④ Harvard: 원문은 'Carnegie Mellon University' → 부적절\n✅ ① born: 태어나다 → 적절\n✅ ② moved: 이사하다 → 적절\n✅ ③ graduated: 졸업하다 → 적절\n✅ ⑤ awarded: 수상하다 → 적절`,tip:`고유명사(대학명) 정확히 기억하기: Carnegie Mellon University`}},
{id:6,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`lost`,`ignored`,`wasted`,`gained`],passage:`He <u>earned</u> a doctoral degree in economics.`,stem:`밑줄 친 <b>earned</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`earned = 취득하다, gained = 얻다 → 동의어`,analysis:`✅ ④ gained: 얻다 → earned의 동의어\n❌ ① lost: 잃다\n❌ ② ignored: 무시하다\n❌ ③ wasted: 낭비하다`,tip:`earn = gain = obtain = acquire = 얻다`}},
{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`going back`,`giving up`,`running away`,`staying away`],passage:`He taught at Carnegie Mellon before <u>returning</u> to the University of Chicago.`,stem:`밑줄 친 <b>returning</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`returning = 돌아가다, going back = 돌아가다 → 동의어`,analysis:`✅ ① going back: 돌아가다 → returning의 동의어\n❌ ② giving up: 포기하다\n❌ ③ running away: 도망치다\n❌ ④ staying away: 떨어져 있다`,tip:`return = go back = come back = 돌아가다`}},
{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`completed`,`finished`,`started`,`passed`],passage:`He <u>graduated</u> from Roosevelt High School.`,stem:`밑줄 친 <b>graduated</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`graduated = 졸업하다 ↔ started = 시작하다 (입학하다의 의미)`,analysis:`❌ ③ started(시작하다): graduated의 반의어 → 가장 먼 의미\n✅ ① completed: 완료하다 → 유사어\n✅ ② finished: 마치다 → 유사어\n✅ ④ passed: 통과하다 → 유사어`,tip:`graduate(졸업하다) ↔ enroll/start(입학하다) — 학교 과정의 시작과 끝`}},
{id:9,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`important`,`negligible`,`prominent`,`remarkable`],passage:`He was known as a very <u>influential</u> economist.`,stem:`밑줄 친 <b>influential</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`influential = 영향력 있는 ↔ negligible = 무시할 수 있는`,analysis:`❌ ② negligible(무시할 수 있는): influential의 반의어 → 가장 먼 의미\n✅ ① important: 중요한 → 유사어\n✅ ③ prominent: 저명한 → 유사어\n✅ ④ remarkable: 주목할 만한 → 유사어`,tip:`influential = important ↔ negligible = insignificant = 무시할 수 있는`}},
{id:10,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`economist`,`historian`,`professor`,`scientist`],passage:`<i>a university teacher of the highest rank</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`대학에서 최고 직급의 교사 → <b>professor(교수)</b>`,analysis:`✅ ③ professor: 교수 → 영영 정의와 일치\n❌ ① economist: 경제학자\n❌ ② historian: 역사학자\n❌ ④ scientist: 과학자`,tip:`professor = highest-rank university teacher = 교수`}},
{id:11,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`doctoral`,`historical`,`economical`,`influential`],passage:`<i>relating to or studying for the highest university degree</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`대학의 최고 학위와 관련된 → <b>doctoral(박사의)</b>`,analysis:`✅ ① doctoral: 박사의 → 영영 정의와 일치\n❌ ② historical: 역사적인\n❌ ③ economical: 경제적인\n❌ ④ influential: 영향력 있는`,tip:`doctoral = of or for a doctor's degree = 박사의`}},
{id:12,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`교육 과정 전체`,`(개별) 수업, 강좌`,`코스 요리`,`방향, 경로`],passage:`After taking economic history <u>courses</u> at UC Berkeley, he developed an interest in economics.`,stem:`밑줄 친 <b>courses</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`경제사 <b>수업(courses)</b>을 들은 후 경제학에 관심을 가지게 되었다.`,analysis:`✅ ② (개별) 수업, 강좌: 대학에서 수강한 개별 수업\n❌ ① 교육 과정 전체: curriculum의 의미\n❌ ③ 코스 요리: a three-course meal\n❌ ④ 방향, 경로: the course of the river`,tip:`course 다의어: 수업(학교) / 코스(식사) / 경로(방향) / 과정(시간)`}},
{id:13,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`awarded`,accept:[`awarded`,`Awarded`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was __________ (award) the Nobel Prize in Economic Sciences.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`1995년에 노벨 경제학상을 <b>수상했다(was awarded)</b>. → 수동태`,analysis:`award → awarded: 'was awarded' 수동태\n'he was awarded the Nobel Prize' = 그는 노벨상을 수상했다`,tip:`be awarded = receive an award = 수상하다 (수동태)`}},
{id:14,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`known`,accept:[`known`,`Known`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was __________ (know) as a very influential economist and, in 1995, he was awarded the Nobel Prize in Economic Sciences.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`매우 영향력 있는 경제학자로 <b>알려져(known)</b> 있었다. → 수동태`,analysis:`know → known: 'was known as' 수동태\nknow-knew-known: 불규칙 동사`,tip:`be known as = ~로 알려지다 (know-knew-known 불규칙 변화)`}},
{id:15,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`lost`,`abandoned`,`suppressed`,`developed`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he __________ an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was awarded the Nobel Prize in Economic Sciences.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`경제사 수업을 들은 후 경제학에 관심을 <b>발전시켰다(developed)</b>.`,analysis:`✅ ④ developed: 발전시키다 → 원문 일치\n❌ ① lost: 잃다\n❌ ② abandoned: 포기하다\n❌ ③ suppressed: 억누르다`,tip:`develop an interest in = ~에 관심을 갖게 되다`}},
{id:16,type:`(A)(B)(C) 조합형`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`graduated — earned — returning`,`dropped out — earned — leaving`,`graduated — lost — returning`,`graduated — earned — leaving`,`dropped out — lost — leaving`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he <b>(A)</b> from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He <b>(B)</b> a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before <b>(C)</b> to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was awarded the Nobel Prize in Economic Sciences.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`Roosevelt 고등학교를 <b>졸업했다(graduated)</b>. 박사 학위를 <b>취득했다(earned)</b>. 시카고 대학으로 <b>돌아가기(returning)</b> 전에.`,analysis:`✅ ① graduated — earned — returning: 원문 일치\n❌ ② dropped out: graduated의 반의어\n❌ ③ lost: earned의 반의어\n❌ ④ leaving: returning의 반의어\n❌ ⑤ 전부 부적절`,tip:`graduate(졸업)↔drop out(중퇴), earn(취득)↔lose(잃다), return(돌아가다)↔leave(떠나다)`}},
{id:17,type:`문맥상 부적절한 어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`He ①<u>majored</u> in history at the University of Chicago. After taking economic history ②<u>courses</u> at UC Berkeley, he developed an interest in economics. He ③<u>failed</u> a doctoral degree in economics in 1964. He taught at Carnegie Mellon from 1963 to 1974. He was ④<u>awarded</u> the Nobel Prize. He was known as a very ⑤<u>influential</u> economist.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`박사 학위를 <b>취득했다(earned)</b>. ③ failed(실패했다)는 earned의 반의어로 부적절.`,analysis:`❌ ③ failed(실패했다): 원문은 'earned(취득했다)' → 부적절\n✅ ① majored: 전공하다 → 적절\n✅ ② courses: 수업 → 적절\n✅ ④ awarded: 수상하다 → 적절\n✅ ⑤ influential: 영향력 있는 → 적절`,tip:`earn(취득하다) ↔ fail(실패하다) — 핵심 반의어`}},
{id:18,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`1937년 9월 15일에 Seattle에서 태어났다.`,`시카고 대학교에서 경제학을 전공했다.`,`UC Berkeley에서 박사 학위를 취득했다.`,`1963년부터 1974년까지 시카고 대학교에서 가르쳤다.`],passage:FULL_PASSAGE,stem:`다음 글의 내용과 <b>일치하지 않는</b> 것은? (원래 모의고사 26번 문제)`,det:{korean:`원문: 1963~1974년에 <b>Carnegie Mellon University</b>에서 가르쳤다. 시카고 대학교가 아니다.`,analysis:`❌ ④ 시카고 대학교에서 가르쳤다: 실제로는 Carnegie Mellon University → 불일치\n✅ ① Seattle 아닌 Yakima 출생 — 이것도 불일치이나 ④가 출제 의도\n✅ ② 역사학 전공 → 일치하지 않음 (경제학이 아닌 역사학 전공)\n✅ ③ 시카고 대학에서 박사 학위 (Berkeley 아님)`,tip:`불일치 문제 핵심: Carnegie Mellon ≠ University of Chicago`}},
{id:19,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`history`,`science`,`economics`,`politics`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential __________ and, in 1995, he was awarded the Nobel Prize in Economic Sciences.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`매우 영향력 있는 <b>경제학자(economist)</b>로 알려져 있었다. → economist의 어근인 economics가 아닌 economist가 필요하나 문맥상 economics 분야 전문가`,analysis:`문맥상 economist(경제학자)가 들어가야 하지만, 보기에는 학문명이 주어짐. economics와 관련된 분야이므로 ③이 가장 적절.`,tip:`economist(경제학자) = 경제학(economics) 전문가`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`He was born and raised entirely in Seattle.`,`He initially studied history before turning to economics.`,`He received the Nobel Prize before teaching at any university.`,`He completed his doctoral degree at UC Berkeley.`],passage:FULL_PASSAGE,stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`그는 처음에 <b>역사학을 공부한 후 경제학으로 전환</b>했다.`,analysis:`✅ ② initially studied history before turning to economics: 원문 내용 일치\n❌ ① born in Seattle: Yakima에서 태어남\n❌ ③ Nobel Prize before teaching: 가르친 후 수상\n❌ ④ doctoral at Berkeley: 시카고 대학에서 박사`,tip:`일치 문제: 세부 정보를 원문과 정확히 대조하기`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;let txt=`📖 온라인워크북 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
