.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d8d0c5;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #e0d8cf;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FFFCFA;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#FFF5EE;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}

const FULL_PASSAGE=`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was awarded the Nobel Prize in Economic Sciences.`;

const Q=[
{id:1,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`studied`,`dropped out`,`graduated`,`transferred`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he __________ from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was awarded the Nobel Prize in Economic Sciences.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`Roosevelt 고등학교를 <b>졸업했다(graduated)</b>.`,analysis:`✅ ③ graduated: 졸업하다 → 원문 일치\n❌ ① studied: 공부하다 (졸업 아님)\n❌ ② dropped out: 중퇴하다\n❌ ④ transferred: 전학하다`,tip:`graduate from = ~를 졸업하다`}},
{id:2,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`majored`,`minored`,`failed`,`dropped`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he __________ in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was awarded the Nobel Prize in Economic Sciences.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`시카고 대학에서 역사학을 <b>전공했다(majored)</b>.`,analysis:`✅ ① majored: 전공하다 → 원문 일치\n❌ ② minored: 부전공하다\n❌ ③ failed: 낙제하다\n❌ ④ dropped: 수강 취소하다`,tip:`major in = ~를 전공하다`}},
{id:3,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`relocated`,`completed studies at`,`enrolled in`,`visited`],passage:`He <u>graduated from</u> Roosevelt High School.`,stem:`밑줄 친 <b>graduated from</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`graduated from = ~를 졸업하다, completed studies at = ~에서 학업을 마치다 → 동의어`,analysis:`✅ ② completed studies at: 학업을 마치다 → graduated from의 동의어\n❌ ① relocated: 이전하다\n❌ ③ enrolled in: 입학하다\n❌ ④ visited: 방문하다`,tip:`graduate from = complete studies at = finish school at = 졸업하다`}},
{id:4,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`rejected`,`ignored`,`criticized`,`granted`],passage:`He was <u>awarded</u> the Nobel Prize in Economic Sciences.`,stem:`밑줄 친 <b>awarded</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`awarded = 수상하다, granted = 수여하다 → 동의어`,analysis:`✅ ④ granted: 수여하다 → awarded의 동의어\n❌ ① rejected: 거부하다\n❌ ② ignored: 무시하다\n❌ ③ criticized: 비판하다`,tip:`award = grant = bestow = confer = 수여하다`}},
{id:5,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`relocated`,`transferred`,`migrated`,`remained`],passage:`During World War II, his family <u>moved</u> to Seattle.`,stem:`밑줄 친 <b>moved</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`moved = 이사하다 ↔ remained = 머물다`,analysis:`❌ ④ remained(머물다): moved의 반의어 → 가장 먼 의미\n✅ ① relocated: 이전하다 → 동의어\n✅ ② transferred: 옮기다 → 유사어\n✅ ③ migrated: 이주하다 → 유사어`,tip:`move = relocate = migrate ↔ remain = stay = 머물다`}},
{id:6,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`unrecognized`,`famous`,`celebrated`,`respected`],passage:`He was <u>known</u> as a very influential economist.`,stem:`밑줄 친 <b>known</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`known = 알려진 ↔ unrecognized = 인정받지 못한`,analysis:`❌ ① unrecognized(인정받지 못한): known의 반의어 → 가장 먼 의미\n✅ ② famous: 유명한 → 동의어\n✅ ③ celebrated: 저명한 → 동의어\n✅ ④ respected: 존경받는 → 유사어`,tip:`known = famous = recognized ↔ unrecognized = unknown = 알려지지 않은`}},
{id:7,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`moved — graduated — denied`,`stayed — graduated — awarded`,`moved — graduated — awarded`,`moved — dropped out — awarded`,`stayed — dropped out — denied`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family <b>(A)</b> to Seattle, where he <b>(B)</b> from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was <b>(C)</b> the Nobel Prize in Economic Sciences.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`가족이 Seattle로 <b>이사했다(moved)</b>. Roosevelt 고등학교를 <b>졸업했다(graduated)</b>. 노벨상을 <b>수상했다(awarded)</b>.`,analysis:`✅ ③ moved — graduated — awarded: 원문 일치\n❌ ① denied: awarded의 반의어\n❌ ② stayed: moved의 반의어\n❌ ④ dropped out: graduated의 반의어\n❌ ⑤ stayed/dropped out/denied: 모두 부적절`,tip:`move(이사)↔stay(머물다), graduate(졸업)↔drop out(중퇴), award(수상)↔deny(거부)`}},
{id:8,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`He was ①<u>born</u> in Yakima. He ②<u>ignored</u> an interest in economics after taking courses at UC Berkeley. He ③<u>earned</u> a doctoral degree. He ④<u>taught</u> at Carnegie Mellon University. He was ⑤<u>awarded</u> the Nobel Prize.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`경제학에 관심을 <b>발전시켰다(developed)</b>. ② ignored(무시했다)는 developed의 반의어로 부적절.`,analysis:`❌ ② ignored(무시했다): 원문은 'developed(발전시켰다)' → 부적절\n✅ ① born: 태어나다 → 적절\n✅ ③ earned: 취득하다 → 적절\n✅ ④ taught: 가르치다 → 적절\n✅ ⑤ awarded: 수상하다 → 적절`,tip:`develop(발전시키다) ↔ ignore(무시하다) — 관심을 발전시킴 vs 무시함`}},
{id:9,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`course`,`degree`,`interest`,`award`],passage:`<i>an academic title given by a university after completing a program of study</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`학업 프로그램을 완료한 후 대학이 수여하는 학술 칭호 → <b>degree(학위)</b>`,analysis:`✅ ② degree: 학위 → 영영 정의와 일치\n❌ ① course: 수업\n❌ ③ interest: 관심\n❌ ④ award: 상`,tip:`degree = academic qualification = 학위`}},
{id:10,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`influential`,`economical`,`historical`,`educational`],passage:`<i>having great influence on someone or something</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`누군가 또는 무언가에 큰 영향을 미치는 → <b>influential(영향력 있는)</b>`,analysis:`✅ ① influential: 영향력 있는 → 영영 정의와 일치\n❌ ② economical: 경제적인\n❌ ③ historical: 역사적인\n❌ ④ educational: 교육적인`,tip:`influential = having great influence = 영향력 있는`}},
{id:11,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`관심, 흥미`,`이자 (금융)`,`이해관계`,`지분`],passage:`He <u>developed</u> an <u>interest</u> in economics.`,stem:`밑줄 친 <b>interest</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`경제학에 <b>관심(interest)</b>을 발전시켰다.`,analysis:`✅ ① 관심, 흥미: 학문에 대한 관심 맥락\n❌ ② 이자: bank interest\n❌ ③ 이해관계: conflict of interest\n❌ ④ 지분: ownership interest`,tip:`interest 다의어: 관심(일반) / 이자(금융) / 이해관계(법률) / 지분(사업)`}},
{id:12,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`economist`,accept:[`economist`,`Economist`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential __________ (economy) and, in 1995, he was awarded the Nobel Prize in Economic Sciences.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`매우 영향력 있는 <b>경제학자(economist)</b>로 알려져 있었다. → 사람을 나타내는 명사`,analysis:`economy(명사: 경제) → economist(명사: 경제학자)\n'a very influential economist' = 매우 영향력 있는 경제학자`,tip:`economy(경제) → economics(경제학) → economist(경제학자) → economic(경제의)`}},
{id:13,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`taking`,accept:[`taking`,`Taking`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in history. After __________ (take) economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was awarded the Nobel Prize in Economic Sciences.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`경제사 수업을 <b>들은(taking)</b> 후 → 전치사 after + 동명사`,analysis:`take → taking: 전치사(after) + 동명사(-ing)\n'After taking courses' = 수업을 들은 후`,tip:`after + V-ing: ~한 후에 (전치사 뒤 동명사)`}},
{id:14,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`leaving`,`returning`,`escaping`,`withdrawing`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before __________ to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was awarded the Nobel Prize in Economic Sciences.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`시카고 대학으로 <b>돌아가기(returning)</b> 전에 Carnegie Mellon에서 가르쳤다.`,analysis:`✅ ② returning: 돌아가다 → 원문 일치\n❌ ① leaving: 떠나다\n❌ ③ escaping: 탈출하다\n❌ ④ withdrawing: 철수하다`,tip:`return to = go back to = ~로 돌아가다`}},
{id:15,type:`문맥상 부적절한 어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:4,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`He was ①<u>born</u> in Yakima, Washington. His family ②<u>moved</u> to Seattle. He ③<u>majored</u> in history. He ④<u>earned</u> a doctoral degree in economics. He was a very influential economist but was ⑤<u>overlooked</u> for the Nobel Prize.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`노벨상을 <b>수상했다(awarded)</b>. ⑤ overlooked(간과되었다)는 awarded의 반의어로 부적절.`,analysis:`❌ ⑤ overlooked(간과되었다): 원문은 'awarded(수상했다)' → 부적절\n✅ ① born: 태어나다 → 적절\n✅ ② moved: 이사하다 → 적절\n✅ ③ majored: 전공하다 → 적절\n✅ ④ earned: 취득하다 → 적절`,tip:`award(수여하다) ↔ overlook(간과하다) — 핵심 반의어`}},
{id:16,type:`(A)(B)(C) 조합형`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`doctoral — taught — denied`,`doctoral — taught — awarded`,`master's — studied — awarded`,`doctoral — taught — rejected`,`doctoral — studied — awarded`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a <b>(A)</b> degree in economics from the University of Chicago in 1964. He <b>(B)</b> at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was <b>(C)</b> the Nobel Prize in Economic Sciences.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`<b>박사(doctoral)</b> 학위를 취득했다. Carnegie Mellon에서 <b>가르쳤다(taught)</b>. 노벨상을 <b>수상했다(awarded)</b>.`,analysis:`✅ ② doctoral — taught — awarded: 원문 일치\n❌ ① denied: awarded의 반의어\n❌ ③ master's/studied: 부적절\n❌ ④ rejected: 거부됨\n❌ ⑤ studied: taught가 아닌 공부`,tip:`doctoral(박사의), teach(가르치다)↔study(공부하다), award(수상)↔deny/reject(거부)`}},
{id:17,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`denied`,`rejected`,`overlooked`,`awarded`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before returning to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was __________ the Nobel Prize in Economic Sciences.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`1995년에 노벨 경제학상을 <b>수상했다(awarded)</b>.`,analysis:`✅ ④ awarded: 수상하다 → 원문 일치\n❌ ① denied: 거부하다\n❌ ② rejected: 거절하다\n❌ ③ overlooked: 간과하다`,tip:`be awarded = receive = 수상하다`}},
{id:18,type:`어형 변환 (서술형)`,diff:`어려움`,pts:6,fmt:"written",wa:`returning`,accept:[`returning`,`Returning`],passage:`Robert E. Lucas, Jr. was born on September 15, 1937, in Yakima, Washington. During World War II, his family moved to Seattle, where he graduated from Roosevelt High School. At the University of Chicago, he majored in history. After taking economic history courses at University of California, Berkeley, he developed an interest in economics. He earned a doctoral degree in economics from the University of Chicago in 1964. He taught at Carnegie Mellon University from 1963 to 1974 before __________ (return) to the University of Chicago to become a professor of economics. He was known as a very influential economist and, in 1995, he was awarded the Nobel Prize in Economic Sciences.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`시카고 대학으로 <b>돌아가기(returning)</b> 전에 → 전치사 before + 동명사`,analysis:`return → returning: 전치사(before) + 동명사(-ing)\n'before returning to' = ~로 돌아가기 전에`,tip:`before + V-ing: ~하기 전에 (전치사 뒤 동명사)`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`1937년 9월 15일에 Seattle에서 태어났다.`,`시카고 대학교에서 경제학을 전공했다.`,`UC Berkeley에서 박사 학위를 취득했다.`,`1963년부터 1974년까지 시카고 대학교에서 가르쳤다.`],passage:FULL_PASSAGE,stem:`다음 글의 내용과 <b>일치하지 않는</b> 것은? (원래 모의고사 26번 문제)`,det:{korean:`원문: 1963~1974년에 <b>Carnegie Mellon University</b>에서 가르쳤다. 시카고 대학교가 아니다.`,analysis:`❌ ④ 시카고 대학교에서 가르쳤다: 실제로는 Carnegie Mellon University → 불일치\n✅ 나머지 선택지도 일부 부정확하나 ④가 출제 의도의 정답`,tip:`불일치 문제 핵심: Carnegie Mellon ≠ University of Chicago`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`He spent his entire career at one university.`,`He was awarded the Nobel Prize before 1990.`,`His academic interests shifted from history to economics.`,`He earned his doctoral degree at UC Berkeley.`],passage:FULL_PASSAGE,stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`그의 학문적 관심이 <b>역사학에서 경제학으로 전환</b>되었다.`,analysis:`✅ ③ academic interests shifted from history to economics: 원문 내용 일치\n❌ ① entire career at one: 여러 대학에서 근무\n❌ ② before 1990: 1995년에 수상\n❌ ④ doctoral at Berkeley: 시카고 대학에서 박사`,tip:`일치 문제: history 전공 → economics 관심 발전 = 학문적 관심 전환`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;let txt=`🧩 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
