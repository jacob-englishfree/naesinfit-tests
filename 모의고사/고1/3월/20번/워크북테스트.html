.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.level-bar{margin-top:16px;height:8px;background:#e8e0f5;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--o),var(--ol));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FDFBFF;border-radius:var(--rs);border:1px solid #ddd6f3;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--oxl);}.info-cell.highlight .ic-value{color:var(--o);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0f5;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:#EDE9FE;color:var(--o);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--oxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0c8e2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--o);color:var(--o);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #ddd6f3;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FDFBFF;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F8F5FD;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:#EDE9FE;color:var(--o);}.expl-tag.tip{background:var(--oxl);color:var(--od);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--o);}.expl-box.tip-b{border-left:3px solid var(--o);background:var(--oxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

const EI={"subject":"2025 고1 3월 모의고사","pub":"20번","lesson":"주장","title":"Gestural Communication","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_2025_g1_mar_20"};

const FULL_PASSAGE=`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not overshadow them.`;

const Q=[
{id:1,type:`어법`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`involve`,`to complement`,`adding`,`indicate`,`creating`],passage:`Improving your gestural communication ①<u>involve</u> more than just knowing when to nod or shake hands. It's about using gestures ②<u>to complement</u> your spoken messages, ③<u>adding</u> layers of meaning to your words. For example, open-handed gestures, for example, can ④<u>indicate</u> honesty, ⑤<u>creating</u> an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not overshadow them.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 어법상 틀린 것은?`,det:{korean:`주어 'Improving your gestural communication'은 동명사구로 단수 취급 → ① involve → <b>involves</b>`,analysis:`❌ ① involve: 동명사 주어는 단수 → involves가 맞음\n✅ ② to complement: 'about using gestures to complement' → to부정사 적절\n✅ ③ adding: 분사구문(부대상황)\n✅ ④ indicate: 조동사 can 뒤 동사원형\n✅ ⑤ creating: 분사구문(결과)`,tip:`동명사 주어(V-ing ~)는 항상 단수 취급 → 동사에 -s 붙임`}},
{id:2,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms ①<u>facing</u> up. This simple yet ②<u>powerful</u> gesture can make others ③<u>to feel</u> more ④<u>comfortable</u> and ⑤<u>willing</u> to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not overshadow them.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 어법상 틀린 것은?`,det:{korean:`make + 목적어 + 동사원형 → ③ to feel → <b>feel</b>`,analysis:`❌ ③ to feel: 사역동사 make 뒤 목적격보어는 동사원형 → feel\n✅ ① facing: 현재분사(palms와 능동 관계)\n✅ ② powerful: 형용사(gesture 수식)\n✅ ④ comfortable: 형용사(보어)\n✅ ⑤ willing: 형용사(보어)`,tip:`사역동사 make + 목적어 + 동사원형 (to부정사 불가)`}},
{id:3,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, ①<u>drawing</u> attention away from your words. Imagine a speaker ②<u>who</u> hands move quickly like birds, their message ③<u>lost</u> in the chaos of their gestures. ④<u>Balance</u> is key. Your gestures should ⑤<u>highlight</u> your words, not overshadow them.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 어법상 틀린 것은?`,det:{korean:`a speaker whose hands → 소유격 관계대명사 whose 필요. ② who → <b>whose</b>`,analysis:`❌ ② who: 뒤에 명사 hands가 오므로 소유격 whose 필요\n✅ ① drawing: 분사구문(결과)\n✅ ③ lost: 과거분사(수동: 메시지가 잃어버려진)\n✅ ④ Balance: 명사(주어)\n✅ ⑤ highlight: 동사원형(should 뒤)`,tip:`관계대명사: who(주격) / whom(목적격) / whose(소유격) — 뒤에 명사 → whose`}},
{id:4,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to ①<u>complement</u> your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate ②<u>dishonesty</u>, creating an atmosphere of trust. You invite ③<u>openness</u> and ④<u>collaboration</u> when you speak with your ⑤<u>palms</u> facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not overshadow them.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`열린 손동작은 <b>정직함(honesty)</b>을 나타낸다. ② dishonesty(부정직함)는 부적절.`,analysis:`❌ ② dishonesty: 원문 honesty → 신뢰 분위기와 모순\n✅ ① complement: 보완하다\n✅ ③ openness: 개방성\n✅ ④ collaboration: 협력\n✅ ⑤ palms: 손바닥`,tip:`honesty(정직) ↔ dishonesty(부정직) — 문맥: 신뢰(trust)의 분위기`}},
{id:5,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:4,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the ①<u>trap</u> of over-gesturing. Too many hand movements can ②<u>distract</u> from your message, drawing attention ③<u>away</u> from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. ④<u>Balance</u> is key. Your gestures should ⑤<u>overshadow</u> your words, not overshadow them.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`제스처는 말을 <b>강조(highlight)</b>해야 한다. ⑤ overshadow(가리다)는 부적절 — 원문은 'highlight, not overshadow'.`,analysis:`❌ ⑤ overshadow: 원문은 'should highlight your words, not overshadow them'\n✅ ① trap: 함정\n✅ ② distract: 주의를 분산하다\n✅ ③ away: 멀리 (draw attention away)\n✅ ④ Balance: 균형`,tip:`highlight(강조하다) ↔ overshadow(가리다) — 원문: should highlight, not overshadow`}},
{id:6,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`contradicting your spoken messages`,`complement your spoken messages`,`replacing words with hand signals`,`avoiding eye contact with listeners`],passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to __________, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not overshadow them.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`제스처를 사용하여 <b>말을 보완하는(complement your spoken messages)</b> 것이다.`,analysis:`✅ ② complement your spoken messages: 원문 일치\n❌ ① contradicting: 모순시키다 → 반대\n❌ ③ replacing words: 대체 → 언급 없음\n❌ ④ avoiding eye contact: 시선 회피 → 무관`,tip:`complement = 보완하다. 제스처는 말을 대체하는 것이 아니라 보완하는 것`}},
{id:7,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`Repetition is essential`,`Speed determines success`,`Complexity adds value`,`Balance is key`],passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. __________. Your gestures should highlight your words, not overshadow them.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`과도한 제스처의 문제를 설명한 뒤, <b>균형이 핵심이다(Balance is key)</b>라고 결론짓는다.`,analysis:`✅ ④ Balance is key: 원문 일치, 과도함과 부족함 사이 균형\n❌ ① Repetition: 반복 → 무관\n❌ ② Speed: 속도 → 무관\n❌ ③ Complexity: 복잡함 → 반대`,tip:`글의 핵심: 제스처는 과하지도 부족하지도 않게 = Balance`}},
{id:8,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`complement`,accept:[`complement`,`Complement`,`complementing`],passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to __________ your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not overshadow them.`,stem:`다음 빈칸에 들어갈 단어를 본문에서 찾아 쓰시오.`,det:{korean:`제스처를 사용하여 말을 <b>보완하다(complement)</b>`,analysis:`complement: 보완하다 → 제스처가 말에 의미의 깊이를 더한다`,tip:`complement(보완) vs compliment(칭찬) — 철자 주의!`}},
{id:9,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`overshadow`,accept:[`overshadow`,`Overshadow`,`overshadowing`],passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not __________ them.`,stem:`다음 빈칸에 들어갈 단어를 본문에서 찾아 쓰시오.`,det:{korean:`제스처는 말을 강조해야지, <b>가려서는(overshadow)</b> 안 된다.`,analysis:`overshadow: 가리다, 빛을 잃게 하다 → highlight의 반의어`,tip:`highlight(강조) ↔ overshadow(가리다) — 핵심 대조 표현`}},
{id:10,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`trust`,accept:[`trust`,`Trust`],passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of __________. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not overshadow them.`,stem:`다음 빈칸에 들어갈 단어를 본문에서 찾아 쓰시오.`,det:{korean:`열린 손동작은 정직함을 나타내어 <b>신뢰(trust)</b>의 분위기를 만든다.`,analysis:`trust: 신뢰 → honesty(정직함)가 만들어내는 결과`,tip:`honesty → trust: 정직함이 신뢰의 분위기를 조성한다`}},
{id:11,type:`서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`palms facing up`,accept:[`palms facing up`,`your palms facing up`,`with your palms facing up`],passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with __________. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not overshadow them.`,stem:`다음 빈칸에 들어갈 표현을 본문에서 찾아 쓰시오. (3단어 이상)`,det:{korean:`<b>손바닥을 위로 향한 채(your palms facing up)</b> 말할 때 개방성과 협력을 이끌어낸다.`,analysis:`palms facing up: 손바닥을 위로 향하다 → 개방성·협력 유도 제스처`,tip:`palms facing up = 손바닥을 위로 → 신뢰와 개방의 제스처`}},
{id:12,type:`내용일치`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`Gestural communication is only about knowing when to nod.`,`Open-handed gestures can indicate honesty.`,`Over-gesturing helps make the message clearer.`,`The passage recommends avoiding all gestures.`],passage:FULL_PASSAGE,stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`열린 손동작은 <b>정직함을 나타낼 수 있다(indicate honesty)</b>. → 일치`,analysis:`✅ ② Open-handed gestures can indicate honesty: 원문 일치\n❌ ① only about nod: 'more than just knowing when to nod'\n❌ ③ over-gesturing helps: 반대(distract)\n❌ ④ avoiding all: 극단적`,tip:`원문: open-handed gestures can indicate honesty, creating an atmosphere of trust`}},
{id:13,type:`내용일치`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`The author says hand movements always improve communication.`,`Speaking with palms down shows trust and openness.`,`Too many hand movements can distract from the speaker's message.`,`The author recommends using as many gestures as possible.`],passage:FULL_PASSAGE,stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`너무 많은 손동작은 화자의 메시지로부터 <b>주의를 분산시킬 수 있다(distract)</b>.`,analysis:`✅ ③ Too many hand movements can distract: 원문 일치\n❌ ① always improve: 항상 → 과도하면 방해\n❌ ② palms down: 원문은 palms facing up\n❌ ④ as many as possible: 반대(balance)`,tip:`과도한 제스처(over-gesturing) → distract from message`}},
{id:14,type:`TF`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`True`,`False`],passage:`"Improving your gestural communication involves more than just knowing when to nod or shake hands."`,stem:`위 문장에 의하면, 몸짓 의사소통의 향상은 단순히 고개를 끄덕이는 것만으로 충분하다. (T/F)`,det:{korean:`원문: 고개 끄덕이는 것 <b>이상(more than)</b>이 필요 → 충분하지 않다 → <b>False</b>`,analysis:`False: 'more than just knowing when to nod' = 단순히 끄덕이는 것 이상`,tip:`more than just = ~하는 것 이상, 단순히 ~만이 아니라`}},
{id:15,type:`TF`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`True`,`False`],passage:`"You invite openness and collaboration when you speak with your palms facing up."`,stem:`위 문장에 의하면, 손바닥을 위로 향하고 말하면 개방성과 협력을 이끌어낼 수 있다. (T/F)`,det:{korean:`원문 그대로: 손바닥을 위로 향하면 개방성과 협력을 이끌어낸다 → <b>True</b>`,analysis:`True: 원문과 정확히 일치하는 내용`,tip:`palms facing up → openness + collaboration`}},
{id:16,type:`TF`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`True`,`False`],passage:`"Your gestures should highlight your words, not overshadow them."`,stem:`위 문장에 의하면, 제스처가 말보다 더 눈에 띄어야 한다. (T/F)`,det:{korean:`원문: 제스처는 말을 강조해야지, <b>가려서는 안 된다(not overshadow)</b> → False`,analysis:`False: 'not overshadow' = 가리면 안 된다 → 더 눈에 띄면 안 된다`,tip:`highlight(강조) vs overshadow(가리다) — 제스처 < 말`}},
{id:17,type:`TF`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`True`,`False`],passage:`"Too many hand movements can distract from your message, drawing attention away from your words."`,stem:`위 문장에 의하면, 과도한 손동작은 메시지에서 주의를 분산시킬 수 있다. (T/F)`,det:{korean:`원문 그대로: 과도한 손동작은 메시지에서 <b>주의를 분산(distract)</b>시킨다 → <b>True</b>`,analysis:`True: 원문과 정확히 일치하는 내용`,tip:`distract from = ~로부터 주의를 분산시키다`}},
{id:18,type:`내용일치`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`Gestures should replace spoken words entirely.`,`Open-handed gestures create feelings of suspicion.`,`A speaker whose hands move like birds communicates effectively.`,`The author emphasizes the importance of balance in using gestures.`],passage:FULL_PASSAGE,stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`필자는 제스처 사용에서 <b>균형의 중요성(importance of balance)</b>을 강조한다.`,analysis:`✅ ④ emphasizes importance of balance: 원문 'Balance is key'\n❌ ① replace entirely: 보완이지 대체가 아님\n❌ ② suspicion: trust가 맞음\n❌ ③ communicates effectively: 메시지가 혼란 속에 사라짐`,tip:`Balance is key = 균형이 핵심 — 글의 중심 주장`}},
{id:19,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`제스처는 말을 보완하되 균형 있게 사용해야 한다`,`제스처 없이 말만으로 의사소통해야 한다`,`빠른 손동작이 효과적인 의사소통의 핵심이다`,`모든 상황에서 열린 손동작을 사용해야 한다`],passage:FULL_PASSAGE,stem:`다음 글에서 필자가 주장하는 바로 가장 적절한 것은?`,det:{korean:`필자는 제스처가 말을 <b>보완(complement)</b>해야 하며, <b>균형(balance)</b>이 핵심이라고 주장한다.`,analysis:`✅ ① 제스처는 말을 보완하되 균형 있게 사용해야 한다: 글의 핵심\n❌ ② 제스처 없이: 극단적\n❌ ③ 빠른 손동작: 반대(chaos)\n❌ ④ 모든 상황에서: 과도한 일반화`,tip:`complement(보완) + balance(균형) = 글의 두 핵심 키워드`}},
{id:20,type:`서술형`,diff:`어려움`,pts:7,fmt:"written",wa:`Balance`,accept:[`Balance`,`balance`,`Balance is key`,`balance is key`],passage:FULL_PASSAGE,stem:`다음 글에서 필자가 제스처 사용에 있어 가장 중요하다고 강조하는 한 단어를 본문에서 찾아 쓰시오.`,det:{korean:`필자가 가장 중요하다고 강조하는 것: <b>Balance(균형)</b>`,analysis:`Balance is key = 균형이 핵심이다 → 글의 중심 주장을 한 단어로 요약`,tip:`'Balance is key'에서 Balance가 핵심 키워드`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법':'tag-grammar','어휘':'tag-vocab','빈칸추론':'tag-blank','서술형':'tag-written','내용일치':'tag-content','TF':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'#F59E0B':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:#EDE9FE;color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:#EDE9FE;color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📖 온라인워크북 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
