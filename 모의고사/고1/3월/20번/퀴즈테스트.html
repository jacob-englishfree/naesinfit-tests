.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d8c8b8;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--o);color:var(--o);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #e0d0c0;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FFFAF5;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#FFF3E8;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--oxl);color:var(--o);}.expl-tag.tip{background:var(--oxl);color:var(--od);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--o);}.expl-box.tip-b{border-left:3px solid var(--o);background:var(--oxl);}

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"20번","lesson":"주장","title":"Gestural Communication","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g1_mar_20_v3"};

const FULL_PASSAGE=`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not overshadow them.`;

const Q=[
// ━━━ Q1: 문장 삽입 · 어려움 · 6pts ━━━
{id:1,type:`문장삽입`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`①`,`②`,`③`,`④`],
passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, adding layers of meaning to your words. ① For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. ② You invite openness and collaboration when you speak with your palms facing up. ③ But be careful of the trap of over-gesturing. ④ Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not overshadow them.`,
stem:`다음 글에서 주어진 문장이 들어가기에 가장 적절한 곳은?\n<br><br><b>"This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation."</b>`,
det:{korean:`"손바닥을 위로 향하여 말할 때 개방성과 협력을 유도한다"는 문장 다음에, 이 <b>단순하지만 강력한 제스처</b>의 효과를 구체적으로 설명하는 문장이 와야 한다.`,
analysis:`✅ ③: "palms facing up" 직후 → "This simple yet powerful gesture"가 앞 문장의 제스처를 가리킴\n❌ ①: 아직 구체적 제스처 언급 전\n❌ ②: 열린 손 제스처 설명 중간 → 흐름 방해\n❌ ④: 과한 제스처 경고 뒤 → 문맥 불일치`,
tip:`"This"가 가리키는 대상(palms facing up)이 바로 앞에 있어야 자연스러운 연결`}},

// ━━━ Q2: 어순 배열 (서술형) · 어려움 · 6pts ━━━
{id:2,type:`어순배열`,diff:`어려움`,pts:6,fmt:"written",wa:`Your gestures should highlight your words`,accept:[`Your gestures should highlight your words`,`your gestures should highlight your words`],
passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. __________________________________________, not overshadow them.`,
stem:`다음 주어진 단어를 올바른 순서로 배열하시오.\n<br><br><b>your / should / gestures / words / highlight / your</b>`,
det:{korean:`"<b>Your gestures should highlight your words</b>, not overshadow them." → 제스처는 말을 강조해야지, 가려서는 안 된다.`,
analysis:`Your gestures(주어) + should highlight(동사) + your words(목적어)\n조동사 should 뒤 동사원형 highlight, 소유격 your가 두 번 사용`,
tip:`주어(Your gestures) + 조동사(should) + 동사원형(highlight) + 목적어(your words) 순서`}},

// ━━━ Q3: 어법 5지선다 · 보통 · 5pts ━━━
{id:3,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:4,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`①<u>Improving</u> your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, ②<u>adding</u> layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more ③<u>comfortable</u> and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker ④<u>whose</u> hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not ⑤<u>to overshadow</u> them.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 어법상 <b>틀린</b> 것은?`,
det:{korean:`⑤ to overshadow → <b>overshadow</b>: "should highlight ... not overshadow"에서 should가 생략된 병렬 구조이므로 동사원형이 와야 한다.`,
analysis:`❌ ⑤ to overshadow: should highlight ... not (should) overshadow → 병렬 구조에서 동사원형 필요\n✅ ① Improving: 동명사 주어 → 올바름\n✅ ② adding: 분사구문 (동시동작) → 올바름\n✅ ③ comfortable: feel + 형용사 보어 → 올바름\n✅ ④ whose: 소유격 관계대명사 (a speaker의 hands) → 올바름`,
tip:`should A, not B → A와 B 모두 동사원형. not 뒤에 to부정사가 아닌 원형이 와야 함`}},

ch:[`involve`,`involves`,`involving`,`to involve`],
passage:`Improving your gestural communication __________ more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not overshadow them.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`동명사구 "Improving your gestural communication"이 주어 → <b>단수 동사 involves</b>가 필요하다.`,
analysis:`✅ ② involves: 동명사 주어는 단수 취급 → 단수 동사\n❌ ① involve: 복수 동사 형태\n❌ ③ involving: 분사 → 동사 자리 불가\n❌ ④ to involve: to부정사 → 동사 자리 불가`,
tip:`동명사(~ing) 주어 = 단수 취급 → 단수 동사(involves, is, has 등)`}},

// ━━━ Q6: 부적절 어휘 5지선다 · 보통 · 5pts ━━━
{id:6,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to ①<u>complement</u> your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate ②<u>honesty</u>, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more ③<u>comfortable</u> and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can ④<u>enhance</u> your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should ⑤<u>highlight</u> your words, not overshadow them.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`과한 손동작은 메시지를 <b>산만하게 한다(distract)</b>. ④ enhance(향상시키다)는 distract의 반의어로 부적절.`,
analysis:`❌ ④ enhance(향상시키다): 원문은 distract(산만하게 하다) → "drawing attention away"와 enhance는 의미 충돌\n✅ ① complement(보완하다): 원문 일치\n✅ ② honesty(정직함): 원문 일치\n✅ ③ comfortable(편안한): 원문 일치\n✅ ⑤ highlight(강조하다): 원문 일치`,

// ━━━ Q7: 빈칸 추론 — complement · 어려움 · 6pts ━━━
{id:7,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`contradict`,`interrupt`,`complement`,`simplify`,`dominate`],
passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to __________ your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not overshadow them.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`제스처는 말에 의미의 겹을 더하며 <b>보완(complement)</b>하는 역할을 한다.`,
analysis:`✅ ③ complement(보완하다): "adding layers of meaning"이 힌트 → 보완하여 의미를 더함\n❌ ① contradict(모순되다): 반대 의미\n❌ ② interrupt(방해하다): 문맥과 반대\n❌ ④ simplify(단순화하다): "adding layers"와 어울리지 않음\n❌ ⑤ dominate(지배하다): 문맥과 다름`,
tip:`complement + adding layers of meaning: 보완하여 의미를 더하다`}},

// ━━━ Q8: 빈칸 추론 — overshadow · 어려움 · 6pts ━━━
{id:8,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:3,
ch:[`support`,`repeat`,`improve`,`overshadow`,`replace`],
passage:`Improving your gestural communication involves more than just knowing when to nod or shake hands. It's about using gestures to complement your spoken messages, adding layers of meaning to your words. For example, open-handed gestures, for example, can indicate honesty, creating an atmosphere of trust. You invite openness and collaboration when you speak with your palms facing up. This simple yet powerful gesture can make others feel more comfortable and willing to engage in conversation. But be careful of the trap of over-gesturing. Too many hand movements can distract from your message, drawing attention away from your words. Imagine a speaker whose hands move quickly like birds, their message lost in the chaos of their gestures. Balance is key. Your gestures should highlight your words, not __________ them.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`제스처는 말을 강조(highlight)해야지, <b>가려서는(overshadow)</b> 안 된다.`,
analysis:`✅ ④ overshadow(가리다): "highlight your words, not ______ them" → highlight의 반의어\n❌ ① support(지지하다): not support는 문맥상 부자연스러움\n❌ ② repeat(반복하다): 무관\n❌ ③ improve(개선하다): not improve는 이상함\n❌ ⑤ replace(대체하다): 의미는 통하나 highlight와의 대비가 약함`,
tip:`highlight ↔ overshadow: 강조하다 ↔ 가리다 — not 뒤에 반의어가 오는 대비 구조`}},

// ━━━ Q19: T/F — False · 어려움 · 6pts ━━━
{id:19,type:`T/F`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`True`,`False`],
passage:FULL_PASSAGE,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>The writer suggests that all hand movements should be minimized during communication.</b>"`,
det:{korean:`본문은 제스처를 <b>적절히 사용(Balance)</b>하라고 주장하지, 모든 손동작을 <b>최소화</b>하라고 하지 않는다. → <b>False</b>`,
analysis:`❌ False: "Balance is key" → 균형이 핵심이지, 모든 손동작 최소화가 아님\n"using gestures to complement your spoken messages" → 제스처 사용 자체는 권장`,
tip:`all/every/always/never 같은 극단적 표현 포함 진술은 False일 가능성이 높다`}},

// ━━━ Q20: T/F — True · 보통 · 5pts ━━━
{id:20,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`True`,`False`],
passage:FULL_PASSAGE,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>The passage compares excessive hand movements to birds.</b>"`,
det:{korean:`"hands move quickly like birds" → 과도한 손동작을 새에 비유 → <b>True</b>`,
analysis:`✅ True: "hands move quickly like birds" → 직유(simile)로 새에 비유`,
tip:`비유 표현 파악: like birds = 새처럼 → 직유(simile)`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'문장삽입':'tag-insert','어순배열':'tag-order','어법':'tag-grammar','어휘':'tag-vocab','빈칸추론':'tag-blank','서술형':'tag-written','내용이해':'tag-content','T/F':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch?(d.q.ch.length===5?'①②③④⑤':d.q.ch.length===4?'①②③④':d.q.ch.length===3?'①②③':'①②'):'';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--oxl);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--oxl);color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인퀴즈 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
