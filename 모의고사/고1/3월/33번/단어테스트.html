.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #dde8df;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FAFDFB;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F0F8F1;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}

.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}

const EI={"subject":"2025 고1 3월 모의고사","pub":"33번","lesson":"빈칸 추론","title":"피부 전기 전도와 감정 측정","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_2025_g1_mar_33"};

const FULL_PASSAGE=`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we're emotionally stimulated — stressed, sad, any intense emotion, really — our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you're going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`;

const Q=[
{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`conducts — stimulated — conductive`,`resists — stimulated — conductive`,`conducts — relaxed — conductive`,`conducts — stimulated — resistant`,`resists — relaxed — resistant`],passage:`Our skin <b>(A)</b> electricity more or less efficiently, depending on our emotions. We know that when we're emotionally <b>(B)</b> — stressed, sad, any intense emotion, really — our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically <b>(C)</b>. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you're going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`피부는 전기를 <b>전도한다(conducts)</b>. 감정적으로 <b>자극받으면(stimulated)</b> 피부가 더 전기적으로 <b>전도성이 높아진다(conductive)</b>.`,analysis:`✅ ① conducts — stimulated — conductive: 원문 일치\n❌ ② resists: conducts의 반의어\n❌ ③ relaxed: stimulated의 반의어\n❌ ④ resistant: conductive의 반의어\n❌ ⑤ 모두 반의어`,tip:`conduct(전도하다)↔resist(저항하다), stimulated(자극된)↔relaxed(이완된), conductive(전도성의)↔resistant(저항성의)`}},
{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`objective — subjective — conscious`,`objective — subjective — subconscious`,`subjective — objective — subconscious`,`objective — subjective — voluntary`,`subjective — subjective — subconscious`],passage:`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we\'re emotionally stimulated \u2014 stressed, sad, any intense emotion, really \u2014 our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you\'re going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an <b>(A)</b> value on a <b>(B)</b> state of mind. We can actually measure your emotional state by tracking how your body <b>(C)</b>ly sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`<b>객관적인(objective)</b> 가치를 <b>주관적인(subjective)</b> 마음 상태에 부여한다. 몸이 <b>무의식적으로(subconsciously)</b> 땀을 흘리는 것을 추적한다.`,analysis:`✅ ② objective — subjective — subconscious: 원문 일치\n❌ ① conscious: subconscious의 반의어\n❌ ③ 순서 뒤바뀜\n❌ ④ voluntary: 자발적(다른 의미)\n❌ ⑤ subjective — subjective: A가 틀림`,tip:`objective(객관적)↔subjective(주관적), subconscious(무의식적)↔conscious(의식적)`}},
{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Our skin ①<u>conducts</u> electricity more or less efficiently, depending on our emotions. We know that when we're emotionally ②<u>stimulated</u> — stressed, sad, any intense emotion, really — our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically ③<u>resistant</u>. This change in sweat gland ④<u>activity</u> happens completely without our ⑤<u>conscious</u> mind having much say in the matter. If you feel emotionally intense, you're going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`땀이 나면 피부가 더 전기적으로 <b>전도성이 높아진다(conductive)</b>. ③ resistant(저항성의)는 conductive의 반의어로 부적절.`,analysis:`❌ ③ resistant(저항성의): 원문은 'conductive(전도성의)' → 부적절\n✅ ① conducts: 전도하다 → 적절\n✅ ② stimulated: 자극된 → 적절\n✅ ④ activity: 활동 → 적절\n✅ ⑤ conscious: 의식적인 → 적절`,tip:`conductive(전도성의) ↔ resistant(저항성의) — 핵심 반의어`}},
{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`This is particularly useful from a ①<u>scientific</u> viewpoint, because it allows us to put an ②<u>objective</u> value on a ③<u>subjective</u> state of mind. We can then turn the subjective experience into a(n) ④<u>subjective</u> number by figuring out how good your skin gets at ⑤<u>transferring</u> an electrical current.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`주관적 경험을 <b>객관적인(objective)</b> 숫자로 바꾼다. ④ subjective(주관적인)는 objective의 반의어로 부적절.`,analysis:`❌ ④ subjective(주관적인): 원문은 'objective(객관적인)' → 부적절\n✅ ① scientific: 과학적인 → 적절\n✅ ② objective: 객관적인 → 적절\n✅ ③ subjective: 주관적인 → 적절\n✅ ⑤ transferring: 전달하는 → 적절`,tip:`objective(객관적) ↔ subjective(주관적) — 지문 핵심 대비 개념`}},
{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`resists`,`transmits`,`blocks`,`absorbs`],passage:`Our skin <u>conducts</u> electricity more or less efficiently.`,stem:`밑줄 친 <b>conducts</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`conducts = 전도하다, transmits = 전달하다 → 동의어`,analysis:`✅ ② transmits: 전달하다 → conducts의 동의어\n❌ ① resists: 저항하다\n❌ ③ blocks: 막다\n❌ ④ absorbs: 흡수하다`,tip:`conduct = transmit = carry = 전도·전달하다`}},
{id:6,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`relaxed`,`bored`,`aroused`,`calm`],passage:`When we're emotionally <u>stimulated</u> — stressed, sad, any intense emotion.`,stem:`밑줄 친 <b>stimulated</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`stimulated = 자극된, aroused = 자극된 → 동의어`,analysis:`✅ ③ aroused: 자극된 → stimulated의 동의어\n❌ ① relaxed: 이완된\n❌ ② bored: 지루한\n❌ ④ calm: 차분한`,tip:`stimulate = arouse = excite = 자극하다`}},
{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`measurable`,`immeasurable`,`invisible`,`impossible`],passage:`Our skin gets more electrically <u>conductive</u>.`,stem:`밑줄 친 <b>conductive</b>의 의미와 가장 <b>가까운</b> 것은? (전기가 잘 전달되는 = 측정 가능한)`,det:{korean:`conductive는 '전도성이 있는' 즉 전기를 잘 전달할 수 있는 의미. measurable(측정 가능한)이 가장 가까운 뉘앙스.`,analysis:`✅ ① measurable: 측정 가능한 → 전도성이 있어 측정 가능\n❌ ② immeasurable: 측정 불가한\n❌ ③ invisible: 보이지 않는\n❌ ④ impossible: 불가능한`,tip:`conductive = able to conduct/transmit electricity = 전도성의`}},
{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`powerful`,`strong`,`moderate`,`mild`],passage:`When we're emotionally stimulated — stressed, sad, any <u>intense</u> emotion.`,stem:`밑줄 친 <b>intense</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`intense = 강렬한 ↔ mild = 온화한, 약한`,analysis:`❌ ④ mild(온화한): intense의 반의어 → 가장 먼 의미\n✅ ① powerful: 강력한 → 유사어\n✅ ② strong: 강한 → 유사어\n✅ ③ moderate: 보통의 → 유사어 (부분 반의)`,tip:`intense = strong = powerful ↔ mild = gentle = weak`}},
{id:9,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`impartial`,`biased`,`neutral`,`fair`],passage:`It allows us to put an <u>objective</u> value on a subjective state of mind.`,stem:`밑줄 친 <b>objective</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`objective = 객관적인 ↔ biased = 편향된`,analysis:`❌ ② biased(편향된): objective의 반의어 → 가장 먼 의미\n✅ ① impartial: 공정한 → 유사어\n✅ ③ neutral: 중립적인 → 유사어\n✅ ④ fair: 공정한 → 유사어`,tip:`objective = impartial = unbiased ↔ biased = subjective = 편향된`}},
{id:10,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`resists`,`blocks`,`wastes`,`conducts`],passage:`Our skin __________ electricity more or less efficiently, depending on our emotions. We know that when we\'re emotionally stimulated \u2014 stressed, sad, any intense emotion, really \u2014 our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you\'re going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`피부는 감정에 따라 전기를 <b>전도한다(conducts)</b>.`,analysis:`✅ ④ conducts: 전도하다 → 원문 일치\n❌ ① resists: 저항하다\n❌ ② blocks: 차단하다\n❌ ③ wastes: 낭비하다`,tip:`conduct electricity = 전기를 전도하다`}},
{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`decrease`,`loss`,`increase`,`absence`],passage:`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we're emotionally stimulated — stressed, sad, any intense emotion, really — our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you're going to notice an __________ in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`감정적으로 강렬하면 땀샘 활동의 <b>증가(increase)</b>를 알아차릴 것이다.`,analysis:`✅ ③ increase: 증가 → 원문 일치\n❌ ① decrease: 감소\n❌ ② loss: 상실\n❌ ④ absence: 부재`,tip:`increase ↔ decrease — 증가 ↔ 감소`}},
{id:12,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`transferring`,`blocking`,`preventing`,`stopping`],passage:`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we\'re emotionally stimulated \u2014 stressed, sad, any intense emotion, really \u2014 our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you\'re going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at __________ an electrical current.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`피부가 전류를 <b>전달하는(transferring)</b> 데 얼마나 좋아지는지 파악한다.`,analysis:`✅ ① transferring: 전달하다 → 원문 일치\n❌ ② blocking: 차단하다\n❌ ③ preventing: 방지하다\n❌ ④ stopping: 멈추다`,tip:`transfer = transmit = convey = 전달하다`}},
{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`상태, 형편`,`국가`,`진술하다`,`주(州)`],passage:`We can actually measure your emotional <u>state</u> by tracking how your body subconsciously sweats.`,stem:`밑줄 친 <b>state</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`감정적 state는 <b>상태</b>의 의미. emotional state = 감정 상태.`,analysis:`✅ ① 상태, 형편: emotional state = 감정 상태\n❌ ② 국가: state as nation\n❌ ③ 진술하다: state as verb\n❌ ④ 주(州): state as province`,tip:`state 다의어: 상태(명사) / 국가(명사) / 진술하다(동사) / 주(명사)`}},
{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`조금, 약간(부사)`,`비트(컴퓨터 단위)`,`소량, 조금(명사)`,`물다(동사)`],passage:`Our bodies sweat a tiny <u>bit</u>, so little we might not even notice.`,stem:`밑줄 친 <b>bit</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`a tiny bit = 아주 <b>조금(소량)</b>. 여기서 bit은 명사로 '소량'의 의미.`,analysis:`✅ ③ 소량, 조금(명사): a tiny bit = 아주 소량\n❌ ① 조금(부사): a bit tired의 bit\n❌ ② 비트: 컴퓨터 용어\n❌ ④ 물다: bite의 과거형`,tip:`a bit = 조금 / a tiny bit = 아주 조금 / bit(명사) = 소량`}},
{id:15,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`emotion`,`electricity`,`sweat`,`conduct`],passage:`<i>moisture that comes out through the skin when the body is hot or under stress</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`몸이 덥거나 스트레스를 받을 때 피부를 통해 나오는 수분 → <b>sweat(땀)</b>`,analysis:`✅ ③ sweat: 땀 → 영영 정의와 일치\n❌ ① emotion: 감정\n❌ ② electricity: 전기\n❌ ④ conduct: 전도하다`,tip:`sweat = perspiration = 땀`}},
{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`subjective`,`objective`,`emotional`,`intense`],passage:`<i>based on facts rather than personal feelings or opinions</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`개인적 감정이나 의견이 아닌 사실에 기반한 → <b>objective(객관적인)</b>`,analysis:`✅ ② objective: 객관적인 → 영영 정의와 일치\n❌ ① subjective: 주관적인\n❌ ③ emotional: 감정적인\n❌ ④ intense: 강렬한`,tip:`objective = factual = unbiased ↔ subjective = personal = biased`}},
{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`efficiently`,accept:[`efficiently`,`Efficiently`],passage:`Our skin conducts electricity more or less __________ (efficient), depending on our emotions. We know that when we\'re emotionally stimulated \u2014 stressed, sad, any intense emotion, really \u2014 our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you\'re going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`동사 conducts를 수식하는 부사가 필요 → efficient → <b>efficiently</b>`,analysis:`efficient(형용사) → efficiently(부사): 동사 수식\n'conducts electricity efficiently' = 전기를 효율적으로 전도하다`,tip:`형용사 → 부사: -ly 추가 (efficient → efficiently)`}},
{id:18,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`emotionally`,accept:[`emotionally`,`Emotionally`],passage:`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we're __________ (emotional) stimulated — stressed, sad, any intense emotion, really — our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you're going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`형용사 stimulated를 수식하는 부사가 필요 → emotional → <b>emotionally</b>`,analysis:`emotional(형용사) → emotionally(부사): 형용사 수식\n'emotionally stimulated' = 감정적으로 자극된`,tip:`형용사 → 부사: -ly 추가 (emotional → emotionally) — 형용사를 수식하는 부사`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`control your body temperature`,`prevent emotional responses`,`increase sweat gland production`,`measure your emotional state`],passage:FULL_PASSAGE,stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은? (원래 모의고사 33번 문제)`,det:{korean:`피부의 전기 전도도를 통해 무의식적 땀 분비를 추적함으로써 <b>감정 상태를 측정할 수(measure your emotional state)</b> 있다.`,analysis:`✅ ④ measure your emotional state: 지문의 핵심 논지와 일치\n❌ ① control body temperature: 체온 조절 언급 없음\n❌ ② prevent emotional responses: 감정 반응 방지 아님\n❌ ③ increase sweat gland production: 땀샘 생산 증가 아님`,tip:`빈칸 추론: 객관적 가치 → 주관적 상태 측정이라는 핵심 논리 파악`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`sweat is harmful to the body`,`emotions cannot be scientifically studied`,`skin conductivity reflects emotional intensity`,`electrical currents control human emotions`],passage:FULL_PASSAGE,stem:`지문의 주된 요지로 가장 적절한 것은?`,det:{korean:`지문의 핵심 요지: <b>피부 전도도가 감정의 강도를 반영한다(skin conductivity reflects emotional intensity)</b>.`,analysis:`✅ ③ skin conductivity reflects emotional intensity: 지문 핵심 요지\n❌ ① sweat is harmful: 땀이 해롭다는 내용 없음\n❌ ② emotions cannot be studied: 정반대 내용\n❌ ④ electrical currents control emotions: 인과관계 뒤바뀜`,tip:`요지 파악: 감정 → 땀 → 전기 전도도 → 객관적 측정 가능`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;const mk5='①②③④⑤',mk4='①②③④';const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={t:0,o:0,w:[]};typeMap[t].t++;if(d.ok)typeMap[t].o++;else typeMap[t].w.push(d.q.id);});
let txt=`📝 온라인단어 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
