<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"33번","lesson":"빈칸 추론","title":"Skin Electricity & Emotions","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_2025_g1_mar_33_v1"};

const FULL_PASSAGE=`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we're emotionally stimulated\u2014stressed, sad, any intense emotion, really\u2014our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without your conscious mind having much say in the matter. If you feel emotionally intense, you're going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`;

const Q=[
{id:1,type:`(A)(B)(C) 조합형`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`conducts — stimulated — subjective`,`conducts — stimulated — objective`,`resists — stimulated — subjective`,`conducts — relaxed — subjective`,`resists — relaxed — objective`],
passage:`Our skin <b>(A)</b> electricity more or less efficiently, depending on our emotions. We know that when we're emotionally <b>(B)</b>\u2014stressed, sad, any intense emotion, really\u2014our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without your conscious mind having much say in the matter. If you feel emotionally intense, you're going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a <b>(C)</b> state of mind.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`피부는 전기를 <b>전도하고(conducts)</b>, 감정적으로 <b>자극받으면(stimulated)</b> 땀이 나며, 이를 통해 <b>주관적인(subjective)</b> 마음 상태를 객관적 수치로 바꿀 수 있다.`,
analysis:`✅ ① conducts — stimulated — subjective: 원문 일치\n❌ ② objective: 빈칸 뒤 "state of mind"는 주관적임\n❌ ③ resists(저항하다): conducts의 반의어\n❌ ④ relaxed(이완된): stimulated의 반의어\n❌ ⑤ 모두 부적절`,
tip:`conduct electricity = 전기를 전도하다 | stimulated = 자극받은 | subjective ↔ objective`}},

{id:2,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`conductive — conscious — intensity`,`conductive — unconscious — intensity`,`resistant — conscious — frequency`,`conductive — conscious — frequency`,`resistant — unconscious — intensity`],
passage:`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we're emotionally stimulated\u2014stressed, sad, any intense emotion, really\u2014our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically <b>(A)</b>. This change in sweat gland activity happens completely without your <b>(B)</b> mind having much say in the matter. If you feel emotionally intense, you're going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional <b>(C)</b> into an objective number by figuring out how good your skin gets at transferring an electrical current.`,
stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,
det:{korean:`땀이 나면 피부가 더 전기적으로 <b>전도성이 있게(conductive)</b> 되고, <b>의식적인(conscious)</b> 마음과 무관하게 일어나며, 감정적 <b>강도(intensity)</b>를 객관적 수치로 바꾼다.`,
analysis:`✅ ① conductive — conscious — intensity: 원문 일치\n❌ ② unconscious: 원문은 "conscious mind having much say" (의식이 관여 못함)\n❌ ③ resistant/frequency: 둘 다 부적절\n❌ ④ frequency: intensity가 맞음\n❌ ⑤ resistant/unconscious: 둘 다 부적절`,
tip:`conductive(전도성) ↔ resistant(저항성) | conscious(의식적) ↔ unconscious(무의식적) | intensity(강도) ↔ frequency(빈도)`}},

{id:3,type:`문맥상 부적절한 어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we're emotionally stimulated\u2014stressed, sad, any intense emotion, really\u2014our bodies sweat a tiny bit, so little we might not even ①<u>notice</u>. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without your ②<u>conscious</u> mind having much say in the matter. If you feel emotionally ③<u>intense</u>, you're going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an ④<u>subjective</u> value on a subjective state of mind. We can actually measure your emotional state by tracking how your body ⑤<u>subconsciously</u> sweats.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`주관적 마음 상태에 <b>객관적인(objective)</b> 가치를 부여한다. ④ subjective(주관적인)는 objective의 반의어로 부적절.`,
analysis:`❌ ④ subjective(주관적인): 원문은 objective(객관적인) → "put an objective value"가 올바른 표현\n✅ ① notice(알아차리다): 원문 일치\n✅ ② conscious(의식적인): 원문 일치\n✅ ③ intense(강렬한): 원문 일치\n✅ ⑤ subconsciously(무의식적으로): 원문 일치`,
tip:`objective(객관적) ↔ subjective(주관적) — "put an ___ value on a subjective state" → 주관적 상태에 객관적 가치 부여`}},

{id:4,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`①`,`②`,`③`,`④`,`⑤`],
passage:`Our skin conducts electricity more or less ①<u>efficiently</u>, depending on our emotions. We know that when we're emotionally stimulated\u2014stressed, sad, any intense emotion, really\u2014our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely ②<u>with</u> your conscious mind having much say in the matter. If you feel emotionally intense, you're going to notice an ③<u>increase</u> in sweat gland activity. This is particularly ④<u>useful</u> from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually ⑤<u>measure</u> your emotional state.`,
stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,
det:{korean:`땀샘 활동 변화는 의식적 마음의 관여 <b>없이(without)</b> 일어난다. ② with는 without의 반의어로 부적절.`,
analysis:`❌ ② with: 원문은 without(~없이) → 의식이 관여하지 않음\n✅ ① efficiently(효율적으로): 원문 일치\n✅ ③ increase(증가): 원문 일치\n✅ ④ useful(유용한): 원문 일치\n✅ ⑤ measure(측정하다): 원문 일치`,
tip:`without(~없이) ↔ with(~와 함께) — "completely without your conscious mind" = 의식과 무관하게`}},

{id:5,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,
ch:[`transmits`,`resists`,`leads`,`blocks`],
passage:`Our skin <u>conducts</u> electricity more or less efficiently, depending on our emotions.`,
stem:`밑줄 친 <b>conducts</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`conduct = 전도하다, transmit = 전달하다 → 의미 유사. 하지만 가장 가까운 것은 leads(이끌다/전도하다).`,
analysis:`✅ ③ leads: conduct electricity = lead electricity (전기를 전도하다)\n❌ ① transmits: 전달하다 (유사하지만 leads가 더 가까움)\n❌ ② resists: 반의어\n❌ ④ blocks: 반의어`,
tip:`conduct electricity = 전기를 전도하다 = lead/transmit electricity`}},

{id:6,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`relaxed`,`aroused`,`calm`,`indifferent`],
passage:`We know that when we're emotionally <u>stimulated</u>\u2014stressed, sad, any intense emotion.`,
stem:`밑줄 친 <b>stimulated</b>의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`stimulated = 자극받은, aroused = (감정적으로) 각성된/자극받은 → 동의어`,
analysis:`✅ ② aroused(자극받은): stimulated의 동의어\n❌ ① relaxed(이완된): 반의어\n❌ ③ calm(침착한): 반의어\n❌ ④ indifferent(무관심한): 반의어`,
tip:`stimulated = aroused = excited = 자극받은, 각성된 ↔ relaxed, calm`}},

{id:7,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`particularly`,`barely`,`randomly`,`commonly`],
passage:`This is <u>especially</u> useful from a scientific viewpoint.`,
stem:`밑줄 친 <b>especially</b>(=particularly)의 의미와 가장 <b>가까운</b> 것은?`,
det:{korean:`especially = particularly = 특히 → 동의어`,
analysis:`✅ ① particularly(특히): especially의 동의어\n❌ ② barely(거의 ~않다): 다른 의미\n❌ ③ randomly(무작위로): 다른 의미\n❌ ④ commonly(흔히): 다른 뉘앙스`,
tip:`especially = particularly = in particular = 특히`}},

{id:8,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,
ch:[`personal`,`mental`,`inner`,`objective`],
passage:`We can then turn the <u>subjective</u>, subconscious experience of emotional intensity into an objective number.`,
stem:`밑줄 친 <b>subjective</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`subjective = 주관적인 ↔ objective = 객관적인`,
analysis:`❌ ④ objective(객관적인): subjective의 반의어 → 가장 먼 의미\n✅ ① personal(개인적인): 유사 의미\n✅ ② mental(정신적인): 유사 의미\n✅ ③ inner(내적인): 유사 의미`,
tip:`subjective(주관적) ↔ objective(객관적) — 이 글의 핵심 대비 구조`}},

{id:9,type:`반의어 고르기`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`strong`,`powerful`,`mild`,`severe`],
passage:`We know that when we're emotionally stimulated\u2014stressed, sad, any <u>intense</u> emotion.`,
stem:`밑줄 친 <b>intense</b>의 의미와 가장 <b>먼</b> 것은?`,
det:{korean:`intense = 강렬한 ↔ mild = 온화한, 약한`,
analysis:`❌ ③ mild(온화한): intense의 반의어 → 가장 먼 의미\n✅ ① strong(강한): 유사어\n✅ ② powerful(강력한): 유사어\n✅ ④ severe(극심한): 유사어`,
tip:`intense = strong = severe(강렬한) ↔ mild = gentle = weak(온화한, 약한)`}},

{id:10,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`resists`,`absorbs`,`conducts`,`reflects`],
passage:`Our skin __________ electricity more or less efficiently, depending on our emotions. We know that when we're emotionally stimulated\u2014stressed, sad, any intense emotion, really\u2014our bodies sweat a tiny bit. And when those tiny drops of sweat appear, our skin gets more electrically conductive.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`피부는 감정에 따라 전기를 다소 효율적으로 <b>전도한다(conducts)</b>.`,
analysis:`✅ ③ conducts(전도하다): "electrically conductive"와 연결\n❌ ① resists(저항하다): 반의어\n❌ ② absorbs(흡수하다): 다른 의미\n❌ ④ reflects(반사하다): 다른 의미`,
tip:`conduct + electricity = 전기를 전도하다 → conductive(전도성 있는)`}},

{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`decrease`,`balance`,`resistance`,`increase`],
passage:`If you feel emotionally intense, you're going to notice an __________ in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`감정적으로 강렬하면 땀샘 활동의 <b>증가(increase)</b>를 알아차릴 것이다.`,
analysis:`✅ ④ increase(증가): 감정이 강렬할수록 땀이 더 많이 남\n❌ ① decrease(감소): 반대\n❌ ② balance(균형): 무관\n❌ ③ resistance(저항): 무관`,
tip:`intense emotion → increase in sweat gland activity: 강렬한 감정 → 땀샘 활동 증가`}},

{id:12,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,
ch:[`objective`,`emotional`,`temporary`,`personal`],
passage:`This is particularly useful from a scientific viewpoint, because it allows us to put an __________ value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`주관적 마음 상태에 <b>객관적인(objective)</b> 가치를 부여할 수 있다.`,
analysis:`✅ ① objective(객관적인): "subjective state"와 대비 → 객관적 가치\n❌ ② emotional(감정적인): 이미 감정 상태를 측정하는 것이므로 동어 반복\n❌ ③ temporary(일시적인): 무관\n❌ ④ personal(개인적인): subjective와 유사해 대비 안 됨`,
tip:`objective value ↔ subjective state: 주관적 상태에 객관적 가치 부여가 핵심`}},

{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`전도하다`,`지휘하다`,`수행하다`,`안내하다`],
passage:`Our skin <u>conducts</u> electricity more or less efficiently.`,
stem:`밑줄 친 <b>conducts</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`conduct electricity = 전기를 <b>전도하다</b>`,
analysis:`✅ ① 전도하다: conduct + electricity = 전기를 전도하다\n❌ ② 지휘하다: conduct an orchestra\n❌ ③ 수행하다: conduct a survey\n❌ ④ 안내하다: conduct a tour`,
tip:`conduct: 전도하다(전기) | 지휘하다(오케스트라) | 수행하다(조사) | 안내하다(투어)`}},

{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`중요하다`,`물질, 소재`,`문제, 사안`,`신경 쓰다`],
passage:`This change in sweat gland activity happens completely without your conscious mind having much say in the <u>matter</u>.`,
stem:`밑줄 친 <b>matter</b>의 문맥적 의미로 가장 적절한 것은?`,
det:{korean:`have much say in the matter = 이 <b>문제/사안</b>에 대해 많은 발언권을 가지다`,
analysis:`✅ ③ 문제, 사안: "in the matter" = 이 문제에 있어서\n❌ ① 중요하다: it doesn't matter\n❌ ② 물질: dark matter\n❌ ④ 신경 쓰다: I don't care about the matter`,
tip:`matter: 문제/사안(명사) | 중요하다(동사) | 물질(명사) — 문맥에 따라 해석`}},

{id:15,type:`영영풀이 매칭`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`objective`,`emotional`,`conductive`,`intense`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"having the ability to transmit heat or electricity"</b>`,
det:{korean:`'열이나 전기를 전달하는 능력이 있는' → <b>conductive(전도성 있는)</b>`,
analysis:`✅ ③ conductive: 영영 정의와 정확히 일치\n❌ ① objective: 객관적인\n❌ ② emotional: 감정적인\n❌ ④ intense: 강렬한`,
tip:`conductive = able to conduct/transmit heat or electricity = 전도성 있는`}},

{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`conscious`,`conductive`,`emotional`,`subjective`],
passage:``,
stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?\n<br><b>"based on personal feelings or opinions rather than facts"</b>`,
det:{korean:`'사실보다 개인의 감정이나 의견에 기반한' → <b>subjective(주관적인)</b>`,
analysis:`✅ ④ subjective: 영영 정의와 일치\n❌ ① conscious: 의식적인\n❌ ② conductive: 전도성 있는\n❌ ③ emotional: 감정적인`,
tip:`subjective = based on personal feelings ↔ objective = based on facts`}},

{id:17,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`emotionally`,accept:[`emotionally`,`Emotionally`],
passage:`We know that when we're __________ (emotional) stimulated\u2014stressed, sad, any intense emotion, really\u2014our bodies sweat a tiny bit.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`emotional(형용사) → <b>emotionally(부사)</b>: stimulated(형용사/분사)를 수식하는 부사 필요`,
analysis:`emotional(형용사) → emotionally(부사)\n형용사 stimulated를 수식하려면 부사가 필요`,
tip:`emotional → emotionally / physical → physically — 형용사 → -ly 부사화`}},

{id:18,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`electrically`,accept:[`electrically`,`Electrically`],
passage:`And when those tiny drops of sweat appear, our skin gets more __________ (electrical) conductive.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`electrical(형용사) → <b>electrically(부사)</b>: conductive(형용사)를 수식하는 부사 필요`,
analysis:`electrical(형용사) → electrically(부사)\n형용사 conductive를 수식하려면 부사가 필요`,
tip:`electrical → electrically / physical → physically — 형용사 + -ly = 부사`}},

{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:3,
ch:[`limit reactions of hormones`,`control the electrical current`,`improve your skin conditions`,`measure your emotional state`,`diversify emotional experiences`],
passage:FULL_PASSAGE.replace('measure your emotional state','__________'),
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`피부의 전기 전도성을 추적하여 실제로 <b>감정 상태를 측정할 수 있다(measure your emotional state)</b>.`,
analysis:`✅ ④ measure your emotional state: 주관적 감정을 객관적 수치로 바꾸는 것이 핵심\n❌ ① 호르몬 반응 제한: 언급 없음\n❌ ② 전류 제어: 측정이지 제어가 아님\n❌ ③ 피부 상태 개선: 글의 목적이 아님\n❌ ⑤ 감정 경험 다양화: 언급 없음`,
tip:`핵심: subjective state → objective value = 감정 상태를 측정하여 객관적 수치로 전환`}},

{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:3,
ch:[`피부의 전기 전도성은 외부 온도에 따라 변한다.`,`의식적 노력으로 땀 분비를 조절할 수 있다.`,`감정적 반응은 과학적으로 측정할 수 없다.`,`피부의 전기 전도성 추적으로 감정 상태를 객관적으로 측정할 수 있다.`,`강렬한 감정은 건강에 해로운 영향을 미친다.`],
passage:FULL_PASSAGE,
stem:`다음 글의 요지로 가장 적절한 것은?`,
det:{korean:`피부의 땀 분비와 전기 전도성을 추적하여 주관적 감정 상태를 <b>객관적 수치로 측정</b>할 수 있다는 것이 요지이다.`,
analysis:`✅ ④ 피부의 전기 전도성 추적으로 감정 상태를 객관적으로 측정할 수 있다: "put an objective value on a subjective state of mind"가 핵심\n❌ ① 외부 온도: 감정에 따른 것이지 온도가 아님\n❌ ② 의식적 조절: "without your conscious mind" → 의식과 무관\n❌ ③ 측정 불가: 측정 가능하다는 것이 요지\n❌ ⑤ 건강 영향: 언급 없음`,
tip:`요지: subjective emotional state → objective measurement through skin conductivity`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim();
let txt=`📝 온라인단어 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
