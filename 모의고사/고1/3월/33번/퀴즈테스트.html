const EI={"subject":"2025 고1 3월 모의고사","pub":"33번","lesson":"빈칸 추론","title":"피부 전기 전도와 감정 측정","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g1_mar_33"};

const FULL_PASSAGE=`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we're emotionally stimulated — stressed, sad, any intense emotion, really — our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you're going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`;

const Q=[
{id:1,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`resists`,`conducts`,`absorbs`,`reflects`],passage:`Our skin __________ electricity more or less efficiently, depending on our emotions. We know that when we\'re emotionally stimulated \u2014 stressed, sad, any intense emotion, really \u2014 our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you\'re going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`피부는 전기를 <b>전도한다(conducts)</b>.`,analysis:`✅ ② conducts → 원문 일치\n❌ ① resists: 저항하다\n❌ ③ absorbs: 흡수하다\n❌ ④ reflects: 반사하다`,tip:`conduct electricity = 전기를 전도하다`}},
{id:2,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`emotions`,`exercises`,`medications`,`temperatures`],passage:`Our skin conducts electricity more or less efficiently, depending on our __________. We know that when we\'re emotionally stimulated \u2014 stressed, sad, any intense emotion, really \u2014 our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you\'re going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`<b>감정(emotions)</b>에 따라 전기 전도가 달라진다.`,analysis:`✅ ① emotions → 원문 일치\n❌ ② exercises: 운동\n❌ ③ medications: 약물\n❌ ④ temperatures: 온도`,tip:`emotion = feeling = 감정`}},
{id:3,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`drops`,`waves`,`gland`,`muscle`],passage:`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we\'re emotionally stimulated \u2014 stressed, sad, any intense emotion, really \u2014 our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat __________ activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you\'re going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`땀<b>샘(gland)</b> 활동의 변화.`,analysis:`✅ ③ gland → sweat gland = 땀샘\n❌ ① drops: 방울\n❌ ② waves: 파도\n❌ ④ muscle: 근육`,tip:`sweat gland = 땀샘, sweat gland activity = 땀샘 활동`}},
{id:4,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`weakly`,`poorly`,`slowly`,`productively`],passage:`Our skin conducts electricity more or less <u>efficiently</u>.`,stem:`밑줄 친 <b>efficiently</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`efficiently = 효율적으로, productively = 생산적으로 → 가장 유사`,analysis:`✅ ④ productively: 생산적으로 → 효율적으로와 유사\n❌ ① weakly: 약하게\n❌ ② poorly: 서투르게\n❌ ③ slowly: 느리게`,tip:`efficiently = effectively = productively = 효율적으로`}},
{id:5,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`evaluate`,`ignore`,`create`,`prevent`],passage:`We can actually <u>measure</u> your emotional state.`,stem:`밑줄 친 <b>measure</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`measure = 측정하다, evaluate = 평가하다 → 동의어`,analysis:`✅ ① evaluate: 평가하다 → measure의 동의어\n❌ ② ignore: 무시하다\n❌ ③ create: 만들다\n❌ ④ prevent: 방지하다`,tip:`measure = evaluate = assess = gauge = 측정·평가하다`}},
{id:6,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`personal`,`emotional`,`objective`,`mental`],passage:`It allows us to put an objective value on a <u>subjective</u> state of mind.`,stem:`밑줄 친 <b>subjective</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`subjective = 주관적인 ↔ objective = 객관적인`,analysis:`❌ ③ objective → subjective의 반의어\n✅ ① personal: 개인적인 → 유사\n✅ ② emotional: 감정적인\n✅ ④ mental: 정신적인`,tip:`subjective ↔ objective — 주관적 ↔ 객관적`}},
{id:7,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`aware`,`unconscious`,`alert`,`mindful`],passage:`This change happens without our <u>conscious</u> mind having much say.`,stem:`밑줄 친 <b>conscious</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`conscious = 의식적인 ↔ unconscious = 무의식적인`,analysis:`❌ ② unconscious → conscious의 반의어\n✅ ① aware: 인식하는 → 유사어\n✅ ③ alert: 깨어있는 → 유사어\n✅ ④ mindful: 주의 깊은 → 유사어`,tip:`conscious = aware ↔ unconscious = unaware`}},
{id:8,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Our skin ①<u>conducts</u> electricity more or less efficiently, depending on our emotions. We know that when we're emotionally ②<u>stimulated</u> — stressed, sad, any intense emotion, really — our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically ③<u>insulative</u>. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you're going to notice an ④<u>increase</u> in sweat gland ⑤<u>activity</u>. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`피부가 더 전기적으로 <b>전도성이 높아진다(conductive)</b>. ③ insulative는 반의어로 부적절.`,analysis:`❌ ③ insulative → conductive의 반의어\n✅ 나머지 모두 적절`,tip:`conductive ↔ insulative`}},
{id:9,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`stressed — drops — resistant`,`stressed — drops — conductive`,`relaxed — drops — conductive`,`stressed — drops — insulative`,`relaxed — floods — conductive`],passage:`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we're emotionally stimulated — <b>(A)</b>, sad, any intense emotion, really — our bodies sweat a tiny bit, so little we might not even notice. And when those tiny <b>(B)</b> of sweat appear, our skin gets more electrically <b>(C)</b>. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you're going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`(A), (B), (C)에 들어갈 말로 적절한 조합은?`,det:{korean:`<b>스트레스(stressed)</b>를 받고, 땀의 <b>방울(drops)</b>이 나타나면, 피부가 더 전기적으로 <b>전도성이 높아진다(conductive)</b>.`,analysis:`✅ ② stressed — drops — conductive: 원문 일치\n❌ ① resistant: conductive의 반의어\n❌ ③ relaxed: 이완된\n❌ ④ insulative: 절연성의\n❌ ⑤ floods: 홍수`,tip:`stressed(스트레스 받은), drops(방울), conductive(전도성의)`}},
{id:10,type:`영영풀이 매칭`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`sweat`,`gland`,`skin`,`electricity`],passage:`<i>a form of energy resulting from the movement of charged particles, used for heating, lighting, etc.</i>`,stem:`다음 영영풀이에 해당하는 단어는?`,det:{korean:`하전 입자의 이동으로 생기는 에너지 형태 → <b>electricity(전기)</b>`,analysis:`✅ ④ electricity → 영영 정의 일치\n❌ ① sweat: 땀\n❌ ② gland: 분비샘\n❌ ③ skin: 피부`,tip:`electricity = 전기, electrical = 전기의`}},
{id:11,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`viewpoint`,`emotion`,`current`,`gland`],passage:`<i>a particular way of thinking about or looking at something; a perspective</i>`,stem:`다음 영영풀이에 해당하는 단어는?`,det:{korean:`사물을 바라보거나 생각하는 특정 방식 → <b>viewpoint(관점)</b>`,analysis:`✅ ① viewpoint → 영영 정의 일치\n❌ ② emotion: 감정\n❌ ③ current: 전류\n❌ ④ gland: 분비샘`,tip:`viewpoint = perspective = point of view = 관점`}},
{id:12,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`달리다, 뛰다`,`운영하다`,`흘려보내다, 통과시키다`,`유효하다`],passage:`We can measure your emotional state by <u>running</u> a bit of electricity through your skin.`,stem:`밑줄 친 <b>running</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`전기를 피부에 <b>흘려보내다(running through)</b>.`,analysis:`✅ ③ 흘려보내다: run electricity through = 전기를 통과시키다\n❌ ① 달리다: 기본 의미\n❌ ② 운영하다: run a business\n❌ ④ 유효하다: contract runs for`,tip:`run + 물질 + through = ~을 통과시키다, 흘려보내다`}},
{id:13,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`(물이) 흐름`,`(전기) 전류`,`현재의`,`최신의`],passage:`We can figure out how good your skin gets at transferring an electrical <u>current</u>.`,stem:`밑줄 친 <b>current</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`electrical current = <b>전류</b>.`,analysis:`✅ ② 전류: electrical current = 전류\n❌ ① 물 흐름: water current\n❌ ③ 현재의: current situation\n❌ ④ 최신의: current trend`,tip:`current 다의어: 전류(명사) / 흐름(명사) / 현재의(형용사)`}},
{id:14,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`particularly`,accept:[`particularly`,`Particularly`],passage:`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we\'re emotionally stimulated \u2014 stressed, sad, any intense emotion, really \u2014 our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you\'re going to notice an increase in sweat gland activity. This is __________ (particular) useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`형용사 useful을 수식하는 부사 필요 → <b>particularly</b>`,analysis:`particular(형용사) → particularly(부사)`,tip:`particular → particularly = 특히`}},
{id:15,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`intensity`,accept:[`intensity`,`Intensity`],passage:`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we\'re emotionally stimulated \u2014 stressed, sad, any intense emotion, really \u2014 our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you\'re going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional __________ (intense) into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`전치사 of 뒤 명사 필요 → intense → <b>intensity</b>`,analysis:`intense(형용사) → intensity(명사): of + 명사`,tip:`intense(강렬한) → intensity(강도) → intensely(강렬하게)`}},
{id:16,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`transferring`,accept:[`transferring`,`Transferring`],passage:`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we\'re emotionally stimulated \u2014 stressed, sad, any intense emotion, really \u2014 our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you\'re going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an objective value on a subjective state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at __________ (transfer) an electrical current.`,stem:`괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`전치사 at 뒤 동명사 필요 → transfer → <b>transferring</b>`,analysis:`transfer → transferring: 전치사(at) + 동명사(-ing)\n자음 r 뒤 -ing → transferring (r 겹침)`,tip:`at + V-ing 구문, transfer → transferring (r 중복)`}},
{id:17,type:`문맥상 부적절한 어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we\'re emotionally stimulated \u2014 stressed, sad, any intense emotion, really \u2014 our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you\'re going to notice an increase in sweat gland activity. This is particularly ①<u>useful</u> from a ②<u>scientific</u> viewpoint, because it allows us to put an ③<u>objective</u> value on a subjective state of mind. We can actually ④<u>hide</u> your emotional state by ⑤<u>tracking</u> how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at transferring an electrical current.`,stem:`밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`감정 상태를 <b>측정할 수(measure)</b> 있다. ④ hide(숨기다)는 measure의 반의어로 부적절.`,analysis:`❌ ④ hide → measure의 반의어 → 부적절\n✅ 나머지 모두 적절`,tip:`measure(측정하다) ↔ hide(숨기다)`}},
{id:18,type:`(A)(B)(C) 조합형`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`objective — subjective — transferring`,`subjective — objective — transferring`,`objective — subjective — blocking`,`objective — objective — transferring`,`subjective — subjective — blocking`],passage:`Our skin conducts electricity more or less efficiently, depending on our emotions. We know that when we\'re emotionally stimulated \u2014 stressed, sad, any intense emotion, really \u2014 our bodies sweat a tiny bit, so little we might not even notice. And when those tiny drops of sweat appear, our skin gets more electrically conductive. This change in sweat gland activity happens completely without our conscious mind having much say in the matter. If you feel emotionally intense, you\'re going to notice an increase in sweat gland activity. This is particularly useful from a scientific viewpoint, because it allows us to put an <b>(A)</b> value on a <b>(B)</b> state of mind. We can actually measure your emotional state by tracking how your body subconsciously sweats, by running a bit of electricity through your skin. We can then turn the subjective, subconscious experience of emotional intensity into an objective number by figuring out how good your skin gets at <b>(C)</b> an electrical current.`,stem:`(A), (B), (C)에 들어갈 말로 적절한 조합은?`,det:{korean:`<b>객관적(objective)</b> 가치를 <b>주관적(subjective)</b> 마음 상태에 부여, 전류를 <b>전달하는(transferring)</b>.`,analysis:`✅ ① objective — subjective — transferring: 원문 일치\n❌ ② 순서 뒤바뀜\n❌ ③ blocking: 반의어\n❌ ④ objective — objective: B 틀림\n❌ ⑤ 모두 틀림`,tip:`objective ↔ subjective 대비, transferring = 전달하는`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`control your body temperature`,`prevent emotional responses`,`increase sweat gland production`,`measure your emotional state`],passage:FULL_PASSAGE,stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은? (원래 모의고사 33번 문제)`,det:{korean:`피부 전기 전도도 추적 → <b>감정 상태 측정(measure your emotional state)</b>`,analysis:`✅ ④ measure your emotional state: 핵심 논지\n❌ ① 체온 조절: 언급 없음\n❌ ② 감정 반응 방지: 아님\n❌ ③ 땀샘 생산 증가: 아님`,tip:`빈칸 추론: 주관적 감정 → 객관적 수치 변환`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`피부에 전기를 흘리면 감정이 사라진다`,`땀을 많이 흘리면 건강해진다`,`피부 전기 전도도로 감정의 강도를 객관적으로 수치화할 수 있다`,`강렬한 감정은 피부 건강에 해롭다`],passage:FULL_PASSAGE,stem:`이 글의 주제로 가장 적절한 것은?`,det:{korean:`지문의 주제: <b>피부 전기 전도도로 감정의 강도를 객관적으로 수치화</b>할 수 있다.`,analysis:`✅ ③ 전기 전도도 → 감정 수치화: 핵심 주제\n❌ ① 감정 사라짐: 언급 없음\n❌ ② 건강: 관련 없음\n❌ ④ 피부 건강: 관련 없음`,tip:`주제 = 피부 전도도를 통한 감정 측정의 과학적 가능성`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;const mk5='①②③④⑤',mk4='①②③④';const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={t:0,o:0,w:[]};typeMap[t].t++;if(d.ok)typeMap[t].o++;else typeMap[t].w.push(d.q.id);});
let txt=`🧩 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
