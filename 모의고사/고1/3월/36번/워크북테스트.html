<style>
:root{--g:#7C3AED;--gd:#5B21B6;--gl:#F3F0FF;--gxl:#F3F0FF;--gxxl:#FAF5FF;--bg:#F5F3FF;--text:#1A1A2E;--tm:#6B5B8A;--tl:#9B8BB8;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--o:#F59E0B;--ol:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}

.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f0edf5;}.info-row:last-child{border:none;}

.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--g);border-radius:50%;}

.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{max-width:820px;margin:0 auto;padding:24px 20px 100px;}
.q-card{background:var(--card);border-radius:var(--radius);margin-bottom:22px;box-shadow:var(--shadow);overflow:hidden;}

.q-num{width:36px;height:36px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--gl);color:#5B21B6;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f0edf5;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--g);font-weight:800;}

.written-input{width:100%;padding:14px 16px;border:2px solid #d0c8dc;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);padding:10px 16px;display:flex;align-items:center;gap:5px;justify-content:center;z-index:100;overflow-x:auto;flex-wrap:wrap;}

.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--g),#8B5CF6);color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}

.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8e0f0;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),#A78BFA);transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FDFAFF;border-radius:var(--rs);border:1px solid #ddd6e8;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0f0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0c8dc;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #ddd6e8;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FDFAFF;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F5F0FA;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"36번","lesson":"순서","title":"Animal Thinking & Concepts","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_2025_g1_mar_36"};

const FULL_PASSAGE=`[Given] Let's assume that at least some animals are capable of thinking despite lacking a language.\n\n(C) This doesn't necessarily mean that they possess concepts, for some forms of thought may be nonconceptual. We can imagine, for instance, a squirrel who is planning how to get from the branch she's currently standing on to a branch from the tree in front.\n\n(B) To do this, in principle she doesn't need a concept of branch nor a concept of tree. It might be enough for her to have, for example, the ability to think in images; to make a mental map of the tree where she can imagine and try out different routes.\n\n(A) This doesn't imply that squirrels lack concepts, simply that they don't need them for this concrete form of thinking. For us to be able to say that an animal has concepts, we have to show not just that she's capable of thinking, but also that she has certain specific abilities.`;

const Q=[
{id:1,type:`빈칸 문맥 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`animals cannot think without language`,`all thinking requires concepts`,`thinking can occur without concepts`,`squirrels are the smartest animals`],passage:`Let's assume that at least some animals are capable of thinking despite lacking a language. This doesn't necessarily mean that they possess concepts, for some forms of thought may be nonconceptual. We can imagine, for instance, a squirrel who is planning how to get from the branch she's currently standing on to a branch from the tree in front. To do this, in principle she doesn't need a concept of branch nor a concept of tree. It might be enough for her to have, for example, the ability to think in images; to make a mental map of the tree where she can imagine and try out different routes. This doesn't imply that squirrels lack concepts, simply that they don't need them for this concrete form of thinking. For us to be able to say that an animal has concepts, we have to show not just that she's capable of thinking, but also that she has certain specific abilities.`,stem:`이 글의 핵심 주장으로 가장 적절한 것은?`,det:{korean:`동물이 언어 없이도 사고할 수 있고, 일부 사고는 비개념적일 수 있다 → <b>사고는 개념 없이도 일어날 수 있다</b>`,analysis:`✅ ③ thinking can occur without concepts: 핵심 주장\n❌ ① 언어 없이 사고 불가: 반대\n❌ ② 모든 사고에 개념 필요: 반대\n❌ ④ 다람쥐가 가장 똑똑: 언급 없음`,tip:`nonconceptual thinking = 비개념적 사고 → 개념 없이도 사고 가능`}},
{id:2,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`lacking`,accept:[`lacking`,`Lacking`],passage:`Let's assume that at least some animals are capable of thinking despite __________ (lack) a language. This doesn't necessarily mean that they possess concepts, for some forms of thought may be nonconceptual. We can imagine, for instance, a squirrel who is planning how to get from the branch she's currently standing on to a branch from the tree in front. To do this, in principle she doesn't need a concept of branch nor a concept of tree. It might be enough for her to have, for example, the ability to think in images; to make a mental map of the tree where she can imagine and try out different routes. This doesn't imply that squirrels lack concepts, simply that they don't need them for this concrete form of thinking. For us to be able to say that an animal has concepts, we have to show not just that she's capable of thinking, but also that she has certain specific abilities.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`전치사 despite 다음에는 동명사가 온다 → lack → <b>lacking</b>`,analysis:`lack → lacking: despite + 동명사(-ing)\n'despite lacking' = ~이 부족함에도 불구하고`,tip:`despite + 명사/동명사: ~에도 불구하고`}},
{id:3,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`nonconceptual`,accept:[`nonconceptual`,`Nonconceptual`,`non-conceptual`,`Non-conceptual`],passage:`Let's assume that at least some animals are capable of thinking despite lacking a language. This doesn't necessarily mean that they possess concepts, for some forms of thought may be __________ (concept → 비개념적인). We can imagine, for instance, a squirrel who is planning how to get from the branch she's currently standing on to a branch from the tree in front. To do this, in principle she doesn't need a concept of branch nor a concept of tree. It might be enough for her to have, for example, the ability to think in images; to make a mental map of the tree where she can imagine and try out different routes. This doesn't imply that squirrels lack concepts, simply that they don't need them for this concrete form of thinking. For us to be able to say that an animal has concepts, we have to show not just that she's capable of thinking, but also that she has certain specific abilities.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 힌트에 맞게 변형하여 쓰시오. (non- 접두사 + 형용사)`,det:{korean:`be 동사 뒤에 보어 역할을 하는 형용사가 필요하다 → concept → conceptual → <b>nonconceptual</b>`,analysis:`concept(명사) → conceptual(형용사) → nonconceptual(비개념적인)\nnon- 접두사 = ~이 아닌`,tip:`concept → conceptual → nonconceptual — non- 접두사는 부정의 의미`}},
{id:4,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`forgetting`,`avoiding`,`escaping`,`planning`],passage:`Let's assume that at least some animals are capable of thinking despite lacking a language. This doesn't necessarily mean that they possess concepts, for some forms of thought may be nonconceptual. We can imagine, for instance, a squirrel who is __________ how to get from the branch she's currently standing on to a branch from the tree in front. To do this, in principle she doesn't need a concept of branch nor a concept of tree. It might be enough for her to have, for example, the ability to think in images; to make a mental map of the tree where she can imagine and try out different routes. This doesn't imply that squirrels lack concepts, simply that they don't need them for this concrete form of thinking. For us to be able to say that an animal has concepts, we have to show not just that she's capable of thinking, but also that she has certain specific abilities.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`다람쥐가 한 가지에서 다른 가지로 이동하는 방법을 <b>계획하고 있다(planning)</b>.`,analysis:`✅ ④ planning: 계획하다 → 원문 일치\n❌ ① forgetting: 잊다\n❌ ② avoiding: 피하다\n❌ ③ escaping: 탈출하다`,tip:`plan = 계획하다 → planning how to = ~하는 방법을 계획하다`}},
{id:5,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`mental`,`physical`,`visual`,`actual`],passage:`Let's assume that at least some animals are capable of thinking despite lacking a language. This doesn't necessarily mean that they possess concepts, for some forms of thought may be nonconceptual. We can imagine, for instance, a squirrel who is planning how to get from the branch she's currently standing on to a branch from the tree in front. To do this, in principle she doesn't need a concept of branch nor a concept of tree. It might be enough for her to have, for example, the ability to think in images; to make a __________ map of the tree where she can imagine and try out different routes. This doesn't imply that squirrels lack concepts, simply that they don't need them for this concrete form of thinking. For us to be able to say that an animal has concepts, we have to show not just that she's capable of thinking, but also that she has certain specific abilities.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`다람쥐가 나무의 <b>정신적(mental)</b> 지도를 만들 수 있다.`,analysis:`✅ ① mental: 정신적인 → 원문 일치\n❌ ② physical: 물리적인\n❌ ③ visual: 시각적인\n❌ ④ actual: 실제의`,tip:`mental map = 정신적 지도, 머릿속 지도`}},
{id:6,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Let's assume that at least some animals are capable of thinking despite lacking a language. This doesn't necessarily mean that they possess concepts, for some forms of thought may be nonconceptual. We can imagine, for instance, a squirrel who is planning how to get from the branch she's currently standing on to a branch from the tree in front. To do this, in principle she doesn't need a concept of branch nor a concept of tree. It might be enough for her to have, for example, the ability to think in images; to make a mental map of the tree where she can imagine and try out different routes. This doesn't ①<u>imply</u> that squirrels ②<u>lack</u> concepts, simply that they don't need them for this ③<u>concrete</u> form of thinking. For us to be able to say that an animal has concepts, we have to show not just that she's capable of thinking, but also that she has certain ④<u>general</u> ⑤<u>abilities</u>.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`동물이 개념을 가지고 있다고 말하려면 <b>특정한(specific)</b> 능력을 보여야 한다. ④ general(일반적인)은 specific의 반의어로 부적절.`,analysis:`❌ ④ general(일반적인): 원문은 'specific(특정한)' → 부적절\n✅ ① imply: 암시하다 → 적절\n✅ ② lack: 부족하다 → 적절\n✅ ③ concrete: 구체적인 → 적절\n✅ ⑤ abilities: 능력 → 적절`,tip:`specific(특정한) ↔ general(일반적인) — 핵심 반의어`}},
{id:7,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`imply — need — general`,`suggest — lack — specific`,`imply — lack — specific`,`imply — possess — general`,`suggest — need — specific`],passage:`Let's assume that at least some animals are capable of thinking despite lacking a language. This doesn't necessarily mean that they possess concepts, for some forms of thought may be nonconceptual. We can imagine, for instance, a squirrel who is planning how to get from the branch she's currently standing on to a branch from the tree in front. To do this, in principle she doesn't need a concept of branch nor a concept of tree. It might be enough for her to have, for example, the ability to think in images; to make a mental map of the tree where she can imagine and try out different routes. This doesn't <b>(A)</b> that squirrels <b>(B)</b> concepts, simply that they don't need them for this concrete form of thinking. For us to be able to say that an animal has concepts, we have to show not just that she's capable of thinking, but also that she has certain <b>(C)</b> abilities.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`이것은 다람쥐가 개념이 <b>부족하다(lack)</b>고 <b>암시하는(imply)</b> 것이 아니라, 단지 필요하지 않다는 뜻이다. 그녀는 특정한 <b>구체적인(specific)</b> 능력이 있다.`,analysis:`✅ ③ imply — lack — specific: 원문 일치\n❌ ① general: specific의 반의어\n❌ ② suggest: imply와 유사하나 lack과 함께 원문과 다름\n❌ ④ possess: lack의 반의어\n❌ ⑤ need: lack이 아님`,tip:`imply(암시하다), lack(부족하다), specific(특정한)`}},
{id:8,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`concept`,`ability`,`route`,`image`],passage:`<i>the quality of being able to do something; talent, skill, or proficiency</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`무언가를 할 수 있는 자질; 재능, 기술 또는 숙련도 → <b>ability(능력)</b>`,analysis:`✅ ② ability: 능력 → 영영 정의와 일치\n❌ ① concept: 개념\n❌ ③ route: 경로\n❌ ④ image: 이미지`,tip:`ability = capability = capacity = skill = 능력`}},
{id:9,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`imply`,`state`,`prove`,`deny`],passage:`<i>to suggest or indicate something without being explicitly stated</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`명시적으로 말하지 않고 무언가를 제안하거나 나타내다 → <b>imply(암시하다)</b>`,analysis:`✅ ① imply: 암시하다 → 영영 정의와 일치\n❌ ② state: 진술하다 (명시적)\n❌ ③ prove: 증명하다\n❌ ④ deny: 부정하다`,tip:`imply = suggest = hint = 암시하다 ↔ state/declare(명시하다)`}},
{id:10,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`deny`,`reject`,`have`,`remove`],passage:`This doesn't necessarily mean that they <u>possess</u> concepts.`,stem:`밑줄 친 <b>possess</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`possess = 소유하다, have = 가지다 → 동의어`,analysis:`✅ ③ have: 가지다 → possess의 동의어\n❌ ① deny: 부정하다\n❌ ② reject: 거부하다\n❌ ④ remove: 제거하다`,tip:`possess = have = own = hold = 소유하다`}},
{id:11,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`demand`,`suggest`,`prove`,`deny`],passage:`This doesn't <u>imply</u> that squirrels lack concepts.`,stem:`밑줄 친 <b>imply</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`imply = 암시하다, suggest = 제안하다/암시하다 → 동의어`,analysis:`✅ ② suggest: 암시하다 → imply의 동의어\n❌ ① demand: 요구하다\n❌ ③ prove: 증명하다\n❌ ④ deny: 부정하다`,tip:`imply = suggest = hint at = indicate = 암시하다`}},
{id:12,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`incapable`,`able`,`skilled`,`talented`],passage:`Some animals are <u>capable</u> of thinking despite lacking a language.`,stem:`밑줄 친 <b>capable</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`capable = 능력 있는 ↔ incapable = 능력 없는`,analysis:`❌ ① incapable(능력 없는): capable의 반의어 → 가장 먼 의미\n✅ ② able: ~할 수 있는 → 동의어\n✅ ③ skilled: 숙련된 → 유사어\n✅ ④ talented: 재능 있는 → 유사어`,tip:`capable(능력 있는) ↔ incapable(능력 없는) — in- 접두사`}},
{id:13,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`real`,`solid`,`tangible`,`theoretical`],passage:`They don't need concepts for this <u>concrete</u> form of thinking.`,stem:`밑줄 친 <b>concrete</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`concrete = 구체적인 ↔ theoretical = 이론적인`,analysis:`❌ ④ theoretical(이론적인): concrete의 반의어 → 가장 먼 의미\n✅ ① real: 실제의 → 유사어\n✅ ② solid: 견고한 → 유사어\n✅ ③ tangible: 실질적인 → 동의어`,tip:`concrete(구체적인) ↔ abstract/theoretical(추상적인/이론적인)`}},
{id:14,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`형태, 양식 (서류)`,`형태, 유형 (종류)`,`형성하다`,`(학교의) 학년`],passage:`They don't need them for this concrete <u>form</u> of thinking.`,stem:`밑줄 친 <b>form</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`이 구체적인 사고의 <b>형태(form)</b>에 개념이 필요하지 않다.`,analysis:`✅ ② 형태, 유형 (종류): form of thinking = 사고의 형태\n❌ ① 양식: application form\n❌ ③ 형성하다: form a group\n❌ ④ 학년: sixth form (영국)`,tip:`form 다의어: 형태·유형 / 양식 / 형성하다 / 학년`}},
{id:15,type:`다의어 문맥적 의미`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`시도하다, 테스트하다`,`소진시키다`,`노력하다`,`재판하다`],passage:`She can imagine and <u>try out</u> different routes.`,stem:`밑줄 친 <b>try out</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`다람쥐는 다양한 경로를 상상하고 <b>시도해 볼(try out)</b> 수 있다.`,analysis:`✅ ① 시도하다, 테스트하다: try out = 시험 삼아 해보다\n❌ ② 소진시키다: try someone's patience\n❌ ③ 노력하다: try hard\n❌ ④ 재판하다: try a case`,tip:`try out = test = experiment with = 시도해 보다, 시험해 보다`}},
{id:16,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`standing`,accept:[`standing`,`Standing`],passage:`Let's assume that at least some animals are capable of thinking despite lacking a language. This doesn't necessarily mean that they possess concepts, for some forms of thought may be nonconceptual. We can imagine, for instance, a squirrel who is planning how to get from the branch she's currently __________ (stand) on to a branch from the tree in front. To do this, in principle she doesn't need a concept of branch nor a concept of tree. It might be enough for her to have, for example, the ability to think in images; to make a mental map of the tree where she can imagine and try out different routes. This doesn't imply that squirrels lack concepts, simply that they don't need them for this concrete form of thinking. For us to be able to say that an animal has concepts, we have to show not just that she's capable of thinking, but also that she has certain specific abilities.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`be 동사(is) + 현재분사로 진행형 → stand → <b>standing</b>`,analysis:`stand → standing: be + 현재분사(-ing) = 진행형\n'she is currently standing on' = 그녀가 현재 서 있는`,tip:`현재진행형: be + V-ing — currently(현재)와 함께 자주 사용`}},
{id:17,type:`어형 변환 (서술형)`,diff:`어려움`,pts:6,fmt:"written",wa:`specific`,accept:[`specific`,`Specific`],passage:`Let's assume that at least some animals are capable of thinking despite lacking a language. This doesn't necessarily mean that they possess concepts, for some forms of thought may be nonconceptual. We can imagine, for instance, a squirrel who is planning how to get from the branch she's currently standing on to a branch from the tree in front. To do this, in principle she doesn't need a concept of branch nor a concept of tree. It might be enough for her to have, for example, the ability to think in images; to make a mental map of the tree where she can imagine and try out different routes. This doesn't imply that squirrels lack concepts, simply that they don't need them for this concrete form of thinking. For us to be able to say that an animal has concepts, we have to show not just that she's capable of thinking, but also that she has certain __________ (specify) abilities.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`명사 abilities를 수식하는 형용사가 필요하다 → specify → <b>specific</b>`,analysis:`specify(동사) → specific(형용사): 명사 앞에서 수식\n'specific abilities' = 특정한 능력들`,tip:`specify(명시하다, 동사) → specific(특정한, 형용사) — 동사→형용사 변환`}},
{id:18,type:`빈칸 어휘 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`abstract`,`concrete`,`conceptual`,`imaginary`],passage:`Let's assume that at least some animals are capable of thinking despite lacking a language. This doesn't necessarily mean that they possess concepts, for some forms of thought may be nonconceptual. We can imagine, for instance, a squirrel who is planning how to get from the branch she's currently standing on to a branch from the tree in front. To do this, in principle she doesn't need a concept of branch nor a concept of tree. It might be enough for her to have, for example, the ability to think in images; to make a mental map of the tree where she can imagine and try out different routes. This doesn't imply that squirrels lack concepts, simply that they don't need them for this __________ form of thinking. For us to be able to say that an animal has concepts, we have to show not just that she's capable of thinking, but also that she has certain specific abilities.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`다람쥐가 이 <b>구체적인(concrete)</b> 사고 형태에 개념이 필요하지 않다.`,analysis:`✅ ② concrete: 구체적인 → 원문 일치\n❌ ① abstract: 추상적인 (반의어)\n❌ ③ conceptual: 개념적인 (글의 핵심은 비개념적 사고)\n❌ ④ imaginary: 상상의`,tip:`concrete = 구체적인, 실질적인 ↔ abstract = 추상적인`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:4,ch:[`(A)-(B)-(C)`,`(A)-(C)-(B)`,`(B)-(A)-(C)`,`(B)-(C)-(A)`,`(C)-(B)-(A)`],passage:FULL_PASSAGE,stem:`주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은? (원래 모의고사 36번 문제)`,det:{korean:`주어진 문장 → <b>(C)</b> 개념 소유 불필요, 다람쥐 예시 → <b>(B)</b> 이미지 사고, 정신적 지도 → <b>(A)</b> 개념 부재가 아닌 불필요, 특정 능력`,analysis:`✅ ⑤ (C)-(B)-(A): 올바른 순서\n(C) "This"는 주어진 문장의 thinking을 받음\n(B) "To do this"는 (C)의 planning을 받음\n(A) "This"는 (B)의 이미지 사고를 받음`,tip:`순서 배열 핵심: 지시어 This, To do this 추적`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`proving that animals have language ability`,`showing that squirrels use concepts for tree climbing`,`demonstrating both thinking ability and specific cognitive skills`,`teaching animals to communicate through images`],passage:`Let's assume that at least some animals are capable of thinking despite lacking a language. This doesn't necessarily mean that they possess concepts, for some forms of thought may be nonconceptual. We can imagine, for instance, a squirrel who is planning how to get from the branch she's currently standing on to a branch from the tree in front. To do this, in principle she doesn't need a concept of branch nor a concept of tree. It might be enough for her to have, for example, the ability to think in images; to make a mental map of the tree where she can imagine and try out different routes. This doesn't imply that squirrels lack concepts, simply that they don't need them for this concrete form of thinking. For us to be able to say that an animal has concepts, we have to show not just that she's capable of thinking, but also that she has certain specific abilities.\n\nAccording to the passage, proving an animal has concepts requires __________.`,stem:`이 글에 따르면, 동물이 개념을 가지고 있다는 것을 증명하려면 무엇이 필요한가?`,det:{korean:`동물이 개념을 가지고 있다고 말하려면 사고 능력뿐 아니라 <b>특정한 인지 능력(specific cognitive skills)</b>도 보여야 한다.`,analysis:`✅ ③ demonstrating both thinking ability and specific cognitive skills: 원문과 일치\n❌ ① 언어 능력 증명: 언급 없음\n❌ ② 나무 타기에 개념 사용: 글과 반대\n❌ ④ 이미지로 소통: 언급 없음`,tip:`not just A but also B = A뿐만 아니라 B도 → 두 가지 모두 필요`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📖 온라인워크북 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
