.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#f0e8df;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #dcd0c2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #e8ddd2;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FFFCFA;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#FFF8F2;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"40번","lesson":"요약","title":"논리적 사고 vs 창의적 사고","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g1_mar_40"};

const FULL_PASSAGE=`In the course of trying to solve a problem with an invention, you may encounter a brick wall of resistance when you try to think your way logically through the problem. Such logical thinking is a linear type of process, which uses our reasoning skills. This works fine when we're operating in the area of what we know or have experienced. However, when we need to deal with new information, ideas, and viewpoints, linear thinking will often come up short. On the other hand, creativity by definition involves the application of new information to old problems and the conception of new viewpoints and ideas. For this you will be most effective if you learn to operate in a nonlinear manner; that is, use your creative brain. Stated differently, if you think in a linear manner, you'll tend to be conservative and keep coming up with techniques which are already known. This, of course, is just what you don't want.`;

const Q=[
{id:1,type:`빈칸 어휘 완성`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`encounter`,`create`,`welcome`,`celebrate`],passage:`In the course of trying to solve a problem with an invention, you may __________ a brick wall of resistance when you try to think your way logically through the problem. Such logical thinking is a linear type of process, which uses our reasoning skills. This works fine when we're operating in the area of what we know or have experienced. However, when we need to deal with new information, ideas, and viewpoints, linear thinking will often come up short. On the other hand, creativity by definition involves the application of new information to old problems and the conception of new viewpoints and ideas. For this you will be most effective if you learn to operate in a nonlinear manner; that is, use your creative brain. Stated differently, if you think in a linear manner, you'll tend to be conservative and keep coming up with techniques which are already known. This, of course, is just what you don't want.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`논리적으로 생각하려 할 때 저항의 벽에 <b>부딪힐(encounter)</b> 수 있다.`,analysis:`✅ ① encounter: 마주치다 → 원문 일치\n❌ ② create: 만들다\n❌ ③ welcome: 환영하다\n❌ ④ celebrate: 축하하다`,tip:`encounter = face = come across = 마주치다. "encounter a brick wall" = 벽에 부딪히다 (비유)`}},
{id:2,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`curved`,`circular`,`straight-line`,`zigzag`],passage:`Such logical thinking is a <u>linear</u> type of process.`,stem:`밑줄 친 <b>linear</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`linear = 선형적인, straight-line = 직선적인 → 동의어`,analysis:`✅ ③ straight-line: 직선적인 → linear의 동의어\n❌ ① curved: 곡선의\n❌ ② circular: 원형의\n❌ ④ zigzag: 지그재그의`,tip:`linear = straight-line = sequential = step-by-step = 선형적인, 직선적인`}},
{id:3,type:`어형 변환 (서술형)`,diff:`쉬움`,pts:4,fmt:"written",wa:`reasoning`,accept:[`reasoning`,`Reasoning`],passage:`In the course of trying to solve a problem with an invention, you may encounter a brick wall of resistance when you try to think your way logically through the problem. Such logical thinking is a linear type of process, which uses our __________ (reason) skills. This works fine when we're operating in the area of what we know or have experienced. However, when we need to deal with new information, ideas, and viewpoints, linear thinking will often come up short. On the other hand, creativity by definition involves the application of new information to old problems and the conception of new viewpoints and ideas. For this you will be most effective if you learn to operate in a nonlinear manner; that is, use your creative brain. Stated differently, if you think in a linear manner, you'll tend to be conservative and keep coming up with techniques which are already known. This, of course, is just what you don't want.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`명사 skills를 수식하는 동명사/명사가 필요 → reason → <b>reasoning</b>`,analysis:`reason(명사/동사) → reasoning(동명사/명사): 복합명사 'reasoning skills'\n추론 능력 = reasoning skills`,tip:`reason(이유, 이성) → reasoning(추론) — 복합명사에서 앞 명사가 수식 역할`}},
{id:4,type:`반의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`known`,`familiar`,`experienced`,`unknown`],passage:`This works fine when we're operating in the area of what we <u>know</u>.`,stem:`밑줄 친 <b>know</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`know = 알다 ↔ unknown = 알려지지 않은 (모르는)`,analysis:`❌ ④ unknown(알려지지 않은): know의 반의어 → 가장 먼 의미\n✅ ① known: 알려진 → 동의어\n✅ ② familiar: 익숙한 → 유사어\n✅ ③ experienced: 경험한 → 유사어`,tip:`know = be familiar with ↔ unknown = unfamiliar = 알다 ↔ 모르다`}},
{id:5,type:`빈칸 문맥 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`always succeeds`,`is completely useless`,`often falls short`,`never works`],passage:`When we need to deal with new information, ideas, and viewpoints, linear thinking will __________.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`새로운 정보를 다룰 때 선형적 사고는 종종 <b>부족하다(often falls short)</b>.`,analysis:`✅ ③ often falls short: 종종 부족하다 → come up short의 동의 표현\n❌ ① always succeeds: 항상 성공 (반대)\n❌ ② completely useless: 완전히 쓸모없다 (극단적)\n❌ ④ never works: 전혀 작동 안 함 (극단적)`,tip:`come up short = fall short = be insufficient = 부족하다. "often"이 중요 — 항상은 아님.`}},
{id:6,type:`(A)(B)(C) 조합형`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`new — old — new`,`old — new — old`,`new — new — old`,`old — old — new`,`new — old — old`],passage:`In the course of trying to solve a problem with an invention, you may encounter a brick wall of resistance when you try to think your way logically through the problem. Such logical thinking is a linear type of process, which uses our reasoning skills. This works fine when we're operating in the area of what we know or have experienced. However, when we need to deal with new information, ideas, and viewpoints, linear thinking will often come up short. On the other hand, creativity by definition involves the application of <b>(A)</b> information to <b>(B)</b> problems and the conception of <b>(C)</b> viewpoints and ideas. For this you will be most effective if you learn to operate in a nonlinear manner; that is, use your creative brain. Stated differently, if you think in a linear manner, you'll tend to be conservative and keep coming up with techniques which are already known. This, of course, is just what you don't want.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`창의성은 <b>새로운(new)</b> 정보를 <b>오래된(old)</b> 문제에 적용하고 <b>새로운(new)</b> 관점을 구상하는 것이다.`,analysis:`✅ ① new — old — new: 원문 일치\n❌ ② old/new/old: 반대\n❌ ③ new/new/old: old problems가 맞음\n❌ ④ old/old/new: new information이 맞음\n❌ ⑤ new/old/old: new viewpoints가 맞음`,tip:`creativity = new information + old problems + new viewpoints. 새로운 것을 기존에 적용하는 것이 창의성의 정의.`}},
{id:7,type:`문맥상 부적절한 어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`In the course of trying to solve a problem with an invention, you may encounter a ①<u>brick wall</u> of resistance when you try to think your way logically through the problem. Such logical thinking is a linear type of process, which uses our reasoning skills. This works fine when we're operating in the area of what we ③<u>know</u> or have ④<u>experienced</u>. However, when we need to deal with new information, ideas, and viewpoints, linear thinking will often ⑤<u>come up short</u>. On the other hand, creativity by definition involves the application of new information to old problems and the conception of new viewpoints and ideas. For this you will be most effective if you learn to operate in a nonlinear manner; that is, use your ②<u>creative</u> brain. Stated differently, if you think in a linear manner, you'll tend to be conservative and keep coming up with techniques which are already known. This, of course, is just what you don't want.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`<b>논리적(logical)</b> 사고가 선형적 과정이다. ② creative(창의적)는 logical의 반대 개념으로 부적절.`,analysis:`❌ ② creative(창의적): 원문은 'logical(논리적)' → 부적절. 선형적 과정은 논리적 사고.\n✅ ① brick wall: 벽돌 벽 → 적절\n✅ ③ know: 알다 → 적절\n✅ ④ experienced: 경험한 → 적절\n✅ ⑤ come up short: 부족하다 → 적절`,tip:`logical(논리적) ↔ creative(창의적). 선형적 과정 = 논리적 사고 (creative가 아님)`}},
{id:8,type:`동의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`use`,`creation`,`removal`,`definition`],passage:`Creativity involves the <u>application</u> of new information to old problems.`,stem:`밑줄 친 <b>application</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`application = 적용, use = 사용/적용 → 동의어`,analysis:`✅ ① use: 사용, 적용 → application의 동의어 (이 문맥에서)\n❌ ② creation: 창조\n❌ ③ removal: 제거\n❌ ④ definition: 정의`,tip:`application = use = utilization = 적용, 활용. "the application of A to B" = A를 B에 적용`}},
{id:9,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`linear`,`logical`,`nonlinear`,`creative`],passage:`<i>not following a straight sequence; involving different directions or approaches</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`직선적 순서를 따르지 않는; 다양한 방향이나 접근법을 포함하는 → <b>nonlinear(비선형적)</b>`,analysis:`✅ ③ nonlinear: 비선형적 → 영영 정의와 일치\n❌ ① linear: 선형적 (반대)\n❌ ② logical: 논리적\n❌ ④ creative: 창의적 (유사하지만 정확하지 않음)`,tip:`nonlinear = 비선형적. not + linear = nonlinear. 접두사 non- = ~이 아닌`}},
{id:10,type:`다의어 문맥적 의미`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`벽돌 (실제 건축 재료)`,`넘을 수 없는 장벽 (비유)`,`붉은색`,`단단한 물체`],passage:`You may encounter a <u>brick wall</u> of resistance.`,stem:`밑줄 친 <b>brick wall</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`brick wall of resistance = 저항의 <b>넘을 수 없는 장벽</b> (비유적 표현).`,analysis:`✅ ② 넘을 수 없는 장벽 (비유): 사고의 한계를 벽에 비유\n❌ ① 실제 벽돌: 비유적 표현이므로 부적절\n❌ ③ 붉은색: 관련 없음\n❌ ④ 단단한 물체: 비유적 의미 아님`,tip:`brick wall = 비유적으로 "넘을 수 없는 장벽". hit a brick wall = 벽에 부딪히다 (한계에 도달하다)`}},
{id:11,type:`빈칸 어휘 완성`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`definition`,`application`,`conception`,`perception`],passage:`In the course of trying to solve a problem with an invention, you may encounter a brick wall of resistance when you try to think your way logically through the problem. Such logical thinking is a linear type of process, which uses our reasoning skills. This works fine when we're operating in the area of what we know or have experienced. However, when we need to deal with new information, ideas, and viewpoints, linear thinking will often come up short. On the other hand, creativity by definition involves the application of new information to old problems and the __________ of new viewpoints and ideas. For this you will be most effective if you learn to operate in a nonlinear manner; that is, use your creative brain. Stated differently, if you think in a linear manner, you'll tend to be conservative and keep coming up with techniques which are already known. This, of course, is just what you don't want.`,stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`새로운 관점과 아이디어의 <b>구상(conception)</b>을 포함한다.`,analysis:`✅ ③ conception: 구상, 착상 → 원문 일치\n❌ ① definition: 정의\n❌ ② application: 적용 (이미 앞에 사용됨)\n❌ ④ perception: 인식`,tip:`conception = 구상, 착상. conceive = 생각해내다. concept = 개념`}},
{id:12,type:`어형 변환 (서술형)`,diff:`보통`,pts:5,fmt:"written",wa:`effective`,accept:[`effective`,`Effective`],passage:`In the course of trying to solve a problem with an invention, you may encounter a brick wall of resistance when you try to think your way logically through the problem. Such logical thinking is a linear type of process, which uses our reasoning skills. This works fine when we're operating in the area of what we know or have experienced. However, when we need to deal with new information, ideas, and viewpoints, linear thinking will often come up short. On the other hand, creativity by definition involves the application of new information to old problems and the conception of new viewpoints and ideas. For this you will be most __________ (effect) if you learn to operate in a nonlinear manner; that is, use your creative brain. Stated differently, if you think in a linear manner, you'll tend to be conservative and keep coming up with techniques which are already known. This, of course, is just what you don't want.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`be + 형용사 (most + 형용사 최상급) → effect → <b>effective</b>`,analysis:`effect(명사) → effective(형용사): be동사 뒤 보어\n'most effective' = 가장 효과적인`,tip:`effect(효과, 명사) → effective(효과적인, 형용사) — be + 형용사 구조`}},
{id:13,type:`반의어 고르기`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`traditional`,`progressive`,`cautious`,`moderate`],passage:`You'll tend to be <u>conservative</u>.`,stem:`밑줄 친 <b>conservative</b>의 의미와 가장 <b>먼</b> 것은?`,det:{korean:`conservative = 보수적인 ↔ progressive = 진보적인`,analysis:`❌ ② progressive(진보적인): conservative의 반의어 → 가장 먼 의미\n✅ ① traditional: 전통적인 → 유사어\n✅ ③ cautious: 신중한 → 유사어\n✅ ④ moderate: 온건한 → 유사어`,tip:`conservative ↔ progressive = 보수적 ↔ 진보적. 정치/사고 모두에서 사용.`}},
{id:14,type:`(A)(B)(C) 조합형`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`nonlinear — creative — innovative`,`linear — logical — conservative`,`linear — conservative — already known`,`nonlinear — conservative — already known`,`linear — innovative — new`],passage:`In the course of trying to solve a problem with an invention, you may encounter a brick wall of resistance when you try to think your way logically through the problem. Such logical thinking is a linear type of process, which uses our reasoning skills. This works fine when we're operating in the area of what we know or have experienced. However, when we need to deal with new information, ideas, and viewpoints, linear thinking will often come up short. On the other hand, creativity by definition involves the application of new information to old problems and the conception of new viewpoints and ideas. For this you will be most effective if you learn to operate in a nonlinear manner; that is, use your creative brain. Stated differently, if you think in a <b>(A)</b> manner, you'll tend to be <b>(B)</b> and keep coming up with techniques which are already known. This, of course, is just what you don't want.`,stem:`다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`<b>선형적(linear)</b> 방식으로 생각하면 <b>보수적(conservative)</b>이 되어 <b>이미 알려진(already known)</b> 기법만 떠올린다.`,analysis:`✅ ③ linear — conservative — already known: 원문 일치\n❌ ① nonlinear: linear가 맞음\n❌ ② logical: conservative가 맞음\n❌ ④ nonlinear/conservative: 조합 불일치\n❌ ⑤ innovative/new: 반대 의미`,tip:`linear manner → conservative → already known techniques = 선형적 사고의 한계를 보여주는 논리 구조`}},
{id:15,type:`문맥상 부적절한 어휘`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`In the course of trying to solve a problem with an invention, you may encounter a brick wall of resistance when you try to think your way logically through the problem. Such logical thinking is a linear type of process, which uses our reasoning skills. This works fine when we're operating in the area of what we know or have experienced. However, when we need to deal with new information, ideas, and viewpoints, linear thinking will often come up short. On the other hand, creativity by ①<u>definition</u> involves the application of ②<u>new</u> information to old problems and the conception of new viewpoints and ideas. For this you will be most effective if you learn to ③<u>avoid</u> in a nonlinear manner; that is, use your creative brain. Stated differently, if you think in a linear manner, you'll tend to be ④<u>conservative</u> and keep coming up with ⑤<u>techniques</u> which are already known. This, of course, is just what you don't want.`,stem:`다음 글의 밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`비선형적 방식으로 작동하는 법을 <b>배우면(learn)</b> 가장 효과적이다. ③ avoid(피하다)는 문맥상 부적절 — 배워야(learn) 하는 것이지 피해야 하는 것이 아님.`,analysis:`❌ ③ avoid(피하다): 원문 의미와 반대 — learn to operate이지 avoid operating이 아님\n✅ ① definition: 정의 → 적절\n✅ ② new: 새로운 → 적절\n✅ ④ conservative: 보수적 → 적절\n✅ ⑤ techniques: 기법 → 적절`,tip:`learn to(~하는 법을 배우다) ↔ avoid(피하다). 비선형적 사고를 해야(learn) 하지, 피해서는(avoid) 안 됨.`}},
{id:16,type:`영영풀이 매칭`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`problem`,`idea`,`creativity`,`invention`],passage:`<i>a new device, method, or process developed through study and experimentation to solve problems</i>`,stem:`다음 영영풀이에 해당하는 단어로 가장 적절한 것은?`,det:{korean:`문제 해결을 위해 연구와 실험을 통해 개발된 새로운 장치, 방법, 과정 → <b>invention(발명)</b>`,analysis:`✅ ④ invention: 발명 → 영영 정의와 일치\n❌ ① problem: 문제\n❌ ② idea: 아이디어\n❌ ③ creativity: 창의성`,tip:`invention = 발명, 발명품. invent(발명하다) + -ion(명사 접미사) = invention`}},
{id:17,type:`동의어 고르기`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`manage`,`handle`,`avoid`,`ignore`],passage:`When we need to <u>deal with</u> new information.`,stem:`밑줄 친 <b>deal with</b>의 의미와 가장 <b>가까운</b> 것은?`,det:{korean:`deal with = 다루다, handle = 다루다 → 동의어`,analysis:`✅ ② handle: 다루다 → deal with의 동의어\n❌ ① manage: 관리하다 (유사하지만 handle이 더 정확)\n❌ ③ avoid: 피하다\n❌ ④ ignore: 무시하다`,tip:`deal with = handle = cope with = manage = 다루다, 처리하다`}},
{id:18,type:`어형 변환 (서술형)`,diff:`어려움`,pts:6,fmt:"written",wa:`creativity`,accept:[`creativity`,`Creativity`],passage:`In the course of trying to solve a problem with an invention, you may encounter a brick wall of resistance when you try to think your way logically through the problem. Such logical thinking is a linear type of process, which uses our reasoning skills. This works fine when we're operating in the area of what we know or have experienced. However, when we need to deal with new information, ideas, and viewpoints, linear thinking will often come up short. On the other hand, __________ (creative) by definition involves the application of new information to old problems and the conception of new viewpoints and ideas. For this you will be most effective if you learn to operate in a nonlinear manner; that is, use your creative brain. Stated differently, if you think in a linear manner, you'll tend to be conservative and keep coming up with techniques which are already known. This, of course, is just what you don't want.`,stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,det:{korean:`문장의 주어가 필요 → creative(형용사) → <b>creativity(명사)</b>`,analysis:`creative(형용사) → creativity(명사): 문장 주어 역할\n'Creativity involves' = 창의성은 ~를 포함한다`,tip:`creative(창의적인, 형용사) → creativity(창의성, 명사) — 주어 자리에는 명사가 와야 함`}},
{id:19,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`Logical — innovative`,`Flexible — instant`,`Logical — proven`,`Flexible — superior`,`Logical — collaborative`],passage:`(A) thinking works well with familiar problems but falls short in dealing with new ideas, for which creative thinking is needed to come up with (B) solutions.\n\n(A)                    (B)\n① Logical ……… innovative\n② Flexible ……… instant\n③ Logical ……… proven\n④ Flexible ……… superior\n⑤ Logical ……… collaborative`,stem:`다음 요약문의 (A), (B)에 들어갈 말로 가장 적절한 것은? (원래 모의고사 40번 문제)`,det:{korean:`<b>논리적(Logical)</b> 사고는 익숙한 문제에는 효과적이지만 새 아이디어에는 부족하며, <b>혁신적(innovative)</b> 해결책을 위해 창의적 사고가 필요하다.`,analysis:`✅ ① Logical — innovative: 글의 핵심 요약\n❌ ② Flexible: Logical이 맞음\n❌ ③ proven: 이미 입증된 (반대 — already known과 유사)\n❌ ④ Flexible/superior: 부적절\n❌ ⑤ collaborative: 협력적 (언급 없음)`,tip:`Logical(논리적) ↔ creative → innovative(혁신적). 글의 대비 구조: 논리적 한계 vs 창의적 필요성`}},
{id:20,type:`빈칸 문맥 완성`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`논리적 사고만이 문제 해결의 유일한 방법이다`,`창의적 사고는 실용적이지 않다`,`이미 알려진 기법이 항상 최선이다`,`새로운 문제에는 비선형적/창의적 사고가 필요하다`],passage:FULL_PASSAGE,stem:`이 글의 주제로 가장 적절한 것은?`,det:{korean:`선형적 사고의 한계를 넘어 <b>새로운 문제에는 비선형적/창의적 사고가 필요하다</b>는 것이 주제.`,analysis:`✅ ④ 비선형적/창의적 사고 필요: "use your creative brain" → 글의 핵심 주장\n❌ ① 논리적 사고만: "come up short"과 모순\n❌ ② 창의적 사고가 비실용적: 반대 주장\n❌ ③ 알려진 기법이 최선: "just what you don't want"`,tip:`linear → come up short → nonlinear/creative needed = 글의 전체 논리 구조. "just what you don't want" = 원하지 않는 결과`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`🧩 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
