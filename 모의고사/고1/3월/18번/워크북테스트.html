<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--g:#7C3AED;--gd:#5B21B6;--gl:#EDE9FE;--gxl:#F5F3FF;--gxxl:#FAF5FF;--bg:#F5F3FF;--text:#1A1A2E;--tm:#5A5A7E;--tl:#8A8AAE;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--o:#F59E0B;--ol:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}

.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--g),#6D28D9);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f0f0f5;}.info-row:last-child{border:none;}

.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;box-shadow:0 6px 20px rgba(124,58,237,.3);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid #c8c0d8;color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--g);color:var(--g);}
.history-badge{background:var(--gxl);color:var(--g);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}

.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--g);border-radius:50%;}

.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{max-width:820px;margin:0 auto;padding:24px 20px 100px;}

.q-header{display:flex;align-items:center;gap:10px;padding:16px 22px;background:linear-gradient(135deg,#F5F3FF,#EDE9FE);border-bottom:1px solid #e0d8ec;flex-wrap:wrap;}
.q-num{width:36px;height:36px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--gl);color:#5B21B6;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}
.tag-grammar{background:#EDE9FE;color:#5B21B6;}.tag-vocab{background:#E0F7FA;color:#00838F;}.tag-blankcloze{background:#FFF3E0;color:#E65100;}.tag-written{background:#FCE4EC;color:#C2185B;}.tag-match{background:var(--bl);color:var(--b);}.tag-tf{background:var(--ol);color:#B45309;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f0edf5;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--g);font-weight:800;}

.choice-btn{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:2px solid #d8d0e8;border-radius:var(--rs);cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:14px;line-height:1.6;}
.choice-btn:hover{border-color:var(--g);}.choice-btn.selected{border-color:var(--g);box-shadow:0 0 0 3px rgba(124,58,237,.12);background:var(--gxxl);}
.c-num{min-width:26px;height:26px;background:#e8e0f0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}
.written-input{width:100%;padding:14px 16px;border:2px solid #d0c8dc;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);padding:10px 16px;display:flex;align-items:center;gap:5px;justify-content:center;z-index:100;overflow-x:auto;flex-wrap:wrap;}
.nav-dot{width:28px;height:28px;border-radius:50%;background:#d8d0e8;cursor:pointer;border:none;font-size:10px;font-weight:800;color:var(--tm);display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;}.nav-dot.answered{background:var(--g);color:#fff;}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,#EDE9FE,#DDD6FE);}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--g),#6D28D9);color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8e0f0;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),#A78BFA);transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FAFAFF;border-radius:var(--rs);border:1px solid #d8d0e8;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0f0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0c8dc;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #d8d0e8;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FAFAFF;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F0EDF5;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"18번","lesson":"글의 목적","title":"Crafts Art Fair Letter","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_2025_g1_mar_18"};

const FULL_PASSAGE=`Dear Miranda,\nThank you for participating in our Crafts Art Fair. Since we've chosen you as one of the 'Artists of This Year', we are looking forward to introducing your unique handmade baskets to our community. As part of organizing the exhibition plan, we are happy to inform you that your artworks will be exhibited at the assigned table, number seven. Visitors can easily find your artworks located near the entrance. If you have any special requirements or need further assistance, feel free to contact us in advance.\nSincerely,\nHelen Dwyer`;

const Q=[
{id:1,type:`어법`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`participate`,`to participate`,`participating`,`participated`],passage:`Dear Miranda,\nThank you for __________ in our Crafts Art Fair. Since we've chosen you as one of the 'Artists of This Year', we are looking forward to introducing your unique handmade baskets to our community. As part of organizing the exhibition plan, we are happy to inform you that your artworks will be exhibited at the assigned table, number seven. Visitors can easily find your artworks located near the entrance. If you have any special requirements or need further assistance, feel free to contact us in advance.\nSincerely,\nHelen Dwyer`,stem:`다음 빈칸에 들어갈 말로 어법상 가장 적절한 것은?`,det:{korean:`전치사 for 뒤에는 동명사(V-ing)가 온다. → <b>participating</b>`,analysis:`✅ ③ participating: 전치사 for + 동명사(-ing)\n❌ ① participate: 동사원형은 전치사 뒤 불가\n❌ ② to participate: to부정사는 for 뒤 부자연스러움\n❌ ④ participated: 과거형 불가`,tip:`전치사(for, of, about, in) + 동명사(V-ing): 전치사 뒤에는 반드시 명사/동명사`}},
{id:2,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`choose`,`chosen`,`choosing`,`chose`],passage:`Dear Miranda,\nThank you for participating in our Crafts Art Fair. Since we've __________ you as one of the 'Artists of This Year', we are looking forward to introducing your unique handmade baskets to our community. As part of organizing the exhibition plan, we are happy to inform you that your artworks will be exhibited at the assigned table, number seven. Visitors can easily find your artworks located near the entrance. If you have any special requirements or need further assistance, feel free to contact us in advance.\nSincerely,\nHelen Dwyer`,stem:`다음 빈칸에 들어갈 말로 어법상 가장 적절한 것은?`,det:{korean:`현재완료(have + p.p.) 구문이므로 과거분사 <b>chosen</b>이 적절하다.`,analysis:`✅ ② chosen: have + p.p. (현재완료)\n❌ ① choose: 동사원형\n❌ ③ choosing: 현재분사\n❌ ④ chose: 과거형`,tip:`현재완료: have/has + 과거분사(p.p.) — choose-chose-chosen`}},
{id:3,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`located`,`locating`,`locate`,`to locate`],passage:`Dear Miranda,\nThank you for participating in our Crafts Art Fair. Since we've chosen you as one of the 'Artists of This Year', we are looking forward to introducing your unique handmade baskets to our community. As part of organizing the exhibition plan, we are happy to inform you that your artworks will be exhibited at the assigned table, number seven. Visitors can easily find your artworks __________ near the entrance. If you have any special requirements or need further assistance, feel free to contact us in advance.\nSincerely,\nHelen Dwyer`,stem:`다음 빈칸에 들어갈 말로 어법상 가장 적절한 것은?`,det:{korean:`artworks(작품)가 입구 근처에 <b>위치해 있는</b> 수동 의미이므로 과거분사 <b>located</b>가 적절하다.`,analysis:`✅ ① located: 과거분사(수동) — 작품이 위치된\n❌ ② locating: 현재분사(능동) — 작품이 위치시키는(X)\n❌ ③ locate: 동사원형 불가\n❌ ④ to locate: to부정사 부자연스러움`,tip:`과거분사 vs 현재분사: 수동(~된) → p.p. / 능동(~하는) → V-ing`}},
{id:4,type:`어법`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`exhibit`,`exhibiting`,`to exhibit`,`exhibited`],passage:`Dear Miranda,\nThank you for participating in our Crafts Art Fair. Since we've chosen you as one of the 'Artists of This Year', we are looking forward to introducing your unique handmade baskets to our community. As part of organizing the exhibition plan, we are happy to inform you that your artworks will be __________ at the assigned table, number seven. Visitors can easily find your artworks located near the entrance. If you have any special requirements or need further assistance, feel free to contact us in advance.\nSincerely,\nHelen Dwyer`,stem:`다음 빈칸에 들어갈 말로 어법상 가장 적절한 것은?`,det:{korean:`will be + p.p.(수동태 미래) 구문이므로 과거분사 <b>exhibited</b>가 적절하다.`,analysis:`✅ ④ exhibited: will be + p.p. (미래 수동태)\n❌ ① exhibit: 동사원형만으로는 수동태 불가\n❌ ② exhibiting: 현재분사 → 수동태 불가\n❌ ③ to exhibit: to부정사 → be + to부정사는 의미 다름`,tip:`수동태: be + p.p. / 미래 수동: will be + p.p.`}},
{id:5,type:`어법`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`look forward to meet`,`look forward to meets`,`look forward to introducing`,`look forward to introduced`],passage:`Dear Miranda,\nThank you for participating in our Crafts Art Fair. Since we've chosen you as one of the 'Artists of This Year', we are __________ your unique handmade baskets to our community. As part of organizing the exhibition plan, we are happy to inform you that your artworks will be exhibited at the assigned table, number seven. Visitors can easily find your artworks located near the entrance. If you have any special requirements or need further assistance, feel free to contact us in advance.\nSincerely,\nHelen Dwyer`,stem:`다음 빈칸에 들어갈 표현으로 어법상 가장 적절한 것은?`,det:{korean:`look forward to + V-ing 구문이므로 <b>look forward to introducing</b>이 적절하다.`,analysis:`✅ ③ look forward to introducing: look forward to + 동명사\n❌ ① to meet: look forward to 뒤 동명사 필요\n❌ ② to meets: 문법 오류\n❌ ④ to introduced: 과거분사 불가`,tip:`look forward to + V-ing: ~하기를 기대하다 (to는 전치사)`}},
{id:6,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`반대하다`,`참가하다`,`후원하다`,`관람하다`],passage:`Thank you for <u>participating</u> in our Crafts Art Fair.`,stem:`밑줄 친 <b>participating</b>의 의미로 가장 적절한 것은?`,det:{korean:`participating = <b>참가하다</b> (take part in)`,analysis:`✅ ② 참가하다: participate = take part in\n❌ ① 반대하다: oppose\n❌ ③ 후원하다: sponsor\n❌ ④ 관람하다: watch`,tip:`participate in = take part in = join = 참가하다`}},
{id:7,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`독특한`,`흔한`,`값비싼`,`거대한`],passage:`We are looking forward to introducing your <u>unique</u> handmade baskets.`,stem:`밑줄 친 <b>unique</b>의 의미로 가장 적절한 것은?`,det:{korean:`unique = <b>독특한</b>, 유일무이한`,analysis:`✅ ① 독특한: unique = one-of-a-kind\n❌ ② 흔한: common (반의어)\n❌ ③ 값비싼: expensive\n❌ ④ 거대한: huge`,tip:`unique = distinctive = one-of-a-kind ↔ common = ordinary`}},
{id:8,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`①`,`②`,`③`,`④`,`⑤`],passage:`Dear Miranda,\nThank you for ①<u>participating</u> in our Crafts Art Fair. Since we've chosen you as one of the 'Artists of This Year', we are ②<u>looking forward to</u> introducing your unique handmade baskets to our community. As part of organizing the exhibition plan, we are happy to ③<u>conceal</u> you that your artworks will be exhibited at the assigned table, number seven. Visitors can ④<u>easily</u> find your artworks located near the entrance. If you have any special requirements or need further assistance, feel free to ⑤<u>contact</u> us in advance.\nSincerely,\nHelen Dwyer`,stem:`밑줄 친 ①~⑤ 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?`,det:{korean:`③ conceal(숨기다)은 원문의 inform(알리다)을 대체 → 부적절`,analysis:`❌ ③ conceal(숨기다): 원문은 'inform(알리다)' → 부적절\n✅ ① participating: 적절\n✅ ② looking forward to: 적절\n✅ ④ easily: 적절\n✅ ⑤ contact: 적절`,tip:`inform(알리다) ↔ conceal(숨기다, 감추다)`}},
{id:9,type:`빈칸`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`작품 판매 가격을 알려주려고`,`박람회 참가를 거절하려고`,`작품이 전시될 테이블 위치를 안내하려고`,`다른 작가를 추천하려고`],passage:FULL_PASSAGE,stem:`위 글의 <b>목적</b>으로 가장 적절한 것은?`,det:{korean:`Helen Dwyer가 Miranda에게 보낸 편지의 핵심 목적은 <b>지정 테이블(number seven)</b> 위치 안내이다.`,analysis:`✅ ③ 작품이 전시될 테이블 위치를 안내하려고: 편지의 핵심 내용\n❌ ① 가격 안내: 언급 없음\n❌ ② 참가 거절: 이미 선정 완료\n❌ ④ 작가 추천: 언급 없음`,tip:`편지의 목적 파악: 핵심 동사(inform) + 핵심 정보(assigned table, number seven)`}},
{id:10,type:`빈칸`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`the competition schedule`,`the location of her exhibition space`,`the ticket price for visitors`,`the deadline for submission`],passage:FULL_PASSAGE,stem:`What is the main information Helen is conveying to Miranda?`,det:{korean:`Helen이 Miranda에게 전달하는 핵심 정보는 <b>전시 공간의 위치(the location of her exhibition space)</b>이다.`,analysis:`✅ ② the location of her exhibition space: 테이블 7번, 입구 근처\n❌ ① competition schedule: 대회 일정 언급 없음\n❌ ③ ticket price: 입장료 언급 없음\n❌ ④ deadline: 마감일 언급 없음`,tip:`핵심 정보: assigned table, number seven / near the entrance`}},
{id:11,type:`일치`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`Miranda는 'Artists of This Year'로 선정되었다.`,`Miranda의 작품은 테이블 9번에 전시된다.`,`작품은 출구 근처에 위치해 있다.`,`Helen Dwyer는 Miranda의 학생이다.`],passage:FULL_PASSAGE,stem:`위 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`원문: "we've chosen you as one of the 'Artists of This Year'" → Miranda는 올해의 아티스트로 <b>선정되었다</b>.`,analysis:`✅ ① 선정됨: 원문과 일치\n❌ ② 테이블 9번: 7번이 맞음\n❌ ③ 출구 근처: entrance(입구)가 맞음\n❌ ④ 학생: 언급 없음`,tip:`내용 일치 문제: 선택지의 숫자, 장소, 인물 관계를 원문과 정확히 대조`}},
{id:12,type:`일치`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`Miranda의 작품은 수공예 바구니이다.`,`전시 테이블은 입구 근처이다.`,`Helen은 Miranda에게 직접 방문해서 안내했다.`,`추가 도움이 필요하면 사전에 연락할 수 있다.`],passage:FULL_PASSAGE,stem:`위 글의 내용과 <b>일치하지 않는</b> 것은?`,det:{korean:`편지로 안내한 것이지 직접 방문한 것이 아니다. → ③ 불일치`,analysis:`❌ ③ 직접 방문 안내: 편지(letter)로 안내함 → 불일치\n✅ ① 수공예 바구니: handmade baskets → 일치\n✅ ② 입구 근처: near the entrance → 일치\n✅ ④ 사전 연락: contact us in advance → 일치`,tip:`편지글 형식(Dear~/Sincerely) → 직접 방문이 아닌 서면 안내`}},
{id:13,type:`TF`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`Miranda의 작품은 7번 테이블에 전시된다. (T/F)`,det:{korean:`원문에 "assigned table, number seven"이라고 명시되어 있으므로 <b>True</b>이다.`,analysis:`✅ True: 원문 일치 — assigned table, number seven`,tip:`숫자 정보는 정확하게 확인: number seven = 7번`}},
{id:14,type:`TF`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`Miranda의 작품은 출구(exit) 근처에 위치해 있다. (T/F)`,det:{korean:`원문은 entrance(입구)이지 exit(출구)가 아니다. → <b>False</b>`,analysis:`❌ False: entrance(입구) ≠ exit(출구)`,tip:`entrance(입구) ↔ exit(출구): 반의어 함정`}},
{id:15,type:`TF`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`이 편지의 목적은 Miranda에게 전시 정보를 알려주는 것이다. (T/F)`,det:{korean:`편지의 핵심: 전시 테이블 배정 안내 → <b>True</b>`,analysis:`✅ True: "happy to inform you that your artworks will be exhibited" → 전시 정보 안내`,tip:`편지 목적: inform(알리다) = 정보 전달`}},
{id:16,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`in advance`,accept:[`in advance`,`In advance`,`in advance.`],passage:`Dear Miranda,\nThank you for participating in our Crafts Art Fair. Since we've chosen you as one of the 'Artists of This Year', we are looking forward to introducing your unique handmade baskets to our community. As part of organizing the exhibition plan, we are happy to inform you that your artworks will be exhibited at the assigned table, number seven. Visitors can easily find your artworks located near the entrance. If you have any special requirements or need further assistance, feel free to contact us __________.\nSincerely,\nHelen Dwyer`,stem:`다음 빈칸에 들어갈 표현을 본문에서 찾아 쓰시오. (2단어)`,det:{korean:`미리, 사전에 → <b>in advance</b>`,analysis:`in advance = beforehand = 미리, 사전에\n"feel free to contact us in advance" = 미리 연락해 주세요`,tip:`in advance = beforehand = ahead of time = 미리`}},
{id:17,type:`서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`handmade baskets`,accept:[`handmade baskets`,`Handmade baskets`,`handmade basket`],passage:FULL_PASSAGE,stem:`Miranda가 만드는 작품(artworks)의 구체적인 종류를 본문에서 영어로 쓰시오. (2단어)`,det:{korean:`원문: "your unique <b>handmade baskets</b>" → 수공예 바구니`,analysis:`handmade baskets = 수공예 바구니\nunique handmade baskets to our community`,tip:`handmade = 수공예의, 손으로 만든 / basket = 바구니`}},
{id:18,type:`서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`exhibition`,accept:[`exhibition`,`Exhibition`,`the exhibition`],passage:`Dear Miranda,\nThank you for participating in our Crafts Art Fair. Since we've chosen you as one of the 'Artists of This Year', we are looking forward to introducing your unique handmade baskets to our community. As part of organizing the __________ plan, we are happy to inform you that your artworks will be exhibited at the assigned table, number seven. Visitors can easily find your artworks located near the entrance. If you have any special requirements or need further assistance, feel free to contact us in advance.\nSincerely,\nHelen Dwyer`,stem:`다음 빈칸에 들어갈 단어를 본문에서 찾아 쓰시오. (1단어)`,det:{korean:`전시 계획 → <b>exhibition</b> plan`,analysis:`exhibition plan = 전시 계획\nas part of organizing the exhibition plan = 전시 계획 조직의 일환으로`,tip:`exhibition = 전시(회) / exhibit(동사) → exhibition(명사)`}},
{id:19,type:`빈칸`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`Miranda가 박람회 참가를 취소하는 내용`,`Helen이 Miranda에게 전시 장소를 안내하는 내용`,`방문객이 Miranda에게 감사하는 내용`,`Miranda가 Helen에게 불만을 제기하는 내용`],passage:FULL_PASSAGE,stem:`위 글의 내용을 한 문장으로 요약할 때 가장 적절한 것은?`,det:{korean:`편지 전체 요약: <b>Helen이 Miranda에게 전시 장소(테이블 7번, 입구 근처)를 안내하는 내용</b>`,analysis:`✅ ② Helen이 Miranda에게 전시 장소 안내: 편지 핵심\n❌ ① 참가 취소: 반대 내용\n❌ ③ 방문객 감사: 주체 오류\n❌ ④ 불만 제기: 편지 톤과 반대`,tip:`편지 요약: 발신인(Helen) + 수신인(Miranda) + 핵심 정보(전시 테이블 위치)`}},
{id:20,type:`어법`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`(A) participating — (B) exhibit — (C) locating`,`(A) participating — (B) exhibited — (C) located`,`(A) to participate — (B) exhibited — (C) locating`,`(A) participated — (B) exhibit — (C) located`],passage:`Dear Miranda,\nThank you for <b>(A)</b> in our Crafts Art Fair. Since we've chosen you as one of the 'Artists of This Year', we are looking forward to introducing your unique handmade baskets to our community. As part of organizing the exhibition plan, we are happy to inform you that your artworks will be <b>(B)</b> at the assigned table, number seven. Visitors can easily find your artworks <b>(C)</b> near the entrance. If you have any special requirements or need further assistance, feel free to contact us in advance.\nSincerely,\nHelen Dwyer`,stem:`(A), (B), (C)에 들어갈 말로 어법상 가장 적절한 것끼리 짝지은 것은?`,det:{korean:`(A) 전치사 for + 동명사 → participating\n(B) will be + p.p.(수동태) → exhibited\n(C) 수동 의미의 분사 → located`,analysis:`✅ ② participating — exhibited — located: 모두 어법에 맞음\n❌ ① exhibit: will be + 동사원형(X), locating: 능동(X)\n❌ ③ to participate: 전치사 for 뒤 부자연스러움\n❌ ④ participated: 전치사 뒤 과거형 불가`,tip:`어법 3종 세트: 전치사+동명사 / 수동태(be+p.p.) / 분사(수동=p.p.)`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법':'tag-grammar','어휘':'tag-vocab','빈칸':'tag-blankcloze','서술형':'tag-written','일치':'tag-match','TF':'tag-tf','(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인워크북 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
