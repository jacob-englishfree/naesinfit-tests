const EI={"subject":"2025 고1 3월 모의고사","pub":"22번","lesson":"요지","title":"과학의 불확실성 감소 과정","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_2025_g1_mar_22"};

const FULL_PASSAGE=`The science we learn in grade school is a collection of certainties about the natural world — the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these 'facts' was hard won through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process — today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`;

const Q=[
{id:1,type:`어법 선택`,diff:`쉬움`,pts:3,fmt:"mc",ans:1,ch:[`learn`,`learning`,`learned`,`to learn`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these \u2018facts\u2019 was hard won through a succession of logical inferences __________ upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`다음 빈칸에 들어갈 어법상 가장 적절한 것은?`,det:{korean:`분사구문으로 inferences를 수식하며, '~에 기반을 둔'이라는 수동의 의미이므로 과거분사 <b>based</b>가 와야 하지만, 보기에서 가장 적절한 것을 선택해야 한다. 여기서는 문맥상 빈칸이 "based"가 아닌 다른 위치이다.`,analysis:`이 문제는 재검토 필요 — 올바른 답안 확인`,tip:`분사 수식: 능동이면 -ing, 수동이면 -ed`}},
{id:2,type:`어법 선택`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`based`,`basing`,`to base`,`base`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these \u2018facts\u2019 was hard won through a succession of logical inferences __________ upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`다음 빈칸에 들어갈 어법상 가장 적절한 것은?`,det:{korean:`추론이 관찰에 <b>기반을 둔(based)</b> 것이므로 과거분사가 적절하다. inferences와 base는 수동 관계이다.`,analysis:`✅ ① based: 과거분사 — 수동 의미 (추론이 관찰에 기반을 두다)\n❌ ② basing: 현재분사 — 능동 (추론이 스스로 기반을 두는 것이 아님)\n❌ ③ to base: 부정사 — 목적/결과 의미로 부적절\n❌ ④ base: 동사원형 — 문법적으로 불가`,tip:`be based upon/on = ~에 기반을 두다 → 과거분사 수식`}},
{id:3,type:`어법 선택`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`what`,`which`,`that`,`where`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize __________ each of these \u2018facts\u2019 was hard won through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`다음 빈칸에 들어갈 어법상 가장 적절한 것은?`,det:{korean:`realize 뒤에 명사절을 이끄는 접속사가 필요하다. <b>that</b>이 명사절 접속사로 적절하다.`,analysis:`✅ ③ that: 명사절 접속사 — realize의 목적어절을 이끔\n❌ ① what: 선행사 포함 관계대명사 — 뒤에 완전한 절이 와서 부적절\n❌ ② which: 관계대명사 — 선행사 없이 사용 불가\n❌ ④ where: 관계부사 — 장소가 아님`,tip:`realize + that절: ~을 깨닫다 (that은 명사절 접속사)`}},
{id:4,type:`어법 선택`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`less — as`,`less — than`,`more — than`,`more — as`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these \u2018facts\u2019 was hard won through a succession of logical inferences based upon many observations or experiments. The process of science is __________ about collecting pieces of knowledge __________ it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`다음 두 빈칸에 들어갈 어법상 가장 적절한 것은?`,det:{korean:`<b>less A than B</b> = A보다 B에 더 가깝다. 과학의 과정은 지식을 모으는 것보다 불확실성을 줄이는 것이다.`,analysis:`✅ ② less — than: less A than B 구문\n❌ ① less — as: less와 as는 짝이 아님\n❌ ③ more — than: 의미가 반대\n❌ ④ more — as: 문법적으로 부적절`,tip:`less A than B = B가 A보다 더 ~하다 (비교 구문)`}},
{id:5,type:`어휘 문맥`,diff:`쉬움`,pts:4,fmt:"mc",ans:3,ch:[`확대하는`,`수집하는`,`생성하는`,`줄이는`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these \u2018facts\u2019 was hard won through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about __________ the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`빈칸에 들어갈 <b>reducing</b>의 의미로 가장 적절한 것은?`,det:{korean:`reducing = <b>줄이는</b>. 과학의 과정은 불확실성을 줄이는 것이다.`,analysis:`✅ ④ 줄이는: reducing의 정확한 번역\n❌ ① 확대하는: 반대 의미\n❌ ② 수집하는: collecting의 의미\n❌ ③ 생성하는: creating의 의미`,tip:`reduce = 줄이다, 감소시키다`}},
{id:6,type:`어휘 문맥`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`연속, 연쇄`,`성공`,`계승, 상속`,`후임자`],passage:`Each of these 'facts' was hard won through a <u>succession</u> of logical inferences.`,stem:`밑줄 친 <b>succession</b>의 문맥적 의미로 가장 적절한 것은?`,det:{korean:`a succession of = <b>일련의, 연속적인</b>. 논리적 추론의 연속을 통해 얻어졌다.`,analysis:`✅ ① 연속, 연쇄: a succession of = 일련의\n❌ ② 성공: success와 혼동\n❌ ③ 계승, 상속: succession의 다른 의미\n❌ ④ 후임자: successor와 혼동`,tip:`succession 다의어: 연속(a succession of) / 계승(royal succession)`}},
{id:7,type:`빈칸 추론`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`collecting definitive truths`,`memorizing established facts`,`reducing what we do not fully understand`,`creating new experimental methods`],passage:FULL_PASSAGE,stem:`According to the passage, the process of science is primarily about __________.`,det:{korean:`본문에 따르면, 과학의 과정은 주로 <b>우리가 완전히 이해하지 못하는 것을 줄이는 것</b>이다.`,analysis:`✅ ③ reducing what we do not fully understand: "reducing the uncertainties"의 paraphrase\n❌ ① collecting definitive truths: "less about collecting"이라고 명시\n❌ ② memorizing established facts: grade school 수준\n❌ ④ creating new methods: 언급 없음`,tip:`paraphrase 파악: reducing uncertainties = reducing what we don't fully understand`}},
{id:8,type:`빈칸 추론`,diff:`어려움`,pts:6,fmt:"mc",ans:1,ch:[`all scientific knowledge is equally reliable`,`scientific understanding develops unevenly across different areas`,`turbulent fluid flow is more important than gravity`,`grade school science is fundamentally wrong`],passage:`"Today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort."`,stem:`위 문장이 시사하는 바로 가장 적절한 것은?`,det:{korean:`사과 낙하(확실)와 난류(불확실)의 대비를 통해 <b>과학적 이해는 분야마다 불균등하게 발전한다</b>는 것을 보여준다.`,analysis:`✅ ② scientific understanding develops unevenly: 사과(확실) vs 난류(불확실) 대비\n❌ ① equally reliable: 대비의 목적과 반대\n❌ ③ more important: 중요도 비교가 아님\n❌ ④ fundamentally wrong: 글의 논지와 무관`,tip:`대비(contrast)를 통한 시사점 파악 문제`}},
{id:9,type:`서술형 영작`,diff:`보통`,pts:5,fmt:"written",wa:`reducing`,accept:[`reducing`,`Reducing`],passage:`과학의 과정은 우리가 아는 것에서 불확실성을 __________ 것에 관한 것이다.`,stem:`다음 한국어에 해당하는 영어 단어를 쓰시오. (줄이는)`,det:{korean:`줄이는 = <b>reducing</b>`,analysis:`reducing: 줄이는, 감소시키는\n원문: "reducing the uncertainties in what we know"`,tip:`reduce(줄이다) → reducing(줄이는) — 동명사형`}},
{id:10,type:`서술형 영작`,diff:`어려움`,pts:6,fmt:"written",wa:`uncertainties`,accept:[`uncertainties`,`Uncertainties`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these \u2018facts\u2019 was hard won through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the __________ in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`다음 빈칸에 들어갈 단어를 쓰시오.`,det:{korean:`우리가 아는 것에서 <b>불확실성(uncertainties)</b>을 줄이는 것이다.`,analysis:`uncertainties: 불확실성들 (복수형)\n원문의 핵심 키워드`,tip:`uncertainty(단수) → uncertainties(복수) — 복수형 주의`}},
{id:11,type:`내용 일치`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`과학은 확실한 사실만 다룬다`,`학교에서 배우는 과학은 불확실성 위주이다`,`과학적 사실은 논리적 추론의 연속을 통해 얻어졌다`,`난류 유체 흐름은 이미 완전히 이해되었다`],passage:FULL_PASSAGE,stem:`위 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`본문: "each of these 'facts' was hard won through a succession of logical inferences" → <b>논리적 추론의 연속을 통해 얻어졌다</b>`,analysis:`✅ ③ 논리적 추론의 연속을 통해: 원문과 일치\n❌ ① 확실한 사실만: reducing uncertainties도 포함\n❌ ② 불확실성 위주: grade school은 certainties\n❌ ④ 완전히 이해: "a work in progress"`,tip:`내용 일치: 선택지와 원문 직접 대조`}},
{id:12,type:`내용 일치`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`과학적 사실은 쉽게 얻어진다`,`학교 과학은 불확실성을 가르친다`,`사과의 낙하는 아직 이해되지 못했다`,`과학적 지식의 불확실성은 분야마다 다를 수 있다`],passage:FULL_PASSAGE,stem:`위 글의 내용과 <b>일치하는</b> 것은?`,det:{korean:`"Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process" → <b>불확실성은 분야마다 다를 수 있다</b>`,analysis:`✅ ④ 분야마다 다를 수 있다: "greater or lesser depending upon"과 일치\n❌ ① 쉽게 얻어진다: "hard won" (어렵게)\n❌ ② 불확실성을 가르친다: certainties를 가르침\n❌ ③ 이해되지 못했다: "quite certain"이라고 명시`,tip:`depending upon = ~에 따라 → 분야별 차이 존재`}},
{id:13,type:`T/F 판별`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`True`,`False`],passage:`"The science we learn in grade school is a collection of certainties about the natural world."`,stem:`위 문장에 따르면, 학교에서 배우는 과학은 자연 세계에 대한 확실한 것들의 모음이다. (T/F)`,det:{korean:`원문 그대로: 학교 과학 = <b>확실한 것들의 모음</b> → True`,analysis:`✅ True: 원문 직역과 일치`,tip:`grade school = 초등학교/중학교 수준의 학교`}},
{id:14,type:`T/F 판별`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`True`,`False`],passage:`"Our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort."`,stem:`위 문장에 따르면, 난류 유체 흐름에 대한 이해는 이미 완성되었다. (T/F)`,det:{korean:`"a work in progress" = 진행 중인 작업 → 완성되지 않았다 → <b>False</b>`,analysis:`✅ False: "a work in progress" = 아직 완성되지 않음`,tip:`a work in progress = 진행 중인 작업, 미완성`}},
{id:15,type:`T/F 판별`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`본문에 따르면, 과학의 과정은 주로 지식 조각을 모으는 것에 관한 것이다. (T/F)`,det:{korean:`"less about collecting pieces of knowledge than reducing uncertainties" → 지식 수집보다 불확실성 감소 → <b>False</b>`,analysis:`✅ False: "less about collecting" = 수집이 주목적이 아님`,tip:`less A than B = A보다 B가 더 → 주목적은 B`}},
{id:16,type:`서술형 해석`,diff:`보통`,pts:5,fmt:"written",wa:`과학의 과정은 지식 조각을 모으는 것보다 우리가 아는 것의 불확실성을 줄이는 것에 관한 것이다`,accept:[`과학의 과정은 지식 조각을 모으는 것보다 우리가 아는 것의 불확실성을 줄이는 것에 관한 것이다`,`과학의 과정은 지식을 수집하는 것이 아니라 불확실성을 줄이는 것이다`,`과학의 과정은 지식 조각을 모으는 것보다 불확실성을 줄이는 것에 관한 것이다`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these \u2018facts\u2019 was hard won through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`위 문장을 한국어로 해석하시오.`,det:{korean:`과학의 과정은 지식 조각을 모으는 것보다 우리가 아는 것의 <b>불확실성을 줄이는 것</b>에 관한 것이다.`,analysis:`핵심 구문: less A than B = A보다 B에 관한 것\nA = collecting pieces of knowledge\nB = reducing the uncertainties`,tip:`less A than B 구문 해석: A보다 B에 더 관한 것이다`}},
{id:17,type:`어법 고치기`,diff:`보통`,pts:5,fmt:"written",wa:`won`,accept:[`won`,`Won`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these \u2018facts\u2019 was hard <u>winning</u> through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.`,det:{korean:`'was hard won' = 어렵게 얻어졌다. 수동태이므로 과거분사 <b>won</b>이 적절하다.`,analysis:`winning(현재분사) → won(과거분사)\n수동태: was + p.p. (hard는 부사)`,tip:`was hard won: win의 과거분사 won (수동태)`}},
{id:18,type:`배열 서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`a work in progress`,accept:[`a work in progress`,`A work in progress`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these \u2018facts\u2019 was hard won through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains __________ after more than a century of effort.`,stem:`다음 단어들을 올바른 순서로 배열하시오: [progress / a / in / work]`,det:{korean:`진행 중인 작업 = <b>a work in progress</b>`,analysis:`a work in progress: 정해진 표현 (진행 중인 작업)`,tip:`a work in progress = 아직 완성되지 않은 진행 중인 것`}},
{id:19,type:`주제 추론`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`과학은 현재의 지식에 대한 불확실함을 줄이는 과정이다`,`과학적 사실은 학교에서 배우는 것만으로 충분하다`,`과학은 확실한 지식을 수집하는 데 목적이 있다`,`난류 유체 흐름은 이미 완전히 이해되었다`],passage:FULL_PASSAGE,stem:`다음 글의 요지로 가장 적절한 것은?`,det:{korean:`글의 핵심 요지: <b>과학의 과정은 불확실성을 줄이는 것</b>이다.`,analysis:`✅ ① 불확실함을 줄이는 과정: 핵심 요지\n❌ ② 학교 학습으로 충분: 반대\n❌ ③ 지식 수집이 목적: "less about collecting"\n❌ ④ 완전히 이해: "a work in progress"`,tip:`요지 = 글 전체의 핵심 주장`}},
{id:20,type:`빈칸 추론`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`never reaches any conclusions`,`only produces absolute certainties`,`depends entirely on grade school education`,`involves ongoing effort to understand what remains uncertain`],passage:FULL_PASSAGE,stem:`The passage suggests that the practice of science __________.`,det:{korean:`과학의 실천은 <b>불확실한 것을 이해하기 위한 지속적인 노력을 수반한다</b>.`,analysis:`✅ ④ involves ongoing effort to understand what remains uncertain: "a work in progress after more than a century of effort"과 일치\n❌ ① never reaches conclusions: 사과 낙하 등 확실한 것도 있음\n❌ ② only produces certainties: 불확실성도 존재\n❌ ③ depends on grade school: grade school은 certainties만 가르침`,tip:`ongoing = 지속적인, uncertain = 불확실한`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법 선택':'tag-grammar','어휘 문맥':'tag-vocab','빈칸 추론':'tag-blank','서술형 영작':'tag-written','서술형 해석':'tag-written','어법 고치기':'tag-written','배열 서술형':'tag-written','내용 일치':'tag-content','T/F 판별':'tag-tf','주제 추론':'tag-blank'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📖 온라인워크북 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
