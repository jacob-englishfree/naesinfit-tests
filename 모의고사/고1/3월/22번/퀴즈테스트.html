.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FFFCF8;border-radius:var(--rs);border:1px solid #e0d8d0;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#f0e8e0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d8d0c8;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #e0d8d0;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FFFCF8;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#FFF8F0;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

const EI={"subject":"2025 고1 3월 모의고사","pub":"22번","lesson":"요지","title":"과학의 불확실성 감소 과정","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_2025_g1_mar_22"};

const FULL_PASSAGE=`The science we learn in grade school is a collection of certainties about the natural world — the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these 'facts' was hard won through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process — today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`;

const Q=[
{id:1,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:2,ch:[`의심들`,`실험들`,`확실한 것들`,`관찰들`],passage:`The science we learn in grade school is a collection of <u>certainties</u> about the natural world.`,stem:`밑줄 친 <b>certainties</b>의 뜻으로 가장 적절한 것은?`,det:{korean:`certainties = <b>확실한 것들</b>`,analysis:`✅ ③ 확실한 것들: certainties의 정확한 번역\n❌ ① 의심들: doubts\n❌ ② 실험들: experiments\n❌ ④ 관찰들: observations`,tip:`certainty(확실성) — certain(확실한)의 명사형`}},
{id:2,type:`어휘`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,ch:[`유기체, 생물`,`기관`,`조직`,`유기농`],passage:`DNA carries the information of an <u>organism</u>.`,stem:`밑줄 친 <b>organism</b>의 뜻으로 가장 적절한 것은?`,det:{korean:`organism = <b>유기체, 생물</b>`,analysis:`✅ ① 유기체, 생물: organism의 정확한 번역\n❌ ② 기관: organ\n❌ ③ 조직: organization\n❌ ④ 유기농: organic`,tip:`organism = 유기체, 생물체 (organ과 구분)`}},
{id:3,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`연속, 연쇄`,`논리적인`,`추론`,`노력`],passage:`Our understanding remains a work in progress after more than a century of <u>effort</u>.`,stem:`밑줄 친 <b>effort</b>의 뜻으로 가장 적절한 것은?`,det:{korean:`effort = <b>노력</b>`,analysis:`✅ ④ 노력: effort의 정확한 번역\n❌ ① 연속: succession\n❌ ② 논리적인: logical\n❌ ③ 추론: inference`,tip:`effort = 노력 / make an effort = 노력하다`}},
{id:4,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`do you realize — wins`,`do you realize — won`,`you realize — won`,`you do realize — winning`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science __________ that each of these \u2018facts\u2019 was hard __________ through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`두 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`부정어(Only) + 부사절이 문두에 오면 <b>도치(do you realize)</b>가 일어난다. 수동태이므로 과거분사 <b>won</b>이 적절하다.`,analysis:`✅ ② do you realize — won: 도치 + 수동태\n❌ ① wins: 수동태가 아닌 능동\n❌ ③ 도치 없음\n❌ ④ do는 강조, winning은 능동`,tip:`Only when ~ do S V: 부정 부사어 도치 구문`}},
{id:5,type:`어법`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`what — that`,`that — what`,`that — where`,`where — that`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize __________ each of these \u2018facts\u2019 was hard won through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon __________ we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`두 빈칸에 들어갈 말로 가장 적절한 것은?`,det:{korean:`첫 빈칸: realize의 목적어절 접속사 <b>that</b>. 둘째 빈칸: 과정의 <b>어디에(where)</b> 있느냐에 따라.`,analysis:`✅ ③ that — where: 명사절 접속사 + 관계부사\n❌ ① what: 뒤에 완전한 절이라 부적절\n❌ ② what: depending upon 뒤 장소 개념\n❌ ④ where — that: 순서 반대`,tip:`that + 완전한 절(접속사), where + 완전한 절(관계부사/장소)`}},
{id:6,type:`독해`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`불확실한 것들의 모음`,`확실한 것들의 모음`,`논리적 추론의 모음`,`과학 실험의 모음`],passage:FULL_PASSAGE,stem:`학교에서 배우는 과학은 무엇으로 묘사되고 있는가?`,det:{korean:`"a collection of certainties" = <b>확실한 것들의 모음</b>`,analysis:`✅ ② 확실한 것들의 모음: 원문 직역\n❌ ① 불확실한 것들: 반대\n❌ ③ 논리적 추론: 과학 실천에서의 설명\n❌ ④ 과학 실험: 직접 언급 아님`,tip:`grade school science = certainties (확실한 것들)`}},
{id:7,type:`독해`,diff:`보통`,pts:5,fmt:"mc",ans:3,ch:[`지식 조각을 모으는 것`,`실험을 반복하는 것`,`확실한 사실을 확인하는 것`,`불확실성을 줄이는 것`],passage:FULL_PASSAGE,stem:`본문에 따르면, 과학의 과정은 주로 무엇에 관한 것인가?`,det:{korean:`"less about collecting ~ than reducing the uncertainties" = <b>불확실성을 줄이는 것</b>`,analysis:`✅ ④ 불확실성을 줄이는 것: 핵심 요지\n❌ ① 지식 조각 모으기: "less about collecting"\n❌ ② 실험 반복: 직접 언급 아님\n❌ ③ 사실 확인: 부분적 설명에 불과`,tip:`less A than B → B가 주목적`}},
{id:8,type:`독해`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`사과가 나무에서 떨어지는 것`,`난류 유체 흐름`,`DNA의 정보 전달`,`지구의 공전`],passage:FULL_PASSAGE,stem:`본문에서 "quite certain(꽤 확실한)" 것의 예시로 든 것은?`,det:{korean:`"today we are quite certain of how an apple will fall from a tree" = <b>사과가 나무에서 떨어지는 것</b>`,analysis:`✅ ① 사과가 나무에서 떨어지는 것: 원문 일치\n❌ ② 난류 유체 흐름: "a work in progress" (불확실)\n❌ ③ DNA: grade school 예시\n❌ ④ 지구 공전: grade school 예시`,tip:`certain의 예 = apple falling, uncertain의 예 = turbulent fluid flow`}},
{id:9,type:`T/F`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`본문에 따르면, 과학적 사실은 쉽게 얻어진다. (T/F)`,det:{korean:`"hard won" = 어렵게 얻어진 → <b>False</b>`,analysis:`✅ False: "hard won" = 어렵게 얻어진 (쉽게가 아님)`,tip:`hard won = 어렵게 쟁취한, 힘들게 얻은`}},
{id:10,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`True`,`False`],passage:FULL_PASSAGE,stem:`본문에 따르면, 난류 유체 흐름에 대한 이해는 100년 이상 연구되었지만 아직 완성되지 않았다. (T/F)`,det:{korean:`"remains a work in progress after more than a century of effort" → <b>True</b>`,analysis:`✅ True: "a work in progress" + "more than a century"와 일치`,tip:`a work in progress = 진행 중 (아직 미완성)`}},
{id:11,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`organism`,accept:[`organism`,`Organism`,`an organism`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an __________, and so on. Only when you start to learn the practice of science do you realize that each of these \u2018facts\u2019 was hard won through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`다음 빈칸에 들어갈 단어를 쓰시오.`,det:{korean:`DNA는 <b>유기체(organism)</b>의 정보를 전달한다.`,analysis:`organism: 유기체, 생물\n원문: "DNA carries the information of an organism"`,tip:`organism = 유기체, 생물체`}},
{id:12,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`inferences`,accept:[`inferences`,`Inferences`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these \u2018facts\u2019 was hard won through a succession of logical __________  based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`다음 빈칸에 들어갈 단어를 쓰시오.`,det:{korean:`논리적 <b>추론(inferences)</b>의 연속을 통해 어렵게 얻어졌다.`,analysis:`inferences: 추론 (복수형)\ninference의 복수형에 주의`,tip:`inference = 추론 / infer(추론하다)의 명사형`}},
{id:13,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:2,ch:[`어려운`,`쉬운`,`격동의, 난류의`,`차분한`],passage:`Our understanding of the <u>turbulent</u> fluid flow remains a work in progress.`,stem:`밑줄 친 <b>turbulent</b>의 뜻으로 가장 적절한 것은?`,det:{korean:`turbulent = <b>격동의, 난류의</b>`,analysis:`✅ ③ 격동의, 난류의: turbulent의 정확한 번역\n❌ ① 어려운: difficult\n❌ ② 쉬운: easy\n❌ ④ 차분한: calm (반의어)`,tip:`turbulent ↔ calm (차분한)`}},
{id:14,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:0,ch:[`depending upon`,`depended upon`,`depends upon`,`to depend upon`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these \u2018facts\u2019 was hard won through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge __________ where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`빈칸에 들어갈 어법상 가장 적절한 것은?`,det:{korean:`분사구문으로 <b>depending upon</b>(~에 따라)이 적절하다. 주절과 동시 동작이므로 현재분사.`,analysis:`✅ ① depending upon: 분사구문 (동시 동작)\n❌ ② depended upon: 과거분사 — 수동 의미로 부적절\n❌ ③ depends upon: 동사 — 접속사 없이 불가\n❌ ④ to depend upon: 부정사 — 목적/결과 의미 부적절`,tip:`depending upon/on = ~에 따라 (분사구문)`}},
{id:15,type:`독해`,diff:`어려움`,pts:6,fmt:"mc",ans:0,ch:[`과학은 현재의 지식에 대한 불확실함을 줄이는 과정이다`,`과학적 사실은 학교에서 배우는 것만으로 충분하다`,`모든 과학적 지식은 동일한 수준의 확실성을 가진다`,`과학은 주로 새로운 사실을 발견하는 것이다`],passage:FULL_PASSAGE,stem:`다음 글의 요지로 가장 적절한 것은?`,det:{korean:`글의 핵심: <b>과학의 과정은 불확실성을 줄이는 것</b>이다.`,analysis:`✅ ① 불확실함을 줄이는 과정: 핵심 요지\n❌ ② 학교 학습으로 충분: 반대\n❌ ③ 동일한 수준: "greater or lesser"로 반박\n❌ ④ 새로운 사실 발견: "less about collecting"`,tip:`요지 = 글 전체의 핵심 주장. "less ~ than ~" 구문이 핵심`}},
{id:16,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`reducing`,accept:[`reducing`,`Reducing`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these \u2018facts\u2019 was hard won through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about __________ the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,stem:`다음 빈칸에 들어갈 단어를 쓰시오.`,det:{korean:`불확실성을 <b>줄이는(reducing)</b> 것에 관한 것이다.`,analysis:`reducing: 줄이는 (동명사)\nabout + V-ing 구문`,tip:`reduce = 줄이다 → reducing (동명사)`}},
{id:17,type:`어휘`,diff:`보통`,pts:5,fmt:"mc",ans:1,ch:[`experiments — observations`,`observations — experiments`,`assumptions — theories`,`hypotheses — conclusions`],passage:`Each of these 'facts' was hard won through a succession of logical inferences based upon many (A) or (B).`,stem:`원문에서 (A)와 (B)에 들어갈 단어 쌍으로 적절한 것은?`,det:{korean:`원문: many <b>observations</b> or <b>experiments</b>`,analysis:`✅ ② observations — experiments: 원문 순서 일치\n❌ ① 순서 반대\n❌ ③ assumptions/theories: 원문과 다른 단어\n❌ ④ hypotheses/conclusions: 원문과 다른 단어`,tip:`observations(관찰) or experiments(실험) — 과학적 방법의 두 축`}},
{id:18,type:`순서 배열`,diff:`어려움`,pts:6,fmt:"mc",ans:2,ch:[`(B) — (C) — (A)`,`(C) — (A) — (B)`,`(A) — (C) — (B)`,`(B) — (A) — (C)`],passage:`(A) The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know.\n\n(B) Today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress.\n\n(C) Only when you start to learn the practice of science do you realize that each of these 'facts' was hard won through a succession of logical inferences.`,stem:`주어진 글 다음에 이어질 순서로 가장 적절한 것은? (첫 문장: The science we learn in grade school is a collection of certainties about the natural world.)`,det:{korean:`학교 과학 = 확실성 → (A) 과학 실천 배우면 깨달음 → (C) 과학의 과정은 불확실성 줄이기 → (B) 예시(사과 vs 난류). 아닌, 원문 순서 확인: 실제로는 (C)→(A)→(B) 순서이지만 보기에서 (A)-(C)-(B) = ③`,analysis:`✅ ③ (A) — (C) — (B): 원문 논리 흐름 일치\n확실성 소개 → 과학 실천의 깨달음(C) → 불확실성 줄이기(A) → 예시(B)`,tip:`글의 논리적 흐름: 일반적 설명 → 핵심 주장 → 구체적 예시`}},
{id:19,type:`서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`a work in progress`,accept:[`a work in progress`,`A work in progress`,`work in progress`],passage:`The science we learn in grade school is a collection of certainties about the natural world \u2014 the earth goes around the sun, DNA carries the information of an organism, and so on. Only when you start to learn the practice of science do you realize that each of these \u2018facts\u2019 was hard won through a succession of logical inferences based upon many observations or experiments. The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know. Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process \u2014 today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains __________ after more than a century of effort.`,stem:`다음 빈칸에 들어갈 표현을 영어로 쓰시오. (진행 중인 작업)`,det:{korean:`진행 중인 작업 = <b>a work in progress</b>`,analysis:`a work in progress: 정해진 숙어 표현\n= 아직 완성되지 않은 진행 중인 것`,tip:`a work in progress = 아직 미완성인 것, 진행 중인 작업`}},
{id:20,type:`독해`,diff:`어려움`,pts:6,fmt:"mc",ans:3,ch:[`To list all the certainties taught in schools`,`To argue that turbulent fluid flow research should be abandoned`,`To explain how grade school makes science too simple`,`To show that science is a process of reducing uncertainty`],passage:FULL_PASSAGE,stem:`What is the author's main purpose in writing this passage?`,det:{korean:`저자의 주된 목적은 <b>과학이 불확실성을 줄이는 과정임을 보여주는 것</b>이다.`,analysis:`✅ ④ To show that science is a process of reducing uncertainty: 핵심 목적\n❌ ① 학교에서 가르치는 확실한 것 나열: 글의 도입부일 뿐\n❌ ② 연구 포기 주장: 언급 없음\n❌ ③ 학교 과학이 너무 단순: 주목적 아님`,tip:`author's purpose = 저자의 목적 → 글 전체의 핵심 메시지`}}
];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어휘':'tag-vocab','어법':'tag-grammar','독해':'tag-reading','서술형':'tag-written','T/F':'tag-tf','순서 배열':'tag-order'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`🧩 온라인퀴즈 TEST 상세 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
