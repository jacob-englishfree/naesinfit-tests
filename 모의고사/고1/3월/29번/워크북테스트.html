<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2025 고1 3월 29번 온라인워크북TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--o:#7C3AED;--od:#5B21B6;--ol:#A78BFA;--oxl:#F3F0FF;--oxxl:#FAF5FF;--bg:#F5F3FF;--text:#1A1A2E;--tm:#6B5B8A;--tl:#9A8DB8;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--warn:#F59E0B;--wl:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,#F3F0FF,#E8E0FF 40%,#DDD6FE);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--o),#6D28D9);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--od),var(--o));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--o),#6D28D9);padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f0edf5;}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}.chip{background:var(--card);border:1.5px solid #d8d0e8;border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid #d0c8dc;border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 4px rgba(124,58,237,.1);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;box-shadow:0 6px 20px rgba(124,58,237,.3);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid #c8c0d8;color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--o);color:var(--o);}
.history-badge{background:var(--oxl);color:var(--o);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid #d8d0e8;border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--o);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--o);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--o);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--warn);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{max-width:820px;margin:0 auto;padding:24px 20px 100px;}
.q-card{background:var(--card);border-radius:var(--radius);margin-bottom:22px;box-shadow:var(--shadow);overflow:hidden;}
.q-header{display:flex;align-items:center;gap:10px;padding:16px 22px;background:linear-gradient(135deg,#F3F0FF,#E8E0FF);border-bottom:1px solid #e0d8ec;flex-wrap:wrap;}
.q-num{width:36px;height:36px;background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-grammar{background:#EDE7F6;color:#5E35B1;}.tag-content{background:#E0F7FA;color:#00838F;}.tag-blank{background:var(--bl);color:var(--b);}.tag-written{background:#FFF3E0;color:#E65100;}.tag-tf{background:#FCE4EC;color:#C2185B;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f0edf5;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--o);font-weight:800;}
.q-body{padding:22px;}
.q-passage{background:linear-gradient(135deg,#FAFBFF,#F5F0FF);border-left:4px solid var(--o);padding:16px 18px;margin-bottom:18px;border-radius:0 var(--rs) var(--rs) 0;font-size:13.5px;line-height:1.95;}
.q-stem{font-size:14px;font-weight:700;margin-bottom:16px;}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice-btn{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:2px solid #d8d0e8;border-radius:var(--rs);cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:14px;line-height:1.6;}
.choice-btn:hover{border-color:var(--o);}.choice-btn.selected{border-color:var(--o);box-shadow:0 0 0 3px rgba(124,58,237,.12);background:var(--oxxl);}
.c-num{min-width:26px;height:26px;background:#e8e0f0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;}
.written-input{width:100%;padding:14px 16px;border:2px solid #d0c8dc;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--o);}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);padding:10px 16px;display:flex;align-items:center;gap:5px;justify-content:center;z-index:100;overflow-x:auto;flex-wrap:wrap;}
.nav-dot{width:28px;height:28px;border-radius:50%;background:#d8d0e8;cursor:pointer;border:none;font-size:10px;font-weight:800;color:var(--tm);display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;}.nav-dot.answered{background:var(--o);color:#fff;}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,#EDE7F6,#D1C4E9);}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--o),#7C3AED);color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--od),var(--o));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8e0f0;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--o),var(--ol));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:#FAFBFF;border-radius:var(--rs);border:1px solid #d8d0e8;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--oxl);}.info-cell.highlight .ic-value{color:var(--o);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0f0;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:#EDE7F6;color:var(--o);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--oxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0c8dc;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--o);color:var(--o);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #d8d0e8;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:#FAFBFF;display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:#F3F0FF;}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:#EDE7F6;color:var(--o);}.expl-tag.tip{background:var(--oxl);color:var(--od);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--o);}.expl-box.tip-b{border-left:3px solid var(--o);background:var(--oxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">📝 온라인워크북 TEST</div>
  <h1 class="start-title">온라인워크북 <span>TEST</span></h1>
  <p class="start-subtitle">2025 고1 3월 모의고사 · 29번 · 어법 · 20문항</p>
  <div class="info-card"><div class="info-card-header">📚 시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">2025 고1 3월 모의고사</span></div>
    <div class="info-row"><span class="info-label">문항</span><span class="info-value">29번 (어법)</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">Routines & Competition</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">📝 20문항</div><div class="chip">⏱️ 20분</div><div class="chip">✅ 80점 이상 통과</div><div class="chip">📊 100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>

<script>
const EI={"subject":"2025 고1 3월 모의고사","pub":"29번","lesson":"어법","title":"Routines & Competition","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_2025_g1_mar_29_v1"};

const FULL_PASSAGE=`Routines enable athletes to evaluate competition conditions. For example, bouncing a ball in a volleyball service routine supplies the server with information about the ball, the floor, and the state of her muscles. This information can then be used to properly prepare for her serve. Routines also enable athletes to adjust and fine-tune their preparations based on those evaluations or in pursuit of a particular competitive goal. This adaptation can involve adjustment to the conditions, rivals, competitive situation, or internal influences that can affect performance. Just like adjusting a race-car engine to the conditions of the track, air temperature, and weather, routines adjust all competitive components to achieve proper performance.`;

const Q=[
// ━━━ 어법 (Q1-Q5) ━━━
{id:1,type:`어법`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`enable`,`enables`,`enabling`,`to enable`],
passage:`Routines __________ athletes to evaluate competition conditions. For example, bouncing a ball in a volleyball service routine supplies the server with information about the ball, the floor, and the state of her muscles.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`주어 Routines는 <b>복수 명사</b>이므로 <b>복수 동사 enable</b>이 와야 한다.`,
analysis:`✅ ① enable: 복수 주어 Routines → 복수 동사 enable\n❌ ② enables: 단수 동사 → 복수 주어와 불일치\n❌ ③ enabling: 분사 → 동사 자리 불가\n❌ ④ to enable: to부정사 → 동사 자리 불가`,
tip:`주어-동사 수일치: 복수 주어(Routines) → 복수 동사(enable)`}},

{id:2,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`supply`,`to supply`,`supplies`,`supplying`],
passage:`Routines enable athletes to evaluate competition conditions. For example, bouncing a ball in a volleyball service routine __________ the server with information about the ball, the floor, and the state of her muscles.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`주어 "bouncing a ball in a volleyball service routine"은 <b>동명사구(단수)</b>이므로 <b>단수 동사 supplies</b>가 와야 한다.`,
analysis:`✅ ③ supplies: 동명사 주어 = 단수 취급 → 단수 동사\n❌ ① supply: 복수 동사 형태\n❌ ② to supply: to부정사 → 동사 자리 불가\n❌ ④ supplying: 분사 → 동사 자리 불가`,
tip:`동명사(~ing) 주어 = 단수 취급 → 단수 동사(supplies, is, has 등)`}},

{id:3,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`proper`,`properly`,`being proper`,`properness`],
passage:`This information can then be used to __________ prepare for her serve. Routines also enable athletes to adjust and fine-tune their preparations based on those evaluations.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`동사 prepare를 수식하는 <b>부사 properly</b>가 적절하다.`,
analysis:`✅ ② properly: 부사 → 동사 prepare를 수식\n❌ ① proper: 형용사 → 동사 수식 불가\n❌ ③ being proper: 분사구 → 부적절\n❌ ④ properness: 명사 → 동사 수식 불가`,
tip:`동사 수식 = 부사. properly prepare = 적절히 준비하다`}},

{id:4,type:`어법`,diff:`어려움`,pts:6,fmt:"mc",ans:2,
ch:[`who`,`what`,`that`,`whom`],
passage:`This adaptation can involve adjustment to the conditions, rivals, competitive situation, or internal influences __________ can affect performance. Just like adjusting a race-car engine to the conditions of the track, air temperature, and weather, routines adjust all competitive components to achieve proper performance.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`선행사 internal influences(사물)를 받는 주격 관계대명사 <b>that</b>이 적절하다. (원문의 ④번 오류 what → that)`,
analysis:`✅ ③ that: 선행사 influences(사물) + 주격 관계대명사 → that can affect\n❌ ① who: 사람 선행사용\n❌ ② what: 선행사를 포함하는 관계대명사 → 이미 선행사 있으므로 불가\n❌ ④ whom: 목적격 → 뒤에 동사(can affect)가 옴`,
tip:`선행사 있음 + 주격 = that/which, 선행사 없음 = what. 이 문장은 선행사 influences가 있으므로 that`}},

{id:5,type:`어법`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`①`,`②`,`③`],
passage:`Routines enable athletes to evaluate competition conditions. For example, bouncing a ball in a volleyball service routine supplies the server with information about the ball, the floor, and the state of her muscles. This information can then be used to properly prepare for her serve. Routines also enable athletes to ①<u>adjust</u> and fine-tune their preparations ②<u>based</u> on those evaluations or in pursuit of a particular competitive goal. This adaptation can involve adjustment to the conditions, rivals, competitive situation, or internal influences that can affect performance. Just like ③<u>adjust</u> a race-car engine to the conditions of the track, air temperature, and weather, routines adjust all competitive components to achieve proper performance.`,
stem:`다음 글의 밑줄 친 ①~③ 중, 어법상 <b>틀린</b> 것은?`,
det:{korean:`③ adjust → <b>adjusting</b>: "Just like adjusting"에서 전치사 like 뒤에는 동명사(~ing)가 와야 한다.`,
analysis:`❌ ③ adjust: like(전치사) 뒤에 동명사 adjusting이 와야 함\n✅ ① adjust: enable + O + to + 동사원형 → 올바름\n✅ ② based: based on ~에 근거하여 (분사구문) → 올바름`,
tip:`전치사 like + 동명사(~ing): Just like adjusting = ~을 조정하는 것처럼`}},

// ━━━ 내용이해 (Q6-Q8) ━━━
{id:6,type:`내용이해`,diff:`쉬움`,pts:4,fmt:"mc",ans:1,
ch:[`배구 서브 루틴에서 공을 튀기는 것은 불필요하다.`,`루틴은 선수가 경기 조건을 평가할 수 있게 해준다.`,`루틴은 선수의 신체 상태와 무관하다.`,`경기 중 루틴은 수행에 방해가 된다.`],
passage:FULL_PASSAGE,
stem:`다음 글의 내용과 <b>일치하는</b> 것은?`,
det:{korean:`"Routines enable athletes to evaluate competition conditions." → 루틴은 선수가 경기 조건을 평가할 수 있게 한다.`,
analysis:`✅ ② 루틴은 선수가 경기 조건을 평가할 수 있게 한다: 원문 첫 문장과 일치\n❌ ① 불필요: supplies information이므로 필요함\n❌ ③ 무관: state of her muscles 언급\n❌ ④ 방해: enable, achieve 등 긍정적 서술`,
tip:`내용 일치 문제: 첫 문장이 핵심 주장인 경우가 많음`}},

{id:7,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:3,
ch:[`루틴은 경기 조건 평가에 도움이 된다.`,`공 튀기기는 서버에게 정보를 제공한다.`,`루틴은 준비를 미세 조정할 수 있게 해준다.`,`루틴은 내부적 영향에는 적응할 수 없다.`],
passage:FULL_PASSAGE,
stem:`다음 글의 내용과 <b>일치하지 않는</b> 것은?`,
det:{korean:`"internal influences that can affect performance" → 내부적 영향도 적응 대상에 포함된다.`,
analysis:`❌ ④ 루틴은 내부적 영향에 적응할 수 없다: 원문은 "internal influences"를 적응 대상으로 포함 → 반대\n✅ ① 경기 조건 평가: 원문 일치\n✅ ② 정보 제공: 원문 일치\n✅ ③ 미세 조정: 원문 일치`,
tip:`불일치 문제: "internal influences"가 적응 대상에 포함되어 있음을 확인`}},

{id:8,type:`내용이해`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`경기 중 루틴을 사용하면 집중력이 떨어진다.`,`루틴을 통해 선수는 경기 조건을 평가하고 준비를 조정할 수 있다.`,`루틴은 레이스카 엔진과 달리 조정이 불가능하다.`,`선수의 내부 상태는 경기 수행에 영향을 미치지 않는다.`,`루틴은 특정 목표 추구와 무관하다.`],
passage:FULL_PASSAGE,
stem:`다음 글의 요지로 가장 적절한 것은?`,
det:{korean:`루틴은 경기 조건 평가와 준비 조정을 가능하게 하여 적절한 수행을 달성하게 한다.`,
analysis:`✅ ② 루틴을 통해 선수는 경기 조건을 평가하고 준비를 조정할 수 있다\n❌ ① 집중력 떨어짐: 언급 없음\n❌ ③ 조정 불가능: "Just like adjusting a race-car engine"으로 비유\n❌ ④ 영향 없음: "internal influences that can affect" 언급\n❌ ⑤ 무관: "in pursuit of a particular competitive goal" 언급`,
tip:`요지 파악: evaluate + adjust + fine-tune + achieve → 루틴의 역할`}},

// ━━━ 빈칸추론 (Q9-Q11) ━━━
{id:9,type:`빈칸추론`,diff:`보통`,pts:5,fmt:"mc",ans:2,
ch:[`ignore`,`complicate`,`evaluate`,`avoid`],
passage:`Routines enable athletes to __________ competition conditions. For example, bouncing a ball in a volleyball service routine supplies the server with information about the ball, the floor, and the state of her muscles. This information can then be used to properly prepare for her serve.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`루틴은 경기 조건을 <b>평가(evaluate)</b>할 수 있게 해 준다.`,
analysis:`✅ ③ evaluate: 뒤에 information, evaluations으로 이어지는 흐름\n❌ ① ignore: 정보 수집과 반대\n❌ ② complicate: 문맥과 무관\n❌ ④ avoid: 문맥과 반대`,
tip:`evaluate → information → evaluations: 평가-정보-평가결과의 일관된 흐름`}},

{id:10,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:3,
ch:[`undermine`,`abandon`,`restrict`,`achieve`],
passage:`This adaptation can involve adjustment to the conditions, rivals, competitive situation, or internal influences that can affect performance. Just like adjusting a race-car engine to the conditions of the track, air temperature, and weather, routines adjust all competitive components to __________ proper performance.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`모든 경쟁 구성 요소를 조정하여 적절한 수행을 <b>달성(achieve)</b>한다.`,
analysis:`✅ ④ achieve: adjust + components → 목적은 달성\n❌ ① undermine(약화시키다): 반대\n❌ ② abandon(포기하다): 반대\n❌ ③ restrict(제한하다): 문맥과 반대`,
tip:`adjust all components to achieve: 구성 요소를 조정하여 달성하다`}},

{id:11,type:`빈칸추론`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`information`,`adaptation`,`competition`,`elimination`],
passage:`Routines also enable athletes to adjust and fine-tune their preparations based on those evaluations or in pursuit of a particular competitive goal. This __________ can involve adjustment to the conditions, rivals, competitive situation, or internal influences that can affect performance.`,
stem:`다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`준비를 조정하고 미세 조정하는 것 = <b>적응(adaptation)</b>`,
analysis:`✅ ② adaptation: adjust + fine-tune을 요약하는 상위 개념\n❌ ① information: 앞 문단의 내용\n❌ ③ competition: 경쟁 자체가 아닌 적응 과정\n❌ ④ elimination: 문맥과 무관`,
tip:`This + 명사: 앞 내용을 요약하는 지시어. adjust/fine-tune → adaptation`}},

// ━━━ 서술형 (Q12-Q16) ━━━
{id:12,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`competitive`,accept:[`competitive`,`Competitive`],
passage:`Routines also enable athletes to adjust and fine-tune their preparations based on those evaluations or in pursuit of a particular __________ (compete) goal.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`compete(동사) → <b>competitive(형용사)</b>: goal 앞에서 수식하는 형용사 필요`,
analysis:`compete(동사) → competitive(형용사)\n명사 goal을 수식하는 형용사가 필요`,
tip:`compete → competitive / competition / competitor`}},

{id:13,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`evaluations`,accept:[`evaluations`,`Evaluations`],
passage:`Routines also enable athletes to adjust and fine-tune their preparations based on those __________ (evaluate) or in pursuit of a particular competitive goal.`,
stem:`다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.`,
det:{korean:`evaluate(동사) → <b>evaluations(명사, 복수)</b>: those 뒤에 복수 명사 필요`,
analysis:`evaluate(동사) → evaluations(명사, 복수)\nthose + 복수 명사 → evaluations`,
tip:`evaluate → evaluation(명사) / evaluations(복수) — those는 복수 명사를 수식`}},

{id:14,type:`서술형`,diff:`보통`,pts:5,fmt:"written",wa:`properly`,accept:[`properly`,`Properly`],
passage:FULL_PASSAGE,
stem:`다음 글에서 서브를 위해 준비하는 방식을 나타내는 <b>부사 1단어</b>를 본문에서 찾아 쓰시오.`,
det:{korean:`"used to <b>properly</b> prepare for her serve" → 적절히 준비하다`,
analysis:`properly(적절히): 동사 prepare를 수식하는 부사`,
tip:`"본문에서 찾아 쓰기" 유형: 서브 준비 방식 = properly`}},

{id:15,type:`서술형`,diff:`쉬움`,pts:4,fmt:"written",wa:`adaptation`,accept:[`adaptation`,`Adaptation`],
passage:FULL_PASSAGE,
stem:`다음 글에서 루틴을 통한 준비 조정 과정을 가리키는 <b>1단어</b>를 본문에서 찾아 쓰시오.`,
det:{korean:`"This <b>adaptation</b> can involve adjustment" → 적응`,
analysis:`adaptation(적응): adjust와 fine-tune을 요약하는 핵심어`,
tip:`본문의 핵심 키워드 찾기: adjust + fine-tune = adaptation`}},

{id:16,type:`서술형`,diff:`어려움`,pts:6,fmt:"written",wa:`that`,accept:[`that`,`That`],
passage:FULL_PASSAGE,
stem:`다음 글의 원래 어법상 틀린 부분(④ what)을 올바르게 고쳐 <b>1단어</b>로 쓰시오. (힌트: 선행사 influences 뒤 주격 관계대명사)`,
det:{korean:`what → <b>that</b>: 선행사 influences가 있으므로 선행사를 포함하는 what이 아닌 that이 와야 한다.`,
analysis:`what(선행사 포함) → that(선행사 있을 때 주격 관계대명사)\ninfluences that can affect performance`,
tip:`선행사 O + 주격 관계대명사 = that/which | 선행사 X = what`}},

// ━━━ T/F (Q17-Q20) ━━━
{id:17,type:`T/F`,diff:`쉬움`,pts:4,fmt:"mc",ans:0,
ch:[`True`,`False`],
passage:FULL_PASSAGE,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>Bouncing a ball in a volleyball service routine provides the server with information.</b>"`,
det:{korean:`"bouncing a ball ... supplies the server with information" → <b>True</b>`,

{id:18,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:1,
ch:[`True`,`False`],
passage:FULL_PASSAGE,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>Routines prevent athletes from adjusting their preparations.</b>"`,
det:{korean:`본문: "Routines also enable athletes to adjust" → 루틴은 조정을 <b>가능하게</b> 한다. prevent(막다)는 <b>반대</b>. → <b>False</b>`,
analysis:`❌ False: enable(가능하게 하다) ≠ prevent(막다)`,
tip:`enable ↔ prevent: 정반대 의미`}},

{id:19,type:`T/F`,diff:`보통`,pts:5,fmt:"mc",ans:0,
ch:[`True`,`False`],
passage:FULL_PASSAGE,
stem:`다음 진술이 본문의 내용과 일치하면 True, 일치하지 않으면 False를 고르시오.\n<br><br>"<b>The writer compares routines to adjusting a race-car engine.</b>"`,
det:{korean:`"Just like adjusting a race-car engine" → 루틴을 레이스카 엔진 조정에 비유 → <b>True</b>`,

{id:20,type:`T/F`,diff:`어려움`,pts:6,fmt:"mc",ans:1,
ch:[`True`,`False`],
passage:FULL_PASSAGE,

];


let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법':'tag-grammar','내용이해':'tag-content','빈칸추론':'tag-blank','서술형':'tag-written','T/F':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch?(d.q.ch.length===5?'①②③④⑤':d.q.ch.length===4?'①②③④':d.q.ch.length===3?'①②③':'①②'):'';const _=0;const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:#EDE7F6;color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:#EDE7F6;color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div><div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip}</div></div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인워크북 TEST 결과\n${EI.subject} · ${EI.pub}\n👤 ${nm}\n🏆 ${r.score}/${EI.total}점 (${pct}%) ${lv.icon}${lv.name}\n✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>toast('복사 실패'));}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
