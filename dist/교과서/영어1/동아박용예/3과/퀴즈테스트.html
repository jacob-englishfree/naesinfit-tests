<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영어Ⅰ 동아(박용예) 온라인퀴즈TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* NaesinFit — Orange Theme (퀴즈테스트) */
:root{
  --p:#E8772E;--pd:#B85A1A;--pl:#F5A623;--pxl:#FFF3E8;--pxxl:#FFFAF5;
  --bg:#F6F2EE;--text:#1A1A2E;--tm:#7A6A5E;--tl:#A89A8E;
  --r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;
  --o:#F59E0B;--ol:#FFF8E1;
  --card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);
  --radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;
  --pborder:#ddd8d2;--pbg-muted:#e8e0d8;
  --passage-bg:linear-gradient(135deg,#FFFAF8,#F5F0EB);
  --start-grad:linear-gradient(160deg,#FFF3E8,#FFE8D6 40%,#FFDDC8);
  --accent2:#D97706;
  --p-rgba-08:rgba(232,119,46,.08);
  --p-rgba-10:rgba(232,119,46,.1);
  --p-rgba-12:rgba(232,119,46,.12);
  --p-rgba-25:rgba(232,119,46,.25);
  --p-rgba-30:rgba(232,119,46,.3);
}

/* NaesinFit Test Engine — Common CSS (theme-agnostic)
   Theme-specific colors come from :root variables defined in theme-*.css:
   --p      : primary color
   --pd     : primary dark
   --pl     : primary light
   --pxl    : primary extra-light
   --pxxl   : primary xx-light
   --bg     : page background
   --text   : main text
   --tm     : text muted
   --tl     : text light
   --pborder: border color (theme-tinted)
   --pbg-muted: muted bg for tracks/bars
   --start-grad: startScreen gradient
   --accent2: secondary gradient stop (badge/header)
   --p-rgba-08: rgba for selected bg
   --p-rgba-12: rgba for box-shadow
   --p-rgba-10: rgba for focus ring
   --p-rgba-25: rgba for button shadow
   --p-rgba-30: rgba for selectPulse
*/

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Start Screen */
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:var(--start-grad);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--p),var(--accent2));color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--p),var(--accent2));padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid var(--pborder);}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid var(--pborder);border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid var(--pborder);border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-rgba-10);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;box-shadow:0 6px 20px var(--p-rgba-30);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid var(--pborder);color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--p);color:var(--p);}
.history-badge{background:var(--pxl);color:var(--p);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid var(--pborder);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--p);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}

/* Exam Screen */
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--p);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--p);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--p);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--accent2));transition:width .5s ease;border-radius:0 2px 2px 0;}

/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--pxl),var(--pl));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--pd);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:12px 16px 16px;max-height:48vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
.slide-choices{display:flex;flex-direction:column;gap:4px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;line-height:1.4;border:1.5px solid rgba(0,0,0,.06);border-radius:12px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--p);background:var(--p-rgba-08);box-shadow:0 0 0 3px var(--p-rgba-12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 var(--p-rgba-30)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:24px;height:24px;font-size:11px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--p-rgba-10);}
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;box-shadow:0 2px 8px var(--p-rgba-25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--p);}
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--p);background:var(--pxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}

/* Type tags — same across all themes */
.tag-combo{background:#E8F5E9;color:#166534;}.tag-wrong{background:#FFF0F0;color:#D63B3B;}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:#EDF2FF;color:#3B6FD9;}.tag-ant{background:#FFF8E1;color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}.tag-insert{background:#E3F2FD;color:#1565C0;}.tag-order{background:#FFF8E1;color:#F57F17;}

.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:var(--pbg-muted);padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--p);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:var(--passage-bg);border-left:3px solid var(--p);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--pborder);border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--p);}.choice-btn.selected{border-color:var(--p);box-shadow:0 0 0 2px var(--p-rgba-12);background:var(--pxxl);}
.c-num{min-width:22px;height:22px;background:var(--pbg-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid var(--pborder);border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--p);}

/* Result Screen */
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--pxl),var(--pl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:var(--pbg-muted);border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--pl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--pxxl);border-radius:var(--rs);border:1px solid var(--pborder);}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--pxl);}.info-cell.highlight .ic-value{color:var(--p);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:var(--pbg-muted);border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--pl);color:var(--p);}.tag-item.weak{background:#FFF0F0;color:#D63B3B;}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--pxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid var(--pborder);border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--p);color:var(--p);}.act-btn.primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid var(--pborder);border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--pxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--pxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--pl);color:var(--p);}.expl-tag.tip{background:var(--pxl);color:var(--pd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--p);}.expl-box.tip-b{border-left:3px solid var(--p);background:var(--pxl);}

@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">온라인퀴즈 TEST</div>
  <h1 class="start-title">온라인퀴즈 <span>TEST</span></h1>
  <p class="start-subtitle">영어Ⅰ · 동아(박용예) · 3과 · 20문항</p>
  <div class="info-card"><div class="info-card-header">시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">영어Ⅰ</span></div>
    <div class="info-row"><span class="info-label">문항</span><span class="info-value">동아(박용예) (3과)</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">Act for Our Planet</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">20문항</div><div class="chip">20분</div><div class="chip">80점 이상 통과</div><div class="chip">100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="startExam()">시험 시작하기</button>
  <button class="btn btn-outline" onclick="toggleHistory()">시험 기록 보기 <span class="history-badge" id="hCount">0</span></button>
  <div id="historyPanel"></div>
</div>
</div>

<div id="examScreen" class="screen">
  <div class="exam-topbar"><div class="topbar-left"><div class="topbar-dot"></div><div class="topbar-info">영어Ⅰ · <span>동아(박용예)</span></div></div><div class="timer" id="timer">20:00</div><button class="btn-submit" onclick="submitExam()">제출하기</button></div>
  <div class="exam-progress"><div class="exam-progress-fill" id="progressFill"></div></div>
  <div class="ans-count" id="ansCount">0/20</div>
  <div class="exam-scroll" id="examScroll"></div>

const Q=[{"id":1,"type":"어법","diff":"쉬움","pts":4,"fmt":"mc","passage":"Whales are amazing creatures. They are enormous and live incredibly long lives. The largest blue whales can grow as long as 30 meters and weigh over 200 tons, and some whales have been <u>ⓐ known</u> to live for more than 100 years. These giants do extremely <u>ⓑ beneficial</u> things for the environment throughout their long lives and even after death. According to scientists, a single whale can absorb about 550 kilograms of CO₂ per year, while a tree can absorb only 22. Moreover, after they die, whales sink to the ocean floor with all the CO₂ they <u>ⓒ absorbing</u> during their lives. Their bodies then become food and habitats for deep-sea creatures. This process <u>ⓓ is called</u> a whale fall. Whale falls permanently <u>ⓔ bury</u> about 145,000 tons of CO₂ under the sea every year.","stem":"다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 어색한 것을 고르시오.","det":{"korean":"고래는 살아있는 동안 흡수한 모든 CO₂와 함께 해저로 가라앉는다. 관계대명사 목적격 생략 구문에서 동사는 주절 시제(die → 과거)에 맞춰 과거형 absorbed가 되어야 하므로, 현재분사 absorbing은 어법상 어색하다.","analysis":"원문: whales sink to the ocean floor with all the CO₂ they absorbed during their lives","tip":"어법 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":2,"ch":["ⓐ known","ⓑ beneficial","ⓒ absorbing","ⓓ is called","ⓔ bury"]},
{"id":2,"type":"어법","diff":"쉬움","pts":4,"fmt":"mc","passage":"Whales dive deep into the ocean to feed on prey such as krill and small fish, and they occasionally swim up to the surface to breathe. When they near the surface, they release an enormous amount of waste. This waste is rich in nutrients (A) [that / what] are essential for creatures living in that area. Specifically, it creates the perfect growing conditions for some microscopic creatures (B) [floating / floated] at the surface of the ocean. These creatures, called phytoplankton, may look tiny and insignificant, but when (C) [taking / taken] together, they play a significant role in reducing CO₂.","stem":"다음 글의 괄호 (A), (B), (C) 안에서 어법에 맞는 표현으로 가장 적절한 것을 고르시오.","det":{"korean":"생물에게 필수적인 영양분 / 해수면에 떠다니는 미세 생물 / 함께 고려하면. (A) 선행사 nutrients + 주격 관계대명사 that, (B) 능동·진행의 현재분사 floating이 creatures 수식, (C) 분사구문에서 주어 they가 take의 대상이므로 수동 taken.","analysis":"원문: nutrients that are essential for creatures / microscopic creatures floating at the surface / when taken together","tip":"어법 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["(A) that – (B) floating – (C) taken","(A) what – (B) floating – (C) taken","(A) that – (B) floated – (C) taking","(A) what – (B) floated – (C) taken","(A) that – (B) floating – (C) taking"]},
{"id":3,"type":"어법","diff":"쉬움","pts":4,"fmt":"mc","passage":"Despite the important roles of whales in our environment, their lives are at serious risk. The number of whales <u>ⓐ had dramatically dropped</u> until killing them for commercial purposes was officially banned in 1986. It is estimated that the global whale population <u>ⓑ fell</u> from 4 to 5 million to just over 1 million during the decades before the ban. Today, whales are still threatened by various man-made dangers, such as fishing nets, ship strikes, and microplastic pollution in the ocean. It is important <u>ⓒ to recognize</u> that whales are valuable partners in our fight against the climate crisis and that <u>ⓓ protecting</u> them is an effective and cost-efficient way to address this global challenge.","stem":"다음 글의 밑줄 친 ⓐ~ⓓ 중 어법상 어색한 것을 고르시오.","det":{"korean":"고래의 수는 1986년에 상업적 목적의 포획이 공식적으로 금지될 때까지 급격히 감소했다. until절의 동사 was banned가 과거시제이므로, 주절도 과거시제 dropped이 자연스럽다. 과거완료 had dropped은 기준 과거 시점이 명시되어야 하는데, 여기서는 until 1986이 종료 시점을 나타내므로 단순과거가 적절하다.","analysis":"원문: The number of whales had dramatically dropped until killing them for commercial purposes was officially banned in 1986.","tip":"어법 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["ⓐ had dramatically dropped","ⓑ fell","ⓒ to recognize","ⓓ protecting"]},
{"id":4,"type":"어휘","diff":"쉬움","pts":4,"fmt":"mc","passage":"Over the past two centuries, human activities have generated a (A) [significant / insignificant] amount of carbon dioxide. This gas itself is not dangerous when we encounter it in everyday situations. However, excessive amounts of this gas in the atmosphere have contributed to the greenhouse effect, resulting in a (B) [gradual / sudden] increase in the Earth's surface temperature. To make matters worse, this increase has sped up in recent years and is seriously (C) [threatening / protecting] life on our planet.","stem":"다음 글의 괄호 (A), (B), (C) 안에서 문맥에 맞는 낱말로 가장 적절한 것을 고르시오.","det":{"korean":"상당한 양의 CO₂를 생성했다 / 점진적인 온도 상승을 초래하며 / 생명을 심각하게 위협하고 있다. (A) 인간 활동이 많은 CO₂를 만들었다는 맥락 → significant(상당한), (B) 온실효과로 인한 '점진적' 상승 → gradual, (C) 기후변화가 생명을 '위협'한다 → threatening.","analysis":"원문: have generated a significant amount of CO₂ / resulting in a gradual increase / seriously threatening life","tip":"어휘 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["(A) significant – (B) gradual – (C) threatening","(A) insignificant – (B) gradual – (C) threatening","(A) significant – (B) sudden – (C) threatening","(A) significant – (B) gradual – (C) protecting","(A) insignificant – (B) sudden – (C) protecting"]},
{"id":5,"type":"어휘","diff":"쉬움","pts":4,"fmt":"mc","passage":"Whales dive deep into the ocean to feed on prey such as krill and small fish, and they occasionally swim up to the surface to breathe. When they near the surface, they release an enormous amount of waste. This waste is rich in nutrients that are ① <u>essential</u> for creatures living in that area. Specifically, it creates the perfect growing conditions for some ② <u>microscopic</u> creatures floating at the surface of the ocean. These creatures, called phytoplankton, may look tiny and ③ <u>significant</u>, but when taken together, they play a ④ <u>significant</u> role in reducing CO₂. They absorb about 40% of the carbon in the atmosphere and produce about 50% of the atmosphere's oxygen through photosynthesis, a process that creates energy using carbon, water, and ⑤ <u>light</u>.","stem":"다음 글의 밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것을 고르시오.","det":{"korean":"아주 작고 하찮아 보일 수 있다. 원문은 insignificant(하찮은)인데 ③에서 significant(중요한)로 바뀌어 있다. 문맥상 '작고 하찮아 보이지만(but) 중요한 역할을 한다'는 역접 구조이므로, ③은 insignificant가 되어야 한다.","analysis":"원문: may look tiny and insignificant","tip":"어휘 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":2,"ch":["① essential","② microscopic","③ significant","④ significant","⑤ light"]},
{"id":6,"type":"어휘","diff":"보통","pts":5,"fmt":"mc","passage":"Whales spread nutrients in the ocean not only vertically but also ① <u>horizontally</u> through a process called the great whale conveyor belt. These giant mammals ② <u>migrate</u> over long distances at certain times of the year. For example, in the summer, humpback whales tend to stay near Alaska, where the water is cold but rich in nutrients. As winter approaches, they travel up to 4,800 kilometers to breed in the warm waters near Hawaii. Nutrients are relatively ③ <u>abundant</u> in warm waters, which makes it difficult for phytoplankton to survive. Fortunately, when the whales arrive in Hawaii after eating their fill in Alaska, they release a large amount of ④ <u>nutrient-rich</u> waste. These nutrients support the life of many marine animals and, importantly, ⑤ <u>encourage</u> the growth of phytoplankton even in warm waters.","stem":"다음 글의 밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것을 고르시오.","det":{"korean":"따뜻한 물에서는 영양분이 비교적 부족하다. 원문은 scarce(부족한)인데 ③에서 abundant(풍부한)로 바뀌어 있다. 따뜻한 물에서 영양분이 부족하기 때문에 식물성 플랑크톤이 살기 어렵다는 맥락이므로, abundant는 부적절하다.","analysis":"원문: Nutrients are relatively scarce in warm waters","tip":"어휘 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":2,"ch":["① horizontally","② migrate","③ abundant","④ nutrient-rich","⑤ encourage"]},
{"id":7,"type":"대의","diff":"보통","pts":5,"fmt":"mc","passage":"In addition to their direct absorption and burial of CO₂ through whale falls, whales also make a significant indirect contribution to reducing CO₂ through an act called a whale pump. This refers to the vertical movements of whales that help circulate nutrients across different depths of the ocean. When they near the surface, they release an enormous amount of waste rich in nutrients that are essential for creatures living in that area. These creatures, called phytoplankton, absorb about 40% of the carbon in the atmosphere and produce about 50% of the atmosphere's oxygen through photosynthesis.","stem":"다음 글의 주제로 가장 적절한 것을 고르시오.","det":{"korean":"고래는 고래 펌프라 불리는 행동을 통해 CO₂ 감소에 상당한 간접적 기여를 한다. 지문은 고래 펌프가 영양분을 순환시켜 식물성 플랑크톤의 성장을 돕고, 이것이 CO₂ 흡수로 이어진다는 내용이다.","analysis":"원문: whales also make a significant indirect contribution to reducing CO₂ through an act called a whale pump","tip":"대의 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["the role of whale pumps in reducing CO₂ through nutrient circulation","how whales absorb CO₂ directly from the atmosphere","the importance of phytoplankton in deep-sea ecosystems","various methods to protect endangered whale species","the harmful effects of CO₂ on marine life"]},
{"id":8,"type":"대의","diff":"보통","pts":5,"fmt":"mc","passage":"While many high-tech solutions such as carbon capture have been proposed, they are often too expensive to be used widely. Fortunately, there are also low-tech, economical, and even long-lasting solutions available. According to scientists, a single whale can absorb about 550 kilograms of CO₂ per year, while a tree can absorb only 22. Moreover, after they die, whales sink to the ocean floor with all the CO₂ they absorbed during their lives. Whale falls permanently bury about 145,000 tons of CO₂ under the sea every year. This achievement is basically what expensive carbon capture technologies aim to do.","stem":"다음 글의 제목으로 가장 적절한 것을 고르시오.","det":{"korean":"저비용이면서 오래 지속되는 해결책이 있다 / 이 성과는 기본적으로 비싼 탄소 포집 기술이 목표로 하는 것이다. 고비용 기술과 대비하여 고래가 경제적인 자연 기반 탄소 흡수원이라는 것이 핵심.","analysis":"원문: there are also low-tech, economical, and even long-lasting solutions available / This achievement is basically what expensive carbon capture technologies aim to do","tip":"대의 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["Whales: Nature's Cost-Effective Carbon Capture Solution","Why Carbon Capture Technology Is Failing","Trees vs. Whales: Which Absorbs More Oxygen?","The Mystery of Whale Falls in the Deep Sea","High-Tech Solutions for a Warmer Planet"]},
{"id":9,"type":"대의","diff":"보통","pts":5,"fmt":"mc","passage":"It is important to recognize that whales are valuable partners in our fight against the climate crisis and that protecting them is an effective and cost-efficient way to address this global challenge. Let's take action to help more whales live longer and healthier lives. Despite the important roles of whales in our environment, their lives are at serious risk. Today, whales are still threatened by various man-made dangers, such as fishing nets, ship strikes, and microplastic pollution in the ocean.","stem":"다음 글을 읽고 필자가 전달하고자 하는 시사점으로 가장 적절한 것을 고르시오.","det":{"korean":"고래를 보호하는 것은 이 전 지구적 과제를 해결하는 효과적이고 비용 효율적인 방법이다. 필자는 고래 보호가 기후 위기에 대한 실질적이고 경제적인 전략임을 강조하며 행동을 촉구하고 있다.","analysis":"원문: protecting them is an effective and cost-efficient way to address this global challenge","tip":"대의 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["Protecting whales is a practical and economical strategy for combating climate change.","The international ban on whaling in 1986 has completely solved the problem of declining whale populations.","Advanced technology is the only reliable solution for reducing atmospheric CO₂.","Climate change has minimal effects on marine ecosystems compared to land ecosystems.","Individual actions have little impact on global environmental issues."]},
{"id":10,"type":"일치","diff":"보통","pts":5,"fmt":"mc","passage":"Whales are amazing creatures. The largest blue whales can grow as long as 30 meters and weigh over 200 tons, and some whales have been known to live for more than 100 years. According to scientists, a single whale can absorb about 550 kilograms of CO₂ per year, while a tree can absorb only 22. Whale falls permanently bury about 145,000 tons of CO₂ under the sea every year. This achievement is basically what expensive carbon capture technologies aim to do—capture carbon and then store it underground.","stem":"다음 글의 내용과 일치하는 것을 고르시오.","det":{"korean":"한 마리 고래는 연간 약 550kg의 CO₂를 흡수할 수 있는 반면, 나무 한 그루는 22kg만 흡수할 수 있다. 550÷22=25로, 고래가 나무보다 약 25배 더 많은 CO₂를 흡수한다.","analysis":"원문: a single whale can absorb about 550 kilograms of CO₂ per year, while a tree can absorb only 22","tip":"일치 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["A single whale absorbs about 25 times more CO₂ per year than a tree.","Blue whales can grow up to 200 meters long.","No whale has ever been known to live beyond 50 years.","Trees absorb more CO₂ per year than whales do.","Whale falls release CO₂ back into the atmosphere."]},
{"id":11,"type":"불일치","diff":"보통","pts":5,"fmt":"mc","passage":"Whales spread nutrients in the ocean not only vertically but also horizontally through a process called the great whale conveyor belt. In the summer, humpback whales tend to stay near Alaska, where the water is cold but rich in nutrients and prey for them to feed on. As winter approaches, they travel up to 4,800 kilometers to breed in the warm waters near Hawaii. Nutrients are relatively scarce in warm waters, which makes it difficult for phytoplankton to survive. Fortunately, when the whales arrive in Hawaii after eating their fill in Alaska, they release a large amount of nutrient-rich waste.","stem":"다음 글의 내용과 일치하지 않는 것을 고르시오.","det":{"korean":"따뜻한 물에서는 영양분이 비교적 부족하다. ③번은 '하와이 근처 따뜻한 물은 연중 영양분이 풍부하다'라고 했는데, 원문에서는 영양분이 부족(scarce)하다고 했으므로 불일치한다.","analysis":"원문: Nutrients are relatively scarce in warm waters","tip":"불일치 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":2,"ch":["Humpback whales stay near Alaska during the summer.","Humpback whales travel up to 4,800 kilometers to breed.","Warm waters near Hawaii are rich in nutrients year-round.","The great whale conveyor belt moves nutrients horizontally.","Whales release nutrient-rich waste after eating their fill."]},
{"id":12,"type":"빈칸","diff":"보통","pts":5,"fmt":"mc","passage":"Whales dive deep into the ocean to feed on prey such as krill and small fish, and they occasionally swim up to the surface to breathe. When they near the surface, they release an enormous amount of waste. This waste is rich in nutrients that are essential for creatures living in that area. Specifically, it creates the perfect growing conditions for some microscopic creatures floating at the surface of the ocean. These creatures, called phytoplankton, absorb about 40% of the carbon in the atmosphere and produce about 50% of the atmosphere's oxygen. It is estimated that increasing the world's phytoplankton by 1% is equivalent to planting 2 billion new trees. In this way, whales indirectly contribute to reducing CO₂ by ________________.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.","det":{"korean":"이 배설물은 영양분이 풍부하며 식물성 플랑크톤의 완벽한 성장 조건을 만든다. 고래가 간접적으로 CO₂ 감소에 기여하는 방식은 '영양분을 제공하여 식물성 플랑크톤 성장을 돕는 것'이다.","analysis":"원문: This waste is rich in nutrients ... it creates the perfect growing conditions for ... phytoplankton","tip":"빈칸 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["providing nutrients that support phytoplankton growth","directly absorbing carbon dioxide from the air","migrating to warmer waters during winter","sinking to the ocean floor after death","consuming large amounts of krill and fish"]},
{"id":13,"type":"빈칸","diff":"보통","pts":5,"fmt":"mc","passage":"Whales spread nutrients in the ocean not only vertically but also horizontally through a process called the great whale conveyor belt. In the summer, humpback whales tend to stay near Alaska, where the water is cold but rich in nutrients. As winter approaches, they travel up to 4,800 kilometers to breed in the warm waters near Hawaii. Nutrients are relatively scarce in warm waters. Fortunately, when the whales arrive in Hawaii after eating their fill in Alaska, they release a large amount of nutrient-rich waste. This means that the great whale conveyor belt essentially ________________________________.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.","det":{"korean":"이 과정은 차가운 물에서 따뜻한 물로 영양분을 이동시키는 컨베이어 벨트로 생각할 수 있다. 고래가 알래스카(영양분 풍부한 찬 물)에서 먹고 하와이(영양분 부족한 따뜻한 물)로 이동하며 영양분을 운반하는 과정이다.","analysis":"원문: This process can be thought of as a conveyor belt that moves nutrients from cold waters to warm waters","tip":"빈칸 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["transports nutrients from nutrient-rich cold waters to nutrient-poor warm waters","prevents phytoplankton from growing in cold water regions","helps whales avoid predators during their long migration","increases the temperature of the ocean along migration routes","reduces the amount of oxygen available in tropical waters"]},
{"id":14,"type":"함축","diff":"보통","pts":5,"fmt":"mc","passage":"According to scientists, a single whale can absorb about 550 kilograms of CO₂ per year, while a tree can absorb only 22. Moreover, after they die, whales sink to the ocean floor with all the CO₂ they absorbed during their lives. Their bodies then become food and habitats for deep-sea creatures. This process is called a whale fall. Whale falls permanently bury about 145,000 tons of CO₂ under the sea every year. <u>This achievement is basically what expensive carbon capture technologies aim to do</u>—capture carbon and then store it underground.","stem":"다음 글의 밑줄 친 'This achievement is basically what expensive carbon capture technologies aim to do'가 의미하는 바로 가장 적절한 것을 고르시오.","det":{"korean":"이 성과는 기본적으로 비싼 탄소 포집 기술이 목표로 하는 것, 즉 탄소를 포집하여 지하에 저장하는 것이다. 고래 낙하(whale fall)가 자연적으로 비싼 기술과 같은 목표를 달성한다는 뜻이다.","analysis":"원문: This achievement is basically what expensive carbon capture technologies aim to do—capture carbon and then store it underground","tip":"함축 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["Whale falls naturally accomplish the same goal that costly carbon capture technologies pursue.","Carbon capture technology was inspired by the study of whale falls.","Whales are more expensive to protect than developing new carbon capture systems.","The CO₂ buried by whale falls will eventually be released back into the atmosphere.","Scientists have abandoned carbon capture technology in favor of whale conservation."]},
{"id":15,"type":"순서","diff":"보통","pts":5,"fmt":"mc","passage":"Whales dive deep into the ocean to feed on prey such as krill and small fish, and they occasionally swim up to the surface to breathe.\n\n(A) These creatures, called phytoplankton, may look tiny and insignificant, but when taken together, they play a significant role in reducing CO₂.\n(B) When they near the surface, they release an enormous amount of waste. This waste is rich in nutrients that are essential for creatures living in that area.\n(C) Specifically, it creates the perfect growing conditions for some microscopic creatures floating at the surface of the ocean.","stem":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.","det":{"korean":"주어진 문장: 고래가 먹이를 먹으려 깊이 잠수하고, 때때로 숨을 쉬기 위해 수면으로 올라온다.\n(B) 수면 가까이에서 엄청난 양의 배설물을 방출한다. 이 배설물은 영양분이 풍부하다.\n(C) 구체적으로, 해수면에 떠다니는 미세 생물의 완벽한 성장 조건을 만든다.\n(A) 이 생물을 식물성 플랑크톤이라 부르며, CO₂ 감소에 중요한 역할을 한다.\n→ B(배설물·영양분) → C(구체적으로: 미세 생물 성장 조건) → A(이 생물 = 식물성 플랑크톤의 역할)","analysis":"❌ ① (A)-(B)-(C)<br>❌ ② (A)-(C)-(B)<br>✅ ③ (B)-(C)-(A)<br>❌ ④ (B)-(A)-(C)<br>❌ ⑤ (C)-(A)-(B)","tip":"순서 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":2,"ch":["(A)-(B)-(C)","(A)-(C)-(B)","(B)-(C)-(A)","(B)-(A)-(C)","(C)-(A)-(B)"]},
{"id":16,"type":"무관","diff":"어려움","pts":6,"fmt":"mc","passage":"① Over the past two centuries, human activities have generated a significant amount of carbon dioxide. ② This gas itself is not dangerous when we encounter it in everyday situations. ③ However, excessive amounts of this gas in the atmosphere have contributed to the greenhouse effect. ④ Meanwhile, many deep-sea fish have developed bioluminescence to survive in complete darkness. ⑤ To make matters worse, this increase has sped up in recent years and is seriously threatening life on our planet.","stem":"다음 글에서 전체 흐름과 관계 없는 문장을 고르시오.","det":{"korean":"①~③, ⑤는 CO₂와 온실효과로 인한 기후 위기에 대한 내용이다. ④ '심해 물고기가 완전한 어둠 속에서 생존하기 위해 생물발광 능력을 발달시켰다'는 심해 생물의 특성에 관한 내용으로, CO₂·온실효과·기후변화와 무관하다.","analysis":"❌ ① ①<br>❌ ② ②<br>❌ ③ ③<br>✅ ④ ④<br>❌ ⑤ ⑤","tip":"무관 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":3,"ch":["시간 순서가 뒤바뀐 내용이다.","인물/장소가 혼동된 내용이다.","인과관계가 잘못된 내용이다.","④","글의 주제와 무관한 내용이다."]},
{"id":17,"type":"TF","diff":"어려움","pts":6,"fmt":"mc","passage":"These creatures, called phytoplankton, may look tiny and insignificant, but when taken together, they play a significant role in reducing CO₂. <u>They</u> absorb about 40% of the carbon in the atmosphere and produce about 50% of the atmosphere's oxygen. They do this through photosynthesis, a process that creates energy using carbon, water, and light.","stem":"다음 글의 밑줄 친 'They'가 가리키는 대상으로, 'phytoplankton(식물성 플랑크톤)'이면 T, 'whales(고래)'이면 F를 고르시오.","det":{"korean":"그것들은 대기 중 탄소의 약 40%를 흡수한다. 밑줄 친 They의 선행 문맥은 'These creatures, called phytoplankton'이며, 광합성(photosynthesis)을 통해 탄소를 흡수하는 주체는 식물성 플랑크톤이다.","analysis":"원문: They absorb about 40% of the carbon in the atmosphere","tip":"TF 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["T","False"]},
{"id":18,"type":"서술형","diff":"어려움","pts":6,"fmt":"written","passage":"According to scientists, a single whale can absorb about 550 kilograms of CO₂ per year. After they die, whales sink to the ocean floor with all the CO₂ they absorbed during their lives. Whale falls permanently bury about 145,000 tons of CO₂ under the sea every year. In addition, whales make a significant indirect contribution to reducing CO₂ through an act called a whale pump. This refers to the vertical movements of whales that help circulate nutrients across different depths of the ocean.","stem":"다음 글을 읽고, 주어진 조건에 맞게 빈칸을 완성하시오.\n\n[조건]\n1. 아래 보기에서 적절한 단어를 골라 사용할 것\n2. 필요시 형태를 변형할 것\n\n[보기] absorb / bury / nutrient / pump / capture\n\n→ Whales contribute to reducing CO₂ in two ways: first, whale falls permanently __________ CO₂ under the sea; second, whale __________ circulate __________(s) that support phytoplankton growth.","det":{"korean":"고래 낙하는 영구적으로 약 145,000톤의 CO₂를 매장한다 / 고래 펌프라 불리는 행동을 통해 / 영양분을 순환시킨다. 첫 번째 빈칸: bury(매장하다), 두 번째 빈칸: pumps(펌프), 세 번째 빈칸: nutrient(s)(영양분).","analysis":"원문: Whale falls permanently bury about 145,000 tons of CO₂ / through an act called a whale pump / circulate nutrients","tip":"서술형 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"wa":"bury, pumps, nutrient","accept":["bury, pumps, nutrient","bury, pumps, nutrients","bury , pumps , nutrient","bury , pumps , nutrients","bury pumps nutrient","bury pumps nutrients"]},
{"id":19,"type":"서술형","diff":"어려움","pts":6,"fmt":"written","passage":"These creatures, called phytoplankton, absorb about 40% of the carbon in the atmosphere and produce about 50% of the atmosphere's oxygen. It is estimated that increasing the world's phytoplankton by 1% is equivalent to planting 2 billion new trees.","stem":"다음 우리말과 같은 뜻이 되도록 주어진 조건에 맞게 영작하시오.\n\n[우리말] 세계의 식물성 플랑크톤을 1% 늘리는 것은 20억 그루의 새 나무를 심는 것과 같다고 추정된다.\n\n[조건]\n1. 아래 보기의 단어를 모두 사용할 것 (필요시 형태 변형 가능)\n2. 「It is estimated that ~」 구문으로 시작할 것\n\n[보기] increase / world / phytoplankton / 1% / equivalent / plant / 2 billion / new tree","det":{"korean":"세계의 식물성 플랑크톤을 1% 늘리는 것은 20억 그루의 새 나무를 심는 것과 같다고 추정된다.\n구문 분석: It(가주어) is estimated that(진주어절) increasing(동명사 주어) the world's phytoplankton by 1% is equivalent to planting(전치사 to + 동명사) 2 billion new trees.","analysis":"원문: It is estimated that increasing the world's phytoplankton by 1% is equivalent to planting 2 billion new trees.","tip":"서술형 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"wa":"It is estimated that increasing the world's phytoplankton by 1% is equivalent to planting 2 billion new trees.","accept":["It is estimated that increasing the world's phytoplankton by 1% is equivalent to planting 2 billion new trees.","It is estimated that increasing the world's phytoplankton by 1% is equivalent to planting 2 billion new trees","it is estimated that increasing the world's phytoplankton by 1% is equivalent to planting 2 billion new trees.","it is estimated that increasing the world's phytoplankton by 1% is equivalent to planting 2 billion new trees","It is estimated that increasing the world's phytoplankton by 1% is equivalent to planting two billion new trees.","It is estimated that increasing the world's phytoplankton by 1% is equivalent to planting two billion new trees"]},
{"id":20,"type":"서술형","diff":"어려움","pts":6,"fmt":"written","passage":"After they die, whales sink to the ocean floor with all the CO₂ they absorbed during their lives. Their bodies then become food and habitats for deep-sea creatures. This process is called a whale fall. Whale falls permanently bury about 145,000 tons of CO₂ under the sea every year. This achievement is basically what expensive carbon capture technologies aim to do.","stem":"다음 글의 괄호 안의 단어를 문맥에 맞는 형태로 바꾸어 쓰시오.\n\n→ Whale falls permanently bury about 145,000 tons of CO₂ under the sea every year. This achievement is basically what expensive carbon capture technologies aim (do).\n\n→ 정답: __________","det":{"korean":"비싼 탄소 포집 기술이 목표로 하는 것. aim to-v 구문에서 aim 뒤에 to 부정사가 와야 하므로 (do) → to do가 정답이다.","analysis":"원문: what expensive carbon capture technologies aim to do","tip":"서술형 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"wa":"to do","accept":["to do","to do."," to do"," to do."]}];

let S = { ans: [], cur: 0, ti: null, left: EI.time, start: 0 };

function getHistory() {
  try { return JSON.parse(localStorage.getItem(EI.histKey) || '[]'); }
  catch (e) { return []; }
}

function saveToHistory(r, elapsed) {
  const h = getHistory();
  h.unshift({
    name: document.getElementById('inpName').value.trim(),
    school: document.getElementById('inpSchool').value.trim(),
    grade: document.getElementById('inpGrade').value,
    score: r.score, total: EI.total,
    correct: r.correct, wrong: r.wrong, unanswered: r.unanswered,
    elapsed, date: new Date().toISOString(),
    level: getLevel(r.score).name,
    answers: S.ans.slice()
  });
  if (h.length > 20) h.length = 20;
  localStorage.setItem(EI.histKey, JSON.stringify(h));
}

function updateHCount() {
  const h = getHistory();
  document.getElementById('hCount').textContent = h.length;
}

  const p = document.getElementById('historyPanel');
  if (p.style.display === 'block') { p.style.display = 'none'; return; }
  const h = getHistory();
  if (!h.length) {
    p.innerHTML = '<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">\uc544\uc9c1 \uae30\ub85d\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.</p>';
    p.style.display = 'block'; return;
  }
  const mk = '\u2460\u2461\u2462\u2463\u2464';
  p.innerHTML = h.map(function (x, idx) {
    return '<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">' + (x.name || '\uc774\ub984\uc5c6\uc74c') + '</div><div class="hi-meta">' + new Date(x.date).toLocaleDateString('ko-KR') + ' \u00b7 ' + x.grade + ' \u00b7 ' + (x.level || '') + '</div></div><div class="hi-right"><div class="hi-score" style="color:' + (x.score >= 80 ? 'var(--p)' : 'var(--r)') + '">' + x.score + '<span style="font-size:11px;color:var(--tl)">/' + x.total + '</span></div></div>' + (x.answers ? '<button onclick="reviewHistory(' + idx + ')" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid var(--pborder);border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--p)">\ud83d\udcdd \uc815\ub2f5\u00b7\ud574\uc124 \ub2e4\uc2dc \ubcf4\uae30</button>' : '') + '</div>';

function shuffle(arr) {

    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;

  return arr;
}

    filtered = Q.map(function (q, i) { return { q: q, i: i }; }).filter(function (f) { return secs.includes(f.q.sec); });
    S = { ans: Array(filtered.length).fill(null), cur: 0, ti: null, left: EI.time, start: Date.now(), order: shuffle([].concat(Array(filtered.length).keys ? Array.from({ length: filtered.length }, function (_, i) { return i; }) : [])), filtered: filtered.map(function (f) { return f.i; }), secs: secs };
    EI._origTotalQ = EI.totalQ; EI._origTotal = EI.total;

function selectAns(idx, ci) {

function updateProgress() {
  var answered = S.ans.filter(function (a) { return a !== null; }).length;

function initSwipe() {
  var startX = 0, startY = 0;
  var el = document.getElementById('slideWrap');
  el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0 && S.cur < EI.totalQ - 1) navQ(1);
      if (dx > 0 && S.cur > 0) navQ(-1);
    }
  }, { passive: true });
}

function submitExam() {
  if (!confirm('\uc81c\ucd9c\ud558\uc2dc\uaca0\uc2b5\ub2c8\uae4c?')) return;
  clearInterval(S.ti);
  var elapsed = Math.floor((Date.now() - S.start) / 1000);
  var r = grade();
  saveToHistory(r, elapsed);
  renderResults(r, elapsed);
  showScreen('resultScreen');
  window.scrollTo(0, 0);
}

function grade() {
  var score = 0, correct = 0, wrong = 0, unanswered = 0;
  var details = [];
  var qs = S.filtered ? S.filtered.map(function (i) { return Q[i]; }) : Q;
  qs.forEach(function (q, i) {
    var a = S.ans[i];
    var ok = false;
    if (a === null) unanswered++;
    else if (q.fmt === 'mc') ok = a === q.ans;
    else {
      var u = String(a).trim().toLowerCase();
      if (q.accept) ok = q.accept.some(function (x) { return u === x.toLowerCase(); });
      if (!ok && q.wa) ok = u === q.wa.toLowerCase();
    }
    if (a !== null) { if (ok) { correct++; score += q.pts; } else wrong++; }
    details.push({ q: q, ans: a, ok: ok });
  });
  return { score: score, correct: correct, wrong: wrong, unanswered: unanswered, details: details };
}

  }
  txt += '\n\n\ud83d\udcca \ub0b4\uc2e0\ud56b | \ub0b4\uc2e0 \uc601\uc5b4 \uc644\ubcbd \ub300\ube44';
  navigator.clipboard.writeText(txt).then(function () { toast('\ud83d\udccb \uacb0\uacfc\uac00 \ubcf5\uc0ac\ub418\uc5c8\uc2b5\ub2c8\ub2e4!'); }).catch(function () { toast('\ubcf5\uc0ac \uc2e4\ud328'); });
}

function shareImage() {
  var tn = getTestName(), wk = getWeakTypes(), r = grade(), lv = getLevel(r.score);
  var pct = Math.round(r.score / EI.total * 100), pass = r.score >= 80;
  var nm = document.getElementById('inpName').value.trim();
  var tm = {};
  r.details.forEach(function (d) {
    var t = d.q.type;
    if (!tm[t]) tm[t] = { total: 0, ok: 0 };
    tm[t].total++;
    if (d.ok) tm[t].ok++;
  });
  var pc = pass ? '#16A34A' : '#D63B3B';
  var card = '<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">';
  card += '<div style="background:linear-gradient(135deg,' + (pass ? '#E8F5E9,#C8E6C9' : '#FFF0F0,#FFEAEA') + ');padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:' + pc + ';margin-bottom:4px">\ub0b4\uc2e0\ud56b ' + tn + '</div><div style="font-size:13px;color:#666;margin-bottom:16px">' + EI.subject + ' \u00b7 ' + EI.pub + '</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">' + r.score + '<span style="font-size:20px;color:#aaa">/' + EI.total + '</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:' + pc + ';color:#fff">' + lv.icon + ' ' + lv.name + ' \u00b7 ' + (pass ? '\ud1b5\uacfc' : '\ubbf8\ud1b5\uacfc') + '</span></div><div style="margin-top:12px;font-size:12px;color:#888">\ud83d\udc64 ' + nm + ' \u00b7 \u2705' + r.correct + ' \u274c' + r.wrong + ' \u2b1c' + r.unanswered + '</div></div>';
  if (wk.length) {
    card += '<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">\ud83d\udd0d \ub0b4\uc2e0\ud56b \uc57d\uc810 \uc9c4\ub2e8</div>';
    Object.entries(tm).forEach(function (entry) {
      var type = entry[0], d = entry[1];
      var p = Math.round(d.ok / d.total * 100);
      var c = p === 100 ? '#16A34A' : p >= 50 ? '#F59E0B' : '#D63B3B';
      card += '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">' + type.replace(/\(.+?\)/g, '').trim() + '</span><span style="font-weight:800;color:' + c + '">' + d.ok + '/' + d.total + '</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:' + p + '%;background:' + c + ';border-radius:3px"></div></div></div>';
    });
    card += '</div>';
  }
  card += '<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">\ud83d\udcca <b style="color:#333">\ub0b4\uc2e0\ud56b</b> | \ub0b4\uc2e0 \uc601\uc5b4 \uc644\ubcbd \ub300\ube44</div></div>';
  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-9999px;top:0;';
  wrap.innerHTML = card;
  document.body.appendChild(wrap);
  html2canvas(wrap.firstChild, { scale: 2, backgroundColor: null, useCORS: true }).then(function (canvas) {
    document.body.removeChild(wrap);
    canvas.toBlob(function (blob) {
      if (navigator.share && blob) {
        var file = new File([blob], '\ub0b4\uc2e0\ud56b_' + tn + '_\uacb0\uacfc.png', { type: 'image/png' });
        navigator.share({ files: [file], title: '\ub0b4\uc2e0\ud56b ' + tn + ' \uacb0\uacfc' }).catch(function () {});
      } else {
        var a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = '\ub0b4\uc2e0\ud56b_' + tn + '_\uacb0\uacfc.png';
        a.click();
      }
      toast('\ud83d\udcf8 \uacb0\uacfc \uc774\ubbf8\uc9c0\uac00 \uc800\uc7a5\ub418\uc5c8\uc2b5\ub2c8\ub2e4!');
    });
  }).catch(function () { toast('\uc774\ubbf8\uc9c0 \uc0dd\uc131 \uc2e4\ud328'); });
}

function reviewHistory(idx) {
  var h = getHistory();
  var rec = h[idx];
  if (!rec || !rec.answers) return toast('\uc774\uc804 \ubc84\uc804 \uae30\ub85d\uc740 \ud574\uc124\uc744 \ubcfc \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.');
  S.ans = rec.answers;
  S.start = Date.now() - rec.elapsed * 1000;
  document.getElementById('inpName').value = rec.name || '';
  document.getElementById('inpSchool').value = rec.school || '';
  document.getElementById('inpGrade').value = rec.grade || '\uace01';
  var r = grade();
  renderResults(r, rec.elapsed);
  showScreen('resultScreen');
  window.scrollTo(0, 0);
}

function retake() { location.reload(); }
function goHome() { showScreen('startScreen'); updateHCount(); }

window.addEventListener('beforeunload', function (e) {
  if (S.ti) { e.preventDefault(); e.returnValue = ''; }
});

updateHCount();
</script>
