<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영어1 YBM(박준언) 온라인단어TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* NaesinFit — Green Theme (단어테스트) */
:root{
  --p:#16A34A;--pd:#14532D;--pl:#E8F5E9;--pxl:#F0FDF4;--pxxl:#F8FDF9;
  --bg:#F4F8F5;--text:#1A1A2E;--tm:#5A6A5E;--tl:#8A9A8E;
  --r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;
  --o:#F59E0B;--ol:#FFF8E1;
  --card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);
  --radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;
  --pborder:#dde8df;--pbg-muted:#f0f5f1;
  --passage-bg:linear-gradient(135deg,#FAFDFB,#F5FAF6);
  --start-grad:linear-gradient(160deg,#F0FDF4,#E8F5E9 40%,#DCFCE7);
  --accent2:#0D9488;
  --p-rgba-08:rgba(22,163,74,.08);
  --p-rgba-10:rgba(22,163,74,.1);
  --p-rgba-12:rgba(22,163,74,.12);
  --p-rgba-25:rgba(22,163,74,.25);
  --p-rgba-30:rgba(22,163,74,.3);
}

/* NaesinFit Test Engine — Common CSS (theme-agnostic)
   Theme-specific colors come from :root variables defined in theme-*.css:
   --p      : primary color
   --pd     : primary dark
   --pl     : primary light
   --pxl    : primary extra-light
   --pxxl   : primary xx-light
   --bg     : page background
   --text   : main text
   --tm     : text muted
   --tl     : text light
   --pborder: border color (theme-tinted)
   --pbg-muted: muted bg for tracks/bars
   --start-grad: startScreen gradient
   --accent2: secondary gradient stop (badge/header)
   --p-rgba-08: rgba for selected bg
   --p-rgba-12: rgba for box-shadow
   --p-rgba-10: rgba for focus ring
   --p-rgba-25: rgba for button shadow
   --p-rgba-30: rgba for selectPulse
*/

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Start Screen */
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:var(--start-grad);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--p),var(--accent2));color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--p),var(--accent2));padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid var(--pborder);}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid var(--pborder);border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid var(--pborder);border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-rgba-10);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;box-shadow:0 6px 20px var(--p-rgba-30);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid var(--pborder);color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--p);color:var(--p);}
.history-badge{background:var(--pxl);color:var(--p);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid var(--pborder);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--p);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}

/* Exam Screen */
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--p);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--p);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--p);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--accent2));transition:width .5s ease;border-radius:0 2px 2px 0;}

/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--pxl),var(--pl));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--pd);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:10px 14px 14px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
.slide-choices{display:flex;flex-direction:column;gap:3px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12px;line-height:1.3;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--p);background:var(--p-rgba-08);box-shadow:0 0 0 3px var(--p-rgba-12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 var(--p-rgba-30)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:20px;height:20px;font-size:10px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--p-rgba-10);}
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;box-shadow:0 2px 8px var(--p-rgba-25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--p);}
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--p);background:var(--pxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}

/* Type tags — same across all themes */
.tag-combo{background:#E8F5E9;color:#166534;}.tag-wrong{background:#FFF0F0;color:#D63B3B;}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:#EDF2FF;color:#3B6FD9;}.tag-ant{background:#FFF8E1;color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}.tag-insert{background:#E3F2FD;color:#1565C0;}.tag-order{background:#FFF8E1;color:#F57F17;}

.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:var(--pbg-muted);padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--p);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:var(--passage-bg);border-left:3px solid var(--p);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--pborder);border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--p);}.choice-btn.selected{border-color:var(--p);box-shadow:0 0 0 2px var(--p-rgba-12);background:var(--pxxl);}
.c-num{min-width:22px;height:22px;background:var(--pbg-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid var(--pborder);border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--p);}

/* Result Screen */
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--pxl),var(--pl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:var(--pbg-muted);border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--pl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--pxxl);border-radius:var(--rs);border:1px solid var(--pborder);}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--pxl);}.info-cell.highlight .ic-value{color:var(--p);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:var(--pbg-muted);border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--pl);color:var(--p);}.tag-item.weak{background:#FFF0F0;color:#D63B3B;}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--pxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid var(--pborder);border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--p);color:var(--p);}.act-btn.primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid var(--pborder);border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--pxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--pxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--pl);color:var(--p);}.expl-tag.tip{background:var(--pxl);color:var(--pd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--p);}.expl-box.tip-b{border-left:3px solid var(--p);background:var(--pxl);}

@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">온라인단어 TEST</div>
  <h1 class="start-title">온라인단어 <span>TEST</span></h1>
  <p class="start-subtitle">영어1 · YBM(박준언) · 1과 · 20문항</p>
  <div class="info-card"><div class="info-card-header">시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">영어1</span></div>
    <div class="info-row"><span class="info-label">문항</span><span class="info-value">YBM(박준언) (1과)</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">Universal Design for Everyone</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">20문항</div><div class="chip">20분</div><div class="chip">80점 이상 통과</div><div class="chip">100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="startExam()">시험 시작하기</button>
  <button class="btn btn-outline" onclick="toggleHistory()">시험 기록 보기 <span class="history-badge" id="hCount">0</span></button>
  <div id="historyPanel"></div>
</div>
</div>

<div id="examScreen" class="screen">
  <div class="exam-topbar"><div class="topbar-left"><div class="topbar-dot"></div><div class="topbar-info">영어1 · <span>YBM(박준언)</span></div></div><div class="timer" id="timer">20:00</div><button class="btn-submit" onclick="submitExam()">제출하기</button></div>
  <div class="exam-progress"><div class="exam-progress-fill" id="progressFill"></div></div>
  <div class="ans-count" id="ansCount">0/20</div>
  <div class="exam-scroll" id="examScroll"></div>
  <div class="slide-wrap" id="slideWrap">
    <div class="slide-passage" id="slidePassage"></div>
    <div class="slide-bottom" id="slideBottom"></div>

const FULL_PASSAGE="Did you know that one out of every ten people in the world is left-handed? They face challenges in a society designed for right-handed individuals. It is inconvenient for them to use some right-handed products such as scissors, cameras, and computer mice. The world we live in is designed to be an environment suitable for what is considered \"normal\" for the majority of people, and it is filled with objects that are easy for them to use. Thus, those who do not belong to that category have no choice but to live with discomfort. In other words, a minority of people with physical differences, such as the left-handed, the disabled, and the elderly, either endure inconvenience or deliberately seek objects designed especially for them, which are often difficult to find.\n\nIs it impossible to build an environment where everyone can use products and facilities conveniently and without limitations? It was Ronald Mace who sought the answer to this question. He contracted polio at the age of nine and spent the rest of his life in a wheelchair. When studying architecture at university, he struggled to access some campus facilities due to inaccessible building designs. This experience later inspired him to invent the term universal design, which refers to design for all. As an architect and product designer, he pursued a world in which all products and environments were designed to be artistic and usable to the greatest extent possible by everyone, regardless of their age, size, disability, nationality, or language.\n\nAccording to the principles of universal design, the design must be able to be used equitably, flexibly, simply, and intuitively by a wide variety of people. In addition, it should be cognitively accessible and minimize users' physical efforts. Finally, it requires the providing of sufficient space for all users while reducing potential hazards and adverse consequences from accidental or unintended actions. A key feature of universal design is that this is not a special requirement only for the benefit of a minority of the population. If an environment is accessible, usable, convenient, and a pleasure to use, everyone in the community benefits.\n\nHow has universal design been incorporated into modern architecture? One of the most representative examples of universal design being used to improve accessibility is the ramps installed in front of buildings. Ramps, not stairs, are necessary for people with disabilities who use wheelchairs, and they are also beneficial for parents pushing strollers and the elderly.\n\nAnother example is automatic doors. They are invaluable for those who rely on assistive devices such as wheelchairs and crutches. They also provide convenience for adults who have their hands full and children who are not tall enough to open the doors themselves. A further example is tactile paving. These textured surfaces, often found on sidewalks, steps, and crosswalks, assist visually impaired individuals by guiding them through urban spaces.\n\nUniversal design is not only applied in modern architecture but also extends to transportation systems. For instance, buses have been designed with a floor closer to ground level to ease access for all passengers. Handles of various lengths are provided, another method by which universal design is implemented to accommodate passengers' different heights. Subway maps have also been designed for color-blind individuals to clearly distinguish between subway lines by adjusting the color and the brightness and by varying the thickness of lines that have similar colors. Additionally, the use of pictograms can be seen frequently. Signs indicating the locations of subway or train stations assist international travelers who may not be familiar with the local language. Likewise, road signs indicating school zones, speed limits, and directions for turns and stops aid drivers in recognizing important information more easily.\n\nWhile universal design has been utilized in architecture and transportation systems for some time, a newer application is in the fashion industry. Clothing designed with universal design integrates stretchable and breathable materials, enhancing comfort and mobility. Other features include the use of magnets and Velcro in place of buttons, making it easier to put on and take off clothing. It also incorporates traits like stretchy waistbands and adjustable sleeves to allow individuals with disabilities to dress independently. This type of clothing is also beneficial for pregnant women, older adults who may experience mobility issues, and individuals with temporary injuries or medical conditions. Overall, universal design clothing promotes increased comfort, convenience, independence, and improved mobility and flexibility for wearers of all abilities.\n\nYou may find it surprising that universal design can be found in more parts of society than you thought. However, enough has not been done to accommodate everyone yet. Universal design should be implemented more extensively to promote full participation in the community for a wider range of people. It is time to build more equitable environments that are accessible to everyone. So are you on board to create a universally designed world for all?\n\nInclusive Language for Equality and Diversity\n\nHave you heard, \"Hello, guys; let's get started,\" at the beginning of a meeting? Could that make some feel less included? Inclusive language is a respectful way of communication by selecting words that avoid bias, prejudice, and discrimination. Saying, \"Hello, everyone,\" instead of, \"Hello, guys,\" demonstrates inclusivity, reduces potential barriers, and enhances everyone's sense of belonging.\n\nInclusive language promotes equality, respect, and diversity, inviting all people to participate in society. For example, replacing conventional terms with racial implications like \"blacklist\" and \"whitelist\" with neutral alternatives such as \"deny list\" and \"allow list\" enhances inclusivity. Similarly, using gender-neutral terms like \"parent\" and \"guardian\" instead of \"mom\" and \"dad\" helps break down biases and acknowledges diverse family structures. Moreover, it is crucial to be aware of everyday phrases that could be considered insensitive toward individuals with medical conditions. For instance, using \"missed opportunity\" instead of \"blind spot\" or \"ridiculous\" rather than \"crazy\" demonstrates more thoughtful communication.\n\nAs society becomes more inclusive, so must our language. It is essential to stay updated and to use appropriate language for our times. By being mindful of the words we use, we can create a more welcoming environment for everyone.";

{"id":4,"type":"문맥상 부적절한 어휘","diff":"쉬움","pts":4,"fmt":"mc","passage":"Did you know that one out of every ten people in the world is left-handed? They face challenges in a society designed for right-handed individuals. It is inconvenient for them to use some right-handed products such as scissors, cameras, and computer mice. The world we live in is designed to be an environment suitable for what is considered \"normal\" for the majority of people, and it is filled with objects that are easy for them to use. Thus, those who do not belong to that category have no choice but to live with discomfort. In other words, a minority of people with physical differences, such as the left-handed, the disabled, and the elderly, either endure inconvenience or deliberately seek objects designed especially for them, which are often difficult to find.\n\nIs it impossible to build an environment where everyone can use products and facilities conveniently and without limitations? It was Ronald Mace who sought the answer to this question. He contracted polio at the age of nine and spent the rest of his life in a wheelchair. When studying architecture at university, he struggled to access some campus facilities due to inaccessible building designs. This experience later inspired him to invent the term universal design, which refers to design for all. As an architect and product designer, he pursued a world in which all products and environments were designed to be artistic and usable to the greatest extent possible by everyone, regardless of their age, size, disability, nationality, or language.\n\nAccording to the principles of universal design, the design must be able to be used equitably, flexibly, simply, and intuitively by a wide variety of people. In addition, it should be cognitively accessible and minimize users' physical efforts. Finally, it requires the providing of sufficient space for all users while reducing potential hazards and adverse consequences from accidental or unintended actions. A key feature of universal design is that this is not a special requirement only for the benefit of a minority of the population. If an environment is accessible, usable, convenient, and a pleasure to use, everyone in the community benefits.\n\nHow has universal design been ①<u>incorporated</u> into modern architecture? One of the most ②<u>representative</u> examples of universal design being used to improve accessibility is the ramps ③<u>installed</u> in front of buildings. Ramps, not stairs, are necessary for people with disabilities who use wheelchairs, and they are also ④<u>beneficial</u> for parents pushing strollers and the ⑤<u>young</u>.\n\nAnother example is automatic doors. They are invaluable for those who rely on assistive devices such as wheelchairs and crutches. They also provide convenience for adults who have their hands full and children who are not tall enough to open the doors themselves. A further example is tactile paving. These textured surfaces, often found on sidewalks, steps, and crosswalks, assist visually impaired individuals by guiding them through urban spaces.\n\nUniversal design is not only applied in modern architecture but also extends to transportation systems. For instance, buses have been designed with a floor closer to ground level to ease access for all passengers. Handles of various lengths are provided, another method by which universal design is implemented to accommodate passengers' different heights. Subway maps have also been designed for color-blind individuals to clearly distinguish between subway lines by adjusting the color and the brightness and by varying the thickness of lines that have similar colors. Additionally, the use of pictograms can be seen frequently. Signs indicating the locations of subway or train stations assist international travelers who may not be familiar with the local language. Likewise, road signs indicating school zones, speed limits, and directions for turns and stops aid drivers in recognizing important information more easily.\n\nWhile universal design has been utilized in architecture and transportation systems for some time, a newer application is in the fashion industry. Clothing designed with universal design integrates stretchable and breathable materials, enhancing comfort and mobility. Other features include the use of magnets and Velcro in place of buttons, making it easier to put on and take off clothing. It also incorporates traits like stretchy waistbands and adjustable sleeves to allow individuals with disabilities to dress independently. This type of clothing is also beneficial for pregnant women, older adults who may experience mobility issues, and individuals with temporary injuries or medical conditions. Overall, universal design clothing promotes increased comfort, convenience, independence, and improved mobility and flexibility for wearers of all abilities.\n\nYou may find it surprising that universal design can be found in more parts of society than you thought. However, enough has not been done to accommodate everyone yet. Universal design should be implemented more extensively to promote full participation in the community for a wider range of people. It is time to build more equitable environments that are accessible to everyone. So are you on board to create a universally designed world for all?\n\nInclusive Language for Equality and Diversity\n\nHave you heard, \"Hello, guys; let's get started,\" at the beginning of a meeting? Could that make some feel less included? Inclusive language is a respectful way of communication by selecting words that avoid bias, prejudice, and discrimination. Saying, \"Hello, everyone,\" instead of, \"Hello, guys,\" demonstrates inclusivity, reduces potential barriers, and enhances everyone's sense of belonging.\n\nInclusive language promotes equality, respect, and diversity, inviting all people to participate in society. For example, replacing conventional terms with racial implications like \"blacklist\" and \"whitelist\" with neutral alternatives such as \"deny list\" and \"allow list\" enhances inclusivity. Similarly, using gender-neutral terms like \"parent\" and \"guardian\" instead of \"mom\" and \"dad\" helps break down biases and acknowledges diverse family structures. Moreover, it is crucial to be aware of everyday phrases that could be considered insensitive toward individuals with medical conditions. For instance, using \"missed opportunity\" instead of \"blind spot\" or \"ridiculous\" rather than \"crazy\" demonstrates more thoughtful communication.\n\nAs society becomes more inclusive, so must our language. It is essential to stay updated and to use appropriate language for our times. By being mindful of the words we use, we can create a more welcoming environment for everyone.","stem":"다음 글의 밑줄 친 낱말 중, 문맥상 낱말의 쓰임이 <b>적절하지 않은</b> 것은?","det":{"korean":"유니버설 디자인은 현대 건축에 ①<b>통합</b>되었다. 가장 ②<b>대표적인</b> 예시는 건물 앞에 ③<b>설치된</b> 경사로이다. 경사로는 휠체어 사용자에게 필요하며, 유모차를 미는 부모와 ⑤<b>노인(→young은 부적절)</b>에게도 ④<b>유익하다</b>.","analysis":"✅ ① incorporated(통합된): 적절 ✅ ② representative(대표적인): 적절 ✅ ③ installed(설치된): 적절 ✅ ④ beneficial(유익한): 적절<br>❌ ⑤ young(젊은) → 원문은 <b>elderly(노인)</b>. 휠체어 경사로가 필요한 대상은 노인이므로 young은 부적절","tip":"elderly(노인) ↔ young(젊은). 문맥상 경사로의 수혜자를 생각하면 쉽게 판별할 수 있습니다."},"ans":2,"ch":["incorporated","representative","young","installed"]},

th neutral alternatives such as \"deny list\" and \"allow list\" enhances inclusivity. Similarly, using gender-neutral terms like \"parent\" and \"guardian\" instead of \"mom\" and \"dad\" helps break down biases and acknowledges diverse family structures. Moreover, it is crucial to be aware of everyday phrases that could be considered insensitive toward individuals with medical conditions. For instance, using \"missed opportunity\" instead of \"blind spot\" or \"ridiculous\" rather than \"crazy\" demonstrates more thoughtful communication.\n\nAs society becomes more inclusive, so must our language. It is essential to stay updated and to use appropriate language for our times. By being mindful of the words we use, we can create a more welcoming environment for everyone.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"지하철 노선도는 색맹인 사람들이 노선을 명확히 구별할 수 있도록 설계되었다. 또한 <b>픽토그램</b>의 사용이 자주 볼 수 있다. 역 위치를 나타내는 표지판은 현지 언어에 익숙하지 않은 국제 여행자를 돕는다.","analysis":"✅ ② pictograms(픽토그램/그림문자): 표지판, 국제 여행자 보조라는 문맥에 적합<br>❌ ① barriers(장벽): 문맥과 무관<br>❌ ③ strollers(유모차): 교통 표지 문맥에 부적절<br>❌ ④ magnets(자석): 의류 관련 어휘로 문맥에 맞지 않음<br>❌ ⑤ crutches(목발): 교통 안내 문맥에 맞지 않음","tip":"pictogram(픽토그램)은 언어 장벽을 넘어 정보를 전달하는 그림 기호입니다. 유니버설 디자인의 핵심 사례!"},"ans":1,"ch":["barriers","pictograms","strollers","magnets"]},
{"id":8,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","passage":"Did you know that one out of every ten people in the world is left-handed? They face challenges in a society designed for right-handed individuals. It is inconvenient for them to use some right-handed products such as scissors, cameras, and computer mice. The world we live in is designed to be an environment suitable for what is considered \"normal\" for the majority of people, and it is filled with objects that are easy for them to use. Thus, those who do not belong to that category have no choice but to live with discomfort. In other words, a minority of people with physical differences, such as the left-handed, the disabled, and the elderly, either endure inconvenience or deliberately seek objects designed especially for them, which are often difficult to find.\n\nIs it impossible to build an environment where everyone can use products and facilities conveniently and without limitations? It was Ronald Mace who sought the answer to this question. He contracted polio at the age of nine and spent the rest of his life in a wheelchair. When studying architecture at university, he struggled to access some campus facilities due to inaccessible building designs. This experience later inspired him to invent the term universal design, which refers to design for all. As an architect and product designer, he pursued a world in which all products and environments were designed to be artistic and usable to the greatest extent possible by everyone, regardless of their age, size, disability, nationality, or language.\n\nAccording to the principles of universal design, the design must be able to be used equitably, flexibly, simply, and intuitively by a wide variety of people. In addition, it should be cognitively accessible and minimize users' physical efforts. Finally, it requires the providing of sufficient space for all users while reducing potential __________ and adverse consequences from accidental or unintended actions. A key feature of universal design is that this is not a special requirement only for the benefit of a minority of the population. If an environment is accessible, usable, convenient, and a pleasure to use, everyone in the community benefits.\n\nHow has universal design been incorporated into modern architecture? One of the most representative examples of universal design being used to improve accessibility is the ramps installed in front of buildings. Ramps, not stairs, are necessary for people with disabilities who use wheelchairs, and they are also beneficial for parents pushing strollers and the elderly.\n\nAnother example is automatic doors. They are invaluable for those who rely on assistive devices such as wheelchairs and crutches. They also provide convenience for adults who have their hands full and children who are not tall enough to open the doors themselves. A further example is tactile paving. These textured surfaces, often found on sidewalks, steps, and crosswalks, assist visually impaired individuals by guiding them through urban spaces.\n\nUniversal design is not only applied in modern architecture but also extends to transportation systems. For instance, buses have been designed with a floor closer to ground level to ease access for all passengers. Handles of various lengths are provided, another method by which universal design is implemented to accommodate passengers' different heights. Subway maps have also been designed for color-blind individuals to clearly distinguish between subway lines by adjusting the color and the brightness and by varying the thickness of lines that have similar colors. Additionally, the use of pictograms can be seen frequently. Signs indicating the locations of subway or train stations assist international travelers who may not be familiar with the local language. Likewise, road signs indicating school zones, speed limits, and directions for turns and stops aid drivers in recognizing important information more easily.\n\nWhile universal design has been utilized in architecture and transportation systems for some time, a newer application is in the fashion industry. Clothing designed with universal design integrates stretchable and breathable materials, enhancing comfort and mobility. Other features include the use of magnets and Velcro in place of buttons, making it easier to put on and take off clothing. It also incorporates traits like stretchy waistbands and adjustable sleeves to allow individuals with disabilities to dress independently. This type of clothing is also beneficial for pregnant women, older adults who may experience mobility issues, and individuals with temporary injuries or medical conditions. Overall, universal design clothing promotes increased comfort, convenience, independence, and improved mobility and flexibility for wearers of all abilities.\n\nYou may find it surprising that universal design can be found in more parts of society than you thought. However, enough has not been done to accommodate everyone yet. Universal design should be implemented more extensively to promote full participation in the community for a wider range of people. It is time to build more equitable environments that are accessible to everyone. So are you on board to create a universally designed world for all?\n\nInclusive Language for Equality and Diversity\n\nHave you heard, \"Hello, guys; let's get started,\" at the beginning of a meeting? Could that make some feel less included? Inclusive language is a respectful way of communication by selecting words that avoid bias, prejudice, and discrimination. Saying, \"Hello, everyone,\" instead of, \"Hello, guys,\" demonstrates inclusivity, reduces potential barriers, and enhances everyone's sense of belonging.\n\nInclusive language promotes equality, respect, and diversity, inviting all people to participate in society. For example, replacing conventional terms with racial implications like \"blacklist\" and \"whitelist\" with neutral alternatives such as \"deny list\" and \"allow list\" enhances inclusivity. Similarly, using gender-neutral terms like \"parent\" and \"guardian\" instead of \"mom\" and \"dad\" helps break down biases and acknowledges diverse family structures. Moreover, it is crucial to be aware of everyday phrases that could be considered insensitive toward individuals with medical conditions. For instance, using \"missed opportunity\" instead of \"blind spot\" or \"ridiculous\" rather than \"crazy\" demonstrates more thoughtful communication.\n\nAs society becomes more inclusive, so must our language. It is essential to stay updated and to use appropriate language for our times. By being mindful of the words we use, we can create a more welcoming environment for everyone.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"유니버설 디자인의 원칙에 따르면 잠재적 <b>위험</b>과 부정적 결과를 줄이면서 충분한 공간을 제공해야 한다.","analysis":"✅ ① hazards(위험 요소): reducing potential __과 adverse consequences라는 문맥에서 부정적 요소가 와야 함<br>❌ ② benefits(이점): 줄여야 할 대상으로 부적절<br>❌ ③ designs(디자인): 문맥상 의미가 통하지 않음<br>❌ ④ features(특징): 줄여야 할 대상이 아님<br>❌ ⑤ principles(원칙): 줄여야 할 대상이 아님","tip":"hazard(위험 요소)는 adverse(불리한, 부정적인)와 함께 쓰여 '위험과 부정적 결과'를 이룹니다. potential hazards는 빈출 표현!"},"ans":0,"ch":["hazards","benefits","designs","features"]},

h neutral alternatives such as \"deny list\" and \"allow list\" enhances inclusivity. Similarly, using gender-neutral terms like \"parent\" and \"guardian\" instead of \"mom\" and \"dad\" helps break down biases and acknowledges diverse family structures. Moreover, it is crucial to be aware of everyday phrases that could be considered insensitive toward individuals with medical conditions. For instance, using \"missed opportunity\" instead of \"blind spot\" or \"ridiculous\" rather than \"crazy\" demonstrates more thoughtful communication.\n\nAs society becomes more inclusive, so must our language. It is essential to stay updated and to use appropriate language for our times. By being mindful of the words we use, we can create a more welcoming environment for everyone.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"유니버설 디자인은 더 넓은 범위의 사람들을 위해 지역사회에서의 완전한 참여를 촉진하기 위해 더 <b>광범위하게</b> 실행되어야 한다.","analysis":"✅ ④ extensively(광범위하게): 더 넓은 범위의 사람들을 위한 완전한 참여라는 문맥에 적합<br>❌ ① cautiously(신중하게): 확대 적용을 주장하는 문맥에 부적절<br>❌ ② reluctantly(마지못해): 적극적 실행을 권하는 문맥에 반대<br>❌ ③ sparingly(아껴서): 더 많은 적용을 주장하는 문맥에 반대<br>❌ ⑤ temporarily(일시적으로): 지속적 실행을 의미하는 문맥에 부적절","tip":"extensively(광범위하게) = widely = broadly. implement extensively = 광범위하게 시행하다."},"ans":3,"ch":["cautiously","reluctantly","sparingly","extensively"]},

st\" with neutral alternatives such as \"deny list\" and \"allow list\" enhances inclusivity. Similarly, using gender-neutral terms like \"parent\" and \"guardian\" instead of \"mom\" and \"dad\" helps break down biases and acknowledges diverse family structures. Moreover, it is crucial to be aware of everyday phrases that could be considered insensitive toward individuals with medical conditions. For instance, using \"missed opportunity\" instead of \"blind spot\" or \"ridiculous\" rather than \"crazy\" demonstrates more thoughtful communication.\n\nAs society becomes more inclusive, so must our language. It is essential to stay updated and to use appropriate language for our times. By being mindful of the words we use, we can create a more welcoming environment for everyone.","stem":"다음 글의 밑줄 친 <u>endure</u>와 의미가 가장 <b>가까운</b> 것은?","det":{"korean":"신체적 차이가 있는 소수의 사람들은 불편함을 <b>참거나(endure)</b> 특별히 설계된 물건을 찾는다.","analysis":"✅ ③ tolerate(참다, 견디다): endure와 동의어<br>❌ ① avoid(피하다): 불편함을 피하는 것이 아니라 견디는 것<br>❌ ② create(만들다): 문맥과 무관<br>❌ ④ enjoy(즐기다): 불편함을 즐긴다는 의미로 반대<br>❌ ⑤ eliminate(제거하다): 참는 것과 의미가 다름","tip":"endure = tolerate = bear = put up with = withstand (참다, 견디다). 동의어 그룹으로 암기하세요."},"ans":2,"ch":["avoid","create","tolerate","enjoy"]},

st\" with neutral alternatives such as \"deny list\" and \"allow list\" enhances inclusivity. Similarly, using gender-neutral terms like \"parent\" and \"guardian\" instead of \"mom\" and \"dad\" helps break down biases and acknowledges diverse family structures. Moreover, it is crucial to be aware of everyday phrases that could be considered insensitive toward individuals with medical conditions. For instance, using \"missed opportunity\" instead of \"blind spot\" or \"ridiculous\" rather than \"crazy\" demonstrates more thoughtful communication.\n\nAs society becomes more inclusive, so must our language. It is essential to stay updated and to use appropriate language for our times. By being mindful of the words we use, we can create a more welcoming environment for everyone.","stem":"다음 글의 밑줄 친 <u>pursued</u>와 의미가 가장 <b>가까운</b> 것은?","det":{"korean":"건축가이자 제품 디자이너로서 그는 나이, 크기, 장애, 국적, 언어에 관계없이 모든 사람이 사용할 수 있는 세상을 <b>추구했다(pursued)</b>.","analysis":"✅ ① sought(추구하다): pursued와 동의어. seek의 과거형<br>❌ ② abandoned(포기하다): 추구하다의 반대<br>❌ ③ criticized(비판하다): 문맥과 무관<br>❌ ④ ignored(무시하다): 추구하다의 반대 개념<br>❌ ⑤ rejected(거부하다): 추구하다의 반대","tip":"pursue = seek = strive for = aim for (추구하다). regardless of(~에 관계없이)도 중요 표현입니다."},"ans":0,"ch":["sought","abandoned","criticized","ignored"]},
{"id":12,"type":"동의어 고르기","diff":"어려움","pts":6,"fmt":"mc","passage":"Did you know that one out of every ten people in the world is left-handed? They face challenges in a society designed for right-handed individuals. It is inconvenient for them to use some right-handed products such as scissors, cameras, and computer mice. The world we live in is designed to be an environment suitable for what is considered \"normal\" for the majority of people, and it is filled with objects that are easy for them to use. Thus, those who do not belong to that category have no choice but to live with discomfort. In other words, a minority of people with physical differences, such as the left-handed, the disabled, and the elderly, either endure inconvenience or deliberately seek objects designed especially for them, which are often difficult to find.\n\nIs it impossible to build an environment where everyone can use products and facilities conveniently and without limitations? It was Ronald Mace who sought the answer to this question. He contracted polio at the age of nine and spent the rest of his life in a wheelchair. When studying architecture at university, he struggled to access some campus facilities due to inaccessible building designs. This experience later inspired him to invent the term universal design, which refers to design for all. As an architect and product designer, he pursued a world in which all products and environments were designed to be artistic and usable to the greatest extent possible by everyone, regardless of their age, size, disability, nationality, or language.\n\nAccording to the principles of universal design, the design must be able to be used equitably, flexibly, simply, and intuitively by a wide variety of people. In addition, it should be <u>cognitively</u> accessible and minimize users' physical efforts. Finally, it requires the providing of sufficient space for all users while reducing potential hazards and adverse consequences from accidental or unintended actions. A key feature of universal design is that this is not a special requirement only for the benefit of a minority of the population. If an environment is accessible, usable, convenient, and a pleasure to use, everyone in the community benefits.\n\nHow has universal design been incorporated into modern architecture? One of the most representative examples of universal design being used to improve accessibility is the ramps installed in front of buildings. Ramps, not stairs, are necessary for people with disabilities who use wheelchairs, and they are also beneficial for parents pushing strollers and the elderly.\n\nAnother example is automatic doors. They are invaluable for those who rely on assistive devices such as wheelchairs and crutches. They also provide convenience for adults who have their hands full and children who are not tall enough to open the doors themselves. A further example is tactile paving. These textured surfaces, often found on sidewalks, steps, and crosswalks, assist visually impaired individuals by guiding them through urban spaces.\n\nUniversal design is not only applied in modern architecture but also extends to transportation systems. For instance, buses have been designed with a floor closer to ground level to ease access for all passengers. Handles of various lengths are provided, another method by which universal design is implemented to accommodate passengers' different heights. Subway maps have also been designed for color-blind individuals to clearly distinguish between subway lines by adjusting the color and the brightness and by varying the thickness of lines that have similar colors. Additionally, the use of pictograms can be seen frequently. Signs indicating the locations of subway or train stations assist international travelers who may not be familiar with the local language. Likewise, road signs indicating school zones, speed limits, and directions for turns and stops aid drivers in recognizing important information more easily.\n\nWhile universal design has been utilized in architecture and transportation systems for some time, a newer application is in the fashion industry. Clothing designed with universal design integrates stretchable and breathable materials, enhancing comfort and mobility. Other features include the use of magnets and Velcro in place of buttons, making it easier to put on and take off clothing. It also incorporates traits like stretchy waistbands and adjustable sleeves to allow individuals with disabilities to dress independently. This type of clothing is also beneficial for pregnant women, older adults who may experience mobility issues, and individuals with temporary injuries or medical conditions. Overall, universal design clothing promotes increased comfort, convenience, independence, and improved mobility and flexibility for wearers of all abilities.\n\nYou may find it surprising that universal design can be found in more parts of society than you thought. However, enough has not been done to accommodate everyone yet. Universal design should be implemented more extensively to promote full participation in the community for a wider range of people. It is time to build more equitable environments that are accessible to everyone. So are you on board to create a universally designed world for all?\n\nInclusive Language for Equality and Diversity\n\nHave you heard, \"Hello, guys; let's get started,\" at the beginning of a meeting? Could that make some feel less included? Inclusive language is a respectful way of communication by selecting words that avoid bias, prejudice, and discrimination. Saying, \"Hello, everyone,\" instead of, \"Hello, guys,\" demonstrates inclusivity, reduces potential barriers, and enhances everyone's sense of belonging.\n\nInclusive language promotes equality, respect, and diversity, inviting all people to participate in society. For example, replacing conventional terms with racial implications like \"blacklist\" and \"whitelist\" with neutral alternatives such as \"deny list\" and \"allow list\" enhances inclusivity. Similarly, using gender-neutral terms like \"parent\" and \"guardian\" instead of \"mom\" and \"dad\" helps break down biases and acknowledges diverse family structures. Moreover, it is crucial to be aware of everyday phrases that could be considered insensitive toward individuals with medical conditions. For instance, using \"missed opportunity\" instead of \"blind spot\" or \"ridiculous\" rather than \"crazy\" demonstrates more thoughtful communication.\n\nAs society becomes more inclusive, so must our language. It is essential to stay updated and to use appropriate language for our times. By being mindful of the words we use, we can create a more welcoming environment for everyone.","stem":"다음 글의 밑줄 친 <u>cognitively</u>와 의미가 가장 <b>가까운</b> 것은?","det":{"korean":"유니버설 디자인의 원칙에 따르면 <b>인지적으로(cognitively)</b> 접근 가능하고 사용자의 신체적 노력을 최소화해야 한다.","analysis":"✅ ③ mentally(정신적으로): cognitively(인지적으로)와 가장 유사<br>❌ ① physically(신체적으로): 문장 뒤에 physical efforts와 대비되는 개념<br>❌ ② emotionally(감정적으로): 인지와 감정은 다른 영역<br>❌ ④ visually(시각적으로): 감각 기관의 하나로 인지 전체를 대표하지 않음<br>❌ ⑤ financially(재정적으로): 문맥과 완전히 무관","tip":"cognitive(인지적인)는 mental(정신적인)과 유사합니다. cognition = 인지, 인식."},"ans":2,"ch":["physically","emotionally","mentally","visually"]},

d \"whitelist\" with neutral alternatives such as \"deny list\" and \"allow list\" enhances inclusivity. Similarly, using gender-neutral terms like \"parent\" and \"guardian\" instead of \"mom\" and \"dad\" helps break down biases and acknowledges diverse family structures. Moreover, it is crucial to be aware of everyday phrases that could be considered insensitive toward individuals with medical conditions. For instance, using \"missed opportunity\" instead of \"blind spot\" or \"ridiculous\" rather than \"crazy\" demonstrates more thoughtful communication.\n\nAs society becomes more inclusive, so must our language. It is essential to stay updated and to use appropriate language for our times. By being mindful of the words we use, we can create a more welcoming environment for everyone.","stem":"위 글에서 <b>accommodate</b>가 두 번 사용되었다. 각 문맥에서의 의미로 가장 적절한 것은?","det":{"korean":"① 'accommodate passengers' different heights' = 승객의 다른 키를 <b>수용하다/맞추다</b><br>② 'accommodate everyone' = 모든 사람을 <b>수용하다/배려하다</b>","analysis":"✅ ② 첫 번째: (다양한 필요를) 맞추다 / 두 번째: (모든 사람을) 수용하다 — 둘 다 '적응시키다, 맞추다'의 의미로 사용됨<br>❌ ① 첫 번째 '숙박시키다'는 물리적 숙박의 의미로 문맥에 부적절<br>❌ ③ '담다'는 물리적 공간의 의미로 문맥에 부적절<br>❌ ④ '수선하다'는 accommodate의 의미가 아님<br>❌ ⑤ '견디다'는 accommodate의 의미가 아님","tip":"accommodate의 다의어: ① 수용하다/맞추다 (adapt to needs) ② 숙박시키다 (provide lodging) ③ (공간이) 수용하다 (have room for). 본문에서는 ①의 의미로 사용."},"ans":1,"ch":["첫 번째: 숙박시키다 / 두 번째: 수용하다","첫 번째: (필요를) 맞추다 / 두 번째: (사람을) 수용하다","첫 번째: 담다 / 두 번째: 맞추다","첫 번째: 수선하다 / 두 번째: 담다"]},
{"id":16,"type":"영영풀이 매칭","diff":"보통","pts":5,"fmt":"mc","passage":"Did you know that one out of every ten people in the world is left-handed? They face challenges in a society designed for right-handed individuals. It is inconvenient for them to use some right-handed products such as scissors, cameras, and computer mice. The world we live in is designed to be an environment suitable for what is considered \"normal\" for the majority of people, and it is filled with objects that are easy for them to use. Thus, those who do not belong to that category have no choice but to live with discomfort. In other words, a minority of people with physical differences, such as the left-handed, the disabled, and the elderly, either endure inconvenience or deliberately seek objects designed especially for them, which are often difficult to find.\n\nIs it impossible to build an environment where everyone can use products and facilities conveniently and without limitations? It was Ronald Mace who sought the answer to this question. He contracted polio at the age of nine and spent the rest of his life in a wheelchair. When studying architecture at university, he struggled to access some campus facilities due to inaccessible building designs. This experience later inspired him to invent the term universal design, which refers to design for all. As an architect and product designer, he pursued a world in which all products and environments were designed to be artistic and usable to the greatest extent possible by everyone, regardless of their age, size, disability, nationality, or language.\n\nAccording to the principles of universal design, the design must be able to be used equitably, flexibly, simply, and intuitively by a wide variety of people. In addition, it should be cognitively accessible and minimize users' physical efforts. Finally, it requires the providing of sufficient space for all users while reducing potential hazards and adverse consequences from accidental or unintended actions. A key feature of universal design is that this is not a special requirement only for the benefit of a minority of the population. If an environment is accessible, usable, convenient, and a pleasure to use, everyone in the community benefits.\n\nHow has universal design been incorporated into modern architecture? One of the most representative examples of universal design being used to improve accessibility is the ramps installed in front of buildings. Ramps, not stairs, are necessary for people with disabilities who use wheelchairs, and they are also beneficial for parents pushing strollers and the elderly.\n\nAnother example is automatic doors. They are invaluable for those who rely on assistive devices such as wheelchairs and crutches. They also provide convenience for adults who have their hands full and children who are not tall enough to open the doors themselves. A further example is tactile paving. These textured surfaces, often found on sidewalks, steps, and crosswalks, assist visually impaired individuals by guiding them through urban spaces.\n\nUniversal design is not only applied in modern architecture but also extends to transportation systems. For instance, buses have been designed with a floor closer to ground level to ease access for all passengers. Handles of various lengths are provided, another method by which universal design is implemented to accommodate passengers' different heights. Subway maps have also been designed for color-blind individuals to clearly distinguish between subway lines by adjusting the color and the brightness and by varying the thickness of lines that have similar colors. Additionally, the use of pictograms can be seen frequently. Signs indicating the locations of subway or train stations assist international travelers who may not be familiar with the local language. Likewise, road signs indicating school zones, speed limits, and directions for turns and stops aid drivers in recognizing important information more easily.\n\nWhile universal design has been utilized in architecture and transportation systems for some time, a newer application is in the fashion industry. Clothing designed with universal design integrates stretchable and breathable materials, enhancing comfort and mobility. Other features include the use of magnets and Velcro in place of buttons, making it easier to put on and take off clothing. It also incorporates traits like stretchy waistbands and adjustable sleeves to allow individuals with disabilities to dress independently. This type of clothing is also beneficial for pregnant women, older adults who may experience mobility issues, and individuals with temporary injuries or medical conditions. Overall, universal design clothing promotes increased comfort, convenience, independence, and improved mobility and flexibility for wearers of all abilities.\n\nYou may find it surprising that universal design can be found in more parts of society than you thought. However, enough has not been done to accommodate everyone yet. Universal design should be implemented more extensively to promote full participation in the community for a wider range of people. It is time to build more equitable environments that are accessible to everyone. So are you on board to create a universally designed world for all?\n\nInclusive Language for Equality and Diversity\n\nHave you heard, \"Hello, guys; let's get started,\" at the beginning of a meeting? Could that make some feel less included? Inclusive language is a respectful way of communication by selecting words that avoid bias, prejudice, and discrimination. Saying, \"Hello, everyone,\" instead of, \"Hello, guys,\" demonstrates inclusivity, reduces potential barriers, and enhances everyone's sense of belonging.\n\nInclusive language promotes equality, respect, and diversity, inviting all people to participate in society. For example, replacing conventional terms with racial implications like \"blacklist\" and \"whitelist\" with neutral alternatives such as \"deny list\" and \"allow list\" enhances inclusivity. Similarly, using gender-neutral terms like \"parent\" and \"guardian\" instead of \"mom\" and \"dad\" helps break down biases and acknowledges diverse family structures. Moreover, it is crucial to be aware of everyday phrases that could be considered insensitive toward individuals with medical conditions. For instance, using \"missed opportunity\" instead of \"blind spot\" or \"ridiculous\" rather than \"crazy\" demonstrates more thoughtful communication.\n\nAs society becomes more inclusive, so must our language. It is essential to stay updated and to use appropriate language for our times. By being mindful of the words we use, we can create a more welcoming environment for everyone.","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><i>: the quality or practice of including people who might otherwise be excluded or marginalized</i>","det":{"korean":"다른 경우 배제되거나 소외될 수 있는 사람들을 포함하는 자질 또는 관행","analysis":"✅ ② inclusivity(포용성): 배제될 수 있는 사람들을 포함하는 관행이라는 영영 풀이에 정확히 부합<br>❌ ① diversity(다양성): 다양한 종류가 있다는 의미로 포용과는 다름<br>❌ ③ prejudice(편견): 포용의 반대 개념<br>❌ ④ discrimination(차별): 포용의 반대 개념<br>❌ ⑤ accessibility(접근성): 접근 가능함의 의미로 포용과는 다른 개념","tip":"inclusivity(포용성)는 inclusive(포용적인)의 명사형. include(포함하다) → inclusive(포용적인) → inclusivity(포용성)."},"ans":1,"ch":["diversity","inclusivity","prejudice","discrimination"]},

list\" with neutral alternatives such as \"deny list\" and \"allow list\" enhances inclusivity. Similarly, using gender-neutral terms like \"parent\" and \"guardian\" instead of \"mom\" and \"dad\" helps break down biases and acknowledges diverse family structures. Moreover, it is crucial to be aware of everyday phrases that could be considered insensitive toward individuals with medical conditions. For instance, using \"missed opportunity\" instead of \"blind spot\" or \"ridiculous\" rather than \"crazy\" demonstrates more thoughtful communication.\n\nAs society becomes more inclusive, so must our language. It is essential to stay updated and to use appropriate language for our times. By being (mind) __________ of the words we use, we can create a more welcoming environment for everyone.","stem":"다음 글의 괄호 안의 단어를 문맥에 맞게 변형하여 빈칸에 쓰시오.","det":{"korean":"우리가 사용하는 단어에 <b>주의를 기울여(mindful)</b> 더 환영하는 환경을 만들 수 있다.","analysis":"mind(명사/동사) → <b>mindful</b>(형용사: 주의 깊은). being __________ of 구조에서 형용사가 필요. be mindful of = ~을 유의하다","tip":"mind → mindful(주의 깊은) → mindfully(주의 깊게) → mindfulness(마음챙김). -ful 접미사는 '~이 가득한'의 형용사를 만듭니다."},"wa":"mindful","accept":["mindful"]},

th neutral alternatives such as \"deny list\" and \"allow list\" enhances inclusivity. Similarly, using gender-neutral terms like \"parent\" and \"guardian\" instead of \"mom\" and \"dad\" helps break down biases and acknowledges diverse family structures. Moreover, it is crucial to be aware of everyday phrases that could be considered insensitive toward individuals with medical conditions. For instance, using \"missed opportunity\" instead of \"blind spot\" or \"ridiculous\" rather than \"crazy\" demonstrates more thoughtful communication.\n\nAs society becomes more inclusive, so must our language. It is essential to stay updated and to use appropriate language for our times. By being mindful of the words we use, we can create a more welcoming environment for everyone.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"지하철 노선도는 색맹인 사람들이 색상과 밝기를 조정하고 유사한 색상의 노선 굵기를 달리하여 지하철 노선을 명확히 <b>구별</b>할 수 있도록 설계되었다.","analysis":"✅ ③ distinguish(구별하다): 색맹인 사람이 노선을 구별한다는 문맥에 적합<br>❌ ① combine(결합하다): 구별이 아닌 합치는 것으로 반대<br>❌ ② eliminate(제거하다): 노선을 제거하는 것이 아님<br>❌ ④ ignore(무시하다): 구별의 반대 개념<br>❌ ⑤ overlap(겹치다): 구별과 반대 개념","tip":"distinguish between A and B = tell A from B = differentiate A from B (A와 B를 구별하다)."},"ans":2,"ch":["combine","eliminate","distinguish","ignore"]},
{"id":20,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","passage":"Did you know that one out of every ten people in the world is left-handed? They face challenges in a society designed for right-handed individuals. It is inconvenient for them to use some right-handed products such as scissors, cameras, and computer mice. The world we live in is designed to be an environment suitable for what is considered \"normal\" for the majority of people, and it is filled with objects that are easy for them to use. Thus, those who do not belong to that category have no choice but to live with discomfort. In other words, a minority of people with physical differences, such as the left-handed, the disabled, and the elderly, either endure inconvenience or deliberately seek objects designed especially for them, which are often difficult to find.\n\nIs it impossible to build an environment where everyone can use products and facilities conveniently and without limitations? It was Ronald Mace who sought the answer to this question. He contracted polio at the age of nine and spent the rest of his life in a wheelchair. When studying architecture at university, he struggled to access some campus facilities due to inaccessible building designs. This experience later inspired him to invent the term universal design, which refers to design for all. As an architect and product designer, he pursued a world in which all products and environments were designed to be artistic and usable to the greatest extent possible by everyone, regardless of their age, size, disability, nationality, or language.\n\nAccording to the principles of universal design, the design must be able to be used equitably, flexibly, simply, and intuitively by a wide variety of people. In addition, it should be cognitively accessible and minimize users' physical efforts. Finally, it requires the providing of sufficient space for all users while reducing potential hazards and adverse consequences from accidental or unintended actions. A key feature of universal design is that this is not a special requirement only for the benefit of a minority of the population. If an environment is accessible, usable, convenient, and a pleasure to use, everyone in the community benefits.\n\nHow has universal design been incorporated into modern architecture? One of the most representative examples of universal design being used to improve accessibility is the ramps installed in front of buildings. Ramps, not stairs, are necessary for people with disabilities who use wheelchairs, and they are also beneficial for parents pushing strollers and the elderly.\n\nAnother example is automatic doors. They are invaluable for those who rely on assistive devices such as wheelchairs and crutches. They also provide convenience for adults who have their hands full and children who are not tall enough to open the doors themselves. A further example is tactile paving. These textured surfaces, often found on sidewalks, steps, and crosswalks, assist visually impaired individuals by guiding them through urban spaces.\n\nUniversal design is not only applied in modern architecture but also extends to transportation systems. For instance, buses have been designed with a floor closer to ground level to ease access for all passengers. Handles of various lengths are provided, another method by which universal design is implemented to accommodate passengers' different heights. Subway maps have also been designed for color-blind individuals to clearly distinguish between subway lines by adjusting the color and the brightness and by varying the thickness of lines that have similar colors. Additionally, the use of pictograms can be seen frequently. Signs indicating the locations of subway or train stations assist international travelers who may not be familiar with the local language. Likewise, road signs indicating school zones, speed limits, and directions for turns and stops aid drivers in recognizing important information more easily.\n\nWhile universal design has been utilized in architecture and transportation systems for some time, a newer application is in the fashion industry. Clothing designed with universal design integrates stretchable and breathable materials, enhancing comfort and mobility. Other features include the use of magnets and Velcro in place of buttons, making it easier to put on and take off clothing. It also incorporates traits like stretchy waistbands and adjustable sleeves to allow individuals with disabilities to dress independently. This type of clothing is also beneficial for pregnant women, older adults who may experience mobility issues, and individuals with temporary injuries or medical conditions. Overall, universal design clothing promotes increased comfort, convenience, independence, and improved mobility and flexibility for wearers of all abilities.\n\nYou may find it surprising that universal design can be found in more parts of society than you thought. However, enough has not been done to accommodate everyone yet. Universal design should be implemented more extensively to promote full participation in the community for a wider range of people. It is time to build more equitable environments that are accessible to everyone. So are you on board to create a universally designed world for all?\n\nInclusive Language for Equality and Diversity\n\nHave you heard, \"Hello, guys; let's get started,\" at the beginning of a meeting? Could that make some feel less included? Inclusive language is a respectful way of communication by selecting words that avoid bias, prejudice, and __________. Saying, \"Hello, everyone,\" instead of, \"Hello, guys,\" demonstrates inclusivity, reduces potential barriers, and enhances everyone's sense of belonging.\n\nInclusive language promotes equality, respect, and diversity, inviting all people to participate in society. For example, replacing conventional terms with racial implications like \"blacklist\" and \"whitelist\" with neutral alternatives such as \"deny list\" and \"allow list\" enhances inclusivity. Similarly, using gender-neutral terms like \"parent\" and \"guardian\" instead of \"mom\" and \"dad\" helps break down biases and acknowledges diverse family structures. Moreover, it is crucial to be aware of everyday phrases that could be considered insensitive toward individuals with medical conditions. For instance, using \"missed opportunity\" instead of \"blind spot\" or \"ridiculous\" rather than \"crazy\" demonstrates more thoughtful communication.\n\nAs society becomes more inclusive, so must our language. It is essential to stay updated and to use appropriate language for our times. By being mindful of the words we use, we can create a more welcoming environment for everyone.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"포용적 언어는 편견, 선입견, 그리고 <b>차별</b>을 피하는 단어를 선택하는 존중하는 소통 방식이다.","analysis":"✅ ② discrimination(차별): bias(편견), prejudice(선입견)과 함께 부정적 의미의 병렬 구조<br>❌ ① diversity(다양성): 피해야 할 대상이 아닌 긍정적 가치<br>❌ ③ inclusion(포용): 피해야 할 대상이 아닌 긍정적 가치<br>❌ ④ equality(평등): 피해야 할 대상이 아닌 긍정적 가치<br>❌ ⑤ belonging(소속감): 피해야 할 대상이 아닌 긍정적 가치","tip":"bias(편견) + prejudice(선입견) + discrimination(차별)은 부정적 3종 세트! avoid bias, prejudice, and discrimination은 포용적 언어의 핵심 원칙입니다."},"ans":1,"ch":["diversity","discrimination","inclusion","equality"]}];

function submitExam() {
  if (!confirm('\uc81c\ucd9c\ud558\uc2dc\uaca0\uc2b5\ub2c8\uae4c?')) return;
  clearInterval(S.ti);
  var elapsed = Math.floor((Date.now() - S.start) / 1000);

  saveToHistory(r, elapsed);

}

function grade() {
  var score = 0, correct = 0, wrong = 0, unanswered = 0;
  var details = [];
  var qs = S.filtered ? S.filtered.map(function (i) { return Q[i]; }) : Q;
  qs.forEach(function (q, i) {
    var a = S.ans[i];
    var ok = false;
    if (a === null) unanswered++;
    else if (q.fmt === 'mc') ok = a === q.ans;
    else {
      var u = String(a).trim().toLowerCase();
      if (q.accept) ok = q.accept.some(function (x) { return u === x.toLowerCase(); });
      if (!ok && q.wa) ok = u === q.wa.toLowerCase();
    }
    if (a !== null) { if (ok) { correct++; score += q.pts; } else wrong++; }
    details.push({ q: q, ans: a, ok: ok });
  });
  return { score: score, correct: correct, wrong: wrong, unanswered: unanswered, details: details };
}

        navigator.share({ files: [file], title: '\ub0b4\uc2e0\ud56b ' + tn + ' \uacb0\uacfc' }).catch(function () {});
      } else {
        var a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = '\ub0b4\uc2e0\ud56b_' + tn + '_\uacb0\uacfc.png';
        a.click();
      }
      toast('\ud83d\udcf8 \uacb0\uacfc \uc774\ubbf8\uc9c0\uac00 \uc800\uc7a5\ub418\uc5c8\uc2b5\ub2c8\ub2e4!');
    });
  }).catch(function () { toast('\uc774\ubbf8\uc9c0 \uc0dd\uc131 \uc2e4\ud328'); });
}

function reviewHistory(idx) {
  var h = getHistory();
  var rec = h[idx];
  if (!rec || !rec.answers) return toast('\uc774\uc804 \ubc84\uc804 \uae30\ub85d\uc740 \ud574\uc124\uc744 \ubcfc \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.');
  S.ans = rec.answers;
  S.start = Date.now() - rec.elapsed * 1000;
  document.getElementById('inpName').value = rec.name || '';
  document.getElementById('inpSchool').value = rec.school || '';
  document.getElementById('inpGrade').value = rec.grade || '\uace01';
  var r = grade();
  renderResults(r, rec.elapsed);
  showScreen('resultScreen');
  window.scrollTo(0, 0);
}

function retake() { location.reload(); }
function goHome() { showScreen('startScreen'); updateHCount(); }

window.addEventListener('beforeunload', function (e) {
  if (S.ti) { e.preventDefault(); e.returnValue = ''; }
});

updateHCount();
</script>
