<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영어1 YBM(박준언) 온라인퀴즈TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* NaesinFit — Orange Theme (퀴즈테스트) */
:root{
  --p:#E8772E;--pd:#B85A1A;--pl:#F5A623;--pxl:#FFF3E8;--pxxl:#FFFAF5;
  --bg:#F6F2EE;--text:#1A1A2E;--tm:#7A6A5E;--tl:#A89A8E;
  --r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;
  --o:#F59E0B;--ol:#FFF8E1;
  --card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);
  --radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;
  --pborder:#ddd8d2;--pbg-muted:#e8e0d8;
  --passage-bg:linear-gradient(135deg,#FFFAF8,#F5F0EB);
  --start-grad:linear-gradient(160deg,#FFF3E8,#FFE8D6 40%,#FFDDC8);
  --accent2:#D97706;
  --p-rgba-08:rgba(232,119,46,.08);
  --p-rgba-10:rgba(232,119,46,.1);
  --p-rgba-12:rgba(232,119,46,.12);
  --p-rgba-25:rgba(232,119,46,.25);
  --p-rgba-30:rgba(232,119,46,.3);
}

/* NaesinFit Test Engine — Common CSS (theme-agnostic)
   Theme-specific colors come from :root variables defined in theme-*.css:
   --p      : primary color
   --pd     : primary dark
   --pl     : primary light
   --pxl    : primary extra-light
   --pxxl   : primary xx-light
   --bg     : page background
   --text   : main text
   --tm     : text muted
   --tl     : text light
   --pborder: border color (theme-tinted)
   --pbg-muted: muted bg for tracks/bars
   --start-grad: startScreen gradient
   --accent2: secondary gradient stop (badge/header)
   --p-rgba-08: rgba for selected bg
   --p-rgba-12: rgba for box-shadow
   --p-rgba-10: rgba for focus ring
   --p-rgba-25: rgba for button shadow
   --p-rgba-30: rgba for selectPulse
*/

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Start Screen */
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:var(--start-grad);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--p),var(--accent2));color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--p),var(--accent2));padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid var(--pborder);}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid var(--pborder);border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid var(--pborder);border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-rgba-10);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;box-shadow:0 6px 20px var(--p-rgba-30);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid var(--pborder);color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--p);color:var(--p);}
.history-badge{background:var(--pxl);color:var(--p);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid var(--pborder);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--p);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}

/* Exam Screen */
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--p);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--p);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--p);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--accent2));transition:width .5s ease;border-radius:0 2px 2px 0;}

/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--pxl),var(--pl));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--pd);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:10px 14px 14px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
.slide-choices{display:flex;flex-direction:column;gap:3px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12px;line-height:1.3;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--p);background:var(--p-rgba-08);box-shadow:0 0 0 3px var(--p-rgba-12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 var(--p-rgba-30)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:20px;height:20px;font-size:10px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--p-rgba-10);}
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;box-shadow:0 2px 8px var(--p-rgba-25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--p);}
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--p);background:var(--pxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}

/* Type tags — same across all themes */
.tag-combo{background:#E8F5E9;color:#166534;}.tag-wrong{background:#FFF0F0;color:#D63B3B;}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:#EDF2FF;color:#3B6FD9;}.tag-ant{background:#FFF8E1;color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}.tag-insert{background:#E3F2FD;color:#1565C0;}.tag-order{background:#FFF8E1;color:#F57F17;}

.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:var(--pbg-muted);padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--p);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:var(--passage-bg);border-left:3px solid var(--p);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--pborder);border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--p);}.choice-btn.selected{border-color:var(--p);box-shadow:0 0 0 2px var(--p-rgba-12);background:var(--pxxl);}
.c-num{min-width:22px;height:22px;background:var(--pbg-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid var(--pborder);border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--p);}

/* Result Screen */
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--pxl),var(--pl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:var(--pbg-muted);border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--pl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--pxxl);border-radius:var(--rs);border:1px solid var(--pborder);}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--pxl);}.info-cell.highlight .ic-value{color:var(--p);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:var(--pbg-muted);border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--pl);color:var(--p);}.tag-item.weak{background:#FFF0F0;color:#D63B3B;}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--pxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid var(--pborder);border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--p);color:var(--p);}.act-btn.primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid var(--pborder);border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--pxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--pxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--pl);color:var(--p);}.expl-tag.tip{background:var(--pxl);color:var(--pd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--p);}.expl-box.tip-b{border-left:3px solid var(--p);background:var(--pxl);}

@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">온라인퀴즈 TEST</div>
  <h1 class="start-title">온라인퀴즈 <span>TEST</span></h1>
  <p class="start-subtitle">영어1 · YBM(박준언) · 4과 · 20문항</p>
  <div class="info-card"><div class="info-card-header">시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">영어1</span></div>
    <div class="info-row"><span class="info-label">문항</span><span class="info-value">YBM(박준언) (4과)</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">King Jeongjo's Grand Procession</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">20문항</div><div class="chip">20분</div><div class="chip">80점 이상 통과</div><div class="chip">100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="startExam()">시험 시작하기</button>
  <button class="btn btn-outline" onclick="toggleHistory()">시험 기록 보기 <span class="history-badge" id="hCount">0</span></button>
  <div id="historyPanel"></div>
</div>
</div>

<div id="examScreen" class="screen">
  <div class="exam-topbar"><div class="topbar-left"><div class="topbar-dot"></div><div class="topbar-info">영어1 · <span>YBM(박준언)</span></div></div><div class="timer" id="timer">20:00</div><button class="btn-submit" onclick="submitExam()">제출하기</button></div>
  <div class="exam-progress"><div class="exam-progress-fill" id="progressFill"></div></div>
  <div class="ans-count" id="ansCount">0/20</div>
  <div class="exam-scroll" id="examScroll"></div>
  <div class="slide-wrap" id="slideWrap">

const FULL_PASSAGE="Back on February 9, 1795, something remarkable happened in front of Changdeokgung Palace, where King Jeongjo lived. There was quite a crowd gathered there to witness a very special procession that's still talked about in Korea today.\n\nMore than 2,000 soldiers, hundreds of horse riders, and lots of important officials, all marching alongside the king and his mother with 50 musicians playing traditional instruments. When they crossed a bridge made of 36 boats on the Hangang River, you can imagine how that turned heads!\n\nLasting four days and covering 68 kilometers, the procession moved alongside the king and his mother as they made a round trip to Hwaseong Haenggung.\n\nThe first thing King Jeongjo had in mind was to show respect to his family. It happened around his mother's sixtieth birthday. His father's tomb was near Hwaseong Haenggung. He was planning to hold a memorial service to honor his late father.\n\nKing Jeongjo was also making a statement about the Joseon Dynasty's strength. He dressed up like a military leader, wearing armor and sitting on a horse with his soldiers marching in perfect order.\n\nThe procession also had something to do with Hwaseong Fortress, which was being built. He wanted it to be a self-sufficient city with a strong military, farming, and trade as he hoped to make it the new capital, away from all the political chaos in Hanyang. So King Jeongjo gathered the best talents, such as Jeong Yakyong, and let them bring together the finest architectural techniques of his time from both the East and the West to build Hwaseong Fortress.\n\nHe treated his people well during the construction of the fortress. They received fair wages and breaks during bad weather and were even paid when they were sick, something that was unheard of at that time. Once people got wind of King Jeongjo's plan, workers from all over the country came together in a rush. So, in under three years was the project finished, though it was initially thought to take about 10 years.\n\nThe procession was actually a way for ordinary people to get up close and personal with the king. King Jeongjo set up a chance during the procession for common people to meet him and to share their concerns.\n\nThrough the procession, King Jeongjo made government more accessible. He added special exams during the procession, giving more people a shot at joining the government.\n\nHe made sure everything was documented properly by creating records for the procession and the construction of Hwaseong Fortress. These construction records were especially a lifesaver when the fortress was damaged during wartime. They were even part of why UNESCO recognized Hwaseong Fortress as a World Heritage Site.\n\nAt first, the people at UNESCO were a bit unsure about recognizing Hwaseong Fortress as the real deal. They weren't totally convinced it was authentic. But after checking out translated documents and comparing them with the restored fortress, they finally came around and agreed that the fortress had actually been restored just the way it was meant to be.\n\nAmong the records of the procession, there are these amazing paintings. One painting, Hwaneo Haengryeoldo, doesn't just feature the king's crew, but it also shows ordinary people watching along the road.\n\nKing Jeongjo's 1795 procession and Hwaseong Fortress stand as proof of that spirit. Hwaseong is more than just a fortress; it symbolizes a king who cared for his people.";

{"id":2,"type":"어법","diff":"쉬움","pts":4,"fmt":"mc","passage":"He treated his people well during the construction of the fortress. They received fair wages and breaks during bad weather and were even (A) <b>[paid / paying]</b> when they were sick, something that was unheard of at that time. Back then, ordinary people were typically required (B) <b>[to work / working]</b> on public projects without (C) <b>[getting / to get]</b> paid.","stem":"(A), (B), (C)에서 어법에 맞는 표현으로 가장 적절한 것은?","det":{"korean":"아플 때도 급여를 (A)<b>받았고(paid)</b>: 수동태 were paid. 공공 사업에서 일하도록 (B)<b>요구되었다(to work)</b>: be required to V. 급여를 (C)<b>받지(getting)</b> 못한 채: without + V-ing.","analysis":"✅ ① (A) paid — (B) to work — (C) getting: 수동태+to부정사+동명사 모두 적절 ❌ ② paying은 능동이므로 부적절 ❌ ③ working은 be required to V 구문에 부적절 ❌ ④ to get은 without 뒤에 동명사가 와야 하므로 부적절","tip":"be paid(수동), be required to V(to부정사), without V-ing(동명사)."},"ans":0,"ch":["(A) paid — (B) to work — (C) getting","(A) paying — (B) to work — (C) getting","(A) paid — (B) working — (C) getting","(A) paid — (B) to work — (C) to get"]},
{"id":3,"type":"어휘","diff":"쉬움","pts":4,"fmt":"mc","passage":"At first, the people at UNESCO were a bit unsure about recognizing Hwaseong Fortress as the real deal. They weren't totally ①<u>convinced</u> it was ②<u>authentic</u>. But after checking out ③<u>translated</u> documents and comparing them with the ④<u>neglected</u> fortress, they finally came around and agreed that the fortress had actually been restored just the way it was meant to be.","stem":"밑줄 친 낱말 중 문맥상 부적절한 것은?","det":{"korean":"번역된 문서를 확인하고 <b>복원된(restored)</b> 요새와 비교한 후 인정했다. ④ neglected(방치된)는 원문 restored(복원된)의 반의어.","analysis":"✅ ①②③ 적절 ❌ ④ neglected(방치된) → restored(복원된): 유네스코가 복원된 요새와 문서를 비교한 것","tip":"restored(복원된) ↔ neglected(방치된). 요새를 원래대로 복원했다는 맥락."},"ans":3,"ch":["① convinced","② authentic","③ translated","④ neglected"]},
{"id":4,"type":"어휘","diff":"쉬움","pts":4,"fmt":"mc","passage":"King Jeongjo was also making a statement about the Joseon Dynasty's strength. He dressed up like a military leader, wearing armor and sitting on a horse with his soldiers marching in ①<u>perfect</u> order. It was a way of saying, \"We're ready to ②<u>protect</u> our land.\" He was really ③<u>serious</u> about making the Joseon Dynasty a powerful and ④<u>unsuccessful</u> kingdom.","stem":"밑줄 친 낱말 중 문맥상 부적절한 것은?","det":{"korean":"정조는 조선을 강력하고 ④<b>성공적인(successful)</b> 왕국으로 만드는 데 진지했다. unsuccessful(성공하지 못한)은 원문 successful의 반의어.","analysis":"✅ ①②③ 적절 ❌ ④ unsuccessful → successful: 힘을 과시하며 강한 왕국을 만들겠다는 맥락","tip":"successful(성공적인) ↔ unsuccessful(성공하지 못한). 왕조의 힘을 과시하는 맥락."},"ans":3,"ch":["① perfect","② protect","③ serious","④ unsuccessful"]},
{"id":5,"type":"어휘","diff":"쉬움","pts":4,"fmt":"mc","passage":"So being kind to the people was a big deal for kings of the Joseon Dynasty. King Jeongjo's 1795 procession and Hwaseong Fortress stand as proof of that spirit. Hwaseong is more than just a fortress; it ①<u>symbolizes</u> a king who ②<u>neglected</u> his people. And this is a ③<u>significant</u> part of Korean cultural ④<u>heritage</u>.","stem":"밑줄 친 낱말 중 문맥상 부적절한 것은?","det":{"korean":"화성은 백성을 ②<b>돌본(cared for)</b> 왕을 상징한다. neglected(방치한)는 cared for(돌본)의 반의어.","analysis":"✅ ①③④ 적절 ❌ ② neglected(방치한) → cared for(돌본): 백성에게 친절한 왕이라는 전체 맥락과 모순","tip":"cared for(돌본) ↔ neglected(방치한). 정조의 핵심 메시지는 백성 사랑."},"ans":1,"ch":["① symbolizes","② neglected","③ significant","④ heritage"]},
{"id":6,"type":"대의","diff":"보통","pts":5,"fmt":"mc","passage":"He treated his people well during the construction of the fortress. They received fair wages and breaks during bad weather and were even paid when they were sick, something that was unheard of at that time. Back then, ordinary people were typically required to work on public projects without getting paid. Once people got wind of King Jeongjo's plan, workers from all over the country came together in a rush. So, in under three years was the project finished, though it was initially thought to take about 10 years.","stem":"위 글의 주제로 가장 적절한 것은?","det":{"korean":"정조의 혁신적 노동 정책: 공정한 임금, 악천후 휴식, 병가 급여 → 전국에서 노동자 쇄도 → 예상보다 빠른 완공. 핵심: 인도적 대우가 가져온 놀라운 결과.","analysis":"✅ ② King Jeongjo's humane labor policies and their remarkable results: 인도적 노동 정책과 그 놀라운 결과 ❌ ① The architectural design of Hwaseong Fortress: 건축 설계가 아닌 노동 정책이 주제 ❌ ③ The difficulties of building a fortress in the Joseon Dynasty: 어려움이 아닌 성공 사례 ❌ ④ Why workers refused to participate in public projects: 거부가 아닌 자발적 참여","tip":"주제 파악 — 반복 키워드: fair wages, paid when sick, unheard of, in a rush."},"ans":1,"ch":["The architectural design of Hwaseong Fortress","King Jeongjo's humane labor policies and their remarkable results","The difficulties of building a fortress in the Joseon Dynasty","Why workers refused to participate in public projects"]},
{"id":7,"type":"대의","diff":"보통","pts":5,"fmt":"mc","passage":"He made sure everything was documented properly by creating records for the procession and the construction of Hwaseong Fortress. These construction records were especially a lifesaver when the fortress was damaged during wartime. They were even part of why UNESCO recognized Hwaseong Fortress as a World Heritage Site. At first, the people at UNESCO were a bit unsure about recognizing Hwaseong Fortress as the real deal. They weren't totally convinced it was authentic. But after checking out translated documents and comparing them with the restored fortress, they finally came around.","stem":"위 글의 제목으로 가장 적절한 것은?","det":{"korean":"정조의 기록이 전쟁 후 복원에 결정적 역할 + 유네스코 세계유산 인정의 핵심 근거. 핵심: 기록의 힘.","analysis":"✅ ③ The Power of Records: From Wartime Recovery to World Heritage: 기록의 힘 — 전쟁 복구부터 세계유산까지 ❌ ① How UNESCO Selects World Heritage Sites: 유네스코 선정 과정 일반이 아닌 화성 특정 사례 ❌ ② The Destruction of Korean Fortresses During Wartime: 파괴가 아닌 복원이 핵심 ❌ ④ Why Hwaseong Fortress Should Not Be a Heritage Site: 반대 논점","tip":"제목 유형 — 핵심 키워드: documented, records, lifesaver, UNESCO recognized."},"ans":2,"ch":["How UNESCO Selects World Heritage Sites","The Destruction of Korean Fortresses During Wartime","The Power of Records: From Wartime Recovery to World Heritage","Why Hwaseong Fortress Should Not Be a Heritage Site"]},
{"id":8,"type":"내용일치","diff":"보통","pts":5,"fmt":"mc","passage":"In King Jeongjo's mind were big plans for Hwaseong. He wanted it to be a self-sufficient city with a strong military, farming, and trade as he hoped to make it the new capital, away from all the political chaos in Hanyang. So King Jeongjo gathered the best talents, such as Jeong Yakyong, and let them bring together the finest architectural techniques of his time from both the East and the West to build Hwaseong Fortress.","stem":"위 글의 내용과 일치하는 것은?","det":{"korean":"정조는 화성을 군사, 농업, 무역을 갖춘 자급자족 도시로 만들고자 했다. 정약용 등 최고 인재를 모아 동서양 건축 기술을 결합했다.","analysis":"✅ ③ Jeong Yakyong was one of the talents gathered by King Jeongjo: 원문 일치 ❌ ① King Jeongjo wanted to strengthen Hanyang as the capital: 한양에서 벗어나려 했음 ❌ ② Only Eastern architectural techniques were used: 동서양 모두 ❌ ④ Hwaseong was planned as a purely military base: 군사+농업+무역 자급자족 도시","tip":"self-sufficient = 자급자족하는. both the East and the West = 동서양 모두."},"ans":2,"ch":["King Jeongjo wanted to strengthen Hanyang as the capital.","Only Eastern architectural techniques were used.","Jeong Yakyong was one of the talents gathered by King Jeongjo.","Hwaseong was planned as a purely military base."]},
{"id":9,"type":"내용불일치","diff":"보통","pts":5,"fmt":"mc","passage":"Among the records of the procession, there are these amazing paintings. One painting, Hwaneo Haengryeoldo, doesn't just feature the king's crew, but it also shows ordinary people watching along the road. It's a different take from the usual art of that time, which only focused on important figures.","stem":"위 글의 내용과 일치하지 <b>않는</b> 것은?","det":{"korean":"화어행렬도는 왕의 일행뿐 아니라 길가의 평범한 백성도 보여준다. 당시 보통 그림은 중요한 인물만 다뤘다.","analysis":"❌ ① Hwaneo Haengryeoldo shows the king's crew: 원문 일치 ❌ ② The painting also depicts ordinary people: 원문 일치 ❌ ③ The usual art of that time focused on important figures: 원문 일치 ✅ ④ Hwaneo Haengryeoldo is a typical example of art from that era: 원문에서 'a different take'(다른 관점)이라고 했으므로 불일치","tip":"a different take = 다른 관점/접근. typical(전형적인)이 아니라 비전형적."},"ans":3,"ch":["Hwaneo Haengryeoldo shows the king's crew.","The painting also depicts ordinary people.","The usual art of that time focused on important figures.","Hwaneo Haengryeoldo is a typical example of art from that era."]},
{"id":10,"type":"함축","diff":"보통","pts":5,"fmt":"mc","passage":"He treated his people well during the construction of the fortress. They received fair wages and breaks during bad weather and were even paid when they were sick, something that was unheard of at that time. Back then, ordinary people were typically required to work on public projects without getting paid. Once people <u>got wind of</u> King Jeongjo's plan, workers from all over the country came together in a rush.","stem":"밑줄 친 \"got wind of\"가 의미하는 바로 가장 적절한 것은?","det":{"korean":"got wind of = ~에 대한 소식을 듣다, ~을 알게 되다. 정조의 계획 소식을 듣고 전국에서 노동자들이 몰려왔다.","analysis":"✅ ② heard about(~에 대해 듣다): got wind of와 동의 ❌ ① forgot about(잊다) ❌ ③ disagreed with(반대하다) ❌ ④ gave up on(포기하다)","tip":"get wind of = hear about, learn of. 관용 표현."},"ans":1,"ch":["forgot about","heard about","disagreed with","gave up on"]},
{"id":11,"type":"빈칸추론","diff":"보통","pts":5,"fmt":"mc","passage":"The procession wasn't just some fancy show for ordinary people. It was actually a way for them to get up close and personal with the king. King Jeongjo set up a chance during the procession for common people to meet him and to share their concerns. This was a big deal, especially for those who couldn't read or write. __________","stem":"위 글에 따르면, 행렬이 문맹인 백성에게 특히 중요했던 이유로 가장 적절한 것은?","det":{"korean":"글을 읽고 쓸 수 없는 사람은 서면으로 왕에게 청원할 수 없었다. 행렬은 구두로 직접 왕에게 말할 수 있는 유일한 기회였다.","analysis":"✅ ① It was their only chance to communicate directly with the king: 유일한 직접 소통 기회 ❌ ② They could learn to read and write during the procession: 읽고 쓰기 교육이 아님 ❌ ③ The procession provided free food for illiterate people: 음식 제공 언급 없음 ❌ ④ They were given government positions without exams: 시험 없는 관직 부여 아님","tip":"couldn't read or write → 서면 청원 불가 → 직접 만남이 유일한 통로."},"ans":0,"ch":["It was their only chance to communicate directly with the king.","They could learn to read and write during the procession.","The procession provided free food for illiterate people.","They were given government positions without exams."]},
{"id":12,"type":"빈칸추론","diff":"보통","pts":5,"fmt":"mc","passage":"King Jeongjo was also making a statement about the Joseon Dynasty's strength. He dressed up like a military leader, wearing armor and sitting on a horse with his soldiers marching in perfect order. It was a way of saying, \"__________\".","stem":"빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"정조는 군사 지도자처럼 갑옷을 입고, 병사들이 완벽한 질서로 행진했다. 이는 조선의 군사력을 과시하는 것. 원문: 'We're ready to protect our land.'","analysis":"✅ ③ We're ready to protect our land: 원문 그대로 ❌ ① We welcome all foreign nations: 외국 환영 아님 ❌ ② The war has finally ended: 전쟁 종결 아님 ❌ ④ Our military needs more funding: 군사비 요청 아님","tip":"making a statement about strength = 힘 과시. 군사적 준비 완료 메시지."},"ans":2,"ch":["We welcome all foreign nations.","The war has finally ended.","We're ready to protect our land.","Our military needs more funding."]},
{"id":13,"type":"어법","diff":"보통","pts":5,"fmt":"mc","passage":"He made sure everything was documented ①<u>properly</u> by creating records for the procession and the construction of Hwaseong Fortress. These construction records were especially a lifesaver ②<u>when</u> the fortress was damaged during wartime. They were even part of ③<u>why</u> UNESCO ④<u>recognizing</u> Hwaseong Fortress as a World Heritage Site.","stem":"밑줄 친 ①~④ 중 어법상 어색한 것은?","det":{"korean":"유네스코가 화성을 세계유산으로 ④<b>인정한(recognized)</b> 이유의 일부였다. 과거 시제 문맥에서 ④ recognizing → <b>recognized</b>.","analysis":"✅ ①②③ 어법 적절 ❌ ④ recognizing → recognized: part of why UNESCO recognized (과거 시제, 서술동사)","tip":"part of why S + V: why 절의 동사는 시제에 맞춰야 합니다."},"ans":3,"ch":["① properly","② when","③ why","④ recognizing"]},
{"id":14,"type":"문장삽입","diff":"보통","pts":5,"fmt":"mc","passage":"( ① ) King Jeongjo was also making a statement about the Joseon Dynasty's strength. He dressed up like a military leader, wearing armor and sitting on a horse with his soldiers marching in perfect order. ( ② ) It was a way of saying, \"We're ready to protect our land.\" He was really serious about making the Joseon Dynasty a powerful and successful kingdom. ( ③ ) Now, here's the twist: the procession also had something to do with Hwaseong Fortress, which was being built. ( ④ ) He wanted it to be a self-sufficient city with a strong military, farming, and trade.","stem":"다음 문장이 들어갈 위치로 가장 적절한 곳은?<br><br><b>\"In King Jeongjo's mind were big plans for Hwaseong.\"</b>","det":{"korean":"'정조의 마음속에는 화성에 대한 큰 계획이 있었다'는 화성 요새 건설 언급 직후, 구체적 계획 설명 직전에 와야 한다.","analysis":"✅ ④ 화성 요새 언급(③) 후 → 마음속 큰 계획 → 자급자족 도시 설명으로 이어짐 ❌ ① 힘 과시 앞에 오면 맥락 부적절 ❌ ② 갑옷 장면 사이에 끼면 흐름 단절 ❌ ③ twist 도입 앞에 오면 전환이 부자연스러움","tip":"문장삽입 — 'big plans for Hwaseong'은 화성 언급 직후, 구체적 내용 직전에 위치."},"ans":3,"ch":["①","②","③","④"]},
{"id":15,"type":"순서배열","diff":"보통","pts":5,"fmt":"mc","passage":"<b>[주어진 글]</b> He made sure everything was documented properly by creating records for the procession and the construction of Hwaseong Fortress.<br><br><b>(A)</b> But after checking out translated documents and comparing them with the restored fortress, they finally came around and agreed that the fortress had actually been restored just the way it was meant to be.<br><br><b>(B)</b> These construction records were especially a lifesaver when the fortress was damaged during wartime. They were even part of why UNESCO recognized Hwaseong Fortress as a World Heritage Site.<br><br><b>(C)</b> At first, the people at UNESCO were a bit unsure about recognizing Hwaseong Fortress as the real deal. They weren't totally convinced it was authentic.","stem":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?","det":{"korean":"기록 작성(주어진 글) → (B) 기록이 전쟁 복구에 도움 + 유네스코 인정 → (C) 처음에 유네스코가 진정성 의심 → (A) 문서 확인 후 인정","analysis":"✅ ② (B)-(C)-(A): 기록 활용 → 의심 → 확인 후 인정 ❌ ① (A)-(B)-(C): A의 'But'이 먼저 오면 대조 대상 없음 ❌ ③ (C)-(A)-(B): B의 유네스코 첫 언급이 뒤로 밀림 ❌ ④ (C)-(B)-(A): 논리 역전","tip":"순서배열 — (B)의 'These records'가 주어진 글의 records를 받고, (C)의 'At first'와 (A)의 'But'이 대조 관계."},"ans":1,"ch":["(A)-(B)-(C)","(B)-(C)-(A)","(C)-(A)-(B)","(C)-(B)-(A)"]},
{"id":16,"type":"TF","diff":"어려움","pts":6,"fmt":"mc","passage":"The first thing King Jeongjo had in mind was to show respect to his family. It happened around his mother's sixtieth birthday. Back in the Joseon Dynasty, just like today, turning 60 years old had a special meaning. And his father's tomb was near Hwaseong Haenggung. He was planning to hold a memorial service to honor his late father. By combining the two events, he was telling everyone how much family meant to him.","stem":"위 글의 내용과 일치하는 것을 <b>모두</b> 고른 것은?<br><br>ⓐ 행차는 어머니의 50세 생일 무렵에 이루어졌다.<br>ⓑ 조선시대에 60세는 특별한 의미가 있었다.<br>ⓒ 아버지의 묘는 화성행궁 근처에 있었다.<br>ⓓ 정조는 두 행사를 결합하여 가족의 중요성을 보여주었다.","det":{"korean":"ⓐ 60세(sixtieth)이지 50세가 아님 → 거짓. ⓑ 원문 일치 → 참. ⓒ 원문 일치 → 참. ⓓ 원문 일치 → 참.","analysis":"❌ ① ⓐ, ⓑ: ⓐ가 거짓 ❌ ② ⓐ, ⓑ, ⓒ: ⓐ가 거짓 ✅ ③ ⓑ, ⓒ, ⓓ: 모두 참 ❌ ④ ⓐ, ⓑ, ⓒ, ⓓ: ⓐ가 거짓","tip":"sixtieth = 60번째. 50이 아닌 60입니다. 숫자를 정확히 확인하세요."},"ans":2,"ch":["ⓐ, ⓑ","ⓐ, ⓑ, ⓒ","ⓑ, ⓒ, ⓓ","ⓐ, ⓑ, ⓒ, ⓓ"]},
{"id":17,"type":"무관문장","diff":"어려움","pts":6,"fmt":"mc","passage":"① Through the procession, King Jeongjo made government more accessible. ② During that time, the government used to hold exams to hire officials every three years. ③ The Joseon Dynasty was founded in 1392 by General Yi Seong-gye and lasted for over 500 years. ④ He added special exams during the procession, giving more people a shot at joining the government.","stem":"전체 흐름과 관계없는 문장은?","det":{"korean":"글 흐름: 행렬로 정부 접근성 향상(①) → 기존 3년 주기 시험(②) → 특별 시험 추가(④). ③ '조선 건국(1392년)'은 주제(정부 접근성/특별 시험)와 무관.","analysis":"✅ ③ 조선 건국 연도는 행렬 중 특별 시험이라는 주제와 관련 없음 ❌ ① 정부 접근성 주제 ❌ ② 기존 시험 제도 배경 ❌ ④ 특별 시험 추가 내용","tip":"무관문장 — 주제 키워드(accessible, exams, shot at joining)와 관련 없는 문장을 찾으세요."},"ans":2,"ch":["①","②","③","④"]},
{"id":18,"type":"서술형","diff":"어려움","pts":6,"fmt":"written","passage":"Lasting four days and covering 68 kilometers, the procession moved alongside the king and his mother as they made a round trip to Hwaseong Haenggung.","stem":"다음 요약문의 빈칸에 들어갈 적절한 단어를 본문에서 찾아 쓰시오.<br><br><b>[조건]</b> 본문에 사용된 단어 그대로, 한 단어<br><br><b>[요약문]</b><br>The four-day procession covered 68 __________ as the king and his mother traveled to Hwaseong Haenggung and back.","det":{"korean":"4일간의 행렬은 68<b>킬로미터(kilometers)</b>를 이동했다.","analysis":"정답: kilometers","tip":"covering 68 kilometers = 68킬로미터에 걸쳐."},"wa":"kilometers","accept":["kilometers","Kilometers","KILOMETERS"," kilometers","kilometers ","kilometres","Kilometres"]},
{"id":19,"type":"서술형","diff":"어려움","pts":6,"fmt":"written","passage":"Hwaseong is more than just a fortress; it symbolizes a king who cared for his people. And this is a significant part of Korean cultural heritage.","stem":"다음 보기의 단어를 활용하여 우리말을 영작하시오.<br><br><b>[조건]</b> 주어진 단어를 모두 사용, 필요시 형태 변형, 한 문장<br><br><b>[보기]</b> Hwaseong / more / just / a fortress / it / symbolize / a king<br><br><b>[우리말]</b> 화성은 단순한 요새 이상이다; 그것은 왕을 상징한다.","det":{"korean":"화성은 단순한 요새 이상이다; 그것은 왕을 상징한다.","analysis":"원문 기반: Hwaseong is more than just a fortress; it symbolizes a king.","tip":"more than just = 단순한 ~이상. symbolize → symbolizes (3인칭 단수)."},"wa":"Hwaseong is more than just a fortress; it symbolizes a king.","accept":["Hwaseong is more than just a fortress; it symbolizes a king.","Hwaseong is more than just a fortress; it symbolizes a king","hwaseong is more than just a fortress; it symbolizes a king.","hwaseong is more than just a fortress; it symbolizes a king","Hwaseong is more than just a fortress, it symbolizes a king.","Hwaseong is more than just a fortress. It symbolizes a king."]},
{"id":20,"type":"서술형","diff":"어려움","pts":6,"fmt":"written","passage":"Once people got wind of King Jeongjo's plan, workers from all over the country came together in a rush. So, in under three years was the project finished, though it was initially thought to take about 10 years.","stem":"괄호 안의 단어를 올바른 형태로 바꿔 쓰시오.<br><br><b>[조건]</b> 한 단어<br><br><b>[문장]</b><br>The project was (initial) __________ thought to take about 10 years.","det":{"korean":"그 프로젝트는 <b>처음에</b> 약 10년이 걸릴 것으로 예상되었다. initial(형용사) → initially(부사).","analysis":"원문: it was initially thought to take about 10 years.","tip":"initial(형용사: 처음의) → initially(부사: 처음에). 동사 thought를 수식하므로 부사."},"wa":"initially","accept":["initially","Initially","INITIALLY"," initially","initially "]}];

let S = { ans: [], cur: 0, ti: null, left: EI.time, start: 0 };

function getHistory() {
  try { return JSON.parse(localStorage.getItem(EI.histKey) || '[]'); }
  catch (e) { return []; }
}

function saveToHistory(r, elapsed) {
  const h = getHistory();
  h.unshift({
    name: document.getElementById('inpName').value.trim(),
    school: document.getElementById('inpSchool').value.trim(),
    grade: document.getElementById('inpGrade').value,
    score: r.score, total: EI.total,
    correct: r.correct, wrong: r.wrong, unanswered: r.unanswered,
    elapsed, date: new Date().toISOString(),
    level: getLevel(r.score).name,
    answers: S.ans.slice()
  });
  if (h.length > 20) h.length = 20;
  localStorage.setItem(EI.histKey, JSON.stringify(h));
}

function updateHCount() {
  const h = getHistory();
  document.getElementById('hCount').textContent = h.length;
}

    p.style.display = 'block'; return;

function fmtTime(s) { return Math.floor(s / 60) + '\ubd84 ' + s % 60 + '\ucd08'; }

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2500);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function showQ(idx, direction) {

function initSwipe() {
  var startX = 0, startY = 0;
  var el = document.getElementById('slideWrap');
  el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {

      if (dx > 0 && S.cur > 0) navQ(-1);
    }
  }, { passive: true });
}

function submitExam() {
  if (!confirm('\uc81c\ucd9c\ud558\uc2dc\uaca0\uc2b5\ub2c8\uae4c?')) return;
  clearInterval(S.ti);
  var elapsed = Math.floor((Date.now() - S.start) / 1000);

  saveToHistory(r, elapsed);

function grade() {
  var score = 0, correct = 0, wrong = 0, unanswered = 0;
  var details = [];
  var qs = S.filtered ? S.filtered.map(function (i) { return Q[i]; }) : Q;
  qs.forEach(function (q, i) {
    var a = S.ans[i];
    var ok = false;
    if (a === null) unanswered++;
    else if (q.fmt === 'mc') ok = a === q.ans;
    else {
      var u = String(a).trim().toLowerCase();
      if (q.accept) ok = q.accept.some(function (x) { return u === x.toLowerCase(); });
      if (!ok && q.wa) ok = u === q.wa.toLowerCase();
    }
    if (a !== null) { if (ok) { correct++; score += q.pts; } else wrong++; }
    details.push({ q: q, ans: a, ok: ok });
  });
  return { score: score, correct: correct, wrong: wrong, unanswered: unanswered, details: details };
}

  var pc = pass ? '#16A34A' : '#D63B3B';
  var card = '<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">';
  card += '<div style="background:linear-gradient(135deg,' + (pass ? '#E8F5E9,#C8E6C9' : '#FFF0F0,#FFEAEA') + ');padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:' + pc + ';margin-bottom:4px">\ub0b4\uc2e0\ud56b ' + tn + '</div><div style="font-size:13px;color:#666;margin-bottom:16px">' + EI.subject + ' \u00b7 ' + EI.pub + '</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">' + r.score + '<span style="font-size:20px;color:#aaa">/' + EI.total + '</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:' + pc + ';color:#fff">' + lv.icon + ' ' + lv.name + ' \u00b7 ' + (pass ? '\ud1b5\uacfc' : '\ubbf8\ud1b5\uacfc') + '</span></div><div style="margin-top:12px;font-size:12px;color:#888">\ud83d\udc64 ' + nm + ' \u00b7 \u2705' + r.correct + ' \u274c' + r.wrong + ' \u2b1c' + r.unanswered + '</div></div>';
  if (wk.length) {
    card += '<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">\ud83d\udd0d \ub0b4\uc2e0\ud56b \uc57d\uc810 \uc9c4\ub2e8</div>';
    Object.entries(tm).forEach(function (entry) {
      var type = entry[0], d = entry[1];
      var p = Math.round(d.ok / d.total * 100);
      var c = p === 100 ? '#16A34A' : p >= 50 ? '#F59E0B' : '#D63B3B';
      card += '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">' + type.replace(/\(.+?\)/g, '').trim() + '</span><span style="font-weight:800;color:' + c + '">' + d.ok + '/' + d.total + '</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:' + p + '%;background:' + c + ';border-radius:3px"></div></div></div>';
    });
    card += '</div>';
  }
  card += '<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">\ud83d\udcca <b style="color:#333">\ub0b4\uc2e0\ud56b</b> | \ub0b4\uc2e0 \uc601\uc5b4 \uc644\ubcbd \ub300\ube44</div></div>';
  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-9999px;top:0;';
  wrap.innerHTML = card;
  document.body.appendChild(wrap);
  html2canvas(wrap.firstChild, { scale: 2, backgroundColor: null, useCORS: true }).then(function (canvas) {
    document.body.removeChild(wrap);
    canvas.toBlob(function (blob) {
      if (navigator.share && blob) {
        var file = new File([blob], '\ub0b4\uc2e0\ud56b_' + tn + '_\uacb0\uacfc.png', { type: 'image/png' });
        navigator.share({ files: [file], title: '\ub0b4\uc2e0\ud56b ' + tn + ' \uacb0\uacfc' }).catch(function () {});
      } else {
        var a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = '\ub0b4\uc2e0\ud56b_' + tn + '_\uacb0\uacfc.png';
        a.click();
      }
      toast('\ud83d\udcf8 \uacb0\uacfc \uc774\ubbf8\uc9c0\uac00 \uc800\uc7a5\ub418\uc5c8\uc2b5\ub2c8\ub2e4!');
    });
  }).catch(function () { toast('\uc774\ubbf8\uc9c0 \uc0dd\uc131 \uc2e4\ud328'); });
}

function reviewHistory(idx) {
  var h = getHistory();
  var rec = h[idx];
  if (!rec || !rec.answers) return toast('\uc774\uc804 \ubc84\uc804 \uae30\ub85d\uc740 \ud574\uc124\uc744 \ubcfc \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.');
  S.ans = rec.answers;
  S.start = Date.now() - rec.elapsed * 1000;
  document.getElementById('inpName').value = rec.name || '';
  document.getElementById('inpSchool').value = rec.school || '';
  document.getElementById('inpGrade').value = rec.grade || '\uace01';
  var r = grade();
  renderResults(r, rec.elapsed);
  showScreen('resultScreen');
  window.scrollTo(0, 0);
}

function retake() { location.reload(); }
function goHome() { showScreen('startScreen'); updateHCount(); }

window.addEventListener('beforeunload', function (e) {
  if (S.ti) { e.preventDefault(); e.returnValue = ''; }
});

updateHCount();
</script>
</body>
</html>
