<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영어Ⅰ 천재(조수경) 온라인퀴즈TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* NaesinFit — Orange Theme (퀴즈테스트) */
:root{
  --p:#E8772E;--pd:#B85A1A;--pl:#F5A623;--pxl:#FFF3E8;--pxxl:#FFFAF5;
  --bg:#F6F2EE;--text:#1A1A2E;--tm:#7A6A5E;--tl:#A89A8E;
  --r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;
  --o:#F59E0B;--ol:#FFF8E1;
  --card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);
  --radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;
  --pborder:#ddd8d2;--pbg-muted:#e8e0d8;
  --passage-bg:linear-gradient(135deg,#FFFAF8,#F5F0EB);
  --start-grad:linear-gradient(160deg,#FFF3E8,#FFE8D6 40%,#FFDDC8);
  --accent2:#D97706;
  --p-rgba-08:rgba(232,119,46,.08);
  --p-rgba-10:rgba(232,119,46,.1);
  --p-rgba-12:rgba(232,119,46,.12);
  --p-rgba-25:rgba(232,119,46,.25);
  --p-rgba-30:rgba(232,119,46,.3);
}

/* NaesinFit Test Engine — Common CSS (theme-agnostic)
   Theme-specific colors come from :root variables defined in theme-*.css:
   --p      : primary color
   --pd     : primary dark
   --pl     : primary light
   --pxl    : primary extra-light
   --pxxl   : primary xx-light
   --bg     : page background
   --text   : main text
   --tm     : text muted
   --tl     : text light
   --pborder: border color (theme-tinted)
   --pbg-muted: muted bg for tracks/bars
   --start-grad: startScreen gradient
   --accent2: secondary gradient stop (badge/header)
   --p-rgba-08: rgba for selected bg
   --p-rgba-12: rgba for box-shadow
   --p-rgba-10: rgba for focus ring
   --p-rgba-25: rgba for button shadow
   --p-rgba-30: rgba for selectPulse
*/

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Start Screen */
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:var(--start-grad);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--p),var(--accent2));color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--p),var(--accent2));padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid var(--pborder);}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid var(--pborder);border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid var(--pborder);border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-rgba-10);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;box-shadow:0 6px 20px var(--p-rgba-30);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid var(--pborder);color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--p);color:var(--p);}
.history-badge{background:var(--pxl);color:var(--p);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid var(--pborder);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--p);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}

/* Exam Screen */
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--p);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--p);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--p);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--accent2));transition:width .5s ease;border-radius:0 2px 2px 0;}

/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--pxl),var(--pl));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--pd);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:10px 14px 14px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
.slide-choices{display:flex;flex-direction:column;gap:3px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12px;line-height:1.3;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--p);background:var(--p-rgba-08);box-shadow:0 0 0 3px var(--p-rgba-12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 var(--p-rgba-30)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:20px;height:20px;font-size:10px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--p-rgba-10);}
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;box-shadow:0 2px 8px var(--p-rgba-25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--p);}
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--p);background:var(--pxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}

/* Type tags — same across all themes */
.tag-combo{background:#E8F5E9;color:#166534;}.tag-wrong{background:#FFF0F0;color:#D63B3B;}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:#EDF2FF;color:#3B6FD9;}.tag-ant{background:#FFF8E1;color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}.tag-insert{background:#E3F2FD;color:#1565C0;}.tag-order{background:#FFF8E1;color:#F57F17;}

.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:var(--pbg-muted);padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--p);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:var(--passage-bg);border-left:3px solid var(--p);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--pborder);border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--p);}.choice-btn.selected{border-color:var(--p);box-shadow:0 0 0 2px var(--p-rgba-12);background:var(--pxxl);}
.c-num{min-width:22px;height:22px;background:var(--pbg-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid var(--pborder);border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--p);}

/* Result Screen */
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--pxl),var(--pl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:var(--pbg-muted);border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--pl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--pxxl);border-radius:var(--rs);border:1px solid var(--pborder);}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--pxl);}.info-cell.highlight .ic-value{color:var(--p);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:var(--pbg-muted);border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--pl);color:var(--p);}.tag-item.weak{background:#FFF0F0;color:#D63B3B;}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--pxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid var(--pborder);border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--p);color:var(--p);}.act-btn.primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid var(--pborder);border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--pxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--pxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--pl);color:var(--p);}.expl-tag.tip{background:var(--pxl);color:var(--pd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--p);}.expl-box.tip-b{border-left:3px solid var(--p);background:var(--pxl);}

@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">온라인퀴즈 TEST</div>
  <h1 class="start-title">온라인퀴즈 <span>TEST</span></h1>
  <p class="start-subtitle">영어Ⅰ · 천재(조수경) · 4과 · 20문항</p>
  <div class="info-card"><div class="info-card-header">시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">영어Ⅰ</span></div>
    <div class="info-row"><span class="info-label">문항</span><span class="info-value">천재(조수경) (4과)</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">From a Kid to a Champion</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">20문항</div><div class="chip">20분</div><div class="chip">80점 이상 통과</div><div class="chip">100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="startExam()">시험 시작하기</button>
  <button class="btn btn-outline" onclick="toggleHistory()">시험 기록 보기 <span class="history-badge" id="hCount">0</span></button>
  <div id="historyPanel"></div>
</div>
</div>

<div id="examScreen" class="screen">
  <div class="exam-topbar"><div class="topbar-left"><div class="topbar-dot"></div><div class="topbar-info">영어Ⅰ · <span>천재(조수경)</span></div></div><div class="timer" id="timer">20:00</div><button class="btn-submit" onclick="submitExam()">제출하기</button></div>
  <div class="exam-progress"><div class="exam-progress-fill" id="progressFill"></div></div>
  <div class="ans-count" id="ansCount">0/20</div>
  <div class="exam-scroll" id="examScroll"></div>

const FULL_PASSAGE="In a marathon, a key reason a front runner can reach the finish line after that long journey is the presence of a pacemaker. The pacemaker helps maintain a ①<u>steady</u> pace for the front runner, ②<u>shielding</u> the front runner from the headwind. Without the pacemaker, the front runner has to ③<u>cope with</u> the harsh wind alone and put in extra effort to maintain the pace. In Formula One, the world's largest car race series, each team enters two cars. Both drivers try their best for victory, but for the team's win, one person employs strategies such as ④<u>assisting</u> or obstructing other vehicles so that their teammate can get ahead. In rock climbing, individual skills are essential, but when a mistake is made, the person referred to as the belay partner manages the rope to ⑤<u>prevent</u> a fall.";
const Q=[{"id":1,"type":"어법","diff":"쉬움","pts":4,"fmt":"mc","passage":"My name is Bliksem, which means \"lightning.\" My parents named me this because they wanted me to be faster than anyone else. Born in the Netherlands, a country with more bicycles than people, I learned to ride a bike almost as soon as I could walk. I loved <u>ⓐ feeling</u> the breeze in my hair. When I was eleven, a junior bicycle race <u>ⓑ was held</u> in our small town. I entered the race as the youngest rider. Before the race started, I looked around the crowd, and I <u>ⓒ couldn't believe</u> my eyes! My hero, Gabriel Martinez, the cycling world champion, was <u>ⓓ stood</u> there! I ran over and asked, \"You're Gabriel Martinez, right? Can I have your autograph?\" He smiled and said, \"If you win, you can.\" <u>ⓔ Excited</u> by what he said, I pedaled harder than ever.","stem":"윗글의 밑줄 친 ⓐ~ⓔ 중에서 어법상 어색한 것은?","det":{"korean":"나의 영웅, 사이클 세계 챔피언 Gabriel Martinez가 그곳에 서 있었다! 과거진행형 was standing이 원문이므로, stood는 어법상 어색합니다. be동사 + 현재분사(-ing)가 진행형을 만드는 구조이며, was stood는 수동태처럼 보이지만 stand는 자동사이므로 수동태가 불가합니다.","analysis":"원문: My hero, Gabriel Martinez, the cycling world champion, was standing there!","tip":"어법 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":3,"ch":["ⓐ feeling","ⓑ was held","ⓒ couldn't believe","ⓓ stood"]},
{"id":2,"type":"어법","diff":"쉬움","pts":4,"fmt":"mc","passage":"As a domestique, <u>(A) who / which</u> supports the leader and the team during a cycling race, I was riding in front of Gabriel to shield him from the headwind. Our team was far ahead of the others. Everything was going perfectly until I crashed due to a crack in the road. All four of us fell in the crash, and the other teams passed us by. I was just slightly wounded, but Gabriel's injury was more serious. He urged me <u>(B) to continue / continuing</u> on his behalf. But there were a couple of more steep slopes ahead, and I doubted <u>(C) that / what</u> we had a chance.","stem":"윗글의 (A), (B), (C)에서 어법에 맞는 표현으로 가장 적절한 것은?","det":{"korean":"리더와 팀을 지원하는 도메스틱으로서... 그는 나에게 자신을 대신하여 계속 달리라고 촉구했다... 나는 우리에게 기회가 있는지 의심했다. (A) 선행사 a domestique는 사람이므로 관계대명사 who 사용. (B) urge + 목적어 + to-v(5형식). (C) doubt + that절(~인지를 의심하다).","analysis":"원문: As a domestique, who supports the leader... He urged me to continue on his behalf... I doubted that we had a chance.","tip":"어법 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["(A) who − (B) to continue − (C) that","(A) who − (B) continuing − (C) what","(A) which − (B) to continue − (C) that","(A) which − (B) continuing − (C) what"]},
{"id":3,"type":"어법","diff":"쉬움","pts":4,"fmt":"mc","passage":"Gabriel's final race was the Paris-Roubaix, a 250 km race <u>ⓐ famed</u> for its cobblestone sections. These bumpy roads were a true test of endurance, talent, and mental power for every cyclist. As the race started, I focused on my strategy and my desire to win. However, the rocky and cobblestone track <u>ⓑ causing</u> a flat tire and I could not continue. Gabriel offered me his bike without hesitation, <u>ⓒ saying</u>, \"I remember your finishing the race two laps ahead of everyone when I first met you. Never stop pedaling, kid. I'll catch up.\" The rest of the members urged me on and we continued, <u>ⓓ pushing</u> ourselves to our limits.","stem":"윗글의 밑줄 친 ⓐ~ⓓ 중에서 어법상 어색한 것은?","det":{"korean":"그러나 울퉁불퉁한 자갈길이 타이어 펑크를 일으켰고 나는 계속할 수 없었다. 원문에서는 caused(과거형)이 사용되었습니다. causing은 분사구문이 아니라 주절의 동사 자리이므로 과거형 caused가 올바릅니다. and 뒤에 I could not continue라는 절이 등위접속사로 연결되어 있으므로 앞에도 동사(caused)가 필요합니다.","analysis":"원문: However, the rocky and cobblestone track caused a flat tire and I could not continue.","tip":"어법 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":1,"ch":["ⓐ famed","ⓑ causing","ⓒ saying","ⓓ pushing"]},
{"id":4,"type":"어휘","diff":"쉬움","pts":4,"fmt":"mc","passage":"When I turned nineteen, he brought me into his professional team, where only the most skilled and passionate cyclists came together. I felt small and <u>(A) insignificant / significant</u>. I could sprint the fastest on flat courses, but I always fell behind in mountain races. The Netherlands is mostly flat, so I had rarely cycled up steep slopes before. Gabriel was from Bogot&aacute;, Colombia, which is high up in the Andes. He had a lot of experience in riding on hills and mountains, so he was always the first to arrive at the top. He would say, \"Riding uphill is <u>(B) painful / painless</u>, but the view at the top is fantastic. Never stop pedaling, kid.\" Motivated by Gabriel's <u>(C) encouragement / discouragement</u>, I participated eagerly in all the training courses, especially the uphill ones.","stem":"윗글의 (A), (B), (C)에서 문맥상 흐름에 맞는 낱말로 가장 적절한 것은?","det":{"korean":"나는 작고 하찮게 느꼈다. / 오르막을 타는 것은 고통스럽다 / Gabriel의 격려에 의해 동기부여를 받아. (A) 프로팀에 들어가 실력 있는 선수들 사이에서 '하찮은(insignificant)' 존재로 느꼈다는 문맥. (B) 오르막 라이딩은 '고통스럽지만(painful)' 정상의 경치는 환상적이라는 대조 구문. (C) Gabriel의 '격려(encouragement)'에 동기부여를 받아 열심히 훈련했다는 문맥.","analysis":"원문: I felt small and insignificant. / Riding uphill is painful / Motivated by Gabriel's encouragement","tip":"어휘 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["(A) insignificant − (B) painful − (C) encouragement","(A) significant − (B) painful − (C) encouragement","(A) insignificant − (B) painless − (C) discouragement","(A) significant − (B) painless − (C) encouragement"]},
{"id":5,"type":"어휘","diff":"쉬움","pts":4,"fmt":"mc","passage":"In a marathon, a key reason a front runner can reach the finish line after that long journey is the presence of a pacemaker. The pacemaker helps maintain a ①<u>steady</u> pace for the front runner, ②<u>shielding</u> the front runner from the headwind. Without the pacemaker, the front runner has to ③<u>cope with</u> the harsh wind alone and put in extra effort to maintain the pace. In Formula One, the world's largest car race series, each team enters two cars. Both drivers try their best for victory, but for the team's win, one person employs strategies such as ④<u>assisting</u> or obstructing other vehicles so that their teammate can get ahead. In rock climbing, individual skills are essential, but when a mistake is made, the person referred to as the belay partner manages the rope to ⑤<u>prevent</u> a fall.","stem":"윗글의 밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"한 사람은 팀 동료가 앞서 나갈 수 있도록 다른 차량을 막거나 방해하는 전략을 사용한다. 원문에서는 blocking(차단)이 사용되었으나, ④에서 assisting(돕는)으로 바뀌어 있어 문맥과 맞지 않습니다. 다른 차량을 '돕는' 것이 아니라 '차단하는(blocking)' 것이 팀 전략입니다.","analysis":"원문: one person employs strategies such as blocking or obstructing other vehicles so that their teammate can get ahead.","tip":"어휘 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":3,"ch":["① steady","② shielding","③ cope with","④ assisting"]},
{"id":6,"type":"어휘","diff":"보통","pts":5,"fmt":"mc","passage":"Pedaling with all my strength, I finished second in that race, but I felt a sense of ①<u>guilt</u> for my fellow team members. I should have been more careful. If I had not crashed, Gabriel would have come in first place, and our team would have won. Surprisingly, Gabriel gave me a gentle hug and said, \"I knew you could do it. I'm so ②<u>proud</u> of you!\" For several years, I ③<u>assisted</u> Gabriel in races as a domestique. As we cycled together, our team's results ④<u>declined</u>. When the time came for his retirement, Gabriel asked the members if I could lead the team in his final race. He said he could no longer ride faster than me in the last sprint to the finish line and ⑤<u>insisted</u> that I ought to be the team leader.","stem":"윗글의 밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"우리가 함께 자전거를 타면서 팀의 성적은 번창했다(좋아졌다). 원문에서는 flourished(번창했다)가 사용되었으나, ④에서 declined(하락했다)로 바뀌어 있어 문맥과 반대입니다. 둘이 함께 달리며 팀 성적이 좋아졌다는 긍정적 흐름이 맞습니다.","analysis":"원문: As we cycled together, our team's results flourished.","tip":"어휘 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":3,"ch":["① guilt","② proud","③ assisted","④ declined"]},
{"id":7,"type":"대의","diff":"보통","pts":5,"fmt":"mc","passage":"My name is Bliksem, which means \"lightning.\" Born in the Netherlands, I learned to ride a bike almost as soon as I could walk. When I was eleven, Gabriel Martinez gave me his autograph after I won a junior race. Since then, Gabriel has been my mentor. He brought me into his professional team, and his encouragement helped me overcome my weakness in mountain races. In his final race, he gave me his bike when I got a flat tire, and our teammates helped me win. As I stood on the podium, Gabriel called me \"Captain\" for the first time.","stem":"윗글의 주제로 가장 적절한 것은?","det":{"korean":"[원문] 전체 줄거리 요약: Bliksem은 어린 시절 Gabriel Martinez를 만나 멘토로 삼고, 프로팀에 합류하여 격려와 지도를 받으며 약점을 극복하고 성장합니다. Gabriel의 마지막 경주에서 팀의 도움으로 우승하고, Gabriel은 Bliksem을 'Captain'이라 부르며 리더십을 물려줍니다.","analysis":"원문: 전체 줄거리 요약: Bliksem은 어린 시절 Gabriel Martinez를 만나 멘토로 삼고, 프로팀에 합류하여 격려와 지도를 받으며 약점을 극복하고 성장합니다. Gabriel의 마지막 경주에서 팀의 도움으로 우승하고, Gabriel은 Bliksem을 'Captain'이라 부르며 리더십을 물려줍니다.","tip":"대의 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["멘토의 격려와 지원을 통한 성장과 리더십의 계승","개인 기량만으로 챔피언이 되는 방법","네덜란드 자전거 문화가 스포츠에 미치는 영향","팀 스포츠에서 경쟁심이 승리를 이끄는 원리"]},
{"id":8,"type":"대의","diff":"보통","pts":5,"fmt":"mc","passage":"While it is true that individual skills are the most important in the world of sports, having a partner who can cooperate with the player with those skills is equally important. In a marathon, a pacemaker helps maintain a steady pace for the front runner, shielding the front runner from the headwind. In Formula One, one person employs strategies such as blocking or obstructing other vehicles so that their teammate can get ahead. In rock climbing, the belay partner manages the rope to prevent a fall. Similarly, in scuba diving, all divers are paired up with a buddy responsible for each other's safety. No matter how exceptional your skills may be, you cannot do it alone.","stem":"윗글의 제목으로 가장 적절한 것은?","det":{"korean":"아무리 뛰어난 기량을 가지고 있더라도, 혼자서는 해낼 수 없다. 이 문장이 글의 핵심 주장이며, 파트너의 존재가 스포츠에서 얼마나 중요한지를 다양한 예시(마라톤, F1, 암벽등반, 스쿠버다이빙)로 뒷받침합니다.","analysis":"원문: No matter how exceptional your skills may be, you cannot do it alone.","tip":"대의 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["No One Succeeds Alone: The Power of Partners","How to Become a Great Athlete by Yourself","Extreme Sports: Risk and Reward","The Secret Behind Winning Every Competition"]},
{"id":9,"type":"대의","diff":"보통","pts":5,"fmt":"mc","passage":"He said, \"That trophy is yours, Captain.\" It was the first time he had not addressed me as \"kid.\" My teammates approached me as tears welled up in my eyes, saying, \"We're counting on you, Captain.\" For several years, I assisted Gabriel in races as a domestique. When the time came for his retirement, Gabriel insisted that I ought to be the team leader. I was deeply touched and felt a burden on my shoulders. I was determined to make him proud.","stem":"윗글을 통해 알 수 있는 시사점으로 가장 적절한 것은?","det":{"korean":"\"그 트로피는 네 것이다, 캡틴.\" / Gabriel은 내가 팀 리더가 되어야 한다고 주장했다. / 나는 그를 자랑스럽게 만들겠다고 결심했다. Gabriel은 Bliksem을 kid에서 Captain으로 성장시키며 자연스럽게 리더십을 물려주었고, Bliksem은 그 책임감을 받아들입니다.","analysis":"원문: \"That trophy is yours, Captain.\" / Gabriel insisted that I ought to be the team leader. / I was determined to make him proud.","tip":"대의 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["진정한 리더는 후배를 성장시키고, 그 과정에서 리더십은 자연스럽게 계승된다.","스포츠에서 가장 중요한 것은 개인의 재능이며, 팀워크는 부차적이다.","경쟁에서 이기기 위해서는 동료를 희생시키는 것도 불가피하다.","은퇴 시기를 스스로 결정하는 것이 프로 선수의 의무이다."]},
{"id":10,"type":"일치","diff":"보통","pts":5,"fmt":"mc","passage":"My name is Bliksem, which means \"lightning.\" Born in the Netherlands, a country with more bicycles than people, I learned to ride a bike almost as soon as I could walk. When I was eleven, a junior bicycle race was held in our small town. I entered the race as the youngest rider. I came in first and Gabriel was waiting at the finish line. As promised, he handed me his autograph saying, \"You outran the others by two laps! You're a real racer, kid!\"","stem":"윗글의 Bliksem에 관한 내용으로 일치하는 것은?","det":{"korean":"네덜란드에서 태어나... 나는 걸을 수 있게 되자마자 자전거 타는 법을 배웠다. 이 문장이 ②와 정확히 일치합니다.","analysis":"원문: Born in the Netherlands... I learned to ride a bike almost as soon as I could walk.","tip":"일치 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":1,"ch":["Bliksem이라는 이름은 \"천둥\"이라는 뜻이다.","네덜란드에서 태어나 걸을 수 있게 되자마자 자전거 타는 법을 배웠다.","열한 살 때 주니어 대회에서 가장 나이 많은 선수로 참가했다.","경주에서 2위를 하여 Gabriel의 사인을 받지 못했다."]},
{"id":11,"type":"불일치","diff":"보통","pts":5,"fmt":"mc","passage":"Gabriel's final race was the Paris-Roubaix, a 250 km race famed for its cobblestone sections. These bumpy roads were a true test of endurance, talent, and mental power for every cyclist. As the race started, I focused on my strategy and my desire to win. However, the rocky and cobblestone track caused a flat tire and I could not continue. Gabriel offered me his bike without hesitation. The rest of the members urged me on and we continued, pushing ourselves to our limits. When there were only 10 km left in the race, Gabriel caught up with us on a new bicycle. He cut in front of me and said, \"Save your energy now for the final sprint.\"","stem":"윗글의 내용과 일치하지 않는 것은?","det":{"korean":"경주에서 10km만 남았을 때, Gabriel이 새 자전거를 타고 우리를 따라잡았다. ④에서 '50km 지점'이라고 했지만 원문은 '10km 남았을 때'이므로 불일치합니다.","analysis":"원문: When there were only 10 km left in the race, Gabriel caught up with us on a new bicycle.","tip":"불일치 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":3,"ch":["Paris-Roubaix는 자갈길 구간으로 유명한 250km 경주이다.","Bliksem은 자갈길 구간에서 타이어 펑크가 났다.","Gabriel은 주저 없이 Bliksem에게 자신의 자전거를 내주었다.","Gabriel은 새 자전거로 남은 50km 지점에서 합류했다."]},
{"id":12,"type":"빈칸","diff":"보통","pts":5,"fmt":"mc","passage":"Since then, Gabriel has been my mentor. When I turned nineteen, he brought me into his professional team, where only the most skilled and passionate cyclists came together. I felt small and insignificant. I could sprint the fastest on flat courses, but I always fell behind in mountain races. Gabriel was from Bogot&aacute;, Colombia, which is high up in the Andes. He had a lot of experience in riding on hills and mountains, so he was always the first to arrive at the top. He would say, \"Riding uphill is painful, but the view at the top is fantastic. Never stop pedaling, kid.\"","stem":"윗글에서 Gabriel이 Bliksem에게 \"Never stop pedaling\"이라고 반복적으로 말한 이유로 빈칸에 가장 적절한 것은?<br><br>Gabriel repeatedly told Bliksem to \"never stop pedaling\" because he wanted to ___________.","det":{"korean":"\"오르막을 타는 것은 고통스럽지만, 정상의 경치는 환상적이야. 절대 페달 밟는 것을 멈추지 마, 꼬마야.\" Gabriel은 고통(painful) 속에서도 포기하지 않으면 보상(fantastic view)이 온다는 것을 가르치려 한 것입니다.","analysis":"원문: \"Riding uphill is painful, but the view at the top is fantastic. Never stop pedaling, kid.\"","tip":"빈칸 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["teach him that perseverance leads to success despite hardship","show off his own superior cycling skills","make him feel guilty about his poor performance","convince him to switch to a different sport"]},
{"id":13,"type":"빈칸","diff":"보통","pts":5,"fmt":"mc","passage":"While it is true that individual skills are the most important in the world of sports, having a partner who can cooperate with the player with those skills is equally important. In a marathon, the pacemaker helps maintain a steady pace, shielding the front runner from the headwind. In Formula One, one person employs strategies such as blocking other vehicles so that their teammate can get ahead. In rock climbing, the belay partner manages the rope to prevent a fall. Similarly, in scuba diving, buddies are responsible for each other's safety.","stem":"윗글의 빈칸에 들어갈 문장으로 가장 적절한 것은?<br><br>The main point of the passage is that in sports, _____________________.","det":{"korean":"아무리 뛰어난 기량을 갖고 있더라도, 혼자서는 해낼 수 없다. 파트너가 선수의 한계를 보완하고 성공에 필수적이라는 것이 글의 핵심 주장입니다.","analysis":"원문: No matter how exceptional your skills may be, you cannot do it alone.","tip":"빈칸 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["a reliable partner compensates for individual limitations and is essential for success","the strongest individual always leads the team to victory","teamwork is only needed in dangerous sports","partners are less important than personal effort and training"]},
{"id":14,"type":"함축","diff":"보통","pts":5,"fmt":"mc","passage":"The crowd roared tremendously. They focused on me since I was the first to cross the finish line. As I stood on the podium holding the trophy high, I felt like the glory should go to Gabriel. However, when I looked over, I could see the pride in his eyes. He said, \"That trophy is yours, Captain.\" It was the first time he had not addressed me as \"kid.\" My teammates approached me as tears welled up in my eyes, saying, \"We're counting on you, Captain.\"","stem":"윗글에서 Gabriel이 Bliksem을 \"Captain\"이라고 부른 것이 함축하는 바로 가장 적절한 것은?","det":{"korean":"\"그 트로피는 네 것이야, 캡틴.\" 그가 나를 '꼬마'라고 부르지 않은 것은 처음이었다. 지금까지 항상 'kid(꼬마)'라고 불렀던 Gabriel이 처음으로 'Captain(캡틴)'이라 부른 것은, Bliksem의 성장을 인정하고 리더로서의 지위를 공식 인정한 것입니다.","analysis":"원문: \"That trophy is yours, Captain.\" It was the first time he had not addressed me as \"kid.\"","tip":"함축 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["Bliksem이 더 이상 보호받아야 할 어린 후배가 아니라 팀을 이끌 리더로 성장했음을 인정한 것","Bliksem에게 군대식 규율을 따르라는 경고","Gabriel이 Bliksem과의 관계를 공식적으로 끝내려는 의도","Bliksem이 레이스에서 반칙으로 이겼다는 빈정거림"]},
{"id":15,"type":"순서","diff":"보통","pts":5,"fmt":"mc","passage":"As a domestique, I was riding in front of Gabriel to shield him from the headwind. Our team was far ahead of the others. Everything was going perfectly until I crashed due to a crack in the road.","stem":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?<br><br>(A) Gabriel read my mind and yelled, \"Remember the view at the top. Never stop pedaling whatever it takes, kid. Now go!\"<br>(B) All four of us fell in the crash, and the other teams passed us by. I was just slightly wounded, but Gabriel's injury was more serious. He urged me to continue on his behalf.<br>(C) Pedaling with all my strength, I finished second in that race, but I felt a sense of guilt for my fellow team members.","det":{"korean":"사고가 발생한 뒤 → 충돌 결과와 Gabriel의 촉구(B) → Bliksem의 망설임을 읽고 격려(A) → 결과로 2위 완주(C)의 시간순.","analysis":"❌ ① (A) → (B) → (C)<br>✅ ② (B) → (A) → (C)<br>❌ ③ (B) → (C) → (A)<br>❌ ④ (C) → (A) → (B)<br>❌ ⑤ (C) → (B) → (A)","tip":"순서 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":1,"ch":["(A) → (B) → (C)","(B) → (A) → (C)","(B) → (C) → (A)","(C) → (A) → (B)"]},
{"id":16,"type":"무관","diff":"어려움","pts":6,"fmt":"mc","passage":"Our speed increased as we approached the finish line, and my teammates worked hard to support me. ① When the finish line came into view, I began my final sprint with a rush of adrenaline, and our rivals were right on my tail, fighting for the same victory. ② The Paris-Roubaix course covers various terrains including farmland and forests across northern France. ③ Finally, I crossed the finish line ahead of my competitors by a nose. ④ The crowd roared tremendously. ⑤ They focused on me since I was the first to cross the finish line.","stem":"윗글에서 전체 흐름과 관계없는 문장은?","det":{"korean":"[원문] ②번 문장 \"The Paris-Roubaix course covers various terrains including farmland and forests across northern France.\"는 원문에 없는 삽입 문장입니다. 나머지 ①③④⑤는 결승선 스프린트와 우승 장면을 시간순으로 서술하는 흐름이지만, ②는 코스의 지리적 특성을 설명하는 문장으로 결승선 장면의 긴박한 흐름을 끊습니다.","analysis":"원문: ②번 문장 \"The Paris-Roubaix course covers various terrains including farmland and forests across northern France.\"는 원문에 없는 삽입 문장입니다. 나머지 ①③④⑤는 결승선 스프린트와 우승 장면을 시간순으로 서술하는 흐름이지만, ②는 코스의 지리적 특성을 설명하는 문장으로 결승선 장면의 긴박한 흐름을 끊습니다.","tip":"무관 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":1,"ch":["시간 순서가 뒤바뀐 내용이다.","②","인과관계가 잘못된 내용이다.","원인과 결과를 혼동한 내용이다."]},
{"id":17,"type":"TF","diff":"어려움","pts":6,"fmt":"mc","passage":"Gabriel's final race was the Paris-Roubaix, a 250 km race famed for its cobblestone sections. However, the rocky and cobblestone track caused a flat tire and I could not continue. Gabriel offered me his bike without hesitation, saying, \"I remember your finishing the race two laps ahead of everyone when I first met you. Never stop pedaling, kid. I'll catch up.\"","stem":"윗글의 내용에 따르면 \"Gabriel은 마지막 경주에서 Bliksem의 타이어가 펑크나자 자신의 자전거를 주저 없이 건네주었다.\"는 내용이 맞으면 T, 틀리면 F를 고르시오.","det":{"korean":"Gabriel은 주저 없이 나에게 자신의 자전거를 건네주었다. 해당 서술은 원문과 정확히 일치하므로 T(참)입니다. without hesitation = 주저 없이.","analysis":"원문: Gabriel offered me his bike without hesitation","tip":"TF 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"ans":0,"ch":["T","False","③ 해당 없음","④ 위 모두 해당"]},
{"id":18,"type":"서술형","diff":"어려움","pts":6,"fmt":"written","passage":"Bliksem first met Gabriel Martinez at age eleven when he won a junior race and received Gabriel's autograph. Gabriel became his mentor and brought him into his professional team. Bliksem struggled with mountain races but improved through training. In Gabriel's final race, the Paris-Roubaix, Bliksem got a flat tire but Gabriel gave him his bike. With the team's help, Bliksem won the race, and Gabriel called him \"Captain\" for the first time.","stem":"윗글을 한 문장으로 요약할 때, 빈칸에 들어갈 말을 &lt;조건&gt;에 맞게 쓰시오.<br><br>&lt;요약문&gt; Through his mentor Gabriel's __________ and his team's support, Bliksem grew from a young kid into a true __________.<br><br>&lt;조건&gt;<br>• 첫 번째 빈칸: 본문에서 Gabriel이 Bliksem에게 해준 것을 나타내는 명사 1단어<br>• 두 번째 빈칸: Gabriel이 마지막에 Bliksem을 부른 호칭을 활용한 명사 1단어<br><br>&lt;보기&gt; guidance / captain / leader / competition","det":{"korean":"Gabriel은 나의 멘토였다 / \"절대 페달 밟는 것을 멈추지 마, 꼬마야.\" / \"그 트로피는 네 것이야, 캡틴.\" Gabriel의 멘토링 = guidance(안내, 지도), 마지막 호칭 = Captain(캡틴/리더).","analysis":"원문: Gabriel has been my mentor / \"Never stop pedaling, kid.\" / \"That trophy is yours, Captain.\"","tip":"서술형 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"wa":"guidance, captain","accept":["guidance, captain","guidance,captain","guidance / captain","guidance captain","guidance, leader","guidance,leader","guidance / leader","guidance leader"]},
{"id":19,"type":"서술형","diff":"어려움","pts":6,"fmt":"written","passage":"Pedaling with all my strength, I finished second in that race, but I felt a sense of guilt for my fellow team members. I should have been more careful. If I had not crashed, Gabriel would have come in first place, and our team would have won.","stem":"윗글의 밑줄 친 부분을 참고하여, 다음 &lt;조건&gt;에 맞게 영작하시오.<br><br>&lt;한글&gt; 내가 더 주의했더라면, 우리 팀은 우승했을 텐데.<br><br>&lt;조건&gt;<br>• 가정법 과거완료(If + had p.p., would have p.p.) 구문 사용<br>• 주어진 단어를 반드시 포함: careful, team, won<br>• 한 문장으로 작성<br><br>&lt;보기&gt; careful / team / won / If / had / would / have / been / more / our","det":{"korean":"내가 충돌하지 않았더라면, Gabriel이 1등을 했을 것이고, 우리 팀이 이겼을 것이다. 이 문장은 가정법 과거완료(과거 사실의 반대를 가정)의 전형적 구조입니다.","analysis":"원문: If I had not crashed, Gabriel would have come in first place, and our team would have won.","tip":"서술형 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"wa":"If I had been more careful, our team would have won.","accept":["If I had been more careful, our team would have won.","If I had been more careful, our team would have won","if I had been more careful, our team would have won.","if I had been more careful, our team would have won","If I had been more careful our team would have won"]},
{"id":20,"type":"서술형","diff":"어려움","pts":6,"fmt":"written","passage":"My parents named me this because they wanted me to be faster than anyone else. Born in the Netherlands, a country with more bicycles than people, I learned to ride a bike almost as soon as I could walk. I loved feeling the breeze in my hair.","stem":"다음 문장의 빈칸에 주어진 단어를 올바른 형태로 바꾸어 쓰시오.<br><br>Bliksem spent his childhood __________ (ride) bicycles in the Netherlands.","det":{"korean":"나는 걸을 수 있게 되자마자 자전거 타는 법을 배웠다. 나는 머리카락에 스치는 바람을 느끼는 것을 좋아했다. spend + 시간 + v-ing(동명사) 구문에서 ride를 riding으로 변환해야 합니다.","analysis":"원문: I learned to ride a bike almost as soon as I could walk. I loved feeling the breeze in my hair.","tip":"서술형 유형 — 지문을 꼼꼼히 읽고 정답을 찾으세요."},"wa":"riding","accept":["riding","Riding","RIDING"]}];

let S = { ans: [], cur: 0, ti: null, left: EI.time, start: 0 };

function getHistory() {
  try { return JSON.parse(localStorage.getItem(EI.histKey) || '[]'); }
  catch (e) { return []; }
}

function saveToHistory(r, elapsed) {
  const h = getHistory();
  h.unshift({
    name: document.getElementById('inpName').value.trim(),
    school: document.getElementById('inpSchool').value.trim(),
    grade: document.getElementById('inpGrade').value,
    score: r.score, total: EI.total,
    correct: r.correct, wrong: r.wrong, unanswered: r.unanswered,
    elapsed, date: new Date().toISOString(),
    level: getLevel(r.score).name,
    answers: S.ans.slice()
  });
  if (h.length > 20) h.length = 20;
  localStorage.setItem(EI.histKey, JSON.stringify(h));
}

function updateHCount() {
  const h = getHistory();
  document.getElementById('hCount').textContent = h.length;
}

function toggleHistory() {
  const p = document.getElementById('historyPanel');
  if (p.style.display === 'block') { p.style.display = 'none'; return; }
  const h = getHistory();
  if (!h.length) {
    p.innerHTML = '<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">\uc544\uc9c1 \uae30\ub85d\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.</p>';
    p.style.display = 'block'; return;
  }
  const mk = '\u2460\u2461\u2462\u2463\u2464';
  p.innerHTML = h.map(function (x, idx) {
    return '<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">' + (x.name || '\uc774\ub984\uc5c6\uc74c') + '</div><div class="hi-meta">' + new Date(x.date).toLocaleDateString('ko-KR') + ' \u00b7 ' + x.grade + ' \u00b7 ' + (x.level || '') + '</div></div><div class="hi-right"><div class="hi-score" style="color:' + (x.score >= 80 ? 'var(--p)' : 'var(--r)') + '">' + x.score + '<span style="font-size:11px;color:var(--tl)">/' + x.total + '</span></div></div>' + (x.answers ? '<button onclick="reviewHistory(' + idx + ')" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid var(--pborder);border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--p)">\ud83d\udcdd \uc815\ub2f5\u00b7\ud574\uc124 \ub2e4\uc2dc \ubcf4\uae30</button>' : '') + '</div>';

function shuffle(arr) {

    var j = Math.floor(Math.random() * (i + 1));

}

    S = { ans: Array(filtered.length).fill(null), cur: 0, ti: null, left: EI.time, start: Date.now(), order: shuffle([].concat(Array(filtered.length).keys ? Array.from({ length: filtered.length }, function (_, i) { return i; }) : [])), filtered: filtered.map(function (f) { return f.i; }), secs: secs };
    EI._origTotalQ = EI.totalQ; EI._origTotal = EI.total;

function updateProgress() {

function initSwipe() {
  var startX = 0, startY = 0;
  var el = document.getElementById('slideWrap');
  el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0 && S.cur < EI.totalQ - 1) navQ(1);
      if (dx > 0 && S.cur > 0) navQ(-1);
    }
  }, { passive: true });
}

function submitExam() {
  if (!confirm('\uc81c\ucd9c\ud558\uc2dc\uaca0\uc2b5\ub2c8\uae4c?')) return;
  clearInterval(S.ti);
  var elapsed = Math.floor((Date.now() - S.start) / 1000);
  var r = grade();
  saveToHistory(r, elapsed);
  renderResults(r, elapsed);
  showScreen('resultScreen');

}

function grade() {
  var score = 0, correct = 0, wrong = 0, unanswered = 0;
  var details = [];
  var qs = S.filtered ? S.filtered.map(function (i) { return Q[i]; }) : Q;
  qs.forEach(function (q, i) {
    var a = S.ans[i];
    var ok = false;
    if (a === null) unanswered++;
    else if (q.fmt === 'mc') ok = a === q.ans;
    else {
      var u = String(a).trim().toLowerCase();
      if (q.accept) ok = q.accept.some(function (x) { return u === x.toLowerCase(); });
      if (!ok && q.wa) ok = u === q.wa.toLowerCase();
    }
    if (a !== null) { if (ok) { correct++; score += q.pts; } else wrong++; }
    details.push({ q: q, ans: a, ok: ok });
  });
  return { score: score, correct: correct, wrong: wrong, unanswered: unanswered, details: details };
}

  var pass = r.score >= 80, tn = getTestName(), wk = getWeakTypes();
  var tm = {};
  r.details.forEach(function (d) {
    var t = d.q.type;
    if (!tm[t]) tm[t] = { total: 0, ok: 0 };
    tm[t].total++;
    if (d.ok) tm[t].ok++;
  });
  var secLabel = S.secs ? S.secs.join(', ') : '\uc804\uccb4';
  var txt = '\ud83d\udcdd \ub0b4\uc2e0\ud56b ' + tn + ' \uacb0\uacfc\n' + EI.subject + ' \u00b7 ' + EI.pub + ' [' + secLabel + ']\n' + nm + (sc ? ' \u00b7 ' + sc : '') + ' \u00b7 ' + gr + '\n' + new Date().toLocaleDateString('ko-KR') + '\n\n' + lv.icon + ' ' + lv.name + ' \u00b7 ' + r.score + '/' + EI.total + '\uc810 (' + pct + '%)\n' + (pass ? '\ud83c\udf89 \ud1b5\uacfc!' : '\ud83d\udcda \ubbf8\ud1b5\uacfc') + ' \u00b7 \u2705' + r.correct + ' \u274c' + r.wrong + ' \u2b1c' + r.unanswered + '\n\u23f1\ufe0f ' + fmtTime(elapsed);
  if (wk.length) {
    txt += '\n\n\ud83d\udd0d \ub0b4\uc2e0\ud56b \uc57d\uc810 \uc9c4\ub2e8';
    wk.forEach(function (w) { var d = tm[w]; txt += '\n\u2022 ' + w.replace(/\(.+?\)/g, '').trim() + ' ' + d.ok + '/' + d.total + ' \u2192 ' + getTypeAdvice(w); });
  }
  txt += '\n\n\ud83d\udcca \ub0b4\uc2e0\ud56b | \ub0b4\uc2e0 \uc601\uc5b4 \uc644\ubcbd \ub300\ube44';
  navigator.clipboard.writeText(txt).then(function () { toast('\ud83d\udccb \uacb0\uacfc\uac00 \ubcf5\uc0ac\ub418\uc5c8\uc2b5\ub2c8\ub2e4!'); }).catch(function () { toast('\ubcf5\uc0ac \uc2e4\ud328'); });
}

function shareImage() {
  var tn = getTestName(), wk = getWeakTypes(), r = grade(), lv = getLevel(r.score);
  var pct = Math.round(r.score / EI.total * 100), pass = r.score >= 80;
  var nm = document.getElementById('inpName').value.trim();
  var tm = {};
  r.details.forEach(function (d) {
    var t = d.q.type;
    if (!tm[t]) tm[t] = { total: 0, ok: 0 };
    tm[t].total++;
    if (d.ok) tm[t].ok++;
  });
  var pc = pass ? '#16A34A' : '#D63B3B';
  var card = '<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">';
  card += '<div style="background:linear-gradient(135deg,' + (pass ? '#E8F5E9,#C8E6C9' : '#FFF0F0,#FFEAEA') + ');padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:' + pc + ';margin-bottom:4px">\ub0b4\uc2e0\ud56b ' + tn + '</div><div style="font-size:13px;color:#666;margin-bottom:16px">' + EI.subject + ' \u00b7 ' + EI.pub + '</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">' + r.score + '<span style="font-size:20px;color:#aaa">/' + EI.total + '</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:' + pc + ';color:#fff">' + lv.icon + ' ' + lv.name + ' \u00b7 ' + (pass ? '\ud1b5\uacfc' : '\ubbf8\ud1b5\uacfc') + '</span></div><div style="margin-top:12px;font-size:12px;color:#888">\ud83d\udc64 ' + nm + ' \u00b7 \u2705' + r.correct + ' \u274c' + r.wrong + ' \u2b1c' + r.unanswered + '</div></div>';
  if (wk.length) {
    card += '<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">\ud83d\udd0d \ub0b4\uc2e0\ud56b \uc57d\uc810 \uc9c4\ub2e8</div>';
    Object.entries(tm).forEach(function (entry) {
      var type = entry[0], d = entry[1];
      var p = Math.round(d.ok / d.total * 100);
      var c = p === 100 ? '#16A34A' : p >= 50 ? '#F59E0B' : '#D63B3B';
      card += '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">' + type.replace(/\(.+?\)/g, '').trim() + '</span><span style="font-weight:800;color:' + c + '">' + d.ok + '/' + d.total + '</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:' + p + '%;background:' + c + ';border-radius:3px"></div></div></div>';
    });
    card += '</div>';
  }
  card += '<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">\ud83d\udcca <b style="color:#333">\ub0b4\uc2e0\ud56b</b> | \ub0b4\uc2e0 \uc601\uc5b4 \uc644\ubcbd \ub300\ube44</div></div>';
  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-9999px;top:0;';
  wrap.innerHTML = card;
  document.body.appendChild(wrap);
  html2canvas(wrap.firstChild, { scale: 2, backgroundColor: null, useCORS: true }).then(function (canvas) {
    document.body.removeChild(wrap);
    canvas.toBlob(function (blob) {
      if (navigator.share && blob) {
        var file = new File([blob], '\ub0b4\uc2e0\ud56b_' + tn + '_\uacb0\uacfc.png', { type: 'image/png' });
        navigator.share({ files: [file], title: '\ub0b4\uc2e0\ud56b ' + tn + ' \uacb0\uacfc' }).catch(function () {});
      } else {
        var a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = '\ub0b4\uc2e0\ud56b_' + tn + '_\uacb0\uacfc.png';
        a.click();
      }
      toast('\ud83d\udcf8 \uacb0\uacfc \uc774\ubbf8\uc9c0\uac00 \uc800\uc7a5\ub418\uc5c8\uc2b5\ub2c8\ub2e4!');
    });
  }).catch(function () { toast('\uc774\ubbf8\uc9c0 \uc0dd\uc131 \uc2e4\ud328'); });
}

function reviewHistory(idx) {
  var h = getHistory();
  var rec = h[idx];
  if (!rec || !rec.answers) return toast('\uc774\uc804 \ubc84\uc804 \uae30\ub85d\uc740 \ud574\uc124\uc744 \ubcfc \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.');
  S.ans = rec.answers;
  S.start = Date.now() - rec.elapsed * 1000;
  document.getElementById('inpName').value = rec.name || '';
  document.getElementById('inpSchool').value = rec.school || '';
  document.getElementById('inpGrade').value = rec.grade || '\uace01';
  var r = grade();
  renderResults(r, rec.elapsed);
  showScreen('resultScreen');
  window.scrollTo(0, 0);
}

function retake() { location.reload(); }
function goHome() { showScreen('startScreen'); updateHCount(); }

window.addEventListener('beforeunload', function (e) {
  if (S.ti) { e.preventDefault(); e.returnValue = ''; }
});

updateHCount();
</script>
