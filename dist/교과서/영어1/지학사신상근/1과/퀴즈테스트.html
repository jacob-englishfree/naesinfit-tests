<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>영어Ⅰ 지학사(신상근) 온라인퀴즈TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* NaesinFit — Orange Theme (퀴즈테스트) */
:root{
  --p:#E8772E;--pd:#B85A1A;--pl:#F5A623;--pxl:#FFF3E8;--pxxl:#FFFAF5;
  --bg:#F6F2EE;--text:#1A1A2E;--tm:#7A6A5E;--tl:#A89A8E;
  --r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;
  --o:#F59E0B;--ol:#FFF8E1;
  --card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);
  --radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;
  --pborder:#ddd8d2;--pbg-muted:#e8e0d8;
  --passage-bg:linear-gradient(135deg,#FFFAF8,#F5F0EB);
  --start-grad:linear-gradient(160deg,#FFF3E8,#FFE8D6 40%,#FFDDC8);
  --accent2:#D97706;
  --p-rgba-08:rgba(232,119,46,.08);
  --p-rgba-10:rgba(232,119,46,.1);
  --p-rgba-12:rgba(232,119,46,.12);
  --p-rgba-25:rgba(232,119,46,.25);
  --p-rgba-30:rgba(232,119,46,.3);
}

/* NaesinFit Test Engine — Common CSS (theme-agnostic)
   Theme-specific colors come from :root variables defined in theme-*.css:
   --p      : primary color
   --pd     : primary dark
   --pl     : primary light
   --pxl    : primary extra-light
   --pxxl   : primary xx-light
   --bg     : page background
   --text   : main text
   --tm     : text muted
   --tl     : text light
   --pborder: border color (theme-tinted)
   --pbg-muted: muted bg for tracks/bars
   --start-grad: startScreen gradient
   --accent2: secondary gradient stop (badge/header)
   --p-rgba-08: rgba for selected bg
   --p-rgba-12: rgba for box-shadow
   --p-rgba-10: rgba for focus ring
   --p-rgba-25: rgba for button shadow
   --p-rgba-30: rgba for selectPulse
*/

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Start Screen */
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:var(--start-grad);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--p),var(--accent2));color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--p),var(--accent2));padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid var(--pborder);}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid var(--pborder);border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid var(--pborder);border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-rgba-10);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;box-shadow:0 6px 20px var(--p-rgba-30);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid var(--pborder);color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--p);color:var(--p);}
.history-badge{background:var(--pxl);color:var(--p);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid var(--pborder);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--p);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}

/* Exam Screen */
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--p);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--p);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--p);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--accent2));transition:width .5s ease;border-radius:0 2px 2px 0;}

/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--pxl),var(--pl));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--pd);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:10px 14px 14px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
.slide-choices{display:flex;flex-direction:column;gap:3px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12px;line-height:1.3;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--p);background:var(--p-rgba-08);box-shadow:0 0 0 3px var(--p-rgba-12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 var(--p-rgba-30)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:20px;height:20px;font-size:10px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--p-rgba-10);}
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;box-shadow:0 2px 8px var(--p-rgba-25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--p);}
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--p);background:var(--pxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}

/* Type tags — same across all themes */
.tag-combo{background:#E8F5E9;color:#166534;}.tag-wrong{background:#FFF0F0;color:#D63B3B;}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:#EDF2FF;color:#3B6FD9;}.tag-ant{background:#FFF8E1;color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}.tag-insert{background:#E3F2FD;color:#1565C0;}.tag-order{background:#FFF8E1;color:#F57F17;}

.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:var(--pbg-muted);padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--p);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:var(--passage-bg);border-left:3px solid var(--p);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--pborder);border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--p);}.choice-btn.selected{border-color:var(--p);box-shadow:0 0 0 2px var(--p-rgba-12);background:var(--pxxl);}
.c-num{min-width:22px;height:22px;background:var(--pbg-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid var(--pborder);border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--p);}

/* Result Screen */
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--pxl),var(--pl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:var(--pbg-muted);border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--pl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--pxxl);border-radius:var(--rs);border:1px solid var(--pborder);}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--pxl);}.info-cell.highlight .ic-value{color:var(--p);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:var(--pbg-muted);border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--pl);color:var(--p);}.tag-item.weak{background:#FFF0F0;color:#D63B3B;}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--pxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid var(--pborder);border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--p);color:var(--p);}.act-btn.primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid var(--pborder);border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--pxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--pxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--pl);color:var(--p);}.expl-tag.tip{background:var(--pxl);color:var(--pd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--p);}.expl-box.tip-b{border-left:3px solid var(--p);background:var(--pxl);}

@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">온라인퀴즈 TEST</div>
  <h1 class="start-title">온라인퀴즈 <span>TEST</span></h1>
  <p class="start-subtitle">영어Ⅰ · 지학사(신상근) · 1과 · 20문항</p>
  <div class="info-card"><div class="info-card-header">시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">영어Ⅰ</span></div>
    <div class="info-row"><span class="info-label">문항</span><span class="info-value">지학사(신상근) (1과)</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">The Psychology Behind Shopping & Online Shopping Trends</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">20문항</div><div class="chip">20분</div><div class="chip">80점 이상 통과</div><div class="chip">100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="startExam()">시험 시작하기</button>
  <button class="btn btn-outline" onclick="toggleHistory()">시험 기록 보기 <span class="history-badge" id="hCount">0</span></button>
  <div id="historyPanel"></div>
</div>
</div>

<div id="examScreen" class="screen">
  <div class="exam-topbar"><div class="topbar-left"><div class="topbar-dot"></div><div class="topbar-info">영어Ⅰ · <span>지학사(신상근)</span></div></div><div class="timer" id="timer">20:00</div><button class="btn-submit" onclick="submitExam()">제출하기</button></div>
  <div class="exam-progress"><div class="exam-progress-fill" id="progressFill"></div></div>
  <div class="ans-count" id="ansCount">0/20</div>

<script>
const EI={"subject":"영어Ⅰ","pub":"지학사(신상근)","lesson":"1과","title":"The Psychology Behind Shopping & Online Shopping Trends","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_jihak_1_v2"};
const FULL_PASSAGE="In this way, we sometimes rely too much on the first piece of information we receive. We use it as an anchor, or a reference point, to interpret new information. This can lead to a hasty <u>①judgment</u>. How can we avoid having an anchoring bias? We should think twice and <u>②compare</u> prices. The more information we have about a product and its price range, the less <u>③likely</u> we are to fall prey to an anchoring bias. ... Marketers do this because after we use a product, we start to feel a sense of ownership, which makes it difficult to <u>④maintain</u> the product or switch to a different one. In other words, we tend to overvalue items that we already own more than we would if they didn't <u>⑤belong</u> to us.";
const Q=[{"id":1,"type":"어법 ⓐ~ⓔ","diff":"쉬움","pts":4,"fmt":"mc","passage":"Imagine you are in a shopping center, walking by a shoe store. A pair of striking sneakers in the show window <u>ⓐ attracts</u> you. At that moment, you can hardly believe the shocking price tag: $500. You doubt your own eyes and walk into the store. In the store, you find another pair of sneakers that <u>ⓑ looks</u> similar for $200. After seeing the sneakers for $500, you think the $200 sneakers are a good bargain and buy them even though you <u>ⓒ don't</u> need a new pair of sneakers. In this way, we sometimes rely too much on the first piece of information we <u>ⓓ receive</u>. We use it as an anchor, or a reference point, <u>ⓔ interpreting</u> new information.","stem":"다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 어색한 것은?","det":{"korean":"[원문] We use it as an anchor, or a reference point, to interpret new information. [해석] 우리는 그것을 새로운 정보를 해석하기 위한 기준점, 즉 앵커로 사용한다. 원문에서는 목적을 나타내는 to부정사 to interpret가 쓰였으므로, interpreting(현재분사)은 어법에 맞지 않습니다.","analysis":"ⓐ attracts: 주어 A pair of striking sneakers(단수) → 단수동사 attracts ✅ / ⓑ looks: 관계대명사 that의 선행사 another pair(단수) → 단수동사 looks ✅ / ⓒ don't: 주어 you → don't ✅ / ⓓ receive: 목적격관계대명사 생략, 주어 we(복수) → receive ✅ / ⓔ interpreting: 원문은 to interpret(to부정사·목적)인데 interpreting(현재분사)으로 변형 → 어법 오류 ❌","tip":"💡 to부정사의 부사적 용법(목적): ~하기 위하여. 현재분사 interpreting은 동시동작·진행을 나타내므로 목적 표현에 부적절. 비교: 분사구문(~하면서) vs to부정사(~하기 위해)"},"ans":2,"ch":["ⓐ attracts","ⓑ looks","ⓔ interpreting","ⓒ don't"]},
{"id":2,"type":"어법 A/B/C","diff":"쉬움","pts":4,"fmt":"mc","passage":"Imagine an OTT media service provider offers you a free premium service for a month. The advertisement reassures you that you can cancel the service anytime within the month. Marketers do this because after we use a product, we start to feel a sense of ownership, (A) [<b>which / what</b>] makes it difficult to give up the product or switch to a different one. In other words, we tend to overvalue items that we already own more than we would if they (B) [<b>didn't belong / don't belong</b>] to us. Then, how can we overcome this psychological ownership bias? Above all, (C) [<b>be / being</b>] aware of the \"free trial\" trap.","stem":"다음 글의 (A), (B), (C)에서 어법에 맞는 표현을 골라 짝지은 것으로 가장 적절한 것은?","det":{"korean":"[원문] (A) a sense of ownership, which makes it difficult... (B) if they didn't belong to us. (C) Above all, be aware of the \"free trial\" trap. [해석] (A) 소유감을 느끼기 시작하는데, 이것이 포기하기 어렵게 만든다. (B) 우리 것이 아니었다면. (C) 무료 체험 함정을 인식하라.","analysis":"(A) which: 콤마 + 관계대명사 = 계속적 용법, 앞 문장 전체를 선행사로 받음 ✅ / what은 선행사 포함이므로 콤마 뒤 불가 ❌ (B) didn't belong: 가정법 과거(주절 would → if절 과거형) ✅ / don't belong은 직설법이므로 would와 불일치 ❌ (C) be: 명령문(동사원형으로 시작) ✅ / being은 분사로 명령문 불가 ❌","tip":"💡 ① 관계대명사 which(계속적 용법): 콤마 + which = 앞 내용 전체를 선행사로 받음. what은 선행사 포함(= the thing which). ② 가정법 과거: If + S + 과거형 ~, S + would + 동사원형. ③ 명령문: 동사원형으로 시작."},"ans":0,"ch":["which — didn't belong — be","which — don't belong — being","what — didn't belong — be","what — don't belong — being"]},
{"id":3,"type":"어법 ⓐ~ⓓ","diff":"쉬움","pts":4,"fmt":"mc","passage":"Social media and SNS services have become increasingly popular places for consumers <u>ⓐ discovering</u>, research, and purchase products. Social commerce makes shopping a more convenient and interactive experience, which helps <u>ⓑ explain</u> why it has become so popular. Features like \"buy\" buttons and instant messaging tools make social media <u>ⓒ easy to use</u>. In 2021, around 96.9 million US shoppers <u>ⓓ made</u> a purchase through social media.","stem":"다음 글의 밑줄 친 ⓐ~ⓓ 중 어법상 어색한 것은?","det":{"korean":"[원문] Social media and SNS services have become increasingly popular places for consumers to discover, research, and purchase products. [해석] 소셜미디어는 소비자들이 제품을 발견하고 조사하고 구매하는 인기 장소가 되었다.","analysis":"ⓐ discovering ❌ → to discover: 'places for consumers to discover' — to부정사의 형용사적 용법으로 places를 수식하며, for consumers는 의미상 주어. 동명사 discovering은 이 구조에서 부적절. / ⓑ explain ✅: help + 동사원형(원형부정사). help는 to부정사·원형부정사 모두 허용 / ⓒ easy to use ✅: make + O + OC(형용사구). 5형식 목적격보어 / ⓓ made ✅: In 2021(과거 시점) → 과거형 made","tip":"💡 to부정사의 형용사적 용법: places to discover = 발견할 장소들. for + 목적격은 to부정사의 의미상 주어. help + (to) 동사원형: help는 원형부정사·to부정사 모두 허용. make + O + 형용사(구): 5형식에서 형용사가 목적격보어."},"ans":0,"ch":["ⓐ discovering","ⓑ explain","ⓒ easy to use","ⓓ made"]},
{"id":4,"type":"어휘 A/B/C","diff":"쉬움","pts":4,"fmt":"mc","passage":"How do you feel when you look at an advertisement that says, \"Only one left!\" or \"Today only: 50% off\"? If you don't buy the product, it feels like you are (A) [<b>missing out on / catching up with</b>] a great deal. Whatever the product is, consumers are usually influenced by a sense of urgency and scarcity. People think a product or service is more (B) [<b>valuable / worthless</b>] or desirable when they believe the supply is limited. It can be (C) [<b>challenging / effortless</b>] to ignore the temptation of urgency and scarcity while shopping.","stem":"다음 글의 (A), (B), (C)에서 문맥에 맞는 표현을 골라 짝지은 것으로 가장 적절한 것은?","det":{"korean":"[원문] (A) missing out on a great deal (B) more valuable (C) challenging to ignore. [해석] (A) 좋은 거래를 놓치고 있는 것 같은 느낌. (B) 더 가치 있다고 생각. (C) 유혹을 무시하기 어려움.","analysis":"(A) missing out on: 사지 않으면 기회를 놓치는 느낌 ✅ / catching up with(따라잡다)는 문맥 부적합 ❌ (B) valuable: 공급 제한 → 더 가치 있다고 판단 ✅ / worthless(가치 없는)는 반대 ❌ (C) challenging: 유혹 무시가 어려움 ✅ / effortless(힘들지 않은)는 반대 ❌","tip":"💡 miss out on ≈ lose the chance ↔ catch up with: 따라잡다. valuable ≈ precious ↔ worthless. challenging ≈ difficult ↔ effortless = 쉬운"},"ans":0,"ch":["missing out on — valuable — challenging","missing out on — worthless — effortless","catching up with — valuable — effortless","catching up with — worthless — challenging"]},
{"id":5,"type":"어휘 ①~⑤","diff":"쉬움","pts":4,"fmt":"mc","passage":"In this way, we sometimes rely too much on the first piece of information we receive. We use it as an anchor, or a reference point, to interpret new information. This can lead to a hasty <u>①judgment</u>. How can we avoid having an anchoring bias? We should think twice and <u>②compare</u> prices. The more information we have about a product and its price range, the less <u>③likely</u> we are to fall prey to an anchoring bias. ... Marketers do this because after we use a product, we start to feel a sense of ownership, which makes it difficult to <u>④maintain</u> the product or switch to a different one. In other words, we tend to overvalue items that we already own more than we would if they didn't <u>⑤belong</u> to us.","stem":"다음 글의 밑줄 친 ①~⑤ 중 문맥상 쓰임이 적절하지 않은 것은?","det":{"korean":"[원문] which makes it difficult to give up the product. [해석] 제품을 포기하는 것을 어렵게 만든다. 원문의 give up(포기하다)이 ④ maintain(유지하다)으로 바뀜.","analysis":"① judgment: 성급한 판단 — 문맥 적합 ✅ / ② compare: 가격 비교 — 적합 ✅ / ③ likely: 가능성 — 적합 ✅ / ④ maintain: 원문 give up(포기하다) → maintain(유지하다)로 변형, 의미 반대 ❌ / ⑤ belong: 속하다 — 적합 ✅","tip":"💡 give up ≈ abandon, quit ↔ maintain = 유지하다. 소유감 → 포기하기 어려움이 논리적. maintain은 '유지하기 어렵다'가 되어 문맥 역전."},"ans":3,"ch":["① judgment","② compare","③ likely","④ maintain"]},
{"id":6,"type":"어휘 ①~⑤","diff":"보통","pts":5,"fmt":"mc","passage":"First, more people will shop through social commerce. Social media and SNS services have become increasingly popular places for consumers to <u>①discover</u>, research, and purchase products. Social commerce makes shopping a more <u>②convenient</u> and interactive experience, which helps explain why it has become so popular. ... Second, more shoppers will use voice searches. Voice assistants were once used only to get directions, to answer questions about weather, or to call someone. But the way people use voice searches is <u>③changing</u>. ... Finally, shoppers place more <u>④distrust</u> in influencer recommendations. In recent years, influencers have become an <u>⑤important</u> part of marketing.","stem":"다음 글의 밑줄 친 ①~⑤ 중 문맥상 쓰임이 적절하지 않은 것은?","det":{"korean":"[원문] shoppers place more trust in influencer recommendations. [해석] 소비자들은 인플루언서 추천에 더 많은 신뢰를 둔다. trust → distrust 변형.","analysis":"① discover: 제품 발견 — 적합 ✅ / ② convenient: 편리한 경험 — 적합 ✅ / ③ changing: 사용 방식 변화 — 적합 ✅ / ④ distrust: 원문 trust(신뢰)의 반의어로 변형 ❌ / ⑤ important: 마케팅의 중요한 부분 — 적합 ✅","tip":"💡 trust ≈ confidence, faith ↔ distrust = 불신. 접두사 dis-는 반대·부정: trust → distrust, agree → disagree."},"ans":3,"ch":["① discover","② convenient","③ changing","④ distrust"]},
{"id":7,"type":"주제","diff":"보통","pts":5,"fmt":"mc","passage":"We often want something so badly that we are willing to buy it on the spot. In these moments, we just act without thinking. While we usually believe we have control over our purchasing decisions, sometimes we really don't. Our emotions play a vital role in shaping our financial behavior. Marketers use psychological tactics to influence, convince, and even deceive us, the consumers. To make wiser choices, it's essential to understand these psychological traps that influence our spending habits.","stem":"다음 글의 주제로 가장 적절한 것은?","det":{"korean":"[원문] it's essential to understand these psychological traps that influence our spending habits. [해석] 소비 습관에 영향을 미치는 심리적 함정을 이해하는 것이 필수적이다.","analysis":"① 쇼핑 심리 함정 이해의 중요성 — 핵심 주제 ✅ / ② 마케팅 전략의 역사 — 역사 아님 ❌ / ③ 충동 구매의 경제적 이점 — 위험성 경고 ❌ / ④ 온라인 쇼핑 인기 이유 — 쇼핑 심리 주제 ❌ / ⑤ 기술의 역할 — 심리에 초점 ❌","tip":"💡 주제 찾기: 서론 마지막 문장의 키워드 'psychological traps + spending habits' 추적."},"ans":0,"ch":["the importance of understanding psychological traps in shopping","the history of modern marketing strategies","the benefits of impulse buying for the economy","the reasons why online shopping is more popular"]},
{"id":8,"type":"제목","diff":"보통","pts":5,"fmt":"mc","passage":"Online shopping has been much more popular in recent years. It is expected to continue to grow, given how digitalization and the internet allow companies to sell without a physical presence. Factors such as convenience, a wider selection of goods, and lower prices have contributed to the increase in online shopping. Let's explore the biggest online shopping trends and see where things are headed.","stem":"다음 글 이후에 이어지는 본문 전체의 제목으로 가장 적절한 것은?","det":{"korean":"[원문] Let's explore the biggest online shopping trends. [해석] 가장 큰 온라인 쇼핑 트렌드를 살펴보자.","analysis":"① 온라인 사업 시작법 — 무관 ❌ / ② 온라인 쇼핑의 미래를 형성하는 주요 트렌드 — 소셜 커머스·음성 검색·인플루언서 트렌드 소개에 부합 ✅ / ③ 오프라인 매장 쇠퇴 — 초점 다름 ❌ / ④ 소셜미디어 해로움 — 부정적 관점 아님 ❌ / ⑤ 전자상거래 환경 영향 — 언급 없음 ❌","tip":"💡 제목: 서론 예고문 'biggest online shopping trends'가 핵심. 본문은 3가지 트렌드를 소개."},"ans":1,"ch":["How to Start Your Own Online Business","Major Trends Shaping the Future of Online Shopping","The Decline of Traditional Retail Stores","Why Social Media Is Harmful to Consumers"]},
{"id":9,"type":"시사점","diff":"보통","pts":5,"fmt":"mc","passage":"Few people say they enjoy waiting in a long line to buy a ticket or product. In real life, however, people often put up with waiting in line for hours to purchase a popular product. When a particular fashion item, a beauty product, or a brand becomes popular, we may feel pushed to purchase the product to keep up with the trend. In other words, we often choose to do something because everyone else is doing it. ... Many more psychological triggers besides the examples above will make you spend more money while shopping. The best way to spend smarter is to spend after thinking carefully about whether it is a necessary purchase, the best deal, and the right time to buy.","stem":"다음 글이 시사하는 바로 가장 적절한 것은?","det":{"korean":"[원문] The best way to spend smarter is to spend after thinking carefully. [해석] 더 현명하게 소비하는 방법은 신중하게 생각한 후 소비하는 것이다.","analysis":"① 트렌드 따르기가 가장 효율적 — 군중심리 경계 ❌ / ② 소비 행동이 합리적 — 비합리적 소비 지적 ❌ / ③ 비판적 사고와 자기 인식이 현명한 소비에 필수 — 결론 일치 ✅ / ④ 마케터 영향력 없음 — 심리 전략 설명 ❌ / ⑤ 줄 서면 최고 제품 보장 — 군중심리 예시 ❌","tip":"💡 시사점: 결론부 'spend after thinking carefully' + 'ask yourself if you really need it' = 비판적 사고 + 자기 인식."},"ans":2,"ch":["Following trends is the most efficient way to shop.","Consumer behavior is entirely rational and predictable.","Critical thinking and self-awareness are essential for smart spending.","Marketers have no influence on our purchasing decisions."]},
{"id":10,"type":"일치","diff":"보통","pts":5,"fmt":"mc","passage":"In 2021, around 96.9 million US shoppers made a purchase through social media. Looking ahead, this trend is unlikely to slow down. In the US, social commerce earnings are estimated to reach nearly $80 billion by 2025. Plus, by 2025, the number of social commerce buyers in the United States is forecasted to reach over 114 million. ... In 2022, as much as $40 billion of sales used a voice search. This represents a significant leap compared to the $2 billion worth of sales in 2017.","stem":"다음 글의 내용과 일치하는 것은?","det":{"korean":"[원문] social commerce earnings are estimated to reach nearly $80 billion by 2025. [해석] 소셜 커머스 수익은 2025년까지 거의 800억 달러에 이를 것으로 추정.","analysis":"① over 100 million → 원문 약 96.9 million ❌ / ② $80 billion by 2025 → 원문 일치 ✅ / ③ $2 billion은 2017년 수치, 2022년은 $40 billion ❌ / ④ 증가 예상(over 114 million) ❌ / ⑤ unlikely to slow down ❌","tip":"💡 숫자·연도 대조. 96.9M ≠ over 100M. $2B = 2017년, $40B = 2022년."},"ans":1,"ch":["In 2021, over 100 million US shoppers used social media to shop.","US social commerce earnings are estimated to reach $80 billion by 2025.","Voice search sales in 2022 were about $2 billion.","The number of social commerce buyers is expected to decrease by 2025."]},
{"id":11,"type":"불일치","diff":"보통","pts":5,"fmt":"mc","passage":"In 2021, brands spent around $3.7 billion on the influencer marketing industry in the US, a 33% increase from 2020. Content made by influencers is often seen as more human than typical brand campaigns. In fact, 61% of consumers trust the product recommendations they get from influencers. Meanwhile, only 38% trust traditional ads. In 2022, 30% of consumers reported influencer recommendations were one of the most important factors in their shopping decisions, compared to 27% who mentioned recommendations from friends or family.","stem":"다음 글의 내용과 일치하지 않는 것은?","det":{"korean":"[원문] 61% trust influencers, only 38% trust traditional ads. [해석] 인플루언서 신뢰 61% > 전통 광고 38%. 선지 ④는 대소관계 역전.","analysis":"① $3.7B in 2021 — 일치 ✅ / ② more human(authentic) — 일치 ✅ / ③ 61% > 50% — 일치 ✅ / ④ 전통 광고 > 인플루언서 → 원문은 38% < 61%로 반대 ❌ / ⑤ 30% > 27% — 일치 ✅","tip":"💡 불일치: 비교 관계(A > B)가 뒤바뀌는 함정. 61% vs 38%의 대소관계 확인."},"ans":3,"ch":["Brands spent about $3.7 billion on influencer marketing in the US in 2021.","Influencer content is generally perceived as more authentic than brand campaigns.","More than half of consumers trust influencer product recommendations.","Traditional ads are trusted more than influencer recommendations."]},
{"id":12,"type":"빈칸(구)","diff":"보통","pts":5,"fmt":"mc","passage":"Imagine you are in a shopping center, walking by a shoe store. A pair of striking sneakers in the show window attracts you. At that moment, you can hardly believe the shocking price tag: $500. You doubt your own eyes and walk into the store. In the store, you find another pair of sneakers that looks similar for $200. After seeing the sneakers for $500, you think the $200 sneakers are a good bargain and buy them even though you don't need a new pair of sneakers. In this way, we sometimes rely too much on _________________________ to interpret new information.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"[원문] rely too much on the first piece of information we receive. [해석] 우리가 받는 첫 번째 정보에 너무 의존한다.","analysis":"① 다른 쇼핑객 의견 — 언급 없음 ❌ / ② 첫 번째 정보 — $500이 기준점이 됨 ✅ / ③ 제품 품질 — 가격이 기준 ❌ / ④ 온라인 리뷰 — 언급 없음 ❌ / ⑤ 과거 경험 — 처음 접한 가격이 기준 ❌","tip":"💡 anchor(닻) = 기준점 = 첫 번째 정보. 앵커링 편향: 처음 받은 정보에 과도하게 의존."},"ans":1,"ch":["the opinions of other shoppers","the first piece of information we receive","the quality of the product itself","online reviews and ratings"]},
{"id":13,"type":"빈칸(문장)","diff":"보통","pts":5,"fmt":"mc","passage":"Few people say they enjoy waiting in a long line to buy a ticket or product. In real life, however, people often put up with waiting in line for hours to purchase a popular product. When a particular fashion item, a beauty product, or a brand becomes popular, we may feel pushed to purchase the product to keep up with the trend. In other words, _______________________________________________. The more people do something, the more likely we are to follow the act.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"[원문] we often choose to do something because everyone else is doing it. [해석] 다른 모든 사람이 하기 때문에 무언가를 선택한다.","analysis":"① 후회 — 동조 행동 설명 ❌ / ② 다른 사람들이 하기 때문에 따라함 — 'In other words' + 군중심리 ✅ / ③ 독립적 결정 — 반대 ❌ / ④ 인위적 희소성 — 군중심리 주제 아님 ❌ / ⑤ 혼자 쇼핑 자신감 — 무관 ❌","tip":"💡 'In other words' = 앞 내용 재진술. 트렌드 따르기 = 모두가 하니까 따라함. bandwagon effect(편승 효과)."},"ans":1,"ch":["we often regret buying things we don't need","we often choose to do something because everyone else is doing it","we prefer to make decisions independently of others","marketers create artificial scarcity to boost sales"]},
{"id":14,"type":"함축","diff":"보통","pts":5,"fmt":"mc","passage":"Marketers do this because after we use a product, we start to feel a sense of ownership, which makes it difficult to give up the product or switch to a different one. In other words, we tend to overvalue items that we already own more than we would if they didn't belong to us. Then, how can we overcome this psychological ownership bias? Above all, be aware of the \"free trial\" trap. <u>Once you fall into a trap, it's important to remember that it can be difficult to escape.</u>","stem":"다음 글의 밑줄 친 문장이 함축하는 바로 가장 적절한 것은?","det":{"korean":"[원문] Once you fall into a trap, it's important to remember that it can be difficult to escape. [해석] 함정에 빠지면 빠져나오기 어려울 수 있다. trap = 무료 체험의 심리적 함정, escape = 제품 포기.","analysis":"① 항상 재정 파탄 — 과도한 일반화 ❌ / ② 무료 체험 사용 후 심리적으로 포기 어려움 — 소유감 편향 핵심 ✅ / ③ 절대 시도하지 말라 — 극단적 ❌ / ④ 취소 불가능 — difficult ≠ impossible ❌ / ⑤ 법적 의무 — 언급 없음 ❌","tip":"💡 함축: 비유 해석. trap = 무료 체험의 소유감 함정. escape = 포기. endowment effect(소유 효과): 가진 것을 높게 평가."},"ans":1,"ch":["Free trials always lead to financial ruin.","Once you start using a free trial product, giving it up becomes psychologically hard.","Consumers should never try any new products.","It is impossible to cancel a free trial subscription."]},
{"id":15,"type":"순서","diff":"보통","pts":5,"fmt":"mc","passage":"In this way, we sometimes rely too much on the first piece of information we receive. We use it as an anchor, or a reference point, to interpret new information. This can lead to a hasty <u>①judgment</u>. How can we avoid having an anchoring bias? We should think twice and <u>②compare</u> prices. The more information we have about a product and its price range, the less <u>③likely</u> we are to fall prey to an anchoring bias. ... Marketers do this because after we use a product, we start to feel a sense of ownership, which makes it difficult to <u>④maintain</u> the product or switch to a different one. In other words, we tend to overvalue items that we already own more than we would if they didn't <u>⑤belong</u> to us.","stem":"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?<br><div style='background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:6px 0;line-height:1.85;border-left:3px solid #E8772E;'>In this way, we sometimes rely too much on the first piece of information we receive. We use it as an anchor, or a reference point, to interpret new information. This can lead to a hasty judgment.</div><b>(A)</b> The more information we have about a product and its price range, the less likely we are to fall prey to an anchoring bias.<br><b>(B)</b> How can we avoid having an anchoring bias?<br><b>(C)</b> We should think twice and compare prices.","det":{"korean":"[원문 순서] (B) How can we avoid ~? → (C) We should think twice ~ → (A) The more information ~ [해석] 질문 → 해결책 → 결론","analysis":"(B)-(C)-(A): 질문(How?) → 해결(think twice, compare) → 결론(정보 많을수록 편향 감소) ✅ / 나머지는 논리 역전 ❌","tip":"💡 순서: 의문문(How/Why) → 답변·해결 → 결론·일반화. 'the + 비교급 ~, the + 비교급 ~'은 보통 결론."},"ans":2,"ch":["(A)-(B)-(C)","(A)-(C)-(B)","(B)-(C)-(A)","(C)-(A)-(B)"]},
{"id":16,"type":"무관문장","diff":"어려움","pts":6,"fmt":"mc","passage":"Second, more shoppers will use voice searches. ① Voice assistants were once used only to get directions, to answer questions about weather, or to call someone. ② But the way people use voice searches is changing. ③ Voice assistants are now becoming a core component of online shopping. ④ Meanwhile, traditional brick-and-mortar stores have been investing heavily in interior design to attract customers. ⑤ In 2022, as much as $40 billion of sales used a voice search.","stem":"다음 글에서 전체 흐름과 관계 없는 문장은?","det":{"korean":"[④] 전통적인 오프라인 매장의 인테리어 투자 — 음성 검색 트렌드와 무관.","analysis":"① 음성 비서 과거 용도 — 주제 관련 ✅ / ② 사용 방식 변화 — 관련 ✅ / ③ 온라인 쇼핑 핵심 요소 — 관련 ✅ / ④ 오프라인 매장 인테리어 — 음성 검색과 무관 ❌ / ⑤ 매출 통계 — 관련 ✅","tip":"💡 무관 문장: 소주제 'voice searches' 확인 → ④ 'brick-and-mortar stores + interior design'은 완전히 다른 주제."},"ans":3,"ch":["시간 순서가 뒤바뀐 내용이다.","인물/장소가 혼동된 내용이다.","인과관계가 잘못된 내용이다.","④"]},
{"id":17,"type":"T/F","diff":"어려움","pts":6,"fmt":"mc","passage":"Whatever the product is, consumers are usually influenced by a sense of urgency and scarcity. People think a product or service is more valuable or desirable when they believe the supply is limited. It can be challenging to ignore the temptation of urgency and scarcity while shopping. Still, whenever you feel anxious about missing out on a great deal, you should remember that there are plenty of alternative items that are just as good or better.","stem":"다음 글의 내용에 비추어, <b>'소비자들이 희소성의 유혹을 무시하는 것은 쉽다'</b>는 설명이 맞으면 T, 틀리면 F를 고르시오.","det":{"korean":"[원문] It can be challenging to ignore the temptation. [해석] 유혹을 무시하는 것은 어려울 수 있다. challenging = 어려운 ≠ 쉬운.","analysis":"T: '무시하는 것은 쉽다' — 원문은 challenging(어려운) → 반대 ❌ / F: 원문은 challenging이므로 '쉽다'는 틀림 ✅","tip":"💡 challenging = difficult ≈ hard ↔ easy, effortless. 반의어 바꿔치기 함정."},"ans":1,"ch":["True","F","③ 해당 없음","④ 위 모두 해당"]},
{"id":18,"type":"서술형(요약)","diff":"어려움","pts":6,"fmt":"written","passage":"We often want something so badly that we are willing to buy it on the spot. While we usually believe we have control over our purchasing decisions, sometimes we really don't. Our emotions play a vital role in shaping our financial behavior. Marketers use psychological tactics to influence, convince, and even deceive us, the consumers. To make wiser choices, it's essential to understand these psychological traps that influence our spending habits.","stem":"다음 조건에 맞게 위 글을 한 문장으로 요약하시오.<br>[조건] 빈칸에 알맞은 <b>한 단어</b>를 쓸 것.<br>[보기] Understanding psychological ________ is essential for making wiser shopping choices.","det":{"korean":"[원문] psychological traps that influence our spending habits. [해석] 소비 습관에 영향을 미치는 심리적 함정. trap ≈ snare, pitfall.","analysis":"정답: traps. 서론 마지막 문장 'psychological traps'가 글 전체를 관통하는 핵심어.","tip":"💡 요약형: 지문의 핵심 키워드 찾기. 'psychological traps' = 글의 중심 소재."},"accept":["traps","Traps"],"wa":"answer"},
{"id":19,"type":"서술형(영작)","diff":"어려움","pts":6,"fmt":"written","passage":"After seeing the sneakers for $500, you think the $200 sneakers are a good bargain and buy them even though you don't need a new pair of sneakers. In this way, we sometimes rely too much on the first piece of information we receive. We use it as an anchor, or a reference point, to interpret new information.","stem":"다음 조건에 맞게 밑줄 친 우리말을 영작하시오.<br>[조건] 주어진 단어를 모두 활용하되 필요시 형태를 바꿀 것 / 6~10단어<br>[보기 단어] information / we / the / rely / receive<br><br>우리말: '우리는 때때로 우리가 받는 첫 번째 정보에 너무 많이 의존한다.'<br>→ We sometimes ___________________________.","det":{"korean":"[원문] rely too much on the first piece of information we receive. [해석] 첫 번째 정보에 너무 의존한다.","analysis":"모범답안: rely too much on the first information we receive. rely on(의존하다) + too much(지나치게) + the first information(첫 번째 정보) + we receive(관계절).","tip":"💡 rely on: ~에 의존하다 (전치사 on 필수). too much: 동사 뒤 부사구. the first + 명사: 서수 앞 정관사 the."},"accept":["rely too much on the first information we receive","Rely too much on the first information we receive"],"wa":"answer"},
{"id":20,"type":"서술형(어형)","diff":"어려움","pts":6,"fmt":"written","passage":"Marketers do this because after we use a product, we start to feel a sense of ownership, which makes it difficult to give up the product or switch to a different one. In other words, we tend to overvalue items that we already own more than we would if they didn't belong to us.","stem":"다음 문장의 괄호 안에서 주어진 단어를 어법에 맞게 고쳐 쓰시오.<br><br>We tend to overvalue items that we already own more than we would if they didn't <b>(belong)</b> to us.","det":{"korean":"[원문] if they didn't belong to us. [해석] 그것들이 우리 것이 아니었다면. 가정법 과거: didn't + 동사원형.","analysis":"정답: belong (원형 그대로). didn't 뒤에는 동사원형. belongs(3인칭) 또는 belonged(과거)는 불가.","tip":"💡 조동사(did, didn't, would) 뒤 = 동사원형. belong to: ~에 속하다 ≈ be owned by."},"accept":["belong","Belong"],"wa":"answer"}];

let S = { ans: [], cur: 0, ti: null, left: EI.time, start: 0 };

function getHistory() {
  try { return JSON.parse(localStorage.getItem(EI.histKey) || '[]'); }
  catch (e) { return []; }
}

function saveToHistory(r, elapsed) {
  const h = getHistory();
  h.unshift({
    name: document.getElementById('inpName').value.trim(),
    school: document.getElementById('inpSchool').value.trim(),
    grade: document.getElementById('inpGrade').value,
    score: r.score, total: EI.total,
    correct: r.correct, wrong: r.wrong, unanswered: r.unanswered,
    elapsed, date: new Date().toISOString(),
    level: getLevel(r.score).name,
    answers: S.ans.slice()
  });
  if (h.length > 20) h.length = 20;
  localStorage.setItem(EI.histKey, JSON.stringify(h));
}

function updateHCount() {
  const h = getHistory();
  document.getElementById('hCount').textContent = h.length;
}

function toggleHistory() {
  const p = document.getElementById('historyPanel');
  if (p.style.display === 'block') { p.style.display = 'none'; return; }
  const h = getHistory();
  if (!h.length) {
    p.innerHTML = '<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">\uc544\uc9c1 \uae30\ub85d\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.</p>';
    p.style.display = 'block'; return;
  }
  const mk = '\u2460\u2461\u2462\u2463\u2464';
  p.innerHTML = h.map(function (x, idx) {
    return '<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">' + (x.name || '\uc774\ub984\uc5c6\uc74c') + '</div><div class="hi-meta">' + new Date(x.date).toLocaleDateString('ko-KR') + ' \u00b7 ' + x.grade + ' \u00b7 ' + (x.level || '') + '</div></div><div class="hi-right"><div class="hi-score" style="color:' + (x.score >= 80 ? 'var(--p)' : 'var(--r)') + '">' + x.score + '<span style="font-size:11px;color:var(--tl)">/' + x.total + '</span></div></div>' + (x.answers ? '<button onclick="reviewHistory(' + idx + ')" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid var(--pborder);border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--p)">\ud83d\udcdd \uc815\ub2f5\u00b7\ud574\uc124 \ub2e4\uc2dc \ubcf4\uae30</button>' : '') + '</div>';
  }).join('');
  p.style.display = 'block';
}

function getLevel(s) {
  if (s >= 95) return { name: '\ub9c8\uc2a4\ud130', icon: '\ud83d\udc51', range: '95~100', msg: '\uc774 \ub2e8\uc6d0\uc740 \uc815\ubcf5\ud588\uc5b4\uc694!' };

}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

    filtered = Q.map(function (q, i) { return { q: q, i: i }; }).filter(function (f) { return secs.includes(f.q.sec); });
    S = { ans: Array(filtered.length).fill(null), cur: 0, ti: null, left: EI.time, start: Date.now(), order: shuffle([].concat(Array(filtered.length).keys ? Array.from({ length: filtered.length }, function (_, i) { return i; }) : [])), filtered: filtered.map(function (f) { return f.i; }), secs: secs };
    EI._origTotalQ = EI.totalQ; EI._origTotal = EI.total;

function showQ(idx, direction) {

function renderContent(idx, qi, q, tc, mk, pp) {

function selectAns(idx, ci) {
  var qi = S.order ? S.order[idx] : idx;
  if (S.filtered) qi = S.filtered[qi];
  S.ans[qi] = ci;
  var btns = document.querySelectorAll('.slide-choices .choice-btn');
  btns.forEach(function (b, i) {
    b.classList.toggle('selected', i === ci);
    if (i === ci) b.classList.add('just-selected');
  });
  updateProgress();
}

function writeAns(idx, val) {
  var qi = S.order ? S.order[idx] : idx;
  if (S.filtered) qi = S.filtered[qi];
  S.ans[qi] = val.trim() || null;
  updateProgress();
}

function navQ(dir) {
  var next = S.cur + dir;
  if (next >= 0 && next < EI.totalQ) showQ(next, dir);
}

function updateProgress() {
  var answered = S.ans.filter(function (a) { return a !== null; }).length;
  document.getElementById('progressFill').style.width = (answered / EI.totalQ * 100) + '%';
  document.getElementById('ansCount').textContent = answered + '/' + EI.totalQ;
}

function initSwipe() {
  var startX = 0, startY = 0;
  var el = document.getElementById('slideWrap');
  el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0 && S.cur < EI.totalQ - 1) navQ(1);
      if (dx > 0 && S.cur > 0) navQ(-1);
    }
  }, { passive: true });
}

function submitExam() {
  if (!confirm('\uc81c\ucd9c\ud558\uc2dc\uaca0\uc2b5\ub2c8\uae4c?')) return;
  clearInterval(S.ti);
  var elapsed = Math.floor((Date.now() - S.start) / 1000);
  var r = grade();
  saveToHistory(r, elapsed);
  renderResults(r, elapsed);
  showScreen('resultScreen');
  window.scrollTo(0, 0);
}

function grade() {
  var score = 0, correct = 0, wrong = 0, unanswered = 0;
  var details = [];
  var qs = S.filtered ? S.filtered.map(function (i) { return Q[i]; }) : Q;
  qs.forEach(function (q, i) {
    var a = S.ans[i];
    var ok = false;
    if (a === null) unanswered++;
    else if (q.fmt === 'mc') ok = a === q.ans;
    else {
      var u = String(a).trim().toLowerCase();
      if (q.accept) ok = q.accept.some(function (x) { return u === x.toLowerCase(); });
      if (!ok && q.wa) ok = u === q.wa.toLowerCase();
    }
    if (a !== null) { if (ok) { correct++; score += q.pts; } else wrong++; }
    details.push({ q: q, ans: a, ok: ok });
  });
  return { score: score, correct: correct, wrong: wrong, unanswered: unanswered, details: details };
}

}

function getTestName() {
  var t = document.title;
  if (t.includes('\ub2e8\uc5b4')) return '\ub2e8\uc5b4\ud14c\uc2a4\ud2b8';
  if (t.includes('\uc6cc\ud06c\ubd81')) return '\uc6cc\ud06c\ubd81\ud14c\uc2a4\ud2b8';
  if (t.includes('\ud034\uc988')) return '\ud034\uc988(\uc608\uc0c1\ubb38\uc81c)\ud14c\uc2a4\ud2b8';
  return 'TEST';
}

function copyResult() {
  var r = grade(), lv = getLevel(r.score), pct = Math.round(r.score / EI.total * 100);
  var nm = document.getElementById('inpName').value.trim();
  var sc = document.getElementById('inpSchool').value.trim();
  var gr = document.getElementById('inpGrade').value;
  var elapsed = Math.floor((Date.now() - S.start) / 1000);
  var pass = r.score >= 80, tn = getTestName(), wk = getWeakTypes();
  var tm = {};
  r.details.forEach(function (d) {
    var t = d.q.type;
    if (!tm[t]) tm[t] = { total: 0, ok: 0 };
    tm[t].total++;
    if (d.ok) tm[t].ok++;
  });
  var secLabel = S.secs ? S.secs.join(', ') : '\uc804\uccb4';
  var txt = '\ud83d\udcdd \ub0b4\uc2e0\ud56b ' + tn + ' \uacb0\uacfc\n' + EI.subject + ' \u00b7 ' + EI.pub + ' [' + secLabel + ']\n' + nm + (sc ? ' \u00b7 ' + sc : '') + ' \u00b7 ' + gr + '\n' + new Date().toLocaleDateString('ko-KR') + '\n\n' + lv.icon + ' ' + lv.name + ' \u00b7 ' + r.score + '/' + EI.total + '\uc810 (' + pct + '%)\n' + (pass ? '\ud83c\udf89 \ud1b5\uacfc!' : '\ud83d\udcda \ubbf8\ud1b5\uacfc') + ' \u00b7 \u2705' + r.correct + ' \u274c' + r.wrong + ' \u2b1c' + r.unanswered + '\n\u23f1\ufe0f ' + fmtTime(elapsed);
  if (wk.length) {
    txt += '\n\n\ud83d\udd0d \ub0b4\uc2e0\ud56b \uc57d\uc810 \uc9c4\ub2e8';
    wk.forEach(function (w) { var d = tm[w]; txt += '\n\u2022 ' + w.replace(/\(.+?\)/g, '').trim() + ' ' + d.ok + '/' + d.total + ' \u2192 ' + getTypeAdvice(w); });
  }
  txt += '\n\n\ud83d\udcca \ub0b4\uc2e0\ud56b | \ub0b4\uc2e0 \uc601\uc5b4 \uc644\ubcbd \ub300\ube44';
  navigator.clipboard.writeText(txt).then(function () { toast('\ud83d\udccb \uacb0\uacfc\uac00 \ubcf5\uc0ac\ub418\uc5c8\uc2b5\ub2c8\ub2e4!'); }).catch(function () { toast('\ubcf5\uc0ac \uc2e4\ud328'); });
}

function shareImage() {
  var tn = getTestName(), wk = getWeakTypes(), r = grade(), lv = getLevel(r.score);
  var pct = Math.round(r.score / EI.total * 100), pass = r.score >= 80;
  var nm = document.getElementById('inpName').value.trim();
  var tm = {};
  r.details.forEach(function (d) {
    var t = d.q.type;
    if (!tm[t]) tm[t] = { total: 0, ok: 0 };
    tm[t].total++;
    if (d.ok) tm[t].ok++;
  });
  var pc = pass ? '#16A34A' : '#D63B3B';
  var card = '<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">';
  card += '<div style="background:linear-gradient(135deg,' + (pass ? '#E8F5E9,#C8E6C9' : '#FFF0F0,#FFEAEA') + ');padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:' + pc + ';margin-bottom:4px">\ub0b4\uc2e0\ud56b ' + tn + '</div><div style="font-size:13px;color:#666;margin-bottom:16px">' + EI.subject + ' \u00b7 ' + EI.pub + '</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">' + r.score + '<span style="font-size:20px;color:#aaa">/' + EI.total + '</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:' + pc + ';color:#fff">' + lv.icon + ' ' + lv.name + ' \u00b7 ' + (pass ? '\ud1b5\uacfc' : '\ubbf8\ud1b5\uacfc') + '</span></div><div style="margin-top:12px;font-size:12px;color:#888">\ud83d\udc64 ' + nm + ' \u00b7 \u2705' + r.correct + ' \u274c' + r.wrong + ' \u2b1c' + r.unanswered + '</div></div>';
  if (wk.length) {
    card += '<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">\ud83d\udd0d \ub0b4\uc2e0\ud56b \uc57d\uc810 \uc9c4\ub2e8</div>';
    Object.entries(tm).forEach(function (entry) {
      var type = entry[0], d = entry[1];
      var p = Math.round(d.ok / d.total * 100);
      var c = p === 100 ? '#16A34A' : p >= 50 ? '#F59E0B' : '#D63B3B';
      card += '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">' + type.replace(/\(.+?\)/g, '').trim() + '</span><span style="font-weight:800;color:' + c + '">' + d.ok + '/' + d.total + '</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:' + p + '%;background:' + c + ';border-radius:3px"></div></div></div>';
    });
    card += '</div>';
  }
  card += '<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">\ud83d\udcca <b style="color:#333">\ub0b4\uc2e0\ud56b</b> | \ub0b4\uc2e0 \uc601\uc5b4 \uc644\ubcbd \ub300\ube44</div></div>';
  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-9999px;top:0;';
  wrap.innerHTML = card;
  document.body.appendChild(wrap);
  html2canvas(wrap.firstChild, { scale: 2, backgroundColor: null, useCORS: true }).then(function (canvas) {
    document.body.removeChild(wrap);
    canvas.toBlob(function (blob) {
      if (navigator.share && blob) {
        var file = new File([blob], '\ub0b4\uc2e0\ud56b_' + tn + '_\uacb0\uacfc.png', { type: 'image/png' });
        navigator.share({ files: [file], title: '\ub0b4\uc2e0\ud56b ' + tn + ' \uacb0\uacfc' }).catch(function () {});
      } else {
        var a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = '\ub0b4\uc2e0\ud56b_' + tn + '_\uacb0\uacfc.png';
        a.click();
      }
      toast('\ud83d\udcf8 \uacb0\uacfc \uc774\ubbf8\uc9c0\uac00 \uc800\uc7a5\ub418\uc5c8\uc2b5\ub2c8\ub2e4!');
    });
  }).catch(function () { toast('\uc774\ubbf8\uc9c0 \uc0dd\uc131 \uc2e4\ud328'); });
}

function reviewHistory(idx) {
  var h = getHistory();
  var rec = h[idx];
  if (!rec || !rec.answers) return toast('\uc774\uc804 \ubc84\uc804 \uae30\ub85d\uc740 \ud574\uc124\uc744 \ubcfc \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.');
  S.ans = rec.answers;
  S.start = Date.now() - rec.elapsed * 1000;
  document.getElementById('inpName').value = rec.name || '';
  document.getElementById('inpSchool').value = rec.school || '';
  document.getElementById('inpGrade').value = rec.grade || '\uace01';
  var r = grade();
  renderResults(r, rec.elapsed);
  showScreen('resultScreen');
  window.scrollTo(0, 0);
}

function retake() { location.reload(); }
function goHome() { showScreen('startScreen'); updateHCount(); }

window.addEventListener('beforeunload', function (e) {
  if (S.ti) { e.preventDefault(); e.returnValue = ''; }
});

updateHCount();
</script>
