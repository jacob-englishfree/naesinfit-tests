<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공통영어1 YBM(박준언) 온라인워크북TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* NaesinFit — Purple Theme (워크북테스트) */
:root{
  --p:#7C3AED;--pd:#5B21B6;--pl:#A78BFA;--pxl:#F3F0FF;--pxxl:#FAF5FF;
  --bg:#F5F3FF;--text:#1A1A2E;--tm:#6B5B8A;--tl:#9A8DB8;
  --r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;
  --o:#F59E0B;--ol:#FFF8E1;
  --card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);
  --radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;
  --pborder:#d8d0e8;--pbg-muted:#e8e0f0;
  --passage-bg:linear-gradient(135deg,#FAFAFF,#F5F3FA);
  --start-grad:linear-gradient(160deg,#F3F0FF,#EDE7F6 40%,#E8E0F6);
  --accent2:#6D28D9;
  --p-rgba-08:rgba(124,58,237,.08);
  --p-rgba-10:rgba(124,58,237,.1);
  --p-rgba-12:rgba(124,58,237,.12);
  --p-rgba-25:rgba(124,58,237,.25);
  --p-rgba-30:rgba(124,58,237,.3);
}

/* NaesinFit Test Engine — Common CSS (theme-agnostic)
   Theme-specific colors come from :root variables defined in theme-*.css:
   --p      : primary color
   --pd     : primary dark
   --pl     : primary light
   --pxl    : primary extra-light
   --pxxl   : primary xx-light
   --bg     : page background
   --text   : main text
   --tm     : text muted
   --tl     : text light
   --pborder: border color (theme-tinted)
   --pbg-muted: muted bg for tracks/bars
   --start-grad: startScreen gradient
   --accent2: secondary gradient stop (badge/header)
   --p-rgba-08: rgba for selected bg
   --p-rgba-12: rgba for box-shadow
   --p-rgba-10: rgba for focus ring
   --p-rgba-25: rgba for button shadow
   --p-rgba-30: rgba for selectPulse
*/

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Start Screen */
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:var(--start-grad);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--p),var(--accent2));color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--p),var(--accent2));padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid var(--pborder);}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid var(--pborder);border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid var(--pborder);border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-rgba-10);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;box-shadow:0 6px 20px var(--p-rgba-30);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid var(--pborder);color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--p);color:var(--p);}
.history-badge{background:var(--pxl);color:var(--p);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid var(--pborder);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--p);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}

/* Exam Screen */
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--p);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--p);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--p);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--accent2));transition:width .5s ease;border-radius:0 2px 2px 0;}

/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--pxl),var(--pl));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--pd);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:10px 14px 14px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
.slide-choices{display:flex;flex-direction:column;gap:3px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12px;line-height:1.3;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--p);background:var(--p-rgba-08);box-shadow:0 0 0 3px var(--p-rgba-12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 var(--p-rgba-30)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:20px;height:20px;font-size:10px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--p-rgba-10);}
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;box-shadow:0 2px 8px var(--p-rgba-25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--p);}
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--p);background:var(--pxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}

/* Type tags — same across all themes */
.tag-combo{background:#E8F5E9;color:#166534;}.tag-wrong{background:#FFF0F0;color:#D63B3B;}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:#EDF2FF;color:#3B6FD9;}.tag-ant{background:#FFF8E1;color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}.tag-insert{background:#E3F2FD;color:#1565C0;}.tag-order{background:#FFF8E1;color:#F57F17;}

.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:var(--pbg-muted);padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--p);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:var(--passage-bg);border-left:3px solid var(--p);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--pborder);border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--p);}.choice-btn.selected{border-color:var(--p);box-shadow:0 0 0 2px var(--p-rgba-12);background:var(--pxxl);}
.c-num{min-width:22px;height:22px;background:var(--pbg-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid var(--pborder);border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--p);}

/* Result Screen */
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--pxl),var(--pl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:var(--pbg-muted);border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--pl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--pxxl);border-radius:var(--rs);border:1px solid var(--pborder);}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--pxl);}.info-cell.highlight .ic-value{color:var(--p);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:var(--pbg-muted);border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--pl);color:var(--p);}.tag-item.weak{background:#FFF0F0;color:#D63B3B;}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--pxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid var(--pborder);border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--p);color:var(--p);}.act-btn.primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid var(--pborder);border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--pxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--pxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--pl);color:var(--p);}.expl-tag.tip{background:var(--pxl);color:var(--pd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--p);}.expl-box.tip-b{border-left:3px solid var(--p);background:var(--pxl);}

@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">온라인워크북 TEST</div>
  <h1 class="start-title">온라인워크북 <span>TEST</span></h1>
  <p class="start-subtitle">공통영어1 · YBM(박준언) · 1과 · 20문항</p>
  <div class="info-card"><div class="info-card-header">시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">공통영어1</span></div>
    <div class="info-row"><span class="info-label">문항</span><span class="info-value">YBM(박준언) (1과)</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">The Magic of Morning Pages</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">20문항</div><div class="chip">20분</div><div class="chip">80점 이상 통과</div><div class="chip">100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="startExam()">시험 시작하기</button>
  <button class="btn btn-outline" onclick="toggleHistory()">시험 기록 보기 <span class="history-badge" id="hCount">0</span></button>
  <div id="historyPanel"></div>
</div>
</div>

<div id="examScreen" class="screen">
  <div class="exam-topbar"><div class="topbar-left"><div class="topbar-dot"></div><div class="topbar-info">공통영어1 · <span>YBM(박준언)</span></div></div><div class="timer" id="timer">20:00</div><button class="btn-submit" onclick="submitExam()">제출하기</button></div>
  <div class="exam-progress"><div class="exam-progress-fill" id="progressFill"></div></div>
  <div class="ans-count" id="ansCount">0/20</div>

const FULL_PASSAGE="Welcome to my channel Good Habits! This is Regan, your podcast host. Today, I'm going to talk about a way of starting the day that many people, including me, find enormously useful. It's a kind of journaling called \"the morning pages.\" There is no age at which it is too late to form this habit. I started eight years ago as a high school student, and that's why today's episode is especially for my teenage subscribers.\n\nThe morning pages are three pages of \"free writing,\" ideally done first thing in the morning. The concept is simple. Get up every morning, pick up a pen and a notebook, and write whatever crosses your mind until you have filled three pages. The technique was originally developed to help writers and artists overcome a loss of creativity, but anybody can use it to create a better life.\n\nThere is no right or wrong way to write your morning pages, but there are two rules. First, don't judge your writing as good or bad. These pages are meant to be a \"brain cleansing,\" so don't worry about writing correctly. Second, keep your writing completely private. It is important for you to write freely and honestly. You're even advised not to read your writing yourself for weeks.\n\nNow, let me share the experiences of some people I interviewed. David, a chef and kitchen manager, who has been writing morning pages for two years, says:\n\nMy job tends to be very stressful. When I started writing morning pages, I just wrote a lot of complaints about my hard life. Later, I began to ask questions, like \"What would make my life easier today?\" \"How can I improve my recipes?\" Sometimes, I keep asking questions until I reach a sort of \"click moment.\" It feels like a door opening to great ideas. Nowadays, I feel less stressed, enjoy my job more, and am more productive.\n\nNow, let's listen to Yuna, a high school junior:\n\nWhen I started this exercise last year, I simply wrote random thoughts like this:\nI'm sleepy. A slight headache's starting.\nI need to finish the math assignment today ...\nI don't know what more to write now.\n\nBut soon I found I had deeper and deeper thoughts. Now, I normally start by writing about today's tasks or worries. After that, I write about my dreams and how to move towards them. I often come up with great plans and a clear sense of purpose to start the day. Most importantly, I'm much happier than before.\n\nI can totally relate to these two people because their experiences are similar to mine. Like Yuna, I started this journaling during my first year of high school. At that time, I felt lost, stressed, and unsure about the future, and it wasn't easy for me to concentrate. When I first tried writing three daily pages, I didn't expect to stick to it. But I did, and it changed my life!\n\nReleasing my feelings onto paper every morning helped relieve my emotional tension. I gained more inner peace, which improved my schoolwork performance. Like David, I asked many questions, for instance, \"Why was I so angry yesterday?\" \"Why are things less fun these days?\" Then, I started raising more challenging ones: \"What could make me happier right now?\" \"What is my ideal future? Can I reach it? How?\"\n\nAnswering these questions showed me what kind of person I was and what my needs, values, passions, and talents were. More importantly, I came to know what I truly wanted! I remembered my childhood dreams of being a writer, songwriter, and radio host. Gradually, vague ideas became clear plans. Years later, here I am, a successful podcaster and vlogger! I've also published a book and a music album. My morning pages, which I still write every day, have given me the drive and ideas to achieve these aims.\n\nDear subscribers, will you try writing your morning pages, too? You never know what creative energy or ideas you have until you start exploring. Don't be a perfectionist, though. If you miss a few days, simply open your notebook and start again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.";

t again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"다음 밑줄 친 부분의 용법으로 가장 적절한 것을 고르시오.<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">The technique was originally developed <b><u>to help</u></b> writers and artists overcome a loss of creativity.</div>","det":{"ref":"[원문] The technique was originally developed to help writers and artists overcome a loss of creativity. [해석] 그 기법은 원래 작가와 예술가들이 창의력 상실을 극복하도록 돕기 위해 개발되었다.","correct":"to help는 목적을 나타내는 to부정사의 부사적 용법이다. '~하기 위해'의 의미로, 개발된 목적을 설명한다.","wrongs":["① 명사적 용법 (주어) — to help가 문장의 주어로 쓰이려면 문두에 와야 한다 ❌","② 명사적 용법 (목적어) — developed의 목적어가 아니라 목적을 나타낸다 ❌","④ 형용사적 용법 — 앞의 명사를 수식하는 것이 아니라 동사를 수식한다 ❌","⑤ 명사적 용법 (보어) — 보어로 쓰이려면 주어+be동사 뒤에 와야 한다 ❌"],"tip":"💡 to부정사 부사적 용법(목적): '~하기 위해' = in order to\n⚠️ 'help + 목적어 + 동사원형'도 함께 주목 (help 뒤에 to 생략 가능)"},"ans":2,"ch":["① 명사적 용법 (주어)","② 명사적 용법 (목적어)","③ 부사적 용법 (목적)","④ 형용사적 용법"]},

t again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"다음 밑줄 친 부분의 문법적 설명으로 가장 적절한 것을 고르시오.<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\"><b><u>It</u></b> is important for you to write freely and honestly.</div>","det":{"ref":"[원문] It is important for you to write freely and honestly. [해석] 자유롭고 솔직하게 쓰는 것이 중요하다.","correct":"It은 가주어이고, 진주어는 to write freely and honestly이다. 'It is + 형용사 + for 목적격 + to부정사' 구문이다.","wrongs":["① 대명사 (앞 문장의 writing을 지칭) — It은 특정 대상을 가리키는 것이 아니라 가주어이다 ❌","② 비인칭 주어 (날씨/시간) — 날씨나 시간 표현이 아니다 ❌","④ 강조구문의 It — 'It is ~ that ...' 강조구문이 아니다 ❌","⑤ 대명사 (morning pages를 지칭) — morning pages는 복수이므로 It으로 받을 수 없다 ❌"],"tip":"💡 It(가주어) ... to부정사(진주어) 구문: for+목적격은 to부정사의 의미상 주어\n⚠️ 'It ~ that' 강조구문과 혼동 주의. 강조구문은 that 이하가 완전한 문장"},"ans":2,"ch":["① 대명사 (앞 문장의 writing을 지칭)","② 비인칭 주어 (날씨/시간)","③ 가주어 (진주어: to write freely and honestly)","④ 강조구문의 It (It is ~ that)"]},
{"id":5,"type":"어법","diff":"보통","pts":5,"fmt":"mc","passage":"Welcome to my channel Good Habits! This is Regan, your podcast host. Today, I'm going to talk about a way of starting the day that many people, including me, find enormously useful. It's a kind of journaling called \"the morning pages.\" There is no age at which it is too late to form this habit. I started eight years ago as a high school student, and that's why today's episode is especially for my teenage subscribers.\n\nThe morning pages are three pages of \"free writing,\" ideally done first thing in the morning. The concept is simple. Get up every morning, pick up a pen and a notebook, and write whatever crosses your mind until you have filled three pages. The technique was originally developed to help writers and artists overcome a loss of creativity, but anybody can use it to create a better life.\n\nThere is no right or wrong way to write your morning pages, but there are two rules. First, don't judge your writing as good or bad. These pages are meant to be a \"brain cleansing,\" so don't worry about writing correctly. Second, keep your writing completely private. It is important for you to write freely and honestly. You're even advised not to read your writing yourself for weeks.\n\nNow, let me share the experiences of some people I interviewed. David, a chef and kitchen manager, who has been writing morning pages for two years, says:\n\nMy job tends to be very stressful. When I started writing morning pages, I just wrote a lot of complaints about my hard life. Later, I began to ask questions, like \"What would make my life easier today?\" \"How can I improve my recipes?\" Sometimes, I keep asking questions until I reach a sort of \"click moment.\" It feels like a door opening to great ideas. Nowadays, I feel less stressed, enjoy my job more, and am more productive.\n\nNow, let's listen to Yuna, a high school junior:\n\nWhen I started this exercise last year, I simply wrote random thoughts like this:\nI'm sleepy. A slight headache's starting.\nI need to finish the math assignment today ...\nI don't know what more to write now.\n\nBut soon I found I had deeper and deeper thoughts. Now, I normally start by writing about today's tasks or worries. After that, I write about my dreams and how to move towards them. I often come up with great plans and a clear sense of purpose to start the day. Most importantly, I'm much happier than before.\n\nI can totally relate to these two people because their experiences are similar to mine. Like Yuna, I started this journaling during my first year of high school. At that time, I felt lost, stressed, and unsure about the future, and it wasn't easy for me to concentrate. When I first tried writing three daily pages, I didn't expect to stick to it. But I did, and it changed my life!\n\nReleasing my feelings onto paper every morning helped relieve my emotional tension. I gained more inner peace, which improved my schoolwork performance. Like David, I asked many questions, for instance, \"Why was I so angry yesterday?\" \"Why are things less fun these days?\" Then, I started raising more challenging ones: \"What could make me happier right now?\" \"What is my ideal future? Can I reach it? How?\"\n\nAnswering these questions showed me what kind of person I was and what my needs, values, passions, and talents were. More importantly, I came to know what I truly wanted! I remembered my childhood dreams of being a writer, songwriter, and radio host. Gradually, vague ideas became clear plans. Years later, here I am, a successful podcaster and vlogger! I've also published a book and a music album. My morning pages, which I still write every day, have given me the drive and ideas to achieve these aims.\n\nDear subscribers, will you try writing your morning pages, too? You never know what creative energy or ideas you have until you start exploring. Don't be a perfectionist, though. If you miss a few days, simply open your notebook and start again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"다음 밑줄 친 부분의 어법상 올바른 형태를 고르시오.<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">David, a chef and kitchen manager, who <b><u>has been writing</u></b> morning pages for two years, says:</div>","det":{"ref":"[원문] David, a chef and kitchen manager, who has been writing morning pages for two years, says: [해석] 2년 동안 모닝 페이지를 써 오고 있는 주방장 겸 주방 매니저 David는 말한다.","correct":"has been writing은 현재완료진행형으로, 과거에 시작한 동작이 현재까지 계속 진행 중임을 나타낸다. for two years(2년 동안)와 함께 쓰여 기간을 강조한다.","wrongs":["① wrote — 단순 과거시제로 과거에 끝난 동작을 나타냄, 현재 계속 중인 의미 전달 불가 ❌","② has written — 현재완료이지만 진행의 의미가 약함, 원문은 진행 강조 ❌","④ had been writing — 과거완료진행은 과거 특정 시점 이전의 계속을 나타냄, 현재 시점 부적절 ❌","⑤ is writing — 현재진행이므로 for two years와 함께 쓸 수 없음 ❌"],"tip":"💡 현재완료진행형(have/has been -ing): '(과거부터) 지금까지 계속 ~하고 있다'\n⚠️ for/since와 함께 쓰이면 기간/시점 강조. 현재완료 vs 현재완료진행: 진행형은 동작의 지속 강조"},"ans":2,"ch":["① wrote","② has written","③ has been writing","④ had been writing"]},

is:\nI'm sleepy. A slight headache's starting.\nI need to finish the math assignment today ...\nI don't know what more to write now.\n\nBut soon I found I had deeper and deeper thoughts. Now, I normally start by writing about today's tasks or worries. After that, I write about my dreams and how to move towards them. I often come up with great plans and a clear sense of purpose to start the day. Most importantly, I'm much happier than before.\n\nI can totally relate to these two people because their experiences are similar to mine. Like Yuna, I started this journaling during my first year of high school. At that time, I felt lost, stressed, and unsure about the future, and it wasn't easy for me to concentrate. When I first tried writing three daily pages, I didn't expect to stick to it. But I did, and it changed my life!\n\nReleasing my feelings onto paper every morning helped relieve my emotional tension. I gained more inner peace, which improved my schoolwork performance. Like David, I asked many questions, for instance, \"Why was I so angry yesterday?\" \"Why are things less fun these days?\" Then, I started raising more challenging ones: \"What could make me happier right now?\" \"What is my ideal future? Can I reach it? How?\"\n\nAnswering these questions showed me what kind of person I was and what my needs, values, passions, and talents were. More importantly, I came to know what I truly wanted! I remembered my childhood dreams of being a writer, songwriter, and radio host. Gradually, vague ideas became clear plans. Years later, here I am, a successful podcaster and vlogger! I've also published a book and a music album. My morning pages, which I still write every day, have given me the drive and ideas to achieve these aims.\n\nDear subscribers, will you try writing your morning pages, too? You never know what creative energy or ideas you have until you start exploring. Don't be a perfectionist, though. If you miss a few days, simply open your notebook and start again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"다음 글의 (A), (B), (C)에서 어법에 맞는 표현으로 가장 적절한 것은?<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">(A) <b>[Releasing / Released]</b> my feelings onto paper every morning helped relieve my emotional tension. I gained more inner peace, (B) <b>[which / what]</b> improved my schoolwork performance. Then, I started raising more (C) <b>[challenging / challenged]</b> ones.</div>","det":{"ref":"[원문] Releasing my feelings ... which improved ... more challenging ones [해석] 감정을 쏟아내는 것이 ... 이것이 학업 성적을 향상시켰다 ... 더 도전적인 질문들","correct":"(A) Releasing: 동명사가 주어 역할 (B) which: 앞 절 전체를 선행사로 하는 계속적 용법의 관계대명사 (C) challenging: 현재분사로 '도전적인'의 능동 의미","wrongs":["① Released-which-challenged ❌","② Releasing-what-challenged ❌","④ Released-what-challenging ❌","⑤ Released-which-challenging ❌"],"tip":"💡 동명사 주어(V-ing ~): 단수 취급. 콤마+which: 계속적 용법 (앞 절 전체 수식 가능)\n⚠️ what vs which: what은 선행사를 포함하므로 콤마 뒤에 올 수 없다"},"ans":2,"ch":["① Released - which - challenged","② Releasing - what - challenged","③ Releasing - which - challenging","④ Released - what - challenging"]},

t again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"다음 밑줄 친 부분 중 어법상 올바른 것을 고르시오.<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">But soon I found I had <b><u>deeper and deeper</u></b> thoughts.</div>","det":{"ref":"[원문] But soon I found I had deeper and deeper thoughts. [해석] 하지만 곧 점점 더 깊은 생각을 하게 되었다.","correct":"deeper and deeper는 '비교급 and 비교급' 구조로 '점점 더 ~한'의 의미이다. deep은 1음절 형용사이므로 -er을 붙인다.","wrongs":["① more deep and more deep — 1음절 형용사는 more를 쓰지 않는다 ❌","② more deeper and more deeper — 이중 비교급(more + -er)은 불가 ❌","④ the deeper and the deeper — 비교급 반복 구문에 the를 붙이지 않는다 ❌","⑤ deepest and deepest — 최상급 반복은 비문법적이다 ❌"],"tip":"💡 '비교급 and 비교급': 점점 더 ~한 (= increasingly)\n⚠️ 1음절: -er / 2음절 이상: more. 이중 비교급(more + -er) 절대 불가"},"ans":2,"ch":["① more deep and more deep","② more deeper and more deeper","③ deeper and deeper","④ the deeper and the deeper"]},

rt again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"다음 글의 밑줄 친 ⓐ~ⓔ 중 어법상 틀린 것을 고르시오.<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">Answering these questions showed me ⓐ<b><u>what</u></b> kind of person I was. I remembered my childhood dreams of ⓑ<b><u>being</u></b> a writer. My morning pages, ⓒ<b><u>which</u></b> I still write every day, have given me the drive. You never know ⓓ<b><u>that</u></b> creative energy you have until you start exploring. The ultimate aim is to improve your mental health and help you ⓔ<b><u>lead</u></b> a happier life.</div>","det":{"ref":"[원문] You never know what creative energy or ideas you have until you start exploring. [해석] 탐구를 시작하기 전까지는 어떤 창의적 에너지나 아이디어가 있는지 모른다.","correct":"ⓓ that → what. 'know + 의문사절' 구조에서 '어떤 ~인지'의 의미이므로 의문형용사 what이 필요하다. that은 의문사가 아니므로 creative energy를 수식할 수 없다.","wrongs":["ⓐ what — what kind of: '어떤 종류의'를 묻는 의문형용사, 적절 ✅","ⓑ being — dreams of being: 전치사 of 뒤에 동명사 적절 ✅","ⓒ which — 계속적 용법의 관계대명사, 적절 ✅","ⓔ lead — help + 목적어 + 동사원형, 적절 ✅"],"tip":"💡 what vs that: what은 의문사/관계대명사, that은 접속사/지시사. 의문사절에는 what 사용\n⚠️ help + 목적어 + (to) 동사원형: to 생략 가능"},"ans":3,"ch":["① ⓐ","② ⓑ","③ ⓒ","④ ⓓ"]},
{"id":9,"type":"어휘","diff":"보통","pts":5,"fmt":"mc","passage":"Welcome to my channel Good Habits! This is Regan, your podcast host. Today, I'm going to talk about a way of starting the day that many people, including me, find enormously useful. It's a kind of journaling called \"the morning pages.\" There is no age at which it is too late to form this habit. I started eight years ago as a high school student, and that's why today's episode is especially for my teenage subscribers.\n\nThe morning pages are three pages of \"free writing,\" ideally done first thing in the morning. The concept is simple. Get up every morning, pick up a pen and a notebook, and write whatever crosses your mind until you have filled three pages. The technique was originally developed to help writers and artists overcome a loss of creativity, but anybody can use it to create a better life.\n\nThere is no right or wrong way to write your morning pages, but there are two rules. First, don't judge your writing as good or bad. These pages are meant to be a \"brain cleansing,\" so don't worry about writing correctly. Second, keep your writing completely private. It is important for you to write freely and honestly. You're even advised not to read your writing yourself for weeks.\n\nNow, let me share the experiences of some people I interviewed. David, a chef and kitchen manager, who has been writing morning pages for two years, says:\n\nMy job tends to be very stressful. When I started writing morning pages, I just wrote a lot of complaints about my hard life. Later, I began to ask questions, like \"What would make my life easier today?\" \"How can I improve my recipes?\" Sometimes, I keep asking questions until I reach a sort of \"click moment.\" It feels like a door opening to great ideas. Nowadays, I feel less stressed, enjoy my job more, and am more productive.\n\nNow, let's listen to Yuna, a high school junior:\n\nWhen I started this exercise last year, I simply wrote random thoughts like this:\nI'm sleepy. A slight headache's starting.\nI need to finish the math assignment today ...\nI don't know what more to write now.\n\nBut soon I found I had deeper and deeper thoughts. Now, I normally start by writing about today's tasks or worries. After that, I write about my dreams and how to move towards them. I often come up with great plans and a clear sense of purpose to start the day. Most importantly, I'm much happier than before.\n\nI can totally relate to these two people because their experiences are similar to mine. Like Yuna, I started this journaling during my first year of high school. At that time, I felt lost, stressed, and unsure about the future, and it wasn't easy for me to concentrate. When I first tried writing three daily pages, I didn't expect to stick to it. But I did, and it changed my life!\n\nReleasing my feelings onto paper every morning helped relieve my emotional tension. I gained more inner peace, which improved my schoolwork performance. Like David, I asked many questions, for instance, \"Why was I so angry yesterday?\" \"Why are things less fun these days?\" Then, I started raising more challenging ones: \"What could make me happier right now?\" \"What is my ideal future? Can I reach it? How?\"\n\nAnswering these questions showed me what kind of person I was and what my needs, values, passions, and talents were. More importantly, I came to know what I truly wanted! I remembered my childhood dreams of being a writer, songwriter, and radio host. Gradually, vague ideas became clear plans. Years later, here I am, a successful podcaster and vlogger! I've also published a book and a music album. My morning pages, which I still write every day, have given me the drive and ideas to achieve these aims.\n\nDear subscribers, will you try writing your morning pages, too? You never know what creative energy or ideas you have until you start exploring. Don't be a perfectionist, though. If you miss a few days, simply open your notebook and start again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"다음 글의 (A), (B), (C)에서 문맥에 맞는 낱말로 가장 적절한 것은?<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">The technique was originally developed to help writers and artists (A) <b>[overcome / overlook]</b> a loss of creativity. These pages are meant to be a \"brain cleansing,\" so don't worry about writing (B) <b>[correctly / creatively]</b>. It is important for you to write (C) <b>[freely / formally]</b> and honestly.</div>","det":{"ref":"[원문] overcome a loss of creativity / writing correctly / write freely and honestly [해석] 창의력 상실을 극복하다 / 올바르게 쓰기 / 자유롭고 솔직하게 쓰기","correct":"(A) overcome: 창의력 상실을 '극복하다' (B) correctly: 올바르게 쓰는 것에 대해 걱정하지 말라 (C) freely: 자유롭고 솔직하게 쓰는 것이 중요하다","wrongs":["① overcome-creatively-freely ❌ (B) 두뇌 청소이므로 '올바르게'가 적절","② overlook-correctly-freely ❌ (A) 창의력 상실을 '간과'하면 문맥 반대","④ overlook-creatively-formally ❌ (A)(B)(C) 모두 문맥 부적절","⑤ overcome-correctly-formally ❌ (C) 형식적으로 쓰면 문맥 반대"],"tip":"💡 overcome(극복하다) vs overlook(간과하다): 의미 반대\n⚠️ freely(자유롭게) vs formally(형식적으로): morning pages는 자유로운 글쓰기"},"ans":2,"ch":["① overcome - creatively - freely","② overlook - correctly - freely","③ overcome - correctly - freely","④ overlook - creatively - formally"]},

his:\nI'm sleepy. A slight headache's starting.\nI need to finish the math assignment today ...\nI don't know what more to write now.\n\nBut soon I found I had deeper and deeper thoughts. Now, I normally start by writing about today's tasks or worries. After that, I write about my dreams and how to move towards them. I often come up with great plans and a clear sense of purpose to start the day. Most importantly, I'm much happier than before.\n\nI can totally relate to these two people because their experiences are similar to mine. Like Yuna, I started this journaling during my first year of high school. At that time, I felt lost, stressed, and unsure about the future, and it wasn't easy for me to concentrate. When I first tried writing three daily pages, I didn't expect to stick to it. But I did, and it changed my life!\n\nReleasing my feelings onto paper every morning helped relieve my emotional tension. I gained more inner peace, which improved my schoolwork performance. Like David, I asked many questions, for instance, \"Why was I so angry yesterday?\" \"Why are things less fun these days?\" Then, I started raising more challenging ones: \"What could make me happier right now?\" \"What is my ideal future? Can I reach it? How?\"\n\nAnswering these questions showed me what kind of person I was and what my needs, values, passions, and talents were. More importantly, I came to know what I truly wanted! I remembered my childhood dreams of being a writer, songwriter, and radio host. Gradually, vague ideas became clear plans. Years later, here I am, a successful podcaster and vlogger! I've also published a book and a music album. My morning pages, which I still write every day, have given me the drive and ideas to achieve these aims.\n\nDear subscribers, will you try writing your morning pages, too? You never know what creative energy or ideas you have until you start exploring. Don't be a perfectionist, though. If you miss a few days, simply open your notebook and start again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"다음 글의 밑줄 친 낱말 중 문맥상 가장 부적절한 것을 고르시오.<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">I can totally relate to these two people because their experiences are ① <b><u>similar</u></b> to mine. At that time, I felt lost, stressed, and ② <b><u>unsure</u></b> about the future, and it wasn't easy for me to ③ <b><u>concentrate</u></b>. Releasing my feelings onto paper every morning helped ④ <b><u>intensify</u></b> my emotional tension. I gained more inner peace, which ⑤ <b><u>improved</u></b> my schoolwork performance.</div>","det":{"ref":"[원문] Releasing my feelings onto paper every morning helped relieve my emotional tension. [해석] 매일 아침 종이 위에 감정을 쏟아내는 것이 감정적 긴장을 해소하는 데 도움이 되었다.","correct":"④ intensify(강화하다)는 문맥상 부적절하다. 원문은 relieve(완화하다)로, 감정적 긴장을 '줄여준' 것이지 '강화한' 것이 아니다.","wrongs":["① similar — '비슷한', 문맥 적절 ✅","② unsure — '확신이 없는', 문맥 적절 ✅","③ concentrate — '집중하다', 문맥 적절 ✅","⑤ improved — '향상시켰다', 문맥 적절 ✅"],"tip":"💡 relieve(완화하다) ↔ intensify(강화하다): 반의어 관계\n⚠️ 부적절 어휘 문제는 문맥의 흐름(긍정/부정)을 파악하는 것이 핵심"},"ans":3,"ch":["① similar","② unsure","③ concentrate","④ intensify"]},
{"id":11,"type":"어휘","diff":"어려움","pts":6,"fmt":"mc","passage":"Welcome to my channel Good Habits! This is Regan, your podcast host. Today, I'm going to talk about a way of starting the day that many people, including me, find enormously useful. It's a kind of journaling called \"the morning pages.\" There is no age at which it is too late to form this habit. I started eight years ago as a high school student, and that's why today's episode is especially for my teenage subscribers.\n\nThe morning pages are three pages of \"free writing,\" ideally done first thing in the morning. The concept is simple. Get up every morning, pick up a pen and a notebook, and write whatever crosses your mind until you have filled three pages. The technique was originally developed to help writers and artists overcome a loss of creativity, but anybody can use it to create a better life.\n\nThere is no right or wrong way to write your morning pages, but there are two rules. First, don't judge your writing as good or bad. These pages are meant to be a \"brain cleansing,\" so don't worry about writing correctly. Second, keep your writing completely private. It is important for you to write freely and honestly. You're even advised not to read your writing yourself for weeks.\n\nNow, let me share the experiences of some people I interviewed. David, a chef and kitchen manager, who has been writing morning pages for two years, says:\n\nMy job tends to be very stressful. When I started writing morning pages, I just wrote a lot of complaints about my hard life. Later, I began to ask questions, like \"What would make my life easier today?\" \"How can I improve my recipes?\" Sometimes, I keep asking questions until I reach a sort of \"click moment.\" It feels like a door opening to great ideas. Nowadays, I feel less stressed, enjoy my job more, and am more productive.\n\nNow, let's listen to Yuna, a high school junior:\n\nWhen I started this exercise last year, I simply wrote random thoughts like art again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">Gradually, __________ ideas became clear plans.</div>","det":{"ref":"[원문] Gradually, vague ideas became clear plans. [해석] 점차, 막연한 생각들이 분명한 계획이 되었다.","correct":"vague(막연한, 모호한)가 정답이다. clear plans(분명한 계획)과 대조를 이루며, 모호한 생각이 점차 구체화되었다는 문맥이다.","wrongs":["① creative — '창의적인'은 clear와 대조 관계가 아님 ❌","② practical — '실용적인'은 이미 구체적인 의미이므로 대조 부적절 ❌","④ ambitious — '야심 찬'은 clear와 의미 대조 불성립 ❌","⑤ brilliant — '뛰어난'은 clear와 의미 대조 불성립 ❌"],"tip":"💡 vague(모호한) ↔ clear(분명한): 대조 관계가 핵심 단서\n⚠️ gradually(점차)가 '변화의 과정'을 암시 → '모호한 → 분명한'으로 변화"},"ans":2,"ch":["① creative","② practical","③ vague","④ ambitious"]},

art again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"다음 글의 빈칸에 들어갈 연결사로 가장 적절한 것을 고르시오.<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">When I started writing morning pages, I just wrote a lot of complaints about my hard life. __________, I began to ask questions.</div>","det":{"ref":"[원문] When I started writing morning pages, I just wrote a lot of complaints about my hard life. Later, I began to ask questions. [해석] 처음에는 불평만 썼다. 나중에는 질문을 시작했다.","correct":"Later(나중에)가 정답이다. 처음에는 불평을 쓰다가 시간이 지나 질문을 시작했다는 시간적 순서를 나타낸다.","wrongs":["① However — 역접의 연결사, 시간 순서가 아님 ❌","② Therefore — 인과의 연결사, 불평→질문은 인과 관계가 아님 ❌","④ For example — 예시의 연결사, 질문은 불평의 예시가 아님 ❌","⑤ In contrast — 대조의 연결사, 시간적 변화를 나타내지 않음 ❌"],"tip":"💡 Later: 시간적 순서(처음에는 ~ → 나중에는 ~)\n⚠️ However(역접)와 혼동 주의: 불평→질문은 '반대'가 아닌 '발전/변화'"},"ans":2,"ch":["① However","② Therefore","③ Later","④ For example"]},
{"id":13,"type":"지칭추론","diff":"보통","pts":5,"fmt":"mc","passage":"Welcome to my channel Good Habits! This is Regan, your podcast host. Today, I'm going to talk about a way of starting the day that many people, including me, find enormously useful. It's a kind of journaling called \"the morning pages.\" There is no age at which it is too late to form this habit. I started eight years ago as a high school student, and that's why today's episode is especially for my teenage subscribers.\n\nThe morning pages are three pages of \"free writing,\" ideally done first thing in the morning. The concept is simple. Get up every morning, pick up a pen and a notebook, and write whatever crosses your mind until you have filled three pages. The technique was originally developed to help writers and artists overcome a loss of creativity, but anybody can use it to create a better life.\n\nThere is no right or wrong way to write your morning pages, but there are two rules. First, don't judge your writing as good or bad. These pages are meant to be a \"brain cleansing,\" so don't worry about writing correctly. Second, keep your writing completely private. It is important for you to write freely and honestly. You're even advised not to read your writing yourself for weeks.\n\nNow, let me share the experiences of some people I interviewed. David, a chef and kitchen manager, who has been writing morning pages for two years, says:\n\nMy job tends to be very stressful. When I started writing morning pages, I just wrote a lot of complaints about my hard life. Later, I began to ask questions, like \"What would make my life easier today?\" \"How can I improve my recipes?\" Sometimes, I keep asking questions until I reach a sort of \"click moment.\" It feels like a door opening to great ideas. Nowadays, I feel less stressed, enjoy my job more, and am more productive.\n\nNow, let's listen to Yuna, a high school junior:\n\nWhen I started this exercise last year, I simply wrote random thoughts like this:\nI'm sleepy. A slight headache's starting.\nI need to finish the math assignment today ...\nI don't know what more to write now.\n\nBut soon I found I had deeper and deeper thoughts. Now, I normally start by writing about today's tasks or worries. After that, I write about my dreams and how to move towards them. I often come up with great plans and a clear sense of purpose to start the day. Most importantly, I'm much happier than before.\n\nI can totally relate to these two people because their experiences are similar to mine. Like Yuna, I started this journaling during my first year of high school. At that time, I felt lost, stressed, and unsure about the future, and it wasn't easy for me to concentrate. When I first tried writing three daily pages, I didn't expect to stick to it. But I did, and it changed my life!\n\nReleasing my feelings onto paper every morning helped relieve my emotional tension. I gained more inner peace, which improved my schoolwork performance. Like David, I asked many questions, for instance, \"Why was I so angry yesterday?\" \"Why are things less fun these days?\" Then, I started raising more challenging ones: \"What could make me happier right now?\" \"What is my ideal future? Can I reach it? How?\"\n\nAnswering these questions showed me what kind of person I was and what my needs, values, passions, and talents were. More importantly, I came to know what I truly wanted! I remembered my childhood dreams of being a writer, songwriter, and radio host. Gradually, vague ideas became clear plans. Years later, here I am, a successful podcaster and vlogger! I've also published a book and a music album. My morning pages, which I still write every day, have given me the drive and ideas to achieve these aims.\n\nDear subscribers, will you try writing your morning pages, too? You never know what creative energy or ideas you have until you start exploring. Don't be a perfectionist, though. If you miss a few days, simply open your notebook and start again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"밑줄 친 <u>it</u>이 가리키는 것으로 가장 적절한 것을 고르시오.<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">When I first tried writing three daily pages, I didn't expect to stick to <b><u>it</u></b>. But I did, and <b><u>it</u></b> changed my life!</div>","det":{"ref":"[원문] When I first tried writing three daily pages, I didn't expect to stick to it. But I did, and it changed my life! [해석] 처음에 매일 세 페이지를 쓰려고 했을 때, 계속하리라 기대하지 않았다. 하지만 계속했고, 그것이 내 삶을 바꿨다!","correct":"첫 번째 it은 writing three daily pages(매일 세 페이지 쓰기)를, 두 번째 it도 같은 습관(모닝 페이지 쓰기)을 가리킨다. stick to it = 그것을 계속하다.","wrongs":["① 팟캐스트 진행하기 — 팟캐스트는 이 시점에서 아직 시작하지 않았음 ❌","② 고등학교 생활 — 고등학교 생활은 writing과 관련 없음 ❌","④ 집중하기 — concentrate는 앞 문장의 내용이지 it이 지칭하는 것이 아님 ❌","⑤ 감정 해소하기 — Releasing feelings는 뒤에 나오는 내용 ❌"],"tip":"💡 대명사 it의 지칭: 직전에 언급된 행위/사물을 가리키는 것이 일반적\n⚠️ stick to it(그것을 계속하다)에서 it = 바로 앞의 writing three daily pages"},"ans":2,"ch":["① 팟캐스트 진행하기","② 고등학교 생활","③ 매일 세 페이지 쓰기 (모닝 페이지)","④ 집중하기"]},

start again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"밑줄 친 \"click moment\"이 의미하는 바로 가장 적절한 것을 고르시오.<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">Sometimes, I keep asking questions until I reach a sort of <b><u>\"click moment.\"</u></b> It feels like a door opening to great ideas.</div>","det":{"ref":"[원문] Sometimes, I keep asking questions until I reach a sort of \"click moment.\" It feels like a door opening to great ideas. [해석] 때로는 일종의 '클릭 순간'에 도달할 때까지 계속 질문한다. 위대한 아이디어로 향하는 문이 열리는 느낌이다.","correct":"\"click moment\"은 계속 질문을 던지다가 갑자기 좋은 아이디어가 떠오르는 순간을 의미한다. 바로 뒤에 'a door opening to great ideas(위대한 아이디어로 향하는 문이 열리는)'라는 비유로 설명하고 있다.","wrongs":["① 컴퓨터 마우스를 클릭하는 물리적 동작 — 비유적 표현이지 물리적 동작이 아님 ❌","② 스트레스가 최고조에 달하는 순간 — 스트레스가 아닌 아이디어가 떠오르는 순간 ❌","④ 질문을 멈추기로 결심하는 순간 — 질문을 멈추는 것이 아니라 답을 발견하는 순간 ❌","⑤ 불평을 시작하는 계기가 되는 순간 — 불평이 아닌 영감의 순간 ❌"],"tip":"💡 비유적 표현은 앞뒤 문맥의 부연 설명을 통해 의미를 파악한다\n⚠️ 'It feels like a door opening'이 click moment의 직접 설명 → 새로운 아이디어가 열리는 순간"},"ans":2,"ch":["① 컴퓨터 마우스를 클릭하는 물리적 동작","② 스트레스가 최고조에 달하는 순간","③ 계속 질문하다 갑자기 좋은 아이디어가 떠오르는 순간","④ 질문을 멈추기로 결심하는 순간"]},

{"id":16,"type":"내용이해","diff":"쉬움","pts":4,"fmt":"mc","passage":"Welcome to my channel Good Habits! This is Regan, your podcast host. Today, I'm going to talk about a way of starting the day that many people, including me, find enormously useful. It's a kind of journaling called \"the morning pages.\" There is no age at which it is too late to form this habit. I started eight years ago as a high school student, and that's why today's episode is especially for my teenage subscribers.\n\nThe morning pages are three pages of \"free writing,\" ideally done first thing in the morning. The concept is simple. Get up every morning, pick up a pen and a notebook, and write whatever crosses your mind until you have filled three pages. The technique was originally developed to help writers and artists overcome a loss of creativity, but anybody can use it to create a better life.\n\nThere is no right or wrong way to write your morning pages, but there are two rules. First, don't judge your writing as good or bad. These pages are meant to be a \"brain cleansing,\" so don't worry about writing correctly. Second, keep your writing completely private. It is important for you to write freely and honestly. You're even advised not to read your writing yourself for weeks.\n\nNow, let me share the experiences of some people I interviewed. David, a chef and kitchen manager, who has been writing morning pages for two years, says:\n\nMy job tends to be very stressful. When I started writing morning pages, I just wrote a lot of complaints about my hard life. Later, I began to ask questions, like \"What would make my life easier today?\" \"How can I improve my recipes?\" Sometimes, I keep asking questions until I reach a sort of \"click moment.\" It feels like a door opening to great ideas. Nowadays, I feel less stressed, enjoy my job more, and am more productive.\n\nNow, let's listen to Yuna, a high school junior:\n\nWhen I started this exercise last year, I simply wrote random thoughts like tart again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"모닝 페이지에 대한 설명으로 적절하지 <b>않은</b> 것을 고르시오.","det":{"ref":"[원문] The morning pages are three pages of \"free writing,\" ideally done first thing in the morning. [해석] 모닝 페이지는 이상적으로 아침에 가장 먼저 하는 세 페이지의 자유 글쓰기이다.","correct":"④는 부적절하다. 원문에서 모닝 페이지는 원래 작가와 예술가를 위해 개발되었지만(originally developed to help writers and artists), '누구나(anybody) 사용 가능하다'고 했으므로 '전문 작가만 할 수 있다'는 내용은 원문과 다르다.","wrongs":["① 세 페이지의 자유 글쓰기 — 원문 일치 ✅","② 이상적으로 아침에 가장 먼저 함 — 원문 일치 ✅","③ 글의 좋고 나쁨을 판단하지 말아야 함 — 원문 일치 ✅","⑤ 글을 완전히 비공개로 유지해야 함 — 원문 일치 ✅"],"tip":"💡 내용 이해 문제는 원문과 선택지를 하나씩 대조한다\n⚠️ 'originally developed for writers' ≠ 'only for writers' — anybody can use it"},"ans":3,"ch":["① 세 페이지의 자유 글쓰기이다.","② 이상적으로 아침에 가장 먼저 하는 것이 좋다.","③ 글의 좋고 나쁨을 판단하지 말아야 한다.","④ 전문 작가만 할 수 있는 고급 기법이다."]},
{"id":17,"type":"내용일치","diff":"보통","pts":5,"fmt":"mc","passage":"Welcome to my channel Good Habits! This is Regan, your podcast host. Today, I'm going to talk about a way of starting the day that many people, including me, find enormously useful. It's a kind of journaling called \"the morning pages.\" There is no age at which it is too late to form this habit. I started eight years ago as a high school student, and that's why today's episode is especially for my teenage subscribers.\n\nThe morning pages are three pages of \"free writing,\" ideally done first thing in the morning. The concept is simple. Get up every morning, pick up a pen and a notebook, and write whatever crosses your mind until you have filled three pages. The technique was originally developed to help writers and artists overcome a loss of creativity, but anybody can use it to create a better life.\n\nThere is no right or wrong way to write your morning pages, but there are two rules. First, don't judge your writing as good or bad. These pages are meant to be a \"brain cleansing,\" so don't worry about writing correctly. Second, keep your writing completely private. It is important for you to write freely and honestly. You're even advised not to read your writing yourself for weeks.\n\nNow, let me share the experiences of some people I interviewed. David, a chef and kitchen manager, who has been writing morning pages for two years, says:\n\nMy job tends to be very stressful. When I started writing morning pages, I just wrote a lot of complaints about my hard life. Later, I began to ask questions, like \"What would make my life easier today?\" \"How can I improve my recipes?\" Sometimes, I keep asking questions until I reach a sort of \"click moment.\" It feels like a door opening to great ideas. Nowadays, I feel less stressed, enjoy my job more, and am more productive.\n\nNow, let's listen to Yuna, a high school junior:\n\nWhen I started this exercise last year, I simply wrote random thoughts like this:\nI'm sleepy. A slight headache's starting.\nI need to finish the math assignment today ...\nI don't know what more to write now.\n\nBut soon I found I had deeper and deeper thoughts. Now, I normally start by writing about today's tasks or worries. After that, I write about my dreams and how to move towards them. I often come up with great plans and a clear sense of purpose to start the day. Most importantly, I'm much happier than before.\n\nI can totally relate to these two people because their experiences are similar to mine. Like Yuna, I started this journaling during my first year of high school. At that time, I felt lost, stressed, and unsure about the future, and it wasn't easy for me to concentrate. When I first tried writing three daily pages, I didn't expect to stick to it. But I did, and it changed my life!\n\nReleasing my feelings onto paper every morning helped relieve my emotional tension. I gained more inner peace, which improved my schoolwork performance. Like David, I asked many questions, for instance, \"Why was I so angry yesterday?\" \"Why are things less fun these days?\" Then, I started raising more challenging ones: \"What could make me happier right now?\" \"What is my ideal future? Can I reach it? How?\"\n\nAnswering these questions showed me what kind of person I was and what my needs, values, passions, and talents were. More importantly, I came to know what I truly wanted! I remembered my childhood dreams of being a writer, songwriter, and radio host. Gradually, vague ideas became clear plans. Years later, here I am, a successful podcaster and vlogger! I've also published a book and a music album. My morning pages, which I still write every day, have given me the drive and ideas to achieve these aims.\n\nDear subscribers, will you try writing your morning pages, too? You never know what creative energy or ideas you have until you start exploring. Don't be a perfectionist, though. If you miss a few days, simply open your notebook and start again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"David와 Yuna에 대한 설명으로 가장 적절한 것을 고르시오.","det":{"ref":"[원문] David: Nowadays, I feel less stressed, enjoy my job more, and am more productive. / Yuna: Most importantly, I'm much happier than before.","correct":"⑤가 정답이다. David는 덜 스트레스 받고 더 생산적이라 했고(feel less stressed, am more productive), Yuna는 이전보다 훨씬 행복하다(much happier than before)고 했다.","wrongs":["① David는 5년째 쓰고 있다 — 원문은 for two years(2년) ❌","② Yuna는 대학생이다 — 원문은 a high school junior(고등학교 3학년) ❌","③ David는 처음부터 질문을 던졌다 — 처음에는 불평을 썼고 나중에 질문을 시작했다 ❌","④ Yuna는 처음부터 깊은 생각을 적었다 — 처음에는 random thoughts를 썼다 ❌"],"tip":"💡 내용일치 문제는 숫자, 신분, 시간 순서를 정확히 확인\n⚠️ David: 2년(not 5년), Yuna: high school junior(not 대학생)"},"ans":2,"ch":["① David는 5년째 모닝 페이지를 쓰고 있다.","② Yuna는 대학생이다.","⑤ David는 더 생산적이 되었고, Yuna는 이전보다 훨씬 행복해졌다.","③ David는 처음부터 자기 삶에 대한 질문을 던졌다."]},

tart again! The ultimate aim is to improve your mental health and help you lead a happier, more creative life.","stem":"다음 글의 내용을 한 문장으로 요약할 때, 빈칸 (A)와 (B)에 들어갈 말로 가장 적절한 것은?<br><div style=\"background:#f7f7f9;padding:10px 14px;border-radius:8px;margin:8px 0;line-height:1.85;border-left:3px solid #f59e0b;\">Morning pages, a simple habit of writing three pages of free thoughts every morning, can help people (A) __________ stress, discover their true desires, and ultimately lead a more (B) __________ life.</div>","det":{"ref":"[요약] 매일 아침 세 페이지의 자유로운 생각을 쓰는 간단한 습관인 모닝 페이지는 사람들이 스트레스를 (A)하고, 진정한 욕구를 발견하며, 궁극적으로 더 (B)한 삶을 살도록 도울 수 있다.","correct":"(A) relieve: 글의 핵심은 모닝 페이지가 감정적 긴장을 완화한다는 것 (B) creative: 마지막 문단에서 'a happier, more creative life'라고 직접 언급","wrongs":["① increase-routine — 스트레스를 증가시키는 것이 아님, routine은 글의 핵심이 아님 ❌","② relieve-stressful — 스트레스를 완화하지만, 더 스트레스 받는 삶은 모순 ❌","④ ignore-productive — 스트레스를 무시하는 것이 아닌 해소, productive만으로 불충분 ❌","⑤ increase-creative — 스트레스를 증가시키는 것은 문맥 반대 ❌"],"tip":"💡 요약문 빈칸은 글 전체의 핵심 메시지에서 찾는다\n⚠️ 마지막 문장 'a happier, more creative life'가 글 전체의 결론"},"ans":2,"ch":["① increase - routine","② relieve - stressful","③ relieve - creative","④ ignore - productive"]},

function fmtTime(s) { return Math.floor(s / 60) + '\ubd84 ' + s % 60 + '\ucd08'; }

function toast(msg) {

function showScreen(id) {

}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function startExam() {
  var nm = document.getElementById('inpName').value.trim();
  if (!nm) { toast('\uc774\ub984\uc744 \uc785\ub825\ud574\uc8fc\uc138\uc694!'); return; }

  /* Section filtering (if sec picker exists) */
  var secPicker = document.getElementById('secPicker');
  var filtered;
  if (secPicker) {
    var secs = getSelectedSections();
    if (secs.length === 0) { toast('\uc2dc\ud5d8 \ubc94\uc704\ub97c \ucd5c\uc18c 1\uac1c \uc120\ud0dd\ud574\uc8fc\uc138\uc694!'); return; }
    filtered = Q.map(function (q, i) { return { q: q, i: i }; }).filter(function (f) { return secs.includes(f.q.sec); });
    S = { ans: Array(filtered.length).fill(null), cur: 0, ti: null, left: EI.time, start: Date.now(), order: shuffle([].concat(Array(filtered.length).keys ? Array.from({ length: filtered.length }, function (_, i) { return i; }) : [])), filtered: filtered.map(function (f) { return f.i; }), secs: secs };
    EI._origTotalQ = EI.totalQ; EI._origTotal = EI.total;
    EI.totalQ = filtered.length;
    EI.total = filtered.reduce(function (s, f) { return s + Q[f.i].pts; }, 0);
  } else {
    S = { ans: Array(Q.length).fill(null), cur: 0, ti: null, left: EI.time, start: Date.now(), order: shuffle(Array.from({ length: Q.length }, function (_, i) { return i; })), filtered: null, secs: null };
  }

  showScreen('examScreen');
  showQ(0);
  startTimer();
  updateProgress();
  initSwipe();
}

function showQ(idx, direction) {
  S.cur = idx;
  var oi = S.order ? S.order[idx] : idx;
  var qi = S.filtered ? S.filtered[oi] : oi;
  var q = Q[qi];
  var tc = typeTag[q.type] || '';
  var mk = '\u2460\u2461\u2462\u2463\u2464';
  var pp = document.getElementById('slidePassage');
  if (direction) {
    pp.classList.add(direction > 0 ? 'fade-out' : 'fade-in');
    setTimeout(function () {
      renderContent(idx, qi, q, tc, mk, pp);
      pp.classList.remove('fade-out', 'fade-in');
    }, 150);
  } else {
    renderContent(idx, qi, q, tc, mk, pp);
  }
}

function renderContent(idx, qi, q, tc, mk, pp) {
  var ph = '<div class="q-badge"><div class="q-num">' + (idx + 1) + '</div><span>' + q.type + '</span><span style="opacity:.6">' + q.diff + ' \u00b7 ' + q.pts + '\uc810</span></div>';
  if (q.passage) ph += '<div class="q-passage">' + q.passage + '</div>';
  else ph += '<div style="padding:30px;text-align:center;color:var(--tl)">\uc774 \ubb38\ud56d\uc740 \uc9c0\ubb38\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.</div>';
  pp.innerHTML = ph;
  pp.scrollTop = 0;
  var bt = document.getElementById('slideBottom');
  var bh = '<div class="slide-stem">' + q.stem + '</div><div class="slide-choices">';
  if (q.fmt === 'mc') {
    q.ch.forEach(function (c, ci) {
      var sel = S.ans[qi] === ci ? ' selected' : '';
      bh += '<button class="choice-btn' + sel + '" onclick="selectAns(' + idx + ',' + ci + ')"><span class="c-num">' + mk[ci] + '</span><span>' + c + '</span></button>';
    });
  }
  if (q.fmt === 'written') {
    var val = S.ans[qi] || '';
    bh += '<input class="written-input" value="' + val + '" placeholder="\ub2f5\uc548\uc744 \uc785\ub825\ud558\uc138\uc694..." oninput="writeAns(' + idx + ',this.value)">';
  }
  bh += '</div><div class="slide-nav"><button ' + (idx === 0 ? 'disabled ' : '') + ' onclick="navQ(-1)">\u2190 \uc774\uc804</button><span class="nav-cur">' + (idx + 1) + ' / ' + EI.totalQ + '</span><button class="sn-next" ' + (idx === EI.totalQ - 1 ? 'disabled ' : '') + ' onclick="navQ(1)">\ub2e4\uc74c \u2192</button></div>';
  bt.innerHTML = bh;
}

function selectAns(idx, ci) {
  var qi = S.order ? S.order[idx] : idx;
  if (S.filtered) qi = S.filtered[qi];
  S.ans[qi] = ci;
  var btns = document.querySelectorAll('.slide-choices .choice-btn');
  btns.forEach(function (b, i) {
    b.classList.toggle('selected', i === ci);
    if (i === ci) b.classList.add('just-selected');
  });
  updateProgress();
}

function writeAns(idx, val) {
  var qi = S.order ? S.order[idx] : idx;
  if (S.filtered) qi = S.filtered[qi];
  S.ans[qi] = val.trim() || null;
  updateProgress();
}

function navQ(dir) {
  var next = S.cur + dir;
  if (next >= 0 && next < EI.totalQ) showQ(next, dir);
}

function updateProgress() {
  var answered = S.ans.filter(function (a) { return a !== null; }).length;
  document.getElementById('progressFill').style.width = (answered / EI.totalQ * 100) + '%';
  document.getElementById('ansCount').textContent = answered + '/' + EI.totalQ;
}

function initSwipe() {
  var startX = 0, startY = 0;
  var el = document.getElementById('slideWrap');
  el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0 && S.cur < EI.totalQ - 1) navQ(1);
      if (dx > 0 && S.cur > 0) navQ(-1);
    }
  }, { passive: true });
}

function startTimer() {
  var el = document.getElementById('timer');
  S.ti = setInterval(function () {
    S.left--;
    var m = Math.floor(S.left / 60), s = S.left % 60;
    el.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    el.classList.toggle('warn', S.left <= 300 && S.left > 60);
    el.classList.toggle('danger', S.left <= 60);
    if (S.left <= 0) { clearInterval(S.ti); submitExam(); }
  }, 1000);
}

function submitExam() {
  if (!confirm('\uc81c\ucd9c\ud558\uc2dc\uaca0\uc2b5\ub2c8\uae4c?')) return;
  clearInterval(S.ti);
  var elapsed = Math.floor((Date.now() - S.start) / 1000);
  var r = grade();
  saveToHistory(r, elapsed);
  renderResults(r, elapsed);
  showScreen('resultScreen');
  window.scrollTo(0, 0);
}

function grade() {
  var score = 0, correct = 0, wrong = 0, unanswered = 0;
  var details = [];
  var qs = S.filtered ? S.filtered.map(function (i) { return Q[i]; }) : Q;
  qs.forEach(function (q, i) {
    var a = S.ans[i];
    var ok = false;
    if (a === null) unanswered++;
    else if (q.fmt === 'mc') ok = a === q.ans;
    else {
      var u = String(a).trim().toLowerCase();
      if (q.accept) ok = q.accept.some(function (x) { return u === x.toLowerCase(); });
      if (!ok && q.wa) ok = u === q.wa.toLowerCase();
    }
    if (a !== null) { if (ok) { correct++; score += q.pts; } else wrong++; }
    details.push({ q: q, ans: a, ok: ok });
  });
  return { score: score, correct: correct, wrong: wrong, unanswered: unanswered, details: details };
}

function renderResults(r, elapsed) {

    var t = d.q.type;

  h += '<div class="rs"><div class="rs-title">\ud83d\udcdd \ub0b4\uc2e0\ud56b \ucc98\ubc29</div><div class="plan-card">';
