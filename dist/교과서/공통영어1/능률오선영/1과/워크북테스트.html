<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공통영어1 능률(오선영) 온라인워크북TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* NaesinFit — Purple Theme (워크북테스트) */
:root{
  --p:#7C3AED;--pd:#5B21B6;--pl:#A78BFA;--pxl:#F3F0FF;--pxxl:#FAF5FF;
  --bg:#F5F3FF;--text:#1A1A2E;--tm:#6B5B8A;--tl:#9A8DB8;
  --r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;
  --o:#F59E0B;--ol:#FFF8E1;
  --card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);
  --radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;
  --pborder:#d8d0e8;--pbg-muted:#e8e0f0;
  --passage-bg:linear-gradient(135deg,#FAFAFF,#F5F3FA);
  --start-grad:linear-gradient(160deg,#F3F0FF,#EDE7F6 40%,#E8E0F6);
  --accent2:#6D28D9;
  --p-rgba-08:rgba(124,58,237,.08);
  --p-rgba-10:rgba(124,58,237,.1);
  --p-rgba-12:rgba(124,58,237,.12);
  --p-rgba-25:rgba(124,58,237,.25);
  --p-rgba-30:rgba(124,58,237,.3);
}

/* NaesinFit Test Engine — Common CSS (theme-agnostic)
   Theme-specific colors come from :root variables defined in theme-*.css:
   --p      : primary color
   --pd     : primary dark
   --pl     : primary light
   --pxl    : primary extra-light
   --pxxl   : primary xx-light
   --bg     : page background
   --text   : main text
   --tm     : text muted
   --tl     : text light
   --pborder: border color (theme-tinted)
   --pbg-muted: muted bg for tracks/bars
   --start-grad: startScreen gradient
   --accent2: secondary gradient stop (badge/header)
   --p-rgba-08: rgba for selected bg
   --p-rgba-12: rgba for box-shadow
   --p-rgba-10: rgba for focus ring
   --p-rgba-25: rgba for button shadow
   --p-rgba-30: rgba for selectPulse
*/

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Start Screen */
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:var(--start-grad);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--p),var(--accent2));color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--p),var(--accent2));padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid var(--pborder);}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid var(--pborder);border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid var(--pborder);border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-rgba-10);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;box-shadow:0 6px 20px var(--p-rgba-30);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid var(--pborder);color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--p);color:var(--p);}
.history-badge{background:var(--pxl);color:var(--p);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid var(--pborder);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--p);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}

/* Exam Screen */
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--p);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--p);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--p);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--accent2));transition:width .5s ease;border-radius:0 2px 2px 0;}

/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--pxl),var(--pl));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--pd);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:10px 14px 14px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
.slide-choices{display:flex;flex-direction:column;gap:3px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12px;line-height:1.3;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--p);background:var(--p-rgba-08);box-shadow:0 0 0 3px var(--p-rgba-12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 var(--p-rgba-30)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:20px;height:20px;font-size:10px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--p-rgba-10);}
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;box-shadow:0 2px 8px var(--p-rgba-25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--p);}
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--p);background:var(--pxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}

/* Type tags — same across all themes */
.tag-combo{background:#E8F5E9;color:#166534;}.tag-wrong{background:#FFF0F0;color:#D63B3B;}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:#EDF2FF;color:#3B6FD9;}.tag-ant{background:#FFF8E1;color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}.tag-insert{background:#E3F2FD;color:#1565C0;}.tag-order{background:#FFF8E1;color:#F57F17;}

.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:var(--pbg-muted);padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--p);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:var(--passage-bg);border-left:3px solid var(--p);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--pborder);border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--p);}.choice-btn.selected{border-color:var(--p);box-shadow:0 0 0 2px var(--p-rgba-12);background:var(--pxxl);}
.c-num{min-width:22px;height:22px;background:var(--pbg-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid var(--pborder);border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--p);}

/* Result Screen */
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--pxl),var(--pl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:var(--pbg-muted);border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--pl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--pxxl);border-radius:var(--rs);border:1px solid var(--pborder);}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--pxl);}.info-cell.highlight .ic-value{color:var(--p);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:var(--pbg-muted);border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--pl);color:var(--p);}.tag-item.weak{background:#FFF0F0;color:#D63B3B;}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--pxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid var(--pborder);border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--p);color:var(--p);}.act-btn.primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid var(--pborder);border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--pxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--pxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--pl);color:var(--p);}.expl-tag.tip{background:var(--pxl);color:var(--pd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--p);}.expl-box.tip-b{border-left:3px solid var(--p);background:var(--pxl);}

@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">온라인워크북 TEST</div>
  <h1 class="start-title">온라인워크북 <span>TEST</span></h1>
  <p class="start-subtitle">공통영어1 · 능률(오선영) · 1과 · 20문항</p>
  <div class="info-card"><div class="info-card-header">시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">공통영어1</span></div>
    <div class="info-row"><span class="info-label">문항</span><span class="info-value">능률(오선영) (1과)</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">Discovering Yourself through Challenges</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">20문항</div><div class="chip">20분</div><div class="chip">80점 이상 통과</div><div class="chip">100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="startExam()">시험 시작하기</button>
  <button class="btn btn-outline" onclick="toggleHistory()">시험 기록 보기 <span class="history-badge" id="hCount">0</span></button>
  <div id="historyPanel"></div>
</div>
</div>

<div id="examScreen" class="screen">
  <div class="exam-topbar"><div class="topbar-left"><div class="topbar-dot"></div><div class="topbar-info">공통영어1 · <span>능률(오선영)</span></div></div><div class="timer" id="timer">20:00</div><button class="btn-submit" onclick="submitExam()">제출하기</button></div>
  <div class="exam-progress"><div class="exam-progress-fill" id="progressFill"></div></div>

const FULL_PASSAGE="\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was trying something new for each one. She told us that we should share our experiences with our classmates when we finished the challenges.\n\nChallenge 1: Ticket for One\n\nThese days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy.\n\nGoing to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about.\n\nAt first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me realize that I sometimes enjoy doing things alone. After the movie, I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future.\n\nChallenge 2: Riding the Waves\n\nEver since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course.\n\nAt the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\n\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me.\n\nThe next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.\n\nI learned a lot about myself through this assignment, and I found out that my classmates did, too. One of them tried new foods from different countries, while another joined a creative writing club. Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different perspectives on life and had a lot of fun, too! My classmates and I even talked about setting more challenges for ourselves. There are always more things that we can discover about ourselves, and it's exciting to keep learning and growing. We never know what we're capable of until we try!";

er, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course.\n\nAt the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\n\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me.\n\nThe next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.\n\nI learned a lot about myself through this assignment, and I found out that my classmates did, too. One of them tried new foods from different countries, while another joined a creative writing club. Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different perspectives on life and had a lot of fun, too! My classmates and I even talked about setting more challenges for ourselves. There are always more things that we can discover about ourselves, and it's exciting to keep learning and growing. We never know what we're capable of until we try!","stem":"다음 글의 밑줄 친 부분 중 어법상 <b>틀린</b> 것은?<br><br>Ever since I was a child, I've always been ①<u>afraid</u> of water. So I have never ②<u>enjoyed</u> water activities or felt comfortable while ③<u>doing</u> them. One day, I came across a video clip of my cousin ④<u>surfing</u> at an indoor pool on social media. She assured me that it wasn't too hard, so I signed up for a ⑤<u>beginning</u> course.","det":{"ref":"[원문] Ever since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. She assured me that it wasn't too hard, so I signed up for a beginner course.\n[해석] 어렸을 때부터 나는 항상 물을 무서워했다. 어느 날, 나는 SNS에서 사촌이 실내 수영장에서 서핑하는 영상을 보았다.","correct":"⑤ beginning → beginner: 'beginner course'(초보자 과정)가 올바른 표현이다. beginning은 '시작'이라는 의미로 course를 수식하기에 부적절하다.","wrongs":["① afraid: be afraid of ~를 두려워하다 ✅","② enjoyed: 현재완료(have never enjoyed)의 과거분사 ✅","③ doing: while doing = while I was doing의 분사구문 ✅","④ surfing: 지각동사 구문 — 목적어(cousin)가 서핑하는 것을 보았으므로 현재분사 ✅"],"tip":"💡 beginner vs. beginning: beginner course(초보자 과정), beginning stage(초기 단계)\n⚠️ a video clip of + 목적어 + -ing: 목적어가 ~하는 것의 영상"},"ans":2,"ch":["①","②","⑤","③"]},

{"id":9,"type":"어휘","diff":"쉬움","pts":4,"fmt":"mc","passage":"\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was trying something new for each one. She told us that we should share our experiences with our classmates when we finished the challenges.\n\nChallenge 1: Ticket for One\n\nThese days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy.\n\nGoing to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about.\n\nAt first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me realize that I sometimes enjoy doing things alone. After the movie, I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future.\n\nChallenge 2: Riding the Waves\n\nEver since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course.\n\nAt the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\n\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me.\n\nThe next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.\n\nI learned a lot about myself through this assignment, and I found out that my classmates did, too. One of them tried new foods from different countries, while another joined a creative writing club. Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different perspectives on life and had a lot of fun, too! My classmates and I even talked about setting more challenges for ourselves. There are always more things that we can discover about ourselves, and it's exciting to keep learning and growing. We never know what we're capable of until we try!","stem":"다음 글의 밑줄 친 <b>absorbed</b>와 의미가 가장 가까운 것은?<br><br>But once the movie started, I became completely <u>absorbed</u> in the story.","det":{"ref":"[원문] But once the movie started, I became completely absorbed in the story.\n[해석] 그러나 영화가 시작되자, 나는 이야기에 완전히 몰입했다.","correct":"② engrossed: absorbed와 engrossed 모두 '몰입한, 빠져든'이라는 뜻이다. be engrossed in = be absorbed in","wrongs":["① distracted: '산만한, 주의가 분산된'으로 absorbed와 반의어 ❌","③ bored: '지루한'으로 의미 반대 ❌","④ confused: '혼란스러운'으로 의미가 다름 ❌","⑤ frightened: '겁먹은'으로 의미가 다름 ❌"],"tip":"💡 absorbed in = engrossed in = immersed in: ~에 몰입한\n⚠️ absorbed의 반의어: distracted(산만한)"},"ans":1,"ch":["distracted","engrossed","bored","confused"]},
{"id":10,"type":"어휘","diff":"보통","pts":5,"fmt":"mc","passage":"\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was trying something new for each one. She told us that we should share our experiences with our classmates when we finished the challenges.\n\nChallenge 1: Ticket for One\n\nThese days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy.\n\nGoing to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about.\n\nAt first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me realize that I sometimes enjoy doing things alone. After the movie, I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future.\n\nChallenge 2: Riding the Waves\n\nEver since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course.\n\nAt the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\n\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me.\n\nThe next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.\n\nI learned a lot about myself through this assignment, and I found out that my classmates did, too. One of them tried new foods from different countries, while another joined a creative writing club. Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different perspectives on life and had a lot of fun, too! My classmates and I even talked about setting more challenges for ourselves. There are always more things that we can discover about ourselves, and it's exciting to keep learning and growing. We never know what we're capable of until we try!","stem":"다음 글의 빈칸에 들어갈 어휘로 가장 적절한 것은?<br><br>For the second challenge, I decided to try to __________ this discomfort. However, I wasn't sure what to do at first.","det":{"ref":"[원문] For the second challenge, I decided to try to overcome this discomfort.\n[해석] 두 번째 도전으로, 나는 이 불편함을 극복하려고 노력하기로 결심했다.","correct":"③ overcome: '극복하다'라는 뜻으로 discomfort(불편함)를 극복한다는 문맥에 적절하다.","wrongs":["① increase: '증가시키다'로 불편함을 늘린다는 뜻이 되어 부적절 ❌","② ignore: '무시하다'로 도전의 목적과 맞지 않음 ❌","④ maintain: '유지하다'로 불편함을 유지한다는 뜻이 되어 부적절 ❌","⑤ celebrate: '축하하다'로 문맥에 부적절 ❌"],"tip":"💡 overcome = conquer = get over: 극복하다\n⚠️ overcome — overcame — overcome (불규칙 변화)"},"ans":2,"ch":["increase","ignore","overcome","maintain"]},

ver, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course.\n\nAt the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\n\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me.\n\nThe next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.\n\nI learned a lot about myself through this assignment, and I found out that my classmates did, too. One of them tried new foods from different countries, while another joined a creative writing club. Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different perspectives on life and had a lot of fun, too! My classmates and I even talked about setting more challenges for ourselves. There are always more things that we can discover about ourselves, and it's exciting to keep learning and growing. We never know what we're capable of until we try!","stem":"다음 글의 밑줄 친 단어 중 문맥상 <b>낱말의 쓰임이 적절하지 않은</b> 것은?<br><br>She assured me that it wasn't too hard, so I signed up for a beginner course. At the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance ①<u>properly</u> and even managed to surf a few waves! It gave me such a rush of ②<u>excitement</u>. Being in the water wasn't as ③<u>bad</u> as I had thought. While the experience didn't ④<u>completely</u> change my mind about water sports, it did help me ⑤<u>conceal</u> my sense of adventure.","det":{"ref":"[원문] After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n[해석] 강사의 도움 후, 나는 균형을 잡는 법을 배우고 심지어 파도 몇 개를 탈 수 있었다! 그 경험이 수상 스포츠에 대한 생각을 완전히 바꾸지는 못했지만, 모험심을 발견하는 데 도움이 되었다.","correct":"⑤ conceal → discover: 원문은 'discover my sense of adventure(모험심을 발견하다)'이다. conceal은 '숨기다'로 문맥과 정반대이다.","wrongs":["① properly: '적절히, 제대로' — 균형을 제대로 잡는 법을 배웠다 ✅","② excitement: '흥분, 설렘' — 짜릿한 흥분감을 느꼈다 ✅","③ bad: '나쁜' — 생각했던 것만큼 나쁘지 않았다 ✅","④ completely: '완전히' — 완전히 바꾸지는 못했지만 ✅"],"tip":"💡 discover(발견하다) vs. conceal(숨기다): 정반대 의미\n⚠️ 어휘 적절성 문제: 문맥상 긍정적 변화(도전 → 발견)의 흐름에 주목"},"ans":2,"ch":["①","②","⑤","③"]},

ever, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course.\n\nAt the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\n\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me.\n\nThe next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.\n\nI learned a lot about myself through this assignment, and I found out that my classmates did, too. One of them tried new foods from different countries, while another joined a creative writing club. Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different perspectives on life and had a lot of fun, too! My classmates and I even talked about setting more challenges for ourselves. There are always more things that we can discover about ourselves, and it's exciting to keep learning and growing. We never know what we're capable of until we try!","stem":"다음 글의 빈칸 (A), (B)에 들어갈 연결사로 가장 적절한 것은?<br><br>At the beginning of the lesson, it was hard just to stand up on the board. (A)__________, I learned how to balance properly and even managed to surf a few waves! (B)__________ the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.","det":{"ref":"[원문] At the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! ... While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n[해석] 수업 초반에는 보드 위에 서는 것조차 어려웠다. 하지만 강사의 도움 후에 균형 잡는 법을 배웠다. 그 경험이 수상 스포츠에 대한 생각을 완전히 바꾸지는 못했지만, 모험심을 발견하는 데 도움이 되었다.","correct":"(A) However — (B) While: (A) 앞 문장(어려웠다)과 뒤 문장(배웠다)이 대조/역접이므로 However. (B) '~에도 불구하고'라는 양보 접속사 While이 적절.","wrongs":["① Therefore — Because: (A) 인과가 아닌 역접 관계, (B) 양보가 아닌 이유 ❌","② Moreover — Although: (A) '게다가'는 역접이 아닌 첨가 ❌","④ For example — Unless: (A) 예시 아님, (B) 조건이 아닌 양보 ❌","⑤ In addition — Since: (A) 첨가가 아닌 역접, (B) 이유가 아닌 양보 ❌"],"tip":"💡 However: 역접(~하지만) | While/Although: 양보(~에도 불구하고)\n⚠️ While + 주어 + 동사: 양보절(~이지만) vs. ~하는 동안"},"ans":2,"ch":["Therefore — Because","Moreover — Although","However — While","For example — Unless"]},
{"id":13,"type":"지칭추론","diff":"보통","pts":5,"fmt":"mc","passage":"\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was trying something new for each one. She told us that we should share our experiences with our classmates when we finished the challenges.\n\nChallenge 1: Ticket for One\n\nThese days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy.\n\nGoing to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about.\n\nAt first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me realize that I sometimes enjoy doing things alone. After the movie, I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future.\n\nChallenge 2: Riding the Waves\n\nEver since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course.\n\nAt the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\n\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me.\n\nThe next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.\n\nI learned a lot about myself through this assignment, and I found out that my classmates did, too. One of them tried new foods from different countries, while another joined a creative writing club. Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different perspectives on life and had a lot of fun, too! My classmates and I even talked about setting more challenges for ourselves. There are always more things that we can discover about ourselves, and it's exciting to keep learning and growing. We never know what we're capable of until we try!","stem":"다음 글의 밑줄 친 (a)~(e) 중 가리키는 대상이 나머지와 <b>다른</b> 것은?<br><br>I messaged my cousin about it. (a)<u>She</u> assured me that it wasn't too hard, so I signed up for a beginner course. ... (b)<u>He</u> listened to my concerns and helped me find a shorter hairstyle that suited me. The next day at school, my classmates were a bit surprised. But overall, the reactions were positive. (c)<u>I</u> realized that trying a different look wasn't as difficult as (d)<u>I</u> thought it would be. In fact, (e)<u>it</u> made me feel more confident about myself.","det":{"ref":"[원문] She assured me ... He listened to my concerns ... I realized ... I thought ... it made me feel more confident\n[해석] 사촌(she)이 어렵지 않다고 확신시켜 주었다. 미용사(he)가 나의 고민을 들어주었다.","correct":"(a) She: 사촌(cousin)을 가리킨다. (b) He는 미용사(stylist), (c)(d)는 글쓴이(I), (e)는 '다른 외모를 시도한 것(trying a different look)'. 나머지 (b)(c)(d)(e)와 달리 (a)만 사촌을 가리키므로 정답.","wrongs":["② (b): He = stylist(미용사)를 가리킴. 글쓴이(나)가 아니라 제3자이지만, 문제는 '나머지와 다른 것'을 묻는 것이므로 (a)가 유일하게 다름","③ (c): I = 글쓴이 ✅ 다수와 동일","④ (d): I = 글쓴이 ✅ 다수와 동일","⑤ (e): it = trying a different look ✅ 사물 대명사"],"tip":"💡 지칭 추론: 대명사가 가리키는 대상을 앞 문장에서 확인\n⚠️ She = cousin(여성), He = stylist(남성) — 성별로 대상 구분"},"ans":0,"ch":["(a)","(b)","(c)","(d)"]},
{"id":14,"type":"의미파악","diff":"어려움","pts":6,"fmt":"mc","passage":"\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was trying something new for each one. She told us that we should share our experiences with our classmates when we finished the challenges.\n\nChallenge 1: Ticket for One\n\nThese days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy.\n\nGoing to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about.\n\nAt first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me realize that I sometimes enjoy doing things alone. After the movie, I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future.\n\nChallenge 2: Riding the Waves\n\nEver since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course.\n\nAt the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\n\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me.\n\nThe next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.\n\nI learned a lot about myself through this assignment, and I found out that my classmates did, too. One of them tried new foods from different countries, while another joined a creative writing club. Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different perspectives on life and had a lot of fun, too! My classmates and I even talked about setting more challenges for ourselves. There are always more things that we can discover about ourselves, and it's exciting to keep learning and growing. We never know what we're capable of until we try!","stem":"다음 글에서 밑줄 친 <b>\"Ticket for One\"</b>이 의미하는 바로 가장 적절한 것은?<br><br>Challenge 1: <u>Ticket for One</u>","det":{"ref":"[원문] Challenge 1: Ticket for One — 이후 내용에서 글쓴이는 혼자 극장에 가서 영화를 보는 도전을 한다.\n[해석] '한 명을 위한 티켓' = 혼자서 극장에 가 영화를 보는 경험을 상징적으로 표현한 제목","correct":"③ 혼자서 영화를 관람하는 경험: Ticket for One은 1인 관람권을 의미하며, 혼자 극장에 가서 영화를 보는 도전을 나타낸다.","wrongs":["① 좋아하는 영화 장르를 선택하는 방법: 장르 선택은 부수적 내용이지 핵심이 아님 ❌","② 스트리밍 서비스의 장점: 스트리밍은 대조를 위한 배경 설명 ❌","④ 영화관 좌석을 예매하는 기술: 좌석 선택은 혼자 가는 것의 장점 중 하나일 뿐 ❌","⑤ 친구와 함께 다양한 영화를 보는 경험: 오히려 혼자 보는 것이 핵심 ❌"],"tip":"💡 제목의 의미: 'Ticket for One' = 1인용 표 → 혼자 하는 활동의 상징\n⚠️ 제목 해석 문제: 본문 전체 흐름과 핵심 메시지로 판단"},"ans":2,"ch":["좋아하는 영화 장르를 선택하는 방법","스트리밍 서비스의 장점","혼자서 영화를 관람하는 경험","영화관 좌석을 예매하는 기술"]},
{"id":15,"type":"오류찾기","diff":"어려움","pts":6,"fmt":"mc","passage":"\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was trying something new for each one. She told us that we should share our experiences with our classmates when we finished the challenges.\n\nChallenge 1: Ticket for One\n\nThese days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy.\n\nGoing to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about.\n\nAt first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me realize that I sometimes enjoy doing things alone. After the movie, I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future.\n\nChallenge 2: Riding the Waves\n\nEver since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course.\n\nAt the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\n\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me.\n\nThe next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.\n\nI learned a lot about myself through this assignment, and I found out that my classmates did, too. One of them tried new foods from different countries, while another joined a creative writing club. Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different perspectives on life and had a lot of fun, too! My classmates and I even talked about setting more challenges for ourselves. There are always more things that we can discover about ourselves, and it's exciting to keep learning and growing. We never know what we're capable of until we try!","stem":"다음 글에서 원문과 <b>다르게</b> 표현된 부분을 찾으시오.<br><br>I learned a lot about myself through this assignment, and I found out that my classmates did, too. One of them tried new foods from different countries, while another joined a creative ①<u>writing</u> club. Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different ②<u>perspectives</u> on life and had a lot of fun, too! My classmates and I even talked about ③<u>achieving</u> more challenges for ourselves. There are always more things that we can ④<u>discover</u> about ourselves, and it's ⑤<u>exciting</u> to keep learning and growing.","det":{"ref":"[원문] My classmates and I even talked about setting more challenges for ourselves.\n[해석] 반 친구들과 나는 심지어 더 많은 도전을 설정하는 것에 대해 이야기했다.","correct":"③ achieving → setting: 원문은 'setting more challenges(더 많은 도전을 설정하기)'이다. achieving(달성하기)은 원문과 다르다.","wrongs":["① writing: 원문 'a creative writing club' 그대로 ✅","② perspectives: 원문 'different perspectives on life' 그대로 ✅","④ discover: 원문 'we can discover about ourselves' 그대로 ✅","⑤ exciting: 원문 'it's exciting to keep learning' 그대로 ✅"],"tip":"💡 오류찾기: 원문과 한 단어가 다르게 바뀌어 있음 → 의미 차이 주의\n⚠️ setting(설정하다) vs. achieving(달성하다): 도전을 '만드는 것'과 '이루는 것'은 다름"},"ans":2,"ch":["①","②","③","④"]},
{"id":16,"type":"내용이해","diff":"쉬움","pts":4,"fmt":"mc","passage":"\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was trying something new for each one. She told us that we should share our experiences with our classmates when we finished the challenges.\n\nChallenge 1: Ticket for One\n\nThese days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy.\n\nGoing to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about.\n\nAt first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me realize that I sometimes enjoy doing things alone. After the movie, I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future.\n\nChallenge 2: Riding the Waves\n\nEver since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course.\n\nAt the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\n\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me.\n\nThe next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.\n\nI learned a lot about myself through this assignment, and I found out that my classmates did, too. One of them tried new foods from different countries, while another joined a creative writing club. Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different perspectives on life and had a lot of fun, too! My classmates and I even talked about setting more challenges for ourselves. There are always more things that we can discover about ourselves, and it's exciting to keep learning and growing. We never know what we're capable of until we try!","stem":"다음 글의 내용과 <b>일치하는</b> 것은?","det":{"ref":"[원문] Going to the theater alone was something I had never done before. ... I chose a historical drama that I had been curious about.\n[해석] 혼자 극장에 가는 것은 처음이었고, 궁금했던 역사 드라마를 선택했다.","correct":"② 글쓴이는 첫 번째 도전으로 혼자 극장에서 역사 드라마를 보았다: 원문과 일치","wrongs":["① 선생님은 학기 마지막 날에 과제를 주었다: 'first day of school'이므로 불일치 ❌","③ 글쓴이는 극장에서 친구와 함께 액션 영화를 보았다: 혼자 역사 드라마를 봄 ❌","④ 도전 과제는 반드시 운동과 관련된 것이어야 했다: hobbies, exercise, studies, relationships 모두 가능 ❌","⑤ 글쓴이는 항상 혼자 영화를 보는 것을 좋아했다: 처음 시도한 것임 ❌"],"tip":"💡 내용 일치: 세부 정보(시기, 대상, 행동)를 본문과 정확히 대조\n⚠️ 'first day' vs. 'last day', '혼자' vs. '친구와' 등 반대 표현 주의"},"ans":1,"ch":["선생님은 학기 마지막 날에 과제를 주었다.","글쓴이는 첫 번째 도전으로 혼자 극장에서 역사 드라마를 보았다.","글쓴이는 극장에서 친구와 함께 액션 영화를 보았다.","도전 과제는 반드시 운동과 관련된 것이어야 했다."]},
{"id":17,"type":"내용일치","diff":"보통","pts":5,"fmt":"mc","passage":"\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was trying something new for each one. She told us that we should share our experiences with our classmates when we finished the challenges.\n\nChallenge 1: Ticket for One\n\nThese days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy.\n\nGoing to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about.\n\nAt first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me realize that I sometimes enjoy doing things alone. After the movie, I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future.\n\nChallenge 2: Riding the Waves\n\nEver since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course.\n\nAt the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\n\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me.\n\nThe next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.\n\nI learned a lot about myself through this assignment, and I found out that my classmates did, too. One of them tried new foods from different countries, while another joined a creative writing club. Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different perspectives on life and had a lot of fun, too! My classmates and I even talked about setting more challenges for ourselves. There are always more things that we can discover about ourselves, and it's exciting to keep learning and growing. We never know what we're capable of until we try!","stem":"다음 글의 Challenge 2에 대한 내용과 <b>일치하지 않는</b> 것은?","det":{"ref":"[원문] While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n[해석] 그 경험이 수상 스포츠에 대한 생각을 완전히 바꾸지는 못했지만, 모험심을 발견하는 데 도움이 되었다.","correct":"④ 서핑 경험 후 수상 스포츠에 대한 생각이 완전히 바뀌었다: 원문은 'didn't completely change my mind'이므로 완전히 바뀌지 않았다. 불일치.","wrongs":["① 글쓴이는 어릴 때부터 물을 무서워했다: 'Ever since I was a child, I've always been afraid of water' ✅","② 사촌이 실내 수영장에서 서핑하는 영상을 SNS에서 보았다: 원문과 일치 ✅","③ 강사의 도움으로 균형 잡는 법을 배웠다: 'After some help from the instructor, I learned how to balance properly' ✅","⑤ 이 경험이 모험심을 발견하는 데 도움이 되었다: 원문과 일치 ✅"],"tip":"💡 부분 부정(didn't completely): 완전히 ~하지는 못했다 = 어느 정도는 변했다\n⚠️ didn't completely change ≠ completely changed"},"ans":3,"ch":["글쓴이는 어릴 때부터 물을 무서워했다.","사촌이 실내 수영장에서 서핑하는 영상을 SNS에서 보았다.","강사의 도움으로 균형 잡는 법을 배웠다.","서핑 경험 후 수상 스포츠에 대한 생각이 완전히 바뀌었다."]},
{"id":18,"type":"요약문","diff":"어려움","pts":6,"fmt":"mc","passage":"\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was trying something new for each one. She told us that we should share our experiences with our classmates when we finished the challenges.\n\nChallenge 1: Ticket for One\n\nThese days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy.\n\nGoing to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about.\n\nAt first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me realize that I sometimes enjoy doing things alone. After the movie, I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future.\n\nChallenge 2: Riding the Waves\n\nEver since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. However, I wasn't sure what to do at first. One day, I came across a video clip of my cousin surfing at an indoor pool on social media. It looked fun, and I liked the fact that it took place in a shallow pool, not in the ocean. I messaged my cousin about it. She assured me that it wasn't too hard, so I signed up for a beginner course.\n\nAt the beginning of the lesson, it was hard just to stand up on the board. After some help from the instructor, however, I learned how to balance properly and even managed to surf a few waves! It gave me such a rush of excitement. Being in the water wasn't as bad as I had thought. While the experience didn't completely change my mind about water sports, it did help me discover my sense of adventure.\n\nChallenge 3: A New Look\n\nOf all the challenges I chose for myself, the third one made me the most nervous: changing my hairstyle. For many years, I had kept the same hairstyle because I had been worried about my forehead. I had always thought it was large, and I didn't want to draw attention to it. Since I was feeling confident after the first two challenges, I went to a hair salon and talked to the stylist. He listened to my concerns and helped me find a shorter hairstyle that suited me.\n\nThe next day at school, my classmates were a bit surprised. But overall, the reactions were positive. I realized that trying a different look wasn't as difficult as I thought it would be. In fact, it made me feel more confident about myself. I didn't expect that stepping out of my comfort zone would have such a positive effect on how I felt about myself.\n\nI learned a lot about myself through this assignment, and I found out that my classmates did, too. One of them tried new foods from different countries, while another joined a creative writing club. Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different perspectives on life and had a lot of fun, too! My classmates and I even talked about setting more challenges for ourselves. There are always more things that we can discover about ourselves, and it's exciting to keep learning and growing. We never know what we're capable of until we try!","stem":"다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?<br><br>The writer and classmates learned that stepping out of their (A)__________ zones through various challenges helped them gain new (B)__________ about themselves.","det":{"ref":"[원문] She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. ... Through these experiences, we all realized how important it is to push ourselves to try new things. We gained different perspectives on life.\n[해석] 안전지대를 벗어나 다양한 도전을 통해 자신에 대한 새로운 관점과 발견을 얻었다.","correct":"(A) comfort — (B) perspectives: 'comfort zones'(안전지대)를 벗어나 'different perspectives'(다양한 관점)를 얻었다는 글의 핵심과 일치.","wrongs":["① danger — memories: 위험 구역이 아닌 안전지대를 벗어남, 추억이 아닌 관점 ❌","② study — grades: 공부 영역이 아님, 성적이 아닌 관점 ❌","④ comfort — complaints: 불만이 아닌 긍정적 관점 ❌","⑤ friend — regrets: 친구 영역이 아님, 후회가 아님 ❌"],"tip":"💡 요약문: 글 전체의 핵심 키워드를 찾기 — comfort zone + perspectives\n⚠️ 글의 톤이 긍정적이므로 부정적 단어(complaints, regrets)는 부적절"},"ans":2,"ch":["danger — memories","study — grades","comfort — perspectives","comfort — complaints"]},
{"id":19,"type":"추론","diff":"보통","pts":5,"fmt":"mc","passage":"\"To grow into a better version of ourselves, we should not stay as we are.\" That was the first thing our teacher said to us on the first day of school. She wanted us to start the semester by pushing ourselves out of our comfort zones and learning more about ourselves. To help us do so, she gave us an assignment to challenge ourselves in three different ways. The three challenges could involve hobbies, exercise, our studies, or even our relationships. The important part was trying something new for each one. She told us that we should share our experiences with our classmates when we finished the challenges.\n\nChallenge 1: Ticket for One\n\nThese days, I tend to watch movies on streaming services. However, if I go to the theater, I usually watch an action or science fiction movie with my friends or family. Those are the kinds of movies they enjoy.\n\nGoing to the theater alone was something I had never done before. So, for the first challenge, I decided to give it a try. It was nice to choose the movie and the seat on my own. I didn't have to worry about anyone else's preferences. I saw the experience as a good opportunity to watch something different, so I chose a historical drama that I had been curious about.\n\nAt first, it felt a bit awkward and lonely to sit in the theater by myself. But once the movie started, I became completely absorbed in the story. It was so satisfying just to focus on the movie itself. There was nothing to distract me! This experience made me realize that I sometimes enjoy doing things alone. After the movie, I promised myself that I would try to make my own choices more often and enjoy more activities by myself in the future.\n\nChallenge 2: Riding the Waves\n\nEver since I was a child, I've always been afraid of water. So I have never enjoyed water activities or felt comfortable while doing them. For the second challenge, I decided to try to overcome this discomfort. Howe
