<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>공통영어1 동아(이병민) 온라인단어TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* NaesinFit — Green Theme (단어테스트) */
:root{
  --p:#16A34A;--pd:#14532D;--pl:#E8F5E9;--pxl:#F0FDF4;--pxxl:#F8FDF9;
  --bg:#F4F8F5;--text:#1A1A2E;--tm:#5A6A5E;--tl:#8A9A8E;
  --r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;
  --o:#F59E0B;--ol:#FFF8E1;
  --card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);
  --radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;
  --pborder:#dde8df;--pbg-muted:#f0f5f1;
  --passage-bg:linear-gradient(135deg,#FAFDFB,#F5FAF6);
  --start-grad:linear-gradient(160deg,#F0FDF4,#E8F5E9 40%,#DCFCE7);
  --accent2:#0D9488;
  --p-rgba-08:rgba(22,163,74,.08);
  --p-rgba-10:rgba(22,163,74,.1);
  --p-rgba-12:rgba(22,163,74,.12);
  --p-rgba-25:rgba(22,163,74,.25);
  --p-rgba-30:rgba(22,163,74,.3);
}

/* NaesinFit Test Engine — Common CSS (theme-agnostic)
   Theme-specific colors come from :root variables defined in theme-*.css:
   --p      : primary color
   --pd     : primary dark
   --pl     : primary light
   --pxl    : primary extra-light
   --pxxl   : primary xx-light
   --bg     : page background
   --text   : main text
   --tm     : text muted
   --tl     : text light
   --pborder: border color (theme-tinted)
   --pbg-muted: muted bg for tracks/bars
   --start-grad: startScreen gradient
   --accent2: secondary gradient stop (badge/header)
   --p-rgba-08: rgba for selected bg
   --p-rgba-12: rgba for box-shadow
   --p-rgba-10: rgba for focus ring
   --p-rgba-25: rgba for button shadow
   --p-rgba-30: rgba for selectPulse
*/

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Start Screen */
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:var(--start-grad);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--p),var(--accent2));color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--p),var(--accent2));padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid var(--pborder);}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid var(--pborder);border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid var(--pborder);border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px var(--p-rgba-10);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;box-shadow:0 6px 20px var(--p-rgba-30);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid var(--pborder);color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--p);color:var(--p);}
.history-badge{background:var(--pxl);color:var(--p);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid var(--pborder);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--p);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}

/* Exam Screen */
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--p);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--p);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--p);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
.exam-progress{position:fixed;top:52px;left:0;right:0;height:3px;background:rgba(0,0,0,.06);z-index:99;}
.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--accent2));transition:width .5s ease;border-radius:0 2px 2px 0;}

/* Slide container */
.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}
.slide-passage{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 200px;background:#fff;transition:opacity .3s,transform .3s;}
.slide-passage.fade-out{opacity:0;transform:translateX(-20px);}
.slide-passage.fade-in{opacity:0;transform:translateX(20px);}
.slide-passage .q-passage{padding:0;border:none;background:transparent;line-height:1.9;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13.5px,3.3vw,15.5px);color:#2a2a2a;}
.q-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(135deg,var(--pxl),var(--pl));border-radius:20px;margin-bottom:14px;font-size:11px;font-weight:700;color:var(--pd);}
.q-badge .q-num{width:22px;height:22px;font-size:10px;}
.slide-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.72);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.08);border-top:1px solid rgba(255,255,255,.5);padding:10px 14px 14px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.slide-stem{font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5;color:var(--text);}
.slide-choices{display:flex;flex-direction:column;gap:3px;}
.slide-choices .choice-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12px;line-height:1.3;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;text-align:left;transition:all .25s cubic-bezier(.34,1.56,.64,1);}
.slide-choices .choice-btn:active{transform:scale(.97);}
.slide-choices .choice-btn.selected{border-color:var(--p);background:var(--p-rgba-08);box-shadow:0 0 0 3px var(--p-rgba-12);transform:scale(1.01);}
@keyframes selectPulse{0%{box-shadow:0 0 0 0 var(--p-rgba-30)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.slide-choices .choice-btn.just-selected{animation:selectPulse .5s ease-out;}
.slide-choices .c-num{min-width:20px;height:20px;font-size:10px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--p-rgba-10);}
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;box-shadow:0 2px 8px var(--p-rgba-25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--p);}
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--p);background:var(--pxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}

/* Type tags — same across all themes */
.tag-combo{background:#E8F5E9;color:#166534;}.tag-wrong{background:#FFF0F0;color:#D63B3B;}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:#EDF2FF;color:#3B6FD9;}.tag-ant{background:#FFF8E1;color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}.tag-insert{background:#E3F2FD;color:#1565C0;}.tag-order{background:#FFF8E1;color:#F57F17;}

.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:var(--pbg-muted);padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--p);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:var(--passage-bg);border-left:3px solid var(--p);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--pborder);border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--p);}.choice-btn.selected{border-color:var(--p);box-shadow:0 0 0 2px var(--p-rgba-12);background:var(--pxxl);}
.c-num{min-width:22px;height:22px;background:var(--pbg-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid var(--pborder);border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--p);}

/* Result Screen */
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--pxl),var(--pl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pd),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:var(--pbg-muted);border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--pl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--pxxl);border-radius:var(--rs);border:1px solid var(--pborder);}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--pxl);}.info-cell.highlight .ic-value{color:var(--p);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:var(--pbg-muted);border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--pl);color:var(--p);}.tag-item.weak{background:#FFF0F0;color:#D63B3B;}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--pxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid var(--pborder);border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--p);color:var(--p);}.act-btn.primary{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid var(--pborder);border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--pxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--pxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--pl);color:var(--p);}.expl-tag.tip{background:var(--pxl);color:var(--pd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--p);}.expl-box.tip-b{border-left:3px solid var(--p);background:var(--pxl);}

@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">온라인단어 TEST</div>
  <h1 class="start-title">온라인단어 <span>TEST</span></h1>
  <p class="start-subtitle">공통영어1 · 동아(이병민) · 4과 · 20문항</p>
  <div class="info-card"><div class="info-card-header">시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">공통영어1</span></div>
    <div class="info-row"><span class="info-label">문항</span><span class="info-value">동아(이병민) (4과)</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">Why You Buy What You Buy</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">20문항</div><div class="chip">20분</div><div class="chip">80점 이상 통과</div><div class="chip">100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="startExam()">시험 시작하기</button>
  <button class="btn btn-outline" onclick="toggleHistory()">시험 기록 보기 <span class="history-badge" id="hCount">0</span></button>
  <div id="historyPanel"></div>
</div>
</div>

<div id="examScreen" class="screen">
  <div class="exam-topbar"><div class="topbar-left"><div class="topbar-dot"></div><div class="topbar-info">공통영어1 · <span>동아(이병민)</span></div></div><div class="timer" id="timer">20:00</div><button class="btn-submit" onclick="submitExam()">제출하기</button></div>
  <div class="exam-progress"><div class="exam-progress-fill" id="progressFill"></div></div>
  <div class="ans-count" id="ansCount">0/20</div>
  <div class="exam-scroll" id="examScroll"></div>

<script>
const EI={"subject":"공통영어1","pub":"동아(이병민)","lesson":"4과","title":"Why You Buy What You Buy","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_dong_4_v2"};
const FULL_PASSAGE="The crowd went wild. The tablet suddenly seemed ①<u>affordable</u> to everyone. He put the $999 price tag in people's minds at the beginning so that the $499 price would seem a lot cheaper in ②<u>comparison</u>. Steve Jobs used something called the anchoring effect to his ③<u>disadvantage</u> here. It works because people tend to ④<u>rely</u> on the first piece of information they receive when making ⑤<u>decisions</u>.";
const Q=[{"id":1,"type":"(A)(B)(C) 조합형","diff":"쉬움","pts":4,"fmt":"mc","passage":"Do you think that you spend money (A)[<b>wisely / foolishly</b>]? The truth is that most people are not as (B)[<b>rational / irrational</b>] as they think. This is because human beings are easily (C)[<b>influenced / unaffected</b>] by psychological factors.","stem":"다음 글의 빈칸 (A), (B), (C)에 들어갈 말로 가장 적절한 것은?","det":{"korean":"여러분은 돈을 <b>현명하게</b> 쓴다고 생각하나요? 사실은 대부분의 사람이 자신들이 생각하는 만큼 <b>합리적</b>이지 않습니다. 인간은 심리적인 요인들에 의해 쉽게 <b>영향을 받기</b> 때문이죠.","analysis":"✅ ① wisely(현명하게), rational(합리적인), influenced(영향 받는) — 모두 원문과 일치<br>❌ ② irrational은 '비합리적인'으로 원문(rational)과 반대<br>❌ ③ foolishly는 '어리석게'로 원문(wisely)과 반대<br>❌ ④ foolishly가 원문과 반대<br>❌ ⑤ unaffected는 '영향받지 않는'으로 원문(influenced)과 반대","tip":"wisely ↔ foolishly, rational ↔ irrational, influenced ↔ unaffected 반의어 쌍을 기억하세요."},"ans":0,"ch":["(A) wisely − (B) rational − (C) influenced","(A) wisely − (B) irrational − (C) influenced","(A) foolishly − (B) rational − (C) unaffected","(A) foolishly − (B) irrational − (C) influenced"]},
{"id":2,"type":"(A)(B)(C) 조합형","diff":"쉬움","pts":4,"fmt":"mc","passage":"He went on to talk about the (A)[<b>features / flaws</b>] of the tablet and continued to (B)[<b>justify / deny</b>] why the tablet was worth buying. At the end, he said, 'I am (C)[<b>thrilled / reluctant</b>] to announce to you that the pricing starts not at $999 but at just $499.' The crowd went wild.","stem":"다음 글의 빈칸 (A), (B), (C)에 들어갈 말로 가장 적절한 것은?","det":{"korean":"그는 이어서 태블릿의 <b>기능</b>에 관해 이야기했고 왜 그것이 구매할 가치가 있는지 계속해서 <b>정당화</b>했습니다. 마지막에 그는 '가격이 $999가 아니라 $499부터 시작된다는 것을 알려 드리게 되어 매우 <b>기쁩니다</b>'라고 말했습니다.","analysis":"❌ ① deny(부정하다)는 justify(정당화하다)의 반의어<br>❌ ② flaws(결함)는 features(기능)의 반의어<br>❌ ③ reluctant(꺼리는)은 thrilled(매우 기쁜)의 반의어<br>✅ ④ features(기능), justify(정당화하다), thrilled(매우 기쁜) — 모두 원문과 일치<br>❌ ⑤ flaws, deny가 원문과 반대","tip":"features(기능) ↔ flaws(결함), justify(정당화하다) ↔ deny(부정하다), thrilled(매우 기쁜) ↔ reluctant(꺼리는)"},"ans":3,"ch":["(A) features − (B) deny − (C) thrilled","(A) flaws − (B) justify − (C) reluctant","(A) features − (B) justify − (C) reluctant","(A) features − (B) justify − (C) thrilled"]},
{"id":3,"type":"(A)(B)(C) 조합형","diff":"쉬움","pts":4,"fmt":"mc","passage":"This group showed an (A)[<b>equal / unequal</b>] preference for the two items. About half of the group chose the chocolate bar, and the other half chose the coffee mug. This suggested that (B)[<b>roughly / exactly</b>] half of the first and second groups would (C)[<b>trade / keep</b>] their items.","stem":"다음 글의 빈칸 (A), (B), (C)에 들어갈 말로 가장 적절한 것은?","det":{"korean":"이 그룹은 두 물건에 대해 <b>균등한</b> 선호도를 보였습니다. 그룹의 절반 정도가 초콜릿 바를 선택했고, 다른 절반은 커피 머그잔을 선택했습니다. 이는 첫 번째와 두 번째 그룹의 <b>대략</b> 절반 정도가 그들의 물건을 서로 <b>바꿀</b> 것이라는 걸 암시했죠.","analysis":"❌ ① exactly(정확히)는 roughly(대략)와 의미가 다름<br>❌ ② unequal(불균등한)은 equal(균등한)의 반의어<br>❌ ③ exactly, keep 모두 원문과 다름<br>❌ ④ unequal이 원문과 반대<br>✅ ⑤ equal(균등한), roughly(대략), trade(교환하다) — 모두 원문과 일치","tip":"equal ↔ unequal, roughly ↔ exactly, trade ↔ keep 반의어 쌍 정리!"},"ans":2,"ch":["(A) equal − (B) exactly − (C) trade","(A) unequal − (B) roughly − (C) keep","(A) equal − (B) roughly − (C) trade","(A) equal − (B) exactly − (C) keep"]},
{"id":4,"type":"문맥상 부적절한 어휘","diff":"쉬움","pts":4,"fmt":"mc","passage":"The crowd went wild. The tablet suddenly seemed ①<u>affordable</u> to everyone. He put the $999 price tag in people's minds at the beginning so that the $499 price would seem a lot cheaper in ②<u>comparison</u>. Steve Jobs used something called the anchoring effect to his ③<u>disadvantage</u> here. It works because people tend to ④<u>rely</u> on the first piece of information they receive when making ⑤<u>decisions</u>.","stem":"다음 글의 밑줄 친 낱말 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?","det":{"korean":"청중들은 열광했습니다. 그 태블릿은 갑자기 모든 사람들에게 ①<b>구매할 만한 가격</b>으로 보였습니다. $499 가격이 ②<b>비교</b>해서 훨씬 저렴해 보이도록 초반에 $999를 각인시켰습니다. 스티브 잡스는 닻 내림 효과를 자신에게 ③<b>불리하게[→유리하게]</b> 이용했습니다. 사람들이 ④<b>의존</b>하는 경향이 있기 때문에 ⑤<b>결정</b>을 내릴 때 가능한 것이죠.","analysis":"✅ ① affordable(구매할 만한) — 원문 일치<br>✅ ② comparison(비교) — 원문 일치<br>❌ ③ disadvantage(불리함) → 원문은 <b>advantage(유리함)</b>. 잡스가 앵커링 효과를 '유리하게' 이용한 것이므로 disadvantage는 부적절<br>✅ ④ rely(의존하다) — 원문 일치<br>✅ ⑤ decisions(결정) — 원문 일치","tip":"advantage(유리함) ↔ disadvantage(불리함) 반의어 쌍을 기억하세요."},"ans":2,"ch":["affordable","comparison","disadvantage","rely"]},
{"id":5,"type":"문맥상 부적절한 어휘","diff":"쉬움","pts":4,"fmt":"mc","passage":"Companies often ①<u>use</u> the endowment effect as a marketing strategy. For example, many media streaming companies ②<u>refuse</u> free trials to customers. Once customers use the free trial, they feel ③<u>ownership</u> of that service, even if it's ④<u>temporary</u>. Consequently, they are likely to value it more and are ⑤<u>willing</u> to pay to continue to own it.","stem":"다음 글의 밑줄 친 낱말 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?","det":{"korean":"기업들은 마케팅 전략으로 보유 효과를 자주 ①<b>이용</b>합니다. 예를 들어, 다수의 미디어 스트리밍 회사들은 고객들에게 무료 체험을 ②<b>거부[→제공]</b>합니다. 한 번 무료 체험을 하면 고객들은 그 서비스에 대한 ③<b>소유권</b>을 느낍니다. 그것이 ④<b>일시적</b>인 것임에도요. 결과적으로 그것을 계속 소유하기 위해 ⑤<b>기꺼이</b> 돈을 지불합니다.","analysis":"✅ ① use(이용하다) — 원문 일치<br>❌ ② refuse(거부하다) → 원문은 <b>offer(제공하다)</b>. 스트리밍 회사가 무료 체험을 '제공'하는 것이므로 refuse는 부적절<br>✅ ③ ownership(소유권) — 원문 일치<br>✅ ④ temporary(일시적인) — 원문 일치<br>✅ ⑤ willing(기꺼이 하는) — 원문 일치","tip":"offer(제공하다) ↔ refuse(거부하다) 반의어 쌍. 문맥상 무료 체험을 '제공'하는 것이 자연스럽습니다."},"ans":1,"ch":["use","refuse","ownership","temporary"]},
{"id":6,"type":"문맥상 부적절한 어휘","diff":"보통","pts":5,"fmt":"mc","passage":"Look at the two pairs of sneakers. They both are $50, but the way their price is ①<u>presented</u> is different. Naturally, people are more ②<u>drawn</u> to the second pair. This is because the ③<u>original</u> price serves as an anchor, making the discounted price appear more ④<u>unreasonable</u> in comparison. It is common for stores to use this kind of price anchoring as a way to ⑤<u>encourage</u> purchases.","stem":"다음 글의 밑줄 친 낱말 중, 문맥상 낱말의 쓰임이 적절하지 <b>않은</b> 것은?","det":{"korean":"운동화 두 켤레를 보세요. 두 제품 모두 $50인데 가격이 ①<b>제시되는</b> 방식은 다릅니다. 사람들은 자연스럽게 두 번째에 더 ②<b>끌립니다</b>. ③<b>원래</b> 가격이 닻 역할을 하여 할인 가격을 더 ④<b>비합리적으로[→합리적으로]</b> 보이게 만들기 때문입니다. 이런 가격 앵커링으로 구매를 ⑤<b>장려</b>하는 것은 흔한 일입니다.","analysis":"✅ ① presented(제시된) — 원문 일치<br>✅ ② drawn(끌리는) — 원문 일치<br>✅ ③ original(원래의) — 원문 일치<br>❌ ④ unreasonable(비합리적인) → 원문은 <b>reasonable(합리적인)</b>. 할인 가격이 '합리적으로' 보이게 만드는 것이므로 unreasonable은 부적절<br>✅ ⑤ encourage(장려하다) — 원문 일치","tip":"reasonable(합리적인) ↔ unreasonable(비합리적인). 앵커링은 할인 가격을 더 '합리적'으로 보이게 하는 효과입니다."},"ans":3,"ch":["presented","drawn","original","unreasonable"]},
{"id":7,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","passage":"In 2010, Steve Jobs introduced the tablet computer to the world. During the presentation, he said, 'We're going to price it under a thousand dollars,' which most people __________ meant $999. He went on to talk about the features of the tablet and continued to justify why the tablet was worth buying.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"2010년에 스티브 잡스는 태블릿 컴퓨터를 세상에 선보였습니다. 발표 중에 그는 '1,000달러 이하로 가격을 책정하겠습니다'라고 말했고, 대부분의 사람들은 그것이 $999를 의미한다고 <b>추측했습니다</b>.","analysis":"❌ ① supposed — '가정하다'라는 뜻이지만 문맥상 부자연스러움<br>✅ ② assumed — '추측하다, 짐작하다'로 원문과 일치<br>❌ ③ denied — '부정하다'는 문맥과 맞지 않음<br>❌ ④ announced — '발표하다'는 청중이 아닌 잡스의 행동","tip":"assume = ~라고 추측하다/짐작하다. suppose와 비슷하지만 assume이 '근거 없이 당연히 여기다'의 뉘앙스가 강합니다."},"ans":1,"ch":["supposed","assumed","denied","announced"]},
{"id":8,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","passage":"As we've seen, our spending can be influenced by factors that __________ to our emotions and mind. I hope this short lecture gave you a chance to reflect on your own spending and helped you understand the reasons behind irrational purchasing decisions.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"지금까지 보았듯, 우리의 소비는 우리의 감정과 마음에 <b>호소하는</b> 요인들의 영향을 받을 수 있습니다. 이 강의가 여러분의 소비를 되돌아보는 기회가 되었기를 바랍니다.","analysis":"✅ ① appeal — 'appeal to = ~에 호소하다'로 원문과 일치<br>❌ ② apply — 'apply to = ~에 적용하다'는 문맥과 맞지 않음<br>❌ ③ attach — 'attach to = ~에 부착하다'는 문맥과 맞지 않음<br>❌ ④ attend — 'attend to = ~에 주의를 기울이다'는 문맥과 맞지 않음","tip":"appeal to = ~에 호소하다. 감정이나 마음에 '호소하다'라는 표현을 기억하세요."},"ans":0,"ch":["appeal","apply","attach","attend"]},
{"id":9,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","passage":"Say that a company is offering free returns on a smartwatch within 30 days of purchase. It seems like a good deal, since you can get a __________ even after using the item. But once you take this deal and establish ownership of the watch, it is unlikely that you will return it.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"어떤 회사에서 스마트워치 구매 후 30일 이내에 무료 반품을 해 준다고 가정해 봅시다. 제품을 사용한 후에도 <b>환불</b>을 받을 수 있기 때문에 좋은 거래처럼 보입니다.","analysis":"❌ ① reward — '보상'은 반품 맥락과 맞지 않음<br>❌ ② receipt — '영수증'은 반품 후 돌려받는 것이 아님<br>❌ ③ revenue — '수익'은 기업 관점이므로 부적절<br>✅ ④ refund — '환불'로 원문과 일치. 무료 반품 후 돈을 돌려받는 것","tip":"refund(환불), reward(보상), receipt(영수증), revenue(수익) — re- 접두사 단어들을 구별하세요!"},"ans":3,"ch":["reward","receipt","revenue","refund"]},
{"id":10,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","passage":"Good afternoon, students. Today, I'd like to talk about a topic that <u>concerns</u> us all: Money! Do you think that you spend money wisely? The truth is that most people are not as rational as they think.","stem":"다음 글의 밑줄 친 단어와 의미가 가장 <b>가까운</b> 것은?","det":{"korean":"안녕하세요, 학생 여러분. 오늘은 우리 모두와 <b>관련된</b> 주제에 대해 이야기하려 합니다. 바로 돈입니다!","analysis":"❌ ① controls — '통제하다'는 문맥과 맞지 않음<br>❌ ② confuses — '혼란스럽게 하다'는 문맥과 맞지 않음<br>✅ ③ relates to — '~와 관련되다'로 concern(관련되다)과 동의어<br>❌ ④ worries — concern이 '걱정하다'의 뜻도 있지만 여기서는 '관련되다'의 의미","tip":"concern은 다의어! ① 관련되다(= relate to) ② 걱정하다(= worry). 문맥에 따라 의미가 달라집니다."},"ans":2,"ch":["controls","confuses","relates to","worries"]},
{"id":11,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","passage":"The truth is that most people are not as rational as they think. This is because human beings are easily influenced by psychological factors. Let me <u>illustrate</u> my point through the following examples.","stem":"다음 글의 밑줄 친 단어와 의미가 가장 <b>가까운</b> 것은?","det":{"korean":"사실은 대부분의 사람이 자신들이 생각하는 만큼 합리적이지 않습니다. 인간은 심리적 요인에 의해 쉽게 영향을 받기 때문이죠. 다음 사례들을 통해 제 의견을 <b>설명해</b> 보도록 하겠습니다.","analysis":"❌ ① describe — '묘사하다'는 유사하지만 '예시로 설명하다'와 약간 다름<br>✅ ② demonstrate — '예를 들어 보여주다/설명하다'로 illustrate와 가장 가까움<br>❌ ③ imagine — '상상하다'는 의미가 다름<br>❌ ④ investigate — '조사하다'는 의미가 다름","tip":"illustrate = (예시로) 설명하다, 보여주다 ≒ demonstrate. 그림(illustration)을 통해 보여준다고 연상하세요."},"ans":1,"ch":["describe","demonstrate","imagine","investigate"]},
{"id":12,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","passage":"Say that a company is offering free returns on a smartwatch within 30 days of purchase. It seems like a good deal, since you can get a refund even after using the item. But once you take this deal and <u>establish</u> ownership of the watch, it is unlikely that you will return it.","stem":"다음 글의 밑줄 친 단어와 의미가 가장 <b>가까운</b> 것은?","det":{"korean":"어떤 회사에서 스마트워치 구매 후 30일 이내에 무료 반품을 해 준다고 가정해 봅시다. 하지만 이 거래를 받아들이고 시계의 소유권을 <b>형성하게</b> 되면 반품할 가능성은 낮아집니다.","analysis":"❌ ① examine — '조사하다'는 의미가 다름<br>❌ ② destroy — '파괴하다'는 establish의 반의어에 가까움<br>❌ ③ predict — '예측하다'는 의미가 다름<br>✅ ④ form — '형성하다'로 establish(확립하다/형성하다)와 가장 가까움","tip":"establish = 확립하다, 형성하다, 설립하다 ≒ form, set up. 소유권을 '확립/형성'한다는 맥락입니다."},"ans":3,"ch":["examine","destroy","predict","form"]},
{"id":13,"type":"반의어 고르기","diff":"보통","pts":5,"fmt":"mc","passage":"This is because people <u>value</u> something more when they own it. This is the basic idea of the endowment effect. People are less likely to give up what they already have or trade it for something else.","stem":"다음 글의 밑줄 친 단어와 의미가 가장 <b>먼</b> 것은?","det":{"korean":"이는 사람들이 자신이 무언가를 소유했을 때 그것을 더 <b>가치 있게 여기기</b> 때문입니다. 이것이 보유 효과의 기본 개념입니다.","analysis":"✅ ① disregard — '무시하다'로 value(가치 있게 여기다)와 <b>반의어</b> → 정답<br>❌ ② appreciate — '소중히 여기다'로 value와 유의어<br>❌ ③ treasure — '소중히 여기다'로 value와 유의어<br>❌ ④ cherish — '소중히 여기다'로 value와 유의어","tip":"value(가치 있게 여기다) ≒ appreciate, treasure, cherish ↔ disregard(무시하다), neglect(소홀히 하다)"},"ans":0,"ch":["disregard","appreciate","treasure","cherish"]},
{"id":14,"type":"반의어 고르기","diff":"보통","pts":5,"fmt":"mc","passage":"As we've seen, our spending can be influenced by factors that appeal to our emotions and mind. I hope this short lecture gave you a chance to reflect on your own spending and helped you understand the reasons behind <u>irrational</u> purchasing decisions.","stem":"다음 글의 밑줄 친 단어와 의미가 가장 <b>먼</b> 것은?","det":{"korean":"이 짧은 강의가 여러분의 소비를 되돌아보는 기회가 되고, <b>비합리적인</b> 구매 결정의 이유를 이해하는 데 도움이 되었기를 바랍니다.","analysis":"❌ ① unreasonable — '비합리적인'으로 irrational과 유의어<br>❌ ② senseless — '무분별한'으로 irrational과 유의어<br>✅ ③ logical — '논리적인'으로 irrational(비합리적인)과 <b>반의어</b> → 정답<br>❌ ④ absurd — '터무니없는'으로 irrational과 유의어","tip":"irrational(비합리적인) ≒ unreasonable, senseless, absurd ↔ logical(논리적인), rational(합리적인)"},"ans":2,"ch":["unreasonable","senseless","logical","absurd"]},
{"id":15,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","passage":"A free-return policy is another example. Say that a company is offering free returns on a smartwatch within 30 days of purchase. It seems like a good <b>deal</b>, since you can get a refund even after using the item.","stem":"다음 글에서 쓰인 <b>deal</b>의 의미와 <b>같은</b> 의미로 쓰인 것을 고르시오.","det":{"korean":"무료 반품 정책은 또 다른 예입니다. 제품을 사용한 후에도 환불을 받을 수 있기 때문에 좋은 <b>거래(조건)</b>처럼 보입니다.","analysis":"본문의 deal = '거래, 좋은 조건'이라는 <b>명사</b> 의미<br>❌ ① deal with = '다루다, 처리하다' (동사구)<br>❌ ② deal = '합의, 협정' (명사이지만 의미가 다름)<br>❌ ③ deal with = '다루다' (동사구)<br>❌ ④ deal with = '다루다' (동사구)<br>✅ ⑤ deal = '(가격이) 좋은 거래/조건' — 본문과 동일한 의미","tip":"deal의 주요 의미: ① (명사) 거래, 좋은 조건 (a good deal) ② (명사) 합의 (make a deal) ③ (동사) deal with = 다루다, 처리하다"},"ans":2,"ch":["You need to deal with stress in a healthy way.","The government made a deal with the opposition party.","He got a great deal on his new laptop.","She had to deal with angry customers all day."]},
{"id":16,"type":"영영풀이 매칭","diff":"어려움","pts":6,"fmt":"mc","passage":"The crowd went wild. The tablet suddenly seemed ①<u>affordable</u> to everyone. He put the $999 price tag in people's minds at the beginning so that the $499 price would seem a lot cheaper in ②<u>comparison</u>. Steve Jobs used something called the anchoring effect to his ③<u>disadvantage</u> here. It works because people tend to ④<u>rely</u> on the first piece of information they receive when making ⑤<u>decisions</u>.","stem":"다음 영영 정의에 해당하는 단어를 고르시오.","det":{"korean":"너무 비싸서 $50 이상 쓰고 싶지 않습니다. 곧이어 $70짜리 비슷한 재킷을 봅니다. 그 가격은 여전히 <b>예산</b>을 초과하지만 적당하다고 생각합니다.","analysis":"❌ ① purchase — '구매'는 영영 정의와 맞지 않음<br>❌ ② strategy — '전략'은 영영 정의와 맞지 않음<br>❌ ③ preference — '선호'는 영영 정의와 맞지 않음<br>✅ ④ budget — '예산, 쓸 수 있는 금액'으로 영영 정의와 일치","tip":"budget = 예산, 지출 계획. 'beyond one's budget' = 예산을 초과하여"},"ans":3,"ch":["purchase","strategy","preference","budget"]},
{"id":17,"type":"어형 변환 (서술형)","diff":"어려움","pts":6,"fmt":"written","passage":"Naturally, people are more drawn to the second pair. This is because the original price serves as an anchor, making the (discount) __________ price appear more reasonable in comparison. It is common for stores to use this kind of price anchoring as a way to encourage purchases.","stem":"다음 괄호 안의 단어를 문맥에 맞게 변형하여 빈칸에 쓰시오.","det":{"korean":"사람들은 자연스럽게 두 번째에 더 끌립니다. 원래 가격이 닻 역할을 하여 <b>할인된</b> 가격을 더 합리적으로 보이게 만들기 때문입니다.","analysis":"discount(할인, 할인하다) → <b>discounted</b>(할인된) : 과거분사형으로 'price'를 수식하는 형용사 역할. '할인된 가격'이라는 의미가 되어야 합니다.","tip":"discount → discounted(할인된, 과거분사 형용사). discounted price = 할인된 가격, 명사를 수식하는 과거분사!"},"wa":"discounted","accept":["discounted"]},
{"id":18,"type":"어형 변환 (서술형)","diff":"어려움","pts":6,"fmt":"written","passage":"Companies often use the endowment effect as a marketing strategy. For example, many media streaming companies offer free trials to customers. Once customers use the free trial, they feel ownership of that service, even if it's temporary. (Consequence) __________, they are likely to value it more and are willing to pay to continue to own it.","stem":"다음 괄호 안의 단어를 문맥에 맞게 변형하여 빈칸에 쓰시오.","det":{"korean":"한 번 무료 체험을 하면 고객들은 그 서비스에 대한 소유권을 느낍니다. <b>결과적으로</b>, 그것을 좀 더 가치 있게 여기고 기꺼이 돈을 지불합니다.","analysis":"Consequence(결과, 명사) → <b>Consequently</b>(결과적으로, 부사) : 문장 앞에서 접속부사로 쓰여 앞 문장과의 인과 관계를 나타냅니다.","tip":"consequence(명사: 결과) → consequently(부사: 결과적으로). 접속부사로 쓰일 때 뒤에 콤마(,)가 옵니다!"},"wa":"Consequently","accept":["Consequently","consequently"]},
{"id":19,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","passage":"He put the $999 price tag in people's minds at the beginning so that the $499 price would seem a lot cheaper in comparison. Steve Jobs used something called __________ to his advantage here. It works because people tend to rely on the first piece of information they receive when making decisions.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"$499 가격이 비교적 훨씬 저렴해 보이도록 초반에 $999 가격표를 사람들의 마음에 각인시켰습니다. 스티브 잡스는 여기에서 <b>닻 내림 효과</b>라는 것을 유리하게 이용했습니다.","analysis":"✅ ① the anchoring effect — '닻 내림 효과'. 처음 정보($999)가 이후 판단에 영향 → 원문과 일치<br>❌ ② the endowment effect — '보유 효과'는 소유와 관련된 효과<br>❌ ③ the placebo effect — '위약 효과'는 의학 용어<br>❌ ④ the halo effect — '후광 효과'는 한 특성이 전체 평가에 영향","tip":"anchoring effect(닻 내림 효과): 처음 제시된 정보(anchor)가 이후 판단의 기준이 되는 심리 효과"},"ans":0,"ch":["the anchoring effect","the endowment effect","the placebo effect","the halo effect"]},
{"id":20,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","passage":"A free-return policy is another example. Say that a company is offering free returns on a smartwatch within 30 days of purchase. It seems like a good deal, since you can get a refund even after using the item. But once you take this deal and establish ownership of the watch, it is __________ that you will return it.","stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"어떤 회사에서 스마트워치 구매 후 30일 이내에 무료 반품을 해 준다고 가정해 봅시다. 하지만 이 거래를 받아들이고 시계의 소유권을 갖게 되면, 여러분이 그것을 반품할 가능성은 <b>낮습니다</b>.","analysis":"❌ ① certain — '확실한'은 문맥과 반대 (반품 가능성이 높다는 뜻)<br>❌ ② possible — '가능한'은 보유 효과의 핵심을 나타내지 못함<br>✅ ③ unlikely — '가능성이 낮은'으로 원문과 일치. 소유권 형성 후 반품 가능성 낮음<br>❌ ④ obvious — '명백한'은 문맥과 맞지 않음","tip":"unlikely = 가능성이 낮은. 보유 효과 때문에 소유한 것은 쉽게 포기하지 않는다는 핵심 개념!"},"ans":2,"ch":["certain","possible","unlikely","obvious"]}];

let S = { ans: [], cur: 0, ti: null, left: EI.time, start: 0 };

function getHistory() {
  try { return JSON.parse(localStorage.getItem(EI.histKey) || '[]'); }
  catch (e) { return []; }
}

function saveToHistory(r, elapsed) {
  const h = getHistory();
  h.unshift({
    name: document.getElementById('inpName').value.trim(),
    school: document.getElementById('inpSchool').value.trim(),
    grade: document.getElementById('inpGrade').value,
    score: r.score, total: EI.total,
    correct: r.correct, wrong: r.wrong, unanswered: r.unanswered,
    elapsed, date: new Date().toISOString(),
    level: getLevel(r.score).name,
    answers: S.ans.slice()
  });
  if (h.length > 20) h.length = 20;
  localStorage.setItem(EI.histKey, JSON.stringify(h));
}

function updateHCount() {
  const h = getHistory();
  document.getElementById('hCount').textContent = h.length;
}

function toggleHistory() {
  const p = document.getElementById('historyPanel');
  if (p.style.display === 'block') { p.style.display = 'none'; return; }
  const h = getHistory();
  if (!h.length) {
    p.innerHTML = '<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">\uc544\uc9c1 \uae30\ub85d\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.</p>';
    p.style.display = 'block'; return;
  }
  const mk = '\u2460\u2461\u2462\u2463\u2464';
  p.innerHTML = h.map(function (x, idx) {
    return '<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">' + (x.name || '\uc774\ub984\uc5c6\uc74c') + '</div><div class="hi-meta">' + new Date(x.date).toLocaleDateString('ko-KR') + ' \u00b7 ' + x.grade + ' \u00b7 ' + (x.level || '') + '</div></div><div class="hi-right"><div class="hi-score" style="color:' + (x.score >= 80 ? 'var(--p)' : 'var(--r)') + '">' + x.score + '<span style="font-size:11px;color:var(--tl)">/' + x.total + '</span></div></div>' + (x.answers ? '<button onclick="reviewHistory(' + idx + ')" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid var(--pborder);border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--p)">\ud83d\udcdd \uc815\ub2f5\u00b7\ud574\uc124 \ub2e4\uc2dc \ubcf4\uae30</button>' : '') + '</div>';
  }).join('');
  p.style.display = 'block';
}

function getLevel(s) {
  if (s >= 95) return { name: '\ub9c8\uc2a4\ud130', icon: '\ud83d\udc51', range: '95~100', msg: '\uc774 \ub2e8\uc6d0\uc740 \uc815\ubcf5\ud588\uc5b4\uc694!' };
  if (s >= 85) return { name: '\ucc4c\ub9b0\uc800', icon: '\ud83c\udf1f', range: '85~94', msg: '\uac70\uc758 \uc644\ubcbd, \ud55c \ub057 \ucc28\uc774!' };
  if (s >= 75) return { name: '\ud30c\uc774\ud130', icon: '\ud83d\udc8e', range: '75~84', msg: '\ud1b5\uacfc! \uc57d\uc810\ub9cc \uc7a1\uc73c\uba74 \ub9c8\uc2a4\ud130' };
  if (s >= 50) return { name: '\ub8e8\ud0a4', icon: '\ud83d\udd25', range: '50~74', msg: '\uae30\ubcf8\uae30 OK, \uc720\ud615\ubcc4 \ud6c8\ub828 \ud544\uc694' };

}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

    filtered = Q.map(function (q, i) { return { q: q, i: i }; }).filter(function (f) { return secs.includes(f.q.sec); });
    S = { ans: Array(filtered.length).fill(null), cur: 0, ti: null, left: EI.time, start: Date.now(), order: shuffle([].concat(Array(filtered.length).keys ? Array.from({ length: filtered.length }, function (_, i) { return i; }) : [])), filtered: filtered.map(function (f) { return f.i; }), secs: secs };
    EI._origTotalQ = EI.totalQ; EI._origTotal = EI.total;

function showQ(idx, direction) {

function renderContent(idx, qi, q, tc, mk, pp) {

function selectAns(idx, ci) {
  var qi = S.order ? S.order[idx] : idx;
  if (S.filtered) qi = S.filtered[qi];
  S.ans[qi] = ci;
  var btns = document.querySelectorAll('.slide-choices .choice-btn');
  btns.forEach(function (b, i) {
    b.classList.toggle('selected', i === ci);
    if (i === ci) b.classList.add('just-selected');
  });
  updateProgress();
}

function writeAns(idx, val) {
  var qi = S.order ? S.order[idx] : idx;
  if (S.filtered) qi = S.filtered[qi];
  S.ans[qi] = val.trim() || null;
  updateProgress();
}

function navQ(dir) {
  var next = S.cur + dir;
  if (next >= 0 && next < EI.totalQ) showQ(next, dir);
}

function updateProgress() {
  var answered = S.ans.filter(function (a) { return a !== null; }).length;
  document.getElementById('progressFill').style.width = (answered / EI.totalQ * 100) + '%';
  document.getElementById('ansCount').textContent = answered + '/' + EI.totalQ;
}

function initSwipe() {
  var startX = 0, startY = 0;
  var el = document.getElementById('slideWrap');
  el.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0 && S.cur < EI.totalQ - 1) navQ(1);
      if (dx > 0 && S.cur > 0) navQ(-1);
    }
  }, { passive: true });
}

function submitExam() {
  if (!confirm('\uc81c\ucd9c\ud558\uc2dc\uaca0\uc2b5\ub2c8\uae4c?')) return;
  clearInterval(S.ti);
  var elapsed = Math.floor((Date.now() - S.start) / 1000);
  var r = grade();
  saveToHistory(r, elapsed);
  renderResults(r, elapsed);
  showScreen('resultScreen');
  window.scrollTo(0, 0);
}

function grade() {
  var score = 0, correct = 0, wrong = 0, unanswered = 0;
  var details = [];
  var qs = S.filtered ? S.filtered.map(function (i) { return Q[i]; }) : Q;
  qs.forEach(function (q, i) {
    var a = S.ans[i];
    var ok = false;
    if (a === null) unanswered++;
    else if (q.fmt === 'mc') ok = a === q.ans;
    else {
      var u = String(a).trim().toLowerCase();
      if (q.accept) ok = q.accept.some(function (x) { return u === x.toLowerCase(); });
      if (!ok && q.wa) ok = u === q.wa.toLowerCase();
    }
    if (a !== null) { if (ok) { correct++; score += q.pts; } else wrong++; }
    details.push({ q: q, ans: a, ok: ok });
  });
  return { score: score, correct: correct, wrong: wrong, unanswered: unanswered, details: details };
}

}

function getTestName() {
  var t = document.title;
  if (t.includes('\ub2e8\uc5b4')) return '\ub2e8\uc5b4\ud14c\uc2a4\ud2b8';
  if (t.includes('\uc6cc\ud06c\ubd81')) return '\uc6cc\ud06c\ubd81\ud14c\uc2a4\ud2b8';
  if (t.includes('\ud034\uc988')) return '\ud034\uc988(\uc608\uc0c1\ubb38\uc81c)\ud14c\uc2a4\ud2b8';
  return 'TEST';
}

function copyResult() {
  var r = grade(), lv = getLevel(r.score), pct = Math.round(r.score / EI.total * 100);
  var nm = document.getElementById('inpName').value.trim();
  var sc = document.getElementById('inpSchool').value.trim();
  var gr = document.getElementById('inpGrade').value;
  var elapsed = Math.floor((Date.now() - S.start) / 1000);
  var pass = r.score >= 80, tn = getTestName(), wk = getWeakTypes();
  var tm = {};
  r.details.forEach(function (d) {
    var t = d.q.type;
    if (!tm[t]) tm[t] = { total: 0, ok: 0 };
    tm[t].total++;
    if (d.ok) tm[t].ok++;
  });
  var secLabel = S.secs ? S.secs.join(', ') : '\uc804\uccb4';
  var txt = '\ud83d\udcdd \ub0b4\uc2e0\ud56b ' + tn + ' \uacb0\uacfc\n' + EI.subject + ' \u00b7 ' + EI.pub + ' [' + secLabel + ']\n' + nm + (sc ? ' \u00b7 ' + sc : '') + ' \u00b7 ' + gr + '\n' + new Date().toLocaleDateString('ko-KR') + '\n\n' + lv.icon + ' ' + lv.name + ' \u00b7 ' + r.score + '/' + EI.total + '\uc810 (' + pct + '%)\n' + (pass ? '\ud83c\udf89 \ud1b5\uacfc!' : '\ud83d\udcda \ubbf8\ud1b5\uacfc') + ' \u00b7 \u2705' + r.correct + ' \u274c' + r.wrong + ' \u2b1c' + r.unanswered + '\n\u23f1\ufe0f ' + fmtTime(elapsed);
  if (wk.length) {
    txt += '\n\n\ud83d\udd0d \ub0b4\uc2e0\ud56b \uc57d\uc810 \uc9c4\ub2e8';
    wk.forEach(function (w) { var d = tm[w]; txt += '\n\u2022 ' + w.replace(/\(.+?\)/g, '').trim() + ' ' + d.ok + '/' + d.total + ' \u2192 ' + getTypeAdvice(w); });
  }
  txt += '\n\n\ud83d\udcca \ub0b4\uc2e0\ud56b | \ub0b4\uc2e0 \uc601\uc5b4 \uc644\ubcbd \ub300\ube44';
  navigator.clipboard.writeText(txt).then(function () { toast('\ud83d\udccb \uacb0\uacfc\uac00 \ubcf5\uc0ac\ub418\uc5c8\uc2b5\ub2c8\ub2e4!'); }).catch(function () { toast('\ubcf5\uc0ac \uc2e4\ud328'); });
}

function shareImage() {
  var tn = getTestName(), wk = getWeakTypes(), r = grade(), lv = getLevel(r.score);
  var pct = Math.round(r.score / EI.total * 100), pass = r.score >= 80;
  var nm = document.getElementById('inpName').value.trim();
  var tm = {};
  r.details.forEach(function (d) {
    var t = d.q.type;
    if (!tm[t]) tm[t] = { total: 0, ok: 0 };
    tm[t].total++;
    if (d.ok) tm[t].ok++;
  });
  var pc = pass ? '#16A34A' : '#D63B3B';
  var card = '<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">';
  card += '<div style="background:linear-gradient(135deg,' + (pass ? '#E8F5E9,#C8E6C9' : '#FFF0F0,#FFEAEA') + ');padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:' + pc + ';margin-bottom:4px">\ub0b4\uc2e0\ud56b ' + tn + '</div><div style="font-size:13px;color:#666;margin-bottom:16px">' + EI.subject + ' \u00b7 ' + EI.pub + '</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">' + r.score + '<span style="font-size:20px;color:#aaa">/' + EI.total + '</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:' + pc + ';color:#fff">' + lv.icon + ' ' + lv.name + ' \u00b7 ' + (pass ? '\ud1b5\uacfc' : '\ubbf8\ud1b5\uacfc') + '</span></div><div style="margin-top:12px;font-size:12px;color:#888">\ud83d\udc64 ' + nm + ' \u00b7 \u2705' + r.correct + ' \u274c' + r.wrong + ' \u2b1c' + r.unanswered + '</div></div>';
  if (wk.length) {
    card += '<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">\ud83d\udd0d \ub0b4\uc2e0\ud56b \uc57d\uc810 \uc9c4\ub2e8</div>';
    Object.entries(tm).forEach(function (entry) {
      var type = entry[0], d = entry[1];
      var p = Math.round(d.ok / d.total * 100);
      var c = p === 100 ? '#16A34A' : p >= 50 ? '#F59E0B' : '#D63B3B';
      card += '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">' + type.replace(/\(.+?\)/g, '').trim() + '</span><span style="font-weight:800;color:' + c + '">' + d.ok + '/' + d.total + '</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:' + p + '%;background:' + c + ';border-radius:3px"></div></div></div>';
    });
    card += '</div>';
  }
  card += '<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">\ud83d\udcca <b style="color:#333">\ub0b4\uc2e0\ud56b</b> | \ub0b4\uc2e0 \uc601\uc5b4 \uc644\ubcbd \ub300\ube44</div></div>';
  var wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-9999px;top:0;';
  wrap.innerHTML = card;
  document.body.appendChild(wrap);
  html2canvas(wrap.firstChild, { scale: 2, backgroundColor: null, useCORS: true }).then(function (canvas) {
    document.body.removeChild(wrap);
    canvas.toBlob(function (blob) {
      if (navigator.share && blob) {
        var file = new File([blob], '\ub0b4\uc2e0\ud56b_' + tn + '_\uacb0\uacfc.png', { type: 'image/png' });
        navigator.share({ files: [file], title: '\ub0b4\uc2e0\ud56b ' + tn + ' \uacb0\uacfc' }).catch(function () {});
      } else {
        var a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = '\ub0b4\uc2e0\ud56b_' + tn + '_\uacb0\uacfc.png';
        a.click();
      }
      toast('\ud83d\udcf8 \uacb0\uacfc \uc774\ubbf8\uc9c0\uac00 \uc800\uc7a5\ub418\uc5c8\uc2b5\ub2c8\ub2e4!');
    });
  }).catch(function () { toast('\uc774\ubbf8\uc9c0 \uc0dd\uc131 \uc2e4\ud328'); });
}

function reviewHistory(idx) {
  var h = getHistory();
  var rec = h[idx];
  if (!rec || !rec.answers) return toast('\uc774\uc804 \ubc84\uc804 \uae30\ub85d\uc740 \ud574\uc124\uc744 \ubcfc \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.');
  S.ans = rec.answers;
  S.start = Date.now() - rec.elapsed * 1000;
  document.getElementById('inpName').value = rec.name || '';
  document.getElementById('inpSchool').value = rec.school || '';
  document.getElementById('inpGrade').value = rec.grade || '\uace01';
  var r = grade();
  renderResults(r, rec.elapsed);
  showScreen('resultScreen');
  window.scrollTo(0, 0);
}

function retake() { location.reload(); }
function goHome() { showScreen('startScreen'); updateHCount(); }

window.addEventListener('beforeunload', function (e) {
  if (S.ti) { e.preventDefault(); e.returnValue = ''; }
});

updateHCount();
</script>
