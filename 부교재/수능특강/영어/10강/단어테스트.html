<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--g:#16A34A;--gd:#14532D;--gl:#E8F5E9;--gxl:#F0FDF4;--gxxl:#F8FDF9;--bg:#F4F8F5;--text:#1A1A2E;--tm:#5A6A5E;--tl:#8A9A8E;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--o:#F59E0B;--ol:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,#F0FDF4,#E8F5E9 40%,#DCFCE7);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--g),#0D9488);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--g),#0D9488);padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f0f5f1;}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid #dde8df;border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid #d0dcd2;border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px rgba(22,163,74,.1);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;box-shadow:0 6px 20px rgba(22,163,74,.3);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid #c8d8ca;color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--g);color:var(--g);}
.history-badge{background:var(--gxl);color:var(--g);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid #dde8df;border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--g);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--g);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--g);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--o);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{max-width:820px;margin:0 auto;padding:24px 20px 100px;}
.q-card{background:var(--card);border-radius:var(--radius);margin-bottom:22px;box-shadow:var(--shadow);overflow:hidden;}
.q-header{display:flex;align-items:center;gap:10px;padding:16px 22px;background:linear-gradient(135deg,var(--gxl),var(--gl));border-bottom:1px solid #e0ece2;flex-wrap:wrap;}
.q-num{width:36px;height:36px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--gl);color:#166534;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f0f5f1;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--g);font-weight:800;}
.q-body{padding:22px;}
.q-passage{background:linear-gradient(135deg,#FAFDFB,#F5FAF6);border-left:4px solid var(--g);padding:16px 18px;margin-bottom:18px;border-radius:0 var(--rs) var(--rs) 0;font-size:13.5px;line-height:1.95;}
.q-stem{font-size:14px;font-weight:700;margin-bottom:16px;}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice-btn{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:2px solid #dde8df;border-radius:var(--rs);cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:14px;line-height:1.6;}
.choice-btn:hover{border-color:var(--g);}.choice-btn.selected{border-color:var(--g);box-shadow:0 0 0 3px rgba(22,163,74,.12);background:var(--gxxl);}
.c-num{min-width:26px;height:26px;background:#e8efe9;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}
.written-input{width:100%;padding:14px 16px;border:2px solid #d0dcd2;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);padding:10px 16px;display:flex;align-items:center;gap:5px;justify-content:center;z-index:100;overflow-x:auto;flex-wrap:wrap;}
.nav-dot{width:28px;height:28px;border-radius:50%;background:#dde8df;cursor:pointer;border:none;font-size:10px;font-weight:800;color:var(--tm);display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;}.nav-dot.answered{background:var(--g);color:#fff;}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--gxl),var(--gl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8efe9;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),var(--gl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--gxxl);border-radius:var(--rs);border:1px solid #dde8df;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8efe9;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #dde8df;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--gxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--gxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>
</head>

const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"10강","lesson":"내용 일치·불일치(실용문)","title":"Practical Text","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_suneung_10_v1"};

const P_GW=`School Bell Sound Contest\n\nWakeville High School is holding a school bell sound contest. The theme of this contest is Happy School Life.\n\nDeadline: December 12, 2025\nParticipants: Wakeville High School students of all grades\n\nApplication Details\n\u2022 Submit entries in MP3 format only.\n\u2022 Upload entries to our school website (file size limit: 1MB).\n\u2022 Include the description of the sound creation process.\n\nSelection Method\n\u2022 Three school bell sounds will be selected by student vote, based on creativity and suitability.\n\nAwards\n\u2022 The winning school bell sounds will replace our current bell sounds.\n\u2022 The winners of the contest will each get a wireless speaker.`;

const P_EX01=`Movement in the Museum: Heart Centering Yoga\n\nFind inner strength and peace in our Movement in the Museum: Heart Centering Yoga session, where we practice the ancient art of yoga surrounded by fossils.\n\nDate and Time: Tuesday, May 19th from 5:45 pm to 6:30 pm\nLocation: Chesterfield Museum of Natural History\n\nClasses\n\u2013 Two separate classes (beginner and intermediate) will be held at the same time \u2014 each led by a trained yoga instructor.\n\u2013 The beginner class will include chairs for those who need them.\n\nParticipation Fees\n\u2013 Museum Members: $5\n\u2013 Early Registration (Non-Members): $15\n\u2013 Day of Registration (Non-Members): $20\n\nGeneral Information\n\u2013 Participants must be 18 years or older and will be required to sign a participation agreement.\n\u2013 Please bring your yoga mat and water as they are not provided.\n\u2013 Register for the class online.\n\u2013 Parking in the museum is free after 5:00 pm.`;

const P_EX02=`2026 Maple Elementary After School Program for Kids\n\nKeep your kids learning, active, and engaged after school! Join our exciting 2026 Maple Elementary After School Program designed for kids aged 5\u201312.\n\n\u25cf Schedule: Monday to Thursday, 3:00 p.m. \u2013 6:00 p.m.\n\u25cf Location: Maple Elementary School, 123 Maple Lane\n\nActivities by Day:\n\u2013 Monday: Arts & Crafts\n\u2013 Tuesday: Homework Assistance\n\u2013 Wednesday: Sports & Outdoor Games\n\u2013 Thursday: Music, Dance, & Drama\n\nProgram Highlights:\n\u2013 All activities and materials are provided free of charge.\n\u2013 The program is supervised by trained, experienced staff.\n\n\u25cf Registration Deadline: April 3\n\u25cf Program Start Date: May 4\n\nHow to Register:\n\u2013 Visit mapleelemschool.com and complete the online registration form.\n(Registration cannot be completed over the phone.)`;

const P_EX03=`2026 Family Green Day\n\nCome to the 2026 Family Green Day and enjoy seasonal, environmentally-themed activities!\n\nDate: Tuesday, April 7\nTime: 9:00 AM and 1:30 PM\n*Each session lasts 2 hours and 30 minutes. Please select only one when booking.\n\nLocation: Avioly Environmental Center\n\nTickets\n\u2013 Children aged 3 and over: $25\n\u2013 Children under 3: $12\n\nActivities\n1. Making a toy animal with various kinds of leaves and pinecones\n2. Face painting with nature-themed designs such as butterflies and flowers\n\nOther Information\n\u2013 Aimed primarily at 3\u201311 year olds, this event is enjoyable for the whole family!\n\nFrequently Asked Questions\n1. Do accompanying adults need tickets?\n\u2013 No! Adults can enter free with the purchase of a child\u2019s ticket.\n2. Is there parking on site?\n\u2013 Yes, paid parking is available.`;

const P_EX04=`Gear Up for Good\n\nThe Blue Ridge YMCA is proud to announce its upcoming gently used sports equipment drive, Gear Up for Good. Let\u2019s level the playing field and help more kids play sports this year!\n\nDonate Gear: July 7 \u2013 July 21\nBring your new or gently used sports equipment to the Blue Ridge YMCA, Cedar Creek Family YMCA, or Harbor Point Family YMCA.\n\nWe Accept Equipment for:\nBaseball, Basketball, Soccer, Tennis, Swimming, Golf, Yoga, Surfing, Boxing, Bikes, Skateboards, Cheerleading\n*Note: We do not accept sports clothing or swimwear.\n\nShop the Sale: July 25 (2 PM \u2013 5 PM)\nAll donated sports equipment will be available for purchase at the Blue Ridge YMCA.\n\nVOLUNTEER!\nWe are looking for volunteers to help organize donations and prepare for the sale. Volunteers must sign up on our official website.`;

{"id":1,"type":"(A)(B)(C) 조합형","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["creativity — replace — wireless","creativity — maintain — wireless","originality — replace — portable","creativity — replace — wired","originality — maintain — wired"],"passage":"Wakeville High School is holding a school bell sound contest. The theme of this contest is Happy School Life.\n\nSelection Method\n\u2022 Three school bell sounds will be selected by student vote, based on <b>(A)</b> and suitability.\n\nAwards\n\u2022 The winning school bell sounds will <b>(B)</b> our current bell sounds.\n\u2022 The winners of the contest will each get a <b>(C)</b> speaker.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"학생 투표로 <b>창의성(creativity)</b>과 적합성에 따라 선발하며, 우승작이 현재 종소리를 <b>대체(replace)</b>하고, 우승자에게 <b>무선(wireless)</b> 스피커를 줍니다.","analysis":"✅ ① creativity — replace — wireless: 원문과 일치\n❌ ② maintain(유지)는 replace(대체)와 반대\n❌ ③ originality는 원문 creativity와 다름\n❌ ④ wired(유선)는 wireless(무선)의 반의어\n❌ ⑤ 세 단어 모두 원문과 불일치","tip":"creativity(창의성), replace(대체하다), wireless(무선의)"}},

{"id":2,"type":"(A)(B)(C) 조합형","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["seasonal — primarily — enjoyable","annual — primarily — enjoyable","seasonal — exclusively — enjoyable","seasonal — primarily — profitable","annual — exclusively — profitable"],"passage":"Come to the 2026 Family Green Day and enjoy <b>(A)</b>, environmentally-themed activities!\n\nOther Information\n\u2013 Aimed <b>(B)</b> at 3\u201311 year olds, this event is <b>(C)</b> for the whole family!","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"계절에 맞는(<b>seasonal</b>) 활동이며, <b>주로(primarily)</b> 3~11세를 대상으로 하지만, 온 가족이 <b>즐길 수 있는(enjoyable)</b> 행사입니다.","analysis":"✅ ① seasonal — primarily — enjoyable: 원문과 일치\n❌ ② annual(연례)는 seasonal(계절의)과 다름\n❌ ③ exclusively(오직)는 primarily(주로)와 다름\n❌ ④ profitable(수익성 있는)은 enjoyable(즐거운)과 다름\n❌ ⑤ 세 단어 모두 원문과 불일치","tip":"seasonal(계절의), primarily(주로), enjoyable(즐거운)"}},

{"id":3,"type":"문맥상 부적절한 어휘","diff":"쉬움","pts":4,"fmt":"mc","ans":3,"ch":["① strength","② ancient","③ separate","④ combined","⑤ trained"],"passage":"Find inner <u>① strength</u> and peace in our Movement in the Museum: Heart Centering Yoga session, where we practice the <u>② ancient</u> art of yoga surrounded by fossils.\n\nClasses\n\u2013 Two <u>③ separate</u> classes (beginner and intermediate) will be held at the same time \u2014 each led by a <u>④ combined</u> yoga instructor.\n\u2013 The beginner class will include chairs for those who need them.","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"각 수업은 <b>숙련된(trained)</b> 요가 강사가 지도합니다. combined(결합된)는 trained(숙련된)과 문맥이 맞지 않습니다.","analysis":"✅ ① strength(힘): 내면의 힘으로 적절\n✅ ② ancient(고대의): 고대 요가 기술로 적절\n✅ ③ separate(별도의): 두 개의 별도 수업으로 적절\n❌ ④ combined(결합된) → trained(숙련된): 강사를 수식하는 맥락에 부적합\n✅ ⑤ trained(숙련된): 삭제 대상이 아닌 다른 위치에서 사용","tip":"trained(숙련된) ↔ combined(결합된) — 강사의 자격을 나타내는 어휘"}},

{"id":4,"type":"문맥상 부적절한 어휘","diff":"보통","pts":5,"fmt":"mc","ans":4,"ch":["① gently","② level","③ purchase","④ organize","⑤ restrict"],"passage":"The Blue Ridge YMCA is proud to announce its upcoming <u>① gently</u> used sports equipment drive, Gear Up for Good. Let\u2019s <u>② level</u> the playing field and help more kids play sports this year!\n\nAll donated sports equipment will be available for <u>③ purchase</u> at the Blue Ridge YMCA. Community members are invited to shop the sale for affordable, quality sports gear!\n\nVOLUNTEER!\nWe are looking for volunteers to help <u>④ organize</u> donations and prepare for the sale. Volunteers must <u>⑤ restrict</u> on our official website.","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"자원봉사자는 공식 웹사이트에서 <b>등록(sign up)</b>해야 합니다. restrict(제한하다)는 sign up(등록하다)과 의미가 다릅니다.","analysis":"✅ ① gently(살짝): gently used(살짝 사용된)로 적절\n✅ ② level(평등하게 하다): level the playing field(공정한 기회)로 적절\n✅ ③ purchase(구매): 구매 가능하다는 맥락에 적절\n✅ ④ organize(정리하다): 기부품 정리로 적절\n❌ ⑤ restrict(제한하다) → sign up(등록하다): 문맥상 등록이 적절","tip":"sign up(등록하다) ↔ restrict(제한하다)"}},

{"id":5,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["weakness","tension","tranquility","excitement"],"passage":"Find inner strength and <u>peace</u> in our Movement in the Museum: Heart Centering Yoga session.","stem":"밑줄 친 peace와 의미가 가장 가까운 것은?","det":{"korean":"요가 세션에서 내면의 힘과 <b>평화(peace)</b>를 찾으세요.","analysis":"✅ tranquility(평온함): peace의 동의어\n❌ weakness(약함): 반대 의미\n❌ tension(긴장): peace와 반대\n❌ excitement(흥분): 평화와 다른 감정","tip":"peace = tranquility = serenity (평화, 평온)"}},

{"id":6,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["restrict","proclaim","conceal","withdraw"],"passage":"The Blue Ridge YMCA is proud to <u>announce</u> its upcoming gently used sports equipment drive.","stem":"밑줄 친 announce와 의미가 가장 가까운 것은?","det":{"korean":"Blue Ridge YMCA는 다가오는 중고 스포츠 장비 모으기 행사를 <b>발표(announce)</b>합니다.","analysis":"✅ proclaim(선언하다): announce의 동의어\n❌ restrict(제한하다): 발표와 무관\n❌ conceal(숨기다): announce의 반의어\n❌ withdraw(철회하다): 발표와 반대","tip":"announce = proclaim = declare (발표하다, 선언하다)"}},

{"id":7,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["reject","ignore","prohibit","incorporate"],"passage":"The description of the sound creation process should be <u>included</u> in the entry.","stem":"밑줄 친 included와 의미가 가장 가까운 것은?","det":{"korean":"소리 창작 과정에 대한 설명이 출품작에 <b>포함(included)</b>되어야 합니다.","analysis":"✅ incorporate(포함시키다): include의 동의어\n❌ reject(거부하다): include와 반대\n❌ ignore(무시하다): include와 반대\n❌ prohibit(금지하다): 다른 의미","tip":"include = incorporate = contain (포함하다)"}},

{"id":8,"type":"반의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":3,"ch":["reasonable","moderate","economical","costly"],"passage":"Community members are invited to shop the sale for <u>affordable</u>, quality sports gear!","stem":"밑줄 친 affordable와 의미가 가장 반대인 것은?","det":{"korean":"합리적인 가격의(<b>affordable</b>) 양질의 스포츠 용품을 쇼핑하도록 초대합니다.","analysis":"✅ costly(비싼): affordable의 반의어\n❌ reasonable(합리적인): affordable의 동의어\n❌ moderate(적당한): affordable과 유사\n❌ economical(경제적인): affordable의 유의어","tip":"affordable(저렴한, 부담 없는) ↔ costly(비싼), expensive(비싼)"}},

{"id":9,"type":"반의어 고르기","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["novel","current","outdated","recent"],"passage":"The winning school bell sounds will replace our <u>current</u> bell sounds.","stem":"밑줄 친 current와 의미가 가장 반대인 것은?","det":{"korean":"우승한 학교 종소리가 <b>현재의(current)</b> 종소리를 대체할 것입니다.","analysis":"✅ outdated(구식의): current의 반의어\n❌ novel(새로운): current와 다른 축의 의미\n❌ current: 동일 단어\n❌ recent(최근의): current의 유의어","tip":"current(현재의) ↔ outdated(구식의), obsolete(시대에 뒤떨어진)"}},

{"id":10,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["quality","fee","deadline","location"],"passage":"Wakeville High School is holding a school bell sound contest. The theme of this contest is Happy School Life.\n\n__________: December 12, 2025\nParticipants: Wakeville High School students of all grades","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"2025년 12월 12일은 대회의 <b>마감일(deadline)</b>입니다.","analysis":"✅ deadline(마감일): 날짜와 연결되는 적절한 단어\n❌ quality(품질): 날짜와 무관\n❌ fee(요금): 날짜와 무관\n❌ location(장소): 날짜와 무관","tip":"deadline = 마감일, 기한"}},

{"id":11,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["intermediate","beginner","advanced","expert"],"passage":"Two separate classes (__________ and intermediate) will be held at the same time \u2014 each led by a trained yoga instructor.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"초급(<b>beginner</b>)과 중급(intermediate) 두 개의 별도 수업이 동시에 진행됩니다.","analysis":"✅ beginner(초급): intermediate(중급)과 짝을 이루는 단계\n❌ intermediate(중급): 이미 뒤에 제시됨\n❌ advanced(고급): 원문과 불일치\n❌ expert(전문가): 수준 단계가 아님","tip":"beginner(초급) ↔ intermediate(중급) ↔ advanced(고급)"}},

{"id":12,"type":"빈칸 어휘 완성","diff":"어려움","pts":6,"fmt":"mc","ans":0,"ch":["supervised","entertained","funded","abandoned"],"passage":"The program is __________ by trained, experienced staff.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"프로그램은 숙련되고 경험 있는 직원에 의해 <b>감독(supervised)</b>됩니다.","analysis":"✅ supervised(감독되는): 직원이 프로그램을 관리/감독\n❌ entertained(즐겁게 한): 직원의 역할과 부적합\n❌ funded(자금 지원받는): 직원이 아닌 재정 관련\n❌ abandoned(버려진): 문맥과 완전히 반대","tip":"supervised = 감독되는, 관리되는"}},

{"id":16,"type":"영영풀이 매칭","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["participant","instructor","coordinator","volunteer"],"passage":"","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><b>\"a person who freely offers to do something without being paid\"</b>","det":{"korean":"<b>volunteer(자원봉사자)</b>: 보수 없이 자발적으로 무언가를 하겠다고 나서는 사람","analysis":"✅ volunteer(자원봉사자): 정의와 정확히 일치\n❌ participant(참가자): 반드시 무보수는 아님\n❌ instructor(강사): 전문적 역할\n❌ coordinator(코디네이터): 조직적 역할","tip":"volunteer = a person who works without pay (자원봉사자)"}},

const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};

let S={ans:[],cur:0,ti:null,left:EI.time,start:0};

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name});if(h.length>50)h.length=50;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map(x=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade}</div></div><div class="hi-right"><div class="hi-score">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div><div class="hi-level">${x.level||''}</div></div></div>`).join('');p.style.display='block';}
function getLevel(s){if(s>=95)return{name:'S+',icon:'👑',range:'95~100',msg:'완벽한 어휘력! 최상위권입니다.'};if(s>=85)return{name:'A+',icon:'🌟',range:'85~94',msg:'훌륭한 어휘력! 거의 완벽합니다.'};if(s>=75)return{name:'A',icon:'💎',range:'75~84',msg:'우수한 어휘력! 조금만 더 노력하세요.'};if(s>=65)return{name:'B+',icon:'🔥',range:'65~74',msg:'좋은 수준! 약한 유형을 보완하세요.'};if(s>=50)return{name:'B',icon:'📈',range:'50~64',msg:'기본기는 있어요! 꾸준히 복습하세요.'};if(s>=30)return{name:'C',icon:'💪',range:'30~49',msg:'더 분발해야 해요! 기본 어휘부터 복습!'};return{name:'D',icon:'📖',range:'0~29',msg:'기초부터 차근차근 시작해봅시다!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+s%60+'초';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startExam(){const nm=document.getElementById('inpName').value.trim();if(!nm){toast('이름을 입력해주세요!');return;}S={ans:Array(EI.totalQ).fill(null),cur:0,ti:null,left:EI.time,start:Date.now()};showScreen('examScreen');renderQ();renderDots();startTimer();window.scrollTo(0,0);}

function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;}); el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;}); if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:(d.q.wa||'');const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[ ${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div>${d.q.det?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean||''}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis||''}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip||''}</div>`:''}</div></div>`;}); h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;let txt=`📝 온라인단어 TEST 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 수능특강 영어 · 10강\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
