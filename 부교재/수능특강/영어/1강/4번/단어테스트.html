.slide-nav button:active{transform:scale(.95);}

.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--g);background:var(--gxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--gl);color:#166534;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f0f5f1;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--g);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:linear-gradient(135deg,#FAFDFB,#F5FAF6);border-left:3px solid var(--g);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}

.choice-btn:hover{border-color:var(--g);}.choice-btn.selected{border-color:var(--g);box-shadow:0 0 0 2px rgba(22,163,74,.12);background:var(--gxxl);}
.c-num{min-width:22px;height:22px;background:#e8efe9;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}

.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--gxl),var(--gl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8efe9;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),var(--gl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--gxxl);border-radius:var(--rs);border:1px solid #dde8df;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8efe9;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #dde8df;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--gxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--gxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

<div class="toast" id="toast"></div>

<div class="start-container">
  <div class="brand-badge">📝 온라인단어 TEST</div>

  <div class="info-card"><div class="info-card-header">📚 시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">2027학년도 EBS수능특강 영어</span></div>

  </div></div>

<script>
const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"1강","lesson":"4번","title":"Car Loan Repayment","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_suneung_01_ex4_v1"};

const PASSAGE=`Dear Mr. Johnson,<br><br>Have you "settled into" your new job by now, and do you still feel as enthusiastic about it as you did at the beginning? Of course, any job has its tiresome tasks, but all in all, from what you told us, it sounds like a good match for you. We're writing to ask when we can expect repayment of the $1,500 loan for your car. We were glad to help you with the purchase of your car so that you'd have transportation back and forth to your new job. You agreed to pay all, or at least half, of the loan by June. If you have decided that you cannot repay the total $1,500 at once, we understand. But we do need to receive at least half that amount within the next 2 or 3 weeks. We hope you are satisfied with the car you chose. We, too, thought it was a good buy. Please let us know how things are going.<br><br>Sincerely,<br>Joseph Brown<br>Financial Advisor`;

const Q=[
{"id":1,"type":"내용이해","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["complaint — lifeless — compensation","complaint — lively — compensation","compliment — lifeless — compensation","complaint — lifeless — competition","compliment — lively — competition"],"passage":"To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I ordered my wedding bouquet from you, and my husband, Nicholas, had promised me David Austin roses. However, on my wedding day, I received standard roses instead. Although I briefly considered filing a <b>(A)</b> about the mistake, I chose to focus on enjoying my special day. Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were <b>(B)</b>, spotted, and browning upon arrival. This time, I believe it's only fair to ask you to take action to resolve this matter. I am not asking for <b>(C)</b> for the flowers from a year ago, but I do expect a refund for this order.<br><br>Sincerely,<br>Cheryl","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"실수에 대해 <b>불만(complaint)</b>을 제기하는 것을 잠깐 고려했고, 꽃은 <b>생기 없는(lifeless)</b> 상태였으며, 1년 전 꽃에 대한 <b>보상(compensation)</b>을 요구하지 않는다고 합니다.","analysis":"✅ ① complaint — lifeless — compensation: 원문과 정확히 일치<br>❌ ② lively(생기 있는)는 lifeless의 반의어<br>❌ ③ compliment(칭찬)은 complaint(불만)과 다른 단어<br>❌ ④ competition(경쟁)은 compensation(보상)과 다른 단어<br>❌ ⑤ 세 단어 모두 원문과 불일치","tip":"complaint(불만) vs compliment(칭찬), lifeless(생기 없는) vs lively(생기 있는), compensation(보상) vs competition(경쟁)"}},

{"id":2,"type":"내용이해","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["ordered — standard — resolve","ordered — premium — resolve","purchased — standard — resolve","ordered — standard — ignore","purchased — premium — ignore"],"passage":"To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I <b>(A)</b> my wedding bouquet from you, and my husband, Nicholas, had promised me David Austin roses. However, on my wedding day, I received <b>(B)</b> roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on enjoying my special day. Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were lifeless, spotted, and browning upon arrival. This time, I believe it's only fair to ask you to take action to <b>(C)</b> this matter.<br><br>Sincerely,<br>Cheryl","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"1년 전 결혼 부케를 <b>주문했고(ordered)</b>, 데이비드 오스틴 장미 대신 <b>일반(standard)</b> 장미를 받았으며, 이번에는 이 문제를 <b>해결(resolve)</b>하도록 요청합니다.","analysis":"✅ ① ordered — standard — resolve: 원문과 정확히 일치<br>❌ ② premium(고급)은 standard(일반)의 반의어<br>❌ ③ purchased(구매한)는 ordered(주문한)와 유사하나 원문은 ordered<br>❌ ④ ignore(무시하다)는 resolve(해결하다)의 반의어<br>❌ ⑤ 세 단어 모두 원문과 불일치","tip":"order(주문하다), standard(일반적인, 표준의), resolve(해결하다)"}},

{"id":3,"type":"내용이해","diff":"보통","pts":5,"fmt":"mc","ans":4,"ch":["① ordered","② promised","③ standard","④ enjoying","⑤ alive"],"passage":"To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I <u>① ordered</u> my wedding bouquet from you, and my husband, Nicholas, had <u>② promised</u> me David Austin roses. However, on my wedding day, I received <u>③ standard</u> roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on <u>④ enjoying</u> my special day. Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were <u>⑤ alive</u>, spotted, and browning upon arrival. This time, I believe it's only fair to ask you to take action to resolve this matter. I am not asking for compensation for the flowers from a year ago, but I do expect a refund for this order.<br><br>Sincerely,<br>Cheryl","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"오늘 받은 꽃은 <b>생기 없고(lifeless)</b>, 반점이 있고, 갈변한 상태였습니다. alive(살아 있는)는 lifeless(생기 없는)의 반의어로, 꽃이 시든 상태를 묘사하는 문맥에 맞지 않습니다.","analysis":"✅ ① ordered(주문했다): 꽃다발을 주문한 행위로 적절<br>✅ ② promised(약속했다): 남편이 장미를 약속한 것으로 적절<br>✅ ③ standard(일반): 데이비드 오스틴 장미 대신 일반 장미를 받은 것으로 적절<br>✅ ④ enjoying(즐기는): 특별한 날을 즐기기로 한 것으로 적절<br>❌ ⑤ alive(살아 있는) → lifeless(생기 없는): 시든 꽃 묘사와 반대","tip":"lifeless(생기 없는, 시든) ↔ alive(살아 있는)"}},

{"id":4,"type":"내용이해","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["① mention","② bouquet","③ celebrate","④ praised","⑤ refund"],"passage":"To whom it may concern,<br><br>Before I get to my main point, I'd like to <u>① mention</u> a past experience with your store. A year ago, I ordered my wedding <u>② bouquet</u> from you, and my husband, Nicholas, had promised me David Austin roses. However, on my wedding day, I received standard roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on enjoying my special day. Yesterday, to <u>③ celebrate</u> our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were lifeless, <u>④ praised</u>, and browning upon arrival. This time, I believe it's only fair to ask you to take action to resolve this matter. I am not asking for compensation for the flowers from a year ago, but I do expect a <u>⑤ refund</u> for this order.<br><br>Sincerely,<br>Cheryl","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"오늘 받은 꽃은 생기 없고, <b>반점이 있는(spotted)</b> 상태였습니다. praised(칭찬받은)는 spotted(반점이 있는, 얼룩진)와 전혀 다른 의미로 문맥에 맞지 않습니다.","analysis":"✅ ① mention(언급하다): 과거 경험을 언급하겠다는 맥락에 적절<br>✅ ② bouquet(꽃다발): 결혼 꽃다발을 주문한 것으로 적절<br>✅ ③ celebrate(축하하다): 결혼 1주년을 축하하기 위해로 적절<br>❌ ④ praised(칭찬받은) → spotted(반점이 있는): 시든 꽃 묘사와 불일치<br>✅ ⑤ refund(환불): 환불을 기대한다는 맥락에 적절","tip":"spotted(반점이 있는, 얼룩진) — 꽃잎에 반점이 생긴 상태를 묘사"}},

{"id":5,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["reject","cancel","think about","forget","avoid"],"passage":"Although I briefly <u>considered</u> filing a complaint about the mistake, I chose to focus on enjoying my special day.","stem":"밑줄 친 considered와 의미가 가장 가까운 것은?","det":{"korean":"실수에 대해 불만을 제기하는 것을 잠깐 <b>고려했지만(considered)</b>, 특별한 날을 즐기기로 했습니다.","analysis":"✅ think about(~에 대해 생각하다): considered의 동의어<br>❌ reject(거절하다): 고려와 다른 의미<br>❌ cancel(취소하다): 고려와 다른 의미<br>❌ forget(잊다): 고려와 반대 의미<br>❌ avoid(피하다): 고려와 다른 의미","tip":"consider = think about = contemplate (고려하다, 숙고하다)"}},

{"id":6,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["payment","penalty","donation","reimbursement","investment"],"passage":"I am not asking for compensation for the flowers from a year ago, but I do expect a <u>refund</u> for this order.","stem":"밑줄 친 refund와 의미가 가장 가까운 것은?","det":{"korean":"1년 전 꽃에 대한 보상을 요구하지 않지만, 이번 주문에 대한 <b>환불(refund)</b>을 기대합니다.","analysis":"✅ reimbursement(상환, 변상): refund와 같은 금전 반환 의미<br>❌ payment(지불): 돈을 내는 것으로 반환과 반대 방향<br>❌ penalty(벌금): 처벌적 의미<br>❌ donation(기부): 대가 없는 제공<br>❌ investment(투자): 환불과 무관한 개념","tip":"refund = reimbursement = repayment (환불, 상환)"}},

{"id":7,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["energetic","dull","vibrant","fresh","blooming"],"passage":"However, the flowers I received today were <u>lifeless</u>, spotted, and browning upon arrival.","stem":"밑줄 친 lifeless와 의미가 가장 가까운 것은?","det":{"korean":"오늘 받은 꽃은 <b>생기 없고(lifeless)</b>, 반점이 있고, 갈변한 상태였습니다.","analysis":"✅ dull(생기 없는, 흐릿한): lifeless의 동의어<br>❌ energetic(활기찬): lifeless의 반의어<br>❌ vibrant(활기찬): lifeless의 반의어<br>❌ fresh(신선한): lifeless의 반의어<br>❌ blooming(활짝 핀): lifeless의 반의어","tip":"lifeless = dull = withered (생기 없는, 시든)"}},

{"id":8,"type":"반의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["shortly","momentarily","at length","quickly","hastily"],"passage":"Although I <u>briefly</u> considered filing a complaint about the mistake, I chose to focus on enjoying my special day.","stem":"밑줄 친 briefly와 의미가 가장 반대인 것은?","det":{"korean":"실수에 대해 불만을 제기하는 것을 <b>잠깐(briefly)</b> 고려했습니다.","analysis":"✅ at length(오랫동안, 길게): briefly의 정확한 반의어<br>❌ shortly(곧, 짧게): briefly의 유의어<br>❌ momentarily(잠깐): briefly의 동의어<br>❌ quickly(빠르게): briefly와 유사한 의미<br>❌ hastily(급하게): briefly와 유사한 의미","tip":"briefly(잠깐, 짧게) ↔ at length(오랫동안, 상세히)"}},

{"id":9,"type":"반의어 고르기","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["reward","payment","bonus","penalty","gift"],"passage":"I am not asking for <u>compensation</u> for the flowers from a year ago, but I do expect a refund for this order.","stem":"밑줄 친 compensation과 의미가 가장 반대인 것은?","det":{"korean":"1년 전 꽃에 대한 <b>보상(compensation)</b>을 요구하지 않습니다.","analysis":"✅ penalty(벌금, 처벌): compensation(보상)의 반의어 — 보상 ↔ 처벌<br>❌ reward(보상): compensation의 동의어<br>❌ payment(지불): compensation과 유사한 의미<br>❌ bonus(보너스): 추가 보상으로 유사한 의미<br>❌ gift(선물): 보상과 다르지만 반대는 아님","tip":"compensation(보상, 배상) ↔ penalty(벌금, 처벌), forfeiture(몰수)"}},

{"id":10,"type":"내용이해","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["demand","ignore","worsen","resolve","avoid"],"passage":"To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I ordered my wedding bouquet from you, and my husband, Nicholas, had promised me David Austin roses. However, on my wedding day, I received standard roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on enjoying my special day. Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were lifeless, spotted, and browning upon arrival. This time, I believe it's only fair to ask you to take action to __________ this matter.<br><br>Sincerely,<br>Cheryl","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"이번에는 이 문제를 <b>해결(resolve)</b>하기 위해 조치를 취하도록 요청합니다.","analysis":"✅ resolve(해결하다): 문제 해결을 요청하는 맥락과 일치<br>❌ demand(요구하다): 동사의 목적어가 this matter이므로 부자연스러움<br>❌ ignore(무시하다): 불만을 제기하는 상황과 모순<br>❌ worsen(악화시키다): 해결 요청과 반대<br>❌ avoid(피하다): 적극적 해결 요청과 모순","tip":"resolve = settle = sort out (해결하다)"}},

{"id":11,"type":"내용이해","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["receipt","refund","discount","delivery","replacement"],"passage":"To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I ordered my wedding bouquet from you, and my husband, Nicholas, had promised me David Austin roses. However, on my wedding day, I received standard roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on enjoying my special day. Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were lifeless, spotted, and browning upon arrival. This time, I believe it's only fair to ask you to take action to resolve this matter. I am not asking for compensation for the flowers from a year ago, but I do expect a __________ for this order. To resolve this issue, I would appreciate a full refund.<br><br>Sincerely,<br>Cheryl","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"이번 주문에 대한 <b>환불(refund)</b>을 기대합니다. 바로 뒤에 'a full refund'로 확인됩니다.","analysis":"✅ refund(환불): 불량 상품에 대해 금액 반환 요청 — 뒤이어 'a full refund'로 확인<br>❌ receipt(영수증): 이미 주문한 상태이므로 기대 대상이 아님<br>❌ discount(할인): 환불을 명시적으로 요구하는 맥락<br>❌ delivery(배달): 이미 배달받은 상태<br>❌ replacement(교체): 환불을 요구하는 맥락과 다름","tip":"refund(환불) = money paid back for unsatisfactory goods or service"}},

{"id":12,"type":"내용이해","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["bouquet","basket","vase","garden","wreath"],"passage":"To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I ordered my wedding __________ from you, and my husband, Nicholas, had promised me David Austin roses. However, on my wedding day, I received standard roses instead.<br><br>Sincerely,<br>Cheryl","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"1년 전 결혼 <b>꽃다발(bouquet)</b>을 주문했습니다.","analysis":"✅ bouquet(꽃다발): 결혼식 꽃다발(wedding bouquet)은 자연스러운 조합<br>❌ basket(바구니): 결혼식 꽃다발과 다른 형태<br>❌ vase(꽃병): 주문하는 대상으로 부자연스러움<br>❌ garden(정원): 가게에서 주문하는 대상이 아님<br>❌ wreath(화환): 결혼식보다 장례식 연상","tip":"bouquet(꽃다발) — 특히 wedding bouquet(웨딩 부케)는 결혼식 필수 아이템"}},

{"id":13,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["파일에 넣다","줄지어 가다","제기하다","갈다","기록하다"],"passage":"Although I briefly considered <u>filing</u> a complaint about the mistake, I chose to focus on enjoying my special day.","stem":"밑줄 친 filing이 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"실수에 대해 불만을 <b>제기하는(filing)</b> 것을 잠깐 고려했지만, 특별한 날을 즐기기로 했습니다.","analysis":"✅ 제기하다: file a complaint = 불만/소송을 제기하다<br>❌ 파일에 넣다: 서류 정리의 의미 (여기서는 해당 안 됨)<br>❌ 줄지어 가다: file out/in의 의미<br>❌ 갈다: file(줄)로 가는 행위<br>❌ 기록하다: 서류를 보관하는 의미","tip":"file a complaint(불만을 제기하다), file a lawsuit(소송을 제기하다) — 공식적 절차를 밟다"}},

{"id":14,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["공정한, 타당한","박람회","맑은","금발의","상당한"],"passage":"This time, I believe it's only <u>fair</u> to ask you to take action to resolve this matter.","stem":"밑줄 친 fair가 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"이번에는 이 문제를 해결하기 위해 조치를 취하도록 요청하는 것이 <b>공정한(fair)</b> 것이라고 생각합니다.","analysis":"✅ 공정한, 타당한: it's fair to ~ = ~하는 것이 공정하다/타당하다<br>❌ 박람회: a fair = 박람회, 시장 (다른 품사)<br>❌ 맑은: fair weather = 맑은 날씨<br>❌ 금발의: fair hair = 금발 머리<br>❌ 상당한: a fair amount = 상당한 양","tip":"fair(공정한) — it's only fair to ~(~하는 것이 당연하다/공정하다)"}},

{"id":15,"type":"영영풀이 매칭","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["complaint","refund","bouquet","compensation","anniversary"],"passage":"","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><b>\"something, typically money, awarded to someone in recognition of loss, suffering, or injury\"</b>","det":{"korean":"<b>compensation(보상)</b>: 손실, 고통, 부상에 대해 인정하는 의미로 수여되는 것(주로 금전)","analysis":"✅ compensation(보상): 손실/고통에 대한 금전적 보상 = 정의와 정확히 일치<br>❌ complaint(불만): 불만 사항이나 항의<br>❌ refund(환불): 구매 대금의 반환 (보상보다 좁은 의미)<br>❌ bouquet(꽃다발): 꽃을 묶은 다발<br>❌ anniversary(기념일): 특정 사건의 연간 기념일","tip":"compensation = indemnity = reparation (보상, 배상)"}},

{"id":16,"type":"영영풀이 매칭","diff":"어려움","pts":6,"fmt":"mc","ans":1,"ch":["standard","spotted","lifeless","browning","promising"],"passage":"","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><b>\"marked or decorated with spots; having small rounded patches of color\"</b>","det":{"korean":"<b>spotted(반점이 있는)</b>: 반점이나 작고 둥근 색깔 패치로 표시되거나 장식된","analysis":"✅ spotted(반점이 있는): 작고 둥근 색깔 패치가 있는 = 정의와 정확히 일치<br>❌ standard(일반적인): 표준적인, 기본적인<br>❌ lifeless(생기 없는): 활기가 없는 상태<br>❌ browning(갈변하는): 갈색으로 변하는 과정<br>❌ promising(유망한): 전도유망한","tip":"spotted = marked with spots (반점이 있는, 얼룩진)"}},

{"id":17,"type":"어형 변환 (서술형)","diff":"쉬움","pts":4,"fmt":"written","wa":"arrival","accept":["arrival","Arrival"],"ch":null,"passage":"To whom it may concern,<br><br>Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were lifeless, spotted, and browning upon __________ (arrive). This time, I believe it's only fair to ask you to take action to resolve this matter.<br><br>Sincerely,<br>Cheryl","stem":"주어진 단어를 문맥에 맞게 어형을 변환하여 빈칸에 쓰시오.","det":{"korean":"오늘 받은 꽃은 <b>도착(arrival)</b> 시 생기 없고, 반점이 있고, 갈변한 상태였습니다.","analysis":"arrive(동사: 도착하다) → arrival(명사: 도착)<br>전치사 upon 뒤에 명사가 필요: upon _____ (도착 시)","tip":"arrive(동) → arrival(명) — upon arrival(도착 시, 도착하자마자)"}},

{"id":18,"type":"어형 변환 (서술형)","diff":"보통","pts":5,"fmt":"written","wa":"compensation","accept":["compensation","Compensation"],"ch":null,"passage":"To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. This time, I believe it's only fair to ask you to take action to resolve this matter. I am not asking for __________ (compensate) for the flowers from a year ago, but I do expect a refund for this order.<br><br>Sincerely,<br>Cheryl","stem":"주어진 단어를 문맥에 맞게 어형을 변환하여 빈칸에 쓰시오.","det":{"korean":"1년 전 꽃에 대한 <b>보상(compensation)</b>을 요구하지 않습니다.","analysis":"compensate(동사: 보상하다) → compensation(명사: 보상)<br>전치사 for 앞에 명사가 필요: asking for _____ (보상을 요구하다)","tip":"compensate(동) → compensation(명) — ask for compensation(보상을 요구하다)"}},

{"id":19,"type":"내용이해","diff":"어려움","pts":6,"fmt":"mc","ans":1,"ch":["praise","anniversary","vacation","birthday","graduation"],"passage":"To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I ordered my wedding bouquet from you, and my husband, Nicholas, had promised me David Austin roses. However, on my wedding day, I received standard roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on enjoying my special day. Yesterday, to celebrate our one-year wedding __________, my husband ordered David Austin roses from your store again.<br><br>Sincerely,<br>Cheryl","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"결혼 1주년 <b>기념일(anniversary)</b>을 축하하기 위해 남편이 다시 주문했습니다.","analysis":"✅ anniversary(기념일): 결혼 1주년(one-year wedding anniversary)에 정확히 일치<br>❌ praise(칭찬): 축하 대상이 아님<br>❌ vacation(휴가): 결혼 1주년과 무관<br>❌ birthday(생일): 결혼 기념일과 다른 기념일<br>❌ graduation(졸업): 결혼과 무관","tip":"anniversary(기념일) — wedding anniversary(결혼 기념일)"}},

{"id":20,"type":"내용이해","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["praise","delivery","exchange","action","apology"],"passage":"To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I ordered my wedding bouquet from you, and my husband, Nicholas, had promised me David Austin roses. However, on my wedding day, I received standard roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on enjoying my special day. Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were lifeless, spotted, and browning upon arrival. This time, I believe it's only fair to ask you to take __________ to resolve this matter.<br><br>Sincerely,<br>Cheryl","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"이번에는 이 문제를 해결하기 위해 <b>조치(action)</b>를 취하도록 요청합니다.","analysis":"✅ action(조치): take action to resolve = 해결을 위해 조치를 취하다<br>❌ praise(칭찬): 불만 상황과 어울리지 않음<br>❌ delivery(배달): 이미 배달받은 상태<br>❌ exchange(교환): take exchange는 관용적 표현이 아님<br>❌ apology(사과): take apology는 자연스럽지 않음","tip":"take action(조치를 취하다) — 문제 해결을 위한 행동을 취하다"}}
];
