<script>
const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"1강","lesson":"4번","title":"Car Loan Repayment","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_suneung_01_ex4_v1"};











const PASSAGE=`Dear Mr. Johnson,<br><br>Have you "settled into" your new job by now, and do you still feel as enthusiastic about it as you did at the beginning? Of course, any job has its tiresome tasks, but all in all, from what you told us, it sounds like a good match for you. We're writing to ask when we can expect repayment of the $1,500 loan for your car. We were glad to help you with the purchase of your car so that you'd have transportation back and forth to your new job. You agreed to pay all, or at least half, of the loan by June. If you have decided that you cannot repay the total $1,500 at once, we understand. But we do need to receive at least half that amount within the next 2 or 3 weeks. We hope you are satisfied with the car you chose. We, too, thought it was a good buy. Please let us know how things are going.<br><br>Sincerely,<br>Joseph Brown<br>Financial Advisor`;

{"id":2,"type":"어법","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["creating","created","creates","create"],"passage":"Dear Parents,<br><br>At Greenwood High School, we take great pride in the cultural diversity that enriches our community. We are very pleased to share with you our special new project, a recipe book, __________ to celebrate the traditions and flavors of families from around the world. This unique collection features 100 recipes from 26 countries, highlighting beloved dishes passed down through generations. It offers a special chance to explore global cuisine and share meaningful moments with your children. We encourage you to try some of these recipes together over the summer. You can download this online recipe book from our school website. Food brings us together, and this project reflects the joy and unity that diversity brings to our school. Thank you, as always, for your continued support.<br><br>Warm regards,<br>Dr. Helen Brooks<br>Principal, Greenwood High School","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"recipe book이 만들어진 것(수동)이므로 과거분사 created가 적절. 분사구문의 수동형.","analysis":"✅ ②created: 과거분사(수동) → recipe book이 만들어진 것<br>❌ ①creating: 능동<br>❌ ③creates: 동사형<br>❌ ④create: 원형","tip":"명사 + p.p. → 수동 관계의 분사 수식 (a book created to... = a book which was created to...)"}},
{"id":3,"type":"어법","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["approach","approached","approaching","to approach"],"passage":"Dear Professor Langford,<br><br>First of all, we apologize for contacting you during the holiday season. We understand that this is a busy time, but as the revision deadline of your manuscript (December 27th) is quickly __________, we kindly ask for your cooperation in addressing the reviewers' comments as thoroughly as possible within the limited time available. The reviewers have carefully evaluated your manuscript and provided insightful and critical feedback. To help you revise, we have summarized the key points raised by both reviewers. Please review these comments carefully and submit a revised version of your manuscript. We are confident that incorporating these suggestions will significantly improve the manuscript and provide stronger support for your main claims. We hope that the revised manuscript will satisfy the reviewers and be accepted in our journal. Thank you for your attention and cooperation.<br><br>Best regards,<br>Nora Ellison, Associate Editor","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"is + ~ing = 현재진행형. 마감일이 빠르게 다가오고 있다.","analysis":"✅ ③approaching: is + 현재분사 = 진행형<br>❌ ①approach: 원형<br>❌ ②approached: 과거형/과거분사<br>❌ ④to approach: 부정사","tip":"be + ~ing = 현재진행형 (is approaching = 다가오고 있다)"}},

{"id":5,"type":"어법","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["highlighted","highlighting","to highlight","which highlighting"],"passage":"Dear Parents,<br><br>At Greenwood High School, we take great pride in the cultural diversity that enriches our community. We are very pleased to share with you our special new project, a recipe book, created to celebrate the traditions and flavors of families from around the world. This unique collection features 100 recipes from 26 countries, __________ beloved dishes passed down through generations. It offers a special chance to explore global cuisine and share meaningful moments with your children. We encourage you to try some of these recipes together over the summer. You can download this online recipe book from our school website. Food brings us together, and this project reflects the joy and unity that diversity brings to our school. Thank you, as always, for your continued support.<br><br>Warm regards,<br>Dr. Helen Brooks<br>Principal, Greenwood High School","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"주절과 동시에 일어나는 부대상황을 나타내는 분사구문. 능동이므로 현재분사 highlighting.","analysis":"✅ ②highlighting: 분사구문(능동/동시동작)<br>❌ ①highlighted: 과거분사(수동)<br>❌ ③to highlight: 목적<br>❌ ④which highlighting: 관계절 문법 오류(which highlights)","tip":"콤마 + ~ing → 분사구문(동시동작 또는 부대상황)"}},

{"id":8,"type":"내용불일치","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["편집자가 휴일에 연락한 것에 대해 사과하였다.","원고 수정 마감일은 12월 27일이다.","리뷰어들이 통찰력 있고 비판적인 피드백을 제공했다.","편집자는 리뷰어의 제안을 반영하면 원고가 약간 개선될 것이라고 보았다.","편집자는 수정된 원고가 저널에 수락되기를 바랐다."],"passage":P_EX02,"stem":"다음 중 글의 내용과 <b>일치하지 않는</b> 것은?","det":{"korean":"④ 편집자는 'significantly improve'(상당히 개선)라고 했지, '약간 개선'이 아님. 원문과 불일치.","analysis":"❌ ④ significantly improve(상당히 개선) ≠ 약간 개선 → 불일치<br>✅ ① apologize for contacting during holiday season → 일치<br>✅ ② December 27th → 일치<br>✅ ③ insightful and critical feedback → 일치<br>✅ ⑤ be accepted in our journal → 일치","tip":"significantly(상당히, 크게) vs 약간: 정도 부사에 주의하여 내용 일치 여부 판단"}},
{"id":9,"type":"빈칸추론","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["complaint","proposal","certificate","receipt"],"passage":"Dear students,<br><br>I am Amanda Clark, the school club director, and I am writing to you about our school clubs. Over the last few semesters, there have been requests for more diverse school clubs. For this reason, the school decided to expand the number of clubs for extracurricular activities. This provides students with an opportunity to make additional clubs. Students can make any type of club based on their various interests, such as hip-hop, K-pop dancing, or coding. Therefore, I am encouraging you to submit a __________ for a new club that you would like to create. Please turn this in to my office by the end of this week. I look forward to seeing your great ideas.<br><br>Best regards,<br>Amanda Clark","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"새로운 동아리에 대한 제안서(proposal)를 제출하라고 독려.","analysis":"✅ ②proposal(제안서): 새 동아리 개설을 위한 것<br>❌ ①complaint(불만)<br>❌ ③certificate(증명서)<br>❌ ④receipt(영수증)","tip":"proposal = 제안서, 기획안 (submit a proposal = 제안서를 제출하다)"}},
{"id":10,"type":"내용이해","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["rejecting","ignoring","incorporating","overlooking"],"passage":"Dear Professor Langford,<br><br>First of all, we apologize for contacting you during the holiday season. We understand that this is a busy time, but as the revision deadline of your manuscript (December 27th) is quickly approaching, we kindly ask for your cooperation in addressing the reviewers' comments as thoroughly as possible within the limited time available. The reviewers have carefully evaluated your manuscript and provided insightful and critical feedback. To help you revise, we have summarized the key points raised by both reviewers. Please review these comments carefully and submit a revised version of your manuscript. We are confident that __________ these suggestions will significantly improve the manuscript and provide stronger support for your main claims. We hope that the revised manuscript will satisfy the reviewers and be accepted in our journal. Thank you for your attention and cooperation.<br><br>Best regards,<br>Nora Ellison, Associate Editor","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"이 제안들을 반영(incorporating)하면 원고가 크게 개선될 것이라 확신한다.","analysis":"✅ ③incorporating(반영하다): improve와 논리적 연결<br>❌ ①rejecting(거부)<br>❌ ②ignoring(무시)<br>❌ ④overlooking(간과)","tip":"incorporate = 반영하다, 통합하다 (incorporate suggestions = 제안을 반영하다)"}},
{"id":11,"type":"내용이해","diff":"어려움","pts":6,"fmt":"mc","ans":1,"ch":["recommendation","compensation","celebration","reservation"],"passage":"To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I ordered my wedding bouquet from you, and my husband, Nicholas, had promised me David Austin roses. However, on my wedding day, I received standard roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on enjoying my special day. Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were lifeless, spotted, and browning upon arrival. This time, I believe it's only fair to ask you to take action to resolve this matter. I am not asking for __________ for the flowers from a year ago, but I do expect a refund for this order. To resolve this issue, I would appreciate a full refund. I look forward to your response.<br><br>Sincerely,<br>Cheryl","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"1년 전 꽃에 대한 보상(compensation)을 요구하는 것이 아니라, 이번 주문의 환불을 기대한다.","analysis":"✅ ②compensation(보상): 과거 실수에 대한 금전적 보상<br>❌ ①recommendation(추천)<br>❌ ③celebration(축하)<br>❌ ④reservation(예약)","tip":"compensation = 보상, 배상 (ask for compensation = 보상을 요구하다)"}},
{"id":12,"type":"서술형","diff":"쉬움","pts":4,"fmt":"written","wa":"diversity","accept":["diversity","Diversity"],"passage":"Dear Parents,<br><br>At Greenwood High School, we take great pride in the cultural __________ (diverse) that enriches our community. We are very pleased to share with you our special new project, a recipe book, created to celebrate the traditions and flavors of families from around the world. This unique collection features 100 recipes from 26 countries, highlighting beloved dishes passed down through generations. It offers a special chance to explore global cuisine and share meaningful moments with your children. We encourage you to try some of these recipes together over the summer. You can download this online recipe book from our school website. Food brings us together, and this project reflects the joy and unity that diversity brings to our school. Thank you, as always, for your continued support.<br><br>Warm regards,<br>Dr. Helen Brooks<br>Principal, Greenwood High School","stem":"다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.","det":{"korean":"diverse(형용사) → diversity(명사): 관사 the + cultural + 명사 자리","analysis":"diverse → diversity: 형용사 → 명사 변환<br>'the cultural diversity' = 문화적 다양성 (관사+형용사+명사 구조)","tip":"diverse(형용사) → diversity(명사): -se → -sity 명사화"}},
