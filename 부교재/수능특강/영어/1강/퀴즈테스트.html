<style>
:root{--o:#E8772E;--od:#B85A1A;--ol:#F5A623;--oxl:#FFF3E8;--oxxl:#FFFAF5;--bg:#F6F2EE;--text:#1A1A2E;--tm:#7A6A5E;--tl:#A89A8E;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--warn:#F59E0B;--wl:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}

.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{max-width:820px;margin:0 auto;padding:24px 20px 100px;}

.tag-tf{background:#FFF8E1;color:#F57F17;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#F0E8DF;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--o);font-weight:800;}

.choices{display:flex;flex-direction:column;gap:8px;}
.choice-btn{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:2px solid #E0D8CF;border-radius:var(--rs);cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:clamp(13px,3vw,15px);line-height:1.6;}

.c-num{min-width:26px;height:26px;background:#F0E8DF;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;}
.written-input{width:100%;padding:14px 16px;border:2px solid #E0D8CF;border-radius:var(--rs);font-size:15px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--o);}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);padding:10px 16px;display:flex;align-items:center;gap:5px;justify-content:center;z-index:100;overflow-x:auto;flex-wrap:wrap;}
.nav-dot{width:28px;height:28px;border-radius:50%;background:#F0E8DF;cursor:pointer;border:none;font-size:10px;font-weight:800;color:var(--tm);display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;}.nav-dot.answered{background:var(--o);color:#fff;}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,#FFF3E8,#FFE8D5);}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--o),#D97706);color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--od),var(--o));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#F0E8DF;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--o),var(--ol));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--oxxl);border-radius:var(--rs);border:1px solid #E0D8CF;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--oxl);}.info-cell.highlight .ic-value{color:var(--o);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#F0E8DF;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--oxl);color:var(--o);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--oxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #E0D8CF;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--o);color:var(--o);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #E0D8CF;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--oxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--oxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--oxl);color:var(--o);}.expl-tag.tip{background:var(--oxxl);color:var(--od);}
.expl-box{font-size:13.5px;line-height:1.85;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--o);}.expl-box.tip-b{border-left:3px solid var(--ol);background:var(--oxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>

const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"01강","lesson":"글의 목적 파악","title":"Purpose of Writing","total":100,"time":1200,"totalQ":20,"histKey":"quizTest_suneung_01_v1"};

const P_GW=`Dear students,<br><br>I am Amanda Clark, the school club director, and I am writing to you about our school clubs. Over the last few semesters, there have been requests for more diverse school clubs. For this reason, the school decided to expand the number of clubs for extracurricular activities. This provides students with an opportunity to make additional clubs. Students can make any type of club based on their various interests, such as hip-hop, K-pop dancing, or coding. Therefore, I am encouraging you to submit a proposal for a new club that you would like to create. Please turn this in to my office by the end of this week. I look forward to seeing your great ideas.<br><br>Best regards,<br>Amanda Clark`;

const P_EX01=`Dear Parents,<br><br>At Greenwood High School, we take great pride in the cultural diversity that enriches our community. We are very pleased to share with you our special new project, a recipe book, created to celebrate the traditions and flavors of families from around the world. This unique collection features 100 recipes from 26 countries, highlighting beloved dishes passed down through generations. It offers a special chance to explore global cuisine and share meaningful moments with your children. We encourage you to try some of these recipes together over the summer. You can download this online recipe book from our school website. Food brings us together, and this project reflects the joy and unity that diversity brings to our school. Thank you, as always, for your continued support.<br><br>Warm regards,<br>Dr. Helen Brooks<br>Principal, Greenwood High School`;

const P_EX02=`Dear Professor Langford,<br><br>First of all, we apologize for contacting you during the holiday season. We understand that this is a busy time, but as the revision deadline of your manuscript (December 27th) is quickly approaching, we kindly ask for your cooperation in addressing the reviewers' comments as thoroughly as possible within the limited time available. The reviewers have carefully evaluated your manuscript and provided insightful and critical feedback. To help you revise, we have summarized the key points raised by both reviewers. Please review these comments carefully and submit a revised version of your manuscript. We are confident that incorporating these suggestions will significantly improve the manuscript and provide stronger support for your main claims. We hope that the revised manuscript will satisfy the reviewers and be accepted in our journal. Thank you for your attention and cooperation.<br><br>Best regards,<br>Nora Ellison, Associate Editor`;

const P_EX03=`To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I ordered my wedding bouquet from you, and my husband, Nicholas, had promised me David Austin roses. However, on my wedding day, I received standard roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on enjoying my special day. Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were lifeless, spotted, and browning upon arrival. This time, I believe it's only fair to ask you to take action to resolve this matter. I am not asking for compensation for the flowers from a year ago, but I do expect a refund for this order. To resolve this issue, I would appreciate a full refund. I look forward to your response.<br><br>Sincerely,<br>Cheryl`;

const P_EX04=`Dear Mr. Johnson,<br><br>Have you "settled into" your new job by now, and do you still feel as enthusiastic about it as you did at the beginning? Of course, any job has its tiresome tasks, but all in all, from what you told us, it sounds like a good match for you. We're writing to ask when we can expect repayment of the $1,500 loan for your car. We were glad to help you with the purchase of your car so that you'd have transportation back and forth to your new job. You agreed to pay all, or at least half, of the loan by June. If you have decided that you cannot repay the total $1,500 at once, we understand. But we do need to receive at least half that amount within the next 2 or 3 weeks. We hope you are satisfied with the car you chose. We, too, thought it was a good buy. Please let us know how things are going.<br><br>Sincerely,<br>Joseph Brown<br>Financial Advisor`;

const typeTag={'문장삽입':'tag-insert','어순배열':'tag-order','어법':'tag-grammar','어휘':'tag-vocab','빈칸추론':'tag-blank','서술형':'tag-written','내용이해':'tag-content','T/F':'tag-tf'};

const Q=[
{id:1,type:'문장삽입',diff:'어려움',pts:6,fmt:'mc',ans:2,
ch:['①','②','③','④'],
passage:`Dear Parents,<br><br>At Greenwood High School, we take great pride in the cultural diversity that enriches our community. <b>①</b> We are very pleased to share with you our special new project, a recipe book, created to celebrate the traditions and flavors of families from around the world. <b>②</b> This unique collection features 100 recipes from 26 countries, highlighting beloved dishes passed down through generations. <b>③</b> We encourage you to try some of these recipes together over the summer. <b>④</b> You can download this online recipe book from our school website. Food brings us together, and this project reflects the joy and unity that diversity brings to our school. Thank you, as always, for your continued support.<br><br>Warm regards,<br>Dr. Helen Brooks<br>Principal, Greenwood High School`,
stem:`다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class="q-given-sentence">It offers a special chance to explore global cuisine and share meaningful moments with your children.</div>`,
det:{korean:`요리책의 특징(100 recipes from 26 countries)을 설명한 직후, 그것이 제공하는 특별한 기회를 설명하는 것이 자연스럽다.`,analysis:`✅③: "This unique collection features..."와 "It offers a special chance..."의 It이 collection을 가리킴<br>❌①: 아직 프로젝트 소개 전<br>❌②: recipe book 설명 중간<br>❌④: 다운로드 안내 뒤`,tip:`대명사 It이 가리키는 대상(collection)을 찾아 바로 뒤에 삽입`}},

{id:2,type:'문장삽입',diff:'어려움',pts:6,fmt:'mc',ans:2,
ch:['①','②','③','④'],
passage:`To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I ordered my wedding bouquet from you, and my husband, Nicholas, had promised me David Austin roses. <b>①</b> However, on my wedding day, I received standard roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on enjoying my special day. <b>②</b> Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were lifeless, spotted, and browning upon arrival. <b>③</b> I am not asking for compensation for the flowers from a year ago, but I do expect a refund for this order. <b>④</b> To resolve this issue, I would appreciate a full refund. I look forward to your response.<br><br>Sincerely,<br>Cheryl`,
stem:`다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class="q-given-sentence">This time, I believe it's only fair to ask you to take action to resolve this matter.</div>`,
det:{korean:`두 번째 불량 꽃을 받은 후("lifeless, spotted, and browning"), "이번에는 조치를 취해달라고 요청하는 것이 공정하다"는 문장이 와야 자연스러움. "This time"이 두 번째 경험을 가리킴.`,analysis:`✅③: 두 번째 불량 경험 직후 → "This time" 자연스러움<br>❌①: 아직 첫 번째 경험 설명 중<br>❌②: 첫 번째 경험 마무리 직후<br>❌④: 이미 환불 요청 진행 중`,tip:`"This time"은 두 번째 사건을 가리키므로, 두 번째 문제 서술 직후에 위치`}},

{id:3,type:'어순배열',diff:'어려움',pts:6,fmt:'written',wa:'incorporating these suggestions will significantly improve the manuscript',
accept:['incorporating these suggestions will significantly improve the manuscript'],
passage:`Dear Professor Langford,<br><br>First of all, we apologize for contacting you during the holiday season. We understand that this is a busy time, but as the revision deadline of your manuscript (December 27th) is quickly approaching, we kindly ask for your cooperation in addressing the reviewers' comments as thoroughly as possible within the limited time available. The reviewers have carefully evaluated your manuscript and provided insightful and critical feedback. To help you revise, we have summarized the key points raised by both reviewers. Please review these comments carefully and submit a revised version of your manuscript. We are confident that __________ and provide stronger support for your main claims. We hope that the revised manuscript will satisfy the reviewers and be accepted in our journal. Thank you for your attention and cooperation.<br><br>Best regards,<br>Nora Ellison, Associate Editor`,
stem:`주어진 단어를 올바른 순서로 배열하시오.<div class="q-given-sentence">will / these / improve / incorporating / significantly / suggestions / the manuscript</div>`,
det:{korean:`동명사 주어(incorporating these suggestions) + will significantly improve + the manuscript`,analysis:`incorporating these suggestions(동명사구 주어) + will(조동사) + significantly(부사) + improve(동사) + the manuscript(목적어)`,tip:`동명사구 주어 + 조동사 will + 부사 significantly + 동사 improve + 목적어`}},

{id:4,type:'어순배열',diff:'보통',pts:5,fmt:'written',wa:'have transportation back and forth to your new job',
accept:['have transportation back and forth to your new job'],
passage:`Dear Mr. Johnson,<br><br>Have you "settled into" your new job by now, and do you still feel as enthusiastic about it as you did at the beginning? Of course, any job has its tiresome tasks, but all in all, from what you told us, it sounds like a good match for you. We're writing to ask when we can expect repayment of the $1,500 loan for your car. We were glad to help you with the purchase of your car so that you'd __________. You agreed to pay all, or at least half, of the loan by June. If you have decided that you cannot repay the total $1,500 at once, we understand. But we do need to receive at least half that amount within the next 2 or 3 weeks. We hope you are satisfied with the car you chose. We, too, thought it was a good buy. Please let us know how things are going.<br><br>Sincerely,<br>Joseph Brown<br>Financial Advisor`,
stem:`주어진 단어를 올바른 순서로 배열하시오.<div class="q-given-sentence">to / and / back / new job / your / have / forth / transportation</div>`,
det:{korean:`so that + 주어 + 조동사 + 동사: "출퇴근 교통수단을 갖도록"이라는 목적절 완성`,analysis:`have(동사) + transportation(목적어) + back and forth(부사구) + to your new job(전치사구)`,tip:`back and forth = 왕복으로 / so that절의 목적 파악 후 어순 배열`}},

{id:5,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`Dear students,<br><br>①<u>I am</u> Amanda Clark, the school club director, and I am writing to you about our school clubs. Over the last few semesters, there ②<u>have been</u> requests for more diverse school clubs. For this reason, the school decided to expand the number of clubs for extracurricular activities. This provides students with an opportunity ③<u>to make</u> additional clubs. Students can make any type of club based on their various interests, such as hip-hop, K-pop dancing, or coding. Therefore, I am encouraging you to submit a proposal for a new club ④<u>that</u> you would like to create. Please turn this in to my office by the end of this week. I look forward to ⑤<u>see</u> your great ideas.<br><br>Best regards,<br>Amanda Clark`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`look forward to에서 to는 전치사이므로 동명사 seeing이 와야 한다.`,analysis:`❌⑤see: look forward to + 동명사(seeing)<br>✅①I am: 주격 보어<br>✅②have been: 현재완료<br>✅③to make: opportunity + to V<br>✅④that: 관계대명사 목적격`,tip:`look forward to + ~ing (to는 전치사)`}},

{id:6,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`Dear Mr. Johnson,<br><br>①<u>Have</u> you "settled into" your new job by now, and do you still feel as ②<u>enthusiastic</u> about it as you did at the beginning? Of course, any job has its ③<u>tiresome</u> tasks, but all in all, from what you told us, it sounds like a good match for you. We're writing to ask when we can expect repayment of the $1,500 loan for your car. We were glad ④<u>to help</u> you with the purchase of your car so that you'd have transportation back and forth to your new job. You agreed ⑤<u>paying</u> all, or at least half, of the loan by June. If you have decided that you cannot repay the total $1,500 at once, we understand. But we do need to receive at least half that amount within the next 2 or 3 weeks. We hope you are satisfied with the car you chose. We, too, thought it was a good buy. Please let us know how things are going.<br><br>Sincerely,<br>Joseph Brown<br>Financial Advisor`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`agree는 to부정사를 목적어로 취하는 동사이므로 to pay가 와야 한다.`,analysis:`❌⑤paying: agree + to V (to pay)<br>✅①Have: 현재완료 의문문<br>✅②enthusiastic: 형용사 보어<br>✅③tiresome: 형용사<br>✅④to help: be glad + to V`,tip:`agree + to V (to부정사를 목적어로 취하는 동사)`}},

{id:7,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['①','②','③','④','⑤'],
passage:`Dear Parents,<br><br>At Greenwood High School, we take great pride in the cultural diversity that ①<u>enriches</u> our community. We are very pleased to share with you our special new project, a recipe book, ②<u>created</u> to celebrate the traditions and flavors of families from around the world. This unique collection features 100 recipes from 26 countries, ③<u>highlighting</u> beloved dishes ④<u>passing</u> down through generations. It offers a special chance to explore global cuisine and share meaningful moments with your ⑤<u>children</u>. We encourage you to try some of these recipes together over the summer. You can download this online recipe book from our school website. Food brings us together, and this project reflects the joy and unity that diversity brings to our school. Thank you, as always, for your continued support.<br><br>Warm regards,<br>Dr. Helen Brooks<br>Principal, Greenwood High School`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`dishes는 전해지는 대상(수동)이므로 현재분사 passing이 아닌 과거분사 passed가 와야 한다.`,analysis:`❌④passing: dishes passed down(전해진 요리) → 수동 의미이므로 과거분사 passed<br>✅①enriches: 주격 관계대명사 that의 동사<br>✅②created: 수동 분사구문<br>✅③highlighting: 능동 분사구문<br>✅⑤children: 명사`,tip:`pass down(전하다) → dishes passed down(수동) ≠ passing down(능동)`}},

{id:8,type:'어휘',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['①','②','③','④','⑤'],
passage:`Dear Parents,<br><br>At Greenwood High School, we take great ①<u>pride</u> in the cultural diversity that ②<u>enriches</u> our community. We are very pleased to share with you our special new project, a recipe book, created to ③<u>celebrate</u> the traditions and flavors of families from around the world. This ④<u>ordinary</u> collection features 100 recipes from 26 countries, highlighting beloved dishes passed down through generations. It offers a special chance to explore global cuisine and share ⑤<u>meaningful</u> moments with your children. We encourage you to try some of these recipes together over the summer. You can download this online recipe book from our school website. Food brings us together, and this project reflects the joy and unity that diversity brings to our school. Thank you, as always, for your continued support.<br><br>Warm regards,<br>Dr. Helen Brooks<br>Principal, Greenwood High School`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`이 요리책은 26개국 100가지 요리를 담은 특별한(unique) 것이지, 평범한(ordinary) 것이 아니다.`,analysis:`❌④ordinary(평범한): 원문은 unique(독특한) → 26개국 100가지 요리 컬렉션을 설명하기에 ordinary는 부적절<br>✅①pride ✅②enriches ✅③celebrate ✅⑤meaningful`,tip:`unique(독특한) ↔ ordinary(평범한)`}},

{id:9,type:'어휘',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['①','②','③','④','⑤'],
passage:`Dear Professor Langford,<br><br>First of all, we ①<u>apologize</u> for contacting you during the holiday season. We understand that this is a busy time, but as the revision deadline of your manuscript (December 27th) is quickly ②<u>approaching</u>, we kindly ask for your ③<u>cooperation</u> in addressing the reviewers' comments as thoroughly as possible within the limited time available. The reviewers have carefully evaluated your manuscript and provided ④<u>superficial</u> and critical feedback. To help you revise, we have summarized the key points raised by both reviewers. Please review these comments carefully and submit a revised version of your manuscript. We are confident that incorporating these suggestions will significantly ⑤<u>improve</u> the manuscript and provide stronger support for your main claims. We hope that the revised manuscript will satisfy the reviewers and be accepted in our journal. Thank you for your attention and cooperation.<br><br>Best regards,<br>Nora Ellison, Associate Editor`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`리뷰어들이 통찰력 있는(insightful) 피드백을 제공했다. superficial(피상적인)은 반대 의미.`,analysis:`❌④superficial(피상적인): 원문은 insightful(통찰력 있는). 리뷰어들이 신중히 평가했으므로 superficial은 부적절<br>✅①apologize ✅②approaching ✅③cooperation ✅⑤improve`,tip:`insightful(통찰력 있는) ↔ superficial(피상적인)`}},

{id:10,type:'빈칸추론',diff:'어려움',pts:6,fmt:'mc',ans:3,
ch:['receipt','discount','apology','refund','replacement'],
passage:`To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I ordered my wedding bouquet from you, and my husband, Nicholas, had promised me David Austin roses. However, on my wedding day, I received standard roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on enjoying my special day. Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were lifeless, spotted, and browning upon arrival. This time, I believe it's only fair to ask you to take action to resolve this matter. I am not asking for compensation for the flowers from a year ago, but I do expect a __________ for this order. To resolve this issue, I would appreciate a full __________. I look forward to your response.<br><br>Sincerely,<br>Cheryl`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`불량 꽃을 두 번이나 받았고, "take action to resolve this matter"라고 했으므로 금전적 해결책인 환불(refund)을 기대하는 것이 자연스럽다.`,analysis:`✅④refund(환불): 불량 상품에 대한 금전적 해결 요구<br>❌①receipt(영수증): 문제 해결과 무관<br>❌②discount(할인): 이미 받은 불량품에 할인은 부적절<br>❌③apology(사과): compensation과 대비되는 금전적 표현이 필요<br>❌⑤replacement(교환): 가능하나 compensation과의 대비상 refund가 적절`,tip:`refund = 환불, 반환금 / compensation(보상)과 대비되는 구체적 금전 해결 표현`}},

{id:11,type:'빈칸추론',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['extension','cancellation','forgiveness','approval','repayment'],
passage:`Dear Mr. Johnson,<br><br>Have you "settled into" your new job by now, and do you still feel as enthusiastic about it as you did at the beginning? Of course, any job has its tiresome tasks, but all in all, from what you told us, it sounds like a good match for you. We're writing to ask when we can expect __________ of the $1,500 loan for your car. We were glad to help you with the purchase of your car so that you'd have transportation back and forth to your new job. You agreed to pay all, or at least half, of the loan by June. If you have decided that you cannot repay the total $1,500 at once, we understand. But we do need to receive at least half that amount within the next 2 or 3 weeks. We hope you are satisfied with the car you chose. We, too, thought it was a good buy. Please let us know how things are going.<br><br>Sincerely,<br>Joseph Brown<br>Financial Advisor`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`$1,500 대출금의 상환(repayment)을 언제 받을 수 있는지 묻고 있다.`,analysis:`✅⑤repayment: 대출금 상환 요청<br>❌①extension: 연장<br>❌②cancellation: 취소<br>❌③forgiveness: 면제<br>❌④approval: 승인`,tip:`repayment = 상환 / loan(대출) + repayment(상환) 자주 함께 출제`}},

{id:12,type:'빈칸추론',diff:'쉬움',pts:4,fmt:'mc',ans:2,
ch:['restrictions','conflicts','interests','expenses','complaints'],
passage:`Dear students,<br><br>I am Amanda Clark, the school club director, and I am writing to you about our school clubs. Over the last few semesters, there have been requests for more diverse school clubs. For this reason, the school decided to expand the number of clubs for extracurricular activities. This provides students with an opportunity to make additional clubs. Students can make any type of club based on their various __________, such as hip-hop, K-pop dancing, or coding. Therefore, I am encouraging you to submit a proposal for a new club that you would like to create. Please turn this in to my office by the end of this week. I look forward to seeing your great ideas.<br><br>Best regards,<br>Amanda Clark`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`hip-hop, K-pop dancing, coding 등은 학생들의 다양한 관심사(interests)의 예시이다.`,analysis:`✅③interests(관심사): such as 이하 예시가 관심사 목록<br>❌①restrictions(제한): 맥락과 반대<br>❌②conflicts(갈등): 무관<br>❌④expenses(비용): 무관<br>❌⑤complaints(불만): 무관`,tip:`such as + 예시 → 빈칸은 예시를 포괄하는 상위 개념`}},

{id:13,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'to make',
accept:['to make','To make'],
passage:`Dear students,<br><br>I am Amanda Clark, the school club director, and I am writing to you about our school clubs. Over the last few semesters, there have been requests for more diverse school clubs. For this reason, the school decided to expand the number of clubs for extracurricular activities. This provides students with an opportunity __________ (make) additional clubs. Students can make any type of club based on their various interests, such as hip-hop, K-pop dancing, or coding. Therefore, I am encouraging you to submit a proposal for a new club that you would like to create. Please turn this in to my office by the end of this week. I look forward to seeing your great ideas.<br><br>Best regards,<br>Amanda Clark`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`opportunity + to V(to부정사): ~할 기회`,analysis:`opportunity(기회) 뒤에 to부정사(형용사적 용법) → to make`,tip:`opportunity/chance + to부정사 (형용사적 용법)`}},

{id:14,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'passed',
accept:['passed','Passed'],
passage:`Dear Parents,<br><br>At Greenwood High School, we take great pride in the cultural diversity that enriches our community. We are very pleased to share with you our special new project, a recipe book, created to celebrate the traditions and flavors of families from around the world. This unique collection features 100 recipes from 26 countries, highlighting beloved dishes __________ (pass) down through generations. It offers a special chance to explore global cuisine and share meaningful moments with your children. We encourage you to try some of these recipes together over the summer. You can download this online recipe book from our school website. Food brings us together, and this project reflects the joy and unity that diversity brings to our school. Thank you, as always, for your continued support.<br><br>Warm regards,<br>Dr. Helen Brooks<br>Principal, Greenwood High School`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`dishes가 전해진 것(수동)이므로 과거분사 passed가 적절.`,analysis:`pass down(전하다) → dishes (which were) passed down (수동)`,tip:`pass down(전하다) → dishes passed down(전해진 요리) = 수동 의미의 과거분사`}},

{id:15,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'Associate Editor',
accept:['Associate Editor','associate editor'],
passage:P_EX02,
stem:`Nora Ellison의 직책을 본문에서 영어로 쓰시오.`,
det:{korean:`편지 끝에 "Nora Ellison, Associate Editor"로 명시되어 있다.`,analysis:`Associate Editor = 부편집장<br>편지 서명에서 직접 확인 가능`,tip:`편지의 마지막 서명 부분에서 직책 확인`}},

{id:16,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'Financial Advisor',
accept:['Financial Advisor','financial advisor'],
passage:P_EX04,
stem:`Joseph Brown의 직책을 본문에서 영어로 쓰시오.`,
det:{korean:`편지 끝에 "Joseph Brown, Financial Advisor"로 명시되어 있다.`,analysis:`Financial Advisor = 재무 상담사<br>편지 서명에서 직접 확인 가능`,tip:`편지의 마지막 서명 부분에서 직책 확인`}},

{id:17,type:'내용이해',diff:'보통',pts:5,fmt:'mc',ans:0,
ch:['구매한 꽃의 환불을 요청하려고','꽃 배달 지연에 대해 항의하려고','결혼기념일 꽃다발을 주문하려고','결혼식장 꽃 장식에 관해 문의하려고','꽃 배달 서비스에 대해 만족을 표현하려고'],

let S={ans:[],cur:0,ti:null,left:EI.time,start:0};

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name,answers:S.ans.slice()});if(h.length>20)h.length=20;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map((x,idx)=>`<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade} · ${x.level||''}</div></div><div class="hi-right"><div class="hi-score" style="color:${x.score>=80?'var(--o)':'var(--r)'}">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div></div>${x.answers?`<button onclick="reviewHistory(${idx})" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid #E0D8CF;border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--o)">📝 정답·해설 다시 보기</button>`:''}</div>`).join('');p.style.display='block';}
function getLevel(s){if(s>=95)return{name:'마스터',icon:'👑',range:'95~100',msg:'이 단원은 정복했어요!'};if(s>=85)return{name:'챌린저',icon:'🌟',range:'85~94',msg:'거의 완벽, 한 끗 차이!'};if(s>=75)return{name:'파이터',icon:'💎',range:'75~84',msg:'통과! 약점만 잡으면 마스터'};if(s>=50)return{name:'루키',icon:'🔥',range:'50~74',msg:'기본기 OK, 유형별 훈련 필요'};return{name:'스타터',icon:'📖',range:'0~49',msg:'지문 해석부터 다시!'};}
function getTypeAdvice(t){const m={'(A)(B)(C) 조합형':'반의어 함정 주의, 원문 단어 정확히 암기','문맥상 부적절한 어휘':'밑줄 단어가 반의어로 바뀌었는지 확인','동의어 고르기':'동의어 쌍을 세트로 묶어 암기','반의어 고르기':'반의어 쌍을 세트로 묶어 암기','빈칸 어휘 완성':'문맥 단서(clue) 찾기 연습 필요','다의어 문맥적 의미':'다의어의 여러 뜻을 문맥별로 구분','영영풀이 매칭':'영영사전 정의 읽기 연습','어형 변환 (서술형)':'품사 변환 규칙(명↔형, 동↔명) 정리','빈칸 문맥 완성':'글의 흐름과 논리적 연결 파악','어법':'핵심 어법 규칙 정리 및 반복 연습','내용일치':'지문과 선지를 꼼꼼히 대조','내용불일치':'함정 선지의 미세한 차이 찾기','T/F':'원문과 진술을 정확히 대조','서술형':'정확한 철자와 어형 변환 주의','빈칸추론':'빈칸 전후 문맥 단서 찾기','빈칸 추론':'빈칸 전후 문맥 단서 찾기','문장삽입':'글의 흐름과 연결사 파악','어순배열':'문장 구조(S+V+O) 정확히 파악','어휘':'문맥에서 적절한 어휘 고르기 연습','내용이해':'지문 핵심 내용 정확히 파악'};return m[t]||'해당 유형 집중 복습 필요';}
function fmtTime(s){return Math.floor(s/60)+'분 '+s%60+'초';}

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startExam(){const nm=document.getElementById('inpName').value.trim();if(!nm){toast('이름을 입력해주세요!');return;}S={ans:Array(EI.totalQ).fill(null),cur:0,ti:null,left:EI.time,start:Date.now()};showScreen('examScreen');renderQ();renderDots();startTimer();window.scrollTo(0,0);}

function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;}); el.innerHTML=h;}

function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}

h+=`<div class="rs"><div class="rs-title">🔍 내신핏 약점 진단</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'var(--o)':p>=50?'var(--warn)':'var(--r)';const icon=p===100?'✅':p>=50?'⚠️':'❌';h+=`<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:13px">${icon}</span><span style="font-size:13px;font-weight:700;flex:1">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-size:13px;font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div>${p<100?`<div style="font-size:11px;color:var(--tm);margin-top:3px;padding-left:21px">→ ${getTypeAdvice(type)}</div>`:''}</div>`;});h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 내신핏 처방</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">👑</div><div class="plan-text"><h4>마스터 달성!</h4><p>이 단원은 완벽합니다. 다음 단원에 도전하세요!</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">🌟</div><div class="plan-text"><h4>통과! 마스터까지 한 끗</h4><p>아래 약점 유형만 집중하면 마스터 달성!</p></div>`;else if(pct>=50)h+=`<div class="plan-icon">🔥</div><div class="plan-text"><h4>기본기는 있어요!</h4><p>오답 해설을 꼼꼼히 확인하고, 약점 유형부터 공략하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>지문 해석부터!</h4><p>본문을 완벽히 이해한 뒤 재도전하세요. 해설의 한글 해석을 활용!</p></div>`;h+=`</div></div>`;

function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#E8772E':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#FFF3E8,#FFE8D5':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#E8772E':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
