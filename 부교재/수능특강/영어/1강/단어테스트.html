<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2027학년도 EBS수능특강 01강 온라인단어 TEST</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--g:#16A34A;--gd:#14532D;--gl:#E8F5E9;--gxl:#F0FDF4;--gxxl:#F8FDF9;--bg:#F4F8F5;--text:#1A1A2E;--tm:#5A6A5E;--tl:#8A9A8E;--r:#D63B3B;--rl:#FFF0F0;--b:#3B6FD9;--bl:#EDF2FF;--o:#F59E0B;--ol:#FFF8E1;--card:#FFF;--shadow:0 4px 20px rgba(0,0,0,.06);--radius:16px;--rs:10px;--rxs:6px;--tr:all .2s ease;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
.screen{display:none;min-height:100vh;}.screen.active{display:flex;flex-direction:column;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:12px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;}.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#startScreen{align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(160deg,#F0FDF4,#E8F5E9 40%,#DCFCE7);}
.start-container{max-width:460px;width:100%;z-index:1;}
.brand-badge{display:inline-block;background:linear-gradient(135deg,var(--g),#0D9488);color:#fff;font-size:12px;font-weight:800;padding:7px 16px;border-radius:24px;margin-bottom:20px;}
.start-title{font-size:36px;font-weight:900;margin-bottom:4px;}.start-title span{background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.start-subtitle{font-size:14px;color:var(--tm);margin-bottom:30px;}
.info-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.info-card-header{background:linear-gradient(135deg,var(--g),#0D9488);padding:14px 20px;color:#fff;font-size:13px;font-weight:700;}
.info-rows{padding:4px 0;}.info-row{display:flex;justify-content:space-between;padding:11px 20px;font-size:14px;border-bottom:1px solid #f0f5f1;}.info-row:last-child{border:none;}
.info-label{color:var(--tm);}.info-value{font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;}
.chip{background:var(--card);border:1.5px solid #dde8df;border-radius:24px;padding:7px 15px;font-size:12px;font-weight:600;color:var(--tm);}
.input-group{margin-bottom:14px;}.input-group label{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:6px;}
.input-group input,.input-group select{width:100%;padding:13px 16px;border:2px solid #d0dcd2;border-radius:var(--rs);font-size:15px;font-family:inherit;background:#fff;transition:var(--tr);}
.input-group input:focus,.input-group select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px rgba(22,163,74,.1);}
.input-row{display:flex;gap:10px;}
.btn{padding:16px;border:none;border-radius:var(--rs);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;box-shadow:0 6px 20px rgba(22,163,74,.3);margin-top:12px;}.btn-primary:hover{transform:translateY(-1px);}
.btn-outline{background:transparent;border:2px solid #c8d8ca;color:var(--tm);margin-top:8px;font-size:14px;padding:12px;}.btn-outline:hover{border-color:var(--g);color:var(--g);}
.history-badge{background:var(--gxl);color:var(--g);font-weight:800;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:6px;}
#historyPanel{display:none;margin-top:14px;}
.history-item{background:var(--card);border:1.5px solid #dde8df;border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left .hi-name{font-weight:700;font-size:13px;}.hi-left .hi-meta{font-size:11px;color:var(--tl);}
.hi-right .hi-score{font-size:20px;font-weight:900;color:var(--g);}.hi-right .hi-level{font-size:10px;color:var(--tm);text-align:right;}
.exam-topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:10px;}.topbar-dot{width:8px;height:8px;background:var(--g);border-radius:50%;}
.topbar-info{font-size:13px;color:var(--tm);font-weight:600;}.topbar-info span{color:var(--g);font-weight:800;}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;}.timer.warn{color:var(--o);}.timer.danger{color:var(--r);animation:pulse .6s infinite;}
@keyframes pulse{50%{opacity:.3;}}
.btn-submit{padding:9px 22px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border:none;border-radius:var(--rxs);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.exam-scroll{display:none;}
.slide-wrap{height:calc(100vh - 52px);display:flex;flex-direction:column;}
.slide-passage{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;background:#fff;}
.slide-passage .q-passage{padding:0;border:none;border-radius:0;background:transparent;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.slide-bottom{flex-shrink:0;background:rgba(255,255,255,.2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-top:1px solid rgba(255,255,255,.25);box-shadow:0 -2px 20px rgba(0,0,0,.05);padding:10px 14px 12px;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;}
.slide-stem{font-size:12.5px;font-weight:700;margin-bottom:6px;overflow-wrap:break-word;color:var(--text);}
.slide-choices{display:flex;flex-direction:column;gap:2px;}
.slide-choices .choice-btn{padding:6px 9px;font-size:12px;line-height:1.3;gap:6px;border:1px solid rgba(0,0,0,.05);border-radius:8px;background:rgba(255,255,255,.15);}
.slide-choices .choice-btn:hover{background:rgba(255,255,255,.35);}
.slide-choices .choice-btn.selected{border-color:var(--g);background:rgba(22,163,74,.12);box-shadow:0 0 0 2px rgba(22,163,74,.2);}
.slide-choices .c-num{min-width:18px;height:18px;font-size:9px;background:rgba(0,0,0,.06);}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}
.slide-choices .written-input{padding:7px 10px;font-size:13px;background:rgba(255,255,255,.2);border:1px solid rgba(0,0,0,.05);}
.slide-nav{display:flex;align-items:center;justify-content:space-between;padding:5px 0 0;margin-top:5px;}
.slide-nav button{padding:6px 14px;border:1px solid rgba(0,0,0,.05);border-radius:7px;background:rgba(255,255,255,.15);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:11px;font-weight:800;color:var(--g);}
.q-card{background:var(--card);border-radius:12px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden;}
.q-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(135deg,var(--gxl),var(--gl));border-bottom:1px solid #e0ece2;flex-wrap:wrap;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--gl);color:#166534;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f0f5f1;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--g);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:linear-gradient(135deg,#FAFDFB,#F5FAF6);border-left:3px solid var(--g);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid #dde8df;border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--g);}.choice-btn.selected{border-color:var(--g);box-shadow:0 0 0 2px rgba(22,163,74,.12);background:var(--gxxl);}
.c-num{min-width:22px;height:22px;background:#e8efe9;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid #d0dcd2;border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}
.exam-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid rgba(0,0,0,.06);padding:10px 16px;display:flex;align-items:center;gap:5px;justify-content:center;z-index:100;overflow-x:auto;flex-wrap:wrap;}
.nav-dot{width:28px;height:28px;border-radius:50%;background:#dde8df;cursor:pointer;border:none;font-size:10px;font-weight:800;color:var(--tm);display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;}.nav-dot.answered{background:var(--g);color:#fff;}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--gxl),var(--gl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8efe9;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),var(--gl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--gxxl);border-radius:var(--rs);border:1px solid #dde8df;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8efe9;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #dde8df;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--gxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--gxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="startScreen" class="screen active">
<div class="start-container">
  <div class="brand-badge">📝 온라인단어 TEST</div>
  <h1 class="start-title">온라인단어 <span>TEST</span></h1>
  <p class="start-subtitle">2027학년도 EBS수능특강 영어 · 01강 · 글의 목적 파악 · 20문항</p>
  <div class="info-card"><div class="info-card-header">📚 시험 정보</div><div class="info-rows">
    <div class="info-row"><span class="info-label">시험</span><span class="info-value">2027학년도 EBS수능특강 영어</span></div>
    <div class="info-row"><span class="info-label">문항</span><span class="info-value">01강 (글의 목적 파악)</span></div>
    <div class="info-row"><span class="info-label">지문</span><span class="info-value">Purpose of Writing (5 passages)</span></div>
  </div></div>
  <div class="chip-row"><div class="chip">📝 20문항</div><div class="chip">⏱️ 20분</div><div class="chip">✅ 80점 이상 통과</div><div class="chip">📊 100점 만점</div></div>
  <div class="input-group"><label>이름 *</label><input type="text" id="inpName" placeholder="이름을 입력하세요"></div>
  <div class="input-row">
    <div class="input-group" style="flex:1"><label>학교</label><input type="text" id="inpSchool" placeholder="선택"></div>
    <div class="input-group" style="flex:.6"><label>학년</label><select id="inpGrade"><option>고1</option><option>고2</option><option>고3</option><option>중3</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="startExam()">시험 시작하기 →</button>
  <button class="btn btn-outline" onclick="toggleHistory()">📋 시험 기록 보기 <span class="history-badge" id="hCount">0</span></button>
  <div id="historyPanel"></div>
</div>
</div>
<div id="examScreen" class="screen">
  <div class="exam-topbar"><div class="topbar-left"><div class="topbar-dot"></div><div class="topbar-info">수능특강 · <span>01강</span></div></div><div class="timer" id="timer">20:00</div><button class="btn-submit" onclick="submitExam()">제출하기</button></div>
  <div class="exam-scroll" id="examScroll"></div>
  <div class="slide-wrap" id="slideWrap">
    <div class="slide-passage" id="slidePassage"></div>
    <div class="slide-bottom" id="slideBottom"></div>
  </div>
</div>
<div id="resultScreen" class="screen"></div>
<script>
const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"01강","lesson":"글의 목적 파악","title":"Purpose of Writing","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_suneung_01_v1"};

const P_GW=`Dear students,<br><br>I am Amanda Clark, the school club director, and I am writing to you about our school clubs. Over the last few semesters, there have been requests for more diverse school clubs. For this reason, the school decided to expand the number of clubs for extracurricular activities. This provides students with an opportunity to make additional clubs. Students can make any type of club based on their various interests, such as hip-hop, K-pop dancing, or coding. Therefore, I am encouraging you to submit a proposal for a new club that you would like to create. Please turn this in to my office by the end of this week. I look forward to seeing your great ideas.<br><br>Best regards,<br>Amanda Clark`;

const P_EX01=`Dear Parents,<br><br>At Greenwood High School, we take great pride in the cultural diversity that enriches our community. We are very pleased to share with you our special new project, a recipe book, created to celebrate the traditions and flavors of families from around the world. This unique collection features 100 recipes from 26 countries, highlighting beloved dishes passed down through generations. It offers a special chance to explore global cuisine and share meaningful moments with your children. We encourage you to try some of these recipes together over the summer. You can download this online recipe book from our school website. Food brings us together, and this project reflects the joy and unity that diversity brings to our school. Thank you, as always, for your continued support.<br><br>Warm regards,<br>Dr. Helen Brooks<br>Principal, Greenwood High School`;

const P_EX02=`Dear Professor Langford,<br><br>First of all, we apologize for contacting you during the holiday season. We understand that this is a busy time, but as the revision deadline of your manuscript (December 27th) is quickly approaching, we kindly ask for your cooperation in addressing the reviewers' comments as thoroughly as possible within the limited time available. The reviewers have carefully evaluated your manuscript and provided insightful and critical feedback. To help you revise, we have summarized the key points raised by both reviewers. Please review these comments carefully and submit a revised version of your manuscript. We are confident that incorporating these suggestions will significantly improve the manuscript and provide stronger support for your main claims. We hope that the revised manuscript will satisfy the reviewers and be accepted in our journal. Thank you for your attention and cooperation.<br><br>Best regards,<br>Nora Ellison, Associate Editor`;

const P_EX03=`To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I ordered my wedding bouquet from you, and my husband, Nicholas, had promised me David Austin roses. However, on my wedding day, I received standard roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on enjoying my special day. Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were lifeless, spotted, and browning upon arrival. This time, I believe it's only fair to ask you to take action to resolve this matter. I am not asking for compensation for the flowers from a year ago, but I do expect a refund for this order. To resolve this issue, I would appreciate a full refund. I look forward to your response.<br><br>Sincerely,<br>Cheryl`;

const P_EX04=`Dear Mr. Johnson,<br><br>Have you "settled into" your new job by now, and do you still feel as enthusiastic about it as you did at the beginning? Of course, any job has its tiresome tasks, but all in all, from what you told us, it sounds like a good match for you. We're writing to ask when we can expect repayment of the $1,500 loan for your car. We were glad to help you with the purchase of your car so that you'd have transportation back and forth to your new job. You agreed to pay all, or at least half, of the loan by June. If you have decided that you cannot repay the total $1,500 at once, we understand. But we do need to receive at least half that amount within the next 2 or 3 weeks. We hope you are satisfied with the car you chose. We, too, thought it was a good buy. Please let us know how things are going.<br><br>Sincerely,<br>Joseph Brown<br>Financial Advisor`;

const Q=[
{"id":1,"type":"(A)(B)(C) 조합형","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["expand — additional — submit","reduce — additional — submit","expand — limited — submit","expand — additional — withdraw","reduce — limited — withdraw"],"passage":"Dear students,<br><br>I am Amanda Clark, the school club director, and I am writing to you about our school clubs. Over the last few semesters, there have been requests for more diverse school clubs. For this reason, the school decided to <b>(A)</b> the number of clubs for extracurricular activities. This provides students with an opportunity to make <b>(B)</b> clubs. Students can make any type of club based on their various interests, such as hip-hop, K-pop dancing, or coding. Therefore, I am encouraging you to <b>(C)</b> a proposal for a new club that you would like to create. Please turn this in to my office by the end of this week. I look forward to seeing your great ideas.<br><br>Best regards,<br>Amanda Clark","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"학교는 동아리 수를 <b>확대(expand)</b>하기로 결정했고, 학생들에게 <b>추가적인(additional)</b> 동아리를 만들 기회를 제공하며, 새 동아리 제안서를 <b>제출(submit)</b>하도록 권장하고 있습니다.","analysis":"✅ ① expand — additional — submit: 원문과 일치\<br>❌ ② reduce(축소)는 expand(확대)의 반의어\<br>❌ ③ limited(제한된)는 additional(추가적인)과 반대\<br>❌ ④ withdraw(철회)는 submit(제출)의 반의어\<br>❌ ⑤ 세 단어 모두 원문과 불일치","tip":"expand(확장하다), additional(추가적인), submit(제출하다) — 동아리 확대 관련 핵심 어휘"}},

{"id":2,"type":"(A)(B)(C) 조합형","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["enriches — celebrate — meaningful","diminishes — celebrate — meaningful","enriches — ignore — meaningful","enriches — celebrate — trivial","diminishes — ignore — trivial"],"passage":"Dear Parents,<br><br>At Greenwood High School, we take great pride in the cultural diversity that <b>(A)</b> our community. We are very pleased to share with you our special new project, a recipe book, created to <b>(B)</b> the traditions and flavors of families from around the world. This unique collection features 100 recipes from 26 countries, highlighting beloved dishes passed down through generations. It offers a special chance to explore global cuisine and share <b>(C)</b> moments with your children. We encourage you to try some of these recipes together over the summer. You can download this online recipe book from our school website. Food brings us together, and this project reflects the joy and unity that diversity brings to our school. Thank you, as always, for your continued support.<br><br>Warm regards,<br>Dr. Helen Brooks<br>Principal, Greenwood High School","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"문화적 다양성이 우리 공동체를 <b>풍요롭게 하는(enriches)</b>, 전통과 맛을 <b>기념하기(celebrate)</b> 위해 만든 요리책, 자녀와 <b>의미 있는(meaningful)</b> 순간을 나눌 기회를 제공합니다.","analysis":"✅ ① enriches — celebrate — meaningful: 원문과 정확히 일치\<br>❌ ② diminishes(감소시키다)는 enriches의 반의어\<br>❌ ③ ignore(무시하다)는 celebrate의 반의어\<br>❌ ④ trivial(사소한)은 meaningful의 반의어\<br>❌ ⑤ 세 단어 모두 반의어로 교체됨","tip":"enrich(풍요롭게 하다), celebrate(기념하다), meaningful(의미 있는)"}},

{"id":3,"type":"문맥상 부적절한 어휘","diff":"쉬움","pts":4,"fmt":"mc","ans":3,"ch":["① apologize","② cooperation","③ thoroughly","④ superficial","⑤ improve"],"passage":"Dear Professor Langford,<br><br>First of all, we <u>① apologize</u> for contacting you during the holiday season. We understand that this is a busy time, but as the revision deadline of your manuscript (December 27th) is quickly approaching, we kindly ask for your <u>② cooperation</u> in addressing the reviewers' comments as <u>③ thoroughly</u> as possible within the limited time available. The reviewers have carefully evaluated your manuscript and provided <u>④ superficial</u> and critical feedback. To help you revise, we have summarized the key points raised by both reviewers. Please review these comments carefully and submit a revised version of your manuscript. We are confident that incorporating these suggestions will significantly <u>⑤ improve</u> the manuscript and provide stronger support for your main claims. We hope that the revised manuscript will satisfy the reviewers and be accepted in our journal. Thank you for your attention and cooperation.<br><br>Best regards,<br>Nora Ellison, Associate Editor","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"리뷰어들은 원고를 신중하게 평가하고 <b>통찰력 있는(insightful)</b> 피드백을 제공했습니다. superficial(피상적인)은 insightful(통찰력 있는)의 반의어로, 문맥에 맞지 않습니다.","analysis":"✅ ① apologize(사과하다): 휴가철에 연락한 것에 대한 사과로 적절\<br>✅ ② cooperation(협력): 리뷰어 의견 반영을 위한 협조 요청으로 적절\<br>✅ ③ thoroughly(철저히): 가능한 한 철저히 반영하라는 뜻으로 적절\<br>❌ ④ superficial(피상적인) → insightful(통찰력 있는): 반의어 교체\<br>✅ ⑤ improve(개선하다): 원고를 크게 개선할 것이라는 맥락에 적절","tip":"insightful(통찰력 있는) ↔ superficial(피상적인)"}},

{"id":4,"type":"문맥상 부적절한 어휘","diff":"보통","pts":5,"fmt":"mc","ans":4,"ch":["① ordered","② promised","③ standard","④ enjoying","⑤ alive"],"passage":"To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I <u>① ordered</u> my wedding bouquet from you, and my husband, Nicholas, had <u>② promised</u> me David Austin roses. However, on my wedding day, I received <u>③ standard</u> roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on <u>④ enjoying</u> my special day. Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were <u>⑤ alive</u>, spotted, and browning upon arrival. This time, I believe it's only fair to ask you to take action to resolve this matter. I am not asking for compensation for the flowers from a year ago, but I do expect a refund for this order. To resolve this issue, I would appreciate a full refund. I look forward to your response.<br><br>Sincerely,<br>Cheryl","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"오늘 받은 꽃은 <b>생기 없고(lifeless)</b>, 반점이 있고, 갈변한 상태였습니다. alive(살아 있는)는 lifeless(생기 없는)의 반의어로, 꽃이 시든 상태를 묘사하는 문맥에 맞지 않습니다.","analysis":"✅ ① ordered(주문했다): 꽃다발을 주문한 행위로 적절\<br>✅ ② promised(약속했다): 남편이 장미를 약속한 것으로 적절\<br>✅ ③ standard(일반): 데이비드 오스틴 장미 대신 일반 장미를 받은 것으로 적절\<br>✅ ④ enjoying(즐기는): 특별한 날을 즐기기로 한 것으로 적절\<br>❌ ⑤ alive(살아 있는) → lifeless(생기 없는): 시든 꽃 묘사와 반대","tip":"lifeless(생기 없는, 시든) ↔ alive(살아 있는)"}},

{"id":5,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":1,"ch":["identical","varied","limited","singular","uniform"],"passage":"Over the last few semesters, there have been requests for more <u>diverse</u> school clubs.","stem":"밑줄 친 diverse와 의미가 가장 가까운 것은?","det":{"korean":"지난 몇 학기 동안 더 <b>다양한(diverse)</b> 학교 동아리에 대한 요청이 있었습니다.","analysis":"✅ varied(다양한): diverse의 동의어\<br>❌ identical(동일한): diverse와 반대 의미\<br>❌ limited(제한된): diverse와 반대 의미\<br>❌ singular(단일한): diverse와 반대 의미\<br>❌ uniform(균일한): diverse와 반대 의미","tip":"diverse = varied = various (다양한)"}},

{"id":6,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["depletes","enhances","replaces","simplifies","diminishes"],"passage":"At Greenwood High School, we take great pride in the cultural diversity that <u>enriches</u> our community.","stem":"밑줄 친 enriches와 의미가 가장 가까운 것은?","det":{"korean":"우리 공동체를 <b>풍요롭게 하는(enriches)</b> 문화적 다양성을 매우 자랑스럽게 여깁니다.","analysis":"✅ enhances(향상시키다): enriches의 동의어로, 가치를 높이다는 의미 공유\<br>❌ depletes(고갈시키다): enriches의 반의어\<br>❌ replaces(대체하다): 전혀 다른 의미\<br>❌ simplifies(단순화하다): 풍요롭게 하다와 무관\<br>❌ diminishes(줄이다): enriches의 반의어","tip":"enrich = enhance = augment (풍요롭게 하다, 향상시키다)"}},

{"id":7,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["punishment","reimbursement","donation","penalty","forfeiture"],"passage":"I am not asking for <u>compensation</u> for the flowers from a year ago, but I do expect a refund for this order.","stem":"밑줄 친 compensation과 의미가 가장 가까운 것은?","det":{"korean":"1년 전 꽃에 대한 <b>보상(compensation)</b>을 요구하는 것이 아니라, 이번 주문에 대한 환불을 기대합니다.","analysis":"✅ reimbursement(상환, 변상): compensation과 같은 금전적 보상 의미\<br>❌ punishment(처벌): 보상과 반대 개념\<br>❌ donation(기부): 대가 없는 제공으로 다른 의미\<br>❌ penalty(벌금): 보상이 아닌 처벌적 의미\<br>❌ forfeiture(몰수): 보상과 반대되는 박탈 의미","tip":"compensation = reimbursement = indemnity (보상, 배상)"}},

{"id":8,"type":"반의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":3,"ch":["enhance","upgrade","advance","worsen","strengthen"],"passage":"We are confident that incorporating these suggestions will significantly <u>improve</u> the manuscript and provide stronger support for your main claims.","stem":"밑줄 친 improve와 의미가 가장 반대인 것은?","det":{"korean":"이러한 제안을 반영하면 원고가 크게 <b>개선될(improve)</b> 것이라고 확신합니다.","analysis":"✅ worsen(악화시키다): improve의 정확한 반의어\<br>❌ enhance(향상시키다): improve의 동의어\<br>❌ upgrade(업그레이드하다): improve의 동의어\<br>❌ advance(진전시키다): improve의 유의어\<br>❌ strengthen(강화하다): improve의 유의어","tip":"improve(개선하다) ↔ worsen(악화시키다), deteriorate(악화되다)"}},

{"id":9,"type":"반의어 고르기","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["passionate","eager","apathetic","excited","zealous"],"passage":"Have you \"settled into\" your new job by now, and do you still feel as <u>enthusiastic</u> about it as you did at the beginning?","stem":"밑줄 친 enthusiastic과 의미가 가장 반대인 것은?","det":{"korean":"새 직장에 적응했는지, 처음처럼 여전히 <b>열정적인(enthusiastic)</b> 느낌인지 묻고 있습니다.","analysis":"✅ apathetic(무관심한, 냉담한): enthusiastic의 정확한 반의어\<br>❌ passionate(열정적인): enthusiastic의 동의어\<br>❌ eager(열망하는): enthusiastic의 유의어\<br>❌ excited(흥분한): enthusiastic의 유의어\<br>❌ zealous(열성적인): enthusiastic의 유의어","tip":"enthusiastic(열정적인) ↔ apathetic(무관심한), indifferent(무관심한)"}},

{"id":10,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["reduce","expand","maintain","eliminate","restrict"],"passage":"Dear students,<br><br>I am Amanda Clark, the school club director, and I am writing to you about our school clubs. Over the last few semesters, there have been requests for more diverse school clubs. For this reason, the school decided to __________ the number of clubs for extracurricular activities. This provides students with an opportunity to make additional clubs. Students can make any type of club based on their various interests, such as hip-hop, K-pop dancing, or coding. Therefore, I am encouraging you to submit a proposal for a new club that you would like to create. Please turn this in to my office by the end of this week. I look forward to seeing your great ideas.<br><br>Best regards,<br>Amanda Clark","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"더 다양한 동아리에 대한 요청이 있었기에, 학교는 과외 활동을 위한 동아리 수를 <b>확대(expand)</b>하기로 결정했습니다.","analysis":"✅ expand(확대하다): 더 다양한 동아리 요청 → 동아리 수 확대가 자연스러운 흐름\<br>❌ reduce(줄이다): 요청에 반하는 행동\<br>❌ maintain(유지하다): 추가 동아리 허용과 모순\<br>❌ eliminate(없애다): 문맥과 완전히 반대\<br>❌ restrict(제한하다): 확대와 반대 의미","tip":"expand = enlarge = extend (확대하다, 늘리다)"}},

{"id":11,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["isolates","threatens","enriches","divides","undermines"],"passage":"Dear Parents,<br><br>At Greenwood High School, we take great pride in the cultural diversity that __________ our community. We are very pleased to share with you our special new project, a recipe book, created to celebrate the traditions and flavors of families from around the world. This unique collection features 100 recipes from 26 countries, highlighting beloved dishes passed down through generations. It offers a special chance to explore global cuisine and share meaningful moments with your children. We encourage you to try some of these recipes together over the summer. You can download this online recipe book from our school website. Food brings us together, and this project reflects the joy and unity that diversity brings to our school. Thank you, as always, for your continued support.<br><br>Warm regards,<br>Dr. Helen Brooks<br>Principal, Greenwood High School","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"문화적 다양성이 우리 공동체를 <b>풍요롭게 하는(enriches)</b> 것을 매우 자랑스러워합니다.","analysis":"✅ enriches(풍요롭게 하다): 문화적 다양성에 대한 자부심 + 요리책 프로젝트와 일관\<br>❌ isolates(고립시키다): 공동체에 대한 긍정적 문맥과 불일치\<br>❌ threatens(위협하다): 자부심과 모순\<br>❌ divides(분열시키다): 통합(unity)을 강조하는 글의 흐름과 반대\<br>❌ undermines(약화시키다): 긍정적 문맥과 불일치","tip":"enrich(풍요롭게 하다) — 문화적 다양성이 공동체에 미치는 긍정적 영향"}},

{"id":12,"type":"빈칸 어휘 완성","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["extension","cancellation","repayment","approval","investment"],"passage":"Dear Mr. Johnson,<br><br>Have you \"settled into\" your new job by now, and do you still feel as enthusiastic about it as you did at the beginning? Of course, any job has its tiresome tasks, but all in all, from what you told us, it sounds like a good match for you. We're writing to ask when we can expect __________ of the $1,500 loan for your car. We were glad to help you with the purchase of your car so that you'd have transportation back and forth to your new job. You agreed to pay all, or at least half, of the loan by June. If you have decided that you cannot repay the total $1,500 at once, we understand. But we do need to receive at least half that amount within the next 2 or 3 weeks. We hope you are satisfied with the car you chose. We, too, thought it was a good buy. Please let us know how things are going.<br><br>Sincerely,<br>Joseph Brown<br>Financial Advisor","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"$1,500 자동차 대출금의 <b>상환(repayment)</b>을 언제 받을 수 있는지 문의하고 있습니다.","analysis":"✅ repayment(상환): 대출금을 돌려받기 위한 편지의 핵심 목적\<br>❌ extension(연장): 상환 기한 연장이 아닌 상환 요청\<br>❌ cancellation(취소): 대출 취소가 아닌 상환 요청\<br>❌ approval(승인): 이미 대출이 실행된 상태\<br>❌ investment(투자): 대출 상환과 무관한 개념","tip":"repayment(상환) = paying back money that was borrowed"}},

{"id":13,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["파일에 넣다","줄지어 가다","제기하다","갈다","기록하다"],"passage":"Although I briefly considered <u>filing</u> a complaint about the mistake, I chose to focus on enjoying my special day.","stem":"밑줄 친 filing이 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"실수에 대해 불만을 <b>제기하는(filing)</b> 것을 잠깐 고려했지만, 특별한 날을 즐기기로 했습니다.","analysis":"✅ 제기하다: file a complaint = 불만/소송을 제기하다\<br>❌ 파일에 넣다: 서류 정리의 의미 (여기서는 해당 안 됨)\<br>❌ 줄지어 가다: file out/in의 의미\<br>❌ 갈다: file(줄)로 가는 행위\<br>❌ 기록하다: 서류를 보관하는 의미 (여기서는 해당 안 됨)","tip":"file a complaint(불만을 제기하다), file a lawsuit(소송을 제기하다) — 공식적 절차를 밟다"}},

{"id":14,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["성냥","경기","적합한 것","어울리다","대등한 상대"],"passage":"Of course, any job has its tiresome tasks, but all in all, from what you told us, it sounds like a good <u>match</u> for you.","stem":"밑줄 친 match가 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"어떤 직업이든 지루한 업무가 있지만, 전반적으로 당신에게 <b>적합한 것(match)</b>처럼 들립니다.","analysis":"✅ 적합한 것: a good match = 잘 맞는 것, 적합한 것\<br>❌ 성냥: 불을 붙이는 도구 (다른 의미)\<br>❌ 경기: 스포츠 시합 (다른 의미)\<br>❌ 어울리다: 동사적 의미 (여기서는 명사)\<br>❌ 대등한 상대: 실력이 비슷한 상대라는 의미 (여기서는 해당 안 됨)","tip":"a good match(잘 맞는 것) — 직업이 사람에게 적합하다는 의미"}},

{"id":15,"type":"영영풀이 매칭","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["semester","proposal","interest","complaint","revision"],"passage":"","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><b>\"a formal written suggestion or plan put forward for consideration\"</b>","det":{"korean":"<b>proposal(제안서)</b>: 검토를 위해 제출하는 공식적인 서면 제안이나 계획","analysis":"✅ proposal(제안서): 공식적인 서면 제안/계획 = 정의와 정확히 일치\<br>❌ semester(학기): 학사 기간\<br>❌ interest(관심, 이자): 흥미나 금융 용어\<br>❌ complaint(불만): 불만 사항이나 항의\<br>❌ revision(수정): 고치거나 바꾸는 행위","tip":"proposal = a formal plan or suggestion (제안서, 기획안)"}},

{"id":16,"type":"영영풀이 매칭","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["summarize","evaluate","incorporate","apologize","eliminate"],"passage":"","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><b>\"to include or contain something as a part of something else\"</b>","det":{"korean":"<b>incorporate(통합하다, 포함시키다)</b>: 어떤 것을 다른 것의 일부로 포함하거나 담다","analysis":"✅ incorporate(포함시키다): 무언가를 일부로 포함시키다 = 정의와 정확히 일치\<br>❌ summarize(요약하다): 핵심을 간추리다\<br>❌ evaluate(평가하다): 가치나 질을 판단하다\<br>❌ apologize(사과하다): 잘못을 인정하고 사과하다\<br>❌ eliminate(제거하다): 포함시키다와 반대 의미","tip":"incorporate = include as part of (통합하다, 편입하다)"}},

{"id":17,"type":"어형 변환 (서술형)","diff":"쉬움","pts":4,"fmt":"written","wa":"diversity","accept":["diversity","Diversity"],"ch":null,"passage":"Dear Parents,<br><br>At Greenwood High School, we take great pride in the cultural __________ (diverse) that enriches our community. We are very pleased to share with you our special new project, a recipe book, created to celebrate the traditions and flavors of families from around the world. This unique collection features 100 recipes from 26 countries, highlighting beloved dishes passed down through generations. It offers a special chance to explore global cuisine and share meaningful moments with your children. We encourage you to try some of these recipes together over the summer. You can download this online recipe book from our school website. Food brings us together, and this project reflects the joy and unity that diversity brings to our school. Thank you, as always, for your continued support.<br><br>Warm regards,<br>Dr. Helen Brooks<br>Principal, Greenwood High School","stem":"주어진 단어를 문맥에 맞게 어형을 변환하여 빈칸에 쓰시오.","det":{"korean":"문화적 <b>다양성(diversity)</b>이 우리 공동체를 풍요롭게 합니다.","analysis":"diverse(형용사: 다양한) → diversity(명사: 다양성)\<br>관사 the와 전치사구 사이에 명사가 필요: the cultural _____ that enriches","tip":"diverse(형) → diversity(명) / diversify(동) — 품사 변환에 주의"}},

{"id":18,"type":"어형 변환 (서술형)","diff":"보통","pts":5,"fmt":"written","wa":"cooperation","accept":["cooperation","Cooperation"],"ch":null,"passage":"Dear Professor Langford,<br><br>First of all, we apologize for contacting you during the holiday season. We understand that this is a busy time, but as the revision deadline of your manuscript (December 27th) is quickly approaching, we kindly ask for your __________ (cooperate) in addressing the reviewers' comments as thoroughly as possible within the limited time available. The reviewers have carefully evaluated your manuscript and provided insightful and critical feedback. To help you revise, we have summarized the key points raised by both reviewers. Please review these comments carefully and submit a revised version of your manuscript. We are confident that incorporating these suggestions will significantly improve the manuscript and provide stronger support for your main claims. We hope that the revised manuscript will satisfy the reviewers and be accepted in our journal. Thank you for your attention and cooperation.<br><br>Best regards,<br>Nora Ellison, Associate Editor","stem":"주어진 단어를 문맥에 맞게 어형을 변환하여 빈칸에 쓰시오.","det":{"korean":"원고 수정 기한이 빠르게 다가오고 있어, 리뷰어 의견을 반영하는 데 <b>협조(cooperation)</b>를 부탁드립니다.","analysis":"cooperate(동사: 협력하다) → cooperation(명사: 협력, 협조)\<br>소유격 your 뒤에 명사가 필요: your _____ in addressing","tip":"cooperate(동) → cooperation(명) / cooperative(형) — 동사에서 명사로 변환"}},

{"id":19,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["receipt","discount","refund","delivery","replacement"],"passage":"To whom it may concern,<br><br>Before I get to my main point, I'd like to mention a past experience with your store. A year ago, I ordered my wedding bouquet from you, and my husband, Nicholas, had promised me David Austin roses. However, on my wedding day, I received standard roses instead. Although I briefly considered filing a complaint about the mistake, I chose to focus on enjoying my special day. Yesterday, to celebrate our one-year wedding anniversary, my husband ordered David Austin roses from your store again. However, the flowers I received today were lifeless, spotted, and browning upon arrival. This time, I believe it's only fair to ask you to take action to resolve this matter. I am not asking for compensation for the flowers from a year ago, but I do expect a __________ for this order. To resolve this issue, I would appreciate a full refund. I look forward to your response.<br><br>Sincerely,<br>Cheryl","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"1년 전 꽃에 대한 보상을 요구하는 것이 아니라, 이번 주문에 대한 <b>환불(refund)</b>을 기대합니다.","analysis":"✅ ③ refund(환불): 불량 상품에 대해 금액을 돌려받는 것 — 뒤이어 'a full refund'로 확인\<br>❌ ① receipt(영수증): 이미 받은 것이므로 기대할 대상 아님\<br>❌ ② discount(할인): 문맥상 환불 요청이지 할인 아님\<br>❌ ④ delivery(배달): 이미 배달받은 상태\<br>❌ ⑤ replacement(교체): 환불을 명시적으로 요구하는 맥락","tip":"refund(환불) = money paid back for a returned product or unsatisfactory service"}},

{"id":20,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["motivation","accommodation","transportation","communication","entertainment"],"passage":"Dear Mr. Johnson,<br><br>Have you \"settled into\" your new job by now, and do you still feel as enthusiastic about it as you did at the beginning? Of course, any job has its tiresome tasks, but all in all, from what you told us, it sounds like a good match for you. We're writing to ask when we can expect repayment of the $1,500 loan for your car. We were glad to help you with the purchase of your car so that you'd have __________ back and forth to your new job. You agreed to pay all, or at least half, of the loan by June. If you have decided that you cannot repay the total $1,500 at once, we understand. But we do need to receive at least half that amount within the next 2 or 3 weeks. We hope you are satisfied with the car you chose. We, too, thought it was a good buy. Please let us know how things are going.<br><br>Sincerely,<br>Joseph Brown<br>Financial Advisor","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"새 직장으로의 출퇴근을 위한 <b>교통수단(transportation)</b>이 있도록 자동차 구매를 도와주었습니다.","analysis":"✅ ③ transportation(교통수단): 자동차 구매 목적 = 출퇴근 교통수단 확보\<br>❌ ① motivation(동기): 자동차와 무관\<br>❌ ② accommodation(숙소): 자동차의 용도가 아님\<br>❌ ④ communication(의사소통): 자동차와 무관\<br>❌ ⑤ entertainment(오락): 출퇴근 목적과 무관","tip":"transportation(교통수단) = means of traveling from one place to another"}}
];

const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx','어법':'tag-grammar','어휘 문맥':'tag-vocab','빈칸 추론':'tag-blank','서술형':'tag-written','내용 일치/불일치':'tag-content','TF 판별':'tag-tf','종합':'tag-ctx'};

let S={ans:[],cur:0,ti:null,left:EI.time,start:0};

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name,answers:S.ans.slice()});if(h.length>20)h.length=20;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map((x,idx)=>`<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade} · ${x.level||''}</div></div><div class="hi-right"><div class="hi-score" style="color:${x.score>=80?'var(--g)':'var(--r)'}">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div></div>${x.answers?`<button onclick="reviewHistory(${idx})" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid #dde8df;border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--g)">📝 정답·해설 다시 보기</button>`:''}</div>`).join('');p.style.display='block';}
function getLevel(s){if(s>=95)return{name:'마스터',icon:'👑',range:'95~100',msg:'이 단원은 정복했어요!'};if(s>=85)return{name:'챌린저',icon:'🌟',range:'85~94',msg:'거의 완벽, 한 끗 차이!'};if(s>=75)return{name:'파이터',icon:'💎',range:'75~84',msg:'통과! 약점만 잡으면 마스터'};if(s>=50)return{name:'루키',icon:'🔥',range:'50~74',msg:'기본기 OK, 유형별 훈련 필요'};return{name:'스타터',icon:'📖',range:'0~49',msg:'지문 해석부터 다시!'};}
function getTypeAdvice(t){const m={'(A)(B)(C) 조합형':'반의어 함정 주의, 원문 단어 정확히 암기','문맥상 부적절한 어휘':'밑줄 단어가 반의어로 바뀌었는지 확인','동의어 고르기':'동의어 쌍을 세트로 묶어 암기','반의어 고르기':'반의어 쌍을 세트로 묶어 암기','빈칸 어휘 완성':'문맥 단서(clue) 찾기 연습 필요','다의어 문맥적 의미':'다의어의 여러 뜻을 문맥별로 구분','영영풀이 매칭':'영영사전 정의 읽기 연습','어형 변환 (서술형)':'품사 변환 규칙(명↔형, 동↔명) 정리','빈칸 문맥 완성':'글의 흐름과 논리적 연결 파악','어법':'핵심 어법 규칙 정리 및 반복 연습','내용일치':'지문과 선지를 꼼꼼히 대조','내용불일치':'함정 선지의 미세한 차이 찾기','T/F':'원문과 진술을 정확히 대조','서술형':'정확한 철자와 어형 변환 주의','빈칸추론':'빈칸 전후 문맥 단서 찾기','빈칸 추론':'빈칸 전후 문맥 단서 찾기','문장삽입':'글의 흐름과 연결사 파악','어순배열':'문장 구조(S+V+O) 정확히 파악','어휘':'문맥에서 적절한 어휘 고르기 연습','내용이해':'지문 핵심 내용 정확히 파악'};return m[t]||'해당 유형 집중 복습 필요';}
function fmtTime(s){return Math.floor(s/60)+'분 '+s%60+'초';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startExam(){const nm=document.getElementById('inpName').value.trim();if(!nm){toast('이름을 입력해주세요!');return;}S={ans:Array(EI.totalQ).fill(null),cur:0,ti:null,left:EI.time,start:Date.now()};showScreen('examScreen');renderSlide(0);startTimer();}

function renderSlide(idx){
S.cur=idx;const q=Q[idx];const tc=typeTag[q.type]||'';const mk=q.ch&&q.ch.length===5?'①②③④⑤':'①②③④';
// passage area
const pp=document.getElementById('slidePassage');
let ph=`<div class="slide-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}" style="font-size:10px;padding:3px 8px">${q.type}</span><span style="margin-left:auto;font-size:11px;color:var(--tl)">${q.diff} · ${q.pts}점</span></div>`;
if(q.passage)ph+=`<div class="q-passage">${q.passage}</div>`;
if(!q.passage)ph+=`<div style="padding:20px;text-align:center;color:var(--tl);font-size:13px">이 문항은 지문이 없습니다.</div>`;
pp.innerHTML=ph;pp.scrollTop=0;
// bottom area
const bt=document.getElementById('slideBottom');
let bh=`<div class="slide-stem">${q.stem}</div>`;
if(q.fmt==='mc'){bh+=`<div class="slide-choices">`;q.ch.forEach((c,ci)=>{const sel=S.ans[idx]===ci?' selected':'';bh+=`<button class="choice-btn${sel}" onclick="slideSel(${idx},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`;});bh+=`</div>`;}
if(q.fmt==='written'){const val=S.ans[idx]||'';bh+=`<input class="written-input" id="sw-${idx}" value="${val}" placeholder="답안을 입력하세요..." oninput="slideWrite(${idx})">`;}
bh+=`<div class="slide-nav"><button ${idx===0?'disabled':''}onclick="renderSlide(${idx-1})">&larr; 이전</button><span class="nav-cur">${idx+1} / ${EI.totalQ}</span><button class="sn-next" ${idx===EI.totalQ-1?'disabled':''}onclick="renderSlide(${idx+1})">다음 &rarr;</button></div>`;
bt.innerHTML=bh;bt.scrollTop=0;
}
function slideSel(qi,ci){S.ans[qi]=ci;const st=document.getElementById('slidePassage').scrollTop;renderSlide(qi);document.getElementById('slidePassage').scrollTop=st;}
function slideWrite(qi){const el=document.getElementById('sw-'+qi);S.ans[qi]=el?el.value.trim()||null:null;}
function renderQ(){}
function renderDots(){}
function upDots(){}
function scrollToQ(i){if(i>=0&&i<EI.totalQ)renderSlide(i);}
function sel(){}
function sw(){}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🔍 내신핏 약점 진단</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'var(--g)':p>=50?'var(--o)':'var(--r)';const icon=p===100?'✅':p>=50?'⚠️':'❌';h+=`<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:13px">${icon}</span><span style="font-size:13px;font-weight:700;flex:1">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-size:13px;font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div>${p<100?`<div style="font-size:11px;color:var(--tm);margin-top:3px;padding-left:21px">→ ${getTypeAdvice(type)}</div>`:''}</div>`;});h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 내신핏 처방</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">👑</div><div class="plan-text"><h4>마스터 달성!</h4><p>이 단원은 완벽합니다. 다음 단원에 도전하세요!</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">🌟</div><div class="plan-text"><h4>통과! 마스터까지 한 끗</h4><p>아래 약점 유형만 집중하면 마스터 달성!</p></div>`;else if(pct>=50)h+=`<div class="plan-icon">🔥</div><div class="plan-text"><h4>기본기는 있어요!</h4><p>오답 해설을 꼼꼼히 확인하고, 약점 유형부터 공략하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>지문 해석부터!</h4><p>본문을 완벽히 이해한 뒤 재도전하세요. 해설의 한글 해석을 활용!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid" style="grid-template-columns:1fr 1fr"><button class="act-btn" onclick="shareImage()"><span class="act-icon">📸</span><span class="act-label">이미지 공유</span></button><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">텍스트 복사</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:(d.q.wa||'');const open=!d.ok;
let chHtml='';if(d.q.fmt==='mc'&&d.q.ch){chHtml=`<div style="margin-top:8px">`;d.q.ch.forEach((c,ci)=>{const isAns=ci===d.q.ans;const isMy=d.ans===ci;const color=isAns?'var(--g)':(isMy&&!d.ok?'var(--r)':'var(--tm)');const bg=isAns?'var(--gl)':(isMy&&!d.ok?'var(--rl)':'transparent');const label=isAns?' ✅':(isMy&&!d.ok?' ❌':'');chHtml+=`<div style="padding:4px 8px;margin-bottom:2px;border-radius:6px;font-size:12px;color:${color};background:${bg}"><b>${mk[ci]}</b> ${c}${label}</div>`;});chHtml+=`</div>`;}
h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,8)}] ${d.q.diff} ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:10px"><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:10px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:10px;opacity:.7">정답</div>${ca}</div></div><div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📝 문제</div><div class="expl-box" style="font-size:12.5px;line-height:1.6;border-left:3px solid var(--b);margin-bottom:10px"><div style="font-weight:700;margin-bottom:6px">${d.q.stem}</div>${chHtml}</div>${d.q.passage?`<div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📖 원문</div><div class="expl-box" style="font-size:12px;line-height:1.75;border-left:3px solid #ddd;margin-bottom:10px">${d.q.passage}</div>`:''}${d.q.det?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean||''}</div><div class="expl-tag tip">📋 풀이 · 선지 분석</div><div class="expl-box" style="white-space:pre-line">${(d.q.det.analysis||'').replace(/\\n/g,'<br>')}</div><div class="expl-tag tip">💡 포인트</div><div class="expl-box tip-b">${d.q.det.tip||''}</div>`:''}</div></div>`;}); h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
