const P_GW=`One word is inextricably associated with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply "where" questions, though; they are "why there" and "so what" questions. Getting to such questions means taking spatial arrangements, variations, and interconnections seriously. Engaging in even the simplest day-to-day activity requires some appreciation of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some awareness of how phenomena are arranged on Earth's surface, it is difficult to make reasoned business or policy judgments, make sense of events, or grasp some of the basic forces shaping life on the planet. Locating a new store or public service requires taking into consideration population distributions, the location of roads and utilities, socio-economic patterns, and more. Understanding why and where migration happens requires consideration of the political organization of territory, the spatial consequences of discrimination, socio-economic patterns, and the layout of the physical environment.`;

{"id":1,"type":"어법","diff":"쉬움","pts":4,"fmt":"mc","ans":1,"ch":["associated","associating","associates","associate"],"passage":"One word is inextricably __________ with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. Getting to such questions means taking spatial arrangements, variations, and interconnections seriously.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"'is + 과거분사' 수동태 구문이다. 하나의 단어가 지리학과 연관'되는' 것이므로 수동태 associated가 적절하다.","analysis":"✅ ①associated: is + p.p. 수동태 (be associated with = ~와 연관되다)<br>❌ ②associating: 능동 진행형이 되어 의미 부적절<br>❌ ③associates: 동사 3인칭 단수형, is와 중복<br>❌ ④associate: 동사 원형, is와 결합 불가","tip":"be associated with = ~와 연관되다 (수동태 숙어 표현)"}},
{"id":2,"type":"어법","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["that","what","which","where"],"passage":"One word is inextricably associated with geography: where. __________ is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"'That is because ~'는 '그것은 ~때문이다'라는 고정 표현이다. 앞 문장 전체를 가리키는 지시대명사 That이 적절하다.","analysis":"✅ ①That: 지시대명사, 앞 문장을 받아 That is because 구문<br>❌ ②what: 관계대명사/의문사, 여기서 문법적으로 부적절<br>❌ ③which: 관계대명사, 독립절에서 주어로 부적절<br>❌ ④where: 장소 부사, 주어 자리에 부적절","tip":"That is because ~ = 그것은 ~때문이다 (이유를 설명하는 표현)"}},
{"id":3,"type":"어법","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["Get","Got","Getting","To have gotten"],"passage":"One word is inextricably associated with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. __________ to such questions means taking spatial arrangements, variations, and interconnections seriously.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"문장의 주어 자리이므로 동명사 Getting이 적절하다. 'Getting to such questions'이 주어이고 means가 동사이다.","analysis":"✅ ③Getting: 동명사 주어 (Getting to ~ means ~ing)<br>❌ ①Get: 동사원형은 주어가 될 수 없음<br>❌ ②Got: 과거형, 주어 불가<br>❌ ④To have gotten: 완료 부정사, 의미상 부자연스러움","tip":"동명사 주어: Getting/Engaging/Moving 등 -ing가 문장 주어로 쓰일 수 있다"}},
{"id":4,"type":"어법","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["①","②","③"],"passage":"Engaging in even the simplest day-to-day activity requires some appreciation of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some awareness of how phenomena are arranged on Earth's surface, it is difficult ①<u>to make</u> reasoned business or policy judgments, ②<u>making</u> sense of events, or grasp some of the basic forces ③<u>shaping</u> life on the planet.","stem":"밑줄 친 ①~③ 중 어법상 틀린 것은?","det":{"korean":"②making은 to make, grasp와 병렬 구조를 이루어야 하므로 make가 되어야 한다. it is difficult to make A, make sense of B, or grasp C의 병렬 구조이다.","analysis":"❌ ②making → make: to make / make sense of / grasp의 병렬 구조 (to 생략된 원형부정사)<br>✅ ①to make: it is difficult to V 구문의 진목적어<br>✅ ③shaping: 현재분사, forces를 수식 (forces shaping life = 삶을 형성하는 힘들)","tip":"병렬 구조: to make A, (to) make sense of B, or (to) grasp C — to 이하에서 동사원형이 나열된다"}},
{"id":5,"type":"어법","diff":"쉬움","pts":4,"fmt":"mc","ans":3,"ch":["require","requires","requiring","required"],"passage":"Locating a new store or public service __________ taking into consideration population distributions, the location of roads and utilities, socio-economic patterns, and more. Understanding why and where migration happens requires consideration of the political organization of territory, the spatial consequences of discrimination, socio-economic patterns, and the layout of the physical environment.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"주어가 동명사구 'Locating a new store or public service'로 단수 취급하므로, 단수 동사 requires가 적절하다.","analysis":"✅ ②requires: 동명사 주어는 단수 취급 → 단수 동사<br>❌ ①require: 복수 동사형<br>❌ ③requiring: 분사형, 동사 자리에 부적절<br>❌ ④required: 과거형/수동, 문맥상 현재 일반적 사실","tip":"동명사 주어(~ing)는 단수 취급 → 단수 동사(requires, means 등)와 호응"}},
{"id":6,"type":"내용일치","diff":"쉬움","pts":4,"fmt":"mc","ans":1,"ch":["지리학의 핵심 질문은 단순히 '어디'가 아니라 '왜 거기서'와 '그래서 어떻게'이다.","지리학에서 가장 중요한 것은 지구 표면의 정확한 좌표를 파악하는 것이다.","일상 활동에서는 공간적 상황에 대한 인식이 필요하지 않다.","새로운 매장 입지 선정에는 인구 분포를 고려할 필요가 없다.","이주의 원인을 이해하는 데 물리적 환경의 배치는 관련이 없다."],"passage":P_GW,"stem":"다음 중 글의 내용과 <b>일치하는</b> 것은?","det":{"korean":"원문에 'they are \"why there\" and \"so what\" questions'라고 명시되어 있다.","analysis":"✅ ① 'not simply where questions; they are why there and so what questions' → 일치<br>❌ ② 좌표 파악이 아닌 why there/so what이 핵심<br>❌ ③ requires some appreciation → 필요함<br>❌ ④ requires taking into consideration population distributions → 고려 필요<br>❌ ⑤ the layout of the physical environment → 관련 있음","tip":"지리학의 핵심 질문: where → why there → so what으로 확장"}},
{"id":7,"type":"내용일치","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["지리학은 지구 표면에서 일어나는 일의 위치가 중요하지 않다고 전제한다.","일상 활동에서 공간적 상황을 이해하는 것은 불필요하다.","새 매장 입지 선정 시 인구 분포만 고려하면 된다.","이주의 원인과 장소를 이해하려면 영토의 정치적 조직도 고려해야 한다.","지리학과 가장 밀접하게 연관된 단어는 'why'이다."],"passage":P_GW,"stem":"다음 중 글의 내용과 <b>일치하는</b> 것은?","det":{"korean":"원문에 'requires consideration of the political organization of territory'라고 명시되어 있다.","analysis":"✅ ④ 'requires consideration of the political organization of territory' → 일치<br>❌ ① it matters where → 위치가 중요함<br>❌ ② requires some appreciation → 필요함<br>❌ ③ population distributions + roads + utilities + socio-economic 등 다수 고려 → '만'이 아님<br>❌ ⑤ 'where'가 연관 단어임","tip":"이주 이해 요인: 영토 정치 조직, 차별의 공간적 결과, 사회경제적 패턴, 물리적 환경 배치"}},
{"id":8,"type":"내용불일치","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["지리학에서 '어디'라는 단어는 뗄 수 없는 관계이다.","지리학은 지구 표면에서 무언가가 어디에서 일어나는지가 중요하다는 전제에서 출발한다.","규모를 키워도 지구 표면의 현상 배치에 대한 인식 없이 합리적 판단이 가능하다.","새 매장 입지 선정 시 도로와 시설의 위치도 고려해야 한다.","이주를 이해하려면 차별의 공간적 결과도 고려해야 한다."],"passage":P_GW,"stem":"다음 중 글의 내용과 <b>일치하지 않는</b> 것은?","det":{"korean":"원문에 'it is difficult to make reasoned business or policy judgments'라고 하여, 인식 없이는 판단이 '어렵다'고 했다. '가능하다'는 불일치.","analysis":"❌ ③ 'it is difficult to make reasoned judgments' → 합리적 판단이 어렵다 ≠ 가능하다 → 불일치<br>✅ ① inextricably associated with geography: where → 일치<br>✅ ② starts from the premise → 일치<br>✅ ④ the location of roads and utilities → 일치<br>✅ ⑤ the spatial consequences of discrimination → 일치","tip":"without ~ it is difficult to V = ~없이는 V하기 어렵다 (불가능이 아닌 어려움)"}},
{"id":9,"type":"내용불일치","diff":"보통","pts":5,"fmt":"mc","ans":4,"ch":["지리학의 핵심 질문에는 '왜 거기서'라는 질문이 포함된다.","가장 단순한 일상 활동도 공간적 상황에 대한 인식이 필요하다.","지구 표면의 현상 배치를 모르면 사건을 이해하기 어렵다.","새 매장 입지 선정 시 사회경제적 패턴도 고려 대상이다.","이주를 이해하기 위해 고려해야 할 요인에 도로와 시설의 위치가 포함된다."],"passage":P_GW,"stem":"다음 중 글의 내용과 <b>일치하지 않는</b> 것은?","det":{"korean":"도로와 시설의 위치(the location of roads and utilities)는 '새 매장 입지 선정'에서 고려하는 요인이지, '이주 이해' 요인이 아니다. 이주 이해 요인은 영토 정치 조직, 차별의 공간적 결과, 사회경제적 패턴, 물리적 환경 배치이다.","analysis":"❌ ⑤ roads and utilities는 Locating a new store 관련 → 이주 이해 요인이 아님 → 불일치<br>✅ ① why there questions → 일치<br>✅ ② even the simplest day-to-day activity requires → 일치<br>✅ ③ difficult to make sense of events → 일치<br>✅ ④ socio-economic patterns → 매장 입지 고려 요인에 포함 → 일치","tip":"두 문장(Locating~/Understanding~)의 고려 요인을 정확히 구분해야 한다"}},
{"id":10,"type":"빈칸추론","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["premise","conclusion","exception","obstacle","alternative"],"passage":"One word is inextricably associated with geography: where. That is because geography starts from the __________ that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"지리학이 '지구 표면에서 무언가의 위치가 중요하다'는 전제(premise)에서 출발한다는 의미이다.","analysis":"✅ ①premise(전제): starts from the premise that ~ = ~라는 전제에서 출발하다<br>❌ ②conclusion(결론): 출발이 아닌 도달점<br>❌ ③exception(예외): 문맥과 무관<br>❌ ④obstacle(장애물): 문맥과 무관<br>❌ ⑤alternative(대안): 문맥과 무관","tip":"premise = 전제, 가정 (start from the premise that ~ = ~라는 전제에서 출발하다)"}},
{"id":11,"type":"빈칸추론","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["arrangements","consequences","interconnections","distributions","organizations"],"passage":"One word is inextricably associated with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. Getting to such questions means taking spatial arrangements, variations, and __________ seriously.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"공간적 배열(arrangements), 변이(variations), 그리고 상호연결(interconnections)을 진지하게 받아들인다는 맥락이다.","analysis":"✅ ③interconnections(상호연결): arrangements, variations와 함께 공간적 요소의 세 가지 측면<br>❌ ①arrangements(배열): 이미 앞에 나옴<br>❌ ②consequences(결과): 문맥 부적절<br>❌ ④distributions(분포): 이 맥락에서 부적절<br>❌ ⑤organizations(조직): 이 맥락에서 부적절","tip":"spatial arrangements, variations, and interconnections = 공간적 배열, 변이, 상호연결 (지리학의 3요소)"}},
{"id":12,"type":"빈칸추론","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["spatial","temporal","financial","emotional","artificial"],"passage":"Engaging in even the simplest day-to-day activity requires some appreciation of __________ circumstances — where to find food and services, how to get to work places, and the like.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"음식과 서비스를 어디서 찾을지, 직장에 어떻게 갈지 등은 모두 공간적(spatial) 상황에 대한 이해이다.","analysis":"✅ ②spatial(공간적): where to find, how to get to 등 공간적 맥락<br>❌ ①temporal(시간적): 시간 아닌 공간 맥락<br>❌ ③financial(재정적): 재정 아닌 공간 맥락<br>❌ ④emotional(감정적): 감정 아닌 공간 맥락<br>❌ ⑤artificial(인공적): 문맥과 무관","tip":"spatial = 공간적인 (space의 형용사형). spatial circumstances = 공간적 상황/여건"}},
{"id":13,"type":"빈칸추론","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["observations","experiences","investments","distributions","instructions"],"passage":"Locating a new store or public service requires taking into consideration population __________, the location of roads and utilities, socio-economic patterns, and more.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"새 매장이나 공공서비스 입지 선정 시 인구 분포(population distributions)를 고려해야 한다는 맥락이다.","analysis":"✅ ④distributions(분포): population distributions = 인구 분포<br>❌ ①observations(관찰): population observations는 부자연스러움<br>❌ ②experiences(경험): population experiences는 부자연스러움<br>❌ ③investments(투자): population investments는 부자연스러움<br>❌ ⑤instructions(지시): population instructions는 비문","tip":"population distribution = 인구 분포 (지리학 핵심 개념)"}},
{"id":14,"type":"서술형","diff":"쉬움","pts":4,"fmt":"written","wa":"appreciation","accept":["appreciation","Appreciation"],"passage":"Engaging in even the simplest day-to-day activity requires some __________ (appreciate) of spatial circumstances — where to find food and services, how to get to work places, and the like.","stem":"다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.","det":{"korean":"appreciate(동사) → appreciation(명사): some + 명사 자리이므로 명사형으로 변환해야 한다.","analysis":"appreciate → appreciation: 동사 → 명사 변환<br>'some appreciation of ~' = ~에 대한 어느 정도의 이해/인식 (some + 명사 구조)","tip":"appreciate(동사: 인식하다/감사하다) → appreciation(명사: 인식/감사) — -ate → -ation 명사화"}},
{"id":15,"type":"서술형","diff":"보통","pts":5,"fmt":"written","wa":"consideration","accept":["consideration","Consideration"],"passage":"Locating a new store or public service requires taking into __________ (consider) population distributions, the location of roads and utilities, socio-economic patterns, and more.","stem":"다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.","det":{"korean":"consider(동사) → consideration(명사): take into consideration(~을 고려하다) 숙어 표현에서 명사가 필요하다.","analysis":"consider → consideration: 동사 → 명사 변환<br>'take into consideration' = ~을 고려하다 (숙어 표현)","tip":"take into consideration = consider = ~을 고려하다. consideration은 consider의 명사형"}},
{"id":16,"type":"서술형","diff":"보통","pts":5,"fmt":"written","wa":"discrimination","accept":["discrimination","Discrimination"],"passage":"Understanding why and where migration happens requires consideration of the political organization of territory, the spatial consequences of __________ (discriminate), socio-economic patterns, and the layout of the physical environment.","stem":"다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.","det":{"korean":"discriminate(동사) → discrimination(명사): of + 명사 구조이므로 명사형이 필요하다.","analysis":"discriminate → discrimination: 동사 → 명사 변환<br>'the spatial consequences of discrimination' = 차별의 공간적 결과 (of + 명사 구조)","tip":"discriminate(동사: 차별하다) → discrimination(명사: 차별) — -ate → -ation 명사화"}},

function getLevel(s){if(s>=95)return{name:'마스터',icon:'👑',range:'95~100',msg:'이 단원은 정복했어요!'};if(s>=85)return{name:'챌린저',icon:'🌟',range:'85~94',msg:'거의 완벽, 한 끗 차이!'};if(s>=75)return{name:'파이터',icon:'💎',range:'75~84',msg:'통과! 약점만 잡으면 마스터'};if(s>=50)return{name:'루키',icon:'🔥',range:'50~74',msg:'기본기 OK, 유형별 훈련 필요'};return{name:'스타터',icon:'📖',range:'0~49',msg:'지문 해석부터 다시!'};}
function getTypeAdvice(t){const m={'(A)(B)(C) 조합형':'반의어 함정 주의, 원문 단어 정확히 암기','문맥상 부적절한 어휘':'밑줄 단어가 반의어로 바뀌었는지 확인','동의어 고르기':'동의어 쌍을 세트로 묶어 암기','반의어 고르기':'반의어 쌍을 세트로 묶어 암기','빈칸 어휘 완성':'문맥 단서(clue) 찾기 연습 필요','다의어 문맥적 의미':'다의어의 여러 뜻을 문맥별로 구분','영영풀이 매칭':'영영사전 정의 읽기 연습','어형 변환 (서술형)':'품사 변환 규칙(명↔형, 동↔명) 정리','빈칸 문맥 완성':'글의 흐름과 논리적 연결 파악','어법':'핵심 어법 규칙 정리 및 반복 연습','내용일치':'지문과 선지를 꼼꼼히 대조','내용불일치':'함정 선지의 미세한 차이 찾기','T/F':'원문과 진술을 정확히 대조','서술형':'정확한 철자와 어형 변환 주의','빈칸추론':'빈칸 전후 문맥 단서 찾기','빈칸 추론':'빈칸 전후 문맥 단서 찾기','문장삽입':'글의 흐름과 연결사 파악','어순배열':'문장 구조(S+V+O) 정확히 파악','어휘':'문맥에서 적절한 어휘 고르기 연습','내용이해':'지문 핵심 내용 정확히 파악'};return m[t]||'해당 유형 집중 복습 필요';}

let chHtml='';if(d.q.fmt==='mc'&&d.q.ch){chHtml=`<div style="margin-top:8px">`;d.q.ch.forEach((c,ci)=>{const isAns=ci===d.q.ans;const isMy=d.ans===ci;const color=isAns?'var(--o)':(isMy&&!d.ok?'var(--r)':'var(--tm)');const bg=isAns?'var(--oxl)':(isMy&&!d.ok?'var(--rl)':'transparent');const label=isAns?' ✅':(isMy&&!d.ok?' ❌':'');chHtml+=`<div style="padding:4px 8px;margin-bottom:2px;border-radius:6px;font-size:12px;color:${color};background:${bg}"><b>${mk[ci]}</b> ${c}${label}</div>`;});chHtml+=`</div>`;}
h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,8)}] ${d.q.diff} ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:10px"><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--oxl);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:10px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--oxl);color:var(--o)"><div style="font-size:10px;opacity:.7">정답</div>${ca}</div></div><div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📝 문제</div><div class="expl-box" style="font-size:12.5px;line-height:1.6;border-left:3px solid var(--b);margin-bottom:10px"><div style="font-weight:700;margin-bottom:6px">${d.q.stem}</div>${chHtml}</div>${d.q.passage?`<div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📖 원문</div><div class="expl-box" style="font-size:12px;line-height:1.75;border-left:3px solid #ddd;margin-bottom:10px">${d.q.passage}</div>`:''}${d.q.det?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean||''}</div><div class="expl-tag tip">📋 풀이 · 선지 분석</div><div class="expl-box" style="white-space:pre-line">${(d.q.det.analysis||'').replace(/\\n/g,'<br>')}</div><div class="expl-tag tip">💡 포인트</div><div class="expl-box tip-b">${d.q.det.tip||''}</div>`:''}</div></div>`;}); h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#7C3AED':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#F3F0FF,#E8E0FF':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#7C3AED':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
