<style>

*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}

.exam-scroll{display:none;}

.exam-progress-fill{height:100%;background:linear-gradient(90deg,var(--g),#0D9488);transition:width .5s ease;border-radius:0 2px 2px 0;}

.slide-wrap{height:calc(100vh - 55px);position:relative;overflow:hidden;}

.slide-choices .c-num{min-width:24px;height:24px;font-size:11px;background:rgba(0,0,0,.05);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--tm);flex-shrink:0;transition:all .2s;}
.slide-choices .choice-btn.selected .c-num{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}
/* Written input */
.slide-choices .written-input{width:100%;padding:12px 14px;font-size:14px;background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.06);border-radius:12px;font-family:inherit;}
.slide-choices .written-input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(22,163,74,.1);}
/* Navigation */
.slide-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;}
.slide-nav button{padding:8px 18px;border:1.5px solid rgba(0,0,0,.06);border-radius:10px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.slide-nav button:active{transform:scale(.95);}
.slide-nav button.sn-next{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(22,163,74,.25);}
.slide-nav button:disabled{opacity:.3;}
.slide-nav .nav-cur{font-size:12px;font-weight:800;color:var(--g);}
/* Answer count indicator */
.ans-count{position:fixed;top:58px;right:16px;z-index:99;font-size:11px;font-weight:700;color:var(--g);background:var(--gxl);padding:3px 10px;border-radius:12px;}
.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--gl);color:#166534;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}
.q-meta{display:flex;align-items:center;gap:8px;margin-left:auto;}.q-diff{font-size:11px;color:var(--tl);font-weight:600;background:#f0f5f1;padding:3px 10px;border-radius:10px;}.q-pts{font-size:12px;color:var(--g);font-weight:800;}
.q-body{padding:14px 16px;}
.q-passage{background:linear-gradient(135deg,#FAFDFB,#F5FAF6);border-left:3px solid var(--g);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}
.choice-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid #dde8df;border-radius:8px;cursor:pointer;transition:var(--tr);background:#fff;text-align:left;font-family:inherit;font-size:13px;line-height:1.4;}
.choice-btn:hover{border-color:var(--g);}.choice-btn.selected{border-color:var(--g);box-shadow:0 0 0 2px rgba(22,163,74,.12);background:var(--gxxl);}
.c-num{min-width:22px;height:22px;background:#e8efe9;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid #d0dcd2;border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--g);}
.r-hero{padding:48px 20px 36px;text-align:center;}.r-hero.pass{background:linear-gradient(160deg,var(--gxl),var(--gl));}.r-hero.fail{background:linear-gradient(160deg,#FFF3E8,#FFEAEA);}
.r-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:14px;font-weight:800;margin-bottom:16px;}.r-badge.pass{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;}.r-badge.fail{background:linear-gradient(135deg,var(--r),#C42A2A);color:#fff;}
.r-score{font-size:72px;font-weight:900;}.r-score sup{font-size:24px;color:var(--tl);}
.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8efe9;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),var(--gl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--gxxl);border-radius:var(--rs);border:1px solid #dde8df;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8efe9;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--gl);color:var(--g);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #dde8df;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--gxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--gxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}
.expl-tag{display:inline-flex;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px;margin-bottom:6px;}.expl-tag.ans{background:var(--gl);color:var(--g);}.expl-tag.tip{background:var(--gxl);color:var(--gd);}
.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

</style>

<body>

    <div class="info-row"><span class="info-label">시험</span><span class="info-value">2027학년도 EBS수능특강 영어</span></div>

<script>
const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"21강","lesson":"Gateway","title":"The Core Question of Geography","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_suneung_21_gw_v1"};

const PASSAGE=`One word is inextricably associated with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply "where" questions, though; they are "why there" and "so what" questions. Getting to such questions means taking spatial arrangements, variations, and interconnections seriously. Engaging in even the simplest day-to-day activity requires some appreciation of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some awareness of how phenomena are arranged on Earth's surface, it is difficult to make reasoned business or policy judgments, make sense of events, or grasp some of the basic forces shaping life on the planet. Locating a new store or public service requires taking into consideration population distributions, the location of roads and utilities, socio-economic patterns, and more. Understanding why and where migration happens requires consideration of the political organization of territory, the spatial consequences of discrimination, socio-economic patterns, and the layout of the physical environment.`;

const Q=[
{"id":1,"type":"(A)(B)(C) 조합형","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["premise — spatial — appreciation","conclusion — spatial — appreciation","premise — temporal — appreciation","premise — spatial — ignorance","conclusion — temporal — ignorance"],"passage":"One word is inextricably associated with geography: where. That is because geography starts from the <b>(A)</b> that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. Getting to such questions means taking <b>(B)</b> arrangements, variations, and interconnections seriously. Engaging in even the simplest day-to-day activity requires some <b>(C)</b> of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some awareness of how phenomena are arranged on Earth's surface, it is difficult to make reasoned business or policy judgments, make sense of events, or grasp some of the basic forces shaping life on the planet. Locating a new store or public service requires taking into consideration population distributions, the location of roads and utilities, socio-economic patterns, and more. Understanding why and where migration happens requires consideration of the political organization of territory, the spatial consequences of discrimination, socio-economic patterns, and the layout of the physical environment.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"지리학은 지표면에서 어떤 일이 어디에서 일어나는지가 중요하다는 <b>전제(premise)</b>에서 출발하며, <b>공간적(spatial)</b> 배열을 진지하게 고려해야 합니다. 가장 단순한 일상 활동조차도 공간적 상황에 대한 어느 정도의 <b>이해(appreciation)</b>를 필요로 합니다.","analysis":"✅ ① premise — spatial — appreciation: 원문과 일치<br>❌ ② conclusion(결론)은 premise(전제)의 반의어<br>❌ ③ temporal(시간적)은 spatial(공간적)과 다른 의미<br>❌ ④ ignorance(무지)는 appreciation(이해)의 반의어<br>❌ ⑤ 세 단어 모두 원문과 불일치","tip":"premise(전제), spatial(공간의), appreciation(이해, 인식) — 지리학의 핵심 개념 어휘"}},

{"id":2,"type":"내용이해","diff":"어려움","pts":6,"fmt":"mc","ans":0,"ch":["awareness — reasoned — distributions","awareness — irrational — distributions","ignorance — reasoned — distributions","awareness — reasoned — restrictions","ignorance — irrational — restrictions"],"passage":"One word is inextricably associated with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. Getting to such questions means taking spatial arrangements, variations, and interconnections seriously. Engaging in even the simplest day-to-day activity requires some appreciation of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some <b>(A)</b> of how phenomena are arranged on Earth's surface, it is difficult to make <b>(B)</b> business or policy judgments, make sense of events, or grasp some of the basic forces shaping life on the planet. Locating a new store or public service requires taking into consideration population <b>(C)</b>, the location of roads and utilities, socio-economic patterns, and more. Understanding why and where migration happens requires consideration of the political organization of territory, the spatial consequences of discrimination, socio-economic patterns, and the layout of the physical environment.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"지표면에서 현상이 어떻게 배열되어 있는지에 대한 <b>인식(awareness)</b> 없이는 <b>합리적인(reasoned)</b> 사업이나 정책 판단을 내리기 어렵습니다. 새 매장이나 공공 서비스의 입지를 정하려면 인구 <b>분포(distributions)</b>를 고려해야 합니다.","analysis":"✅ ① awareness — reasoned — distributions: 원문과 일치<br>❌ ② irrational(비합리적)은 reasoned(합리적인)의 반의어<br>❌ ③ ignorance(무지)는 awareness(인식)의 반의어<br>❌ ④ restrictions(제한)은 distributions(분포)와 다른 의미<br>❌ ⑤ 세 단어 모두 원문과 불일치","tip":"awareness(인식), reasoned(합리적인), distribution(분포) — 지리적 분석 핵심 어휘"}},

{"id":3,"type":"내용이해","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["① inextricably","② premise","③ spatial","④ indifference","⑤ reasoned"],"passage":"One word is <u>① inextricably</u> associated with geography: where. That is because geography starts from the <u>② premise</u> that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. Getting to such questions means taking <u>③ spatial</u> arrangements, variations, and interconnections seriously. Engaging in even the simplest day-to-day activity requires some <u>④ indifference</u> of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some awareness of how phenomena are arranged on Earth's surface, it is difficult to make <u>⑤ reasoned</u> business or policy judgments, make sense of events, or grasp some of the basic forces shaping life on the planet.","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"가장 단순한 일상 활동조차도 공간적 상황에 대한 어느 정도의 <b>이해(appreciation)</b>를 필요로 합니다. indifference(무관심)는 appreciation(이해, 인식)의 반의어로, 문맥에 맞지 않습니다.","analysis":"✅ ① inextricably(풀 수 없게): 지리학과 '어디'가 분리 불가하다는 뜻으로 적절<br>✅ ② premise(전제): 지리학의 출발점을 나타내어 적절<br>✅ ③ spatial(공간의): 배열, 변이, 상호연결의 수식어로 적절<br>❌ ④ indifference(무관심) → appreciation(이해): 반의어 교체<br>✅ ⑤ reasoned(합리적인): 사업이나 정책 판단을 수식하여 적절","tip":"appreciation(이해, 인식) ↔ indifference(무관심)"}},

{"id":4,"type":"내용이해","diff":"보통","pts":5,"fmt":"mc","ans":4,"ch":["① associated","② appreciation","③ awareness","④ grasp","⑤ insignificance"],"passage":"One word is <u>① associated</u> with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. Getting to such questions means taking spatial arrangements, variations, and interconnections seriously. Engaging in even the simplest day-to-day activity requires some <u>② appreciation</u> of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some <u>③ awareness</u> of how phenomena are arranged on Earth's surface, it is difficult to make reasoned business or policy judgments, make sense of events, or <u>④ grasp</u> some of the basic forces shaping life on the planet. Locating a new store or public service requires taking into <u>⑤ insignificance</u> population distributions, the location of roads and utilities, socio-economic patterns, and more.","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"새 매장이나 공공 서비스의 입지를 정하려면 인구 분포, 도로와 공공시설의 위치 등을 <b>고려(consideration)</b>해야 합니다. insignificance(무의미)는 consideration(고려)의 반의어로, 문맥에 맞지 않습니다.","analysis":"✅ ① associated(연관된): 지리학과 '어디'의 관계로 적절<br>✅ ② appreciation(이해): 공간적 상황에 대한 이해로 적절<br>✅ ③ awareness(인식): 현상 배열에 대한 인식으로 적절<br>✅ ④ grasp(파악하다): 기본 동력을 파악한다는 뜻으로 적절<br>❌ ⑤ insignificance(무의미) → consideration(고려): 반의어 교체","tip":"consideration(고려) ↔ insignificance(무의미, 하찮음)"}},

{"id":5,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["separably","independently","inseparably","loosely","optionally"],"passage":"One word is <u>inextricably</u> associated with geography: where.","stem":"밑줄 친 inextricably와 의미가 가장 가까운 것은?","det":{"korean":"하나의 단어가 지리학과 <b>풀 수 없게(inextricably)</b> 연관되어 있습니다.","analysis":"✅ inseparably(분리할 수 없게): inextricably의 동의어<br>❌ separably(분리 가능하게): inextricably의 반의어<br>❌ independently(독립적으로): inextricably와 반대 의미<br>❌ loosely(느슨하게): inextricably와 반대 의미<br>❌ optionally(선택적으로): 전혀 다른 의미","tip":"inextricably = inseparably (풀 수 없게, 분리할 수 없게)"}},

{"id":6,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["comprehend","release","ignore","abandon","reject"],"passage":"It is difficult to make reasoned business or policy judgments, make sense of events, or <u>grasp</u> some of the basic forces shaping life on the planet.","stem":"밑줄 친 grasp와 의미가 가장 가까운 것은?","det":{"korean":"합리적인 사업이나 정책 판단을 내리거나, 행성의 삶을 형성하는 기본적인 힘을 <b>파악하기(grasp)</b> 어렵습니다.","analysis":"✅ comprehend(이해하다): grasp의 동의어(지적 이해의 의미)<br>❌ release(놓아주다): grasp의 물리적 의미의 반의어<br>❌ ignore(무시하다): 이해와 반대 개념<br>❌ abandon(포기하다): 전혀 다른 의미<br>❌ reject(거부하다): 전혀 다른 의미","tip":"grasp = comprehend = understand (파악하다, 이해하다)"}},

{"id":7,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["assumption","hypothesis","theory","foundation","guess"],"passage":"Geography starts from the <u>premise</u> that it matters where something takes place on Earth's surface.","stem":"밑줄 친 premise와 의미가 가장 가까운 것은?","det":{"korean":"지리학은 지표면에서 어떤 일이 어디에서 일어나는지가 중요하다는 <b>전제(premise)</b>에서 출발합니다.","analysis":"✅ foundation(토대, 기초): premise와 같이 논리의 출발점이라는 의미 공유<br>❌ assumption(가정): 증명 없이 받아들이는 것으로, premise보다 약한 의미<br>❌ hypothesis(가설): 검증이 필요한 추측<br>❌ theory(이론): 체계적 설명으로 premise와 다른 층위<br>❌ guess(추측): 근거 없는 짐작","tip":"premise = foundation = basis (전제, 토대) — 논리적 출발점"}},

{"id":8,"type":"반의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":1,"ch":["recognition","ignorance","understanding","knowledge","perception"],"passage":"Engaging in even the simplest day-to-day activity requires some <u>awareness</u> of how phenomena are arranged on Earth's surface.","stem":"밑줄 친 awareness와 의미가 가장 반대인 것은?","det":{"korean":"가장 단순한 일상 활동조차도 현상이 지표면에서 어떻게 배열되어 있는지에 대한 <b>인식(awareness)</b>을 필요로 합니다.","analysis":"✅ ignorance(무지): awareness의 정확한 반의어<br>❌ recognition(인식): awareness의 동의어<br>❌ understanding(이해): awareness의 유의어<br>❌ knowledge(지식): awareness의 유의어<br>❌ perception(인지): awareness의 유의어","tip":"awareness(인식) ↔ ignorance(무지), unawareness(무인식)"}},

{"id":9,"type":"반의어 고르기","diff":"어려움","pts":6,"fmt":"mc","ans":4,"ch":["logical","sensible","sound","judicious","irrational"],"passage":"Without some awareness of how phenomena are arranged on Earth's surface, it is difficult to make <u>reasoned</u> business or policy judgments.","stem":"밑줄 친 reasoned와 의미가 가장 반대인 것은?","det":{"korean":"지표면에서 현상이 어떻게 배열되어 있는지에 대한 인식 없이는 <b>합리적인(reasoned)</b> 사업이나 정책 판단을 내리기 어렵습니다.","analysis":"✅ irrational(비합리적인): reasoned의 정확한 반의어<br>❌ logical(논리적인): reasoned의 동의어<br>❌ sensible(분별 있는): reasoned의 유의어<br>❌ sound(건전한, 타당한): reasoned의 유의어<br>❌ judicious(현명한): reasoned의 유의어","tip":"reasoned(합리적인) ↔ irrational(비합리적인), unreasonable(불합리한)"}},

{"id":10,"type":"내용이해","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["rejection","indifference","confusion","appreciation","hostility"],"passage":"One word is inextricably associated with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. Getting to such questions means taking spatial arrangements, variations, and interconnections seriously. Engaging in even the simplest day-to-day activity requires some __________ of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some awareness of how phenomena are arranged on Earth's surface, it is difficult to make reasoned business or policy judgments, make sense of events, or grasp some of the basic forces shaping life on the planet. Locating a new store or public service requires taking into consideration population distributions, the location of roads and utilities, socio-economic patterns, and more. Understanding why and where migration happens requires consideration of the political organization of territory, the spatial consequences of discrimination, socio-economic patterns, and the layout of the physical environment.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"가장 단순한 일상 활동조차도 공간적 상황에 대한 어느 정도의 <b>이해(appreciation)</b>를 필요로 합니다. 음식과 서비스를 어디서 찾고, 직장에 어떻게 가는지 등을 파악해야 합니다.","analysis":"✅ ④ appreciation(이해, 인식): 공간적 상황을 이해한다는 문맥에 적절<br>❌ ① rejection(거부): 문맥과 반대<br>❌ ② indifference(무관심): 문맥과 반대<br>❌ ③ confusion(혼란): 일상 활동에 필요한 것으로 부적절<br>❌ ⑤ hostility(적대감): 전혀 무관한 의미","tip":"appreciation = understanding, recognition (이해, 인식)"}},

{"id":11,"type":"내용이해","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["separation","isolation","migration","stagnation","reduction"],"passage":"One word is inextricably associated with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. Getting to such questions means taking spatial arrangements, variations, and interconnections seriously. Engaging in even the simplest day-to-day activity requires some appreciation of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some awareness of how phenomena are arranged on Earth's surface, it is difficult to make reasoned business or policy judgments, make sense of events, or grasp some of the basic forces shaping life on the planet. Locating a new store or public service requires taking into consideration population distributions, the location of roads and utilities, socio-economic patterns, and more. Understanding why and where __________ happens requires consideration of the political organization of territory, the spatial consequences of discrimination, socio-economic patterns, and the layout of the physical environment.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"<b>이주(migration)</b>가 왜, 어디에서 발생하는지를 이해하려면 영토의 정치적 조직, 차별의 공간적 영향, 사회경제적 패턴, 물리적 환경의 배치를 고려해야 합니다.","analysis":"✅ ③ migration(이주): 영토, 차별, 환경 등의 고려 요인과 자연스럽게 연결<br>❌ ① separation(분리): 문맥과 맞지 않음<br>❌ ② isolation(고립): 이주와 반대 개념<br>❌ ④ stagnation(정체): 문맥과 맞지 않음<br>❌ ⑤ reduction(감소): 전혀 무관한 의미","tip":"migration(이주) — 정치, 경제, 환경적 요인에 의해 발생하는 인구 이동"}},

{"id":12,"type":"내용이해","diff":"어려움","pts":6,"fmt":"mc","ans":0,"ch":["discrimination","celebration","cooperation","communication","innovation"],"passage":"One word is inextricably associated with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. Getting to such questions means taking spatial arrangements, variations, and interconnections seriously. Engaging in even the simplest day-to-day activity requires some appreciation of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some awareness of how phenomena are arranged on Earth's surface, it is difficult to make reasoned business or policy judgments, make sense of events, or grasp some of the basic forces shaping life on the planet. Locating a new store or public service requires taking into consideration population distributions, the location of roads and utilities, socio-economic patterns, and more. Understanding why and where migration happens requires consideration of the political organization of territory, the spatial consequences of __________, socio-economic patterns, and the layout of the physical environment.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"이주가 발생하는 이유를 이해하려면 영토의 정치적 조직, <b>차별(discrimination)</b>의 공간적 결과, 사회경제적 패턴, 물리적 환경의 배치를 고려해야 합니다.","analysis":"✅ ① discrimination(차별): 이주의 원인으로서 공간적 결과를 낳는 사회적 요인<br>❌ ② celebration(축하): 이주 원인과 무관<br>❌ ③ cooperation(협력): 공간적 결과로 이어지는 부정적 요인이 아님<br>❌ ④ communication(소통): 이주의 직접적 원인이 아님<br>❌ ⑤ innovation(혁신): 이주의 공간적 결과와 맞지 않음","tip":"discrimination(차별) — 인종, 종교, 성별 등에 의한 차별은 이주의 주요 원인"}},

{"id":13,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["가치 상승","이해, 인식","감사","감상","진가를 알아봄"],"passage":"Engaging in even the simplest day-to-day activity requires some <u>appreciation</u> of spatial circumstances.","stem":"밑줄 친 appreciation이 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"가장 단순한 일상 활동조차도 공간적 상황에 대한 어느 정도의 <b>이해(appreciation)</b>를 필요로 합니다.","analysis":"✅ 이해, 인식: 공간적 상황을 '파악하고 이해한다'는 문맥에 정확히 일치<br>❌ 가치 상승: 부동산이나 자산의 가치 상승 의미(여기서는 해당 안 됨)<br>❌ 감사: 고마움을 표현하는 의미(여기서는 해당 안 됨)<br>❌ 감상: 예술 작품 등의 감상(여기서는 해당 안 됨)<br>❌ 진가를 알아봄: 가치를 인정한다는 의미(여기서는 해당 안 됨)","tip":"appreciation은 다의어: ① 감사 ② 이해/인식 ③ 가치 상승 ④ 감상 — 문맥에 따라 구분"}},

{"id":14,"type":"다의어 문맥적 의미","diff":"어려움","pts":6,"fmt":"mc","ans":0,"ch":["배치, 구성","가로, 횡","(신문의) 레이아웃","배열판","설계도"],"passage":"Understanding migration requires consideration of the <u>layout</u> of the physical environment.","stem":"밑줄 친 layout이 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"이주가 발생하는 이유를 이해하려면 물리적 환경의 <b>배치(layout)</b>를 고려해야 합니다.","analysis":"✅ 배치, 구성: 물리적 환경이 어떻게 구성되고 배열되어 있는지의 의미<br>❌ 가로, 횡: layout의 일반적 의미가 아님<br>❌ (신문의) 레이아웃: 인쇄/출판 용어(여기서는 해당 안 됨)<br>❌ 배열판: 기술적 용어(여기서는 해당 안 됨)<br>❌ 설계도: 건축 용어(여기서는 해당 안 됨)","tip":"layout은 다의어: ① 배치/구성 ② 지면 배열 ③ 설계 — 물리적 환경의 구성을 의미"}},

{"id":15,"type":"영영풀이 매칭","diff":"쉬움","pts":4,"fmt":"mc","ans":3,"ch":["premise","appreciation","migration","distribution","consequence"],"passage":"","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><b>\"the way in which something is spread over an area or among a group of people\"</b>","det":{"korean":"<b>distribution(분포)</b>: 어떤 것이 지역이나 집단 사이에 퍼져 있는 방식","analysis":"✅ distribution(분포): 지역이나 집단에 걸쳐 퍼져 있는 방식 = 정의와 정확히 일치<br>❌ premise(전제): 논리의 출발점<br>❌ appreciation(이해): 인식이나 감사<br>❌ migration(이주): 이동하는 행위<br>❌ consequence(결과): 어떤 일의 영향이나 결과","tip":"distribution = the way something is spread out (분포, 배분)"}},

{"id":16,"type":"영영풀이 매칭","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["arrangement","discrimination","distribution","migration","utility"],"passage":"","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><b>\"the unjust or prejudicial treatment of different categories of people, especially on the grounds of race, age, or sex\"</b>","det":{"korean":"<b>discrimination(차별)</b>: 특히 인종, 나이, 성별을 이유로 다른 범주의 사람들을 부당하거나 편견적으로 대우하는 것","analysis":"✅ discrimination(차별): 인종, 나이, 성별 등에 의한 부당한 대우 = 정의와 정확히 일치<br>❌ arrangement(배열): 무언가를 정리하거나 배치하는 것<br>❌ distribution(분포): 퍼져 있는 방식<br>❌ migration(이주): 한 곳에서 다른 곳으로 이동<br>❌ utility(공공시설): 전기, 가스, 수도 등의 서비스","tip":"discrimination = unjust treatment based on prejudice (차별, 편견적 대우)"}},

{"id":17,"type":"어형 변환 (서술형)","diff":"쉬움","pts":4,"fmt":"written","wa":"arrangements","accept":["arrangements","Arrangements"],"ch":null,"passage":"One word is inextricably associated with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. Getting to such questions means taking spatial __________ (arrange), variations, and interconnections seriously. Engaging in even the simplest day-to-day activity requires some appreciation of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some awareness of how phenomena are arranged on Earth's surface, it is difficult to make reasoned business or policy judgments, make sense of events, or grasp some of the basic forces shaping life on the planet. Locating a new store or public service requires taking into consideration population distributions, the location of roads and utilities, socio-economic patterns, and more. Understanding why and where migration happens requires consideration of the political organization of territory, the spatial consequences of discrimination, socio-economic patterns, and the layout of the physical environment.","stem":"주어진 단어를 문맥에 맞게 어형을 변환하여 빈칸에 쓰시오.","det":{"korean":"그러한 질문에 도달하려면 공간적 <b>배열(arrangements)</b>, 변이, 상호연결을 진지하게 받아들여야 합니다.","analysis":"arrange(동사: 배열하다) → arrangements(명사 복수: 배열들)<br>spatial _____와 variations, interconnections가 병렬 구조이므로 복수 명사 필요","tip":"arrange(동) → arrangement(명) → arrangements(복수) — 병렬 구조에서 복수형 주의"}},

{"id":18,"type":"어형 변환 (서술형)","diff":"보통","pts":5,"fmt":"written","wa":"consideration","accept":["consideration","Consideration"],"ch":null,"passage":"One word is inextricably associated with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. Getting to such questions means taking spatial arrangements, variations, and interconnections seriously. Engaging in even the simplest day-to-day activity requires some appreciation of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some awareness of how phenomena are arranged on Earth's surface, it is difficult to make reasoned business or policy judgments, make sense of events, or grasp some of the basic forces shaping life on the planet. Locating a new store or public service requires taking into consideration population distributions, the location of roads and utilities, socio-economic patterns, and more. Understanding why and where migration happens requires __________ (consider) of the political organization of territory, the spatial consequences of discrimination, socio-economic patterns, and the layout of the physical environment.","stem":"주어진 단어를 문맥에 맞게 어형을 변환하여 빈칸에 쓰시오.","det":{"korean":"이주가 발생하는 이유를 이해하려면 영토의 정치적 조직, 차별의 공간적 결과 등에 대한 <b>고려(consideration)</b>가 필요합니다.","analysis":"consider(동사: 고려하다) → consideration(명사: 고려)<br>requires _____ of 구조에서 동사 뒤에 명사 목적어가 필요","tip":"consider(동) → consideration(명) / considerable(형) / considerably(부) — 동사에서 명사로 변환"}},

{"id":19,"type":"내용이해","diff":"어려움","pts":6,"fmt":"mc","ans":1,"ch":["disconnections","interconnections","separations","contradictions","destructions"],"passage":"One word is inextricably associated with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. Getting to such questions means taking spatial arrangements, variations, and __________ seriously. Engaging in even the simplest day-to-day activity requires some appreciation of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some awareness of how phenomena are arranged on Earth's surface, it is difficult to make reasoned business or policy judgments, make sense of events, or grasp some of the basic forces shaping life on the planet. Locating a new store or public service requires taking into consideration population distributions, the location of roads and utilities, socio-economic patterns, and more. Understanding why and where migration happens requires consideration of the political organization of territory, the spatial consequences of discrimination, socio-economic patterns, and the layout of the physical environment.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"그러한 질문에 도달하려면 공간적 배열, 변이, 그리고 <b>상호연결(interconnections)</b>을 진지하게 받아들여야 합니다.","analysis":"✅ ② interconnections(상호연결): arrangements, variations와 병렬로 공간적 관계를 나타내어 적절<br>❌ ① disconnections(단절): 상호연결과 반대 의미<br>❌ ③ separations(분리): 연결이 아닌 분리로 문맥에 맞지 않음<br>❌ ④ contradictions(모순): 공간적 개념이 아님<br>❌ ⑤ destructions(파괴): 전혀 무관한 의미","tip":"interconnections(상호연결) = mutual connections between things (공간적 요소 간의 연결 관계)"}},

{"id":20,"type":"내용이해","diff":"보통","pts":5,"fmt":"mc","ans":4,"ch":["obstacles","conflicts","disasters","boundaries","utilities"],"passage":"One word is inextricably associated with geography: where. That is because geography starts from the premise that it matters where something takes place on Earth's surface. The key questions are not simply \"where\" questions, though; they are \"why there\" and \"so what\" questions. Getting to such questions means taking spatial arrangements, variations, and interconnections seriously. Engaging in even the simplest day-to-day activity requires some appreciation of spatial circumstances — where to find food and services, how to get to work places, and the like. Moving up in scale, without some awareness of how phenomena are arranged on Earth's surface, it is difficult to make reasoned business or policy judgments, make sense of events, or grasp some of the basic forces shaping life on the planet. Locating a new store or public service requires taking into consideration population distributions, the location of roads and __________, socio-economic patterns, and more. Understanding why and where migration happens requires consideration of the political organization of territory, the spatial consequences of discrimination, socio-economic patterns, and the layout of the physical environment.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"새 매장이나 공공 서비스의 입지를 정하려면 인구 분포, 도로와 <b>공공시설(utilities)</b>의 위치, 사회경제적 패턴 등을 고려해야 합니다.","analysis":"✅ ⑤ utilities(공공시설): 도로와 함께 입지 선정 시 고려할 인프라 요소로 적절<br>❌ ① obstacles(장애물): 입지 선정의 고려 요인으로 부적절<br>❌ ② conflicts(갈등): 도로와 병렬로 나열될 인프라가 아님<br>❌ ③ disasters(재해): 입지의 일반적 고려 요인이 아님<br>❌ ④ boundaries(경계): 도로와 같은 인프라 범주가 아님","tip":"utilities(공공시설) = 전기, 가스, 수도 등 공공 서비스 인프라"}}
];

const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx','어법':'tag-grammar','어휘 문맥':'tag-vocab','빈칸 추론':'tag-blank','서술형':'tag-written','내용 일치/불일치':'tag-content','TF 판별':'tag-tf','종합':'tag-ctx'};

let S={ans:[],cur:0,ti:null,left:EI.time,start:0};

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name,answers:S.ans.slice()});if(h.length>20)h.length=20;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map((x,idx)=>`<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade} · ${x.level||''}</div></div><div class="hi-right"><div class="hi-score" style="color:${x.score>=80?'var(--g)':'var(--r)'}">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div></div>${x.answers?`<button onclick="reviewHistory(${idx})" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid #dde8df;border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--g)">📝 정답·해설 다시 보기</button>`:''}</div>`).join('');p.style.display='block';}
function getLevel(s){if(s>=95)return{name:'마스터',icon:'👑',range:'95~100',msg:'이 단원은 정복했어요!'};if(s>=85)return{name:'챌린저',icon:'🌟',range:'85~94',msg:'거의 완벽, 한 끗 차이!'};if(s>=75)return{name:'파이터',icon:'💎',range:'75~84',msg:'통과! 약점만 잡으면 마스터'};if(s>=50)return{name:'루키',icon:'🔥',range:'50~74',msg:'기본기 OK, 유형별 훈련 필요'};return{name:'스타터',icon:'📖',range:'0~49',msg:'지문 해석부터 다시!'};}
function getTypeAdvice(t){const m={'(A)(B)(C) 조합형':'반의어 함정 주의, 원문 단어 정확히 암기','문맥상 부적절한 어휘':'밑줄 단어가 반의어로 바뀌었는지 확인','동의어 고르기':'동의어 쌍을 세트로 묶어 암기','반의어 고르기':'반의어 쌍을 세트로 묶어 암기','빈칸 어휘 완성':'문맥 단서(clue) 찾기 연습 필요','다의어 문맥적 의미':'다의어의 여러 뜻을 문맥별로 구분','영영풀이 매칭':'영영사전 정의 읽기 연습','어형 변환 (서술형)':'품사 변환 규칙(명↔형, 동↔명) 정리','빈칸 문맥 완성':'글의 흐름과 논리적 연결 파악','어법':'핵심 어법 규칙 정리 및 반복 연습','내용일치':'지문과 선지를 꼼꼼히 대조','내용불일치':'함정 선지의 미세한 차이 찾기','T/F':'원문과 진술을 정확히 대조','서술형':'정확한 철자와 어형 변환 주의','빈칸추론':'빈칸 전후 문맥 단서 찾기','빈칸 추론':'빈칸 전후 문맥 단서 찾기','문장삽입':'글의 흐름과 연결사 파악','어순배열':'문장 구조(S+V+O) 정확히 파악','어휘':'문맥에서 적절한 어휘 고르기 연습','내용이해':'지문 핵심 내용 정확히 파악'};return m[t]||'해당 유형 집중 복습 필요';}
function fmtTime(s){return Math.floor(s/60)+'분 '+s%60+'초';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function startExam(){
  const nm=document.getElementById('inpName').value.trim();
  if(!nm){toast('이름을 입력해주세요!');return;}
  S={ans:Array(EI.totalQ).fill(null),cur:0,ti:null,left:EI.time,start:Date.now(),order:shuffle([...Array(EI.totalQ).keys()])};
  showScreen('examScreen');
  showQ(0);
  startTimer();
  updateProgress();
  initSwipe();
}
function showQ(idx,direction){
  S.cur=idx;
  const qi=S.order?S.order[idx]:idx;
  const q=Q[qi];
  const tc=typeTag[q.type]||'';
  const mk='①②③④⑤';
  const pp=document.getElementById('slidePassage');
  if(direction){
    pp.classList.add(direction>0?'fade-out':'fade-in');
    setTimeout(()=>{
      renderContent(idx,qi,q,tc,mk,pp);
      pp.classList.remove('fade-out','fade-in');
    },150);
  } else {
    renderContent(idx,qi,q,tc,mk,pp);
  }
}
function renderContent(idx,qi,q,tc,mk,pp){
  let ph='<div class="q-badge"><div class="q-num">'+( idx+1)+'</div><span>'+q.type+'</span><span style="opacity:.6">'+q.diff+' \u00b7 '+q.pts+'\uc810</span></div>';
  if(q.passage) ph+='<div class="q-passage">'+q.passage+'</div>';
  else ph+='<div style="padding:30px;text-align:center;color:var(--tl)">\uc774 \ubb38\ud56d\uc740 \uc9c0\ubb38\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.</div>';
  pp.innerHTML=ph;
  pp.scrollTop=0;
  const bt=document.getElementById('slideBottom');

function selectAns(idx,ci){

function navQ(dir){

function updateProgress(){

function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';

h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🔍 내신핏 약점 진단</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'var(--g)':p>=50?'var(--o)':'var(--r)';const icon=p===100?'✅':p>=50?'⚠️':'❌';h+=`<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:13px">${icon}</span><span style="font-size:13px;font-weight:700;flex:1">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-size:13px;font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div>${p<100?`<div style="font-size:11px;color:var(--tm);margin-top:3px;padding-left:21px">→ ${getTypeAdvice(type)}</div>`:''}</div>`;});h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 내신핏 처방</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">👑</div><div class="plan-text"><h4>마스터 달성!</h4><p>이 단원은 완벽합니다. 다음 단원에 도전하세요!</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">🌟</div><div class="plan-text"><h4>통과! 마스터까지 한 끗</h4><p>아래 약점 유형만 집중하면 마스터 달성!</p></div>`;else if(pct>=50)h+=`<div class="plan-icon">🔥</div><div class="plan-text"><h4>기본기는 있어요!</h4><p>오답 해설을 꼼꼼히 확인하고, 약점 유형부터 공략하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>지문 해석부터!</h4><p>본문을 완벽히 이해한 뒤 재도전하세요. 해설의 한글 해석을 활용!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid" style="grid-template-columns:1fr 1fr"><button class="act-btn" onclick="shareImage()"><span class="act-icon">📸</span><span class="act-label">이미지 공유</span></button><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">텍스트 복사</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:(d.q.wa||'');const open=!d.ok;
let chHtml='';if(d.q.fmt==='mc'&&d.q.ch){chHtml=`<div style="margin-top:8px">`;d.q.ch.forEach((c,ci)=>{const isAns=ci===d.q.ans;const isMy=d.ans===ci;const color=isAns?'var(--g)':(isMy&&!d.ok?'var(--r)':'var(--tm)');const bg=isAns?'var(--gl)':(isMy&&!d.ok?'var(--rl)':'transparent');const label=isAns?' ✅':(isMy&&!d.ok?' ❌':'');chHtml+=`<div style="padding:4px 8px;margin-bottom:2px;border-radius:6px;font-size:12px;color:${color};background:${bg}"><b>${mk[ci]}</b> ${c}${label}</div>`;});chHtml+=`</div>`;}
h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,8)}] ${d.q.diff} ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:10px"><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:10px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:10px;opacity:.7">정답</div>${ca}</div></div><div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📝 문제</div><div class="expl-box" style="font-size:12.5px;line-height:1.6;border-left:3px solid var(--b);margin-bottom:10px"><div style="font-weight:700;margin-bottom:6px">${d.q.stem}</div>${chHtml}</div>${d.q.passage?`<div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📖 원문</div><div class="expl-box" style="font-size:12px;line-height:1.75;border-left:3px solid #ddd;margin-bottom:10px">${d.q.passage}</div>`:''}${d.q.det?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean||''}</div><div class="expl-tag tip">📋 풀이 · 선지 분석</div><div class="expl-box" style="white-space:pre-line">${(d.q.det.analysis||'').replace(/\\n/g,'<br>')}</div><div class="expl-tag tip">💡 포인트</div><div class="expl-box tip-b">${d.q.det.tip||''}</div>`:''}</div></div>`;}); h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}

function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}

adding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
