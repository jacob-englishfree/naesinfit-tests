passage:`The idea that our senses may be deceiving us was taken up by the French philosopher and mathematician René Descartes. <b>①</b> He realized that sometimes our senses give us a false impression — a straight stick in a glass of water appears to be bent, for example. <b>②</b> And if we know that they can be unreliable, it would be wrong to trust them completely — everything that we experience with our senses might be false. <b>③</b> If that is the case, though, we can never know anything for sure. <b>④</b> But Descartes then showed that there was one thing he could be sure of: In order to be deceived, he must exist, and exist as a thing that thinks.`,
stem:`다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class="q-given-sentence">It might even be that we are asleep, and that the world we are experiencing is no more than a dream, or that God or some mischievous power is making us believe things that are not really true.</div>`,
det:{korean:`감각으로 경험하는 모든 것이 거짓일 수 있다는 진술 직후, 더 극단적인 가능성(잠든 상태, 꿈, 악의적 힘)을 제시하는 것이 자연스럽다.`,analysis:`✅③: "everything...might be false" 뒤에 더 극단적 의심(꿈, 악의적 힘)이 이어짐<br>❌①: 아직 감각 오류 설명 전<br>❌②: 아직 신뢰불가 결론 전<br>❌④: 이미 확실성 논의로 전환`,tip:`"might be false" → "It might even be..." 로 의심이 점점 강화되는 흐름`}},

{id:2,type:'문장삽입',diff:'어려움',pts:6,fmt:'mc',ans:3,
ch:['①','②','③','④'],
passage:`The idea that our senses may be deceiving us was taken up by the French philosopher and mathematician René Descartes. He realized that sometimes our senses give us a false impression — a straight stick in a glass of water appears to be bent, for example. <b>①</b> And if we know that they can be unreliable, it would be wrong to trust them completely — everything that we experience with our senses might be false. <b>②</b> It might even be that we are asleep, and that the world we are experiencing is no more than a dream, or that God or some mischievous power is making us believe things that are not really true. <b>③</b> If that is the case, though, we can never know anything for sure. <b>④</b> In order to be deceived, he must exist, and exist as a thing that thinks.`,
stem:`다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class="q-given-sentence">But Descartes then showed that there was one thing he could be sure of:</div>`,
det:{korean:`"아무것도 확실히 알 수 없다"는 결론 뒤에 역접(But)으로 "확실한 것이 하나 있다"고 전환하는 것이 자연스럽다.`,analysis:`✅④: "can never know anything for sure" 뒤 → But(역접) + 확실한 것 제시<br>❌①: 아직 의심의 전개 중<br>❌②: 아직 극단적 의심 제시 전<br>❌③: 아직 결론 도출 전`,tip:`But(역접) = 앞의 부정적 결론을 뒤집는 전환 — "확실한 것 없음 → 하지만 하나 있음"`}},

{id:3,type:'어순배열',diff:'어려움',pts:6,fmt:'written',wa:'he could be sure he existed as something that was capable of thinking and reasoning',
accept:['he could be sure he existed as something that was capable of thinking and reasoning'],
passage:`The idea that our senses may be deceiving us was taken up by the French philosopher and mathematician René Descartes. ... But Descartes then showed that there was one thing he could be sure of: In order to be deceived, he must exist, and exist as a thing that thinks. So, although his senses could not be trusted, __________.`,
stem:`주어진 단어를 올바른 순서로 배열하시오.<div class="q-given-sentence">existed / something / he / reasoning / sure / thinking / as / capable / could / that / of / was / be / and / he</div>`,
det:{korean:`감각을 신뢰할 수 없지만, 생각하고 추론할 능력이 있는 존재로서 확실히 존재한다는 결론.`,analysis:`he could be sure(확신할 수 있었다) + he existed(존재했다) + as something(~로서) + that was capable of(~할 수 있는) + thinking and reasoning(생각하기와 추론하기)`,tip:`주절(he could be sure) + 종속절(he existed as something that was capable of ~ing)`}},

{id:4,type:'어순배열',diff:'보통',pts:5,fmt:'written',wa:'it would be wrong to trust them completely',
accept:['it would be wrong to trust them completely'],
passage:`The idea that our senses may be deceiving us was taken up by the French philosopher and mathematician René Descartes. He realized that sometimes our senses give us a false impression — a straight stick in a glass of water appears to be bent, for example. And if we know that they can be unreliable, __________ — everything that we experience with our senses might be false.`,
stem:`주어진 단어를 올바른 순서로 배열하시오.<div class="q-given-sentence">trust / be / them / to / completely / wrong / it / would</div>`,
det:{korean:`감각이 신뢰할 수 없다는 것을 알면, 완전히 믿는 것은 잘못일 것이다.`,analysis:`it(가주어) + would be(조동사+be) + wrong(형용사 보어) + to trust(진주어) + them(목적어) + completely(부사)`,tip:`가주어 it + would be + 형용사 + to V(진주어) 구문`}},

// 어법/어휘 SECOND
{id:5,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`The idea that our senses may be ①<u>deceiving</u> us was taken up by the French philosopher and mathematician René Descartes. He ②<u>realized</u> that sometimes our senses give us a false impression — a straight stick in a glass of water appears to be bent, for example. And if we know that they can be unreliable, it would be wrong ③<u>to trust</u> them completely — everything that we experience with our senses might be false. It might even be that we are asleep, and that the world we are experiencing is no more than a dream, or that God or some mischievous power is making us ④<u>to believe</u> things that are not really true. If that is the case, though, we can never know ⑤<u>anything</u> for sure.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`④ to believe → believe: make + 목적어 + 동사원형 (사역동사 구문). to부정사가 아닌 원형부정사가 와야 한다.`,analysis:`❌④to believe: make(사역동사) + us(목적어) + believe(원형부정사)<br>✅①deceiving: may be + ~ing(진행형)<br>✅②realized: 과거시제<br>✅③to trust: it would be wrong + to V<br>✅⑤anything: never + anything(부정어+any)`,tip:`make + 목적어 + 원형부정사 (사역동사 구문)`}},

{id:6,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['①','②','③','④','⑤'],
passage:`The idea that our senses may be deceiving us was ①<u>taken</u> up by the French philosopher and mathematician René Descartes. He realized that sometimes our senses ②<u>give</u> us a false impression — a straight stick in a glass of water appears ③<u>to be bent</u>, for example. And if we know that they can be unreliable, it would be wrong to trust them completely — everything ④<u>what</u> we experience with our senses might be false. It might even be that we are asleep, and that the world we are ⑤<u>experiencing</u> is no more than a dream.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`④ what → that: everything 뒤에는 관계대명사 that이 와야 한다. what은 선행사를 포함하므로 everything과 함께 쓸 수 없다.`,analysis:`❌④what: everything(선행사) + that(관계대명사) → what은 선행사 포함이므로 불가<br>✅①taken: was taken up(수동태)<br>✅②give: our senses(복수주어) + give<br>✅③to be bent: appears + to V<br>✅⑤experiencing: are experiencing(진행형)`,tip:`everything/anything/nothing + that (O) / everything + what (X)`}},

{id:7,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:1,
ch:['deceiving','deceived','to deceive','being deceived'],"passage":"The idea that our senses may be __________ us was taken up by the French philosopher and mathematician René Descartes.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"may be + 현재분사 = 진행형. 감각이 능동적으로 우리를 속이고 있을 수 있다.","analysis":"✅①deceiving: may be + ~ing(진행형/능동)<br>❌②deceived: 과거분사(수동)<br>❌③to deceive: 부정사<br>❌④being deceived: 수동진행(의미 반대)","tip":"may be + ~ing = ~하고 있을 수 있다 (능동 진행형 추측)"}},

{id:8,type:'어휘',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['①','②','③','④','⑤'],
passage:`The idea that our senses may be deceiving us was taken up by the French philosopher and mathematician René Descartes. He realized that sometimes our senses give us a ①<u>false</u> impression — a straight stick in a glass of water appears to be bent, for example. And if we know that they can be ②<u>unreliable</u>, it would be wrong to trust them ③<u>completely</u> — everything that we experience with our senses might be false. It might even be that we are asleep, and that the world we are experiencing is no more than a dream, or that God or some ④<u>benevolent</u> power is making us believe things that are not really true. If that is the case, though, we can never know anything for sure.`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`④ benevolent(자비로운) → mischievous(장난기 많은): 사실이 아닌 것을 믿게 만드는 힘은 자비로운 것이 아니라 장난스러운/악의적인 것이다.`,analysis:`❌④benevolent(자비로운): 원문은 mischievous(장난기 많은) → 속이는 힘이므로 자비롭다는 것은 부적절<br>✅①false ✅②unreliable ✅③completely`,tip:`mischievous(장난기 많은, 해로운) ↔ benevolent(자비로운, 친절한)`}},

{id:9,type:'어휘',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`The idea that our senses may be deceiving us was taken up by the French philosopher and mathematician René Descartes. He realized that sometimes our senses give us a false ①<u>impression</u> — a straight stick in a glass of water appears to be bent, for example. And if we know that they can be unreliable, it would be wrong to trust them completely — everything that we experience with our senses might be ②<u>false</u>. It might even be that we are asleep, and that the world we are experiencing is no more than a ③<u>dream</u>. ... But Descartes then showed that there was one thing he could be sure of: In order to be deceived, he must ④<u>exist</u>, and exist as a thing that thinks. So, although his senses could not be trusted, he could be sure he existed as something that was ⑤<u>incapable</u> of thinking and reasoning.`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`⑤ incapable(~할 수 없는) → capable(~할 수 있는): 데카르트는 생각하고 추론할 능력이 있는 존재라고 확신했다.`,analysis:`❌⑤incapable: 원문은 capable → 생각하고 추론할 능력이 있다는 결론이므로 incapable은 부적절<br>✅①impression ✅②false ✅③dream ✅④exist`,tip:`capable(~할 수 있는) ↔ incapable(~할 수 없는)`}},

{id:10,type:'빈칸추론',diff:'어려움',pts:6,fmt:'mc',ans:3,
ch:['receipt','discount','apology','impression','replacement'],
passage:`The idea that our senses may be deceiving us was taken up by the French philosopher and mathematician René Descartes. He realized that sometimes our senses give us a false __________ — a straight stick in a glass of water appears to be bent, for example. And if we know that they can be unreliable, it would be wrong to trust them completely — everything that we experience with our senses might be false.`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`감각이 때때로 거짓 인상(impression)을 준다. 물속 막대가 구부러져 보이는 것이 그 예시.`,analysis:`✅④impression(인상): false impression = 잘못된 인상/착각<br>❌①receipt(영수증) ❌②discount(할인) ❌③apology(사과) ❌⑤replacement(교체)`,tip:`impression = 인상, 느낌 / false impression = 잘못된 인상, 착각`}},

{id:11,type:'빈칸추론',diff:'보통',pts:5,fmt:'mc',ans:2,
ch:['disappear','sleep','exist','escape','forget'],
passage:`But Descartes then showed that there was one thing he could be sure of: In order to be deceived, he must __________, and __________ as a thing that thinks. So, although his senses could not be trusted, he could be sure he existed as something that was capable of thinking and reasoning.`,
stem:`다음 빈칸에 공통으로 들어갈 말로 가장 적절한 것은?`,
det:{korean:`속임을 당하려면 반드시 존재(exist)해야 한다.`,analysis:`✅③exist: 속임을 당하려면 존재해야 함 = cogito ergo sum<br>❌①disappear ❌②sleep ❌④escape ❌⑤forget`,tip:`exist = 존재하다 — 데카르트의 핵심 논증`}},

{id:12,type:'빈칸추론',diff:'쉬움',pts:4,fmt:'mc',ans:1,
ch:['reliable','unreliable','invisible','inevitable'],
passage:`He realized that sometimes our senses give us a false impression — a straight stick in a glass of water appears to be bent, for example. And if we know that they can be __________, it would be wrong to trust them completely.`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`감각이 거짓 인상을 줄 수 있으므로 신뢰할 수 없다(unreliable)는 것을 알면 완전히 믿으면 안 된다.`,analysis:`✅②unreliable: false impression → unreliable의 논리적 흐름<br>❌①reliable: 문맥과 반대<br>❌③invisible: 보이지 않는(무관)<br>❌④inevitable: 피할 수 없는(무관)`,tip:`unreliable = 신뢰할 수 없는 (un- + reliable)`}},

// 서술형/내용/TF LAST
{id:13,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'to trust',
accept:['to trust','To trust'],
passage:`The idea that our senses may be deceiving us was taken up by the French philosopher and mathematician René Descartes. He realized that sometimes our senses give us a false impression — a straight stick in a glass of water appears to be bent, for example. And if we know that they can be unreliable, it would be wrong __________ (trust) them completely — everything that we experience with our senses might be false.`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`it would be wrong + to V: 가주어-진주어 구문에서 진주어는 to부정사.`,analysis:`it(가주어) + would be wrong + to trust(진주어) = ~하는 것은 잘못일 것이다`,tip:`It + be + 형용사 + to V (가주어-진주어 구문)`}},

{id:14,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'deceived',
accept:['deceived','Deceived'],
passage:`But Descartes then showed that there was one thing he could be sure of: In order to be __________ (deceive), he must exist, and exist as a thing that thinks.`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`to be + p.p. = 수동태 부정사. 속임을 당하려면(to be deceived).`,analysis:`deceive(동사) → deceived(과거분사): to be + p.p. = 수동태<br>"속임을 당하다" = be deceived (수동)`,tip:`to be + p.p. = 수동태 부정사 (be deceived = 속임을 당하다)`}},

{id:15,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'mathematician',
accept:['mathematician','Mathematician'],
passage:P,
stem:`데카르트의 직업 두 가지 중 '철학자'가 아닌 다른 하나를 본문에서 영어로 쓰시오.`,
det:{korean:`"the French philosopher and mathematician" → mathematician(수학자)`,analysis:`philosopher(철학자) + mathematician(수학자) = 데카르트의 두 가지 직업`,tip:`mathematician = 수학자 (mathematics + -ian)`}},

{id:16,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'impression',
accept:['impression','Impression'],
passage:P,
stem:`감각이 때때로 우리에게 줄 수 있는 거짓된 것(false ______)을 본문에서 1단어로 쓰시오.`,
det:{korean:`"our senses give us a false impression" → impression(인상)`,analysis:`false impression = 거짓 인상/착각<br>물속 막대 예시와 연결되는 핵심 어휘`,tip:`impression = 인상, 느낌 (false impression = 잘못된 인상)`}},

{id:17,type:'내용이해',diff:'보통',pts:5,fmt:'mc',ans:2,
ch:['감각은 항상 정확하다','모든 것은 꿈이다','의심해도 존재 자체는 확실하다','신은 우리를 속이고 있다','수학만이 진리이다'],
passage:P,
stem:`이 글의 주제로 가장 적절한 것은?`,
det:{korean:`데카르트의 핵심 주장: 모든 것을 의심해도 "생각하는 존재로서의 나의 존재"는 확실하다.`,analysis:`✅③: 의심의 과정을 거쳐 존재의 확실성에 도달<br>❌①: 감각은 불확실하다고 함<br>❌②: 꿈은 가능성일 뿐<br>❌④: 가능성 제시일 뿐<br>❌⑤: 수학 언급 없음`,tip:`글의 핵심 = doubt(의심) → certainty(확실성) = cogito ergo sum`}},

{id:18,type:'내용이해',diff:'쉬움',pts:4,fmt:'mc',ans:1,
ch:['데카르트는 감각을 완전히 신뢰할 수 있다고 주장했다.','데카르트는 감각이 우리를 속일 수 있다고 생각했다.','데카르트는 꿈과 현실을 구분할 수 없다고 했다.','데카르트는 신의 존재를 부정했다.','데카르트는 수학자가 아니었다.'],
passage:P,
stem:`위 글의 내용과 <b>일치하는</b> 것은?`,
det:{korean:`데카르트는 감각이 우리를 속일 수 있다(senses may be deceiving us)고 생각했다.`,analysis:`✅②: "our senses may be deceiving us" = 감각이 속일 수 있다<br>❌①: 신뢰할 수 없다고 함(반대)<br>❌③: 구분 불가가 아닌 가능성 제시<br>❌④: 신의 존재 부정 아님<br>❌⑤: mathematician이라고 명시`,tip:`원문과 선지를 정확히 대조하여 일치 여부 판단`}},

{id:19,type:'T/F',diff:'어려움',pts:6,fmt:'mc',ans:1,
ch:['True','False'],
passage:P,
stem:`"Descartes concluded that his senses were completely reliable." (T/F)`,
det:{korean:`데카르트는 감각이 "could not be trusted"(신뢰할 수 없다)고 했으므로 completely reliable은 거짓.`,analysis:`❌False: "his senses could not be trusted" ≠ completely reliable<br>감각의 불확실성이 글의 핵심 전제`,tip:`could not be trusted = 신뢰할 수 없다 → completely reliable과 정반대`}},

{id:20,type:'T/F',diff:'쉬움',pts:4,fmt:'mc',ans:0,
ch:['True','False'],

function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#E8772E':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#FFF3E8,#FFE8D5':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#E8772E':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
