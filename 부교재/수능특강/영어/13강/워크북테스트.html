const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"13강","lesson":"빈칸 내용 추론 (1)","title":"Blank Inference 1","total":100,"time":1200,"totalQ":20,"histKey":"wbTest_suneung_13_v1"};

const P_GW=`The early grain trade firms were active in both surplus-producing and food deficit regions, and these firms made it their business to know the state of supply and demand in both. Because this information was the key to their ____________________, these firms worked in relative secrecy, frequently built on family ties, trust, and loyalty. In addition, these firms were able to benefit from the rise of commodity exchanges and commodities futures markets that emerged in the mid-1800s. Agricultural markets are naturally unstable, due to changes in harvest size that result from variable weather patterns and other factors. Locking-in prices by buying and selling grain for future delivery helped these firms to minimize such risks. It made sense for the grain trading companies to manage their risks within a single firm that was operating in more than one country, rather than operating as independent national companies trading with each other. Their access to information in multiple markets enabled them to easily cover the risks associated with agricultural commodity trade.\n\n* deficit: 부족`;

const P_EX01=`In the Physics, Aristotle asks whether nature acts for the sake of something. He offers an account of rain as water that rises when heated by the Sun, then cools, condenses, and falls to Earth, but is not particularly concerned with explaining rain as such. Rather, he addresses a more general question: how to account for natural objects, events, and processes that appear with regularity. He queries whether the sharpness of front teeth and the bluntness of molars is coincidental and rejects that possibility, because this arrangement occurs with regularity and that regularity is linked to ____________________. The sharpness of front teeth allows them to tear while the bluntness of those in the back enables them to crush food; both are useful for eating. In Aristotle's view, all natural things happen in a given way and occur for the sake of something; that is the final cause.\n\n* query: 의문을 제기하다  ** bluntness: 뭉툭함  *** molar: 어금니`;

const P_EX02=`AI is a prolific idea generator. Human brainstorming groups tend to focus on the quality of creative ideas and almost immediately lean into variations of first suggestions, but good ideas are more likely when groups focus first on quantity. As Linus Pauling put it, "The best way to have a good idea is to have lots of ideas." Psychologist Dean Keith Simonton called this the "equal odds rule" arguing that creative success is correlated to the total number of works created. Many studies have confirmed that creative quality comes from quantity of ideas (what Bob Sutton at a design and innovation consulting company called "idea ratio"), and one Stanford study pegged the number of ideas that distinguish a successful product from a failure at more than two thousand. This is why design thinking and innovation are so focused on the processes (what Utley and Klebahn call "idea flow") of ____________________.\n\n* prolific: 많이 만들어 내는, 다작의  ** peg: 못박다`;

const P_EX03=`Becoming aware of our internal sensations can help us handle our own emotions. Perhaps more surprisingly, the body's interoceptive faculty can also bring us into closer contact with other people's emotions. That's because the brain, on its own, has no direct access to the contents of other people's minds, no way to feel what others are feeling. Interpreting others' spoken words and facial expressions may yield only a coolly abstract sense of the emotions that stir within. The body acts as a critical conduit, supplying the brain with the visceral information it lacks. It does so in this way: When interacting with other people, we subtly and unconsciously mimic their facial expressions, gestures, posture, and vocal pitch. Then, via the interoception of our own bodies' signals, we perceive what the other person is feeling because we feel it in ourselves. We bring other people's feelings onboard, and the body is the bridge. In an act similar to taking a bite off our partner's plate, or borrowing an earbud to hear the song our friend is listening to, we are ____________________.\n\n* interoceptive: 내부 감각 수용의  ** conduit: 전달자  *** visceral: 본능적인`;

const P_EX04=`The strongest criticisms of the overextension of technology involve claims of dehumanization, and these arguments are not new. Canadian philosopher of the electronic age, Marshall McLuhan was primarily a techno-utopian, but he was also a critical thinker, who cautioned decades ago against too much human extension into technology. McLuhan famously claimed that every media extension of man is an amputation. For example, once we have a car, we don't walk to the shops any more; once we have a computer hard-drive, we don't have to remember things; and now that we have personal GPS (Global Positioning System) on our cell phones, no one can find their way about without it. Based on McLuhan's philosophy, we are becoming post-literate because we rely on screens full of pictures, rather than print media, such as books. It is thus possible that extensions of human faculties, through techno- and bio-enhancement, will bring about ____________________.\n\n* techno-utopian: 기술 낙관론자  ** amputation: 절라내기, 절단  *** post-literate: 탈문해화의`;

{"id":1,"type":"어법","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["are","was","were","is","be"],"passage":"The early grain trade firms <b>________</b> active in both surplus-producing and food deficit regions, and these firms made it their business to know the state of supply and demand in both.","stem":"다음 글의 빈칸에 들어갈 어법상 가장 적절한 것은?","det":{"korean":"주어가 'The early grain trade firms'(복수)이고 과거 시제이므로 <b>were</b>가 적절합니다.","analysis":"✅ ③ were: 복수 주어 + 과거 시제\n❌ ① are: 현재 시제\n❌ ② was: 단수\n❌ ④ is: 단수 현재\n❌ ⑤ be: 원형부정사","tip":"주어의 수(복수 firms)와 시제(과거)를 확인하세요."}},

{"id":2,"type":"어법","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["linked","linking","link","to link","links"],"passage":"He rejects that possibility, because this arrangement occurs with regularity and that regularity is <b>________</b> to purposefulness.","stem":"다음 글의 빈칸에 들어갈 어법상 가장 적절한 것은?","det":{"korean":"'is linked to'의 수동태 구문으로, 과거분사 <b>linked</b>가 적절합니다.","analysis":"✅ ① linked: be + p.p. 수동태\n❌ ② linking: 능동 진행\n❌ ③ link: 원형\n❌ ④ to link: to부정사\n❌ ⑤ links: 3인칭 단수 현재","tip":"be linked to = ~와 연결되다 (수동태 표현)"}},

{"id":3,"type":"어법","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["what","which","where","that","who"],"passage":"Many studies have confirmed <b>________</b> creative quality comes from quantity of ideas.","stem":"다음 글의 빈칸에 들어갈 어법상 가장 적절한 것은?","det":{"korean":"confirmed 뒤에 완전한 절이 이어지므로 접속사 <b>that</b>이 적절합니다.","analysis":"✅ ④ that: 명사절 접속사 (confirm의 목적절)\n❌ ① what: 뒤에 불완전한 절이 필요\n❌ ② which: 관계대명사/의문사\n❌ ③ where: 장소 부사절\n❌ ⑤ who: 사람 관계대명사","tip":"confirm/prove/show + that절: 동사 뒤 that 명사절 구문"}},

{"id":4,"type":"어법","diff":"어려움","pts":6,"fmt":"mc","ans":1,"ch":["feel","feeling","felt","to feel","feels"],"passage":"Then, via the interoception of our own bodies' signals, we perceive what the other person is <b>________</b> because we feel it in ourselves.","stem":"다음 글의 빈칸에 들어갈 어법상 가장 적절한 것은?","det":{"korean":"'is feeling'의 현재진행형이므로 현재분사 <b>feeling</b>이 적절합니다.","analysis":"✅ ② feeling: is + -ing 현재진행형\n❌ ① feel: 원형\n❌ ③ felt: 과거/과거분사\n❌ ④ to feel: to부정사\n❌ ⑤ feels: 3인칭 단수 현재","tip":"what the person is feeling: 간접의문문 내 현재진행형"}},

{"id":5,"type":"어법","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["claiming","claims","claimed","to claim","claim"],"passage":"McLuhan famously <b>________</b> that every media extension of man is an amputation.","stem":"다음 글의 빈칸에 들어갈 어법상 가장 적절한 것은?","det":{"korean":"과거 시제 문맥(McLuhan)이며, 주어가 3인칭 단수이므로 과거형 <b>claimed</b>가 적절합니다.","analysis":"✅ ③ claimed: 과거 시제\n❌ ① claiming: 분사\n❌ ② claims: 현재\n❌ ④ to claim: to부정사\n❌ ⑤ claim: 원형","tip":"과거 시제 맥락(McLuhan은 과거 인물)에서 과거형 동사 사용"}},

{"id":6,"type":"내용일치","diff":"쉬움","pts":4,"fmt":"mc","ans":1,"ch":["곡물 무역 회사들은 한 나라에서만 운영되었다.","곡물 무역 회사들은 가족 간 유대와 충성심을 바탕으로 비밀리에 운영되었다.","곡물 무역 회사들은 정보를 공개적으로 공유했다.","선물 시장은 1900년대에 등장했다.","곡물 무역 회사들은 독립적인 국가별 회사로 운영하는 것을 선호했다."],"passage":P_GW,"stem":"다음 글의 내용과 일치하는 것은?","det":{"korean":"곡물 무역 회사들은 정보를 비밀리에(secrecy) 관리했으며, 가족 간 유대(family ties), 신뢰(trust), 충성심(loyalty)에 기반했습니다.","analysis":"✅ ② 비밀리에 운영, 가족 유대와 충성심 기반: 원문 일치\n❌ ① 여러 나라에서 운영(more than one country)\n❌ ③ 비밀리에 운영(secrecy)\n❌ ④ 1800년대 중반(mid-1800s)\n❌ ⑤ 단일 회사 운영 선호","tip":"내용 일치 문제는 원문의 구체적 사실을 정확히 대조하세요."}},

{"id":7,"type":"내용일치","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["아리스토텔레스는 비가 내리는 현상을 설명하는 데 주로 관심이 있었다.","앞니의 날카로움과 어금니의 뭉툭함은 우연의 일치이다.","자연의 모든 것은 무작위로 발생한다.","아리스토텔레스의 관점에서 모든 자연적인 것은 무엇인가를 위해 발생한다.","아리스토텔레스는 자연의 규칙성을 부정했다."],"passage":P_EX01,"stem":"다음 글의 내용과 일치하는 것은?","det":{"korean":"아리스토텔레스의 관점에서 모든 자연적인 것은 일정한 방식으로 발생하며, 무엇인가를 위해(for the sake of something) 일어난다고 합니다.","analysis":"✅ ④ 모든 자연적 것은 목적을 위해 발생: 원문 마지막 문장 일치\n❌ ① 비 설명에 관심 없음(not particularly concerned)\n❌ ② 우연을 거부(rejects that possibility)\n❌ ③ 규칙적으로 발생(with regularity)\n❌ ⑤ 규칙성을 인정","tip":"final cause(최종 원인) = 아리스토텔레스 목적론의 핵심 개념"}},

{"id":8,"type":"내용불일치","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["McLuhan은 기술 확장을 전적으로 지지했다.","McLuhan에 따르면 모든 미디어 확장은 절단이다.","McLuhan의 철학에 따르면 우리는 탈문해화되고 있다.","차를 갖게 되면 더 이상 가게에 걸어가지 않는다.","GPS 때문에 아무도 그것 없이는 길을 찾을 수 없다."],"passage":P_EX04,"stem":"다음 글의 내용과 일치하지 <b>않는</b> 것은?","det":{"korean":"McLuhan은 기본적으로 기술 낙관론자(techno-utopian)였지만, 동시에 비판적 사고가(critical thinker)이기도 했습니다. '전적으로 지지했다'는 일치하지 않습니다.","analysis":"❌ ① 전적으로 지지: primarily a techno-utopian but also a critical thinker → 불일치\n✅ ② 미디어 확장 = 절단: 원문 일치\n✅ ③ 탈문해화: 원문 일치\n✅ ④ 차 → 안 걸음: 원문 일치\n✅ ⑤ GPS 없이 길 못 찾음: 원문 일치","tip":"내용 불일치: primarily(주로)는 '전적으로(전적으로)'와 다릅니다."}},

{"id":9,"type":"내용불일치","diff":"어려움","pts":6,"fmt":"mc","ans":4,"ch":["AI는 다작의 아이디어 생성기이다.","인간 브레인스토밍 그룹은 아이디어의 질에 초점을 맞추는 경향이 있다.","Simonton은 이것을 '동등한 확률 법칙'이라고 불렀다.","Stanford 연구는 성공적인 제품을 구별하는 아이디어 수를 2,000개 이상으로 산정했다.","좋은 아이디어를 얻는 최선의 방법은 소수의 아이디어에 집중하는 것이다."],"passage":P_EX02,"stem":"다음 글의 내용과 일치하지 <b>않는</b> 것은?","det":{"korean":"원문: 'The best way to have a good idea is to have lots of ideas' → 많은 아이디어를 갖는 것이 최선. '소수의 아이디어에 집중'은 일치하지 않습니다.","analysis":"✅ ① AI = prolific idea generator: 원문 일치\n✅ ② 질에 초점: 원문 일치\n✅ ③ equal odds rule: 원문 일치\n✅ ④ 2,000개 이상: 원문 일치\n❌ ⑤ 소수에 집중 → lots of ideas와 반대","tip":"lots of ideas(많은 아이디어) ≠ 소수의 아이디어에 집중"}},

{"id":10,"type":"빈칸추론","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["profitability","unification","innovation","reputation","morality"],"passage":P_GW,"stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"수요와 공급 상태를 아는 것이 이들 회사의 일이었고, 이 정보가 곧 수익성(profitability)의 핵심이었으므로 비밀리에 운영했습니다.","analysis":"✅ ① profitability(수익성): 정보 → 경쟁 우위 → 수익성\n❌ ② unification(통합)\n❌ ③ innovation(혁신)\n❌ ④ reputation(평판)\n❌ ⑤ morality(도덕성)","tip":"빈칸 앞뒤 맥락: 정보가 핵심 → 비밀 운영 → 수익성이 목표"}},

{"id":11,"type":"빈칸추론","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["swiftness","creativity","originality","purposefulness","beauty"],"passage":P_EX01,"stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"앞니와 어금니의 배열이 규칙적이며, 그 규칙성이 목적성과 연결된다는 내용입니다. 정답: ④ purposefulness","analysis":"✅ ④ purposefulness(목적성)\n❌ ① swiftness(신속성)\n❌ ② creativity(창의성)\n❌ ③ originality(독창성)\n❌ ⑤ beauty(아름다움)","tip":"regularity → purposefulness → final cause: 아리스토텔레스 논증 흐름"}},

{"id":12,"type":"빈칸추론","diff":"어려움","pts":6,"fmt":"mc","ans":1,"ch":["avoiding emotional bias","sampling their emotions","analyzing their words rationally","responding without genuine empathy","distancing ourselves from their experience"],"passage":P_EX03,"stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"우리는 다른 사람의 표정을 무의식적으로 따라 하고, 내부 감각으로 상대의 감정을 느낍니다. 파트너 접시에서 한 입 베어 먹는 것처럼, 우리는 상대의 감정을 '맛보고(sampling)' 있습니다.","analysis":"✅ ② sampling their emotions: 상대 감정을 체험적으로 맛봄\n❌ ① 감정적 편견 피하기\n❌ ③ 말을 이성적으로 분석\n❌ ④ 진정한 공감 없이 반응\n❌ ⑤ 경험으로부터 거리두기","tip":"sampling = 맛보기: 비유적 표현으로 감정의 직접 체험을 의미"}},

{"id":13,"type":"빈칸추론","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["renewed emphasis on traditional literacy in modern society","accelerated progression in the intellectual growth of human cognition","rapid changes in the application of human faculties to daily activities","arrested development in the natural evolution of higher human faculties","an unprecedented competition between human abilities and artificial intelligence"],"passage":P_EX04,"stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"McLuhan: 모든 미디어 확장 = 절단. 차가 있으면 걷지 않고, 하드드라이브가 있으면 기억하지 않음 → 인간 고등 능력의 자연적 진화가 정지(arrested)됨","analysis":"✅ ④ arrested development in the natural evolution of higher human faculties\n❌ ① 전통 문해력 강조\n❌ ② 지적 성장 가속\n❌ ③ 일상 적용의 급변\n❌ ⑤ 인간-AI 경쟁","tip":"arrested development = 발전 정지: 기술이 인간 능력을 대체하면서 자연적 진화가 멈춤"}},

{"id":14,"type":"서술형","diff":"쉬움","pts":4,"fmt":"written","wa":"profitability","accept":["profitability","Profitability","PROFITABILITY"],"passage":"Because this information was the key to their ____________________, these firms worked in relative secrecy.","stem":"Gateway 지문의 빈칸에 들어갈 단어를 영어로 쓰시오.","det":{"korean":"정보가 <b>수익성(profitability)</b>의 핵심이었기 때문에 비밀리에 운영했습니다.","analysis":"빈칸 앞: the key to their → 소유격 뒤 명사 필요\n빈칸 뒤: 비밀 운영의 이유 → 수익성","tip":"profitability(수익성): profit + -able + -ity 파생어"}},

{"id":15,"type":"서술형","diff":"보통","pts":5,"fmt":"written","wa":"purposefulness","accept":["purposefulness","Purposefulness","PURPOSEFULNESS"],"passage":"this arrangement occurs with regularity and that regularity is linked to ____________________.","stem":"EX01 지문의 빈칸에 들어갈 단어를 영어로 쓰시오.","det":{"korean":"이러한 배열은 규칙성을 가지고 발생하며, 그 규칙성은 <b>목적성(purposefulness)</b>과 연결됩니다.","analysis":"regularity → linked to → 목적성(purposefulness)\n아리스토텔레스: 자연의 규칙성 = 목적이 있음","tip":"purposefulness: purpose(목적) + -ful + -ness 파생어"}},

{"id":16,"type":"서술형","diff":"보통","pts":5,"fmt":"written","wa":"creating possibilities without judgment","accept":["creating possibilities without judgment","Creating possibilities without judgment"],"passage":"design thinking and innovation are so focused on the processes (what Utley and Klebahn call 'idea flow') of ____________________.","stem":"EX02 지문의 빈칸에 들어갈 표현을 영어로 쓰시오.","det":{"korean":"디자인 사고와 혁신은 <b>판단 없이 가능성을 만들어 내는(creating possibilities without judgment)</b> 과정에 초점을 맞춥니다.","analysis":"idea flow = 아이디어 흐름 = 판단 없이 아이디어를 만들어 냄\n양(quantity) 우선 → judgment 없이 creating","tip":"creating possibilities without judgment: 핵심은 'without judgment'"}},

{"id":17,"type":"서술형","diff":"쉬움","pts":4,"fmt":"written","wa":"sampling their emotions","accept":["sampling their emotions","Sampling their emotions"],"passage":"In an act similar to taking a bite off our partner's plate, or borrowing an earbud to hear the song our friend is listening to, we are ____________________.","stem":"EX03 지문의 빈칸에 들어갈 표현을 영어로 쓰시오.","det":{"korean":"파트너 접시에서 한 입 베어 먹거나, 이어폰을 빌려 듣는 것과 유사한 행위로, 우리는 그들의 감정을 <b>맛보고(sampling their emotions)</b> 있습니다.","analysis":"taking a bite / borrowing an earbud → 직접 체험 → sampling\n상대의 감정을 직접 경험적으로 '샘플링'","tip":"sampling = 표본추출, 맛보기: 감정의 직접 체험을 비유"}},

{"id":18,"type":"T/F","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["T","F"],"passage":P_GW,"stem":"다음 진술이 본문의 내용과 일치하면 T, 일치하지 않으면 F를 고르시오.\n\n<b>\"초기 곡물 무역 회사들은 잉여 생산 지역과 식량 부족 지역 양쪽에서 활발히 활동했다.\"</b>","det":{"korean":"원문: 'The early grain trade firms were active in both surplus-producing and food deficit regions' → <b>일치(T)</b>","analysis":"T: 원문에 명시적으로 기술됨","tip":"both A and B 구문 확인: surplus-producing + food deficit regions"}},

{"id":19,"type":"T/F","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["T","F"],"passage":P_EX02,"stem":"다음 진술이 본문의 내용과 일치하면 T, 일치하지 않으면 F를 고르시오.\n\n<b>\"Linus Pauling은 좋은 아이디어를 얻는 최선의 방법은 아이디어의 질에 집중하는 것이라고 말했다.\"</b>","det":{"korean":"원문: 'The best way to have a good idea is to have lots of ideas' → 질이 아닌 <b>양(lots of ideas)</b>에 집중 → <b>불일치(F)</b>","analysis":"F: Pauling은 '양'을 강조했지, '질'을 강조하지 않음","tip":"lots of ideas = quantity(양) ≠ quality(질): 핵심 대비 파악"}},

{"id":20,"type":"T/F","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["T","F"],"passage":P_EX03,"stem":"다음 진술이 본문의 내용과 일치하면 T, 일치하지 않으면 F를 고르시오.\n\n<b>\"뇌는 그 자체로 다른 사람의 마음 속 내용에 직접 접근할 수 없다.\"</b>","det":{"korean":"원문: 'the brain, on its own, has no direct access to the contents of other people's minds' → <b>일치(T)</b>","analysis":"T: 원문에 명시적으로 기술됨\nno direct access = 직접 접근 불가","tip":"on its own = 그 자체로: 뇌 단독으로는 타인의 감정에 접근 불가"}}
];

let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법':'tag-grammar','내용이해':'tag-content','빈칸추론':'tag-blank','서술형':'tag-written','T/F':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':q.ch.length===3?'①②③':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':d.q.ch&&d.q.ch.length===3?'①②③':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;const det=d.q.det||{};h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[ ${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--oxl);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--oxl);color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div>${det.korean?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${det.korean}</div>`:''}${det.analysis?`<div class="expl-tag tip">📋 분석</div><div class="expl-box">${det.analysis}</div>`:''}${det.tip?`<div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${det.tip}</div>`:''}</div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;let txt=`📝 온라인워크북 TEST 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
