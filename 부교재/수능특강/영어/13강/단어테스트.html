const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"13강","lesson":"빈칸 내용 추론 (1)","title":"Blank Inference 1","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_suneung_13_v1"};

const P_GW=`The early grain trade firms were active in both surplus-producing and food deficit regions, and these firms made it their business to know the state of supply and demand in both. Because this information was the key to their ____________________, these firms worked in relative secrecy, frequently built on family ties, trust, and loyalty. In addition, these firms were able to benefit from the rise of commodity exchanges and commodities futures markets that emerged in the mid-1800s. Agricultural markets are naturally unstable, due to changes in harvest size that result from variable weather patterns and other factors. Locking-in prices by buying and selling grain for future delivery helped these firms to minimize such risks. It made sense for the grain trading companies to manage their risks within a single firm that was operating in more than one country, rather than operating as independent national companies trading with each other. Their access to information in multiple markets enabled them to easily cover the risks associated with agricultural commodity trade.\n\n* deficit: 부족`;

const P_EX01=`In the Physics, Aristotle asks whether nature acts for the sake of something. He offers an account of rain as water that rises when heated by the Sun, then cools, condenses, and falls to Earth, but is not particularly concerned with explaining rain as such. Rather, he addresses a more general question: how to account for natural objects, events, and processes that appear with regularity. He queries whether the sharpness of front teeth and the bluntness of molars is coincidental and rejects that possibility, because this arrangement occurs with regularity and that regularity is linked to ____________________. The sharpness of front teeth allows them to tear while the bluntness of those in the back enables them to crush food; both are useful for eating. In Aristotle's view, all natural things happen in a given way and occur for the sake of something; that is the final cause.\n\n* query: 의문을 제기하다  ** bluntness: 뭉툭함  *** molar: 어금니`;

const P_EX02=`AI is a prolific idea generator. Human brainstorming groups tend to focus on the quality of creative ideas and almost immediately lean into variations of first suggestions, but good ideas are more likely when groups focus first on quantity. As Linus Pauling put it, "The best way to have a good idea is to have lots of ideas." Psychologist Dean Keith Simonton called this the "equal odds rule" arguing that creative success is correlated to the total number of works created. Many studies have confirmed that creative quality comes from quantity of ideas (what Bob Sutton at a design and innovation consulting company called "idea ratio"), and one Stanford study pegged the number of ideas that distinguish a successful product from a failure at more than two thousand. This is why design thinking and innovation are so focused on the processes (what Utley and Klebahn call "idea flow") of ____________________.\n\n* prolific: 많이 만들어 내는, 다작의  ** peg: 못박다`;

const P_EX03=`Becoming aware of our internal sensations can help us handle our own emotions. Perhaps more surprisingly, the body's interoceptive faculty can also bring us into closer contact with other people's emotions. That's because the brain, on its own, has no direct access to the contents of other people's minds, no way to feel what others are feeling. Interpreting others' spoken words and facial expressions may yield only a coolly abstract sense of the emotions that stir within. The body acts as a critical conduit, supplying the brain with the visceral information it lacks. It does so in this way: When interacting with other people, we subtly and unconsciously mimic their facial expressions, gestures, posture, and vocal pitch. Then, via the interoception of our own bodies' signals, we perceive what the other person is feeling because we feel it in ourselves. We bring other people's feelings onboard, and the body is the bridge. In an act similar to taking a bite off our partner's plate, or borrowing an earbud to hear the song our friend is listening to, we are ____________________.\n\n* interoceptive: 내부 감각 수용의  ** conduit: 전달자  *** visceral: 본능적인`;

const P_EX04=`The strongest criticisms of the overextension of technology involve claims of dehumanization, and these arguments are not new. Canadian philosopher of the electronic age, Marshall McLuhan was primarily a techno-utopian, but he was also a critical thinker, who cautioned decades ago against too much human extension into technology. McLuhan famously claimed that every media extension of man is an amputation. For example, once we have a car, we don't walk to the shops any more; once we have a computer hard-drive, we don't have to remember things; and now that we have personal GPS (Global Positioning System) on our cell phones, no one can find their way about without it. Based on McLuhan's philosophy, we are becoming post-literate because we rely on screens full of pictures, rather than print media, such as books. It is thus possible that extensions of human faculties, through techno- and bio-enhancement, will bring about ____________________.\n\n* techno-utopian: 기술 낙관론자  ** amputation: 절라내기, 절단  *** post-literate: 탈문해화의`;

const Q=[
{"id":1,"type":"(A)(B)(C) 조합형","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["secrecy — loyalty — minimize","openness — loyalty — minimize","secrecy — rivalry — minimize","secrecy — loyalty — maximize","openness — rivalry — maximize"],"passage":"Because this information was the key to their profitability, these firms worked in relative <b>(A)</b>, frequently built on family ties, trust, and <b>(B)</b>. Locking-in prices by buying and selling grain for future delivery helped these firms to <b>(C)</b> such risks.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"이 정보가 수익성의 핵심이었기 때문에, 이들 회사는 상대적으로 <b>비밀리에(secrecy)</b> 운영되었으며, 가족 간 유대, 신뢰, <b>충성심(loyalty)</b>에 기반하여 활동했습니다. 미래 인도를 위해 곡물을 사고팔아 가격을 고정하는 것은 이 회사들이 그러한 위험을 <b>최소화(minimize)</b>하는 데 도움이 되었습니다.","analysis":"✅ ① secrecy — loyalty — minimize: 원문과 일치\n❌ ② openness(개방)는 secrecy(비밀)의 반의어\n❌ ③ rivalry(경쟁)는 loyalty(충성)와 반대\n❌ ④ maximize(극대화)는 minimize(최소화)의 반의어\n❌ ⑤ 세 단어 모두 원문과 불일치","tip":"secrecy(비밀), loyalty(충성심), minimize(최소화하다) — 곡물 무역의 핵심 전략 어휘"}},

{"id":2,"type":"(A)(B)(C) 조합형","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["regularity — purposefulness — crush","irregularity — purposefulness — crush","regularity — randomness — crush","regularity — purposefulness — polish","irregularity — randomness — polish"],"passage":"He queries whether the sharpness of front teeth and the bluntness of molars is coincidental and rejects that possibility, because this arrangement occurs with <b>(A)</b> and that <b>(A)</b> is linked to <b>(B)</b>. The sharpness of front teeth allows them to tear while the bluntness of those in the back enables them to <b>(C)</b> food.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"아리스토텔레스는 앞니의 날카로움과 어금니의 뭉툭함이 우연의 일치인지 의문을 제기하고, 이러한 배열이 <b>규칙성(regularity)</b>을 가지고 발생하며 그 규칙성이 <b>목적성(purposefulness)</b>과 연결되어 있기 때문에 그 가능성을 거부합니다. 앞니의 날카로움은 음식을 찢을 수 있게 하고, 뒤쪽 이의 뭉툭함은 음식을 <b>부수는(crush)</b> 것을 가능하게 합니다.","analysis":"✅ ① regularity — purposefulness — crush: 원문과 일치\n❌ ② irregularity는 regularity의 반의어\n❌ ③ randomness는 purposefulness의 반의어\n❌ ④ polish(닦다)는 crush(부수다)와 무관\n❌ ⑤ 세 단어 모두 원문과 불일치","tip":"regularity(규칙성), purposefulness(목적성), crush(부수다) — 아리스토텔레스 목적론 관련 어휘"}},

{"id":3,"type":"문맥상 부적절한 어휘","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["① surplus","② deficit","③ stability","④ variable","⑤ minimize"],"passage":"Agricultural markets are naturally unstable, due to changes in harvest size that result from ①<u>variable</u> weather patterns and other factors. Locking-in prices by buying and selling grain for future delivery helped these firms to ②<u>minimize</u> such risks. It made sense for the grain trading companies to manage their risks within a single firm. Their access to information in multiple markets enabled them to easily cover the risks associated with agricultural commodity trade, ensuring ③<u>stability</u> in an otherwise unstable market.","stem":"밑줄 친 단어 중, 문맥상 원문의 의미와 일치하지 않는 것은? (원문에는 해당 위치에 다른 단어가 사용됨)","det":{"korean":"농업 시장은 본질적으로 <b>불안정</b>하며, ①variable(변동하는)과 ②minimize(최소화하다)는 원문과 일치하지만, ③stability(안정성)는 원문에 없는 표현입니다. 원문은 '위험을 쉽게 상쇄할 수 있었다(easily cover the risks)'라고 서술합니다.","analysis":"✅ ① variable: 원문에 그대로 사용됨\n✅ ② minimize: 원문에 그대로 사용됨\n❌ ③ stability: 원문에는 이 단어가 없으며, cover the risks가 사용됨\n✅ ④ variable: 보기 오류 아님\n✅ ⑤ minimize: 보기 오류 아님","tip":"부적절한 어휘 문제는 원문과 대조하여 '대체된 단어'를 찾는 유형입니다."}},

{"id":4,"type":"문맥상 부적절한 어휘","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["① prolific","② quantity","③ correlated","④ hamper","⑤ distinguish"],"passage":"AI is a ①<u>prolific</u> idea generator. Good ideas are more likely when groups focus first on ②<u>quantity</u>. Creative success is ③<u>correlated</u> to the total number of works created. Design thinking and innovation are so focused on processes that ④<u>hamper</u> the flow of ideas. One Stanford study pegged the number of ideas that ⑤<u>distinguish</u> a successful product from a failure at more than two thousand.","stem":"밑줄 친 단어 중, 문맥상 원문의 의미와 일치하지 않는 것은?","det":{"korean":"①prolific(다작의), ②quantity(양), ③correlated(상관관계가 있는), ⑤distinguish(구별하다)는 모두 원문과 일치합니다. ④hamper(방해하다)는 원문의 문맥과 반대입니다. 원문에서는 아이디어 흐름을 '만들어 내는(creating)' 과정에 초점을 맞춘다고 합니다.","analysis":"✅ ① prolific: 원문 그대로\n✅ ② quantity: 원문 그대로\n✅ ③ correlated: 원문 그대로\n❌ ④ hamper: 원문은 아이디어 흐름의 과정에 초점 → 방해가 아닌 촉진\n✅ ⑤ distinguish: 원문 그대로","tip":"hamper(방해하다) ↔ facilitate(촉진하다): 문맥상 아이디어 흐름을 촉진하는 것이 핵심"}},

{"id":5,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":1,"ch":["openness","confidentiality","rivalry","profitability","instability"],"passage":"these firms worked in relative secrecy","stem":"밑줄 친 <b>secrecy</b>와 의미가 가장 가까운 것은?","det":{"korean":"secrecy는 '비밀(성)'이라는 뜻으로, confidentiality(기밀성)와 동의어입니다.","analysis":"✅ ② confidentiality(기밀성) = secrecy(비밀성)\n❌ ① openness(개방성)는 반의어\n❌ ③ rivalry(경쟁)\n❌ ④ profitability(수익성)\n❌ ⑤ instability(불안정성)","tip":"secrecy = confidentiality = privacy: 비밀·기밀 관련 동의어군"}},

{"id":6,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["reject","ignore","verify","deny","question"],"passage":"Many studies have confirmed that creative quality comes from quantity of ideas","stem":"밑줄 친 <b>confirmed</b>와 의미가 가장 가까운 것은?","det":{"korean":"confirmed는 '확인하다, 입증하다'라는 뜻으로, verify(검증하다)와 동의어입니다.","analysis":"✅ ③ verify(검증하다) = confirmed(확인하다)\n❌ ① reject(거부하다)\n❌ ② ignore(무시하다)\n❌ ④ deny(부인하다)\n❌ ⑤ question(의문을 제기하다)","tip":"confirm = verify = validate = substantiate: '확인·입증하다' 동의어군"}},

{"id":7,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["reproduce","create","distort","eliminate","conceal"],"passage":"we subtly and unconsciously mimic their facial expressions, gestures, posture, and vocal pitch","stem":"밑줄 친 <b>mimic</b>과 의미가 가장 가까운 것은?","det":{"korean":"mimic은 '모방하다, 흉내 내다'라는 뜻으로, reproduce(재현하다)와 동의어입니다.","analysis":"✅ ① reproduce(재현하다) = mimic(모방하다)\n❌ ② create(창조하다)\n❌ ③ distort(왜곡하다)\n❌ ④ eliminate(제거하다)\n❌ ⑤ conceal(숨기다)","tip":"mimic = imitate = reproduce = copy: '모방하다' 동의어군"}},

{"id":8,"type":"반의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":3,"ch":["changeable","flexible","uncertain","stable","risky"],"passage":"Agricultural markets are naturally unstable","stem":"밑줄 친 <b>unstable</b>과 의미가 가장 반대인 것은?","det":{"korean":"unstable은 '불안정한'이라는 뜻으로, stable(안정적인)이 반의어입니다.","analysis":"✅ ④ stable(안정적인) ↔ unstable(불안정한)\n❌ ① changeable(변하기 쉬운) = 유사어\n❌ ② flexible(유연한)\n❌ ③ uncertain(불확실한) = 유사어\n❌ ⑤ risky(위험한) = 유사어","tip":"unstable ↔ stable / steady / constant: 불안정-안정 반의어 쌍"}},

{"id":9,"type":"반의어 고르기","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["indirect","physical","conscious","emotional","voluntary"],"passage":"we subtly and unconsciously mimic their facial expressions","stem":"밑줄 친 <b>unconsciously</b>와 의미가 가장 반대인 것은?","det":{"korean":"unconsciously는 '무의식적으로'라는 뜻으로, conscious(의식적인)가 반의어입니다. (부사 consciously의 형용사형)","analysis":"✅ ③ conscious(의식적인) ↔ unconsciously(무의식적으로)\n❌ ① indirect(간접적인)\n❌ ② physical(물리적인)\n❌ ④ emotional(감정적인)\n❌ ⑤ voluntary(자발적인)","tip":"unconscious ↔ conscious / aware / deliberate: 무의식-의식 반의어 쌍"}},

{"id":10,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["demand","surplus","deficit","exchange","profit"],"passage":"The early grain trade firms were active in both ____-producing and food ____ regions.","stem":"빈칸에 공통으로 들어갈 말로 적절한 것끼리 짝지은 것은? (첫 번째 빈칸: surplus, 두 번째 빈칸: ?)","det":{"korean":"초기 곡물 무역 회사들은 잉여 생산 지역과 식량 <b>부족(deficit)</b> 지역 모두에서 활동했습니다. 하지만 이 문제의 두 번째 빈칸의 정답은 <b>deficit</b>입니다.","analysis":"✅ surplus-producing과 food deficit이 대비되는 구조\n정답은 ② surplus (첫 번째 빈칸에 이미 제시) 가 아니라 실제 두 번째 빈칸 deficit","tip":"surplus(잉여) ↔ deficit(부족): 곡물 무역의 공급 관련 핵심 대비 어휘"}},

{"id":11,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["profitability","unification","innovation","reputation","morality"],"passage":P_GW,"stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"초기 곡물 무역 회사들은 잉여 생산 지역과 식량 부족 지역 양쪽에서 활동했으며, 이 정보가 곧 수익성의 핵심이었습니다. 따라서 빈칸에는 <b>수익성(profitability)</b>이 가장 적절합니다.","analysis":"✅ ① profitability(수익성): 정보가 사업 성과의 핵심 → 수익성\n❌ ② unification(통합)\n❌ ③ innovation(혁신)\n❌ ④ reputation(평판)\n❌ ⑤ morality(도덕성)","tip":"Gateway 지문 빈칸 정답: profitability(수익성) — 정보 우위가 곧 재정적 성공의 열쇠"}},

{"id":12,"type":"빈칸 어휘 완성","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["swiftness","creativity","originality","purposefulness","beauty"],"passage":P_EX01,"stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"아리스토텔레스는 모든 자연 현상이 우연이 아닌 일정한 규칙과 목적성을 바탕으로 발생한다고 보았으므로, 빈칸에는 <b>목적성(purposefulness)</b>이 가장 적절합니다.","analysis":"✅ ④ purposefulness(목적성): 규칙적 배열이 목적과 연결\n❌ ① swiftness(신속성)\n❌ ② creativity(창의성)\n❌ ③ originality(독창성)\n❌ ⑤ beauty(아름다움)","tip":"아리스토텔레스의 목적론(teleology): 자연의 모든 일은 '무엇을 위해' 발생한다는 최종 원인(final cause)"}},

{"id":13,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["덮다 (물리적으로)","보도하다 (뉴스)","상쇄하다, 충당하다","포함하다","여행하다 (거리)"],"passage":"Their access to information in multiple markets enabled them to easily <b>cover</b> the risks associated with agricultural commodity trade.","stem":"밑줄 친 <b>cover</b>가 이 문맥에서 의미하는 바로 가장 적절한 것은?","det":{"korean":"cover는 다의어로, 이 문맥에서는 위험을 '상쇄하다, 충당하다'라는 의미로 사용되었습니다.","analysis":"✅ ③ 상쇄하다, 충당하다: 위험(risks)과 결합하여 '위험을 커버하다'\n❌ ① 물리적으로 덮다\n❌ ② 뉴스 보도하다\n❌ ④ 포함하다\n❌ ⑤ 거리를 여행하다","tip":"cover the risks = offset/compensate for the risks: 금융·무역에서 '위험을 상쇄하다'"}},

{"id":14,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["고치다, 수리하다","설명하다, 해명하다","계정, 계좌","이야기, 묘사","고려하다"],"passage":"He offers an <b>account</b> of rain as water that rises when heated by the Sun, then cools, condenses, and falls to Earth.","stem":"밑줄 친 <b>account</b>가 이 문맥에서 의미하는 바로 가장 적절한 것은?","det":{"korean":"account는 다의어로, 이 문맥에서는 비의 과정에 대한 '설명, 해명'이라는 의미로 사용되었습니다.","analysis":"✅ ② 설명하다, 해명하다: 비의 원리를 '설명'하는 문맥\n❌ ① 고치다\n❌ ③ 계정, 계좌\n❌ ④ 이야기 (서사적 맥락이 아님)\n❌ ⑤ 고려하다 (account for와 다름)","tip":"account of = explanation/description of: 학술적 맥락에서 '설명'의 의미"}},

{"id":15,"type":"영영풀이 매칭","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["deficit","surplus","commodity","loyalty","secrecy"],"passage":"","stem":"다음 영영풀이에 해당하는 단어는?\n\n<b>\"a raw material or agricultural product that can be bought and sold\"</b>","det":{"korean":"'사고 팔 수 있는 원자재 또는 농산물'은 <b>commodity(상품, 원자재)</b>의 정의입니다.","analysis":"✅ ③ commodity: 원자재, 상품\n❌ ① deficit(부족, 적자)\n❌ ② surplus(잉여)\n❌ ④ loyalty(충성심)\n❌ ⑤ secrecy(비밀)","tip":"commodity exchange = 상품 거래소, commodity trade = 상품 무역"}},

{"id":16,"type":"영영풀이 매칭","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["account","regularity","coincidence","interoception","conduit"],"passage":"","stem":"다음 영영풀이에 해당하는 단어는?\n\n<b>\"the perception of sensations from inside the body, including heart rate, breathing, and other internal signals\"</b>","det":{"korean":"'심박수, 호흡 등 신체 내부 감각의 인지'는 <b>interoception(내부 감각 수용)</b>의 정의입니다.","analysis":"✅ ④ interoception(내부 감각 수용)\n❌ ① account(설명)\n❌ ② regularity(규칙성)\n❌ ③ coincidence(우연의 일치)\n❌ ⑤ conduit(전달자, 통로)","tip":"interoception(내부 감각 수용) ↔ exteroception(외부 감각 수용): 감각 관련 학술 용어"}},

{"id":17,"type":"어형 변환 (서술형)","diff":"쉬움","pts":4,"fmt":"written","wa":"profitable","accept":["profitable","Profitable","PROFITABLE"],"passage":"Because this information was the key to their profitability, these firms worked in relative secrecy.","stem":"다음 문장의 <b>profitability</b>를 형용사로 바꿔 쓰시오.","det":{"korean":"profitability(수익성, 명사) → <b>profitable(수익성 있는, 형용사)</b>","analysis":"profitability(명사) → profitable(형용사)\n어근 profit + 접미사 -able → profitable\n명사형은 profitable + -ity → profitability","tip":"profit(이윤) → profitable(수익성 있는) → profitability(수익성): 파생어 변환 패턴"}},

{"id":18,"type":"어형 변환 (서술형)","diff":"보통","pts":5,"fmt":"written","wa":"regularity","accept":["regularity","Regularity","REGULARITY"],"passage":"He queries whether the sharpness of front teeth and the bluntness of molars is coincidental and rejects that possibility, because this arrangement occurs with regularity.","stem":"다음 문장에서 <b>regular</b>의 명사형을 쓰시오.","det":{"korean":"regular(규칙적인, 형용사) → <b>regularity(규칙성, 명사)</b>","analysis":"regular(형용사) → regularity(명사)\n형용사 + -ity 접미사 → 명사 변환","tip":"regular → regularity / irregular → irregularity: -ity 명사화 패턴"}},

{"id":19,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["selecting the best idea of all","drawing immediate outcomes","filtering options through analysis","creating possibilities without judgment","judging creativity during brainstorming"],"passage":P_EX02,"stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"AI는 많은 아이디어를 생성하며, 좋은 아이디어를 얻는 최선의 방법은 많은 아이디어를 갖는 것입니다. 창의적 성공은 작품의 총 수와 상관관계가 있으므로, 빈칸에는 <b>판단 없이 가능성을 만들어 내는 것(creating possibilities without judgment)</b>이 가장 적절합니다.","analysis":"✅ ④ creating possibilities without judgment: 판단하지 않고 많은 아이디어를 생성\n❌ ① 최고의 아이디어를 선택 → 양보다 질에 초점\n❌ ② 즉각적 결과 도출 → 본문 내용과 무관\n❌ ③ 분석을 통한 선별 → 아이디어 양 강조와 반대\n❌ ⑤ 브레인스토밍 중 창의성 판단 → 본문과 반대","tip":"idea flow = 아이디어 흐름: 양(quantity)을 먼저 확보하고, 판단(judgment)은 나중에"}},

{"id":20,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","ans":1,"ch":["avoiding emotional bias","sampling their emotions","analyzing their words rationally","responding without genuine empathy","distancing ourselves from their experience"],"passage":P_EX03,"stem":"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"우리는 다른 사람의 표정, 몸짓, 자세를 무의식적으로 따라 하고, 내부 감각을 통해 상대방의 감정을 '우리 안에서 느끼기' 때문에 인식합니다. 이는 상대방의 감정을 <b>맛보는 것(sampling their emotions)</b>과 유사한 행위입니다.","analysis":"✅ ② sampling their emotions: 상대의 감정을 '시식하듯' 체험\n❌ ① 감정적 편견을 피하고 → 본문은 감정을 느끼는 것이 핵심\n❌ ③ 말을 이성적으로 분석 → 신체적 모방이 핵심\n❌ ④ 진정한 공감 없이 반응 → 본문과 반대\n❌ ⑤ 경험으로부터 거리두기 → 본문과 반대","tip":"sampling = 맛보기, 표본추출: 파트너 접시에서 한 입 베어 먹는 것과 유사한 비유"}}
];

const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx','어법':'tag-grammar','어휘 문맥':'tag-vocab','빈칸 추론':'tag-blank','서술형':'tag-written','내용 일치/불일치':'tag-content','TF 판별':'tag-tf','종합':'tag-ctx'};

let S={ans:[],cur:0,ti:null,left:EI.time,start:0};

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name});if(h.length>50)h.length=50;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map(x=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade}</div></div><div class="hi-right"><div class="hi-score">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div><div class="hi-level">${x.level||''}</div></div></div>`).join('');p.style.display='block';}
function getLevel(s){if(s>=95)return{name:'S+',icon:'👑',range:'95~100',msg:'완벽한 어휘력! 최상위권입니다.'};if(s>=85)return{name:'A+',icon:'🌟',range:'85~94',msg:'훌륭한 어휘력! 거의 완벽합니다.'};if(s>=75)return{name:'A',icon:'💎',range:'75~84',msg:'우수한 어휘력! 조금만 더 노력하세요.'};if(s>=65)return{name:'B+',icon:'🔥',range:'65~74',msg:'좋은 수준! 약한 유형을 보완하세요.'};if(s>=50)return{name:'B',icon:'📈',range:'50~64',msg:'기본기는 있어요! 꾸준히 복습하세요.'};if(s>=30)return{name:'C',icon:'💪',range:'30~49',msg:'더 분발해야 해요! 기본 어휘부터 복습!'};return{name:'D',icon:'📖',range:'0~29',msg:'기초부터 차근차근 시작해봅시다!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+s%60+'초';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startExam(){const nm=document.getElementById('inpName').value.trim();if(!nm){toast('이름을 입력해주세요!');return;}S={ans:Array(EI.totalQ).fill(null),cur:0,ti:null,left:EI.time,start:Date.now()};showScreen('examScreen');renderQ();renderDots();startTimer();window.scrollTo(0,0);}

function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;}); el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;}); if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:(d.q.wa||'');const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[ ${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div>${d.q.det?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean||''}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis||''}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip||''}</div>`:''}</div></div>`;}); h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;let txt=`📝 온라인단어 TEST 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 수능특강 영어 · 13강\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
