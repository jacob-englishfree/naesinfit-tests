.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--od),var(--o));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}

const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"13강","lesson":"Gateway","title":"Early Grain Trade","total":100,"time":1800,"totalQ":20,"histKey":"quizTest_suneung_13_gw_v1"};

const P_GW=`The early grain trade firms were active in both surplus-producing and food deficit regions, and these firms made it their business to know the state of supply and demand in both. Because this information was the key to their ____________________, these firms worked in relative secrecy, frequently built on family ties, trust, and loyalty. In addition, these firms were able to benefit from the rise of commodity exchanges and commodities futures markets that emerged in the mid-1800s. Agricultural markets are naturally unstable, due to changes in harvest size that result from variable weather patterns and other factors. Locking-in prices by buying and selling grain for future delivery helped these firms to minimize such risks. It made sense for the grain trading companies to manage their risks within a single firm that was operating in more than one country, rather than operating as independent national companies trading with each other. Their access to information in multiple markets enabled them to easily cover the risks associated with agricultural commodity trade.<br><br>* deficit: 부족`;

const Q=[
{id:1,type:'문장삽입',diff:'어려움',pts:6,fmt:'mc',ans:2,
ch:['①','②','③','④'],
passage:`The early grain trade firms were active in both surplus-producing and food deficit regions, and these firms made it their business to know the state of supply and demand in both. <b>①</b> Because this information was the key to their profitability, these firms worked in relative secrecy, frequently built on family ties, trust, and loyalty. <b>②</b> In addition, these firms were able to benefit from the rise of commodity exchanges and commodities futures markets that emerged in the mid-1800s. <b>③</b> Locking-in prices by buying and selling grain for future delivery helped these firms to minimize such risks. <b>④</b> It made sense for the grain trading companies to manage their risks within a single firm that was operating in more than one country.`,
stem:'다음 글에서 주어진 문장이 들어가기에 가장 적절한 곳은?\n\n<b>"Agricultural markets are naturally unstable, due to changes in harvest size that result from variable weather patterns and other factors."</b>',
det:{korean:'농업 시장의 불안정성에 대한 문장은 선물 시장의 등장(②) 이후, 가격 고정으로 위험을 최소화하는 내용(④) 앞인 <b>③</b>에 들어가야 합니다.',analysis:'③ 앞: 상품 거래소와 선물 시장의 등장\n③ 뒤: 가격 고정으로 위험 최소화\n→ 농업 시장의 불안정성(원인) → 가격 고정(해결책)의 논리적 흐름',tip:'문장삽입: 삽입 문장의 키워드(unstable, variable)가 앞뒤 문맥과 연결되는 위치를 찾으세요.'}},
{id:2,type:'문장삽입',diff:'보통',pts:5,fmt:'mc',ans:0,
ch:['①','②','③','④'],
passage:`<b>①</b> Because this information was the key to their profitability, these firms worked in relative secrecy, frequently built on family ties, trust, and loyalty. <b>②</b> In addition, these firms were able to benefit from the rise of commodity exchanges. <b>③</b> Agricultural markets are naturally unstable. <b>④</b> Their access to information in multiple markets enabled them to easily cover the risks.`,
stem:'다음 글에서 주어진 문장이 들어가기에 가장 적절한 곳은?\n\n<b>"The early grain trade firms were active in both surplus-producing and food deficit regions, and these firms made it their business to know the state of supply and demand in both."</b>',
det:{korean:'글의 도입부로, 곡물 무역 회사들의 활동 범위를 소개하는 문장은 <b>①</b>에 들어가야 합니다.',analysis:'① 뒤: 정보가 수익성의 핵심 (this information이 ①의 내용을 지칭)\n→ 회사 소개 → 정보의 중요성 순서',tip:'this information이 가리키는 내용(수급 정보)이 바로 앞에 있어야 합니다.'}},
{id:3,type:'어순배열',diff:'보통',pts:5,fmt:'mc',ans:2,
ch:['(A)-(B)-(C)','(A)-(C)-(B)','(B)-(A)-(C)','(B)-(C)-(A)','(C)-(A)-(B)'],
passage:`The early grain trade firms were active in both surplus-producing and food deficit regions.

(A) In addition, these firms were able to benefit from the rise of commodity exchanges and commodities futures markets that emerged in the mid-1800s.
(B) Because this information was the key to their profitability, these firms worked in relative secrecy, frequently built on family ties, trust, and loyalty.
(C) Agricultural markets are naturally unstable, due to changes in harvest size that result from variable weather patterns and other factors.`,
stem:'주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?',
det:{korean:'첫 문장(활동 범위) → (B) 정보가 수익성 핵심, 비밀 운영 → (A) 추가로 상품 거래소 활용 → (C) 농업 시장 불안정성',analysis:'(B): "this information"이 첫 문장의 수급 정보를 지칭\n(A): "In addition"으로 추가 정보 연결\n(C): 불안정성 → 위험 최소화로 이어짐',tip:'"this information"(B)이 첫 문장을 받으므로 B가 먼저, "In addition"(A)이 추가 연결'}},
{id:4,type:'어순배열',diff:'어려움',pts:6,fmt:'mc',ans:3,
ch:['(A)-(B)-(C)','(A)-(C)-(B)','(B)-(A)-(C)','(B)-(C)-(A)','(C)-(A)-(B)'],
passage:`Agricultural markets are naturally unstable, due to changes in harvest size that result from variable weather patterns and other factors.

(A) Their access to information in multiple markets enabled them to easily cover the risks associated with agricultural commodity trade.
(B) Locking-in prices by buying and selling grain for future delivery helped these firms to minimize such risks.
(C) It made sense for the grain trading companies to manage their risks within a single firm that was operating in more than one country, rather than operating as independent national companies trading with each other.`,
stem:'주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?',
det:{korean:'시장 불안정 → (B) 가격 고정으로 위험 최소화 → (C) 단일 회사 운영이 합리적 → (A) 정보 접근으로 위험 상쇄',analysis:'(B): "such risks"가 첫 문장의 불안정성을 지칭\n(C): 위험 관리 → 단일 회사 운영으로 확장\n(A): 정보 접근 → 위험 상쇄로 결론',tip:'"such risks"(B)가 불안정성을 받으므로 B먼저, C→A로 논리 전개'}},
{id:5,type:'어법 5지선다',diff:'쉬움',pts:4,fmt:'mc',ans:3,
ch:['① to know','② frequently','③ emerged','④ enable','⑤ associated'],
passage:`The early grain trade firms were active in both surplus-producing and food deficit regions, and these firms made it their business ①<u>to know</u> the state of supply and demand in both. Because this information was the key to their profitability, these firms worked in relative secrecy, ②<u>frequently</u> built on family ties, trust, and loyalty. In addition, these firms were able to benefit from the rise of commodity exchanges that ③<u>emerged</u> in the mid-1800s. Their access to information in multiple markets ④<u>enable</u> them to easily cover the risks ⑤<u>associated</u> with agricultural commodity trade.`,
stem:'밑줄 친 부분 중, 어법상 틀린 것은?',
det:{korean:'④ enable → <b>enabled</b>: 주어(Their access)가 3인칭 단수이고 과거 시제이므로 enabled가 되어야 합니다.',analysis:'① to know: make it their business to V (올바름)\n② frequently: 부사 수식 (올바름)\n③ emerged: 관계대명사절 과거동사 (올바름)\n④ enable → enabled: 과거 시제 + 3인칭 단수\n⑤ associated: 과거분사 (올바름)',tip:'주어-동사 수일치와 시제를 확인하세요. access(단수) + 과거 문맥 → enabled'}},
{id:6,type:'어법 5지선다',diff:'보통',pts:5,fmt:'mc',ans:1,

{id:7,type:'어법 5지선다',diff:'어려움',pts:6,fmt:'mc',ans:4,
ch:['① surplus-producing','② secrecy','③ futures','④ variable','⑤ easy'],
passage:`The early grain trade firms were active in both ①<u>surplus-producing</u> and food deficit regions. These firms worked in relative ②<u>secrecy</u>. They benefited from the rise of commodities ③<u>futures</u> markets. Agricultural markets are unstable due to ④<u>variable</u> weather patterns. Their access to information enabled them to ⑤<u>easy</u> cover the risks.`,

{id:8,type:'부적절어휘',diff:'쉬움',pts:4,fmt:'mc',ans:3,

passage:`The early grain trade firms were active in both ①<u>surplus</u>-producing and food ②<u>deficit</u> regions. Agricultural markets are naturally characterized by ③<u>stability</u>, due to changes in harvest size that result from ④<u>variable</u> weather patterns. Their access to information enabled them to easily ⑤<u>cover</u> the risks.`,

function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name,answers:S.ans.slice()});if(h.length>20)h.length=20;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map((x,idx)=>`<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade} · ${x.level||''}</div></div><div class="hi-right"><div class="hi-score" style="color:${x.score>=80?'var(--o)':'var(--r)'}">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div></div>${x.answers?`<button onclick="reviewHistory(${idx})" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid #dde8df;border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--o)">📝 정답·해설 다시 보기</button>`:''}</div>`).join('');p.style.display='block';}
function getLevel(s){if(s>=95)return{name:'마스터',icon:'👑',range:'95~100',msg:'이 단원은 정복했어요!'};if(s>=85)return{name:'챌린저',icon:'🌟',range:'85~94',msg:'거의 완벽, 한 끗 차이!'};if(s>=75)return{name:'파이터',icon:'💎',range:'75~84',msg:'통과! 약점만 잡으면 마스터'};if(s>=50)return{name:'루키',icon:'🔥',range:'50~74',msg:'기본기 OK, 유형별 훈련 필요'};return{name:'스타터',icon:'📖',range:'0~49',msg:'지문 해석부터 다시!'};}
function getTypeAdvice(t){const m={'(A)(B)(C) 조합형':'반의어 함정 주의, 원문 단어 정확히 암기','문맥상 부적절한 어휘':'밑줄 단어가 반의어로 바뀌었는지 확인','동의어 고르기':'동의어 쌍을 세트로 묶어 암기','반의어 고르기':'반의어 쌍을 세트로 묶어 암기','빈칸 어휘 완성':'문맥 단서(clue) 찾기 연습 필요','다의어 문맥적 의미':'다의어의 여러 뜻을 문맥별로 구분','영영풀이 매칭':'영영사전 정의 읽기 연습','어형 변환 (서술형)':'품사 변환 규칙(명↔형, 동↔명) 정리','빈칸 문맥 완성':'글의 흐름과 논리적 연결 파악','어법':'핵심 어법 규칙 정리 및 반복 연습','내용일치':'지문과 선지를 꼼꼼히 대조','내용불일치':'함정 선지의 미세한 차이 찾기','T/F':'원문과 진술을 정확히 대조','서술형':'정확한 철자와 어형 변환 주의','빈칸추론':'빈칸 전후 문맥 단서 찾기','빈칸 추론':'빈칸 전후 문맥 단서 찾기','문장삽입':'글의 흐름과 연결사 파악','어순배열':'문장 구조(S+V+O) 정확히 파악','어휘':'문맥에서 적절한 어휘 고르기 연습','내용이해':'지문 핵심 내용 정확히 파악'};return m[t]||'해당 유형 집중 복습 필요';}
function fmtTime(s){return Math.floor(s/60)+'분 '+s%60+'초';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function startExam(){
  const nm=document.getElementById('inpName').value.trim();
  if(!nm){toast('이름을 입력해주세요!');return;}
  S={ans:Array(EI.totalQ).fill(null),cur:0,ti:null,left:EI.time,start:Date.now(),order:shuffle([...Array(EI.totalQ).keys()])};
  showScreen('examScreen');
  showQ(0);
  startTimer();
  updateProgress();
  initSwipe();
}
function showQ(idx,direction){
  S.cur=idx;
  const qi=S.order?S.order[idx]:idx;
  const q=Q[qi];
  const tc=typeTag[q.type]||'';
  const mk='①②③④⑤';
  const pp=document.getElementById('slidePassage');
  if(direction){
    pp.classList.add(direction>0?'fade-out':'fade-in');
    setTimeout(()=>{
      renderContent(idx,qi,q,tc,mk,pp);
      pp.classList.remove('fade-out','fade-in');
    },150);
  } else {
    renderContent(idx,qi,q,tc,mk,pp);
  }
}
function renderContent(idx,qi,q,tc,mk,pp){
  let ph='<div class="q-badge"><div class="q-num">'+( idx+1)+'</div><span>'+q.type+'</span><span style="opacity:.6">'+q.diff+' \u00b7 '+q.pts+'\uc810</span></div>';
  if(q.passage) ph+='<div class="q-passage">'+q.passage+'</div>';
  else ph+='<div style="padding:30px;text-align:center;color:var(--tl)">\uc774 \ubb38\ud56d\uc740 \uc9c0\ubb38\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.</div>';
  pp.innerHTML=ph;
  pp.scrollTop=0;
  const bt=document.getElementById('slideBottom');
  let bh='<div class="slide-stem">'+q.stem+'</div><div class="slide-choices">';
  if(q.fmt==='mc'){
    q.ch.forEach(function(c,ci){
      var sel=S.ans[qi]===ci?' selected':'';
      bh+='<button class="choice-btn'+sel+'" onclick="selectAns('+idx+','+ci+')"><span class="c-num">'+mk[ci]+'</span><span>'+c+'</span></button>';
    });
  }
  if(q.fmt==='written'){
    var val=S.ans[qi]||'';
    bh+='<input class="written-input" value="'+val+'" placeholder="\ub2f5\uc548\uc744 \uc785\ub825\ud558\uc138\uc694..." oninput="writeAns('+idx+',this.value)">';
  }
  bh+='</div><div class="slide-nav"><button '+(idx===0?'disabled ':'')+' onclick="navQ(-1)">\u2190 \uc774\uc804</button><span class="nav-cur">'+(idx+1)+' / '+EI.totalQ+'</span><button class="sn-next" '+(idx===EI.totalQ-1?'disabled ':'')+' onclick="navQ(1)">\ub2e4\uc74c \u2192</button></div>';
  bt.innerHTML=bh;
}
function selectAns(idx,ci){
  var qi=S.order?S.order[idx]:idx;
  S.ans[qi]=ci;
  var btns=document.querySelectorAll('.slide-choices .choice-btn');
  btns.forEach(function(b,i){
    b.classList.toggle('selected',i===ci);
    if(i===ci)b.classList.add('just-selected');
  });
  updateProgress();
  setTimeout(function(){if(idx<EI.totalQ-1)showQ(idx+1,1);},400);
}
function writeAns(idx,val){
  var qi=S.order?S.order[idx]:idx;
  S.ans[qi]=val.trim()||null;
  updateProgress();
}
function navQ(dir){
  var next=S.cur+dir;
  if(next>=0&&next<EI.totalQ)showQ(next,dir);
}
function updateProgress(){
  var answered=S.ans.filter(function(a){return a!==null;}).length;
  document.getElementById('progressFill').style.width=(answered/EI.totalQ*100)+'%';
  document.getElementById('ansCount').textContent=answered+'/'+EI.totalQ;
}
function initSwipe(){
  var startX=0,startY=0;
  var el=document.getElementById('slideWrap');
  el.addEventListener('touchstart',function(e){startX=e.touches[0].clientX;startY=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-startX;
    var dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0&&S.cur<EI.totalQ-1)navQ(1);
      if(dx>0&&S.cur>0)navQ(-1);
    }
  },{passive:true});
}

function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}

h+=`<div class="rs"><div class="rs-title">🔍 내신핏 약점 진단</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'var(--o)':p>=50?'var(--o)':'var(--r)';const icon=p===100?'✅':p>=50?'⚠️':'❌';h+=`<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:13px">${icon}</span><span style="font-size:13px;font-weight:700;flex:1">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-size:13px;font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div>${p<100?`<div style="font-size:11px;color:var(--tm);margin-top:3px;padding-left:21px">→ ${getTypeAdvice(type)}</div>`:''}</div>`;});h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 내신핏 처방</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">👑</div><div class="plan-text"><h4>마스터 달성!</h4><p>이 단원은 완벽합니다. 다음 단원에 도전하세요!</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">🌟</div><div class="plan-text"><h4>통과! 마스터까지 한 끗</h4><p>아래 약점 유형만 집중하면 마스터 달성!</p></div>`;else if(pct>=50)h+=`<div class="plan-icon">🔥</div><div class="plan-text"><h4>기본기는 있어요!</h4><p>오답 해설을 꼼꼼히 확인하고, 약점 유형부터 공략하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>지문 해석부터!</h4><p>본문을 완벽히 이해한 뒤 재도전하세요. 해설의 한글 해석을 활용!</p></div>`;h+=`</div></div>`;

function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
