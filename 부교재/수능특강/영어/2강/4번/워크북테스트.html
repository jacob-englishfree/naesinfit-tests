const PASSAGE=`Vera couldn\'t wait for her car to get fixed, but that was going to require longer than initially expected. Unfortunately, that meant relying on the bus for her commute. To add to the cruel irony, it hadn\'t stopped raining for the past three days. It was already past 7 PM when she stepped off the bus, cold and soaked to the bone, having left her umbrella at the gym. Her place was just one block down the street, but it felt like ten miles in this weather. Her legs moved on their own, and suddenly, the Cups & Blossoms\' bell was ringing above her head. The warm, floral scent wrapped around her like a blanket, but it was another kind of welcome that surprised her \u2014 a smile from the caf\u00e9 owner, soft and unassuming. She was also polite enough not to ask why Vera looked so tired, which was appreciated. Vera now seemed to realize what she had truly needed. Just a friendly face to ease the weight she carried.`;

{"id":3,"type":"어법","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["①","②","③"],"passage":"It was already past 7 PM when she stepped off the bus, cold and ①<u>soaking</u> to the bone, ②<u>having left</u> her umbrella at the gym. Her place was just one block down the street, but it ③<u>felt</u> like ten miles in this weather.","stem":"밑줄 친 ①~③ 중 어법상 틀린 것은?","det":{"korean":"① soaking → soaked: 'soaked to the bone'은 관용구. Vera가 비에 젖은(수동) 상태이므로 과거분사.","analysis":"❌ ①soaking → soaked: soaked to the bone(뼛속까지 젖은) 관용구<br>✅ ②having left: 완료분사구문(앞선 동작)<br>✅ ③felt: 감각동사(felt like = ~처럼 느꼈다)","tip":"soaked to the bone = 뼛속까지 젖은 (관용 표현, 과거분사)"}},
