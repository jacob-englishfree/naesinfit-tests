.tag-combo{background:var(--gl);color:#166534;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}

.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8efe9;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),var(--gl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--gxxl);border-radius:var(--rs);border:1px solid #dde8df;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}

.plan-card{display:flex;gap:14px;padding:16px;background:var(--gxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}

.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
.q-given-sentence{background:var(--gl);border-radius:8px;padding:10px 14px;margin-top:8px;font-size:13px;line-height:1.6;font-weight:600;color:var(--gd);}

const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"2강","lesson":"Gateway","title":"Emotional Change","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_suneung_02_gw_v1"};

const P_GW=`"Where could it be?" Sophie asked herself. It had been more than ten years since she had last visited the area where she had grown up. The village had changed a lot over time. Uncertain, she awkwardly looked around at her surroundings. She walked the narrow streets of the village, unsure about which way to go. Suddenly, Sophie saw a familiar sight. "Yes, this must be it," she thought. In front of her was a wall with flowers painted on it. Although the colors were now faded, the familiar shapes on the wall were the same ones she had painted with her father as a child. Sophie nodded, smiled brightly, and walked toward the gate. At last, she had finally found the house she had grown up in.`;

const Q=[
{id:1,type:'어법',diff:'쉬움',pts:4,fmt:'mc',ans:1,ch:['has been','had been','was being','have been'],passage:`"Where could it be?" Sophie asked herself. It __________ more than ten years since she had last visited the area where she had grown up. The village had changed a lot over time. Uncertain, she awkwardly looked around at her surroundings.`,stem:'다음 빈칸에 들어갈 말로 가장 적절한 것은?',det:{korean:'It had been + 시간 + since + 과거완료: 과거의 특정 시점부터 그 이전까지의 기간을 나타내는 대과거 표현입니다.',analysis:'✅ ②had been: It had been ~ since she had last visited (대과거)<br>❌ ①has been: 현재완료 (과거 시점 기준이 아님)<br>❌ ③was being: 진행 수동태 (문맥 부적절)<br>❌ ④have been: 현재완료 복수 (It과 불일치)',tip:'It had been + 기간 + since + 과거완료 = ~한 지 ...이 되었다'}},

{id:2,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:2,ch:['paint','painting','painted','to paint'],passage:`In front of her was a wall with flowers __________ on it. Although the colors were now faded, the familiar shapes on the wall were the same ones she had painted with her father as a child.`,stem:'다음 빈칸에 들어갈 말로 가장 적절한 것은?',det:{korean:'flowers가 그려진 것(수동)이므로 과거분사 painted가 적절합니다.',analysis:'✅ ③painted: with + 명사 + p.p. (수동 관계)<br>❌ ①paint: 원형<br>❌ ②painting: 능동 (꽃이 스스로 그린 것이 아님)<br>❌ ④to paint: 목적 부정사',tip:'with + 명사 + p.p. = ~가 ...된 채로 (수동 관계)'}},

{id:3,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:0,ch:['where','which','what','that'],passage:`It had been more than ten years since she had last visited the area __________ she had grown up. The village had changed a lot over time.`,stem:'다음 빈칸에 들어갈 말로 가장 적절한 것은?',det:{korean:'area(장소)를 선행사로 하는 관계부사 where가 적절합니다.',analysis:'✅ ①where: 장소 선행사 area + 관계부사<br>❌ ②which: 관계대명사 (전치사 in which는 가능하나 단독 which는 불가)<br>❌ ③what: 선행사를 포함하는 관계대명사 (선행사 area가 이미 있음)<br>❌ ④that: 관계부사가 아님',tip:'the area where = the area in which (장소 선행사 + 관계부사)'}},

{id:4,type:'어법',diff:'어려움',pts:6,fmt:'mc',ans:2,ch:['①','②','③'],passage:`"Where could it be?" Sophie asked herself. It had been more than ten years since she had last visited the area where she had grown up. The village had changed a lot over time. Uncertain, she awkwardly looked around at her surroundings. She walked the narrow streets of the village, unsure about ①<u>which</u> way to go. Suddenly, Sophie saw a familiar sight. "Yes, this must be it," she thought. In front of her was a wall with flowers painted on it. Although the colors were now faded, the familiar shapes on the wall were ②<u>the same ones</u> she had painted with her father as a child. Sophie nodded, smiled brightly, and walked toward the gate. At last, she had finally ③<u>finding</u> the house she had grown up in.`,stem:'밑줄 친 ①~③ 중 어법상 틀린 것은?',det:{korean:'③ finding → found: had + 과거분사 구조에서 finding은 불가. had finally found가 올바릅니다.',analysis:'❌ ③finding: had finally found(과거완료)가 올바른 형태<br>✅ ①which: which way to go(어느 쪽으로 갈지)<br>✅ ②the same ones: the same ones (that) she had painted (동일한 것들)',tip:'had + p.p. (과거완료) — had finally found = 마침내 찾았었다'}},

{id:5,type:'어법',diff:'어려움',pts:6,fmt:'mc',ans:1,ch:['①','②','③'],passage:`"Where could it be?" Sophie ①<u>asked</u> herself. It had been more than ten years since she had last visited the area where she had grown up. The village had changed a lot over time. Uncertain, she awkwardly looked around at her surroundings. She walked the narrow streets of the village, ②<u>unsuring</u> about which way to go. Suddenly, Sophie saw a familiar sight. In front of her was a wall with flowers painted on it. Although the colors were now faded, the familiar shapes on the wall were the same ones she had painted with her father ③<u>as</u> a child.`,stem:'밑줄 친 ①~③ 중 어법상 틀린 것은?',det:{korean:'② unsuring → unsure: unsure는 형용사로 -ing 형태가 없습니다. 분사구문이 아닌 형용사 보어입니다.',analysis:'❌ ②unsuring: unsure는 형용사 원형 그대로 사용 (분사형 없음)<br>✅ ①asked: Sophie asked herself (재귀대명사 목적어)<br>✅ ③as: as a child = 어린아이였을 때 (자격/시기의 as)',tip:'unsure = 형용사 (동사 파생이 아니므로 -ing 불가)'}},

{id:6,type:'내용일치',diff:'쉬움',pts:4,fmt:'mc',ans:2,ch:['Sophie가 마을에 처음 방문했다.','마을은 시간이 지나도 변하지 않았다.','Sophie는 벽에 그려진 꽃을 보고 집을 알아보았다.','Sophie는 아버지와 함께 마을을 방문했다.','벽화의 색은 여전히 선명했다.'],passage:P_GW,stem:'다음 글의 내용과 일치하는 것은?',det:{korean:'Sophie는 벽에 그려진 꽃 모양을 보고 어린 시절 아버지와 함께 그린 것임을 알아보았습니다.',analysis:'✅ ③ 벽의 꽃 모양이 아버지와 함께 그린 것과 같다고 인식 → 일치<br>❌ ① "last visited" = 마지막 방문, 처음이 아님<br>❌ ② "changed a lot" = 많이 변했다<br>❌ ④ 혼자 방문 (asked herself)<br>❌ ⑤ "colors were now faded" = 바랬다',tip:'벽화의 모양(shapes)이 같았지만, 색(colors)은 바랬다는 점 구분'}},

{id:7,type:'내용일치',diff:'보통',pts:5,fmt:'mc',ans:3,ch:['Sophie는 마을 길이 넓어서 쉽게 찾았다.','Sophie는 벽화를 혼자서 그렸다.','마을은 10년 전과 거의 같았다.','Sophie는 처음에 불확실했지만 결국 집을 찾았다.','Sophie는 대문 앞에서 슬프게 울었다.'],passage:P_GW,stem:'다음 글의 내용과 일치하는 것은?',det:{korean:'Sophie는 처음에 Uncertain 상태였지만, 벽화를 발견하고 결국 집을 찾아 밝게 미소 지었습니다.',analysis:'✅ ④ Uncertain → finally found the house → smiled brightly<br>❌ ① narrow streets (좁은 거리)<br>❌ ② painted with her father (아버지와 함께)<br>❌ ③ changed a lot (많이 변했다)<br>❌ ⑤ smiled brightly (밝게 미소 지었다)',tip:'심경 변화: uncertain/awkward → familiar/bright → relief/joy'}},

{id:8,type:'내용불일치',diff:'보통',pts:5,fmt:'mc',ans:2,ch:['Sophie는 자신이 자란 지역을 방문했다.','Sophie는 좁은 거리를 걸었다.','벽화의 색은 여전히 밝고 선명했다.','Sophie는 대문을 향해 걸어갔다.','Sophie가 벽화를 아버지와 함께 그렸다.'],passage:P_GW,stem:'다음 중 글의 내용과 <b>일치하지 않는</b> 것은?',det:{korean:'③ 벽화의 색은 "now faded"(바랬다)이지, 밝고 선명한 것이 아닙니다.',analysis:'❌ ③ faded(바랜) ≠ 밝고 선명한 → 불일치<br>✅ ① the area where she had grown up → 일치<br>✅ ② narrow streets → 일치<br>✅ ④ walked toward the gate → 일치<br>✅ ⑤ painted with her father as a child → 일치',tip:'faded(바랜) vs bright/vivid(선명한) — 시간이 지나 색이 흐려진 상태'}},

{id:9,type:'내용불일치',diff:'어려움',pts:6,fmt:'mc',ans:3,ch:['Sophie는 10년 넘게 그 지역을 방문하지 않았다.','마을이 시간이 지나면서 많이 변했다.','Sophie는 어느 쪽으로 가야 할지 확신이 없었다.','Sophie는 벽화의 모양이 변해 있는 것을 보았다.','Sophie는 마침내 자신이 자란 집을 찾았다.'],passage:P_GW,stem:'다음 중 글의 내용과 <b>일치하지 않는</b> 것은?',det:{korean:'④ 벽화의 모양은 "the same ones"(같은 것들)이었습니다. 모양이 변한 것이 아니라 색만 바랬습니다.',analysis:'❌ ④ shapes were the same(같았다) ≠ 변해 있었다 → 불일치<br>✅ ① more than ten years → 일치<br>✅ ② changed a lot → 일치<br>✅ ③ unsure about which way to go → 일치<br>✅ ⑤ finally found the house → 일치',tip:'colors faded(색 바랬) vs shapes same(모양 같았) — 색과 모양을 구분'}},

{id:10,type:'T/F',diff:'쉬움',pts:4,fmt:'mc',ans:1,ch:['True','False'],passage:P_GW,stem:'다음 문장이 본문과 일치하면 True, 일치하지 않으면 False를 선택하시오.<br><br><b>"Sophie had visited the village within the last five years."</b>',det:{korean:'"more than ten years"(10년 넘게)이므로 5년 이내 방문은 거짓입니다.',analysis:'❌ False: more than ten years ≠ within the last five years<br>10년 넘게 방문하지 않았으므로 5년 이내는 거짓',tip:'숫자 정보 정확히 대조: more than ten years vs five years'}},

{id:11,type:'T/F',diff:'보통',pts:5,fmt:'mc',ans:0,ch:['True','False'],passage:P_GW,stem:'다음 문장이 본문과 일치하면 True, 일치하지 않으면 False를 선택하시오.<br><br><b>"Sophie painted the wall with her father when she was a child."</b>',det:{korean:'"the same ones she had painted with her father as a child" — 어린 시절 아버지와 함께 벽화를 그렸습니다.',analysis:'✅ True: "painted with her father as a child" = 어린 시절 아버지와 그렸다<br>원문과 정확히 일치',tip:'as a child = 어린아이였을 때'}},

{id:12,type:'T/F',diff:'어려움',pts:6,fmt:'mc',ans:1,ch:['True','False'],passage:P_GW,stem:'다음 문장이 본문과 일치하면 True, 일치하지 않으면 False를 선택하시오.<br><br><b>"The village had remained unchanged since Sophie last visited."</b>',det:{korean:'"The village had changed a lot over time" — 마을은 많이 변했으므로 unchanged(변하지 않은)는 거짓입니다.',analysis:'❌ False: changed a lot ≠ remained unchanged<br>마을이 많이 변했다는 원문과 반대',tip:'changed a lot(많이 변했다) ↔ remained unchanged(변하지 않았다)'}},

{id:13,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'faded',accept:['faded','Faded'],ch:null,passage:P_GW,stem:'다음 글에서 벽화의 색이 어떻게 되었는지를 나타내는 단어를 본문에서 <b>1단어</b>로 찾아 쓰시오.',det:{korean:'"the colors were now faded" — 색이 바랬다(faded).',analysis:'faded = 바랜, 흐려진<br>시간이 지나면서 벽화의 색이 바랜 상태를 나타냄',tip:'faded = 바랜, 흐려진 — 시간의 흐름에 따른 색상 변화'}},

{id:14,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'surroundings',accept:['surroundings','Surroundings'],ch:null,passage:P_GW,stem:'다음 글에서 Sophie가 어색하게 둘러본 대상을 본문에서 <b>1단어</b>로 찾아 쓰시오.',det:{korean:'"she awkwardly looked around at her surroundings" — 주변 환경(surroundings).',analysis:'surroundings = 주변 환경<br>Uncertain한 상태에서 주변을 둘러본 것',tip:'surroundings = 주변 환경, 주위의 사물과 상황'}},

{id:15,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'Uncertain',accept:['Uncertain','uncertain'],ch:null,passage:P_GW,stem:'다음 글에서 Sophie가 주변을 둘러볼 때의 심리 상태를 나타내는 단어를 본문에서 <b>1단어</b>로 찾아 쓰시오.',det:{korean:'"Uncertain, she awkwardly looked around" — 불확실한(Uncertain) 상태였습니다.',analysis:'Uncertain = 불확실한, 확신이 없는<br>오랫동안 방문하지 않아 길을 모르는 심리 상태',tip:'Uncertain(불확실한) — 문장 앞에서 분사구문처럼 심리 상태를 나타냄'}},

{id:16,type:'서술형',diff:'어려움',pts:6,fmt:'written',wa:'gate',accept:['gate','Gate','the gate'],ch:null,passage:P_GW,stem:'다음 글에서 Sophie가 미소 지으며 걸어간 목적지를 본문에서 <b>1단어</b>로 찾아 쓰시오.',det:{korean:'"walked toward the gate" — 대문(gate)을 향해 걸어갔습니다.',analysis:'gate = 대문, 출입구<br>집을 찾은 후 대문을 향해 걸어간 것',tip:'gate(대문) — 집으로 들어가는 입구'}},

{id:17,type:'빈칸추론',diff:'보통',pts:5,fmt:'mc',ans:1,ch:['curious','uncertain','confident','excited'],passage:`"Where could it be?" Sophie asked herself. It had been more than ten years since she had last visited the area where she had grown up. The village had changed a lot over time. __________, she awkwardly looked around at her surroundings. She walked the narrow streets of the village, unsure about which way to go.`,stem:'다음 빈칸에 들어갈 말로 가장 적절한 것은?',det:{korean:'10년 넘게 방문하지 않아 불확실한(Uncertain) 상태였습니다.',analysis:'✅ ②uncertain: 오랜 부재 + awkwardly + unsure와 일관된 맥락<br>❌ ①curious(호기심): awkwardly와 어울리지 않음<br>❌ ③confident(자신 있는): unsure와 모순<br>❌ ④excited(흥분한): awkwardly와 어울리지 않음',tip:'문맥 단서: awkwardly, unsure → uncertain이 가장 자연스러움'}},

{id:18,type:'빈칸추론',diff:'보통',pts:5,fmt:'mc',ans:2,ch:['complained','cried','nodded','frowned'],passage:`Although the colors were now faded, the familiar shapes on the wall were the same ones she had painted with her father as a child. Sophie __________, smiled brightly, and walked toward the gate. At last, she had finally found the house she had grown up in.`,stem:'다음 빈칸에 들어갈 말로 가장 적절한 것은?',det:{korean:'집을 찾은 확신의 순간에 고개를 끄덕이고(nodded) 밝게 미소 지었습니다.',analysis:'✅ ③nodded(고개를 끄덕이다): 확인/만족의 제스처 + smiled brightly와 자연스러운 연결<br>❌ ①complained(불평하다): 밝은 미소와 모순<br>❌ ②cried(울다): smiled brightly와 어울리지 않음<br>❌ ④frowned(찡그리다): 긍정적 맥락과 모순',tip:'nodded = 고개를 끄덕이다 — 확인, 동의, 만족의 제스처'}},

{id:19,type:'빈칸추론',diff:'보통',pts:5,fmt:'mc',ans:3,ch:['destroyed','renovated','abandoned','found'],passage:`Sophie nodded, smiled brightly, and walked toward the gate. At last, she had finally __________ the house she had grown up in.`,stem:'다음 빈칸에 들어갈 말로 가장 적절한 것은?',det:{korean:'마침내(At last, finally) 자란 집을 찾았다(found).',analysis:'✅ ④found(찾다): At last + finally → 오랜 탐색 끝에 찾은 것<br>❌ ①destroyed(파괴하다): 밝은 미소와 모순<br>❌ ②renovated(개조하다): 방문 목적과 무관<br>❌ ③abandoned(버리다): 긍정적 맥락과 모순',tip:'At last + finally = 마침내 — 오랜 노력 끝의 성취'}},

{id:20,type:'빈칸추론',diff:'쉬움',pts:4,fmt:'mc',ans:0,ch:['familiar','faded','painted','narrow','bright'],passage:`She walked the narrow streets of the village, unsure about which way to go. Suddenly, Sophie saw a __________ sight. "Yes, this must be it," she thought. In front of her was a wall with flowers painted on it.`,stem:'다음 빈칸에 들어갈 말로 가장 적절한 것은?',det:{korean:'익숙한(familiar) 광경을 보고 "이곳이 틀림없어"라고 확신한 것입니다.',analysis:'✅ ①familiar(익숙한): "Yes, this must be it"이라는 확신의 근거<br>❌ ②faded(바랜): 색에 대한 설명이지 광경에 대한 인상 아님<br>❌ ③painted(칠해진): 벽화 설명이지 광경의 첫인상 아님<br>❌ ④narrow(좁은): 거리 설명에 이미 사용됨<br>❌ ⑤bright(밝은): 미소에 사용된 형용사',tip:'familiar sight = 익숙한 광경 — 과거 기억과 연결되는 시각적 단서'}}
];

const typeTag={'어법':'tag-grammar','내용일치':'tag-content','내용불일치':'tag-content','빈칸추론':'tag-blank','서술형':'tag-written','T/F':'tag-tf'};

let S={ans:[],cur:0,ti:null,left:EI.time,start:0};

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name,answers:S.ans.slice()});if(h.length>20)h.length=20;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map((x,idx)=>`<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade} · ${x.level||''}</div></div><div class="hi-right"><div class="hi-score" style="color:${x.score>=80?'var(--g)':'var(--r)'}">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div></div>${x.answers?`<button onclick="reviewHistory(${idx})" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid #dde8df;border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--g)">📝 정답·해설 다시 보기</button>`:''}</div>`).join('');p.style.display='block';}
function getLevel(s){if(s>=95)return{name:'마스터',icon:'👑',range:'95~100',msg:'이 단원은 정복했어요!'};if(s>=85)return{name:'챌린저',icon:'🌟',range:'85~94',msg:'거의 완벽, 한 끗 차이!'};if(s>=75)return{name:'파이터',icon:'💎',range:'75~84',msg:'통과! 약점만 잡으면 마스터'};if(s>=50)return{name:'루키',icon:'🔥',range:'50~74',msg:'기본기 OK, 유형별 훈련 필요'};return{name:'스타터',icon:'📖',range:'0~49',msg:'지문 해석부터 다시!'};}
function getTypeAdvice(t){const m={'(A)(B)(C) 조합형':'반의어 함정 주의, 원문 단어 정확히 암기','문맥상 부적절한 어휘':'밑줄 단어가 반의어로 바뀌었는지 확인','동의어 고르기':'동의어 쌍을 세트로 묶어 암기','반의어 고르기':'반의어 쌍을 세트로 묶어 암기','빈칸 어휘 완성':'문맥 단서(clue) 찾기 연습 필요','다의어 문맥적 의미':'다의어의 여러 뜻을 문맥별로 구분','영영풀이 매칭':'영영사전 정의 읽기 연습','어형 변환 (서술형)':'품사 변환 규칙(명↔형, 동↔명) 정리','빈칸 문맥 완성':'글의 흐름과 논리적 연결 파악','어법':'핵심 어법 규칙 정리 및 반복 연습','내용일치':'지문과 선지를 꼼꼼히 대조','내용불일치':'함정 선지의 미세한 차이 찾기','T/F':'원문과 진술을 정확히 대조','서술형':'정확한 철자와 어형 변환 주의','빈칸추론':'빈칸 전후 문맥 단서 찾기','빈칸 추론':'빈칸 전후 문맥 단서 찾기','문장삽입':'글의 흐름과 연결사 파악','어순배열':'문장 구조(S+V+O) 정확히 파악','어휘':'문맥에서 적절한 어휘 고르기 연습','내용이해':'지문 핵심 내용 정확히 파악'};return m[t]||'해당 유형 집중 복습 필요';}
function fmtTime(s){return Math.floor(s/60)+'분 '+s%60+'초';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function startExam(){const nm=document.getElementById('inpName').value.trim();if(!nm){toast('이름을 입력해주세요!');return;}S={ans:Array(EI.totalQ).fill(null),cur:0,ti:null,left:EI.time,start:Date.now(),order:shuffle([...Array(EI.totalQ).keys()])};showScreen('examScreen');showQ(0);startTimer();updateProgress();initSwipe();}
function showQ(idx,direction){S.cur=idx;const qi=S.order?S.order[idx]:idx;const q=Q[qi];const tc=typeTag[q.type]||'';const mk='①②③④⑤';const pp=document.getElementById('slidePassage');if(direction){pp.classList.add(direction>0?'fade-out':'fade-in');setTimeout(()=>{renderContent(idx,qi,q,tc,mk,pp);pp.classList.remove('fade-out','fade-in');},150);}else{renderContent(idx,qi,q,tc,mk,pp);}}
function renderContent(idx,qi,q,tc,mk,pp){let ph='<div class="q-badge"><div class="q-num">'+(idx+1)+'</div><span>'+q.type+'</span><span style="opacity:.6">'+q.diff+' · '+q.pts+'점</span></div>';if(q.passage)ph+='<div class="q-passage">'+q.passage+'</div>';else ph+='<div style="padding:30px;text-align:center;color:var(--tl)">이 문항은 지문이 없습니다.</div>';pp.innerHTML=ph;pp.scrollTop=0;const bt=document.getElementById('slideBottom');let bh='<div class="slide-stem">'+q.stem+'</div><div class="slide-choices">';if(q.fmt==='mc'){q.ch.forEach(function(c,ci){var sel=S.ans[qi]===ci?' selected':'';bh+='<button class="choice-btn'+sel+'" onclick="selectAns('+idx+','+ci+')"><span class="c-num">'+mk[ci]+'</span><span>'+c+'</span></button>';});}if(q.fmt==='written'){var val=S.ans[qi]||'';bh+='<input class="written-input" value="'+val+'" placeholder="답안을 입력하세요..." oninput="writeAns('+idx+',this.value)">';}bh+='</div><div class="slide-nav"><button '+(idx===0?'disabled ':'')+' onclick="navQ(-1)">← 이전</button><span class="nav-cur">'+(idx+1)+' / '+EI.totalQ+'</span><button class="sn-next" '+(idx===EI.totalQ-1?'disabled ':'')+' onclick="navQ(1)">다음 →</button></div>';bt.innerHTML=bh;}
function selectAns(idx,ci){var qi=S.order?S.order[idx]:idx;S.ans[qi]=ci;var btns=document.querySelectorAll('.slide-choices .choice-btn');btns.forEach(function(b,i){b.classList.toggle('selected',i===ci);if(i===ci)b.classList.add('just-selected');});updateProgress();setTimeout(function(){if(idx<EI.totalQ-1)showQ(idx+1,1);},400);}
function writeAns(idx,val){var qi=S.order?S.order[idx]:idx;S.ans[qi]=val.trim()||null;updateProgress();}
function navQ(dir){var next=S.cur+dir;if(next>=0&&next<EI.totalQ)showQ(next,dir);}
function updateProgress(){var answered=S.ans.filter(function(a){return a!==null;}).length;document.getElementById('progressFill').style.width=(answered/EI.totalQ*100)+'%';document.getElementById('ansCount').textContent=answered+'/'+EI.totalQ;}
function initSwipe(){var startX=0,startY=0;var el=document.getElementById('slideWrap');el.addEventListener('touchstart',function(e){startX=e.touches[0].clientX;startY=e.touches[0].clientY;},{passive:true});el.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-startX;var dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&S.cur<EI.totalQ-1)navQ(1);if(dx>0&&S.cur>0)navQ(-1);}},{passive:true});}

function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}

h+=`<div class="rs"><div class="rs-title">🔍 내신핏 약점 진단</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'var(--g)':p>=50?'var(--o)':'var(--r)';const icon=p===100?'✅':p>=50?'⚠️':'❌';h+=`<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:13px">${icon}</span><span style="font-size:13px;font-weight:700;flex:1">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-size:13px;font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div>${p<100?`<div style="font-size:11px;color:var(--tm);margin-top:3px;padding-left:21px">→ ${getTypeAdvice(type)}</div>`:''}</div>`;});h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 내신핏 처방</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">👑</div><div class="plan-text"><h4>마스터 달성!</h4><p>이 단원은 완벽합니다. 다음 단원에 도전하세요!</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">🌟</div><div class="plan-text"><h4>통과! 마스터까지 한 끗</h4><p>아래 약점 유형만 집중하면 마스터 달성!</p></div>`;else if(pct>=50)h+=`<div class="plan-icon">🔥</div><div class="plan-text"><h4>기본기는 있어요!</h4><p>오답 해설을 꼼꼼히 확인하고, 약점 유형부터 공략하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>지문 해석부터!</h4><p>본문을 완벽히 이해한 뒤 재도전하세요. 해설의 한글 해석을 활용!</p></div>`;h+=`</div></div>`;

function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
