.tag-combo{background:var(--gl);color:#166534;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}

.q-passage{background:linear-gradient(135deg,#FAFDFB,#F5FAF6);border-left:3px solid var(--g);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}

.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}

.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gd),var(--g));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8efe9;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--g),var(--gl));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--gxxl);border-radius:var(--rs);border:1px solid #dde8df;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--gxl);}.info-cell.highlight .ic-value{color:var(--g);}

.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0dcd2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--g);color:var(--g);}.act-btn.primary{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}

.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--g);}.expl-box.tip-b{border-left:3px solid var(--g);background:var(--gxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

<script>
const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"2강","lesson":"3번","title":"Organ in Borneo","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_suneung_02_ex3_v1"};

const PASSAGE=`Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed smoothly under his fingers. The melody blended with the soft sounds of the jungle, filling him with happiness. The organ, his most precious possession, was a source of comfort and joy, especially in these uncertain times. But his peace was interrupted by the distant roar of engines breaking the calm. Soldiers appeared on the jungle road, their boots loud on the dirt as they approached, weapons hanging loosely over their shoulders. Francis' heart raced; it was wartime, and soldiers often took what they wanted. Whispering urgently to his sister, Ellen, he led her to hide behind a tall tree, its thick trunk shielding them. Peeking out, Francis stepped outside carefully and looked at the soldiers walking toward their home. Their loud voices and heavy footsteps filled the quiet jungle. His mind raced with prayers, hoping they would remain unseen.`;

{"id":3,"type":"내용이해","diff":"쉬움","pts":4,"fmt":"mc","ans":3,"ch":["① practiced","② happiness","③ interrupted","④ safety","⑤ urgently"],"passage":"Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had <u>① practiced</u> for weeks flowed smoothly under his fingers. The melody blended with the soft sounds of the jungle, filling him with <u>② happiness</u>. The organ, his most precious possession, was a source of comfort and joy, especially in these uncertain times. But his peace was <u>③ interrupted</u> by the distant roar of engines breaking the calm. Soldiers appeared on the jungle road, their boots loud on the dirt as they approached, weapons hanging loosely over their shoulders. Francis' heart raced; it was wartime, and soldiers often took what they wanted. As a result, he felt a sudden sense of <u>④ safety</u>. Whispering <u>⑤ urgently</u> to his sister, Ellen, he led her to hide behind a tall tree.","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"전시에 군인들이 다가오는 상황에서 갑자기 안전함(safety)을 느꼈다는 것은 문맥에 맞지 않습니다. 원문에서는 공포/긴장을 느끼는 맥락입니다. fear/danger가 적절합니다.","analysis":"✅ ① practiced(연습한): 몇 주간 연습한 찬송가로 적절<br>✅ ② happiness(행복): 멜로디가 행복으로 채워준 것으로 적절<br>✅ ③ interrupted(방해받은): 엔진 소리에 평화가 깨진 것으로 적절<br>❌ ④ safety(안전) → fear/danger: 군인이 다가오는 전시 상황에서 안전감은 부적절<br>✅ ⑤ urgently(긴급히): 위급한 상황에서 급히 속삭인 것으로 적절","tip":"전시 상황에서 군인 접근 → safety(안전)가 아닌 fear/danger(공포/위험)"}},

{"id":4,"type":"문맥상 부적절한 어휘","diff":"보통","pts":5,"fmt":"mc","ans":4,"ch":["① smoothly","② precious","③ distant","④ loosely","⑤ visible"],"passage":"Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed <u>① smoothly</u> under his fingers. The melody blended with the soft sounds of the jungle, filling him with happiness. The organ, his most <u>② precious</u> possession, was a source of comfort and joy, especially in these uncertain times. But his peace was interrupted by the <u>③ distant</u> roar of engines breaking the calm. Soldiers appeared on the jungle road, their boots loud on the dirt as they approached, weapons hanging <u>④ loosely</u> over their shoulders. His mind raced with prayers, hoping they would remain <u>⑤ visible</u>.","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"군인에게 발견되지 않기를 기도하는 상황이므로, visible(보이는)이 아닌 unseen(보이지 않는)이 적절합니다.","analysis":"✅ ① smoothly(부드럽게): 연습한 곡이 매끄럽게 흘러나온 것으로 적절<br>✅ ② precious(소중한): 오르간이 가장 소중한 소유물로 적절<br>✅ ③ distant(먼): 먼 곳에서 들리는 엔진 소리로 적절<br>✅ ④ loosely(느슨하게): 무기가 어깨에 느슨히 걸린 것으로 적절<br>❌ ⑤ visible(보이는) → unseen(보이지 않는): 숨어서 발견되지 않기를 바라는 맥락","tip":"unseen(보이지 않는) ↔ visible(보이는)"}},

{"id":5,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["worthless","ordinary","valuable","cheap","common"],"passage":"The organ, his most <u>precious</u> possession, was a source of comfort and joy.","stem":"밑줄 친 precious와 의미가 가장 가까운 것은?","det":{"korean":"precious = valuable = 소중한, 귀중한. 오르간이 가장 소중한 소유물이라는 의미입니다.","analysis":"✅ valuable(가치 있는): precious의 동의어<br>❌ worthless(무가치한): precious의 반의어<br>❌ ordinary(평범한): precious와 반대 뉘앙스<br>❌ cheap(싼): precious의 반의어<br>❌ common(흔한): precious와 반대 의미","tip":"precious = valuable = invaluable (소중한, 귀중한)"}},

{"id":6,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["continued","maintained","disrupted","sustained","preserved"],"passage":"But his peace was <u>interrupted</u> by the distant roar of engines breaking the calm.","stem":"밑줄 친 interrupted와 의미가 가장 가까운 것은?","det":{"korean":"interrupted = disrupted = 방해받은, 중단된. 평화가 엔진 소리에 의해 방해받았습니다.","analysis":"✅ disrupted(방해된, 중단된): interrupted의 동의어<br>❌ continued(계속된): interrupted의 반의어<br>❌ maintained(유지된): interrupted의 반의어<br>❌ sustained(지속된): interrupted의 반의어<br>❌ preserved(보존된): interrupted의 반의어","tip":"interrupt = disrupt = disturb (방해하다, 중단시키다)"}},

{"id":7,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["casually","lazily","patiently","desperately","cheerfully"],"passage":"Whispering <u>urgently</u> to his sister, Ellen, he led her to hide behind a tall tree.","stem":"밑줄 친 urgently와 의미가 가장 가까운 것은?","det":{"korean":"urgently = desperately = 긴급히, 절박하게. 위험 상황에서 급히 속삭인 것입니다.","analysis":"✅ desperately(절박하게): urgently의 유의어<br>❌ casually(무심하게): urgently의 반의어<br>❌ lazily(게으르게): urgently의 반의어<br>❌ patiently(인내심 있게): urgently의 반의어<br>❌ cheerfully(즐겁게): 위급 상황과 반대 뉘앙스","tip":"urgently = desperately = pressingly (긴급히, 절박하게)"}},

{"id":8,"type":"반의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["rough","harsh","gentle","abrupt","intense"],"passage":"Their <u>loud</u> voices and heavy footsteps filled the quiet jungle.","stem":"밑줄 친 loud와 의미가 가장 반대인 것은?","det":{"korean":"loud(시끄러운) ↔ gentle(부드러운, 조용한). 군인들의 큰 목소리가 조용한 정글을 채웠습니다.","analysis":"✅ gentle(부드러운): loud의 반의어<br>❌ rough(거친): loud와 유사한 뉘앙스<br>❌ harsh(거센): loud와 유사<br>❌ abrupt(갑작스러운): loud와 다른 차원<br>❌ intense(강렬한): loud와 유사","tip":"loud(시끄러운) ↔ gentle(부드러운), quiet(조용한), soft(약한)"}},

{"id":9,"type":"반의어 고르기","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["anxious","fearful","agitated","tranquil","restless"],"passage":"Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed smoothly under his fingers. The melody blended with the soft sounds of the jungle, filling him with happiness. The organ, his most precious possession, was a source of comfort and joy, especially in these <u>uncertain</u> times.","stem":"밑줄 친 uncertain과 의미가 가장 반대인 것은?","det":{"korean":"uncertain(불확실한) ↔ tranquil(평온한, 안정된). uncertain times는 불안정한 시대를 의미하며, tranquil은 평온하고 안정된 상태를 뜻합니다.","analysis":"✅ tranquil(평온한): uncertain(불확실한, 불안한)의 반의어 — 안정된 상태<br>❌ anxious(불안한): uncertain과 유사한 의미<br>❌ fearful(두려운): uncertain과 유사한 부정적 뉘앙스<br>❌ agitated(동요된): uncertain과 유사<br>❌ restless(불안한): uncertain과 유사","tip":"uncertain(불확실한, 불안한) ↔ tranquil(평온한), stable(안정된), certain(확실한)"}},

{"id":10,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["melody","rhythm","silence","possession","instrument"],"passage":"Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed smoothly under his fingers. The melody blended with the soft sounds of the jungle, filling him with happiness. The organ, his most precious __________, was a source of comfort and joy, especially in these uncertain times.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"가장 소중한 소유물(possession)이라는 뜻입니다.","analysis":"✅ possession(소유물): most precious possession = 가장 소중한 소유물<br>❌ melody(멜로디): 오르간 자체가 아닌 소리<br>❌ rhythm(리듬): 소리 관련<br>❌ silence(침묵): 문맥과 반대<br>❌ instrument(악기): 유혹적이나 원문은 possession","tip":"possession = belonging = property (소유물)"}},

{"id":11,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["peace","comfort","silence","dream","melody"],"passage":"Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed smoothly under his fingers. The melody blended with the soft sounds of the jungle, filling him with happiness. The organ, his most precious possession, was a source of __________ and joy, especially in these uncertain times. But his peace was interrupted by the distant roar of engines breaking the calm.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"오르간은 위안(comfort)과 기쁨의 원천이었습니다.","analysis":"✅ comfort(위안): joy와 함께 오르간이 주는 정서적 가치<br>❌ peace(평화): 뒤에 나오는 his peace와 중복<br>❌ silence(침묵): 음악을 연주하는 맥락과 부적절<br>❌ dream(꿈): 문맥과 무관<br>❌ melody(멜로디): 감정적 가치가 아닌 소리","tip":"comfort = consolation = solace (위안, 위로)"}},

{"id":12,"type":"내용이해","diff":"어려움","pts":6,"fmt":"mc","ans":1,"ch":["visible","unseen","hidden","exposed","detected"],"passage":"Francis Pohan sat at the organ in his Borneo home. But his peace was interrupted by the distant roar of engines breaking the calm. Soldiers appeared on the jungle road, their boots loud on the dirt as they approached, weapons hanging loosely over their shoulders. Francis' heart raced; it was wartime, and soldiers often took what they wanted. Whispering urgently to his sister, Ellen, he led her to hide behind a tall tree, its thick trunk shielding them. Peeking out, Francis stepped outside carefully and looked at the soldiers walking toward their home. Their loud voices and heavy footsteps filled the quiet jungle. His mind raced with prayers, hoping they would remain __________.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"군인에게 발견되지 않기를(unseen) 기도하는 상황입니다.","analysis":"✅ unseen(보이지 않는): 숨어서 발견되지 않기를 바라는 맥락<br>❌ visible(보이는): 숨는 목적과 정반대<br>❌ hidden(숨겨진): 유사하나 원문은 unseen<br>❌ exposed(노출된): 숨는 것과 반대<br>❌ detected(발각된): 발견되지 않기를 원하는 맥락과 반대","tip":"unseen = unnoticed = undetected (보이지 않는, 발견되지 않는)"}},

{"id":13,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["경주하는","빠르게 뛰는","급하게 돌아가는","질주하는(차)","달리기 시합"],"passage":"Francis' heart <u>raced</u>; it was wartime, and soldiers often took what they wanted.","stem":"밑줄 친 raced가 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"heart raced = 심장이 빠르게 뛰었다. 군인을 본 공포로 심장 박동이 빨라진 상태입니다.","analysis":"✅ 빠르게 뛰는: 심장이 빠르게 뛰는 것을 의미<br>❌ 경주하는: 스포츠 경주 의미<br>❌ 급하게 돌아가는: 기계가 돌아가는 의미<br>❌ 질주하는(차): 자동차 관련<br>❌ 달리기 시합: 육상 경기","tip":"heart raced = 심장이 빠르게 뛰다 — 공포, 긴장의 신체 반응"}},

{"id":14,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["출처","근원","자료","원인","소스(요리)"],"passage":"The organ, his most precious possession, was a <u>source</u> of comfort and joy.","stem":"밑줄 친 source가 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"source of comfort and joy = 위안과 기쁨의 근원/원천. 오르간이 감정적 가치를 제공하는 원천입니다.","analysis":"✅ 근원: 감정적 가치의 원천이라는 의미<br>❌ 출처: 정보의 출처라는 의미 (여기서는 해당 안 됨)<br>❌ 자료: 참고 자료의 의미<br>❌ 원인: 부정적 사건의 원인 뉘앙스<br>❌ 소스(요리): 요리 관련","tip":"source of comfort = 위안의 원천/근원 — 감정적 가치를 제공하는 것"}},

const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx','어법':'tag-grammar','어휘 문맥':'tag-vocab','빈칸 추론':'tag-blank','서술형':'tag-written','내용 일치/불일치':'tag-content','TF 판별':'tag-tf','종합':'tag-ctx'};

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name,answers:S.ans.slice()});if(h.length>20)h.length=20;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map((x,idx)=>`<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade} · ${x.level||''}</div></div><div class="hi-right"><div class="hi-score" style="color:${x.score>=80?'var(--g)':'var(--r)'}">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div></div>${x.answers?`<button onclick="reviewHistory(${idx})" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid #dde8df;border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--g)">📝 정답·해설 다시 보기</button>`:''}</div>`).join('');p.style.display='block';}
function getLevel(s){if(s>=95)return{name:'마스터',icon:'👑',range:'95~100',msg:'이 단원은 정복했어요!'};if(s>=85)return{name:'챌린저',icon:'🌟',range:'85~94',msg:'거의 완벽, 한 끗 차이!'};if(s>=75)return{name:'파이터',icon:'💎',range:'75~84',msg:'통과! 약점만 잡으면 마스터'};if(s>=50)return{name:'루키',icon:'🔥',range:'50~74',msg:'기본기 OK, 유형별 훈련 필요'};return{name:'스타터',icon:'📖',range:'0~49',msg:'지문 해석부터 다시!'};}
function getTypeAdvice(t){const m={'(A)(B)(C) 조합형':'반의어 함정 주의, 원문 단어 정확히 암기','문맥상 부적절한 어휘':'밑줄 단어가 반의어로 바뀌었는지 확인','동의어 고르기':'동의어 쌍을 세트로 묶어 암기','반의어 고르기':'반의어 쌍을 세트로 묶어 암기','빈칸 어휘 완성':'문맥 단서(clue) 찾기 연습 필요','다의어 문맥적 의미':'다의어의 여러 뜻을 문맥별로 구분','영영풀이 매칭':'영영사전 정의 읽기 연습','어형 변환 (서술형)':'품사 변환 규칙(명↔형, 동↔명) 정리','빈칸 문맥 완성':'글의 흐름과 논리적 연결 파악'};return m[t]||'해당 유형 집중 복습 필요';}
function fmtTime(s){return Math.floor(s/60)+'분 '+s%60+'초';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function startExam(){
  const nm=document.getElementById('inpName').value.trim();
  if(!nm){toast('이름을 입력해주세요!');return;}
  S={ans:Array(EI.totalQ).fill(null),cur:0,ti:null,left:EI.time,start:Date.now(),order:shuffle([...Array(EI.totalQ).keys()])};
  showScreen('examScreen');
  showQ(0);
  startTimer();
  updateProgress();
  initSwipe();
}
function showQ(idx,direction){
  S.cur=idx;
  const qi=S.order?S.order[idx]:idx;
  const q=Q[qi];
  const tc=typeTag[q.type]||'';
  const mk='①②③④⑤';
  const pp=document.getElementById('slidePassage');
  if(direction){
    pp.classList.add(direction>0?'fade-out':'fade-in');
    setTimeout(()=>{
      renderContent(idx,qi,q,tc,mk,pp);
      pp.classList.remove('fade-out','fade-in');
    },150);
  } else {
    renderContent(idx,qi,q,tc,mk,pp);
  }
}
function renderContent(idx,qi,q,tc,mk,pp){
  let ph='<div class="q-badge"><div class="q-num">'+(idx+1)+'</div><span>'+q.type+'</span><span style="opacity:.6">'+q.diff+' \u00b7 '+q.pts+'\uc810</span></div>';
  if(q.passage) ph+='<div class="q-passage">'+q.passage+'</div>';
  else ph+='<div style="padding:30px;text-align:center;color:var(--tl)">\uc774 \ubb38\ud56d\uc740 \uc9c0\ubb38\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.</div>';
  pp.innerHTML=ph;
  pp.scrollTop=0;
  const bt=document.getElementById('slideBottom');
  let bh='<div class="slide-stem">'+q.stem+'</div><div class="slide-choices">';
  if(q.fmt==='mc'){
    q.ch.forEach(function(c,ci){
      var sel=S.ans[qi]===ci?' selected':'';
      bh+='<button class="choice-btn'+sel+'" onclick="selectAns('+idx+','+ci+')"><span class="c-num">'+mk[ci]+'</span><span>'+c+'</span></button>';
    });
  }
  if(q.fmt==='written'){
    var val=S.ans[qi]||'';
    bh+='<input class="written-input" value="'+val+'" placeholder="\ub2f5\uc548\uc744 \uc785\ub825\ud558\uc138\uc694..." oninput="writeAns('+idx+',this.value)">';
  }
  bh+='</div><div class="slide-nav"><button '+(idx===0?'disabled ':'')+' onclick="navQ(-1)">\u2190 \uc774\uc804</button><span class="nav-cur">'+(idx+1)+' / '+EI.totalQ+'</span><button class="sn-next" '+(idx===EI.totalQ-1?'disabled ':'')+' onclick="navQ(1)">\ub2e4\uc74c \u2192</button></div>';
  bt.innerHTML=bh;
}
function selectAns(idx,ci){
  var qi=S.order?S.order[idx]:idx;
  S.ans[qi]=ci;
  var btns=document.querySelectorAll('.slide-choices .choice-btn');
  btns.forEach(function(b,i){
    b.classList.toggle('selected',i===ci);
    if(i===ci)b.classList.add('just-selected');
  });
  updateProgress();
  
}
function writeAns(idx,val){
  var qi=S.order?S.order[idx]:idx;
  S.ans[qi]=val.trim()||null;
  updateProgress();
}
function navQ(dir){
  var next=S.cur+dir;
  if(next>=0&&next<EI.totalQ)showQ(next,dir);
}
function updateProgress(){
  var answered=S.ans.filter(function(a){return a!==null;}).length;
  document.getElementById('progressFill').style.width=(answered/EI.totalQ*100)+'%';
  document.getElementById('ansCount').textContent=answered+'/'+EI.totalQ;
}
function initSwipe(){
  var startX=0,startY=0;
  var el=document.getElementById('slideWrap');
  el.addEventListener('touchstart',function(e){startX=e.touches[0].clientX;startY=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-startX;
    var dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0&&S.cur<EI.totalQ-1)navQ(1);
      if(dx>0&&S.cur>0)navQ(-1);
    }
  },{passive:true});
}

function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub} ${EI.lesson}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🔍 내신핏 약점 진단</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'var(--g)':p>=50?'var(--o)':'var(--r)';const icon=p===100?'✅':p>=50?'⚠️':'❌';h+=`<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:13px">${icon}</span><span style="font-size:13px;font-weight:700;flex:1">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-size:13px;font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div>${p<100?`<div style="font-size:11px;color:var(--tm);margin-top:3px;padding-left:21px">→ ${getTypeAdvice(type)}</div>`:''}</div>`;});h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 내신핏 처방</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">👑</div><div class="plan-text"><h4>마스터 달성!</h4><p>이 단원은 완벽합니다. 다음 단원에 도전하세요!</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">🌟</div><div class="plan-text"><h4>통과! 마스터까지 한 끗</h4><p>아래 약점 유형만 집중하면 마스터 달성!</p></div>`;else if(pct>=50)h+=`<div class="plan-icon">🔥</div><div class="plan-text"><h4>기본기는 있어요!</h4><p>오답 해설을 꼼꼼히 확인하고, 약점 유형부터 공략하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>지문 해석부터!</h4><p>본문을 완벽히 이해한 뒤 재도전하세요. 해설의 한글 해석을 활용!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid" style="grid-template-columns:1fr 1fr"><button class="act-btn" onclick="shareImage()"><span class="act-icon">📸</span><span class="act-label">이미지 공유</span></button><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">텍스트 복사</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:(d.q.wa||'');const open=!d.ok;
let chHtml='';if(d.q.fmt==='mc'&&d.q.ch){chHtml=`<div style="margin-top:8px">`;d.q.ch.forEach((c,ci)=>{const isAns=ci===d.q.ans;const isMy=d.ans===ci;const color=isAns?'var(--g)':(isMy&&!d.ok?'var(--r)':'var(--tm)');const bg=isAns?'var(--gl)':(isMy&&!d.ok?'var(--rl)':'transparent');const label=isAns?' ✅':(isMy&&!d.ok?' ❌':'');chHtml+=`<div style="padding:4px 8px;margin-bottom:2px;border-radius:6px;font-size:12px;color:${color};background:${bg}"><b>${mk[ci]}</b> ${c}${label}</div>`;});chHtml+=`</div>`;}
h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type.slice(0,8)}] ${d.q.diff} ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:10px"><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:10px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:8px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:10px;opacity:.7">정답</div>${ca}</div></div><div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📝 문제</div><div class="expl-box" style="font-size:12.5px;line-height:1.6;border-left:3px solid var(--b);margin-bottom:10px"><div style="font-weight:700;margin-bottom:6px">${d.q.stem}</div>${chHtml}</div>${d.q.passage?`<div style="font-size:11px;font-weight:800;color:var(--tm);margin-bottom:4px">📖 원문</div><div class="expl-box" style="font-size:12px;line-height:1.75;border-left:3px solid #ddd;margin-bottom:10px">${d.q.passage}</div>`:''}${d.q.det?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean||''}</div><div class="expl-tag tip">📋 풀이 · 선지 분석</div><div class="expl-box" style="white-space:pre-line">${(d.q.det.analysis||'').replace(/\\n/g,'<br>')}</div><div class="expl-tag tip">💡 포인트</div><div class="expl-box tip-b">${d.q.det.tip||''}</div>`:''}</div></div>`;}); h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub} ${EI.lesson}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub} ${EI.lesson}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}

function goHome(){showScreen('startScreen');updateHCount();}

updateHCount();
