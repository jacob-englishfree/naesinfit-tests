const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"2강","lesson":"3번","title":"Organ in Borneo","total":100,"time":1200,"totalQ":20,"histKey":"workbookTest_suneung_02_ex3_v1"};

const PASSAGE=`Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed smoothly under his fingers. The melody blended with the soft sounds of the jungle, filling him with happiness. The organ, his most precious possession, was a source of comfort and joy, especially in these uncertain times. But his peace was interrupted by the distant roar of engines breaking the calm. Soldiers appeared on the jungle road, their boots loud on the dirt as they approached, weapons hanging loosely over their shoulders. Francis\' heart raced; it was wartime, and soldiers often took what they wanted. Whispering urgently to his sister, Ellen, he led her to hide behind a tall tree, its thick trunk shielding them. Peeking out, Francis stepped outside carefully and looked at the soldiers walking toward their home. Their loud voices and heavy footsteps filled the quiet jungle. His mind raced with prayers, hoping they would remain unseen.`;

{"id":3,"type":"어법","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["①","②","③"],"passage":"Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed ①<u>smoothly</u> under his fingers. The organ, his most precious possession, was a source of comfort and joy, especially in these uncertain times. But his peace was ②<u>interrupting</u> by the distant roar of engines breaking the calm. Soldiers appeared on the jungle road, their boots loud on the dirt as they approached, weapons ③<u>hanging</u> loosely over their shoulders.","stem":"밑줄 친 ①~③ 중 어법상 틀린 것은?","det":{"korean":"② interrupting → interrupted: 수동태(be + p.p.). 평화가 방해'받은' 것이므로 과거분사.","analysis":"❌ ②interrupting → interrupted: was + p.p. = 수동태<br>✅ ①smoothly: 동사 flowed를 수식하는 부사로 적절<br>✅ ③hanging: 현재분사(무기가 걸려있는 상태 = 능동)","tip":"be + p.p. = 수동태 (was interrupted = 방해받았다)"}},

{"id":4,"type":"어법","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["①","②","③"],"passage":"Francis' heart raced; it was wartime, and soldiers often took ①<u>what</u> they wanted. ②<u>Whisper</u> urgently to his sister, Ellen, he led her to hide behind a tall tree, its thick trunk ③<u>shielding</u> them.","stem":"밑줄 친 ①~③ 중 어법상 틀린 것은?","det":{"korean":"② Whisper → Whispering: 분사구문에서 주어(Francis)가 능동으로 속삭이는 것이므로 현재분사.","analysis":"❌ ②Whisper → Whispering: 분사구문은 ~ing 형태<br>✅ ①what: 관계대명사(they wanted의 목적어)<br>✅ ③shielding: 독립 분사구문(trunk이 주어, 능동)","tip":"분사구문: V-ing(능동), p.p.(수동) — 주어가 행위 주체이면 현재분사"}},

{"id":5,"type":"어법","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["carefully","careful","caring","care"],"passage":"Peeking out, Francis stepped outside __________ and looked at the soldiers walking toward their home.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"동사 stepped을 수식하므로 부사 carefully가 적절.","analysis":"✅ carefully(부사): 동사 stepped 수식<br>❌ careful(형용사)<br>❌ caring(현재분사/형용사)<br>❌ care(명사/동사)","tip":"동사 수식 = 부사 (carefully, slowly, quietly 등)"}},

{"id":6,"type":"내용일치","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["Francis는 오르간 연주를 처음 시작했다.","군인들이 정글 길에 나타나 평화를 깨뜨렸다.","Francis는 오르간을 몇 주간 연습한 찬송가를 연주했다.","Ellen은 Francis의 어머니이다.","Francis는 군인들에게 다가갔다."],"passage":"Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed smoothly under his fingers. The melody blended with the soft sounds of the jungle, filling him with happiness. The organ, his most precious possession, was a source of comfort and joy, especially in these uncertain times. But his peace was interrupted by the distant roar of engines breaking the calm. Soldiers appeared on the jungle road, their boots loud on the dirt as they approached, weapons hanging loosely over their shoulders. Francis\' heart raced; it was wartime, and soldiers often took what they wanted. Whispering urgently to his sister, Ellen, he led her to hide behind a tall tree, its thick trunk shielding them. Peeking out, Francis stepped outside carefully and looked at the soldiers walking toward their home. Their loud voices and heavy footsteps filled the quiet jungle. His mind raced with prayers, hoping they would remain unseen.","stem":"위 글의 내용과 일치하는 것은?","det":{"korean":"③ 'the hymn he had practiced for weeks' → 몇 주간 연습한 찬송가를 연주.","analysis":"✅ ③: 원문에 'the hymn he had practiced for weeks' 명시<br>❌ ①: 몇 주간 연습했으므로 처음이 아님<br>❌ ②: 맞는 내용이나, ③이 더 정확<br>❌ ④: Ellen은 sister(누나/여동생)<br>❌ ⑤: hide(숨었다)","tip":"원문의 세부 정보를 정확히 확인"}},

{"id":7,"type":"내용일치","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["Francis는 전시에 군인들이 원하는 것을 빼앗아 가곤 했다는 것을 알고 있었다.","군인들은 총을 단단히 잡고 있었다.","Francis와 Ellen은 집 안에 숨었다.","오르간은 Francis가 최근에 구입한 것이었다.","정글은 군인들이 오기 전부터 시끄러웠다."],"passage":"Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed smoothly under his fingers. The melody blended with the soft sounds of the jungle, filling him with happiness. The organ, his most precious possession, was a source of comfort and joy, especially in these uncertain times. But his peace was interrupted by the distant roar of engines breaking the calm. Soldiers appeared on the jungle road, their boots loud on the dirt as they approached, weapons hanging loosely over their shoulders. Francis\' heart raced; it was wartime, and soldiers often took what they wanted. Whispering urgently to his sister, Ellen, he led her to hide behind a tall tree, its thick trunk shielding them. Peeking out, Francis stepped outside carefully and looked at the soldiers walking toward their home. Their loud voices and heavy footsteps filled the quiet jungle. His mind raced with prayers, hoping they would remain unseen.","stem":"위 글의 내용과 일치하는 것은?","det":{"korean":"① 'soldiers often took what they wanted' → 군인들이 원하는 것을 가져갔다는 것을 아는 상태.","analysis":"✅ ①: 원문 'soldiers often took what they wanted'와 일치<br>❌ ②: 'weapons hanging loosely' = 느슨하게 걸려있음<br>❌ ③: 'hide behind a tall tree' = 나무 뒤에 숨음<br>❌ ④: 원문에 최근 구입 언급 없음<br>❌ ⑤: 'quiet jungle' = 조용한 정글","tip":"loosely(느슨하게) ≠ tightly(단단히)"}},

{"id":8,"type":"내용불일치","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["Francis는 보르네오의 집에서 오르간을 연주했다.","멜로디는 정글의 부드러운 소리와 어우러졌다.","엔진의 먼 굉음이 평화를 깨뜨렸다.","Francis는 누나 Ellen과 함께 집 안에 숨었다.","Francis는 군인들이 자신들을 보지 못하기를 기도했다."],"passage":"Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed smoothly under his fingers. The melody blended with the soft sounds of the jungle, filling him with happiness. The organ, his most precious possession, was a source of comfort and joy, especially in these uncertain times. But his peace was interrupted by the distant roar of engines breaking the calm. Soldiers appeared on the jungle road, their boots loud on the dirt as they approached, weapons hanging loosely over their shoulders. Francis\' heart raced; it was wartime, and soldiers often took what they wanted. Whispering urgently to his sister, Ellen, he led her to hide behind a tall tree, its thick trunk shielding them. Peeking out, Francis stepped outside carefully and looked at the soldiers walking toward their home. Their loud voices and heavy footsteps filled the quiet jungle. His mind raced with prayers, hoping they would remain unseen.","stem":"다음 중 글의 내용과 <b>일치하지 않는</b> 것은?","det":{"korean":"④ 집 안이 아니라 '큰 나무 뒤에(behind a tall tree)' 숨었습니다.","analysis":"❌ ④ behind a tall tree(나무 뒤) ≠ 집 안 → 불일치<br>✅ ① Borneo home → 일치<br>✅ ② soft sounds of the jungle → 일치<br>✅ ③ distant roar of engines → 일치<br>✅ ⑤ hoping they would remain unseen → 일치","tip":"장소 정보 정확히 확인: behind a tall tree ≠ inside the house"}},

{"id":12,"type":"서술형","diff":"쉬움","pts":4,"fmt":"written","wa":"possession","accept":["possession","Possession"],"passage":"Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed smoothly under his fingers. The melody blended with the soft sounds of the jungle, filling him with happiness. The organ, his most precious possession, was a source of comfort and joy, especially in these uncertain times. But his peace was interrupted by the distant roar of engines breaking the calm. Soldiers appeared on the jungle road, their boots loud on the dirt as they approached, weapons hanging loosely over their shoulders. Francis\' heart raced; it was wartime, and soldiers often took what they wanted. Whispering urgently to his sister, Ellen, he led her to hide behind a tall tree, its thick trunk shielding them. Peeking out, Francis stepped outside carefully and looked at the soldiers walking toward their home. Their loud voices and heavy footsteps filled the quiet jungle. His mind raced with prayers, hoping they would remain unseen.","stem":"다음 글에서 Francis에게 오르간이 어떤 존재였는지를 나타내는 단어를 본문에서 <b>1단어</b>로 찾아 쓰시오. (his most precious __________)","det":{"korean":"'his most precious possession' → possession(소유물)","analysis":"오르간은 Francis의 가장 소중한 소유물","tip":"possession = 소유물, 재산"}},
