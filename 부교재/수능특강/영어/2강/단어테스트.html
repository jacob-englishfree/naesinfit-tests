const P_GW=`"Where could it be?" Sophie asked herself. It had been more than ten years since she had last visited the area where she had grown up. The village had changed a lot over time. Uncertain, she awkwardly looked around at her surroundings. She walked the narrow streets of the village, unsure about which way to go. Suddenly, Sophie saw a familiar sight. "Yes, this must be it," she thought. In front of her was a wall with flowers painted on it. Although the colors were now faded, the familiar shapes on the wall were the same ones she had painted with her father as a child. Sophie nodded, smiled brightly, and walked toward the gate. At last, she had finally found the house she had grown up in.`;

const P_EX01=`It was the day I had been preparing for. I drove for an hour and a half to apply for a visa. My heart was racing, but I felt ready. That same day, I helped three people who didn't know English by translating for the immigration officer. Two of them were lucky to get their visas. Then I heard my name called. Believing things were going smoothly, I made my way to the counter. I showed my documents and property papers to prove that I would return home after visiting my children. Unfortunately, the officer, who had smiled when I was helping her, suddenly turned serious. She ignored my papers and put a red stamp on my application. I didn't have a chance to say a word. I felt as if a heavy rock was pressing down on my mind. I didn't expect to hear her words of rejection. I felt dizzy, and my eyes were full of tears. I couldn't see anything at that moment.`;

const P_EX02=`After a few nights, we ventured out on a hike to 16,000 feet. The group members were all experienced, so I couldn't understand why they were climbing so slowly — what I thought was a ridiculous pace. Having trained hard for this, I was in the best shape of my life. And, being the rookie, I wanted to prove myself to the group. Why not show off my superior conditioning? So up front I went. Then, as we approached 16,000 feet, I suddenly began to feel dizzy. Not long after, I was staggering. The group had to take my pack. In a matter of minutes, I became a basket case, needing assistance just to walk. On the way down to the hut, I could barely keep in a straight line because of the nausea, headache, and dizziness. Now all I felt was guilt for becoming a burden to the group. I wished I hadn't pushed myself so hard.`;

const P_EX03=`Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed smoothly under his fingers. The melody blended with the soft sounds of the jungle, filling him with happiness. The organ, his most precious possession, was a source of comfort and joy, especially in these uncertain times. But his peace was interrupted by the distant roar of engines breaking the calm. Soldiers appeared on the jungle road, their boots loud on the dirt as they approached, weapons hanging loosely over their shoulders. Francis' heart raced; it was wartime, and soldiers often took what they wanted. Whispering urgently to his sister, Ellen, he led her to hide behind a tall tree, its thick trunk shielding them. Peeking out, Francis stepped outside carefully and looked at the soldiers walking toward their home. Their loud voices and heavy footsteps filled the quiet jungle. His mind raced with prayers, hoping they would remain unseen.`;

const P_EX04=`Vera couldn't wait for her car to get fixed, but that was going to require longer than initially expected. Unfortunately, that meant relying on the bus for her commute. To add to the cruel irony, it hadn't stopped raining for the past three days. It was already past 7 PM when she stepped off the bus, cold and soaked to the bone, having left her umbrella at the gym. Her place was just one block down the street, but it felt like ten miles in this weather. Her legs moved on their own, and suddenly, the Cups & Blossoms' bell was ringing above her head. The warm, floral scent wrapped around her like a blanket, but it was another kind of welcome that surprised her — a smile from the café owner, soft and unassuming. She was also polite enough not to ask why Vera looked so tired, which was appreciated. Vera now seemed to realize what she had truly needed. Just a friendly face to ease the weight she carried.`;

{"id":1,"type":"(A)(B)(C) 조합형","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["awkwardly — familiar — faded","clumsily — familiar — faded","awkwardly — strange — faded","awkwardly — familiar — vivid","clumsily — strange — vivid"],"passage":"\"Where could it be?\" Sophie asked herself. It had been more than ten years since she had last visited the area where she had grown up. The village had changed a lot over time. Uncertain, she <b>(A)</b> looked around at her surroundings. She walked the narrow streets of the village, unsure about which way to go. Suddenly, Sophie saw a <b>(B)</b> sight. \"Yes, this must be it,\" she thought. In front of her was a wall with flowers painted on it. Although the colors were now <b>(C)</b>, the familiar shapes on the wall were the same ones she had painted with her father as a child.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"어색하게(awkwardly) 주변을 둘러보다가, 익숙한(familiar) 광경을 보고, 색이 바랜(faded) 벽화를 발견했습니다.","analysis":"✅ ① awkwardly — familiar — faded: 원문과 일치\\n❌ ② clumsily(서투르게)는 유사하지만 원문은 awkwardly\\n❌ ③ strange(낯선)는 familiar(익숙한)의 반의어\\n❌ ④ vivid(선명한)는 faded(바랜)의 반의어\\n❌ ⑤ 세 단어 모두 원문과 불일치","tip":"awkwardly(어색하게), familiar(익숙한), faded(바랜) — 심경 변화의 핵심 어휘"}},

{"id":2,"type":"(A)(B)(C) 조합형","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["precious — interrupted — urgently","worthless — interrupted — urgently","precious — continued — urgently","precious — interrupted — calmly","worthless — continued — calmly"],"passage":"The organ, his most <b>(A)</b> possession, was a source of comfort and joy, especially in these uncertain times. But his peace was <b>(B)</b> by the distant roar of engines breaking the calm. Soldiers appeared on the jungle road, their boots loud on the dirt as they approached. Whispering <b>(C)</b> to his sister, Ellen, he led her to hide behind a tall tree.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"가장 소중한(precious) 소유물인 오르간, 평화가 방해받았고(interrupted), 긴급히(urgently) 속삭였습니다.","analysis":"✅ ① precious — interrupted — urgently: 원문과 일치\\n❌ ② worthless(무가치한)는 precious(소중한)의 반의어\\n❌ ③ continued(계속되었다)는 interrupted(방해받았다)의 반의어\\n❌ ④ calmly(침착하게)는 urgently(긴급히)의 반의어\\n❌ ⑤ 세 단어 모두 원문과 불일치","tip":"precious(소중한), interrupted(방해받은), urgently(긴급히)"}},

{"id":3,"type":"문맥상 부적절한 어휘","diff":"쉬움","pts":4,"fmt":"mc","ans":3,"ch":["① Uncertain","② narrow","③ familiar","④ brightened","⑤ brightly"],"passage":"\"Where could it be?\" Sophie asked herself. The village had changed a lot over time. <u>① Uncertain</u>, she awkwardly looked around at her surroundings. She walked the <u>② narrow</u> streets of the village, unsure about which way to go. Suddenly, Sophie saw a <u>③ familiar</u> sight. In front of her was a wall with flowers painted on it. Although the colors were now <u>④ brightened</u>, the familiar shapes on the wall were the same ones she had painted with her father as a child. Sophie nodded, smiled <u>⑤ brightly</u>, and walked toward the gate.","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"색이 <b>바래진(faded)</b> 것이지 밝아진(brightened) 것이 아닙니다. 오래된 벽화이므로 색이 바래야 문맥에 맞습니다.","analysis":"✅ ① Uncertain(불확실한): 오랫동안 방문하지 않아 불확실한 심경으로 적절\\n✅ ② narrow(좁은): 마을의 좁은 거리로 적절\\n✅ ③ familiar(익숙한): 갑자기 익숙한 광경을 본 것으로 적절\\n❌ ④ brightened(밝아진) → faded(바랜): 오래된 벽화의 색은 바래야 함\\n✅ ⑤ brightly(밝게): 집을 찾아 밝게 미소 지은 것으로 적절","tip":"faded(바랜, 흐려진) ↔ brightened(밝아진) — 반의어 관계"}},

{"id":4,"type":"문맥상 부적절한 어휘","diff":"보통","pts":5,"fmt":"mc","ans":4,"ch":["① preparing","② translating","③ smoothly","④ serious","⑤ acceptance"],"passage":"It was the day I had been <u>① preparing</u> for. I helped three people who didn't know English by <u>② translating</u> for the immigration officer. Believing things were going <u>③ smoothly</u>, I made my way to the counter. The officer suddenly turned <u>④ serious</u>. She ignored my papers and put a red stamp on my application. I didn't expect to hear her words of <u>⑤ acceptance</u>. I felt dizzy, and my eyes were full of tears.","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"거절(rejection)의 말을 듣게 될 줄 몰랐습니다. acceptance(수락)는 rejection(거절)의 반의어로, 빨간 도장과 눈물의 맥락에 맞지 않습니다.","analysis":"✅ ① preparing(준비하는): 비자 신청을 준비한 날로 적절\\n✅ ② translating(통역하는): 영어를 모르는 사람들을 위해 통역한 것으로 적절\\n✅ ③ smoothly(순조롭게): 일이 잘 되고 있다고 믿은 것으로 적절\\n✅ ④ serious(심각한): 미소 짓던 직원이 갑자기 심각해진 것으로 적절\\n❌ ⑤ acceptance(수락) → rejection(거절): 빨간 도장, 눈물 등 거절 맥락","tip":"rejection(거절) ↔ acceptance(수락)"}},

{"id":5,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":1,"ch":["vivid","dimmed","brightened","intense"],"passage":"Although the colors were now <u>faded</u>, the familiar shapes on the wall were the same ones she had painted with her father as a child.","stem":"밑줄 친 faded와 의미가 가장 가까운 것은?","det":{"korean":"faded = dimmed = 바래진, 흐려진. 색이 시간이 지나 흐려진 상태입니다.","analysis":"✅ dimmed(흐려진): faded의 동의어\\n❌ vivid(선명한): faded의 반의어\\n❌ brightened(밝아진): faded의 반의어\\n❌ intense(강렬한): faded의 반의어","tip":"faded = dimmed = washed out (바래진, 흐려진)"}},

{"id":6,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["reasonable","absurd","moderate","sensible"],"passage":"I couldn't understand why they were climbing so slowly — what I thought was a <u>ridiculous</u> pace.","stem":"밑줄 친 ridiculous와 의미가 가장 가까운 것은?","det":{"korean":"ridiculous = absurd = 터무니없는, 우스꽝스러운. 너무 느린 속도가 터무니없다고 생각한 것입니다.","analysis":"✅ absurd(터무니없는): ridiculous의 동의어\\n❌ reasonable(합리적인): ridiculous의 반의어\\n❌ moderate(적당한): ridiculous와 반대 뉘앙스\\n❌ sensible(분별 있는): ridiculous의 반의어","tip":"ridiculous = absurd = preposterous (터무니없는)"}},

{"id":7,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["worthless","valuable","ordinary","cheap"],"passage":"The organ, his most <u>precious</u> possession, was a source of comfort and joy.","stem":"밑줄 친 precious와 의미가 가장 가까운 것은?","det":{"korean":"precious = valuable = 소중한, 귀중한. 오르간이 가장 소중한 소유물이라는 의미입니다.","analysis":"✅ valuable(가치 있는): precious의 동의어\\n❌ worthless(무가치한): precious의 반의어\\n❌ ordinary(평범한): precious와 반대 뉘앙스\\n❌ cheap(싼): precious의 반의어","tip":"precious = valuable = invaluable (소중한, 귀중한)"}},

{"id":8,"type":"반의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["cozy","heated","chilly","pleasant"],"passage":"The <u>warm</u>, floral scent wrapped around her like a blanket.","stem":"밑줄 친 warm과 의미가 가장 반대인 것은?","det":{"korean":"warm(따뜻한) ↔ chilly(쌀쌀한, 차가운). 카페의 따뜻한 향기가 담요처럼 감싸준다는 표현입니다.","analysis":"✅ chilly(쌀쌀한): warm의 반의어\\n❌ cozy(아늑한): warm과 유사한 의미\\n❌ heated(가열된): warm의 유의어\\n❌ pleasant(쾌적한): warm과 유사한 긍정적 뉘앙스","tip":"warm(따뜻한) ↔ chilly(쌀쌀한), cold(차가운), cool(서늘한)"}},

{"id":9,"type":"반의어 고르기","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["easily","steadily","roughly","gently"],"passage":"Believing things were going <u>smoothly</u>, I made my way to the counter.","stem":"밑줄 친 smoothly와 의미가 가장 반대인 것은?","det":{"korean":"smoothly(순조롭게) ↔ roughly(험하게, 거칠게). 일이 순조롭게 진행된다고 믿었다는 표현입니다.","analysis":"✅ roughly(거칠게): smoothly의 반의어\\n❌ easily(쉽게): smoothly의 유의어\\n❌ steadily(꾸준히): smoothly와 유사한 의미\\n❌ gently(부드럽게): smoothly의 유의어","tip":"smoothly(순조롭게) ↔ roughly(거칠게, 험하게)"}},

{"id":10,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["memories","companions","surroundings","decorations"],"passage":"\"Where could it be?\" Sophie asked herself. It had been more than ten years since she had last visited the area where she had grown up. The village had changed a lot over time. Uncertain, she awkwardly looked around at her __________. She walked the narrow streets of the village, unsure about which way to go. Suddenly, Sophie saw a familiar sight. \"Yes, this must be it,\" she thought. In front of her was a wall with flowers painted on it. Although the colors were now faded, the familiar shapes on the wall were the same ones she had painted with her father as a child. Sophie nodded, smiled brightly, and walked toward the gate. At last, she had finally found the house she had grown up in.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"주변 환경(surroundings)을 어색하게 둘러보았다는 뜻입니다.","analysis":"✅ surroundings(주변 환경): 불확실한 상태에서 주변을 둘러보는 맥락에 적절\\n❌ memories(기억): look around at memories는 어색한 표현\\n❌ companions(동반자): 혼자 온 상황과 불일치\\n❌ decorations(장식): 마을 거리를 둘러보는 맥락과 불일치","tip":"surroundings = environment = vicinity (주변 환경)"}},

{"id":11,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["leader","hero","mentor","burden"],"passage":"After a few nights, we ventured out on a hike to 16,000 feet. The group members were all experienced, so I couldn't understand why they were climbing so slowly — what I thought was a ridiculous pace. Having trained hard for this, I was in the best shape of my life. And, being the rookie, I wanted to prove myself to the group. Why not show off my superior conditioning? So up front I went. Then, as we approached 16,000 feet, I suddenly began to feel dizzy. Not long after, I was staggering. The group had to take my pack. In a matter of minutes, I became a basket case, needing assistance just to walk. On the way down to the hut, I could barely keep in a straight line because of the nausea, headache, and dizziness. Now all I felt was guilt for becoming a __________ to the group. I wished I hadn't pushed myself so hard.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"그룹에 짐(burden)이 된 것에 대한 죄책감을 느꼈습니다.","analysis":"✅ burden(짐): 도움이 필요한 상태가 되어 죄책감을 느끼는 맥락에 적절\\n❌ leader(리더): 오히려 도움을 받는 상황과 불일치\\n❌ hero(영웅): 비틀거리며 걷는 상황과 반대\\n❌ mentor(멘토): 신참(rookie)이므로 멘토가 될 수 없음","tip":"burden = load = weight (짐, 부담)"}},

{"id":12,"type":"빈칸 어휘 완성","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["instrument","memory","possession","melody"],"passage":"Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed smoothly under his fingers. The melody blended with the soft sounds of the jungle, filling him with happiness. The organ, his most precious __________, was a source of comfort and joy, especially in these uncertain times. But his peace was interrupted by the distant roar of engines breaking the calm.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"가장 소중한 소유물(possession)이라는 뜻입니다. instrument(악기)도 유혹적이지만, 원문은 possession입니다.","analysis":"✅ possession(소유물): most precious possession = 가장 소중한 소유물\\n❌ instrument(악기): 오르간은 악기이지만, 원문 표현은 possession\\n❌ memory(기억): 오르간은 물리적 대상이므로 memory와 불일치\\n❌ melody(멜로디): 오르간 자체가 아닌 소리를 지칭","tip":"possession = belonging = property (소유물)"}},

{"id":13,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["경주하는","경마의","빠르게 뛰는","질주하는(차)"],"passage":"My heart was <u>racing</u>, but I felt ready.","stem":"밑줄 친 racing이 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"heart was racing = 심장이 빠르게 뛰고 있었다. 긴장감으로 심장 박동이 빨라진 상태입니다.","analysis":"✅ 빠르게 뛰는: 심장이 빠르게 뛰는 것을 의미\\n❌ 경주하는: 스포츠 경주의 의미 (여기서는 해당 안 됨)\\n❌ 경마의: 말 경주 관련 의미\\n❌ 질주하는(차): 자동차가 빠르게 달리는 의미","tip":"heart racing = 심장이 빠르게 뛰다 — 긴장, 흥분, 두려움의 신체 반응"}},

{"id":14,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["문제","물질","기간(양)","중요하다"],"passage":"In a <u>matter</u> of minutes, I became a basket case, needing assistance just to walk.","stem":"밑줄 친 matter가 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"in a matter of minutes = 불과 몇 분 만에. matter가 '(시간의) 양'을 뜻합니다.","analysis":"✅ 기간(양): in a matter of ~ = 불과 ~만에\\n❌ 문제: a matter of concern 등에서의 의미\\n❌ 물질: 과학적 의미의 물질\\n❌ 중요하다: It doesn't matter 등에서의 동사 의미","tip":"in a matter of minutes/hours = 불과 몇 분/시간 만에 — 짧은 시간을 강조"}},

{"id":15,"type":"영영풀이 매칭","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["venture","stagger","commute","shield"],"passage":"","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><b>\"to move unsteadily, as if about to fall\"</b>","det":{"korean":"비틀거리며 걷다 → <b>stagger</b>. 넘어질 것처럼 불안정하게 움직이다.","analysis":"✅ stagger(비틀거리다): 넘어질 듯 불안정하게 움직이다 = 정의와 일치\\n❌ venture(모험하다): 위험을 무릅쓰고 나아가다\\n❌ commute(통근하다): 정기적으로 출퇴근하다\\n❌ shield(보호하다): 가리거나 막아 보호하다","tip":"stagger = stumble = totter (비틀거리다)"}},

{"id":16,"type":"영영풀이 매칭","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["nausea","dizziness","burden","guilt"],"passage":"","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><b>\"a feeling of responsibility for a fault or wrong\"</b>","det":{"korean":"잘못에 대한 책임감 → <b>guilt(죄책감)</b>. 자신의 잘못이나 실수에 대해 느끼는 책임감입니다.","analysis":"✅ guilt(죄책감): 잘못에 대한 책임감 = 정의와 정확히 일치\\n❌ nausea(메스꺼움): 신체적 증상\\n❌ dizziness(어지러움): 신체적 증상\\n❌ burden(짐, 부담): 무거운 책임이나 의무","tip":"guilt = remorse = self-reproach (죄책감)"}},

{"id":17,"type":"어형 변환 (서술형)","diff":"쉬움","pts":4,"fmt":"written","wa":"brightly","accept":["brightly","Brightly"],"ch":null,"passage":"Sophie nodded, smiled __________ (bright), and walked toward the gate.","stem":"주어진 단어를 문맥에 맞게 어형을 변환하여 빈칸에 쓰시오.","det":{"korean":"bright(형용사) → <b>brightly(부사)</b>: 동사 smiled를 수식하므로 부사형이 필요합니다.","analysis":"bright(형용사: 밝은) → brightly(부사: 밝게)\\n동사 smiled를 수식하려면 부사가 필요: smiled _____ = 밝게 미소 지었다","tip":"bright(형) → brightly(부) / brightness(명) — 동사 수식에는 부사를 사용"}},

{"id":18,"type":"어형 변환 (서술형)","diff":"보통","pts":5,"fmt":"written","wa":"filling","accept":["filling","Filling"],"ch":null,"passage":"The melody blended with the soft sounds of the jungle, __________ (fill) him with happiness.","stem":"주어진 단어를 문맥에 맞게 어형을 변환하여 빈칸에 쓰시오.","det":{"korean":"fill(동사) → <b>filling(현재분사)</b>: 분사구문으로, 능동/동시동작을 나타냅니다.","analysis":"fill(동사: 채우다) → filling(현재분사)\\n콤마 뒤 분사구문: 멜로디가 정글 소리와 어우러지며 → 그를 행복으로 채우면서","tip":"분사구문: 주어가 같을 때, 접속사+주어 생략 → 현재분사(능동) / 과거분사(수동)"}},

{"id":19,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["approval","acceptance","gratitude","rejection","encouragement"],"passage":"It was the day I had been preparing for. I drove for an hour and a half to apply for a visa. My heart was racing, but I felt ready. That same day, I helped three people who didn't know English by translating for the immigration officer. Two of them were lucky to get their visas. Then I heard my name called. Believing things were going smoothly, I made my way to the counter. I showed my documents and property papers to prove that I would return home after visiting my children. Unfortunately, the officer, who had smiled when I was helping her, suddenly turned serious. She ignored my papers and put a red stamp on my application. I didn't have a chance to say a word. I felt as if a heavy rock was pressing down on my mind. I didn't expect to hear her words of __________. I felt dizzy, and my eyes were full of tears. I couldn't see anything at that moment.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"빨간 도장, 서류 무시, 어지러움과 눈물 → <b>rejection(거절)</b>의 말을 듣게 될 줄 몰랐습니다.","analysis":"✅ ④ rejection(거절): 빨간 도장 + 서류 무시 + 눈물 = 비자 거절\\n❌ ① approval(승인): 부정적 상황과 모순\\n❌ ② acceptance(수락): 거절 맥락과 반대\\n❌ ③ gratitude(감사): 눈물과 어지러움 맥락과 불일치\\n❌ ⑤ encouragement(격려): 빨간 도장과 심각한 표정에 어울리지 않음","tip":"rejection = refusal = denial (거절, 거부)"}},

{"id":20,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["increase","multiply","ignore","ease","celebrate"],"passage":"Vera couldn't wait for her car to get fixed, but that was going to require longer than initially expected. Unfortunately, that meant relying on the bus for her commute. To add to the cruel irony, it hadn't stopped raining for the past three days. It was already past 7 PM when she stepped off the bus, cold and soaked to the bone, having left her umbrella at the gym. Her place was just one block down the street, but it felt like ten miles in this weather. Her legs moved on their own, and suddenly, the Cups & Blossoms' bell was ringing above her head. The warm, floral scent wrapped around her like a blanket, but it was another kind of welcome that surprised her — a smile from the café owner, soft and unassuming. She was also polite enough not to ask why Vera looked so tired, which was appreciated. Vera now seemed to realize what she had truly needed. Just a friendly face to __________ the weight she carried.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"그녀가 짊어진 무게를 <b>덜어주다(ease)</b>. 따뜻한 카페와 친절한 얼굴이 필요했던 것입니다.","analysis":"✅ ④ ease(덜다, 완화하다): 피로와 무게를 덜어주는 친절한 얼굴\\n❌ ① increase(증가시키다): 무게를 늘리는 것은 문맥과 반대\\n❌ ② multiply(배가하다): 부담을 늘리는 것으로 반대\\n❌ ③ ignore(무시하다): 무게를 무시하는 것이 아닌 덜어주는 것\\n❌ ⑤ celebrate(축하하다): 지친 상황에서 축하는 부적절","tip":"ease = relieve = alleviate (덜다, 완화하다)"}}
];

const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};

let S={ans:[],cur:0,ti:null,left:EI.time,start:0};

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name});if(h.length>50)h.length=50;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map(x=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade}</div></div><div class="hi-right"><div class="hi-score">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div><div class="hi-level">${x.level||''}</div></div></div>`).join('');p.style.display='block';}
function getLevel(s){if(s>=95)return{name:'S+',icon:'👑',range:'95~100',msg:'완벽한 어휘력! 최상위권입니다.'};if(s>=85)return{name:'A+',icon:'🌟',range:'85~94',msg:'훌륭한 어휘력! 거의 완벽합니다.'};if(s>=75)return{name:'A',icon:'💎',range:'75~84',msg:'우수한 어휘력! 조금만 더 노력하세요.'};if(s>=65)return{name:'B+',icon:'🔥',range:'65~74',msg:'좋은 수준! 약한 유형을 보완하세요.'};if(s>=50)return{name:'B',icon:'📈',range:'50~64',msg:'기본기는 있어요! 꾸준히 복습하세요.'};if(s>=30)return{name:'C',icon:'💪',range:'30~49',msg:'더 분발해야 해요! 기본 어휘부터 복습!'};return{name:'D',icon:'📖',range:'0~29',msg:'기초부터 차근차근 시작해봅시다!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+s%60+'초';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startExam(){const nm=document.getElementById('inpName').value.trim();if(!nm){toast('이름을 입력해주세요!');return;}S={ans:Array(EI.totalQ).fill(null),cur:0,ti:null,left:EI.time,start:Date.now()};showScreen('examScreen');renderQ();renderDots();startTimer();window.scrollTo(0,0);}

function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;}); el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;}); if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:(d.q.wa||'');const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[ ${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div>${d.q.det?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean||''}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis||''}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip||''}</div>`:''}</div></div>`;}); h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;let txt=`📝 온라인단어 TEST 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 수능특강 영어 · 02강\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
