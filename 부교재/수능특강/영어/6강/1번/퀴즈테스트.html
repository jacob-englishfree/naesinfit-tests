const P_GW=`In the United States, the practice of permitting aliens to vote could be seen as compatible with the idea of an exclusionary citizenship, but that is a hard balance to maintain. If the vote, of all rights, is in the hands of noncitizens, why should they not count as citizens, and the entire distinction between resident alien and citizen be abandoned? Indeed, something like this thought probably lay behind the disappearance of alien voting: with universal adult citizen suffrage after 1920, the only way to maintain an exclusionary kind of citizenship was to restrict the vote to citizens and not residents. But no theory of \u201cactive\u201d democracy can countenance this distinction: the laws concerning our common life must be made by all those who are taking part in it, and residence is the only convincing test of whether someone is taking part \u2014 as is understood almost universally when it comes to questions of which citizens should have a voice in local government.`;

{id:1,type:'문장삽입',diff:'어려움',pts:6,fmt:'mc',ans:2,
ch:['①','②','③','④'],
passage:`Emphasizing speed over frequency can make sense in contexts where everyone is expected to plan around the timetable, including peak-only commute services and very long trips with low demand. <b>①</b> In all other contexts, though, it seems to be a common motorist\u2019s error. Roads are there all the time, so their speed is the most important fact that distinguishes them. But transit is only there if it\u2019s coming soon. <b>②</b> If you have a car, you can use a road whenever you want and experience its speed. But transit has to exist when you need it (span), and it needs to be coming soon (frequency). <b>③</b> Unless you\u2019re comfortable planning your life around a particular scheduled trip, speed is worthless without frequency, so a transit map that screams about speed and whispers about frequency may simply be planting confusion. <b>④</b>`,
stem:`다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class="q-given-sentence">Otherwise, waiting time will wipe out any time savings from a faster service.</div>`,
det:{korean:`대중교통은 운행 시간대에 존재해야 하고(span) 곧 와야 한다(frequency)는 설명 직후, "그렇지 않으면 대기 시간이 빠른 서비스로 인한 시간 절약을 모두 없앨 것"이라는 결과가 자연스럽다.`,analysis:`✅③: span과 frequency 설명 직후 → 그렇지 않으면(Otherwise)의 결과\n❌①: 아직 맥락 전환 전\n❌②: 도로와 대중교통 비교 시작\n❌④: 결론 뒤에 추가 설명 부적절`,tip:`Otherwise(그렇지 않으면)는 앞의 조건(span + frequency) 불충족 시 결과를 나타냄`}},

{id:2,type:'문장삽입',diff:'어려움',pts:6,fmt:'mc',ans:2,
ch:['①','②','③','④'],
passage:`In the escape that reading literature provides through vicarious identification and comparison with other lives, places, and times, we activate our imagination. <b>①</b> As opposed to perception that receives and processes information from the outside world \u2014 light, sound, shape \u2014 and finds meaning in it \u2014 a sunset, a symphony, a house \u2014 in imagination, the process is reversed. <b>②</b> Translating the words we read into what they signify, we populate an inner world in which imagery is created from the memory. <b>③</b> It is our imagination, the complex interweaving of perception and memory that literature activates, releasing a latent creativity that pleases. <b>④</b> The writer may provide the blueprint, but the reader builds literature\u2019s many rooms.`,
stem:`다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class="q-given-sentence">For example, we read \u201chouse\u201d and picture a representation of a house from memory.</div>`,
det:{korean:`기억으로부터 심상이 만들어진다는 설명(imagery is created from the memory) 직후, 그 구체적 예시("house"를 읽고 기억에서 집을 떠올림)가 오는 것이 자연스럽다.`,analysis:`✅③: "imagery is created from the memory" 직후 → 예시(house)\n❌①: 아직 상상과 지각의 대조 전\n❌②: 지각과 상상의 역전 설명 직후이나, 아직 기억에서 심상 생성 언급 전\n❌④: 이미 결론 단계`,tip:`For example은 앞 문장의 구체적 예시 → memory에서 imagery 생성의 예`}},

{id:3,type:'어순배열',diff:'어려움',pts:6,fmt:'written',wa:'the only convincing test of whether someone is taking part',
accept:['the only convincing test of whether someone is taking part'],
passage:`the laws concerning our common life must be made by all those who are taking part in it, and residence is __________________________________________.`,
stem:`주어진 단어를 올바른 순서로 배열하시오.<div class="q-given-sentence">test / the / whether / convincing / only / of / is / taking / someone / part</div>`,
det:{korean:`residence is the only convincing test of whether someone is taking part (거주는 누군가가 참여하고 있는지에 대한 유일한 설득력 있는 기준이다)`,analysis:`the only convincing test(유일한 설득력 있는 기준) + of whether(~인지에 대한) + someone is taking part(누군가가 참여하고 있는)`,tip:`the only + 형용사 + 명사 + of whether + S + V 구조`}},

{id:4,type:'어순배열',diff:'쉬움',pts:4,fmt:'written',wa:'screams about speed and whispers about frequency',
accept:['screams about speed and whispers about frequency'],
passage:`a transit map that __________________________________________ may simply be planting confusion.`,
stem:`주어진 단어를 올바른 순서로 배열하시오.<div class="q-given-sentence">whispers / about / speed / frequency / and / screams / about</div>`,
det:{korean:`속도에 대해 소리치고(screams about speed) 빈도에 대해 속삭이는(whispers about frequency) 교통 지도`,analysis:`screams about speed(속도에 대해 소리침) + and + whispers about frequency(빈도에 대해 속삭임)`,tip:`screams(소리치다) ↔ whispers(속삭이다) — 속도 vs 빈도의 대조`}},

{id:5,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`Emphasizing speed over frequency can make sense in contexts ①<u>where</u> everyone is expected to plan around the timetable. In all other contexts, though, it seems to be a common motorist\u2019s error. Roads are there all the time, so their speed is the most important fact ②<u>that</u> distinguishes them. But transit is only there if it\u2019s ③<u>coming</u> soon. But transit has to exist when you need it, and it needs to be coming soon. Otherwise, ④<u>wait</u> time will wipe out any time savings from a faster service. Unless you\u2019re comfortable ⑤<u>planning</u> your life around a particular scheduled trip, speed is worthless without frequency.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`waiting time이 올바른 표현. wait(동사원형)가 명사를 수식할 수 없고, 현재분사 waiting이 필요.`,analysis:`❌④wait → waiting: 명사 time을 수식하는 현재분사 필요\n✅①where: 선행사 contexts를 수식하는 관계부사\n✅②that: 선행사 fact를 수식하는 관계대명사\n✅③coming: be coming = 진행형\n✅⑤planning: be comfortable + ~ing`,tip:`waiting time(대기 시간) — 현재분사가 명사를 수식`}},

{id:6,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['①','②','③','④','⑤'],
passage:`When people are asked ①<u>what</u> any painting hanging on a gallery wall means, they tend to find meaning in it because it is ②<u>located</u> in a gallery. Consider a soda can ③<u>found</u> thrown away on a city street. But if we saw the very same object on a pedestal, ④<u>displaying</u> in an art gallery, signed by some artist, then we would interpret its meaning in a vastly different way. Clearly, the can\u2019s location will ⑤<u>influence</u> how we will interpret it.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`물체가 전시되는(displayed) 것이므로 수동 의미의 과거분사 displayed가 필요. displaying(능동)은 틀림.`,analysis:`❌④displaying → displayed: 물체가 전시되는 것(수동)\n✅①what: 간접의문문\n✅②located: be located(수동)\n✅③found: 과거분사(수동) 수식\n✅⑤influence: 조동사 will + 동사원형`,tip:`displayed(전시된) — 수동 의미의 과거분사`}},

{id:7,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`The reliance on the computer as a model may well ①<u>prove</u> to be as limited as an earlier fascination with behaviorism. Some have turned to cultural anthropology as a way of ②<u>understanding</u> the factors outside any particular individual\u2019s brain. Others find that the computer analogy carries with it an unfortunate shift. Bruner\u2019s reflections on the limits of the machine model lead him back to a humanistic emphasis on narrative and story-telling as ③<u>essential</u> ingredients in understanding human cognition, a ④<u>fascinated</u> intellectual journey that reveals both the power and the limits of computers as ⑤<u>guides</u> to the way we think.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`fascinating(매력적인) intellectual journey가 맞다. fascinated(매력을 느끼는)는 사물에 쓸 수 없다.`,analysis:`❌④fascinated → fascinating: journey(사물)를 수식 → 감정 유발 형용사 -ing\n✅①prove: may well + 동사원형\n✅②understanding: a way of + ~ing\n✅③essential: 형용사\n✅⑤guides: 명사(안내서)`,tip:`fascinating(매력적인, 사물) vs fascinated(매력을 느끼는, 사람)`}},

{id:8,type:'어휘',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['①','②','③','④','⑤'],
passage:`Emphasizing speed over frequency can make sense in contexts where everyone is expected to plan around the timetable. In all other contexts, though, it seems to be a common motorist\u2019s ①<u>error</u>. Roads are there all the time, so their speed is the most important fact that ②<u>distinguishes</u> them. But transit is only there if it\u2019s coming soon. But transit has to exist when you need it, and it needs to be coming soon. Otherwise, waiting time will ③<u>add to</u> any time savings from a faster service. Unless you\u2019re comfortable planning your life around a particular scheduled trip, speed is ④<u>worthless</u> without frequency, so a transit map that ⑤<u>screams</u> about speed and whispers about frequency may simply be planting confusion.`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`대기 시간이 시간 절약을 없앨(wipe out) 것이다. add to(더하다)는 wipe out(없애다)의 반의어로 부적절.`,analysis:`❌③add to(더하다) → wipe out(없애다): 대기 시간이 시간 절약을 상쇄한다는 문맥\n✅①error(오류) ✅②distinguishes(구별하다) ✅④worthless(무가치한) ✅⑤screams(소리치다)`,tip:`wipe out(없애다, 상쇄하다) ↔ add to(더하다)`}},

{id:9,type:'어휘',diff:'보통',pts:5,fmt:'mc',ans:2,
ch:['①','②','③','④','⑤'],
passage:`In the escape that reading literature provides through vicarious identification, we activate our ①<u>imagination</u>. As opposed to perception that receives and processes information from the outside world and finds meaning in it, in imagination, the process is ②<u>reversed</u>. We populate an inner world in which imagery is created from the memory. It is our imagination, the complex interweaving of perception and memory that literature activates, releasing a ③<u>manifest</u> creativity that pleases. The writer may provide the ④<u>blueprint</u>, but the reader builds literature\u2019s many rooms, and like any satisfying occupation, literature ⑤<u>gratifies</u> our imaginative and creative abilities.`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`잠재된(latent) 창의성을 해방시킨다. manifest(명백한, 드러난)는 latent(잠재된)의 반의어로 부적절.`,analysis:`❌③manifest(명백한) → latent(잠재된): 숨어 있다가 문학에 의해 해방되는 창의성\n✅①imagination ✅②reversed ✅④blueprint ✅⑤gratifies`,tip:`latent(잠재된) ↔ manifest(명백한, 드러난)`}},

{id:10,type:'내용이해',diff:'보통',pts:5,fmt:'mc',ans:2,
ch:['speed','accuracy','frequency','distance','schedule'],
passage:`Emphasizing speed over frequency can make sense in contexts where everyone is expected to plan around the timetable, including peak-only commute services and very long trips with low demand. In all other contexts, though, it seems to be a common motorist\u2019s error. Roads are there all the time, so their speed is the most important fact that distinguishes them. But transit is only there if it\u2019s coming soon. But transit has to exist when you need it (span), and it needs to be coming soon (frequency). Otherwise, waiting time will wipe out any time savings from a faster service. Unless you\u2019re comfortable planning your life around a particular scheduled trip, speed is worthless without __________.`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`속도는 빈도(frequency) 없이는 무가치하다 — 글의 핵심 주장.`,analysis:`✅③frequency: 빈도 — 핵심 주장\n❌①speed: 이미 주어진 조건\n❌②accuracy: 문맥과 무관\n❌④distance: 문맥과 무관\n❌⑤schedule: 부분적 관련이나 핵심 아님`,tip:`speed is worthless without frequency`}},

{id:11,type:'내용이해',diff:'어려움',pts:6,fmt:'mc',ans:1,
ch:['similarities','flaws','advantages','origins','applications'],
passage:`The reliance on the computer as a model for the operations of the human mind may well prove to be as limited as an earlier fascination with behaviorism. Psychologists have already begun to recognize the __________ of the mind-as-computer metaphor. Some have turned to cultural anthropology as a way of understanding the factors outside any particular individual\u2019s brain that help the individual make sense out of the world.`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`컴퓨터 비유의 결함(flaws)을 인식하기 시작하고 대안을 찾기 시작했다.`,analysis:`✅②flaws(결함): limited, 대안 전환의 이유\n❌①similarities: 유사성\n❌③advantages: 장점은 문맥과 반대\n❌④origins: 기원\n❌⑤applications: 응용`,tip:`recognize the flaws = 결함을 인식하다`}},

{id:12,type:'내용이해',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['location','value','origin','meaning','function'],
passage:`Consider a soda can found thrown away on a city street. If we were to come across this item on the street, we would no doubt view it as a piece of garbage or rubbish. But if we saw the very same object on a pedestal, displayed in an art gallery, signed by some artist, and given a title such as \u201cWaste,\u201d then we would interpret its __________ in a vastly different way.`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`같은 물체도 위치에 따라 그 의미(meaning)를 다르게 해석한다.`,analysis:`✅④meaning: interpret its meaning\n❌①location: 위치 자체를 해석하는 것 아님\n❌②value: 유사하나 원문은 meaning\n❌③origin: 기원`,tip:`interpret its meaning = 의미를 해석하다`}},

{id:13,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'frequency',
accept:['frequency','Frequency'],
passage:P_GW,
stem:`다음 글에서 속도(speed)가 그것 없이는 무가치하다고 한 것을 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`"speed is worthless without frequency"`,analysis:`frequency = 운행 빈도`,tip:`빈도 = frequency`}},

{id:14,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'residence',
accept:['residence','Residence'],
passage:P_EX01,
stem:`다음 글에서 누군가가 참여하고 있는지의 유일한 설득력 있는 기준(test)을 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`"residence is the only convincing test"`,analysis:`residence = 거주`,tip:`residence = 거주 (참여 판단의 유일한 기준)`}},

{id:15,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'materialistic',
accept:['materialistic','Materialistic'],
passage:`We would, in fact, be inclined to interpret it as an artistic form, descrying a throw-away or __________ (material) society.`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`material → materialistic: 물질만능주의적 사회.`,analysis:`material(재료의) → materialistic(물질만능주의적인): 형용사 파생`,tip:`materialistic society = 물질만능주의 사회`}},

{id:16,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'humanistic',
accept:['humanistic','Humanistic'],
passage:`Bruner\u2019s reflections on the limits of the machine model lead him back to a __________ (human) emphasis on narrative and story-telling.`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`human → humanistic: 인본주의적 강조.`,analysis:`human(인간의) → humanistic(인본주의적인): 형용사 파생`,tip:`humanistic = 인본주의적인`}},

{id:17,type:'내용이해',diff:'보통',pts:5,fmt:'mc',ans:2,
ch:['대중교통의 운행 빈도 조정의 결과','정확한 대중교통 지도를 설계하는 것의 중요성','대중교통에서 운행 빈도에 가치를 부여하는 것의 중요성','고속 대중교통 시스템을 만드는 것의 영향','통근 서비스의 속도와 운행 빈도를 개선하는 방법'],
passage:P_GW,
stem:`다음 글의 주제로 가장 적절한 것은?`,
det:{korean:`속도보다 빈도가 중요하며, 빈도 없는 속도는 무가치하다. 정답 PDF: GW ③`,analysis:`✅③ 빈도에 가치 부여: speed is worthless without frequency\n❌나머지: 부분적이거나 무관`,tip:`frequency > speed in transit`}},

{id:18,type:'내용이해',diff:'어려움',pts:6,fmt:'mc',ans:3,
ch:['인간이 생각하는 방식과 컴퓨터 작동의 유사성','개인이 세상을 이해하는 데 영향을 미치는 다양한 요인','인간 마음을 논할 때 컴퓨터 비유를 사용하는 이유','컴퓨터 모델을 넘어선 인간 인지에 대한 대안적 관점','컴퓨터 기반 사고 모델의 정확도를 높이는 기술'],
passage:P_EX03,
stem:`다음 글의 주제로 가장 적절한 것은?`,
det:{korean:`컴퓨터 비유의 한계를 인식하고, 문화인류학/서사 등 대안적 관점으로 인간 인지를 이해. 정답 PDF: Ex03 ④`,analysis:`✅④ 대안적 관점: beyond the computer model\n❌나머지: 부분적이거나 무관`,tip:`limits of computer metaphor → narrative/storytelling`}},

{id:19,type:'T/F',diff:'보통',pts:5,fmt:'mc',ans:1,
ch:['True','False'],
passage:P_EX02,
stem:`"A soda can found on a city street would be interpreted as an artistic form by most people." (T/F)`,
det:{korean:`원문: "we would no doubt view it as a piece of garbage or rubbish" → 거리에서는 쓰레기로 봄.`,analysis:`❌False: garbage/rubbish ≠ artistic form\n거리에서는 쓰레기, 갤러리에서만 예술적 형태로 해석`,tip:`street = garbage, gallery = artistic form`}},

{id:20,type:'T/F',diff:'쉬움',pts:4,fmt:'mc',ans:0,
ch:['True','False'],
passage:P_EX04,
stem:`"The writer may provide the blueprint, but the reader builds literature\u2019s many rooms." (T/F)`,

];

function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name,answers:S.ans.slice()});if(h.length>20)h.length=20;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map((x,idx)=>`<div class="history-item" style="flex-wrap:wrap"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade} · ${x.level||''}</div></div><div class="hi-right"><div class="hi-score" style="color:${x.score>=80?'var(--o)':'var(--r)'}">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div></div>${x.answers?`<button onclick="reviewHistory(${idx})" style="width:100%;margin-top:8px;padding:8px;border:1.5px solid #dde8df;border-radius:8px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--o)">📝 정답·해설 다시 보기</button>`:''}</div>`).join('');p.style.display='block';}
function getLevel(s){if(s>=95)return{name:'마스터',icon:'👑',range:'95~100',msg:'이 단원은 정복했어요!'};if(s>=85)return{name:'챌린저',icon:'🌟',range:'85~94',msg:'거의 완벽, 한 끗 차이!'};if(s>=75)return{name:'파이터',icon:'💎',range:'75~84',msg:'통과! 약점만 잡으면 마스터'};if(s>=50)return{name:'루키',icon:'🔥',range:'50~74',msg:'기본기 OK, 유형별 훈련 필요'};return{name:'스타터',icon:'📖',range:'0~49',msg:'지문 해석부터 다시!'};}
function getTypeAdvice(t){const m={'(A)(B)(C) 조합형':'반의어 함정 주의, 원문 단어 정확히 암기','문맥상 부적절한 어휘':'밑줄 단어가 반의어로 바뀌었는지 확인','동의어 고르기':'동의어 쌍을 세트로 묶어 암기','반의어 고르기':'반의어 쌍을 세트로 묶어 암기','빈칸 어휘 완성':'문맥 단서(clue) 찾기 연습 필요','다의어 문맥적 의미':'다의어의 여러 뜻을 문맥별로 구분','영영풀이 매칭':'영영사전 정의 읽기 연습','어형 변환 (서술형)':'품사 변환 규칙(명↔형, 동↔명) 정리','빈칸 문맥 완성':'글의 흐름과 논리적 연결 파악','어법':'핵심 어법 규칙 정리 및 반복 연습','내용일치':'지문과 선지를 꼼꼼히 대조','내용불일치':'함정 선지의 미세한 차이 찾기','T/F':'원문과 진술을 정확히 대조','서술형':'정확한 철자와 어형 변환 주의','빈칸추론':'빈칸 전후 문맥 단서 찾기','빈칸 추론':'빈칸 전후 문맥 단서 찾기','문장삽입':'글의 흐름과 연결사 파악','어순배열':'문장 구조(S+V+O) 정확히 파악','어휘':'문맥에서 적절한 어휘 고르기 연습','내용이해':'지문 핵심 내용 정확히 파악'};return m[t]||'해당 유형 집중 복습 필요';}
function fmtTime(s){return Math.floor(s/60)+'분 '+s%60+'초';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function startExam(){
  const nm=document.getElementById('inpName').value.trim();
  if(!nm){toast('이름을 입력해주세요!');return;}
  S={ans:Array(EI.totalQ).fill(null),cur:0,ti:null,left:EI.time,start:Date.now(),order:shuffle([...Array(EI.totalQ).keys()])};
  showScreen('examScreen');
  showQ(0);
  startTimer();
  updateProgress();
  initSwipe();
}
function showQ(idx,direction){
  S.cur=idx;
  const qi=S.order?S.order[idx]:idx;
  const q=Q[qi];
  const tc=typeTag[q.type]||'';
  const mk='①②③④⑤';
  const pp=document.getElementById('slidePassage');
  if(direction){
    pp.classList.add(direction>0?'fade-out':'fade-in');
    setTimeout(()=>{
      renderContent(idx,qi,q,tc,mk,pp);
      pp.classList.remove('fade-out','fade-in');
    },150);
  } else {
    renderContent(idx,qi,q,tc,mk,pp);
  }
}
function renderContent(idx,qi,q,tc,mk,pp){
  let ph='<div class="q-badge"><div class="q-num">'+( idx+1)+'</div><span>'+q.type+'</span><span style="opacity:.6">'+q.diff+' \u00b7 '+q.pts+'\uc810</span></div>';
  if(q.passage) ph+='<div class="q-passage">'+q.passage+'</div>';
  else ph+='<div style="padding:30px;text-align:center;color:var(--tl)">\uc774 \ubb38\ud56d\uc740 \uc9c0\ubb38\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.</div>';
  pp.innerHTML=ph;
  pp.scrollTop=0;
  const bt=document.getElementById('slideBottom');
  let bh='<div class="slide-stem">'+q.stem+'</div><div class="slide-choices">';
  if(q.fmt==='mc'){
    q.ch.forEach(function(c,ci){
      var sel=S.ans[qi]===ci?' selected':'';
      bh+='<button class="choice-btn'+sel+'" onclick="selectAns('+idx+','+ci+')"><span class="c-num">'+mk[ci]+'</span><span>'+c+'</span></button>';
    });
  }
  if(q.fmt==='written'){
    var val=S.ans[qi]||'';
    bh+='<input class="written-input" value="'+val+'" placeholder="\ub2f5\uc548\uc744 \uc785\ub825\ud558\uc138\uc694..." oninput="writeAns('+idx+',this.value)">';
  }
  bh+='</div><div class="slide-nav"><button '+(idx===0?'disabled ':'')+' onclick="navQ(-1)">\u2190 \uc774\uc804</button><span class="nav-cur">'+(idx+1)+' / '+EI.totalQ+'</span><button class="sn-next" '+(idx===EI.totalQ-1?'disabled ':'')+' onclick="navQ(1)">\ub2e4\uc74c \u2192</button></div>';
  bt.innerHTML=bh;
}
function selectAns(idx,ci){
  var qi=S.order?S.order[idx]:idx;
  S.ans[qi]=ci;
  var btns=document.querySelectorAll('.slide-choices .choice-btn');
  btns.forEach(function(b,i){
    b.classList.toggle('selected',i===ci);
    if(i===ci)b.classList.add('just-selected');
  });
  updateProgress();
  setTimeout(function(){if(idx<EI.totalQ-1)showQ(idx+1,1);},400);
}
function writeAns(idx,val){
  var qi=S.order?S.order[idx]:idx;
  S.ans[qi]=val.trim()||null;
  updateProgress();
}
function navQ(dir){
  var next=S.cur+dir;
  if(next>=0&&next<EI.totalQ)showQ(next,dir);
}
function updateProgress(){
  var answered=S.ans.filter(function(a){return a!==null;}).length;
  document.getElementById('progressFill').style.width=(answered/EI.totalQ*100)+'%';
  document.getElementById('ansCount').textContent=answered+'/'+EI.totalQ;
}
function initSwipe(){
  var startX=0,startY=0;
  var el=document.getElementById('slideWrap');
  el.addEventListener('touchstart',function(e){startX=e.touches[0].clientX;startY=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-startX;
    var dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0&&S.cur<EI.totalQ-1)navQ(1);
      if(dx>0&&S.cur>0)navQ(-1);
    }
  },{passive:true});
}

function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}

h+=`<div class="rs"><div class="rs-title">🔍 내신핏 약점 진단</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'var(--o)':p>=50?'var(--o)':'var(--r)';const icon=p===100?'✅':p>=50?'⚠️':'❌';h+=`<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:13px">${icon}</span><span style="font-size:13px;font-weight:700;flex:1">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-size:13px;font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div>${p<100?`<div style="font-size:11px;color:var(--tm);margin-top:3px;padding-left:21px">→ ${getTypeAdvice(type)}</div>`:''}</div>`;});h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 내신핏 처방</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">👑</div><div class="plan-text"><h4>마스터 달성!</h4><p>이 단원은 완벽합니다. 다음 단원에 도전하세요!</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">🌟</div><div class="plan-text"><h4>통과! 마스터까지 한 끗</h4><p>아래 약점 유형만 집중하면 마스터 달성!</p></div>`;else if(pct>=50)h+=`<div class="plan-icon">🔥</div><div class="plan-text"><h4>기본기는 있어요!</h4><p>오답 해설을 꼼꼼히 확인하고, 약점 유형부터 공략하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>지문 해석부터!</h4><p>본문을 완벽히 이해한 뒤 재도전하세요. 해설의 한글 해석을 활용!</p></div>`;h+=`</div></div>`;

function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
