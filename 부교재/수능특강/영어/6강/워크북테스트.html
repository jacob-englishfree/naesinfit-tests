const P_GW=`Emphasizing speed over frequency can make sense in contexts where everyone is expected to plan around the timetable, including peak-only commute services and very long trips with low demand. In all other contexts, though, it seems to be a common motorist\u2019s error. Roads are there all the time, so their speed is the most important fact that distinguishes them. But transit is only there if it\u2019s coming soon. If you have a car, you can use a road whenever you want and experience its speed. But transit has to exist when you need it (span), and it needs to be coming soon (frequency). Otherwise, waiting time will wipe out any time savings from a faster service. Unless you\u2019re comfortable planning your life around a particular scheduled trip, speed is worthless without frequency, so a transit map that screams about speed and whispers about frequency may simply be planting confusion.`;

const P_EX01=`In the United States, the practice of permitting aliens to vote could be seen as compatible with the idea of an exclusionary citizenship, but that is a hard balance to maintain. If the vote, of all rights, is in the hands of noncitizens, why should they not count as citizens, and the entire distinction between resident alien and citizen be abandoned? Indeed, something like this thought probably lay behind the disappearance of alien voting: with universal adult citizen suffrage after 1920, the only way to maintain an exclusionary kind of citizenship was to restrict the vote to citizens and not residents. But no theory of \u201cactive\u201d democracy can countenance this distinction: the laws concerning our common life must be made by all those who are taking part in it, and residence is the only convincing test of whether someone is taking part \u2014 as is understood almost universally when it comes to questions of which citizens should have a voice in local government.`;

const P_EX02=`When people are asked what any painting hanging on a gallery wall means, no matter how strange it might appear, as is the case with most abstract-expressionist paintings, they tend to find meaning in it because it is located in a gallery. Consider a soda can found thrown away on a city street. If we were to come across this item on the street, we would no doubt view it as a piece of garbage or rubbish. But if we saw the very same object on a pedestal, displayed in an art gallery, signed by some artist, and given a title such as \u201cWaste,\u201d then we would interpret its meaning in a vastly different way. We would, in fact, be inclined to interpret it as an artistic form, descrying a throw-away or materialistic society. Clearly, the can\u2019s location on a sidewalk versus its display on a pedestal in an art gallery will influence how we will interpret it.`;

const P_EX03=`The reliance on the computer as a model for the operations of the human mind may well prove to be as limited as an earlier fascination with behaviorism. Psychologists have already begun to recognize the flaws of the mind-as-computer metaphor. Some have turned to cultural anthropology as a way of understanding the factors outside any particular individual\u2019s brain that help the individual make sense out of the world. Others, such as Jerome Bruner, one of the founders of cognitive psychology, find that the computer analogy carries with it an unfortunate shift \u201cfrom the construction of meaning to the processing of information.\u201d Bruner\u2019s reflections on the limits of the machine model lead him back to a humanistic emphasis on narrative and story-telling as essential ingredients in understanding human cognition, a fascinating intellectual journey that reveals both the power and the limits of computers as guides to the way we think.`;

const P_EX04=`In the escape that reading literature provides through vicarious identification and comparison with other lives, places, and times, we activate our imagination, that uniquely human ability to explore an alternative set of ideas and experiences that are outside our present environment and that may not even be real. As opposed to perception that receives and processes information from the outside world \u2014 light, sound, shape \u2014 and finds meaning in it \u2014 a sunset, a symphony, a house \u2014 in imagination, the process is reversed. Translating the words we read into what they signify, we populate an inner world in which imagery is created from the memory. For example, we read \u201chouse\u201d and picture a representation of a house from memory. It is our imagination, the complex interweaving of perception and memory that literature activates, releasing a latent creativity that pleases. The writer may provide the blueprint, but the reader builds literature\u2019s many rooms, and like any satisfying occupation, literature gratifies our imaginative and creative abilities.`;

{"id":3,"type":"어법","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["limit","limited","limiting","to limit"],"passage":"The reliance on the computer as a model for the operations of the human mind may well prove to be as __________ as an earlier fascination with behaviorism.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"as + 형용사 + as 비교 구조. limited(제한된)가 적절.","analysis":"✅ ②limited: as + 형용사 + as 비교 구조\n❌ ①limit: 동사/명사\n❌ ③limiting: 제한하는(능동)\n❌ ④to limit: 부정사","tip":"as limited as = ~만큼 제한적인"}},
{"id":4,"type":"어법","diff":"어려움","pts":6,"fmt":"mc","ans":1,"ch":["①","②","③"],"passage":"Translating the words we read into what they ①<u>signify</u>, we populate an inner world in which imagery is ②<u>creating</u> from the memory. It is our imagination that literature activates, ③<u>releasing</u> a latent creativity that pleases.","stem":"밑줄 친 ①~③ 중 어법상 틀린 것은?","det":{"korean":"imagery는 만들어지는 대상(수동)이므로 created가 되어야 한다. creating(능동)은 틀림.","analysis":"✅ ①signify: 의미하다 (능동, 적절)\n❌ ②creating → created: imagery가 만들어지는(수동) 것이므로 과거분사 필요\n✅ ③releasing: 분사구문(능동) 적절","tip":"imagery is created = 심상이 만들어지다 (수동태)"}},
{"id":5,"type":"어법","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["satisfy","satisfied","satisfying","satisfaction"],"passage":"The writer may provide the blueprint, but the reader builds literature\u2019s many rooms, and like any __________ occupation, literature gratifies our imaginative and creative abilities.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"satisfying occupation = 만족을 주는 직업. 사물을 수식하므로 현재분사.","analysis":"✅ ③satisfying: 만족을 주는(감정 유발 형용사)\n❌ ①satisfy: 동사 원형\n❌ ②satisfied: 만족한(감정 느끼는 쪽)\n❌ ④satisfaction: 명사","tip":"satisfying(만족을 주는) vs satisfied(만족한) — 사물 수식 시 -ing"}},
{"id":6,"type":"내용이해","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["대중교통의 운행 빈도 조정의 결과","정확한 대중교통 지도를 설계하는 것의 중요성","대중교통에서 운행 빈도에 가치를 부여하는 것의 중요성","고속 대중교통 시스템을 만드는 것의 영향","통근 서비스의 속도와 운행 빈도를 개선하는 방법"],"passage":P_GW,"stem":"다음 글의 주제로 가장 적절한 것은?","det":{"korean":"속도보다 빈도가 중요하며, 빈도 없는 속도는 무가치하다는 내용. 정답 PDF: GW ③","analysis":"✅ ③ 빈도에 가치 부여: speed is worthless without frequency\n❌ 나머지: 부분적이거나 무관","tip":"frequency > speed in transit"}},
{"id":7,"type":"내용이해","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["시민이 가져야 할 정치적 권리에 대한 전통적 견해","진정한 민주주의를 위해 모든 거주자를 투표에 포함시키는 것의 필요성","민주주의에서 대표성 있는 후보를 선출하는 것의 중요성","의사결정에서 거주자 참여를 촉진하는 어려움","다양한 이해관계를 충족하며 정치적 안정을 유지하는 방법"],"passage":P_EX01,"stem":"다음 글의 주제로 가장 적절한 것은?","det":{"korean":"능동적 민주주의에서 거주가 참여의 유일한 기준이며, 모든 거주자를 투표에 포함해야 한다. 정답 PDF: Ex01 ②","analysis":"✅ ② 모든 거주자 포함: residence is the only convincing test\n❌ 나머지: 부분적이거나 무관","tip":"residence = the only test of taking part"}},
{"id":8,"type":"내용불일치","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["사람들은 갤러리 벽에 걸린 그림의 의미를 찾으려 한다.","거리에서 탄산음료 캔을 발견하면 쓰레기로 볼 것이다.","같은 물체라도 갤러리에서 받침대 위에 있으면 해석이 달라진다.","갤러리에 전시된 물체는 항상 예술적 가치가 높다고 평가된다."],"passage":P_EX02,"stem":"다음 글의 내용과 일치하지 않는 것은?","det":{"korean":"글은 위치에 따라 해석이 달라진다고 하지, 갤러리 전시 물체가 항상 예술적 가치가 높다고 하지 않았다.","analysis":"✅ ④: '항상 예술적 가치가 높다'는 과잉 해석. 원문은 해석이 달라진다는 것\n❌ ①: 원문 일치\n❌ ②: 원문 일치\n❌ ③: 원문 일치","tip":"내용불일치: '항상(always)' 같은 절대 표현에 주의"}},
{"id":9,"type":"내용불일치","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["컴퓨터를 인간 마음의 모델로 의존하는 것은 행동주의에 대한 과거 매혹만큼 제한적일 수 있다.","일부 심리학자들은 문화인류학으로 전환하여 개인의 뇌 외부 요인을 이해하려 한다.","Jerome Bruner는 컴퓨터 비유가 의미의 구성에서 정보 처리로의 전환을 긍정적으로 평가한다.","Bruner의 성찰은 서사와 스토리텔링에 대한 인본주의적 강조로 돌아가게 했다."],"passage":P_EX03,"stem":"다음 글의 내용과 일치하지 않는 것은?","det":{"korean":"Bruner는 그 전환을 'unfortunate(불행한)'이라고 했지, 긍정적으로 평가하지 않았다.","analysis":"✅ ③: unfortunate shift → 부정적 평가이지 긍정적이 아님\n❌ ①: 원문 일치 (may well prove to be as limited)\n❌ ②: 원문 일치 (turned to cultural anthropology)\n❌ ④: 원문 일치 (lead him back to humanistic emphasis)","tip":"unfortunate = 불행한, 부정적 → 긍정적 평가와 반대"}},
{"id":10,"type":"T/F","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["True","False"],"passage":P_GW,"stem":"다음 문장이 본문과 일치하면 True, 일치하지 않으면 False를 선택하시오.<br><br><b>\"Transit has to exist when you need it, and it needs to be coming soon.\"</b>","det":{"korean":"원문: \"transit has to exist when you need it (span), and it needs to be coming soon (frequency)\" → 괄호를 제외하면 동일.","analysis":"✅ True: 원문과 내용 일치","tip":"원문에서 (span), (frequency) 괄호 설명만 제외한 동일 문장"}},
{"id":11,"type":"T/F","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["True","False"],"passage":P_EX01,"stem":"다음 문장이 본문과 일치하면 True, 일치하지 않으면 False를 선택하시오.<br><br><b>\"After 1920, both citizens and residents were allowed to vote equally in the United States.\"</b>","det":{"korean":"원문: 1920년 이후 배타적 시민권을 유지하는 유일한 방법은 투표를 시민으로 제한하는 것이었다. 거주자에게도 동등하게 허용된 것이 아님.","analysis":"❌ False: 'the only way to maintain an exclusionary kind of citizenship was to restrict the vote to citizens and not residents' → 시민만 투표 가능","tip":"restrict to citizens and not residents = 시민에게만 제한, 거주자 불포함"}},
{"id":12,"type":"T/F","diff":"어려움","pts":6,"fmt":"mc","ans":0,"ch":["True","False"],"passage":P_EX04,"stem":"다음 문장이 본문과 일치하면 True, 일치하지 않으면 False를 선택하시오.<br><br><b>\"In imagination, imagery is created from memory, unlike perception which processes information from the outside world.\"</b>","det":{"korean":"원문: 지각은 외부 세계의 정보를 처리하지만, 상상에서는 심상이 기억으로부터 만들어진다 → 일치.","analysis":"✅ True: perception processes from outside world, imagination creates from memory → 원문과 일치","tip":"perception(외부→의미) vs imagination(기억→심상) 대조 구조 정확히 일치"}},

{"id":14,"type":"서술형","diff":"보통","pts":5,"fmt":"written","wa":"residence","accept":["residence","Residence"],"ch":null,"passage":P_EX01,"stem":"다음 글에서 누군가가 공동 생활에 참여하고 있는지를 판단하는 유일한 설득력 있는 기준을 본문에서 <b>1단어</b>로 찾아 쓰시오.","det":{"korean":"residence is the only convincing test.","analysis":"residence = 거주","tip":"residence = 거주 (참여 판단 기준)"}},
{"id":15,"type":"서술형","diff":"보통","pts":5,"fmt":"written","wa":"materialistic","accept":["materialistic","Materialistic"],"ch":null,"passage":"We would, in fact, be inclined to interpret it as an artistic form, descrying a throw-away or __________ (material) society.","stem":"다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.","det":{"korean":"material → materialistic(형용사). 물질만능주의적 사회.","analysis":"material → materialistic: 형용사 파생\n물질만능주의적 사회(materialistic society)","tip":"materialistic society = 물질만능주의 사회"}},
{"id":16,"type":"서술형","diff":"쉬움","pts":4,"fmt":"written","wa":"humanistic","accept":["humanistic","Humanistic"],"ch":null,"passage":"Bruner\u2019s reflections on the limits of the machine model lead him back to a __________ (human) emphasis on narrative and story-telling as essential ingredients in understanding human cognition.","stem":"다음 글의 빈칸에 괄호 안의 단어를 어법에 맞게 변형하여 쓰시오.","det":{"korean":"human → humanistic(형용사). 인본주의적 강조.","analysis":"human → humanistic: 형용사 파생\na humanistic emphasis = 인본주의적 강조","tip":"humanistic = 인본주의적인"}},
{"id":17,"type":"빈칸추론","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["speed","accuracy","frequency","distance","schedule"],"passage":"Unless you\u2019re comfortable planning your life around a particular scheduled trip, speed is worthless without __________, so a transit map that screams about speed and whispers about frequency may simply be planting confusion.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"속도는 빈도(frequency) 없이는 무가치하다.","analysis":"✅ ③frequency: 빈도 — 글의 핵심 주장\n❌ ①speed: 이미 주어진 조건\n❌ ②accuracy: 문맥과 무관\n❌ ④distance: 문맥과 무관\n❌ ⑤schedule: 부분적 관련","tip":"speed is worthless without frequency"}},
{"id":18,"type":"빈칸추론","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["location","value","origin","meaning"],"passage":"Consider a soda can found thrown away on a city street. If we were to come across this item on the street, we would no doubt view it as a piece of garbage or rubbish. But if we saw the very same object on a pedestal, displayed in an art gallery, signed by some artist, and given a title such as \u201cWaste,\u201d then we would interpret its __________ in a vastly different way.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"같은 물체도 위치에 따라 그 의미(meaning)를 전혀 다르게 해석한다.","analysis":"✅ ④meaning: interpret its meaning = 의미를 해석하다\n❌ ①location: 위치 자체를 해석하는 것이 아님\n❌ ②value: 유사하나 원문은 meaning\n❌ ③origin: 기원","tip":"interpret its meaning = 의미를 해석하다"}},
{"id":19,"type":"빈칸추론","diff":"어려움","pts":6,"fmt":"mc","ans":1,"ch":["similarities","flaws","advantages","origins","applications"],"passage":"Psychologists have already begun to recognize the __________ of the mind-as-computer metaphor. Some have turned to cultural anthropology as a way of understanding the factors outside any particular individual\u2019s brain that help the individual make sense out of the world.","stem":"다음 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"컴퓨터 비유의 결함(flaws)을 인식하기 시작했고, 대안을 찾기 시작했다.","analysis":"✅ ②flaws: 결함 — 이후 대안적 접근으로 전환하는 이유\n❌ ①similarities: 유사성은 결함이 아님\n❌ ③advantages: 장점은 문맥과 반대\n❌ ④origins: 기원은 무관\n❌ ⑤applications: 응용은 무관","tip":"recognize the flaws = 결함을 인식하다"}},
{"id":20,"type":"빈칸추론","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["limitations","alternatives","similarities","applications","advantages"],"passage":"The reliance on the computer as a model for the operations of the human mind may well prove to be as limited as an earlier fascination with behaviorism. Psychologists have already begun to recognize the flaws of the mind-as-computer metaphor. Some have turned to cultural anthropology. Others, such as Jerome Bruner, find that the computer analogy carries with it an unfortunate shift. Bruner\u2019s reflections lead him back to a humanistic emphasis on narrative and story-telling. This passage mainly discusses __________ to the computer model of the human mind.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"이 글은 컴퓨터 모델의 한계를 인식하고 대안적 관점을 논의한다. 정답 PDF: Ex03 ④","analysis":"✅ ②alternatives(대안): 문화인류학, 서사/스토리텔링 등 대안적 접근이 핵심\n❌ ①limitations(한계): 부분적이나, 글의 핵심은 대안 제시\n❌ ③similarities(유사점): 글의 방향과 반대\n❌ ④applications(응용): 무관\n❌ ⑤advantages(장점): 글의 방향과 반대","tip":"정답 PDF 6강 Ex03: ④ 컴퓨터 모델을 넘어선 인간 인지에 대한 대안적 관점"}}

let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const typeTag={'어법':'tag-grammar','내용이해':'tag-content','빈칸추론':'tag-blank','서술형':'tag-written','T/F':'tag-tf'};
function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':q.ch.length===3?'①②③':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':d.q.ch&&d.q.ch.length===3?'①②③':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:d.q.wa;const open=!d.ok;const det=d.q.det||{};h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[ ${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--oxl);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--oxl);color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div>${det.korean?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${det.korean}</div>`:''}${det.analysis?`<div class="expl-tag tip">📋 분석</div><div class="expl-box">${det.analysis}</div>`:''}${det.tip?`<div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${det.tip}</div>`:''}</div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;let txt=`📝 온라인워크북 TEST 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
