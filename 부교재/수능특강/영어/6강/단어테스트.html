const P_GW=`Emphasizing speed over frequency can make sense in contexts where everyone is expected to plan around the timetable, including peak-only commute services and very long trips with low demand. In all other contexts, though, it seems to be a common motorist\u2019s error. Roads are there all the time, so their speed is the most important fact that distinguishes them. But transit is only there if it\u2019s coming soon. If you have a car, you can use a road whenever you want and experience its speed. But transit has to exist when you need it (span), and it needs to be coming soon (frequency). Otherwise, waiting time will wipe out any time savings from a faster service. Unless you\u2019re comfortable planning your life around a particular scheduled trip, speed is worthless without frequency, so a transit map that screams about speed and whispers about frequency may simply be planting confusion.`;

const P_EX01=`In the United States, the practice of permitting aliens to vote could be seen as compatible with the idea of an exclusionary citizenship, but that is a hard balance to maintain. If the vote, of all rights, is in the hands of noncitizens, why should they not count as citizens, and the entire distinction between resident alien and citizen be abandoned? Indeed, something like this thought probably lay behind the disappearance of alien voting: with universal adult citizen suffrage after 1920, the only way to maintain an exclusionary kind of citizenship was to restrict the vote to citizens and not residents. But no theory of \u201cactive\u201d democracy can countenance this distinction: the laws concerning our common life must be made by all those who are taking part in it, and residence is the only convincing test of whether someone is taking part \u2014 as is understood almost universally when it comes to questions of which citizens should have a voice in local government.`;

const P_EX02=`When people are asked what any painting hanging on a gallery wall means, no matter how strange it might appear, as is the case with most abstract-expressionist paintings, they tend to find meaning in it because it is located in a gallery. Consider a soda can found thrown away on a city street. If we were to come across this item on the street, we would no doubt view it as a piece of garbage or rubbish. But if we saw the very same object on a pedestal, displayed in an art gallery, signed by some artist, and given a title such as \u201cWaste,\u201d then we would interpret its meaning in a vastly different way. We would, in fact, be inclined to interpret it as an artistic form, descrying a throw-away or materialistic society. Clearly, the can\u2019s location on a sidewalk versus its display on a pedestal in an art gallery will influence how we will interpret it.`;

const P_EX03=`The reliance on the computer as a model for the operations of the human mind may well prove to be as limited as an earlier fascination with behaviorism. Psychologists have already begun to recognize the flaws of the mind-as-computer metaphor. Some have turned to cultural anthropology as a way of understanding the factors outside any particular individual\u2019s brain that help the individual make sense out of the world. Others, such as Jerome Bruner, one of the founders of cognitive psychology, find that the computer analogy carries with it an unfortunate shift \u201cfrom the construction of meaning to the processing of information.\u201d Bruner\u2019s reflections on the limits of the machine model lead him back to a humanistic emphasis on narrative and story-telling as essential ingredients in understanding human cognition, a fascinating intellectual journey that reveals both the power and the limits of computers as guides to the way we think.`;

const P_EX04=`In the escape that reading literature provides through vicarious identification and comparison with other lives, places, and times, we activate our imagination, that uniquely human ability to explore an alternative set of ideas and experiences that are outside our present environment and that may not even be real. As opposed to perception that receives and processes information from the outside world \u2014 light, sound, shape \u2014 and finds meaning in it \u2014 a sunset, a symphony, a house \u2014 in imagination, the process is reversed. Translating the words we read into what they signify, we populate an inner world in which imagery is created from the memory. For example, we read \u201chouse\u201d and picture a representation of a house from memory. It is our imagination, the complex interweaving of perception and memory that literature activates, releasing a latent creativity that pleases. The writer may provide the blueprint, but the reader builds literature\u2019s many rooms, and like any satisfying occupation, literature gratifies our imaginative and creative abilities.`;

{"id":1,"type":"(A)(B)(C) 조합형","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["sense — speed — frequency","error — speed — frequency","sense — frequency — speed","error — frequency — speed","sense — speed — timetable"],"passage":"Emphasizing speed over frequency can make <b>(A)</b> in contexts where everyone is expected to plan around the timetable, including peak-only commute services and very long trips with low demand. In all other contexts, though, it seems to be a common motorist\u2019s error. Roads are there all the time, so their <b>(B)</b> is the most important fact that distinguishes them. But transit is only there if it\u2019s coming soon. If you have a car, you can use a road whenever you want and experience its speed. But transit has to exist when you need it (span), and it needs to be coming soon (frequency). Otherwise, waiting time will wipe out any time savings from a faster service. Unless you\u2019re comfortable planning your life around a particular scheduled trip, speed is worthless without <b>(C)</b>, so a transit map that screams about speed and whispers about frequency may simply be planting confusion.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"속도를 빈도보다 강조하는 것이 <b>타당할(sense)</b> 수 있는 맥락이 있지만, 도로의 <b>속도(speed)</b>가 도로를 구별짓는 사실이고, 속도는 <b>빈도(frequency)</b> 없이는 무가치하다.","analysis":"✅ ① sense — speed — frequency: 원문과 일치\n❌ ② error는 (A)에 부적절 — make sense가 원문\n❌ ③ frequency와 speed 위치가 바뀜\n❌ ④ error + frequency/speed 바뀜\n❌ ⑤ timetable은 (C)에 부적절","tip":"make sense(타당하다), speed(속도), frequency(빈도) — 대중교통 핵심 어휘"}},

{"id":2,"type":"(A)(B)(C) 조합형","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["perception — reversed — memory","perception — accelerated — memory","imagination — reversed — reality","perception — reversed — reality","imagination — accelerated — memory"],"passage":"In the escape that reading literature provides through vicarious identification and comparison with other lives, places, and times, we activate our imagination, that uniquely human ability to explore an alternative set of ideas and experiences that are outside our present environment and that may not even be real. As opposed to <b>(A)</b> that receives and processes information from the outside world \u2014 light, sound, shape \u2014 and finds meaning in it \u2014 a sunset, a symphony, a house \u2014 in imagination, the process is <b>(B)</b>. Translating the words we read into what they signify, we populate an inner world in which imagery is created from the <b>(C)</b>.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"외부 정보를 받아들이는 <b>지각(perception)</b>과 달리, 상상에서는 과정이 <b>역전되며(reversed)</b>, 심상은 <b>기억(memory)</b>으로부터 만들어진다.","analysis":"✅ ① perception — reversed — memory: 원문과 일치\n❌ ② accelerated(가속된)는 reversed의 오류\n❌ ③ imagination은 (A)와 대조되는 것이므로 부적절\n❌ ④ reality는 memory가 아님\n❌ ⑤ imagination + accelerated 모두 부적절","tip":"perception(지각) ↔ imagination(상상), process is reversed(과정이 역전됨)"}},

{"id":3,"type":"문맥상 부적절한 어휘","diff":"쉬움","pts":4,"fmt":"mc","ans":3,"ch":["① compatible","② abandoned","③ exclusionary","④ support","⑤ universally"],"passage":"In the United States, the practice of permitting aliens to vote could be seen as <u>① compatible</u> with the idea of an exclusionary citizenship, but that is a hard balance to maintain. If the vote, of all rights, is in the hands of noncitizens, why should they not count as citizens, and the entire distinction between resident alien and citizen be <u>② abandoned</u>? Indeed, something like this thought probably lay behind the disappearance of alien voting: with universal adult citizen suffrage after 1920, the only way to maintain an <u>③ exclusionary</u> kind of citizenship was to restrict the vote to citizens and not residents. But no theory of \u201cactive\u201d democracy can <u>④ support</u> this distinction: the laws concerning our common life must be made by all those who are taking part in it, and residence is the only convincing test of whether someone is taking part \u2014 as is understood almost <u>⑤ universally</u> when it comes to questions of which citizens should have a voice in local government.","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"어떤 '능동적' 민주주의 이론도 이 구별을 <b>용인할(countenance)</b> 수 없다. support(지지하다)는 countenance(용인하다)와 반대 방향의 뉘앙스로, 원문에서 '용인할 수 없다'는 부정적 맥락에 support는 부적절합니다.","analysis":"✅ ① compatible(양립 가능한): 원문과 일치\n✅ ② abandoned(폐기된): 원문과 일치\n✅ ③ exclusionary(배타적인): 원문과 일치\n❌ ④ support(지지하다) → countenance(용인하다): 원문은 can countenance이므로 support로 교체 시 문맥 반전\n✅ ⑤ universally(보편적으로): 원문과 일치","tip":"countenance(용인하다) — no theory can countenance = 어떤 이론도 용인할 수 없다"}},

{"id":4,"type":"문맥상 부적절한 어휘","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["① strange","② meaning","③ identical","④ inclined","⑤ influence"],"passage":"When people are asked what any painting hanging on a gallery wall means, no matter how <u>① strange</u> it might appear, as is the case with most abstract-expressionist paintings, they tend to find <u>② meaning</u> in it because it is located in a gallery. Consider a soda can found thrown away on a city street. If we were to come across this item on the street, we would no doubt view it as a piece of garbage or rubbish. But if we saw the very same object on a pedestal, displayed in an art gallery, signed by some artist, and given a title such as \u201cWaste,\u201d then we would interpret its meaning in a vastly <u>③ identical</u> way. We would, in fact, be <u>④ inclined</u> to interpret it as an artistic form, descrying a throw-away or materialistic society. Clearly, the can\u2019s location on a sidewalk versus its display on a pedestal in an art gallery will <u>⑤ influence</u> how we will interpret it.","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"같은 물체를 갤러리에서 보면 <b>매우 다른(vastly different)</b> 방식으로 해석한다. identical(동일한)은 different(다른)의 반의어로 문맥에 맞지 않습니다.","analysis":"✅ ① strange(이상한): 원문과 일치\n✅ ② meaning(의미): 원문과 일치\n❌ ③ identical(동일한) → different(다른): 반의어 교체\n✅ ④ inclined(~하려는 경향이 있는): 원문과 일치\n✅ ⑤ influence(영향을 미치다): 원문과 일치","tip":"different(다른) ↔ identical(동일한)"}},

{"id":5,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["conceal","reject","permit","prohibit"],"passage":"In the United States, the practice of <u>permitting</u> aliens to vote could be seen as compatible with the idea of an exclusionary citizenship.","stem":"밑줄 친 permitting과 의미가 가장 가까운 것은?","det":{"korean":"외국인이 투표하는 것을 <b>허용하는(permitting)</b> 관행.","analysis":"✅ permit(허용하다) = allow의 동의어\n❌ conceal(숨기다): 무관\n❌ reject(거부하다): 반의어\n❌ prohibit(금지하다): 반의어","tip":"permit = allow = authorize (허용하다)"}},

{"id":6,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["defects","benefits","features","origins"],"passage":"Psychologists have already begun to recognize the <u>flaws</u> of the mind-as-computer metaphor.","stem":"밑줄 친 flaws와 의미가 가장 가까운 것은?","det":{"korean":"마음-컴퓨터 비유의 <b>결함(flaws)</b>을 인식하기 시작했다.","analysis":"✅ defects(결함): flaws의 동의어\n❌ benefits(이점): 반의어\n❌ features(특징): 다른 의미\n❌ origins(기원): 다른 의미","tip":"flaw = defect = shortcoming (결함, 결점)"}},

{"id":7,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["suppress","hinder","diminish","stimulate"],"passage":"we activate our imagination, that uniquely human ability to explore an alternative set of ideas and experiences","stem":"밑줄 친 activate와 의미가 가장 가까운 것은?","det":{"korean":"우리의 상상력을 <b>활성화한다(activate)</b>.","analysis":"✅ stimulate(자극하다, 활성화하다): activate의 동의어\n❌ suppress(억압하다): 반의어\n❌ hinder(방해하다): 반의어\n❌ diminish(줄이다): 반의어","tip":"activate = stimulate = trigger (활성화하다)"}},

{"id":8,"type":"반의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["productive","meaningful","worthless","effective"],"passage":"literature gratifies our imaginative and creative abilities.","stem":"밑줄 친 gratifies와 가장 반대인 의미를 가진 표현과 관련된 것은? 이 글에서 속도가 빈도 없이는 어떤 상태라고 했는가?","det":{"korean":"빈도 없는 속도는 <b>가치 없다(worthless)</b>. gratifies(만족시키다)의 반대 개념.","analysis":"✅ worthless(가치 없는): gratifies(만족시키다)의 반대 의미\n❌ productive(생산적인): 유사 의미\n❌ meaningful(의미 있는): 유사 의미\n❌ effective(효과적인): 유사 의미","tip":"gratify(만족시키다) ↔ worthless(가치 없는)"}},

{"id":9,"type":"반의어 고르기","diff":"어려움","pts":6,"fmt":"mc","ans":1,"ch":["fortunate","unfortunate","uncertain","intentional"],"passage":"Others, such as Jerome Bruner, find that the computer analogy carries with it an <u>unfortunate</u> shift \u201cfrom the construction of meaning to the processing of information.\u201d","stem":"밑줄 친 unfortunate과 의미가 가장 반대인 것은?","det":{"korean":"컴퓨터 비유가 <b>불행한(unfortunate)</b> 전환을 가져온다고 한다.","analysis":"✅ fortunate(다행스러운): unfortunate의 정확한 반의어\n❌ uncertain(불확실한): 다른 의미\n❌ intentional(의도적인): 다른 의미","tip":"unfortunate(불행한) ↔ fortunate(다행스러운)"}},

{"id":10,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["expand","abandon","maintain","create"],"passage":"In the United States, the practice of permitting aliens to vote could be seen as compatible with the idea of an exclusionary citizenship, but that is a hard balance to __________. If the vote, of all rights, is in the hands of noncitizens, why should they not count as citizens, and the entire distinction between resident alien and citizen be abandoned?","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"배타적 시민권의 개념과 양립시키기는 유지하기 어려운 <b>균형(balance to maintain)</b>이다.","analysis":"✅ maintain(유지하다): hard balance to maintain = 유지하기 어려운 균형\n❌ expand(확대하다): balance를 확대한다는 표현 부적절\n❌ abandon(포기하다): 문맥과 반대\n❌ create(만들다): 이미 존재하는 균형","tip":"maintain a balance = 균형을 유지하다"}},

{"id":11,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["rejects","ignores","creates","activates"],"passage":"It is our imagination, the complex interweaving of perception and memory that literature __________, releasing a latent creativity that pleases. The writer may provide the blueprint, but the reader builds literature\u2019s many rooms.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"문학이 상상력을 <b>활성화하여(activates)</b> 잠재된 창의성을 해방시킨다.","analysis":"✅ activates(활성화하다): 문학이 상상력과 지각/기억의 복합체를 활성화\n❌ rejects(거부하다): 문맥과 반대\n❌ ignores(무시하다): 문맥과 반대\n❌ creates(만들다): 상상력을 만드는 것이 아니라 활성화","tip":"activate = 활성화하다, 작동시키다"}},

{"id":12,"type":"빈칸 어휘 완성","diff":"어려움","pts":6,"fmt":"mc","ans":0,"ch":["confusion","clarity","excitement","awareness"],"passage":"Unless you\u2019re comfortable planning your life around a particular scheduled trip, speed is worthless without frequency, so a transit map that screams about speed and whispers about frequency may simply be planting __________.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"속도에 대해 소리치고 빈도에 대해 속삭이는 교통 지도는 단지 <b>혼란(confusion)</b>을 심을 뿐이다.","analysis":"✅ confusion(혼란): planting confusion = 혼란을 심다\n❌ clarity(명확성): 반의어\n❌ excitement(흥분): 문맥과 무관\n❌ awareness(인식): 속삭이는 것과 인식은 연결 부족","tip":"plant confusion = 혼란을 심다(야기하다)"}},

{"id":13,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["기간, 범위","다리","운행 시간대의 범위","지속 시간"],"passage":"But transit has to exist when you need it (<u>span</u>), and it needs to be coming soon (frequency).","stem":"밑줄 친 span이 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"대중교통은 필요할 때 존재해야 하며(<b>운행 시간대의 범위, span</b>), 곧 와야 한다(frequency).","analysis":"✅ 운행 시간대의 범위: 대중교통이 운행하는 시간의 폭\n❌ 기간, 범위: 일반적 의미\n❌ 다리: 건축물\n❌ 지속 시간: duration과 혼동","tip":"span = 운행 시간대의 범위 (transit가 존재하는 시간의 폭)"}},

{"id":14,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["반대하다","~에 대비하여","맞은편에","반대자"],"passage":"<u>As opposed to</u> perception that receives and processes information from the outside world, in imagination, the process is reversed.","stem":"밑줄 친 As opposed to가 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"외부 세계 정보를 받아들이는 지각<b>에 대비하여(as opposed to)</b>, 상상에서는 과정이 역전된다.","analysis":"✅ ~에 대비하여: 대조를 나타내는 전치사구\n❌ 반대하다: 동사적 의미\n❌ 맞은편에: 물리적 위치\n❌ 반대자: 명사","tip":"as opposed to = in contrast to = ~에 대비하여, ~와 대조적으로"}},

{"id":15,"type":"영영풀이 매칭","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["transit","timetable","commute","frequency"],"passage":"","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><b>\"a regular journey between one's home and place of work\"</b>","det":{"korean":"<b>commute(통근)</b>: 집과 직장 사이의 정기적인 이동","analysis":"✅ commute(통근): 집과 직장 간 정기 이동 = 정의와 정확히 일치\n❌ transit(대중교통): 대중교통 수단\n❌ timetable(시간표): 시간 배정표\n❌ frequency(빈도): 횟수","tip":"commute = a regular journey between home and work (통근)"}},

{"id":16,"type":"영영풀이 매칭","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["metaphor","narrative","cognition","analogy"],"passage":"","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><b>\"a comparison between two things that are alike in some way, often used to help explain something or make it easier to understand\"</b>","det":{"korean":"<b>analogy(유추, 비유)</b>: 어떤 점에서 유사한 두 대상 간의 비교로, 설명이나 이해를 돕기 위해 사용됨","analysis":"✅ analogy(유추): 유사점에 기반한 비교 = 정의와 일치\n❌ metaphor(은유): 비유법의 일종이나, 직접적 비교가 아닌 암시적 대체\n❌ narrative(서사): 이야기 구조\n❌ cognition(인지): 사고 과정","tip":"analogy = a comparison based on similarity (유추, 비유)"}},

{"id":17,"type":"어형 변환 (서술형)","diff":"쉬움","pts":4,"fmt":"written","wa":"imagination","accept":["imagination","Imagination"],"ch":null,"passage":"In the escape that reading literature provides through vicarious identification and comparison with other lives, places, and times, we activate our __________ (imagine), that uniquely human ability to explore an alternative set of ideas and experiences.","stem":"주어진 단어를 문맥에 맞게 어형을 변환하여 빈칸에 쓰시오.","det":{"korean":"우리의 <b>상상력(imagination)</b>을 활성화한다.","analysis":"imagine(동사: 상상하다) → imagination(명사: 상상력)\n소유격 our 뒤에 명사가 필요: our _____","tip":"imagine(동) → imagination(명) / imaginative(형) — 동사에서 명사로 변환"}},

{"id":18,"type":"어형 변환 (서술형)","diff":"보통","pts":5,"fmt":"written","wa":"creativity","accept":["creativity","Creativity"],"ch":null,"passage":"It is our imagination, the complex interweaving of perception and memory that literature activates, releasing a latent __________ (creative) that pleases.","stem":"주어진 단어를 문맥에 맞게 어형을 변환하여 빈칸에 쓰시오.","det":{"korean":"잠재된 <b>창의성(creativity)</b>을 해방시킨다.","analysis":"creative(형용사: 창의적인) → creativity(명사: 창의성)\n관사 a + 형용사 latent 뒤에 명사가 필요: a latent _____","tip":"creative(형) → creativity(명) — 형용사에서 명사로 변환"}},

{"id":19,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["speed","accuracy","frequency","distance","schedule"],"passage":"Emphasizing speed over frequency can make sense in contexts where everyone is expected to plan around the timetable, including peak-only commute services and very long trips with low demand. In all other contexts, though, it seems to be a common motorist\u2019s error. Roads are there all the time, so their speed is the most important fact that distinguishes them. But transit is only there if it\u2019s coming soon. If you have a car, you can use a road whenever you want and experience its speed. But transit has to exist when you need it (span), and it needs to be coming soon (frequency). Otherwise, waiting time will wipe out any time savings from a faster service. Unless you\u2019re comfortable planning your life around a particular scheduled trip, speed is worthless without __________, so a transit map that screams about speed and whispers about frequency may simply be planting confusion.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"속도는 <b>빈도(frequency)</b> 없이는 무가치하다.","analysis":"✅ ③ frequency(빈도): 글의 핵심 주장 — speed is worthless without frequency\n❌ ① speed(속도): 속도는 이미 주어진 조건\n❌ ② accuracy(정확성): 문맥과 무관\n❌ ④ distance(거리): 문맥과 무관\n❌ ⑤ schedule(일정): 부분적 관련이나 핵심이 아님","tip":"speed is worthless without frequency — 6강 주제 파악의 핵심 문장"}},

{"id":20,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","ans":1,"ch":["limitations","alternatives","similarities","applications","advantages"],"passage":"The reliance on the computer as a model for the operations of the human mind may well prove to be as limited as an earlier fascination with behaviorism. Psychologists have already begun to recognize the flaws of the mind-as-computer metaphor. Some have turned to cultural anthropology as a way of understanding the factors outside any particular individual\u2019s brain that help the individual make sense out of the world. Others, such as Jerome Bruner, one of the founders of cognitive psychology, find that the computer analogy carries with it an unfortunate shift \u201cfrom the construction of meaning to the processing of information.\u201d Bruner\u2019s reflections on the limits of the machine model lead him back to a humanistic emphasis on narrative and story-telling as essential ingredients in understanding human cognition, a fascinating intellectual journey that reveals both the power and the limits of computers as guides to the way we think. The passage mainly discusses __________ to the computer model of the human mind.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"이 글은 주로 인간 마음의 컴퓨터 모델에 대한 <b>대안적 관점(alternatives)</b>을 논의한다. 정답 PDF: ④","analysis":"✅ ② alternatives(대안): 문화인류학, 서사/스토리텔링 등 대안적 접근\n❌ ① limitations(한계): 부분적이나, 대안 제시가 핵심\n❌ ③ similarities(유사점): 글의 방향과 반대\n❌ ④ applications(응용): 문맥과 무관\n❌ ⑤ advantages(장점): 글의 방향과 반대","tip":"정답 PDF 6강 Ex03 정답: ④ (컴퓨터 모델을 넘어선 인간 인지에 대한 대안적 관점)"}}
];
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};

let S={ans:[],cur:0,ti:null,left:EI.time,start:0};

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name});if(h.length>50)h.length=50;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map(x=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade}</div></div><div class="hi-right"><div class="hi-score">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div><div class="hi-level">${x.level||''}</div></div></div>`).join('');p.style.display='block';}
function getLevel(s){if(s>=95)return{name:'S+',icon:'👑',range:'95~100',msg:'완벽한 어휘력! 최상위권입니다.'};if(s>=85)return{name:'A+',icon:'🌟',range:'85~94',msg:'훌륭한 어휘력! 거의 완벽합니다.'};if(s>=75)return{name:'A',icon:'💎',range:'75~84',msg:'우수한 어휘력! 조금만 더 노력하세요.'};if(s>=65)return{name:'B+',icon:'🔥',range:'65~74',msg:'좋은 수준! 약한 유형을 보완하세요.'};if(s>=50)return{name:'B',icon:'📈',range:'50~64',msg:'기본기는 있어요! 꾸준히 복습하세요.'};if(s>=30)return{name:'C',icon:'💪',range:'30~49',msg:'더 분발해야 해요! 기본 어휘부터 복습!'};return{name:'D',icon:'📖',range:'0~29',msg:'기초부터 차근차근 시작해봅시다!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+s%60+'초';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startExam(){const nm=document.getElementById('inpName').value.trim();if(!nm){toast('이름을 입력해주세요!');return;}S={ans:Array(EI.totalQ).fill(null),cur:0,ti:null,left:EI.time,start:Date.now()};showScreen('examScreen');renderQ();renderDots();startTimer();window.scrollTo(0,0);}

function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;}); el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;}); if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:(d.q.wa||'');const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[ ${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div>${d.q.det?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean||''}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${d.q.det.analysis||''}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip||''}</div>`:''}</div></div>`;}); h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;let txt=`📝 온라인단어 TEST 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 수능특강 영어 · 06강\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
