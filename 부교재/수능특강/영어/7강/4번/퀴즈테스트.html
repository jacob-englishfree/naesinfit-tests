.q-num{width:28px;height:28px;background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.q-type-tag{font-size:11px;font-weight:800;padding:4px 12px;border-radius:14px;}
.tag-combo{background:var(--ol);color:#BF360C;}.tag-wrong{background:var(--rl);color:var(--r);}.tag-blank{background:#E0F7FA;color:#00838F;}.tag-syn{background:var(--bl);color:var(--b);}.tag-ant{background:var(--ol);color:#B45309;}.tag-poly{background:#FCE4EC;color:#C2185B;}.tag-eng{background:#E8F6FF;color:#0277BD;}.tag-morph{background:#FFF3E0;color:#E65100;}.tag-ctx{background:#EDE7F6;color:#5E35B1;}.tag-grammar{background:#E8EAF6;color:#283593;}.tag-vocab{background:#FFF3E0;color:#E65100;}.tag-tf{background:#F3E5F5;color:#7B1FA2;}.tag-content{background:#E0F2F1;color:#00695C;}.tag-written{background:#FBE9E7;color:#BF360C;}.tag-summary{background:#F1F8E9;color:#33691E;}

.q-body{padding:14px 16px;}
.q-passage{background:linear-gradient(135deg,#FFFAF8,#F5F0EB);border-left:3px solid var(--o);padding:12px 14px;margin-bottom:12px;border-radius:0 8px 8px 0;line-height:1.85;text-align:justify;word-break:keep-all;overflow-wrap:break-word;font-size:clamp(13px,3.2vw,15px);}
.q-stem{font-size:13px;font-weight:700;margin-bottom:10px;overflow-wrap:break-word;}
.choices{display:flex;flex-direction:column;gap:4px;}

.choice-btn:hover{border-color:var(--o);}.choice-btn.selected{border-color:var(--o);box-shadow:0 0 0 2px rgba(232,119,46,.12);background:var(--oxxl);}
.c-num{min-width:22px;height:22px;background:#e8e0d8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tm);flex-shrink:0;}.choice-btn.selected .c-num{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;}
.written-input{width:100%;padding:10px 12px;border:1.5px solid #d0c8c2;border-radius:8px;font-size:14px;font-family:inherit;}.written-input:focus{outline:none;border-color:var(--o);}

.r-stats{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:13px;color:var(--tm);flex-wrap:wrap;}.r-stats strong{color:var(--text);font-weight:800;}.stat-item{background:rgba(255,255,255,.6);padding:6px 14px;border-radius:20px;}
.rc{max-width:740px;margin:0 auto;padding:0 20px 50px;}.rs{background:var(--card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);}.rs-title{font-size:17px;font-weight:800;margin-bottom:18px;}
.level-card{text-align:center;padding:30px 20px;}.level-icon{font-size:64px;margin-bottom:8px;animation:floatY 3s ease-in-out infinite;}@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.level-name{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--od),var(--o));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.level-range{font-size:13px;color:var(--tm);margin-top:4px;}
.level-bar{margin-top:16px;height:8px;background:#e8e0d8;border-radius:4px;overflow:hidden;}.level-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--o),var(--ol));transition:width 1.5s ease;}.level-msg{margin-top:12px;font-size:14px;color:var(--tm);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.info-cell{padding:12px;background:var(--oxxl);border-radius:var(--rs);border:1px solid #ddd8d2;}.info-cell .ic-label{font-size:11px;color:var(--tl);font-weight:700;margin-bottom:2px;}.info-cell .ic-value{font-size:15px;font-weight:800;}.info-cell.highlight{background:var(--oxl);}.info-cell.highlight .ic-value{color:var(--o);}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}.type-label{min-width:60px;font-size:12px;font-weight:700;color:var(--tm);text-align:right;}.type-track{flex:1;height:10px;background:#e8e0d8;border-radius:5px;overflow:hidden;}.type-fill{height:100%;border-radius:5px;transition:width 1s ease;}.type-pct{min-width:36px;font-size:12px;font-weight:800;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}.tag-item{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;}.tag-item.good{background:var(--ol);color:var(--o);}.tag-item.weak{background:var(--rl);color:var(--r);}
.plan-card{display:flex;gap:14px;padding:16px;background:var(--oxl);border-radius:var(--rs);}.plan-icon{font-size:32px;flex-shrink:0;}.plan-text h4{font-size:15px;font-weight:800;margin-bottom:4px;}.plan-text p{font-size:13px;color:var(--tm);line-height:1.7;}
.action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.act-btn{padding:14px;border:2px solid #d0c8c2;border-radius:var(--rs);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:4px;}.act-btn:hover{border-color:var(--o);color:var(--o);}.act-btn.primary{background:linear-gradient(135deg,var(--od),var(--o));color:#fff;border-color:transparent;}.act-btn .act-icon{font-size:20px;}.act-btn .act-label{font-size:12px;}
.rev-card{border:1.5px solid #ddd8d2;border-radius:var(--rs);margin-bottom:14px;overflow:hidden;}.rev-header{padding:14px 18px;background:var(--oxxl);display:flex;align-items:center;gap:12px;cursor:pointer;}.rev-header:hover{background:var(--oxl);}.rev-icon{font-size:18px;margin-left:auto;transition:transform .2s;}.rev-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;padding:0 18px;}.rev-body.open{max-height:3000px;padding:20px 18px;}

.expl-box{font-size:12px;line-height:1.75;text-align:justify;padding:14px 16px;background:#FAFAF8;border-radius:var(--rxs);margin-bottom:10px;}.expl-box.ans-b{border-left:3px solid var(--o);}.expl-box.tip-b{border-left:3px solid var(--o);background:var(--oxl);}
@media(max-width:640px){.start-title{font-size:28px;}.r-score{font-size:52px;}.action-grid{grid-template-columns:1fr;}.info-grid{grid-template-columns:1fr;}.q-body{padding:16px;}}

<script>
const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"7강","lesson":"4번","title":"Limited Animation","total":100,"time":1800,"totalQ":20,"histKey":"quizTest_suneung_07_ex4_v1"};

const P_GW=`Limited animation is a process of making animated cartoons that does not follow a \u201crealistic\u201d approach. The short cartoons and feature films of Walt Disney from the 1930s and 1940s are widely acclaimed for depicting animated simulations of reality, with exquisite detail in every frame. However, this style of animation is very time-consuming and expensive. \u201cLimited\u201d animation creates an image that uses abstract art, symbolism, and limited movement to create the same effect, but at a much lower production cost. This style of animation depends more upon suspension of disbelief to tell a story; the story exists more in the viewer\u2019s imagination. It also encourages the animators to indulge in artistic styles that are not necessarily bound to the limits of the real world. The result is a new artistic style that could not have developed if animation was solely devoted to producing simulations of reality. Without limited animation, such ground-breaking films as Yellow Submarine, Chuck Jones\u2019 The Dot and the Line, and many others could never have been produced.`;
const Q=[
{id:1,type:'문장삽입',diff:'어려움',pts:6,fmt:'mc',ans:2,
ch:['①','②','③','④'],
passage:`The economic benefit of culturtainment makes it attractive to politicians and policy makers alike. <b>①</b> A potential increase in inbound visitor numbers coupled with their demand for related goods and services is an incentive for those within governments and authorities to work with cultural groups in order to develop celebrations and commemorations into larger and more high-profile events. <b>②</b> However, such commercialization risks culturtainment becoming homogeneous and losing its original \u2018message\u2019 that could lead to a dilution of audiences. <b>③</b> This is something that planners and stakeholders will need to balance against potential financial gain. <b>④</b> Overall this is a healthy growth sector of the entertainment industry, but one that by its very nature is delicate in the face of exploitation.`,
stem:`다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class="q-given-sentence">This could also lead to smaller non-commercial independent events being set up that would only serve to divide audiences further.</div>`,
det:{korean:`상업화로 인한 동질화와 관객 희석 설명 직후, 소규모 독립 행사가 관객을 더욱 분산시킨다는 문장이 와야 자연스럽다. 그 다음 "This is something"이 이 문제를 받아 균형 필요성을 설명.`,analysis:`✅③: dilution of audiences 후 → 소규모 독립 행사로 인한 추가 분산 → "This is something"으로 연결\n❌①: 아직 상업화 설명 전\n❌②: incentive 설명 중\n❌④: 이미 결론 단계`,tip:`"This could also lead to" - also는 앞의 dilution에 더해 추가 부정적 결과를 연결`}},
{id:2,type:'문장삽입',diff:'쉬움',pts:4,fmt:'mc',ans:2,
ch:['①','②','③','④'],
passage:`Limited animation is a process of making animated cartoons that does not follow a \u201crealistic\u201d approach. <b>①</b> The short cartoons and feature films of Walt Disney from the 1930s and 1940s are widely acclaimed for depicting animated simulations of reality, with exquisite detail in every frame. <b>②</b> However, this style of animation is very time-consuming and expensive. <b>③</b> This style of animation depends more upon suspension of disbelief to tell a story; the story exists more in the viewer\u2019s imagination. <b>④</b> The result is a new artistic style that could not have developed if animation was solely devoted to producing simulations of reality.`,
stem:`다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class="q-given-sentence">\u201cLimited\u201d animation creates an image that uses abstract art, symbolism, and limited movement to create the same effect, but at a much lower production cost.</div>`,
det:{korean:`전통 애니메이션이 비싸고 시간이 많이 걸린다는 문제 제기 후, 리미티드 애니메이션이 더 낮은 비용으로 같은 효과를 낸다는 대안 제시.`,analysis:`✅③: time-consuming and expensive 후 → 리미티드 애니메이션의 대안(낮은 비용) → suspension of disbelief로 연결\n❌①: 아직 전통 애니메이션 소개 전\n❌②: 디즈니 설명 중간\n❌④: 이미 결과 설명 단계`,tip:`However(=전환) → 비싸고 느림 → 대안(낮은 비용) → 특징 설명 순서`}},
{id:3,type:'어순배열',diff:'어려움',pts:6,fmt:'written',wa:'coupled with their demand for related goods and services',
accept:['coupled with their demand for related goods and services'],
passage:`A potential increase in inbound visitor numbers __________________________________________ is an incentive for those within governments and authorities to work with cultural groups.`,
stem:`주어진 단어를 올바른 순서로 배열하시오.<div class="q-given-sentence">their / for / coupled / goods / with / demand / related / and / services</div>`,
det:{korean:`과거분사 coupled with + their demand for related goods and services`,analysis:`coupled with(~와 결합된) + their demand(그들의 수요) + for related goods and services(관련 상품과 서비스에 대한)`,tip:`coupled with = ~와 결합된 / demand for = ~에 대한 수요`}},
{id:4,type:'어순배열',diff:'보통',pts:5,fmt:'written',wa:'no one certain factor that can predict or ensure mastery',
accept:['no one certain factor that can predict or ensure mastery'],
passage:`In other words, there\u2019s __________________________________________ or optimal performance of anything.`,
stem:`주어진 단어를 올바른 순서로 배열하시오.<div class="q-given-sentence">certain / one / or / no / predict / that / can / ensure / factor / mastery</div>`,
det:{korean:`no one certain factor(어떤 한 가지 확실한 요인도 ~없다) + that can predict or ensure mastery(숙련을 예측하거나 보장할 수 있는)`,analysis:`no one certain factor(=어떤 하나의 확실한 요인도 없다) + 관계대명사 that + can predict or ensure + mastery`,tip:`no one certain factor = 어떤 한 가지 확실한 요인도 ~다`}},
{id:5,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`The economic benefit of culturtainment makes it ①<u>attractive</u> to politicians and policy makers alike. A potential increase in inbound visitor numbers ②<u>coupled</u> with their demand for related goods and services is an incentive. However, such commercialization risks culturtainment ③<u>becoming</u> homogeneous. This could also lead to smaller non-commercial independent events ④<u>being set up</u> that would only serve to divide audiences further. Changing political, social and religious landscapes will lead to the emergence of new cultures, and with them new culturtainment ⑤<u>experience</u>.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`원문은 experiences(복수). new cultures와 병렬되어 복수형이 필요.`,analysis:`❌⑤experience → experiences: new cultures(=복수)와 병렬되므로 복수형 필요\n✅①attractive: 보어 적절\n✅②coupled: 과거분사 수식\n✅③becoming: risk + ~ing\n✅④being set up: 수동 분사구문`,tip:`new cultures and new culturtainment experiences — 복수 병렬 구조`}},
{id:6,type:'어법',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`You\u2019ve probably heard that it takes about ten thousand hours of practice ①<u>to become</u> an expert in anything. The research by K. Anders Ericsson on this topic has been ②<u>written</u> about many times. However, recently, a cohort of researchers reexamined the studies and said that the ten-thousand-hour rule was utter nonsense. Specifically, there is nothing particularly ③<u>special</u> about ten thousand hours, and while practice is clearly important ④<u>to boost</u> performance, other factors may play an even more important role. In other words, there\u2019s no one certain factor that can predict or ⑤<u>ensuring</u> mastery or optimal performance of anything.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`predict or ensure에서 or로 병렬되므로 동사원형 ensure가 적절. ensuring은 불가.`,analysis:`❌⑤ensuring → ensure: predict or ensure(병렬 구조에서 동사원형 필요)\n✅①to become: it takes ~ to V\n✅②written: has been + p.p.\n✅③special: 보어 적절\n✅④to boost: important to V`,tip:`A or B 병렬 구조: predict or ensure(동사원형 병렬)`}},
{id:7,type:'어법',diff:'어려움',pts:6,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`In 2012, the Yale School of Architecture held a symposium ①<u>called</u> \u201cIs Drawing Dead?\u201d The bold title reflects a growing sense that the architect\u2019s freehand sketch is being ②<u>displaced</u> by the computer. Thanks to the precision of screen renderings, a designer working at a computer has a tendency ③<u>to lock</u> in on a design at an early stage. He bypasses much of the reflective and exploratory playfulness that ④<u>springs</u> from the uncertainty of sketching. CAD software produces designs that often ⑤<u>lacking</u> the emotional content of a design derived from hand.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`원문은 designs that lack. 관계대명사 that절의 술어동사로 동사원형 lack이 필요.`,analysis:`❌⑤lacking → lack: that절의 술어동사 필요(designs that lack)\n✅①called: 과거분사 수식\n✅②displaced: be + p.p. 수동태\n✅③to lock: tendency to V\n✅④springs: that절 동사`,tip:`관계대명사 that + 동사원형: designs that lack = ~이 부족한 디자인들`}},
{id:8,type:'어휘',diff:'쉬움',pts:4,fmt:'mc',ans:3,
ch:['①','②','③','④','⑤'],
passage:`The economic benefit of culturtainment makes it ①<u>attractive</u> to politicians and policy makers alike. A potential increase in inbound visitor numbers is an ②<u>incentive</u> for those within governments to work with cultural groups. However, such commercialization risks culturtainment becoming ③<u>homogeneous</u> and losing its original \u2018message.\u2019 This could also lead to smaller non-commercial independent events being set up that would only serve to ④<u>unite</u> audiences further. Overall this is a healthy growth sector, but one that is ⑤<u>delicate</u> in the face of exploitation.`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`소규모 독립 행사는 관객을 통합(unite)하는 것이 아니라 분산(divide)시킨다.`,analysis:`❌④unite(통합) → divide(분산): 원문은 관객을 더욱 분산시킨다는 부정적 맥락\n✅①attractive ✅②incentive ✅③homogeneous ✅⑤delicate`,tip:`divide(분산) ↔ unite(통합) — 관객이 더 나뉘어진다는 부정적 문맥`}},
{id:9,type:'어휘',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['①','②','③','④','⑤'],
passage:`In 2012, the Yale School of Architecture held a symposium called \u201cIs Drawing Dead?\u201d The bold title reflects a growing sense that the architect\u2019s freehand sketch is being ①<u>displaced</u> by the computer. The transition from sketchpad to screen entails, many architects believe, a loss of ②<u>creativity</u>. Thanks to the precision of screen renderings, a designer has a tendency to lock in on a design at an early stage. He bypasses much of the reflective and exploratory ③<u>playfulness</u> that springs from the uncertainty of sketching. The designer also tends to emphasize formal experimentation at the expense of ④<u>rigidity</u>. CAD software produces designs that often \u201clack the ⑤<u>emotional</u> content of a design derived from hand.\u201d`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`원문은 expressiveness(표현력). 형식적 실험을 강조하면서 표현력을 희생한다는 맥락에서 rigidity(경직성)는 부적절.`,analysis:`❌④rigidity(경직성) → expressiveness(표현력): at the expense of expressiveness가 원문\n✅①displaced ✅②creativity ✅③playfulness ✅⑤emotional`,tip:`expressiveness(표현력) ↔ rigidity(경직성) — at the expense of = ~을 희생하고`}},
{id:10,type:'내용이해',diff:'보통',pts:5,fmt:'mc',ans:3,
ch:['expansion','celebration','promotion','dilution','innovation'],
passage:`such commercialization risks culturtainment becoming homogeneous and losing its original \u2018message\u2019 that could lead to a __________ of audiences.`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`동질화되고 원래 메시지를 잃으면 관객이 희석(dilution)될 수 있다.`,analysis:`✅④dilution(희석): 동질화 + 메시지 상실 → 관객 분산/감소\n❌①expansion ❌②celebration ❌③promotion ❌⑤innovation`,tip:`dilution of audiences = 관객의 희석/감소`}},
{id:11,type:'내용이해',diff:'어려움',pts:6,fmt:'mc',ans:1,
ch:['creativity','fixation','innovation','flexibility','adaptation'],
passage:`Researchers term this phenomenon \u201cpremature __________\u201d and trace its cause to \u201cthe disincentive for design changes once a large amount of detail and interconnectedness is built too quickly into a CAD model.\u201d`,
stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`초기 단계에서 디자인에 고착되는 현상 = premature fixation(조기 고착).`,analysis:`✅②fixation(고착): 조기 고착 현상\n❌①creativity: 반대\n❌③innovation: 반대\n❌④flexibility: 반대\n❌⑤adaptation: 무관`,tip:`premature fixation = 조기 고착 — CAD의 세부사항이 빠르게 구축되어 변경 의욕 사라짐`}},
{id:12,type:'내용이해',diff:'보통',pts:5,fmt:'mc',ans:0,
ch:['suspension','simulation','limitation','exploration','integration'],
passage:`This style of animation depends more upon __________ of disbelief to tell a story; the story exists more in the viewer\u2019s imagination.`,
stem:`다음 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`이 애니메이션 스타일은 이야기를 전달하기 위해 불신의 유예(suspension of disbelief)에 더 의존.`,analysis:`✅①suspension: suspension of disbelief = 불신의 유예\n❌②simulation: 오히려 반대 개념\n❌③limitation: 문맥 부적합\n❌④exploration: 문맥 부적합`,tip:`suspension of disbelief(불신의 유예) — 허구를 사실로 받아들이는 관객의 태도`}},
{id:13,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'exploitation',
accept:['exploitation','Exploitation'],
passage:`Overall this is a healthy growth sector of the entertainment industry, but one that by its very nature is delicate in the face of __________ (exploit).`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`exploit(동사) → exploitation(명사). in the face of + 명사.`,analysis:`exploit → exploitation: 동사 → 명사 변환\nin the face of + 명사 구조`,tip:`exploit(동) → exploitation(명): -ation 명사화`}},
{id:14,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'expressiveness',
accept:['expressiveness','Expressiveness'],
passage:`The designer at the computer also tends to emphasize formal experimentation at the expense of __________ (expressive).`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`expressive(형용사) → expressiveness(명사). at the expense of + 명사.`,analysis:`expressive → expressiveness: 형용사 → 명사 변환\nat the expense of + 명사 구조`,tip:`expressive(형) → expressiveness(명): -ness 명사화`}},
{id:15,type:'서술형',diff:'어려움',pts:6,fmt:'written',wa:'homogeneous',
accept:['homogeneous','Homogeneous'],
passage:P_GW,
stem:`다음 글에서 상업화로 인해 컬처테인먼트가 될 위험이 있다고 한 것을 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`commercialization risks culturtainment becoming homogeneous(동질적인).`,analysis:`homogeneous = 동질적인, 획일적인\n"becoming homogeneous" = 동질화되는`,tip:`homogeneous = 동종의, 획일적인`}},
{id:16,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'fixation',
accept:['fixation','Fixation'],
passage:P_EX03,
stem:`다음 글에서 연구자들이 디자이너가 초기에 디자인에 고착되는 현상을 부르는 용어의 핵심 단어를 본문에서 <b>1단어</b>로 찾아 쓰시오.`,
det:{korean:`premature fixation에서 핵심 단어 = fixation(고착).`,analysis:`Researchers term this phenomenon \u201cpremature fixation\u201d\n핵심 단어 = fixation`,tip:`premature fixation = 조기 고착 / fixation = 고착, 집착`}},
{id:17,type:'내용이해',diff:'쉬움',pts:4,fmt:'mc',ans:2,
ch:['상업화가 컬처테인먼트의 문화적 다양성을 증가시킨다.','소규모 독립 행사는 관객을 통합하는 역할을 한다.','정치적, 사회적 변화는 새로운 문화의 출현을 이끌 것이다.','컬처테인먼트는 착취에 강한 산업 영역이다.','엔터테인먼트 산업은 착취에 면역이 되어 있다.'],
passage:P_GW,
stem:`다음 글의 내용과 일치하는 것은?`,
det:{korean:`"Changing political, social and religious landscapes will lead to the emergence of new cultures" → 일치`,analysis:`✅③: 원문과 정확히 일치\n❌①: 동질화 위험이지 다양성 증가 아님\n❌②: 통합이 아니라 분산(divide)\n❌④: delicate(취약)이지 강함 아님`,tip:`내용 일치 문제: 선택지를 하나씩 본문과 대조`}},
{id:18,type:'내용이해',diff:'보통',pts:5,fmt:'mc',ans:2,
ch:['미국 음료회사는 소련 국민의 갈증을 해소하기 위해 거래했다.','소련 정부 관리는 그 제품을 유용한 음료로 인정했다.','미국 협상가들은 산업 발전 기여를 근거로 프로젝트를 정당화했다.','음료회사는 소련의 이데올로기를 변화시키려 했다.','현지 노동자 교육은 프로젝트에 포함되지 않았다.'],
passage:P_EX02,
stem:`다음 글의 내용과 일치하는 것은?`,
det:{korean:`"the U.S. negotiators justified the project on the grounds that it would contribute to the country\u2019s industrial development" → 일치`,analysis:`✅③: 원문과 정확히 일치\n❌①: not on the basis that the drink would quench thirst\n❌②: dismissed as \u201cuseless drink\u201d\n❌④: 이데올로기 변화 시도 아님`,tip:`on the grounds that = ~라는 근거로`}},

det:{korean:`원문: "the ten-thousand-hour rule was utter nonsense" → 과학적으로 유효하다고 확인된 것이 아님.`,analysis:`❌False: utter nonsense(완전한 헛소리) ≠ scientifically valid(과학적으로 유효)`,tip:`utter nonsense = 완전한 헛소리 → 법칙이 부정됨`}},

function getWeakTypes(){const r=grade();const tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});return Object.entries(tm).filter(([,v])=>v.ok<v.total).map(([k])=>k);}
function getTestName(){const t=document.title;if(t.includes('단어'))return '단어테스트';if(t.includes('워크북'))return '워크북테스트';if(t.includes('퀴즈'))return '퀴즈(예상문제)테스트';return 'TEST';}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80,tn=getTestName(),wk=getWeakTypes(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});let txt=`📝 내신핏 ${tn} 결과\n${EI.subject} · ${EI.pub}\n${nm}${sc?' · '+sc:''} · ${gr}\n${new Date().toLocaleDateString('ko-KR')}\n\n${lv.icon} ${lv.name} · ${r.score}/${EI.total}점 (${pct}%)\n${pass?'🎉 통과!':'📚 미통과'} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}\n⏱️ ${fmtTime(elapsed)}`;if(wk.length){txt+=`\n\n🔍 내신핏 약점 진단`;wk.forEach(w=>{const d=tm[w];txt+=`\n• ${w.replace(/\(.+?\)/g,'').trim()} ${d.ok}/${d.total} → ${getTypeAdvice(w)}`;});}txt+=`\n\n📊 내신핏 | 내신 영어 완벽 대비`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function shareImage(){const tn=getTestName(),wk=getWeakTypes(),r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),tm={};r.details.forEach(d=>{const t=d.q.type;if(!tm[t])tm[t]={total:0,ok:0};tm[t].total++;if(d.ok)tm[t].ok++;});const pc=pass?'#16A34A':'#D63B3B';let card=`<div style="width:400px;font-family:-apple-system,sans-serif;background:#fff;border-radius:16px;overflow:hidden">`;card+=`<div style="background:linear-gradient(135deg,${pass?'#E8F5E9,#C8E6C9':'#FFF0F0,#FFEAEA'});padding:28px 24px;text-align:center"><div style="font-size:12px;font-weight:800;color:${pc};margin-bottom:4px">내신핏 ${tn}</div><div style="font-size:13px;color:#666;margin-bottom:16px">${EI.subject} · ${EI.pub}</div><div style="font-size:56px;font-weight:900;color:#1A1A2E">${r.score}<span style="font-size:20px;color:#aaa">/${EI.total}</span></div><div style="margin-top:8px"><span style="display:inline-block;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:800;background:${pc};color:#fff">${lv.icon} ${lv.name} · ${pass?'통과':'미통과'}</span></div><div style="margin-top:12px;font-size:12px;color:#888">👤 ${nm} · ✅${r.correct} ❌${r.wrong} ⬜${r.unanswered}</div></div>`;if(wk.length){card+=`<div style="padding:16px 20px;border-top:1px solid #eee"><div style="font-size:13px;font-weight:800;margin-bottom:10px">🔍 내신핏 약점 진단</div>`;Object.entries(tm).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p===100?'#16A34A':p>=50?'#F59E0B':'#D63B3B';card+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${type.replace(/\(.+?\)/g,'').trim()}</span><span style="font-weight:800;color:${c}">${d.ok}/${d.total}</span></div><div style="height:6px;background:#eee;border-radius:3px"><div style="height:100%;width:${p}%;background:${c};border-radius:3px"></div></div></div>`;});card+=`</div>`;}card+=`<div style="padding:12px 20px;background:#f8f8f8;text-align:center;font-size:11px;color:#999">📊 <b style="color:#333">내신핏</b> | 내신 영어 완벽 대비</div></div>`;const wrap=document.createElement('div');wrap.style.cssText='position:fixed;left:-9999px;top:0;';wrap.innerHTML=card;document.body.appendChild(wrap);html2canvas(wrap.firstChild,{scale:2,backgroundColor:null,useCORS:true}).then(canvas=>{document.body.removeChild(wrap);canvas.toBlob(blob=>{if(navigator.share&&blob){const file=new File([blob],'내신핏_'+tn+'_결과.png',{type:'image/png'});navigator.share({files:[file],title:'내신핏 '+tn+' 결과'}).catch(()=>{});}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='내신핏_'+tn+'_결과.png';a.click();}toast('📸 결과 이미지가 저장되었습니다!');});}).catch(()=>toast('이미지 생성 실패'));}
function reviewHistory(idx){const h=getHistory();const rec=h[idx];if(!rec||!rec.answers)return toast('이전 버전 기록은 해설을 볼 수 없습니다.');S.ans=rec.answers;S.start=Date.now()-rec.elapsed*1000;document.getElementById('inpName').value=rec.name||'';document.getElementById('inpSchool').value=rec.school||'';document.getElementById('inpGrade').value=rec.grade||'고1';const r=grade();renderResults(r,rec.elapsed);showScreen('resultScreen');window.scrollTo(0,0);}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
</body>
</html>
