const EI={"subject":"2027학년도 EBS수능특강 영어","pub":"07강","lesson":"제목 파악","title":"Title Identification","total":100,"time":1200,"totalQ":20,"histKey":"wordTest_suneung_07_v1"};

const P_GW=`The economic benefit of culturtainment makes it attractive to politicians and policy makers alike. A potential increase in inbound visitor numbers coupled with their demand for related goods and services (travel, accommodation, retail) is an incentive for those within governments and authorities to work with cultural groups in order to develop celebrations and commemorations into larger and more high-profile events. However, such commercialization risks culturtainment becoming homogeneous and losing its original \u2018message\u2019 that could lead to a dilution of audiences. This could also lead to smaller non-commercial independent events being set up that would only serve to divide audiences further. This is something that planners and stakeholders will need to balance against potential financial gain. Changing political, social and religious landscapes will lead to the emergence of new cultures, and with them new culturtainment experiences. Overall this is a healthy growth sector of the entertainment industry, but one that by its very nature is delicate in the face of exploitation.`;

const P_EX01=`You\u2019ve probably heard that it takes about ten thousand hours of practice to become an expert in anything \u2014 a musical instrument, a sport, chess, cooking, or a foreign language. The research by K. Anders Ericsson on this topic has been written about many times, and it was made even more famous when Malcolm Gladwell described it in his bestselling book Outliers. However, recently, a cohort of researchers reexamined the studies and research behind the 10K figure and said, quite dramatically, that the ten-thousand-hour rule was utter nonsense. Specifically, there is nothing particularly special about ten thousand hours, and while practice is clearly important to boost performance, other factors may play an even more important role. What are those other factors that get us to expert levels of performance? Pure innate talent? Intelligence? Luck of the draw? Perseverance? Hard work? Yes, it\u2019s all of that\u2026 and more. Age, experience, and environment all play a role. In other words, there\u2019s no one certain factor that can predict or ensure mastery or optimal performance of anything.`;

const P_EX02=`In the old Soviet Union, a famous U.S. beverage company wanted to set up a bottling plant and distribution network. The prevailing ideology in the old Soviet Union at the time stressed the importance of the group over the individual and the need to develop industrial capacity at the expense of consumer goods. Soft drinks hardly seemed to fit the country\u2019s ideological priorities. Indeed, one government official dismissed the product as a \u201cuseless drink.\u201d Eventually, the two sides struck a deal, but not on the basis that the drink would quench the local population\u2019s thirst. Instead, the U.S. negotiators justified the project on the grounds that it would contribute to the country\u2019s industrial development. They restructured the project to include a heavy training component for local workers and managers, as well as a farm that would grow certain of the drink\u2019s ingredients. In addition, the company promised to make efforts to persuade other American companies to consider investments in the country.`;

const P_EX03=`In 2012, the Yale School of Architecture held a symposium called \u201cIs Drawing Dead?\u201d The bold title reflects a growing sense that the architect\u2019s freehand sketch is being displaced by the computer. The transition from sketchpad to screen entails, many architects believe, a loss of creativity, of adventurousness. Thanks to the precision and apparent completeness of screen renderings, a designer working at a computer has a tendency to lock in, visually and cognitively, on a design at an early stage. He bypasses much of the reflective and exploratory playfulness that springs from the uncertainty and ambiguity of sketching. Researchers term this phenomenon \u201cpremature fixation\u201d and trace its cause to \u201cthe disincentive for design changes once a large amount of detail and interconnectedness is built too quickly into a CAD (Computer-Aided Design) model.\u201d The designer at the computer also tends to emphasize formal experimentation at the expense of expressiveness. By weakening an architect\u2019s \u201cpersonal, emotional connection with the work,\u201d a renowned American architect and designer Michael Graves argues, CAD software produces designs that, \u201cwhile complex and interesting in their own way,\u201d often \u201clack the emotional content of a design derived from hand.\u201d`;

const P_EX04=`Limited animation is a process of making animated cartoons that does not follow a \u201crealistic\u201d approach. The short cartoons and feature films of Walt Disney from the 1930s and 1940s are widely acclaimed for depicting animated simulations of reality, with exquisite detail in every frame. However, this style of animation is very time-consuming and expensive. \u201cLimited\u201d animation creates an image that uses abstract art, symbolism, and limited movement to create the same effect, but at a much lower production cost. This style of animation depends more upon suspension of disbelief to tell a story; the story exists more in the viewer\u2019s imagination. It also encourages the animators to indulge in artistic styles that are not necessarily bound to the limits of the real world. The result is a new artistic style that could not have developed if animation was solely devoted to producing simulations of reality. Without limited animation, such ground-breaking films as Yellow Submarine, Chuck Jones\u2019 The Dot and the Line, and many others could never have been produced.`;

const Q=[
{"id":1,"type":"(A)(B)(C) 조합형","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["homogeneous — dilution — balance","diverse — dilution — balance","homogeneous — expansion — balance","homogeneous — dilution — ignore","diverse — expansion — ignore"],"passage":"However, such commercialization risks culturtainment becoming <b>(A)</b> and losing its original \u2018message\u2019 that could lead to a <b>(B)</b> of audiences. This is something that planners and stakeholders will need to <b>(C)</b> against potential financial gain.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"상업화는 컬처테인먼트가 <b>동질적(homogeneous)</b>이 되어 관객의 <b>희석(dilution)</b>을 초래할 위험이 있으며, 이해관계자들은 잠재적 이익에 대해 <b>균형을 맞춰야(balance)</b> 합니다.","analysis":"✅ ① homogeneous — dilution — balance: 원문과 일치\n❌ ② diverse(다양한)는 homogeneous(동질적인)의 반의어\n❌ ③ expansion(확장)은 dilution(희석)과 반대\n❌ ④ ignore(무시)는 balance(균형)와 반대\n❌ ⑤ 세 단어 모두 원문과 불일치","tip":"homogeneous(동질적인), dilution(희석), balance(균형을 맞추다)"}},

{"id":2,"type":"(A)(B)(C) 조합형","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["justified — restructured — persuade","criticized — restructured — persuade","justified — simplified — persuade","justified — restructured — discourage","criticized — simplified — discourage"],"passage":"Instead, the U.S. negotiators <b>(A)</b> the project on the grounds that it would contribute to the country\u2019s industrial development. They <b>(B)</b> the project to include a heavy training component for local workers and managers. In addition, the company promised to make efforts to <b>(C)</b> other American companies to consider investments in the country.","stem":"다음 글의 (A), (B), (C)에 들어갈 말로 가장 적절한 것끼리 짝지은 것은?","det":{"korean":"미국 협상가들은 프로젝트를 <b>정당화했고(justified)</b>, 프로젝트를 <b>재구성하여(restructured)</b> 교육을 포함시켰고, 다른 미국 회사들을 <b>설득하겠다고(persuade)</b> 약속했습니다.","analysis":"✅ ① justified — restructured — persuade: 원문과 일치\n❌ ② criticized(비판)는 justified(정당화)의 반의어\n❌ ③ simplified(단순화)는 restructured(재구성)와 다름\n❌ ④ discourage(단념시키다)는 persuade(설득하다)의 반의어\n❌ ⑤ 세 단어 모두 원문과 불일치","tip":"justified(정당화하다), restructured(재구성하다), persuade(설득하다)"}},

{"id":3,"type":"문맥상 부적절한 어휘","diff":"쉬움","pts":4,"fmt":"mc","ans":4,"ch":["① attractive","② incentive","③ homogeneous","④ strengthen","⑤ delicate"],"passage":"The economic benefit of culturtainment makes it <u>① attractive</u> to politicians and policy makers alike. A potential increase in inbound visitor numbers coupled with their demand for related goods and services is an <u>② incentive</u> for those within governments and authorities to work with cultural groups. However, such commercialization risks culturtainment becoming <u>③ homogeneous</u> and losing its original \u2018message.\u2019 This could also lead to smaller non-commercial independent events being set up that would only serve to <u>④ strengthen</u> audiences further. Overall this is a healthy growth sector of the entertainment industry, but one that by its very nature is <u>⑤ delicate</u> in the face of exploitation.","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"소규모 독립 행사가 생겨나면 관객을 더 <b>분산시킬(divide)</b> 뿐입니다. strengthen(강화하다)은 divide(분산시키다)와 반대입니다.","analysis":"✅ ① attractive(매력적인): 정치인에게 매력적이라는 문맥에 적절\n✅ ② incentive(장려책): 정부 기관의 동기부여로 적절\n✅ ③ homogeneous(동질적인): 상업화의 위험 표현으로 적절\n❌ ④ strengthen(강화하다) → divide(분산시키다): 관객을 나누는 부정적 결과\n✅ ⑤ delicate(취약한): 착취에 취약하다는 맥락에 적절","tip":"divide(분산시키다) ↔ strengthen(강화하다)"}},

{"id":4,"type":"문맥상 부적절한 어휘","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["① displaced","② precision","③ uncertainty","④ enhance","⑤ emotional"],"passage":"The bold title reflects a growing sense that the architect\u2019s freehand sketch is being <u>① displaced</u> by the computer. Thanks to the <u>② precision</u> and apparent completeness of screen renderings, a designer has a tendency to lock in on a design at an early stage. He bypasses much of the reflective and exploratory playfulness that springs from the <u>③ uncertainty</u> of sketching. The designer at the computer also tends to emphasize formal experimentation at the expense of expressiveness. By weakening an architect\u2019s \u201cpersonal, <u>④ enhance</u> connection with the work,\u201d CAD software produces designs that often \u201clack the <u>⑤ emotional</u> content of a design derived from hand.\u201d","stem":"밑줄 친 ①~⑤ 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?","det":{"korean":"원문은 \u201cpersonal, <b>emotional</b> connection\u201d입니다. enhance(향상시키다)는 형용사가 아닌 동사이므로 emotional(감정적인)이 와야 합니다.","analysis":"✅ ① displaced(대체된): 스케치가 컴퓨터에 의해 대체되는 맥락에 적절\n✅ ② precision(정밀성): 화면 렌더링의 정밀성으로 적절\n✅ ③ uncertainty(불확실성): 스케치의 불확실성으로 적절\n❌ ④ enhance(향상시키다) → emotional(감정적인): 형용사 자리에 동사 사용 불가\n✅ ⑤ emotional(감정적인): 디자인의 감정적 내용으로 적절","tip":"emotional(감정적인) — personal, emotional connection이 원문의 표현"}},

{"id":5,"type":"동의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":2,"ch":["diminished","criticized","praised","ignored","suspended"],"passage":"The short cartoons and feature films of Walt Disney from the 1930s and 1940s are widely <u>acclaimed</u> for depicting animated simulations of reality.","stem":"밑줄 친 acclaimed와 의미가 가장 가까운 것은?","det":{"korean":"월트 디즈니의 만화영화들이 널리 <b>찬사를 받는(acclaimed)</b>.","analysis":"✅ praised(찬사받은): acclaimed의 동의어\n❌ diminished(줄어든): 무관\n❌ criticized(비판받은): 반의어\n❌ ignored(무시된): 반의어","tip":"acclaimed = praised = celebrated (찬사받는, 호평받는)"}},

{"id":6,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["hindered","promoted","restricted","discouraged","abandoned"],"passage":"other factors may play an even more important role. What are those other factors that get us to expert levels of performance? Pure innate talent? Intelligence? Luck of the draw? Perseverance? Hard work? Yes, it\u2019s all of that\u2026 and more. Age, experience, and environment all play a role. In other words, there\u2019s no one certain factor that can predict or ensure mastery or optimal performance of anything. while practice is clearly important to <u>boost</u> performance","stem":"밑줄 친 boost와 의미가 가장 가까운 것은?","det":{"korean":"연습이 성과를 <b>향상시키는(boost)</b> 데 중요하다.","analysis":"✅ promoted(촉진한): boost의 동의어, 향상시키다\n❌ hindered(방해한): boost의 반의어\n❌ restricted(제한한): boost와 반대\n❌ discouraged(저하시킨): boost와 반대","tip":"boost = promote = enhance (향상시키다, 촉진하다)"}},

{"id":7,"type":"동의어 고르기","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["supported","approved","promoted","rejected","enhanced"],"passage":"Indeed, one government official <u>dismissed</u> the product as a \u201cuseless drink.\u201d","stem":"밑줄 친 dismissed와 의미가 가장 가까운 것은?","det":{"korean":"한 정부 관리가 그 제품을 \u201c쓸모없는 음료\u201d라고 <b>일축했다(dismissed)</b>.","analysis":"✅ rejected(거부한): dismissed의 동의어, 일축하다\n❌ supported(지지한): 반의어\n❌ approved(승인한): 반의어\n❌ promoted(홍보한): 반의어","tip":"dismissed = rejected = turned down (일축하다, 거부하다)"}},

{"id":8,"type":"반의어 고르기","diff":"쉬움","pts":4,"fmt":"mc","ans":0,"ch":["cheap","abstract","limited","acclaimed","renowned"],"passage":"However, this style of animation is very time-consuming and <u>expensive</u>.","stem":"밑줄 친 expensive와 의미가 가장 반대인 것은?","det":{"korean":"이 스타일의 애니메이션은 매우 시간이 많이 걸리고 <b>비싼(expensive)</b>.","analysis":"✅ cheap(싼): expensive의 정확한 반의어\n❌ abstract(추상적인): 무관\n❌ limited(제한된): 무관\n❌ acclaimed(호평받는): 무관","tip":"expensive(비싼) ↔ cheap(싼), inexpensive(저렴한)"}},

{"id":9,"type":"반의어 고르기","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["premature","apparent","genuine","creative","evident"],"passage":"Thanks to the precision and <u>apparent</u> completeness of screen renderings, a designer working at a computer has a tendency to lock in on a design at an early stage.","stem":"밑줄 친 apparent와 의미가 가장 반대인 것은?","det":{"korean":"화면 렌더링의 <b>겉보기의(apparent)</b> 완전성 덕분에 디자이너는 초기에 고착되는 경향이 있다.","analysis":"✅ genuine(진짜의): apparent(겉보기의)의 반의어\n❌ premature(조기의): 무관\n❌ apparent: 동일 단어\n❌ creative(창의적인): 무관","tip":"apparent(겉보기의, 외견상의) ↔ genuine(진짜의, 실제의)"}},

{"id":10,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["preservation","celebration","commercialization","simplification","standardization"],"passage":"However, such __________ risks culturtainment becoming homogeneous and losing its original \u2018message\u2019 that could lead to a dilution of audiences.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"이러한 <b>상업화(commercialization)</b>는 컬처테인먼트를 동질화하고 원래 메시지를 잃게 할 위험이 있다.","analysis":"✅ commercialization(상업화): 축제의 상업적 개발이 위험을 초래\n❌ preservation(보존): 동질화 위험과 무관\n❌ celebration(축하): 문맥 부적합\n❌ simplification(단순화): 상업화와 다른 개념","tip":"commercialization(상업화) — 문화 행사를 상업적으로 개발하는 것"}},

{"id":11,"type":"빈칸 어휘 완성","diff":"보통","pts":5,"fmt":"mc","ans":3,"ch":["practice","luck","talent","mastery","education"],"passage":"In other words, there\u2019s no one certain factor that can predict or ensure __________ or optimal performance of anything.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"어떤 한 가지 확실한 요인도 <b>숙련(mastery)</b>이나 최적의 성과를 예측하거나 보장할 수 없다.","analysis":"✅ mastery(숙련): 최적 성과와 병렬되는 핵심 단어\n❌ practice(연습): 요인 중 하나일 뿐\n❌ luck(운): 요인 중 하나일 뿐\n❌ talent(재능): 요인 중 하나일 뿐","tip":"mastery(숙련, 완벽한 능력) = the highest level of skill"}},

{"id":12,"type":"빈칸 어휘 완성","diff":"어려움","pts":6,"fmt":"mc","ans":0,"ch":["suspension","simulation","limitation","exploration","integration"],"passage":"This style of animation depends more upon __________ of disbelief to tell a story; the story exists more in the viewer\u2019s imagination.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"이 애니메이션 스타일은 이야기를 전달하기 위해 <b>불신의 유예(suspension of disbelief)</b>에 더 의존한다.","analysis":"✅ suspension(유예): suspension of disbelief = 불신의 유예\n❌ simulation(시뮬레이션): 오히려 반대 개념\n❌ limitation(제한): 문맥 부적합\n❌ exploration(탐구): 문맥 부적합","tip":"suspension of disbelief(불신의 유예) — 허구를 사실로 받아들이는 관객의 태도"}},

{"id":13,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":2,"ch":["치다, 때리다","파업하다","맺다, 체결하다","인상을 주다","발견하다"],"passage":"Eventually, the two sides <u>struck</u> a deal, but not on the basis that the drink would quench the local population\u2019s thirst.","stem":"밑줄 친 struck이 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"결국 양측은 거래를 <b>체결했다(struck a deal)</b>.","analysis":"✅ 맺다, 체결하다: strike a deal = 거래를 성사시키다\n❌ 치다, 때리다: 물리적 타격\n❌ 파업하다: strike(파업)의 의미\n❌ 인상을 주다: strike someone as의 의미","tip":"strike a deal(거래를 체결하다) = reach an agreement"}},

{"id":14,"type":"다의어 문맥적 의미","diff":"보통","pts":5,"fmt":"mc","ans":0,"ch":["근거, 이유","땅, 지면","운동장","배경","기초, 토대"],"passage":"the U.S. negotiators justified the project on the <u>grounds</u> that it would contribute to the country\u2019s industrial development.","stem":"밑줄 친 grounds가 글에서 의미하는 것으로 가장 적절한 것은?","det":{"korean":"미국 협상가들은 산업 발전에 기여할 것이라는 <b>근거(grounds)</b>로 프로젝트를 정당화했다.","analysis":"✅ 근거, 이유: on the grounds that = ~라는 근거로\n❌ 땅, 지면: 물리적 장소\n❌ 운동장: 스포츠 시설\n❌ 배경: 다른 맥락","tip":"on the grounds that(~라는 근거로) = for the reason that"}},

{"id":15,"type":"영영풀이 매칭","diff":"어려움","pts":6,"fmt":"mc","ans":2,"ch":["emergence","incentive","exploitation","dilution","demonstration"],"passage":"","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><b>\"the act of using someone or something unfairly for one's own benefit\"</b>","det":{"korean":"<b>exploitation(착취)</b>: 자신의 이익을 위해 누군가나 무언가를 불공정하게 이용하는 행위","analysis":"✅ exploitation(착취): 불공정한 이용 = 정의와 정확히 일치\n❌ emergence(출현): 새로 나타남\n❌ incentive(장려책): 동기부여\n❌ dilution(희석): 묽게 함","tip":"exploitation = unfair use for one's own benefit (착취, 부당 이용)"}},

{"id":16,"type":"영영풀이 매칭","diff":"보통","pts":5,"fmt":"mc","ans":1,"ch":["cohort","perseverance","intelligence","performance","resilience"],"passage":"","stem":"다음 영영 풀이에 해당하는 단어로 가장 적절한 것은?<br><br><b>\"continued effort and determination despite difficulties or delay in achieving success\"</b>","det":{"korean":"<b>perseverance(인내심)</b>: 어려움이나 성공 지연에도 불구하고 계속하는 노력과 결의","analysis":"✅ perseverance(인내심): 어려움에도 불구한 지속적 노력 = 정의와 정확히 일치\n❌ cohort(집단): 연구 집단\n❌ intelligence(지능): 사고 능력\n❌ performance(성과): 수행 결과","tip":"perseverance = persistence = tenacity (인내, 끈기)"}},

{"id":17,"type":"어형 변환 (서술형)","diff":"쉬움","pts":4,"fmt":"written","wa":"exploitation","accept":["exploitation","Exploitation"],"ch":null,"passage":"Overall this is a healthy growth sector of the entertainment industry, but one that by its very nature is delicate in the face of __________ (exploit).","stem":"주어진 단어를 문맥에 맞게 어형을 변환하여 빈칸에 쓰시오.","det":{"korean":"<b>착취(exploitation)</b>에 직면하여 취약하다.","analysis":"exploit(동사: 착취하다) → exploitation(명사: 착취)\nin the face of + 명사 구조","tip":"exploit(동) → exploitation(명) — 동사에서 명사로 변환"}},

{"id":18,"type":"어형 변환 (서술형)","diff":"보통","pts":5,"fmt":"written","wa":"expressiveness","accept":["expressiveness","Expressiveness"],"ch":null,"passage":"The designer at the computer also tends to emphasize formal experimentation at the expense of __________ (expressive).","stem":"주어진 단어를 문맥에 맞게 어형을 변환하여 빈칸에 쓰시오.","det":{"korean":"표현적인 것의 <b>표현력(expressiveness)</b>을 희생하고 형식적 실험을 강조한다.","analysis":"expressive(형용사: 표현적인) → expressiveness(명사: 표현력)\nat the expense of + 명사 구조","tip":"expressive(형) → expressiveness(명) — 형용사에서 명사로 변환"}},

{"id":19,"type":"빈칸 문맥 완성","diff":"어려움","pts":6,"fmt":"mc","ans":3,"ch":["distribution","ideology","consumption","development","competition"],"passage":"In the old Soviet Union, a famous U.S. beverage company wanted to set up a bottling plant and distribution network. The prevailing ideology stressed the importance of the group over the individual and the need to develop industrial capacity. Soft drinks hardly seemed to fit the country\u2019s ideological priorities. Eventually, the two sides struck a deal, but not on the basis that the drink would quench the local population\u2019s thirst. Instead, the U.S. negotiators justified the project on the grounds that it would contribute to the country\u2019s industrial __________. They restructured the project to include a heavy training component for local workers and managers.","stem":"윗글의 빈칸에 들어갈 말로 가장 적절한 것은?","det":{"korean":"미국 협상가들은 그 나라의 산업 <b>발전(development)</b>에 기여할 것이라는 근거로 프로젝트를 정당화했다.","analysis":"✅ ④ development(발전): industrial development = 산업 발전, 소련의 핵심 관심사\n❌ ① distribution(유통): 이미 bottling plant에서 언급\n❌ ② ideology(이데올로기): 이데올로기에 기여한 것이 아님\n❌ ③ consumption(소비): 소비재에 반대하는 이데올로기\n❌ ⑤ competition(경쟁): 문맥과 무관","tip":"industrial development(산업 발전) — 소련의 이데올로기에 부합하는 논거"}},

];
const typeTag={'(A)(B)(C) 조합형':'tag-combo','문맥상 부적절한 어휘':'tag-wrong','빈칸 어휘 완성':'tag-blank','동의어 고르기':'tag-syn','반의어 고르기':'tag-ant','다의어 문맥적 의미':'tag-poly','영영풀이 매칭':'tag-eng','어형 변환 (서술형)':'tag-morph','빈칸 문맥 완성':'tag-ctx'};

let S={ans:[],cur:0,ti:null,left:EI.time,start:0};

function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]');}catch(e){return[];}}
function saveToHistory(r,elapsed){const h=getHistory();h.unshift({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,total:EI.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,elapsed,date:new Date().toISOString(),level:getLevel(r.score).name});if(h.length>50)h.length=50;localStorage.setItem(EI.histKey,JSON.stringify(h));}
function updateHCount(){const h=getHistory();document.getElementById('hCount').textContent=h.length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length){p.innerHTML='<p style="text-align:center;color:var(--tl);font-size:13px;padding:20px">아직 기록이 없습니다.</p>';p.style.display='block';return;}p.innerHTML=h.map(x=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${x.name||'이름없음'}</div><div class="hi-meta">${new Date(x.date).toLocaleDateString('ko-KR')} · ${x.grade}</div></div><div class="hi-right"><div class="hi-score">${x.score}<span style="font-size:11px;color:var(--tl)">/${x.total}</span></div><div class="hi-level">${x.level||''}</div></div></div>`).join('');p.style.display='block';}
function getLevel(s){if(s>=95)return{name:'S+',icon:'👑',range:'95~100',msg:'완벽한 어휘력! 최상위권입니다.'};if(s>=85)return{name:'A+',icon:'🌟',range:'85~94',msg:'훌륭한 어휘력! 거의 완벽합니다.'};if(s>=75)return{name:'A',icon:'💎',range:'75~84',msg:'우수한 어휘력! 조금만 더 노력하세요.'};if(s>=65)return{name:'B+',icon:'🔥',range:'65~74',msg:'좋은 수준! 약한 유형을 보완하세요.'};if(s>=50)return{name:'B',icon:'📈',range:'50~64',msg:'기본기는 있어요! 꾸준히 복습하세요.'};if(s>=30)return{name:'C',icon:'💪',range:'30~49',msg:'더 분발해야 해요! 기본 어휘부터 복습!'};return{name:'D',icon:'📖',range:'0~29',msg:'기초부터 차근차근 시작해봅시다!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+s%60+'초';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startExam(){const nm=document.getElementById('inpName').value.trim();if(!nm){toast('이름을 입력해주세요!');return;}S={ans:Array(EI.totalQ).fill(null),cur:0,ti:null,left:EI.time,start:Date.now()};showScreen('examScreen');renderQ();renderDots();startTimer();window.scrollTo(0,0);}

function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const mk=q.ch.length===5?'①②③④⑤':'①②③④';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${mk[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;}); el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}
function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--g)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--g)':p>=50?'var(--o)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type.replace(/\(.+?\)/g,'').trim().slice(0,6)}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;}); if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t.slice(0,8)}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t.slice(0,8)}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const mk=d.q.ch&&d.q.ch.length===5?'①②③④⑤':'①②③④';const ua=d.q.fmt==='mc'?(d.ans!==null?mk[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?mk[d.q.ans]:(d.q.wa||'');const open=!d.ok;h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[ ${d.q.type.slice(0,6)}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--gl);color:var(--g)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--gl);color:var(--g)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div>${d.q.det?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${d.q.det.korean||''}</div><div class="expl-tag tip">📋 분석</div><div class="expl-box">${(d.q.det.analysis||'').replace(/\\n/g,'<br>')}</div><div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${d.q.det.tip||''}</div>`:''}</div></div>`;}); h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}
function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;let txt=`📝 온라인단어 TEST 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 수능특강 영어 · 07강\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
updateHCount();
</script>
