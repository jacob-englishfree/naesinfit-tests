const P_GW=`A sport ecosystem exists based on the type and rate of coopetition existing. Coopetition is defined as \u201cthe simultaneous pursuit of cooperation and competition among firms to leverage strategically important resources for superior value creation purposes\u201d. It is a useful way to understand the dynamic nature of sport businesses which need to collaborate for resource efficiency purposes but potentially compete with each other. This special relationship should be managed properly due to trust and confidence issues being paramount. It can be challenging to be collaborative and competitive in sport as they involve different forms of behaviour. This means a careful balancing act may be required in terms of the amount of emphasis placed on each activity. Often sport managers will try to be more competitive due to performance reasons and less collaborative. By necessity they may need to share information but do so in a cautious manner. This means it might be better to have plans in place about how to pursue both simultaneously. This will ensure one is not neglected at the expense of the other.`;

const P_EX01=`There\u2019s a saying that \u201cyou can\u2019t eat information.\u201d That may be so, but the food we eat today is the fruit of thousands of years of increasingly high-quality information \u2014 the knowledge of how to farm \u2014 what seeds, what tools and how to use them, what times of year, what irrigation, what sequence of one crop after another on the same land. What we eat is solar energy, filtered, concentrated, and distilled through the lens of human knowledge. The energy the Earth receives from the sun each year has remained more or less constant through all of human civilization. What\u2019s allowed us to flourish is our increasingly sophisticated knowledge of how to capture an ever-growing but still tiny fraction of that energy in a form that can fuel our bodies. Every step in the advancement of our knowledge has brought with it an increase in the amount of energy we can tap into.`;

const P_EX02=`Increased community engagement by professional journalists, on their own, will not solve the problem of making the news more relevant to everyone because traditional news organizations already have abandoned many communities, leaving behind news deserts. In those places, citizens must take up the responsibility for discovering information, holding the powerful accountable, and telling the news for themselves and their neighbors. The democratization of information \u2014 through the disruptions caused by computers and the internet \u2014 allows citizens to retake control of local news in ways that never have existed before, and it calls them to take greater care in the gathering and dissemination of what they discover or think they know. Journalism, perhaps like never before, belongs to the people rather than to professional journalists, wealthy publishers, or even corporate shareholders. The same technology that has shifted the balance of power toward the people gives them the tools to act as broadcasters and publishers of information essential to their immediate community \u2014 and, more critically, to serve as gatekeepers to information for other people around them.`;

const P_EX03=`It is a myth that all ideas are equally valid, even those with little or no objective proof. The existence of science is the commitment to objective truth. After all, science is true: fire is hot, the wheel is efficient, birds and planes can fly, we\u2019ve landed on a comet and traveled to the Moon, antibiotics treat illness, and immunizations keep us from getting sick. These accomplishments are made possible by objective truths. A plausible theory can, and frequently does, push science forward. However, an intuition must be followed with testing that confirms or disproves its veracity. If a theory is disproved, one should consider it as a reason to reject or alter the hypothesis, not a justification to just keep firmly holding to the hypothesis because you are instinctively wedded to it. Critical thinking is an absolute must, and we must respect evidence. It\u2019s the only reason for anyone to trust anything about reality. Without testing and evidence, intuition is useful, but it is never the ultimate word.`;

const P_EX04=`If you suffer from social angst, awkwardness, or dread, know that this is a perfectly normal response. No matter what it looks like, a lot of people are dealing with internal anxiety in social situations. But it is actually possible to build your social muscle and use it to boost your connections \u2014 and your anxiety is giving you clues to what icebreakers and lifelines other people might be grateful for you to extend. Truly listen to what your anxiety is signaling to you about where you feel uncertain or insecure, and practice empathy by offering a hand to others who might be in the same boat. Remember that flipping anxiety into compassion is something inherent in you \u2014 it is, in fact, what your anxiety was designed to do for you. Together, compassion and empathy can buffer against bad anxiety. You can use your anxiety to be more outward-facing. The outcome? The spread of compassion for your fellow human beings, other species, and the planet!`;

{id:1,type:'문장삽입',diff:'어려움',pts:6,fmt:'mc',ans:2,

passage:`"Where could it be?" Sophie asked herself. It had been more than ten years since she had last visited the area where she had grown up. The village had changed a lot over time. <b>①</b> Uncertain, she awkwardly looked around at her surroundings. She walked the narrow streets of the village, unsure about which way to go. <b>②</b> Suddenly, Sophie saw a familiar sight. "Yes, this must be it," she thought. <b>③</b> Although the colors were now faded, the familiar shapes on the wall were the same ones she had painted with her father as a child. <b>④</b> Sophie nodded, smiled brightly, and walked toward the gate.`,
stem:`다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class="q-given-sentence">In front of her was a wall with flowers painted on it.</div>`,
det:{korean:`"Yes, this must be it"이라고 생각한 직후, 그녀 앞에 꽃이 그려진 벽이 있었다는 문장이 와야 자연스러움. 그 다음 벽의 색이 바랜 것을 설명.`,analysis:`✅③: "this must be it" 직후 → 꽃 벽 발견 → 색이 바랜 설명으로 연결\n❌①: 아직 길을 찾는 중\n❌②: 익숙한 광경을 보기 전\n❌④: 이미 벽 설명 완료 후`,tip:`대명사 "this must be it"이 가리키는 대상이 바로 뒤에 나와야 자연스러움`}},

{id:2,type:'문장삽입',diff:'어려움',pts:6,fmt:'mc',ans:1,
ch:['①','②','③','④'],
passage:`The organ, his most precious possession, was a source of comfort and joy, especially in these uncertain times. <b>①</b> But his peace was interrupted by the distant roar of engines breaking the calm. <b>②</b> Francis' heart raced; it was wartime, and soldiers often took what they wanted. <b>③</b> Whispering urgently to his sister, Ellen, he led her to hide behind a tall tree, its thick trunk shielding them. <b>④</b> Peeking out, Francis stepped outside carefully and looked at the soldiers walking toward their home.`,

det:{korean:`엔진 소리가 평화를 깨뜨린 직후, 군인들이 나타나는 것이 자연스러움. 그 후 Francis의 심장이 빨리 뛰는 것으로 연결.`,analysis:`✅②: 엔진 소리 → 군인 등장 → 심장이 뛰는 반응\n❌①: 아직 평화가 깨지기 전\n❌③: 이미 숨으려고 행동 중\n❌④: 이미 밖으로 나와서 보는 중`,tip:`사건 순서: 엔진 소리 → 군인 등장 → 공포 반응 → 숨기`}},

ch:['①','②','③','④','⑤'],

passage:`Vera ①<u>couldn't</u> wait for her car to get fixed, but that was going to require longer than initially expected. Unfortunately, that meant ②<u>relying</u> on the bus for her commute. It was already past 7 PM when she stepped off the bus, cold and soaked to the bone, ③<u>having left</u> her umbrella at the gym. Her legs moved on their own, and suddenly, the Cups & Blossoms' bell was ④<u>ringing</u> above her head. She was also polite enough not to ask why Vera looked so tired, which was ⑤<u>appreciating</u>.`,
stem:`밑줄 친 ①~⑤ 중 어법상 틀린 것은?`,
det:{korean:`"which was appreciated"에서 주어(it)가 감사히 여겨지는 대상이므로 수동태(was appreciated)가 필요하다.`,analysis:`❌⑤appreciating: which was appreciated → 수동태 필요\n✅①couldn't: 조동사 부정\n✅②relying: mean + ~ing(~을 의미하다)\n✅③having left: 완료 분사구문\n✅④ringing: 진행형(was ringing)`,tip:`which was appreciated = 그것은 감사히 여겨졌다 (수동태)`}},

{id:6,type:'어휘',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`It was the day I had been ①<u>preparing</u> for. I drove for an hour and a half to apply for a visa. That same day, I helped three people who didn't know English by ②<u>translating</u> for the immigration officer. Believing things were going ③<u>smoothly</u>, I made my way to the counter. Unfortunately, the officer, who had smiled when I was helping her, suddenly turned ④<u>serious</u>. I didn't expect to hear her words of ⑤<u>acceptance</u>.`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`빨간 도장, 서류 무시 등 거절 상황이므로 rejection(거절)이 적절. acceptance(수락)는 맥락에 맞지 않음.`,analysis:`❌⑤acceptance(수락): 원문은 rejection(거절). 빨간 도장+서류 무시=거절 상황\n✅①preparing ✅②translating ✅③smoothly ✅④serious`,tip:`rejection(거절) ↔ acceptance(수락)`}},

{id:7,type:'어휘',diff:'보통',pts:5,fmt:'mc',ans:4,
ch:['①','②','③','④','⑤'],
passage:`The group members were all ①<u>experienced</u>, so I couldn't understand why they were climbing so slowly — what I thought was a ②<u>ridiculous</u> pace. And, being the rookie, I wanted to prove myself to the group. Why not show off my ③<u>superior</u> conditioning? In a matter of minutes, I became a basket case, needing ④<u>assistance</u> just to walk. Now all I felt was ⑤<u>reward</u> for becoming a burden to the group.`,
stem:`밑줄 친 ①~⑤ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?`,
det:{korean:`짐이 된 것에 대해 죄책감(guilt)을 느끼는 것이 자연스러움. reward(보상)는 맥락에 맞지 않음.`,analysis:`❌⑤reward(보상): 원문은 guilt(죄책감). 짐이 된 것에 보상을 느끼는 것은 부적절\n✅①experienced ✅②ridiculous ✅③superior ✅④assistance`,tip:`guilt(죄책감) ↔ reward(보상)`}},

{id:8,type:'빈칸추론',diff:'어려움',pts:6,fmt:'mc',ans:2,
ch:['instrument','decoration','possession','weapon','melody'],
passage:`Francis Pohan sat at the organ in his Borneo home, a smile on his face as the hymn he had practiced for weeks flowed smoothly under his fingers. The melody blended with the soft sounds of the jungle, filling him with happiness. The organ, his most precious __________, was a source of comfort and joy, especially in these uncertain times.`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`가장 소중한 소유물(possession). 오르간은 악기이지만 여기서는 "가장 소중한 소유물"로서 위안과 기쁨의 원천으로 표현됨.`,analysis:`✅③possession(소유물): 가장 소중한 소유물\n❌①instrument(악기): 의미는 통하나 precious와의 조합이 부자연스러움\n❌②decoration(장식): 오르간은 장식이 아님\n❌④weapon(무기): 문맥과 무관\n❌⑤melody(멜로디): 오르간 자체가 멜로디는 아님`,tip:`possession = 소유물 / precious possession = 소중한 소유물`}},

{id:9,type:'빈칸추론',diff:'보통',pts:5,fmt:'mc',ans:2,
ch:['vacation','exercise','commute','entertainment','hobby'],
passage:`Vera couldn't wait for her car to get fixed, but that was going to require longer than initially expected. Unfortunately, that meant relying on the bus for her __________.`,
stem:`윗글의 빈칸에 들어갈 말로 가장 적절한 것은?`,
det:{korean:`차가 수리 중이라 버스로 통근(commute)해야 했다.`,analysis:`✅③commute(통근): 차 수리 중 → 버스로 통근\n❌①vacation(휴가): 문맥과 무관\n❌②exercise(운동): 버스를 운동에 이용하지 않음\n❌④entertainment(오락): 문맥과 무관\n❌⑤hobby(취미): 문맥과 무관`,tip:`commute = 통근 / 차가 고장 → 버스로 통근`}},

{id:10,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'Believing',
accept:['Believing','believing'],
passage:`__________ (believe) things were going smoothly, I made my way to the counter.`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`believe → Believing: 분사구문(동시동작/이유), 능동이므로 현재분사. 문장 앞에 위치하므로 대문자 시작.`,analysis:`Believing: 분사구문(능동/동시동작) → 현재분사`,tip:`분사구문: 주어 동일 + 능동 → 현재분사(V-ing)`}},

{id:11,type:'서술형',diff:'보통',pts:5,fmt:'written',wa:'Whispering',
accept:['Whispering','whispering'],
passage:`__________ (whisper) urgently to his sister, Ellen, he led her to hide behind a tall tree`,
stem:`괄호 안의 단어를 어법에 맞게 변형하시오.`,
det:{korean:`whisper → Whispering: 분사구문, 능동/동시동작. 속삭이면서 이끌었다.`,analysis:`Whispering: 분사구문(능동/동시동작) → 현재분사`,tip:`분사구문: 주어 동일 + 능동 → 현재분사(V-ing)`}},

{id:12,type:'서술형',diff:'쉬움',pts:4,fmt:'written',wa:'nausea, headache, and dizziness',

det:{korean:`"because of the nausea, headache, and dizziness" → 메스꺼움, 두통, 어지러움`,analysis:`nausea(메스꺼움), headache(두통), dizziness(어지러움) — 본문에서 직접 확인 가능`,tip:`because of 뒤에 나열된 세 가지 증상을 찾기`}},

{id:13,type:'내용이해',diff:'보통',pts:5,fmt:'mc',ans:0,
ch:['confused → pleased','confident → embarrassed','thrilled → anxious','relieved → nervous','bored → excited'],
passage:P_GW,
stem:`위 글에 드러난 Sophie의 심경 변화로 가장 적절한 것은?`,
det:{korean:`혼란(Uncertain, unsure) → 기쁨(smiled brightly, finally found)`,analysis:`✅①confused → pleased: 혼란(길을 모름) → 기쁨(집을 찾음)\n❌②: 자신감이 아닌 혼란에서 시작\n❌③: 신남이 아닌 혼란\n❌④: 안도가 아닌 혼란\n❌⑤: 지루함이 아님`,tip:`심경 변화: Uncertain/unsure → smiled brightly/finally found`}},

{id:14,type:'내용이해',diff:'쉬움',pts:4,fmt:'mc',ans:2,
ch:['pleased → alarmed','anxious → relieved','confident → regretful','delighted → indifferent','disappointed → satisfied'],
passage:P_EX02,
stem:`위 글에 드러난 화자의 심경 변화로 가장 적절한 것은?`,
det:{korean:`자신감(best shape, prove myself) → 후회(guilt, wished I hadn't pushed)`,analysis:`✅③confident → regretful: 자신감 → 후회\n❌①: 기쁨이 아닌 자신감\n❌②: 불안이 아닌 자신감\n❌④: 기쁨이 아닌 자신감\n❌⑤: 실망이 아닌 자신감`,tip:`심경 변화: best shape/prove myself → guilt/wished I hadn't`}},

{id:15,type:'내용이해',diff:'쉬움',pts:4,fmt:'mc',ans:3,
ch:['ashamed → grateful','indifferent → satisfied','curious → disappointed','exhausted → comforted','encouraged → frustrated'],

stem:`위 글에 드러난 Vera의 심경 변화로 가장 적절한 것은?`,
det:{korean:`지침(cold, soaked, tired) → 위로(warm scent, friendly face, ease the weight)`,analysis:`✅④exhausted → comforted: 지침 → 위로\n❌①: 부끄러움이 아닌 지침\n❌②: 무관심이 아닌 지침\n❌③: 호기심이 아닌 지침\n❌⑤: 격려가 아닌 지침`,tip:`심경 변화: cold/soaked/tired → warm/friendly face/ease the weight`}},

det:{korean:`"the same ones she had painted with her father as a child" → 아버지와 함께 그렸음, 혼자가 아님.`,analysis:`❌False: with her father → 혼자가 아닌 아버지와 함께`,tip:`by herself(혼자) vs. with her father(아버지와 함께)`}},

{id:17,type:'T/F',diff:'보통',pts:5,fmt:'mc',ans:1,
ch:['True','False'],
passage:P_EX01,

det:{korean:`"I helped three people... Two of them were lucky to get their visas." → 3명을 도왔지만 2명만 비자를 받음.`,analysis:`❌False: 3명을 도왔으나 비자를 받은 것은 2명뿐\n"three people get their visas" → 3명 모두가 비자를 받은 것은 아님`,tip:`helped three people ≠ three people got visas / Two of them만 성공`}},

{id:18,type:'T/F',diff:'보통',pts:5,fmt:'mc',ans:1,
ch:['True','False'],
passage:P_EX02,
stem:`"The narrator was the most experienced member of the hiking group." (T/F)`,
det:{korean:`"being the rookie" → 신참이었음. 가장 경험 많은 멤버가 아님.`,analysis:`❌False: the rookie(신참) ≠ the most experienced\n"The group members were all experienced" → 다른 멤버들이 경험이 많음`,tip:`rookie = 신참, 초보자 ↔ most experienced`}},

{id:19,type:'T/F',diff:'어려움',pts:6,fmt:'mc',ans:0,
ch:['True','False'],
passage:P_EX03,

det:{korean:`"he led her to hide behind a tall tree" → soldiers가 집에 도착하기 전에 숨음. "looked at the soldiers walking toward their home" → 아직 걸어오는 중.`,analysis:`✅True: 나무 뒤에 숨은 후 → 군인들이 집을 향해 걸어오는 것을 봄\n시간 순서: 숨기 → 군인들 접근 중`,tip:`walked toward(~를 향해 걸어갔다) = 아직 도착하지 않음`}},

{id:20,type:'T/F',diff:'쉬움',pts:4,fmt:'mc',ans:1,
ch:['True','False'],
passage:P_EX04,
stem:`"Vera left her umbrella at home." (T/F)`,
det:{korean:`"having left her umbrella at the gym" → 집이 아니라 체육관에 두고 옴.`,analysis:`❌False: at the gym ≠ at home\n우산을 집이 아니라 체육관에 두고 옴`,tip:`at home(집) vs. at the gym(체육관) — 장소 정보 정확히 확인`}}
];

let S={cur:0,ans:new Array(EI.totalQ).fill(null),start:null,left:EI.time,ti:null};
function getHistory(){try{return JSON.parse(localStorage.getItem(EI.histKey)||'[]')}catch(e){return[]}}
function saveToHistory(r,elapsed){const h=getHistory();h.push({name:document.getElementById('inpName').value.trim(),school:document.getElementById('inpSchool').value.trim(),grade:document.getElementById('inpGrade').value,score:r.score,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,time:fmtTime(elapsed),date:new Date().toLocaleDateString('ko-KR'),level:getLevel(r.score).name,levelIcon:getLevel(r.score).icon});if(h.length>10)h.splice(0,h.length-10);try{localStorage.setItem(EI.histKey,JSON.stringify(h))}catch(e){}updateHCount();}
function updateHCount(){document.getElementById('hCount').textContent=getHistory().length;}
function toggleHistory(){const p=document.getElementById('historyPanel');if(p.style.display==='block'){p.style.display='none';return;}const h=getHistory();if(!h.length)p.innerHTML='<p style="text-align:center;color:var(--tl);padding:20px;font-size:14px">아직 시험 기록이 없습니다.</p>';else p.innerHTML=h.slice().reverse().map(r=>`<div class="history-item"><div class="hi-left"><div class="hi-name">${r.name}</div><div class="hi-meta">${r.date} · ${r.time} · ${r.grade}</div></div><div class="hi-right"><div class="hi-score">${r.score}점</div><div class="hi-level">${r.levelIcon} ${r.level}</div></div></div>`).join('');p.style.display='block';}
updateHCount();
function getLevel(s){if(s>=95)return{name:'전설',icon:'🐉',range:'95~100',msg:'완벽에 가까운 실력!'};if(s>=90)return{name:'챔피언',icon:'🏆',range:'90~94',msg:'최상위권!'};if(s>=80)return{name:'다이아몬드',icon:'💎',range:'80~89',msg:'통과! 취약 유형만 복습하면 최상위!'};if(s>=70)return{name:'빛나는별',icon:'🌟',range:'70~79',msg:'통과까지 조금만 더!'};if(s>=60)return{name:'별',icon:'⭐',range:'60~69',msg:'기본기 탄탄! 본문 복습 후 재도전!'};if(s>=40)return{name:'나무',icon:'🌲',range:'40~59',msg:'성장 중!'};return{name:'새싹',icon:'🌱',range:'0~39',msg:'단어 암기부터 시작!'};}
function fmtTime(s){return Math.floor(s/60)+'분 '+(s%60)+'초';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startExam(){if(!document.getElementById('inpName').value.trim()){alert('이름을 입력해주세요.');return;}S={cur:0,ans:new Array(EI.totalQ).fill(null),start:Date.now(),left:EI.time,ti:null};showScreen('examScreen');renderQ();renderDots();startTimer();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}

function renderQ(){const el=document.getElementById('examScroll');let h='';Q.forEach((q,i)=>{const tc=typeTag[q.type]||'';h+=`<div class="q-card" id="qc-${i}"><div class="q-header"><div class="q-num">${q.id}</div><span class="q-type-tag ${tc}">${q.type}</span><div class="q-meta"><span class="q-diff">${q.diff}</span><span class="q-pts">${q.pts}점</span></div></div><div class="q-body">`;if(q.passage)h+=`<div class="q-passage">${q.passage}</div>`;h+=`<div class="q-stem">${q.stem}</div>`;if(q.fmt==='mc'){const markers=q.ch.length===5?'①②③④⑤':q.ch.length===4?'①②③④':q.ch.length===3?'①②③':'①②';h+=`<div class="choices">`;q.ch.forEach((c,ci)=>h+=`<button class="choice-btn" data-q="${i}" data-c="${ci}" onclick="sel(${i},${ci})"><span class="c-num">${markers[ci]}</span><span>${c}</span></button>`);h+=`</div>`;}if(q.fmt==='written')h+=`<textarea class="written-input" id="w-${i}" placeholder="답안을 입력하세요..." oninput="sw(${i})"></textarea>`;h+=`</div></div>`;});el.innerHTML=h;}
function renderDots(){document.getElementById('navDots').innerHTML=Array.from({length:EI.totalQ},(_,i)=>`<button class="nav-dot" onclick="scrollToQ(${i})">${i+1}</button>`).join('');upDots();}
function upDots(){document.querySelectorAll('.nav-dot').forEach((d,i)=>d.classList.toggle('answered',S.ans[i]!==null));}
function scrollToQ(i){if(i<0||i>=EI.totalQ)return;S.cur=i;document.getElementById('qc-'+i).scrollIntoView({behavior:'smooth',block:'center'});}
function sel(qi,ci){document.querySelectorAll('.choice-btn[data-q="'+qi+'"]').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice-btn[data-q="'+qi+'"][data-c="'+ci+'"]').classList.add('selected');S.ans[qi]=ci;upDots();}
function sw(qi){S.ans[qi]=document.getElementById('w-'+qi).value.trim()||null;upDots();}
function startTimer(){const el=document.getElementById('timer');S.ti=setInterval(()=>{S.left--;const m=Math.floor(S.left/60),s=S.left%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warn',S.left<=300&&S.left>60);el.classList.toggle('danger',S.left<=60);if(S.left<=0){clearInterval(S.ti);submitExam();}},1000);}
function submitExam(){if(!confirm('제출하시겠습니까?'))return;clearInterval(S.ti);const elapsed=Math.floor((Date.now()-S.start)/1000);const r=grade();saveToHistory(r,elapsed);renderResults(r,elapsed);showScreen('resultScreen');}
function grade(){let score=0,correct=0,wrong=0,unanswered=0;const details=[];Q.forEach((q,i)=>{const a=S.ans[i];let ok=false;if(a===null)unanswered++;else if(q.fmt==='mc')ok=a===q.ans;else{const u=String(a).trim().toLowerCase();if(q.accept)ok=q.accept.some(x=>u===x.toLowerCase());if(!ok&&q.wa)ok=u===q.wa.toLowerCase();}if(a!==null){if(ok){correct++;score+=q.pts;}else wrong++;}details.push({q,ans:a,ok});});return{score,correct,wrong,unanswered,details};}

function renderResults(r,elapsed){const pass=r.score>=80,nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100);const typeMap={};r.details.forEach(d=>{const t=d.q.type;if(!typeMap[t])typeMap[t]={total:0,ok:0};typeMap[t].total++;if(d.ok)typeMap[t].ok++;});const perfectTypes=Object.entries(typeMap).filter(([,v])=>v.ok===v.total).map(([k])=>k);const weakTypes=Object.entries(typeMap).filter(([,v])=>v.ok<v.total).map(([k])=>k);let h='';
h+=`<div class="r-hero ${pass?'pass':'fail'}"><div class="r-badge ${pass?'pass':'fail'}">${pass?'🎉 통과!':'📚 미통과'}</div><div class="r-score">${r.score}<sup>/${EI.total}</sup></div><div class="r-stats"><span class="stat-item">✅ 정답 <strong>${r.correct}</strong></span><span class="stat-item">❌ 오답 <strong>${r.wrong}</strong></span><span class="stat-item">⬜ 미응답 <strong>${r.unanswered}</strong></span><span class="stat-item">⏱️ <strong>${fmtTime(elapsed)}</strong></span></div></div><div class="rc">`;
h+=`<div class="rs"><div class="rs-title">📋 기본 정보</div><div class="info-grid"><div class="info-cell"><div class="ic-label">이름</div><div class="ic-value">${nm}</div></div><div class="info-cell"><div class="ic-label">학교 / 학년</div><div class="ic-value">${sc||'미입력'} · ${gr}</div></div><div class="info-cell"><div class="ic-label">시험 범위</div><div class="ic-value">${EI.subject} · ${EI.pub}</div></div><div class="info-cell"><div class="ic-label">응시일</div><div class="ic-value">${new Date().toLocaleDateString('ko-KR')}</div></div><div class="info-cell highlight"><div class="ic-label">점수</div><div class="ic-value">${r.score}점 / ${EI.total}점 (${pct}%)</div></div><div class="info-cell highlight"><div class="ic-label">소요시간 / 통과</div><div class="ic-value">${fmtTime(elapsed)} / <span style="color:${pass?'var(--o)':'var(--r)'}">${pass?'통과 ✅':'미통과 ❌'}</span></div></div></div></div>`;
h+=`<div class="rs"><div class="rs-title">🏅 레벨</div><div class="level-card"><div class="level-icon">${lv.icon}</div><div class="level-name">${lv.name}</div><div class="level-range">${lv.range}점 구간</div><div class="level-bar"><div class="level-bar-fill" style="width:${pct}%"></div></div><div class="level-msg">${lv.msg}</div></div></div>`;
h+=`<div class="rs"><div class="rs-title">📊 유형별 분석</div>`;Object.entries(typeMap).forEach(([type,d])=>{const p=Math.round(d.ok/d.total*100);const c=p>=80?'var(--o)':p>=50?'var(--warn)':'var(--r)';h+=`<div class="type-row"><span class="type-label">${type}</span><div class="type-track"><div class="type-fill" style="width:${p}%;background:${c}"></div></div><span class="type-pct" style="color:${c}">${p}%</span></div>`;});
if(perfectTypes.length)h+=`<div style="margin-top:14px"><div style="font-size:13px;font-weight:700;color:var(--o);margin-bottom:6px">🌟 만점 유형</div><div class="tag-list">${perfectTypes.map(t=>`<span class="tag-item good">${t}</span>`).join('')}</div></div>`;if(weakTypes.length)h+=`<div style="margin-top:10px"><div style="font-size:13px;font-weight:700;color:var(--r);margin-bottom:6px">⚠️ 보완 필요</div><div class="tag-list">${weakTypes.map(t=>`<span class="tag-item weak">${t}</span>`).join('')}</div></div>`;h+=`</div>`;
h+=`<div class="rs"><div class="rs-title">📝 학습 플랜</div><div class="plan-card">`;if(pct>=95)h+=`<div class="plan-icon">🏅</div><div class="plan-text"><h4>완벽!</h4><p>다른 문항도 도전하세요.</p></div>`;else if(pct>=80)h+=`<div class="plan-icon">📈</div><div class="plan-text"><h4>통과! 더 올릴 수 있어요</h4><p>틀린 유형 집중 복습으로 만점까지!</p></div>`;else if(pct>=60)h+=`<div class="plan-icon">💪</div><div class="plan-text"><h4>조금만 더!</h4><p>오답 해설을 꼼꼼히 확인하세요.</p></div>`;else h+=`<div class="plan-icon">📖</div><div class="plan-text"><h4>기본기부터!</h4><p>지문 해석을 완벽히 이해한 뒤 재도전!</p></div>`;h+=`</div></div>`;
h+=`<div class="rs"><div class="rs-title">🚀 액션</div><div class="action-grid"><button class="act-btn" onclick="copyResult()"><span class="act-icon">📋</span><span class="act-label">결과 공유하기</span></button><button class="act-btn" onclick="retake()"><span class="act-icon">🔄</span><span class="act-label">재시험</span></button><button class="act-btn primary" onclick="goHome()"><span class="act-icon">🏠</span><span class="act-label">홈으로</span></button></div></div>`;
h+=`<div class="rs"><div class="rs-title">📝 정답과 해설 <span style="font-size:12px;color:var(--tl);margin-left:8px">클릭하여 펼치기</span></div>`;r.details.forEach((d,i)=>{const icon=d.ok?'✅':(d.ans===null?'⬜':'❌');const markers=d.q.ch&&d.q.ch.length===5?'①②③④⑤':d.q.ch&&d.q.ch.length===4?'①②③④':d.q.ch&&d.q.ch.length===3?'①②③':'①②';const ua=d.q.fmt==='mc'?(d.ans!==null?markers[d.ans]:'미응답'):(d.ans||'미응답');const ca=d.q.fmt==='mc'?markers[d.q.ans]:d.q.wa;const open=!d.ok;const det=d.q.det||{};h+=`<div class="rev-card"><div class="rev-header" onclick="this.nextElementSibling.classList.toggle('open');this.querySelector('.rev-icon').style.transform=this.nextElementSibling.classList.contains('open')?'rotate(180deg)':''"><span style="font-weight:800">${icon} ${d.q.id}번</span><span style="font-size:12px;color:var(--tm)">[${d.q.type}] ${d.q.pts}점</span><span class="rev-icon">▼</span></div><div class="rev-body${open?' open':''}"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;${d.ok?'background:var(--oxl);color:var(--o)':'background:var(--rl);color:var(--r)'}"><div style="font-size:11px;opacity:.7">내 답</div>${ua}</div><div style="flex:1;padding:10px;border-radius:var(--rxs);text-align:center;font-weight:700;background:var(--oxl);color:var(--o)"><div style="font-size:11px;opacity:.7">정답</div>${ca}</div></div>${det.korean?`<div class="expl-tag ans">🇰🇷 해석</div><div class="expl-box ans-b">${det.korean}</div>`:''}${det.analysis?`<div class="expl-tag tip">📋 분석</div><div class="expl-box">${det.analysis}</div>`:''}${det.tip?`<div class="expl-tag tip">💡 팁</div><div class="expl-box tip-b">${det.tip}</div>`:''}</div></div>`;});h+=`</div></div>`;document.getElementById('resultScreen').innerHTML=h;}

function copyResult(){const r=grade(),lv=getLevel(r.score),pct=Math.round(r.score/EI.total*100),nm=document.getElementById('inpName').value.trim(),sc=document.getElementById('inpSchool').value.trim(),gr=document.getElementById('inpGrade').value,elapsed=Math.floor((Date.now()-S.start)/1000),pass=r.score>=80;
let txt=`📝 온라인퀴즈 TEST 결과\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📚 ${EI.subject} · ${EI.pub}\n👤 ${nm}${sc?' · '+sc:''} · ${gr}\n📅 ${new Date().toLocaleDateString('ko-KR')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🏆 점수: ${r.score} / ${EI.total}점 (${pct}%)\n${lv.icon} 레벨: ${lv.name}\n${pass?'🎉 통과!':'📚 미통과'}\n\n✅ 정답 ${r.correct}개  ❌ 오답 ${r.wrong}개  ⬜ 미응답 ${r.unanswered}개\n⏱️ 소요시간: ${fmtTime(elapsed)}\n`;
navigator.clipboard.writeText(txt).then(()=>toast('📋 결과가 복사되었습니다!')).catch(()=>{toast('복사 실패');});}
function retake(){startExam();}
function goHome(){showScreen('startScreen');updateHCount();}
window.addEventListener('beforeunload',e=>{if(S.ti){e.preventDefault();e.returnValue='';}});
</script>
</body>
</html>
